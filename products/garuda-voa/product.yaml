# GARUDA VOA — product.yaml
# The first product on the assembly line (docs/factory/ASSEMBLY-LINE.md).
# Orchestrator drafts; OWNER SIGNS at G0. Until `owner_signed_at` carries a real
# timestamp, every downstream gate treats this file as a PROPOSAL, not authority.
#
# Mandate: docs/plans/2026-08-24-garuda-voa-live/MANDATE.md
# Binding persistence design: research/visa/2026-08-23-voa-public-funnel-persistence-design.md

schema_version: 1
product: garuda-voa
title: "VOA self-purchase (Visa on Arrival)"
status: build-dark # build-dark | canary | live | narrowed | killed
owner_signed_at: null # G0 signature — null means UNSIGNED
flag: GARUDA_PUBLIC_ENABLED # default false everywhere

customer:
  who: "Tourist / short-stay traveler to Indonesia"
  context: "Mobile-first, English-speaking, buying before or shortly after arrival"
  problem: >
    Today the only way to buy a VOA through Bali Zero is a WhatsApp conversation with
    a human. The traveler cannot find out in advance whether they are eligible, what it
    costs all-in, or when the filing deadline falls; and once they have paid there is no
    place to watch the practice move.

promise: "Know in 10 seconds, buy in 5 minutes, follow it like a parcel."

price:
  model: single-all-inclusive
  source: PricingTool
  # CORRECTED 2026-08-24 by the orchestrator, against the mandate's own seed text.
  # The mandate seeded `PNBP + 3jt`. That formula is NOT the VOA price and must not be
  # applied here: `services/garuda_flow/pricing.py` resolves TWO exact catalogue keys and
  # fails closed on any mismatch. Applying PNBP+3jt would quote ~3.5jt against a real
  # catalogue price of 790k: a 4.4x overcharge on a live funnel.
  #
  # SELF-CORRECTION, same day, same file. An earlier version of this comment added
  # "and those rows are all-inclusive (PNBP included) — test-owned at
  # apps/mouth/e2e/book-pricing.spec.ts:126". Re-measured: that test is named "public
  # visa service cards expose only exact all-inclusive PricingTool rows" and owns
  # "show the catalogue row, unsplit" — it says nothing about what the amount contains.
  # And the catalogue itself is silent: the VOA row is
  # {key, name, category, validity, price: "790.000 IDR", notes: None}, and the string
  # "PNBP" appears ZERO times in the whole prices file and zero times in pricing.py or
  # garuda_flow. So "PNBP is inside the 790k" was an INFERENCE wearing a citation.
  # It may well be true — but whether the customer still pays a government fee at the
  # airport on top of what we charge is a client-facing money promise, and it now sits
  # in owner_decisions id 7 as a question instead of in a comment as a fact.
  rule: >
    The price is whatever PricingTool returns for the case's exact catalogue key.
    It is never computed, never a formula, and never a literal in code.
  keys:
    issuance: "B1 Visa on Arrival (VOA)" # 790.000 IDR as of 2026-08-24
    extension: "B1 Visa on Arrival Extension" # 850.000 IDR as of 2026-08-24
  resolver: apps/backend-rag/backend/services/garuda_flow/pricing.py::price_for_case
  fail_closed: >
    A missing, malformed or key-mismatched row yields no price. The funnel must then decline
    to sell and route to WhatsApp — it must never fall back to a remembered or computed number.
  never:
    - "split fee from PNBP in any customer-facing surface"
    - "quote a fee 'plus government cost'"
    - "derive the price from a formula (PNBP + margin) instead of the catalogue key"

metrics:
  primary:
    name: paid_orders_per_week
    definition: "count of orders whose payment was marked paid by a reconciled webhook, per ISO week"
  secondary:
    - name: check_to_purchase_conversion
      definition: "orders_created / eligibility_checks_completed"
    - name: decline_to_whatsapp_conversion
      definition: "whatsapp_handoffs_from_decline / declined_verdicts"
    - name: second_service_within_12m
      definition: "share of VOA buyers who purchase any other Bali Zero service within 12 months"

guardrails: # exactly 3 — ASSEMBLY-LINE caps this at 3
  - id: G-OCR-LOCAL
    rule: >
      Document OCR runs LOCAL-first (qwen2.5vl:7b primary, for speed and cost). Cloud
      families may reinforce, never replace, and only after redaction-before-egress.
      Vendor parity per Zero 2026-08-24: no vendor-specific fence, the common Law 2
      output boundary + UU PDP Art. 56 cascade applies to every cloud alike.
  - id: G-FRESHNESS-FAIL-CLOSED
    rule: >
      Commercial freshness is fail-closed. If the government rules or the price truth-sheet
      are stale beyond their declared window, the funnel DECLINES TO SELL and routes to
      WhatsApp rather than promising a price or deadline it cannot stand behind.
  - id: G-PAID-BY-WEBHOOK-ONLY
    rule: >
      An order becomes `paid` ONLY through a reconciled provider webhook (signature verified,
      inbox-deduplicated, journal-appended). A browser redirect NEVER marks payment.

kill_criterion:
  proposed_by: orchestrator # owner may replace at G0
  rule: >
    If 60 days after go-live paid orders are below 10/week AND decline→WhatsApp conversion
    is below 5%, narrow the product to the WhatsApp-assisted lane only.
  checked: monthly

non_goals_v1:
  - other visa types
  - multi-applicant carts
  - native mobile apps
  - loyalty / referral programs

risk_tier_map: # ASSEMBLY-LINE verification economics: set once, here
  full_adversarial_pass: # always the complete refuter pass
    - "products/garuda-voa/contracts/**"
    - "apps/backend-rag/backend/db/migrations_v2/**"
    - "**/garuda*/**payment**"
    - "**/garuda*/**order**"
    - "**/garuda*/**retention**"
    - "**/garuda*/**auth**"
    - "apps/backend-rag/backend/services/garuda_flow/**"
  contract_tests_and_visual_diff_only:
    - "apps/mouth/src/app/visa/voa/**" # cosmetic UI layer only
    - "products/garuda-voa/ops/dashboards/**"

owner_decisions: # §3 switchboard — filled with prepared proposals, signed at the end
  - id: 1
    decision: payment_provider
    state: ratified
    packet: products/garuda-voa/ops/decision-packets/01-payment-provider.md
    # RATIFIED 2026-08-25: Xendit. International card 3.5% + Rp6k, VA Rp13k, no monthly
    # fee, payment links included. Same provenance caveat as decision 5: this reached the
    # orchestrator by RELAY, not from Zero in-session. Enough to build dark and reversible;
    # not enough to skip the signature. Confirm directly at go-live.
    ratified: Xendit
    # Zero attached a TIERED routing rule. Only tier (a) is in scope for THIS product, and
    # that scoping is load-bearing — without it a lane builds the whole Bali Zero payment
    # strategy into a VOA funnel that has no ticket above Rp 850k:
    #   (a) small tickets (<= ~Rp 3jt) -> card in checkout, fee ABSORBED into the one
    #       all-inclusive price, never a separate line. GARUDA VOA is entirely this tier
    #       (issuance 790k, extension 850k). BUILD THIS.
    #   (b) heavy T2 tickets (10-30jt) -> contained card deposit in checkout, balance by
    #       international transfer/Wise in the consultant thread. NO SUCH TICKET EXISTS in
    #       this product. Recorded for the sibling products; do NOT build it here.
    #   (c) VA for customers holding an Indonesian account. Out of scope for a funnel whose
    #       buyer is by definition a foreign tourist who has not yet entered the country.
    fee_config_is_a_parameter: >
      Zero's note: the card fee is negotiable at volume, so L3 wires it as configuration,
      never a constant.
    # MEASURED CONSEQUENCE, recorded because Zero is deciding fees while 7(b) is open:
    # 3.5% + Rp6k on the 790k issuance is ~33.650 IDR, i.e. ~4.3% of the ticket, and it is
    # ABSORBED. Whether that is affordable depends on a number nobody has yet confirmed —
    # question 7(b) asks whether the 790k catalogue row is inclusive of PNBP. If it is not,
    # the absorbed payment fee stacks on top of an unbudgeted government fee. This does not
    # block L3 (the port is provider-neutral and the fee is configuration), but the margin
    # answer is not knowable until 7(b) is.
    depends_on_for_margin_only: 7
    gesture: "sign up with his own credentials — the choice is made, the account is not"
  - id: 2
    decision: terms_of_sale_and_refund
    state: proposal-ready
    packet: products/garuda-voa/ops/decision-packets/02-terms-and-refunds.md
    # The packet existed since 21:57 and nobody could have found it: it was written into an
    # abandoned worktree and never committed, so the switchboard read "proposal-pending" while
    # the proposal sat finished on disk. Adopted here with one correction — see 7(b).
    depends_on: 7
    gesture: "read, approve — but 7(b) changes several rows, so answer that first"
  - id: 3
    decision: data_retention_days
    state: proposal-ready
    proposed_value_days: 90
    packet: products/garuda-voa/ops/decision-packets/03-data-retention.md
    gesture: "approve or change the number"
  - id: 4
    decision: legacy_garuda_voa_checks_rows
    state: measured-proposal-ready
    # Measured against production 2026-08-24, counts and dates only (no row contents):
    # 25 rows, all between 2026-07-27T00:21Z and 2026-07-28T01:26Z, 14 ACCEPT / 11 DECLINE.
    # Pilot traffic from the build day; nothing written since the 2026-08-21 withdrawal.
    measured_rows: 25
    measured_window: "2026-07-27 .. 2026-07-28"
    proposal: "purge all 25 as the first act of the signed retention policy; keep the monthly count"
    gesture: "yes/no on the proposed disposition"
  - id: 5
    decision: visual_identity
    state: ratified
    # RATIFIED 2026-08-25: Concept A "The Stamp", with two BINDING copy constraints.
    # PROVENANCE, stated plainly because it changes nothing now and matters at signature
    # time: this reached the orchestrator by RELAY from a peer session reporting Zero's
    # ruling, not from Zero in this session's own transcript. That is enough to build on —
    # the work is dark behind the flag and reversible — and NOT enough to skip the
    # confirmation. Decision 5 must still be confirmed directly with Zero in the go-live
    # signature block, alongside every other decision here.
    ratified: Concept A — "The Stamp"
    binding_copy_constraints:
      - id: 5a
        rule: "The public funnel is ENGLISH. All of it."
        # Costs nothing to honour: the public API emits reason CODES, never prose
        # (reason-codes.yaml x-public-notes keeps them neutral categories on purpose), so
        # this lands entirely on the presentation layer. Verified 2026-08-25 — no Italian
        # string exists in garuda_voa_public.py or eligibility.py.
      - id: 5b
        rule: >
          A DECLINE is positively educational, never rejecting. Mirror what the customer
          themselves declared, then name what the VOA does not permit, then the
          alternative, then the consultant's open hand. Never "the VOA is not for you".
        example: >
          "You told us you're coming to work — the VOA doesn't allow any work activity.
          Here's what does…"
        # Two consequences a lane will get wrong if they are not written down:
        # (1) The mirroring uses the customer's OWN answers, held client-side. Do NOT ask
        #     the backend to echo them back: the anonymous check carries no PII BY DESIGN
        #     (migration 261's header argues the ABSENCE of PII is what lets the route be
        #     public), and reason codes are deliberately coarse so they disclose no
        #     internal decision prose. The educational copy is a UI mapping keyed on what
        #     the customer typed, not a new field on the wire.
        # (2) "Here's what does…" ROUTES to the Visa Oracle and to WhatsApp. GARUDA does
        #     not own the decline -> alternative-visa mapping; that is the Oracle's
        #     38-product question, and a second table here would be a duplicate authority
        #     on a client-facing recommendation.
    gesture: "confirm at signature time — the concept is picked, the relay is not the signature"
  - id: 6
    decision: filing_office_scope
    state: question-ready
    # Measured 2026-08-24 (GROUND.md §5): the one client-facing checkpoint is scoped to
    # Ngurah Rai in constants.py:55 and safe_clock.py:151 ("verify per office"), and the
    # intake collects no office field at all — grep for office|kanim in intake.py is empty.
    question: >
      Does a buyer who goes through this funnel ALWAYS have their extension filed at
      Ngurah Rai / Denpasar, or can the filing office vary?
    consequence: >
      If it can vary, the published deadline we show is unsourced for those buyers.
      Default until answered: display a deadline only when the office is known.
    gesture: "answer the question — it is an operations fact, not a design choice"
  - id: 7
    decision: price_catalogue_currency
    state: measured-question-ready
    # Measured 2026-08-24 by importing the loader, not by reading the file:
    #   backend/data/bali_zero_official_prices_2026.json  metadata.last_updated = 2026-05-06
    #   garuda_today() = 2026-08-24  ->  age 110 days,  Q9 price window = 90 days  ->  STALE
    #   price_for_case(issuance)  = (790000, "B1 Visa on Arrival (VOA)")
    #   price_for_case(extension) = (850000, "B1 Visa on Arrival Extension")
    # These are the exact amounts the funnel would charge, from a file last touched in May.
    measured_catalogue_age_days: 111
    # RE-MEASURED 2026-08-25 by importing the loader: age 111d vs window 90d, verdict STALE,
    # and price_for_case(ISSUANCE) now returns (None, None). This is no longer a forecast.
    # The guardrail is LIVE on the branch, so the funnel would answer 503 PRICE_UNRESOLVABLE
    # to every real customer today. That makes this decision the top go-live blocker: no
    # other lane's work can sell anything until it is answered.
    blocks_go_live: true
    # THE FORBIDDEN CURE, named explicitly because a competent lane proposed it on
    # 2026-08-25 (L7, in good faith, reading the line below): "refresh the catalogue's
    # metadata.last_updated stamp". Bumping the stamp WITHOUT re-verifying the prices is
    # the same cheat as widening the window, wearing a different costume — it makes the
    # guard green while nobody has looked at whether 790.000 is still the right number.
    # That a careful reader independently proposed it is evidence the prohibition was not
    # written where it gets read, not a fault of theirs: the "honest exits" sentence below
    # says "re-verify AND re-stamp", and a skim lifts the second half out of the pair.
    # The stamp is a CLAIM that a human looked. It is never the act of looking.
    question: >
      Two things, and the second is the one nobody has answered. (a) Are 790.000 and
      850.000 IDR still the correct prices today? The catalogue that supplies them has
      not been touched in 110 days, and Q9's own freshness window is 90. (b) Does that
      amount INCLUDE the PNBP the traveller would otherwise pay the government, or is it
      our fee on top of it? Measured 2026-08-24: "PNBP" appears zero times in the prices
      file, zero times in pricing.py, zero times in garuda_flow; the catalogue row carries
      no note. Nothing on disk answers (b), and this product's whole promise is ONE
      all-inclusive price.
    consequence: >
      The freshness guardrail now being built will, correctly, refuse to sell on the day it
      ships — the catalogue is already past its window. There are only two honest exits:
      re-verify the prices and THEN re-stamp (in that order, and the stamp is worthless
      without the first half), or rule that 90 days is the wrong window for a list Bali Zero
      republishes on its own schedule. Two moves are NOT available, and they are the same
      move: quietly widening the window, and bumping metadata.last_updated on prices nobody
      re-checked. Either one turns the guardrail back into the sentence it has been all
      along — green, and meaning nothing.
    gesture: "confirm the two amounts, or re-stamp the catalogue, or rule on the window"
  - id: 8
    decision: ocr_calibration_corpus
    state: question-ready
    # RAISED 2026-08-25 by the orchestrator after L5 shipped. This is NOT "pick a
    # number" — it is the only question that unblocks measuring one.
    #
    # DECISIONS.md Q7 says the OCR confidence cut must be MEASURED against genuine
    # passport photographs (good, dim, glare, angle, partial crop) and set where the
    # false-confident rate goes to zero, because "the expensive error is not 'we asked
    # again', it is 'we filed a wrong passport number'". L5's mandate is synthetic-only
    # under the PII boundary, so L5 correctly REFUSED to source that corpus and said so
    # rather than quietly calibrating on fabricated specimens.
    #
    # The two rules therefore collide, and the collision resolves in Zero's hands, not a
    # lane's. Right now `CONFIDENCE_THRESHOLD = 0.80` in
    # services/garuda_documents/confidence.py is a threshold picked by argument — which
    # is precisely what Q7 forbids. It is a single named constant on purpose.
    #
    # Mitigating, and the reason this is not a go-live blocker on its own: the cut only
    # decides whether we ask the customer to retake or pre-fill the field for their
    # review. A human still confirms every field before submission, and no numeric
    # confidence ever reaches the customer (Q7's frozen shape). What an uncalibrated cut
    # buys us is friction if too high, and a pre-filled wrong value a tired customer may
    # accept if too low.
    question: >
      On what corpus may we calibrate the OCR confidence threshold? Concretely: is there
      a lawful basis and a controlled local environment for using real client passport
      images already held, or should we build the corpus from consenting staff/personal
      documents instead?
    consequence: >
      Until answered, 0.80 stands as an explicitly unmeasured default and Q7 stays open.
      The number cannot be honestly calibrated on synthetic specimens.
    gesture: "answer where the corpus comes from — the measurement follows from it"
  - id: 0
    decision: go_live
    state: blocked-on-all-above-and-on-the-parent-page
    # Consumer-map item, measured live 2026-08-24 (curl, four surfaces):
    #   /visa        200  index, follow     "24 visa types. One fits you. We know which."
    #                                       "Answer 4 short questions ... and show the cost."
    #   /visa/match  200  index, follow
    #   /visa-oracle 200  noindex, nofollow  <- the surface with the SIGNED rule pack
    #   /visa/voa    404  (our tombstone, correct)
    # "Merged is not live" runs the other way too: a surface we never touch can still promise
    # on our behalf. /visa/voa is correctly noindex, but its INDEXED parent offers a cost in
    # four questions for a product we intend to sell through our own funnel — so go-live would
    # put a public page in competition with the sale it points at.
    # The price on that page is NOT fabricated (verified: visa_oracle.py:751-754 sources it
    # from PricingTool and degrades to "contact for pricing"). The defect is the CLAIMS —
    # 24 against a 38-product catalogue, "we know which" against nine contractual abstentions.
    # Owned by the Visa Oracle orchestrator on Pro, who is taking it to Zero as a Legge 5
    # call. This entry closes by itself if that lands; it is recorded here so go-live cannot
    # be declared while it is open.
    gesture: "flip GARUDA_PUBLIC_ENABLED=true + merge the prepared sitemap/robots PR"
