      - <<: *errorResponseBase
        title: RATE_LIMITED
        x-http-status: 429
        properties:
          code: { const: RATE_LIMITED }
          retryable: { const: true }
          message_key: { const: garuda_voa.error.rate_limited }
      - <<: *errorResponseBase
        title: SESSION_REQUIRED
