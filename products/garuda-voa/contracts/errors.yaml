        properties:
          code: { const: NOTICE_ACKNOWLEDGEMENT_REQUIRED }
          retryable: { const: false }
          message_key:
            { const: garuda_voa.error.notice_acknowledgement_required }
      - <<: *errorResponseBase
        title: RESULT_NOT_FOUND
        x-http-status: 404
        properties:
          code: { const: RESULT_NOT_FOUND }
          retryable: { const: false }
          message_key: { const: garuda_voa.error.result_not_found }
      - <<: *errorResponseBase
        title: MAGIC_LINK_INVALID
