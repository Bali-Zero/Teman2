          code: { const: PRICE_UNRESOLVABLE }
          retryable: { const: false }
          message_key: { const: garuda_voa.error.sale_unavailable }
      - <<: *errorResponseBase
        title: NOTICE_ACKNOWLEDGEMENT_REQUIRED
