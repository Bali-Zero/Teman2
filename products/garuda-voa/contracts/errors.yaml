# Stable error catalog. Customer copy is resolved from message_key outside this contract.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: GARUDA VOA API errors
version: "1.0.0"

x-error-response-base: &errorResponseBase
  type: object
  additionalProperties: false
  required: [code, retryable, message_key]

$defs:
  ErrorResponse:
    description: >-
      A closed catalog tuple. No rendered customer message, submitted value, identifier, or
      personal data is returned.
    oneOf:
      - <<: *errorResponseBase
        title: GARUDA_PUBLIC_DISABLED
        x-http-status: 404
        properties:
          code: { const: GARUDA_PUBLIC_DISABLED }
          retryable: { const: false }
          message_key: { const: garuda_voa.error.unavailable }
      - <<: *errorResponseBase
        title: INVALID_REQUEST
        x-http-status: 422
        properties:
          code: { const: INVALID_REQUEST }
          retryable: { const: false }
          message_key: { const: garuda_voa.error.invalid_request }
      - <<: *errorResponseBase
        title: IDEMPOTENCY_KEY_REQUIRED
        x-http-status: 400
        properties:
          code: { const: IDEMPOTENCY_KEY_REQUIRED }
          retryable: { const: false }
          message_key: { const: garuda_voa.error.idempotency_key_required }
      - <<: *errorResponseBase
        title: IDEMPOTENCY_CONFLICT
        x-http-status: 409
        properties:
          code: { const: IDEMPOTENCY_CONFLICT }
          retryable: { const: false }
          message_key: { const: garuda_voa.error.idempotency_conflict }
      - <<: *errorResponseBase
        title: PERSISTENCE_POLICY_UNAVAILABLE
        x-http-status: 503
        properties:
          code: { const: PERSISTENCE_POLICY_UNAVAILABLE }
          retryable: { const: false }
          message_key: { const: garuda_voa.error.sale_unavailable }
      - <<: *errorResponseBase
        title: PRICE_UNRESOLVABLE
        x-http-status: 503
