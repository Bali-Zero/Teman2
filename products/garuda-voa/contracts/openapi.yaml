          x-error-codes: [SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/staff/orders/{order_id}/late-resolution:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: resolveLateOrder
      tags: [Staff practice]
      summary: Close one late-payment remediation case, honouring or refunding
      description: >-
        The only way to close a remediation case opened by `payment.late_paid_after_terminal`
        (STATE-MACHINE.md OP-F05, grounded in DECISIONS.md Q10). Q2 permits staff exactly two
        outcomes and forbids a third: honour the order and deliver late, or refund in full.
        Never neither — an open case is money the customer paid and we have not answered for,
        so the absence of this call is itself the alarm, not a quiet default. The terminal order
        state is kept; this records the compensation beside it and emits `order.late_resolved`.
        Exact replay returns the committed resolution without a second refund or a second practice.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - StaffSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LateOrderResolutionRequest"
      responses:
        "200":
          description: Resolution committed or exact command replayed.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LateOrderResolutionView"
        "400":
          description: Idempotency-Key absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "401":
          description: Staff session required. Code is SESSION_REQUIRED.
          x-error-codes: [SESSION_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "403":
          description: Staff actor lacks remediation authority. Code is ACCESS_DENIED.
          x-error-codes: [ACCESS_DENIED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled, or no order with an open late-payment case.
          x-error-codes: [GARUDA_PUBLIC_DISABLED, ORDER_NOT_FOUND]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: >-
            Idempotency conflict, or there is no open late-payment remediation case on this order —
            a resolution must never be invented for an order that never took late money.
          x-error-codes: [IDEMPOTENCY_CONFLICT, INVALID_STATE_TRANSITION]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Invalid closed request. Code is INVALID_REQUEST.
          x-error-codes: [INVALID_REQUEST]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: >-
            Journal, outbox, storage, or the payment provider is unavailable. A refund that cannot
            be placed must fail loudly rather than record a resolution that did not happen.
          x-error-codes: [SERVICE_UNAVAILABLE, PAYMENT_PROVIDER_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

components:
  securitySchemes:
    ResultSession:
      type: apiKey
      in: cookie
      name: garuda_result_session
      description: >-
        Creator-bound pre-account authorization secret. It is separate from result_id; the opaque
        result identifier is never accepted as authentication.
    MagicSession:
      type: apiKey
      in: cookie
      name: garuda_session
      description: Creator-bound authenticated account session established by one magic-link exchange.
    ProviderSignature:
      type: apiKey
      in: header
      name: x-callback-token
      description: >-
        Bound to Xendit 2026-08-25, when owner decision 1 ratified the provider. Xendit Invoices
        callbacks are authenticated by a STATIC verification token in `x-callback-token`,
        compared constant-time against our stored token — there is no body HMAC and no signed
        digest, so nothing here may be described as a signature over the payload. The raw body
        still matters and is still never logged: it is hashed into `canonical_payload_sha256`
        for inbox dedup, not for authenticity.


        The name of this scheme is a legacy of the placeholder it replaced; it is the provider's
        authenticity header, whatever shape that header takes.
    StaffSession:
      type: http
      scheme: bearer
      bearerFormat: staff-session
      description: Existing authorized staff session; customer sessions are never accepted.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Scoped to actor and operation. An exact canonical-payload replay returns the previously
        committed status and body without repeating effects; the same key with another payload
        returns IDEMPOTENCY_CONFLICT. Raw keys never enter logs, metrics labels, or journal prose.
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: "^[A-Za-z0-9._~-]+$"
    ResultId:
      name: result_id
      in: path
      required: true
      description: >-
        URL-safe opaque identifier generated from at least 128 effective bits of CSPRNG entropy.
        It is non-sequential and is not derived from the payload. It is an identifier, never a
        credential; a separate creator-bound session is required for access.
      schema:
        $ref: "#/components/schemas/ResultId"
    OrderId:
      name: order_id
      in: path
      required: true
      description: Opaque order identifier; never personal data or an authorization credential.
      schema:
        $ref: "#/components/schemas/OpaqueId"
    PracticeId:
      name: practice_id
      in: path
      required: true
      description: Opaque practice identifier; never personal data or an authorization credential.
      schema:
        $ref: "#/components/schemas/OpaqueId"

  schemas:
    ResultId:
      type: string
      format: garuda-result-id
      minLength: 22
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]{22,128}$"
      description: >-
        Base64url-safe output generated from at least 16 CSPRNG bytes, with at least 128 effective
        random bits; non-sequential and not payload-derived. It is an identifier, never a credential.

    OpaqueId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"

    CaseType:
      type: string
      enum: [issuance, extension]
      x-source: "apps/backend-rag/backend/services/garuda_flow/intake.py:CaseType"

    Purpose:
      type: string
      enum: [tourism, family, transit, business-meeting]
      x-source: "apps/backend-rag/backend/services/garuda_flow/intake.py:Purpose"

    EligibilityCheckRequest:
      type: object
      additionalProperties: false
      required:
        - case_type
        - nationality
        - entry_date
        - passport_expiry_date
        - purpose
        - travellers
        - self_pay
        - extension_already_used
        - retention_notice_acknowledged
      properties:
        case_type:
          $ref: "#/components/schemas/CaseType"
        nationality:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 3166-1 alpha-3 code; no nationality list is embedded in this contract.
        entry_date:
          type: string
          format: date
          x-civil-timezone: Asia/Makassar
          description: >-
            A civil calendar day in Asia/Makassar, never a UTC instant. The backend runs on
            Fly.io in UTC, and reading these as UTC days moves the ACCEPT/DECLINE cutoff and
            the published deadline by a full day for the first eight hours of every Bali day
            — the defect `civil_clock.py::garuda_today` exists to prevent. A client that
            derives this from a local `Date` in another zone reintroduces it here.
        passport_expiry_date:
          type: string
          format: date
          x-civil-timezone: Asia/Makassar
          description: A civil calendar day in Asia/Makassar. See `entry_date`.
        voa_expiry_date:
          type: string
          format: date
          x-civil-timezone: Asia/Makassar
          description: >-
            Required only for extension; forbidden for issuance. A civil calendar day in
            Asia/Makassar. See `entry_date`.
        purpose:
          $ref: "#/components/schemas/Purpose"
        travellers:
          type: integer
          minimum: 1
        self_pay:
          type: boolean
        extension_already_used:
          type: boolean
        retention_notice_acknowledged:
          type: boolean
          description: Explicit acknowledgement; never inferred or preselected.
      allOf:
        - if:
            properties:
              case_type: { const: extension }
            required: [case_type]
          then:
            required: [voa_expiry_date]
          else:
            properties:
              voa_expiry_date: false
              extension_already_used: { const: false }

    EligibilityResult:
      oneOf:
        - $ref: "#/components/schemas/AcceptedEligibilityResult"
        - $ref: "#/components/schemas/DeclinedEligibilityResult"

    AcceptedEligibilityResult:
      type: object
      additionalProperties: false
      required: [verdict, reason_codes, published_filing_deadline, price_idr]
      properties:
        verdict: { const: ACCEPT }
        reason_codes:
          type: array
          maxItems: 0
          items:
            $ref: "./reason-codes.yaml#/$defs/DeclineCode"
        published_filing_deadline:
          type: string
          format: date
          x-civil-timezone: Asia/Makassar
          x-published-by-office: Ngurah Rai
          description: >-
            The only public Safe Clock date. A civil calendar day in Asia/Makassar, derived
            from `constants.py:PUBLISHED_FILING_DEADLINE_DAYS` via
            `civil_clock.py:GARUDA_CIVIL_TIMEZONE`. Naming the symbol is not the same as
            stating the day — a client cannot resolve a Python constant — so the zone is
            written here literally as well.

            SCOPED TO ONE OFFICE. This is the deadline Ngurah Rai publishes, and
            `safe_clock.py` attaches "verify per office" to this very checkpoint — yet the
            intake collects no office at all. It is the one externally sourced number we show
            a visitor whose correctness depends on a fact we never ask for (GROUND.md §5,
            owner decision 6). Until that decision lands, a surface may display this date only
            when the filing office is known to be Ngurah Rai; otherwise it suppresses the date
            and routes to WhatsApp.
        price_idr:
          type: integer
          minimum: 1
          description: >-
            The one all-inclusive integer IDR price from
            apps/backend-rag/backend/services/garuda_flow/pricing.py:price_for_case.

    DeclinedEligibilityResult:
      type: object
      additionalProperties: false
      required: [verdict, reason_codes]
      properties:
        verdict: { const: DECLINE }
        reason_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "./reason-codes.yaml#/$defs/DeclineCode"

    MagicLinkRequest:
      type: object
      additionalProperties: false
      required: [result_id, email]
      properties:
        result_id:
          $ref: "#/components/schemas/ResultId"
        email:
          type: string
          format: email
          maxLength: 320

    MagicLinkExchange:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 2048
          description: Single-use bearer secret supplied only in this request body; never logged.

    DocumentUploadRequest:
      type: object
      additionalProperties: false
      required: [document_kind, file]
      properties:
        document_kind:
          const: PASSPORT_BIODATA
        file:
          type: string
          format: binary

    PassportReviewFieldName:
      type: string
      enum: [full_name, passport_number, nationality, passport_expiry_date]
      description: >-
        Closed authenticated passport-review vocabulary. Arbitrary labels, including monetary
        component labels, are not representable.

    ReviewField:
      type: object
      additionalProperties: false
      required: [field_path, value, confirmation_required]
      properties:
        field_path:
          $ref: "#/components/schemas/PassportReviewFieldName"
        value:
          type: string
          maxLength: 512
          description: Authenticated customer review value; never returned by a public operation.
        confirmation_required:
          type: boolean

    UncertainReviewField:
      type: object
      additionalProperties: false
      required: [field_path, confirmation_required]
      properties:
        field_path:
          $ref: "#/components/schemas/PassportReviewFieldName"
        confirmation_required: { const: true }

    ReadyDocument:
      type: object
      additionalProperties: false
      required: [document_id, processing_state, review_fields]
      properties:
        document_id:
          $ref: "#/components/schemas/OpaqueId"
        processing_state: { const: READY_FOR_REVIEW }
        review_fields:
          type: array
          items:
            $ref: "#/components/schemas/ReviewField"

    ProcessingDocument:
      type: object
      additionalProperties: false
      required: [document_id, processing_state]
      properties:
        document_id:
