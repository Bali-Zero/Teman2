openapi: 3.1.0
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: GARUDA VOA API
  version: "1.0.0"
  description: >-
    Frozen wire contract. Every operation is disabled unless GARUDA_PUBLIC_ENABLED is true.
    Every mutation requires Idempotency-Key. An exact scoped key plus canonical-payload replay
    returns the originally committed status and body with Idempotency-Replayed true and causes no
    repeated effect; a different canonical payload under the same key returns
    IDEMPOTENCY_CONFLICT. Security credentials are never re-issued on replay. The sole monetary
    field is price_idr: one all-inclusive integer IDR value resolved by
    apps/backend-rag/backend/services/garuda_flow/pricing.py:price_for_case.

servers:
  - url: /
    description: Same-origin deployment; all operations remain behind GARUDA_PUBLIC_ENABLED.

tags:
  - name: Public eligibility
    description: Anonymous check creation, creator-bound result read, and self-deletion.
  - name: Magic-link authentication
    description: Creator-bound account link request and single-use exchange.
  - name: Customer intake
    description: Authenticated documents, order creation, and customer-safe state reads.
  - name: Payment provider
    description: Signed raw webhook ingress.
  - name: Staff practice
    description: Authorized PR-02 through PR-11 transitions.

x-feature-flag: GARUDA_PUBLIC_ENABLED

# The numbers DECISIONS.md decided, in a form a lane is BOUND by rather than one it has to
# remember. Q1 and Q9 were prose, and prose binds nobody: the money/date re-derivation found
# that an implementer could ship any magic-link TTL and stay contract-valid, and that the
# G-FRESHNESS-FAIL-CLOSED guardrail had no numbers to fail closed ON. That is the same
# "declared and does not exist" shape this product already got bitten by once.
x-magic-link:
  ttl_minutes: 15
  single_use: true
  # DECISIONS.md Q1. A consumed token and an expired token MUST return the identical
  # response: telling them apart is an oracle worth nothing to us and something to an
  # attacker holding a leaked link. Session lifetime is a SEPARATE number and is not this
  # one — conflating them is how a 15-minute link becomes a 15-minute portal.
x-truth-freshness-max-age-days:
  # DECISIONS.md Q9. Past the age the funnel declines to sell rather than quote. The wire
  # outcome differs by source and BOTH are load-bearing: a stale nationality list or rule
  # constant DECLINES the check with reason code ELIGIBILITY_UNCONFIRMED, while a stale price
  # catalogue is a 503 PRICE_UNRESOLVABLE — the customer is never told a price we cannot
  # stand behind, and never told "not eligible" when the truth is "we have not re-verified".
  # Engineering safety margins, revisable with a one-line diff and a test.
  nationality_eligibility: 90
  rule_constants: 180
  price_catalogue: 90
  # The operating calendar is deliberately absent: it is the one truth source that already
  # enforces its own bound (COVERAGE_START/COVERAGE_END), and it is the pattern the three
  # above copy rather than a fourth entry.
x-public-privacy-response-headers: &publicPrivacyHeaders
  Cache-Control:
    description: This representation must never be stored by a shared or private cache.
    schema: { type: string, const: "no-store, private" }
  Referrer-Policy:
    description: The opaque result path must never be sent as a referrer.
    schema: { type: string, const: no-referrer }
  X-Robots-Tag:
    description: The result must never be indexed or archived.
    schema: { type: string, const: "noindex, nofollow, noarchive" }
x-idempotency-replayed-header: &idempotencyReplayedHeader
  description: True only when this is the previously committed response to an exact replay.
  schema: { type: boolean }
x-result-session-cookie-header: &resultSessionCookieHeader
  description: >-
    Creator-bound Secure, HttpOnly result-session cookie. It is separate from the result
    identifier and is not an account session; omitted on an idempotent replay.
  schema: { type: string }
x-account-session-cookie-header: &accountSessionCookieHeader
  description: Secure, HttpOnly magic-link account-session cookie; omitted on an exchange replay.
  schema: { type: string }

paths:
  /api/visa/voa/eligibility-checks:
    post:
      operationId: createEligibilityCheck
      tags: [Public eligibility]
      summary: Create a preliminary eligibility check
      description: >-
        Persists only after the explicit policy acknowledgement and all fail-closed authorities
        pass. The result identifier is returned only in Location. The response never represents
        authority approval.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityCheckRequest"
      responses:
        "201":
          description: Check persisted and creator-bound result session established. Exact replay returns this committed result without another row.
          headers:
            <<: *publicPrivacyHeaders
            Location:
              description: Public result route `/visa/voa/{result_id}`; contains no submitted value.
              schema:
                type: string
                pattern: "^/visa/voa/[A-Za-z0-9_-]{22,128}$"
            Set-Cookie: *resultSessionCookieHeader
            Idempotency-Replayed: *idempotencyReplayedHeader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResult"
        "400":
          description: Idempotency-Key is absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: &errorContent
            application/json:
              schema:
                $ref: "./errors.yaml#/$defs/ErrorResponse"
        "404":
          description: Surface disabled. Code is GARUDA_PUBLIC_DISABLED.
          x-error-codes: [GARUDA_PUBLIC_DISABLED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: The idempotency key is bound to another payload. Code is IDEMPOTENCY_CONFLICT.
          x-error-codes: [IDEMPOTENCY_CONFLICT]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Invalid closed request or missing explicit notice acknowledgement.
          x-error-codes: [INVALID_REQUEST, NOTICE_ACKNOWLEDGEMENT_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "429":
          description: Request rate limited. Code is RATE_LIMITED.
          x-error-codes: [RATE_LIMITED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: >-
            Sale fails closed before persistence. The distinct code identifies unavailable
            retention authority, price, truth freshness, truth authority, or service.

            The operating calendar is deliberately NOT among these. Past `COVERAGE_END` the
            engine returns a 201 DECLINE carrying `ARRIVAL_DATE_UNCONFIRMED`, and that is the
            correct answer rather than an outage: we are not unavailable, we simply cannot
            confirm a date the 2027 decree has not yet fixed, and `intake.py` says so in as
            many words — it "routes to a human rather than publishing a guessed date". A 503
            would tell a 2027 traveller to come back later about something that will not
            change for months, and an automated client would retry it forever.
          x-error-codes:
            - PERSISTENCE_POLICY_UNAVAILABLE
            - PRICE_UNRESOLVABLE
            - SERVICE_UNAVAILABLE
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/eligibility-checks/{result_id}:
    parameters:
      - $ref: "#/components/parameters/ResultId"
    get:
      operationId: getEligibilityResult
      tags: [Public eligibility]
      summary: Fetch a creator-bound eligibility result
      description: >-
        The identifier alone never authorizes access. Malformed, deleted, absent, or incorrectly
        bound results use the same non-enumerating response.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - ResultSession: []
      responses:
        "200":
          description: Creator-authorized public result.
          headers: *publicPrivacyHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResult"
        "404":
          description: Surface disabled or non-enumerating unavailable result.
          x-error-codes: [GARUDA_PUBLIC_DISABLED, RESULT_NOT_FOUND]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Temporary storage/service failure. Code is SERVICE_UNAVAILABLE.
          x-error-codes: [SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent
    delete:
      operationId: deleteEligibilityResult
      tags: [Public eligibility]
      summary: Delete one's creator-bound pre-account result
      description: >-
        Always returns 204 for an exact replay, malformed or absent result, or missing/wrong
        creator binding. Only a valid creator binding erases data; the response reveals no
        existence oracle.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - {}
        - ResultSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Authorized data erased, or no data disclosed or changed. Exact replay returns 204 and does not duplicate aggregate evidence.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
        "400":
          description: Idempotency-Key is absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled. Code is GARUDA_PUBLIC_DISABLED.
          x-error-codes: [GARUDA_PUBLIC_DISABLED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: The idempotency key is bound to another payload. Code is IDEMPOTENCY_CONFLICT.
          x-error-codes: [IDEMPOTENCY_CONFLICT]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Atomic deletion is temporarily unavailable. Code is SERVICE_UNAVAILABLE.
          x-error-codes: [SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/auth/magic-links:
    post:
      operationId: requestMagicLink
      tags: [Magic-link authentication]
      summary: Request a non-enumerating magic link
      description: >-
        Always returns 202 for an unknown or non-owned result and never returns the token. Exact
        replay returns the original 202 without another email.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - ResultSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "202":
          description: Request accepted without revealing whether a link was queued.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
        "400":
          description: Idempotency-Key is absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled. Code is GARUDA_PUBLIC_DISABLED.
          x-error-codes: [GARUDA_PUBLIC_DISABLED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: The idempotency key is bound to another payload. Code is IDEMPOTENCY_CONFLICT.
          x-error-codes: [IDEMPOTENCY_CONFLICT]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Invalid closed request. Code is INVALID_REQUEST.
          x-error-codes: [INVALID_REQUEST]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "429":
          description: Request rate limited. Code is RATE_LIMITED.
          x-error-codes: [RATE_LIMITED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Persistence or delivery service unavailable.
          x-error-codes: [PERSISTENCE_POLICY_UNAVAILABLE, SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/auth/sessions:
    post:
      operationId: exchangeMagicLink
      tags: [Magic-link authentication]
      summary: Exchange an unused magic link for one session
      description: >-
        Invalid, expired, and consumed tokens return one non-enumerating error. An exact
        Idempotency-Key replay returns the original 204 but creates no second session and emits no
        second Set-Cookie; a consumed token under a new key is invalid.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkExchange"
      responses:
        "204":
          description: One account session established, or its committed exchange replayed.
          headers:
            <<: *publicPrivacyHeaders
            Set-Cookie: *accountSessionCookieHeader
            Idempotency-Replayed: *idempotencyReplayedHeader
        "400":
          description: Idempotency-Key is absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "401":
          description: Invalid, expired, or consumed link. Code is MAGIC_LINK_INVALID.
          x-error-codes: [MAGIC_LINK_INVALID]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled. Code is GARUDA_PUBLIC_DISABLED.
          x-error-codes: [GARUDA_PUBLIC_DISABLED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: The idempotency key is bound to another payload. Code is IDEMPOTENCY_CONFLICT.
          x-error-codes: [IDEMPOTENCY_CONFLICT]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Invalid closed request. Code is INVALID_REQUEST.
          x-error-codes: [INVALID_REQUEST]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "429":
          description: Request rate limited. Code is RATE_LIMITED.
          x-error-codes: [RATE_LIMITED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Session persistence is temporarily unavailable.
          x-error-codes: [PERSISTENCE_POLICY_UNAVAILABLE, SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/eligibility-checks/{result_id}/documents:
    parameters:
      - $ref: "#/components/parameters/ResultId"
    post:
      operationId: uploadIntakeDocument
      tags: [Customer intake]
      summary: Upload one authenticated intake document
      description: >-
        Bytes stay in the identified domain and OCR is local-first. Exact replay returns the
        original success or UNREADABLE_DOCUMENT outcome without another row, job, or work item.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - MagicSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadRequest"
      responses:
        "201":
          description: Readable document accepted and ready for explicit customer review.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyDocument"
        "202":
          description: Processing continues or customer confirmation/re-upload is required; no uncertain value is treated as verified.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessingDocument"
                  - $ref: "#/components/schemas/LowConfidenceDocument"
        "400":
          description: Idempotency-Key is absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "401":
          description: Account session required. Code is SESSION_REQUIRED.
          x-error-codes: [SESSION_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled or non-enumerating malformed/absent/non-owned intake.
          x-error-codes: [GARUDA_PUBLIC_DISABLED, RESULT_NOT_FOUND]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: The idempotency key is bound to another payload. Code is IDEMPOTENCY_CONFLICT.
          x-error-codes: [IDEMPOTENCY_CONFLICT]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "413":
          description: Document exceeds the governed upload bound. Code is DOCUMENT_TOO_LARGE.
          x-error-codes: [DOCUMENT_TOO_LARGE]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "415":
          description: Media type unsupported. Code is UNSUPPORTED_DOCUMENT_MEDIA_TYPE.
          x-error-codes: [UNSUPPORTED_DOCUMENT_MEDIA_TYPE]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Closed request invalid or declared media contains unreadable bytes.
          x-error-codes: [INVALID_REQUEST, UNREADABLE_DOCUMENT]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Retention, document processing, or service unavailable.
          x-error-codes:
            [
              PERSISTENCE_POLICY_UNAVAILABLE,
              DOCUMENT_PROCESSING_UNAVAILABLE,
              SERVICE_UNAVAILABLE,
            ]
          headers: *publicPrivacyHeaders
          content: *errorContent
    get:
      operationId: listIntakeDocuments
      tags: [Customer intake]
      summary: List creator-authorized intake and delivered documents
      description: Returns customer-safe metadata only; never raw OCR diagnostics or private staff notes.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - MagicSession: []
      responses:
        "200":
          description: Authorized document list.
          headers: *publicPrivacyHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "401":
          description: Account session required. Code is SESSION_REQUIRED.
          x-error-codes: [SESSION_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled or non-enumerating malformed/absent/non-owned intake.
          x-error-codes: [GARUDA_PUBLIC_DISABLED, RESULT_NOT_FOUND]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Temporary storage/service failure. Code is SERVICE_UNAVAILABLE.
          x-error-codes: [SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/orders:
    post:
      operationId: createOrderFromCheck
      tags: [Customer intake]
      summary: Create one order and checkout from a reviewed check
      description: >-
        Executes OP-00 then OP-01 only after review, retention, freshness, and the single catalogue
        price pass. Exact replay returns the original order and checkout without another provider call.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - MagicSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created and one checkout session ready in awaiting_payment.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCheckout"
        "400":
          description: Idempotency-Key is absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "401":
          description: Account session required. Code is SESSION_REQUIRED.
          x-error-codes: [SESSION_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled or non-enumerating malformed/absent/non-owned source check.
          x-error-codes: [GARUDA_PUBLIC_DISABLED, RESULT_NOT_FOUND]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: Idempotency conflict or reviewed intake not ready.
          x-error-codes:
            [IDEMPOTENCY_CONFLICT, ORDER_NOT_READY, INVALID_STATE_TRANSITION]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Invalid closed request. Code is INVALID_REQUEST.
          x-error-codes: [INVALID_REQUEST]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "429":
          description: Request rate limited. Code is RATE_LIMITED.
          x-error-codes: [RATE_LIMITED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: A fail-closed authority, provider, or service is unavailable.
          x-error-codes:
            - PERSISTENCE_POLICY_UNAVAILABLE
            - PRICE_UNRESOLVABLE
            - PAYMENT_PROVIDER_UNAVAILABLE
            - SERVICE_UNAVAILABLE
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/orders/{order_id}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrderAndPractice
      tags: [Customer intake]
      summary: Read authoritative order and customer-safe practice state
      description: Browser-return observation is non-authoritative; only signed webhook reconciliation can show paid.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - MagicSession: []
      responses:
        "200":
          description: Creator-authorized order and practice view.
          headers: *publicPrivacyHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        "401":
          description: Account session required. Code is SESSION_REQUIRED.
          x-error-codes: [SESSION_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled or non-enumerating malformed/absent/non-owned order.
          x-error-codes: [GARUDA_PUBLIC_DISABLED, ORDER_NOT_FOUND]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Temporary storage/service failure. Code is SERVICE_UNAVAILABLE.
          x-error-codes: [SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/orders/{order_id}/browser-return-observations:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: observePaymentBrowserReturn
      tags: [Customer intake]
      summary: Record the non-authoritative provider browser return
      description: >-
        Executes OP-07 only. The creator-bound session and untrusted return nonce may record the
        browser observation, but can never change payment state, append a payment event, send an
        email, or release a practice. The return nonce is the transition idempotency identity;
        any exact repeat returns the committed 204 without another write.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - MagicSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserReturnObservationRequest"
      responses:
        "204":
          description: OP-07 observation committed, or its exact return-nonce replay accepted as a no-op.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
        "400":
          description: Idempotency-Key is absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "401":
          description: Account session required. Code is SESSION_REQUIRED.
          x-error-codes: [SESSION_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled or non-enumerating malformed/absent/non-owned order.
          x-error-codes: [GARUDA_PUBLIC_DISABLED, ORDER_NOT_FOUND]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: The idempotency key is bound to another payload. Code is IDEMPOTENCY_CONFLICT.
          x-error-codes: [IDEMPOTENCY_CONFLICT]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Return observation request is invalid. Code is INVALID_REQUEST.
          x-error-codes: [INVALID_REQUEST]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Atomic observation persistence is unavailable. Code is SERVICE_UNAVAILABLE.
          x-error-codes: [SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

  /api/visa/voa/webhooks/payment:
    post:
      operationId: receivePaymentWebhook
      tags: [Payment provider]
      summary: Verify and reconcile one raw provider webhook
      description: >-
        Signature verification precedes inbox insertion and business reconciliation. The signed
        body remains opaque here so this contract cannot represent a monetary component or
        ungrounded provider taxonomy. Valid duplicate or out-of-order events are durably accepted
        or quarantined, not retried into a state mutation.


        This path deliberately carries NO Idempotency-Key parameter, and adding one back would
        break it. That header is a request-idempotency pattern for commands the CLIENT issues;
        an inbound provider callback is not ours to key. Xendit sends no such header, so
        requiring it 400s every real payment confirmation before the signature is even checked
        — measured 2026-08-25 on `garuda_orders_router.py`, where the `$ref` this block used to
        carry had been faithfully implemented. Webhook dedup does not need it and never did:
        it is keyed on `(provider, provider_event_id)` in `garuda_payment_inbox`.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - ProviderSignature: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Exact raw bytes covered by the provider signature; never logged.
      responses:
        "204":
          description: Event committed, exact replay acknowledged, or duplicate safely deduplicated.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
        "202":
          description: Valid signed event durably quarantined for reconciliation with no business-state mutation.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
        "400":
          description: Idempotency-Key absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "401":
          description: Signature missing or invalid. Code is WEBHOOK_SIGNATURE_INVALID.
          x-error-codes: [WEBHOOK_SIGNATURE_INVALID]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled. Code is GARUDA_PUBLIC_DISABLED.
          x-error-codes: [GARUDA_PUBLIC_DISABLED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: Idempotency identity is bound to different signed bytes. Code is IDEMPOTENCY_CONFLICT.
          x-error-codes: [IDEMPOTENCY_CONFLICT]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Signed body cannot be parsed under the selected provider contract. Code is INVALID_REQUEST.
          x-error-codes: [INVALID_REQUEST]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
          description: Durable inbox or reconciliation service unavailable. Code is SERVICE_UNAVAILABLE.
          x-error-codes: [SERVICE_UNAVAILABLE]
          headers: *publicPrivacyHeaders
          content: *errorContent

