  /api/visa/voa/staff/practices/{practice_id}/transitions:
    parameters:
      - $ref: "#/components/parameters/PracticeId"
    post:
      operationId: transitionPractice
      tags: [Staff practice]
      summary: Apply one authorized PR-02 through PR-11 transition
      description: >-
        The server derives and compare-and-sets the source state. Exact replay returns the committed
        practice view without another state write, journal event, email, or work item.
      x-feature-flag: GARUDA_PUBLIC_ENABLED
      security:
        - StaffSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeTransitionRequest"
      responses:
        "200":
          description: Transition committed or exact command replayed.
          headers:
            <<: *publicPrivacyHeaders
            Idempotency-Replayed: *idempotencyReplayedHeader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeView"
        "400":
          description: Idempotency-Key absent. Code is IDEMPOTENCY_KEY_REQUIRED.
          x-error-codes: [IDEMPOTENCY_KEY_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "401":
          description: Staff session required. Code is SESSION_REQUIRED.
          x-error-codes: [SESSION_REQUIRED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "403":
          description: Staff actor lacks transition authority. Code is ACCESS_DENIED.
          x-error-codes: [ACCESS_DENIED]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "404":
          description: Surface disabled or malformed/absent practice.
          x-error-codes: [GARUDA_PUBLIC_DISABLED, PRACTICE_NOT_FOUND]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "409":
          description: Idempotency conflict or forbidden/current-state mismatch.
          x-error-codes: [IDEMPOTENCY_CONFLICT, INVALID_STATE_TRANSITION]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "422":
          description: Transition-specific guard payload invalid. Code is INVALID_REQUEST.
          x-error-codes: [INVALID_REQUEST]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "500":
          description: Unexpected internal failure. Code is INTERNAL_ERROR.
          x-error-codes: [INTERNAL_ERROR]
          headers: *publicPrivacyHeaders
          content: *errorContent
        "503":
