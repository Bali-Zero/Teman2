# Append-only journal/outbox contract. Emitted events are inserted once and are never updated
# or deleted; corrections are new events. Raw idempotency keys and personal data are forbidden.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: GARUDA VOA domain events
version: "1.0.0"
x-event-store: append-only
x-no-event-transition-ids: [OP-07, OP-09]

$defs:
  TransitionId:
    type: string
    enum:
      - OP-00
      - OP-01
      - OP-02
      - OP-03
      - OP-04
      - OP-05
      - OP-06
      - OP-07
      - OP-08
      - OP-09
      - PR-01
      - PR-02
      - PR-03
      - PR-04
      - PR-05
      - PR-06
      - PR-07
      - PR-08
      - PR-09
      - PR-10
      - PR-11
      # Forbidden-input RECOVERIES, grounded by DECISIONS.md Q10. STATE-MACHINE.md
      # lines 118-124 name OP-F01..OP-F07; only these two record state rather than
      # merely refuse it, so only these two need an identity. The `F` is deliberate
      # and must not be flattened into OP-10/OP-11: an OP is a transition the funnel
      # intends, an OP-F is a compensation for an input the funnel forbids, and the
      # two must stay distinguishable at exactly the moment real money has landed
      # where the state machine said it could not.
      - OP-F04
      - OP-F05

  IdempotencyIdentity:
    type: object
    additionalProperties: false
    required: [kind, key_digest, canonical_payload_digest]
    properties:
      kind:
        type: string
        enum:
          - CUSTOMER_COMMAND
          - PROVIDER_SESSION
          - PROVIDER_EVENT
          - SYSTEM_EXPIRY
          - DOMAIN_EVENT
          - STAFF_COMMAND
      key_digest:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: SHA-256 digest of the scoped idempotency identity; never the raw key.
      canonical_payload_digest:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: SHA-256 digest used to distinguish an exact replay from a conflict.

  EventEnvelope:
    type: object
    required:
      - schema_version
      - event_id
      - event_name
      - occurred_at
      - aggregate_type
      - aggregate_id
      - transition_id
      - idempotency_identity
      - customer_visible
    properties:
      schema_version:
        const: "1.0.0"
      event_id:
        type: string
        minLength: 16
        maxLength: 128
        description: Opaque append-only event identifier; never personal data.
      event_name:
        type: string
      occurred_at:
        type: string
        format: date-time
      aggregate_type:
        type: string
        enum: [order, practice]
      aggregate_id:
        type: string
        minLength: 16
        maxLength: 128
        description: Opaque internal aggregate identifier; never journal prose.
      transition_id:
        $ref: "#/$defs/TransitionId"
      idempotency_identity:
        $ref: "#/$defs/IdempotencyIdentity"
      customer_visible:
        type: boolean
        description: Whether the committed outcome may drive a customer tracker or outbox message.

  OrderCreated:
    x-event-name: order.created
    x-idempotency-source: customer idempotency key
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: order.created }
          aggregate_type: { const: order }
          transition_id: { const: OP-00 }
          customer_visible: { const: false }
    unevaluatedProperties: false

  PaymentAwaiting:
    x-event-name: payment.awaiting
    x-idempotency-source: order identity plus provider-session identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.awaiting }
          aggregate_type: { const: order }
          transition_id: { const: OP-01 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PaymentPaid:
    x-event-name: payment.paid
    x-idempotency-source: provider event identity plus provider charge identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.paid }
          aggregate_type: { const: order }
          transition_id: { const: OP-02 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PaymentFailed:
    x-event-name: payment.failed
    x-idempotency-source: provider event identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.failed }
          aggregate_type: { const: order }
          transition_id: { const: OP-03 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PaymentExpired:
    x-event-name: payment.expired
    x-idempotency-source: order identity plus grounded expiry epoch
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.expired }
          aggregate_type: { const: order }
          transition_id: { const: OP-04 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PaymentRefundedOutOfOrder:
    x-event-name: payment.refunded_out_of_order
    x-idempotency-source: provider event identity plus provider refund identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.refunded_out_of_order }
          aggregate_type: { const: order }
          transition_id: { const: OP-05 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PaymentRefunded:
    x-event-name: payment.refunded
    x-idempotency-source: provider event identity plus provider refund identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.refunded }
          aggregate_type: { const: order }
          transition_id: { const: OP-06 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PaymentDuplicateChargeDetected:
    x-event-name: payment.duplicate_charge_detected
    x-idempotency-source: provider event identity plus distinct second charge identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.duplicate_charge_detected }
          aggregate_type: { const: order }
          transition_id: { const: OP-08 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PaymentLatePaidAfterRefund:
    x-event-name: payment.late_paid_after_refund
    x-idempotency-source: provider event identity plus provider charge identity
    x-grounded-by: DECISIONS.md Q10 — OP-F04 admitted to TransitionId.
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.late_paid_after_refund }
          aggregate_type: { const: order }
          transition_id: { const: OP-F04 }
          customer_visible: { const: false }
    unevaluatedProperties: false

  PaymentLatePaidAfterTerminal:
    x-event-name: payment.late_paid_after_terminal
    x-idempotency-source: provider event identity plus provider charge identity
    x-grounded-by: DECISIONS.md Q10 — OP-F05 admitted to TransitionId.
    description: >-
      A signed, reconciled `paid` arrived after the order reached `failed` or `expired`
      (STATE-MACHINE.md OP-F05). The terminal order state is KEPT, as OP-F05 requires; this
      event is the compensation recorded beside it. It exists because our `expired` records
      that WE stopped waiting, not that the customer did not pay — so the money is real and
      dropping it would be theft by bookkeeping (DECISIONS.md Q2). Emitting this event opens
      exactly one staff remediation case and pages; the case is closed by
      `resolveLateOrder`, which admits exactly two outcomes and never "neither".
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: payment.late_paid_after_terminal }
          aggregate_type: { const: order }
          transition_id: { const: OP-F05 }
          customer_visible: { const: false }
    unevaluatedProperties: false

  LateOrderResolved:
    x-event-name: order.late_resolved
    x-idempotency-source: staff resolution command identity
    x-grounded-by: DECISIONS.md Q2 — the two staff paths, made expressible.
    description: >-
      Records which of the two permitted outcomes staff chose for a late payment:
      `honoured` (the practice is created and delivered late) or `refunded_in_full`.
      There is no third value, and the absence of this event on an open remediation case is
      itself the alarm — a case that is neither honoured nor refunded is the failure Q2 names.
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: order.late_resolved }
          aggregate_type: { const: order }
          transition_id: { const: OP-F05 }
          customer_visible: { const: true }
          resolution:
            type: string
            enum: [honoured, refunded_in_full]
        required: [resolution]
    unevaluatedProperties: false

  PracticeReceived:
    x-event-name: practice.received
    x-idempotency-source: committed payment.paid journal event identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: practice.received }
          aggregate_type: { const: practice }
          transition_id: { const: PR-01 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PracticeInReview:
    x-event-name: practice.in_review
    x-idempotency-source: staff command identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: practice.in_review }
          aggregate_type: { const: practice }
          transition_id: { const: PR-02 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PracticeBlocked:
    x-event-name: practice.blocked
    x-idempotency-source: staff command identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: practice.blocked }
          aggregate_type: { const: practice }
          transition_id:
            type: string
            enum: [PR-03, PR-05, PR-08]
          customer_visible: { const: true }
    unevaluatedProperties: false

  PracticeSubmitted:
    x-event-name: practice.submitted
    x-idempotency-source: staff command identity plus filing-evidence identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: practice.submitted }
          aggregate_type: { const: practice }
          transition_id: { const: PR-04 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PracticeApproved:
    x-event-name: practice.approved
    x-idempotency-source: staff command identity plus decision-evidence identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: practice.approved }
          aggregate_type: { const: practice }
          transition_id: { const: PR-06 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PracticeRejected:
    x-event-name: practice.rejected
    x-idempotency-source: staff command identity plus decision-evidence identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: practice.rejected }
          aggregate_type: { const: practice }
          transition_id: { const: PR-07 }
          customer_visible: { const: true }
    unevaluatedProperties: false

  PracticeResumed:
    x-event-name: practice.resumed
    x-idempotency-source: staff command identity plus resolved-block identity
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: practice.resumed }
          aggregate_type: { const: practice }
          transition_id:
            type: string
            enum: [PR-09, PR-10]
          customer_visible: { const: true }
    unevaluatedProperties: false

  PracticeDelivered:
    x-event-name: practice.delivered
    x-idempotency-source: staff command identity plus artifact digest
    allOf:
      - $ref: "#/$defs/EventEnvelope"
      - type: object
        properties:
          event_name: { const: practice.delivered }
          aggregate_type: { const: practice }
          transition_id: { const: PR-11 }
          customer_visible: { const: true }
    unevaluatedProperties: false
