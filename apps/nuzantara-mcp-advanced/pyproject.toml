[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuzantara-mcp-advanced"
version = "1.0.0"
description = "Advanced MCP server for Nuzantara operations, deployment, and diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nuzantara Team"}
]
keywords = ["mcp", "nuzantara", "deployment", "operations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
]

[project.scripts]
nuzantara-mcp-advanced = "nuzantara_mcp_advanced.server:main"

[tool.hatch.build.targets.wheel]
packages = ["nuzantara_mcp_advanced"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
