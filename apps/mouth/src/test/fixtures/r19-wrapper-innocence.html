<!doctype html>
<html lang="en" data-theme="light">
  <body style="margin: 0">
    <!-- prettier-ignore -->
    <div
      data-presentation="r19"
      style="
        --kbli-bg-base: #F7F4EE;
        --kbli-bg-card: #FFFCF7;
        --kbli-ink: #1D2C3B;
        --kbli-text-muted: #58626B;
        --kbli-border: #DAD8D1;
        --kbli-pma-open: #2E5E4E;
        background: var(--kbli-bg-base);
        color: var(--kbli-ink);
      "
    >
      <main
        style="
          background: var(--kbli-bg-card);
          border: 1px solid var(--kbli-border);
        "
      >
        <h1 style="color: var(--kbli-ink)">KBLI 55203</h1>
        <p style="color: var(--kbli-text-muted)">R19 wrapper palette census.</p>
        <span
          style="
            color: var(--kbli-pma-open);
            border: 1px solid var(--kbli-pma-open);
          "
          >PMA open</span
        >
      </main>
    </div>
  </body>
</html>
