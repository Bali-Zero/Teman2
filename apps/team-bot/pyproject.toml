[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "team-bot"
version = "0.1.0"
description = "I DUE BOT — Bot B, the agentic team WhatsApp operator (F4-F7). Ships the tool registry (F5), ToolDecision schema, claim-vs-action gate, confirmation state machine, and the TP1/local-read-only brain adapter (F8, lane B4-tp1); the webhook/identity/sqlite-replication pieces are separate units of the same lane."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["team_bot*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
