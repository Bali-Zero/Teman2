[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuzantara_mcp_browser"
version = "0.1.0"
description = "Headless browser sidecar for Nuzantara UI verification"
authors = [{ name = "Nuzantara Team", email = "zero@balizero.com" }]
dependencies = [
    "fastmcp",
    "playwright",
]

[tool.hatch.build.targets.wheel]
packages = ["nuzantara_mcp_browser"]
