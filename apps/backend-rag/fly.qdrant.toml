app = "nuzantara-qdrant"
primary_region = "sin"

[build]
  image = "qdrant/qdrant:v1.17.0"

[env]
  QDRANT__SERVICE__API_PORT = "6333"
  QDRANT__STORAGE__STORAGE_PATH = "/qdrant/storage"

[[mounts]]
  source = "qdrant_storage"
  destination = "/qdrant/storage"

[[services]]
  protocol = "tcp"
  internal_port = 6333
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
