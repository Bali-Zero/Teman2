# ============================================================================
# PYTHON CODE QUALITY CONFIGURATION
# ============================================================================
# Configuration for Python linting, formatting, and type checking
# ============================================================================

[project]
name = "nuzantara-backend-rag"
version = "1.0.0"
description = "NUZANTARA RAG Backend with FastAPI"
requires-python = ">=3.10"

# ============================================================================
# BLACK - Code Formatter
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | migrations
)/
'''

# ============================================================================
# ISORT - Import Sorting
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/.venv/*"]

# ============================================================================
# MYPY - Static Type Checker
# ============================================================================
[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true

# Paths
files = ["backend/**/*.py", "*.py"]
exclude = [
    "^migrations/",
    "^tests/",
    "^\\.venv/"
]

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "feedparser.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PyPDF2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# ============================================================================
# PYLINT - Comprehensive Linter
# ============================================================================
[tool.pylint.main]
py-version = "3.10"
jobs = 0  # Auto-detect CPUs
recursive = true
suggestion-mode = true

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring (handled by separate rule)
    "R0903",  # too-few-public-methods (Pydantic models)
    "W0212",  # protected-access (sometimes needed)
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "db"]
class-naming-style = "PascalCase"
function-naming-style = "snake_case"
method-naming-style = "snake_case"
const-naming-style = "UPPER_CASE"
variable-naming-style = "snake_case"

[tool.pylint.design]
max-args = 5
max-attributes = 10
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50
min-public-methods = 1

[tool.pylint.format]
max-line-length = 100
max-module-lines = 500

# ============================================================================
# FLAKE8 - Style Guide Enforcement
# ============================================================================
[tool.flake8]
max-line-length = 100
max-complexity = 10
extend-ignore = ["E203", "E266", "E501", "W503"]
extend-exclude = [".venv", "migrations", "__pycache__", "*.pyc"]
per-file-ignores = [
    "__init__.py:F401",  # Allow unused imports in __init__.py
    "tests/*:S101"       # Allow assert in tests
]

# ============================================================================
# PYTEST - Testing Framework
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ============================================================================
# BANDIT - Security Linter
# ============================================================================
[tool.bandit]
targets = ["."]
exclude_dirs = ["/tests", "/.venv", "/migrations"]
severity = "medium"
confidence = "medium"
max_lines = 500
# B324: MD5 used as cache key (non-security context) — cache keys, dedup hashes,
# content addressing. NOT password hashing or security-sensitive operations.
# To fix properly: add usedforsecurity=False across all usages.
skips = ["B324"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests/*"]

# ============================================================================
# RUFF - Fast Python Linter (Modern Alternative)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"

# Enable specific rules
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by black/ruff format)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "build",
    "dist",
    "_archive",
    "tests/unit/_obsolete/**",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports
"tests/*" = ["S101", "ARG", "SIM", "B", "UP", "F403", "F811", "E402"]  # Allow assert, unused args, simplifications, star imports, redefinitions, late imports in tests
"tests/**/*" = ["S101", "ARG", "SIM", "B", "UP", "F403", "F811", "E402"]  # Same for nested test dirs
"backend/tests/**/*" = ["F403", "F811", "SIM", "ARG", "E402", "B017"]  # Allow star imports, redefinitions, simplifications, unused args, late imports, assert exceptions in backend tests
"scripts/*.py" = ["E402", "SIM", "B007", "B904", "ARG001", "ARG002", "B005"]  # Scripts may have non-standard patterns
"backend/app/routers/*.py" = ["ARG001", "B904", "SIM"]  # FastAPI routers: dependency injection + error handling + cosmetic simplifications
"backend/app/**/*.py" = ["SIM"]  # App modules - cosmetic simplifications
"backend/app/modules/**/router*.py" = ["ARG001", "B904"]  # Same for module routers
"backend/app/modules/**/*router*.py" = ["ARG001", "B904"]  # Module routers with different naming
"backend/app/modules/**/test_*.py" = ["ARG001", "B904"]  # Test files in modules
"backend/agents/**/test_*.py" = ["ARG001"]  # Test files in agents
"backend/generals/tests/*.py" = ["ARG002"]  # General test files
"backend/migrations/*.py" = ["ARG001", "E402"]  # Migration scripts with placeholder params and late imports
"backend/cli/*.py" = ["E402"]  # CLI scripts with late imports
"backend/app/routers/agents.py" = ["E402"]  # Lazy imports
"backend/app/routers/monitoring_rag.py" = ["E402"]  # Lazy imports
"backend/jobs/*.py" = ["ARG001"]  # Job scripts with placeholder params
"backend/scripts/*.py" = ["ARG001", "E402", "SIM"]  # Utility scripts
"backend/verify_soul_persona.py" = ["E402"]  # Verification script with late imports
"add_docstrings.py" = ["ARG001"]  # Root level script
"_archive/**/*.py" = ["ARG", "E402", "B904"]  # Archived code
"backend/services/rag/kg_*.py" = ["ARG001"]  # KG subgraph modules with placeholder params
"backend/services/knowledge_graph/*.py" = ["ARG001"]  # KG services
"backend/app/setup/*.py" = ["ARG001"]  # Setup/initialization modules
"backend/services/rag/agentic/__init__.py" = ["E402"]  # Lazy imports to avoid circular dependencies
"backend/services/rag/agentic/context_manager.py" = ["ARG001"]  # Future feature params
"backend/agents/**/*.py" = ["ARG002", "SIM", "B904"]  # Agent adapters with interface patterns and cosmetic simplifications
"backend/channels/**/*.py" = ["ARG002"]  # Channel adapters with interface patterns
"backend/conversation/*.py" = ["ARG002"]  # Conversation engine with interface patterns
"backend/db/*.py" = ["ARG002", "B904"]  # Database migration base classes
"backend/llm/**/*.py" = ["ARG002", "B904"]  # LLM providers with interface patterns
"backend/core/*.py" = ["ARG001", "B904"]  # Core modules with __getattr__ patterns
"backend/generals/*.py" = ["ARG001", "B904"]  # Signal handlers and general utilities
"backend/services/**/*.py" = ["SIM", "B904", "ARG002", "ARG004"]  # Services - cosmetic simplifications, error handling, interface params
"backend/services/rag/reranker.py" = ["ARG001"]  # __getattr__ pattern
"backend/services/memory/memory_fallback.py" = ["ARG004"]  # Static method pattern
"backend/services/oracle/oracle_service.py" = ["E402"]  # Optional dependency imports
"backend/app/main_cloud.py" = ["E402"]  # App initialization order matters
"backend/core/chunker.py" = ["E402"]  # Optional dependency imports
"backend/services/memory/models.py" = ["E402"]  # Optional dependency imports
"backend/services/misc/proactive_compliance_monitor.py" = ["E402"]  # Optional dependency imports
"backend/app/modules/notifications/router.py" = ["E402"]  # Optional dependency imports
"backend/app/routers/conversations.py" = ["F823"]  # False positive - asyncio is imported globally
"backend/channels/web/adapter.py" = ["SIM116"]  # Consecutive if pattern is intentional
"backend/channels/instagram/adapter.py" = ["SIM105"]  # Intentional try-except-pass pattern
"backend/services/autonomous_agents/knowledge_graph_builder.py" = ["B007"]  # Intentional loop pattern
"backend/tests/services/rag/evaluation/test_monitoring.py" = ["B007"]  # Test loop pattern
"backend/tests/services/rag/evaluation/test_ragas_evaluator.py" = ["B015"]  # Test assertion pattern
"tests/unit/test_conversation_trainer.py" = ["E402"]  # Must patch settings before importing
"prompts/*.py" = ["E501"]  # Prompt strings can be long

[tool.ruff.lint.isort]
known-first-party = ["app", "routers", "services", "models"]

[tool.ruff.lint.mccabe]
max-complexity = 10
