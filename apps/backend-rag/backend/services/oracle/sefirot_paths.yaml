# Sefirotic Paths — curated cross-NB query routing (Sprint 4)
#
# Sacred root (comment only, never invoked in code): in the Kabbalistic Tree of
# Life, a single divine intention manifests through a chain of 10 sefirot (from
# Keter to Malkhut). A query from the Bali Zero client is an analogous chain —
# a single business intention ("open a PT PMA with team + property") emanates
# through multiple domain NBs (company/visa/tax/operations/team).
#
# This YAML captures ~15 common multi-domain patterns as curated sequences of NB
# queries. The sefirot_router consults this file when a user query matches a
# trigger, and produces an ordered fan-out instead of a single-NB or keyword-
# scored fan-out.
#
# CURATION RULES:
#   1. Every path is human-curated. Never auto-generated via LLM.
#   2. weight [0, 1] — the sefirot_router uses weight to order fan-out. Primary
#      NB has weight 1.0; subordinate NBs have progressively lower weights.
#   3. triggers are CASE-INSENSITIVE keyword fragments. First-match wins.
#   4. aggregator: how to combine NB responses downstream.
#      "synthesis_ordered"  — primary first, others subordinate (default)
#      "parallel_independent" — each NB answers separately
#      "primary_only_confirm" — primary answers, others only confirm/contradict
#
# Change history: append new paths; do not reorder existing ones (first-match
# semantics). When retiring a path, set `deprecated: true` but keep the entry
# for compatibility with in-flight queries.

