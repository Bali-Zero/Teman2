[pytest]
# Pytest configuration for Nuzantara backend
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Disable problematic plugins
addopts = 
    -p no:xonsh
    --tb=short
    -v

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage (if needed)
# --cov=backend
# --cov-report=html
# --cov-report=term-missing
