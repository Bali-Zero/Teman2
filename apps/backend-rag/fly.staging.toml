# fly.staging.toml — Staging environment for nuzantara-rag
# Identical config to prod but with auto_stop and smaller VM

app = 'nuzantara-rag-staging'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  ENVIRONMENT = 'staging'
  EMBEDDING_PROVIDER = 'openai'
  LOG_LEVEL = 'DEBUG'
  PORT = '8080'
  PYTHONUNBUFFERED = '1'
  ZANTARA_ALLOWED_ORIGINS = 'https://balizero.com,https://www.balizero.com,https://kita.balizero.com,https://mail.balizero.com,https://calendar.balizero.com,https://drive.balizero.com,https://knowledge.balizero.com,https://nuzantara-rag-staging.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  kill_timeout = 60

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
