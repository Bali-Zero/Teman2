# fly.toml app configuration file generated for nuzantara-rag on 2025-11-22T18:00:25+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nuzantara-rag'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'
  build_target = ''

[deploy]
  strategy = 'rolling'
  # release_command = "sh -c 'python -m backend.db.migrate apply-all'"
  # Temporarily disabled to bypass migration bug and deploy omnichannel fixes

[processes]
  api = "uvicorn backend.app.main_api:app --host 0.0.0.0 --port 8080 --workers 2"
  rag = "uvicorn backend.app.main_rag:app --host 0.0.0.0 --port 8080 --workers 1"

[env]
  ENVIRONMENT = 'production'
  EMBEDDING_PROVIDER = 'openai'
  LOG_LEVEL = 'INFO'
  PORT = '8080'
  # QDRANT_URL set via fly secrets (Qdrant Cloud)
  PYTHONUNBUFFERED = '1'
  ZANTARA_ALLOWED_ORIGINS = 'https://balizero.com,https://www.balizero.com,https://kita.balizero.com,https://www.kita.balizero.com,https://mail.balizero.com,https://calendar.balizero.com,https://drive.balizero.com,https://knowledge.balizero.com,https://nuzantara-mouth.vercel.app'

[[mounts]]
  source = 'nuzantara_rag_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  kill_timeout = 30
  processes = ['api']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['api']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  processes = ['rag']
