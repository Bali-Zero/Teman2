[project]
name = "osint-nexus"
version = "0.1.0"
description = "OSINT intelligence graph system for bureaucratic network mapping"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "nuzantara-browser-core",
    "playwright>=1.40",
    "neo4j>=5.20",
    "tenacity>=8.2",
    "fake-useragent>=1.5",
    "rapidfuzz>=3.6",
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.6",
    "orjson>=3.9",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
dossier = "osint_nexus.dossier.cli:main"

[tool.setuptools.packages.find]
include = ["osint_nexus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration and not stealth'"
markers = [
    "integration: tests that launch real Chromium (run with: pytest -m integration)",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
