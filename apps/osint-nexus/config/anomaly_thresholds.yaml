# OSINT Anomaly Detector Thresholds
#
# Override any default by mirroring the nested key. Deep-merge: scalars
# replace, dicts merge. See osint_nexus/anomaly/thresholds.py for the
# authoritative default values and calibration notes.
#
# IMPORTANT: these thresholds are tuned for PRECISION over recall. An
# analyst reviews alerts by hand. Do not lower blindly.

centrality_jump:
  sigma_multiplier: 2.5
  min_degree: 3
  recent_fraction: 0.2
  min_score: 0.55

bridge_outlier:
  min_communities: 2
  min_community_size: 3
  min_score: 0.6

temporal_burst:
  z_threshold: 3.0
  window_days: 7
  ewma_alpha: 0.3
  min_edges_in_window: 5
  rel_types:
    - MET_WITH
    - ATTENDED
    - PARTICIPATED_IN
  source_exclude:
    - lhkpn
    - lhkpn_batch
    - ahu_batch
  min_score: 0.6

angkatan_disjoint:
  max_path_len: 3
  non_official_rels:
    - KNOWS
    - MET_WITH
    - MARRIED_TO
    - PARENT_OF
    - SIBLING_OF
    - FREQUENTS
  min_angkatan_gap: 3
  min_score: 0.6

eigenvector_reverse:
  lone_hub_min_ratio: 0.75
  hub_top_percentile: 0.90
  neighbor_bottom_percentile: 0.25
  min_neighbors: 4
  min_score: 0.6
