[project]
name = "nuzantara-mcp"
version = "2.1.0"
description = "Full-spectrum MCP server: 115 tools, 10 prompts, 5 resources, 8 deterministic workflow chains"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    # Optional-but-recommended: chain observability. Module degrades to no-op
    # if the package is absent (Legge 4), but installing it turns on the
    # telemetry that docs/observability/grafana-chains.json depends on.
    "prometheus-client>=0.20.0",
    # auth.py reads the role taxonomy from roles.yaml.
    "pyyaml>=6.0",
]

[project.scripts]
nuzantara-mcp = "nuzantara_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
