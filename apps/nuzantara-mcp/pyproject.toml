[project]
name = "nuzantara-mcp"
version = "2.0.0"
description = "Full-spectrum MCP server: 72 tools, 10 prompts, 5 resources, 6 deterministic workflow chains"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
nuzantara-mcp = "nuzantara_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
