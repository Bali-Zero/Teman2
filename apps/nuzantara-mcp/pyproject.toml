[project]
name = "nuzantara-mcp"
version = "0.1.0"
description = "MCP server exposing Nuzantara RAG backend to AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
nuzantara-mcp = "nuzantara_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
