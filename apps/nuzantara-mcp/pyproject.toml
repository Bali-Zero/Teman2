[project]
name = "nuzantara-mcp"
version = "2.1.0"
description = "Full-spectrum MCP server: 115 tools, 10 prompts, 5 resources, 8 deterministic workflow chains"
requires-python = ">=3.11"
dependencies = [
    # Upper bound deliberate. fastmcp 4.0.0 (2026-08-31) implements MCP spec
    # 2026-07-28, which drops the `initialize` handshake and `Mcp-Session-Id`,
    # adds a required `server/discover`, and replaces server-push with Multi
    # Round-Trip. `>=2.0.0` let a routine `pip install -U` cross that line with
    # nothing in any diff to show it — we were not protected by a pin, only by
    # nobody having upgraded yet.
    #
    # The bound is NOT here because the migration is large. It is small: this
    # server is stdio, and uses none of the deprecated primitives (no sampling,
    # no roots, no logging/setLevel, no resources/subscribe — the only `elicit`
    # matches are inside a DISABLED feature list). It is here so that crossing
    # a protocol boundary is a decision with tests, not a side effect of an
    # unrelated upgrade. Deprecation floor is July 2027; raise this on purpose.
    "fastmcp>=3.4,<4.0",
    "httpx>=0.27.0",
    # Optional-but-recommended: chain observability. Module degrades to no-op
    # if the package is absent (Legge 4), but installing it turns on the
    # telemetry that docs/observability/grafana-chains.json depends on.
    "prometheus-client>=0.20.0",
    # auth.py reads the role taxonomy from roles.yaml.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
]

[project.scripts]
nuzantara-mcp = "nuzantara_mcp.server:main"
nuzantara-mcp-workspace-marketing = "nuzantara_mcp.server_workspace_marketing:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
