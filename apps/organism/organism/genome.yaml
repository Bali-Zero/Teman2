# Genoma — registry of all 149 organi nervosi del Nuzantara.
#
# This file is the SINGLE SOURCE OF TRUTH for "what organs exist, where they
# run, what their expected heartbeat is, and how to recover them when silent".
#
# Authoritative spec: docs/innervation-2026-04-29/07_innervation_protocol.md §2
# Validation: `python -m organism.tools.validate_genome` (pre-commit hook +
# CI). HALT-on-checksum-mismatch (NB-1 ADR-7).
#
# Wave 0 initial scope: 7 organ entries — 3 infrastructure backends
# (postgres, redis, qdrant) that the higher-level organi depend on, plus
# the 4 organi that get heartbeat in Wave 1 (backend.api, drive_poll,
# claude_max_watcher, login_healthcheck). Skeleton for the remaining 142
# organi added in Waves 1-4 PRs.
#
# Coexistence: complementary to redundancies.yaml. Genoma = "chi esiste".
# Redundancies = "chi è duplicato e come consolidare".
#
# Editing notes for future Claudes:
# - Run `python -m organism.tools.validate_genome --update-checksum` after
#   every edit. The validator REJECTS the file when the recorded checksum
#   does not match the canonical SHA256 (NB-1 ADR-7 enforcement).
# - `yaml.safe_dump` (used by --update-checksum) strips comments. Either
#   re-apply this header by hand, OR switch to ruamel.yaml in a follow-up.
#   For Wave 0 we tolerate the manual step — file is small.
# - `dependencies` MUST resolve to ids in this file. External infra (PG,
#   Redis, Qdrant) gets explicit `infra.*` entries below.

