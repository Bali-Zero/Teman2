rules:
  - id: cron_agent_failure_restart
    match: { kind: cron_agent_failure, severity: [error, critical] }
    action:
      { actuator: restart_agent, params: { agent_ref: "{payload.agent}" } }
    confidence: 0.95

  - id: disk_fill_cleanup_log
    match: { kind: disk_fill, payload.percent_gte: 85 }
    action: { actuator: cleanup_log, params: { min_age_days: 30 } }
    confidence: 0.90

  - id: zombie_detected_restart
    match: { kind: zombie_detected }
    action:
      { actuator: restart_agent, params: { agent_ref: "{payload.agent}" } }
    confidence: 0.85

  - id: new_module_adopt
    match: { kind: new_module }
    action:
      {
        actuator: adopt_module,
        params: { module_path: "{payload.module_path}" },
      }
    confidence: 0.80

  - id: scheduled_cleanup_log_nightly
    match: { kind: scheduled_tick, payload.hour: 3 }
    action: { actuator: cleanup_log, params: { min_age_days: 30 } }
    confidence: 1.0

  - id: scheduled_cleanup_cache_weekly
    match: { kind: scheduled_tick, payload.day_of_week: 6, payload.hour: 4 }
    action: { actuator: cleanup_cache, params: {} }
    confidence: 1.0

  - id: scheduled_cleanup_branches_weekly
    match: { kind: scheduled_tick, payload.day_of_week: 6, payload.hour: 5 }
    action: { actuator: cleanup_branches, params: {} }
    confidence: 1.0

  - id: scheduled_cleanup_zombie_plist_monthly_first_sunday
    match:
      {
        kind: scheduled_tick,
        payload.day_of_week: 6,
        payload.hour: 6,
        payload.day_of_month_lte: 7,
      }
    action: { actuator: cleanup_zombie_plist, params: {} }
    confidence: 0.9

  # ─── Autonomic closed-loop (2026-05-22) ────────────────────────────────────
  # Cell daemon silent for > genoma.expected_hb_seconds × 3 → auto-restart.
  # Triggered by genoma_aggregator_sensor when it observes an organ has not
  # emitted heartbeat within expected window. Replaces the historic
  # "Telegram alert to Zero" pattern with autonomic kickstart.

  - id: organ_silent_kickstart_critical
    match: { kind: organ_silent, payload.severity: critical }
    action:
      { actuator: restart_agent, params: { agent_ref: "{payload.organ_id}" } }
    confidence: 0.95

  - id: organ_silent_kickstart_error
    match: { kind: organ_silent, payload.severity: error }
    action:
      { actuator: restart_agent, params: { agent_ref: "{payload.organ_id}" } }
    confidence: 0.85

  # A2 Heartbeat Semantico — close signal→action for the sentinel's heartbeat_silent
  # events (TAC self-loop 2026-06-27; council/GLM caught these had NO matching rule and
  # dead-lettered to defer_to_human). The sentinel emits kind=heartbeat_silent with
  # payload.status in {dead, starved}. Routed DIFFERENTLY on purpose:
  #   - dead    -> restart_agent (a dead organ should be kickstarted, like organ_silent)
  #   - starved -> notify_telegram, NOT restart: a starved organ is ALIVE but its OUTPUT is
  #     frozen (e.g. a dedup ledger that grew but produced nothing). Auto-restarting could
  #     interrupt in-flight work or restart-storm (#7), and restart rarely fixes the ROOT
  #     (the frozen pipeline). Operator escalation is the correct, safe action (L6 boundary,
  #     not a silent dead-letter). Verified live on the real RuleMatcher: dead->restart_agent,
  #     starved->notify_telegram, ok->no-match.
  - id: heartbeat_silent_dead_kickstart
    match: { kind: heartbeat_silent, payload.status: dead }
    action:
      { actuator: restart_agent, params: { agent_ref: "{payload.organ_id}" } }
    confidence: 0.90
  - id: heartbeat_silent_starved_alert
    match: { kind: heartbeat_silent, payload.status: starved }
    action:
      actuator: notify_telegram
      params:
        message: "🫀 A2 starved organ (alive but output frozen): {payload.organ_id} — owner {payload.owner_module}, age {payload.age_seconds}s. Auto-restart withheld (could interrupt mid-work); operator needs eyes on the frozen pipeline."
    confidence: 0.85

  # W27 Path A (2026-05-23): Cell pulse went RED for ≥3 consecutive pulses
  # (~3 min wall time at 60s cadence) → start any stopped Fly machine for
  # the target app via fly_machines_start (idempotent on already-running
  # machines). Threshold lowered from 5 to 3 per 3-LLM panel convergent
  # verdict (Codex+Gemini+DeepSeek). Action changed from restart_agent
  # (which targeted the Cell daemon itself — wrong) to fly_machines_start
  # (the right target when the api machine is hung).
  # Cell emits the event via emit_sustained_red() in cell_core/observatory.py
  # ONCE per sustained-red window (idempotency flag resets on first non-red).
  # W31 (2026-05-23): action changed fly_machines_start → fly_machines_restart
  # because live production test showed fly_machines_start is no-op on
  # already-running machines (STARTED but UNHEALTHY outage class).
  # W57 (2026-05-26) defense-in-depth: bind explicitly to Fly api app so the
  # rule does NOT catch W57 wa-mirror-enrichment events (different app field).
  # Without this guard, the W57 emit on cell_pulse_sustained_red with
  # app="wa-mirror-enrichment" would trigger fly_machines_restart on a
  # non-existent Fly app — collateral damage (code-reviewer finding #3).
  - id: cell_sustained_red_restart
    match:
      kind: cell_pulse_sustained_red
      payload.consecutive_gte: 3
      payload.app: "nuzantara-rag"
    action: { actuator: fly_machines_restart, params: { app: "{payload.app}" } }
    confidence: 0.90

  # Fly machine stopped (not "scheduled stop") → auto-restart.
  # This handles the case where a Fly machine OOMs or crashes; the genome
  # has fly_machines_start as recovery_action for these organs.
  - id: fly_machine_stopped_restart
    match: { kind: fly_machine_stopped, payload.reason_excludes: scheduled }
    action: { actuator: fly_machines_start, params: { app: "{payload.app}" } }
    confidence: 0.85

  # Postgres outbox unconsumed > 200 events → propose YAML rule for review.
  # Don't auto-act on data semantics; flag for Reflexion weekly synthesis.
  - id: outbox_backlog_propose_rule
    match: { kind: outbox_backlog, payload.unconsumed_gte: 200 }
    action: { actuator: propose_yaml_rule, params: { topic: "outbox_backlog" } }
    confidence: 0.70

  # W57 (2026-05-26): self-healing wa-mirror enrichment Layer C.
  # Cell sustained_red on wa-mirror-enrichment + error_class=ModuleNotFoundError
  # → Organism dispatches python_env_repair actuator (allowlist-gated pip install).
  # Cooldown 10min consistent with pip timeout 120s + verify 15s + backoff buffer
  # (Codex bug #8 panel-amended). Per-dep mutex via target_key prevents
  # asyncpg-install blocking httpx-install.
  #
  # NOTE: yaml_rules.py matcher is FLAT (no dotted nested lookup), so the
  # Cell sensor MUST emit payload fields {error_class, missing_module,
  # python_path} at TOP LEVEL of payload (not under .metadata.). Step 4
  # sensor enforces this contract.
  - id: enrichment_dep_missing_repair
    match:
      kind: cell_pulse_sustained_red
      payload.app: "wa-mirror-enrichment"
      payload.error_class: "ModuleNotFoundError"
    action:
      actuator: python_env_repair
      params:
        dep: "{payload.missing_module}"
        python_path: "{payload.python_path}"
    confidence: 0.92
    cooldown_minutes: 10
