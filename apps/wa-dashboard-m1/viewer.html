<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>BZ WhatsApp Dashboard — M1 read-only</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bz-base: #0c0c0e;
    --bz-panel: #14141a;
    --bz-panel-soft: #1c1c24;
    --bz-border: #2a2a36;
    --bz-text: #e9e9f0;
    --bz-text-dim: #8c8ca0;
    --bz-accent: #d4845a;
    --bz-accent-soft: rgba(212,132,90,0.18);
    --bz-success: #5ad48a;
    --bz-warning: #d4b65a;
    --bz-error: #d45a5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bz-base);
    color: var(--bz-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  header {
    height: 44px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--bz-border);
    background: var(--bz-panel);
  }
  header .brand {
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--bz-accent);
  }
  header .meta {
    color: var(--bz-text-dim);
    font-size: 12px;
    display: flex;
    gap: 16px;
  }
  header .badge {
    background: var(--bz-accent-soft);
    color: var(--bz-accent);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  main {
    height: calc(100vh - 44px);
    display: grid;
    grid-template-columns: 220px 360px 1fr;
  }
  .col {
    overflow-y: auto;
    border-right: 1px solid var(--bz-border);
    background: var(--bz-panel);
  }
  .col:last-child { border-right: none; background: var(--bz-base); }
  .col-header {
    position: sticky;
    top: 0;
    background: var(--bz-panel-soft);
    padding: 10px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--bz-text-dim);
    border-bottom: 1px solid var(--bz-border);
    z-index: 10;
  }
  /* col-1 team */
  .team-item {
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--bz-border);
    transition: background 0.1s;
  }
  .team-item:hover { background: var(--bz-panel-soft); }
  .team-item.selected { background: var(--bz-accent-soft); border-left: 3px solid var(--bz-accent); padding-left: 11px; }
  .team-item .name { font-weight: 600; }
  .team-item .phone { font-size: 11px; color: var(--bz-text-dim); margin-top: 2px; }
  .team-item .stats { font-size: 11px; color: var(--bz-text-dim); margin-top: 4px; }
  /* col-2 convs */
  .conv-item {
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--bz-border);
  }
  .conv-item:hover { background: var(--bz-panel-soft); }
  .conv-item.selected { background: var(--bz-accent-soft); border-left: 3px solid var(--bz-accent); padding-left: 11px; }
  .conv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .conv-name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-time { font-size: 11px; color: var(--bz-text-dim); white-space: nowrap; }
  .conv-preview {
    font-size: 12px;
    color: var(--bz-text-dim);
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
  }
  .conv-tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-right: 4px;
  }
  .conv-tag.group { background: rgba(90,164,212,0.18); color: #5aa4d4; }
  .conv-tag.direct { background: rgba(212,132,90,0.18); color: var(--bz-accent); }
  .conv-tag.internal { background: rgba(140,140,160,0.18); color: var(--bz-text-dim); }
  .conv-tag.client { background: rgba(90,212,138,0.18); color: var(--bz-success); }
  /* col-3 messages */
  .thread-header {
    position: sticky;
    top: 0;
    background: var(--bz-panel-soft);
    padding: 14px 18px;
    border-bottom: 1px solid var(--bz-border);
    z-index: 10;
  }
  .thread-header .name { font-weight: 600; font-size: 16px; }
  .thread-header .sub { font-size: 11px; color: var(--bz-text-dim); margin-top: 2px; }
  .thread-body { padding: 16px; }
  .msg {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 70%;
    word-wrap: break-word;
  }
  .msg.inbound { background: var(--bz-panel); border: 1px solid var(--bz-border); margin-right: auto; }
  .msg.outbound { background: var(--bz-accent-soft); border: 1px solid var(--bz-accent); margin-left: auto; }
  .msg .body { white-space: pre-wrap; line-height: 1.45; }
  .msg .meta { font-size: 10px; color: var(--bz-text-dim); margin-top: 6px; }
  .msg .sender { font-size: 11px; color: var(--bz-accent); font-weight: 600; margin-bottom: 4px; }
  .msg .media-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; background: var(--bz-panel-soft); color: var(--bz-text-dim); margin-right: 6px; }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--bz-text-dim);
    font-size: 13px;
  }
  .loader { padding: 20px; color: var(--bz-text-dim); font-size: 12px; }
  .day-divider {
    text-align: center;
    color: var(--bz-text-dim);
    font-size: 11px;
    margin: 16px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
</style>
</head>
<body>
<header>
  <div class="brand">BZ • WhatsApp Dashboard</div>
  <div class="meta">
    <span id="health-pill" class="badge">READ-ONLY</span>
    <span id="db-host">DB: …</span>
    <span id="last-refresh">refresh: …</span>
  </div>
</header>
<main>
  <div class="col" id="col-teams">
    <div class="col-header">Team (9)</div>
    <div class="loader">Caricamento team…</div>
  </div>
  <div class="col" id="col-convs">
    <div class="col-header">Conversazioni</div>
    <div class="empty">Seleziona un team member</div>
  </div>
  <div class="col" id="col-thread">
    <div class="col-header">Messaggi</div>
    <div class="empty">Seleziona una conversazione</div>
  </div>
</main>
<script>
let DATA = null;
let SELECTED_TEAM = null;
let SELECTED_CONV = null;

const colTeams = document.getElementById("col-teams");
const colConvs = document.getElementById("col-convs");
const colThread = document.getElementById("col-thread");

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return "ieri " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
}

function fmtPreview(c) {
  if (c.last_body && c.last_body.trim()) return c.last_body;
  if (c.last_media) return "📎 " + c.last_media;
  return "(vuoto)";
}

function renderTeams() {
  if (!DATA) return;
  let html = `<div class="col-header">Team (${DATA.team.length})</div>`;
  for (const m of DATA.team) {
    const pd = DATA.by_phone[m.phone] || { total: 0, direct_count: 0, group_count: 0 };
    const selected = SELECTED_TEAM === m.phone ? " selected" : "";
    html += `
      <div class="team-item${selected}" data-phone="${m.phone}">
        <div class="name">${m.name}</div>
        <div class="phone">${m.phone}</div>
        <div class="stats">${pd.total} msg · ${pd.direct_count} direct · ${pd.group_count} group</div>
      </div>`;
  }
  colTeams.innerHTML = html;
  for (const el of colTeams.querySelectorAll(".team-item")) {
    el.addEventListener("click", () => selectTeam(el.dataset.phone));
  }
}

function renderConvs() {
  const pd = SELECTED_TEAM ? DATA.by_phone[SELECTED_TEAM] : null;
  if (!pd) {
    colConvs.innerHTML = `<div class="col-header">Conversazioni</div><div class="empty">Seleziona un team member</div>`;
    return;
  }
  let html = `<div class="col-header">${pd.convs.length} conversazioni</div>`;
  if (!pd.convs.length) {
    html += `<div class="empty">Nessuna conversazione</div>`;
  } else {
    for (const c of pd.convs) {
      const isSel = SELECTED_CONV === c.counterpart ? " selected" : "";
      const tag = c.kind === "group" ? "group" : c.is_internal ? "internal" : c.client_id ? "client" : "direct";
      html += `
        <div class="conv-item${isSel}" data-conv="${encodeURIComponent(c.counterpart)}">
          <div class="conv-row">
            <span class="conv-name">${escapeHtml(c.display_name)}</span>
            <span class="conv-time">${fmtTime(c.last_at)}</span>
          </div>
          <div class="conv-preview">
            <span class="conv-tag ${tag}">${tag}</span>${escapeHtml(fmtPreview(c))} · ${c.n}
          </div>
        </div>`;
    }
  }
  colConvs.innerHTML = html;
  for (const el of colConvs.querySelectorAll(".conv-item")) {
    el.addEventListener("click", () => selectConv(decodeURIComponent(el.dataset.conv)));
  }
}

async function renderThread() {
  if (!SELECTED_TEAM || !SELECTED_CONV) {
    colThread.innerHTML = `<div class="col-header">Messaggi</div><div class="empty">Seleziona una conversazione</div>`;
    return;
  }
  colThread.innerHTML = `<div class="col-header">Caricamento…</div>`;
  let payload;
  try {
    const r = await fetch(`/thread.json?member=${encodeURIComponent(SELECTED_TEAM)}&conv=${encodeURIComponent(SELECTED_CONV)}`);
    payload = await r.json();
  } catch (err) {
    colThread.innerHTML = `<div class="col-header">Errore</div><div class="empty">${escapeHtml(err.message)}</div>`;
    return;
  }
  const pd = DATA.by_phone[SELECTED_TEAM];
  const conv = pd.convs.find((c) => c.counterpart === SELECTED_CONV);
  let html = `
    <div class="thread-header">
      <div class="name">${escapeHtml(conv ? conv.display_name : SELECTED_CONV)}</div>
      <div class="sub">${payload.count} messaggi · team ${escapeHtml(SELECTED_TEAM)}</div>
    </div>
    <div class="thread-body">`;
  let lastDay = "";
  if (!payload.messages.length) {
    html += `<div class="empty">Nessun messaggio</div>`;
  }
  for (const m of payload.messages) {
    const d = new Date(m.message_date);
    const dayKey = d.toLocaleDateString("it-IT", { weekday: "long", day: "2-digit", month: "long" });
    if (dayKey !== lastDay) {
      html += `<div class="day-divider">${dayKey}</div>`;
      lastDay = dayKey;
    }
    const dir = m.direction === "outbound" ? "outbound" : "inbound";
    const sender = m.sender_phone || m.pushname || "";
    html += `
      <div class="msg ${dir}">
        ${sender && conv && conv.kind === "group" ? `<div class="sender">${escapeHtml(sender)}</div>` : ""}
        ${m.media_type ? `<span class="media-tag">${m.media_type}</span>` : ""}
        <div class="body">${escapeHtml(m.body || (m.media_type ? "[media]" : ""))}</div>
        <div class="meta">${fmtTime(m.message_date)}${m.media_mime ? " · " + escapeHtml(m.media_mime) : ""}</div>
      </div>`;
  }
  html += `</div>`;
  colThread.innerHTML = html;
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function selectTeam(phone) {
  if (SELECTED_TEAM === phone) return;
  SELECTED_TEAM = phone;
  SELECTED_CONV = null;
  renderTeams();
  renderConvs();
  renderThread();
}

function selectConv(conv) {
  SELECTED_CONV = conv;
  renderConvs();
  renderThread();
}

async function refresh() {
  try {
    const r = await fetch("/data.json");
    DATA = await r.json();
    document.getElementById("last-refresh").textContent =
      "refresh: " + new Date(DATA.generated_at).toLocaleTimeString("it-IT");
    if (!SELECTED_TEAM && DATA.team.length) SELECTED_TEAM = DATA.team[0].phone;
    renderTeams();
    renderConvs();
    renderThread();
  } catch (err) {
    colTeams.innerHTML = `<div class="col-header">Errore</div><div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

async function checkHealth() {
  try {
    const r = await fetch("/health.json");
    const h = await r.json();
    if (h.ok) {
      document.getElementById("db-host").textContent = "DB: " + h.db_url_host;
      document.getElementById("health-pill").style.background = "rgba(90,212,138,0.18)";
      document.getElementById("health-pill").style.color = "var(--bz-success)";
    } else {
      document.getElementById("db-host").textContent = "DB: ERROR";
    }
  } catch {}
}

checkHealth();
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
