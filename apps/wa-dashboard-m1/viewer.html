<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>BZ WhatsApp Dashboard — M1</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bz-base: #0c0c0e;
    --bz-panel: #14141a;
    --bz-panel-soft: #1c1c24;
    --bz-border: #2a2a36;
    --bz-text: #e9e9f0;
    --bz-text-dim: #8c8ca0;
    --bz-text-faint: #5a5a6a;
    --bz-accent: #d4845a;
    --bz-accent-soft: rgba(212,132,90,0.18);
    --bz-accent-glow: rgba(212,132,90,0.28);
    --bz-success: #5ad48a;
    --bz-warning: #d4b65a;
    --bz-error: #d45a5a;
    --bz-info: #5aa4d4;
    --bz-violet: #b85ad4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bz-base);
    color: var(--bz-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }
  header {
    height: 42px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--bz-border);
    background: var(--bz-panel);
  }
  header .brand {
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--bz-accent);
    font-size: 13px;
  }
  header .meta { color: var(--bz-text-dim); font-size: 11px; display: flex; gap: 10px; align-items: center; }
  header .badge {
    background: var(--bz-accent-soft); color: var(--bz-accent);
    padding: 2px 7px; border-radius: 4px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  main {
    height: calc(100vh - 42px);
    display: grid;
    grid-template-columns: 240px 380px 1fr;
  }
  .col { overflow-y: auto; border-right: 1px solid var(--bz-border); background: var(--bz-panel); }
  .col:last-child { border-right: none; background: var(--bz-base); }
  .col-header {
    position: sticky; top: 0; background: var(--bz-panel-soft);
    padding: 9px 12px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--bz-text-dim);
    border-bottom: 1px solid var(--bz-border); z-index: 10;
  }
  /* COL 1 — Team */
  .team-item { padding: 11px 12px; cursor: pointer; border-bottom: 1px solid var(--bz-border); transition: background 0.1s; }
  .team-item:hover { background: var(--bz-panel-soft); }
  .team-item.selected { background: var(--bz-accent-soft); border-left: 3px solid var(--bz-accent); padding-left: 9px; }
  .team-row { display: flex; justify-content: space-between; align-items: baseline; }
  .team-name { font-weight: 600; font-size: 13px; }
  .team-phone { font-size: 10px; color: var(--bz-text-dim); margin-top: 2px; font-family: ui-monospace, monospace; }
  /* Bridge health pill (Feature #2) */
  .team-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pill {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    text-transform: uppercase; letter-spacing: 0.4px;
    background: rgba(140,140,160,0.16); color: var(--bz-text-dim);
    font-family: ui-monospace, monospace;
  }
  .pill.running { background: rgba(90,212,138,0.18); color: var(--bz-success); }
  .pill.needs_qr { background: rgba(212,182,90,0.18); color: var(--bz-warning); }
  .pill.stopped { background: rgba(212,90,90,0.18); color: var(--bz-error); }
  .pill.attention { background: rgba(212,90,90,0.18); color: var(--bz-error); font-weight: 700; }
  .pill.attention-med { background: rgba(212,182,90,0.18); color: var(--bz-warning); }
  .pill.crm { background: rgba(90,212,138,0.18); color: var(--bz-success); }
  .pill.lid { background: rgba(135,147,168,0.18); color: var(--bz-info); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .dot.running { background: var(--bz-success); }
  .dot.needs_qr { background: var(--bz-warning); }
  .dot.stopped { background: var(--bz-error); }

  /* COL 2 — Conversations */
  .conv-item { padding: 11px 12px; cursor: pointer; border-bottom: 1px solid var(--bz-border); }
  .conv-item:hover { background: var(--bz-panel-soft); }
  .conv-item.selected { background: var(--bz-accent-soft); border-left: 3px solid var(--bz-accent); padding-left: 9px; }
  .conv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .conv-name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .conv-name.has-attention::before { content: "⚠ "; color: var(--bz-error); }
  .conv-time { font-size: 10px; color: var(--bz-text-dim); white-space: nowrap; font-family: ui-monospace, monospace; }
  .conv-company { font-size: 11px; color: var(--bz-text-dim); margin-top: 2px; font-style: italic; }
  .conv-preview {
    font-size: 11px; color: var(--bz-text-dim); margin-top: 5px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  }
  .conv-tag {
    display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.4px; margin-right: 4px; font-weight: 600;
  }
  .conv-tag.group    { background: rgba(123,108,88,0.20); color: #c0a888; }
  .conv-tag.direct   { background: rgba(212,132,90,0.18); color: var(--bz-accent); }
  .conv-tag.crm      { background: rgba(107,142,94,0.25); color: #8ec476; }
  .conv-tag.prospect { background: rgba(196,169,116,0.22); color: #d4be7e; }
  .conv-tag.internal { background: rgba(95,111,82,0.25); color: #9bb088; }
  .conv-tag.lid      { background: rgba(135,147,168,0.25); color: #a8b4c8; }
  .conv-tag.unknown  { background: rgba(184,179,160,0.20); color: #b8b3a0; }

  .conv-extra { font-size: 10px; color: var(--bz-text-faint); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  .conv-extra .meta-pill { background: rgba(140,140,160,0.12); padding: 1px 5px; border-radius: 3px; }

  /* COL 3 — Thread */
  .thread-header {
    position: sticky; top: 0; background: var(--bz-panel-soft);
    padding: 12px 16px; border-bottom: 1px solid var(--bz-border); z-index: 10;
  }
  .thread-header .name { font-weight: 600; font-size: 15px; }
  .thread-header .sub { font-size: 11px; color: var(--bz-text-dim); margin-top: 2px; }
  .thread-header .sub a { color: var(--bz-accent); text-decoration: none; }
  .thread-header .sub a:hover { text-decoration: underline; }

  /* Strategic recap card (Feature #11 — kita pattern) */
  .recap-card {
    margin: 12px 16px 0;
    padding: 12px 14px;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(212,132,90,0.13), rgba(212,132,90,0.03));
    border: 1px solid var(--bz-accent-glow);
  }
  .recap-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .recap-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--bz-accent); font-weight: 600; }
  .recap-source { font-size: 9px; text-transform: uppercase; color: var(--bz-text-faint); font-family: ui-monospace, monospace; }
  .recap-body { font-size: 13px; line-height: 1.5; white-space: pre-line; font-weight: 500; }

  .thread-body { padding: 14px 16px; }
  .msg { margin-bottom: 10px; padding: 9px 13px; border-radius: 8px; max-width: 72%; word-wrap: break-word; }
  .msg.inbound  { background: var(--bz-panel); border: 1px solid var(--bz-border); margin-right: auto; }
  .msg.outbound { background: var(--bz-accent-soft); border: 1px solid var(--bz-accent); margin-left: auto; }
  .msg.attention-high { border-left: 3px solid var(--bz-error); }
  .msg.attention-medium { border-left: 3px solid var(--bz-warning); }
  .msg .body { white-space: pre-wrap; line-height: 1.45; font-size: 13px; }
  .msg .meta { font-size: 10px; color: var(--bz-text-dim); margin-top: 5px; font-family: ui-monospace, monospace; }
  .msg .sender { font-size: 11px; color: var(--bz-accent); font-weight: 600; margin-bottom: 4px; }
  .msg .sender .role { font-size: 9px; color: var(--bz-text-dim); text-transform: uppercase; margin-left: 4px; }
  .msg .att-reason { font-size: 10px; color: var(--bz-error); margin-top: 4px; font-style: italic; }
  .media-tag { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 9px; background: var(--bz-panel-soft); color: var(--bz-text-dim); margin-right: 4px; text-transform: uppercase; }
  .media-thumb img, .media-thumb video { max-width: 240px; max-height: 240px; border-radius: 6px; margin-top: 6px; cursor: pointer; }
  .media-thumb audio { margin-top: 6px; }
  .media-thumb a { color: var(--bz-accent); font-size: 12px; }

  .empty { padding: 40px 20px; text-align: center; color: var(--bz-text-dim); font-size: 13px; }
  .loader { padding: 16px; color: var(--bz-text-dim); font-size: 12px; }
  .day-divider { text-align: center; color: var(--bz-text-dim); font-size: 10px; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.8px; }
</style>
</head>
<body>
<header>
  <div class="brand">BZ • WhatsApp Dashboard</div>
  <div class="meta">
    <span id="health-pill" class="badge">READ-ONLY</span>
    <span id="db-host">DB: …</span>
    <span id="last-refresh">refresh: …</span>
  </div>
</header>
<main>
  <div class="col" id="col-teams">
    <div class="col-header">Team</div>
    <div class="loader">Caricamento team…</div>
  </div>
  <div class="col" id="col-convs">
    <div class="col-header">Conversazioni</div>
    <div class="empty">Seleziona un team member</div>
  </div>
  <div class="col" id="col-thread">
    <div class="col-header">Messaggi</div>
    <div class="empty">Seleziona una conversazione</div>
  </div>
</main>
<script>
let DATA = null;
let SELECTED_TEAM = null;
let SELECTED_CONV = null;
const KITA_BASE = "https://kita.balizero.com";

const colTeams = document.getElementById("col-teams");
const colConvs = document.getElementById("col-convs");
const colThread = document.getElementById("col-thread");

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso); const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" });
  const y = new Date(now); y.setDate(y.getDate()-1);
  if (d.toDateString() === y.toDateString()) return "ieri " + d.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" });
  return d.toLocaleDateString("it-IT", { day:"2-digit", month:"2-digit" }) + " " + d.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" });
}

function fmtPreview(c) {
  if (c.last_body && c.last_body.trim()) return c.last_body;
  if (c.last_media) return "📎 " + c.last_media;
  return "(vuoto)";
}

function renderTeams() {
  if (!DATA) return;
  let html = `<div class="col-header">Team (${DATA.team.length})</div>`;
  for (const m of DATA.team) {
    const pd = DATA.by_phone[m.phone] || { total:0, direct_count:0, group_count:0, crm_count:0, attention:{high:0,medium:0} };
    const selected = SELECTED_TEAM === m.phone ? " selected" : "";
    const bridge = pd.bridge || {};
    const sess = pd.session || {};
    const status = bridge.runtime_status || "stopped";
    html += `
      <div class="team-item${selected}" data-phone="${m.phone}">
        <div class="team-row">
          <div class="team-name">${escapeHtml(m.name)}</div>
          <span class="pill ${status}"><span class="dot ${status}"></span>${status}</span>
        </div>
        <div class="team-phone">${escapeHtml(m.phone)}${bridge.pid ? ' · pid '+bridge.pid : ''}</div>
        <div class="team-pills">
          <span class="pill">${pd.total} msg</span>
          <span class="pill">d ${pd.direct_count}</span>
          <span class="pill">g ${pd.group_count}</span>
          ${pd.crm_count ? `<span class="pill crm">CRM ${pd.crm_count}</span>` : ""}
          ${pd.unresolved_lids ? `<span class="pill lid">lid ${pd.unresolved_lids}</span>` : ""}
          ${pd.attention.high   ? `<span class="pill attention">${pd.attention.high} HIGH</span>` : ""}
          ${pd.attention.medium ? `<span class="pill attention-med">${pd.attention.medium} MED</span>` : ""}
        </div>
        ${sess.messages_logged != null ? `
          <div class="conv-extra" style="margin-top:4px">
            <span class="meta-pill">DB ${sess.messages_logged}</span>
            ${sess.messages_filtered ? `<span class="meta-pill">filter ${sess.messages_filtered}</span>` : ""}
            ${sess.connected_at ? `<span class="meta-pill">conn ${new Date(sess.connected_at).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"})}</span>` : ""}
          </div>` : ""}
      </div>`;
  }
  colTeams.innerHTML = html;
  for (const el of colTeams.querySelectorAll(".team-item")) {
    el.addEventListener("click", () => selectTeam(el.dataset.phone));
  }
}

function renderConvs() {
  const pd = SELECTED_TEAM ? DATA.by_phone[SELECTED_TEAM] : null;
  if (!pd) {
    colConvs.innerHTML = `<div class="col-header">Conversazioni</div><div class="empty">Seleziona un team member</div>`;
    return;
  }
  // Sort: HIGH > MEDIUM > by last_at
  const convs = [...pd.convs].sort((a,b) => {
    const pa = a.attention_priority === "HIGH" ? 2 : a.attention_priority === "MEDIUM" ? 1 : 0;
    const pb = b.attention_priority === "HIGH" ? 2 : b.attention_priority === "MEDIUM" ? 1 : 0;
    if (pa !== pb) return pb - pa;
    return new Date(b.last_at) - new Date(a.last_at);
  });
  let html = `<div class="col-header">${convs.length} conversazioni · ${pd.attention.high} HIGH · ${pd.attention.medium} MED</div>`;
  if (!convs.length) {
    html += `<div class="empty">Nessuna conversazione</div>`;
  } else {
    for (const c of convs) {
      const isSel = SELECTED_CONV === c.counterpart ? " selected" : "";
      const tag = c.tag || (c.kind === "group" ? "group" : "direct");
      const tagLabel = tag === "crm" ? "CRM" : tag;
      const company = c.company_name && c.crm_match ? `<div class="conv-company">${escapeHtml(c.company_name)}</div>` : "";
      const attClass = c.attention_priority ? " has-attention" : "";
      const attBadge = c.attention_priority
        ? `<span class="conv-tag ${c.attention_priority === 'HIGH' ? 'crm' : 'prospect'}" style="background:rgba(212,90,90,${c.attention_priority==='HIGH'?'0.28':'0.14'});color:${c.attention_priority==='HIGH'?'#ff8080':'#d4b65a'}">${c.attention_priority}</span>`
        : "";
      const extra = [];
      if (c.client_id) extra.push(`<a href="${KITA_BASE}/clients/${c.client_id}" target="_blank" class="meta-pill" style="color:var(--bz-accent);text-decoration:none">CRM #${c.client_id} ↗</a>`);
      if (c.assigned_to) extra.push(`<span class="meta-pill">→ ${escapeHtml(c.assigned_to)}</span>`);
      if (c.tax_consultant) extra.push(`<span class="meta-pill">tax: ${escapeHtml(c.tax_consultant)}</span>`);
      html += `
        <div class="conv-item${isSel}" data-conv="${encodeURIComponent(c.counterpart)}">
          <div class="conv-row">
            <span class="conv-name${attClass}">${escapeHtml(c.display_name)}</span>
            <span class="conv-time">${fmtTime(c.last_at)}</span>
          </div>
          ${company}
          <div class="conv-preview">
            <span class="conv-tag ${tag}">${tagLabel}</span>${attBadge}${escapeHtml(fmtPreview(c))} · ${c.n}
          </div>
          ${extra.length ? `<div class="conv-extra">${extra.join("")}</div>` : ""}
        </div>`;
    }
  }
  colConvs.innerHTML = html;
  for (const el of colConvs.querySelectorAll(".conv-item")) {
    el.addEventListener("click", (e) => {
      if (e.target.tagName === "A") return;
      selectConv(decodeURIComponent(el.dataset.conv));
    });
  }
}

function renderMedia(m) {
  if (!m.media_type) return "";
  const path = m.media_stored_path;
  if (!path) {
    return `<div class="media-thumb"><span class="media-tag">${m.media_type}</span> <em>media non scaricato</em></div>`;
  }
  const url = `/media?path=${encodeURIComponent(path)}`;
  switch (m.media_type) {
    case "image":   return `<div class="media-thumb"><a href="${url}" target="_blank"><img src="${url}" alt="image"/></a></div>`;
    case "video":   return `<div class="media-thumb"><video controls src="${url}"></video></div>`;
    case "audio":   return `<div class="media-thumb"><audio controls src="${url}"></audio></div>`;
    case "sticker": return `<div class="media-thumb"><img src="${url}" alt="sticker" style="max-width:100px"/></div>`;
    case "document":
      return `<div class="media-thumb"><a href="${url}" target="_blank">📄 ${escapeHtml(m.media_mime || "document")} ↗</a></div>`;
    default: return `<div class="media-thumb"><span class="media-tag">${m.media_type}</span></div>`;
  }
}

async function renderThread() {
  if (!SELECTED_TEAM || !SELECTED_CONV) {
    colThread.innerHTML = `<div class="col-header">Messaggi</div><div class="empty">Seleziona una conversazione</div>`;
    return;
  }
  colThread.innerHTML = `<div class="col-header">Caricamento…</div>`;
  let payload;
  try {
    const r = await fetch(`/thread.json?member=${encodeURIComponent(SELECTED_TEAM)}&conv=${encodeURIComponent(SELECTED_CONV)}`);
    payload = await r.json();
  } catch (err) {
    colThread.innerHTML = `<div class="col-header">Errore</div><div class="empty">${escapeHtml(err.message)}</div>`;
    return;
  }
  const pd = DATA.by_phone[SELECTED_TEAM];
  const conv = pd.convs.find((c) => c.counterpart === SELECTED_CONV);

  // Strategic recap (Feature #11)
  const recap = conv && (conv.strategic_recap || conv.sender_strategic_recap);
  const recapSrc = conv && (conv.strategic_recap_source || (conv.sender_strategic_recap ? "wa_thread" : null));
  const recapHtml = recap ? `
    <div class="recap-card">
      <div class="recap-header">
        <span class="recap-label">◆ Strategic recap</span>
        ${recapSrc ? `<span class="recap-source">${escapeHtml(recapSrc.replace(/_/g, " "))}</span>` : ""}
      </div>
      <div class="recap-body">${escapeHtml(recap)}</div>
    </div>` : "";

  const clientLink = conv && conv.client_id
    ? ` · <a href="${KITA_BASE}/clients/${conv.client_id}" target="_blank">apri in kita.balizero.com ↗</a>`
    : "";

  let html = `
    <div class="thread-header">
      <div class="name">${escapeHtml(conv ? conv.display_name : SELECTED_CONV)}</div>
      <div class="sub">${payload.count} messaggi · team ${escapeHtml(SELECTED_TEAM)}${clientLink}</div>
    </div>
    ${recapHtml}
    <div class="thread-body">`;
  let lastDay = "";
  if (!payload.messages.length) html += `<div class="empty">Nessun messaggio</div>`;
  for (const m of payload.messages) {
    const d = new Date(m.message_date);
    const dayKey = d.toLocaleDateString("it-IT", { weekday: "long", day: "2-digit", month: "long" });
    if (dayKey !== lastDay) { html += `<div class="day-divider">${dayKey}</div>`; lastDay = dayKey; }
    const dir = m.direction === "outbound" ? "outbound" : "inbound";
    const attClass = m.attention_priority && !m.attention_resolved_at
      ? ` attention-${m.attention_priority.toLowerCase()}` : "";
    const senderName = m.sender_display || m.sender_phone || "";
    const senderRole = m.sender_client_id ? "CRM" : (m.sender_crm_name ? "CRM" : "");
    const senderLine = senderName && conv && conv.kind === "group"
      ? `<div class="sender">${escapeHtml(senderName)}${m.sender_company ? " · "+escapeHtml(m.sender_company) : ""}${senderRole ? `<span class="role">${senderRole}</span>` : ""}</div>`
      : "";
    const attReason = m.attention_reason && m.attention_reason.length && !m.attention_resolved_at
      ? `<div class="att-reason">⚠ ${escapeHtml(m.attention_reason.join(", "))}</div>`
      : "";
    html += `
      <div class="msg ${dir}${attClass}">
        ${senderLine}
        ${m.media_type ? `<span class="media-tag">${m.media_type}</span>` : ""}
        ${m.body ? `<div class="body">${escapeHtml(m.body)}</div>` : ""}
        ${renderMedia(m)}
        ${attReason}
        <div class="meta">${fmtTime(m.message_date)}${m.media_mime ? " · " + escapeHtml(m.media_mime) : ""}</div>
      </div>`;
  }
  html += `</div>`;
  colThread.innerHTML = html;
}

function selectTeam(phone) {
  if (SELECTED_TEAM === phone) return;
  SELECTED_TEAM = phone;
  SELECTED_CONV = null;
  renderTeams(); renderConvs(); renderThread();
}
function selectConv(conv) {
  SELECTED_CONV = conv;
  renderConvs(); renderThread();
}

async function refresh() {
  try {
    const r = await fetch("/data.json");
    DATA = await r.json();
    document.getElementById("last-refresh").textContent = "refresh: " + new Date(DATA.generated_at).toLocaleTimeString("it-IT");
    if (!SELECTED_TEAM && DATA.team.length) SELECTED_TEAM = DATA.team[0].phone;
    renderTeams(); renderConvs(); renderThread();
  } catch (err) {
    colTeams.innerHTML = `<div class="col-header">Errore</div><div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

async function checkHealth() {
  try {
    const r = await fetch("/health.json");
    const h = await r.json();
    if (h.ok) {
      document.getElementById("db-host").textContent = "DB: " + h.db_url_host;
      document.getElementById("health-pill").style.background = "rgba(90,212,138,0.18)";
      document.getElementById("health-pill").style.color = "var(--bz-success)";
    }
  } catch {}
}

checkHealth();
