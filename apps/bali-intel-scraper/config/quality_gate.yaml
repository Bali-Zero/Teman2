# Quality Gate Configuration — Intel Pipeline
# All weights, thresholds, and keyword lists are configurable here.
# Changes take effect on next pipeline run (no restart needed).

# Dimension weights (must sum to 1.0)
weights:
  relevance: 0.35
  urgency: 0.20
  reliability: 0.20
  business_impact: 0.25

# Routing thresholds (composite score 0.0–1.0)
thresholds:
  auto_publish: 0.70   # ≥ 0.70 → auto-publish + alert team
  review: 0.40          # 0.40–0.69 → queue for manual review
  # below 0.40 → archive (kept, not discarded)

# ─── Dimension 1: Relevance ─────────────────────────────────────────────

