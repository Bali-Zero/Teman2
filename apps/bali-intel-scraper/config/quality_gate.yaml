  # Weight per topic (higher = more important for scoring)
  topic_weights:
    visa: 1.0
    immigration: 1.0
    company: 0.90
    tax: 0.85
    property: 0.80
    employment: 0.90
    bali_economy: 0.70

# ─── Dimension 2: Urgency ───────────────────────────────────────────────

urgency:
  freshness_half_life_hours: 48  # articles lose 50% urgency score after 48h

  # Keywords that signal breaking/urgent news
  keywords:
    - breaking
    - urgent
    - darurat
    - segera
    - efektif mulai
    - berlaku mulai
    - effective immediately
    - new regulation
    - peraturan baru
    - deadline
    - batas waktu
    - ditangkap
    - arrested
    - razia
    - operasi
    - pendeportasian
    - deportasi massal
    - penutupan
    - moratorium
    - larangan
    - banned
    - suspended
    - dicabut

