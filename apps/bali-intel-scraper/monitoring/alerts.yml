# Prometheus Alert Rules
groups:
  - name: bali-intel-alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(bali_intel_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10% for 5 minutes"

      # Scraper down
      - alert: ScraperDown
        expr: up{job="bali-intel-scraper"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scraper is down"
          description: "Bali Intel Scraper has been down for more than 1 minute"

      # Database connection issues
      - alert: DatabaseConnectionError
        expr: bali_intel_db_connection_errors_total > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Database connection issues"
          description: "Multiple database connection errors detected"

      # Low success rate
      - alert: LowSuccessRate
        expr: |
          (
            rate(bali_intel_scraper_success_total[10m]) /
            rate(bali_intel_scraper_total[10m])
          ) < 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low scraper success rate"
          description: "Success rate is below 80%"

      # Queue backlog
      - alert: QueueBacklog
        expr: bali_intel_task_queue_pending > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Task queue backlog"
          description: "More than 1000 tasks pending in queue"

      # Memory usage
      - alert: HighMemoryUsage
        expr: |
          (
            process_resident_memory_bytes{job="bali-intel-scraper"} /
            1024 / 1024 / 1024
          ) > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 4GB"
