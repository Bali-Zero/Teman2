app = 'nuzantara-admin'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = "3000"
  NEXT_PUBLIC_API_URL = "https://nuzantara-admin.fly.dev"


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
