[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-os-core"
version = "1.0.0"
description = "Canonical Research OS contracts and validators"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.12.5",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["research_os*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["../../apps/backend-rag/backend/tests/unit/research_os"]
pythonpath = ["."]

[tool.ruff]
# Root cause of L1301: with no local [tool.ruff] table, ruff's config
# discovery stops at THIS file (nearest ancestor pyproject.toml) and never
# walks up to apps/backend-rag/pyproject.toml's [tool.ruff] (line-length=100)
# — every file here silently formatted/linted to ruff's bare defaults
# (line-length 88) instead, and the verdict flipped depending on whether an
# invocation happened to pass --config explicitly.
extend = "../../apps/backend-rag/pyproject.toml"
