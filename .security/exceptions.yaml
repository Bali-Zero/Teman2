# CVE exceptions — HIGH/CRITICAL findings temporarily accepted.
#
# See docs/security/CVE_TRIAGE_POLICY.md for the approval process and schema.
#
# Each entry ignores a single CVE in the Snyk/Safety blocking gates until
# `expires_at`. A pre-deploy check (`scripts/check_cve_exceptions.py`) refuses
# to deploy once `expires_at` is in the past — renewal requires an explicit PR.
#
# Keep this list SHORT. An exception is a deferred fix, not a permanent pass.

exceptions: []
