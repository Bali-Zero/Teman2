#   package: example-package
#   version: "1.2.3"
#   reason: "Upstream fix blocked on breaking change in 2.0.0; backport PR #42 merging soon"
#   approved_by: zero
#   approved_at: 2026-04-18
#   expires_at: 2026-07-18
#   tracking_issue: "#456"
