repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
        language_version: python3

  # Ruff (lint + format) — replaces Black + flake8/isort/pyupgrade.
  # Bumped 2026-05-18 from v0.1.8 (Dec 2023) → v0.15.13 (current stable, 2026-05).
  # ruff-format replaces psf/black 1:1 — Black hook removed in same commit.
  # See: chore/precommit-ruff-format-mypy-gate-2026-05-18 (audit modernization finding #6).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        files: ^apps/backend-rag/
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^apps/backend-rag/

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^apps/mouth/
        types: [file]
        types_or: [javascript, jsx, ts, tsx]
        additional_dependencies:
          - eslint@8.56.0
          - "@typescript-eslint/eslint-plugin@6.19.0"
          - "@typescript-eslint/parser@6.19.0"

  - repo: local
    hooks:
      - id: no-print-statements
        name: No print() statements
        entry: bash -c 'if grep -r "print(" --include="*.py" $@; then echo "❌ Found print() statements. Use logger instead."; exit 1; fi'
        language: system
        files: ^apps/backend-rag/.*\.py$
        pass_filenames: false

      - id: no-console-statements
        name: No console statements
        entry: bash -c 'if grep -r "console\.\(log\|debug\|info\|warn\|error\)" --include="*.ts" --include="*.tsx" $@ | grep -v "apps/webapp/src/lib/ai-bridge.ts"; then echo "❌ Found console statements. Use logger instead."; exit 1; fi'
        language: system
        files: ^apps/(mouth|webapp)/.*\.(ts|tsx)$
        pass_filenames: false

      - id: check-todos
        name: Check TODO/FIXME
        entry: bash -c 'if grep -r "TODO\|FIXME\|HACK\|BUG" --include="*.py" --include="*.ts" --include="*.tsx" $@; then echo "⚠️  Found TODO/FIXME. Consider creating GitHub issues."; fi'
        language: system
        files: ^apps/
        pass_filenames: false

      # ── ANTI-ROGUE-AI GATES ─────────────────────────────────────────────────
      # Prevents Gemini/Windsurf/Cursor from silently breaking the import chain
      # or modifying OFF-LIMITS files. Both hooks BLOCK the commit on failure.
      # Scripts live in scripts/hooks/ to avoid inline quoting complexity.

      - id: import-chain-gate
        name: "FastAPI import chain (anti-rogue-AI)"
        language: script
        entry: scripts/hooks/check_import_chain.sh
        pass_filenames: false
        files: ^apps/backend-rag/backend/

      - id: protected-files-gate
        name: "Block edits to OFF-LIMITS files"
        language: script
        entry: scripts/hooks/check_protected_files.sh
        pass_filenames: false
        always_run: true

      - id: root-guard
        name: "Root whitelist (prevent scratch accumulation)"
        entry: python scripts/root_guard.py
        language: system
        # Only runs against files added/modified at repo root (no slash in path).
        # The script accepts file paths as argv and exits 1 if any is not whitelisted.
        files: ^[^/]+$

      # ── MYPY GATE on dependencies.py (cicatrix SPOF guard 2026-05-18) ───────
      # The "Rogue AI Import Removal" cicatrix (2026-04-21) documents how AI
      # refactors silently remove `Any` from typing imports in
      # backend/app/dependencies.py — that file is imported by EVERY router,
      # so a missing symbol crashes the entire FastAPI app at startup.
      # mypy --strict on this single file would have caught it pre-commit.
      # Scoped intentionally to ONE file (not full backend) to stay fast and
      # to avoid blocking commits on the ~960 typing debts in the wider tree.
      # Uses `language: python` + additional_dependencies so mypy ships in an
      # isolated pre-commit env (works even if user shell has no venv active).
      - id: mypy-dependencies-py
        name: mypy --strict on dependencies.py (cicatrix SPOF guard)
        entry: mypy --strict --no-error-summary --ignore-missing-imports apps/backend-rag/backend/app/dependencies.py
        language: python
        additional_dependencies:
          - mypy>=1.13.0
        files: ^apps/backend-rag/backend/app/dependencies\.py$
        pass_filenames: false

      - id: validate-organs-registry
        name: "Validate apps/organism/organism/organs_registry.yaml"
        # Runs ONLY when organs_registry.yaml is staged. NB-1 ADR-7
        # HALT-on-mismatch: if the recorded SHA256 checksum does not match
        # the canonical organ list, the commit is rejected. To update after
        # a legitimate edit:
        #   PYTHONPATH=apps/organism python -m organism.tools.validate_organs_registry \
        #     --update-checksum
        # Renamed 2026-05-08 (IG-3) from validate-genome / genome.yaml.
        # Backward-compat alias `validate_genome` still works (deprecated,
        # removal 2026-06-08).
        entry: bash -c 'PYTHONPATH=apps/organism python3 -m organism.tools.validate_organs_registry apps/organism/organism/organs_registry.yaml'
        language: system
        files: ^apps/organism/organism/organs_registry\.yaml$
        pass_filenames: false
