global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Backend API metrics
  - job_name: "nuzantara-backend"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Redis metrics
  - job_name: "redis"
    static_configs:
      - targets: ["nuzantara-redis-exporter:9121"]
    scrape_interval: 10s

  # PostgreSQL metrics
  - job_name: "postgresql"
    static_configs:
      - targets: ["nuzantara-postgres-exporter:9187"]
    scrape_interval: 15s
