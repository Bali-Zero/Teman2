name: Magazine auto-assets contract

on:
  pull_request:
    paths:
      - ".github/workflows/magazine-auto-assets.yml"
      - "apps/bali-zero-magazine/tests/deployed-platform.test.mjs"
      - "apps/zantara-media/**"
      - "docs/runbooks/bali-zero-magazine.md"
      - "infra/launchagents/wrappers/bali-zero-magazine-publish.sh"
      - "scripts/flowkit_cli.py"
      - "scripts/tests/test_flowkit_cli.py"
      - "scripts/tests/test_magazine_wrapper_lock.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/magazine-auto-assets.yml"
      - "apps/bali-zero-magazine/tests/deployed-platform.test.mjs"
      - "apps/zantara-media/**"
      - "docs/runbooks/bali-zero-magazine.md"
      - "infra/launchagents/wrappers/bali-zero-magazine-publish.sh"
      - "scripts/flowkit_cli.py"
      - "scripts/tests/test_flowkit_cli.py"
      - "scripts/tests/test_magazine_wrapper_lock.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magazine-auto-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deployed-platform:
    name: Magazine deployed-platform contract
    runs-on: ubuntu-latest
    # Floor is the CHECKOUT, not the script (scripts/lint_workflow_timeout_floor.py).
    # Was 5; 11% of 645 sampled checkouts here exceed 60s, worst observed 599s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify publisher wrapper contract
        run: >-
          node --experimental-strip-types --test
          apps/bali-zero-magazine/tests/deployed-platform.test.mjs

  python-lifecycle:
    name: Magazine Python lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: apps/zantara-media
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: >-
          python -m pip install --quiet
          pytest pytest-asyncio httpx Pillow cryptography pydantic rfc8785
      - name: Require zsh for real wrapper lifecycle tests
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes zsh
          fi
          command -v zsh
      - name: Verify magazine asset lifecycle contracts
        # Whole DIRECTORY, not a named subset (widened 2026-08-07 with the GARUDA
        # decommission). This is the only job that installs apps/zantara-media's
        # dependencies, so it is the only one that CAN run its tests: the lean
        # immune-enforcement job runs on a bare interpreter and dies on `pydantic`.
        # Naming three files left tests/test_dlp.py and tests/test_image_handler.py
        # with no runner anywhere. A directory cannot go stale as files come and go;
        # test_zantara_media_suite_has_a_runner.py (required, dependency-free) fails
        # if this ever narrows back to a file list.
        run: >-
          python -m pytest -q
          apps/zantara-media/tests
          scripts/tests/test_flowkit_cli.py
          scripts/tests/test_magazine_wrapper_lock.py
