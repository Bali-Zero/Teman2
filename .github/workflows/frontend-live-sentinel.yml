name: Frontend Live Sentinel

# 2026-07-27: balizero.com served 13-hour-old code while 25 commits landed on main. Nothing
# said so. The Vercel GitHub App had lost its installation on the repo, so no deployment was
# ever created — and because balizero.com plus every subdomain (kita/my/prime/visa/tax/zantara)
# lives on ONE Vercel project, the whole public surface was frozen, not one page.
#
# The workflow that carried the right name — "Vercel Build Guard" — printed
# "Frontend files changed - Vercel build proceeding" and verified nothing. It was green
# throughout. This replaces it.
#
# This job asks no registry whether a deploy was ANNOUNCED. It asks production which commit it
# is RUNNING. That distinction matters twice over:
#   1. GitHub's deployments API measures reporting, not deploying — it has been observed frozen
#      while Vercel was in fact deploying, so a check built on it cries wolf.
#   2. A deployment can go READY and still leave the custom domains pointed at the previous
#      build. That happened the same day: perfect success in every record, stale page in
#      production. Only a behavioural probe sees it.
#
# No new credentials: it reads a public endpoint.
# Scar family #2 (exists != armed), plus the W88 rule — verify by content, never by proxy.
#
# ---------------------------------------------------------------------------------------
# 2026-07-28, three changes, each paid for by something measured the night before.
#
# A SCHEDULE, because a push trigger cannot see a silence. The App is still uninstalled —
# vercel[bot]'s last GitHub Deployment is 2026-07-26T20:07:27Z, none since. Overnight,
# production sat 6 hours and 8 commits behind main and this workflow never ran once: none of
# those commits touched a frontend path, so nothing woke it. A sentinel that can only speak
# when the thing it guards is being changed is blind exactly when the change stops arriving.
#
# THE VERDICT IS "DOES PRODUCTION INCLUDE THIS COMMIT", NOT "DOES IT EQUAL THIS SHA". The
# test is ancestry — production may legitimately be AHEAD of it, never behind. Ancestry is the right
# semantic here and not a W88-style lying proxy: both shas live on main's linear history, and
# a served sha that is absent from history fails closed rather than passing.
#
# ONE ALERT PER STALE COMMIT. At */30 a permanent outage would send 48 Telegrams a day, and a
# channel that always shouts is a channel nobody reads (the P0 budget is 12/day). The cache
# key is the expected sha, so a NEW stale commit still speaks immediately.
#
# ---------------------------------------------------------------------------------------
# 2026-07-30: THE PREMISE ABOVE HAS EXPIRED — the App is installed again, and the failure
# mode changed underneath it. Measured today: vercel[bot] created 12 GitHub Deployments in a
# single morning, so "no deployment is created at all" is no longer what bites. What bites now
# is the other mode: a production deployment IS created (3s after the merge), reaches READY
# after a real 6-minute build, and the custom domains keep serving the previous one. Vercel's
# commit status on the merge commit sits at "Waiting for checks to complete" and never
# resolves, while `autoAssignCustomDomains` is true — so the record says gated, not broken.
#
# This is why the failure text below now leads with the cure instead of with a cause, and why
# it carries a one-line test to tell the two modes apart. A diagnosis is a measurement of the
# world on the day it was written, and it expires exactly like the thing it describes: the
# 07-28 text would have sent whoever read it this morning to re-install an App that was
# already installed (W106 second degree — the cure and the message that explains it are born
# of the same belief and go stale together).
#
# The alert also stopped saying "owner only". `scripts/vercel_prod_deploy.py` reads the Vercel
# CLI's own OAuth token, and M5 has had one since 2026-07-30 13:00 WITA — a session can cure
# this without waiting for anybody. Verified today: the script's --dry-run read the API and
# correctly reported production already current.

on:
  push:
    branches: [main]
    paths:
      - "apps/mouth/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - "apps/mouth/vercel.json"
      - ".github/workflows/frontend-live-sentinel.yml"
  schedule:
    # DECLARED every 30 minutes. DELIVERED far less often, and the gap is not a detail anyone
    # sizing an incident response should have to discover the hard way.
    #
    # Measured on this repo 2026-07-28, on a workflow that has asked for `*/15` for months
    # (cron-fly-restart-detector.yml): over 16 continuous hours its scheduled runs arrive at a
    # MEDIAN interval of 91 minutes — 63, 64, 65, 77, 90, 94, 111, 150, 157. Six times slower
    # than declared, worst case ten. GitHub documents that scheduled workflows are delayed
    # under load and may be dropped entirely; with 86 workflows here, that is the steady state,
    # not a bad night. GitHub Status reported Actions fully operational throughout.
    #
    # So: a `cron:` expression is a request, never an interval, and this sentinel's real
    # worst-case detection latency is roughly an hour — still two orders of magnitude better
    # than the 13-hour silence it exists to prevent, but do not promise 30 minutes to anyone.
    # The `push` trigger above is what fires promptly; the schedule is the backstop that
    # notices a silence, and a backstop is allowed to be slow.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  # A newer push makes this wait irrelevant: only the latest sha on main matters. The event
  # name is part of the group on purpose — a scheduled tick must never cancel an in-flight
  # push run: a cancelled run reports neither pass nor fail, which is how a red turns silent.
  group: frontend-live-sentinel-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  is-production-serving-this-commit:
    name: Is production serving this commit?
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # full history: the ancestry test needs both shas present
          # blob:none — every commit and tree, file contents fetched on demand. A full clone
          # of this repo moves 2,289 MB and has already eaten an entire job budget elsewhere.
          filter: blob:none

      - name: Which commit must production include?
        id: expected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          sha=$(git log -1 --format=%H -- \
            apps/mouth packages package.json package-lock.json vercel.json)
          if [ -z "$sha" ]; then
            echo "::warning::no commit touches the deploy-relevant paths — nothing to assert"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age_s=$(( $(date -u +%s) - $(git show -s --format=%ct "$sha") ))
          echo "expected  : $sha"
          echo "age       : $(( age_s / 60 )) min"
          echo "event     : $EVENT"

          # One decision, one write per key: a duplicated key in $GITHUB_OUTPUT is a coin toss
          # nobody should have to reason about.
          skip=false
          attempts=3
          grace_s=1800
          if [ "$EVENT" != "schedule" ] && [ "$age_s" -lt "$grace_s" ]; then
            attempts=$(( (grace_s - age_s + 59) / 60 + 1 ))
          elif [ "$age_s" -lt "$grace_s" ]; then
            echo "::notice::expected commit is $(( age_s / 60 )) min old — inside the deploy window, deferring to the push run"
            skip=true
          fi

          {
            echo "skip=$skip"
            echo "sha=$sha"
            echo "age_min=$(( age_s / 60 ))"
            echo "attempts=$attempts"
          } >> "$GITHUB_OUTPUT"

      - name: Poll kita.balizero.com until it includes that commit
        id: probe
        if: steps.expected.outputs.skip != 'true'
        env:
          SHA: ${{ steps.expected.outputs.sha }}
          ATTEMPTS: ${{ steps.expected.outputs.attempts }}
        run: |
          set -uo pipefail
          URL="https://kita.balizero.com/api/health"
          seen=""
          for i in $(seq 1 "$ATTEMPTS"); do
            # Capture the exit code directly — never through a pipe, which reports the pipe's.
            # And capture it errexit-immune (W101): this file declares no `shell:`, so Actions
            # runs the block as `bash -e`, and a bare `body=$(curl …)` aborts the whole step on
            # the first failed curl — the retry loop below it could never run. The `|| rc=$?`
            # puts the assignment in a condition context, which errexit ignores.
            rc=0
            body=$(curl -fsS --max-time 25 "$URL" 2>&1) || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "attempt $i/$ATTEMPTS - curl rc=$rc: ${body:0:160}"
              sleep 60; continue
            fi
            live=$(printf '%s' "$body" | jq -er '.commit | select(type == "string") | select(test("^[0-9a-f]{40}$"))') || live=""
            if [ -z "$live" ]; then
              # Field absent: production predates the change that introduces it, or someone
              # removed it. Neither is evidence of health, so this is not a pass.
              echo "attempt $i/$ATTEMPTS - /api/health exposes no .commit (production older than this probe?)"
              seen="(no .commit field)"
              sleep 60; continue
            fi
            seen="$live"
            if ! git cat-file -e "$live^{commit}" 2>/dev/null; then
              git fetch --quiet origin main || true
            fi
            # Ancestor-or-equal: production is allowed to be AHEAD of the expected commit
            # (a later e2e-only or CI-only commit deployed with something else), never behind.
            # An unknown sha makes this exit non-zero, which is a fail — deliberately closed.
            if git merge-base --is-ancestor "$SHA" "$live" 2>/dev/null; then
              echo "attempt $i/$ATTEMPTS - production serves ${live:0:8}, which includes ${SHA:0:8}"
              echo "OK - kita.balizero.com includes this commit."
              exit 0
            fi
            echo "attempt $i/$ATTEMPTS - production serves ${live:0:8}, which does NOT include ${SHA:0:8}"
            sleep 60
          done
          echo "::error::kita.balizero.com did not prove inclusion of $SHA (last seen: ${seen:-no response})."
          echo "The kita frontend did not prove it includes the expected commit."
          echo
          echo "CURE FIRST — one command covers both failure modes below, and diagnoses as it goes:"
          echo "    python3 scripts/vercel_prod_deploy.py             # deploy main HEAD, then promote"
          echo "    python3 scripts/vercel_prod_deploy.py --dry-run   # report the gap, change nothing"
          echo "It authenticates off the Vercel CLI's own OAuth token, so it needs a machine where"
          echo "'vercel whoami' answers. M5 is one since 2026-07-30 13:00 WITA: this is NOT owner-only,"
          echo "a session can cure it. If 'vercel whoami' is silent there, THAT is the operator ask."
          echo
          echo "WHICH MODE YOU ARE IN (they need different fixes, and the answer changes over time):"
          echo "  A) A production deployment exists and reached READY, but the custom domains were"
          echo "     never repointed to it. This is the mode measured live on 2026-07-30: build Ready,"
          echo "     autoAssignCustomDomains true, Vercel's commit status stuck at 'Waiting for checks"
          echo "     to complete'. Cure: the script above (or POST /v10/projects/<id>/promote/<dpl>)."
          echo "  B) No deployment is created at all, because the Vercel GitHub App lost its"
          echo "     installation — true 2026-07-26 through 07-28, NOT true on 07-30."
          echo "     Fix (GUI, owner only): https://github.com/apps/vercel -> Configure -> grant"
          echo "     access to this repository. The script above still works meanwhile: it deploys"
          echo "     via gitSource, which does not need the project's git link."
          echo
          echo "TELL THEM APART IN ONE CALL — does the App still create deployments?"
          echo "    gh api 'repos/$GITHUB_REPOSITORY/deployments?per_page=20' --jq '.[].creator.login' | sort | uniq -c"
          echo "  vercel[bot] rows present  => mode A (it builds; the domains are the problem)."
          echo "  no vercel[bot] rows       => mode B (nothing is being built at all)."
          exit 1

      # Dedup lives between the failure and the alert, never inside the alert: the cache is
      # keyed by the expected sha, so a permanent outage speaks once and a NEW stale commit
      # speaks again immediately.
      - name: Has this stale commit already been announced?
        id: announced
        if: failure()
        uses: actions/cache/restore@v6
        with:
          path: .stale-alert-marker
          key: frontend-stale-alert-${{ steps.expected.outputs.sha }}

      - name: Tell Telegram once the silence is confirmed
        if: failure() && steps.announced.outputs.cache-hit != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SHA: ${{ steps.expected.outputs.sha }}
          AGE_MIN: ${{ steps.expected.outputs.age_min }}
        run: |
          set -uo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::warning::Telegram secrets absent - no alert sent"
            exit 0
          fi
          MSG="[FRONTEND STALE] kita.balizero.com did not prove it includes ${SHA:0:8} (${AGE_MIN} min old). Proof source: https://kita.balizero.com/api/health .commit and git ancestry. CURE, not owner-only: run 'python3 scripts/vercel_prod_deploy.py' from a machine where 'vercel whoami' answers (M5 does since 2026-07-30). If it reports no deployment is ever created, the Vercel GitHub App lost its install: github.com/apps/vercel -> Configure -> grant repo access."
          # Judge the REPLY, not the exit code: curl exits 0 even when Telegram refuses.
          # Capture errexit-immune (W101) — under the default `bash -e` a bare assignment
          # would abort here on a network failure, and this alert exists precisely for the
          # case where things are already going wrong.
          rc=0
          resp=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$MSG" 2>&1) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::curl to Telegram failed (rc=$rc): ${resp:0:200}"
            exit 0
          fi
          case "$resp" in
            *'"ok":true'*) echo "Telegram alert delivered" ;;
            *) echo "::warning::Telegram REFUSED the alert: ${resp:0:200}"; exit 0 ;;
          esac
          date -u +%FT%TZ > .stale-alert-marker

      # Saved only when an alert actually went out, so a refused Telegram does not buy silence
      # for the next 30 minutes.
      - name: Remember that this stale commit was announced
        if: failure() && steps.announced.outputs.cache-hit != 'true' && hashFiles('.stale-alert-marker') != ''
        uses: actions/cache/save@v6
        with:
          path: .stale-alert-marker
          key: frontend-stale-alert-${{ steps.expected.outputs.sha }}
