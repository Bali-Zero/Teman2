name: Auto-Practice Creator - Daily Job

on:
  schedule:
    # Run daily at 7:00 AM Singapore Time (SGT = UTC+8)
    # 11:00 PM UTC = 7:00 AM SGT next day
    - cron: "0 23 * * *"

  workflow_dispatch: # Allow manual trigger

jobs:
  auto-practice-creator:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: apps/backend-rag
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg structlog prometheus-client pydantic-settings

      - name: Run auto-practice-creator job
        working-directory: apps/backend-rag
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: |
          python -m backend.jobs.auto_practice_creator

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Auto-Practice Creator Job Failed',
              body: `The auto-practice creator job failed on ${new Date().toISOString()}.
              
              **Run Details:**
              - Workflow: ${{ github.workflow }}
              - Run ID: ${{ github.run_id }}
              - Triggered by: ${{ github.event_name }}
              
              **Action Required:**
              1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              2. Verify DATABASE_URL secret is configured
              3. Check database connectivity
              4. Review practice_types table (renewal codes must exist)
              5. Run manually if needed: \`PYTHONPATH=. python -m backend.jobs.auto_practice_creator\`
              
              **Next Steps:**
              - Investigate the failure reason
              - Fix the issue
              - Re-run the workflow manually if needed
              - Close this issue once resolved`,
              labels: ['bug', 'auto-practice-creator', 'cron-job']
            })
