name: adversarial-review-gate

# R1 "generator != grader" T-GATE (docs/specs/rules-as-harness-and-simulation-chamber-v1.md
# section 2/R1): research/audit deliverables must carry an adversarial review by a seat
# != author. Deterministic gate, stdlib-only script — see scripts/check_adversarial_review.py
# for the full contract and scar refs (superscar #3 guilt+innocence, W81 armed-not-theater,
# W86 same-PR discipline).
#
# env-var indirection (BASE_REF in `env:`, never inline into `run:`) per workflow-injection
# hygiene — the PR base-ref name never gets shell-expanded directly into a command string.
#
# NO `paths:` filter, deliberately: this check is REQUIRED on main branch protection.
# A path-filtered required check never reports on PRs outside its paths, which leaves
# them stuck at "Expected — waiting for status" forever. The gate script already
# handles the out-of-scope case (exit 0, "no research files in scope" — proven by
# --selftest), so running on every PR costs ~30s and blocks nothing innocent.

on:
  pull_request:
  merge_group:

# Suffixed by github.run_id, which is unique per run and therefore never
# collides — the prior no-concurrency-block behavior (every run fully
# independent) is preserved exactly. A shared per-workflow group keyed on
# github.actor was removed 2026-09-02: GitHub keeps only ONE pending run per
# group, so a 3rd near-simultaneous arrival was cancelled BEFORE any job
# started — no check-run object is created at all, so a required context sits
# at "Expected — waiting for status" with nothing red to see. Concurrency is now
# bounded only by the account-level ceiling, which QUEUES past it rather than
# dropping: lateness is visible, an absent check-run is not.
concurrency:
  group: ${{ format('adversarial-review-gate-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: false

jobs:
  gate:
    name: R1 gate — adversarial review present
    runs-on: ubuntu-latest
    # Floor is the CHECKOUT, not the script (scripts/lint_workflow_timeout_floor.py).
    # Was 5; 11% of 645 sampled checkouts here exceed 60s, worst observed 599s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the PR base ref is resolvable for the diff
          # blob:none — a partial clone that keeps EVERY commit and tree and omits
          # only file contents, fetching them on demand. `fetch-depth: 0` above is
          # deliberately untouched: the history this gate needs (merge-base with a
          # base ref that may have advanced) is unchanged, so the semantics the
          # comment above defends are unchanged too. Only blob DELIVERY becomes lazy.
          #
          # This is not a speed tidy-up. On 2026-07-27 this checkout consumed 297s of
          # this job's 300s budget and was killed: the gate itself never ran, the kill
          # reported `cancelled`, and a cancelled REQUIRED check EJECTS the merge-queue
          # entry — which then sits open with auto-merge off and nothing retrying it.
          # Same mechanism killed P6 at 597s of 600s on the same pull request. Measured
          # locally on this repository: a full clone moves 2,289 MB, blob:none moves
          # 23.3 MB in 21s — 99% of what every workflow downloads is blobs nobody reads.
          #
          # `git diff --name-only` still gets exact results here: rename detection is
          # the only thing that wants contents, and it wants them only for the files
          # this pull request touched, which git fetches on demand. If a future step
          # needs to read many historical file bodies, that step is the thing to
          # reconsider — do NOT "fix" it by deleting this line and paying 2.3 GB again.
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ARMED 2026-08-02 (W81). The header comment above has cited "--selftest"
      # as this gate's proof since it was written, and NO workflow ran it — the
      # guilt/innocence corpus existed and was never executed, which is the exact
      # shape W108 describes: a corpus that runs nowhere required is where defects
      # hide, because nothing ever contradicts the claim that it passes. It is
      # stdlib-only and takes ~1s. It runs FIRST: if the guard cannot prove itself
      # on its own fixtures, its verdict on real files is not worth reading.
      - name: R1 gate — prove the guard on its own fixtures (guilt + innocence)
        run: python scripts/check_adversarial_review.py --selftest

      - name: Fetch base ref
        env:
          # merge_group readiness (2026-07-27): github.base_ref is a branch
          # NAME, populated only for pull_request/pull_request_target — empty
          # under merge_group, which made this fetch a no-op and the next
          # step's `origin/${BASE_REF}` resolve to `origin/` (REF-BREAKAGE:
          # check_adversarial_review.py's git-diff subprocess raises
          # CalledProcessError -> main() exit 2 -> the R1 gate fails on every
          # single queue entry, not just changed ones). SHA-fallback mirrors
          # the pattern already proven in hot-zone-pr-gate.yml, and also
          # sidesteps the base-advanced race this step already guards below.
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        # NO --depth=1 here: a shallow fetch re-points origin/<base> to a tip with
        # severed history, so if base advanced between checkout and this step the
        # merge-base with HEAD is unreachable -> "fatal: no merge base" (seen live
        # on PR #2033, high-traffic day). Full fetch is cheap after fetch-depth: 0.
        run: git fetch origin "$BASE_SHA" || true

      - name: R1 gate — adversarial review present
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        # scripts/check_adversarial_review.py --diff shells out to
        # `git diff --name-only ... "{base}...HEAD"` (_git_diff_files) — base
        # is an opaque git revision never string-parsed for an "origin/<name>"
        # shape, so a bare SHA is a valid --diff argument (verified on disk
        # 2026-07-27, no origin/ prefix required; three-dot diff resolves the
        # merge-base from either a branch name or a SHA identically).
        run: python scripts/check_adversarial_review.py --diff "$BASE_SHA"
