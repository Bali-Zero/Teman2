# Guards the /dynamic-workflow harness script + its lint pair, and the CI
# hot-zone lint scripts themselves (scripts/lint_workflow_script.py,
# scripts/lint_model_cards.py) — see MANDATE-builder.md (BATTAGLIA-20260911/
# DYNAMIC-WORKFLOW-20260918), PR3c: the harness's own --selftest plus the two
# lint scripts' pytest suites, run BY NAME, plus both lints' default sweep as
# CI actually runs them (no positional target — scripts/tests/
# test_lint_workflow_script.py's
# test_workflow_yaml_lint_steps_use_default_sweep_via_cli holds that shape as
# a fact, not a convention).
#
# scripts/tests/test_dynamic_workflow.py, scripts/tests/
# test_lint_workflow_script.py and scripts/tests/test_lint_model_cards.py hold
# the guilt/innocence corpus this workflow exists to run. NON-REQUIRED by
# design (same posture as check-skills-canonical.yml): a brand-new signal
# observes for a review cycle before it can block; promoting to a required
# branch-protection check is a separate, later, operator-only action
# (repo/branch-protection settings, CLAUDE.md §13).
#
# Path-scoped: only runs when the harness, either lint script, their tests,
# the model-card corpus, the workflow-harness JS family, or the
# dynamic-workflow skill changes — the literal 8 paths of MANDATE-builder.md's
# PR3c list, no more (PR3c cure round, 2026-09-19: this file's own path was
# dropped from the filter below — it had no textual support in the mandate
# and let the workflow self-approve edits to itself without ever running).
name: dynamic-workflow-selftest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/dynamic_workflow.py"
      - "scripts/tests/test_dynamic_workflow*.py"
      - "scripts/lint_workflow_script.py"
      - "scripts/lint_model_cards.py"
      - "scripts/tests/test_lint_*.py"
      - "docs/arsenal/cards/**"
      - "infra/workflows/*.js"
      - ".claude/skills/dynamic-workflow/**"

permissions:
  contents: read

concurrency:
  group: dynamic-workflow-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-workflow-selftest:
    name: dynamic-workflow-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest + pyyaml
        run: python -m pip install --quiet pytest pyyaml

      - name: dynamic_workflow --selftest
        run: python3 scripts/dynamic_workflow.py --selftest

      - name: pytest test_dynamic_workflow.py
        run: python -m pytest scripts/tests/test_dynamic_workflow.py -v

      - name: pytest lint wrapper tests
        run: python -m pytest scripts/tests/test_lint_workflow_script.py scripts/tests/test_lint_model_cards.py -v

      - name: lint_workflow_script (default sweep)
        run: python3 scripts/lint_workflow_script.py

      - name: lint_model_cards (default sweep)
        run: python3 scripts/lint_model_cards.py
