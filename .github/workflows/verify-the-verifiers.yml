name: Verify the Verifiers (meta-gate)

# P1 §4 meta-verifier: makes it OBSERVABLE when any safety gate is DISARMED.
# Runs on an ISOLATED GitHub runner (R1, council DeepSeek): the agent cannot
# disarm this from its local machine. The integrity step (sha256) + CODEOWNERS
# protection on the three files make the meta-verifier itself tamper-evident —
# "quis custodiet ipsos custodes?" answered by immutability, not by intelligence.

# NOTE (BUCO #1 skip→success sentinel, 2026-06-09): the top-level
# pull_request `paths:` filter was REMOVED so this workflow ALWAYS triggers on
# pull_request and can therefore be a required-status-check WITHOUT the
# pending-forever trap (a paths-filtered required check never reports on a
# path-miss PR and blocks merge — W69). The relevant-paths decision now lives
# in the "Did relevant paths change?" step below, and the expensive WORK steps
# are gated on its output. On a path-miss PR the job ENDS success (sentinel).
# The push trigger keeps its paths filter (push only fires when work is needed).
on:
  pull_request: # NO top-level paths: — always trigger (sentinel gates the work)
  push:
    branches: [main]
    paths:
      - "scripts/verify_the_verifiers.py"
      - "scripts/verify_the_verifiers_gates.yaml"
      - ".github/workflows/hot-zone-pr-gate.yml"
      - ".github/workflows/token-lint.yml"
      - "scripts/token_lint.py"
      - "scripts/tests/test_token_lint.py"
      - "scripts/tests/conftest.py"

concurrency:
  # Dependabot branch: ALL Dependabot PRs share one group per workflow (not
  # per-ref), bounding concurrent Dependabot runs of THIS workflow to <=2
  # (Agent PR Contract rule 5) instead of unbounded parallel.
  # cancel-in-progress:false protects whichever run is RUNNING; GitHub keeps
  # only one PENDING per group, so a 3rd+ near-simultaneous arrival cancels
  # the pending run rather than queuing behind it — visible in the PR's
  # checks tab (never silent), recoverable with `gh run rerun` (confirmed:
  # docs.github.com/en/actions/using-jobs/using-concurrency + kimi-code/k3
  # refuter round on PR #5043). Non-Dependabot branch is byte-for-byte the
  # pre-existing expression — untouched.
  group: ${{ github.actor == 'dependabot[bot]' && format('dependabot-lockfile-{0}', github.workflow) || format('verify-the-verifiers-{0}', github.ref) }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'merge_group' }}

jobs:
  verify-the-verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the path-diff sees the PR base
          # blob:none — partial clone: every commit and tree, no file contents (fetched on
          # demand). `fetch-depth: 0` is KEPT, so this gate's `git diff --name-only` resolves
          # exactly as before; only blob DELIVERY becomes lazy. Measured on this repository:
          # a full clone moves 2,289 MB, blob:none moves 23.3 MB in 21s.
          # Not a tidy-up: on 2026-07-27 this same checkout ate 297s of a 300s job budget in
          # adversarial-review-gate and 597s of 600s in P6 and was KILLED, so those gates never
          # ran. A timeout kill reports `cancelled`, and a cancelled REQUIRED check EJECTS the
          # merge-queue entry, which then sits open with auto-merge off. See #3375 for the
          # measurement and for why the flag's presence in the fetch log — not a green check —
          # is the proof (an unsupported input is silently ignored by Actions).
          filter: blob:none

      # BUCO #1 sentinel: decide whether the meta-verifier's RELEVANT paths
      # changed in this PR. Dependency-free git diff (no third-party action — this
      # is a TIER-1 anti-injection file). The regex is the EXACT original
      # pull_request `paths:` list, each anchored ^...$. On a push event (already
      # paths-filtered at the trigger) or any non-PR event, run=true so the gate
      # never silently skips real work.
      - name: Did relevant paths change?
        id: relevant
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::non-PR event (${{ github.event_name }}) — running full meta-verifier"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE \
            '^(scripts/verify_the_verifiers\.py|scripts/verify_the_verifiers_gates\.yaml|\.github/verify-the-verifiers\.sha256|\.github/workflows/verify-the-verifiers\.yml|\.github/workflows/hot-zone-pr-gate\.yml|\.github/workflows/token-lint\.yml|scripts/token_lint\.py|scripts/tests/test_token_lint\.py|scripts/tests/conftest\.py|scripts/tests/test_verify_the_verifiers\.py|scripts/tests/test_wr3_reflexion_synthesis\.py|scripts/wr3_reflexion_synthesis\.py|scripts/wr2_reflexion_synthesis\.py|scripts/test_wr2_reflexion_cabling\.py|scripts/lib/reflexion\.py)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no relevant paths changed — sentinel success"
          fi

      - uses: actions/setup-python@v7
        if: steps.relevant.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install deps (pyyaml + pytest)
        if: steps.relevant.outputs.run == 'true'
        run: python3 -m pip install --quiet pyyaml pytest

      # R1 — integrity: the meta-verifier must not be silently altered. Recompute
      # the sha256 of script+registry and compare to the committed value. A change
      # to either file WITHOUT updating the committed hash (which is CODEOWNERS-
      # protected) fails here. Legit changes update .github/verify-the-verifiers.sha256
      # in the same PR — which requires @Balizero1987 review.
      - name: Integrity check (sha256 of meta-verifier files)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          EXPECTED_FILE=".github/verify-the-verifiers.sha256"
          if [[ ! -f "$EXPECTED_FILE" ]]; then
            echo "::error::missing $EXPECTED_FILE — meta-verifier integrity baseline absent"
            exit 1
          fi
          # shasum over the two load-bearing files, sorted for determinism.
          ACTUAL=$(shasum -a 256 \
            scripts/verify_the_verifiers.py \
            scripts/verify_the_verifiers_gates.yaml | sort | shasum -a 256 | awk '{print $1}')
          EXPECTED=$(cat "$EXPECTED_FILE")
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::meta-verifier integrity mismatch."
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            echo "  If this change is intentional, update $EXPECTED_FILE (requires @Balizero1987 review)."
            exit 1
          fi
          echo "integrity OK: $ACTUAL"

      - name: Run meta-verifier tests
        if: steps.relevant.outputs.run == 'true'
        run: python3 -m pytest scripts/tests/test_verify_the_verifiers.py -q

      # Closes the gap that made the #1696 A3-cabling regression invisible: the WR3
      # reflexion Delta-Gate test existed but was run by NO CI workflow, so a schema
      # break (episodes_found->signals_found, status vocabulary) merged green. Now it
      # is a required check here. Pinned to the relevant-paths regex above so it only
      # runs when the reflexion code/test changes (cheap, no noise).
      - name: Run WR3 reflexion Delta-Gate test
        if: steps.relevant.outputs.run == 'true'
        run: python3 -m pytest scripts/tests/test_wr3_reflexion_synthesis.py -q

      # Same lesson as the WR3 step: the WR2 reflexion scar_test is registered as a
      # gate (scar_A_wr2_reflexion) but the meta-verifier goes RED on M5-only HOME
      # hooks, so we run the WR2 Delta-Gate test EXPLICITLY here as its own required
      # check — the W74 cure (no silent green on an empty week) cannot regress unseen.
      - name: Run WR2 reflexion Delta-Gate test
        if: steps.relevant.outputs.run == 'true'
        run: python3 scripts/test_wr2_reflexion_cabling.py

      # --scope repo: a CI runner has no ~/.claude/ hooks, so the local-scope
      # claude_hook gates are SKIPPED (not DISARMED) here. The repo-scope gates
      # (CI workflows + lint scripts) ARE in the checkout and fully verified.
      # Local hooks are verified by the FASE-6 local cron (dead-man's-switch consumer).
      - name: Run meta-verifier (repo-scope gates must be ARMED)
        if: steps.relevant.outputs.run == 'true'
        run: python3 scripts/verify_the_verifiers.py --json --no-signal --scope repo
