name: SYMBIOSIS Promise Lint

on:
  pull_request:
    paths:
      - "SYMBIOSIS.md"
      - "scripts/lint_symbiosis_promises.py"
      - ".github/workflows/symbiosis-lint.yml"

concurrency:
  group: symbiosis-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  symbiosis-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Lint SYMBIOSIS durability promises
        run: python3 scripts/lint_symbiosis_promises.py SYMBIOSIS.md
