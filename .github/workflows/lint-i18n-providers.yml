name: Lint i18n providers

# Catches the white-screen regression pattern from PR #273: a component
# imports useTranslation() under apps/mouth/src/app/ without an ancestor
# I18nProvider in its layout chain. Refs: P1-10 in
# docs/audits/2026-04-29-zero-crash-audit/09_intervention_plan.md.

on:
  pull_request:
    paths:
      - "apps/mouth/src/app/**"
      - "apps/mouth/src/i18n/**"
      - "scripts/lint_i18n_providers.sh"
      - "tests/lint/test_i18n_providers.sh"
      - ".github/workflows/lint-i18n-providers.yml"

concurrency:
  group: lint-i18n-providers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Floor is the CHECKOUT, not the script (scripts/lint_workflow_timeout_floor.py).
    # Was 5; 11% of 645 sampled checkouts here exceed 60s, worst observed 599s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep
        run: |
          # Bounded + retried (2026-08-18) — see organ-conformance.yml.
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update && timeout 180 sudo apt-get install -y ripgrep; then
              break
            fi
            echo "::warning::apt attempt ${attempt}/3 for ripgrep failed or stalled; retrying"
            sleep $((attempt * 5))
          done
          # FAIL-CLOSED. Without this line the step is fail-OPEN: after three
          # failed attempts the loop simply ends, the last command executed is
          # `sleep` (exit 0), and the step goes GREEN with ripgrep absent — the
          # lint below would then measure a missing tool, not the code. Proven
          # locally 2026-08-18: the bare loop exits 0, the loop plus this line
          # exits 1.
          command -v rg

      - name: Run synthetic test suite
        run: bash tests/lint/test_i18n_providers.sh

      - name: Run lint on apps/mouth/src/app
        run: bash scripts/lint_i18n_providers.sh
