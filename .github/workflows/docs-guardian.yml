name: Docs Guardian

# Generator-correctness sentinel. It never compares a tracked global inventory.
on:
  pull_request:

concurrency:
  group: docs-guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Generator-relevant paths in this diff?
        id: relevant
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          CHANGED="$(bash scripts/ci/hotzone_changed_files.sh "$BASE_SHA" "$HEAD_SHA" "$PR_NUMBER")"
          ENUM_RC=$?
          if [ "$ENUM_RC" -ne 0 ]; then
            echo "::error::could not determine changed files (rc=$ENUM_RC)"
            exit 1
          fi
          RELEVANT=false
          if printf '%s\n' "$CHANGED" | grep -qE \
            '^scripts/docs_audit\.py$|^scripts/docs_inventory_regen\.sh$|^scripts/tests/test_docs_(audit|inventory_regen|inventory_render_is_clock_free)\.py$|^\.github/workflows/docs-(guardian|inventory-refresh)\.yml$'; then
            RELEVANT=true
          fi
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.relevant.outputs.relevant == 'true'
        with:
          python-version: "3.11"

      - name: Prove inventory generator correctness
        if: steps.relevant.outputs.relevant == 'true'
        env:
          DOCS_DERIVED_OUTPUT_DIR: ${{ runner.temp }}/docs-derived-state
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest \
            scripts/tests/test_docs_audit.py \
            scripts/tests/test_docs_inventory_regen.py \
            scripts/tests/test_docs_inventory_render_is_clock_free.py \
            -q
          bash scripts/docs_inventory_regen.sh
          test -s "$DOCS_DERIVED_OUTPUT_DIR/docs-sync.json"
          test -s "$DOCS_DERIVED_OUTPUT_DIR/docs-audit.json"
          test -s "$DOCS_DERIVED_OUTPUT_DIR/DOCS_INVENTORY.md"

      - uses: actions/upload-artifact@v7
        if: steps.relevant.outputs.relevant == 'true'
        with:
          name: docs-derived-state-${{ github.sha }}
          path: ${{ runner.temp }}/docs-derived-state
          retention-days: 14

      - name: Innocent delta sentinel
        if: steps.relevant.outputs.relevant != 'true'
        run: echo "::notice::no inventory-generator surface changed; sentinel success"
