name: Guard conformance (superscar #3 enforcement)

# IMMUNE FORGE 2026-07-05. The #3 antidote made structural: every textual
# guard (WhatsApp bridge _guard_*, worktree-isolation regexes/classifiers,
# command hooks, under-match sentinels) must be censused in
# infra/guard-conformance/registry.json with BOTH a guilt test and an
# innocence test — a guard without both proofs FAILS this gate. The checker
# also refuses phantom test references (W65) and tests no workflow runs (W81).
#
# SENTINEL PATTERN (W69, same as hook-innocence-gate.yml): NO top-level
# pull_request paths filter — the workflow always triggers on PR so it can
# become a REQUIRED check without the pending-forever trap. The relevant-paths
# decision lives in the "Did guard surfaces change?" step; on a path-miss PR
# the job ends success (sentinel).
#
# ARMING NOTE (operator): making this a required status check on main is a
# branch-protection change — operator-only, tracked in modus PENDING-ARMS.

on:
  pull_request: # NO top-level paths: — always trigger (sentinel gates the work)
  push:
    branches: [main]
    paths:
      - "infra/guard-conformance/**"
      - "infra/claude-hooks/**"
      - "scripts/hooks/**"
      - "scripts/openclaw_whatsapp_bridge.py"
      - "apps/backend-rag/backend/tests/unit/scripts/test_openclaw_whatsapp_bridge_script.py"
      - "scripts/guardrails_static_core.py"
      - "scripts/test_guardrails_overmatch.py"
      - "scripts/test_guardrails_core_overmatch.py"
      - "infra/scar-gates/**"
      - "scripts/wr2_html_renderer/designer_loop.py"
      - ".github/workflows/guard-conformance.yml"

concurrency:
  group: guard-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Every guard proves guilt AND innocence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the path-diff sees the PR base

      - name: Did guard surfaces change?
        id: relevant
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::non-PR event (${{ github.event_name }}) — running full conformance"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE \
            '^(infra/guard-conformance/|infra/claude-hooks/|scripts/hooks/|scripts/openclaw_whatsapp_bridge\.py|apps/backend-rag/backend/tests/unit/scripts/test_openclaw_whatsapp_bridge_script\.py|scripts/guardrails_static_core\.py|scripts/test_guardrails_(core_)?overmatch\.py|infra/scar-gates/|scripts/wr2_html_renderer/designer_loop\.py|\.github/workflows/guard-conformance\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no guard surface changed — sentinel success"
          fi

      - name: Set up Python
        if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Conformance census (registry vs code, proofs, phantoms, armed)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/guard-conformance/check_guard_conformance.py

      - name: W85 pin — documented-broken stash over-match still captured
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_w85_stash_readonly.py

      - name: Tilde/env target-resolver suite (blind-spot fixed 2026-07-06)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_tilde_target_resolver.py

      # These two regression suites existed since W83/W84 but NO workflow
      # executed them (found by the red-team pass on this very PR: they only
      # satisfied substring arming via path-filter text — W81 theater).
      # This workflow becomes their direct executor.
      - name: W83/W84 hook regression suites (previously unexecuted anywhere)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_w83_remote_dispatch.py
          python3 infra/claude-hooks/test_w84_strip_noise_cross_line.py

      # W92 (5th over-match, file-write channel: ssh-dispatched relative
      # destinations resolved against local session cwd) + the runtime-state
      # allowlist (Pro's 3 perennially-dirty tracked files no longer shut the
      # ff-only exception). Registered symbols reference these files — an
      # EXPLICIT execution step here, not just an ancestor-dir path-filter
      # substring match, is what actually arms them (W81: esiste != armato).
      - name: W92 write-dispatch fix + runtime-state allowlist (2026-07-11)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_w92_remote_write_dispatch.py
          python3 infra/claude-hooks/test_runtime_state_allowlist.py

      # 6th over-match (found at THIS PR's own gate, before merge, same
      # session as W92): the remote-dispatch exemption on BOTH channels was
      # WHOLE-COMMAND — `ssh pro hostname && git pull` and `ssh mini hostname
      # && cp /tmp/x scripts/f.py` both got wrongly exempted. Segment-scoped
      # fix + the pure `_git_verb_verdict` extraction that lets the fuzz
      # harness call the REAL decision instead of its own stale copy.
      - name: Segment-scoped remote-dispatch fix (6th over-match, 2026-07-11)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_segment_scoped_dispatch.py

      # Property/fuzz corpus (445 generated command shapes across both
      # decision channels of worktree_isolation.py) — the reusable harness
      # this same superscar #3 family motivated after 5 hand-written
      # regression suites each only covered the shape someone already got
      # burned by. Runs LAST as the broad net; the named suites above stay
      # as fast, specific pins.
      - name: Guard fuzz/property corpus (worktree_isolation.py, 445 cases)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/guard_fuzz_harness.py

      # SubagentStop hook (T2.6 sibling, W80/wave15-live-reap). Registered with
      # a test ref above — this step is the actual executor, not just the
      # ancestor-dir path-filter substring that would otherwise "arm" it for
      # free (the exact W81 theater this workflow exists to prevent).
      - name: SubagentStop hook guilt+innocence (subagent_stop_verify.py)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_subagent_stop_verify.py

      - name: Sentinel success (no guard surfaces changed)
        if: steps.relevant.outputs.run != 'true'
        run: echo "No guard surface changed in this PR — conformance not required. Sentinel pass."
