name: Guard conformance (superscar #3 enforcement)

# IMMUNE FORGE 2026-07-05. The #3 antidote made structural: every textual
# guard (WhatsApp bridge _guard_*, worktree-isolation regexes/classifiers,
# command hooks, under-match sentinels) must be censused in
# infra/guard-conformance/registry.json with BOTH a guilt test and an
# innocence test — a guard without both proofs FAILS this gate. The checker
# also refuses phantom test references (W65) and tests no workflow runs (W81).
#
# SENTINEL PATTERN (W69, same as hook-innocence-gate.yml): NO top-level
# pull_request paths filter — the workflow always triggers on PR so it can
# become a REQUIRED check without the pending-forever trap. The relevant-paths
# decision lives in the "Did guard surfaces change?" step; on a path-miss PR
# the job ends success (sentinel).
#
# ARMING NOTE (operator): making this a required status check on main is a
# branch-protection change — operator-only, tracked in modus PENDING-ARMS.

on:
  pull_request: # NO top-level paths: — always trigger (sentinel gates the work)
  merge_group:
  push:
    branches: [main]
    paths:
      - "infra/guard-conformance/**"
      - "infra/claude-hooks/**"
      - "scripts/hooks/**"
      - "scripts/openclaw_whatsapp_bridge.py"
      - "apps/backend-rag/backend/tests/unit/scripts/test_openclaw_whatsapp_bridge_script.py"
      - "scripts/guardrails_static_core.py"
      - "scripts/test_guardrails_overmatch.py"
      - "scripts/test_guardrails_core_overmatch.py"
      - "infra/scar-gates/**"
      - "scripts/wr2_html_renderer/designer_loop.py"
      - "scripts/wr2_editorial_pregate.py"
      - "scripts/tests/test_wr2_editorial_pregate.py"
      - "apps/wa-mirror/scripts/api_server.py"
      - "apps/wa-mirror/scripts/test_api_server_path_confinement.py"
      - "scripts/evidence_pack_lint.py"
      - "scripts/tests/test_evidence_pack_lint.py"
      - "scripts/harness_fable_gate.py"
      - "scripts/tests/test_harness_fable_gate.py"
      - "apps/backend-rag/backend/services/rag/agentic/prompt_builder.py"
      - "apps/backend-rag/backend/tests/unit/services/rag/agentic/test_casual_gate_overmatch.py"
      - ".claude/hooks/codex-spalla-trigger.sh"
      - "scripts/tests/test_codex_spalla_trigger_redaction.sh"
      - "scripts/hooks/injected_surface_sessionstart.sh"
      - "scripts/tests/test_injected_surface_hook.sh"
      - ".github/workflows/guard-conformance.yml"

concurrency:
  # Per-PR/per-ref for every author. A shared per-workflow group keyed on
  # github.actor was removed 2026-09-02: GitHub keeps only ONE pending run per
  # group, so a 3rd near-simultaneous arrival was cancelled BEFORE any job
  # started — no check-run object is created, so a required context sits at
  # "Expected — waiting for status" with nothing red to see. Concurrency is now
  # bounded only by the account-level ceiling, which QUEUES past it rather than
  # dropping: lateness is visible, an absent check-run is not.
  group: guard-conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  conformance:
    name: Every guard proves guilt AND innocence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the path-diff sees the PR base
          # blob:none — partial clone: every commit and tree, no file contents (fetched on
          # demand). `fetch-depth: 0` is KEPT, so this gate's `git diff --name-only` resolves
          # exactly as before; only blob DELIVERY becomes lazy. Measured on this repository:
          # a full clone moves 2,289 MB, blob:none moves 23.3 MB in 21s.
          # Not a tidy-up: on 2026-07-27 this same checkout ate 297s of a 300s job budget in
          # adversarial-review-gate and 597s of 600s in P6 and was KILLED, so those gates never
          # ran. A timeout kill reports `cancelled`, and a cancelled REQUIRED check EJECTS the
          # merge-queue entry, which then sits open with auto-merge off. See #3375 for the
          # measurement and for why the flag's presence in the fetch log — not a green check —
          # is the proof (an unsupported input is silently ignored by Actions).
          filter: blob:none

      - name: Did guard surfaces change?
        id: relevant
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::non-PR event (${{ github.event_name }}) — running full conformance"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE \
            '^(infra/guard-conformance/|infra/claude-hooks/|scripts/hooks/|scripts/openclaw_whatsapp_bridge\.py|apps/backend-rag/backend/tests/unit/scripts/test_openclaw_whatsapp_bridge_script\.py|scripts/guardrails_static_core\.py|scripts/test_guardrails_(core_)?overmatch\.py|infra/scar-gates/|scripts/wr2_html_renderer/designer_loop\.py|scripts/wr2_editorial_pregate\.py|scripts/tests/test_wr2_editorial_pregate\.py|scripts/ci/vercel_(should_build|ignore_build_step)\.sh|scripts/tests/test_vercel_should_build\.sh|apps/wa-mirror/scripts/(api_server|test_api_server_path_confinement)\.py|scripts/evidence_pack_lint\.py|scripts/tests/test_evidence_pack_lint\.py|scripts/ci/stage_council_journal\.py|scripts/tests/test_stage_council_journal\.py|\.github/workflows/harness-floor\.yml|scripts/harness_fable_gate\.py|scripts/tests/test_harness_fable_gate\.py|apps/backend-rag/backend/services/rag/agentic/prompt_builder\.py|apps/backend-rag/backend/tests/unit/services/rag/agentic/test_casual_gate_overmatch\.py|\.claude/hooks/codex-spalla-trigger\.sh|scripts/tests/test_codex_spalla_trigger_redaction\.sh|scripts/hooks/injected_surface_sessionstart\.sh|scripts/tests/test_injected_surface_hook\.sh|\.github/workflows/guard-conformance\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no guard surface changed — sentinel success"
          fi

      - name: Set up Python
        if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Conformance census (registry vs code, proofs, phantoms, armed)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/guard-conformance/check_guard_conformance.py

      - name: W85 pin — documented-broken stash over-match still captured
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_w85_stash_readonly.py

      - name: Tilde/env target-resolver suite (blind-spot fixed 2026-07-06)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_tilde_target_resolver.py

      # These two regression suites existed since W83/W84 but NO workflow
      # executed them (found by the red-team pass on this very PR: they only
      # satisfied substring arming via path-filter text — W81 theater).
      # This workflow becomes their direct executor.
      - name: W83/W84 hook regression suites (previously unexecuted anywhere)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_w83_remote_dispatch.py
          python3 infra/claude-hooks/test_w84_strip_noise_cross_line.py

      # W92 (5th over-match, file-write channel: ssh-dispatched relative
      # destinations resolved against local session cwd) + the runtime-state
      # allowlist (Pro's 3 perennially-dirty tracked files no longer shut the
      # ff-only exception). Registered symbols reference these files — an
      # EXPLICIT execution step here, not just an ancestor-dir path-filter
      # substring match, is what actually arms them (W81: esiste != armato).
      - name: W92 write-dispatch fix + runtime-state allowlist (2026-07-11)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_w92_remote_write_dispatch.py
          python3 infra/claude-hooks/test_runtime_state_allowlist.py

      # 6th over-match (found at THIS PR's own gate, before merge, same
      # session as W92): the remote-dispatch exemption on BOTH channels was
      # WHOLE-COMMAND — `ssh pro hostname && git pull` and `ssh mini hostname
      # && cp /tmp/x scripts/f.py` both got wrongly exempted. Segment-scoped
      # fix + the pure `_git_verb_verdict` extraction that lets the fuzz
      # harness call the REAL decision instead of its own stale copy.
      - name: Segment-scoped remote-dispatch fix (6th over-match, 2026-07-11)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_segment_scoped_dispatch.py

      # W105 (2026-07-26): the removal-target resolver truncated to the FIRST
      # segment under .worktrees/, so removing `.worktrees/<outer>/.worktrees/
      # <inner>` was refused in the DIRTY OUTER's name. Its twin is covered in
      # the same suite: `.worktrees/` is gitignored, so an outer worktree's own
      # `git status` is blind to a nested one — removing a CLEAN outer that holds
      # a DIRTY nested worktree must block, or the fix opens the under-match.
      - name: W105 nested-worktree removal (over-match + composition twin)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_w105_nested_worktree_removal.py

      # W117 (2026-08-10): the git-verb channel could not see an ssh-dispatched
      # DISCARD at all — _strip_noise() empties the quoted payload by design
      # (W83), so `ssh pro 'cd ~/nuzantara && git reset --hard'` reached the
      # verdict as no_blocked_verb and the remote-dispatch exemption was never
      # consulted. That command, run to realign Pro's main checkout, destroyed
      # 159 intel-publish-ledger entries + 24 open escalations — runtime state
      # no commit holds, which is exactly why scripts/pro/pro-git-pull.sh exists.
      - name: W117 ssh-dispatched discard of a remote main checkout
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_w117_remote_discard.py

      # L04-PR1 (2026-08-31): `lane_check.py` is the contract a lane declares
      # about ITSELF — a `.lane-check.json` in the worktree root, evaluated at
      # the stop boundary so a lane that broke its own build check cannot end a
      # turn quietly claiming success. TWO executors, deliberately, because they
      # answer different questions and one of them proves nothing alone:
      #
      #   test_lane_check.py         — does the LIBRARY decide correctly? Guilt
      #                                on fail/tautology/malformed/timeout,
      #                                innocence on absent/escape/pass/scope,
      #                                and both under-match gemelli (an unknown
      #                                AND an empty change set must keep the
      #                                check running, never silently skip it).
      #   test_lane_check_wiring.py  — is that decision HONOURED at a real stop
      #                                boundary? It drives subagent_stop_verify.py
      #                                as a subprocess with a real SubagentStop
      #                                payload and reads the exit code the
      #                                harness reads.
      #
      # The second exists because "imports lane_check" is not "honours
      # lane_check" (superscar #2), and the split was earned rather than
      # designed: the first wiring called evaluate() with no change set, so
      # `scope_globs` narrowed nothing at the only wired surface — a declared,
      # tested, documented feature that did nothing wherever it was used. Only
      # the wiring probe could see that; every library test stayed green.
      - name: L04 lane check — the library decides correctly
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_lane_check.py

      - name: L04 lane check — the decision reaches a real stop boundary
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_lane_check_wiring.py

      # orchestrate_gate.py's own registry entry names two test files; neither
      # had an explicit executor here — the registry's C4 "armed" check only
      # requires the path (or an ancestor dir) to appear SOMEWHERE in workflow
      # text, and this workflow's own path-filter already mentions
      # infra/claude-hooks/**, which is documented as an accepted limit, not a
      # substitute for actually running the suite (W81 theater, same as every
      # other named step in this file). test_orchestrate_gate_vocab.py pins
      # the dispatch-keyword vocabulary fix (2026-08-12, PR #4111: 4/5
      # keywords named a tool the harness had stopped emitting).
      # test_orchestrate_gate_disarm_notice.py pins the second, independent
      # defect found the same day: the kill switch (ORCHESTRATE_GATE_OFF=1,
      # inherited from a launching shell, written in no file) produced zero
      # signal when set — a 6400-line/0-dispatch session ran unblocked with no
      # trace anywhere (lesson_a_disarmed_gate_is_mute_2026_08_12).
      - name: orchestrate_gate.py dispatch-vocabulary + disarm-notice suites
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_orchestrate_gate_vocab.py
          python3 infra/claude-hooks/test_orchestrate_gate_disarm_notice.py

      # Property/fuzz corpus (445 generated command shapes across both
      # decision channels of worktree_isolation.py) — the reusable harness
      # this same superscar #3 family motivated after 5 hand-written
      # regression suites each only covered the shape someone already got
      # burned by. Runs LAST as the broad net; the named suites above stay
      # as fast, specific pins.
      - name: Guard fuzz/property corpus (worktree_isolation.py, 445 cases)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/guard_fuzz_harness.py

      # SubagentStop hook (T2.6 sibling, W80/wave15-live-reap). Registered with
      # a test ref above — this step is the actual executor, not just the
      # ancestor-dir path-filter substring that would otherwise "arm" it for
      # free (the exact W81 theater this workflow exists to prevent).
      - name: SubagentStop hook guilt+innocence (subagent_stop_verify.py)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 infra/claude-hooks/test_subagent_stop_verify.py

      # Vercel's Ignored Build Step. A guard in the #3 sense — it decides, on a substring-ish
      # signal (changed paths), whether the public site gets rebuilt — so it owes guilt AND
      # innocence like any other. It lands here rather than in scripts-tests-sweep.yml because
      # that workflow says of itself "this job never blocks a PR (not in required_status_checks)":
      # a corpus nothing can fail on is the W81 theater this workflow exists to prevent. Hosting
      # it in an ALREADY-required job also avoids minting a new required context, which would
      # freeze every branch created before it.
      # What is actually being protected: the pointer, not the guard. On 2026-07-29 the project's
      # commandForIgnoringBuildStep invoked the guard directly before it existed on main; bash
      # exited 127; Vercel treats every status except 0 and 1 as a FAILED DEPLOYMENT, and nine
      # deployments errored. The corpus executes the literal pointer string against script-absent,
      # syntax-error, 127 and signal-kill.
      - name: Vercel ignore-step guard + pointer (guilt, innocence, exit contract)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          bash scripts/tests/test_vercel_should_build.sh

      # wa-mirror control API (PR #3671). This file lived HOME-only until it was
      # promoted, so no gate had ever read it; CodeQL's first look returned seven
      # py/path-injection alerts. The endpoints DID refuse names outside the
      # roster and then built the log path and the subprocess argv from the
      # REQUEST string anyway — a guard that only raises sanitises nothing.
      # This step is the ACTUAL executor: the registry's arming check accepts an
      # ancestor-directory substring, so the `apps/wa-mirror/scripts/` path entry
      # in the filter above would "arm" this corpus for free without ever running
      # it (the checker documents that as an accepted limit — W81 theater is one
      # deleted line away). fastapi because the corpus drives the REAL handlers.
      - name: wa-mirror control API path confinement (roster-derived identity)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          # asyncpg too: api_server.py imports it at module scope, and a dev
          # machine whose venv happens to carry it cannot reproduce this red.
          python3 -m pip install --quiet fastapi pytest asyncpg
          python3 -m pytest apps/wa-mirror/scripts/test_api_server_path_confinement.py -q

      # Evidence Pack lint (PR-3, fleet-order harness — harness-v2-teman2.md
      # §5). Same discipline as the wa-mirror step above: the registry's
      # is_armed() accepts an ancestor-directory substring match, so the
      # `scripts/tests/` path fragment already mentioned elsewhere in this
      # repo's workflows would "arm" this corpus for free without ever
      # running it (W81 theater — one deleted line away, per the checker's
      # own documented accepted limit). This step is the ACTUAL executor.
      - name: Evidence Pack lint guilt+innocence (evidence_pack_lint.py)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml pytest
          python3 -m pytest scripts/tests/test_evidence_pack_lint.py -q
          python3 scripts/evidence_pack_lint.py --selftest

      # Same reasoning one step further out (cross-family review, codex-gpt-5.6-sol, HIGH, on the
      # PR that added it): scripts/tests/test_stage_council_journal.py is the guilt+innocence corpus
      # for the CI staging that FEEDS R9 — without it the rule reads an empty pack dir and fails
      # every Gear-3 PR. Nothing else runs that corpus on a PR: scripts-tests-sweep.yml is
      # scheduled/manual and `continue-on-error: true`, so a regression there would never turn a
      # required check red. This step is its ACTUAL executor, exactly as the step above is for the
      # linter's own corpus.
      - name: Council-journal staging guilt+innocence (stage_council_journal.py)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml pytest
          python3 -m pytest scripts/tests/test_stage_council_journal.py -q

      # harness_fable_gate.py (PR-3, fleet-order). NOT a guard-conformance
      # registry entry — its own docstring/test-file header say why: it is a
      # PUBLISHER (posts an already-decided verdict as a commit status), it
      # never accepts/rejects PR content, so it owes no guilt+innocence
      # census. But "not a guard" is not "untested in CI": these pins the
      # VERDICT_STATE mapping and the --conditions-ref-required-for-PWC guard
      # so a future edit can't quietly invert PASS/BLOCK or let an
      # unenforceable PASS-WITH-CONDITIONS through. Same arming discipline as
      # every other step in this file: an ancestor-directory path-filter
      # substring would "arm" this for free without ever running it (W81).
      - name: harness/fable-gate publisher pin (harness_fable_gate.py)
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pytest scripts/tests/test_harness_fable_gate.py -q

      # codex-spalla-trigger.sh (PostToolUse hook, secret hygiene — cicatrix
      # superscar #4). Found world-readable (0644) and never redacting a
      # logged command that can carry a credential in argv. Magnitude is
      # stated as the conclusion that survives re-measurement, not as a count:
      # 3 runs carrying secret material — 1 whole token plus 2
      # truncation-clipped partials (measured by END POSITION: the two shorter
      # runs both end EXACTLY at the 200-char truncation boundary, which is a
      # partial cut off mid-value, not a second and third full-length secret).
      # The raw line counts are deliberately NOT quoted here: this hook logs
      # the greps that measure it, so they inflate on every measurement (14 at
      # 2026-08-21T15:56Z, 24 at 20:28Z) while the 3 secret-bearing runs do
      # not move.
      # The suite this step runs is also the ONLY thing standing between the
      # matcher and a repeat of its own history: it was rewritten twice, once
      # for over-matching (a bare substring that ate 7 of 9 ordinary commands)
      # and once for under-matching (a delimited-segment version that leaked
      # twelve undelimited forms, and a vocabulary-bounded one that still
      # leaked PGPASSWORD= 99 times in the live log), and once more for RULE
      # ORDER — rule 2 ran before rule 4, so a credential-ish NAME whose
      # unquoted value began with the word Bearer had exactly that word
      # replaced, destroying the marker rule 4 needed and logging the token in
      # full. 86 cases, and a 63-mutant run (62 killed,
      # 1 EQUIVALENT and excluded, proven unkillable) over an ENUMERATED set — deliberately not the
      # universal "every alternation" claim this comment used to carry, which
      # the Gear-3 gate answered with five counterexamples.
      # Same arming discipline as the steps above: this is a `.sh` corpus,
      # invisible to scripts-tests-sweep.yml's pytest collection (it only
      # globs `test_*.py`) even before accounting for that workflow being
      # continue-on-error/report-only — so the registry's is_armed() would
      # otherwise "arm" this corpus for free via the `scripts/tests/`
      # ancestor-directory substring already present in dozens of other
      # workflows (W81 theater), without anything ever running it. This step
      # is the ACTUAL executor. Not python — the .sh runner needs no extra
      # dependency, and the hook itself is bash.
      - name: codex-spalla-trigger.sh secret-redaction guilt+innocence
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          bash scripts/tests/test_codex_spalla_trigger_redaction.sh

      # Same reasoning as the step above: the .sh runner needs no extra dependency
      # and the hook itself is bash. Registering this hook in the registry without
      # a step that RUNS its cases would be the exact shape the registry exists to
      # forbid — a guard that is listed and never executed.
      - name: injected_surface_sessionstart.sh never-silent guilt+innocence
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          bash scripts/tests/test_injected_surface_hook.sh

      - name: Sentinel success (no guard surfaces changed)
        if: steps.relevant.outputs.run != 'true'
        run: echo "No guard surface changed in this PR — conformance not required. Sentinel pass."
