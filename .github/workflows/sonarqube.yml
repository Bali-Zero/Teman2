name: SonarQube Analysis

# Path-scoped (2026-06-12 CI fan-out reduction): advisory code-quality scan
# (continue-on-error) — no value on docs/content-only PRs. NON-REQUIRED, so a
# non-matching PR just skips it.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**.py"
      - "**.js"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"
      - ".github/workflows/sonarqube.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"
      - "**.js"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"
      - ".github/workflows/sonarqube.yml"
  workflow_dispatch:

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is the scanner even reachable? Measured 2026-08-06 over the last 29 COMPLETED
  # runs of this workflow: 16 success, 13 cancelled, and the `SonarQube Scan` step
  # succeeded **0 times**. `SONAR_TOKEN` has never been configured, so both
  # terminal steps were skipped by their own `if:` on every run — while the two
  # steps that FEED them were not gated and ran anyway: the full Python suite with
  # coverage (1228s on run 31037626312) plus the frontend suite (211s), thrown
  # away. The 13 cancellations are that work overrunning `timeout-minutes: 30`;
  # on that run the scan step was skipped 8 seconds after the tests finished.
  #
  # A whole job of "exists but has never once done the thing it exists for"
  # (cicatrix #2), costing 20-30 minutes of shared runner per PR. This gate makes
  # the cost zero when the token is absent and changes nothing when it is present.
  #
  # It must be a separate JOB: GitHub exposes neither `secrets` nor `env` to
  # `jobs.<id>.if`, only `github`/`needs`/`vars`/`inputs` — which is why the
  # existing hoist into job-level `env` reaches step-level `if:` but could never
  # gate the job itself. `needs.<job>.outputs` is the supported way in.
  preflight:
    name: SonarQube preflight (is the scanner configured?)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      # No checkout: this job exists to avoid paying for one.
      - id: probe
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is set — running the analysis job."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is NOT set — skipping the analysis job entirely."
            echo "Nothing is silently degraded: with no token the scan step was"
            echo "already skipped on every run; this only stops paying for the"
            echo "test+coverage steps that fed it. Set the secret to re-enable."
          fi

  sonarqube:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 30
    # Advisory-only: quality-gate thresholds (code smells, coverage,
    # duplication) are policy decisions the maintainer must own. The
    # scan still runs and publishes to SonarCloud; failure does not
    # block PRs. Re-enable as blocking gate once thresholds are agreed.
    continue-on-error: true
    env:
      # Hoist the secret so step-level `if:` can read it (GitHub does not
      # allow `secrets.*` directly inside `if:` expressions).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/backend-rag/requirements.txt') }}

      - name: Cache Node dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Python dependencies
        run: |
          cd apps/backend-rag
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Run Python tests with coverage
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell pytest \
            backend/tests/ \
            -v \
            --cov=backend \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junit-xml=test-results.xml
        continue-on-error: true

      - name: Run Frontend tests with coverage
        run: |
          npm run test:coverage || true
        continue-on-error: true

      - name: SonarQube Scan
        # Skip when SONAR_TOKEN is not set (forks, secret never configured).
        # The scanner fails with "missing sonar.projectKey/organization" when
        # the token is empty because the SonarSource action only injects
        # those properties via its API resolver. The job has
        # continue-on-error: true at the job level (advisory-only), but
        # individual failed steps still surface red on the PR rollup; this
        # if-guard prevents that visual noise without changing policy.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@5bc5285b684b9f0e940031dc8ddc4b6387a2f493 # master
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarQube Quality Gate Check
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # master
        timeout-minutes: 5
        continue-on-error: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        # Best-effort PR comment. Default GITHUB_TOKEN often lacks
        # `pull-requests: write` (depends on repo policy + whether the
        # PR is from a fork). When permission is missing the step fails
        # with "Resource not accessible by integration" — that does not
        # mean the analysis itself failed, only that we can't post a
        # comment back to the PR. Don't let it gate the whole job.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const message = `
            ## 📊 SonarQube Analysis Complete

            View detailed results: [SonarCloud Dashboard](https://sonarcloud.io/project/overview?id=nuzantara_nuzantara-rag)

            ### Quality Gates
            - ✅ Code analysis completed
            - Check SonarCloud for detailed metrics

            ### Next Steps
            1. Review code smells and bugs
            2. Improve coverage if below 80%
            3. Fix security vulnerabilities
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: message
            });
