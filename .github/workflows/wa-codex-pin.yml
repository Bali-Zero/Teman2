# WA codex broker — dedicated pin executor (spec v3, N1)
#
# The SUSPENDED PR #7340 shipped two guilt/innocence test files
# (test_install_wa_codex_pinned.py, test_wa_codex_broker_wrapper.py) plus an
# extension to test_wa_codex_seat_sentinel.py, and NO workflow named any of
# the three: their only runner was the nightly `scripts-tests-sweep.yml` on
# `ubuntu-latest` with `continue-on-error: true`, where BSD `stat -f`,
# `plutil`, `find -acl` and bsdtar do not even exist — so a red in any of
# them would never turn a single PR red (superscar #2, exists != armed,
# reapplied to the guards of the exact privileged-installer class that took
# three cross-family BLOCKs to get here — #7313 r0, #7313 r1, #7340 r0).
#
# This file is PR-1 of the v3 rework (spec_codexpin_v3.md §7): the wrapper's
# D5 pin section only. It runs on `macos-latest` because the corpus execs
# real `sh`/`/bin/date` shell scripts and reads a macOS-shaped stub tree —
# no `bsdtar`/`stat -f`/ACL dependency here yet (that lands with PR-2's
# installer test file, added to this same workflow's path filter then).
#
# NOT a required context (same reasoning as alarm-cure-alignment.yml): what
# matters here is that an executor exists that CAN go red, not that a red
# here blocks the queue on day one. `pull_request` carries a paths filter
# because conformance rule 4 (a required check must never rely on a
# never-fired `pull_request.paths` filter) does not apply to a
# non-required workflow.
name: "wa-codex-pin: dedicated broker pin (wrapper + installer + sentinel)"

on:
  pull_request:
    paths:
      - "infra/launchagents/wrappers/wa-codex-broker-wrapper.sh"
      - "scripts/tests/test_wa_codex_broker_wrapper.py"
      - ".github/workflows/wa-codex-pin.yml"
      # PR-2 (installer) and PR-3 (sentinel) add their own paths here when
      # they land — scripts/install_wa_codex_pinned.sh,
      # scripts/tests/test_install_wa_codex_pinned.py,
      # scripts/wa_codex_seat_sentinel.py,
      # scripts/tests/test_wa_codex_seat_sentinel.py.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  wrapper-pin-tests:
    name: wrapper D5 pin section (guilt + innocence)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Wrapper still parses under sh and bash
        run: |
          sh -n infra/launchagents/wrappers/wa-codex-broker-wrapper.sh
          bash -n infra/launchagents/wrappers/wa-codex-broker-wrapper.sh

      - name: Pin section guilt + innocence tests
        run: python -m pytest scripts/tests/test_wa_codex_broker_wrapper.py -q
