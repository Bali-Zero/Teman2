name: Cert monitor tests

# Executor for the corpora that prove the mini.cert_monitor organ (daily TLS expiry check of
# the public hosts, Mini launchd). Offline: the fetch is monkeypatched and the wrapper stubs
# python and hostname. Without this file the corpus is collected by nothing that gates
# (superscar #2).

on:
  pull_request:
    paths:
      - "scripts/cert_monitor.py"
      - "scripts/tests/test_cert_monitor.py"
      - "scripts/tests/test_mini_cert_monitor_wrapper.sh"
      - "infra/launchagents/wrappers/mini-cert-monitor.sh"
      - "infra/launchagents/com.nuzantara.cert-monitor.plist"
      - ".github/workflows/cert-monitor-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/cert_monitor.py"
      - "scripts/tests/test_cert_monitor.py"
      - "scripts/tests/test_mini_cert_monitor_wrapper.sh"
      - "infra/launchagents/wrappers/mini-cert-monitor.sh"
      - "infra/launchagents/com.nuzantara.cert-monitor.plist"
      - ".github/workflows/cert-monitor-tests.yml"

permissions:
  contents: read

concurrency:
  group: cert-monitor-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  cert-monitor-tests:
    name: Cert monitor tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --quiet --disable-pip-version-check pytest

      - name: The cert check classifies, thresholds and exits as specified
        run: |
          python -m pytest scripts/tests/test_cert_monitor.py -q -p no:cacheprovider
          python scripts/cert_monitor.py --self-test

      - name: The wrapper maps outcomes to heartbeats and p0s
        run: bash scripts/tests/test_mini_cert_monitor_wrapper.sh

      - name: The wrapper still parses (a syntax error is a silent dead organ)
        run: bash -n infra/launchagents/wrappers/mini-cert-monitor.sh
