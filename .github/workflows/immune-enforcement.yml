          # bucket: the qdrant nightly is missing for exactly the night PG failed.
          bash scripts/test_fly_backup_phases.sh

      - name: Claude-CLI installer corpus (upstream partial publish must not break the image)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # Upstream published @anthropic-ai/claude-code 2.1.237 without publishing
          # its linux-x64 platform build, so every unpinned `npm install -g` failed
          # while the repo had not changed a line — and an M-series Mac still built
          # the image fine, so local triage could not reproduce it. Fake registry,
          # both skew directions, guilt and innocence.
          bash scripts/tests/test_install_claude_code_version_skew.sh

      - name: Merge-queue re-arm corpora (classifier + population, guilt + innocence)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # Both corpora shipped complete and NEITHER was named by any workflow —
          # `test_queue_rearm_classify.sh` had been on main since #3342, executed by
          # nothing. A guilt+innocence corpus that never runs is the exact shape it
          # was written to prevent (superscar #2), one level down: the guard of the
          # guard, unarmed.
          #
          # What they pin: the classifier must never retry a CODE red and must never
          # read an unfinished check as "no failure"; the population reader must count
          # a pull request whose mergeability GitHub has not finished computing as
          # UNDECIDABLE rather than dropping it into the clean bucket. That third
          # `mergeable` value is why this step exists — measured 2026-07-28, the tool
          # reported "0 orphaned" seconds after a merge to main and 13 minutes later,
          # same code, same world.
          bash scripts/ci/test_queue_rearm_classify.sh
          bash scripts/ci/test_queue_rearm_population.sh

      - name: Telegram delivery verdict corpus (guilt + innocence + fail-closed)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # W104 on the CI surface: 25 of the 28 `curl .../sendMessage` calls in this
          # repo's workflows judged their own delivery by curl's EXIT CODE, which is 0
          # whenever the server answers — including HTTP 401 with a well-formed
          # {"ok":false,"description":"Unauthorized"} after a token rotation. Every one
          # of those alarms was, by construction, unable to report its own silence.
          #
          # (An earlier draft of this comment said "12 of 14". That was my own
          # undercount from a line-anchored grep, blind to the prevailing shape in this
          # repo — `curl -sS -X POST \` with the URL on the NEXT line. The real figures
          # come from joining continuations before scanning: 28 sites, 18 files. Left
          # recorded rather than quietly overwritten, because a wrong census is exactly
          # what the widened `lint_tg_direct_senders.py` scan exists to prevent.)
          #
          # What this pins: 401/403/400/429 are refusals, `"ok":false` under an HTTP 200
          # is a refusal (the status line is not the authority, the body is), the word
          # "true" appearing anywhere else in the payload is NOT a delivery, and an
          # absent status is CANNOT-VERIFY rather than success — a blind check is not a
          # clean check.
          bash scripts/ci/test_telegram_verdict.sh

      - name: Required-workflow conformance (Merge-OS v2 Wave 0, Codex F12)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # infra/required.d/contexts.json + scripts/ci/check_required_workflow_conformance.py
          # shipped together, docs-sync.yml/migration-lint.yml cured same PR. The
          # guilt+innocence corpus above (test_check_required_workflow_conformance.py)
          # proves the CHECKER can still bite; this step proves the REAL repo tree is
          # clean today — a censused guard that no workflow actually runs against
          # live data is theater (W81).
          python3 scripts/ci/check_required_workflow_conformance.py

      - name: "Unreachable workflow if: conditions (security.yml orphaned-alarm class)"
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # scripts/ci/lint_unreachable_workflow_conditions.py + its corpus
          # (test_unreachable_workflow_conditions.py, in the batch loop above)
          # shipped together, curing security.yml's Telegram-alert `if:` in
          # the same PR (commit 4e2d8367e / #4218 narrowed `on.push.branches`
          # and orphaned it — armed and mute for four days, until the
          # 2026-08-20 unbuildable-image incident alarmed nobody). The
          # guilt+innocence corpus above proves the CHECKER can still bite;
          # this step proves the REAL repo tree is clean today — a censused
          # guard that no workflow actually runs against live data is
          # theater (W81). Verified empirically (2026-08-20): 93 tracked
          # workflows, 10 in-scope `if:` conditions, 0 findings, 6 UNDECIDED
          # (all outside the declared decidable shape — see the tool's own
          # module docstring — never silently read as clean).
          python3 scripts/ci/lint_unreachable_workflow_conditions.py

      - name: declared-pairs.json is valid JSON with sane shape
        if: steps.paths.outputs.relevant == 'true'
        run: |
          python - << 'EOF'
          import json, sys
          data = json.load(open("infra/home-fork/declared-pairs.json"))
          assert isinstance(data.get("pairs"), list) and data["pairs"], "pairs empty"
          for p in data["pairs"]:
              # ~/ = HOME-fork domain (the registry's charter). The narrow
              # absolute-prefix exception covers system-domain LaunchDaemon
              # payloads (first case: mini fw-guard, 2026-08-14 — a root
              # daemon must NOT execute from a user-writable $HOME path, so
              # its live copy lives in /usr/local + /Library by design).
              # expand_home() passes absolutes through untouched.
              assert p.get("live", "").startswith(("~/", "/Library/", "/usr/local/")), p
              assert p.get("repo"), p
          print(f"OK: {len(data['pairs'])} declared pairs, {len(data.get('allow', []))} allow globs")
          EOF

      # Doc-executable-refs lint runs FOR REAL on every PR (not just its own
      # unit tests): unlike lint_home_fork.py it has no $HOME dependency — it
      # is a pure repo-tree scan, so CI can enforce the live check directly.
      # 2026-07-14 WR2 deep audit item 11: docs cited scripts/wr2_carousel_
      # orchestrator.py + scripts/wr2_telegram_publish_gate.py as entry points
      # years after both were deleted. This is the antidote that turns that
      # class of drift into a build-blocking fact.
      - name: Doc-executable-refs lint (docs cite only real scripts/*.py|.sh)
        run: |
          if [ -f scripts/lint_doc_executable_refs.py ]; then
            python scripts/lint_doc_executable_refs.py
          fi

      # Public-asset-refs lint runs FOR REAL on every PR, UNGATED — same
      # reasoning as doc-executable-refs above, plus one that is specific to it:
      # the defect it catches is introduced by FRONTEND PRs (a new `src=` in
      # apps/mouth), which are exactly the PRs the immune-relevant sentinel
      # classifies as NOT relevant. Gating this behind `steps.paths.outputs.relevant`
      # would arm it only for PRs that cannot contain the defect — the W108
      # GOTCHA verbatim ("il difetto è emerso solo dopo aver ARMATO il test su
      # ogni PR"). Pure tree scan, no $HOME and no network, so CI can enforce it
      # directly. Known-broken references live in the shrink-only registry at
      # infra/asset-lint/public-asset-refs-config.json (they are carried debt,
      # not exemptions — the lint fails if one goes stale).
      - name: Public-asset-refs lint (code names only assets that exist in public/)
        run: |
          if [ -f scripts/lint_public_asset_refs.py ]; then
            python scripts/lint_public_asset_refs.py
          fi

      # TCC-Desktop-paths lint runs FOR REAL on every PR (same reasoning as
      # doc-executable-refs above): a pure `git ls-files` tree scan, no $HOME
      # dependency, so CI can enforce it directly rather than only testing the
      # tool. Antidote for the 2026-07-16 W84 repo-move: the repo itself was
      # the regeneration source for the Desktop/nuzantara path (proven live —
      # a sync hook re-copied a Desktop-hardcoded default into a HOME payload
      # within 15 minutes of a manual fix). Scope is *.sh/*.py/*.plist only;
      # declared exceptions live in infra/tcc-desktop-paths/allowlist.txt.
      - name: TCC-Desktop-paths lint (no *.sh/*.py/*.plist hardcodes ~/Desktop/nuzantara)
        run: |
          if [ -f scripts/lint_tcc_desktop_paths.py ]; then
            python scripts/lint_tcc_desktop_paths.py
          fi

      # Claude-headless-limits lint runs FOR REAL on every PR (same reasoning
      # as doc-executable-refs / tcc-desktop-paths above): pure repo-tree
      # scan, no $HOME dependency, so CI can enforce it directly rather than
      # only testing the tool's guilt+innocence corpus in isolation. Antidote
      # for family #2 (Esiste ≠ Armato): the lint existed with 0 findings on
      # the real repo but was wired into no workflow at all — this step arms
      # it (SPEC-abcd.md Unita A, 2026-07-16).
      - name: Claude-headless-limits lint (tool-armed -p/--print carries --max-budget-usd)
        run: |
          if [ -f scripts/lint/lint_claude_headless_limits.py ]; then
            python3 scripts/lint/lint_claude_headless_limits.py
          fi
          if [ -f scripts/lint/test_lint_claude_headless_limits.py ]; then
            python3 -m pip install --quiet pytest
            python3 -m pytest scripts/lint/test_lint_claude_headless_limits.py -q
          fi

      # Claude-headless-model-pin lint: the SAME class of gap recurring on
      # its own sibling. lint_claude_headless_model_pin.py (introduced
      # #4430, 2026-08-20) reuses the exact engine armed above, but was
      # itself merged without ever being wired into any workflow — built,
      # guilt+innocence-tested, and dormant, precisely the family #2
      # (Esiste ≠ Armato) shape the comment above this block already names.
      # Arms it here for real (same reasoning: pure repo-tree scan, no
      # $HOME dependency). --selftest runs first, same discipline as the
      # retracted-claims/telegram-tokens lints below — "--all reports OK"
      # is worth nothing until the guilt path is proven on THIS runner.
      - name: Claude-headless-model-pin lint (-p/--print carries --model)
        run: |
          if [ -f scripts/lint/lint_claude_headless_model_pin.py ]; then
            python3 scripts/lint/lint_claude_headless_model_pin.py --selftest
            python3 scripts/lint/lint_claude_headless_model_pin.py
          fi

      # The two ledger gates below run on EVERY PR (cheap: parse one markdown
      # file) — they are the reason this check is required at all.
      # A node's IDENTITY in a tailnet is its MagicDNS name — never HostName, never an
      # ssh alias (#1 alias-drift + #2 Esiste≠Armato). The 2026-05 laptop-handoff
      # runbook verified retained remote access with `ssh air 'tailscale status'`, a
      # command that CANNOT fail: on Pro both `air` and `air-ts` resolve to M5, so it
      # answered green from the verifier itself for three months while the handed-over
      # machine was never in the tailnet at all.
      #
      # The corpus pins both halves of the cure. Guilt: the name resolving to THIS
      # machine is its own verdict (exit 4 — never 0, never a plain absence), an
      # unreadable status is CANNOT-VERIFY (2) and never folded into absent (3), and a
      # peer whose device-reported HostName is exactly the wanted name does NOT satisfy
      # it. Innocence: a node whose HostName is "localhost" — two of six live nodes —
      # is still found, by DNSName. Mutation-verified 4/4: each cure reverted turns the
      # matching case red. Named here because in this repo a scripts/tests/ corpus runs
      # only because a workflow says so.
      - name: Tailnet node verifier keys on DNSName, not HostName or an ssh alias
        if: steps.paths.outputs.relevant == 'true'
        run: bash scripts/tests/test_verify_tailnet_node.sh

      # ------------------------------------------------------------------
      # IMMUNE CONTRACTS (2026-08-31, squad L / L08-PR1)
      #
      # W120's shape, generalised: `pending_arms_report.py --json` emitted
      # `"class"` while `organism_digest.py` read `"classification"`. The key
      # was never emitted, `.get()` returned None forever, the filter stayed
      # empty, and 262 overdue rows read as silence — with nothing red anywhere.
      # The registry pairs every machine-readable health EMITTER with its
      # CONSUMERS and this lint checks the pairing.
      #
      # The load-bearing part, and the reason this is not just two lists: the
      # lint AST-parses the declared producer and consumer FUNCTIONS and checks
      # the registry against the real source. A registry whose halves only agree
      # with each other is a fixture, not a contract (W114).
      #
      # Runs on EVERY PR, like the two ledger gates below it — parsing one JSON
      # file and a handful of python functions is cheap, and a contract gate
      # that only fires when someone remembers to touch the registry is the
      # family-#2 defect it exists to catch.
      # ------------------------------------------------------------------
      # NO `if [ -f ... ]` GUARD on any of the three steps below, deliberately.
      # The guard reads as defensive and is a disarm vector: a PR that deletes
      # the linter and its corpus makes every body a no-op, and this REQUIRED
      # job goes green with the entire gate removed (cross-family gate). This
      # job checks out the PR HEAD, so the files are present unless a PR removed
      # them — which is exactly the case that must be red.
      - name: Immune contracts self-test (the detector still detects)
        run: python scripts/lint_immune_contracts.py --selftest

      - name: Immune contracts registry matches the real emitters and consumers
        run: python scripts/lint_immune_contracts.py --check

      # Separate step from the one above ON PURPOSE: the contract check answers
      # "does the registry match the code", the shrink check answers "is the
      # debt list growing". One step for both would leave a reader unable to
      # tell which question failed.
      #
      # `origin/main` is fetched BY NAME first. `actions/checkout` with
      # fetch-depth: 0 does not reliably leave a resolvable
      # refs/remotes/origin/main on a pull_request event, and the lint treats an
      # unresolvable base as CANNOT-VERIFY (exit 3, never a pass) — correct
      # behaviour, and it would redden every innocent PR on a REQUIRED job. The
      # sibling check-ledger-no-silent-loss.yml fetches main by name for exactly
      # this reason.
      - name: known_gaps may only shrink (fetch main by name, then compare)
        run: |
          set -uo pipefail
          # The fetch is allowed to fail — a shallow or offline runner is a real
          # state — but its failure is REPORTED, not swallowed. `|| true` alone
          # would let a STALE origin/main stand in for the real baseline, and a
          # stale baseline can approve growth it never saw (cross-family gate).
          if ! git fetch --no-tags --depth=200 origin main:refs/remotes/origin/main; then
            echo "::warning::could not fetch origin/main; the shrink check below is comparing "\
                 "against whatever origin/main this checkout already had, which may be stale"
          fi
          python scripts/lint_immune_contracts.py --check --no-regrowth origin/main

      - name: Immune contracts corpus (named, because scripts/tests/ gates nothing)
        run: python -m pytest -q scripts/tests/test_lint_immune_contracts.py

      - name: PENDING-ARMS ledger parses (report smoke, exit 0 signaler)
        run: |
          if [ -f scripts/pending_arms_report.py ]; then
            python scripts/pending_arms_report.py >> "$GITHUB_STEP_SUMMARY"
          fi

      # "Io sono te — non c'è nessun operatore" (Zero, 2026-07-06): owner=operator in
      # the ledger is valid ONLY with a declared true-operator category operator[<cat>].
      # Narrow gate on purpose: fails ONLY on PHANTOM-OPERATOR lines, never on
      # pre-existing overdue tech-debt (innocent PRs stay green).
      - name: No phantom-operator lines in the ledger (strict-phantom gate)
        run: |
          if [ -f scripts/pending_arms_report.py ]; then
            python scripts/pending_arms_report.py --strict-phantom > /dev/null
          fi
