          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          echo "::notice::immune-relevant=$RELEVANT ($(printf '%s\n' "$CHANGED" | grep -c . ) changed files)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Retracted-claims lint — prove the guard, then scan every markdown
        # DELIBERATELY NOT gated on steps.paths.outputs.relevant. This guard's
        # SUBJECT is every tracked markdown file, not its own source: gating it
        # on "did an immune path change?" would leave unscanned the one PR shape
        # it exists to catch — a docs/research PR re-asserting a retracted claim
        # (W81, a guard armed against paths its subject never touches is armed
        # to nothing). It is also why this lint was born: the claim below took
        # THREE PRs to retract because each fix touched surfaces while a dated
        # record kept re-seeding it.
        #
        # --selftest FIRST, always: "--all reports OK" is worth nothing until the
        # guilt fixtures prove the scanner can still fail. The gate that only ever
        # prints OK is indistinguishable from a gate that cannot see.
        run: |
          python scripts/lint_retracted_claims.py --selftest
          python scripts/lint_retracted_claims.py --all

      - name: No Telegram bot token in the tree — prove the guard, then scan
        # DELIBERATELY NOT gated on steps.paths.outputs.relevant, for the same
        # reason as the lint above: this guard's SUBJECT is every tracked text
        # file. The PR shape it exists to catch is a token pasted into a doc, a
        # plist or a runbook — paths an "immune-relevant" filter never names
        # (W81: a guard armed against paths its subject never touches is armed
        # to nothing).
        #
        # It is here because on 2026-08-13 the live token of @Balizerobot was
        # found in cleartext on the PUBLIC default branch, inside two archived
        # planning docs, with every gate green: `detect-secrets` ships no
        # detector for this shape (measured — a file containing only a
        # token-shaped string scans to `results: {}`), and the token lived in
        # `.md`, so no language linter ever looked at it. The cost was not
        # theoretical: BotFather answers only the account that created a bot,
        # that account is lost, so that token can never be revoked.
        #
        # --selftest FIRST: "--all reports OK" is worth nothing until the guilt
        # fixtures prove the scanner can still fail.
        run: |
          python scripts/lint_telegram_tokens.py --selftest
          python scripts/lint_telegram_tokens.py --all

      - name: No literal backend_rag_v2 DSN password in the tree — prove the guard, then scan
        # DELIBERATELY NOT gated on steps.paths.outputs.relevant, same reason as
        # the Telegram-token lint above: this guard's SUBJECT is every tracked
        # text file, and the shape it exists to catch is a DSN pasted into a
        # doc, a plan, or a session transcript — paths an "immune-relevant"
        # filter never names (W81).
        #
        # Born 2026-08-21 from a live incident: a production `backend_rag_v2`
        # Postgres password reached origin/main from TWO independent files
        # (apps/wa-mirror/scripts/api_server.py, 2026-08-06 — squash-merged
        # out of history but public while the PR was open; apps/backend-rag/
        # scripts/sync_targeted.py, live from 2026-05-23 — the day AFTER the
        # sweep that redacted the FIRST leak's copies, proving a sweep bonifies
        # the past and not the future). Once in the tree, the second literal
        # was copy-pasted into 24 more locations across docs/plans/sessions
        # before this guard existed to catch it. `detect-secrets` ships no
        # detector for a bare DSN password (no recognizable key-shape prefix),
        # and `secrets_permissions_audit.py` matches by file NAME/path and
        # deliberately never opens contents.
        #
        # --selftest FIRST: "--all reports OK" is worth nothing until the guilt
        # fixtures prove the scanner can still fail.
        run: |
          python scripts/lint_pg_dsn_credentials.py --selftest
          python scripts/lint_pg_dsn_credentials.py --all

      - name: No hardcoded Google OAuth credentials in the tree — prove the guard, then scan
        # DELIBERATELY NOT gated on steps.paths.outputs.relevant, same reason as
        # the Telegram-token lint above: this guard's SUBJECT is every tracked
        # text file, and the shape it exists to catch is an OAuth blob pasted
        # into a script, a doc, or a plan — paths an "immune-relevant" filter
        # never names (W81).
        #
        # Born 2026-08-21 from a live census: ONE Google OAuth credential
        # triple (client_id / GOCSPX- client secret / 1// refresh token, from
        # an rclone gdrive remote setup) was copy-pasted into NINE one-off
        # scripts under apps/backend-rag/scripts/ and sat green on origin/main
        # for months — detect-secrets ships no GOCSPX-/1// detector, and
        # secrets_permissions_audit.py matches by file NAME, never contents.
        # A hardcoded refresh token is a LIVE long-lived credential; rotation
        # on Google Cloud Console is operator[secret] (PENDING-ARMS).
        # (Redaction merged separately in #4484; this PR arms the guard.)
        #
        # --selftest FIRST: "--all reports OK" is worth nothing until the guilt
        # fixtures prove the scanner can still fail.
        run: |
          python scripts/lint_google_oauth_credentials.py --selftest
          python scripts/lint_google_oauth_credentials.py --all

      - name: Local detect-secrets pre-flight tool — prove it can still fail
        # DELIBERATELY NOT gated on steps.paths.outputs.relevant, same reason
        # as the lints above: this tool's SUBJECT is its own guilt/innocence
        # corpus, not a path in the diff (W81 — a guard armed against paths
        # its subject never touches is armed to nothing).
        #
        # Born 2026-08-21 from a real false-negative: an ad-hoc local
        # verification snippet did `results.get('scripts/foo.py', [])` — a
        # fixed key ASSUMED to match. `detect-secrets` keys a finding by a
        # path relative to the invoking PROCESS's CWD, not the repo root, so
        # a wrong-CWD scan produced a silent false "clean" on a file with a
        # REAL unaudited finding (CI caught what the local check missed).
        # `scripts/detect_secrets_check_file.py` is the fix, and it goes
        # further than patching that one mechanism: it never trusts an
        # absent key on its own, because `detect-secrets`' `results` dict has
        # no separate "files examined" manifest — a synthetic canary secret
        # is scanned alongside the caller's real file(s) in the SAME
        # invocation, and an absent key for a real file is trusted as clean
        # ONLY once the canary proves THIS invocation's detection actually
        # works. This step does not scan the tree with it — that is the
        # detect-secrets job's job — it only proves the tool's own
        # guilt/innocence/canary-gate corpus still passes, so a future edit
        # that quietly breaks the canary mechanism is caught here, not the
        # next time someone happens to run --selftest by hand. Needs the
        # real `detect-secrets` binary — this job's earlier steps are pure
        # regex scanners and never install it (only the sibling
        # `detect-secrets` job in security.yml does), so it is installed
        # here, same unpinned form as that job.
        run: |
          pip install detect-secrets
          python scripts/detect_secrets_check_file.py --selftest

      - name: Gateway callers must read the VERDICT, not the exit code
        # Same reasoning as the lint above, same deliberate absence of a paths
        # gate: this guard's SUBJECT is every Python caller of tg_notify.py, and
        # the PR shape it exists to catch is a NEW caller added anywhere in the
        # tree. Gating it on "did an immune path change?" would arm it against
        # paths its subject never touches (W81).
        #
        # It matters because `tg_notify.py` exits 0 on six outcomes and three of
        # them mean "not sent to Telegram now" (deduped / p0_overflow_spooled /
        # p0_unsent_spooled), so `returncode == 0` reads a refusal as a delivery.
        # Measured 2026-08-10, after the sender-consolidation batches: SEVEN live
        # callers were blind that way. Fixing only the one that prompted the
        # census would have left six — W107 exactly.
        #
        # The script self-tests before it judges (guilt, innocence, and a
        # bystander subprocess that must NOT be caught) and exits 2 rather than
        # reporting a clean tree it did not earn.
        run: python3 scripts/tests/test_gateway_callers_read_the_verdict.py

      - name: Unit tests (guilt + innocence per tool)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          python -m pip install --quiet pytest PyYAML==6.0.3
          fail=0
          for t in \
            scripts/tests/test_agent_start.py \
            scripts/tests/test_lint_doctrine_citations.py \
            scripts/tests/test_lint_home_fork.py \
            scripts/tests/test_lint_public_asset_refs.py \
            scripts/tests/test_home_fork_stale_side_attribution.py \
            scripts/tests/test_home_fork_skipped_visibility.py \
            scripts/tests/test_proprioception_home_fork_merge.py \
            scripts/tests/test_proprioception_remedy_selection.py \
            scripts/tests/test_proprioception_self_code_staleness.py \
            scripts/tests/test_proprioception_executed_code_currency.py \
            scripts/tests/test_secrets_permissions_audit.py \
            scripts/tests/test_pending_arms_report.py \
            scripts/tests/test_lint_plist_keepalive.py \
            scripts/tests/test_arsenal_probe.py \
            scripts/tests/test_adversarial_review_gate.py \
            scripts/tests/test_nb_curator_artifact_gate.py \
            scripts/tests/test_jules_dispatch.py \
            scripts/tests/test_codex_autofix_selector.py \
            scripts/tests/test_tri_llm_claude_seat_token.py \
            scripts/tests/test_lint_doc_executable_refs.py \
            scripts/tests/test_lint_worktree_husky_symlink.py \
            scripts/tests/test_root_manifest_does_not_contradict_itself.py \
            scripts/tests/test_lock_honors_root_overrides.py \
            scripts/tests/test_fleet_dispatch.py \
            scripts/tests/test_tcc_migrate_desktop_paths.py \
            scripts/tests/test_lint_tcc_desktop_paths.py \
