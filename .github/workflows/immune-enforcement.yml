name: Immune enforcement (superscar antidotes)

# IMMUNE FORGE 2026-07-05: the executable antidotes for superscar families
# #1 (HOME-fork lint), #4 (secret-in-clear permissions audit) and #2/W81
# (PENDING-ARMS reconciliation report). This workflow proves the TOOLS stay
# faithful (their guilt+innocence unit tests) on every PR that touches them.
# The LIVE runs (real $HOME, real launchd) happen on the fleet machines —
# CI has no fleet HOME, so only the deterministic cores run here.
# Report-only tools; no schedule by design (W84: no 177th daemon).
#
# SENTINEL PATTERN (2026-07-06, Zero GO): runs on EVERY pull_request so it is
# required-safe by construction (required + paths-filter = innocent PRs stuck
# on "Expected — waiting"). The cheap ledger gates (report smoke + PHANTOM-
# OPERATOR strict gate) run on every PR; the heavier unit-test battery runs
# only when immune-relevant paths changed (in-job detection, merge-base diff —
# over-trigger is the safe direction, an under-match would skip real guards).

on:
  workflow_dispatch:
  pull_request:
  merge_group:

concurrency:
  group: immune-enforcement-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  antidotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # blob:none — partial clone: every commit and tree, no file contents (fetched on
          # demand). `fetch-depth: 0` is KEPT, so this gate's `git diff --name-only` resolves
          # exactly as before; only blob DELIVERY becomes lazy. Measured on this repository:
          # a full clone moves 2,289 MB, blob:none moves 23.3 MB in 21s.
          # Not a tidy-up: on 2026-07-27 this same checkout ate 297s of a 300s job budget in
          # adversarial-review-gate and 597s of 600s in P6 and was KILLED, so those gates never
          # ran. A timeout kill reports `cancelled`, and a cancelled REQUIRED check EJECTS the
          # merge-queue entry, which then sits open with auto-merge off. See #3375 for the
          # measurement and for why the flag's presence in the fetch log — not a green check —
          # is the proof (an unsupported input is silently ignored by Actions).
          filter: blob:none

      - name: Detect immune-relevant changes (sentinel path check)
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            # workflow_dispatch or missing event context: run the full battery.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no PR context — full battery"
            exit 0
          fi
          MB=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          CHANGED=$(git diff --name-only "$MB" "$HEAD_SHA")
          RELEVANT=false
          # NOTE on the `.github/workflows/*` entries at the end of this list:
          # test_ci_service_images_use_mirror.py scans EVERY workflow file, so its
          # SUBJECTS have to trigger this job too. Listing only immune-enforcement.yml
          # left that guard armed against the one file nobody would ever un-mirror —
          # a test in the run-loop whose subject never wakes the job is armed to
          # nothing. The glob supersedes the old literal entry, which shellcheck
          # correctly flagged as dead (SC2222); it was removed, not kept as decor.
          while IFS= read -r f; do
            case "$f" in
              scripts/lint_home_fork.py|\
              scripts/proprioception.py|\
              scripts/secrets_permissions_audit.py|\
              scripts/pending_arms_report.py|\
              scripts/lint_plist_keepalive.py|\
              scripts/arsenal_probe.py|\
              scripts/check_adversarial_review.py|\
              scripts/jules_dispatch.py|\
              scripts/lint_test_reward_hacking.py|\
              scripts/test_lint_test_reward_hacking.py|\
              scripts/codex/codex-nightly-autofix-ci.sh|\
              scripts/tests/test_lint_home_fork.py|\
              scripts/tests/test_home_fork_stale_side_attribution.py|\
              scripts/tests/test_proprioception_home_fork_merge.py|\
              scripts/tests/test_secrets_permissions_audit.py|\
              scripts/tests/test_pending_arms_report.py|\
              scripts/tests/test_lint_plist_keepalive.py|\
              scripts/tests/test_arsenal_probe.py|\
              scripts/tests/test_adversarial_review_gate.py|\
              scripts/tests/test_jules_dispatch.py|\
              scripts/tests/test_codex_autofix_selector.py|\
              scripts/codex_tri_llm_review.py|\
              scripts/tests/test_tri_llm_claude_seat_token.py|\
              scripts/lint_doc_executable_refs.py|\
              scripts/tests/test_lint_doc_executable_refs.py|\
              scripts/lint_worktree_husky_symlink.py|\
              scripts/tests/test_lint_worktree_husky_symlink.py|\
              infra/doc-lint/*|\
              docs/wr2/*.md|\
              infra/home-fork/declared-pairs.json|\
              scripts/tcc_migrate_desktop_paths.py|\
              scripts/lint_tcc_desktop_paths.py|\
              scripts/tests/test_tcc_migrate_desktop_paths.py|\
              scripts/tests/test_lint_tcc_desktop_paths.py|\
              infra/tcc-desktop-paths/allowlist.txt|\
              scripts/launchd_liveness_detector.py|\
              scripts/tests/test_launchd_liveness_exit_status_decode.py|\
              scripts/tests/test_launchd_liveness_marker_freshness.py|\
              scripts/tests/test_launchd_liveness_stale_exit_recovery.py|\
              scripts/prepush_classify.py|\
              scripts/tests/test_prepush_classify.py|\
              .husky/pre-push|\
              scripts/tests/test_prepush_failclosed.sh|\
              scripts/docs_audit.py|\
              scripts/docs_inventory_refresh_liveness.py|\
              scripts/docs_inventory_regen.sh|\
              scripts/tests/test_docs_audit.py|\
              scripts/tests/test_docs_inventory_refresh_liveness.py|\
              scripts/tests/test_docs_inventory_regen.py|\
              scripts/lib/fly_credential.sh|\
              scripts/test_fly_credential.sh|\
              scripts/lib/offsite_verify.sh|\
              scripts/test_offsite_verify.sh|\
              scripts/fly-pg-backup.sh|\
              scripts/wr2-cron-wrapper.sh|\
              scripts/cron-wrapper.sh|\
              scripts/cron-state.sh|\
              scripts/test_cron_state_alert.sh|\
              infra/scripts/fly-backup.sh|\
              scripts/test_fly_backup_phases.sh|\
              scripts/ci/queue_rearm.sh|\
              scripts/ci/queue_rearm_classify.sh|\
              scripts/ci/queue_rearm_population.sh|\
              scripts/ci/test_queue_rearm_classify.sh|\
              scripts/ci/test_queue_rearm_population.sh|\
              scripts/ci/telegram_verdict.sh|\
              scripts/ci/telegram_notify.sh|\
              scripts/ci/test_telegram_verdict.sh|\
              scripts/tests/test_fly_backup_timeouts.py|\
              scripts/tests/test_no_import_time_chdir_in_tests.py|\
              scripts/tests/test_husky_prepush_venv_guard.py|\
              scripts/tests/test_immune_enforcement_trigger_symmetry.py|\
              scripts/tests/test_ci_service_images_use_mirror.py|\
              .claude/skills/modus/PENDING-ARMS.md|\
              .github/workflows/*.yml|\
              .github/workflows/*.yaml)
                RELEVANT=true
                break
                ;;
            esac
          done <<< "$CHANGED"
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          echo "::notice::immune-relevant=$RELEVANT ($(printf '%s\n' "$CHANGED" | grep -c . ) changed files)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Unit tests (guilt + innocence per tool)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          python -m pip install --quiet pytest
          fail=0
          for t in \
            scripts/tests/test_lint_home_fork.py \
            scripts/tests/test_home_fork_stale_side_attribution.py \
            scripts/tests/test_proprioception_home_fork_merge.py \
            scripts/tests/test_secrets_permissions_audit.py \
            scripts/tests/test_pending_arms_report.py \
            scripts/tests/test_lint_plist_keepalive.py \
            scripts/tests/test_arsenal_probe.py \
            scripts/tests/test_adversarial_review_gate.py \
            scripts/tests/test_jules_dispatch.py \
            scripts/tests/test_codex_autofix_selector.py \
            scripts/tests/test_tri_llm_claude_seat_token.py \
            scripts/tests/test_lint_doc_executable_refs.py \
            scripts/tests/test_lint_worktree_husky_symlink.py \
            scripts/tests/test_tcc_migrate_desktop_paths.py \
            scripts/tests/test_lint_tcc_desktop_paths.py \
            scripts/tests/test_launchd_liveness_exit_status_decode.py \
            scripts/tests/test_launchd_liveness_marker_freshness.py \
            scripts/tests/test_launchd_liveness_stale_exit_recovery.py \
            scripts/tests/test_prepush_classify.py \
            scripts/tests/test_docs_audit.py \
            scripts/tests/test_docs_inventory_refresh_liveness.py \
            scripts/tests/test_docs_inventory_regen.py \
            scripts/tests/test_fly_backup_timeouts.py \
            scripts/tests/test_no_import_time_chdir_in_tests.py \
            scripts/tests/test_ci_service_images_use_mirror.py \
            scripts/tests/test_husky_prepush_venv_guard.py \
            scripts/tests/test_immune_enforcement_trigger_symmetry.py \
            scripts/test_lint_test_reward_hacking.py ; do
            if [ -f "$t" ]; then
              echo "::group::$t"
              python -m pytest "$t" -q || fail=1
              echo "::endgroup::"
            else
              echo "::notice::skip (absent) $t — expected only in the window before its lane's PR merges"
            fi
          done
          exit $fail

      - name: Fly credential resolver corpus (shell, guilt + innocence, both historical worlds)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # W106: shipped with #3176 and named by NO workflow until now, so its 24 checks
          # ran nowhere — a test no workflow names is not coverage, it only looks like it.
          # No `if [ -f ]` skip here: this file is on main, so absent means deleted, and a
          # deleted corpus must go red rather than quietly pass.
          bash scripts/test_fly_credential.sh

      - name: Off-site artifact gate corpus (guilt + innocence)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # The gate that makes fly-pg-backup.sh judge the ARTIFACT instead of its own
          # last line. Named here at birth, for the same reason as the corpus above.
          bash scripts/test_offsite_verify.sh

      - name: Pre-push fail-closed corpus (W101 shell-semantics + task #60 stranded-clone-DB)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # scripts/tests/test_prepush_failclosed.sh was on main, named by NO
          # workflow (task #92 arm condition: same disease as the two corpora
          # above — a test with no executor is not coverage). This is a POSIX
          # sh script, not pytest — appending it to the `python -m pytest ...`
          # loop above would collect nothing and pass silently, the identical
          # bug one level down inside the fix for it. It needs its own step
          # with the exit code read directly, same as test_fly_credential.sh
          # and test_offsite_verify.sh just above. No `if [ -f ]` skip: this
          # file is on main, so absent means deleted, and a deleted corpus
          # must go red rather than quietly pass.
          bash scripts/tests/test_prepush_failclosed.sh

      - name: cron-state failure alert corpus (guilt + innocence + fail-open)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # cron-state.sh wrote a receipt and never spoke. The 03:00 Postgres backup runs
          # under it, so its failure was silent while the 03:20 twin alerted. Named here at
          # birth: an alarm nobody exercises is the thing it was built to prevent.
          bash scripts/test_cron_state_alert.sh

      - name: Backup phase composition corpus (one dead phase must not kill the other)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # `set -e` + a bare pipeline decapitated the PG_EXIT capture, so a failing
          # Postgres phase silently skipped the Qdrant phase entirely. Measured on the
          # bucket: the qdrant nightly is missing for exactly the night PG failed.
          bash scripts/test_fly_backup_phases.sh

      - name: Merge-queue re-arm corpora (classifier + population, guilt + innocence)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # Both corpora shipped complete and NEITHER was named by any workflow —
          # `test_queue_rearm_classify.sh` had been on main since #3342, executed by
          # nothing. A guilt+innocence corpus that never runs is the exact shape it
          # was written to prevent (superscar #2), one level down: the guard of the
          # guard, unarmed.
          #
          # What they pin: the classifier must never retry a CODE red and must never
          # read an unfinished check as "no failure"; the population reader must count
          # a pull request whose mergeability GitHub has not finished computing as
          # UNDECIDABLE rather than dropping it into the clean bucket. That third
          # `mergeable` value is why this step exists — measured 2026-07-28, the tool
          # reported "0 orphaned" seconds after a merge to main and 13 minutes later,
          # same code, same world.
          bash scripts/ci/test_queue_rearm_classify.sh
          bash scripts/ci/test_queue_rearm_population.sh

      - name: Telegram delivery verdict corpus (guilt + innocence + fail-closed)
        if: steps.paths.outputs.relevant == 'true'
        run: |
          # W104 on the CI surface: 12 of the 14 `curl .../sendMessage` calls in this
          # repo judged their own delivery by curl's EXIT CODE, which is 0 whenever the
          # server answers — including HTTP 401 with a well-formed
          # {"ok":false,"description":"Unauthorized"} after a token rotation. Every one
          # of those alarms was, by construction, unable to report its own silence.
          #
          # What this pins: 401/403/400/429 are refusals, `"ok":false` under an HTTP 200
          # is a refusal (the status line is not the authority, the body is), the word
          # "true" appearing anywhere else in the payload is NOT a delivery, and an
          # absent status is CANNOT-VERIFY rather than success — a blind check is not a
          # clean check.
          bash scripts/ci/test_telegram_verdict.sh

      - name: declared-pairs.json is valid JSON with sane shape
        if: steps.paths.outputs.relevant == 'true'
        run: |
          python - << 'EOF'
          import json, sys
          data = json.load(open("infra/home-fork/declared-pairs.json"))
          assert isinstance(data.get("pairs"), list) and data["pairs"], "pairs empty"
          for p in data["pairs"]:
              assert p.get("live", "").startswith("~/"), p
              assert p.get("repo"), p
          print(f"OK: {len(data['pairs'])} declared pairs, {len(data.get('allow', []))} allow globs")
          EOF

      # Doc-executable-refs lint runs FOR REAL on every PR (not just its own
      # unit tests): unlike lint_home_fork.py it has no $HOME dependency — it
      # is a pure repo-tree scan, so CI can enforce the live check directly.
      # 2026-07-14 WR2 deep audit item 11: docs cited scripts/wr2_carousel_
      # orchestrator.py + scripts/wr2_telegram_publish_gate.py as entry points
      # years after both were deleted. This is the antidote that turns that
      # class of drift into a build-blocking fact.
      - name: Doc-executable-refs lint (docs cite only real scripts/*.py|.sh)
        run: |
          if [ -f scripts/lint_doc_executable_refs.py ]; then
            python scripts/lint_doc_executable_refs.py
          fi

      # TCC-Desktop-paths lint runs FOR REAL on every PR (same reasoning as
      # doc-executable-refs above): a pure `git ls-files` tree scan, no $HOME
      # dependency, so CI can enforce it directly rather than only testing the
      # tool. Antidote for the 2026-07-16 W84 repo-move: the repo itself was
      # the regeneration source for the Desktop/nuzantara path (proven live —
      # a sync hook re-copied a Desktop-hardcoded default into a HOME payload
      # within 15 minutes of a manual fix). Scope is *.sh/*.py/*.plist only;
      # declared exceptions live in infra/tcc-desktop-paths/allowlist.txt.
      - name: TCC-Desktop-paths lint (no *.sh/*.py/*.plist hardcodes ~/Desktop/nuzantara)
        run: |
          if [ -f scripts/lint_tcc_desktop_paths.py ]; then
            python scripts/lint_tcc_desktop_paths.py
          fi

      # Claude-headless-limits lint runs FOR REAL on every PR (same reasoning
      # as doc-executable-refs / tcc-desktop-paths above): pure repo-tree
      # scan, no $HOME dependency, so CI can enforce it directly rather than
      # only testing the tool's guilt+innocence corpus in isolation. Antidote
      # for family #2 (Esiste ≠ Armato): the lint existed with 0 findings on
      # the real repo but was wired into no workflow at all — this step arms
      # it (SPEC-abcd.md Unita A, 2026-07-16).
      - name: Claude-headless-limits lint (tool-armed -p/--print carries --max-budget-usd)
        run: |
          if [ -f scripts/lint/lint_claude_headless_limits.py ]; then
            python3 scripts/lint/lint_claude_headless_limits.py
          fi
          if [ -f scripts/lint/test_lint_claude_headless_limits.py ]; then
            python3 -m pip install --quiet pytest
            python3 -m pytest scripts/lint/test_lint_claude_headless_limits.py -q
          fi

      # The two ledger gates below run on EVERY PR (cheap: parse one markdown
      # file) — they are the reason this check is required at all.
      - name: PENDING-ARMS ledger parses (report smoke, exit 0 signaler)
        run: |
          if [ -f scripts/pending_arms_report.py ]; then
            python scripts/pending_arms_report.py >> "$GITHUB_STEP_SUMMARY"
          fi

      # "Io sono te — non c'è nessun operatore" (Zero, 2026-07-06): owner=operator in
      # the ledger is valid ONLY with a declared true-operator category operator[<cat>].
      # Narrow gate on purpose: fails ONLY on PHANTOM-OPERATOR lines, never on
      # pre-existing overdue tech-debt (innocent PRs stay green).
      - name: No phantom-operator lines in the ledger (strict-phantom gate)
        run: |
          if [ -f scripts/pending_arms_report.py ]; then
            python scripts/pending_arms_report.py --strict-phantom > /dev/null
          fi
