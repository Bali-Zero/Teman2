name: Immune enforcement (superscar antidotes)

# IMMUNE FORGE 2026-07-05: the executable antidotes for superscar families
# #1 (HOME-fork lint), #4 (secret-in-clear permissions audit) and #2/W81
# (PENDING-ARMS reconciliation report). This workflow proves the TOOLS stay
# faithful (their guilt+innocence unit tests) on every PR that touches them.
# The LIVE runs (real $HOME, real launchd) happen on the fleet machines —
# CI has no fleet HOME, so only the deterministic cores run here.
# Report-only tools; no schedule by design (W84: no 177th daemon).
#
# SENTINEL PATTERN (2026-07-06, Zero GO): runs on EVERY pull_request so it is
# required-safe by construction (required + paths-filter = innocent PRs stuck
# on "Expected — waiting"). The cheap ledger gates (report smoke + PHANTOM-
# OPERATOR strict gate) run on every PR; the heavier unit-test battery runs
# only when immune-relevant paths changed (in-job detection, merge-base diff —
# over-trigger is the safe direction, an under-match would skip real guards).

on:
  workflow_dispatch:
  pull_request:
  merge_group:

concurrency:
  # Dependabot branch: ALL Dependabot PRs share one group per workflow (not
  # per-ref), bounding concurrent Dependabot runs of THIS workflow to <=2
  # (Agent PR Contract rule 5) instead of unbounded parallel.
  # cancel-in-progress:false protects whichever run is RUNNING; GitHub keeps
  # only one PENDING per group, so a 3rd+ near-simultaneous arrival cancels
  # the pending run rather than queuing behind it — visible in the PR's
  # checks tab (never silent), recoverable with `gh run rerun` (confirmed:
  # docs.github.com/en/actions/using-jobs/using-concurrency + kimi-code/k3
  # refuter round on PR #5043). Non-Dependabot branch is byte-for-byte the
  # pre-existing expression — untouched.
  group: ${{ github.actor == 'dependabot[bot]' && format('dependabot-lockfile-{0}', github.workflow) || format('immune-enforcement-{0}', github.ref) }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'merge_group' }}

jobs:
  antidotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # blob:none — partial clone: every commit and tree, no file contents (fetched on
          # demand). `fetch-depth: 0` is KEPT, so this gate's `git diff --name-only` resolves
          # exactly as before; only blob DELIVERY becomes lazy. Measured on this repository:
          # a full clone moves 2,289 MB, blob:none moves 23.3 MB in 21s.
          # Not a tidy-up: on 2026-07-27 this same checkout ate 297s of a 300s job budget in
          # adversarial-review-gate and 597s of 600s in P6 and was KILLED, so those gates never
          # ran. A timeout kill reports `cancelled`, and a cancelled REQUIRED check EJECTS the
          # merge-queue entry, which then sits open with auto-merge off. See #3375 for the
          # measurement and for why the flag's presence in the fetch log — not a green check —
          # is the proof (an unsupported input is silently ignored by Actions).
          filter: blob:none

      - name: Detect immune-relevant changes (sentinel path check)
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            # workflow_dispatch or missing event context: run the full battery.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no PR context — full battery"
            exit 0
          fi
          MB=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          CHANGED=$(git diff --name-only "$MB" "$HEAD_SHA")
          RELEVANT=false
          # NOTE on the `.github/workflows/*` entries at the end of this list:
          # test_ci_service_images_use_mirror.py scans EVERY workflow file, so its
          # SUBJECTS have to trigger this job too. Runtime Truth also keeps the
          # immune workflow as an exact self-trigger: removing or narrowing these
          # globs must not make a change to the required workflow auto-skip its
          # own contracts. The exact entry is therefore a deliberate overlap.
          # `.claude/skills/*/*.md` below is EVERY markdown under a skill dir, not
          # just SKILL.md: the doctrine citation lint's subjects are
          # `.claude/skills/**/*.md`, and a filter enumerating only SKILL.md left a
          # phantom in any other file free to land on a PR that never ran the
          # finder. That pattern SUBSUMES the former explicit
          # `.claude/skills/modus/PENDING-ARMS.md` entry, removed because actionlint
          # reports the pair as SC2221 — the ledger file still triggers this job
          # (verified by simulating this very case block), so nothing that depended
          # on it is disarmed.
          while IFS= read -r f; do
            case "$f" in
              scripts/lint_home_fork.py|\
              scripts/proprioception.py|\
              scripts/agent_start.py|\
              scripts/tests/test_agent_start.py|\
              scripts/tests/test_proprioception_run_wrap_exit_code.py|\
              scripts/hooks/proprioception_sessionstart.sh|\
              scripts/tests/test_proprioception_receptor_ranking.sh|\
              scripts/tests/test_proprioception_finding_count.sh|\
              scripts/secrets_permissions_audit.py|\
              scripts/pending_arms_report.py|\
              scripts/lint_immune_contracts.py|\
              scripts/tests/test_lint_immune_contracts.py|\
              infra/immune-contracts/contracts.json|\
              scripts/organism_digest.py|\
              scripts/arsenal_probe.py|\
              scripts/lib/heartbeat.sh|\
              scripts/lib/wr2_runtime_stamp.py|\
              scripts/lint_plist_keepalive.py|\
              scripts/arsenal_probe.py|\
              scripts/check_adversarial_review.py|\
              scripts/nb_curator_artifact_gate.py|\
              scripts/tests/test_nb_curator_artifact_gate.py|\
              scripts/jules_dispatch.py|\
              scripts/lint_test_reward_hacking.py|\
              scripts/test_lint_test_reward_hacking.py|\
              scripts/codex/codex-nightly-autofix-ci.sh|\
              scripts/tests/test_lint_home_fork.py|\
              scripts/tests/test_home_fork_stale_side_attribution.py|\
              scripts/tests/test_home_fork_skipped_visibility.py|\
              scripts/tests/test_proprioception_home_fork_merge.py|\
              scripts/tests/test_proprioception_remedy_selection.py|\
              scripts/tests/test_proprioception_self_code_staleness.py|\
              scripts/tests/test_proprioception_executed_code_currency.py|\
              scripts/tests/test_secrets_permissions_audit.py|\
              scripts/tests/test_pending_arms_report.py|\
              scripts/tests/test_lint_plist_keepalive.py|\
              scripts/tests/test_arsenal_probe.py|\
              scripts/tests/test_adversarial_review_gate.py|\
              scripts/tests/test_jules_dispatch.py|\
              scripts/tests/test_codex_autofix_selector.py|\
              scripts/codex_tri_llm_review.py|\
              scripts/lib/codex_seat.sh|\
              scripts/lib/codex_seat.py|\
              scripts/tests/test_codex_seat_lib.py|\
              scripts/tests/test_claude_cascade_shell.py|\
              infra/launchagents/wrappers/claude-cascade.sh|\
              scripts/auth_sentinel.py|\
