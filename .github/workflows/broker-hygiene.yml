name: Agent worktree broker hygiene

# W62 ANTIBODY #3 — gate the agent worktree broker at PR time.
#
# Two things run here, both pure-stdlib (no backend deps):
#   1. The broker's own unit tests (scripts/tests/test_agent_start.py) — these
#      were previously orphaned from CI (NO workflow collected them).
#   2. tests/integration/test_no_stale_worktrees.py — fails the PR if the
#      checked-out .worktrees/ contains a worktree older than 24h, AND covers
#      the find_stale_worktrees detector logic.
#
# The live-checkout guard is safe to be strict: CI runs on a fresh
# actions/checkout with no live agent session, so there are no false positives.
#
# References:
#   - cicatrix-scars.md "W62 — Agent worktree broker TTL=60min violated 34×"
#   - docs/runbooks/agent-worktree-broker.md

on:
  pull_request:
    paths:
      - "scripts/agent_start.py"
      - "scripts/agent_worktree_cleanup_cron.sh"
      - "scripts/codex_automation_lib.sh"
      - "scripts/tests/test_agent_worktree_cleanup_cron.py"
      - "scripts/tests/test_agent_start.py"
      - "scripts/tests/test_codex_runtime_worktree_deps.sh"
      - "scripts/branch_graveyard_cleanup.sh"
      - "scripts/audit_agent_quarantine.py"
      - "scripts/tests/test_content_on_main_three_answers.py"
      - "scripts/tests/test_branch_graveyard_prmerged.sh"
      - "tests/integration/test_no_stale_worktrees.py"
      - "infra/launchagents/com.nuzantara.agent-worktree-cleanup.daily.plist.example"
      - "infra/launchagents/install_agent_worktree_cleanup.sh"
      - "docs/runbooks/agent-worktree-broker.md"
      - ".worktrees/**"
      - ".github/workflows/broker-hygiene.yml"
  push:
    branches: [main]
    paths:
      - "scripts/agent_start.py"
      - "scripts/agent_worktree_cleanup_cron.sh"
      - "scripts/branch_graveyard_cleanup.sh"
      - "scripts/audit_agent_quarantine.py"
      - ".worktrees/**"

concurrency:
  group: broker-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install --quiet pytest

      - name: Broker unit tests
        run: python -m pytest scripts/tests/test_agent_start.py -q

      - name: Cleanup cron wrapper tests
        run: python -m pytest scripts/tests/test_agent_worktree_cleanup_cron.py -q

      - name: No stale worktrees (24h orphan guard)
        run: python -m pytest tests/integration/test_no_stale_worktrees.py -q

      # The codex nightly automations build their OWN runtime worktree, from a
      # different code path than the broker above — and a bare `git worktree add`
      # copies no untracked deps, which killed nightly_autofix_ci for 11 of 14
      # nights (2026-08-10). This lives here because "a worktree is created
      # correctly" is one property with two implementations, and the corpus also
      # asserts the two dependency lists have not drifted apart.
      - name: Codex runtime worktree deps (venv link + broker parity)
        run: bash scripts/tests/test_codex_runtime_worktree_deps.sh

      # "Is this content on main?" is asked before a branch is deleted
      # (branch_graveyard_cleanup.sh) and before a quarantine ref is pruned
      # (audit_agent_quarantine.py). Three answers: yes, no, could not tell —
      # a failed git call is "could not tell" and never deletes.
      - name: Content-on-main deciders (a failed diff is never "landed")
        run: python -m pytest scripts/tests/test_content_on_main_three_answers.py -q

      - name: Branch graveyard category 5 (gh headRefOid matcher)
        run: sh scripts/tests/test_branch_graveyard_prmerged.sh
