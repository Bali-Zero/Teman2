# merge-gate-integrity-watch.yml — passive, non-provoking check that every
# required context had REAL, pre-merge compute before a commit landed on
# `main`, instead of a canary that would deliberately race a live merge.
#
# WHY THIS EXISTS (PENDING-ARMS idx~49, .claude/skills/modus/PENDING-ARMS.md,
# "Branch protection did not hold" / PR #3227): that incident's own gate could
# not have seen its required checks — every check-suite for the merged commit
# was created 2-3 seconds BEFORE the merge decision, so nothing had finished
# computing yet. The team-lead's explicit instruction after reviewing that
# investigation: build a DETECTOR, never a canary that provokes the same race
# on live `main` to prove a point. This workflow is that detector, wired to
# fire once per push to `main` (i.e. once per merge) instead of sitting
# unexecuted (superscar #2, "esiste != armato" — a script nobody runs is not
# a script).
#
# WHAT IT DOES NOT DO: it never blocks, cancels, or comments on anything, and
# it is NOT a required check — by construction it can only evaluate a commit
# AFTER it has already landed, so it structurally cannot gate the merge it is
# checking (gating it would just move the race one step, not close it). It
# alerts a human via the same Telegram P0/digest gateway every other watcher
# in this repo uses (tg_notify.py) so a real finding is never silent, but the
# finding itself is never auto-acted-on.
#
# See scripts/probe_merge_gate_integrity.py for the full mechanism (which
# merge_group jobs count, why a grace window exists, why exact-name matching)
# — this file is deliberately thin, matching merge-queue-watch.yml's own
# "Pure function of captured data; the workflow step just calls it" shape.

name: merge-gate-integrity-watch

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "merge commit SHA to probe (default: current main tip)"
        required: false

permissions:
  contents: read
  actions: read
  # `commits/{sha}/pulls` (how the probe resolves the authoritative merged_at)
  # is a pulls endpoint — `contents: read` alone does not reach it.
  #
  # NOT listed, because it CANNOT be: the required-context list lives on
  # `branches/main/protection`, which needs repo-ADMIN scope, and
  # `administration` is not among the permissions a workflow GITHUB_TOKEN can
  # be granted at all. That call therefore raised on every single run since
  # this workflow was armed, and the probe reported CANNOT-VERIFY every time
  # (26 consecutive failed runs on 2026-08-23 alone). The probe now falls back
  # to the checked-in snapshot infra/required.d/contexts.json — which is why
  # the checkout step above is load-bearing, not decorative.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    name: Verify required checks had real pre-merge compute
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Run the integrity probe
        id: probe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          # `set -uo pipefail` does NOT turn off `-e`: the runner's default
          # shell for `run:` is `bash --noprofile --norc -e -o pipefail {0}`,
          # so -e is already on and cannot be cancelled from inside the
          # script body. That is why the naive
          #     python3 ... > /tmp/verdict.json
          #     rc=$?
          # NEVER RAN its second line: -e aborted the step the instant the
          # probe exited non-zero, `rc` was never written to $GITHUB_OUTPUT,
          # the next step read rc="" and fell to its `*)` arm — so EVERY
          # non-zero outcome, real VIOLATION (rc=1, tier p0) included, was
          # misreported as CANNOT-VERIFY (tier digest). The alarm was not
          # merely crying: it was crying in the wrong key, and a genuine
          # branch-protection breach would have arrived as a routine digest.
          # (Superscar #2 / W101 — a fail-closed path decapitated by `-e`.)
          # `|| rc=$?` is exempt from -e because the command is part of an
          # OR-list, which is the whole point.
          set -uo pipefail
          rc=0
          python3 scripts/probe_merge_gate_integrity.py \
            --sha "$TARGET_SHA" --json > /tmp/verdict.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # The alert step json.load()s this file, so guarantee it PARSES —
          # not merely that it is non-empty. An adversarial review of this
          # very step found two ways a size-only test lets a broken file
          # through: (a) the 10-minute timeout, or any SIGKILL, can stop the
          # probe MID-PRINT, leaving valid-looking but truncated JSON; (b) a
          # `"` in a workflow_dispatch `sha` input would break a printf-built
          # fallback. Either one makes the alert step raise under `-e`, which
          # SKIPS the CANNOT-VERIFY step below via its implicit success() —
          # a red run with no Telegram at all, the exact opposite of intent.
          # json.dump also escapes the SHA for free, so (b) cannot recur.
          python3 -c '
          import json, sys
          path, sha, rc = "/tmp/verdict.json", sys.argv[1], sys.argv[2]
          try:
              with open(path) as fh:
                  json.load(fh)
          except Exception as exc:
              with open(path, "w") as fh:
                  json.dump({"verdict": "CANNOT-VERIFY", "subject": sha,
                             "error": "probe produced no parseable output "
                                      "(rc=" + rc + "): " + str(exc)}, fh)
          ' "$TARGET_SHA" "$rc"
          cat /tmp/verdict.json

      # Machine-readable rc, never re-derived from prose (W88 — judge by
      # content, and here the content IS the captured exit code, not a
      # re-parse of the JSON body).
      - name: Classify the verdict
        id: classify
        run: |
          rc="${{ steps.probe.outputs.rc }}"
          case "$rc" in
            0) echo "tier=none" >> "$GITHUB_OUTPUT" ;;
            1) echo "tier=p0" >> "$GITHUB_OUTPUT" ;;
            *) echo "tier=digest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Alert (VIOLATION -> p0, CANNOT-VERIFY -> digest, clean -> nothing)
        if: steps.classify.outputs.tier != 'none'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TIER: ${{ steps.classify.outputs.tier }}
          TARGET_SHA: ${{ github.event.inputs.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          BODY=$(python3 -c "
          import json
          d = json.load(open('/tmp/verdict.json'))
          subj = d.get('subject', '?')
          if 'error' in d:
              print(f'CANNOT-VERIFY {subj}: {d[\"error\"]}')
          else:
              findings = d.get('findings', [])
              lines = [f'VIOLATION {subj} — {len(findings)} required context(s) had no real pre-merge result:']
              lines += [f'  - {f}' for f in findings[:10]]
              if len(findings) > 10:
                  lines.append(f'  (+{len(findings) - 10} more)')
              # Carry the skipped list whenever a message is already being
              # sent. An adversarial review called the skipped reporting
              # 'decoration' because it lived only in the run log of a GREEN
              # run nobody opens — half true, and this is the half that can
              # be fixed without inventing new alarm traffic: a human already
              # reading a VIOLATION page now sees which contexts were waved
              # through as skipped on the same commit. It deliberately does
              # NOT create an alert of its own; a skipped context is not a
              # finding, and a page per docs-only merge is the fatigue this
              # whole PR exists to remove.
              skipped = d.get('skipped_contexts', [])
              if skipped:
                  lines.append(f'  (also skipped, satisfied by GitHub, not a finding: {", ".join(skipped)})')
              print(chr(10).join(lines))
          ")
          MSG="[merge-gate-integrity-watch] ${BODY}
          ${RUN_URL}"
          python3 scripts/tg_notify.py --tier "$TIER" \
            --source merge-gate-integrity-watch \
            --dedup-key "mgi-${TARGET_SHA}" \
            "$MSG"

      # Never exit non-zero on a real finding — this is a signaler, not a
      # gate, and it is not a required check. A CANNOT-VERIFY still fails the
      # RUN (not the repo) so a broken probe is visible in the Actions tab
      # rather than silently doing nothing (superscar #2).
      - name: Fail the run only on CANNOT-VERIFY, never on a real finding
        if: steps.classify.outputs.tier == 'digest'
        run: |
          echo "::warning::probe could not verify this commit — see the run log above. This is NOT the same as a clean merge; it means the probe itself needs attention."
          exit 1
