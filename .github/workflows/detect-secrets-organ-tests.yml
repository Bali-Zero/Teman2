name: Detect secrets organ tests

on:
  pull_request:
    paths: &organ_paths
      - "infra/launchagents/wrappers/mini-detect-secrets.sh"
      - "infra/launchagents/com.nuzantara.detect-secrets-fulltree.plist"
      - "scripts/tests/test_mini_detect_secrets_wrapper.sh"
      - "scripts/detect_secrets_auto_triage.py"
      - "scripts/detect_secrets_check_file.py"
      - "scripts/detect_secrets_check_unaudited.py"
      - "scripts/tg_notify.py"
      - ".github/workflows/detect-secrets-organ-tests.yml"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths: *organ_paths

permissions:
  contents: read

concurrency:
  group: detect-secrets-organ-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  detect-secrets-organ-tests:
    name: Detect secrets organ tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: The wrapper reports safely and always cleans up
        run: bash scripts/tests/test_mini_detect_secrets_wrapper.sh
      - name: The wrapper and plist still parse
        run: |
          bash -n infra/launchagents/wrappers/mini-detect-secrets.sh
          python -c 'import plistlib; plistlib.load(open("infra/launchagents/com.nuzantara.detect-secrets-fulltree.plist", "rb"))'
