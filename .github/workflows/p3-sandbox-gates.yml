name: P3 Sandbox Gates

# P3 Tier-1 egress-chokepoint gates (FASE-1 of the SOTA meta-dev-loop).
# Spec: research/operations/specs/P3-test-prod-sandbox.md §6.
#
# Two jobs, two postures (the honest split — same pattern as hot_zone_redis_lease):
#
#   1. p3-static-validation  — ENFORCING (continue-on-error: false). Runs on every
#      GitHub-hosted runner: YAML parse of both compose files, base-file-untouched
#      check (gate G2 by construction), proxy py_compile + allowlist logic, pytest
#      collect. NO Docker needed. This is the gate the meta-verifier registers as
#      ARMED/enforcing.
#
#   2. p3-runtime-gates      — MONITOR (continue-on-error: true). The real G1/G1-DLP/
#      G4 require `docker compose up --build` which GitHub ephemeral runners cannot
#      do safely. These run on Pro (workhorse, has Docker). Kept here as monitor-by-
#      design so the workflow documents them; NOT a disarm (registry note says so).

# NOTE (BUCO #1 skip→success sentinel, 2026-06-11): top-level pull_request
# `paths:` filter REMOVED so this can become a required-status-check without
# the pending-forever trap (W69). The relevant-paths decision lives in the
# "Did relevant paths change?" step; on a path-miss PR the job ENDS success.
on:
  pull_request: # NO top-level paths: — always trigger (sentinel gates the work)
  workflow_dispatch:

jobs:
  p3-static-validation:
    name: P3 static validation (enforcing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the sentinel git diff sees PR changes

      # BUCO #1 sentinel (pattern: p1s2-mutation-incremental.yml). The regex is
      # the EXACT original pull_request `paths:` list, each anchored ^...$.
      - name: Did relevant paths change?
        id: relevant
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::non-PR event (${{ github.event_name }}) — running full gate"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE \
            '^(apps/backend-rag/docker-compose\.test\.yml|apps/backend-rag/docker-compose\.sandbox\.yml|apps/backend-rag/sandbox/.*|apps/backend-rag/tests/integration/test_p3_sandbox_egress\.py|\.github/workflows/p3-sandbox-gates\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no relevant paths changed — sentinel success"
          fi

      - uses: actions/setup-python@v5
        if: steps.relevant.outputs.run == 'true'
        with:
          python-version: "3.11"
      - name: install pyyaml
        if: steps.relevant.outputs.run == 'true'
        run: pip install "pyyaml>=6" "httpx>=0.27" pytest
      # ENFORCING gate — this step blocks the PR if it fails. continue-on-error: false.
      - name: P3 static gates
        if: steps.relevant.outputs.run == 'true'
        continue-on-error: false
        run: |
          set -euo pipefail
          echo "== compose files parse =="
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ['apps/backend-rag/docker-compose.test.yml','apps/backend-rag/docker-compose.sandbox.yml']]; print('parse OK')"
          echo "== base file UNTOUCHED (gate G2 by construction) =="
          git fetch origin ${{ github.base_ref }} --depth=1
          if ! git diff --quiet origin/${{ github.base_ref }} -- apps/backend-rag/docker-compose.test.yml; then
            echo "FAIL: docker-compose.test.yml was modified — breaks the integration suite (G2)."
            exit 1
          fi
          echo "base file untouched OK"
          echo "== proxy compiles + allowlist logic =="
          python3 -m py_compile apps/backend-rag/sandbox/egress_proxy.py
          EGRESS_ALLOWLIST="api.anthropic.com,github.com" python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('ep', 'apps/backend-rag/sandbox/egress_proxy.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m._host_allowed('api.anthropic.com')
          assert m._host_allowed('sub.github.com')
          assert not m._host_allowed('evil.example.com')
          assert not m._host_allowed('notgithub.com')
          print('allowlist logic OK')
          PY
          echo "== gate tests collect =="
          # --noconftest: this gate only proves the test file PARSES + COLLECTS.
          # The shared tests/integration/conftest.py imports pytest_asyncio +
          # testcontainers (the full async/Docker stack) at module level — none of
          # which test_p3_sandbox_egress.py uses (it is subprocess-only, with its
          # own pytestmark skip). Loading that conftest here would force installing
          # the whole backend test stack just to collect 5 subprocess tests.
          cd apps/backend-rag && PYTHONPATH=. python -m pytest tests/integration/test_p3_sandbox_egress.py --collect-only -q --noconftest

  p3-runtime-gates:
    name: P3 runtime gates G1/G1-DLP/G4 (monitor — runs on Pro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # MONITOR step — GitHub ephemeral runners have no safe Docker daemon for
      # `compose up --build`. The real runtime gates run on Pro. continue-on-error:
      # true is intentional (NOT a disarm — see registry note hot_zone_redis_lease
      # for the established pattern).
      - name: P3 runtime gates (Docker — Pro only)
        continue-on-error: true
        run: |
          echo "P3 runtime gates G1/G1-DLP/G4 require Docker (compose up --build)."
          echo "GitHub-hosted runners cannot run them safely — they execute on Pro:"
          echo "  docker compose -f apps/backend-rag/docker-compose.test.yml \\"
          echo "                 -f apps/backend-rag/docker-compose.sandbox.yml up -d --build"
          echo "  cd apps/backend-rag && PYTHONPATH=. pytest tests/integration/test_p3_sandbox_egress.py -v"
          echo "Monitor-by-design (NOT a disarm)."
