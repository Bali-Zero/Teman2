name: Main-push Failure Watch

# Task #23 (superscar #2, "Esiste ≠ Armato" — cicatrix-superscar.md #2). One
# generic watcher for every workflow's completion, replacing the pattern this
# repo independently reinvented three times: fly-deploy.yml's own dedicated
# alert job, and two narrowly-scoped scripts
# (scripts/docs_inventory_refresh_liveness.py, scripts/merge_train.py) each
# hardcoded to one or two workflow names. GitHub aggregates the whole job
# graph into `workflow_run.conclusion`, correctly folding in a skip-cascade
# from an upstream job failure — the exact `needs:`-completeness trap that
# bit fly-deploy.yml's own alert job (`deploy-failure-alert` watches only 2
# of up to 6 fail-prone jobs; task #19). One artifact instead of N hand-rolled
# ones means it cannot be individually forgotten on a new workflow — enforced
# by watcher-conformance.yml, which fails CI if this file's `workflows:` list
# drifts from the live workflow census.
#
# SCOPE: alerts ONLY for a push-triggered run on `main` — not for
# pull_request runs (already visible on the PR itself) and not for
# schedule/workflow_dispatch runs on other branches. The `workflows:` list
# below is DELIBERATELY over-inclusive (every workflow in the repo, this
# file's own name excluded) so listing it never requires a push:main
# judgment call — real filtering happens in the job `if:` below, on the
# actual event + branch of the run that just completed.
#
# GOTCHAS (verified 2026-07-26 against GitHub's docs + this repo's live API,
# not assumed):
#  - `workflow_run` only activates once this file is ON THE DEFAULT BRANCH —
#    it cannot be exercised from a branch or PR. First-fire proof has to
#    happen post-merge: re-run (or wait for) a real failure on a workflow in
#    the list, or use workflow_dispatch on a target workflow to force one.
#  - `workflow_run` chaining is capped at 3 levels by GitHub — this file
#    deliberately does NOT include its own `name:` (above) in `workflows:`
#    below, so it can never watch its own completion (self-trigger loop).
#    Confirmed empirically: `workflows:` matches by a workflow's `name:`
#    field, not its filename (this repo has exactly 1 name per file, 82/82,
#    zero collisions — re-verified against the live file set before writing
#    this list, including this file and watcher-coverage.yml itself).
#  - `cancelled` is deliberately excluded from the alert condition below: THIS
#    job's own concurrency group cancels its own earlier in-flight instance on
#    every new event in a burst (see below), and a normal supersede-cancel of
#    a WATCHED workflow (a newer push lands mid-run) is routine, not a silent
#    failure — alerting on it would itself be the noise this design exists to
#    avoid.

on:
  workflow_run:
    # 2 entries below ("Guard conformance (superscar", "Golden Rule") look
    # truncated — they are not a transcription error here. Their SOURCE
    # files have an unquoted `#` in `name:`, which YAML (and GitHub's own
    # registration, confirmed live via `gh api .../actions/workflows`)
    # reads as a comment start. This list intentionally matches what
    # GitHub actually registered, not what the source file's author meant
