name: cron - fly restart loop detector (every 15 min)

# Migrated from Pro crontab `*/15 * * * * fly-restart-loop-detector.sh` (2026-04-26).
# Detects machines NOT in expected state or unhealthy checks across critical Fly apps.
# Cooldown: 30min per app, persisted via Actions cache.
#
# 2026-06-02 (infra/fly-crashloop-autoheal): added auto-recovery. A machine stuck
# `stopped` after a crashloop (last exit event exit_code != 0) is NOT healthy
# autostop-idle — a fixing deploy stages the new image but does NOT force-boot a
# dead machine, so a fixed image can sit unused for hours serving 503s (verified
# incident 2026-06-02: nuzantara-rag rag worker, fix deployed 23:51Z, never ran
# until manual `fly machine start`). The detector now force-starts ONLY machines
# in that crashed-stopped state, with its own cooldown, and alerts on the action.
# Idle autostop machines (clean stop / exit_code 0) are left untouched.
#
# 2026-06-27 (infra/fly-oom-detector): also alerts on recent OOM/restart events
# even when Fly successfully restarts the machine and all checks are green again.
# Without this, an API OOM can be operationally invisible after recovery.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-fly-restart-detector
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLDOWN_KEY: fly-restart-detector-cooldown-v1
      COOLDOWN_SECONDS: "1800"
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Restore cooldown state
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cooldown.state
          key: ${{ env.COOLDOWN_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.COOLDOWN_KEY }}-

      - name: Check fly fleet for restart anomalies
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          STATE="$RUNNER_TEMP/cooldown.state"
          touch "$STATE"
          NOW=$(date +%s)
          ALERTS=""
          # machines to auto-recover, as "app/machine_id" lines (consumed by next step)
          RECOVER=""

          should_alert() {
            local key="$1"
            local last=$(grep "^${key}:" "$STATE" 2>/dev/null | tail -1 | cut -d: -f2)
            if [ -z "$last" ]; then return 0; fi
            local age=$(( NOW - last ))
            [ "$age" -ge "$COOLDOWN_SECONDS" ]
          }

          mark_alerted() {
            local key="$1"
            grep -v "^${key}:" "$STATE" > "${STATE}.tmp" 2>/dev/null || true
            echo "${key}:${NOW}" >> "${STATE}.tmp"
            mv "${STATE}.tmp" "$STATE"
          }

          for app in nuzantara-rag nuzantara-postgres; do
            RAW=$(flyctl status --json -a "$app" 2>&1 || true)
            SUMMARY=$(RAW="$RAW" python3 <<'PY' 2>/dev/null || echo "PARSE_ERROR"
          import json, os, sys
          try:
              d = json.loads(os.environ.get("RAW", ""))
          except Exception:
              print("PARSE_ERROR")
              sys.exit(0)
          machines = d.get("Machines", []) or []
          total = len(machines)
          started = sum(1 for m in machines if m.get("state") == "started")
          bad = [m.get("state", "?") for m in machines if m.get("state") != "started"]
          unhealthy = 0
          for m in machines:
              for c in (m.get("checks") or []):
                  if c.get("status") not in ("passing", None):
                      unhealthy += 1
          # Crashed-stopped detection: a stopped machine whose most-recent exit
          # event carries a non-zero exit_code (app crashed), as opposed to a
          # clean idle autostop (no exit_event / exit_code 0). These are the
          # machines that will NOT self-recover from a later fixing deploy.
          crashed = []
          oom = []
          for m in machines:
              machine_id = m.get("id", "?")
              last_exit = None
              saw_oom = False
              for e in (m.get("events") or []):  # events are newest-first
                  req = e.get("request") or {}
                  ee = req.get("exit_event") or {}
                  oom_killed = ee.get("oom_killed", req.get("oom_killed", e.get("oom_killed")))
                  exit_code = ee.get("exit_code")
                  if (
                      oom_killed is True
                      or str(oom_killed).lower() == "true"
                      or str(exit_code) == "137"
                  ):
                      saw_oom = True
                  if last_exit is None and "exit_code" in ee and ee.get("exit_code") is not None:
                      last_exit = exit_code
              if saw_oom:
                  oom.append(machine_id)
              if m.get("state") == "stopped" and last_exit is not None and str(last_exit) != "0":
                  crashed.append(machine_id)
          print(f"total={total}|started={started}|bad={','.join(bad) or 'none'}|unhealthy={unhealthy}|crashed={','.join(crashed) or 'none'}|oom={','.join(oom) or 'none'}")
          PY
          )
            echo "[$app] $SUMMARY"
            if echo "$SUMMARY" | grep -q "PARSE_ERROR"; then
              if should_alert "${app}_unreachable"; then
                ALERTS="${ALERTS}🛫 <b>${app}</b>: fly status CLI failed"$'\n'
                mark_alerted "${app}_unreachable"
              fi
              continue
            fi
            STARTED=$(echo "$SUMMARY" | tr '|' '\n' | grep ^started= | cut -d= -f2)
            TOTAL=$(echo "$SUMMARY" | tr '|' '\n' | grep ^total= | cut -d= -f2)
            BAD=$(echo "$SUMMARY" | tr '|' '\n' | grep ^bad= | cut -d= -f2)
            UNHEALTHY=$(echo "$SUMMARY" | tr '|' '\n' | grep ^unhealthy= | cut -d= -f2)
            CRASHED=$(echo "$SUMMARY" | tr '|' '\n' | grep ^crashed= | cut -d= -f2)
            OOM=$(echo "$SUMMARY" | tr '|' '\n' | grep ^oom= | cut -d= -f2)
            if [ "${STARTED:-0}" -lt "${TOTAL:-1}" ]; then
              if should_alert "${app}_state"; then
                ALERTS="${ALERTS}🔴 <b>${app}</b>: $((TOTAL-STARTED))/${TOTAL} machines NOT started (${BAD})"$'\n'
                mark_alerted "${app}_state"
              fi
            fi
            if [ "${UNHEALTHY:-0}" -gt 0 ]; then
              if should_alert "${app}_health"; then
                ALERTS="${ALERTS}❤️‍🩹 <b>${app}</b>: ${UNHEALTHY} unhealthy health checks"$'\n'
                mark_alerted "${app}_health"
              fi
            fi
            # Surface OOM/restart events even if Fly already restarted the
            # machine and the current health check is green.
            if [ "${OOM:-none}" != "none" ] && [ -n "${OOM}" ]; then
              for mid in $(echo "$OOM" | tr ',' ' '); do
                if should_alert "${app}_oom_${mid}"; then
                  ALERTS="${ALERTS}OOM <b>${app}</b>: recent oom_killed/exit_code=137 on machine ${mid}"$'\n'
                  mark_alerted "${app}_oom_${mid}"
                fi
              done
            fi
            # Queue crashed-stopped machines for auto-recovery (own cooldown per machine).
            if [ "${CRASHED:-none}" != "none" ] && [ -n "${CRASHED}" ]; then
              for mid in $(echo "$CRASHED" | tr ',' ' '); do
                if should_alert "${app}_recover_${mid}"; then
                  RECOVER="${RECOVER}${app}/${mid}"$'\n'
                  mark_alerted "${app}_recover_${mid}"
                fi
              done
            fi
          done

          {
            echo "alerts<<EOF"
            echo "$ALERTS"
            echo "EOF"
            echo "recover<<EOF"
            echo "$RECOVER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$ALERTS" ]; then
            echo "::warning::Fly restart-loop signal: $ALERTS"
          fi

      - name: Save cooldown state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/cooldown.state
          key: ${{ env.COOLDOWN_KEY }}-${{ github.run_id }}

      # Auto-recover machines stuck stopped after a crashloop. Narrowly scoped:
      # only machines flagged `crashed` (non-zero exit) by the check step, each
      # rate-limited by its own cooldown key. A successful fixing deploy + this
      # force-start = the machine actually runs the new image. Idle autostop
      # machines are never touched (they are not flagged crashed).
      - name: Auto-recover crashed machines
        id: recover
        if: steps.check.outputs.recover != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RECOVER: ${{ steps.check.outputs.recover }}
        run: |
          set -uo pipefail
          echo "$RECOVER" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            app="${line%%/*}"
            mid="${line##*/}"
            echo "Recovering crashed machine ${mid} on ${app}..."
            if flyctl machine start "$mid" -a "$app" 2>&1; then
              echo "  -> start issued OK"
            else
              echo "  -> start FAILED (will alert)"
            fi
          done
          # Re-read state post-start so the alert reflects what we attempted.
          echo "recovered=$(echo "$RECOVER" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Telegram alert
        if: steps.check.outputs.alerts != '' || steps.recover.outputs.recovered != ''
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          ALERTS: ${{ steps.check.outputs.alerts }}
          RECOVERED: ${{ steps.recover.outputs.recovered }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$BOT" ] || [ -z "$CHAT" ] && { echo "Telegram secrets missing"; exit 0; }
          RECOVER_LINE=""
          [ -n "${RECOVERED:-}" ] && RECOVER_LINE="🔧 <b>auto-recovered (force-start):</b> ${RECOVERED}"$'\n'
          TEXT="🛫 <b>fly-restart-detector</b>
          ${ALERTS}${RECOVER_LINE}
          Run: ${RUN_URL}"
          curl -sS -m 10 -X POST \
            "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" >/dev/null || true
