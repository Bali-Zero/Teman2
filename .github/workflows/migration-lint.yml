name: Migration Lint (Squawk)

# Lint database migrations using sbdchd/squawk. Catches dangerous Postgres
# operations (DROP without IF EXISTS, ALTER without CONCURRENTLY on indexes,
# adding NOT NULL columns without DEFAULT, etc.) at PR-check time rather
# than at the pre-deploy gate.
#
# Why Squawk and not Atlas: ariga/atlas v0.38 (Oct 2025) moved `migrate
# lint` behind a paid tier (Atlas Pro). Squawk is the established OSS
# alternative — Postgres-specific, ~600K monthly downloads, MIT license.
#
# What this DOES NOT replace: the runtime rollback-marker validation in
# apps/backend-rag/backend/db/migration_manager.py. That gate (caught
# PR #302) stays as-is. Squawk adds a complementary destructive-op gate
# at PR-check time, ~2 hours earlier than the pre-deploy gate would catch
# the same class of issues.

on:
  pull_request:
    paths:
      - "apps/backend-rag/backend/db/migrations_v2/**.sql"
      - ".github/workflows/migration-lint.yml"
  workflow_dispatch: {}

concurrency:
  group: migration-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect added/modified migrations on this PR
        id: changed
        run: |
          # Diff against the PR base (origin/main by default for pull_request).
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only --diff-filter=AM "$base...$head" -- \
                  'apps/backend-rag/backend/db/migrations_v2/*.sql' || true)
          echo "Changed migration files:"
          echo "$files"
          # Output for downstream step. If no migrations changed, skip lint.
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.changed.outputs.files != ''
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Squawk
        if: steps.changed.outputs.files != ''
        run: npm install -g squawk-cli@latest

      - name: Lint changed migrations
        if: steps.changed.outputs.files != ''
        run: |
          # Direct squawk-cli invocation instead of sbdchd/squawk-action@v2.
          # The action auto-derives a `upload-to-github` subcommand when
          # GITHUB_TOKEN is in env (which it always is via workflow
          # permissions); since 2026-05-01 the upload subcommand fails with
          # "Found N violation(s)" non-zero even when fail-on-violations
          # would otherwise be off. By calling the CLI directly we keep the
          # lint signal without the broken upload step.
          #
          # --exclude rules are legitimate suppressions for the migrations
          # in this repo (brand-new empty tables don't have lock contention,
          # and the rollback section using DROP is intentional).
          # Cicatrix: docs/oss-injections-2026-04-26.md § "Squawk migration lint"
          set -euo pipefail
          IFS=$'\n'
          files="${{ steps.changed.outputs.files }}"
          for file in $files; do
            [ -z "$file" ] && continue
            echo "::group::Squawk lint: $file"
            # Excluded rules below are legitimate suppressions for empty-table
            # migrations in this repo (no lock contention, intentional rollback
            # via DROP). Rule names verified against squawk-cli 2.50.0
            # `--reporter=gcc` output.
            #
            # Style-only exclusions (added 2026-05-04, mig 154/155):
            #   ban-char-field            — CHAR(1) for reliability A-F is intentional
            #                               (1-byte enum-like, not a varchar typo)
            #   prefer-bigint-over-smallint — SMALLINT for credibility 1-6 fits in 2
            #                                 bytes; BIGINT here would waste 6 bytes/row
            #   prefer-text-field         — VARCHAR(8/64) gives explicit length budgets
            #                               for tlp/invalidation_event_topic/invalidated_by;
            #                               on a fresh empty table the ACCESS EXCLUSIVE
            #                               warning about future ALTER COLUMN doesn't apply
            #                               (we'd just rebuild the table at this scale)
            squawk \
              --pg-version=15.0 \
              --exclude=require-concurrent-index-creation \
              --exclude=require-timeout-settings \
              --exclude=require-concurrent-index-deletion \
              --exclude=ban-drop-table \
              --exclude=ban-drop-column \
              --exclude=ban-char-field \
              --exclude=prefer-bigint-over-smallint \
              --exclude=prefer-text-field \
              "$file"
            echo "::endgroup::"
          done

      - name: Skip notice (no migrations changed)
        if: steps.changed.outputs.files == ''
        run: |
          echo "No migrations changed in this PR — Squawk lint skipped."
