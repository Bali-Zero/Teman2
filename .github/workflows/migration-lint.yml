name: Migration Lint (Squawk)

# Lint database migrations using sbdchd/squawk. Catches dangerous Postgres
# operations (DROP without IF EXISTS, ALTER without CONCURRENTLY on indexes,
# adding NOT NULL columns without DEFAULT, etc.) at PR-check time rather
# than at the pre-deploy gate.
#
# Why Squawk and not Atlas: ariga/atlas v0.38 (Oct 2025) moved `migrate
# lint` behind a paid tier (Atlas Pro). Squawk is the established OSS
# alternative — Postgres-specific, ~600K monthly downloads, MIT license.
#
# What this DOES NOT replace: the runtime rollback-marker validation in
# apps/backend-rag/backend/db/migration_manager.py. That gate (caught
# PR #302) stays as-is. Squawk adds a complementary destructive-op gate
# at PR-check time, ~2 hours earlier than the pre-deploy gate would catch
# the same class of issues.

# SENTINEL PATTERN (2026-08-11 — Merge-OS v2 Wave 0 trap-disarm,
# research/operations/2026-08-10-merge-os-v2-submission-system.md §4 Wave 0,
# Codex F12). This workflow used to gate on a top-level `paths:` filter and
# had no `merge_group` trigger. That is a trap: a required check whose
# WORKFLOW is `paths:`-filtered never even STARTS a run on a PR outside
# those paths — there is no skipped/neutral run to satisfy the check, so
# GitHub shows the context "Expected — waiting for status to be reported"
# forever, hard-blocking an innocent PR. Adding `merge_group:` alone would
# not have fixed this — the PR-side context would still hang; the top-level
# `paths:` itself has to go. Fix, same shape as guard-conformance.yml /
# immune-enforcement.yml / frontend-typecheck.yml: no top-level `paths:` —
# the workflow ALWAYS triggers, so it is required-safe by construction.
# Relevance (did this diff touch a migration file at all) is decided INSIDE
# the "Detect added/modified migrations" step below (job-level change
# detection); on a path-miss PR the job ends success (skip = success).
on:
  pull_request: # NO top-level paths: — always trigger (job decides relevance)
  workflow_dispatch: {}

concurrency:
  group: migration-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # blob:none — partial clone: every commit and tree, no file contents (fetched on
          # demand). `fetch-depth: 0` is KEPT, so this gate's `git diff --name-only` resolves
          # exactly as before; only blob DELIVERY becomes lazy. Measured on this repository:
          # a full clone moves 2,289 MB, blob:none moves 23.3 MB in 21s.
          # Not a tidy-up: on 2026-07-27 this same checkout ate 297s of a 300s job budget in
          # adversarial-review-gate and 597s of 600s in P6 and was KILLED, so those gates never
          # ran. A timeout kill reports `cancelled`, and a cancelled REQUIRED check EJECTS the
          # merge-queue entry, which then sits open with auto-merge off. See #3375 for the
          # measurement and for why the flag's presence in the fetch log — not a green check —
          # is the proof (an unsupported input is silently ignored by Actions).
          filter: blob:none

      - name: Detect added/modified migrations on this PR
        id: changed
        env:
          # Immutable event-pair SHAs, never a moving `main` recompute —
          # merge_group.base_sha/head_sha for the queue, pull_request.*.sha
          # for a PR. Merge-base anchored via scripts/ci/hotzone_changed_files.sh
          # (three-dot semantics), never a two-dot diff against a possibly-
          # stale `pull_request.base.sha` (scar W102, PR #3057).
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # workflow_dispatch has no base/head event pair to diff — preserve
          # the pre-existing graceful "nothing auto-detected" behaviour
          # rather than failing a manual, no-PR-context run.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "::notice::workflow_dispatch has no PR/merge_group SHA pair — nothing auto-detected"
            exit 0
          fi
          if [ ! -f scripts/ci/hotzone_changed_files.sh ]; then
            echo "::error::enumerator missing — refusing to guess the changed set"
            exit 1
          fi
          CHANGED="$(bash scripts/ci/hotzone_changed_files.sh "$BASE_SHA" "$HEAD_SHA" "$PR_NUMBER")"
          ENUM_RC=$?
          if [ "$ENUM_RC" -ne 0 ]; then
            echo "::error::could not determine the changed set (rc=$ENUM_RC) — failing rather than skipping"
            exit 1
          fi
          # --diff-filter=AM semantics preserved: only migration files that
          # still EXIST in this tree are candidates (a deleted/renamed-away
          # file has nothing for squawk to lint — same [ -f ] discipline as
          # prettier-changed-files.yml). No leading/trailing whitespace on
          # any line here — the squawk loop below word-splits this list.
          CANDIDATES="$(printf '%s\n' "$CHANGED" | grep -E '^apps/backend-rag/backend/db/migrations_v2/.*\.sql$' || true)"
          files=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] && files="${files:+$files$'\n'}$f"
          done <<< "$CANDIDATES"
          echo "Changed migration files:"
          echo "$files"
          # Output for downstream step. If no migrations changed, skip lint.
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.changed.outputs.files != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install Squawk
        if: steps.changed.outputs.files != ''
        run: npm install -g squawk-cli@latest

      - name: Lint changed migrations
        if: steps.changed.outputs.files != ''
        run: |
          # Direct squawk-cli invocation instead of sbdchd/squawk-action@v2.
          # The action auto-derives a `upload-to-github` subcommand when
          # GITHUB_TOKEN is in env (which it always is via workflow
          # permissions); since 2026-05-01 the upload subcommand fails with
          # "Found N violation(s)" non-zero even when fail-on-violations
          # would otherwise be off. By calling the CLI directly we keep the
          # lint signal without the broken upload step.
          #
          # --exclude rules are legitimate suppressions for the migrations
          # in this repo (brand-new empty tables don't have lock contention,
          # and the rollback section using DROP is intentional).
          # Cicatrix: docs/oss-injections-2026-04-26.md § "Squawk migration lint"
          set -euo pipefail
          IFS=$'\n'
          files="${{ steps.changed.outputs.files }}"
          for file in $files; do
            [ -z "$file" ] && continue
            echo "::group::Squawk lint: $file"
            # Excluded rules below are legitimate suppressions for empty-table
            # migrations in this repo (no lock contention, intentional rollback
            # via DROP). Rule names verified against squawk-cli 2.50.0
            # `--reporter=gcc` output.
            #
            # Style-only exclusions (added 2026-05-04, mig 154/155):
            #   ban-char-field            — CHAR(1) for reliability A-F is intentional
            #                               (1-byte enum-like, not a varchar typo)
            #   prefer-bigint-over-smallint — SMALLINT for credibility 1-6 fits in 2
            #                                 bytes; BIGINT here would waste 6 bytes/row
            #   prefer-text-field         — VARCHAR(8/64) gives explicit length budgets
            #                               for tlp/invalidation_event_topic/invalidated_by;
            #                               on a fresh empty table the ACCESS EXCLUSIVE
            #                               warning about future ALTER COLUMN doesn't apply
            #                               (we'd just rebuild the table at this scale)
            # Style-only exclusions (added 2026-05-13, mig 172):
            #   prefer-robust-stmts         — the migration_base.py runner already
            #                                 wraps the whole file in a single
            #                                 asyncpg conn.transaction()
            #                                 (apps/backend-rag/backend/db/
            #                                  migration_base.py:493). Explicit
            #                                 BEGIN/COMMIT inside the SQL would
            #                                 conflict with asyncpg nested-txn
            #                                 semantics, so we let the runner be
            #                                 the canonical transaction boundary.
            #   constraint-missing-not-valid — empty / near-empty tables in this
            #                                  repo never have lock-held-during-
            #                                  scan concerns. The two-step NOT
            #                                  VALID + VALIDATE pattern is itself
            #                                  flagged by Squawk when both are
            #                                  in the same outer transaction
            #                                  (which the runner enforces), so
            #                                  the rule is unactionable here.
            #   prefer-bigint-over-int       — mig 172 mirrors apps/cell/cell/
            #                                  core/db.py:_CREATE_CELL_SKILLS
            #                                  shape for the CI test DB; that
            #                                  table predates squawk in the
            #                                  repo and uses INTEGER for
            #                                  success/failure/use_count.
            #                                  Re-typing to BIGINT would
            #                                  diverge from production.
            #   prefer-identity              — same reason: existing cell_skills
            #                                  uses SERIAL PRIMARY KEY in
            #                                  production. GENERATED ALWAYS AS
            #                                  IDENTITY is the modern pattern
            #                                  but mid-flight schema swap is
            #                                  out of scope for LEVA 2.
            # Style-only exclusions (added 2026-05-14, mig 175):
            #   disallowed-unique-constraint  — Squawk lints the whole file,
            #                                  including the `-- === ROLLBACK ===`
            #                                  section (a plain comment to both
            #                                  Squawk and Postgres). migration_base.py
            #                                  runs only the forward DDL. mig 175's
            #                                  rollback deliberately restores the
            #                                  exact 173 UNIQUE constraint, so the
            #                                  rule fires on a statement we never
            #                                  execute forward. Same family as the
            #                                  already-excluded constraint-missing-not-valid.
            #                                  The forward DDL in 175 uses a partial
            #                                  unique INDEX, not a constraint.
            squawk \
              --pg-version=15.0 \
              --exclude=require-concurrent-index-creation \
              --exclude=require-timeout-settings \
              --exclude=require-concurrent-index-deletion \
              --exclude=ban-drop-table \
              --exclude=ban-drop-column \
              --exclude=ban-char-field \
              --exclude=prefer-bigint-over-smallint \
              --exclude=prefer-text-field \
              --exclude=prefer-robust-stmts \
              --exclude=constraint-missing-not-valid \
              --exclude=prefer-bigint-over-int \
              --exclude=prefer-identity \
              --exclude=disallowed-unique-constraint \
              "$file"
            echo "::endgroup::"
          done

      - name: Skip notice (no migrations changed)
        if: steps.changed.outputs.files == ''
        run: |
          echo "No migrations changed in this PR — Squawk lint skipped."
