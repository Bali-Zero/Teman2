name: asyncpg-lint

# W34/W64 cicatrix consumer — closes the W35 deferral ("lint exists but has NO
# consumer — it gates nothing"). Runs scripts/lint_asyncpg_except_completeness.py
# BLOCKING on every PR + push to main, so a W64-class sibling-fix regression
# (commit 120078999: except tuple missing asyncpg.InterfaceError in a daemon
# reconnect loop → silent death) gates at PR time, not at audit time days later.
#
# Pure-stdlib, full-repo scan in seconds → NO paths filter and NO sentinel
# needed; safe as a required-status-check (the W69 pending-forever trap does
# not apply because the job runs on every PR).
#
# Triggers BOTH pull_request AND push-to-main (W41/W42 cicatrix lesson:
# pull_request-only gives false safety under L2 autonomous direct-push).

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Dependabot branch: ALL Dependabot PRs share one group per workflow (not
  # per-ref), so their runs queue and drain serially instead of piling up in
  # parallel (Agent PR Contract rule 5). Non-Dependabot branch is byte-for-byte
  # the pre-existing expression — untouched.
  group: ${{ github.actor == 'dependabot[bot]' && format('dependabot-lockfile-{0}', github.workflow) || format('asyncpg-lint-{0}', github.ref) }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'merge_group' }}

jobs:
  asyncpg-lint:
    name: asyncpg-lint
    runs-on: ubuntu-latest
    # Floor is the CHECKOUT, not the script (scripts/lint_workflow_timeout_floor.py).
    # Was 5; 11% of 645 sampled checkouts here exceed 60s, worst observed 599s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run asyncpg except-completeness lint (blocking)
        run: python3 scripts/lint_asyncpg_except_completeness.py

      # The lint's OWN tests must run where the lint runs. Nothing globs
      # scripts/tests/ in CI — a test file there executes only if a workflow
      # NAMES it — so without this step the blind-scan guard below would be
      # protected by a test that never runs, and any future edit could delete
      # the guard with CI still green (cicatrix #2, "exists != armed").
      #
      # Runs AFTER the lint so a genuine violation still reports first. Costs a
      # pytest install (~10s) inside an existing job — no extra runner slot,
      # which is the scarce resource here (see
      # research/operations/2026-07-26-ci-pr-latency-*.md).
      - name: Prove the lint's blind-scan guard still bites
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pytest
          python3 -m pytest scripts/tests/test_lint_asyncpg_except_completeness.py -q
