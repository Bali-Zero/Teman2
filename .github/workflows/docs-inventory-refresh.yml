name: Docs Inventory Refresh

# Scheduled publication of volatile documentation state. The result is an
# artifact, never a commit or pull request, so global drift cannot blame a PR.
on:
  schedule:
    - cron: "0 19 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: docs-inventory-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate live derived state
        env:
          DOCS_DERIVED_OUTPUT_DIR: ${{ runner.temp }}/docs-derived-state
        run: bash scripts/docs_inventory_regen.sh --organ

      - name: Verify artifact payload
        env:
          OUTPUT_DIR: ${{ runner.temp }}/docs-derived-state
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/docs-sync.json"
          test -s "$OUTPUT_DIR/docs-audit.json"
          test -s "$OUTPUT_DIR/DOCS_INVENTORY.md"

      - uses: actions/upload-artifact@v7
        with:
          name: docs-derived-state-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-derived-state
          retention-days: 30

      - name: Telegram alert on generator failure
        if: failure()
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${BOT:-}" ] || [ -z "${CHAT:-}" ]; then
            echo "Telegram secrets missing; original failure remains visible."
            exit 0
          fi
          curl -sS -m 10 -X POST \
            "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            --data-urlencode "text=docs-inventory-refresh failed: ${RUN_URL}" >/dev/null || true
