name: Docs Inventory Refresh

# Structural cure for "docs-guardian inventory-check marcisce col calendario"
# (memory: discovery_docs_guardian_wallclock_gate_rot_2026_07_16.md): docs_audit.py's
# classify() flips a doc's status LIVE->ARCHIVED purely on wall-clock (mtime>90d, Rule 2),
# independent of any PR's content. Left uncured, docs/DOCS_INVENTORY.md on main silently
# drifts stale until an unrelated PR's `inventory-check` gate hits the accumulated
# calendar delta and fails innocently (2x on #2509 2026-07-16, again on #2592 2026-07-17;
# empirically 4 of the last 5 docs-guardian.yml runs failed on pure drift as of this
# workflow's introduction).
#
# This workflow regenerates the calendar-driven derived artifacts (DOCS_INVENTORY.md
# table + DOCSYNC markers) directly on `main` on a schedule, via the SSOT
# scripts/docs_inventory_regen.sh, so drift never accumulates against a random PR.
#
# NOT a replacement for scripts/docs_guardian.sh (the existing weekly Pro cron —
# docs/operations/docs-guardian-cron.md) — that script ALSO physically archives orphans
# (git mv to docs/archive/) and auto-fixes broken links (L2/L2.5). This workflow only
# refreshes the TABLE (docs_audit.py --regen-only: no git-mv side effects) so the
# classification never rots stale between whenever that weekly cron last ran cleanly.
#
# PR-creation mechanism note (2026-07-17 design decision): this repo's established,
# empirically-verified pattern for scheduled automation PRs (nb-curator #2567, the
# codex-nightly-autofix-ci.sh branches #950/#1001) is a MACHINE CRON authenticated as the
# human/org GitHub account — NOT a GitHub Actions workflow authoring PRs via the default
# GITHUB_TOKEN. Zero PRs in this repo's entire history have ever been authored by
# `github-actions[bot]`, consistent with GitHub's documented behavior that events
# (push/PR-open) caused by a workflow's own GITHUB_TOKEN do not trigger downstream
# `pull_request`-triggered workflow runs — which would leave this repo's required
# checks stuck "Expected"/pending forever on any such PR, and `--auto --squash` armed
# but permanently inert (exactly the disease this workflow exists to cure, reproduced).
# This workflow is still built Actions-native (checkout+regen+diff+PR+arm) per the
# stated preference — "ambiente identico al gate" strictly benefits the detection half
# (a fresh main checkout every run, immune to the Pro-checkout staleness/dirty-tree
# failure modes that left the equivalent Pro cron silent for 3 months, see PENDING-ARMS
# ledger) — and the PR-creation half's real-world behavior (does github-actions[bot] get
# its required checks triggered here after all?) is verified empirically on first live
# run per the ledger entry, rather than asserted. See PENDING-ARMS.md for the observed
# outcome and any follow-up this implies.

on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC daily (quiet window)
    - cron: "0 7 * * *" # 07:00 UTC daily (quiet window)
  workflow_dispatch: {}

concurrency:
  group: docs-inventory-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # docs_audit.py over ~900 docs empirically takes ~6min alone (matches docs-guardian.yml gate durations)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for docs_audit.py mtime derivation (git log -1 --format=%ct)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Regenerate docs-inventory + DOCSYNC markers (SSOT script)
        run: bash scripts/docs_inventory_regen.sh

      - name: Check drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "no drift" >&2
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift detected:" >&2
            git diff --stat >&2
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open refresh PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE_SLUG=$(date -u +%Y-%m-%d)
          BRANCH="docs/auto-sync-inventory-${DATE_SLUG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(docs): scheduled inventory + DOCSYNC refresh (${DATE_SLUG})

          Structural cure for the wallclock inventory-check gate rot: regenerates
          docs/DOCS_INVENTORY.md (calendar-driven LIVE/STALE/ARCHIVED classification)
          and DOCSYNC markers directly on main so drift never accumulates against an
          unrelated PR.

          Auto-generated by scripts/docs_inventory_regen.sh via
          .github/workflows/docs-inventory-refresh.yml (scheduled run).

          Co-Authored-By: docs-inventory-refresh <noreply@balizero.com>"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(docs): scheduled inventory refresh (${DATE_SLUG})" \
            --body "Scheduled regen of \`docs/DOCS_INVENTORY.md\` + DOCSYNC markers — cures the wallclock \`inventory-check\` gate rot (calendar-driven LIVE/STALE/ARCHIVED reclassification, independent of PR content). Docs-only diff, auto-generated, safe to auto-merge. See \`scripts/docs_inventory_regen.sh\` header and memory \`discovery_docs_guardian_wallclock_gate_rot_2026_07_16\` for the full incident history.")
          echo "Opened: $PR_URL"
          PR_NUM=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
          gh pr merge "$PR_NUM" --auto --squash || echo "::warning::auto-merge arm failed (see log above) — needs manual check, PR left open"
