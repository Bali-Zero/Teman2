name: VOA probe organ tests

# Executor for the corpora that prove the VOA journey probe -- the receptor that walks the
# anonymous public funnel on a schedule so a broken checkout is discovered by us and not by a
# traveller.
#
# WHY THIS FILE EXISTS
# --------------------
# PR #5215 shipped the probe with 56 shell checks (`scripts/tests/test_voa_probe_wrapper.sh`)
# plus a pytest shim, and NO workflow naming either. `scripts-tests-sweep.yml` does collect the
# shim, but that sweep is `continue-on-error: true` and sits in no required context, so the
# corpus could fail forever without turning a single PR red -- superscar #2 ("exists != armed")
# applied to the guards of a receptor that exists to cure exactly that class. Same shape and
# rationale as `vercel-autopromote-tests.yml`, which this file is modelled on.
#
# Handed off by Squad P to Squad W per battle plan §2 (every `.github/workflows/` edit is
# executed by W); issue #5251 §H2. H1 and H3 of that same handoff were already landed by
# #5246 and `token-contrast-tests.yml` respectively -- verified on `origin/main` before
# building this one, rather than assumed still-open from the issue text.
#
# WHAT THIS GATES, AND WHAT IT DOES NOT -- stated plainly because both cross-family reviewers
# of this diff independently called the word "blocking" dishonest, and they were right.
# The job carries no `continue-on-error`, so a failure DOES redden the run. It is NOT in
# `main`'s required contexts, so a red run does NOT stop a merge -- adding it there is a
# repo-settings action, operator-gated (CLAUDE.md §13), and the handoff explicitly did not
# request it. So: SIGNAL-ONLY UNTIL PROMOTED. Calling it "blocking" would recreate, one level
# up, the exact exists-!=-armed failure this file exists to cure. The promotion is tracked as a
# PENDING-ARMS row rather than left to be rediscovered.
#
# `paths:` covers the probe, its wrapper, the plist, the installer and their corpora. The
# obvious hole -- a dependency changing outside those paths -- was MEASURED, not assumed:
# `voa_journey_probe.mjs` imports only node builtins (`node:crypto`, `node:fs`, `node:os`,
# `node:path`, `node:url`), so there is no package-manifest or shared-library import closure to
# widen this filter to. What remains uncovered is the Node runtime itself, which is why the
# version is pinned below rather than taken from whatever the runner happens to ship.
#
# `scripts/tests/test_voa_probe_corpus.py` is in `paths:` but is deliberately NOT a step here:
# it is a pytest shim whose only job is to invoke the SAME `.sh` corpus this workflow already
# runs directly, so a step for it would run those checks twice. It stays in `paths:` because
# editing the shim can break the sweep that collects it, and this job is the fastest place to
# notice that the corpus it wraps is broken.

on:
  pull_request:
    paths:
      - "scripts/probes/voa_journey_probe.mjs"
      - "scripts/tests/test_voa_probe_wrapper.sh"
      - "scripts/tests/test_voa_probe_corpus.py"
      - "infra/launchagents/wrappers/voa-probe-wrapper.sh"
      - "infra/launchagents/com.nuzantara.voa-probe.plist"
      - "infra/launchagents/install_voa_probe.sh"
      - ".github/workflows/voa-probe-tests.yml"
  push:
    branches:
      - main
    paths:
      # Symmetric with the pull_request list above, this file included: an asymmetric filter
      # means a direct push to main editing only this workflow runs nothing.
      - ".github/workflows/voa-probe-tests.yml"
      - "scripts/probes/voa_journey_probe.mjs"
      - "scripts/tests/test_voa_probe_wrapper.sh"
      - "scripts/tests/test_voa_probe_corpus.py"
      - "infra/launchagents/wrappers/voa-probe-wrapper.sh"
      - "infra/launchagents/com.nuzantara.voa-probe.plist"
      - "infra/launchagents/install_voa_probe.sh"

permissions:
  contents: read

concurrency:
  group: voa-probe-tests-${{ github.ref }}
  # PRs only. The modelled-on workflow reads `!= 'merge_group'`, which is vacuously true here
  # because this workflow has no merge_group trigger — and both cross-family reviewers flagged
  # what that vacuity costs: the group is keyed on `github.ref`, so on `main` a later push would
  # cancel an in-flight run. For a job whose entire purpose is "find the broken checkout before a
  # traveller does", a cancelled main run is a suppressed alarm. Superseded pushes on a PR branch
  # are a different case and may be cancelled freely.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  organ-tests:
    name: VOA probe organ tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The wrapper is `#!/bin/zsh` and loads `zsh/system` for `zsystem flock` (5 call sites),
      # so the corpus drives a zsh script even though the corpus itself is bash. macOS ships
      # zsh; `ubuntu-latest` does not, and the corpus says so rather than guessing —
      # `FATAL: no zsh on PATH — the wrapper is #!/bin/zsh`, exit 1, which is exactly how the
      # first run of this very workflow failed. Installed here rather than moving the job to
      # `macos-latest`: the wrapper's zsh is a fleet choice, not a macOS dependency, and a
      # Linux runner keeps this job cheap enough that nobody will want to weaken it later.
      # Cost, named because both reviewers raised it: an apt outage now reddens a PR for a
      # reason unrelated to its diff. Accepted at this job's current signal-only status; it is
      # the first thing to reconsider if the job is ever promoted to a required context.
      - name: zsh (the wrapper's interpreter — not present on ubuntu runners)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # Pinned rather than inherited from the runner image: the probe is the only Node here and
      # its self-test is an assertion suite, so a runner-image Node bump could flip this job red
      # — or, worse, change probe behaviour — with no repo change to point at. Both reviewers
      # raised it; the repo has no `.nvmrc` to read, so the version is named here.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # BOTH steps below, never just the first one. Measured on 2026-08-30 against the shipped
      # files: collapsing every `"unknown"` literal in the probe to `"fail"` -- which would undo
      # the four-verdict lattice that exists so the probe cannot cause its own outage -- leaves
      # the self-test at `SELF-TEST OK (53 assertions)`, exit 0, and is caught ONLY by the shell
      # corpus, which goes `TOTAL 56 FAILED 3`, exit 1. Innocence on the unmutated tree: both
      # exit 0. A job running the self-test alone would be a half-arming that reads as full.
      - name: The probe's pure classifiers agree with themselves, offline
        run: node scripts/probes/voa_journey_probe.mjs --self-test

      # Judged by EXIT CODE, deliberately not by grepping the corpus's own `TOTAL n FAILED m`
      # line: a `mktemp` failure on a sandboxed runner aborts before that line is ever printed,
      # and a grep for "FAILED 0" would then find nothing and have to guess what the absence
      # means. The script exits 1 on any failed check (verified by the mutation above) and
      # non-zero on an aborted setup, so the exit code separates "the code is wrong" from "the
      # environment is wrong" without this workflow having to parse prose. The line still prints
      # to the log for a human reading the failure.
      - name: The wrapper corpus holds — every check against the real script in a scratch world
        run: bash scripts/tests/test_voa_probe_wrapper.sh

      # The exit code above cannot see the corpus SHRINKING. Both cross-family reviewers landed on
      # the same gap independently: if checks silently disappear while the survivors pass, the run
      # stays green — a green that cannot fail, which is the disease this whole workflow exists to
      # cure, reproduced one level up. So the count is asserted IN ADDITION to the exit code, never
      # instead of it: an aborted setup never prints the TOTAL line at all, and this step would then
      # report an absent count rather than silently accepting one. The floor is a floor, not an
      # equality — adding checks must never turn this red.
      - name: The corpus did not shrink (a vanished check is a green that cannot fail)
        run: |
          set -euo pipefail
          FLOOR=56
          TOTAL="$(bash scripts/tests/test_voa_probe_wrapper.sh | sed -n 's/^TOTAL \([0-9][0-9]*\) FAILED .*/\1/p' | tail -1)"
          if [ -z "$TOTAL" ]; then
            echo "::error::the corpus printed no TOTAL line — it aborted before reporting, so its check count is unknown"
            exit 1
          fi
          if [ "$TOTAL" -lt "$FLOOR" ]; then
            echo "::error::the corpus ran $TOTAL checks, below the floor of $FLOOR — checks were removed or silently skipped"
            exit 1
          fi
          echo "corpus ran $TOTAL checks (floor $FLOOR)"

      # `zsh -n`, not `bash -n`: the wrapper's shebang is `#!/bin/zsh`, so checking it with bash
      # parses it under the wrong grammar — passing on syntax the real interpreter would reject,
      # and rejecting zsh-only constructs that are correct. The installer really is `#!/bin/bash`
      # and is checked with bash. Each script is checked by ITS OWN interpreter; the first
      # version of this file used `bash -n` for both and was wrong about half of it.
      - name: The wrapper still parses under zsh (a syntax error is a silent dead organ)
        run: zsh -n infra/launchagents/wrappers/voa-probe-wrapper.sh

      - name: The installer still parses under bash (it is the only path that arms the plist)
        run: bash -n infra/launchagents/install_voa_probe.sh
