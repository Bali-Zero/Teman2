name: runbook section numbers are unique

# WHY THIS WORKFLOW EXISTS AT ALL (superscar #2 — esiste != armato).
# The guard it runs, scripts/tests/test_runbook_section_numbers_are_unique.py,
# shipped in #4562 with NOTHING executing it. A test under scripts/tests/ runs
# in CI only if a workflow names it: the repo-wide `scripts/tests/ sweep` is
# `continue-on-error: true` and gates nothing (see scripts-tests-sweep.yml, and
# asyncpg-lint.yml's own note on the same trap). So the guard written to stop a
# defect from shipping green had itself shipped green and unarmed.
#
# WHY IT IS SHAPED TO BECOME BLOCKING, unlike alarm-cure-alignment.yml and
# tg-gateway.yml: those watch a LIVE external surface that can go red for reasons
# outside the PR, so a required context there would jam the merge queue. This one
# reads only tracked files and is deterministic — it can only go red because a PR
# duplicated a section number, which is precisely what should block.
#
# IT DOES NOT BLOCK ANYTHING YET, and nothing here may say otherwise. Measured on
# 2026-08-22: `gh api repos/Bali-Zero/Teman2/branches/main/protection --jq
# '.required_status_checks.contexts[]'` returns 27 contexts and none of them is
# this one. Until `infra/required.d/contexts.json` is regenerated with
# scripts/ci/snapshot_required_contexts.py and the protection updated, a red run
# here REPORTS and does not stop a merge. An earlier revision of this file called
# the step "(blocking)" in the checks UI while that was false — a label promising
# protection it does not deliver is the exact defect this workflow exists to cure,
# so it is not allowed to appear in the workflow that cures it. The promotion is
# carried by a row in .claude/skills/modus/PENDING-ARMS.md, which is what
# scripts/pending_arms_report.py alarms on after 48h.
#
# WHY NO `paths:` FILTER, even though it only reads docs/runbooks/**: this
# context is intended to become REQUIRED, and
# scripts/ci/check_required_workflow_conformance.py already encodes the trap —
# a required context whose workflow carries a top-level pull_request.paths:
# filter never starts a run on an innocent PR, so GitHub shows it
# "Expected — waiting" forever and the PR can never merge. That is exactly what
# docs-sync.yml and migration-lint.yml shipped. The same rule is why
# `merge_group:` is present. The job is a five-second pytest, so running it on
# every PR is cheaper than the class of outage a paths filter would buy.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: runbook-section-numbers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: runbook section numbers are unique
    runs-on: ubuntu-latest
    # 10, not 5: the floor is the CHECKOUT, not the script (lint_workflow_timeout_floor.py).
    # actions/checkout on this repo intermittently takes ~2 minutes, and a job that runs out
    # reports as `cancelled`, not `failure` — a cancelled required check never turns green by
    # itself and shows nothing red to fix. The pytest itself takes seconds; the budget is not
    # for it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Section numbers are unique
        run: python -m pytest scripts/tests/test_runbook_section_numbers_are_unique.py -q

      - name: Prove the guard still bites (guilt, not just innocence)
        # A uniqueness check passes trivially on a file with no duplicates, so a
        # green run proves nothing on its own. Reintroduce the exact historical
        # collision — #4557 gave the new section a number the Dependabot section
        # had held since #3381 — and require the guard to FAIL. Then restore and
        # require green again, so a guard failing for an unrelated reason is not
        # mistaken for one that bit.
        run: |
          set -euo pipefail
          RB=docs/runbooks/merge-queue-discipline.md
          cp "$RB" /tmp/rb.orig
          before=$(sha256sum "$RB" | cut -d' ' -f1)
          sed -i 's/^## 6septies\. The red is an external commit status, not the code$/## 6quater. The red is an external commit status, not the code/' "$RB"
          after=$(sha256sum "$RB" | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then
            echo "::error::mutation was a NO-OP — the anchor moved; this proof is vacuous"
            exit 1
          fi
          # Assert the OPERATION, not merely "pytest went red": this file holds
          # three tests, so a break in test_the_check_can_actually_fail or in the
          # anti-vacuity test would also exit non-zero and read as "the guard bit".
          # Require the uniqueness test specifically, and require its own message
          # naming the collision we injected.
          set +e
          python -m pytest \
            scripts/tests/test_runbook_section_numbers_are_unique.py \
            -k test_runbook_section_numbers_are_unique_within_each_file \
            -q > /tmp/bite.out 2>&1
          BITE_RC=$?
          set -e
          if [ "$BITE_RC" -eq 0 ]; then
            echo "::error::guard did NOT bite on a duplicated section number"
            cp /tmp/rb.orig "$RB"
            exit 1
          fi
          if ! grep -q "duplicated section numbers \['6quater'\]" /tmp/bite.out; then
            echo "::error::the guard went red, but not for the collision we injected — the"
            echo "::error::proof is vacuous. pytest output follows:"
            cat /tmp/bite.out
            cp /tmp/rb.orig "$RB"
            exit 1
          fi
          cp /tmp/rb.orig "$RB"
          restored=$(sha256sum "$RB" | cut -d' ' -f1)
          [ "$before" = "$restored" ] || { echo "::error::restore was not byte-identical"; exit 1; }
          python -m pytest scripts/tests/test_runbook_section_numbers_are_unique.py -q
          echo "guard bites on guilt and passes on innocence"
