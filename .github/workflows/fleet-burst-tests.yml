name: Fleet burst dispatcher tests

# Executor for the corpus that proves `scripts/fleet_burst.sh` -- the account-sharded
# headless fan-out that replaces the `fork`/`tmux`-pane shape behind scars W98 (lanes
# writing zero bytes to disk) and W96 (ENXIO pty exhaustion with 94% of ptys free).
#
# This workflow also owns the `scripts/seat_build.sh` corpora:
# `scripts/tests/test_seat_build.sh`, `scripts/tests/test_seat_build_tiers.sh` and
# `scripts/tests/test_seat_build_effort.sh`. They were green and unexecuted -- a
# `grep -rln 'test_seat_build' .github/workflows/` returned nothing -- so they had no
# executor that could go red. The `scripts/tests` sweep (`scripts-tests-sweep.yml`)
# does not count, and the reason is stronger than "it is advisory": measured, its
# sweep step runs `python -m pytest scripts/tests/`, which collects `test_*.py`
# and therefore never SEES a `.sh` suite at all. Even if it did, that step is
# `continue-on-error: true` and the workflow is `schedule:`-triggered and in no
# required context. They live here rather than in
# a dedicated workflow because this job already installs zsh and makes `origin/main`
# resolvable for the seat-state corpus, and one workflow that owns the whole seat
# surface is easier to keep armed than two that drift apart. Superscar #2 / W108.
#
# WHY THIS FILE EXISTS, and why it ships in the same PR as the script
# -------------------------------------------------------------------
# Measured on this branch before writing it: `scripts-tests-sweep.yml` collects only
# `test_*.py` through pytest -- a `.sh` file is invisible to pytest collection -- and its
# sweep step is `continue-on-error: true` besides. So a shell corpus landed alone has NO
# executor that can ever go red: superscar #2 (exists != armed), which is precisely the
# defect wave 2 exists to stop. The wave's binding rule 3 is that "a future job will run
# it" is not a consumer; the job ships in the same PR. This is that job.
#
# Same shape and rationale as `vercel-autopromote-tests.yml`,
# `intake-review-reader-liveness.yml` and `tg-gateway.yml`: one small workflow named by
# the script it proves, `paths:`-filtered so it starts on exactly the diffs that can
# break it.
#
# Deliberately NOT added to branch-protection required contexts here -- that is a
# repo-settings action, operator-gated per CLAUDE.md, and a required check that goes
# permanently red blocks the whole merge queue (the siblings above carry the same
# reasoning). It runs on every PR that touches the organ, which is what makes it bite.
#
# THE PATH FILTER IS THE ARMING SURFACE, so it lists every file this job's steps
# actually bind -- not just the two the dispatcher is named after. A filter that omits
# a bound file is a job that stays green by never starting, which is the same
# exists-!=-armed defect one level up. Blind cross-family refutation (Codex GPT-5.6 sol)
# caught two such omissions in the first draft of this file:
#   - `scripts/lib/seat_state.sh` -- fleet_burst SOURCES it for liveness.
#   - `infra/launchagents/wrappers/claude-cascade.sh` -- the seat-state corpus binds it
#     directly and asserts against its dispatch loop and kill-switch polarity.
#   - `scripts/tests/test_seat_state.sh` -- executed below, so a regression case added
#     to it must schedule this job.
#   - `scripts/seat_build.sh` and its three test suites -- added when the same no-
#     executor gap was measured for the seat_build corpora (superscar #2 / W108).
# The `.github/workflows/fleet-burst-tests.yml` entry is present only under
# `pull_request.paths`; a direct push to main that edits only this workflow file
# therefore runs nothing. The four seat_build entries are added symmetrically to both
# `pull_request.paths` and `push.paths` so a direct push to main touching only them
# still executes the suite.

on:
  pull_request:
    paths:
      - "scripts/fleet_burst.sh"
      - "scripts/tests/test_fleet_burst.sh"
      - "scripts/lib/seat_state.sh"
      - "scripts/tests/test_seat_state.sh"
      - "scripts/seat_build.sh"
      # The rest of seat_build.sh's closure, MEASURED rather than assumed after a
      # refuter pointed out the list was incomplete: it `source`s both files below,
      # and the corpora additionally read `scripts/seat_ctx.json` for the ctx-check
      # cases. `grep -hoE 'REPO_ROOT"?/[A-Za-z0-9_./-]+'` over the three suites is
      # how the closure was derived; a change to any of them breaks the suites, so
      # a filter that omitted them would let that change land untested.
      - "scripts/lib/seat_watchdog.sh"
      - "scripts/seat_build_tp1.sh"
      - "scripts/seat_ctx.json"
      - "scripts/tests/test_seat_build.sh"
      - "scripts/tests/test_seat_build_tiers.sh"
      - "scripts/tests/test_seat_build_effort.sh"
      - "infra/launchagents/wrappers/claude-cascade.sh"
      - ".github/workflows/fleet-burst-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/fleet_burst.sh"
      - "scripts/tests/test_fleet_burst.sh"
      - "scripts/lib/seat_state.sh"
      - "scripts/tests/test_seat_state.sh"
      - "scripts/seat_build.sh"
      # The rest of seat_build.sh's closure, MEASURED rather than assumed after a
      # refuter pointed out the list was incomplete: it `source`s both files below,
      # and the corpora additionally read `scripts/seat_ctx.json` for the ctx-check
      # cases. `grep -hoE 'REPO_ROOT"?/[A-Za-z0-9_./-]+'` over the three suites is
      # how the closure was derived; a change to any of them breaks the suites, so
      # a filter that omitted them would let that change land untested.
      - "scripts/lib/seat_watchdog.sh"
      - "scripts/seat_build_tp1.sh"
      - "scripts/seat_ctx.json"
      - "scripts/tests/test_seat_build.sh"
      - "scripts/tests/test_seat_build_tiers.sh"
      - "scripts/tests/test_seat_build_effort.sh"
      - "infra/launchagents/wrappers/claude-cascade.sh"

permissions:
  contents: read

concurrency:
  group: fleet-burst-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  fleet-burst-tests:
    name: Fleet burst dispatcher tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A syntax error in a dispatcher is a silent dead organ: the fan-out simply never
      # happens and every lane reports nothing, which reads like "no work to do".
      # THESE THREE RUN FIRST, before the zsh install and the origin/main fetch,
      # and the order is the point. They are pure offline bash — measured: zero
      # occurrences of "skip"/"SKIP", no zsh, no network — so an apt-mirror flake
      # or a fetch failure has nothing to do with them. Putting them ahead of that
      # setup means their verdict is already in the log when such a flake reddens
      # the job, and a reader triaging it can see at a glance that the seat_build
      # contracts held. A refuter of this diff raised the cohabitation cost, and
      # this is what actually reduces it; the cost that remains is bounded, because
      # this job is not a required context, so a flake here cannot block a merge.
      #
      # The three seat_build corpora below were green but unexecuted until this
      # workflow adopted them. Each name below is taken from the suite's OWN
      # docstring rather than guessed at: a first draft of these three lines
      # described contracts the suites do not test ("maps every caller to
      # codex|kimi|qwen", "per account", "normalizes effort aliases"), which
      # would have been three comments that lie about what a red run means —
      # the worst kind, because a reader trusts a step name when triaging.
      #
      # test_seat_build.sh's docstring: "Offline contract tests for seat_build.sh
      # and its pure-Bash watchdog." Its cases are worktree refusal (clean linked
      # worktree dry-runs, a dirty worktree refused, the main checkout refused)
      # and the quota-limit sentinels.
      - name: seat_build still refuses a dirty worktree and the main checkout, and its watchdog still reads quota
        run: bash scripts/tests/test_seat_build.sh

      # test_seat_build_tiers.sh's docstring: the "--tier / effort-cap / ctx-check
      # surface (mandate E2/R2-R4)", complementing the pre-existing contract.
      - name: seat_build's --tier, effort-cap and ctx-check surface still resolves as declared
        run: bash scripts/tests/test_seat_build_tiers.sh

      # test_seat_build_effort.sh's docstring: "derive_effort_from_floor()
      # (mandate L09-PR3: bind dispatch effort to compute_floor)."
      - name: seat_build still derives dispatch effort from the computed gear floor
        run: bash scripts/tests/test_seat_build_effort.sh

      - name: The dispatcher still parses
        run: bash -n scripts/fleet_burst.sh

      # The corpus stubs seat_state.sh into a temp dir, so it neither reads the real
      # fleet reports nor spawns a real `claude`. Its guilt case is the one that matters:
      # more lanes than live seats must never resolve to one seat driving two lanes.
      - name: One live seat per lane, never two lanes on one seat
        run: bash scripts/tests/test_fleet_burst.sh --dry-run

      # `test_seat_state.sh` case 14 compares the cascade's dispatch loop against
      # `origin/main` byte-for-byte, so that ref has to exist. actions/checkout
      # fetches a single commit by default and a PR build checks out the merge
      # ref, so `origin/main` is NOT resolvable unless it is asked for -- the case
      # would return non-zero for a MISSING REF rather than for a touched loop, a
      # red that names the wrong cause and burns a Rule-8 round chasing it.
      # Caught by blind cross-family refutation (Codex GPT-5.6 sol) on this file.
      # depth=1 is enough: `git show <ref>:<path>` needs only that commit's tree.
      - name: Make origin/main resolvable (the seat-state corpus compares against it)
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      # zsh is NOT on ubuntu-latest, and the seat-state corpus has TWO cases that
      # `return 0` with a printed SKIP when zsh is missing -- the cascade is a zsh
      # script and the library is sourced from zsh, so those are the production-shell
      # cases. Without this install the Bash cases pass, the zsh cases skip, the
      # corpus exits 0 and this job reports SUCCESS over a real zsh-only regression:
      # coverage theatre, and the exact shape this workflow exists to refuse.
      # Caught by blind cross-family refutation (Codex GPT-5.6 sol). Same cure as
      # immune-enforcement.yml, magazine-auto-assets.yml and organ-conformance.yml.
      # The explicit `command -v` is the fail-closed half: a silently-failed install
      # would put us straight back to skipping.
      - name: zsh must be present, or the production-shell cases would silently skip
        run: |
          bash scripts/ci/apt_install.sh zsh zsh
          command -v zsh >/dev/null || { echo "::error::zsh unavailable — the zsh cases would SKIP and this job would report green over them"; exit 1; }

      # The library the dispatcher leans on for liveness. If seat_state ever answers
      # wrongly, fleet_burst inherits the fault -- so its corpus runs on the same trigger.
      # This is also the ONLY workflow in the repo that names this corpus: L09-PR1
      # landed 26 shell checks with no executor at all (W108), so arming them here
      # is not incidental coverage, it is the first time they can go red.
      - name: The seat-state ledger it depends on is still honest
        run: bash scripts/tests/test_seat_state.sh

      # A green run with fewer assertions is still green, so a corpus can rot
      # silently: the exit codes above cannot see it SHRINK. The count is asserted
      # IN ADDITION to those exit codes, never instead of them — an aborted suite
      # never prints its SUMMARY line at all, and this step then reports an absent
      # count rather than quietly accepting one. Same shape and same reasoning as
      # voa-probe-tests.yml's floor.
      #
      # It re-runs the three suites, which is the second execution of each. That
      # cost is accepted and named rather than optimised away with a shared
      # temp file: these are offline bash suites measured at well under a second
      # each, and a floor that read a file written by an earlier step would go
      # green on a stale file if that step were ever removed.
      #
      # No `if: always()`. On a suite failure the step above already reports the
      # real cause; re-running all three afterwards would double the log and turn
      # one clear red into two confusing ones.
      #
      # The diagnostics print to STDERR, deliberately. An earlier draft emitted
      # `::error::` from inside a `$(command substitution)`, where the message is
      # captured into the variable instead of reaching the log — the failure would
      # have been correct and completely mute.
      - name: The seat_build corpora still report at least 51 passing assertions
        run: |
          set -euo pipefail
          extract_count() {
            local suite="$1" name="$2" out count last_summary
            # `|| true`: a failing suite still prints its SUMMARY, and we want to
            # report the COUNT here rather than re-report the failure the step
            # above already surfaced. A failed suite prints "N passed, M failed"
            # with M>0, which the pattern below deliberately does not match — so
            # it lands in the "no SUMMARY" branch and is reported as unknown.
            out=$(bash "$suite" 2>&1 || true)
            # LAST summary line FIRST, then match it — never the other way round.
            # `sed -n '...0 failed.../p' | tail -1` filters to CLEAN summaries and
            # then takes the last of THOSE, so a suite that printed a clean summary
            # early and a FAILING one at the end would have its failure masked by
            # the earlier line. A refuter of this diff found it. Take the final
            # SUMMARY line whatever it says, and only then require it to be clean.
            local last_summary
            last_summary=$(printf '%s\n' "$out" | grep '^SUMMARY ' | tail -1 || true)
            count=$(printf '%s\n' "$last_summary" | sed -n 's/^SUMMARY \([0-9][0-9]*\) passed, 0 failed$/\1/p')
            if [ -z "$count" ]; then
              echo "::error::$name printed no clean SUMMARY line — its assertion count is unknown (it aborted before reporting, or it reported failures)" >&2
              return 1
            fi
            printf '%s\n' "$count"
          }

          seat_count=$(extract_count scripts/tests/test_seat_build.sh test_seat_build.sh)
          tier_count=$(extract_count scripts/tests/test_seat_build_tiers.sh test_seat_build_tiers.sh)
          effort_count=$(extract_count scripts/tests/test_seat_build_effort.sh test_seat_build_effort.sh)

          total=$((seat_count + tier_count + effort_count))
          floor=51
          if [ "$total" -lt "$floor" ]; then
            echo "::error::the seat_build corpora ran $total assertions, below the floor of $floor — assertions were removed or silently skipped" >&2
            exit 1
          fi
          echo "seat_build corpora: $total assertions (floor $floor)"
