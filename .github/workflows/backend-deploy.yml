name: Backend Checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend-rag/**'
      - '!apps/backend-rag/docs/**'
      - '!apps/backend-rag/**/*.md'
  pull_request:
    paths:
      - 'apps/backend-rag/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend-rag/requirements-prod.txt'

      - name: Install dependencies
        run: |
          cd apps/backend-rag
          pip install --no-cache-dir -r requirements-prod.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
        run: |
          cd apps/backend-rag
          python -m pytest tests/ -v --timeout=60 -x -q 2>&1 | head -100

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🚨 *Backend Tests Failed*%0A%0AWorkflow: ${{ github.workflow }}%0ACommit: ${{ github.sha }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "parse_mode=Markdown"
          fi
