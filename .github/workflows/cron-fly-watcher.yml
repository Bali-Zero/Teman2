name: cron - fly watcher (every 15 min)

# Migrated from Pro crontab `*/15 * * * * cron-agent-python/run.sh fly-watcher` (2026-04-26).
# Snapshot of Fly status for runtime apps that still live on Fly.
# Qdrant moved to Qdrant Cloud; do not check the retired nuzantara-qdrant app.
# Alerts if any app has machines NOT in expected state or unhealthy checks.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-fly-watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions:read is required by the edge gate below to read the previous
    # run's conclusion; this block also drops every other default grant.
    permissions:
      actions: read
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Snapshot fly status (runtime apps)
        id: snap
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          REPORT=""
          OVERALL_OK=1
          for app in nuzantara-rag nuzantara-postgres; do
            RAW=$(flyctl status --json -a "$app" 2>&1 || true)
            SUMMARY=$(RAW="$RAW" python3 <<'PY' 2>/dev/null || echo "PARSE_ERROR"
          import json, os, sys
          try:
              d = json.loads(os.environ.get("RAW", ""))
          except Exception:
              print("PARSE_ERROR")
              sys.exit(0)
          machines = d.get("Machines", []) or []
          total = len(machines)
          started = sum(1 for m in machines if m.get("state") == "started")
          expected_stopped = sum(
              1
              for m in machines
              if m.get("state") == "stopped"
              and (m.get("config") or {}).get("standbys")
          )
          unexpected_stopped = sum(
              1
              for m in machines
              if m.get("state") == "stopped"
              and not (m.get("config") or {}).get("standbys")
          )
          bad_states = [
              m.get("state", "?")
              for m in machines
              if m.get("state") not in ("started", "stopped")
          ]
          unhealthy = 0
          for m in machines:
              for c in (m.get("checks") or []):
                  if c.get("status") not in ("passing", None):
                      unhealthy += 1
          print(
              f"total={total}|started={started}|expected_stopped={expected_stopped}|"
              f"unexpected_stopped={unexpected_stopped}|bad={','.join(bad_states) or 'none'}|"
              f"unhealthy={unhealthy}"
          )
          PY
          )
            echo "[$app] $SUMMARY"
            REPORT="${REPORT}[$app] $SUMMARY"$'\n'
            if echo "$SUMMARY" | grep -q "PARSE_ERROR"; then
              OVERALL_OK=0
              continue
            fi
            STARTED=$(echo "$SUMMARY" | tr '|' '\n' | grep ^started= | cut -d= -f2)
            TOTAL=$(echo "$SUMMARY" | tr '|' '\n' | grep ^total= | cut -d= -f2)
            UNEXPECTED_STOPPED=$(echo "$SUMMARY" | tr '|' '\n' | grep ^unexpected_stopped= | cut -d= -f2)
            BAD=$(echo "$SUMMARY" | tr '|' '\n' | grep ^bad= | cut -d= -f2)
            UNHEALTHY=$(echo "$SUMMARY" | tr '|' '\n' | grep ^unhealthy= | cut -d= -f2)
            if [ "${TOTAL:-0}" -lt 1 ] || [ "${STARTED:-0}" -lt 1 ]; then
              OVERALL_OK=0
            fi
            if [ "${UNEXPECTED_STOPPED:-0}" -gt 0 ]; then
              OVERALL_OK=0
            fi
            if [ "${BAD:-none}" != "none" ]; then
              OVERALL_OK=0
            fi
            if [ "${UNHEALTHY:-0}" -gt 0 ]; then
              OVERALL_OK=0
            fi
          done
          {
            echo "report<<EOF"
            echo "$REPORT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "ok=$OVERALL_OK" >> "$GITHUB_OUTPUT"
          if [ "$OVERALL_OK" -ne 1 ]; then
            echo "::warning::Fly fleet anomaly detected"
            exit 1
          fi

      # Runners are stateless, so a PERSISTENT anomaly re-alerted on every run:
      # measured 22-41 sends/day for 6+ straight days (2026-08-14..20, one
      # unhealthy pg vm-check) before this gate existed. The previous completed
      # run's conclusion IS the state: alert only on the green→red edge.
      # Fail-OPEN: if the API cannot answer, send — a gate that cannot verify
      # must not silence (superscar #2).
      - name: Edge gate — page only on green→red transition
        id: edge
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WF_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          # Skip cancelled/skipped runs when reading the state: a budget-kill
          # reads as `cancelled` (W118), never ran the alert step, and must not
          # reset the streak — else every timeout inside a persistent outage
          # re-arms the pager (Kimi K3 refutation, 2026-08-20).
          PREV=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/runs?status=completed&per_page=10" \
            --jq '[.workflow_runs[].conclusion | select(. == "success" or . == "failure")][0] // "unknown"' 2>/dev/null || echo unknown)
          echo "previous completed run: ${PREV:-none}"
          if [ "$PREV" = "failure" ]; then
            echo "send=no" >> "$GITHUB_OUTPUT"
            echo "condition already paged at onset — repeat alert suppressed"
          else
            echo "send=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram alert on anomaly
        if: failure() && steps.edge.outputs.send == 'yes'
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          REPORT: ${{ steps.snap.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$BOT" ] || [ -z "$CHAT" ] && { echo "Telegram secrets missing"; exit 0; }
          TEXT="⚠️ <b>fly-watcher</b> anomaly
          ${REPORT:-no report}
          Run: ${RUN_URL}"
          curl -sS -m 10 -X POST \
            "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" >/dev/null || true
