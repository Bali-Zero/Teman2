name: Intel Router Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/backend-rag/backend/app/routers/intel.py"
      - "apps/backend-rag/backend/services/intel/**"
      - "apps/backend-rag/backend/tests/services/intel/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend-rag/backend/app/routers/intel.py"
      - "apps/backend-rag/backend/services/intel/**"
      - "apps/backend-rag/backend/tests/services/intel/**"
  workflow_dispatch:

concurrency:
  group: intel-router-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Intel Services
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: apps/backend-rag
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov requests
          pip install -r requirements.txt || true

      - name: Run Intel Classification Service tests
        working-directory: apps/backend-rag
        run: |
          python -m pytest backend/tests/services/intel/test_intel_classification_service.py -v --tb=short

      - name: Run Intel Staging Service tests
        working-directory: apps/backend-rag
        run: |
          python -m pytest backend/tests/services/intel/test_intel_staging_service.py -v --tb=short

      - name: Run Intel Approval Service tests
        working-directory: apps/backend-rag
        run: |
          python -m pytest backend/tests/services/intel/test_intel_approval_service.py -v --tb=short

      - name: Run Intel Analytics Service tests
        working-directory: apps/backend-rag
        run: |
          python -m pytest backend/tests/services/intel/test_intel_analytics_service.py -v --tb=short

      - name: Check code syntax
        working-directory: apps/backend-rag
        run: |
          python -m py_compile backend/services/intel/*.py
          python -m py_compile backend/app/routers/intel.py
          echo "✅ All files compile successfully"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            apps/backend-rag/backend/tests/services/intel/
          retention-days: 7

  lint:
    name: Lint Intel Services
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy

      # Removed 2026-08-09 (PENDING-ARMS.md ledger, opened 2026-07-27 — "the
      # prettier rule is enforced by nothing that can see the whole repo" also
      # named this step's twin shape). This step ran
      # `black --check ... || echo "Formatting check skipped"` — the bare
      # `|| echo` swallows every non-zero exit, so the step could never go red
      # and certified nothing (same decorative shape as the W104 antibody that
      # trusted an exit code instead of the reply). Measured before removing
      # it, not assumed: `black --check backend/services/intel/
      # backend/app/routers/intel.py` against this same scope goes RED today
      # (file count in the PR body that removed this step) — arming the bare
      # `||` would have broken every future intel-router PR on a pre-existing
      # backlog this PR did not create. `isort`'s step right below had the
      # identical decorative shape and was left as a ledgered follow-up
      # (opened 2026-08-08) rather than silently inherited as "fixed"
      # alongside this one — resolved 2026-08-09, see the comment on that
      # step: unlike this one, it was armed rather than removed.

      # Mask removed 2026-08-09 (PENDING-ARMS.md ledger, opened 2026-08-08 —
      # this step's decorative twin to the `black` step above). This step ran
      # `isort --check-only ... || echo "Import check skipped"` — same bare
      # `|| echo` shape as `black` had: any non-zero exit was swallowed and
      # the step could never go red. Measured before touching it, not
      # assumed: the last 20 runs of this workflow on `main`
      # (2026-05-19 -> 2026-08-02, job "Lint Intel Services") were inspected
      # for whether the mask ever actually fired — 0/20 masked, isort exited
      # 0 silently every time. Re-verified locally against origin/main@44b6d86
      # (2026-08-09) with the exact tool CI installs (`isort==8.0.1`, the
      # version `pip install ... isort` resolved to across the whole sampled
      # window since it's PyPI's current release) and CI's own Python
      # (3.11.15) from this same working directory (so `[tool.isort]` in
      # `pyproject.toml` is picked up identically) — still clean, RC=0.
      # Deliberately NOT removed like `black` was: `black` was RED (3/22
      # files) — arming its bare `||` would have broken every future PR on a
      # pre-existing backlog this repo hadn't budgeted for. `isort` is a
      # measured zero-population — arming it today breaks nothing, and
      # leaving the mask on is family #2 (esiste≠armato): the day isort
      # genuinely fails, the `|| echo` would swallow that red exactly like it
      # swallowed black's, and CI would stay green over a real regression.
      # Same measurement, opposite verdict, by design.

      - name: Check imports
        working-directory: apps/backend-rag
        run: |
          isort --check-only backend/services/intel/ backend/app/routers/intel.py

  # Note: Post-deploy tests are run manually after local deployment to Fly.io
  # Deploy is done locally: fly deploy -a nuzantara-rag
  # Then run: python3 scripts/testing/test_intel_production.py
