name: Monthly PG Restore Drill

# Proves that the daily pg_dump → Tigris pipeline is actually restorable.
# Without this, a silent backup corruption could go unnoticed for weeks.
#
# Schedule: 1st of every month at 04:00 UTC (12:00 WITA).
# Also triggerable on-demand via workflow_dispatch.
#
# L2.1 roadmap — see AUTONOMOUS_OPS.md §"Guardrails that make this safe".

on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st
  workflow_dispatch:

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # PostGIS image (not bare postgres:17): the prod dump declares a
        # `public.geometry(Point,4326)` column on `clients` (+ CREATE EXTENSION
        # postgis). Without postgis, CREATE TABLE clients fails, the table is
        # never created, and its COPY rows leak as SQL syntax errors. Drop-in
        # superset of the postgres image — same POSTGRES_* env contract.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: nuzantara_drill
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 15499:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install postgresql-client + ensure aws CLI
        run: |
          # NOTE: do NOT apt-install `awscli` — it has no installation candidate
          # on ubuntu-24.04 runners (apt exit 100, drill failed every run since
          # 2026-05-05). aws CLI v2 is pre-installed on GitHub-hosted runners;
          # verify it, and fall back to the official installer if ever absent.
          bash scripts/ci/apt_install.sh pg_restore postgresql-client
          if ! command -v aws >/dev/null 2>&1; then
            echo "aws CLI not pre-installed — fetching official v2 bundle"
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws --version

      - name: Run restore drill
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          TIGRIS_ENDPOINT: https://fly.storage.tigris.dev
          TIGRIS_BUCKET: nuzantara-backups
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          DRILL_PORT: "15499"
          TOLERANCE_PCT: "15"
          # CI already has its own Postgres service running — we bypass the
          # docker-run path by pointing at it directly. The script detects
          # a pre-provisioned container via DRILL_CONTAINER_EXISTS.
          DRILL_CONTAINER_EXISTS: "1"
        run: |
          # CORRECTED (scar-class W113 -- a comment stating a fact WRONG
          # is worse than stating no fact, because it invites a future edit
          # on its authority): the earlier version of this comment claimed
          # `-o pipefail` was NOT part of Actions' default and had to be
          # added here explicitly. That is false. GitHub's documented
          # command line for the `bash` shell keyword -- used both as the
          # Linux/macOS DEFAULT when no `shell:` is declared, AND for this
          # step's own EXPLICIT `shell: bash` (line 65) -- is
          # `bash --noprofile --norc -eo pipefail {0}`: errexit (`-e`) AND
          # pipefail (`-o pipefail`) are BOTH already active before this
          # line ever runs. `-u` (nounset) is the one flag genuinely NEW
          # here -- neither the unset default nor an explicit `shell: bash`
          # turns it on. Restating `-e`/`-o pipefail` below is therefore
          # redundant, not load-bearing, but kept explicit for readability
          # rather than deleted -- do not read this correction as licence to
          # drop them. See scripts/lint_workflow_errexit_decap.py's own
          # header for the separate, still-correct claim this does not
          # contradict: that file is about errexit alone and treats
          # `shell: bash` the same as the unset default, which matches the
          # fact above.
          set -euo pipefail

          # Skip the docker-run block: we already have a service container.
          # Just run the drill against the service DB.
          cd "$GITHUB_WORKSPACE"

          # Creds preflight: distinguish "Tigris repo secrets not configured"
          # (a setup gap) from "backups genuinely missing/corrupt" (a DR
          # emergency). Without this they both surfaced as the same alarming
          # "backups may not be recoverable" alert. The TIGRIS_ACCESS_KEY_ID /
          # TIGRIS_SECRET_ACCESS_KEY repo secrets are absent as of 2026-06-05.
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error title=Tigris credentials not configured::TIGRIS_ACCESS_KEY_ID / TIGRIS_SECRET_ACCESS_KEY repo secrets are empty. The drill cannot list/download backups. Set them with: gh secret set TIGRIS_ACCESS_KEY_ID  and  gh secret set TIGRIS_SECRET_ACCESS_KEY  (values from the Tigris/Fly storage dashboard). This is a setup gap, NOT proof that backups are corrupt."
            exit 1
          fi

          # Find + download latest backup
          LATEST=$(aws --endpoint-url "$TIGRIS_ENDPOINT" s3 ls \
            "s3://$TIGRIS_BUCKET/postgres/" \
            | awk '{print $4}' | grep -E '\.sql\.gz$' | sort | tail -1)
          test -n "$LATEST" || { echo "no backups"; exit 1; }
          echo "Latest backup: $LATEST"

          aws --endpoint-url "$TIGRIS_ENDPOINT" s3 cp \
            "s3://$TIGRIS_BUCKET/postgres/$LATEST" "/tmp/$LATEST"

          DUMP_SIZE=$(stat -c%s "/tmp/$LATEST")
          echo "Downloaded $DUMP_SIZE bytes"
          test "$DUMP_SIZE" -gt 1000000

          # Restore into CI postgres service.
          #
          # NOTE: PGPASSWORD must prefix psql, NOT gunzip — an env prefix only
          # applies to the left side of a pipe, so `PGPASSWORD=drill gunzip | psql`
          # leaves psql with NO password → instant auth-fail → 0 tables restored
          # (the 2026-06-06 silent-restore bug the drill itself surfaced). The DSN
          # below carries the credential inline instead, which sidesteps that
          # whole class of "which side of the pipe" bug: there is no side to get
          # wrong when the credential is one token in one argv, not an
          # env-var prefix scoped to half a shell pipeline.
          DSN="postgresql://drill:drill@127.0.0.1:${DRILL_PORT}/nuzantara_drill"

          # ON_ERROR_STOP=1 (was 0): a restore that silently swallows a failed
          # statement is exactly the blind spot this drill exists to close —
          # see restore_drill_verify.py's own module docstring for the fuller
          # case. The trade this makes explicit rather than silent: a dump that
          # legitimately needs a privilege the CI role lacks (superuser-only
          # CREATE EXTENSION, an ALTER ... OWNER TO naming a role CI never
          # created) now aborts the WHOLE restore instead of continuing past it.
          # That has never been measured against a real production dump in this
          # CI environment — the first live dispatch of this drill after this
          # change lands is the real test of whether that trade is survivable
          # as-is; a benign-privilege abort here is expected to need a follow-up
          # (documented in the PR, not fixed blind here).
          #
          # `set +e` / `set -e` bracket the pipe explicitly (scar W101 and its
          # three recurrences: a bare `${PIPESTATUS[N]}` read under a live
          # errexit is decapitated — the read is fine, but errexit already
          # killed the step at the failing segment before the read's own line
          # could run). This is the ONLY way to guarantee the log tail below
          # still prints when the restore itself fails.
          #
          # PIPESTATUS[1] is psql's own exit code (index 0 = gunzip, the
          # FIRST command in the pipe) — measured directly (`echo x | false;
          # STATUSES=("${PIPESTATUS[@]}")` prints `[0]=0 [1]=1`), not assumed.
          # gunzip almost never fails on a valid .sql.gz (the size check above
          # already proved the file downloaded intact); RESTORE_RC (index 1)
          # is psql's own pass/fail signal for the restore. Reading only
          # index 0 here would make the whole ON_ERROR_STOP=1 legibility
          # change silently inert on a genuinely failing restore — caught by
          # a stubbed end-to-end run of this exact script with a faked
          # failing psql, BEFORE this line shipped.
          #
          # But index 0 is NOT ignored either: a truncated/corrupt .gz can
          # make gunzip itself exit non-zero while psql, fed only the valid
          # PREFIX gunzip managed to emit before dying, still exits 0 — a
          # restore of an INCOMPLETE dump reported as a pass if only
          # RESTORE_RC is read. GUNZIP_RC (index 0, from the SAME captured
          # array) closes that gap; see the dedicated `if` below for why it
          # is checked under its own title rather than folded into the
          # ON_ERROR_STOP=1 message.
          #
          # The whole array is captured in ONE assignment
          # (`_PIPE_STATUSES=(...)`), not two separate scalar reads: any
          # simple command — even a bare assignment — resets $PIPESTATUS to
          # its OWN single-element pipeline, so `A=${PIPESTATUS[0]}` on one
          # line followed by `B=${PIPESTATUS[1]}` on the next reads a DIFFERENT,
          # already-overwritten array for B (measured the same way). Both
          # GUNZIP_RC and RESTORE_RC below read from that ONE captured array,
          # immediately after it, so neither line resets $PIPESTATUS again.
          set +e
          gunzip -c "/tmp/$LATEST" | \
            psql "$DSN" -v ON_ERROR_STOP=1 \
              > /tmp/restore.log 2>&1
          _PIPE_STATUSES=("${PIPESTATUS[@]}")
          GUNZIP_RC=${_PIPE_STATUSES[0]}
          RESTORE_RC=${_PIPE_STATUSES[1]}
          set -e

          # Surface restore output — previously hidden, which is what let the
          # PGPASSWORD-scope bug stay invisible until a manual investigation.
          # Printed UNCONDITIONALLY, restore success or failure, so an abort
          # under ON_ERROR_STOP=1 is legible: the failing statement is the
          # LAST one psql attempted, i.e. the one closest to the tail's end —
          # everything the dump had left to run after it was never attempted.
          echo "=== restore.log (tail) ==="; tail -25 /tmp/restore.log; echo "=== end restore.log ==="

          # RESTORE_RC checked FIRST, GUNZIP_RC only after it (this is the
          # OPPOSITE of the previous ordering, and the previous ordering was
          # a real bug, not a style choice): when psql itself dies mid-COPY
          # (a bad statement, a permissions gap, ON_ERROR_STOP tripping),
          # the pipe's reader is gone and gunzip receives SIGPIPE (rc=141)
          # from the OS as a pure CONSEQUENCE of psql's death — not an
          # independent fault. Measured: `gunzip -c big.gz | sh -c "exit
          # 3"` gives PIPESTATUS=(141 3). Checking GUNZIP_RC first (the
          # previous ordering) meant EVERY genuine psql failure was
          # reported as "Backup archive truncated or corrupt (gunzip
          # failed)" — an operator hitting a real SQL failure during a
          # restore drill was told their backup was corrupt (scar
          # W113-class: a diagnostic message accusing the wrong
          # component). psql's own exit code is the authoritative signal
          # for whether the RESTORE succeeded; it is judged first, and on
          # this path gunzip is never even mentioned.
          if [ "$RESTORE_RC" -ne 0 ]; then
            echo "::error title=Restore aborted (ON_ERROR_STOP=1)::psql exited $RESTORE_RC. The failing statement is the last one visible above; see the PR/runbook note on ON_ERROR_STOP=1 before assuming this means the backup itself is corrupt."
            exit 3
          fi

          # Reached only when psql succeeded (RESTORE_RC=0) — that is
          # already independent proof the restore itself completed. What
          # follows judges GUNZIP_RC on its OWN terms, never as evidence
          # against a restore that RESTORE_RC=0 already vouches for.
          if [ "$GUNZIP_RC" -eq 141 ]; then
            # SIGPIPE with a SUCCESSFUL psql is anomalous (a healthy
            # consumer reading to a clean EOF should not leave its
            # producer mid-write) but is not itself evidence of a
            # corrupt/truncated archive — RESTORE_RC=0 above already
            # proved the restore completed. Deliberately WARN, not fail:
            # failing here would manufacture exactly the false-positive
            # class this reordering exists to remove. If this recurs on a
            # real dispatch, that pattern (not a single occurrence) is
            # what would warrant investigation.
            echo "::warning title=gunzip received SIGPIPE after a successful restore::gunzip exited 141 (SIGPIPE) decompressing /tmp/$LATEST, but psql (index 1) already exited 0 — the restore completed. This is not evidence the archive is corrupt; it means gunzip's writer side of the pipe closed after psql finished reading. Investigate only if this pattern recurs across runs."
          elif [ "$GUNZIP_RC" -eq 2 ]; then
            # gzip's own documented WARNING exit status (e.g. "trailing
            # garbage ignored" after a complete, valid stream) — the
            # decompression can be COMPLETE despite status 2. Measured:
            # `gunzip -c tg.gz | cat` on an archive with a valid payload
            # followed by trailing garbage exits 2 while emitting every
            # line of the full uncompressed payload. RESTORE_RC=0 above is
            # independent proof the restore succeeded, so this message
            # must NOT claim "truncated" or "incomplete" — that would be
            # false. Still fail-loud on purpose: for a BACKUP drill, an
            # archive that trips a gzip warning is worth a human look even
            # when the restore it produced was fine.
            echo "::error title=Backup archive reported a gzip warning-class status (restore completed)::gunzip exited 2 (gzip's documented WARNING status, e.g. \"trailing garbage ignored\") decompressing /tmp/$LATEST. psql (index 1) exited 0 and the restore itself completed — this is NOT a truncated or incomplete restore. Investigate the archive / backup-writing pipeline for the trailing-garbage condition; the drill fails here to surface that, not because data was lost."
            exit 4
          elif [ "$GUNZIP_RC" -ne 0 ]; then
            # Any other non-zero GUNZIP_RC alongside a psql that still
            # exited 0: gunzip can die on a genuinely corrupt archive
            # while still having emitted a syntactically-valid-looking
            # PREFIX that lets psql run to completion on partial data —
            # exactly the "restore of an incomplete dump reported as a
            # pass" gap this GUNZIP_RC check exists to close. RESTORE_RC=0
            # here does NOT mean the full dump was applied.
            echo "::error title=Backup archive truncated or corrupt (gunzip failed)::gunzip exited $GUNZIP_RC decompressing /tmp/$LATEST. psql (index 1) exited 0 despite this — it may only have consumed the truncated PREFIX gunzip managed to emit before failing, which can still look like a complete, successful restore. Investigate the downloaded archive / Tigris backup pipeline, not the target database schema."
            exit 4
          fi

          # Level-5 application verification (was: a bare table census —
          # `TABLES -ge 50` — that a restore of 60 empty tables would still
          # pass). See scripts/ci/restore_drill_verify.py for the full
          # rationale; same set+e/set-e bracket as above and for the same
          # reason.
          set +e
          python3 scripts/ci/restore_drill_verify.py --dsn "$DSN" --json \
            > /tmp/verify.json 2> /tmp/verify.err
          VERIFY_RC=$?
          set -e

          echo "=== restore_drill_verify.py (Level-5 verification) ==="
          cat /tmp/verify.json
          cat /tmp/verify.err >&2
          echo "=== end restore_drill_verify.py ==="

          if [ "$VERIFY_RC" -ne 0 ]; then
            echo "::error title=Restore drill FAILED Level-5 verification::exit $VERIFY_RC — see the per-invariant verdicts printed above for which relation(s) and why."
          fi

          # A one-line summary for the Telegram message only -- the FULL
          # per-invariant JSON is already in the job log above. Single-line
          # python3 -c on purpose: a multi-line snippet embedded inside a
          # YAML block scalar must stay indented at-or-above the block's own
          # indent or YAML treats it as the block ending early (measured:
          # the first draft of this line broke exactly that way).
          AGGREGATE=$(python3 -c "import json; print(json.load(open('/tmp/verify.json'))['aggregate'])" 2>/dev/null || echo "UNKNOWN (could not parse verify.json)")

          # Telegram notification.
          #
          # DEVIATION from the letter of "remove every unconditional swallow
          # of a curl failure on this step": the two Telegram steps below
          # never let a broken notification fail the DRILL. Measured, not
          # assumed: cicatrix-scars.md's own W104-adjacent finding records
          # `TELEGRAM_BOT_TOKEN` answering `{"ok":false,"error_code":401,...}`
          # from GitHub Actions secrets at least once before. A step that
          # aborts on that would mean a dead bot token turns EVERY PASSING
          # drill red — exactly the kind of guard-over-match (superscar #3)
          # this repo has paid for repeatedly elsewhere. So this is not the
          # OLD unconditional-success pattern either: the curl's own outcome
          # is captured into a variable and surfaced loudly (`::warning::`),
          # so a broken notification is VISIBLE without being allowed to
          # decide whether the backup is recoverable. Do not delete this
          # capture to "finish the job" — read the deviation in the PR body
          # first.
          if [ "$VERIFY_RC" -eq 0 ]; then
            MSG=$(cat <<EOF
          ✅ Restore drill passed (CI) — Level-5 verification
          backup: $LATEST
          dump: $DUMP_SIZE bytes
          verdict: $AGGREGATE
          EOF
            )
            set +e
            TG_BODY=$(curl -s --max-time 10 -w '\nHTTP_STATUS:%{http_code}' \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_OWNER_CHAT_ID}" \
              --data-urlencode "text=${MSG}")
            TG_RC=$?
            set -e
            echo "::warning::telegram success-notify rc=${TG_RC} response=${TG_BODY}"
          fi

          exit "$VERIFY_RC"

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          # Same deviation as the success notifier above: a dead Telegram
          # token must never mask which step actually failed, so this never
          # aborts on the curl's own failure -- but its outcome is captured
          # and surfaced instead of being silently discarded either. See the
          # PR body for the full reasoning; do not delete this capture
          # without reading it first.
          set +e
          TG_BODY=$(curl -s --max-time 10 -w '\nHTTP_STATUS:%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_OWNER_CHAT_ID}" \
            --data-urlencode "text=❌ Monthly restore drill FAILED — backups may not be recoverable. Investigate: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          TG_RC=$?
          set -e
          echo "::warning::telegram failure-notify rc=${TG_RC} response=${TG_BODY}"
