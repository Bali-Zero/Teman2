name: P1 STRATO-2 incremental mutation gate

# P1 verify-the-verifiers §3 STRATO-2 (2026-06-07): the "quality oracle" of the
# bias-immune layer. Runs scripts/mutation_incremental.py — the INCREMENTAL
# (AST-diff, changed-lines-only) mutation driver with HIDDEN CANARY MUTANTS
# (anti-mutation-cheat: the agent under test cannot game the mutation score).
#
# TWO things are enforced here, both deterministic / bias-immune:
#   1. The driver's own test-suite (scripts/test_mutation_incremental.py) must
#      be green — the canary engine, the diff parser, the survivor gate.
#   2. The canary SELF-TEST runs against the live driver: if any frozen canary
#      mutant SURVIVES, the gate FAILS (test suite too weak / gamed).
#
# mutmut is installed HERE so the incremental mutmut leg actually runs in CI
# (on M5/local it is absent and the driver SKIPS that leg honestly — see the
# driver docstring + gate-fragment). The OPERATOR controls seed/baseline via
# MUTATION_SEED / --baseline; the agent under test does not.
#
# Triggers BOTH pull_request AND push-to-main (W41/W42 cicatrix lesson:
# pull_request-only gives false safety because L2 autonomous-ops direct-push
# to main silently SKIPS the gate).

# NOTE (BUCO #1 skip→success sentinel, 2026-06-09): the top-level
# pull_request `paths:` filter was REMOVED so this workflow ALWAYS triggers on
# pull_request and can therefore be a required-status-check WITHOUT the
# pending-forever trap (a paths-filtered required check never reports on a
# path-miss PR and blocks merge — W69). The relevant-paths decision now lives
# in the "Did relevant paths change?" step below, and the expensive WORK steps
# are gated on its output. On a path-miss PR the job ENDS success (sentinel).
# The push trigger keeps its paths filter (push only fires when work is needed).
# `merge_group:` TRIGGER — added 2026-08-31, together with the sentinel change
# that is the whole reason it was safe to add. The previous version of this
# comment argued the trigger should stay ABSENT, and it was right at the time
# for a reason that has changed: this job was not a required context, so its
# absence from the queue deadlocked nothing, while adding the trigger alone
# would have run a full mutation gate — pip install mutmut, a mutation pass —
# on EVERY PR entering the queue, fleet-wide, because the relevance step below
# answered `run=true` for every non-pull_request event.
#
# That comment also named the honest fix, verbatim: "the relevance step must
# first learn to compute changed files against `github.event.merge_group.base_sha`,
# or the sentinel's own logic turns the saving off." That is exactly what the
# step below now does, so the trigger arrives WITH its cost control and not
# ahead of it. A queue entry that touches no trust path now skips the same
# expensive steps an irrelevant PR skips — the pip install of mutmut and the
# mutation pass. It does NOT end at the sentinel: three cheap unconditional
# steps run below it on every event (the instrument census, its dep install,
# and the sentinel's own corpus), by design and for ~10s. An earlier draft of
# this sentence said "ends at the sentinel" and a blind refuter of this diff
# pointed out it had stopped being true the moment those steps were added.
#
# Why this matters now: the job is being made SAFE TO REQUIRE. A required
# status check with no `merge_group:` trigger cannot be satisfied by a
# merge-queue run at all (conformance guard rule 2), which either stalls the
# queue or silently drops the check from queue enforcement. Whether this
# context IS required lives in branch protection, not in this file.
on:
  pull_request: # NO top-level paths: — always trigger (sentinel gates the work)
  merge_group: # required-context safe (see the header) — the sentinel resolves the queue's own base
  push:
    branches:
      - main
    paths:
      - "scripts/mutation_incremental.py"
      - "scripts/test_mutation_incremental.py"
      - ".github/workflows/p1s2-mutation-incremental.yml"
      # W121 trust path — a change to the hermetic wrapper, its census lint or
      # their corpus changes whether ANY number below is trustworthy, so it must
      # run this gate. Omitting them meant a PR that edited ONLY the wrapper —
      # including one that disabled it — never executed the self-canary: a
      # guardian whose sole executor cannot go red on the guardian's own file
      # (superscar #2 / W108). Found by the cross-family refuter, verified here.
      - "scripts/hermetic_verify.sh"
      - "scripts/ci/lint_hermetic_instruments.py"
      - "scripts/tests/test_hermetic_census.py"

concurrency:
  # Per-PR/per-ref for every author. A shared per-workflow group keyed on
  # github.actor was removed 2026-09-02: GitHub keeps only ONE pending run per
  # group, so a 3rd near-simultaneous arrival was cancelled BEFORE any job
  # started — no check-run object is created, so a required context sits at
  # "Expected — waiting for status" with nothing red to see. Concurrency is now
  # bounded only by the account-level ceiling, which QUEUES past it rather than
  # dropping: lateness is visible, an absent check-run is not.
  group: p1s2-mutation-incremental-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  mutation-gate:
    name: Canary self-test + incremental mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so git diff sees the PR changes
          # blob:none — partial clone: every commit and tree, no file contents (fetched on
          # demand). `fetch-depth: 0` is KEPT, so this gate's `git diff --name-only` resolves
          # exactly as before; only blob DELIVERY becomes lazy. Measured on this repository:
          # a full clone moves 2,289 MB, blob:none moves 23.3 MB in 21s.
          # Not a tidy-up: on 2026-07-27 this same checkout ate 297s of a 300s job budget in
          # adversarial-review-gate and 597s of 600s in P6 and was KILLED, so those gates never
          # ran. A timeout kill reports `cancelled`, and a cancelled REQUIRED check EJECTS the
          # merge-queue entry, which then sits open with auto-merge off. See #3375 for the
          # measurement and for why the flag's presence in the fetch log — not a green check —
          # is the proof (an unsupported input is silently ignored by Actions).
          filter: blob:none

      # BUCO #1 sentinel: decide whether this gate's RELEVANT paths changed in
      # this PR. Dependency-free git diff (no third-party action — TIER-1
      # anti-injection file). The regex mirrors the `push: paths:` list above,
      # each entry anchored ^...$ — the two are one relevance decision expressed
      # for two event shapes, and `scripts/tests/test_hermetic_census.py` pins
      # them EQUAL so neither can gain a path the other lacks (an earlier
      # version of this comment said "the EXACT original pull_request paths
      # list", which stopped being true the moment either side was extended —
      # a comment that inventories mutable state is a comment that will lie,
      # W106). On a push event (already paths-filtered at the trigger) or any
      # non-PR event, run=true so the gate never silently skips real work.
      - name: Did relevant paths change?
        id: relevant
        run: |
          set -euo pipefail
          # Each event carries its diff base under a DIFFERENT key, so the base is
          # resolved per event rather than assumed. `merge_group` exposes
          # `github.event.merge_group.base_sha` — the tip of main the queue is
          # merging onto — and nothing under `pull_request`. Before this, every
          # non-pull_request event answered `run=true` unconditionally, which is
          # why adding the queue trigger alone would have bought a full mutation
          # pass on every entry, fleet-wide.
          #
          # `push:` and anything else keep the old unconditional `run=true`: the
          # push trigger is already paths-filtered at the trigger, so a push run
          # that exists is a push run that needs the work.
          event="${{ github.event_name }}"
          if [[ "$event" != "pull_request" && "$event" != "merge_group" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::non-PR event ($event) — running full mutation gate"
            exit 0
          fi
          if [[ "$event" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.merge_group.base_sha }}"
          fi
          # FAIL OPEN, toward doing the work. A sentinel that answers "nothing
          # relevant changed" because it could not measure is a false green on a
          # correctness gate — the one direction this job must never fail in. So
          # an empty base or a failed diff resolves `run=true` and SAYS SO on a
          # ::warning::, rather than being swallowed. The rc is captured with
          # `|| rc=$?` instead of being read off a surviving pipeline: under
          # `set -e` an unguarded failure aborts the step and the fallback below
          # would be unreachable code on the only path it exists for (W108).
          if [[ -z "$base" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::empty base SHA for event '$event' — cannot compute relevance, running the full mutation gate"
            exit 0
          fi
          changed="$RUNNER_TEMP/p1s2-changed-files.txt"
          diff_rc=0
          git diff --name-only "$base"...HEAD > "$changed" || diff_rc=$?
          if [[ "$diff_rc" -ne 0 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::git diff against $base failed (rc=$diff_rc) — cannot compute relevance, running the full mutation gate"
            exit 0
          fi
          # The alternation below is pinned EQUAL to the `push: paths:` list above by
          # scripts/tests/test_hermetic_census.py — they are one relevance decision
          # expressed for two event shapes, and neither may gain a path the other lacks.
          #
          # grep's rc is THREE-VALUED and the difference is load-bearing: 0 matched,
          # 1 did not match, >1 an ERROR (unreadable file, exhausted descriptors).
          # An `if grep ...; then A; else B; fi` collapses 1 and >1 into the same
          # branch, so a grep that could not READ the file would be recorded as
          # "nothing relevant changed" and skip the gate — a failure to measure
          # reported as a measurement, which is the one direction this sentinel must
          # never fail in. Found by a blind cross-family refuter of this diff.
          grep_rc=0
          grep -qE \
            '^(scripts/mutation_incremental\.py|scripts/test_mutation_incremental\.py|\.github/workflows/p1s2-mutation-incremental\.yml|scripts/hermetic_verify\.sh|scripts/ci/lint_hermetic_instruments\.py|scripts/tests/test_hermetic_census\.py)$' "$changed" || grep_rc=$?
          if [[ "$grep_rc" -eq 0 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$grep_rc" -eq 1 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no relevant paths changed — sentinel success"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::grep failed (rc=$grep_rc) reading the changed-file list — cannot compute relevance, running the full mutation gate"
          fi

      # UNCONDITIONAL, and the asymmetry with every step below it is the point.
      # A round-2 refuter (kimi-code/k3) found that the census lint this PR adds
      # was named in this workflow ONLY as a trigger path — nothing ever RAN it.
      # The PR's own commit message accuses its predecessor of exactly that
      # shape; I fixed the trigger and not the execution, which is the half that
      # looks right. Verified before fixing: `grep -rln lint_hermetic_instruments
      # .github/workflows/` returned this file and this file only, from the
      # `paths:` list.
      #
      # It is NOT gated on `steps.relevant.outputs.run` because its subject is
      # every workflow in the tree, not this one's trust-path files: a PR that
      # adds a bare instrument invocation to an UNRELATED workflow is precisely
      # what it exists to catch, and that PR touches none of the paths the
      # sentinel matches. Cost is bounded — pure stdlib, no deps, no network,
      # ~1s over 106 files — and the live tree measures 0 violations today, so
      # its first red will be a real one rather than a migration tax.
      #
      # DECLARED GAP, on the PUSH side only. This step is unconditional within
      # the job, but the JOB still fires on push only for the six paths below.
      # So a direct-to-main push that adds a bare instrument invocation to a
      # DIFFERENT workflow file never runs this census. PRs are covered (no
      # top-level pull_request paths filter — the sentinel gates the work, not
      # the trigger), and workflow edits are hot-zone gated besides, so the
      # uncovered path is narrow. Closing it means adding `.github/workflows/**`
      # to the push paths, which would ALSO fire the full mutation gate on
      # every workflow push to main, because the relevance step resolves
      # run=true for every non-pull_request event. That is a cost, not a
      # one-liner, and it is a different concern from this PR: the honest fix
      # teaches the relevance step to compute changed files on push instead of
      # answering true. Found by a round-3 refuter; declared rather than
      # half-fixed.
      - name: Instrument census — every measurement instrument runs wrapped (W121)
        run: python3 scripts/ci/lint_hermetic_instruments.py

      # UNCONDITIONAL, for the same reason as the census lint above and one more.
      # This corpus EXECUTES the `relevant` step's own shell body against synthetic
      # git repositories and asserts what it resolves for each event shape. Its
      # subject is the sentinel that decides whether every step below this one runs
      # at all — so gating it on that sentinel's own output would mean a broken
      # sentinel could switch off the only thing that checks it, and the job would
      # report success having verified nothing (superscar #2, and the precise
      # failure this workflow exists to prevent one level down).
      #
      # NOT in the trust-path alternation, deliberately: this file does not change
      # what the mutation gate MEASURES, so a PR editing it has no reason to buy a
      # mutation pass. It runs on every pull_request and every merge_group entry
      # because this workflow carries no pull_request paths filter.
      #
      # DECLARED GAP, push side only, same shape as the census lint's: a direct
      # push to main editing ONLY this corpus does not fire the job, because the
      # push trigger keeps its paths filter. Narrow — workflow and script edits
      # reach main through PRs, which are covered — and declared rather than
      # half-closed by widening the push filter, which would fire the full
      # mutation gate on unrelated pushes.
      #
      # Cost measured 2026-08-31: 9 tests in 1.5s, plus ~8s for the install below.
      # Against the merge queue's measured critical path (415s median over the last
      # 8 entries, driven by Frontend Tests / E2E Playwright at 413s) that is
      # immaterial — it runs in parallel with a path an order of magnitude longer.
      #
      # The install is explicit and not assumed away: this step runs BEFORE the
      # relevance-gated `Set up Python`, on the runner's system python3, which does
      # not ship pytest and is not relied upon for PyYAML anywhere in this repo —
      # `immune-enforcement.yml` installs `pytest PyYAML==6.0.3` before its own
      # required checks for exactly this reason, and this line matches it including
      # the PyYAML pin. Checked rather than assumed: an unconditional step whose
      # deps are absent fails a required check for a reason unrelated to any diff.
      - name: Deps for the unconditional corpus (system python3 has neither)
        run: python3 -m pip install --quiet pytest PyYAML==6.0.3

      - name: The relevance sentinel resolves the right base for each event shape
        run: python3 -m pytest scripts/tests/test_p1s2_relevance_sentinel.py -q

      - name: Set up Python
        if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install driver test deps (pytest) + mutmut (CI-provided)
        if: steps.relevant.outputs.run == 'true'
        run: pip install pytest "mutmut>=2.4,<3"

      - name: Driver self-tests (canary engine, diff parser, survivor gate)
        if: steps.relevant.outputs.run == 'true'
        run: python3 -m pytest scripts/test_mutation_incremental.py -q

      # The corpus for the wrapper and the census. Relevance-gated, unlike the
      # lint above, because its subject IS this workflow's trust-path files —
      # and those are exactly what the sentinel matches. Before this step it
      # ran in `scripts/tests/ sweep` only, which is `continue-on-error: true`
      # and in no required context: a corpus whose only executor cannot go red
      # proves nothing (superscar #2, and the third instance of it found in
      # this one PR).
      - name: Hermetic wrapper + census corpus
        if: steps.relevant.outputs.run == 'true'
        run: python3 -m pytest scripts/tests/test_hermetic_census.py -q

      # W121 (2026-08-21, cicatrix-scars.md): a mutation-testing cycle that
      # mutates and restores source files in the same second, without a
      # byte-length change, can have its .pyc reused stale by Python's
      # mtime+size-only staleness check — silently, in either direction (a
      # survivor reported as a kill, or a kill reported as a survivor). This
      # instrument does exactly that mutate/restore shape. scripts/
      # hermetic_verify.sh proves the environment cannot reuse stale
      # bytecode BEFORE trusting any number the instrument prints below, and
      # wraps every invocation of it so nothing downstream runs unprotected.
      - name: Hermetic self-canary (proves stale bytecode reuse is impossible — W121)
        if: steps.relevant.outputs.run == 'true'
        run: bash scripts/hermetic_verify.sh --self-test-only

      - name: Print frozen canary integrity hash
        if: steps.relevant.outputs.run == 'true'
        run: bash scripts/hermetic_verify.sh -- python3 scripts/mutation_incremental.py --print-integrity

      - name: Canary self-test + incremental mutation gate
        if: steps.relevant.outputs.run == 'true'
        # mutmut IS installed here → the mutmut leg runs on changed lines.
        # --allow-skip is intentionally NOT passed: if mutmut were somehow
        # absent in CI we WANT exit 2 (visible SKIP), never a false pass.
        run: bash scripts/hermetic_verify.sh -- python3 scripts/mutation_incremental.py -v
