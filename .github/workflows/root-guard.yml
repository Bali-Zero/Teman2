name: Root Guard

on:
  pull_request:
    # Run on every PR — the SCRIPT is fast (~0.2s) and catches root-pollution
    # attempts that slip past pre-commit (e.g. someone commits with --no-verify).
    # The JOB is not: see the timeout note below — the script's runtime is not
    # the job's floor, and reading it as one is what set the budget too low.
  push:
    branches: [main]

concurrency:
  # Dependabot branch: ALL Dependabot PRs share one group per workflow (not
  # per-ref), bounding concurrent Dependabot runs of THIS workflow to <=2
  # (Agent PR Contract rule 5) instead of unbounded parallel.
  # cancel-in-progress:false protects whichever run is RUNNING; GitHub keeps
  # only one PENDING per group, so a 3rd+ near-simultaneous arrival cancels
  # the pending run rather than queuing behind it — visible in the PR's
  # checks tab (never silent), recoverable with `gh run rerun` (confirmed:
  # docs.github.com/en/actions/using-jobs/using-concurrency + kimi-code/k3
  # refuter round on PR #5043). Non-Dependabot branch is byte-for-byte the
  # pre-existing expression — untouched.
  group: ${{ github.actor == 'dependabot[bot]' && format('dependabot-lockfile-{0}', github.workflow) || format('root-guard-{0}', github.ref) }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'merge_group' }}

jobs:
  root-guard:
    runs-on: ubuntu-latest
    # 2 → 10 (2026-08-06). Same wall as docs-sync.yml, and this one is worse:
    # `root-guard` is a REQUIRED context on main AND runs on `merge_group`, so a
    # blown budget stalls the merge queue itself. `actions/checkout` on this repo
    # normally takes ~20s but intermittently takes MINUTES. Measured on this
    # workflow's own history: 1 of the last 30 PR runs was cut off — and on the
    # MERGE QUEUE ref its checkout ran 2m05s and was killed, which is what kept
    # ejecting #3647 from the queue three times in a row.
    #
    # A blown budget reports as `cancelled`, not `failure`, and a cancelled
    # required check never turns green by itself. `fetch-depth: 1` is already set
    # — the cost is the repo's size, not its history — so headroom is the cure.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check repo root against whitelist
        run: python scripts/root_guard.py --check
