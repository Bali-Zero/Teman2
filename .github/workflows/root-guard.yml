name: Root Guard

on:
  # Non-required lint: runs once per merge (merge_group) and on push to main, not on every
  # PR push. Its input is the whole repo root (any new top-level entry), so it cannot be
  # path-narrowed. If this becomes a required context, pull_request must come back
  # unfiltered (scripts/ci/check_required_workflow_conformance.py rules 3-4).
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per-PR/per-ref for every author. A shared per-workflow group keyed on
  # github.actor was removed 2026-09-02: GitHub keeps only ONE pending run per
  # group, so a 3rd near-simultaneous arrival was cancelled BEFORE any job
  # started — no check-run object is created, so a required context sits at
  # "Expected — waiting for status" with nothing red to see. Concurrency is now
  # bounded only by the account-level ceiling, which QUEUES past it rather than
  # dropping: lateness is visible, an absent check-run is not.
  group: root-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  root-guard:
    runs-on: ubuntu-latest
    # 2 → 10 (2026-08-06). Same wall as docs-sync.yml, and this one was worse:
    # `root-guard` was then a REQUIRED context on main AND ran on `merge_group`, so a
    # blown budget stalled the merge queue itself (today's triggers are in `on:`).
    # `actions/checkout` on this repo
    # normally takes ~20s but intermittently takes MINUTES. Measured on this
    # workflow's own history: 1 of the last 30 PR runs was cut off — and on the
    # MERGE QUEUE ref its checkout ran 2m05s and was killed, which is what kept
    # ejecting #3647 from the queue three times in a row.
    #
    # A blown budget reports as `cancelled`, not `failure`, and a cancelled
    # required check never turns green by itself. `fetch-depth: 1` is already set
    # — the cost is the repo's size, not its history — so headroom is the cure.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check repo root against whitelist
        run: python scripts/root_guard.py --check
