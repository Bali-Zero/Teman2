name: mata-garuda-tests

on:
  push:
    branches: [main]
    paths:
      - "apps/mata-garuda/**"
      - "packages/cell-core/**"
      - "scripts/pytest_guards/**"
      - "scripts/_redact_pii.py"
      - ".github/workflows/mata-garuda-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mata-garuda/**"
      - "packages/cell-core/**"
      - "scripts/pytest_guards/**"
      - "scripts/_redact_pii.py"
      - ".github/workflows/mata-garuda-tests.yml"

concurrency:
  group: mata-garuda-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: mata-garuda pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (full tree, conftest climbs to scripts/pytest_guards)
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            apps/mata-garuda/pyproject.toml
            packages/cell-core/pyproject.toml

      # cell-core is imported by 5 test modules but not declared by mata-garuda.
      # tenacity/httpx/numpy/scikit-learn are the `foundations` extra minus the
      # heavy torch/transformers (tests mock them, imported lazily); pyyaml is
      # needed by scripts/_redact_pii.py, which nb_monitor titles load.
      - name: Install mata-garuda, cell-core and the test-time foundations deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e packages/cell-core \
            -e "apps/mata-garuda[dev]" \
            "httpx>=0.27,<1.0" "tenacity>=8.2,<10.0" \
            "numpy>=1.26,<3.0" "scikit-learn>=1.4,<2.0" pyyaml

      - name: Run the mata-garuda suite (live endpoints off, Redis tests skip)
        working-directory: apps/mata-garuda
        run: python -m pytest -p no:cacheprovider -q --tb=short
