name: cron - drive poll monitor

# The Drive poll itself is owned by the Fly `drive` process group.
# This workflow is a lightweight monitor only; it must never run the poll in
# the HTTP request path.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-drive-poll
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # actions:read is required by the edge gate below to read the previous
    # run's conclusion; this block also drops every other default grant.
    permissions:
      actions: read
    steps:
      - name: GET /api/admin/drive/poll/status
        id: poll
        env:
          API_KEY: ${{ secrets.NUZANTARA_API_KEY }}
        run: |
          set -uo pipefail
          BODY_FILE="$RUNNER_TEMP/body.json"
          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" --max-time 120 \
            -X GET \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            https://nuzantara-rag.fly.dev/api/admin/drive/poll/status || echo "000")
          BODY=$(cat "$BODY_FILE" 2>/dev/null || echo "")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" | head -c 500 >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ]; then
            STATUS=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
            WORKER=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('result',{}).get('status','unknown'))" 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "stale" ] || [ "$STATUS" = "error" ]; then
              echo "::warning::Drive poll worker unhealthy: $BODY"
              exit 1
            fi
            echo "✅ Drive poll worker monitor OK: endpoint=$STATUS worker=$WORKER"
          else
            echo "::warning::Drive poll monitor failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

      # Same disease as cron-fly-watcher (latent here, measured there): a
      # */15 schedule with no runner state re-alerts a persistent failure
      # every run. Page only on the green→red edge; fail-OPEN if the API
      # cannot answer (a gate that cannot verify must not silence).
      - name: Edge gate — page only on green→red transition
        id: edge
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WF_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          # Skip cancelled/skipped runs when reading the state: a budget-kill
          # reads as `cancelled` (W118), never ran the alert step, and must not
          # reset the streak — else every timeout inside a persistent outage
          # re-arms the pager (Kimi K3 refutation, 2026-08-20).
          PREV=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/runs?status=completed&per_page=10" \
            --jq '[.workflow_runs[].conclusion | select(. == "success" or . == "failure")][0] // "unknown"' 2>/dev/null || echo unknown)
          echo "previous completed run: ${PREV:-none}"
          if [ "$PREV" = "failure" ]; then
            echo "send=no" >> "$GITHUB_OUTPUT"
            echo "condition already paged at onset — repeat alert suppressed"
          else
            echo "send=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram alert on failure
        if: failure() && steps.edge.outputs.send == 'yes'
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          HTTP_CODE: ${{ steps.poll.outputs.http_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$BOT" ] || [ -z "$CHAT" ] && { echo "Telegram secrets missing"; exit 0; }
          TEXT="🚨 <b>drive-poll monitor</b> failed
          HTTP: ${HTTP_CODE:-?}
          Run: ${RUN_URL}"
          curl -sS -m 10 -X POST \
            "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" >/dev/null || true
