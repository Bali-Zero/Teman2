# Auto-merge whitelist — Bali Zero / Nuzantara
#
# Auto-enables `gh pr merge --auto --squash` for PRs that match ALL of:
#   1. Branch name matches whitelist pattern (docs/auto-sync-*, dependabot/*, chore/fmt-*)
#   2. Author is dependabot[bot] or github-actions[bot] (or owner @Balizero1987 explicit)
#   3. Diff does NOT touch any CODEOWNERS Tier-1 path
#
# Reference: docs/runbooks/merge-queue-discipline.md §3
# SOTA brief: research/operations/2026-05-24-sota-multi-agent-repo-architecture-synthesis.md
# Anti-injection: this workflow itself is owned by @Balizero1987 in CODEOWNERS,
#                 so a malicious PR cannot modify the whitelist to widen its scope.

name: Auto-merge whitelist

# 2026-06-12 CI fan-out reduction: dropped the `check_suite: [completed]`
# trigger. It fired a job on EVERY check-suite completion of EVERY PR (~20% of
# all runner traffic measured during the merge-storm) only to re-evaluate
# arming. Arming is already covered by pull_request_target opened/synchronize
# for the whitelisted automation branches, and once auto-merge is armed GitHub
# completes it when checks pass — no re-trigger needed. The merge-train now
# owns ongoing PR advancement. Revert = re-add the two lines if dependabot/
# docs-sync PRs stop auto-arming.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: write # required for gh pr merge --auto
  pull-requests: write # enable auto-merge
  checks: read

jobs:
  evaluate:
    name: Evaluate auto-merge eligibility
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo (read-only for diff inspection)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted webhook fields go via env, NEVER interpolated into the script.
          # head.ref / user.login are attacker-controlled and this job runs as
          # pull_request_target with a write token — a branch named `";evil;"` would
          # otherwise inject shell (GHSA workflow-injection class; actionlint [expression]).
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CHECK_SUITE_ID: ${{ github.event.check_suite.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "number=$PR_NUMBER"  >> "$GITHUB_OUTPUT"
            echo "branch=$PR_HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "author=$PR_AUTHOR"   >> "$GITHUB_OUTPUT"
          else
            # check_suite: pick the PR(s) associated with the suite
            PR_NUM="$(gh api "repos/$REPO/check-suites/$CHECK_SUITE_ID/pulls" --jq '.[0].number' 2>/dev/null || echo '')"
            if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
              echo "No PR linked to check_suite $CHECK_SUITE_ID — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BRANCH="$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName --jq '.headRefName')"
            AUTHOR="$(gh pr view "$PR_NUM" --repo "$REPO" --json author --jq '.author.login')"
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          fi

      - name: Check branch whitelist
        id: branch_check
        if: steps.pr.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }} # carries the attacker-controlled ref → env, not inline
        run: |
          if [[ "$BRANCH" =~ ^docs/auto-sync- ]]              || \
             [[ "$BRANCH" =~ ^dependabot/(pip|npm_and_yarn)/ ]] || \
             [[ "$BRANCH" =~ ^chore/fmt- ]]; then
            echo "Branch '$BRANCH' is whitelisted."
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$BRANCH' is NOT in whitelist. Skipping auto-merge."
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check author allowlist
        id: author_check
        if: steps.branch_check.outputs.match == 'true'
        env:
          AUTHOR: ${{ steps.pr.outputs.author }} # attacker-controlled login → env, not inline
        run: |
          case "$AUTHOR" in
            "dependabot[bot]"|"github-actions[bot]"|"Balizero1987")
              echo "Author '$AUTHOR' is allowlisted."
              echo "match=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Author '$AUTHOR' is NOT in allowlist. Skipping auto-merge."
              echo "match=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check diff does not touch protected paths
        id: path_check
        if: steps.author_check.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number '$PR' — failing closed."
            exit 1
          fi
          if ! EXPECTED_FILES="$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files')"; then
            echo "::error::Unable to read PR #$PR metadata — failing closed."
            exit 1
          fi
          if ! [[ "$EXPECTED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid changed_files count '$EXPECTED_FILES' — failing closed."
            exit 1
          fi
          if ! FILES="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')"; then
            echo "::error::Unable to enumerate files for PR #$PR — failing closed."
            exit 1
          fi
          ACTUAL_FILES=0
          if [[ -n "$FILES" ]]; then
            ACTUAL_FILES="$(awk 'END { print NR }' <<< "$FILES")"
          fi
          if [[ "$ACTUAL_FILES" -ne "$EXPECTED_FILES" ]]; then
            echo "::error::PR file enumeration mismatch: expected $EXPECTED_FILES, got $ACTUAL_FILES — failing closed."
            exit 1
          fi
          # Tier-1 CODEOWNERS patterns; the regression test fails on drift.
          PROTECTED=(
            '^\.github/workflows/'
            '^\.github/CODEOWNERS$'
            '^\.github/dependabot\.yml$'
            '^apps/backend-rag/[^/]*\.lock\.txt$'
            '^\.github/actions/'
            '^fly\.toml$'
            '^apps/backend-rag/fly\.toml$'
            '^apps/backend-rag/Dockerfile$'
            '^infra/launchagents/'
            '^docs/infra/launchagents/'
            '^apps/backend-rag/backend/db/migrations_v2/'
            '^apps/backend-rag/backend/db/migration_manager\.py$'
            '^scripts/verify_the_verifiers\.py$'
            '^scripts/verify_the_verifiers_gates\.yaml$'
            '^scripts/tests/test_verify_the_verifiers\.py$'
            '^\.github/verify-the-verifiers\.sha256$'
            '^scripts/token_lint\.py$'
            '^scripts/tests/test_token_lint\.py$'
            '^scripts/tests/conftest\.py$'
            '^scripts/conftest\.py$'
            '^conftest\.py$'
            '^apps/backend-rag/backend/app/auth/'
            '^apps/backend-rag/backend/app/core/config\.py$'
            '^apps/backend-rag/backend/services/auth/'
            '^apps/backend-rag/backend/services/invoicing/'
            '^apps/backend-rag/backend/services/pricing/'
            '^apps/backend-rag/backend/services/billing/'
            '^apps/backend-rag/backend/core/embeddings\.py$'
            '^apps/backend-rag/backend/services/rag/agentic/'
            '^apps/backend-rag/backend/kb/'
            '^apps/backend-rag/backend/services/lead_capture/'
          )
          violation=""
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            for p in "${PROTECTED[@]}"; do
              if [[ "$f" =~ $p ]]; then
                violation+=" $f (matches $p)"
              fi
            done
          done <<< "$FILES"
          if [[ -n "$violation" ]]; then
            echo "BLOCKED: PR touches protected paths:$violation"
            echo "match=false" >> "$GITHUB_OUTPUT"
          else
            echo "All files outside protected paths — proceed."
            echo "match=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.path_check.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid expected head SHA — refusing to arm auto-merge."
            exit 1
          fi
          echo "Enabling auto-merge --squash for PR #$PR"
          gh pr merge "$PR" --repo "$REPO" --auto --squash --delete-branch \
            --match-head-commit "$EXPECTED_HEAD" || {
            echo "::warning::Auto-merge enable failed (possibly already enabled, or required checks not configured yet)."
            exit 0
          }
