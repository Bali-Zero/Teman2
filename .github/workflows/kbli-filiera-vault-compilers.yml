name: kbli-filiera-vault-compilers

# Batch-0 vault-bootstrap compilers for GARUDA-FILIERA
# (research/operations/2026-07-16-kbli-garuda-filiera-workflow.md §4):
# scripts/kbli_filiera/{vault_fetch_pp28,vault_fetch_oss,vault_fetch_bps,
# vault_manifest}.py + vault_mirror_tigris.sh. Pure-stdlib compilers, zero
# network in the test battery (unittest.mock/monkeypatch fixtures only —
# these are the sole sanctioned writers of the raw-evidence vault per
# infra/claude-hooks/data-plane-registry.json, id "kbli-filiera").
# The `paths:` list ALSO carries the canonical dataset and the coverage
# baseline. Without them a data-plane commit could strip provenance from the
# catalogue and this workflow would never run to notice — a gate that cannot see
# the artefact it defends is decoration (W86 / the `paths:` blind spot).
on:
  pull_request:
    paths:
      - "scripts/kbli_filiera/**"
      - "data/source_documents/KBLI_2025_FINAL_CLEAN.json"
      - "data/kbli-filiera/coverage-baseline.json"
      - "apps/mouth/data/perpres-locators.json"
      - ".github/workflows/kbli-filiera-vault-compilers.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/kbli_filiera/**"
      - "data/source_documents/KBLI_2025_FINAL_CLEAN.json"
      - "data/kbli-filiera/coverage-baseline.json"
      - "apps/mouth/data/perpres-locators.json"
      - ".github/workflows/kbli-filiera-vault-compilers.yml"

permissions:
  contents: read

concurrency:
  group: kbli-filiera-vault-compilers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kbli-filiera-vault-compilers:
    name: kbli-filiera-vault-compilers
    runs-on: ubuntu-latest
    # Floor is the CHECKOUT, not the script (scripts/lint_workflow_timeout_floor.py).
    # Was 5; a checkout on the merge-queue ref was measured still running at 4m59s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run vault compiler test battery
        run: |
          set -uo pipefail
          python -m pip install --quiet pytest
          python -m pytest scripts/kbli_filiera/tests/ -v

      # The completion ratchet (kbli-navigator corner §5 F0). One-way: an axis
      # may never lose honest coverage and a bare fact may never appear. It does
      # NOT assert any number is good — the PMA axis is allowed to sit at 1%
      # here; F2 is what moves it. A gate that stayed red until the programme
      # finished would be muted within a week.
      #
      # Exit 4 (cannot verify) is treated as a failure on purpose: in CI the
      # dataset is always present, so unreadable means broken, not offline.
      #
      # The exit code is CAPTURED and re-raised rather than left to an implicit
      # `-e` from the shell wrapper: a trailing `echo` after the command under
      # test makes the step exit with the echo's status on any shell where -e is
      # not in force, and the gate becomes decoration. This repo has been bitten
      # by that exact shape ~20 times (W101, W108).
      - name: KBLI coverage ratchet (no axis may get less honest)
        run: |
          set -uo pipefail
          set +e
          python scripts/kbli_filiera/kbli_coverage_scoreboard.py --check
          RATCHET_RC=$?
          set -e
          echo "ratchet exit: ${RATCHET_RC}"
          exit "${RATCHET_RC}"

      # The whole reason this join was allowed to become a file. `--emit` writes
      # `apps/mouth/data/perpres-locators.json`, which puts a legal citation on
      # 1,559 public pages; without this step it could drift from the vaulted
      # instrument and nobody would see it, because the page renders whatever
      # the file says. Recompute and compare — the artifact is only as
      # trustworthy as the check that it still matches its source.
      #
      # Same captured-exit shape as the ratchet above, for the same reason.
      - name: Perpres citations still match the instrument
        run: |
          set -uo pipefail
          set +e
          python scripts/kbli_filiera/perpres_body_default_relation.py --check-artifact
          LOCATORS_RC=$?
          set -e
          echo "locators exit: ${LOCATORS_RC}"
          exit "${LOCATORS_RC}"
