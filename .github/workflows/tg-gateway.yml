name: tg-gateway

# Anti-regrowth gate for the Telegram notification gateway (2026-07-06):
# - the three gateway selftests (hermetic, no network)
# - the direct-sender lint: a NEW file calling api.telegram.org outside
#   infra/tg-gateway/grandfathered.json fails the PR (family can only shrink)

on:
  pull_request:
    paths:
      - "scripts/tg_notify.py"
      - "scripts/tg_digest_flush.py"
      - "scripts/lint_tg_direct_senders.py"
      - "scripts/tests/test_tg_gateway.py"
      - "infra/tg-gateway/**"
      - "**/*.sh"
      - "**/*.py"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.plist"
  workflow_dispatch: {}

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch base for the monotone check
        run: git fetch origin main --depth=1

      - name: Gateway selftests (hermetic)
        run: |
          python3 scripts/tg_notify.py --selftest
          python3 scripts/tg_digest_flush.py --selftest
          python3 scripts/lint_tg_direct_senders.py --selftest

      - name: Direct-sender lint (anti-regrowth + monotone grandfather)
        run: python3 scripts/lint_tg_direct_senders.py

      - name: Guard pins (pytest)
        run: |
          python3 -m pip -q install pytest
          python3 -m pytest scripts/tests/test_tg_gateway.py -q
