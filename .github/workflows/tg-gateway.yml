name: tg-gateway

# Anti-regrowth gate for the Telegram notification gateway (2026-07-06):
# - the three gateway selftests (hermetic, no network)
# - the direct-sender lint: a NEW file calling api.telegram.org outside
#   infra/tg-gateway/grandfathered.json fails the PR (family can only shrink)
#
# Task #35 fix (2026-07-26): the anti-regrowth lint above and a separate
# pytest suite ("Guard pins") used to live in ONE job (`gateway`). That
# meant the job's single conclusion could not distinguish "someone regrew a
# direct Telegram sender" from "an unrelated import in the pytest suite is
# broken" — measured 2026-07-26 03:30Z: `gateway` red on 5 of 10 open PRs
# (#3181 #3180 #3178 #3176 #3146) purely from a missing `asyncpg` install
# (already fixed on main by #3175, landed 03:03:42Z — those 5 PRs' `gateway`
# checks are stale runs cached from BEFORE the fix landed, not a live
# recurrence: verified locally in a clean venv against current main, 17/17
# pass with the exact CI install+pytest command). The STRUCTURAL problem
# survives the dependency fix on its own: nothing stopped the NEXT unrelated
# pytest breakage from making `gateway`'s verdict unreadable again the same
# way. `gateway` is not a required context today, so this went unnoticed —
# nothing blocked, nobody looked (superscar #2, exists ≠ armed, crossed with
# alert-fatigue: an always-red gate is not a gate).
#
# Fix: split into two independent jobs. `gateway` now carries ONLY the
# anti-regrowth lint + its own hermetic selftests — a regrowth violation is
# the only thing that can turn it red. `guard-pins-pytest` carries the
# broader pytest suite (which imports agent_job.py's full dependency tree —
# httpx/structlog/asyncpg — and can break for reasons that have nothing to
# do with direct Telegram senders) as its own job with its own conclusion.
# Neither job is a required context (unchanged by this fix, per instruction
# — a required check that is permanently red blocks the entire merge queue,
# which is a worse failure mode than an unread one).

on:
  pull_request:
    paths:
      - "scripts/tg_notify.py"
      - "scripts/tg_digest_flush.py"
      - "scripts/lint_tg_direct_senders.py"
      - "scripts/tests/test_tg_gateway.py"
      - "infra/tg-gateway/**"
      # These MUST mirror lint_tg_direct_senders.SCAN_SUFFIXES exactly, and
      # scripts/tests/test_tg_gateway_trigger_symmetry.py fails the build when
      # they drift. A suffix the lint scans but the trigger ignores is a guard
      # that never runs on the only diff that could have violated it — the
      # 2026-07-28 widening found the lint watching 15 suffixes while this list
      # named 6, so a regrown sender in .yml (18 of them), .rb, .zsh, .bash,
      # .cjs, .tsx or .jsx could not even start the job (superscar #2).
      - "**/*.sh"
      - "**/*.py"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.plist"
      - "**/*.rb"
      - "**/*.pl"
      - "**/*.zsh"
      - "**/*.bash"
      - "**/*.yml"
      - "**/*.yaml"
  workflow_dispatch: {}

jobs:
  gateway:
    name: gateway (anti-regrowth lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fetch base for the monotone check
        run: git fetch origin main --depth=1

      - name: Gateway selftests (hermetic)
        run: |
          python3 scripts/tg_notify.py --selftest
          python3 scripts/tg_digest_flush.py --selftest
          python3 scripts/lint_tg_direct_senders.py --selftest
          # Stdlib only, so it belongs here rather than in guard-pins-pytest:
          # it asserts that this workflow's own paths: filter still covers every
          # suffix the lint scans. Without it the two lists drift apart silently
          # and the lint keeps passing on diffs it was never started for.
          python3 scripts/tests/test_tg_gateway_trigger_symmetry.py

      - name: The selftest above must reach the same verdict at every hour
        run: |
          # The step above is only worth reading if its verdict does not depend
          # on when it runs. Measured 2026-08-08: it was GREEN at 19:40 UTC and
          # RED at 03:41 WITA on byte-identical code — six checks on the p0 send
          # path, because the first selftest block set P0_BUDGET=2 without
          # pinning the day window, so at night
          #   effective = max(0, P0_BUDGET - DAY_RESERVE) = max(0, 2 - 5) = 0
          # and the very first p0 overflowed instead of sending. The two blocks
          # after it already pinned the window ("deterministic at any hour CI
          # happens to run"); the discipline just never reached upward.
          #
          # This workflow is path-filtered, so the selftest runs only when the
          # gateway's own files change — at whatever hour that lands. The window
          # in which it was reliably red is Bali night, which is exactly when
          # the cron fleet runs and when a session chasing a missing alert would
          # reach for it. Hence a pin, not a one-line fix: forced-night,
          # forced-day and unforced must all agree.
          bash scripts/tests/test_tg_notify_selftest_is_clock_independent.sh

      - name: tg_notify unit pins (stdlib, no install)
        run: |
          # tg_notify.py imports stdlib only, so its own unit tests belong in
          # this job rather than in `guard-pins-pytest` (which exists to carry
          # the httpx/structlog/asyncpg import chain) — and emphatically not in
          # `scripts/tests/ sweep`, which is continue-on-error and gates
          # nothing. test_tg_notify_env_parse.py shipped in #3660 named by no
          # workflow at all: the guard that cost Mini its voice for a day had
          # no executor that could go red. Superscar #2, in the file that fixed
          # a superscar #2.
          #
          # test_sentinel_condition_key.py belongs here for the same reason and
          # one more: it is about the PRODUCER side of the same rule. The
          # gateway's `key = dedup_key or derived` means a producer's explicit
          # key WINS, so a producer that keys on md5(message) silently disables
          # every guard tested one line above. The two halves of that rule
          # cannot be allowed to drift into different executors.
          python3 -m pip -q install pytest
          python3 -m pytest scripts/tests/test_tg_notify_env_parse.py \
                            scripts/tests/test_tg_notify_identity_ladder.py \
                            scripts/tests/test_sentinel_condition_key.py -q

      - name: Direct-sender lint (anti-regrowth + monotone grandfather)
        run: python3 scripts/lint_tg_direct_senders.py

  guard-pins-pytest:
    name: guard-pins-pytest (gateway integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Guard pins (pytest)
        run: |
          # httpx/structlog: agent_job.py imports both at module level, and
          # test_agent_job_telegram_gateway.py imports agent_job.py — without
          # them the file below would ImportError, not merely "not run" (a
          # loud CI failure, not a silent one, but still worth being explicit
          # about why a Telegram-gateway CI job installs two extra packages).
          # asyncpg: same reason, one module further out. #3147 added
          # test_curiosity_batch_send_telegram_batch_reaches_dry_run_delivery,
          # which imports curiosity_batch.py, which imports asyncpg at module
          # level. #3175 closed that specific gap (2026-07-26). When a NEW
          # test is added here, its import chain has to be added here too —
          # that is now this job's problem alone: a future dependency gap here
          # can no longer mask a regrown direct Telegram sender in `gateway`
          # above, and a `gateway` violation can no longer hide behind this
          # job's own unrelated breakage. Task #35 split this out of `gateway`
          # for exactly that reason (2026-07-26).
          # test_nlm_alarm_gateway.py: stdlib + bash only, no new install line.
          # It is here rather than left to `scripts/tests/ sweep` because that
          # sweep is `continue-on-error: true` and gates nothing — a guard whose
          # only executor cannot go red is the superscar #2 shape it was written
          # to catch. This is Stage 2 of that workflow's own staged plan
          # ("genuinely-passing -> promote to a real per-file workflow entry"),
          # applied to the two files this PR authored, not to the other 173.
          python3 -m pip -q install pytest httpx structlog asyncpg
          python3 -m pytest scripts/tests/test_tg_gateway.py scripts/tests/test_agent_job_telegram_gateway.py scripts/tests/test_nlm_alarm_gateway.py -q
