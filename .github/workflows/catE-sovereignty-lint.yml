name: catE-sovereignty-lint

# Category-E guardian (cost / sovranità / Law-5 publish gate) — born from the
# 2026-06-11 guardian-of-guardians audit, domande-per-fable5 §E (#40 #43 #44).
#
# Three "exists-but-not-armed" (W64) gaps had a lint/antibody but NO CI consumer:
#   #40  paid-Anthropic ban is re-defended by hand in ~9 scripts (each strips
#        the vendor credential variable) but NOTHING fails the build if a new
#        script instantiates the PAID path — the vendor constructor taking a
#        per-token credential keyword argument — or sets that same variable to
#        a value.  CLAUDE.md §7: "se una regola è violabile, scrivi un hook" —
#        this is that hook, at CI level.  The two shapes are written out once,
#        in the regex literals below, and nowhere in prose (step #40d).
#   #43  the Law-5 autonomous-publish lint (scripts/lint/wr3_lint_autonomous_publish.py,
#        bans ig.publish / tiktok.publish / yt.upload from any wr3_*.py) EXISTED
#        but was wired into ZERO workflows (symbiosis-lint.yml only doc-checks).
#        So "mai auto-publish IG" was protected by "nobody wired the API yet",
#        not by code. This runs it BLOCKING.
#   #44  apps/*/.env world-readable (0644) is a recurring P0 class (5+ in 5
#        weeks, fixed by hand each time). A perm check closes the loop the
#        cicatrici re-open manually.
#
# Pure-stdlib / grep, full-repo scan in seconds → no sentinel needed, which is
# what makes running unconditionally affordable. This line read "no paths
# filter" from 2026-06-12 to 2026-09-21 while a filter sat thirty lines below
# it; as of 2026-09-21 the sentence is true again, and the test named under
# `on:` is what keeps it true.
# Triggers pull_request, merge_group AND push-to-main (W41/W42: pull_request-only
# gives false safety under L2 autonomous direct-push; merge_group is explained
# under `on:`).
#
# STILL NON-REQUIRED as this file ships, and now ARMABLE — the two are
# different states and were conflated for months. Adding this context to main's
# branch protection is a control-plane act and is deliberately NOT done here:
# what this file can do is stop being the reason the flip is unsafe. Until the
# flip, a red here blocks nothing, which is the whole of the debt.

# NO PATHS FILTER, and that is the arming decision rather than an omission.
# One was added 2026-06-12 to reduce fan-out and removed 2026-09-21 because it
# had stopped buying enough against what it cost: two Gear-3 conditions
# (#6968 conditions 1 and 2, cured in #7000) and one live hole — a PR whose
# changed set was entirely .jsx .mjs .yaml .yml started nothing and its prose
# landed unjudged. The measured cost is recorded in this change's evidence
# pack.
#
# The deeper reason is that a path-filtered check CANNOT BE REQUIRED without a
# skip-to-success sentinel: a PR matching no path never reports the context at
# all and pends forever (W69 BUCO #1). So the filter was the thing standing
# between this guard and branch protection. Removing it is cheaper and more
# honest than maintaining a sentinel whose only job is to lie convincingly
# about a run that did not happen.
#
# scripts/tests/test_cate_trigger_parity.py now guards the ABSENCE: it reds if
# a paths filter comes back, because the next fan-out reduction will look just
# as reasonable as the last one did.
on:
  pull_request:
  # merge_group because a REQUIRED context must be reportable by a merge-queue
  # run, or every queue entry waits for it until the 90-minute timeout
  # (check_required_workflow_conformance.py rule 2, and the deadlock
  # test_advisory_workflows_no_merge_group.py exists for). Added in the same
  # diff that makes this workflow armable, BEFORE the flip rather than after:
  # a queue run has no PR base, so both diff-scoped steps below fall through
  # to their no-base branch — the entity judgment skips (a PR-time-only
  # signal, not a verdict), and the blocking prose step scans the whole tree
  # instead. That scan inherits lint_ban_prose.py's own handling of unreadable
  # files: it WARNS and still exits 0 on a file it cannot read, as long as at
  # least one in-scope file elsewhere in the tree scanned clean — which a
  # whole-tree scan always has. Not "fails safe, never open": tracked as its
  # own row in .claude/skills/modus/PENDING-ARMS.md, not cured by this diff.
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catE-sovereignty-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catE-sovereignty-lint:
    name: catE-sovereignty-lint
    runs-on: ubuntu-latest
    # Floor is the CHECKOUT, not the script (scripts/lint_workflow_timeout_floor.py).
    # Was 5; 11% of 645 sampled checkouts here exceed 60s, worst observed 599s.
    # Raised 10 -> 20 when this workflow became a REQUIRED-context candidate: a
    # required check has no headroom, since its timeout blocks an innocent PR
    # rather than merely re-running a flaky job. 10 left only ~1s of margin
    # over the recorded 599s worst-case checkout, and on the no-base
    # (merge_group/push) path the steps after the checkout scan the whole tree
    # rather than the changed files, so the script half of the job grows too.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # three-dot changed-file enumeration needs the merge base
          fetch-depth: 0
          filter: blob:none

      # The local pre-commit gate's own corpus (scripts/check_ban_predicates.py
      # runs from .husky/pre-commit). Its first tests shell-unquote THIS file's
      # grep arguments and compare them to the script's transcriptions, so a
      # regex edited here without the script fails on the next line, not in a
      # commit six weeks from now that the local gate quietly waved through.
      - name: ban-predicates — transcription parity + guilt/innocence
        # This job is otherwise pure shell on the runner's stock python, which
        # has no pytest — the first run of this step said so (`No module named
        # pytest`, run 35517016619). Installed here rather than by adding
        # setup-python: no toolchain, no cache to go stale. pyyaml is installed
        # for the step below, not for this one: the trigger-parity suite reads
        # this file's own header, and this is the only step that installs.
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest scripts/tests/test_ban_predicates.py -q

      # The corpora of the guards THIS workflow runs. They existed and
      # nothing executed them: `scripts/test_lint_paid_llm_entity.py` is named
      # by no workflow at all, and `scripts/tests/test_lint_ban_prose.py` is
      # reached only by scripts-tests-sweep.yml — which is `schedule:`-only,
      # `continue-on-error: true` and required by no branch protection, i.e. a
      # report and not a gate. A guard whose own corpus never runs is cicatrix
      # #2 wearing the costume of #3: it proves guilt and innocence to nobody.
      # Named here rather than swept, so a deleted file fails instead of
      # silently collecting zero (the sweep's own docstring makes that point
      # about `.sh` files).
      #
      # The last two joined on 2026-09-21, one list later and by the same
      # reading: on the commit that shipped this step, `git grep -l
      # test_typesafe_client_pin -- .github/ scripts/` returned nothing, and
      # the trigger-parity suite is new in the PR that adds it here — the file
      # that proves the filter would have been the next orphan of this list.
      - name: the guards' own corpora — the suites no gating workflow ran
        run: |
          python3 -m pytest -q \
            scripts/test_lint_paid_llm_entity.py \
            scripts/tests/test_lint_ban_prose.py \
            scripts/tests/test_vendor_authorization_fence.py \
            scripts/tests/test_typesafe_client_pin.py \
            scripts/tests/test_cate_trigger_parity.py

      # Runs BEFORE #40 so a broken budget step fails loud here rather than
      # quietly degrading the scan it exists to guard. The corpus extracts #40's
      # own shell between its CATE40_BUDGET markers and exercises it against
      # synthetic trees — no network, nothing outside a temp dir.
      - name: catE #40 budget — guilt + innocence corpus
        run: bash scripts/tests/test_cate_paid_budget.sh

      # ── #40 — ban the PAID Anthropic endpoint (MAX-plan duplication) ────────
      # OK paths (MUST NOT trip): Anthropic(auth_token=...) / ANTHROPIC_AUTH_TOKEN
      #   (OAuth Bearer, the sanctioned SDK path), and unset/pop ANTHROPIC_API_KEY
      #   (defense-in-depth strips). We ban ONLY the paid instantiation/assignment.
      #
      # BASELINE-AWARE (W71 antibody pattern): this step fails when the live
      # count EXCEEDS the budget declared in catE-paid-anthropic-baseline.txt.
      # That budget is now ZERO, so any hit at all is red.
      #
      # It was 3 until 2026-09-20, and the drain is the point of this comment.
      # A budget is a COUNT, not a set of identities: the grep cannot tell which
      # hit belongs to which baseline line. Measured that day: the three sites
      # the file named had all been remediated and matched nothing, while the
      # live count of 2 was two DOCSTRINGS quoting the banned spelling. Two
      # quotes holding three phantom slots left room for one genuinely new paid
      # call site to land green (simulated: count 3, baseline 3, 3 > 3 false).
      # Both docstrings now describe the shape instead of spelling it and the
      # phantom lines are gone, which is what lets the budget be 0 — and at 0
      # there is no arithmetic left to drift.
      #
      # The count is taken with awk, NOT `grep -c ... || echo 0`. On an empty
      # budget grep -c PRINTS "0" and EXITS 1, so the `|| echo 0` fallback
      # appends a second line: BASELINE becomes the two-line string "0\n0",
      # `[ -gt ]` dies with "integer expression expected", and because this
      # `run:` block sets -uo pipefail but not -e, the failed test reads as
      # FALSE — the step then prints OK with any number of live hits. Measured
      # with COUNT=9 before the fix. Draining a budget must not disarm its
      # guard (cicatrix #2, esiste != armato), so the count is now a single
      # integer from a command that always exits 0, and is range-checked below.
      - name: Ban NEW paid Anthropic constructor (vs committed baseline)
        run: |
          # >>> CATE40_BUDGET_BEGIN (extracted verbatim, dedented, by
          # scripts/tests/test_cate_paid_budget.sh — the markers are
          # load-bearing: without them that test silently tests nothing)
          set -uo pipefail
          BASELINE_FILE=.github/workflows/catE-paid-anthropic-baseline.txt
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::error::$BASELINE_FILE is missing — refusing to guess the budget."
            exit 1
          fi
          # uncommented, non-blank lines in the baseline = the budget. awk always
          # exits 0 and prints exactly one integer, including zero (see the
          # comment above this step for the `grep -c || echo 0` trap it replaces).
          BASELINE=$(awk '!/^[[:space:]]*(#|$)/ {n++} END {print n+0}' "$BASELINE_FILE")
          case "$BASELINE" in
            ''|*[!0-9]*)
              echo "::error::budget did not read as a single integer (got: $BASELINE)."
              exit 1
              ;;
          esac
          # the vendor constructor, sync or async, taking a per-token credential
          # keyword argument (the paid path); exclude vendored/test code
          HITS=$(grep -rnE 'Anthropic\(\s*api_key' --include='*.py' . \
            | grep -vE '\.venv/|node_modules/|/\.git/|tests/|test_' || true)
          COUNT=$(printf '%s' "$HITS" | grep -c . || true)
          echo "baseline=$BASELINE  live_count=$COUNT"
          echo "$HITS"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::NEW paid Anthropic constructor introduced ($COUNT > baseline $BASELINE). Use claude CLI (CLAUDE_CODE_OAUTH_TOKEN) or Anthropic(auth_token=...). If a known site moved, update catE-paid-anthropic-baseline.txt."
            exit 1
          fi
          # No ::warning:: branch for a surviving tolerated site: at budget 0 any
          # hit already exited above, so that line could only ever be dead code.
          echo "OK: no paid-constructor hit (budget $BASELINE, live $COUNT)."
          # <<< CATE40_BUDGET_END

      # ── #40b — ban ASSIGNING a value into ANTHROPIC_API_KEY (export/setenv) ──
      # Allowed: unset / del / .pop / =""/=None (these STRIP, defense-in-depth).
      # Banned: a literal export/setenv that SETS the key to a real value.
      #
      # `\bsetenv\(` and not `setenv\(`: without the word boundary the second
      # alternative matched `os.unsetenv("ANTHROPIC_API_KEY")` — the very STRIP
      # the line above calls allowed — because "unsetenv" ends in "setenv".
      # Found 2026-09-20 by the codex-gpt-5.6-sol council seat, which ran the
      # predicate against that literal rather than reading it. Latent in CI (no
      # such call exists on main today) but immediate for the pre-commit gate
      # that transcribes this regex, and a gate that refuses a defensive strip
      # is one people learn to switch off. `\b` is supported by GNU grep -E and
      # by the BSD grep on the fleet's macs — verified on both before landing.
      - name: Ban ANTHROPIC_API_KEY=<value> assignment
        run: |
          set -uo pipefail
          HITS=$(grep -rnE 'export[[:space:]]+ANTHROPIC_API_KEY=[^"'"'"'[:space:]]|\bsetenv\([[:space:]]*["'"'"']ANTHROPIC_API_KEY' \
            --include='*.py' --include='*.sh' . \
            | grep -vE '\.venv/|node_modules/|/\.git/|tests/|test_|examples/|vendor/' || true)
          if [ -n "$HITS" ]; then
            echo "::error::ANTHROPIC_API_KEY assigned a value (paid path, CLAUDE.md §5):"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no ANTHROPIC_API_KEY value assignment outside vendor/examples."

      # ── #40c — the same ban, judged as an ENTITY (ADVISORY) ────────────────
      # #40 and #40b above judge SPELLING: the canonical constructor and the
      # canonical export. CLAUDE.md §3 says in as many words that this is only a
      # first pass — "an alias, a renamed env var, a wrapper library or a
      # Bedrock/Vertex route reaches the same endpoint without either literal,
      # and is equally banned". This step asks a System One model (Jev) whether
      # the CHANGED files reach that endpoint, whatever the spelling.
      #
      # COMPOSITION IS OR, NEVER AND (cicatrix #3, and the point of the lane):
      # the two greps above keep their verdict untouched; this can only ADD a
      # finding. A model that is wrong, hallucinating, steered by an authored
      # diff, or simply unreachable therefore costs a false alarm at worst — it
      # can never clear something the greps condemn. `lint_paid_llm_entity.py`
      # returns "no opinion" (not "no violation") when the service is silent.
      #
      # ADVISORY until the bench is re-run by someone other than the lane that
      # wrote it (see scripts/tests/fixtures/paid_llm_entity/bench_cases.json,
      # whose _doc says so plainly). --advisory always exits 0; dropping that
      # flag is the whole of "arming" this, and is a deliberate later PR.
      #
      # No key configured = the step still runs, still applies the transcribed
      # grep predicate, and says so. It never fails for lack of a credential.
      - name: Paid-endpoint ban judged as an entity (advisory)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "no PR base (push or merge-queue build) — entity judgment is a PR-time signal, skipped."
            exit 0
          fi
          CHANGED="$(bash scripts/ci/hotzone_changed_files.sh "$BASE_SHA" "$HEAD_SHA" "$PR_NUMBER")"
          ENUM_RC=$?
          if [ "$ENUM_RC" -ne 0 ]; then
            echo "::error::could not determine changed files (rc=$ENUM_RC)"
            exit 1
          fi
          # shellcheck disable=SC2086
          # -d '\n' for the same reason the prose step stopped using bare xargs:
          # a path with a space would otherwise be split into two paths that do
          # not exist. This lint has no --files-from, so the delimiter is the fix.
          printf '%s\n' "$CHANGED" | xargs -r -d '\n' python3 scripts/lint_paid_llm_entity.py --advisory

      # ── #40d — prose about a banned shape must not contain it (BLOCKING) ────
      # The scar this step closes is not a bug in #40/#40b/#40c: it is what
      # happened while they were being DOCUMENTED. PR #6935 suspended after four
      # reds, every one of them a comment or a docstring that wrote a forbidden
      # shape out in order to explain it. The asymmetry is the trap — a pattern
      # does not match itself, so the code hunting a shape is always clean while
      # the sentence quoting that code is not, and no scanner in this repo tries
      # to tell description from use (nor should it: cicatrix #3).
      #
      # BLOCKING from the first day, unlike #40c, because nothing here is a
      # judgment call: the predicates are literal, the guilt+innocence corpus is
      # in scripts/tests/test_lint_ban_prose.py, and the 11 files that already
      # carried such prose are frozen in infra/ban-prose/grandfathered.json —
      # so it can only red on prose that is not already pardoned — which is not
      # the same as prose the PR authored: the predicate reads the whole file,
      # so touching an old offender reds on its existing lines too. The tree
      # scans clean today, which is why that is a statement and not an incident.
      # --base-ref makes
      # the pardon list one-way: it may shrink, never grow inside its own diff
      # — and it may shrink only TOGETHER with the cure of the file it releases,
      # because the push-time scan reads the whole tree and a released file
      # still carrying its prose reds main (a council seat counted 28 live
      # violations behind the 11 pardons on 2026-09-21 — a dated observation,
      # not a maintained figure: unlike the 11, nothing re-measures it, so read
      # it as history. A pardon is debt, not absolution).
      - name: Prose must not spell a banned shape (blocking)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            # A direct push to main has no PR base, and that is EXACTLY the case
            # this workflow's own header names as the threat (W41/W42, L2
            # autonomous direct-push). An earlier draft exited 0 here, which made
            # a blocking step a no-op on the one event it most needed to run —
            # found by the refuting seat. So a push scans the whole tree instead.
            # --files-from, NOT xargs: the tree is ~10.5k paths and xargs would
            # split it across several processes, leaving the blind-scan guard
            # able to see only one slice at a time. One list, one process, one
            # verdict (refuting seat, round 2, objection 5).
            echo "no PR base (push or merge-queue build) — scanning the whole tree."
            git ls-files -- '*.py' '*.sh' '*.yml' '*.yaml' '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' \
              | grep -vE '^(\.venv|node_modules|vendor)/' > /tmp/ban-prose-tree.txt
            python3 scripts/lint/lint_ban_prose.py --files-from /tmp/ban-prose-tree.txt
            exit $?
          fi
          CHANGED="$(bash scripts/ci/hotzone_changed_files.sh "$BASE_SHA" "$HEAD_SHA" "$PR_NUMBER")"
          ENUM_RC=$?
          if [ "$ENUM_RC" -ne 0 ]; then
            echo "::error::could not determine changed files (rc=$ENUM_RC)"
            exit 1
          fi
          # Two invocations on purpose: an empty changed set makes `xargs -r`
          # skip its command entirely, which would skip the pardon-growth check
          # with it. That check must run whatever the diff contains.
          python3 scripts/lint/lint_ban_prose.py --base-ref "$BASE_SHA"
          # --files-from, not xargs: xargs splits on WHITESPACE, so a path with
          # a space arrives as two paths that are not on disk and the step exits
          # 0 having scanned nothing — `0 file(s) scanned (1 out of scope, 1 not
          # on disk)` while the same file scanned directly exits 1 (refuting
          # seat, finding 9). One path per line survives a space.
          printf '%s\n' "$CHANGED" > "$RUNNER_TEMP/ban-prose-changed.txt"
          python3 scripts/lint/lint_ban_prose.py --files-from "$RUNNER_TEMP/ban-prose-changed.txt"

      # ── #43 — Law-5 (Zero ultima istanza): no autonomous IG/TT/YT publish ───
      # Fail-closed on absence, not warn-and-skip: a required guard must not go
      # green because its own tool was deleted (cicatrix #2, esiste != armato)
      # — a PR that removed the linter would otherwise pass the step whose one
      # job is to block exactly that class of change.
      - name: Law-5 autonomous-publish lint (blocking)
        run: |
          set -uo pipefail
          if [ -f scripts/lint/wr3_lint_autonomous_publish.py ]; then
            python3 scripts/lint/wr3_lint_autonomous_publish.py
          else
            echo "::error::scripts/lint/wr3_lint_autonomous_publish.py is absent — a required guard must not pass when its own tool is gone."
            exit 1
          fi

      # ── #44 — apps/*/.env must NOT be group/world-readable (0644 P0 class) ──
      # Recurring antibody: chmod 600 by hand after each incident. This gates it.
      - name: Ban world-readable apps/*/.env (perm > 0600)
        run: |
          set -uo pipefail
          BAD=$(find apps -maxdepth 2 -name '.env' -perm /044 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "::error::apps/*/.env with group/world-read bits (recurring P0 — chmod 600):"
            echo "$BAD"
            exit 1
          fi
          echo "OK: no group/world-readable apps/*/.env."
