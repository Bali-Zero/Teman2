# Category-B observability lint — LaunchAgent daemon|cron classification + W67 guard
# ---------------------------------------------------------------------------------
# Fable-5 Cat-B audit (question #16, 2026-06-11). NOT a required check — do NOT add
# it to branch protection. Its job is to make a STRUCTURAL drift LOUD on every PR
# that touches a committed plist, and to HARD-FAIL only on the one genuinely
# dangerous regression class (the W67 crash-loop signature), not on the whole
# ambiguous backlog.
#
# Re-grounded facts this lint encodes (verified on the Pro 2026-06-11):
#   - 52 LIVE plist in ~/Library/LaunchAgents carry BOTH KeepAlive AND a schedule
#     (StartInterval/StartCalendarInterval) -> daemon-vs-cron is structurally
#     ambiguous. CI cannot see ~/Library/LaunchAgents (the live home), so it lints
#     the COMMITTED templates under infra/launchagents + infra/launchd instead
#     (93 committed, 45 ambiguous, 7 bare KeepAlive=true, 0 W67-class on 2026-06-11).
#   - W67 (2026-06-07): `exec <one-shot>` (a script that spawns children then
#     returns 0) under `KeepAlive=true` made launchd SIGTERM-kill the healthy
#     children every ~22s. The crash-loop SIGNATURE is: bare boolean
#     `KeepAlive=true` AND a schedule key on the same plist (a cron job wearing a
#     daemon's restart flag), OR a KeepAlive=true plist whose program is a known
#     one-shot. A `KeepAlive=<dict>` (e.g. {SuccessfulExit:false}) is a LEGITIMATE
#     crash-restart daemon and is NOT flagged.
#
# Design (mirrors catF/catE/catA): informational NOTICE for the ambiguous backlog,
# HARD-FAIL only on a NEW W67-class plist (regression gate). The live-home 52
# cannot be closed from CI — that needs the daemon|cron sweep ON THE PRO (proposed
# in research/operations/2026-06-11-domande-per-fable5.md #16).

name: "catB: LaunchAgent daemon|cron XOR + W67 crash-loop guard"

on:
  pull_request:
    paths:
      - "infra/launchagents/**.plist"
      - "infra/launchd/**.plist"
      - ".github/workflows/catB-daemon-cron-xor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daemon-cron-classification:
    # Ported off macos-latest to ubuntu-latest (Day-1 CI honesty pass,
    # 2026-07-20): the only macOS-specific piece was shelling out to
    # /usr/libexec/PlistBuddy to read 3 keys out of an Apple plist — a format
    # Python's stdlib `plistlib` parses natively, no macOS dependency needed.
    # scripts/lint_plist_daemon_cron_xor.py replicates the classification
    # EXACTLY (same job id, same step names, same messages) — verified
    # side-by-side against the real PlistBuddy output locally on macOS before
    # this port shipped: identical counts (128 total / 51 ambiguous / 0 W67)
    # AND an identical (byte-for-byte, diffed) ambiguous-plist filename set.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Live-home blind-spot NOTICE (informational, never fails)
        run: |
          echo "::warning title=LaunchAgent live-home blind-spot::The 52 ambiguous (KeepAlive+schedule) plist live in ~/Library/LaunchAgents on the Pro, which CI cannot read. This lint only sees the COMMITTED templates under infra/launchagents + infra/launchd. The real daemon|cron sweep belongs ON THE PRO (Cat-B #16)."

      - name: Classify each committed plist daemon|cron + W67 crash-loop hard-fail
        run: python3 scripts/lint_plist_daemon_cron_xor.py
