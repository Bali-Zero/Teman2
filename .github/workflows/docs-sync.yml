name: Docs Sync Check

on:
  pull_request:
    paths:
      - "apps/backend-rag/backend/app/setup/router_registration.py"
      - "apps/backend-rag/backend/services/**"
      - "apps/backend-rag/backend/tests/**"
      - "apps/backend-rag/backend/channels/**"
      - "apps/*/README.md"
      - "package.json"
      - "scripts/docs_sync.py"
      - "scripts/tests/test_docs_sync_atlas.py"
      - "scripts/ci/docs_sync_gate.sh"
      - "scripts/tests/test_docs_sync_gate_failclosed.sh"
      - "scripts/automation_catalog.json"
      - "README.md"
      - "INDEX.md"
      - "docs/AI_ONBOARDING.md"
      - "docs/AUTOMATIONS_REFERENCE.md"
      - "docs/runbooks/**"
      - "infra/workflows/**"
      - "infra/launchagents/**"
      - ".claude/skills/**"
      - ".github/workflows/docs-sync.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend-rag/backend/app/setup/router_registration.py"
      - "apps/backend-rag/backend/services/**"
      - "apps/backend-rag/backend/tests/**"
      - "apps/backend-rag/backend/channels/**"
      - "apps/*/README.md"
      - "package.json"
      - "scripts/docs_sync.py"
      - "scripts/tests/test_docs_sync_atlas.py"
      - "scripts/ci/docs_sync_gate.sh"
      - "scripts/tests/test_docs_sync_gate_failclosed.sh"
      - "scripts/automation_catalog.json"
      - "README.md"
      - "INDEX.md"
      - "docs/AI_ONBOARDING.md"
      - "docs/AUTOMATIONS_REFERENCE.md"
      - "docs/runbooks/**"
      - "infra/workflows/**"
      - "infra/launchagents/**"
      - ".claude/skills/**"
      - ".github/workflows/docs-sync.yml"

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs-sync:
    runs-on: ubuntu-latest
    # 2 → 10 (2026-08-06). The BUDGET WAS SIZED BY THE WORK, NOT BY GETTING THE
    # WORK THERE. `docs_sync.py` takes seconds; `actions/checkout` on this repo
    # normally takes ~20s but intermittently takes ~2 MINUTES, and the whole job
    # had 2. Measured on the three runs it killed (31035447775, 31033448943,
    # 31010616378 — one of them on `main`): checkout ran 1m58s-2m01s and was cut
    # off, so the docs-sync step NEVER RAN in any of them.
    #
    # A blown budget reports as `cancelled`, not `failure`, and a cancelled
    # required check never turns green by itself — the PR is hard-blocked with
    # nothing red to fix. Do not tune this back down toward the runtime of the
    # script: the floor is the checkout, and it is not the script's floor.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The gate proves itself before it judges anyone (the hot-zone gate does
      # the same). Cheap, and it is what makes the fail-closed behaviour below
      # more than an assertion in a comment.
      - name: Gate self-test (guilt + innocence)
        run: bash scripts/tests/test_docs_sync_gate_failclosed.sh

      - name: Check docs are in sync
        run: bash scripts/ci/docs_sync_gate.sh check

      - name: Run docs_sync unit tests
        run: |
          python -m pip install --quiet pytest
          bash scripts/ci/docs_sync_gate.sh test
