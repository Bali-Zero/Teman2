name: Docs Sync Check

on:
  pull_request:
    paths:
      - "apps/backend-rag/backend/app/setup/router_registration.py"
      - "apps/backend-rag/backend/services/**"
      - "apps/backend-rag/backend/tests/**"
      - "apps/backend-rag/backend/channels/**"
      - "apps/*/README.md"
      - "package.json"
      - "scripts/docs_sync.py"
      - "scripts/tests/test_docs_sync_atlas.py"
      - "scripts/automation_catalog.json"
      - "README.md"
      - "INDEX.md"
      - "docs/AI_ONBOARDING.md"
      - "docs/AUTOMATIONS_REFERENCE.md"
      - "docs/runbooks/**"
      - "infra/workflows/**"
      - "infra/launchagents/**"
      - ".claude/skills/**"
      - ".github/workflows/docs-sync.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend-rag/backend/app/setup/router_registration.py"
      - "apps/backend-rag/backend/services/**"
      - "apps/backend-rag/backend/tests/**"
      - "apps/backend-rag/backend/channels/**"
      - "apps/*/README.md"
      - "package.json"
      - "scripts/docs_sync.py"
      - "scripts/tests/test_docs_sync_atlas.py"
      - "scripts/automation_catalog.json"
      - "README.md"
      - "INDEX.md"
      - "docs/AI_ONBOARDING.md"
      - "docs/AUTOMATIONS_REFERENCE.md"
      - "docs/runbooks/**"
      - "infra/workflows/**"
      - "infra/launchagents/**"
      - ".claude/skills/**"
      - ".github/workflows/docs-sync.yml"

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check docs are in sync
        run: |
          if [ ! -f scripts/docs_sync.py ]; then
            echo "scripts/docs_sync.py is absent — skipping docs-sync check."
            echo "Restore the script or remove this workflow to re-enable the gate."
            exit 0
          fi
          python scripts/docs_sync.py --check

      - name: Run docs_sync unit tests
        run: |
          if [ ! -f scripts/tests/test_docs_sync_atlas.py ]; then
            echo "no docs_sync tests present — skipping."
            exit 0
          fi
          python -m pip install --quiet pytest
          python -m pytest scripts/tests/test_docs_sync_atlas.py -q
