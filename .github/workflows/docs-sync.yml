name: Docs Sync Check

# Sentinel: judges only the merge-base delta. On a PR it starts only when the PR touches
# the docs-sync surface (the `on:` paths below, equal to the step's regex).
# Volatile repository counts are never compared with tracked markdown.
on:
  # Non-required lint: pull_request starts a run only when the PR touches this job's inputs
  # (same set as the "Enumerate merge-base delta" step below). No merge_group:
  # scripts/ci/lint_trigger_symmetry.py forbids it beside pull_request.paths. A required
  # context needs pull_request unfiltered again (check_required_workflow_conformance.py).
  pull_request:
    paths:
      - "scripts/docs_sync.py"
      - "scripts/ci/docs_sync_gate.sh"
      - "scripts/tests/test_docs_sync_atlas.py"
      - "scripts/tests/test_docs_sync_gate_failclosed.sh"
      - "README.md"
      - "INDEX.md"
      - "docs/AI_ONBOARDING.md"
      - "docs/runbooks/README.md"
      - "docs/DOCS_INVENTORY.md"
      - ".github/workflows/docs-sync.yml"
      # pytest loads these implicitly for scripts/tests/ (its conftest and package marker).
      - "scripts/tests/conftest.py"
      - "scripts/tests/__init__.py"
  push:
    branches: [main]

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Enumerate merge-base delta
        id: relevant
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.event.after || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          CHANGED_FILE_LIST: ${{ runner.temp }}/docsync-changed.txt
        run: |
          set -uo pipefail
          if [ ! -f scripts/ci/hotzone_changed_files.sh ]; then
            echo "::error::changed-file enumerator missing"
            exit 1
          fi
          CHANGED="$(bash scripts/ci/hotzone_changed_files.sh "$BASE_SHA" "$HEAD_SHA" "$PR_NUMBER")"
          ENUM_RC=$?
          if [ "$ENUM_RC" -ne 0 ]; then
            echo "::error::could not determine changed files (rc=$ENUM_RC)"
            exit 1
          fi
          printf '%s\n' "$CHANGED" > "$CHANGED_FILE_LIST"
          RELEVANT=false
          if printf '%s\n' "$CHANGED" | grep -qE \
            '^scripts/docs_sync\.py$|^scripts/ci/docs_sync_gate\.sh$|^scripts/tests/test_docs_sync_(atlas\.py|gate_failclosed\.sh)$|^README\.md$|^INDEX\.md$|^docs/AI_ONBOARDING\.md$|^docs/runbooks/README\.md$|^docs/DOCS_INVENTORY\.md$|^\.github/workflows/docs-sync\.yml$'; then
            RELEVANT=true
          fi
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          echo "::notice::docs-sync relevant=$RELEVANT"

      - uses: actions/setup-python@v7
        if: steps.relevant.outputs.relevant == 'true'
        with:
          python-version: "3.11"

      - name: Gate self-test (guilt + innocence)
        if: steps.relevant.outputs.relevant == 'true'
        run: bash scripts/tests/test_docs_sync_gate_failclosed.sh

      - name: Generator correctness
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          python -m pip install --quiet pytest
          bash scripts/ci/docs_sync_gate.sh test

      - name: No protected hand edits in this delta
        if: steps.relevant.outputs.relevant == 'true'
        env:
          DOCSYNC_CHANGED_FILES_FILE: ${{ runner.temp }}/docsync-changed.txt
        run: bash scripts/ci/docs_sync_gate.sh check "$DOCSYNC_CHANGED_FILES_FILE"

      - name: Innocent delta sentinel
        if: steps.relevant.outputs.relevant != 'true'
        run: echo "::notice::no protected docs-sync surface changed; sentinel success"
