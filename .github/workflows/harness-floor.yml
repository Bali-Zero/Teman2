name: Harness floor recompute

# PR-3 of the fleet-order program (research/operations/2026-08-10-fleet-order-spec.md §4/§7;
# research/operations/2026-08-09-harness-v2-teman2.md §1/§6). Redesigned 2026-08-21 — see the
# REDESIGNED note further down for the full rationale; this opening paragraph is kept current
# with that redesign, not the original 2026-08-10 draft.
#
# TWO responsibilities live in one job because they share one contract: `harness/fable-gate` must
# be a SAFE required status check. GitHub branch protection has no per-label required-check
# scoping — a status only ever published manually (by scripts/harness_fable_gate.py, run by the
# gate session) would leave that context "Expected — Waiting for status" FOREVER on every ordinary
# PR if it were simply added to required_status_checks, AND (separately) never carries over to the
# merge queue's synthetic test-merge SHA at all (see (a) below). So THIS JOB — not a status it
# posts — is the thing branch protection requires: for any PR that is not declaring Gear-3 (no
# evidence/brief.yml, or a brief declaring gear < 3), the job itself concludes success — the same
# pattern "Hot-zone enforcement" already uses (unconditionally required, internally a no-op for
# PRs it does not apply to). Only on a Gear-3 brief does this job's own conclusion depend on
# READING (never writing) whether the gate session already posted a real verdict.
#
# Floor recompute (harness-v2 §1 "il modello può solo alzare la classe, mai abbassarla sotto il
# floor"): the deterministic floor is computed ONCE, unconditionally (brief or not — adversarial-
# review finding 2026-08-10: the first cut of this workflow only computed the floor when a brief was
# present, so a hot-zone diff with NO evidence/brief.yml sailed through on the "not applicable"
# default-success path — exactly the downgrade-below-floor case rule 6 exists to catch), via
# scripts/evidence_pack_lint.py's compute_floor() through --print-floor (one source of truth, not a
# second copy of the pattern list baked into this YAML; see that script's own docstring for the
# declared, unavoidable duplication against hot-zone-pr-gate.yml's bash case-block). A hot-zone diff
# (floor 3) with no brief FAILS this job outright — it does not default to success.
#
# When a brief IS present, its declared `gear` must be >= that floor.
#
# On a Gear-3 brief, this workflow ALSO validates evidence/pack.yml itself (adversarial-review
# finding 2026-08-10: the first cut only checked the brief's declared `gear` field and never ran
# evidence_pack_lint.py against the actual pack — a malformed/incomplete Evidence Pack could sit
# there indefinitely while `harness/fable-gate` stayed merely "pending", never caught). A pack that
# fails evidence_pack_lint.py FAILS this job — the real gate session should never be evaluating a
# structurally broken pack in the first place.
#
# SENTINEL PATTERN (same as hot-zone-pr-gate.yml / guard-conformance.yml): NO top-level
# pull_request paths filter — always triggers so it can be a required check without the
# pending-forever trap. A PR with no evidence/brief.yml and a floor < 3 resolves internally to a
# trivial pass.
#
# KILL SWITCH: `vars.HARNESS_ENFORCEMENT` (named to match harness-v2-teman2.md §10's documented
# switch — adversarial-review finding 2026-08-10: an earlier draft used a workflow-local name that
# matched nothing anyone would ever set). Disabling it is now a plain `exit 0` (see the redesign
# note below for why this no longer needs a publish step at all).
#
# REDESIGNED 2026-08-21 (research/operations/2026-08-21-fable-gate-required-promotion.md) —
# `harness/fable-gate` promotion to a required check was BLOCKED as of 2026-08-10 for two reasons
# that are now BOTH resolved, not merely worked around:
#
#   (a) SYNTHETIC-SHA RELAY was real: a status manually posted (by scripts/harness_fable_gate.py)
#       on a PR's real head SHA never carries over to the merge queue's synthetic test-merge SHA
#       — requiring the commit-status context directly would have deadlocked the queue forever.
#       FIX: this workflow's OWN JOB is now the required check, not a status it posts. A GitHub
#       Actions job's check-run is natively associated with whatever SHA the job executes against
#       — real PR head, workflow_dispatch ref, or the merge queue's synthetic SHA alike — exactly
#       like the already-required `hot-zone-enforcement` and `R1 gate` jobs in this repo. No relay
#       needed; the "not applicable" cases (kill-switch, no-brief/floor<3, gear<3) now just `exit
#       0` as this job's own conclusion instead of writing a separate status.
#
#   (b) FORK-PR WRITE PERMISSION was real: a fork PR's default GITHUB_TOKEN is read-only on this
#       public repo, so the `gh api .../statuses/<sha>` WRITE in the default-publish steps could
#       fail for external contributors — harmless while unrequired, a hard block once required.
#       FIX: this workflow no longer WRITES a commit status anywhere, ever (verified by
#       scripts/tests/test_harness_gate_read.py's static source-scan, not just this comment) — the
#       "not applicable" cases need no external call at all, and the one case that still needs an
#       externally-decided verdict (Gear-3, floor satisfied, pack conformant) only READS whether
#       scripts/harness_fable_gate.py already posted one, via scripts/ci/harness_gate_read.py.
#       Reading a public commit-status needs no elevated token scope — safe on a fork's read-only
#       token by construction, not by convention.
#
# scripts/harness_fable_gate.py is UNCHANGED: it remains the durable, timestamped audit-trail
# record of the gate session's verdict (harness-v2-teman2.md §6) — only this workflow's OWN
# behavior around that record changed, from "leave the context unpublished" to "read it back".
#
# OPERATIONAL COROLLARY: a completed Actions job has no native "pending forever" state distinct
# from "failed", so a Gear-3 PR with no verdict posted yet fails this job exactly like a
# REWORK/BLOCK verdict would (same red X, different message). After the gate session posts a
# verdict it must re-trigger this job — and WHICH command to use depends on the case. An earlier
# version of this note gave only `gh workflow run --ref` and forbade `gh run rerun` outright. That
# is wrong for the ordinary case and it deadlocked the first real Gear-3 PR to follow it (#4543,
# measured 2026-08-21):
#
#   CASE A — the PR already has a `pull_request` run on this exact head SHA (the normal case).
#     Find the id:  gh run list --branch <branch> --workflow harness-floor.yml \
#                     --json databaseId,event,headSha,conclusion
#                   (pick the row whose `event` is `pull_request` and whose `headSha` is the
#                   PR's current head — `gh pr checks <N> --json name,link` also carries it)
#     Use:  gh run rerun <that pull_request run id>
#     WHY:  a `workflow_dispatch` run creates its check-run in a DIFFERENT CHECK SUITE from the
#           `pull_request` event's, and it does not enter the PR's statusCheckRollup AT ALL —
#           it is not a superseded entry, it is an absent one. Measured on #4543: the rollup has
#           exactly ONE `Harness floor recompute` entry and it points at run 32489011695 (the
#           pull_request run); the dispatch run 32489857553 appears nowhere in it. So the dispatch
#           run goes green while the PR keeps the old failure and stays BLOCKED. Measured:
#           dispatch success in suite 88072653107 at 14:01:20Z, pull_request failure in suite
#           88070314010 at 13:51:47Z, rollup FAILURE. `gh run rerun` on the pull_request run —
#           same SHA, same suite, verdict now posted — took it to CLEAN.
#     ESCAPE, if CASE A is unavailable: `gh run rerun` is refused on a run older than 30 days
#           (expired). Do NOT fall back to CASE B here — on an OPEN, BLOCKED PR a dispatch run is
#           inert for exactly the reason above, so it cannot unblock anything. Two escapes do work,
#           both costlier than CASE A: (a) close and reopen the PR — `pull_request:` below lists
#           `reopened`, so this fires a fresh run in the PR's own suite on the UNCHANGED head SHA,
#           leaving the SHA-bound verdict valid, at the cost of the PR's open state; (b) push a new
#           commit and re-post the verdict on the new head SHA.
#
#     NOT COVERED by either case: a Gear-3 PR EJECTED FROM THE MERGE QUEUE with the verdict still
#           pending. That is a `merge_group` run, where W111 holds in full and `mq requeue` is the
#           instrument — see the W111 paragraph below.
#
#   CASE B — no `pull_request` run exists on this ref yet (a branch pushed with no PR open, or a
#     manual re-check outside a PR). Use: gh workflow run harness-floor.yml --ref <branch>
#     (the `workflow_dispatch:` trigger below exists for exactly this).
#
# The W111 prohibition (CLAUDE.md Agent PR Contract rule 3) is NOT repealed. It is scoped — and the
# scoping has to be stated precisely, because an earlier draft of this note got it backwards.
#
# W111's real hazard is a run whose ref RESOLVES THROUGH A MOVING BASE. Its own incident was
# #3463 re-run against `refs/pull/3463/merge` — a PULL-REQUEST merge ref, not a merge_group one.
# So "reruns are only dangerous on merge_group" is FALSE, and the earlier draft of this note said
# exactly that, narrowing the scar onto the one event type it did not happen on (superscar #6 /
# W78: the wrong scar propagated, here into a header every session reads).
#
# CASE A is safe FOR THIS JOB for a specific, checkable reason — not because pull_request reruns
# are inherently safe. This workflow checks out
#   ref: github.event.merge_group.base_sha || github.event.pull_request.base.sha || 'main'
# Read that per BRANCH, not as a whole: the branch a `pull_request` rerun takes is
# `pull_request.base.sha`, a PINNED SHA. (The third branch, `'main'`, IS a moving ref — it is what
# `workflow_dispatch` falls through to. That is CASE B's business, not CASE A's, but it means the
# expression as a whole is not "pinned" and the transfer test below has to be applied to the branch
# YOUR event takes.) On the CASE A path there is no moving ref for the rerun to resolve
# differently, and the only input that changed between attempts is the external commit status,
# which is what we want re-read.
#
# What a rerun does NOT do, and this is the honest limit: it replays the ORIGINAL EVENT PAYLOAD, so
# the base checkout — and with it the versions of `evidence_pack_lint.py`, `harness_gate_read.py`
# and the helper scripts this job actually executes — stays frozen at PR-event time. A CASE A rerun
# will not pick up a base-side fix that landed on main since; only a new `pull_request` event will.
# Pinning makes the staleness DETERMINISTIC — it does not remove it, and it does not make the
# rerun current. A job that DOES check out a merge ref keeps W111
# in full force, and `gh run rerun` on it is still forbidden — as it is on a merge_group run,
# where the queue's own `mq requeue` is the instrument.
#
# Before copying CASE A to another workflow, check that workflow's `ref:`. If it resolves through
# a moving base, CASE A does not transfer.
#
# DIAGNOSTIC TRAP, because it costs an hour otherwise — and the first version of this paragraph
# named the WRONG mechanism, so read it precisely:
#
#   * PAGINATION is what hides the row you need. `gh api .../commits/<sha>/check-runs` returns
#     30 rows by default, and a PR head in this repo carries ~55-63 check-runs. Measured on
#     76edf60e2: no per_page → `returned=30 failures=0`, even WITH `filter=all`; only
#     `filter=all&per_page=100` → `returned=55 failures=1`. So `per_page=100` (or `--paginate`)
#     is MANDATORY. Passing `filter=all` alone does NOT surface the red row.
#   * `filter=all` does a different job: it re-adds attempts SUPERSEDED WITHIN THEIR OWN SUITE.
#     `filter=latest` never hides a cross-suite run, so it is not what deadlocks you — during the
#     #4543 deadlock the default would have returned both rows.
#   * Then compare `check_suite.id`. That is the field that explains a `gh api` / `gh pr checks`
#     disagreement, and without it the two outputs read like a caching bug.
#
# ARMED — NOTHING IS PENDING (corrected 2026-08-21, measured, superseding the ARMING NOTE that
# stood here). That note said "the one action left is adding the job's check name to branch
# protection's required_status_checks — a GUI change, deliberately left to the operator." There is
# no such action, and there never was: `Harness floor recompute` was ALREADY a required context
# before the unblock work began. Measured live rather than reasoned:
#
#   gh api repos/Bali-Zero/Teman2/branches/main/protection --jq '.required_status_checks'
#   -> 27 contexts; "Harness floor recompute" present (app_id 15368, GitHub Actions);
#      "harness/fable-gate" absent; strict: false
#
# and the repo's tracked snapshot infra/required.d/contexts.json agrees (generated 2026-08-11,
# i.e. before the unblock task existed). That is precisely WHY the redesign above works: it moved
# enforcement onto a job branch protection already demanded, instead of onto a hand-posted status
# that would have had to be promoted. So this file's enforcement went live the moment the redesign
# merged — no flag was ever waiting to be flipped.
#
# DO NOT "finish" this by adding `harness/fable-gate` itself as a second required context. That
# resurrects blocker (a) exactly as it stood: a commit status on the PR's real head SHA never
# appears on the merge queue's synthetic test-merge SHA, so every Gear-3 PR would deadlock in the
# queue. If a future session is told to "promote harness/fable-gate to required," the correct
# action is to point at §Solo-operatore of the design doc and confirm the job already covers it.
#
# STILL OPEN, and it is NOT this note (do not read the above as "the gate is fully trustworthy"):
# verdict provenance. scripts/harness_fable_gate.py never verifies WHO posted a verdict — any
# credential with `statuses: write` can post PASS on any SHA. Before the redesign that was inert
# because nothing read the status; now it is load-bearing, so the severity went UP. Tracked in
# modus PENDING-ARMS as design gap (b) of the 2026-08-10 entry, owner there: "me (next session)
# for the design work". Its SIBLING — the repo-wide required-check NAME-spoofing gap — is the one
# with its own 2026-08-21 entry, whose owner field adds the CI-integrity lane qualifier. Both rows
# name the same party; only the lane differs. An earlier draft of this line moved the qualifier
# onto gap (b), where the ledger does not put it — the Gear-3 gate caught it.
#
# NAME NOTE (2026-08-21): `harness/fable-gate` does NOT invoke Fable and never has — it relays a
# verdict a Gear-3 session already reached (scripts/harness_fable_gate.py is a publisher with no
# verdict logic). Zero ruled Fable out of the workflow on 2026-08-20; that changes WHO reaches the
# verdict, not WHETHER a Gear-3 PR must carry one, so this check is unaffected by the routing
# change. The context string stays as-is: it is the literal string branch protection would match,
# and it appears in 15 tracked files at origin/main, including dated research captures that record
# what was true when written. (Cross-family review before merge removed a FLEET_TOPOLOGY.json
# citation from this note: that file does not contain the string, and the Fable-named key it DID
# carry, `fable_gate_gear3`, was already renamed to `gear3_final_gate` by the same 2026-08-20
# ruling — the file cited against renaming had itself been renamed.)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch: {} # re-trigger surface for the operational corollary above — no inputs
    # needed: `github.sha` already resolves to the dispatched ref's current tip, which every
    # HEAD_SHA/BASE_SHA fallback chain below now includes.

concurrency:
  # Dependabot branch: ALL Dependabot PRs share one group per workflow (not
  # per-ref), bounding concurrent Dependabot runs of THIS workflow to <=2
  # (Agent PR Contract rule 5) instead of unbounded parallel.
  # cancel-in-progress:false protects whichever run is RUNNING; GitHub keeps
  # only one PENDING per group, so a 3rd+ near-simultaneous arrival cancels
  # the pending run rather than queuing behind it — visible in the PR's
  # checks tab (never silent), recoverable with `gh run rerun` (confirmed:
  # docs.github.com/en/actions/using-jobs/using-concurrency + kimi-code/k3
  # refuter round on PR #5043). Non-Dependabot branch is byte-for-byte the
  # pre-existing expression — untouched.
  group: ${{ github.actor == 'dependabot[bot]' && format('dependabot-lockfile-{0}', github.workflow) || format('harness-floor-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'merge_group' }}

permissions:
  contents: read
  pull-requests: read
  statuses: read # READ only — this workflow never posts a commit status (see redesign note above)

jobs:
  harness-floor:
    name: Harness floor recompute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # -----------------------------------------------------------------
      # Step 0 — kill switch. Graceful bypass is now a plain `exit 0`: this
      # job's own conclusion IS the check-run (no separate status to keep
      # in sync — see the redesign note in the file header), so "kill
      # switch enabled" is never worse than normal operation by construction,
      # not by a publish call that could itself fail on a fork PR.
      # -----------------------------------------------------------------
      - name: Kill switch
        id: kill_switch
        run: |
          set -u
          if [[ "${{ vars.HARNESS_ENFORCEMENT }}" == "false" ]]; then
            echo "::notice::HARNESS_ENFORCEMENT=false — graceful bypass, exiting 0"
            echo "disabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "disabled=false" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Step 1 — checkout the BASE ref (anti pull_request_target trap, same
      # as hot-zone-pr-gate.yml); enough history for the merge-base diff.
      # `workflow_dispatch` fallback to 'main': that event carries no PR/
      # merge_group base at all — this workflow's only target branch IS
      # main, so 'main' is the correct base for a manual re-trigger's own
      # recompute, not a guess.
      # -----------------------------------------------------------------
      - name: Checkout base ref
        if: steps.kill_switch.outputs.disabled != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || 'main' }}
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        if: steps.kill_switch.outputs.disabled != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install linter dependency (PyYAML)
        if: steps.kill_switch.outputs.disabled != 'true'
        run: python3 -m pip install --quiet pyyaml

      # -----------------------------------------------------------------
      # Step 2 — enumerate changed files, merge-base anchored (never a
      # two-dot diff — that is the W102 lie). Reuses the canonical
      # enumerator so this workflow and hot-zone-pr-gate.yml never disagree
      # about "what did this PR touch".
      # -----------------------------------------------------------------
      - name: Enumerate changed files (merge-base anchored)
        if: steps.kill_switch.outputs.disabled != 'true'
        id: diff
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || 'main' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if ! CHANGED=$(bash scripts/ci/hotzone_changed_files.sh "$BASE_SHA" "$HEAD_SHA" "${PR_NUMBER:-}"); then
            echo "::error::Could not determine the changed-file set — failing closed"
            exit 1
          fi
          printf '%s\n' "$CHANGED" > /tmp/changed-files.txt
          echo "--- Changed files ---"
          cat /tmp/changed-files.txt
          echo "---------------------"

      # -----------------------------------------------------------------
      # Step 2b — resolve THIS PR's own evidence/brief.yml and
      # evidence/pack.yml paths (S12/C6, 2026-08-23). DISCOVERY, not
      # computation: a per-PR evidence directory
      # (evidence/<YYYY-MM>/<slug>/) is chosen by the PR AUTHOR at write
      # time via `scripts/ci/evidence_paths.py --ref <branch>` (a git
      # branch ref). CI must NEVER recompute that slug from a ref of its
      # own here — on a merge_group run
      # `github.event.merge_group.head_ref` is
      # `gh-readonly-queue/main/pr-NNNN-<sha>`, not the PR's branch, so
      # slug_for_ref() on it would name a DIFFERENT directory than the one
      # the PR actually wrote on its pull_request run, and every Gear-3 PR
      # would pass pull_request and then fail in the queue looking for a
      # directory that was never going to exist. Instead this step asks
      # the changed-files list Step 2 already enumerated (merge-base
      # anchored, the same source every other step in this job reads)
      # which evidence/<kind>.yml THIS diff actually touches —
      # `evidence_paths.py --resolve` fails closed (exit 1, nothing on
      # stdout) if a diff ambiguously touches two candidates, and this
      # step propagates that failure rather than silently picking one.
      #
      # BOOTSTRAP WINDOW — deliberately NOT scoped to a single declared PR
      # number, unlike the tracked_file_present_in_diff.sh /
      # harness_gate_read.py bootstrap guards elsewhere in this file. A
      # missing scripts/ci/evidence_paths.py degrades to exactly the two
      # ROOT paths (evidence/brief.yml, evidence/pack.yml) this workflow
      # hardcoded before this step existed — that IS today's already-
      # reviewed behavior, not a weaker one, so there is no fail-open here
      # to bound with a sentinel. Any future run whose base checkout lacks
      # this script (a legitimate first-introduction run, or a script
      # accidentally removed) gets the old behavior back, never a
      # silently disabled check.
      # -----------------------------------------------------------------
      - name: Resolve this PR's evidence paths
        if: steps.kill_switch.outputs.disabled != 'true'
        id: evpaths
        run: |
          set -u
          if [[ ! -f scripts/ci/evidence_paths.py ]]; then
            echo "::notice::scripts/ci/evidence_paths.py not in base checkout — falling back to root evidence/brief.yml + evidence/pack.yml (this is pre-migration behavior, not a fail-open: identical to what this workflow always did before per-PR evidence paths existed)"
            echo "brief=evidence/brief.yml" >> "$GITHUB_OUTPUT"
            echo "pack=evidence/pack.yml" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! BRIEF_PATH="$(python3 scripts/ci/evidence_paths.py --resolve brief --changed-files-file /tmp/changed-files.txt)"; then
            echo "::error::could not resolve this PR's evidence/brief.yml path (ambiguous or failed — see evidence_paths.py output above) — failing closed"
            exit 1
          fi
          if ! PACK_PATH="$(python3 scripts/ci/evidence_paths.py --resolve pack --changed-files-file /tmp/changed-files.txt)"; then
            echo "::error::could not resolve this PR's evidence/pack.yml path (ambiguous or failed — see evidence_paths.py output above) — failing closed"
            exit 1
          fi
          echo "brief=$BRIEF_PATH" >> "$GITHUB_OUTPUT"
          echo "pack=$PACK_PATH" >> "$GITHUB_OUTPUT"
          echo "resolved evidence paths — brief: $BRIEF_PATH — pack: $PACK_PATH"

      # -----------------------------------------------------------------
      # Step 2c — measured net lines for the SIZE TERM of both the floor
      # (compute_floor()'s S1 addendum, 2026-08-27 — a large enough diff
      # floors Gear regardless of hot-zone path) and rule 7's gear ceiling,
      # merge-base anchored (never a two-dot diff against the live base tip
      # — the exact W102 lie the changed-files enumeration above already
      # avoids). MOVED here from its original position after Step 6
      # (gearcheck) — it used to feed ONLY the Gear-3 ceiling (Step 7b) and
      # was gated on brief-present + gear==3; the floor at Step 3 needs it
      # UNCONDITIONALLY (same reasoning as the floor itself being computed
      # before a brief is even known to exist — see that step's own
      # comment), so this step now runs right before it instead. BEST-
      # EFFORT and non-blocking: if the merge-base can't be resolved, this
      # step just skips emitting --numstat-file — evidence_pack_lint.py
      # then falls back to a path-only floor / pack-declared `net_lines:`
      # (each with its own NOTICE), it never treats "couldn't measure" as
      # "measured zero" (that would be a false small-shape signal on a
      # large diff).
      # -----------------------------------------------------------------
      - name: Compute measured net lines (merge-base anchored, best-effort)
        if: steps.kill_switch.outputs.disabled != 'true'
        id: netlines
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || 'main' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          # This job's checkout (Step 1) is BASE, not HEAD — the "grader
          # self-protects" pattern. scripts/evidence_pack_lint.py as it
          # exists in THIS run is therefore whatever origin/main carried at
          # PR-open/sync time — legitimately missing --numstat-file support
          # if a PR teaching the script that flag hasn't merged yet (feature
          # absence, not file absence). But the FILE itself is not new (see
          # Step 3's corrected comment on the same false-safety claim, Kimi
          # K3 finding #3) — its total absence means it was deleted from
          # main, not a bootstrap window. Distinguish the two: missing FILE
          # fails closed; missing FLAG degrades gracefully (this step exists
          # specifically to probe the flag before promising it).
          if [[ ! -f scripts/evidence_pack_lint.py ]]; then
            echo "::error::scripts/evidence_pack_lint.py is missing from the base checkout — not a legitimate bootstrap window (see Step 3's comment). Failing closed rather than silently skipping net-lines measurement."
            exit 1
          fi
          if ! python3 scripts/evidence_pack_lint.py --help 2>&1 | grep -q -- '--numstat-file'; then
            echo "::notice::the evidence_pack_lint.py copy in use (checked out from base $BASE_SHA) does not support --numstat-file yet — net-lines measurement skipped for this run; self-consistent once this PR merges and base's copy is updated"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          if [[ -z "$MERGE_BASE" ]]; then
            echo "::notice::merge-base not resolvable — net-lines measurement skipped for this run (evidence_pack_lint falls back to a path-only floor / pack-declared net_lines with a NOTICE, or asserts nothing)"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CORRECTED 2026-08-27 (adversarial review, codex-sol, PR #5049):
          # this line used to run unguarded under `set -u` only (no `-e`
          # override needed in THIS repo's default shell — GH Actions'
          # bash runs -eo pipefail already — but relying on that implicit
          # default for a security-relevant guarantee is exactly the kind
          # of thing a future shell/runner change silently breaks). Made
          # explicit: a failed `git diff` must degrade to available=false,
          # never fall through to "available=true" over a truncated/empty
          # file — an empty numstat reads as net_lines=0, a false SMALL
          # shape signal on what could be the largest diff in the run.
          if ! git diff --no-renames --numstat "$MERGE_BASE" "$HEAD_SHA" > /tmp/net-lines-numstat.txt; then
            echo "::notice::git diff --numstat failed (merge-base $MERGE_BASE) — net-lines measurement skipped for this run"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "measured net-lines numstat (merge-base $MERGE_BASE):"
          cat /tmp/net-lines-numstat.txt

      # -----------------------------------------------------------------
      # Step 3 — compute the deterministic floor UNCONDITIONALLY (brief or
      # not). Adversarial-review finding 2026-08-10: the first cut only
      # computed this INSIDE the "brief present" branch, so a hot-zone diff
      # with no evidence/brief.yml at all skipped the floor check entirely
      # and fell through to the "not applicable, publish success" default —
      # precisely the downgrade-below-floor this rule exists to catch.
      #
      # SIZE TERM (S1, 2026-08-27): the floor is now hot-zone-path OR
      # blast-radius-size, whichever is higher — compute_floor()'s own
      # docstring has the full contract. Step 2c (just above, moved here
      # from its old post-gearcheck position for exactly this reason) has
      # already produced /tmp/net-lines-numstat.txt on a best-effort basis;
      # when it is not available (merge-base unresolvable, or the base
      # checkout's copy of the script predates --numstat-file) the floor
      # falls back to path-only, exactly as it behaved before this term
      # existed — never a hard failure over a measurement that could not be
      # taken.
      # -----------------------------------------------------------------
      - name: Compute deterministic floor from diff
        if: steps.kill_switch.outputs.disabled != 'true'
        id: detfloor
        env:
          NETLINES_AVAILABLE: ${{ steps.netlines.outputs.available }}
        run: |
          set -u
          # CORRECTED 2026-08-21 (independent cross-family review, Kimi K3,
          # finding #3 — "most dangerous latent defect", CONFIRMED FALSE the
          # claim this comment used to make): `scripts/evidence_pack_lint.py`
          # is NOT new — it already exists on origin/main and has for a long
          # time, so this is not a live bootstrap window at all. The old
          # "not a disarm vector ... no PR can make it disappear from HEAD
          # without also removing it from base after merge" reasoning was
          # simply wrong: a PR CAN delete this script from its own base-facing
          # tree; that deletion PR's own CI run still checks out the OLD base
          # (which still has the file, since Step 1 checks out base, not the
          # deletion PR's own head) and passes normally; the file is then
          # gone from main, and EVERY subsequent PR's base checkout silently
          # hits this branch forever — permanently downgrading the floor to
          # 1 (permissive) repo-wide, with zero red anywhere. There is no
          # legitimate reason for this script to ever be missing from a
          # healthy base checkout, so the correct behavior is fail-closed,
          # not a graceful skip.
          if [[ ! -f scripts/evidence_pack_lint.py ]]; then
            echo "::error::scripts/evidence_pack_lint.py is missing from the base checkout — this script is not new (it predates this workflow's own bootstrap), so its absence means it was deleted from main, not that we are in a legitimate bootstrap window. Failing closed rather than silently defaulting the floor to 1."
            exit 1
          fi
          EXTRA_ARGS=()
          if [[ "$NETLINES_AVAILABLE" == "true" ]]; then
            EXTRA_ARGS+=(--numstat-file /tmp/net-lines-numstat.txt)
          else
            echo "::notice::no measured net-lines for this run — floor computed from hot-zone paths only (size term skipped, same as before this term existed)"
          fi
          FLOOR=$(python3 scripts/evidence_pack_lint.py --print-floor --changed-files-file /tmp/changed-files.txt "${EXTRA_ARGS[@]}")
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"
          echo "deterministic floor for this diff: $FLOOR"
          # SOURCE (S2, 2026-08-27, gate round 2 on PR #5049): WHY the floor
          # is what it is, not just the number — "none"/"path"/"size"/"both".
          # Same EXTRA_ARGS as the floor call above, so it reads the exact
          # same inputs; the two calls can never disagree about what they
          # were computed from. Consumed by Step 5b to grant the
          # SIZE_GEAR2_ENFORCEMENT_DATE grace period ONLY to a floor==2 diff
          # that got there via the size term, never to a hypothetical
          # path-sourced floor==2 (compute_floor_source()'s docstring proves
          # today's floor==2 can only be source=="size", but the explicit
          # check stays correct even if that ever changes).
          # BOOTSTRAP (same shape as the netlines probe above, and the
          # --source-path probe added to the Gear-3 pack-validation step):
          # this job's checkout is BASE, not HEAD, so the evidence_pack_lint.py
          # invoked here is whatever origin/main carried at PR-open/sync time.
          # --print-floor-source is a brand-new flag THIS PR (#5049) is
          # teaching the script -- base's copy legitimately does not
          # recognize it yet. Missing FLAG degrades to SOURCE=unknown (never
          # equals 'size', so the SIZE_GEAR2_ENFORCEMENT_DATE grace-period
          # branch below is simply not granted -- conservative, not a
          # fail-open); FLOOR itself is unaffected since --print-floor above
          # never depended on this flag.
          if python3 scripts/evidence_pack_lint.py --help 2>&1 | grep -q -- '--print-floor-source'; then
            SOURCE=$(python3 scripts/evidence_pack_lint.py --print-floor-source --changed-files-file /tmp/changed-files.txt "${EXTRA_ARGS[@]}")
          else
            SOURCE="unknown"
            echo "::notice::the evidence_pack_lint.py copy in use (checked out from base) does not support --print-floor-source yet — floor_source reported as 'unknown' this run (no SIZE-term grace period granted); self-consistent once this PR merges and base's copy is updated"
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "deterministic floor source for this diff: $SOURCE"
          # STEP SUMMARY (S2, 2026-08-27, gate round 2 on PR #5049): the same
          # floor/source pair also lands on the job summary page, not just in
          # $GITHUB_OUTPUT and the raw log line above — so a human looking at
          # the check run (not grepping outputs) can see floor_source without
          # opening this step's log.
          {
            echo "### Harness floor"
            echo "- floor: \`$FLOOR\`"
            echo "- floor_source: \`$SOURCE\` (none/path/size/both)"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------
      # Step 4 — does THIS PR'S OWN DIFF carry evidence/brief.yml? FAIL
      # CLOSED (adversarial-review finding 2026-08-10) if the HEAD commit
      # itself cannot be resolved after a fetch attempt — that is "cannot
      # verify", never "no brief". The original `git fetch ... || true`
      # swallowed fetch failures and let an unresolvable commit read as
      # "file legitimately absent from that tree", silently defaulting to
      # success on a PR this workflow never actually inspected.
      #
      # CORRECTED 2026-08-21 (independent Gear-3 review round 1, F1, CRITICAL):
      # the previous version checked `git cat-file -e "$HEAD_SHA:evidence/brief.yml"`
      # — TREE presence, not DIFF membership. `evidence/brief.yml` is a
      # tracked file at a FIXED repo-root path: whatever the most recently
      # merged Gear-3 PR (e.g. #4474) left there stays in the tree and is
      # inherited by every subsequent branch, whether or not THAT branch
      # ever touches it. Under the old Step 7c (a no-op notice, never a
      # failure) this was harmless — the job always passed regardless. Under
      # the new read-based Step 7c it is not: EVERY PR in the repo would
      # inherit `gear: 3` from whatever the last Gear-3 PR declared and take
      # the Gear-3 path, repo-wide, for a required check. Verified live: a
      # single-file docs-ledger PR (#4535) already showed gear=3 from #4474's
      # leftover pack.
      #
      # CORRECTED AGAIN 2026-08-21 (independent Gear-3 review round 2, same
      # PR): round 1's fix was two inline conditions here, pinned only by a
      # test that reimplemented the same two lines itself rather than
      # exercising this file — reverting these conditions locally left every
      # test green. Fix: the check now lives in
      # scripts/ci/tracked_file_present_in_diff.sh (same shape as the
      # existing hotzone_changed_files.sh / vercel_should_build.sh, both
      # already `run:`-invoked rather than reimplemented inline), and the
      # test corpus (scripts/tests/test_harness_floor_brief_diff_membership.sh)
      # invokes that exact file — a mutation to the check is now visible to
      # both the workflow and the test from the same source.
      # -----------------------------------------------------------------
      - name: Does this PR's own diff carry evidence/brief.yml?
        if: steps.kill_switch.outputs.disabled != 'true'
        id: brief
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BRIEF_PATH: ${{ steps.evpaths.outputs.brief }}
        run: |
          set -u
          # Bootstrap-window exemption (same pattern as evidence_pack_lint.py
          # and harness_gate_read.py elsewhere in this file — CAUGHT LIVE on
          # this PR's own first CI run after round 2 landed: Step 1 checks
          # out the BASE ref, which lacks this script until this very PR
          # merges, so an unguarded call here dies on a raw "command not
          # found" (bash exit 127), failing THIS PR's own required check on
          # a script THIS PR itself introduces). The fallback does NOT
          # degrade to tree-presence-only (that would silently reopen F1 for
          # any OTHER PR whose base checkout also predates this merge) — it
          # inlines the exact same two-condition check the external script
          # performs, so the diff-membership guarantee holds through the
          # bootstrap window too, not just after it.
          #
          # SENTINEL-GATED (cross-family review, Kimi K3, finding #3 —
          # extended to this call site 2026-08-21): the first version of this
          # guard inlined its check on ANY missing script, with no bound on
          # WHICH PR that applies to — a standing fail-open, same shape as
          # the harness_gate_read.py defect Kimi found: a future PR that
          # deletes scripts/ci/tracked_file_present_in_diff.sh would pass its
          # own CI (base still has it, pre-merge) and, once merged, every
          # later PR would silently inline a permanently-stale copy of this
          # check forever — never calling the shared script again, and
          # defeating the whole reason it was extracted (round-2 note above:
          # a mutation to the check must be visible to workflow AND test from
          # the same source). Fixed the same way as Step 7c: the inline
          # fallback fires ONLY for this PR's own number (the one legitimate
          # bootstrap window) — for every other PR, a missing script fails
          # closed.
          BOOTSTRAP_PR="4539" # this PR's own number — the one legitimate bootstrap window for this script
          if [[ ! -f scripts/ci/tracked_file_present_in_diff.sh ]]; then
            RESOLVED_PR="${PR_NUMBER:-}"
            if [[ -z "$RESOLVED_PR" && "$MERGE_GROUP_HEAD_REF" =~ pr-([0-9]+)- ]]; then
              RESOLVED_PR="${BASH_REMATCH[1]}"
            fi
            if [[ "$RESOLVED_PR" != "$BOOTSTRAP_PR" ]]; then
              echo "::error::scripts/ci/tracked_file_present_in_diff.sh is missing from the base checkout, and this is PR #${RESOLVED_PR:-unknown}, not the declared one-time bootstrap PR (#$BOOTSTRAP_PR) — failing closed. A missing script here means it was deleted from main, not that we are in a legitimate bootstrap window."
              exit 1
            fi
            echo "::notice::scripts/ci/tracked_file_present_in_diff.sh not in base checkout yet (bootstrap run for PR #$BOOTSTRAP_PR only) — inlining its check for THIS run only"
            if git cat-file -e "${HEAD_SHA}:${BRIEF_PATH}" 2>/dev/null && grep -qxF "$BRIEF_PATH" /tmp/changed-files.txt; then
              echo "present=true" >> "$GITHUB_OUTPUT"
              git show "${HEAD_SHA}:${BRIEF_PATH}" > /tmp/brief.yml
            else
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "::notice::evidence/brief.yml is not present-and-diff-touched at HEAD (bootstrap-window inline check) — not a harness-gated task (pending the floor check below)"
            fi
            exit 0
          fi
          git fetch --no-tags --depth=200 origin "$HEAD_SHA" >/dev/null 2>&1 || true
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::HEAD commit ${HEAD_SHA} could not be resolved after fetch — failing closed (cannot verify whether evidence/brief.yml exists, this is NOT the same as 'no brief')"
            exit 1
          fi
          RESULT="$(bash scripts/ci/tracked_file_present_in_diff.sh "$HEAD_SHA" "$BRIEF_PATH" /tmp/changed-files.txt)"
          case "$RESULT" in
            present)
              echo "present=true" >> "$GITHUB_OUTPUT"
              git show "$HEAD_SHA:${BRIEF_PATH}" > /tmp/brief.yml
              ;;
            inherited)
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "::notice::evidence/brief.yml exists at HEAD but was NOT touched by this PR's own diff (inherited from a prior merge, e.g. the last Gear-3 PR) — not THIS PR's brief, not a harness-gated task for it"
              ;;
            absent)
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "::notice::no evidence/brief.yml at HEAD — not a harness-gated task (pending the floor check below)"
              ;;
            *)
              echo "::error::tracked_file_present_in_diff.sh returned an unrecognized value: '$RESULT' — failing closed"
              exit 1
              ;;
          esac

      # -----------------------------------------------------------------
      # Step 5a — no brief, and the diff does NOT hit ANY floor (floor==1,
      # plain Gear-1 shape): genuinely not a harness task. Nothing to
      # publish any more (see redesign note in the file header) — this
      # job's own `exit 0` here IS the passing check-run, on whatever SHA
      # it is running against.
      #
      # CORRECTED 2026-08-27 (adversarial review, codex-sol, PR #5049,
      # finding 1 HIGH): this condition used to be `floor != '3'`, which
      # silently passed a floor==2 diff (400-1827 net lines on plain
      # paths, S1's own size term) straight through as "not a harness
      # task" — the exact bypass a bare non-hot-zone size-only diff would
      # take to dodge Gear-2. floor==1 is the ONLY value that means
      # genuinely-small; floor==2 and floor==3 both mean "the deterministic
      # floor requires a brief" and both belong in Step 5b/5c below.
      # -----------------------------------------------------------------
      - name: Not a harness task (no brief, floor == 1 — not applicable)
        if: |
          steps.kill_switch.outputs.disabled != 'true' &&
          steps.brief.outputs.present != 'true' &&
          steps.detfloor.outputs.floor == '1'
        run: echo "::notice::not a harness task (no evidence/brief.yml, floor == 1) — passing"

      # -----------------------------------------------------------------
      # Step 5b — GRACE PERIOD (S2, 2026-08-27, gate round 2 on PR #5049):
      # no brief, floor==2, and that floor came from the SIZE term ALONE
      # (steps.detfloor.outputs.source == 'size' — never 'path'/'both',
      # which get no grace and fall through to Step 5c below unconditionally).
      #
      # WHY this exists at all (finding from the Gear-3 gate review of the
      # round-1 fix, not the codex-sol adversarial round): Step 5c below
      # used to FAIL every floor==2 diff outright the moment it merged.
      # Measured baseline (170 merged PRs, same sample S1 itself was
      # calibrated on): only 10/29 (34%) of PRs >400 net lines historically
      # carried a brief — so an immediate hard-FAIL would turn a required
      # check red on ~2 of every 3 mid-size PRs fleet-wide (every lane, every
      # machine), none of them ever warned this was coming. That violates
      # this mandate's own gate lifecycle (E7: a new gate starts as NOTICE
      # for a grace window, THEN FAIL) and is exactly the "spring a new hard
      # gate on the fleet with zero warning" pattern the 2026-08-26 retro
      # flagged. SIZE_GEAR2_ENFORCEMENT_DATE is the flip point, lives in
      # code (not a ledger) so it is enforced mechanically, same pattern as
      # LANES_NON_ANTHROPIC_ENFORCEMENT_DATE in evidence_pack_lint.py.
      #
      # Floor==3 gets NO such grace, from either source (path OR
      # size>=1828): that floor value already existed before this PR (the
      # hot-zone/path case) and the fleet has long since adapted to it, so
      # there is nothing new to warn about there — only the SIZE term's
      # NEW floor==2 bucket is a genuinely new gate.
      # -----------------------------------------------------------------
      - name: "NOTICE (grace period) then FAIL — floor==2 via the SIZE term alone, no evidence/brief.yml"
        if: |
          steps.kill_switch.outputs.disabled != 'true' &&
          steps.brief.outputs.present != 'true' &&
          steps.detfloor.outputs.floor == '2' &&
          steps.detfloor.outputs.source == 'size'
        env:
          SIZE_GEAR2_ENFORCEMENT_DATE: "2026-09-02"
        run: |
          set -u
          TODAY="$(date -u +%F)"
          # ISO-8601 (YYYY-MM-DD) strings compare lexicographically in the
          # same order as chronologically — safe as a plain bash string
          # comparison inside [[ ]], no date-arithmetic library needed.
          if [[ "$TODAY" < "$SIZE_GEAR2_ENFORCEMENT_DATE" ]]; then
            echo "::warning::this diff's deterministic floor is 2, reached via the SIZE term ALONE (churn >= 400 net lines on non-hot-zone paths — see evidence_pack_lint.py's compute_floor()/compute_floor_source()), and carries no evidence/brief.yml. NOTICE ONLY until $SIZE_GEAR2_ENFORCEMENT_DATE (today: $TODAY — E7 gate lifecycle: a new gate starts as NOTICE, then FAIL) — starting that date this becomes a required-check FAIL. Baseline measured 2026-08-27: only 10/29 (34%) of PRs >400 net lines historically carried a brief; this grace period gives the fleet — every lane, every machine — time to adapt before the check goes hard."
            exit 0
          fi
          echo "::error::this diff's deterministic floor is 2, reached via the SIZE term alone, and carries no evidence/brief.yml — the SIZE_GEAR2_ENFORCEMENT_DATE grace period ($SIZE_GEAR2_ENFORCEMENT_DATE) has passed (today: $TODAY) — a floor==2 diff now requires at minimum a brief declaring gear>=2"
          exit 1

      # -----------------------------------------------------------------
      # Step 5c — no brief, and the diff meets a deterministic floor that
      # gets NO grace period: floor==3 from any source (path and/or size
      # >=1828), or the currently-unreachable-but-structurally-possible
      # case of a path-sourced/both-sourced floor==2 (see
      # compute_floor_source()'s docstring — today's floor==2 can only be
      # source=='size', but this condition stays correct even if a future
      # HOTZONE_PATTERNS change ever made another floor==2 source
      # possible). FAIL — do not default to success just because no brief
      # exists to compare against (adversarial-review finding 2026-08-10;
      # widened from floor==3-only to floor>=2 on 2026-08-27, then carved
      # out the size-only-floor==2 grace period into Step 5b above,
      # 2026-08-27 gate round 2).
      # -----------------------------------------------------------------
      - name: FAIL — floor >= 2 diff with no evidence/brief.yml (no grace period applies)
        if: |
          steps.kill_switch.outputs.disabled != 'true' &&
          steps.brief.outputs.present != 'true' &&
          steps.detfloor.outputs.floor != '1' &&
          !(steps.detfloor.outputs.floor == '2' && steps.detfloor.outputs.source == 'size')
        env:
          FLOOR: ${{ steps.detfloor.outputs.floor }}
          SOURCE: ${{ steps.detfloor.outputs.source }}
        run: |
          echo "::error::this diff's deterministic floor is $FLOOR (source: $SOURCE — hot-zone path and/or blast-radius size, see evidence_pack_lint.py's compute_floor()) but carries no evidence/brief.yml — a floor>=2 diff requires at minimum a brief declaring gear>=$FLOOR (Gear 3 additionally requires a pack + gate verdict, Step 7b/7c below); it cannot silently pass as 'not a harness task'"
          exit 1

      # -----------------------------------------------------------------
      # Step 6 — brief present: compare its declared gear to the floor
      # already computed in step 3 (single source of truth, not a second
      # invocation). FAILS (and therefore skips every step below, including
      # any fable-gate publish) if the brief declares LESS than the floor —
      # the model may only raise the gear, never lower it under the floor.
      # -----------------------------------------------------------------
      - name: Compare declared gear to the deterministic floor
        if: steps.kill_switch.outputs.disabled != 'true' && steps.brief.outputs.present == 'true'
        id: gearcheck
        run: |
          set -u
          GEAR=$(python3 -c "import yaml; print(yaml.safe_load(open('/tmp/brief.yml')).get('gear',''))")
          FLOOR="${{ steps.detfloor.outputs.floor }}"
          echo "declared gear: $GEAR — deterministic floor: $FLOOR"
          # evidence/brief.yml is PR-authored content — GEAR is attacker-controlled input.
          # Validate it is exactly one of "1"/"2"/"3" BEFORE any arithmetic or use as a
          # commit-status field, rather than let a malformed value silently coerce to 0
          # in the `(( ))` arithmetic context below.
          if [[ ! "$GEAR" =~ ^[123]$ ]]; then
            echo "::error::evidence/brief.yml 'gear' must be exactly 1, 2 or 3 — got '${GEAR}'"
            exit 1
          fi
          echo "gear=$GEAR" >> "$GITHUB_OUTPUT"
          if (( GEAR < FLOOR )); then
            echo "::error::declared gear $GEAR is BELOW the deterministic floor $FLOOR (hot-zone path and/or blast-radius size — see evidence_pack_lint.py's compute_floor()) — the brief must declare gear>=$FLOOR"
            exit 1
          fi

      # -----------------------------------------------------------------
      # Step 7a — floor satisfied, but this is not a Gear-3 task: the gate
      # verdict does not apply (harness-v2 §6 — Gear 2 closes with a
      # session verdict + AI-review + CI, Gear 1 with CI alone). Nothing to
      # publish — this job's own `exit 0` is the passing check-run for a
      # Gear-1/2 harness task, never blocked on a gate it was never meant
      # to pass through.
      # -----------------------------------------------------------------
      - name: Not a Gear-3 task (gear < 3 — fable-gate not applicable)
        if: |
          steps.kill_switch.outputs.disabled != 'true' &&
          steps.brief.outputs.present == 'true' &&
          steps.gearcheck.outputs.gear != '3'
        env:
          GEAR: ${{ steps.gearcheck.outputs.gear }}
        run: echo "::notice::gear ${GEAR} — fable-gate is Gear-3 only, not applicable — passing"

      # -----------------------------------------------------------------
      # Step 7b — Gear-3, floor satisfied: validate the ACTUAL Evidence
      # Pack (evidence/pack.yml), not just the brief's declared gear field.
      # Adversarial-review finding 2026-08-10: the first cut of this
      # workflow never ran evidence_pack_lint.py against the real pack, so
      # a malformed/incomplete pack could sit PENDING indefinitely without
      # ever being caught structurally. Builds a small tree with brief.yml
      # + pack.yml at the SAME relative layout the linter expects
      # (brief_ref: "evidence/brief.yml" resolves against --repo-root), so
      # this reuses the exact same check_* rules a local run would.
      # --numstat-file (Step 2c, moved earlier 2026-08-27 so the floor can
      # consume it too) is passed only when it was actually produced —
      # never a bare/empty arg that could read as "0 net lines measured"
      # (adversarial-review finding 2026-08-21).
      #
      # CORRECTED 2026-08-21 (independent Gear-3 review, F1/F4 symmetric
      # fix): same tree-presence-vs-diff-membership defect as Step 4, on the
      # pack side. Validating a `pack.yml` that merely EXISTS at HEAD (left
      # by a prior Gear-3 PR) against THIS PR's own diff grades one task's
      # work against a completely different task's evidence — it can pass
      # by accident (this repo's own Step 7b did exactly that against this
      # very PR's first draft, because #4474's leftover pack happened to
      # name this same hot-zone file). `evidence/pack.yml` must ALSO be in
      # this PR's own changed-files set, or this step fails closed — a
      # Gear-3 PR authors BOTH files together, never validates a stale one.
      # -----------------------------------------------------------------
      - name: Gear-3 — validate evidence/pack.yml against the Evidence Pack contract
        if: |
          steps.kill_switch.outputs.disabled != 'true' &&
          steps.brief.outputs.present == 'true' &&
          steps.gearcheck.outputs.gear == '3'
        id: packlint
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          NETLINES_AVAILABLE: ${{ steps.netlines.outputs.available }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PACK_PATH: ${{ steps.evpaths.outputs.pack }}
        run: |
          set -u
          # Same corrected reasoning as Step 3 (Kimi K3 finding #3):
          # scripts/evidence_pack_lint.py is not new, so its absence from
          # base means it was deleted from main, not a bootstrap window —
          # fail closed rather than silently skipping pack validation.
          if [[ ! -f scripts/evidence_pack_lint.py ]]; then
            echo "::error::scripts/evidence_pack_lint.py is missing from the base checkout — not a legitimate bootstrap window (see Step 3's comment). Failing closed rather than silently skipping pack validation."
            exit 1
          fi
          mkdir -p /tmp/evidence-check/evidence
          # Same bootstrap-window exemption as Step 4, and same sentinel fix
          # (cross-family review, Kimi K3, finding #3, extended here
          # 2026-08-21 — this call site had the same unbounded-inline
          # fail-open as Step 4 before its fix): the inline fallback fires
          # ONLY for this PR's own number, never for any other PR whose base
          # checkout is missing the script for an unrelated reason.
          BOOTSTRAP_PR="4539" # this PR's own number — the one legitimate bootstrap window for this script
          if [[ ! -f scripts/ci/tracked_file_present_in_diff.sh ]]; then
            RESOLVED_PR="${PR_NUMBER:-}"
            if [[ -z "$RESOLVED_PR" && "$MERGE_GROUP_HEAD_REF" =~ pr-([0-9]+)- ]]; then
              RESOLVED_PR="${BASH_REMATCH[1]}"
            fi
            if [[ "$RESOLVED_PR" != "$BOOTSTRAP_PR" ]]; then
              echo "::error::scripts/ci/tracked_file_present_in_diff.sh is missing from the base checkout, and this is PR #${RESOLVED_PR:-unknown}, not the declared one-time bootstrap PR (#$BOOTSTRAP_PR) — failing closed. A missing script here means it was deleted from main, not that we are in a legitimate bootstrap window."
              exit 1
            fi
            echo "::notice::scripts/ci/tracked_file_present_in_diff.sh not in base checkout yet (bootstrap run for PR #$BOOTSTRAP_PR only) — inlining its check for THIS run only"
            if ! git cat-file -e "${HEAD_SHA}:${PACK_PATH}" 2>/dev/null; then
              echo "::error::gear 3 declared in evidence/brief.yml but evidence/pack.yml is missing at HEAD — a Gear-3 task needs both"
              exit 1
            fi
            if ! grep -qxF "$PACK_PATH" /tmp/changed-files.txt; then
              echo "::error::gear 3 declared in evidence/brief.yml (authored by this diff) but evidence/pack.yml was NOT touched by this diff — a Gear-3 PR must author BOTH files together in the same diff, never validate a pack.yml inherited from a prior PR"
              exit 1
            fi
          else
            RESULT="$(bash scripts/ci/tracked_file_present_in_diff.sh "$HEAD_SHA" "$PACK_PATH" /tmp/changed-files.txt)"
            case "$RESULT" in
              present) : ;; # falls through to validation below
              absent)
                echo "::error::gear 3 declared in evidence/brief.yml but evidence/pack.yml is missing at HEAD — a Gear-3 task needs both"
                exit 1
                ;;
              inherited)
                echo "::error::gear 3 declared in evidence/brief.yml (authored by this diff) but evidence/pack.yml was NOT touched by this diff — a Gear-3 PR must author BOTH files together in the same diff, never validate a pack.yml inherited from a prior PR"
                exit 1
                ;;
              *)
                echo "::error::tracked_file_present_in_diff.sh returned an unrecognized value: '$RESULT' — failing closed"
                exit 1
                ;;
            esac
          fi
          # THE brief_ref CONTRACT (S12/C6, 2026-08-23 gate finding): both
          # files are staged here under the CANONICAL evidence/{pack,brief}.yml
          # names, regardless of where PACK_PATH/BRIEF_PATH actually live in
          # the real repo (a fixed root pair, or a per-PR
          # evidence/<YYYY-MM>/<slug>/ directory). evidence_pack_lint.py
          # resolves the pack's own `brief_ref:` field against --repo-root
          # (/tmp/evidence-check, this synthetic tree) — so `brief_ref:` MUST
          # name a path in the STAGING layout, i.e. always the literal
          # "evidence/brief.yml", NEVER the real per-PR path
          # ("evidence/2026-08/<slug>/brief.yml"). Writing the "obviously
          # correct" per-PR-looking value here is exactly the trap this
          # migration exists to remove: the lint failure it produces
          # ("brief_ref: ... does not resolve to a file on disk") says
          # nothing about staging vs. real layout. See the same sentence in
          # scripts/ci/evidence_paths.py's module docstring, where an author
          # writing a new pack will actually be looking.
          git show "$HEAD_SHA:${PACK_PATH}" > /tmp/evidence-check/evidence/pack.yml
          cp /tmp/brief.yml /tmp/evidence-check/evidence/brief.yml
          EXTRA_ARGS=()
          if [[ "$NETLINES_AVAILABLE" == "true" ]]; then
            EXTRA_ARGS+=(--numstat-file /tmp/net-lines-numstat.txt)
          fi
          # --source-path is THIS PR's own real pack path (evpaths' PACK_PATH,
          # resolved above BEFORE staging) — not the staged file we just
          # wrote it to. Rule 9 (evidence root deprecation) judges THAT
          # path; without this flag it would default to the staged
          # positional argument, which is always the canonical
          # evidence/pack.yml regardless of where the real file lives, and
          # every PR — migrated or not — would misjudge as root.
          #
          # BOOTSTRAP (same shape as the netlines step above, and Step 3's
          # --numstat-file probe): this job's checkout is BASE, not HEAD, so
          # scripts/evidence_pack_lint.py as it exists in THIS run is
          # whatever origin/main carried at PR-open/sync time — the very PR
          # that TEACHES the script --source-path (this one) has not merged
          # yet, so base's copy legitimately does not support it. Missing
          # FLAG degrades gracefully (fall back to the staged positional
          # path, same as a direct/local invocation with no --source-path —
          # Rule 9 then judges the canonical staged path instead of the real
          # one, a strictly narrower check, never a fail-open); missing FILE
          # still fails closed per Step 3's convention.
          if [[ ! -f scripts/evidence_pack_lint.py ]]; then
            echo "::error::scripts/evidence_pack_lint.py is missing from the base checkout — not a legitimate bootstrap window (see Step 3's comment). Failing closed rather than silently skipping pack validation."
            exit 1
          fi
          if python3 scripts/evidence_pack_lint.py --help 2>&1 | grep -q -- '--source-path'; then
            EXTRA_ARGS+=(--source-path "$PACK_PATH")
          else
            echo "::notice::the evidence_pack_lint.py copy in use (checked out from base) does not support --source-path yet — Rule 9 (evidence root deprecation) will judge the staged canonical path instead of this PR's real per-PR path this run; self-consistent once this PR merges and base's copy is updated"
          fi
          python3 scripts/evidence_pack_lint.py \
            /tmp/evidence-check/evidence/pack.yml \
            --repo-root /tmp/evidence-check \
            --changed-files-file /tmp/changed-files.txt \
            "${EXTRA_ARGS[@]}"

      # -----------------------------------------------------------------
      # Step 7c — Gear-3, floor satisfied, pack conformant: this job's own
      # conclusion now depends on READING whether the gate session already
      # posted a real `harness/fable-gate` verdict — never on writing one.
      # scripts/ci/harness_gate_read.py (scripts/tests/test_harness_gate_read.py
      # is its guilt+innocence corpus, including static proofs it can never
      # publish) resolves the PR's REAL head sha for each event shape
      # (direct on pull_request/workflow_dispatch, a live `gh pr view` on
      # merge_group — see that script's own docstring for why the queue
      # ref's embedded sha is NOT it) and mirrors the found state as this
      # step's exit code. No verdict yet -> FAILS, same red as a real
      # REWORK/BLOCK, distinguished only by the message — see the
      # OPERATIONAL COROLLARY note in the file header for the re-trigger
      # flow this implies.
      #
      # BOOTSTRAP GUARD added 2026-08-21 (independent Gear-3 review round 1,
      # F6): the three evidence_pack_lint.py siblings above each guard
      # `[[ ! -f scripts/evidence_pack_lint.py ]]` because Step 1 checks out
      # BASE, which lacks any script THIS PR itself introduces until it
      # merges. This step calls a brand-new script and had no such guard —
      # this PR's own first CI run would have died on a raw
      # "can't open file" (exit 2) instead of the established NOTICE+skip,
      # masking the real Step-4/7b defects (F1/F4) behind an unrelated crash.
      #
      # SENTINEL-GATED, not a bare skip (independent cross-family review,
      # Kimi K3, finding #3 — reclassified: unlike evidence_pack_lint.py
      # above, scripts/ci/harness_gate_read.py IS genuinely new here, so
      # its guard cannot simply hard-fail — but a bare `[[ ! -f ... ]] ->
      # exit 0` is a standing fail-open: a FUTURE PR that deletes this
      # script would pass its own CI (base still has it, pre-merge) and,
      # once merged, silently and permanently exit every subsequent Gear-3
      # PR's verdict read with 0 — no red anywhere, forever. Fixed: the
      # skip only fires for THIS PR's own number (the one legitimate
      # bootstrap window) — for every other PR, a missing script fails
      # closed. PR_NUMBER resolves from pull_request directly or, on
      # merge_group, from the GitHub-minted head_ref (same shape
      # harness_gate_read.py's own PR_NUMBER_RE already parses — cannot be
      # spoofed by a fork PR's content).
      # -----------------------------------------------------------------
      - name: Gear-3 — read the real gate verdict
        if: |
          steps.kill_switch.outputs.disabled != 'true' &&
          steps.brief.outputs.present == 'true' &&
          steps.gearcheck.outputs.gear == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -u
          BOOTSTRAP_PR="4539" # this PR's own number — the one legitimate bootstrap window for this script
          if [[ ! -f scripts/ci/harness_gate_read.py ]]; then
            RESOLVED_PR="${PR_NUMBER:-}"
            if [[ -z "$RESOLVED_PR" && "$MERGE_GROUP_HEAD_REF" =~ pr-([0-9]+)- ]]; then
              RESOLVED_PR="${BASH_REMATCH[1]}"
            fi
            if [[ "$RESOLVED_PR" == "$BOOTSTRAP_PR" ]]; then
              echo "::notice::scripts/ci/harness_gate_read.py not in base checkout yet (bootstrap run for PR #$BOOTSTRAP_PR only) — verdict read skipped for THIS run only"
              exit 0
            fi
            echo "::error::scripts/ci/harness_gate_read.py is missing from the base checkout, and this is PR #${RESOLVED_PR:-unknown}, not the declared one-time bootstrap PR (#$BOOTSTRAP_PR) — failing closed. A missing script here means it was deleted from main, not that we are in a legitimate bootstrap window."
            exit 1
          fi
          python3 scripts/ci/harness_gate_read.py \
            --event-name "${{ github.event_name }}" \
            --repo "${{ github.repository }}" \
            --pr-head-sha "${{ github.event.pull_request.head.sha }}" \
            --merge-group-head-ref "${{ github.event.merge_group.head_ref }}" \
            --dispatch-sha "${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}"
