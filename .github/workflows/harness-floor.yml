name: Harness floor & gate publisher

# PR-3 of the fleet-order program (research/operations/2026-08-10-fleet-order-spec.md §4/§7;
# research/operations/2026-08-09-harness-v2-teman2.md §1/§6).
#
# TWO responsibilities live in one job because they share one contract: `harness/fable-gate` must
# be a SAFE required status check. GitHub branch protection has no per-label required-check
# scoping — a status only ever published manually (by scripts/harness_fable_gate.py, run by a real
# Gear-3 Fable gate session) would leave that context "Expected — Waiting for status" FOREVER on
# every ordinary PR if it were simply added to required_status_checks. So this workflow is ALSO the
# DEFAULT PUBLISHER: on any PR that is not declaring Gear-3 (no evidence/brief.yml, or a brief
# declaring gear < 3), it self-publishes a neutral `harness/fable-gate` success — the same pattern
# "Hot-zone enforcement" already uses (unconditionally required, internally a no-op for PRs it does
# not apply to). Only a Gear-3 brief is left PENDING for the real gate session to publish for real.
#
# Floor recompute (harness-v2 §1 "il modello può solo alzare la classe, mai abbassarla sotto il
# floor"): the declared `gear` in evidence/brief.yml must be >= the DETERMINISTIC floor computed
# from the PR's changed-file set against the hot-zone list — reusing
# scripts/evidence_pack_lint.py's compute_floor() via --print-floor (one source of truth, not a
# second copy of the pattern list baked into this YAML; see that script's own docstring for the
# declared, unavoidable duplication against hot-zone-pr-gate.yml's bash case-block).
#
# SENTINEL PATTERN (same as hot-zone-pr-gate.yml / guard-conformance.yml): NO top-level
# pull_request paths filter — always triggers so it can be a required check without the
# pending-forever trap. A PR with no evidence/brief.yml resolves internally to a trivial pass.
#
# ARMING NOTE (operator/session): adding `harness/fable-gate` to branch protection's
# required_status_checks is a branch-protection change — tracked in modus PENDING-ARMS.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  group: harness-floor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  harness-floor:
    name: Harness floor recompute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # -----------------------------------------------------------------
      # Step 0 — kill switch (vars-based, logged bypass, never silent)
      # -----------------------------------------------------------------
      - name: Kill switch
        id: kill_switch
        run: |
          if [[ "${{ vars.HARNESS_FLOOR_ENFORCEMENT_ENABLED }}" == "false" ]]; then
            echo "::notice::HARNESS_FLOOR_ENFORCEMENT_ENABLED=false — exiting neutral, no fable-gate publish"
            echo "disabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "disabled=false" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Step 1 — checkout the BASE ref (anti pull_request_target trap, same
      # as hot-zone-pr-gate.yml); enough history for the merge-base diff.
      # -----------------------------------------------------------------
      - name: Checkout base ref
        if: steps.kill_switch.outputs.disabled != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        if: steps.kill_switch.outputs.disabled != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linter dependency (PyYAML)
        if: steps.kill_switch.outputs.disabled != 'true'
        run: python3 -m pip install --quiet pyyaml

      # -----------------------------------------------------------------
      # Step 2 — enumerate changed files, merge-base anchored (never a
      # two-dot diff — that is the W102 lie). Reuses the canonical
      # enumerator so this workflow and hot-zone-pr-gate.yml never disagree
      # about "what did this PR touch".
      # -----------------------------------------------------------------
      - name: Enumerate changed files (merge-base anchored)
        if: steps.kill_switch.outputs.disabled != 'true'
        id: diff
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if ! CHANGED=$(bash scripts/ci/hotzone_changed_files.sh "$BASE_SHA" "$HEAD_SHA" "${PR_NUMBER:-}"); then
            echo "::error::Could not determine the changed-file set — failing closed"
            exit 1
          fi
          printf '%s\n' "$CHANGED" > /tmp/changed-files.txt
          echo "--- Changed files ---"
          cat /tmp/changed-files.txt
          echo "---------------------"

      # -----------------------------------------------------------------
      # Step 3 — does this PR carry evidence/brief.yml at HEAD? A PR that
      # never declares a brief makes no gear claim — nothing to recompute,
      # and `harness/fable-gate` gets its default neutral publish below.
      # -----------------------------------------------------------------
      - name: Does this PR carry evidence/brief.yml?
        if: steps.kill_switch.outputs.disabled != 'true'
        id: brief
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -u
          git fetch --no-tags --depth=200 origin "$HEAD_SHA" >/dev/null 2>&1 || true
          if git cat-file -e "$HEAD_SHA:evidence/brief.yml" 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            git show "$HEAD_SHA:evidence/brief.yml" > /tmp/brief.yml
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no evidence/brief.yml at HEAD — not a harness-gated task"
          fi

      # -----------------------------------------------------------------
      # Step 4a — no brief: publish the default neutral status so
      # `harness/fable-gate` can safely be a required check without
      # bricking ordinary PRs.
      # -----------------------------------------------------------------
      - name: Publish default harness/fable-gate (no brief — not applicable)
        if: steps.kill_switch.outputs.disabled != 'true' && steps.brief.outputs.present != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=success \
            -f context='harness/fable-gate' \
            -f description='not a harness task (no evidence/brief.yml) — fable-gate not applicable' \
            > /dev/null
          echo "::notice::published default harness/fable-gate=success (no brief)"

      # -----------------------------------------------------------------
      # Step 4b — brief present: recompute the deterministic floor from the
      # diff and compare to the declared gear. FAILS (and therefore skips
      # every step below, including any fable-gate publish) if the brief
      # declares LESS than the floor — the model may only raise the gear,
      # never lower it under the floor.
      # -----------------------------------------------------------------
      - name: Recompute floor & compare to declared gear
        if: steps.kill_switch.outputs.disabled != 'true' && steps.brief.outputs.present == 'true'
        id: floor
        run: |
          set -u
          GEAR=$(python3 -c "import yaml; print(yaml.safe_load(open('/tmp/brief.yml')).get('gear',''))")
          FLOOR=$(python3 scripts/evidence_pack_lint.py --print-floor --changed-files-file /tmp/changed-files.txt)
          echo "declared gear: $GEAR — deterministic floor: $FLOOR"
          # evidence/brief.yml is PR-authored content — GEAR is attacker-controlled input.
          # Validate it is exactly one of "1"/"2"/"3" BEFORE any arithmetic or use as a
          # commit-status field, rather than let a malformed value silently coerce to 0
          # in the `(( ))` arithmetic context below.
          if [[ ! "$GEAR" =~ ^[123]$ ]]; then
            echo "::error::evidence/brief.yml 'gear' must be exactly 1, 2 or 3 — got '${GEAR}'"
            exit 1
          fi
          echo "gear=$GEAR" >> "$GITHUB_OUTPUT"
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"
          if (( GEAR < FLOOR )); then
            echo "::error::declared gear $GEAR is BELOW the deterministic floor $FLOOR (hot-zone hit) — the brief must declare gear>=$FLOOR"
            exit 1
          fi

      # -----------------------------------------------------------------
      # Step 5a — floor satisfied, but this is not a Gear-3 task: the
      # Fable verdict gate does not apply (harness-v2 §6 — Gear 2 closes
      # with an Opus verdict + AI-review + CI, Gear 1 with CI alone).
      # Publish the default neutral status so a Gear-1/2 harness task is
      # never blocked waiting on a gate it was never meant to pass through.
      # -----------------------------------------------------------------
      - name: Publish default harness/fable-gate (gear < 3 — not applicable)
        if: |
          steps.kill_switch.outputs.disabled != 'true' &&
          steps.brief.outputs.present == 'true' &&
          steps.floor.outputs.gear != '3'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GEAR: ${{ steps.floor.outputs.gear }}
        run: |
          set -u
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=success \
            -f context='harness/fable-gate' \
            -f description="gear ${GEAR} — fable-gate is Gear-3 only, not applicable" \
            > /dev/null
          echo "::notice::published default harness/fable-gate=success (gear ${GEAR} < 3)"

      # -----------------------------------------------------------------
      # Step 5b — Gear-3, floor satisfied: this workflow deliberately does
      # NOT publish anything for harness/fable-gate. It stays pending until
      # the real gate session runs scripts/harness_fable_gate.py with an
      # actual verdict — that is the entire point of the required check.
      # -----------------------------------------------------------------
      - name: Gear-3 — floor satisfied, fable-gate left for the real gate session
        if: |
          steps.kill_switch.outputs.disabled != 'true' &&
          steps.brief.outputs.present == 'true' &&
          steps.floor.outputs.gear == '3'
        run: |
          echo "::notice::gear 3 declared, floor satisfied — harness/fable-gate is intentionally NOT auto-published; scripts/harness_fable_gate.py must post a real verdict before this PR can merge"
