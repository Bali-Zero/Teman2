name: Fly.io Secrets Health Check

# Weekly check that FLY_API_TOKEN is still valid (#2 S06 self-healing)
# Deadman's switch: if THIS workflow fails (token expired), GitHub sends
# failure email to repo owner even if Telegram alert can't be sent.
on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC (~17:00 WITA)
  workflow_dispatch:      # Manual trigger for testing

jobs:
  check-fly-token:
    name: Verify FLY_API_TOKEN is valid
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check Fly.io token validity
        id: fly_check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Checking FLY_API_TOKEN validity..."
          # flyctl auth whoami is the definitive token validity test — it calls the
          # Fly API auth endpoint directly and fails with 401 if the token is expired
          # or invalid. flyctl status --app only checks app existence, which could
          # succeed even with a cached/stale response in some edge cases.
          if flyctl auth whoami 2>&1; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN is valid ✅"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN may be expired or invalid ❌"
            exit 1
          fi

      - name: Send Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          MESSAGE="⚠️ *GitHub Secrets Alert*%0A%0AFLY_API_TOKEN may be expired or invalid.%0ACheck: https://fly.io/user/personal_access_tokens%0AJob: ${{ github.run_id }}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_OWNER_CHAT_ID:-413539912}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown" || true
          echo "Telegram alert sent (or attempted)"
