name: cron - docs-inventory-refresh liveness (every 6h)

# Out-of-band check for the scheduled artifact publisher. The organ no longer
# opens a PR, so liveness is exactly "a successful run within 2x cadence".
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: docs-inventory-refresh-liveness
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLDOWN_KEY: docs-inventory-refresh-liveness-cooldown-v2
      COOLDOWN_SECONDS: "21600"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Restore cooldown state
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cooldown.state
          key: ${{ env.COOLDOWN_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.COOLDOWN_KEY }}-

      - name: Check artifact-publisher liveness
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set +e
          OUT=$(python3 scripts/docs_inventory_refresh_liveness.py \
            --repo "$REPO_SLUG" \
            --workflow docs-inventory-refresh.yml \
            --max-age-hours 24 \
            --skip-pr-check 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          {
            echo "message<<LIVENESS_MSG_EOF"
            echo "$OUT"
            echo "LIVENESS_MSG_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "overdue=false" >> "$GITHUB_OUTPUT"
          else
            echo "overdue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cooldown gate
        id: cooldown
        if: steps.check.outputs.overdue == 'true'
        run: |
          set -uo pipefail
          STATE="$RUNNER_TEMP/cooldown.state"
          touch "$STATE"
          NOW=$(date +%s)
          LAST=""
          LAST=$(grep '^overdue:' "$STATE" 2>/dev/null | tail -1 | cut -d: -f2) || LAST=""
          if [ -n "$LAST" ] && ! printf '%s' "$LAST" | grep -qE '^[0-9]+$'; then
            LAST=""
          fi
          if [ -n "$LAST" ] && [ $(( NOW - LAST )) -lt "$COOLDOWN_SECONDS" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -v '^overdue:' "$STATE" > "${STATE}.tmp" 2>/dev/null || true
          echo "overdue:${NOW}" >> "${STATE}.tmp"
          mv "${STATE}.tmp" "$STATE"
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Save cooldown state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/cooldown.state
          key: ${{ env.COOLDOWN_KEY }}-${{ github.run_id }}

      - name: Telegram alert
        if: steps.check.outputs.overdue == 'true' && steps.cooldown.outputs.send == 'true'
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          MESSAGE: ${{ steps.check.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${BOT:-}" ] || [ -z "${CHAT:-}" ]; then
            echo "::error::Telegram secrets missing; overdue alert not delivered: $MESSAGE"
            exit 1
          fi
          curl -sS -f -m 10 -X POST \
            "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            --data-urlencode "text=docs-inventory-refresh OVERDUE\n${MESSAGE}\nRun: ${RUN_URL}" \
            >/dev/null
