name: Tests & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Merge-train spec §10.2 (2026-06-12): cancel-in-progress must NOT apply to
# main — back-to-back merges were cancelling the in-flight main run, so
# commits landed on main UNTESTED and a future auto-revert guardian could
# not attribute a green→red window to a single commit. PR refs keep
# cancelling (newest push wins); every main push now runs to completion.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nuzantara_test
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Runner probe (temporary, day-0)
        run: |
          echo "arch=$(uname -m) nproc=$(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          echo "image=$ImageOS/$ImageVersion"
          free -h | head -2; df -h / | tail -1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache dependencies (uv)
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/backend-rag/requirements.lock.txt') }}

      - name: Install dependencies (uv, lock-pinned)
        run: |
          cd apps/backend-rag
          pip install --upgrade pip uv
          # requirements.lock.txt is version-pinned (==) via uv pip compile.
          # --require-hashes dropped: incompatible with editable cell-core install
          # AND with un-pinned transitive deps (e.g. cuda-toolkit) that uv resolves
          # at install time. uv remains 10-100× faster than pip even without hashes.
          # See docs/uv-migration.md.
          uv pip install --system -r requirements.lock.txt
          # Editable cell-core workspace dep (out-of-tree)
          uv pip install --system -e ../../packages/cell-core
          uv pip install --system pytest pytest-cov pytest-asyncio pytest-mock fakeredis

      - name: pip-audit
        run: |
          cd apps/backend-rag
          # Ad-hoc CI tool installs are version-pinned in requirements-ci-tools.txt
          # (Day-1 CI honesty pass, 2026-07-20) — an unpinned `pip install pip-audit`
          # silently drifts to whatever build happens to be "latest" the day CI
          # runs, which can turn a green PR red (or a red PR green) with no
          # corresponding code change.
          pip install -r requirements-ci-tools.txt
          # BUG FIXED (2026-07-20): this step used to audit requirements.txt, which
          # pip-audit RE-RESOLVES against live PyPI at audit time — that can
          # silently pick different transitive versions than what
          # `uv pip install --system -r requirements.lock.txt` actually installed
          # earlier in this same job. requirements.lock.txt (uv pip compile
          # --generate-hashes) IS the real install manifest, so audit THAT
          # instead, with --require-hashes: every entry must be pinned to an
          # exact version AND carry a matching hash, exactly as installed — and
          # (per pip-audit's own hash-pinned semantics) no re-resolution happens.
          # cell-core (-e ../../packages/cell-core) is a first-party workspace
          # package with no PyPI metadata and no hash (it's editable) — stripped
          # before handing the file to pip-audit, same rationale as before.
          # Ignored vulnerabilities documented in apps/backend-rag/.pip-audit-ignore.md
          # with rationale for each. Review that file before adding new entries.
          # NO --require-hashes (corrected premise, 2026-07-21): uv deliberately
          # leaves torch's nvidia/cuda transitive subtree UNPINNED in the lock
          # (resolved at install time — see the install step's comment), so in
          # hash mode pip fails the closure on cuda-toolkit/cuda-bindings/… no
          # matter what we pin ad-hoc. Version pins (==) still prevent the
          # re-resolution drift this step was designed to kill: pip installs
          # exactly the locked versions, and the unpinned cuda family resolves
          # the same way the install step just resolved it.
          grep -v '^-e \.\./\.\./packages/cell-core' requirements.lock.txt > /tmp/requirements-audit.txt
          pip-audit --strict --requirement /tmp/requirements-audit.txt \
            --ignore-vuln GHSA-69w3-r845-3855 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln CVE-2025-62800 \
            --ignore-vuln CVE-2025-62801 \
            --ignore-vuln GHSA-rcfx-77hg-w2wv \
            --ignore-vuln CVE-2025-69196 \
            --ignore-vuln CVE-2025-64340 \
            --ignore-vuln CVE-2026-27124 \
            --ignore-vuln CVE-2026-28684 \
            --ignore-vuln CVE-2026-40217 \
            --ignore-vuln CVE-2026-41488 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln GHSA-8jfx-5878-hv4v \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln CVE-2026-4372 \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-2290

      - name: Mypy type check (core + models)
        run: |
          cd apps/backend-rag
          pip install -r requirements-ci-tools.txt
          # Strict only on the allowlist in pyproject.toml → [[tool.mypy.overrides]].
          # Everything else is silenced by the backend.* opt-out. See FOLLOWUPS.md
          # (section "Mypy strict-module expansion") for the modules pending cleanup.
          PYTHONPATH=.:../crm-cell python -m mypy backend/core backend/app/models \
            --config-file pyproject.toml

      - name: Import chain gate
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell python -c "from backend.app.dependencies import get_current_user; print('✅ Import chain OK')"

      - name: Check LLM cost tracking coverage
        run: python scripts/check_llm_cost_tracking.py

      - name: Run core tests (fast gate — always run)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell pytest backend/tests/services/rag/test_confidence.py \
            -q -ra --no-header --tb=short --durations=10 -x \
            --junit-xml=test-results-core.xml

      - name: Bootstrap SQLModel tables
        # Router-level integration tests assume the full schema (e.g.
        # test_compliance_lkpm_readypack.py inserts into `clients`), but the
        # `clients` table has no migration file — it comes from SQLModel
        # classes in backend/app/modules/crm/models.py that are only ever
        # materialised via `SQLModel.metadata.create_all()`. Prod was
        # bootstrapped by hand long ago; CI needs this explicit step.
        # scripts/ci_bootstrap_schema.py imports the 6 table modules and
        # runs create_all against the service-container Postgres.
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          JWT_SECRET_KEY: test_jwt_secret_key_for_testing_only_min_32_chars_long
          API_KEYS: test_api_key_1,test_api_key_2
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell python scripts/ci_bootstrap_schema.py

      - name: Apply database migrations
        # After SQLModel tables exist, apply the Alembic-style migration files
        # that alter or augment them (indexes, triggers, new columns on the
        # tables we just created). Migration 114 (cognitive_layer) references
        # `clients`, which is why bootstrap must run first.
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          JWT_SECRET_KEY: test_jwt_secret_key_for_testing_only_min_32_chars_long
          API_KEYS: test_api_key_1,test_api_key_2
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell timeout 120 python -m backend.db.migrate apply-all

      - name: Run backend stability gate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test_jwt_secret_key_for_testing_only_min_32_chars_long
          API_KEYS: test_api_key_1,test_api_key_2
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell python scripts/backend_stability_gate.py

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          # Several integration tests read TEST_DATABASE_URL with a `nuzantara`
          # local-dev fallback; in CI they should hit the same Postgres
          # service container the rest of the suite uses.
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell pytest backend/tests/ \
            -q -ra --no-header --durations=10 \
            --ignore=backend/tests/e2e \
            --cov=backend \
            --cov-report=xml:coverage.xml \
            --junit-xml=test-results-unit.xml \
            --tb=short -x

      - name: Check coverage threshold
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell coverage report --fail-under=55

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: apps/backend-rag/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: |
            apps/backend-rag/test-results-*.xml
            apps/backend-rag/coverage.xml

  mcp-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install MCP dependencies
        run: |
          cd apps/nuzantara-mcp
          pip install --upgrade pip
          # The editable install of nuzantara-mcp[test] is a KNOWN legitimately-
          # optional path (git blame 9d2d7c90f5, 2026-04-12): it was flaky in CI,
          # and the fix at the time was to guarantee the actual test deps
          # (fastmcp, httpx, pytest, ...) install unconditionally on the next
          # line regardless of whether the editable install succeeds. What was
          # wrong was `2>/dev/null || true` — that made the failure SILENT. Keep
          # the degrade-path behavior, drop the silence: log loudly instead.
          if ! pip install -e ".[test]"; then
            echo "::warning title=nuzantara-mcp editable install failed::pip install -e '.[test]' failed — falling back to the explicit test-deps install on the next line (known-flaky path, see commit 9d2d7c90f5). NOT silently ignored: if the MCP package itself fails to install, test collection may still fail downstream with a confusing import error — check this warning first."
          fi
          pip install fastmcp httpx pytest pytest-asyncio pytest-mock

      - name: Run MCP tests
        run: |
          cd apps/nuzantara-mcp
          python -m pytest tests/ -q -ra --no-header --tb=short --durations=10 --junit-xml=test-results-mcp.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-test-results
          path: apps/nuzantara-mcp/test-results-mcp.xml

  frontend-tests:
    name: Frontend Tests (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        # `mouth` runs with a coverage gate (test:coverage:check). `admin-dashboard`
        # is in the matrix WITHOUT a coverage gate: it ships Vitest + RBAC/middleware
        # regression tests that were previously only run locally (Sprint 1.B scar
        # antibody), but its coverage target isn't established yet. `web` is
        # intentionally NOT in the matrix.
        include:
          - app: mouth
            coverage: true
          - app: admin-dashboard
            coverage: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install --no-fund

      - name: npm audit
        # --omit=dev: audit only what we ship to production, not the test
        # toolchain. All current high/critical advisories are in devDependencies
        # (vitest / @vitest/coverage-v8 "UI server arbitrary file read", vite,
        # esbuild) — exploitable only when running `vitest --ui` locally, never
        # in CI or prod. Without --omit=dev these dev-only advisories failed the
        # gate on EVERY PR repo-wide. Production-dependency soglia stays at high.
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

      - name: Run tests (with coverage)
        if: matrix.coverage
        run: |
          cd apps/${{ matrix.app }}
          npx vitest --run --coverage

      - name: Run tests (no coverage gate)
        if: ${{ !matrix.coverage }}
        run: |
          cd apps/${{ matrix.app }}
          npx vitest --run

      - name: Check coverage threshold
        if: matrix.coverage
        run: |
          cd apps/${{ matrix.app }}
          npm run test:coverage:check

      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          files: apps/${{ matrix.app }}/coverage/lcov.info
          flags: ${{ matrix.app }}
          name: ${{ matrix.app }}-coverage

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nuzantara_test
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies (uv, lock-pinned)
        run: |
          cd apps/backend-rag
          pip install --upgrade pip uv
          uv pip install --system -r requirements.lock.txt
          # Editable cell-core workspace dep
          uv pip install --system -e ../../packages/cell-core

      - name: Start backend (FastAPI on :8000)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY intentionally NOT set — project policy forbids
          # pay-as-you-go API keys (Max plan OAuth only, see
          # memory/feedback_claude_oauth_only.md). Backend Claude paths use
          # backend.llm.claude_oauth_client (subprocess → `claude -p`).
          # CI currently has no OAuth token injected; any test that would
          # hit a real Claude endpoint must mock it.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LANGCHAIN_TRACING_V2: "false"
          ENVIRONMENT: test
        run: |
          cd apps/backend-rag
          PYTHONPATH=. uvicorn backend.app.main:app \
            --host 0.0.0.0 --port 8000 \
            --log-level warning &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo "✅ Backend ready" && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          # Fail-open FIXED (Day-1 CI honesty, 2026-07-20): the loop above gives
          # up silently after 30 tries (60s) and falls through with exit 0 either
          # way, letting E2E run against a dead backend and fail with confusing
          # connection-refused errors instead of a clear "backend never came up".
          # Final hard gate: not-ready = red, loudly.
          curl -sf http://localhost:8000/health || { echo "❌ Backend did not become healthy after 30 attempts (60s) — failing loudly instead of running E2E against a dead backend"; exit 1; }

      - name: Install Node dependencies
        run: npm install --no-fund
        env:
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retries: 3

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NUZANTARA_API_URL: http://localhost:8000
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PIN: ${{ secrets.E2E_TEST_PIN }}
        run: |
          cd apps/mouth
          # smoke/smoke.spec.ts hardcodes kita.balizero.com/fly.dev (production smoke),
          # excluded here via grep-invert on the describe block name.
          # zantara/ and mission_simulation use process.env.PLAYWRIGHT_BASE_URL so
          # they pick up localhost:3000 correctly.
          # Only run page-load tests in CI — chat/auth/websocket tests
          # require a live LLM backend with Qdrant data, not available here.
          npx playwright test \
            --config=playwright.config.ts \
            --project=chromium \
            --ignore-snapshots \
            --reporter=list \
            --grep "page Page"

      - name: Check Playwright report
        id: playwright-report
        if: always()
        run: |
          if [ -d apps/mouth/playwright-report ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always() && steps.playwright-report.outputs.exists == 'true'
        with:
          name: playwright-report
          path: apps/mouth/playwright-report/

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, mcp-tests, frontend-tests, e2e-tests]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create test summary
        uses: actions/github-script@v9
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          MCP_RESULT: ${{ needs.mcp-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        with:
          # FAIL-OPEN FIXED (Day-1 CI honesty, 2026-07-20): this job used to
          # print a static "Passed" summary WITHOUT ever reading needs.*.result
          # — it said "✅ Passed" even when every upstream job had failed. It
          # also claimed an "80%" coverage target when the enforced gate
          # (backend-tests "Check coverage threshold" step) is 55%. Not a
          # required branch-protection context (verified via
          # `gh api repos/.../branches/main/protection/required_status_checks`,
          # 2026-07-20 — absent from the contexts list), so this failure was
          # purely cosmetic/misleading, never blocking — but misleading is
          # still a bug. Now: read the real results, state the real gate, and
          # fail loudly (core.setFailed) if anything needed did not succeed.
          script: |
            const results = {
              "Backend Tests (Python)": process.env.BACKEND_RESULT,
              "MCP Server Tests": process.env.MCP_RESULT,
              "Frontend Tests (Next.js)": process.env.FRONTEND_RESULT,
              "E2E Tests (Playwright)": process.env.E2E_RESULT,
            };

            const icon = (r) => {
              if (r === "success") return "✅";
              if (r === "skipped") return "⏭️";
              if (r === "cancelled") return "⚠️";
              return "❌";
            };

            const lines = Object.entries(results)
              .map(([name, r]) => `- ${icon(r)} ${name}: ${r}`)
              .join("\n");

            const anyFailed = Object.values(results).some(
              (r) => r === "failure" || r === "cancelled"
            );

            const summary = `
            ## ${anyFailed ? "❌" : "✅"} Test Results

            ${lines}

            ### Coverage
            - **Enforced gate**: 55% (\`coverage report --fail-under=55\`, backend-tests job)
            - Check Codecov for the full report and trend.

            ### Next Steps
            1. Review failing tests (if any)
            2. Improve coverage if below the 55% gate
            3. Check Codecov dashboard for trends
            `;

            core.summary.addRaw(summary).write();

            if (anyFailed) {
              core.setFailed(`One or more required jobs did not succeed: ${JSON.stringify(results)}`);
            }
