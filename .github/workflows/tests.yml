name: Tests & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:
  # Task #37 (2026-07-26). STRUCTURAL claim, not a snapshot of one night:
  # `cancel-in-progress: false` (below) protects a run that has already
  # STARTED — a run still QUEUED for a runner slot is superseded
  # unconditionally by the next push to the same concurrency group,
  # regardless of that setting. Under any sufficiently busy stretch, main
  # can go a long stretch with no completed test verdict even though every
  # push technically "ran" a workflow. (One specific night's measurement —
  # 28/38 recent attempts cancelled, main's last verdict over an hour
  # stale — motivated building this, but that number is a snapshot of one
  # convoy, not the justification; it had already resolved by the time
  # this shipped. Do not re-derive urgency from it later. A cure pinned to
  # tonight's world is tomorrow's bug.)
  #
  # This scheduled run is independent proof-of-health, decoupled from push
  # cadence — it runs the exact same job graph as a push/PR run (no
  # duplicated logic to drift), against whatever is on main when it fires,
  # and it gets its own concurrency group below so it never queues behind
  # — or evicts — a push-triggered run.
  #
  # Cadence: every 2h, not hourly. A full run of this job graph measured
  # ~43 minutes wall-clock on a loaded night — hourly would be a ~72% duty
  # cycle on the runners this workflow already competes for, and slots are
  # the binding constraint main's own velocity runs into (task #37's own
  # finding). Task #41's separate verdict-liveness check (see
  # main-push-failure-watch.yml) is the FAST heartbeat now — it's a cheap
  # API-only poll every 15 min, no runner-heavy job — so this run's job
  # is no longer to detect an outage quickly, only to periodically produce
  # a real full-suite verdict against main's current head (catching
  # interaction bugs invisible to per-PR testing) at a sustainable cost.
  # :17 offset dodges the top-of-hour stampede (same convention as
  # docs-inventory-refresh-liveness.yml).
  schedule:
    - cron: "17 */2 * * *"

# Merge-train spec §10.2 (2026-06-12): cancel-in-progress must NOT apply to
# main — back-to-back merges were cancelling the in-flight main run, so
# commits landed on main UNTESTED and a future auto-revert guardian could
# not attribute a green→red window to a single commit. PR refs keep
# cancelling (newest push wins); every main push now runs to completion.
#
# Task #37 addendum: a schedule-triggered run must NOT share a group with
# push-triggered main runs. `github.ref` is `refs/heads/main` for BOTH a
# push-to-main and a schedule run (schedule always fires against the
# default branch) — grouping on `github.ref` alone would put the scheduled
# run back in direct contention with push-triggered runs for the same
# runner slot, reproducing the exact starvation this run exists to work
# around. Scheduled runs get a dedicated, ref-independent group instead.
#
# cancel-in-progress is the OPPOSITE value for the scheduled group,
# deliberately: `false` is what protects a push-triggered main run (a
# started verdict should always get to report, and cancelling it on the
# next push is what silently starved main in the first place). `true` is
# correct for the scheduled group for the mirror-image reason — if a new
# scheduled run starts while the previous is still going (job overrunning
# the 2h cadence under load), the older run is testing a `main` that no
# longer exists, so the freshest run should win, not the oldest. Same
# flag, opposite correct value, because the underlying question differs:
# "protect a verdict in flight" vs "don't waste a slot re-testing a stale
# head". Do not "fix" this to match main's `false` — that was tried
# nowhere, noted here only because the asymmetry looks like a bug at a
# glance.
#
# merge_group readiness (2026-07-27): under merge_group, github.ref resolves
# to the queue's own temporary ref (refs/heads/gh-readonly-queue/...), which
# is != 'refs/heads/main' — so the expression above would evaluate to `true`
# for a queue entry, cancelling an in-flight required-check run every time a
# newer commit joined the queue (the exact starvation this block exists to
# prevent for main, just relocated to the queue). This is a composed fix, not
# the mechanical `cancel-in-progress: ${{ github.event_name != 'merge_group' }}`
# used on the other 13 required-context workflows: that blanket replacement
# would have discarded the schedule-vs-push asymmetry documented above. AND-ing
# `github.event_name != 'merge_group'` onto the existing expression preserves
# every other branch (push-to-main stays false, PR refs and schedule keep
# cancelling) and forces false only for the new merge_group case.
concurrency:
  group: tests-${{ github.event_name == 'schedule' && 'schedule-main' || github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'schedule' || github.ref != 'refs/heads/main') && github.event_name != 'merge_group' }}

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nuzantara_test
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Runner probe (temporary, day-0)
        run: |
          echo "arch=$(uname -m) nproc=$(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          echo "image=$ImageOS/$ImageVersion"
          free -h | head -2; df -h / | tail -1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache dependencies (uv)
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/backend-rag/requirements.lock.txt') }}

      - name: Install dependencies (uv, lock-pinned)
        run: |
          cd apps/backend-rag
          pip install --upgrade pip uv
          # requirements.lock.txt is version-pinned (==) via uv pip compile.
          # --require-hashes dropped: incompatible with editable cell-core install
          # AND with un-pinned transitive deps (e.g. cuda-toolkit) that uv resolves
          # at install time. uv remains 10-100× faster than pip even without hashes.
          # See docs/uv-migration.md.
          uv pip install --system -r requirements.lock.txt
          # Editable cell-core workspace dep (out-of-tree)
          uv pip install --system -e ../../packages/cell-core
          uv pip install --system pytest pytest-cov pytest-asyncio pytest-mock fakeredis

      - name: pip-audit
        run: |
          cd apps/backend-rag
          # Ad-hoc CI tool installs are version-pinned in requirements-ci-tools.txt
          # (Day-1 CI honesty pass, 2026-07-20) — an unpinned `pip install pip-audit`
          # silently drifts to whatever build happens to be "latest" the day CI
          # runs, which can turn a green PR red (or a red PR green) with no
          # corresponding code change.
          pip install -r requirements-ci-tools.txt
          # BUG FIXED (2026-07-20): this step used to audit requirements.txt, which
          # pip-audit RE-RESOLVES against live PyPI at audit time — that can
          # silently pick different transitive versions than what
          # `uv pip install --system -r requirements.lock.txt` actually installed
          # earlier in this same job. requirements.lock.txt (uv pip compile
          # --generate-hashes) IS the real install manifest, so audit THAT
          # instead, with --require-hashes: every entry must be pinned to an
          # exact version AND carry a matching hash, exactly as installed — and
          # (per pip-audit's own hash-pinned semantics) no re-resolution happens.
          # cell-core (-e ../../packages/cell-core) is a first-party workspace
          # package with no PyPI metadata and no hash (it's editable) — stripped
          # before handing the file to pip-audit, same rationale as before.
          # Ignored vulnerabilities documented in apps/backend-rag/.pip-audit-ignore.md
          # with rationale for each. Review that file before adding new entries.
          # NO --require-hashes (corrected premise, 2026-07-21): uv deliberately
          # leaves torch's nvidia/cuda transitive subtree UNPINNED in the lock
          # (resolved at install time — see the install step's comment), so in
          # hash mode pip fails the closure on cuda-toolkit/cuda-bindings/… no
          # matter what we pin ad-hoc. Version pins (==) still prevent the
          # re-resolution drift this step was designed to kill: pip installs
          # exactly the locked versions, and the unpinned cuda family resolves
          # the same way the install step just resolved it.
          grep -v '^-e \.\./\.\./packages/cell-core' requirements.lock.txt > /tmp/requirements-audit-raw.txt
          # Hash-mode auto-activation (found 2026-07-21): the lock's per-package
          # --hash lines make pip enable hash mode ALL BY THEMSELVES (any hash ⇒
          # hashes required for everything), so dropping --require-hashes was not
          # enough — the unpinned cuda subtree still failed the closure. Strip
          # the hash continuation lines and their trailing backslashes so the
          # audit runs in plain ==-pinned mode.
          sed -e '/^[[:space:]]*--hash=sha256:/d' -e 's/[[:space:]]\\$//' /tmp/requirements-audit-raw.txt > /tmp/requirements-audit.txt
          pip-audit --strict --requirement /tmp/requirements-audit.txt \
            --ignore-vuln GHSA-69w3-r845-3855 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln CVE-2025-62800 \
            --ignore-vuln CVE-2025-62801 \
            --ignore-vuln GHSA-rcfx-77hg-w2wv \
            --ignore-vuln CVE-2025-69196 \
            --ignore-vuln CVE-2025-64340 \
            --ignore-vuln CVE-2026-27124 \
            --ignore-vuln CVE-2026-28684 \
            --ignore-vuln CVE-2026-40217 \
            --ignore-vuln CVE-2026-41488 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln GHSA-8jfx-5878-hv4v \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln CVE-2026-4372 \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-2290

      - name: Mypy type check (core + models)
        run: |
          cd apps/backend-rag
          pip install -r requirements-ci-tools.txt
          # Strict only on the allowlist in pyproject.toml → [[tool.mypy.overrides]].
          # Everything else is silenced by the backend.* opt-out. See FOLLOWUPS.md
          # (section "Mypy strict-module expansion") for the modules pending cleanup.
          PYTHONPATH=.:../crm-cell python -m mypy backend/core backend/app/models \
            --config-file pyproject.toml

      - name: Import chain gate
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell python -c "from backend.app.dependencies import get_current_user; print('✅ Import chain OK')"

      - name: Check LLM cost tracking coverage
        run: python scripts/check_llm_cost_tracking.py

      - name: Run core tests (fast gate — always run)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell pytest backend/tests/services/rag/test_confidence.py \
            -q -ra --no-header --tb=short --durations=10 -x \
            --junit-xml=test-results-core.xml

      - name: Bootstrap SQLModel tables
        # Router-level integration tests assume the full schema (e.g.
        # test_compliance_lkpm_readypack.py inserts into `clients`), but the
        # `clients` table has no migration file — it comes from SQLModel
        # classes in backend/app/modules/crm/models.py that are only ever
        # materialised via `SQLModel.metadata.create_all()`. Prod was
        # bootstrapped by hand long ago; CI needs this explicit step.
        # scripts/ci_bootstrap_schema.py imports the 6 table modules and
        # runs create_all against the service-container Postgres.
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          JWT_SECRET_KEY: test_jwt_secret_key_for_testing_only_min_32_chars_long
          API_KEYS: test_api_key_1,test_api_key_2
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell python scripts/ci_bootstrap_schema.py

      - name: Apply database migrations
        # After SQLModel tables exist, apply the Alembic-style migration files
        # that alter or augment them (indexes, triggers, new columns on the
        # tables we just created). Migration 114 (cognitive_layer) references
        # `clients`, which is why bootstrap must run first.
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          JWT_SECRET_KEY: test_jwt_secret_key_for_testing_only_min_32_chars_long
          API_KEYS: test_api_key_1,test_api_key_2
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell timeout 120 python -m backend.db.migrate apply-all

      - name: Run backend stability gate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          INTAKE_TEST_DSN: postgresql://test:test@localhost:5432/nuzantara_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test_jwt_secret_key_for_testing_only_min_32_chars_long
          API_KEYS: test_api_key_1,test_api_key_2
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell python scripts/backend_stability_gate.py

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          # Several integration tests read TEST_DATABASE_URL with a `nuzantara`
          # local-dev fallback; in CI they should hit the same Postgres
          # service container the rest of the suite uses.
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          # Intake router/writer integration tests intentionally use a dedicated
          # opt-in DSN. Point it at the same disposable CI database instead of
          # their local-dev fallback (`nuzantara_dev`), which skipped 50 tests.
          INTAKE_TEST_DSN: postgresql://test:test@localhost:5432/nuzantara_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell pytest \
            backend/tests/ \
            tests/test_sentry_lazy_import.py \
            tests/test_sentry_pii_redaction.py \
            tests/kb/test_politics_hierarchical.py \
            -q -ra --no-header --durations=10 \
            --ignore=backend/tests/e2e \
            --cov=backend \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --junit-xml=test-results-unit.xml \
            --tb=short -x

      - name: Check coverage threshold
        run: |
          cd apps/backend-rag
          PYTHONPATH=.:../crm-cell coverage report --fail-under=55

      - name: Upload coverage to Codecov
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/backend-rag/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: |
            apps/backend-rag/test-results-*.xml
            apps/backend-rag/coverage.xml

  mcp-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install MCP dependencies
        run: |
          cd apps/nuzantara-mcp
          pip install --upgrade pip
          # The editable install of nuzantara-mcp[test] is a KNOWN legitimately-
          # optional path (git blame 9d2d7c90f5, 2026-04-12): it was flaky in CI,
          # and the fix at the time was to guarantee the actual test deps
          # (fastmcp, httpx, pytest, ...) install unconditionally on the next
          # line regardless of whether the editable install succeeds. What was
          # wrong was `2>/dev/null || true` — that made the failure SILENT. Keep
          # the degrade-path behavior, drop the silence: log loudly instead.
          if ! pip install -e ".[test]"; then
            echo "::warning title=nuzantara-mcp editable install failed::pip install -e '.[test]' failed — falling back to the explicit test-deps install on the next line (known-flaky path, see commit 9d2d7c90f5). NOT silently ignored: if the MCP package itself fails to install, test collection may still fail downstream with a confusing import error — check this warning first."
          fi
          pip install fastmcp httpx pytest pytest-asyncio pytest-mock

      - name: Run MCP tests with branch coverage
        run: |
          cd apps/nuzantara-mcp
          CI=true ./scripts/test-coverage.sh

      - name: Upload MCP coverage to Codecov
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/nuzantara-mcp/coverage.xml
          flags: mcp
          name: mcp-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-test-results
          path: |
            apps/nuzantara-mcp/test-results-mcp.xml
            apps/nuzantara-mcp/coverage.xml

  evaluator-critical-tests:
    name: Evaluator Critical Tests
    runs-on: ubuntu-latest
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-cov httpx

      - name: Run evaluator critical tests with branch coverage
        run: |
          PYTHONPATH=. python -m pytest \
            apps/evaluator/cep/test_run_cep.py \
            apps/evaluator/nlm_deep_research/tests/test_circuit_breaker.py \
            -q \
            --cov=apps.evaluator.cep.run_cep \
            --cov=apps.evaluator.nlm_deep_research.circuit_breaker \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:apps/evaluator/coverage.xml \
            --cov-fail-under=85 \
            --junit-xml=apps/evaluator/test-results-evaluator.xml

      - name: Upload evaluator coverage to Codecov
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/evaluator/coverage.xml
          flags: evaluator-critical
          name: evaluator-critical-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluator-critical-test-results
          path: |
            apps/evaluator/test-results-evaluator.xml
            apps/evaluator/coverage.xml

  frontend-tests:
    name: Frontend Tests (Next.js)
    runs-on: ubuntu-latest
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    timeout-minutes: 10

    strategy:
      matrix:
        # `mouth` runs with a coverage gate (test:coverage:check). `admin-dashboard`
        # is in the matrix WITHOUT a coverage gate: it ships Vitest + RBAC/middleware
        # regression tests that were previously only run locally (Sprint 1.B scar
        # antibody), but its coverage target isn't established yet. `web` is
        # intentionally NOT in the matrix.
        include:
          - app: mouth
            coverage: true
          - app: admin-dashboard
            coverage: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install --no-fund

      - name: npm audit
        # --omit=dev: audit only what we ship to production, not the test
        # toolchain. All current high/critical advisories are in devDependencies
        # (vitest / @vitest/coverage-v8 "UI server arbitrary file read", vite,
        # esbuild) — exploitable only when running `vitest --ui` locally, never
        # in CI or prod. Without --omit=dev these dev-only advisories failed the
        # gate on EVERY PR repo-wide. Production-dependency soglia stays at high.
        #
        # Temporary waiver (2026-07-24, owner-approved, REMOVE when patched
        # versions ship): 3 advisories with NO patched release available —
        # every installed version is already the latest published:
        #   GHSA-frvp-7c67-39w9  @hono/node-server path traversal (Windows-only %5C)
        #   GHSA-9mqv-5hh9-4cgg  @hono/node-server WebSocket aborted-handshake mem-leak
        #   GHSA-c96f-x56v-gq3h  find-my-way HTTP2 DDoS
        # Reachability: @hono/node-server enters via @modelcontextprotocol/sdk
        # (used for its optional HTTP transport; our MCP servers run stdio) and
        # find-my-way via @prisma/dev (local dev tooling). Audit runs JSON mode
        # and fails only on high/critical advisories NOT in the waiver set.
        run: |
          npm audit --audit-level=high --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          python3 - "$RUNNER_TEMP/audit.json" <<'PY'
          import json, sys
          WAIVE = {"GHSA-frvp-7c67-39w9", "GHSA-9mqv-5hh9-4cgg", "GHSA-c96f-x56v-gq3h"}
          data = json.load(open(sys.argv[1]))
          bad = []
          for name, vuln in (data.get("vulnerabilities") or {}).items():
              if vuln.get("severity") not in ("high", "critical"):
                  continue
              ids = {
                  str(x.get("url", "")).rsplit("/", 1)[-1]
                  for x in vuln.get("via", [])
                  if isinstance(x, dict)
              }
              if not ids <= WAIVE:
                  bad.append((name, vuln.get("severity"), sorted(ids)))
          if bad:
              print("npm audit: non-waived high/critical vulnerabilities found:")
              for row in bad:
                  print("  ", row)
              sys.exit(1)
          print("npm audit: only waived advisories present — gate OK")
          PY
        continue-on-error: false

      - name: Run tests (with coverage)
        if: matrix.coverage
        run: |
          cd apps/${{ matrix.app }}
          npx vitest --run --coverage

      - name: Run tests (no coverage gate)
        if: ${{ !matrix.coverage }}
        run: |
          cd apps/${{ matrix.app }}
          npx vitest --run

      - name: Check coverage threshold
        if: matrix.coverage
        run: |
          cd apps/${{ matrix.app }}
          npm run test:coverage:check

      # WS4 governance: `packages/core` is the shared design-system (tokens,
      # ThemeProvider, SystemPulse, ComplianceRadar, FactBadge, …) that every
      # workspace/portal page renders through. It shipped 33 test files / 123
      # tests that NO workflow ever executed: apps/mouth's vitest config scopes
      # `include` to `src/**`, and packages/core/vitest.config.ts had no caller.
      # Built, never armed (cicatrix-superscar #2) — a green CI was asserting
      # nothing about the components WS2/WS3 landed.
      #
      # Deliberately a STEP of the already-required `Frontend Tests (Next.js)
      # (mouth, true)` leg, NOT a new job or matrix entry: branch protection
      # pins required contexts by NAME, so a new name would be born unrequired
      # and would need a settings change nobody would make (W69 — required
      # checks disarmed). Attaching here means it gates from the merge onward.
      #
      # `cd packages/core` resolves vitest/jsdom/@vitejs/plugin-react upward
      # from the ROOT node_modules (verified: nothing is nested under
      # apps/mouth, and packages/core/node_modules holds no packages), so the
      # existing root `npm install` above is all the setup it needs. No
      # coverage gate: packages/core has no established coverage target yet —
      # same posture as the admin-dashboard leg.
      - name: Run packages/core tests (shared design-system suite)
        if: matrix.app == 'mouth'
        run: |
          cd packages/core
          npx vitest --run

      - name: Upload coverage
        if: ${{ matrix.coverage && env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/${{ matrix.app }}/coverage/lcov.info
          flags: ${{ matrix.app }}
          name: ${{ matrix.app }}-coverage

      - name: Upload frontend coverage artifact
        if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.app }}-coverage
          path: apps/${{ matrix.app }}/coverage/

  wa-dashboard-tests:
    name: WA Dashboard Tests
    runs-on: ubuntu-latest
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/wa-dashboard/package.json

      - name: Install WA Dashboard dependencies
        run: |
          cd apps/wa-dashboard
          npm install --no-fund

      - name: Type-check WA Dashboard
        run: |
          cd apps/wa-dashboard
          npm run typecheck

      - name: Run WA Dashboard coverage gate
        run: |
          cd apps/wa-dashboard
          npm run test:coverage

      - name: Upload WA Dashboard coverage to Codecov
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/wa-dashboard/coverage/lcov.info
          flags: wa-dashboard
          name: wa-dashboard-coverage

      - name: Upload WA Dashboard coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wa-dashboard-coverage
          path: apps/wa-dashboard/coverage/

  packages-core-tests:
    name: Shared Core Package Tests
    runs-on: ubuntu-latest
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lock-pinned workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run shared core coverage gate
        run: npm run test:coverage -w packages/core

      - name: Upload shared core coverage to Codecov
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info
          flags: packages-core
          name: packages-core-coverage

      - name: Upload shared core coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages-core-coverage
          path: packages/core/coverage/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nuzantara_test
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies (uv, lock-pinned)
        run: |
          cd apps/backend-rag
          pip install --upgrade pip uv
          uv pip install --system -r requirements.lock.txt
          # Editable cell-core workspace dep
          uv pip install --system -e ../../packages/cell-core

      - name: Start backend (FastAPI on :8000)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nuzantara_test
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY intentionally NOT set — project policy forbids
          # pay-as-you-go API keys (Max plan OAuth only, see
          # memory/feedback_claude_oauth_only.md). Backend Claude paths use
          # backend.llm.claude_oauth_client (subprocess → `claude -p`).
          # CI currently has no OAuth token injected; any test that would
          # hit a real Claude endpoint must mock it.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Backend Settings requires JWT_SECRET_KEY at import (pydantic). It was
          # missing here for a long time: the uvicorn process died instantly and
          # the old fail-open wait loop masked it — E2E "passed" against a dead
          # backend on main (proven 2026-07-21: 30/30 waits + 41 passed). The
          # fail-loud health gate below exposed the corpse; this is the cure.
          JWT_SECRET_KEY: test_jwt_secret_key_for_testing_only_min_32_chars_long
          # Next required-var in the Settings chain (same class as JWT_SECRET_KEY
          # above, found 2026-07-21 after the JWT fix): API_KEYS, same test values
          # the other backend jobs in this file already use.
          API_KEYS: test_api_key_1,test_api_key_2
          LANGCHAIN_TRACING_V2: "false"
          ENVIRONMENT: test
        run: |
          cd apps/backend-rag
          PYTHONPATH=. uvicorn backend.app.main:app \
            --host 0.0.0.0 --port 8000 \
            --log-level warning &
          # Wait for backend to be ready
          backend_ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "✅ Backend ready"
              backend_ready=true
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          # Fail-open FIXED (Day-1 CI honesty, 2026-07-20): the loop above gives
          # up silently after 30 tries (60s) and falls through with exit 0 either
          # way, letting E2E run against a dead backend and fail with confusing
          # connection-refused errors instead of a clear "backend never came up".
          # Final hard gate: not-ready = red, loudly. Gated on the flag the
          # loop above already computed rather than a 31st probe — re-probing
          # would leave `backend_ready` set and never read (SC2034), and a
          # variable nothing reads is how a check quietly stops being one.
          if [ "$backend_ready" != "true" ]; then
            echo "❌ Backend did not become healthy after 30 attempts (60s) — failing loudly instead of running E2E against a dead backend"
            exit 1
          fi

      - name: Install Node dependencies
        run: npm install --no-fund
        env:
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retries: 3

      - name: E2E specs must collect with no credentials present
        # Playwright IMPORTS every spec file to build its test list — including the
        # ones the --grep below excludes from running. Until 2026-07-27 seven specs
        # read the E2E credential at module scope (`const CONFIG = { email:
        # e2eEmail() }`), so collection threw wherever the secrets are absent, and
        # the whole job died with "0 tests in 0 files". Absent is not hypothetical:
        # GitHub withholds repository secrets from Dependabot, so this required
        # check was permanently unpassable for every dependency update — which is
        # exactly how a poisoned pin reaches prod behind green checks (W98).
        # The credentials are emptied ON PURPOSE even when they exist: a guard that
        # only runs where the thing it guards against cannot happen is decorative.
        env:
          E2E_TEST_EMAIL: ""
          E2E_TEST_PIN: ""
        run: |
          cd apps/mouth
          # Errexit-immune capture (W101): a bare assignment aborts before the check.
          out=$(npx playwright test --config=playwright.config.ts --list 2>&1) || {
            echo "❌ E2E collection failed with the credentials absent."
            echo "   A spec is reading E2E_TEST_EMAIL/PIN at module scope; make it lazy"
            echo "   (a getter, or move the read inside the test) — see e2e/support/credentials.ts."
            echo "$out"
            exit 1
          }
          echo "$out" | tail -1
          # Non-vacuity: "collected nothing" and "collected everything cleanly" both exit 0.
          echo "$out" | grep -qE "Total: [1-9][0-9]* tests" || {
            echo "❌ collection reported no tests — a green here would be vacuous"
            echo "$out" | tail -20
            exit 1
          }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NUZANTARA_API_URL: http://localhost:8000
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PIN: ${{ secrets.E2E_TEST_PIN }}
        run: |
          cd apps/mouth
          # smoke/smoke.spec.ts hardcodes kita.balizero.com/fly.dev (production smoke),
          # so --grep keeps its tests out of this run. "Excluded" means excluded from
          # RUNNING, never from being IMPORTED — Playwright loads every spec to build
          # the list. That distinction is why the step above exists: a file --grep
          # skips can still fail the job at module scope.
          # zantara/ and mission_simulation use process.env.PLAYWRIGHT_BASE_URL so
          # they pick up localhost:3000 correctly.
          # Run deterministic page-load smoke tests plus the explicitly mocked
          # @offline journeys. Live chat/websocket tests still require Qdrant
          # and an LLM backend, so they remain outside this PR gate.
          npx playwright test \
            --config=playwright.config.ts \
            --project=chromium \
            --ignore-snapshots \
            --reporter=list \
            --grep "page Page|@offline"

      - name: Check Playwright report
        id: playwright-report
        if: always()
        run: |
          if [ -d apps/mouth/playwright-report ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always() && steps.playwright-report.outputs.exists == 'true'
        with:
          name: playwright-report
          path: apps/mouth/playwright-report/

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - mcp-tests
      - evaluator-critical-tests
      - frontend-tests
      - wa-dashboard-tests
      - packages-core-tests
      - e2e-tests
    if: always()
    timeout-minutes: 10

    steps:
      - name: Create test summary
        uses: actions/github-script@v9
        env:
          # One entry per job in `needs:` — the two lists are load-bearing
          # together. A job present in `needs:` but absent here reaches the
          # script as `undefined`: it renders ❌ while `anyFailed` (which tests
          # for "failure"/"cancelled") ignores it, so the summary would show a
          # red row and still pass. That is the same class of lying gate the
          # comment below describes, arriving through the back door.
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          MCP_RESULT: ${{ needs.mcp-tests.result }}
          EVALUATOR_RESULT: ${{ needs.evaluator-critical-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          WA_DASHBOARD_RESULT: ${{ needs.wa-dashboard-tests.result }}
          PACKAGES_CORE_RESULT: ${{ needs.packages-core-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        with:
          # FAIL-OPEN FIXED (Day-1 CI honesty, 2026-07-20): this job used to
          # print a static "Passed" summary WITHOUT ever reading needs.*.result
          # — it said "✅ Passed" even when every upstream job had failed. It
          # also claimed an "80%" coverage target when the enforced gate
          # (backend-tests "Check coverage threshold" step) is 55%. Not a
          # required branch-protection context (verified via
          # `gh api repos/.../branches/main/protection/required_status_checks`,
          # 2026-07-20 — absent from the contexts list), so this failure was
          # purely cosmetic/misleading, never blocking — but misleading is
          # still a bug. Now: read the real results, state the real gate, and
          # fail loudly (core.setFailed) if anything needed did not succeed.
          script: |
            const results = {
              "Backend (Python)": process.env.BACKEND_RESULT,
              "MCP server": process.env.MCP_RESULT,
              "Evaluator critical": process.env.EVALUATOR_RESULT,
              "Frontend matrix": process.env.FRONTEND_RESULT,
              "WA Dashboard": process.env.WA_DASHBOARD_RESULT,
              "Shared core package": process.env.PACKAGES_CORE_RESULT,
              "E2E page-load smoke": process.env.E2E_RESULT,
            };

            const icon = (r) => {
              if (r === "success") return "✅";
              if (r === "skipped") return "⏭️";
              if (r === "cancelled") return "⚠️";
              return "❌";
            };

            const lines = Object.entries(results)
              .map(([name, r]) => `- ${icon(r)} ${name}: ${r}`)
              .join("\n");

            const anyFailed = Object.values(results).some(
              (r) => r === "failure" || r === "cancelled"
            );

            const summary = `
            ## ${anyFailed ? "❌" : "✅"} Test Results

            ${lines}

            ### Coverage
            - **Enforced gate**: 55% (\`coverage report --fail-under=55\`, backend-tests job)
            - Check Codecov for the full report and trend.

            ### Next Steps
            1. Review failing tests (if any)
            2. Improve coverage if below the 55% gate
            3. Check Codecov dashboard for trends
            `;

            core.summary.addRaw(summary).write();

            if (anyFailed) {
              core.setFailed(`One or more required jobs did not succeed: ${JSON.stringify(results)}`);
            }
