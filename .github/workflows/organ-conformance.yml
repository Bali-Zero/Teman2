name: Organ conformance (DNA genome — genes at birth)

# DNA/GENOME mutation 2026-07-06 (research/operations/2026-07-06-dna-self-healing-genome.md):
# every launchd/cron organ must be BORN with the self-healing genes
# (infra/organ-conformance/genes.json). A NEW plist missing applicable genes
# FAILS; a grandfathered organ fails only on REGRESSION beyond its recorded
# baseline. The healer discovers organs from the registry — this gate is what
# makes that discovery trustworthy for every future organ.
#
# SENTINEL PATTERN (W69, same as guard-conformance.yml): NO top-level
# pull_request paths filter — the workflow always triggers on PR so it can
# become a REQUIRED check without the pending-forever trap. The relevant-paths
# decision lives inside the job; on a path-miss PR the job ends success.
#
# ARMING NOTE (operator): making this a required status check on main is a
# branch-protection change — operator-only, tracked in modus PENDING-ARMS.

on:
  pull_request: # NO top-level paths: — always trigger (sentinel gates the work)
  merge_group:
  push:
    branches: [main]
    paths:
      - "infra/organ-conformance/**"
      - "infra/launchagents/**"
      - "infra/healer/**"
      - "infra/home-fork/declared-pairs.json"
      - "apps/organism/organism/organs_registry.yaml"
      - "scripts/organ_birth.py"
      - "scripts/lint_plist_keepalive.py"
      - "scripts/healer_receptor_registry.py"
      # The subject of test_gene_g2_heartbeat_fires.py. Without it a
      # wrapper-only edit could break the heartbeat and never run the corpus
      # that proves it — armed for the wrong trigger is the under-match half of
      # cicatrix family #3.
      - "scripts/nb-curator-daily.sh"
      # The G2 gene's implementation. Must be in BOTH filters: this one decides
      # whether the workflow RUNS on a push to main at all, the `git diff`
      # pathspec inside the job only decides whether its steps do any work. A
      # path listed in the second but not the first is armed for pull_request
      # (which has no top-level paths) and silently skipped post-merge.
      - "scripts/lib/heartbeat.sh"
      # The library's OTHER reader. `test_the_writers_vocabulary_matches_its_readers`
      # reads this file's classifier branches directly, so a PR that changes only
      # the classifier — the exact edit that could stop recognising a word the
      # writer still emits — triggered the workflow (no top-level PR paths) and
      # then skipped pytest, and after merge did not trigger it at all. Round 7.
      - "scripts/sentinel-aggregate.py"
      # The RECEPTOR side of the same contract the G2 gene writes. Its corpus
      # (scripts/tests/test_organism_stale_detector.py, 44 cases) was named by NO
      # workflow — it executed only inside the `scripts/tests/` sweep, which is
      # continue-on-error and therefore green by construction (the shape this
      # very gate exists to catch, W108). Armed here on 2026-08-22 with the fix
      # that found it: the reader could not see status="warning", which is what
      # three organs write. proprioception.py is listed because the severity
      # split lives in TWO files and is only true if both agree.
      - "scripts/organism_stale_detector.py"
      - "scripts/proprioception.py"
      - "scripts/tests/test_organism_stale_detector.py"
      - ".github/workflows/organ-conformance.yml"
      # GUARD_READ_SET from test_organ_heartbeat_exceeds_poller_interval.py:
      # a bridge-fed organ's expected_hb_seconds must stay >= 3x the bridge's
      # poll interval, and that invariant can regress via ANY of these four
      # files — not just the registry entry above. A new organ_id added to
      # the bridge with too-low a registry threshold touches only
      # scripts/launchagent-state-bridge.py, never organs_registry.yaml.
      # Found live 2026-08-31: this guard existed, ran clean locally, and was
      # named by NO workflow (cicatrix #2, Esiste≠Armato — the same defect
      # class W108 fixed for a different corpus). Must also be in the in-job
      # pathspec below, or armed here and silently skipped there (or the
      # reverse) — test_organ_heartbeat_workflow_wiring.py asserts both
      # lists cover this set so the correspondence is calculated, not
      # hand-maintained.
      - "scripts/tests/test_organ_heartbeat_exceeds_poller_interval.py"
      - "scripts/tests/test_organ_heartbeat_workflow_wiring.py"
      - "scripts/launchagent-state-bridge.py"
      - "scripts/tests/fixtures/organ_heartbeat_cadence/com.nuzantara.launchagent-state-bridge.plist.fixture"
      # GUARD_READ_SET from test_self_reporting_cron_own_plist_margin.py: the
      # sibling guard, for the DISJOINT population of type:cron organs that
      # write their OWN heartbeat (excluded from the bridge's organ set
      # above) — expected_hb_seconds must stay a safe multiple of the
      # organ's OWN plist StartInterval. Its other two inputs
      # (organs_registry.yaml above, and every tracked plist via the
      # '*.plist'/'**/*.plist' entries below) are already covered; only its
      # own test files need a new literal entry.
      # test_self_reporting_cron_workflow_wiring.py asserts both this list
      # and the in-job pathspec below cover this set.
      - "scripts/tests/test_self_reporting_cron_own_plist_margin.py"
      - "scripts/tests/test_self_reporting_cron_workflow_wiring.py"

concurrency:
  # Dependabot branch: ALL Dependabot PRs share one group per workflow (not
  # per-ref), bounding concurrent Dependabot runs of THIS workflow to <=2
  # (Agent PR Contract rule 5) instead of unbounded parallel.
  # cancel-in-progress:false protects whichever run is RUNNING; GitHub keeps
  # only one PENDING per group, so a 3rd+ near-simultaneous arrival cancels
  # the pending run rather than queuing behind it — visible in the PR's
  # checks tab (never silent), recoverable with `gh run rerun` (confirmed:
  # docs.github.com/en/actions/using-jobs/using-concurrency + kimi-code/k3
  # refuter round on PR #5043). Non-Dependabot branch is byte-for-byte the
  # pre-existing expression — untouched.
  group: ${{ github.actor == 'dependabot[bot]' && format('dependabot-lockfile-{0}', github.workflow) || format('organ-conformance-{0}', github.ref) }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'merge_group' }}

jobs:
  conformance:
    name: Every organ is born with its genes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the path-diff sees the PR base
          # blob:none — partial clone: every commit and tree, no file contents (fetched on
          # demand). `fetch-depth: 0` is KEPT, so this gate's `git diff --name-only` resolves
          # exactly as before; only blob DELIVERY becomes lazy. Measured on this repository:
          # a full clone moves 2,289 MB, blob:none moves 23.3 MB in 21s.
          # Not a tidy-up: on 2026-07-27 this same checkout ate 297s of a 300s job budget in
          # adversarial-review-gate and 597s of 600s in P6 and was KILLED, so those gates never
          # ran. A timeout kill reports `cancelled`, and a cancelled REQUIRED check EJECTS the
          # merge-queue entry, which then sits open with auto-merge off. See #3375 for the
          # measurement and for why the flag's presence in the fetch log — not a green check —
          # is the proof (an unsupported input is silently ignored by Actions).
          filter: blob:none

      - name: Did organ surfaces change?
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # merge_group readiness (2026-07-27): the old guard only special-cased
          # "push" — under merge_group, BASE/HEAD (pull_request.* fields) are
          # empty, `git diff --name-only "" ""` failed, and a blind `|| true`
          # swallowed that failure into hit=false, skipping every gate step
          # while still reporting SUCCESS (silent-green, cicatrix family #2).
          # Fix mirrors the proven fail-open sentinel (verify-the-verifiers.yml
          # and siblings): ANY non-pull_request event runs the full gate, and a
          # pull_request event with an unusable diff now fails CLOSED instead of
          # pretending nothing changed.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::non-PR event ($EVENT_NAME) — running full organ-conformance gate"
            exit 0
          fi
          if [[ -z "$BASE" || -z "$HEAD" ]]; then
            echo "::error::pull_request event with empty BASE/HEAD sha — cannot compute diff, failing closed"
            exit 1
          fi
          # `scripts/lib/heartbeat.sh` is in this list because it IS the G2 gene's
          # implementation: test_gene_g2_heartbeat_fires.py exercises it directly
          # (and only this job installs the zsh those cases need). Without the
          # entry, a PR touching only the library ran none of its own corpus —
          # which is how a zsh-fatal `local status=` sat in it undetected.
          # GUARD_READ_SET from test_organ_heartbeat_exceeds_poller_interval.py
          # (below): a bridge-fed organ's expected_hb_seconds must stay >= 3x
          # the bridge's poll interval. Must be in BOTH this pathspec and the
          # push.paths list above — test_organ_heartbeat_workflow_wiring.py
          # asserts the correspondence so it is calculated, not remembered.
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- \
            'infra/organ-conformance/' 'infra/home-fork/declared-pairs.json' \
            'apps/organism/organism/organs_registry.yaml' \
            'scripts/organ_birth.py' 'scripts/lint_plist_keepalive.py' \
            'scripts/healer_receptor_registry.py' 'scripts/nb-curator-daily.sh' \
            'scripts/lib/heartbeat.sh' 'scripts/sentinel-aggregate.py' \
            'scripts/organism_stale_detector.py' 'scripts/proprioception.py' \
            'scripts/tests/test_organism_stale_detector.py' \
            '.github/workflows/organ-conformance.yml' \
            'scripts/tests/test_organ_heartbeat_exceeds_poller_interval.py' \
            'scripts/tests/test_organ_heartbeat_workflow_wiring.py' \
            'scripts/launchagent-state-bridge.py' \
            'scripts/tests/fixtures/organ_heartbeat_cadence/com.nuzantara.launchagent-state-bridge.plist.fixture' \
            'scripts/tests/test_self_reporting_cron_own_plist_margin.py' \
            'scripts/tests/test_self_reporting_cron_workflow_wiring.py' \
            '*.plist' '**/*.plist' \
            'infra/launchagents/' 'infra/healer/')
          if [ -n "$CHANGED" ]; then
            echo "organ surfaces changed:"; echo "$CHANGED"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "no organ surface changed — sentinel success"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.relevant.outputs.hit == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test deps
        if: steps.relevant.outputs.hit == 'true'
        run: pip install --quiet pytest pyyaml

      - name: Gate — check_organ_conformance
        if: steps.relevant.outputs.hit == 'true'
        run: |
          set -euo pipefail
          python3 infra/organ-conformance/check_organ_conformance.py

      - name: The receptor still reads what the organs write
        if: steps.relevant.outputs.hit == 'true'
        run: |
          set -euo pipefail
          # Named explicitly, NOT left to the `scripts/tests/` sweep — that sweep
          # is continue-on-error, so a corpus parked there is green by
          # construction and proves nothing (W108). Until 2026-08-22 these 44
          # cases had NO named executor, and the defect they now pin sat live:
          # the reader's vocabulary held {failed,fail,degraded,error} while three
          # organs wrote status="warning", so their sidecars said nothing at all.
          # The G2 gene above proves an organ WRITES its heartbeat; this proves
          # somebody can still READ it. Both halves, or the channel is decorative.
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest \
            scripts/tests/test_organism_stale_detector.py -q

      - name: An organ cannot beat faster than its bridge's poller
        if: steps.relevant.outputs.hit == 'true'
        run: |
          set -uo pipefail
          # Named explicitly, NOT left to the `scripts/tests/` sweep — that
          # sweep is continue-on-error, so a corpus parked there is green by
          # construction and gates nothing (cicatrix #2, Esiste≠Armato).
          # Found live 2026-08-31: this exact guard sat unnamed by any
          # workflow until this step was added — it ran clean locally and
          # gated nothing in CI. Runs AFTER "Install test deps" above (same
          # `hit`-gated job), which is what actually installs pytest/pyyaml
          # into this runner's interpreter — a step placed before it would
          # die on "No module named pytest", not on a real test failure.
          #
          # Two files: the arithmetic guard itself (expected_hb_seconds >=
          # 3x the bridge's poll interval for every bridge-fed organ), and
          # the wiring guard that asserts THIS workflow's own push.paths +
          # in-job pathspec actually cover the arithmetic guard's read-set —
          # so the correspondence added above cannot silently drift out of
          # date again.
          OUT=$(PYTHONDONTWRITEBYTECODE=1 python3 -m pytest \
            scripts/tests/test_organ_heartbeat_exceeds_poller_interval.py \
            scripts/tests/test_organ_heartbeat_workflow_wiring.py -q 2>&1) && EXIT=0 || EXIT=$?
          echo "$OUT"
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::pytest exited $EXIT — see output above"
            exit 1
          fi
          # A bare exit-code-0 is NOT proof these guards actually ran and
          # passed: pytest exits 0 when every case is deliberately skipped
          # too (measured the hard way on a sibling guard the same day,
          # test_queue_doctor.py — #5438 — cost a round for exactly this).
          # This suite always carries exactly 4 must-pass cases
          # (test_bridge_fed_organs_declare_a_safe_multiple_of_the_poller_interval
          # plus this file's three wiring assertions) plus 1 legitimate skip
          # in CI (the fixture/live-snapshot drift check — the live snapshot
          # is only ever observable on Pro's own live checkout). Assert on
          # the PASS count so a regression that turned every case into a
          # skip (or a silently-empty collection) cannot read as green.
          #
          # CORRECTED 2026-08-31 (codex-gpt-5.6-sol, this PR's own council
          # round): an earlier draft here scanned the WHOLE output blob for
          # every `\d+ passed` occurrence — if that substring ever appeared
          # more than once (a warning line, a future assertion message that
          # happens to contain the same shape), `PASSED` became multi-line,
          # `[ "$PASSED" -lt 3 ]` errored ("integer expression expected")
          # instead of comparing, `[` returned non-zero either way, and the
          # `if` body was skipped — a SILENT PASS on a value this check could
          # not actually parse. Reproduced live against a synthetic two-match
          # string before landing this fix. Anchored fix: take only the
          # LAST line matching pytest's own summary shape (that line is
          # always exactly one occurrence of the leading count, on the run
          # path below — a real failure already exits via $EXIT above before
          # reaching this code, so "failed" never precedes "passed" here).
          SUMMARY_LINE=$(printf '%s\n' "$OUT" | grep -E '^[0-9]+ (passed|failed|error|skipped|warning)' | tail -1)
          if [ -z "$SUMMARY_LINE" ]; then
            echo "::error::no pytest summary line found in the captured output — cannot verify how many cases passed"
            exit 1
          fi
          if ! printf '%s\n' "$SUMMARY_LINE" | grep -qE '^[0-9]+ passed\b'; then
            echo "::error::pytest's summary line does not start with '<N> passed' — got: $SUMMARY_LINE (this is exactly the regression this check exists to catch: an exit-0 run with zero passing cases, e.g. everything skipped)"
            exit 1
          fi
          PASSED=$(printf '%s\n' "$SUMMARY_LINE" | grep -oE '^[0-9]+')
          if [ "$PASSED" -lt 4 ]; then
            echo "::error::expected at least 4 passed (got $PASSED) from summary line: $SUMMARY_LINE — pytest exiting 0 is not proof these guards ran: this suite legitimately SKIPS 1 case in CI (the fixture/live-snapshot drift check, live snapshot absent off Pro) but must PASS the other 4"
            exit 1
          fi

      - name: A self-reporting cron cannot beat faster than its own plist
        if: steps.relevant.outputs.hit == 'true'
        run: |
          set -uo pipefail
          # Sibling of "An organ cannot beat faster than its bridge's
          # poller" above, for the DISJOINT population: type:cron organs
          # that write their OWN heartbeat (excluded from the bridge's
          # organ set, not fed by its 300s poller). Named explicitly for
          # the same reason as its sibling — a corpus left to the
          # continue-on-error `scripts/tests/` sweep gates nothing.
          #
          # Two files: the arithmetic guard (expected_hb_seconds >= a
          # severity-tiered multiple of the organ's own plist
          # StartInterval), and its wiring guard (asserts THIS workflow's
          # push.paths + in-job pathspec actually cover the arithmetic
          # guard's read-set). Unlike its sibling, this suite has NO
          # legitimate skip case (no DR-mirror fixture involved) — every
          # tracked plist is read directly, so a bare exit-0 with the
          # expected fixed pass count (9: 6 in the arithmetic file incl.
          # guilt/innocence units, 3 in the wiring file) is real proof,
          # same anchored-parsing discipline as above (last summary line,
          # not a whole-output substring scan).
          OUT=$(PYTHONDONTWRITEBYTECODE=1 python3 -m pytest \
            scripts/tests/test_self_reporting_cron_own_plist_margin.py \
            scripts/tests/test_self_reporting_cron_workflow_wiring.py -q 2>&1) && EXIT=0 || EXIT=$?
          echo "$OUT"
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::pytest exited $EXIT — see output above"
            exit 1
          fi
          SUMMARY_LINE=$(printf '%s\n' "$OUT" | grep -E '^[0-9]+ (passed|failed|error|skipped|warning)' | tail -1)
          if [ -z "$SUMMARY_LINE" ]; then
            echo "::error::no pytest summary line found in the captured output — cannot verify how many cases passed"
            exit 1
          fi
          if ! printf '%s\n' "$SUMMARY_LINE" | grep -qE '^[0-9]+ passed\b'; then
            echo "::error::pytest's summary line does not start with '<N> passed' — got: $SUMMARY_LINE (this is exactly the regression this check exists to catch: an exit-0 run with zero passing cases, e.g. everything skipped)"
            exit 1
          fi
          PASSED=$(printf '%s\n' "$SUMMARY_LINE" | grep -oE '^[0-9]+')
          if [ "$PASSED" -lt 9 ]; then
            echo "::error::expected at least 9 passed (got $PASSED) from summary line: $SUMMARY_LINE — this suite has no legitimate skip case, so anything less than the full count is a real regression"
            exit 1
          fi

      - name: Baseline is a one-way ratchet (panel round-2)
        if: steps.relevant.outputs.hit == 'true'
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python3 infra/organ-conformance/check_baseline_ratchet.py --base origin/main

      # test_gene_g2_heartbeat_fires.py runs a real `#!/bin/zsh` wrapper end to
      # end — it proves the heartbeat gene FIRES and carries the run's real
      # verdict, which the regex-based gate cannot see. zsh is not guaranteed on
      # the runner image, and a missing interpreter must not turn that proof
      # into a skip: install it explicitly, then assert it is there.
      - name: Require zsh (the G2 corpus executes a real zsh wrapper)
        if: steps.relevant.outputs.hit == 'true'
        run: |
          # Bounded + fail-closed via the shared helper — see its header for the
          # measurement. Unbounded here, this step ate the job's whole 10-minute
          # budget twice and the kill surfaced as `cancelled`, which for a
          # REQUIRED context reads as "not green" with no cause named anywhere.
          bash scripts/ci/apt_install.sh zsh zsh

      # test_the_id_whitelist_is_ascii_not_collation needs a locale that actually
      # COLLATES: `LC_ALL=it_IT.UTF-8` does not create it, and where it is absent
      # bash warns, falls back to C, and the test passes with the defect restored.
      # The test now runs a control experiment and fails closed — this step is what
      # keeps that control satisfiable on a runner image we do not control.
      - name: Generate the UTF-8 locale the collation test measures under
        if: steps.relevant.outputs.hit == 'true'
        run: |
          set -euo pipefail
          if ! locale -a | grep -qi '^it_IT.utf-\?8$'; then
            bash scripts/ci/apt_install.sh - locales
            sudo locale-gen it_IT.UTF-8
            sudo update-locale
          fi
          locale -a | grep -i '^it_IT.utf-\?8$'

      - name: Gate proves guilt AND innocence (own test suites)
        if: steps.relevant.outputs.hit == 'true'
        run: |
          set -euo pipefail
          python3 -m pytest infra/organ-conformance/ -q

      - name: Registry still validates (checksum + invariants)
        if: steps.relevant.outputs.hit == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=apps/organism python3 -m organism.tools.validate_organs_registry \
            apps/organism/organism/organs_registry.yaml
