name: r19-wrapper-census-tests

# Executes scripts/mouth/tests: the offline replay of the /kbli* R19 wrapper
# token census (scripts/mouth/r19_wrapper_token_census.py) against its
# contract (docs/specs/2026-10-08-kbli-r19-wrapper-token-contract.md), with
# guilt and innocence. Mission kbli-nav-design-loop, lot W0. Not a required
# context. Lot W1 arms the live census in apps/mouth as the `wrapper-census-live`
# job (src/test/r19-wrapper.test.ts, `npm test -- r19-wrapper`), with the guilt
# and innocence fixtures. Lot W0c adds `wrapper-census-states`: the whole live
# census, its state walk and the opened-surface walk of contract section 8.4
# (search, drawer, inspector, modals, API stubbed from a fixture), plus the
# browser guilt and innocence tests. On origin/main it asserts that every capture
# and every surface opened, that every shared component outside /kbli* kept its
# pinned paint and that no touched shared file lacks a pin (section 8.5, lot W0d-1),
# and prints the counts, among them the grounds read by the pixels and by the
# painters, at rest and opened, and where the two disagree (lot W0d-2); W2'''
# asserts them at 0. A W0d lot changes no file under apps/mouth/src, and
# census-replay checks that on its branch (spec SPEC-W0d §5). Since lot W0d-3a
# the live census runs in parts, one `wrapper-census-part` job each, and
# `wrapper-census-states` judges their dumps together (contract section 9).

on:
  pull_request:
    paths:
      - "scripts/mouth/**"
      - "docs/specs/2026-10-08-kbli-r19-wrapper-token-contract.md"
      - ".github/workflows/r19-wrapper-census-tests.yml"
      - "apps/mouth/**"
      - "packages/core/**"
      - ".claude/skills/design/strumenti/measure.py"
  workflow_dispatch:
    inputs:
      parts:
        description: 'The census parts, a JSON list; ["full"] runs the whole census in one job, as before W0d-3a'
        type: string
        default: '["rest","kbli","explorer","shared"]'

permissions:
  contents: read

jobs:
  census-replay:
    runs-on: ubuntu-latest
    # The floor is the checkout (~2 min on this repo), not the 1-second replay.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the base: the W0d fence diffs the two.
          fetch-depth: 2
      - name: A W0d census lot changes no file under apps/mouth/src
        if: github.event_name == 'pull_request' && contains(github.head_ref, '/kbli-r19-w0d')
        run: |
          n=$(git diff --name-only HEAD^1 HEAD | grep -c '^apps/mouth/src' || true)
          echo "files changed under apps/mouth/src: $n"
          test "$n" -eq 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Replay the census against the contract
        run: python -m pytest scripts/mouth/tests -q -p no:cacheprovider

  wrapper-census-live:
    runs-on: ubuntu-latest
    # npm install + the Chromium shell + a cold `next dev --webpack` compile of five pages.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-workspace-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm install --no-fund
      - name: Install the Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
      - name: Live census, palette guard, guilt and innocence fixtures
        working-directory: apps/mouth
        run: npm test -- r19-wrapper

  wrapper-census-part:
    runs-on: ubuntu-latest
    # One part of the live census (contract section 9) on its own cold `next dev --webpack`, after npm
    # install and the Chromium shell. `rest` takes the 30 captures (a screenshot per scroll position of
    # every page in six states) and the 10-walk state pass; `kbli` and `explorer` the 25 opened surfaces
    # of their pages; `shared` the 24 shared-component walks. A part that fails or runs out of time
    # dumps nothing, and the aggregate reads its scenarios as missing.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts || '["rest","kbli","explorer","shared"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-workspace-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm install --no-fund
      - name: Install Playwright for Python and its Chromium headless shell
        run: |
          python -m pip install --quiet pytest "playwright==1.60.0"
          timeout 600 python -m playwright install --with-deps --only-shell chromium
          shell=$(find "$HOME/.cache/ms-playwright" -path '*chromium_headless_shell-*' -name chrome-headless-shell -type f | sort | tail -1)
          test -x "$shell"
          echo "CHROME_HEADLESS=$shell" >> "$GITHUB_ENV"
      - name: Live census, this part's scenarios (starts and stops its own dev server)
        env:
          PART: ${{ matrix.part }}
          CENSUS_DEV_LOG: ${{ runner.temp }}/part/next-dev-${{ matrix.part }}.log
        run: |
          mkdir -p "$RUNNER_TEMP/part"
          part=()
          [ "$PART" = full ] || part=(--part "$PART")
          # The verdict is the aggregate's; a part prints its own scenarios only, and its phase-seconds on stderr.
          python scripts/mouth/r19_wrapper_token_census.py --port 3519 --diff-base HEAD "${part[@]}" \
            --json "$RUNNER_TEMP/part/census-$PART.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: census-part-${{ matrix.part }}
          path: ${{ runner.temp }}/part/
          if-no-files-found: error
          retention-days: 7
      # After the census, so a red here never costs the aggregate this part's scenarios.
      - name: Browser guilt and innocence of the opened-surface walk
        if: matrix.part == 'explorer'
        run: python -m pytest scripts/mouth/tests -q -p no:cacheprovider -k "e2e"

  wrapper-census-states:
    needs: wrapper-census-part
    # Every part's dump judged as one census: a part that failed still reaches here, as missing scenarios.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # shared-touched-unpinned diffs the merge commit against its first parent, the base.
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download the parts' dumps
        uses: actions/download-artifact@v8
        with:
          pattern: census-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/parts
      - name: The parts judged as one census, against the one scenario list
        env:
          # A dispatch has no base to diff: it reads the working tree only.
          DIFF_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
        run: |
          set -o pipefail
          shopt -s nullglob
          cat /dev/null "$RUNNER_TEMP"/parts/*.jsonl > "$RUNNER_TEMP/census.jsonl"
          python scripts/mouth/r19_wrapper_token_census.py --replay "$RUNNER_TEMP/census.jsonl" \
            --diff-base "$DIFF_BASE" | tee "$RUNNER_TEMP/census.txt"
      - name: Every scenario received, every capture and every surface opened, every shared component pinned and unchanged
        env:
          PARTS_RESULT: ${{ needs.wrapper-census-part.result }}
        run: |
          fail=0
          for want in "scenarios-off-manifest: 0" "captures: 30 ok, 0 failed" "opened-surfaces: 25 ok, 0 failed" \
                      "shared-touched-unpinned: 0" "shared-component-drift: 0"; do
            if grep -Fxq "$want" "$RUNNER_TEMP/census.txt"; then
              echo "ok: $want"
            else
              echo "::error::the census did not print '$want'"
              fail=1
            fi
          done
          if [ "$PARTS_RESULT" != success ]; then
            echo "::error::wrapper-census-part concluded '$PARTS_RESULT': a part, or the browser tests, did not pass"
            fail=1
          fi
          grep -E '^(scenarios-|read-but-undefined|colors-outside|state-rows-unseen|state-colors-off|page-grounds|opened-|ground-resolver|shared-)' "$RUNNER_TEMP/census.txt" || true
          if [ "$fail" -ne 0 ]; then
            grep -E '^  (missing|twice|unexpected): ' "$RUNNER_TEMP/census.txt" || true
            grep -E '^  (capture-failed|walk-failed|shared-failed):|^  [a-z-]+ [a-z]+/[a-z-]+: failed:' "$RUNNER_TEMP/census.txt" || true
            grep -E '^  [-+?] |^  (apps|packages)/' "$RUNNER_TEMP/census.txt" || true
            for log in "$RUNNER_TEMP"/parts/next-dev-*.log; do
              [ -f "$log" ] && { echo "== $log"; tail -40 "$log"; }
            done
          fi
          exit "$fail"
