name: Hook innocence gate (vaccine)

# THE VACCINE'S TEETH. opus-mythos hooks TAC 2026-06-16: a 3-part census found
# that all 7 command-matching Claude Code hooks shipped with ZERO innocence
# tests, violating the superscar #3 antidote — "nessuna _guard_* mergiata senza
# un test di innocenza". The over-match cancer (guardrail patterns using `.*`
# greedy that clobber legitimate commands) is the symptom. This gate is the
# structural cure: no edit to a hook merges unless it PROVES it does not bite an
# innocent (false positive) AND still catches real danger (no blindness).
#
# Runs:
#   - infra/claude-hooks/test_hook_innocence.py   (the vaccine — all command hooks)
#   - infra/claude-hooks/test_block_regex.py      (worktree_isolation BLOCKED_SUBCMD_RE)
#   - infra/claude-hooks/test_host_boundary.py    (host_boundary carve-out)
#   - infra/claude-hooks/test_phase.py            (plan-phase detection)
#   - infra/claude-hooks/test_w79_shell_write.py  (W79 shell-write detection)
#   - infra/claude-hooks/test_data_plane_guard.py (data-plane guard, incl. a
#     .claude/settings.json wiring assertion — a settings-only regression
#     that breaks the matcher/command now fails this gate too)
#   - scripts/test_guardrails_core_overmatch.py   (guardrails python-c over-match)
#
# SENTINEL PATTERN (W69, copied from verify-the-verifiers.yml): NO top-level
# pull_request `paths:` filter — the workflow ALWAYS triggers on PR so it can be
# a REQUIRED status check without the pending-forever trap (a paths-filtered
# required check never reports on a path-miss PR and blocks merge). The
# relevant-paths decision lives in the "Did hooks change?" step; the work is
# gated on its output. On a path-miss PR the job ENDS success (sentinel). The
# push trigger keeps a paths filter (push only fires when work is needed).

on:
  pull_request: # NO top-level paths: — always trigger (sentinel gates the work)
  push:
    branches: [main]
    paths:
      - "infra/claude-hooks/**"
      - "scripts/hooks/**"
      - "scripts/guardrails_static_core.py"
      - "scripts/test_guardrails_overmatch.py"
      - "scripts/test_guardrails_core_overmatch.py"
      - "scripts/guardrails_sync_check.py"
      - ".claude/settings.json"
      - ".github/workflows/hook-innocence-gate.yml"

concurrency:
  # Dependabot branch: ALL Dependabot PRs share one group per workflow (not
  # per-ref), bounding concurrent Dependabot runs of THIS workflow to <=2
  # (Agent PR Contract rule 5) instead of unbounded parallel.
  # cancel-in-progress:false protects whichever run is RUNNING; GitHub keeps
  # only one PENDING per group, so a 3rd+ near-simultaneous arrival cancels
  # the pending run rather than queuing behind it — visible in the PR's
  # checks tab (never silent), recoverable with `gh run rerun` (confirmed:
  # docs.github.com/en/actions/using-jobs/using-concurrency + kimi-code/k3
  # refuter round on PR #5043). Non-Dependabot branch is byte-for-byte the
  # pre-existing expression — untouched.
  group: ${{ github.actor == 'dependabot[bot]' && format('dependabot-lockfile-{0}', github.workflow) || format('hook-innocence-gate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'merge_group' }}

jobs:
  innocence:
    name: Prove hooks bite only the guilty
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the path-diff sees the PR base
          # blob:none — partial clone: every commit and tree, no file contents (fetched on
          # demand). `fetch-depth: 0` is KEPT, so this gate's `git diff --name-only` resolves
          # exactly as before; only blob DELIVERY becomes lazy. Measured on this repository:
          # a full clone moves 2,289 MB, blob:none moves 23.3 MB in 21s.
          # Not a tidy-up: on 2026-07-27 this same checkout ate 297s of a 300s job budget in
          # adversarial-review-gate and 597s of 600s in P6 and was KILLED, so those gates never
          # ran. A timeout kill reports `cancelled`, and a cancelled REQUIRED check EJECTS the
          # merge-queue entry, which then sits open with auto-merge off. See #3375 for the
          # measurement and for why the flag's presence in the fetch log — not a green check —
          # is the proof (an unsupported input is silently ignored by Actions).
          filter: blob:none

      # W69 sentinel: decide whether hook-relevant paths changed in this PR.
      # Dependency-free git diff (no third-party action). On push (already
      # paths-filtered at the trigger) or any non-PR event, run=true.
      - name: Did hooks change?
        id: relevant
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::non-PR event (${{ github.event_name }}) — running full vaccine"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE \
            '^(infra/claude-hooks/|scripts/hooks/|scripts/guardrails_static_core\.py|scripts/test_guardrails_overmatch\.py|scripts/test_guardrails_core_overmatch\.py|scripts/guardrails_sync_check\.py|\.claude/settings\.json|\.github/workflows/hook-innocence-gate\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no hook paths changed — sentinel success"
          fi

      - name: Set up Python
        if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Innocence vaccine — all command-matching hooks
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "::group::test_hook_innocence.py (THE VACCINE)"
          python3 infra/claude-hooks/test_hook_innocence.py
          echo "::endgroup::"

      - name: Guardrails drift sentinel self-check
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "::group::guardrails_sync_check.py (drift sentinel — CI has no live hook, validates core block is extractable)"
          # On a CI runner there is no ~/.claude/hooks/guardrails-static.py, so the
          # sentinel exits 0 with "nothing to compare". This still proves the core's
          # BLOCK_PATTERNS literal is parseable and the sentinel itself runs clean.
          python3 scripts/guardrails_sync_check.py --hook /nonexistent/hook.py
          echo "::endgroup::"

      - name: Existing hook regression tests
        if: steps.relevant.outputs.run == 'true'
        run: |
          set -euo pipefail
          fail=0
          for t in \
            infra/claude-hooks/test_block_regex.py \
            infra/claude-hooks/test_host_boundary.py \
            infra/claude-hooks/test_phase.py \
            infra/claude-hooks/test_w79_shell_write.py \
            infra/claude-hooks/test_data_plane_guard.py \
            scripts/test_guardrails_overmatch.py \
            scripts/test_guardrails_core_overmatch.py ; do
            if [ -f "$t" ]; then
              echo "::group::$t"
              if python3 "$t"; then echo "PASS $t"; else echo "::error::FAIL $t"; fail=1; fi
              echo "::endgroup::"
            else
              echo "::notice::skip (absent) $t"
            fi
          done
          exit $fail

      - name: Sentinel success (no hook paths changed)
        if: steps.relevant.outputs.run != 'true'
        run: echo "No hook files changed in this PR — vaccine not required. Sentinel pass."
