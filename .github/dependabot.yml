# Dependabot security updates — weekly, grouped, auto-merge patch
version: 2
updates:
  # Python backend
  - package-ecosystem: "pip"
    directory: "/apps/backend-rag"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major"]
      # datasets==4.8.5 caps fsspec at <=2026.2.0; a group bump that raises
      # fsspec past the cap makes the WHOLE minor-and-patch group unsatisfiable
      # (uv resolver error -> one failed install cascades into 4 red required
      # checks; see closed group PR #2062). Drop this ignore when datasets
      # raises its fsspec ceiling - dependabot will then move the pair together.
      - dependency-name: "fsspec"
        versions: [">2026.2.0"]
    groups:
      # OpenAI-stack packages isolated into their own group so a breaking bump
      # (openai/langchain-openai sit near the frozen embedding path:
      # text-embedding-3-small / 1536-dim / 93,283 vectors, CLAUDE.md sec.9)
      # only fails a small, individually-mergeable PR instead of the whole
      # batch. Both groups still receive minor+patch — nothing is ignored.
      # (see closed PR #935: 60-pkg group failed 4 required checks as a unit)
      openai-stack:
        patterns:
          - "openai"
          - "langchain*"
          - "tiktoken"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch:
        exclude-patterns:
          - "openai"
          - "langchain*"
          - "tiktoken"
        update-types:
          - "minor"
          - "patch"

  # Node.js frontend
  - package-ecosystem: "npm"
    directory: "/apps/mouth"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    ignore:
      # lucide-react majors are not safely auto-mergeable here. This is an
      # npm-workspaces monorepo with a single hoisted root package-lock.json,
      # but Dependabot bumps only apps/mouth/package.json, leaving the lock
      # (and the hashFiles-keyed node_modules cache) at the old version. The
      # mouth vitest runner inlines packages/core, so vite's import-analysis
      # resolver fails on the bare `lucide-react` import when declared != lock,
      # breaking the required Frontend (mouth) check (see closed PR #956). Bump
      # majors deliberately with a synced root lockfile. Mirrors the
      # torch / sentence-transformers semver-major ignore in the pip block.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
