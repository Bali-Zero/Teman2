# Dependabot security updates — weekly, grouped, auto-merge patch
version: 2
updates:
  # Python backend
  - package-ecosystem: "pip"
    directory: "/apps/backend-rag"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major"]
      # datasets==4.8.5 caps fsspec at <=2026.2.0; a group bump that raises
      # fsspec past the cap makes the WHOLE minor-and-patch group unsatisfiable
      # (uv resolver error -> one failed install cascades into 4 red required
      # checks; see closed group PR #2062). Drop this ignore when datasets
      # raises its fsspec ceiling - dependabot will then move the pair together.
      - dependency-name: "fsspec"
        versions: [">2026.2.0"]
      # presidio 2.2.363 REGRESSED its cryptography ceiling to <47.0.0 —
      # colliding with OUR deliberate CVE floor cryptography>=48.0.1
      # (requirements.txt, GHSA-537c-gmf6-5ccf; prod lock runs 49.x fine with
      # presidio 2.2.362). Root cause of the whole #2084/#2267/#2318
      # ResolutionImpossible saga. Corrected 2026-07-12 (same Zero decision,
      # right patient: an earlier iteration wrongly held cryptography back,
      # which would have blocked OUR security bumps). Drop when a presidio
      # release supports cryptography>=48.
      - dependency-name: "presidio-analyzer"
        versions: [">=2.2.363"]
      - dependency-name: "presidio-anonymizer"
        versions: [">=2.2.363"]
      # requirements.txt:152 deliberately ceilings protobuf <6.0.0 (OTEL /
      # google-cloud-aiplatform compat, see the comment there). grpcio-status
      # >=1.82 requires protobuf>=7.35, so any grpc-family bump makes the
      # whole group ResolutionImpossible again (regenerated PR #2267 failed
      # exactly there after the cryptography hold fixed the first conflict).
      # The grpc family only moves TOGETHER with a deliberate protobuf major
      # bump — drop these ignores in that PR.
      - dependency-name: "grpcio"
      - dependency-name: "grpcio-status"
      - dependency-name: "grpcio-tools"
      - dependency-name: "grpcio-health-checking"
      # Dependabot's pip lock updater bumps each package independently and
      # does NOT honor sibling version pins, so leader/follower pairs break
      # the lock when the follower moves alone. The five holds below were
      # isolated by locally resolving group PR #2328's locks with uv
      # (2026-07-13): reverting exactly these five bumps makes BOTH
      # requirements.lock.txt and requirements-prod.lock.txt resolve.
      - dependency-name: "websockets"
        versions: [">=16.0.0"] # langgraph-sdk (latest 0.4.2) pins websockets<16
      - dependency-name: "pdfplumber"
        # 0.11.10 exact-pins pdfminer.six==20260107, but pdfminer's date
        # versioning reads as semver-major so it can never join this
        # minor-and-patch group - bump the pdfplumber+pdfminer.six pair deliberately
        versions: [">=0.11.10"]
      # exact-pin pair: pydantic==X requires pydantic-core==Y - a solo bump
      # of EITHER breaks the lock (#2328 bumped core to 2.47.0 against
      # pydantic 2.13.4's ==2.46.4). Bump the pair deliberately.
      - dependency-name: "pydantic"
      - dependency-name: "pydantic-core"
      - dependency-name: "mpmath"
        versions: [">=1.4.0"] # sympy (latest 1.14.0) pins mpmath<1.4
      - dependency-name: "tokenizers"
        versions: [">0.23.0"] # transformers 4.57.x pins tokenizers<=0.23.0
    groups:
      # OpenAI-stack packages isolated into their own group so a breaking bump
      # (openai/langchain-openai sit near the frozen embedding path:
      # text-embedding-3-small / 1536-dim / 93,283 vectors, CLAUDE.md sec.9)
      # only fails a small, individually-mergeable PR instead of the whole
      # batch. Both groups still receive minor+patch — nothing is ignored.
      # (see closed PR #935: 60-pkg group failed 4 required checks as a unit)
      openai-stack:
        patterns:
          - "openai"
          - "langchain*"
          - "tiktoken"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch:
        exclude-patterns:
          - "openai"
          - "langchain*"
          - "tiktoken"
        update-types:
          - "minor"
          - "patch"

  # Node.js frontend
  #
  # directory MUST stay "/" — this is an npm-workspaces monorepo whose single
  # hoisted package-lock.json lives at the root. Pointed at "/apps/mouth" (as it
  # was until 2026-07-16) Dependabot can see that workspace's package.json but
  # NOT the root lock, so every PR it opened bumped the manifest and left the
  # lock behind. Four majors landed that way (#2384/#2385/#2386/#2387) and broke
  # `npm ci` on main for days; the only jobs that run `npm ci` are non-required,
  # so nothing went red that anyone had to look at. From "/" Dependabot resolves
  # the workspace tree and updates the manifest AND the root lock in one PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    ignore:
      # lucide-react majors are not safely auto-mergeable here: the mouth vitest
      # runner inlines packages/core, so vite's import-analysis resolver fails on
      # the bare `lucide-react` import when declared != lock (closed PR #956).
      #
      # NOTE 2026-07-16: the *desync* half of that old rationale is now fixed at
      # the root (directory "/" above + the required `npm lock honors manifest`
      # gate), so this ignore no longer carries the structural cure — it is now
      # just an ordinary "icon-library majors get a human" hold, mirroring the
      # torch / sentence-transformers semver-major ignore in the pip block. It
      # was ALSO the scar: scoping the fix to one dependency instead of the class
      # is exactly why the disease came back through four other packages. Do not
      # add per-package ignores here to paper over a lock desync — fix the lock.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
