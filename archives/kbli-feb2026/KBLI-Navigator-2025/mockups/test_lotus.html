<!DOCTYPE html>
<html>
<head>
<style>
body { background: #2a2a2a; display: flex; justify-content: center; align-items: center; min-height: 100vh; gap: 60px; }
.box { background: linear-gradient(160deg, rgba(62,62,62,0.95), rgba(44,44,44,0.98)); border-radius: 20px; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.label { color: #ccc; font-family: system-ui; font-size: 14px; }
</style>
</head>
<body>

<div class="box">
  <svg width="120" height="120" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Petal gradients - deep purple to soft blue -->
      <radialGradient id="ptOuter" cx="0.5" cy="0.3" r="0.7">
        <stop offset="0%" stop-color="#7c6bf5" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#4338ca" stop-opacity="0.3"/>
      </radialGradient>
      <radialGradient id="ptMid" cx="0.5" cy="0.2" r="0.8">
        <stop offset="0%" stop-color="#8b7cf6"/>
        <stop offset="60%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#4f46e5"/>
      </radialGradient>
      <radialGradient id="ptInner" cx="0.5" cy="0.15" r="0.85">
        <stop offset="0%" stop-color="#a78bfa"/>
        <stop offset="40%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#5b21b6"/>
      </radialGradient>
      <radialGradient id="ptCenter" cx="0.5" cy="0.1" r="0.9">
        <stop offset="0%" stop-color="#c4b5fd"/>
        <stop offset="30%" stop-color="#a78bfa"/>
        <stop offset="70%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#6d28d9"/>
      </radialGradient>
      <!-- Glow -->
      <radialGradient id="baseGlow" cx="0.5" cy="0.85" r="0.4">
        <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
      </radialGradient>
      <filter id="softGlow">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="innerLight">
        <feGaussianBlur stdDeviation="1.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    
    <!-- Ambient glow behind -->
    <ellipse cx="100" cy="140" rx="60" ry="20" fill="url(#baseGlow)"/>
    
    <g filter="url(#softGlow)">
      <!-- LAYER 1: Far back petals (most transparent, widest spread) -->
      <!-- Far left -->
      <path d="M100 130 C85 110, 30 95, 22 70 C18 55, 28 40, 42 50 C55 60, 80 100, 100 130Z" fill="url(#ptOuter)" opacity="0.5"/>
      <!-- Far right -->
      <path d="M100 130 C115 110, 170 95, 178 70 C182 55, 172 40, 158 50 C145 60, 120 100, 100 130Z" fill="url(#ptOuter)" opacity="0.5"/>
      
      <!-- LAYER 2: Back petals -->
      <!-- Left back -->
      <path d="M100 130 C88 108, 42 85, 35 58 C30 40, 42 28, 55 40 C65 50, 85 95, 100 130Z" fill="url(#ptMid)" opacity="0.65"/>
      <!-- Right back -->
      <path d="M100 130 C112 108, 158 85, 165 58 C170 40, 158 28, 145 40 C135 50, 115 95, 100 130Z" fill="url(#ptMid)" opacity="0.65"/>
      
      <!-- LAYER 3: Mid petals -->
      <!-- Left mid -->
      <path d="M100 130 C92 105, 55 72, 50 42 C47 25, 58 18, 68 30 C76 42, 90 90, 100 130Z" fill="url(#ptInner)" opacity="0.75"/>
      <!-- Right mid -->
      <path d="M100 130 C108 105, 145 72, 150 42 C153 25, 142 18, 132 30 C124 42, 110 90, 100 130Z" fill="url(#ptInner)" opacity="0.75"/>

      <!-- LAYER 4: Inner petals -->
      <!-- Left inner -->
      <path d="M100 130 C95 105, 68 60, 65 32 C63 18, 72 12, 80 24 C86 35, 94 85, 100 130Z" fill="url(#ptCenter)" opacity="0.85"/>
      <!-- Right inner -->
      <path d="M100 130 C105 105, 132 60, 135 32 C137 18, 128 12, 120 24 C114 35, 106 85, 100 130Z" fill="url(#ptCenter)" opacity="0.85"/>
      
      <!-- LAYER 5: Center petal -->
      <path d="M100 130 C97 100, 82 50, 82 28 C82 12, 92 5, 100 5 C108 5, 118 12, 118 28 C118 50, 103 100, 100 130Z" fill="url(#ptCenter)" opacity="0.95"/>
    </g>
    
    <!-- Petal edge highlights (subtle light catching) -->
    <path d="M100 130 C85 110, 30 95, 22 70" stroke="rgba(196,181,253,0.2)" stroke-width="0.8" fill="none"/>
    <path d="M100 130 C115 110, 170 95, 178 70" stroke="rgba(196,181,253,0.2)" stroke-width="0.8" fill="none"/>
    <path d="M100 130 C92 105, 55 72, 50 42" stroke="rgba(196,181,253,0.15)" stroke-width="0.6" fill="none"/>
    <path d="M100 130 C108 105, 145 72, 150 42" stroke="rgba(196,181,253,0.15)" stroke-width="0.6" fill="none"/>
    <path d="M82 28 C82 12, 92 5, 100 5 C108 5, 118 12, 118 28" stroke="rgba(224,215,254,0.25)" stroke-width="0.7" fill="none"/>
    
    <!-- Inner light spots on center petal -->
    <g filter="url(#innerLight)">
      <ellipse cx="100" cy="40" rx="4" ry="6" fill="#c4b5fd" opacity="0.2"/>
      <ellipse cx="96" cy="65" rx="3" ry="5" fill="#a5b4fc" opacity="0.15"/>
      <ellipse cx="104" cy="55" rx="2.5" ry="4" fill="#c4b5fd" opacity="0.12"/>
      <ellipse cx="100" cy="85" rx="3.5" ry="6" fill="#a5b4fc" opacity="0.1"/>
    </g>
    
    <!-- Tiny sparkle highlights -->
    <circle cx="92" cy="30" r="1.2" fill="#e0e7ff" opacity="0.5"/>
    <circle cx="108" cy="35" r="1" fill="#e0e7ff" opacity="0.4"/>
    <circle cx="100" cy="18" r="1.5" fill="#ede9fe" opacity="0.6"/>
    <circle cx="70" cy="42" r="0.8" fill="#c4b5fd" opacity="0.3"/>
    <circle cx="130" cy="40" r="0.8" fill="#c4b5fd" opacity="0.3"/>
  </svg>
  <div class="label">Version A — Organic Radial</div>
</div>

<div class="box">
  <svg width="120" height="120" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="pB1" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#a78bfa"/>
        <stop offset="50%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#4f46e5"/>
      </linearGradient>
      <linearGradient id="pB2" x1="0.3" y1="0" x2="0.7" y2="1">
        <stop offset="0%" stop-color="#818cf8"/>
        <stop offset="100%" stop-color="#4338ca"/>
      </linearGradient>
      <linearGradient id="pB3" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#c4b5fd"/>
        <stop offset="40%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#6d28d9"/>
      </linearGradient>
      <linearGradient id="pB4" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#ddd6fe"/>
        <stop offset="30%" stop-color="#a78bfa"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </linearGradient>
      <radialGradient id="bgGlow2" cx="0.5" cy="0.7" r="0.5">
        <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="transparent"/>
      </radialGradient>
      <filter id="sG2"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="tG2"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    
    <ellipse cx="100" cy="145" rx="50" ry="15" fill="url(#bgGlow2)"/>
    
    <g filter="url(#sG2)">
      <!-- Far side petals - drooping elegantly -->
      <path d="M100 135 C80 120, 20 110, 15 80 C12 60, 30 55, 40 65 C50 75, 85 115, 100 135Z" fill="url(#pB2)" opacity="0.45"/>
      <path d="M100 135 C120 120, 180 110, 185 80 C188 60, 170 55, 160 65 C150 75, 115 115, 100 135Z" fill="url(#pB2)" opacity="0.45"/>
      
      <!-- Mid-outer petals -->
      <path d="M100 135 C86 112, 38 80, 32 48 C28 28, 45 22, 56 35 C65 48, 88 100, 100 135Z" fill="url(#pB1)" opacity="0.6"/>
      <path d="M100 135 C114 112, 162 80, 168 48 C172 28, 155 22, 144 35 C135 48, 112 100, 100 135Z" fill="url(#pB1)" opacity="0.6"/>
      
      <!-- Mid petals - elegant curve -->
      <path d="M100 135 C92 108, 58 62, 55 30 C53 15, 65 8, 75 22 C82 33, 93 90, 100 135Z" fill="url(#pB3)" opacity="0.78"/>
      <path d="M100 135 C108 108, 142 62, 145 30 C147 15, 135 8, 125 22 C118 33, 107 90, 100 135Z" fill="url(#pB3)" opacity="0.78"/>
      
      <!-- Inner petals -->  
      <path d="M100 135 C96 108, 74 55, 72 26 C70 10, 82 4, 90 16 C95 26, 97 88, 100 135Z" fill="url(#pB4)" opacity="0.88"/>
      <path d="M100 135 C104 108, 126 55, 128 26 C130 10, 118 4, 110 16 C105 26, 103 88, 100 135Z" fill="url(#pB4)" opacity="0.88"/>
      
      <!-- Center petal - tallest, brightest -->
      <path d="M100 135 C97 105, 85 45, 85 22 C85 6, 95 0, 100 0 C105 0, 115 6, 115 22 C115 45, 103 105, 100 135Z" fill="url(#pB4)" opacity="0.95"/>
      
      <!-- Center petal subtle gradient overlay for depth -->
      <path d="M100 0 C97 15, 90 50, 97 135 L100 135 Z" fill="rgba(167,139,250,0.08)"/>
      <path d="M100 0 C103 15, 110 50, 103 135 L100 135 Z" fill="rgba(99,102,241,0.06)"/>
    </g>
    
    <!-- Delicate edge highlights -->
    <path d="M85 22 C85 6, 95 0, 100 0 C105 0, 115 6, 115 22" stroke="rgba(221,214,254,0.3)" stroke-width="0.6" fill="none"/>
    <path d="M72 26 C70 10, 82 4, 90 16" stroke="rgba(196,181,253,0.2)" stroke-width="0.5" fill="none"/>
    <path d="M128 26 C130 10, 118 4, 110 16" stroke="rgba(196,181,253,0.2)" stroke-width="0.5" fill="none"/>
    
    <!-- Dewdrop highlights -->
    <g filter="url(#tG2)">
      <circle cx="100" cy="14" r="2" fill="#ede9fe" opacity="0.55"/>
      <circle cx="94" cy="35" r="1.5" fill="#e0e7ff" opacity="0.35"/>
      <circle cx="106" cy="30" r="1.3" fill="#e0e7ff" opacity="0.3"/>
      <circle cx="100" cy="55" r="1.8" fill="#c4b5fd" opacity="0.2"/>
      <circle cx="80" cy="30" r="1" fill="#c4b5fd" opacity="0.25"/>
      <circle cx="120" cy="28" r="1" fill="#c4b5fd" opacity="0.25"/>
    </g>
  </svg>
  <div class="label">Version B — Elegant Tall</div>
</div>

<div class="box">
  <svg width="120" height="120" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="pC1" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#93c5fd"/>
        <stop offset="50%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#4338ca"/>
      </linearGradient>
      <linearGradient id="pC2" x1="0.3" y1="0" x2="0.7" y2="1">
        <stop offset="0%" stop-color="#a5b4fc"/>
        <stop offset="50%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#5b21b6"/>
      </linearGradient>
      <linearGradient id="pC3" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#c4b5fd"/>
        <stop offset="40%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#6d28d9"/>
      </linearGradient>
      <linearGradient id="pC4" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#e0e7ff"/>
        <stop offset="20%" stop-color="#c4b5fd"/>
        <stop offset="60%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#6d28d9"/>
      </linearGradient>
      <radialGradient id="aura3" cx="0.5" cy="0.65" r="0.45">
        <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="transparent"/>
      </radialGradient>
      <filter id="sG3"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="dG3"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    
    <ellipse cx="100" cy="148" rx="55" ry="18" fill="url(#aura3)"/>

    <g filter="url(#sG3)">
      <!-- Outermost petals - wide, transparent, blue-tinted -->
      <path d="M100 140 C75 125, 12 105, 8 68 C5 45, 25 42, 38 55 C50 68, 82 118, 100 140Z" fill="url(#pC1)" opacity="0.4"/>
      <path d="M100 140 C125 125, 188 105, 192 68 C195 45, 175 42, 162 55 C150 68, 118 118, 100 140Z" fill="url(#pC1)" opacity="0.4"/>
      
      <!-- Second layer -->
      <path d="M100 140 C82 115, 28 82, 25 45 C23 25, 40 18, 52 32 C62 45, 86 105, 100 140Z" fill="url(#pC2)" opacity="0.58"/>
      <path d="M100 140 C118 115, 172 82, 175 45 C177 25, 160 18, 148 32 C138 45, 114 105, 100 140Z" fill="url(#pC2)" opacity="0.58"/>
      
      <!-- Third layer -->
      <path d="M100 140 C90 112, 48 65, 46 30 C44 12, 58 5, 68 18 C76 30, 92 95, 100 140Z" fill="url(#pC3)" opacity="0.72"/>
      <path d="M100 140 C110 112, 152 65, 154 30 C156 12, 142 5, 132 18 C124 30, 108 95, 100 140Z" fill="url(#pC3)" opacity="0.72"/>
      
      <!-- Inner petals -->
      <path d="M100 140 C95 110, 68 52, 66 22 C65 8, 76 2, 85 12 C91 22, 96 85, 100 140Z" fill="url(#pC4)" opacity="0.85"/>
      <path d="M100 140 C105 110, 132 52, 134 22 C135 8, 124 2, 115 12 C109 22, 104 85, 100 140Z" fill="url(#pC4)" opacity="0.85"/>
      
      <!-- Center petal -->
      <path d="M100 140 C97 108, 84 42, 84 18 C84 4, 93 -2, 100 -2 C107 -2, 116 4, 116 18 C116 42, 103 108, 100 140Z" fill="url(#pC4)" opacity="0.95"/>
    </g>
    
    <!-- Luminous edges -->
    <path d="M84 18 C84 4, 93 -2, 100 -2 C107 -2, 116 4, 116 18" stroke="rgba(224,231,255,0.35)" stroke-width="0.7" fill="none"/>
    <path d="M66 22 C65 8, 76 2, 85 12" stroke="rgba(196,181,253,0.2)" stroke-width="0.5" fill="none"/>
    <path d="M134 22 C135 8, 124 2, 115 12" stroke="rgba(196,181,253,0.2)" stroke-width="0.5" fill="none"/>
    <path d="M100 140 C75 125, 12 105, 8 68" stroke="rgba(147,197,253,0.12)" stroke-width="0.5" fill="none"/>
    <path d="M100 140 C125 125, 188 105, 192 68" stroke="rgba(147,197,253,0.12)" stroke-width="0.5" fill="none"/>
    
    <!-- Inner light reflections -->
    <g filter="url(#dG3)">
      <ellipse cx="100" cy="30" rx="5" ry="8" fill="#c4b5fd" opacity="0.15"/>
      <ellipse cx="95" cy="60" rx="3.5" ry="6" fill="#a5b4fc" opacity="0.1"/>
      <ellipse cx="105" cy="50" rx="3" ry="5" fill="#c4b5fd" opacity="0.08"/>
    </g>
    
    <!-- Sparkle accents -->
    <g filter="url(#dG3)">
      <circle cx="100" cy="10" r="2" fill="#ede9fe" opacity="0.6"/>
      <circle cx="92" cy="28" r="1.3" fill="#e0e7ff" opacity="0.4"/>
      <circle cx="108" cy="25" r="1.1" fill="#e0e7ff" opacity="0.35"/>
      <circle cx="76" cy="28" r="0.9" fill="#c4b5fd" opacity="0.25"/>
      <circle cx="124" cy="26" r="0.9" fill="#c4b5fd" opacity="0.25"/>
    </g>
  </svg>
  <div class="label">Version C — Wide Bloom</div>
</div>

</body>
</html>
