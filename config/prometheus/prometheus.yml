global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"
  - "article_composer_alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nuzantara-rag"
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["nuzantara-rag.fly.dev:443"]
    scheme: https
