# NORMATIVE. Spec: docs/specs/2026-09-27-codexpin-v3-spec.md §5bis. The table in §5bis.6 is a
# rendering of this file, and S3 parity-checks it. Consumer: scripts/ci/wa_codex_wrapper_mutants.py
# (S3, spec §5ter), which ships with the resumed PR-1 build and runs in
# .github/workflows/wa-codex-pin.yml on every change in its scope list.
#
# Schema 2 (gate r4 re-scope, 2026-09-27). S3 GENERATES the mutants from the target: every member of
# every operator class of every site (spec §5bis.3). This file only ANNOTATES them. It names no
# mutation and no site: there is no `to`, no anchor and no `covers`. A generated id missing here is
# UNANNOTATED, an id here that the target does not generate is PHANTOM, and any key outside the six
# below is SCHEMA. Both errors fail S3.
#
# Derived from the wrapper at PR #7420 head 04dd6b51e4 (blob 4143a795d9), plus the D5 heartbeat fix
# that PR-1 lands (lines 72 and 74 call /bin/mkdir and /bin/date). That PR-1 target is the blob named
# in derived_from. Any other target blob is STALE-DERIVATION.
#
# Entry fields:
#   id           generated by S3 (spec §5bis.3a): <line-id>:<site key>:<member>. Copy it, never write it.
#   label        informational: the row name of schema 1 (G0a..G9l), so the #7420 pack stays readable.
#   disposition  MUST | EQUIVALENT. Changing one is a spec change: this file is a Gear-3 hot-zone path.
#   mode         fail-open | fail-closed-other-rc | same-rc-other-diagnosis | static | equivalent, as S3
#                measures it on the killers (spec §5ter.3 step 8). S3 fails when it differs.
#   killed_by    MUST only: pytest node-id substrings, each matching exactly one collected test, naming
#                the fixture that isolates the fault. At least one must be among the failures.
#   reason       EQUIVALENT only: why no contracted observation can tell the mutant apart.
#
# The comment above each group quotes the target line the ids belong to. It is for the reader; S3
# never reads comments.

