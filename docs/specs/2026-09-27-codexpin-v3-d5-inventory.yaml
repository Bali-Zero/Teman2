# Closed D5 guard inventory for infra/launchagents/wrappers/wa-codex-broker-wrapper.sh
#
# NORMATIVE. Spec: docs/specs/2026-09-27-codexpin-v3-spec.md §5bis. The table there is a
# rendering of this file and S3 parity-checks it. Consumer: scripts/ci/wa_codex_wrapper_mutants.py
# (S3, spec §5ter), which ships with the resumed PR-1 build and runs in
# .github/workflows/wa-codex-pin.yml on every PR that touches the wrapper, its tests or this file.
#
# Derived line by line from the wrapper at PR #7420 head 04dd6b51e4 (blob 4143a795d9f2,
# sha256 9fb2268887392b6e...), plus the D5 heartbeat fix that PR-1 lands (lines 72 and 74 call
# /bin/mkdir and /bin/date). That PR-1 target is the blob named in derived_from; G9b, G9j and G9k
# anchor its lines 72 and 74, which exist only there. The fix adds two abspath sites (130 -> 132
# at the base, 134 on the target) and shifts no line. The row comments name line numbers; the
# checker never uses them: it locates every mutant by the exact text of its anchor line.
#
# Row grammar (spec §5bis.2):
#   id          G<family><letter>. Families 1-5 keep the builder's G1..G5b meaning; G0 holds
#               the constants before the source (council round 1).
#   was         earlier labels (builder G*, r0/re-gate C*/N*, re-gate #2 D*/S*/P*), for tracing.
#   anchor      exact full text of one target line, indentation included.
#   occurrence  1-based index among the lines whose text equals the anchor (default 1).
#   expr        optional: the fragment of the anchor line the row is about (rendered table only).
#   covers      site keys ON THE ANCHOR LINE that this row claims (kind or kind#n, spec §5bis.3).
#   disposition MUST | EQUIVALENT. No row is deferred at 04dd6b51e4 (spec §5bis.5).
#   reason      required for EQUIVALENT: why no contracted observation can tell the mutant apart.
#   mutants     each one is a single anchored substitution:
#                 op: sub   -> replace the anchor line with `to` (exact text)
#                 op: stmt  -> inside the anchor's block, replace the first `echo`/`heartbeat`/`exit`
#                              line (kind: diag|hb|exit) with `:` at the same indentation. This row
#                              also claims the site on that line.
#               mode = the mutant's effect as S3 measures it on the killer tests (spec §5ter.4):
#                 fail-open | fail-closed-other-rc | same-rc-other-diagnosis | static | equivalent.
#                 static = every killer reads the blob and never runs it (spec §5ter.3 step 8).
#                 S3 fails when the measured mode differs from this value.
#               killed_by = pytest node-id substrings, each matching exactly one collected test and
#                 naming the fixture that isolates the fault. For MUST rows, >=1 must be among the
#                 failures.

