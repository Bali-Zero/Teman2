# WR3 Agent I/O Contract — wr3-editorial-bench
# Schema: docs/wr3/contracts/_schema.yaml v1.0.0
# Description: Monthly 1st Mon 07:00 WITA. SOTA bench 12 ref brands + 3 competitors. Real multi-LLM deep-research pipeline (agy→Claude→DeepSeek), 2026-05-22.

name: wr3-editorial-bench
contract_version: 1.0.0
model: opus
lifecycle_tier: scheduled
cost_class: reasoning

cost:
  ceiling_usd: 0.5
  ceiling_unit: "$0.50 cash per monthly run (~$0.30 Claude Opus + ~$0.05 DeepSeek + $0 agy via Google AI Ultra)"
  hard_halt_on_exceed: true

allowed_tools:
  - Read
  - Write
  - Bash
  - WebFetch
  - WebSearch

inputs:
  - name: reference_brands
    kind: in_memory_obj
    source: "12 brands (NYT/Bloomberg/Reuters/Wired/Pudding/RoW/ProPublica/Vox/Quartz/Drift/Vice/AJE)"
    required: true
    schema_ref: "free-form"
  - name: competitors
    kind: in_memory_obj
    source: "3 BZ competitors (Lets Move Indonesia, Emerhub, Flado)"
    required: true
    schema_ref: "free-form"
  - name: trend_reports
    kind: in_memory_obj
    source: "Later.com, Hootsuite"
    required: true
    schema_ref: "free-form"

outputs:
  - name: external_bench
    kind: file
    sink: "~/.claude/skills/bali-zero-brand/_external-bench-video-YYYY-MM.md"
    schema_ref: "free-form"

emits: []

consumes: []

failure_modes:
  - code: degrade_loud
    action: "Some sources blocked / yt-dlp missing → synthesize with available + flag in Gather Failures section"
    telegram_p0_on: false
  - code: hard_fail
    action: "agy + Claude + DeepSeek ALL three tiers fail or quota-exhausted → exit 1 + Telegram P0 + defer 24h"
    telegram_p0_on: true

law_compliance:
  law_1_cli_only: "Multi-LLM cascade CLI-only: agy (Gemini 3.1 Pro 1M ctx) + claude-cascade.sh (Opus 4.7 OAuth) + DeepSeek V4 Pro HTTP (Anthropic SDK never imported)"
  law_2_osint_blindato: "Public YouTube/IG sources only, no client data leaves boundary"
  law_3_event_driven: "Cron monthly 1st Monday 07:00 WITA, not channel"
  law_4_graceful_degradation: "Per-tier graceful skip (missing key / timeout / quota) — assembly produces partial report"
  law_5_zero_authority: "Bench read by wr3-yt-metrics-analyst (weekly) + critic (every run)"
  law_6_local_sovereignty: "Local synthesis on Pro, DeepSeek API only external HTTP"
  law_7_numbers_first: "Per-tier telemetry (wall_seconds, tokens_in/out, cost_usd_actual) emitted to stdout + Cost Report section. Ceiling $0.50 enforced."
  law_8_past_present_future: "Monthly cadence (SOTA evolves slowly in video editorial), 12-month rolling archive of _external-bench-video-*.md"
