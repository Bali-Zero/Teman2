# WR3 Agent I/O Contract — wr3-script-editor
# Schema: docs/wr3/contracts/_schema.yaml v1.0.0
# Description: Writes 60-90s VO script with claim_id bindings + pacing markers.

name: wr3-script-editor
contract_version: 1.0.0
model: sonnet
lifecycle_tier: core
cost_class: text_planning

cost:
  ceiling_usd: 0.15
  ceiling_unit: "$0.15 cash"
  hard_halt_on_exceed: false

allowed_tools:
  - Read
  - Write
  - Bash
  - Glob
  - Grep

inputs:
  - name: brief
    kind: file
    source: "apps/war-room/output/episode/<slug>/brief.json"
    required: true
    schema_ref: "free-form"

outputs:
  - name: script
    kind: file
    sink: "apps/war-room/output/episode/<slug>/script.json"
    schema_ref: "script.schema.json (word_count = brief.target_duration_s × 3 ±10%; 60s→180w, 90s→270w, 120s→360w, 150s→450w)"

emits: []

consumes: []

failure_modes:
  - code: retry_with_cascade
    action: "Up to 2 retries if legal_claim_gate FAIL (mismatched claim_ids); 3rd retry → hard halt"
    telegram_p0_on: false
  - code: hard_fail
    action: "Word-count exceeds target_duration_s × 3 × 1.10 ceiling (60s→200w, 90s→300w, 120s→396w, 150s→495w) after 2 retries → Telegram P0"
    telegram_p0_on: true

law_compliance:
  law_1_cli_only: "Claude Agent SDK only"
  law_2_osint_blindato: "Reads brief.json (sanitized) — never touches nb_source_ids.private.json"
  law_3_event_driven: "Synchronous post-brief, no channel"
  law_4_graceful_degradation: "Word-overflow → wr3-design-architect routes to retry, not silent degrade"
  law_5_zero_authority: "Script reviewable pre-shot-director"
  law_6_local_sovereignty: "Local execution only"
  law_7_numbers_first: "Every claim in script has claim_id binding to brief.json — legal_claim_gate enforces verbatim"
  law_8_past_present_future: "Loads script-editor skill cortex (pacing templates)"
