# WR3 Agent I/O Contract — wr3-critic
# Schema: docs/wr3/contracts/_schema.yaml v1.0.0
# Description: MANDATORY 4-lane gate. PASS/FAIL per rubric + retry feedback. NO Agent tool (cannot recurse).

name: wr3-critic
contract_version: 1.0.0
model: opus
lifecycle_tier: core
cost_class: reasoning

cost:
  ceiling_usd: 0.5
  ceiling_unit: "$0.50 cash (Opus + Haiku VLM pre-pass)"
  hard_halt_on_exceed: false

allowed_tools:
  - Read
  - Write
  - Glob
  - Grep
  - Bash

inputs:
  - name: master
    kind: file
    source: "apps/war-room/output/episode/<slug>/master.mp4"
    required: true
    schema_ref: "free-form"
  - name: manifest
    kind: file
    source: "apps/war-room/output/episode/<slug>/episode_manifest.json"
    required: true
    schema_ref: "free-form"
  - name: brief
    kind: file
    source: "apps/war-room/output/episode/<slug>/brief.json"
    required: true
    schema_ref: "free-form"
  - name: script
    kind: file
    source: "apps/war-room/output/episode/<slug>/script.json"
    required: true
    schema_ref: "free-form"
  - name: brand_cortex
    kind: in_memory_obj
    source: "~/.claude/skills/bali-zero-brand/ (constitution + tokens + voice)"
    required: true
    schema_ref: "free-form"

outputs:
  - name: critic_report
    kind: file
    sink: "apps/war-room/output/episode/<slug>/critic-report.json"
    schema_ref: "critic-report.schema.json"
  - name: verdict_event
    kind: channel_emit
    sink: "wr3_episode_critic_verdict"
    schema_ref: "free-form"

emits:
  - wr3_episode_critic_verdict

consumes: []

failure_modes:
  - code: hard_fail
    action: "VLM API unavailable AND Opus quota exhausted → Telegram P0 + episode parked (cannot gate)"
    telegram_p0_on: true
  - code: degrade_loud
    action: "Lane 3 (cliche semantic) Opus fail → use Haiku regex pre-pass + flag 'critic_degraded' in manifest"
    telegram_p0_on: false

law_compliance:
  law_1_cli_only: "Opus+Haiku via Claude Agent SDK"
  law_2_osint_blindato: "Cross-checks claim_ids vs brief.json. NEVER queries NB directly (defers to brief-interpreter author)."
  law_3_event_driven: "Emits critic_verdict (PASS or FAIL+per-lane mask)"
  law_4_graceful_degradation: "Haiku regex degrades from Opus semantic (degrade-loud)"
  law_5_zero_authority: "Gate before Antonello/Damar publish — FAIL routes to retry lanes"
  law_6_local_sovereignty: "Local execution (Haiku VLM is cloud touchpoint but small)"
  law_7_numbers_first: "4-lane rubric: identity ArcFace ≥0.6, audio sync LUFS ±1, brand voice, legal accuracy"
  law_8_past_present_future: "Loads brand cortex + cliche library + on-tone-examples (post-3-pilot)"
