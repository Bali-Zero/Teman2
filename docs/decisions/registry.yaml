# Decision registry — one numbered, status-tracked, supersession-linked record per decision.
#
# WHY THIS EXISTS. Decisions in this repo are captured abundantly and findably by nobody: 11 legacy
# ADRs in one monolithic doc last touched 2026-02-26, a second numbering space in `docs/adr/` that
# collided with it, four inline rulings inside CLAUDE.md, one memo in `docs/decisions/`, and 300+
# research dossiers. Every one of those is a real record. None of them can answer "was this
# superseded?" without a human reading prose.
#
# THE NUMBER IS THE POINT, and it is guarded. A reused `D-NNN` is a HARD FAIL in
# `scripts/lint_decision_registry.py`, because a reservation that lives only in a document nobody
# re-reads decays monotonically with the number of concurrent writers — W40 (two migrations claimed
# 194 five minutes apart) and W128 (two PRs claimed scar W126 three minutes apart) are the same
# disease in two other counters, and both cost a session each.
#
# `evidence:` is not decoration. A decision with no resolvable evidence path is prose, and the lint
# says so. Paths resolve against `origin/main` first, then this commit — so a record whose evidence
# lands in the same PR is legal, and a typo that exists nowhere is not.
#
# DATES, stated honestly: D-001..D-011 all carry 2026-02-26, which is the
# monolithic document's own "Last Updated" stamp and NOT eleven separate decision
# dates — the individual ADRs do not record their own. A date query over those
# eleven therefore answers "when the doc was last touched", not "when this was
# decided". Recorded rather than invented: guessing per-ADR dates from git
# archaeology would put eleven fabricated facts into a registry whose whole value
# is that its facts are true, and a known-coarse date is worth more than a
# plausible wrong one.
#
# BACKFILL NOTE, and it corrects the spec that asked for it: L03-PR1 says "the 6 inline RULED blocks
# in CLAUDE.md". `grep -n RULED CLAUDE.md` does return 6 lines — but lines 120 and 122 are prose
# back-references to the ruling at line 130, not decisions of their own. There are FOUR distinct
# rulings (74, 124, 128, 130). Backfilling all six would have created two duplicate records for the
# 2026-08-20 decision, i.e. the exact collision this registry's lint exists to prevent, committed in
# the act of building it.

decisions:
  # NOT superseded, and the spec that asked for this backfill says it is.
