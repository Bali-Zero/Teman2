  #   - ADR-001 is about the PRODUCT's LLM — what answers a customer on WhatsApp.
  #     `CLAUDE.md:261` still reads "WhatsApp ✅ Fly.io (Gemini 3 Flash + RAG)",
  #     and the embedding half is still frozen at text-embedding-3-small (§9).
