  #     about a different system.
  #
  # Recording D-001 as superseded would have put a FALSE fact into the registry
  # whose entire purpose is to be the trustworthy answer to "was this
  # superseded?" — on its first commit, and about the very first record. The
  # instruction is not followed; this comment is why, so the next reader meets
