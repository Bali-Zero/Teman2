# Privacy redaction rules — Bali Zero Nuzantara agent-library evolver
#
# Loaded by scripts/_redact_pii.py. Strips PII / internal data from
# context BEFORE any external LLM call (DeepSeek API + Gemini OAuth +
# NotebookLM NB query). Fail-closed: if redaction module fails or
# returns empty (<gate.min_remaining_chars), abort the run.
#
# Spec: docs/superpowers/specs/2026-05-17-agent-library-evoskill-design.md §1.5
# Compliance: Symbiosis Law 2 (OSINT blindato) + UU PDP Indonesian privacy.
# Phase: 1 (whole redaction layer, addresses L8/L19/L20/L21/L22 from
# agent-library/proposals/.known-limitations-v1.md)

# ─── Pass 1: identifier + internal patterns (applied first, escapes preserved) ───
pass1:
  - id: npwp_formatted
    description: Nomor Pokok Wajib Pajak 15-digit, dot-separated form
    pattern: '\b\d{2}\.\d{3}\.\d{3}\.\d-\d{3}\.\d{3}\b'
    replace: "[NPWP-REDACTED]"

  - id: npwp_bare_context
    description: |
      NPWP bare 15-digit form preceded by a context label (npwp,
      n.p.w.p., taxpayer id, wajib pajak). Captures the digits in
      group 1; the Python redactor substitutes ONLY the captured
      group with [NPWP-BARE-REDACTED], preserving the label.
    pattern: '(?i)(?P<label>(?:npwp|n\.?p\.?w\.?p\.?|taxpayer\s*id|wajib\s*pajak)[\s:#]*)(?P<digits>\d{15})\b'
    replace_group_digits: "[NPWP-BARE-REDACTED]"

  # WhatsApp JID + bank account MUST be in pass1 BEFORE the NIB / KTP
  # context-aware patterns. Otherwise unconditional digit patterns would
  # eat the JID prefix / account digits (caught empirically in Phase 1
  # test failures 2026-05-18).
  - id: whatsapp_jid
    description: WhatsApp JID (62...@s.whatsapp.net, ...@g.us, ...@lid)
    pattern: '\b\d{10,15}@(?:s\.whatsapp\.net|g\.us|lid)\b'
    replace: "[WA-JID-REDACTED]"

  - id: bank_account_context
    description: |
      Indonesian bank account / VA preceded by bank-context label
      (rekening, account number, virtual account, VA, BRI, BCA,
      Mandiri, BNI). Captures digits for selective substitution.
    pattern: '(?i)(?P<label>(?:rekening|account\s*number|virtual\s*account|VA|BRI|BCA|Mandiri|BNI)\s*[:#]?\s*)(?P<digits>\d{10,16})\b'
    replace_group_digits: "[BANK-ACCOUNT-REDACTED]"

  - id: nib_context
    description: |
      NIB bare 13-digit preceded by a context label (panel R2 finding
      caught: unconditional 13-digit pattern eats bank accounts + WA
      JID prefixes that happen to be 13 digits). Captures digits in
      group `digits` for selective substitution.
    pattern: '(?i)(?P<label>(?:nib|nomor\s+induk\s+berusaha)[\s:#]*)(?P<digits>\d{13})\b'
    replace_group_digits: "[NIB-REDACTED]"

  - id: ktp_nik_context
    description: |
      NIK / KTP 16-digit Indonesian national ID with context label
      (same defense as NIB: unconditional 16-digit eats card numbers
      + long bank refs).
    pattern: '(?i)(?P<label>(?:ktp|nik|nomor\s+induk\s+kependudukan)[\s:#]*)(?P<digits>\d{16})\b'
    replace_group_digits: "[KTP-REDACTED]"

  - id: kitas_kitap
    description: ITAS / ITAP / RPTKA number
    pattern: '\b(?:2C|2D|2E|3E|RPTKA)\d{8,12}[A-Z]?\b'
    replace: "[KITAS-REDACTED]"

  - id: imta
    description: IMTA permit number
    pattern: '\bIMTA[/\-]\d+[/\-]\d{4}\b'
    replace: "[IMTA-REDACTED]"

  - id: passport
    description: Passport number preceded by passport/paspor label
    pattern: '(?i)(?P<label>(?:passport|paspor)\s*(?:no\.?|number)?\s*[:#]?\s*)(?P<num>[A-Z0-9]{6,9})\b'
    replace_group_num: "[PASSPORT-REDACTED]"

  # L20 (Codex+Gemini R2): SHM / SHGB / HGB / AKTA / AHU
  - id: shm_certificate
    description: Sertifikat Hak Milik (Indonesian property certificate)
    pattern: '\b(?:SHM|SHGB|HGB|HGU|HP)\s+No\.?\s*\d{1,6}(?:/[A-Za-z]+)?\b'
    replace: "[SHM-REDACTED]"

  - id: akta_notarial
    description: AKTA notarial deed number (Akta No. XX/YYYY)
    pattern: '\b(?:Akta|AKTA)\s+(?:Notaris\s+)?No\.?\s*\d{1,4}\s*[/\-]\s*\d{4}\b'
    replace: "[AKTA-REDACTED]"

  - id: ajb_ppjb
    description: AJB / PPJB property deed (Akta Jual Beli, Perjanjian Pengikatan Jual Beli)
    pattern: '\b(?:AJB|PPJB)\s+No\.?\s*\d{1,4}\s*[/\-]\s*\d{4}\b'
    replace: "[AJB-PPJB-REDACTED]"

  - id: ahu_company_deed
    description: AHU-style company deed reference (AHU-XXXXX.AH.YY.ZZ.YEAR)
    pattern: '\bAHU-\d+\.AH\.\d{2}\.\d{2}\.\d{4}\b'
    replace: "[AHU-REDACTED]"

  # OSINT-internal block — explicit closing tag (panel R1 CRITICAL fix)
  - id: osint_internal_block
    description: |
      Entire blocks tagged [osint-internal]...[/osint-internal] dropped.
      Fallback EOF if closing tag missing. Symbiosis Law 2 hard gate.
      Closing tag is enforced by context-gathering layer which appends
      one to any unclosed opening tag before yaml loading.
    pattern: '\[osint-internal\][\s\S]*?(?:\[/osint-internal\]|\Z)'
    replace: "[OSINT-INTERNAL-BLOCK-DROPPED]"

  - id: kura_kura_btid_case
    description: |
      Kura Kura Bali / PT BTID case dossier — out-of-repo per Antonello
      2026-05-12 directive.
    pattern: '(?i)(?:kura.?kura|BTID)\s+[^\n]+'
    replace: "[INTERNAL-DOSSIER-REDACTED]"

  - id: ip_addresses_internal
    description: IPv4 internal/private/Tailscale addresses
    pattern: '\b(?:10|172\.(?:1[6-9]|2\d|3[01])|192\.168|100\.\d+)\.\d+\.\d+\b'
    replace: "[INTERNAL-IP-REDACTED]"

  - id: ssh_alias
    description: ssh pro / ssh mini / ssh air machine aliases
    pattern: '\bssh\s+(?:pro|mini|air)\b'
    replace: "ssh [MACHINE-ALIAS-REDACTED]"

  - id: fly_internal
    description: Fly.io app machine IDs + secrets refs (literal token names)
    pattern: '\b(?:d894e65bede478|FLY_API_TOKEN|TELEGRAM_BOT_TOKEN)\b'
    replace: "[FLY-INTERNAL-REDACTED]"

# ─── Pass 2: personal patterns (team emails + owner FIRST, then generic) ───
pass2_team_first:
  - id: team_emails_balizero
    description: team @balizero.com email addresses (load-bearing — MUST run before generic email)
    pattern: '\b(?:zero|asya|surya|ari\.firda|adit|sahira|krisna|damar|vino|veronika|rina|ruslana|subhi)@balizero\.com\b'
    replace: "[TEAM-EMAIL-REDACTED]"

  - id: antonello_personal_gmail
    description: Owner's personal Gmail
    pattern: '\bantonellosiano@gmail\.com\b'
    replace: "[OWNER-PERSONAL-EMAIL-REDACTED]"

  - id: phone_e164
    description: Phone in E.164 international form (+62..., +39..., generic)
    pattern: '\+\d{1,3}\s?\d{2,4}\s?\d{3,4}\s?\d{3,4}'
    replace: "[PHONE-REDACTED]"

  - id: phone_id_local
    description: Indonesian local phone (08xx, 02x, 03x, etc.)
    pattern: '\b0(?:8|2|3|4|5|6|7)\d{8,11}\b'
    replace: "[PHONE-ID-LOCAL-REDACTED]"
  # Note: whatsapp_jid moved to pass1 (BEFORE NIB) to prevent
  # unconditional 13-digit pattern from eating the JID prefix.

# ─── Pass 3: generic patterns (applied LAST, after team_emails has tokenised) ───
# Critical 2-pass ordering: pass2 substitutes team_emails to
# [TEAM-EMAIL-REDACTED] (no `@balizero.com` left in the text); pass3
# then matches the REMAINING email-like strings → client / partner /
# third-party emails. Without the ordering, team emails would be
# captured by the generic pattern. The Python redactor enforces
# pass1 → pass2_team_first → pass3 sequentially.
pass3_generic:
  - id: generic_email_remaining
    description: |
      Generic email pattern matches anything left over after pass2 team
      substitutions removed @balizero.com tokens. Catches client emails,
      partner emails, third-party emails.
    pattern: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    replace: "[CLIENT-EMAIL-REDACTED]"

  # L19 (Codex R2): iban_swift STRICT — avoid false-positive on
  # common English uppercase words like CRITICAL/DATABASE/PASSPORT.
  # Strict IBAN: country code + check digits + bank code + account
  # MIN length 15 (smaller IBANs don't exist). Strict SWIFT: prefix
  # "BIC " or "SWIFT " context label to disambiguate from words.
  - id: iban_strict
    description: |
      IBAN strict pattern with min total length 15. Country + 2 check
      digits + at least 11 alphanumeric. Excludes English words by
      requiring at least 4 digits in the trailing block.
    pattern: '\b[A-Z]{2}\d{2}[A-Z0-9]{4,30}\d{4,}\b'
    replace: "[IBAN-REDACTED]"

  - id: swift_bic_context
    description: |
      SWIFT BIC code with context label "BIC", "SWIFT", or "Swift Code".
      Without the label, 8-char uppercase strings collide with
      ordinary English words.
    pattern: '(?i)(?:BIC|SWIFT)\s*(?:code)?\s*[:#]?\s*[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b'
    replace: "[SWIFT-BIC-REDACTED]"

  # Note: bank_account_context moved to pass1 (BEFORE NIB) for the
  # same reason as whatsapp_jid above.

# ─── Pass 4: dynamic CRM names (loaded at runtime from PG) ───
# Placeholder rules — the Python redactor builds the actual regex from
# `psql -c "SELECT full_name FROM clients"` + `psql -c "SELECT name FROM
# companies"`. Static patterns here are markers for the redactor to
# inject the live alternation.
pass4_dynamic:
  - id: crm_client_names_runtime
    description: |
      Built at runtime from `clients.full_name` table. The pattern below
      is a placeholder; the Python redactor scripts/_redact_pii.py
      substitutes it with `\b(?:Name1|Name2|...)\b` from psql.
    placeholder_id: __DYNAMIC_CRM_CLIENT_NAMES__
    replace: "[CLIENT-NAME-REDACTED]"

  - id: crm_company_names_runtime
    description: |
      Built at runtime from `companies.company_name` table (PT PMA, CV, Yayasan,
      Firma, UD). Same placeholder mechanism.
    placeholder_id: __DYNAMIC_CRM_COMPANY_NAMES__
    replace: "[COMPANY-NAME-REDACTED]"

# ─── Aggregate gate ───
gate:
  # Abort the run if the redacted output is shorter than this. Either
  # the redactor is broken or the input was empty / fully redacted.
  min_remaining_chars: 100
  # Fail-closed on rule-application error (broken regex, missing file).
  fail_on_error: true
  # Idempotency check: applying redactor twice produces identical output.
  # Smoke test: scripts/test_redact_pii.py
  idempotent: true
  # Pass ordering enforced by the Python redactor (NOT by YAML order):
  # pass1 → pass2_team_first → pass3_generic → pass4_dynamic.
  # Within each pass, order is irrelevant (no substitution cross-talk).
