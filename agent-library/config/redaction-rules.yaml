# Privacy redaction rules — Bali Zero Nuzantara agent-library evolver
#
# Loaded by scripts/_redact_pii.py (Phase 1 implementation).
# Strips PII / internal data from context BEFORE any external LLM call
# (DeepSeek API + Gemini OAuth + NotebookLM NB query). Fail-closed:
# if redaction module fails or returns empty, abort the run (v4 Codex
# finding 2 HIGH).
#
# Spec: docs/superpowers/specs/2026-05-17-agent-library-evoskill-design.md §1.5
# Compliance: Symbiosis Law 2 (OSINT blindato) + UU PDP Indonesian privacy.

# ─── Indonesian regulatory identifiers ───
identifiers:
  - id: npwp_formatted
    description: Nomor Pokok Wajib Pajak (15-digit Indonesian taxpayer ID, dot-separated form 12.345.678.9-012.345)
    pattern: '\b\d{2}\.\d{3}\.\d{3}\.\d-\d{3}\.\d{3}\b'
    replace: "[NPWP-REDACTED]"

  - id: npwp_bare
    description: |
      Nomor Pokok Wajib Pajak bare 15-digit form (no separators). DeepSeek
      panel finding 2026-05-18: dot-separated regex above missed this case.
      Guard against false matches by requiring an NPWP-context label
      preceding the digits (npwp, n.p.w.p., taxpayer, wajib pajak).
    pattern: '(?i)(?:npwp|n\.?p\.?w\.?p\.?|taxpayer\s*id|wajib\s*pajak)[\s:#]*(\d{15})\b'
    replace: '\g<0>' # see post-substitution note below
    # NOTE: this rule preserves the label and replaces only the digits with
    # [NPWP-BARE-REDACTED]; the redactor module (scripts/_redact_pii.py
    # Phase 1) applies a 2nd-pass substring substitution on the captured
    # group. Yaml literal `\g<0>` is a placeholder so the dry-run loader
    # validates the pattern; the real logic lives in _redact_pii.py.

  - id: nib
    description: Nomor Induk Berusaha (13-digit Indonesian business ID)
    pattern: '\b\d{13}\b'
    replace: "[NIB-REDACTED]"

  - id: ktp
    description: NIK / KTP (16-digit Indonesian national ID)
    pattern: '\b\d{16}\b'
    replace: "[KTP-REDACTED]"

  - id: kitas_kitap
    description: ITAS / ITAP number (KITAS/KITAP, format varies)
    pattern: '\b(?:2C|2D|2E|3E|RPTKA)\d{8,12}[A-Z]?\b'
    replace: "[KITAS-REDACTED]"

  - id: imta
    description: IMTA permit number
    pattern: '\bIMTA[/\-]\d+[/\-]\d{4}\b'
    replace: "[IMTA-REDACTED]"

  - id: passport
    description: passport number (multi-format heuristic — generic 6-9 alphanumeric)
    # Conservative: only matches when preceded by "passport"/"paspor" word
    pattern: '(?i)(?:passport|paspor)\s*(?:no\.?|number)?\s*[:#]?\s*([A-Z0-9]{6,9})'
    replace: "passport [PASSPORT-REDACTED]"

# ─── Personal data ───
personal:
  - id: crm_client_names
    description: client first+last names from clients table (dynamically loaded)
    # Phase 1: load from psql -c "SELECT full_name FROM clients" and build
    # alternation regex. Placeholder for static smoke test.
    pattern: "__DYNAMIC_CRM_CLIENT_NAMES__"
    replace: "[CLIENT-NAME-REDACTED]"

  - id: team_emails
    description: team @balizero.com email addresses
    pattern: '\b(zero|asya|surya|ari\.firda|adit|sahira|krisna|damar|vino|veronika|rina|ruslana|subhi)@balizero\.com\b'
    replace: "[TEAM-EMAIL-REDACTED]"

  - id: antonello_personal_email
    description: Antonello's personal Gmail
    pattern: '\bantonellosiano@gmail\.com\b'
    replace: "[OWNER-PERSONAL-EMAIL-REDACTED]"

  - id: phone_numbers_e164
    description: WhatsApp / phone in E.164 international form (+62..., +39...)
    pattern: '\+\d{1,3}\s?\d{2,4}\s?\d{3,4}\s?\d{3,4}'
    replace: "[PHONE-REDACTED]"

  - id: phone_numbers_id_local
    description: |
      Indonesian local phone (08xx...) — Codex panel finding 2026-05-18.
      E.164 rule above misses bare 0814... numbers stored in CRM.
    pattern: '\b0(?:8|2|3|4|5|6|7)\d{8,11}\b'
    replace: "[PHONE-ID-LOCAL-REDACTED]"

  - id: whatsapp_jid
    description: |
      WhatsApp JID format used in WA-Mirror / CRM (62...@s.whatsapp.net,
      ...@g.us group, ...@lid). Codex panel finding 2026-05-18.
    pattern: '\b\d{10,15}@(?:s\.whatsapp\.net|g\.us|lid)\b'
    replace: "[WA-JID-REDACTED]"

  - id: generic_email_non_team
    description: |
      Generic email addresses NOT in the team @balizero.com whitelist.
      Codex panel finding 2026-05-18: client emails leaked.
      Two-pass redactor (scripts/_redact_pii.py Phase 1) applies this
      AFTER team_emails + antonello_personal_email substitutions, so the
      preserved tokens are already redacted to [TEAM-EMAIL-REDACTED] /
      [OWNER-PERSONAL-EMAIL-REDACTED]. This pattern then matches the
      remainder (client emails, partner emails, third-party).
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    replace: "[CLIENT-EMAIL-REDACTED]"

  - id: bank_account_id
    description: |
      Indonesian bank account / virtual account numbers (10-16 consecutive
      digits preceded by bank-context label). Codex panel finding 2026-05-18:
      financial IDs leaked. Conservative: require label to avoid matching
      arbitrary digit runs (which would hit NIK / NPWP / phones).
    pattern: '(?i)(?:rekening|account\s*number|virtual\s*account|VA|BRI|BCA|Mandiri|BNI)\s*[:#]?\s*(\d{10,16})\b'
    replace: "[BANK-ACCOUNT-REDACTED]"

  - id: iban_swift
    description: |
      IBAN / SWIFT BIC code patterns. Codex panel finding 2026-05-18.
      IBAN: 2-letter country + 2 check digits + up to 30 alphanumeric.
      SWIFT: 8 or 11 chars, 4 bank + 2 country + 2 location + optional 3 branch.
    pattern: '\b(?:[A-Z]{2}\d{2}[A-Z0-9]{4}\d{10,30}|[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?)\b'
    replace: "[IBAN-SWIFT-REDACTED]"

  - id: crm_company_names
    description: |
      B2B corporate entity names from CRM (PT PMA, CV, Yayasan, Firma,
      UD). Gemini panel finding 2026-05-18. Two-pass redactor loads
      live names from `companies` table at run time (placeholder pattern
      here for spec compliance + dry-run validation).
    pattern: "__DYNAMIC_CRM_COMPANY_NAMES__"
    replace: "[COMPANY-NAME-REDACTED]"

# ─── Internal-only entries (Symbiosis Law 2) ───
internal:
  - id: osint_internal_block
    description: |
      Entire blocks tagged [osint-internal] are dropped — OSINT data
      NEVER leaves Pro per Symbiosis Law 2.

      DeepSeek + Gemini panel finding 2026-05-18 (CRITICAL convergent):
      the previous regex `\[osint-internal\][\s\S]*?(?=\n\n|\Z)` used
      a lazy quantifier that stopped at the FIRST blank line. A
      multi-paragraph OSINT block would leak Para2+ to external LLMs.
      Verified empirically: Para2 leaks with the old pattern.

      Fix v2: require explicit closing tag `[/osint-internal]`. Authors
      MUST close their blocks. Fallback to end-of-document if the closing
      tag is missing (greedy match — better to over-redact than leak).
      Convention enforced by upstream context-gathering layer
      (scripts/_redact_pii.py Phase 1) which auto-appends a closing tag
      to any unclosed opening tag.
    pattern: '\[osint-internal\][\s\S]*?(?:\[/osint-internal\]|\Z)'
    replace: "[OSINT-INTERNAL-BLOCK-DROPPED]"

  - id: kura_kura_btid_case
    description: |
      Kura Kura Bali / PT BTID case 2026-05-12 dossier — out of repo
      Nuzantara per Antonello directive (OSINT-Nexus/dossiers/). Any
      reference in mem dump → strip.
    pattern: '(?i)(kura.?kura|BTID|btid)\s+[^\n]+'
    replace: "[INTERNAL-DOSSIER-REDACTED]"

  - id: ip_addresses
    description: IPv4 internal/private addresses (Tailscale + LAN)
    pattern: '\b(?:10|172\.(?:1[6-9]|2\d|3[01])|192\.168|100\.\d+)\.\d+\.\d+\b'
    replace: "[INTERNAL-IP-REDACTED]"

  - id: ssh_alias
    description: ssh pro / ssh mini / ssh air shortcuts
    pattern: '\bssh\s+(pro|mini|air)\b'
    replace: "ssh [MACHINE-ALIAS-REDACTED]"

  - id: fly_app_internal
    description: Fly.io app machine IDs + secrets refs
    pattern: '\b(?:d894e65bede478|FLY_API_TOKEN|TELEGRAM_BOT_TOKEN)\b'
    replace: "[FLY-INTERNAL-REDACTED]"

# ─── Aggregate gate ───
gate:
  # If redaction would produce empty output (everything stripped), abort.
  min_remaining_chars: 100
  # Fail-closed on rule-application error (broken regex, missing file).
  fail_on_error: true
  # Idempotency check: applying redactor twice produces identical output.
  # Smoke test: scripts/test_redact_pii.py (Phase 1).
  idempotent: true
