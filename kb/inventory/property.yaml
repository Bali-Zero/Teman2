# ── Fragment-containment proof, MANDATE §4.4/§4.6 (mandatory order: prove
#    containment FIRST, only then retire/promote) — Permen_18_2021 / production
#    534 pts vs legal_unified_2026 (retired) 10,266 pts for the same document_id.
containment_proofs:
  - instrument_id: Permen_18_2021
    compared_with:
      collection: legal_unified_2026
      points: 10266
    production_points: 534
    production_fragment_hashes: 404 # normalized text, >=40 chars, per fragment
    retired_fragment_hashes: 3860
    covered_fragment_hashes: 134
    uncovered_fragment_hashes: 270
    covered_ratio: 0.3317
    verdict: >
      CONTAINMENT NOT PROVEN. Only 33.2% (134/404) of production's fragment-level
      hashes are found anywhere in the 10,266-point retired edition — the opposite
      of the ~100% precedent this campaign requires before retiring an edition
      (MANDATE §4.6 cites 42/42 and 261/261 as the bar). Two explanations are both
      live and were NOT distinguished within budget: (a) the retired edition is
      genuinely missing 67% of what production has (the "fuller edition" hypothesis
      is WRONG), or (b) the two editions were chunked with different boundaries, so
      substantively-overlapping text hashes differently and the fragment-hash method
      undercounts true containment (both editions' text samples read as the same
      regulation on inspection — see kb/topics/property.yaml's identity block, and
      the retired edition IS ~19x denser in points for the same instrument, which is
      also consistent with the "written nightly, never cleared" duplication pattern
      MANDATE §1 already flags for this collection: 10,266 points but only 3,860
      unique fragment hashes, a 2.7x internal duplication ratio).
    disposition: >
      STOPPED AT STEP 1 of the mandated order (prove containment -> retire -> write
      fuller edition). Production Permen_18_2021 (534 pts) was NOT retired and
      legal_unified_2026's edition was NOT promoted. A substring/article-level
      comparison (not fragment-hash) is needed to tell (a) from (b) above before any
      further step in this sequence is safe to take.
