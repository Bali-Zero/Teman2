# ── §3 Amendment invariant (SELF-CONTAINED — no domain knowledge required) ─────
#
# If document A's own title reads "PERUBAHAN ... ATAS B" (an amendment TO B), B
# cannot be revoked -- a legislature does not amend a repealed instrument. This
# is provable from the corpus's OWN text and OWN legal_status field, with no
# external source needed -- the corpus is checked against itself.
#
# CAVEAT (do not drop this reading this section): every count below is a LOWER
# BOUND, not a total. Title parsing depends entirely on a [CONTEXT:] header, and
# 30.6% of points / 185 of 388 documents (measured_against, above) carry NONE —
# a document with no header contributes zero evidence here in EITHER direction,
# not "assumed clean". A weaker, independent signal (kb/inventory/immigration.yaml's
# own source_basename census, 22 contested identities / 12,926 points / 57 files)
# already recorded a larger collision count by a different method; this section
# does not supersede that measurement, only corroborates it from title text.
amendment_invariant:
  method: >
    kb/ops/probe_amendment_invariant.py, run live against production
    2026-08-26. Resolves a document's own amendment target by requiring
    "PERUBAHAN [ordinal] ATAS" to open IMMEDIATELY after "TENTANG" in a
    [CONTEXT:] header found on any of that document's points (never scavenging a
    match from a citation-history sentence elsewhere in the chunk text — a real
    failure mode caught live on UU_23_2002, whose own body text quotes "UU 35/2014
    tentang Perubahan atas UU 23/2002" and would otherwise resolve to itself), then
    parses the referenced (type, number, year) with the SAME
    `LEGAL_TITLE_PATTERN`/`LEGAL_TYPE_ABBREV`/`normalize_document_number` production
    ingestion uses to build every OTHER document_id in this corpus. One disclosed,
    scoped text normalization is applied before matching (never to anything stored
    or reported as payload): whitespace touching a hyphen is collapsed
    ("UNDANG -UNDANG" -> "UNDANG-UNDANG"), a real OCR line-wrap artifact confirmed
    on PP_1_2014's own citation of UU 27/2007.
  resolved_own_title_amendment_relationships: 30
  resolved_targets_present_in_this_corpus: 14
  resolved_targets_outside_this_corpus: 14
  resolved_targets_outside_this_corpus_list:
    - PP_14_2016
    - Perbup_84_2016
    - Perda_17_2001
    - Perda_5_2011
    - Permen_110_2023
    - Permen_13_2025
    - Permen_1_2024
    - Perpres_70_2023
    - UU_11_1995
    - UU_28_2003
    - UU_29_2002
    - UU_32_2004
    - UU_35_2000
    - UU_4_2023
  unresolved_ocr_or_unmapped_type: 7
  unresolved_ocr_or_unmapped_type_list:
    # Every one of these is an amendment reference this session's own eyes
    # confirmed exists in the header text, blocked by a specific, named defect —
    # not a silent parser failure:
    - document_id: Permen_2_2010
      reason: "citation window exceeds LEGAL_TITLE_PATTERN's bounded gap"
    - document_id: Permen_3_2014
      reason: "year token itself OCR-corrupted with an embedded space (2014 -> '20 14')"
    - document_id: UU_16_2025
      reason: "year token OCR-corrupted: letter O for digit 0 ('2OO1')"
    - document_id: UU_19_2016
      reason: "citation window exceeds LEGAL_TITLE_PATTERN's bounded gap"
    - document_id: UU_2_2008
      reason: "year token OCR-corrupted: letter O for digit 0 ('2OO1')"
    - document_id: UU_65_2024
      reason: "citation window exceeds LEGAL_TITLE_PATTERN's bounded gap"
    - document_id: UU_66_2024
      reason: "year token OCR-corrupted: letter O for digit 0 ('2OO8')"
  strict_violations:
    # amending document uniformly `berlaku`, amended document uniformly `dicabut`
    # -- an outright logical impossibility, requiring no domain knowledge.
    - amending: UU_63_2024
      amending_title_fragment: "PERUBAHAN KETIGA ATAS UU NOMOR 6 TAHUN 2011 TENTANG KEIMIGRASIAN"
      amending_status: { berlaku: 38 }
      amended: UU_6_2011
      amended_status: { dicabut: 413 }
    - amending: PP_1_2014
      amending_title_fragment: "PERUBAHAN ATAS UNDANG-UNDANG NOMOR 27 TAHUN 2007 TENTANG PENGELOLAAN WILAYAH PESISIR DAN PULAU-PULAU KECIL"
      amending_status: { berlaku: 122 }
      amended: UU_27_2007
      amended_status: { dicabut: 70 }
  weak_violations:
    # amended document uniformly `dicabut`, amender's OWN status not required to
    # be berlaku -- weaker evidence (an amender that is itself dicabut proves
    # less about the amended instrument's true status), kept SEPARATE, never
    # merged into strict_violations' count. Includes both strict violations above.
    - amending: Permen_1_2026
      amending_status: { mixed: true, berlaku: 575, dicabut: 931 }
      amended: Permen_81_2024
      amended_status: { dicabut: 430 }
    - amending: Permen_11_2024
      amending_title_fragment: "PERUBAHAN ATAS PERMENKUMHAM NOMOR 22 TAHUN 2023 TENTANG VISA DAN IZIN TINGGAL"
      amending_status: { dicabut: 345 }
      amended: Permen_22_2023
      amended_status: { dicabut: 402 }
      note: "independently corroborates the domain-knowledge finding on Permen_22_2023 above, from the corpus's own text alone"
    - amending: UU_63_2024
      amending_status: { berlaku: 38 }
      amended: UU_6_2011
      amended_status: { dicabut: 413 }
    - amending: UU_36_2008
      amending_status: { dicabut: 271 }
      amended: UU_7_1983
      amended_status: { dicabut: unspecified_uniform }
    - amending: PP_1_2014
      amending_status: { berlaku: 122 }
      amended: UU_27_2007
      amended_status: { dicabut: 70 }
  discrepancy_note: >
    An earlier message in this campaign cited "66 resolved / 2 strict / 6 weak"
    from an independent measurement. This session's own resolution (documented
    method above, live 2026-08-26) found 30 resolved / 2 strict / 5 weak. The
    STRICT count and both named strict pairs match exactly. The other counts
    differ because resolution methodology (title-anchoring rule, OCR-normalization
    scope, corpus content at time of measurement — this collection is NOT static;
    it grew from 83,969 to 84,283 points between two audits taken one day apart)
    legitimately differs between independent implementations. Both are corpus-scale
    lower bounds, not exact totals; neither claims to be the other's audit.

# ── §4 The three search-time-suppression fields — only one of them is dead ────
#
# `legal_status` (everything above) is not the only field this campaign found
# that names a document's legal validity. `build_search_filter()`
# (apps/backend-rag/backend/services/search/search_filters.py) reads TWO OTHER,
# DIFFERENT keys and builds a live Qdrant `must_not` clause from each — spot-checked
# against the live source, both confirmed:
#
#   filters["status_vigensi"]  = {"$ne": "dicabut"}          (line 86, always, unless
#                                                              already narrowed above it)
#   filters["retrieval_scope"] = {"$ne": "historical_only"}  (line 91, whenever
#                                                              exclude_historical=True)
#
# These three fields are NOT interchangeable and must never be read as "the same
# finding measured three ways" — this table is the artifact's single most
# important fact, because it is the one a future reader is most likely to
# reconstruct wrong from partial evidence (an earlier pass on this exact chain
# read only line 86 and concluded the guard "never bites" — true of
# status_vigensi, false of the guard as a whole):
#
#   field            | populated on legal_unified      | read by the guard | outcome
#   -----------------|----------------------------------|-------------------|---------------------------
#   legal_status     | 77,539 pt (42,420 dicabut/26,107 berlaku/9,012 none) | NO — 0 resolvable reads (§ read-lint) | full, and systemically FALSE (§2/§3)
#   status_vigensi   | 0 pt, everywhere, corpus-wide     | yes               | never bites (armed, inert)
#   retrieval_scope  | 4,699 pt (2 historical_only)      | yes, not disable-able | WORKS — a real, live, already-armed supersession mechanism, just almost never used
#
# The third row is a plain measurement, stated here without a recommendation:
# `retrieval_scope=historical_only` is a genuinely working alternative to any
# `legal_status` repair for the specific "supersede/mark as historical" need
# Decision 5 (MANDATE.md §7 — mark vs remove) was choosing between, and it is
# used on exactly one document today (`Perpres_43_2011__historical`, 2 points).
# Whether that changes what Decision 5 should do next is for Zero to weigh, not
# for this inventory to argue.
status_vigensi:
  measured_on_legal_unified:
    collection: legal_unified_hybrid_hybrid
    points_scanned: 84283
    hits_flat_or_nested: 0
  measured_instance_wide:
    collections_scanned: 14
    points_scanned: 124213
    hits: 0
    note: >
      Independently measured twice: once by this lane's own read-only scroll,
      once by a separate grader dispatched by team-lead on the same code chain.
      Both measurements agree exactly (0/84,283 on legal_unified; 0 across all
      14 collections instance-wide) — two independent measurements agreeing is
      stronger evidence than either alone.
  filter_chain:
    - "apps/backend-rag/backend/services/search/search_service.py `_prepare_search_context` (~lines 546-566): builds the filter UNCONDITIONALLY via build_search_filter(exclude_repealed=True); only an explicit apply_filters=False disables it — a caller passing None inherits it ACTIVE"
    - "apps/backend-rag/backend/services/search/search_filters.py `build_search_filter` (exclude_repealed default True): sets filters['status_vigensi'] = {'$ne': 'dicabut'} — spot-checked against the live source, matches exactly"
    - "apps/backend-rag/backend/core/qdrant_db.py `_convert_filter_to_qdrant_format` (~line 367) converts that into a Qdrant must_not clause"
    - "apps/backend-rag/backend/core/qdrant_db.py `_FLAT_PAYLOAD_COLLECTIONS` (~line 448) lists `legal_unified` by name — a flat top-level status_vigensi key on this collection would be read directly, not just under metadata"
  retrieval_scope:
    # The THIRD field (see §4's table above) — unlike status_vigensi, this one is
    # populated, read, and already working. Recorded here as a plain measurement.
    measured_on_legal_unified:
      collection: legal_unified_hybrid_hybrid
      points_scanned: 84283
      absent: 79584
      current: 4697
      historical_only: 2
      historical_only_documents: ["Perpres_43_2011__historical"]
    filter_chain:
      - "search_filters.py:91 — filters['retrieval_scope'] = {'$ne': 'historical_only'}, set whenever exclude_historical=True"
      - "search_service.py `_requires_current_law_guard` (~lines 247-253): true exactly for {'legal_unified', 'tax_genius'} — this guard is ON for this collection"
      - "search_service.py `_prepare_search_context` (~lines 546-566): the apply_filters=False branch rebuilds with exclude_historical=True UNCONDITIONALLY (comment: 'historical evidence is never eligible as current law') — this clause is not disable-able the way status_vigensi's is"
      - "legal_ingestion_service.py: HISTORICAL_RETRIEVAL_SCOPE/CURRENT_RETRIEVAL_SCOPE constants, validate_legal_retrieval_scope (line 204), and a guaranteed keyword payload index on BOTH the flat and metadata-nested key (lines 567-569) — necessary because a Qdrant filter on a non-indexed key returns HTTP 400, not '0 results', so this mechanism could not silently no-op the way an unindexed field would"
    note: >
      A real, live, already-armed supersession mechanism exists and works today —
      it is simply used on 2 of 84,283 points. Whether this changes Decision 5
      (MANDATE.md §7, mark vs remove for superseded instruments) is for Zero to
      weigh; this row states the measurement, not a recommendation.
  consequence_if_populated: >
    Qdrant's must_not is a HARD exclusion at the query layer — matching points are
    removed from the result set itself, invisible even to a reranker or any
    downstream fallback (not a demotion). If status_vigensi were populated on
    legal_unified with the SAME value distribution legal_status carries today
    (e.g. by an apparent "field cleanup" that copies legal_status into
    status_vigensi), 42,420 points (50.3% of this corpus) would vanish from every
    SearchService-routed query instantly, with no code change and no review —
    including every one of Keimigrasian, Perseroan Terbatas, Cipta Kerja and
    Ketenagakerjaan (the §2 domain-knowledge table above).
  coverage_gap_finding_a: >
    The filter chain above runs on every query that goes through SearchService —
    NOT on every backend query, and NOT for either field it builds. `HybridSearchService`
    (apps/backend-rag/backend/services/rag/hybrid_search.py) is a separate class
    whose `search_hybrid()` never calls build_search_filter or _prepare_search_context
    at all (spot-checked: zero occurrences of either name, or of status_vigensi/
    retrieval_scope, in that file) — so on this path NEITHER status_vigensi-suppression
    NOR retrieval_scope-marking protects anything, for the identical reason (the
    function that builds both clauses is simply never invoked here). `app/routers/
    prime.py:42` calls it with collection="legal_unified_hybrid_hybrid" directly and
    unfiltered TODAY. `app/routers/visa_oracle.py:1064` (the Visa Oracle chat
    endpoint) also calls it unfiltered, but against collection="visa_oracle", not
    legal_unified — the SAME structural gap (HybridSearchService never filters, on
    whatever collection it is pointed at), not a second example currently touching
    legal_unified. The inverse framing matters more than the current gap: if
    status_vigensi were repaired, or if a document were correctly marked
    retrieval_scope=historical_only, these two routers would STILL serve it as
    current law, because they never reach either filter at all — this is a coverage
    fact recorded for the inventory, not an alarm about either field's own state.
  dead_config_finding_b: >
    app/core/config.py declares `search_enable_filters: bool = Field(default=False,
    description="...When False (default), filters are disabled for backward
    compatibility with chat path...")`. Repo-wide grep of apps/backend-rag/backend
    (excluding tests) finds this flag in exactly ONE place: its own declaration.
    Nothing reads it. The real code hardcodes exclude_repealed=True in
    _prepare_search_context regardless of this setting, and — separately — the
    `apply_filters is False` path (search_service.py, the comment "historical
    evidence is never eligible as current law") rebuilds with exclude_historical=True
    unconditionally, so retrieval_scope's clause is not disable-able via this flag
    or via apply_filters either. A future reader who trusts this docstring will
    conclude the opposite of current behavior for both mechanisms it claims to gate.
  dependency: >
    Do NOT populate status_vigensi on legal_unified, and do NOT unify or merge
    legal_status and status_vigensi into one field, until the legal_status repair
    (item 4 of the PENDING-ARMS "systemically FALSE" row) has landed. This is
    tighter than "no reader may be armed": status_vigensi already HAS a reader —
    the danger is not arming a new one, it is populating the field an existing
    one already watches.
  must_stay_green_exception: >
    Unlike every other check in this campaign (which must be RED today to prove
    it measures anything), the status_vigensi check in
    scripts/kb/legal_status_drift_gate.py is a DECLARED, INTENTIONAL exception:
    it must be, and stay, GREEN. The danger it guards against is a future,
    innocent-looking data operation ("these two fields mean the same thing, let's
    unify them") — not a currently-broken state. A green check that has never been
    proven capable of going red is indistinguishable from a check nobody wired up,
