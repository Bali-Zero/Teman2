# (UU_6_2011, Permen_22_2023, Permen_29_2021 — all three agree with the row
# below). It is NOT self-proving the way §3 is, and a future session with
# better sourcing may revise any single row here without touching §3 at all —
# the two sections are kept structurally separate for exactly that reason.
