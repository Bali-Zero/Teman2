    Nine document_ids independently identifiable by their [CONTEXT:] title as a
    specific, real Indonesian instrument this session (or kb/topics/immigration.yaml,
    where cross-referenced) already has sourced knowledge of. Cross-checked against
    each document's OWN recorded legal_status in this corpus, measured live above.
    This is a LOWER BOUND on the damage, not an estimate of its total extent — most
    of the corpus's 388 documents are not on this list simply because verifying each
    one against external truth is a per-instrument research task, not a Qdrant scroll.
