# kb/inventory/legal_status.yaml — field-integrity audit of `legal_status`.
#
# This is NOT a topic inventory (kind: topic — MANDATE.md §2) and NOT a
# retired-collection triage (kind: retired_collection — the schema
# kb/inventory/legal_unified_2026.yaml uses). It is a THIRD kind,
# `field_integrity`: a census of one payload field's own trustworthiness,
# corpus-wide, with a live drift gate (scripts/kb/legal_status_drift_gate.py)
# and a self-contained structural probe (kb/ops/probe_amendment_invariant.py)
# that require no domain knowledge to trust.
#
# Read by:
#   * apps/backend-rag/backend/tests/unit/kb/test_kb_inventory_contract.py
#     (only test_every_inventory_declares_a_known_kind — `field_integrity` is a
#     known kind there; every OTHER test in that module is scoped to
#     kind=retired_collection and skips this file, same as it skips kind=topic)
#   * apps/backend-rag/backend/tests/unit/kb/test_legal_status_field_integrity_contract.py
#     (this kind's own dedicated gate — internal-consistency arithmetic)
#   * scripts/kb/legal_status_drift_gate.py (rule (g) — re-measures `measured_against`
#     against LIVE production, never trusts this file's own numbers to still be true)
#
# Chronology this file closes out: scripts/kb/audit_legal_status.py (first
# whole-scroll audit, 2026-08-25) → propose_legal_status_repair.py (a narrow
# 4-document repair, REFUSED — nobody reads the field, so repairing 1,484/84,283
# points changes nothing observable while falsely authorizing a subset) →
# apps/backend-rag/backend/core/legal/constants.py::STATUS_PATTERNS RETIRED
# (2026-08-25/26 — the derivation mechanism cannot be correct at this layer for
# the revoked direction, full reasoning in that file's tombstone comment) → THIS
# FILE (2026-08-26 — a full-corpus census taken to gate a proposed 1,484-point
# write found the field is wrong on 7 of 9 externally-verifiable documents, and
# — self-provably, no external truth required — the corpus contradicts its own
# citations). PENDING-ARMS.md carries the full narrative row (search "systemically
# FALSE") this file's measurements were taken to back with numbers.

schema_version: 1
topic: legal_status
kind: field_integrity
measured_at: "2026-08-26"

# ── THE BAN ───────────────────────────────────────────────────────────────────
#
# legal_status must not be READ by any production code path until this artifact
# is superseded by a repaired field. The amendment-invariant violations below are
# corpus-internal and require no domain knowledge to trust — the corpus
# contradicts its own citations regardless of who is asking.
#
# This is not a hypothetical caution. `status_vigensi` — see that section below —
# is a DIFFERENT field name that a production filter ALREADY excludes `dicabut`
# on, corpus-wide, on every SearchService-routed query. It happens to be 0/84,283
# on `legal_unified` today, which is the ONLY thing standing between this corpus
# and an instant, code-change-free suppression of 50.3% of it — including every
# one of Keimigrasian, Perseroan Terbatas, Cipta Kerja and Ketenagakerjaan — the
# moment anyone treats "unify legal_status and status_vigensi" as a field cleanup.

# ── §1 Per-point and per-document distribution ─────────────────────────────────
#
# Whole-scroll, both payload shapes read (top-level AND metadata.legal_status —
# a probe reading only one reports damage as zero on the shape it never looked
# at). Completeness is arithmetic: per-point buckets sum to `points`, and
# per-document buckets sum to `distinct_documents`.
#
# `none` and `absent` are DIFFERENT facts, not two names for one: `none` is the
# key PRESENT with an explicit JSON null; `absent` is the key MISSING entirely.
# Collapsing them (the drift gate's first draft did exactly this — see that
# script's `_status_of` docstring) silently moved 9,012 points from one bucket
# to another with the point TOTAL unchanged, which is precisely the kind of
# error a total-only sanity check cannot catch.
measured_against:
  collection: legal_unified_hybrid_hybrid
  points: 84283
  distinct_documents: 388
  per_point:
    dicabut: 42420 # 50.3%
    berlaku: 26107 # 31.0%
    none: 9012 # 10.7% — key present, value null
    absent: 6744 # 8.0%  — key missing entirely
  per_document:
    dicabut: 190 # every point on the document says dicabut
    berlaku: 157 # every point on the document says berlaku
    none: 19 # every point on the document has legal_status: null
    absent: 8 # every point on the document has no legal_status key
    mixed: 14 # the document's own points disagree
  # Payload-key split (cross-checked independently against a second, whole-scroll
  # measurement — both parties' numbers agree exactly):
  legal_status_key_location:
    flat_top_level_only: 5797
    nested_metadata_only: 71742
    both_locations: 0
    neither_present: 6744
  # `[CONTEXT: <TYPE> - NO <N> - TAHUN <Y> - TENTANG <topic>]` header coverage —
  # see §3's caveat below for why this bounds EVERY title-dependent count in
  # this file, not just the amendment invariant.
  no_context_points: 25832 # 30.6% of points carry no CONTEXT header at all
  zero_header_documents: 185 # of 388 documents, NONE of whose points has one
  # The declared exception (see §4) — measured 0 on every scroll this campaign
  # has taken of this collection, and re-measured every time the drift gate runs.
  status_vigensi_hits: 0

# ── §2 Domain-knowledge verification (REVISABLE — not corpus-proof) ───────────
