# ── Findings this item measured but does NOT cure (mandate §8) ───────────────
open_findings:
  - id: WIZ-1
    title: "The regulatory watcher has no ingest path to any collection"
    owner: "lane F (compliance) + the regulatory-watcher lane"
    detail: >-
      com.balizero.regulatory-watcher.daily is the only regulatory job on Pro. It
      writes research/regulatory/<date>-delta.json and a Telegram alert, and
      contains no Qdrant call. Repointing the ingest runner (done here) makes a
      correct target exist; it does not connect the watcher to it. Until something
      does, every delta the watcher has ever found is still outside the KB.
    severity: high

  - id: WIZ-2
    title: "document_id is derived from the filename, not the title block"
    owner: "lane G (repair)"
    detail: >-
      11 of 18 documents carry an identity that contradicts their own text,
      metadata or filename, including an impossible PP number (6646) lifted out of
      body digits. Mandate §4.3 already states the rule; nothing enforces it at
      ingest time. The repair is a title-block extractor with guilt AND innocence
      tests, not a rename pass.
    severity: high

  - id: WIZ-3
    title: "Broken identities have already leaked into legal_unified"
    owner: "lane D, C, E, F per document"
    detail: >-
      UU_14_2023 (954 pts), PP_18_2025 (114), UU_17_2026 (58), UU_13_2016 (118)
      and 2026_UNKNOWN_UNKNOWN (37) are in the collection production reads, under
      identities their own text contradicts. This is a live retrieval defect, not a
      stranded-content one.
    severity: high

  - id: WIZ-4
    title: "ingest_kbli_notebook_expert.py targets a collection that does not exist, and deletes it first"
    owner: "lane B (company & KBLI)"
    detail: >-
      It names `kbli_notebook_expert`, absent from the registry AND from the 14
      live collections, and its first act is delete_collection(). Repointing it at
      a live KBLI collection would arm a destructive rebuild of 1,873 real points,
      so the cure is a decision, not a rename. Held in
      scripts/ci/ingest_target_lint.py::DISCOVERY_ALLOWLIST with this reason.
    severity: medium

  - id: WIZ-5
    title: "`kbli_tka` is a LIVE alias the registry does not map"
    owner: "lane E (employment & HR)"
    detail: >-
      backend/scripts/generate_tka_embeddings.py writes to `kbli_tka`, which
      resolves in live Qdrant to kbli_tka_hybrid (246 points, measured
      2026-08-25) but is absent from collection_registry.py. The write lands
      somewhere real; the registry simply does not know the name, so
      is_known_collection() is False and no code path can resolve it. The cure is
      a registry addition, not a script edit, which is why it is not made here.
    severity: medium

  - id: WIZ-6
    title: "`intel_authoritative_sources` is aliased but not mapped"
    owner: "lane F (compliance & reporting)"
    detail: >-
      Two bali-intel-scraper loaders write to it (525 live points). It appears in
      CANONICAL_COLLECTION_ALIASES mapped to `balizero_news`, but not in
