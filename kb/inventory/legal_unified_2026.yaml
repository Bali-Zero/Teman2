# WORK ITEM ZERO (MANDATE.md §1) — the disposition of `legal_unified_2026`.
#
# This file is not prose. It is read by:
#   * apps/backend-rag/backend/tests/unit/kb/test_kb_inventory_contract.py  (CI gate)
#   * scripts/kb/kb_inventory_probe.py                                      (production probe)
# `kind: retired_collection` selects this schema. A topic lane's inventory is
# `kind: topic` and follows MANDATE.md §2 instead; the gate dispatches on `kind`.
#
# Every number below was measured against production Qdrant on 2026-08-25 by
# scrolling both collections in full. Nothing here is inherited from the mandate.

schema_version: 1
topic: legal_unified_2026
kind: retired_collection
measured_at: "2026-08-25"

# ── What the mandate assumed, and what is actually true ──────────────────────
#
# The mandate opens: "the nightly regulatory watcher has been depositing
# regulations into a collection no query reaches". Three measurements contradict
# that, and they change the cure:
#
#  1. The collection is FROZEN, not filling. 15,410 points / 18 documents, with
#     `Permen_18_2021` at 10,266 and `Permen_35_2012` at 1,240 — byte-identical
#     to the figures recorded on 2026-05-16 in
#     research/nb-lifecycle/2026-05-16-r5-phase2-indexing-parity.md:202.
#     Nothing has been written to it in over three months.
#  2. The nightly watcher does not ingest ANYWHERE. The only launchd job is
#     com.balizero.regulatory-watcher.daily -> ~/scripts/regulatory-watcher-run.sh,
#     which contains zero occurrences of qdrant / upsert / ingest / embed. It
#     writes a delta JSON and a Telegram alert. There is no ingest path at all.
#  3. The runner that names the collection has never run, and could not. It
#     creates its FileHandler at module import, and ~/logs/regulatory-ingest.log
#     does not exist on Pro. Even if invoked, LegalIngestionService's preflight
#     raises LegalIngestIntegrityError for any target outside
#     ALLOWED_CANONICAL_COLLECTIONS, and this name is outside it.
#
# So the defect is not "a drawer nobody opens". It is a dead 2026-05-16 artifact,
# plus a regulatory watcher whose findings have never reached the KB by any route.

verified_premises:
  - claim: "legal_unified_2026 point count is unchanged since 2026-05-16"
    method: "full scroll today (15410) vs research/nb-lifecycle/2026-05-16-r5-phase2-indexing-parity.md:202 (15.410); same top-2 documents at the same counts"
    verdict: confirmed
  - claim: "the nightly watcher ingests into this collection"
    method: "grep -iE 'qdrant|upsert|ingest|embed' ~/scripts/regulatory-watcher-run.sh"
    verdict: refuted
    detail: "zero matches; the only launchd regulatory job never touches Qdrant"
  - claim: "the regulatory ingest runner has run"
    method: "the module builds logging.FileHandler(~/logs/regulatory-ingest.log) at import; the file does not exist"
    verdict: refuted
  - claim: "a write to legal_unified_2026 is possible today"
    method: "legal_ingestion_service.py:169 raises unless canonicalize(target) in ALLOWED_CANONICAL_COLLECTIONS = {legal_unified, tax_genius}"
    verdict: refuted

# ── The decision (mandate §1) ──────────────────────────────────────────────
decision:
  choice: retire_as_target
  # NOT "promote wholesale": 5 of 18 documents carry a contradictory identity and
  # 2 have lost theirs entirely. Promoting them would inject a Klaten regency price
  # schedule labelled "Permenkumham 22/2023 — Visa dan Izin Tinggal" into the one
  # collection every legal query reads.
  # NOT "point a reader at it": same reason, plus the payload is 100% legacy shape
  # with no top-level document_id, which the modern retrieval path does not index.
  rationale: >-
    Nothing may write to this collection again — enforced by
    scripts/ci/ingest_target_lint.py and its pytest gate, not by a comment. The
    content itself is triaged per document below: what is genuinely new AND
    correctly identified is handed to its topic lane for promotion under §4.4;
    what is duplicated is marked for discard but NOT deleted today (§4.6 needs a
    complete containment proof this measurement cannot yet give); what carries a
    broken identity is blocked and must be re-acquired from the official source.
  deletions_authorized: false
  deletions_blocked_because: >-
    The containment proof below hashes only fragments of >=40 normalized
    characters. Shorter fragments are unproven, so no deletion may proceed on this
    evidence alone. §4.6 says one uncovered fragment means do not delete.

measured_against:
  collection: legal_unified_2026
  registry_mapped: false
  points: 15410
  distinct_documents: 18
  payload_shapes: # measured by kb_inventory_probe.py::payload_shape — see compared_with
    legacy_metadata_text: 15410
    orphan_no_identity: 0
    modern_id_only: 0
    modern_id_chunk: 0
    modern_full: 0
  distinct_content_fragments: 7343 # normalized sha1, >=40 chars, CONTEXT header stripped

compared_with:
  collection: legal_unified
  physical: legal_unified_hybrid_hybrid
  registry_mapped: true
  points: 84283
  distinct_documents: 388
  # §4.1 calls the modern payload a triple (document_id + chunk_key + section).
  # Measured 2026-08-25, that triple is THREE shapes, not one: of the 5,797
  # points carrying a top-level document_id, only 792 carry all three — and
  # those 792 are exactly UU_6_2011 (413) and UU_40_2007 (379), the two
  # documents repaired that day. 4,992 carry document_id ALONE and 13 stop at
  # chunk_key. So a reader written as `if payload.get("document_id"): <use
  # section>` is wrong on 86% of the points it calls modern, and the corpus is
  # not "two generations" but one generation plus two repaired exceptions.
  # Recorded here because the probe compares these counts against production:
  # a re-ingest that shifts the mix goes RED as DRIFT.
  payload_shapes:
    legacy_metadata_text: 78486
    orphan_no_identity: 0
    modern_id_only: 4992
    modern_id_chunk: 13
    modern_full: 792
  distinct_content_fragments: 56691
  fragments_shared_with_topic: 2334 # 31.8% of this collection's content already there
  fragments_only_in_topic: 5009
  # 5,009 is the count of GLOBALLY distinct fragments absent from the read
  # collection. Summing the per-document `fragments_absent_there` below gives
  # 5,010, because exactly one fragment is shared between two documents in this
  # collection and is therefore counted once globally and twice per-document.
  # Both numbers are correct for their own question; the probe uses the
  # per-document one, which is why that is the figure recorded per document.

