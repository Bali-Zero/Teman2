# ── findings measured this pass, not chased (mandate §8 — outside-lane or repair-stage work) ──
findings:
  - id: TAXC-1
    title: "UU_13_2016 in legal_unified is real Indonesian Patent Law, not the tax identity collision the mandate head start described"
    detail: >-
      All 118 points of legal_unified's UU_13_2016 were pulled (not sampled) and are uniformly
      book_title="UU No 13 Tahun 2016 Tentang PATEN", legal_type=UU, legal_number=13,
      legal_year=2016, content about patents throughout. The "PMK 9/2018 metadata / PBB-KB
      governor's-annex text" contradiction the mandate cites lives in a separate 7-point
      fragment inside the RETIRED legal_unified_2026 collection that happens to share the same
      document_id string. `leaked_to_production: true` on that fragment's row in
      kb/inventory/legal_unified_2026.yaml is not supported by what production actually holds.
      Not a tax instrument either way — outside this lane, revisit owned by whoever holds that
      file.
    owner: "Work Item Zero / lane that owns kb/inventory/legal_unified_2026.yaml"
    severity: medium

  - id: TAXC-2
    title: "02_tasse (Italian: 'taxes') category tag is noisy — several tagged documents are not tax instruments at all"
    detail: >-
      A category-based sweep of legal_unified surfaced UU_23_2002 (Perlindungan Anak — Child
      Protection Law, mistagged 02_tasse) and a cluster of annual state-budget laws
      (UU_41_2008, UU_47_2009, UU_36_2004, UU_35_2004, UU_60_2024, UU_15_2025, UU_3_2003 —
      "Anggaran Pendapatan dan Belanja Negara" for various years) that deal with state revenue
      in a general sense but are not client-facing tax obligations Bali Zero fields questions
      on. Excluded from kb/topics/tax.yaml's scope deliberately; recorded here so the exclusion
      reads as a decision, not an oversight for anyone re-running a category-based sweep.
    owner: "lane C (tax) — informational, no action taken this pass"
    severity: low

  - id: TAXC-3
    title: "tax_genius_hybrid (340 pts) is a curated guide corpus, not primary legal text"
    detail: >-
      Single flat point-id namespace, 100% orphan_no_identity shape (no document_id field on
      any point). Sample content is consultant-dialogue Q&A (e-Faktur error codes, PPh 21
      worked examples, VAT filing deadlines, some Javanese-language chunks), categorised
      value_added_tax/income_tax/general_tax/corporate_tax/tax_registration/social_security/
      tax_residency. Useful for practical-question journeys in a later pass, but out of scope
      for THIS inventory and for kb/journeys/tax.yaml's instrument_id-anchored probes, which
      require a citable legal identity this corpus does not carry.
    owner: "lane C (tax) — informational, no action taken this pass"
    severity: low

  - id: TAXC-4
    title: "A journey can measure green on an absent instrument via a citation inside a different, present document"
    detail: >-
      kb/journeys/tax.yaml J8 (instrument_id=UU_7_2021, phrase "Harmonisasi Peraturan
      Perpajakan") measured GREEN against production 2026-08-25 even though UU_7_2021 (the HPP
      law) is confirmed absent as a document (0 points under that id anywhere in
      legal_unified). Manually inspecting the retrieved chunks: the phrase comes from a
      citation recital inside Permen_167_2022 and PP_44T_2022 ("...sebagaimana telah diubah
      terakhir dengan Undang-Undang Nomor 7 Tahun 2021 tentang Harmonisasi Peraturan
      Perpajakan"), not from HPP's own substantive text. A phrase-only probe cannot by itself
      distinguish "the instrument is ingested" from "the instrument is merely name-checked by
      something else that is ingested" — worth generalising into the probe/journey contract
      (e.g. pairing a phrase assertion with an instrument_id match on the SAME retrieved
      chunk) rather than re-deriving per topic.
    owner: "kb/ops/probe_retrieval.py owner (cross-topic, not tax-specific)"
    severity: medium

  - id: TAXC-5
    title: "UU_7_1945 in legal_unified appears to be HPP (UU 7/2021) content stored under a garbled, wrong document_id, not a real 1945 statute"
    detail: >-
      Found while running the boilerplate-distinctiveness check on kb/journeys/tax.yaml J13's
      candidate phrase (KUP Pasal 2 ayat (1), the taxpayer-registration article): a full-collection
      scroll of legal_unified's 84,283 points for that exact phrase returned exactly 2 distinct
      document_ids — UU_28_2007 (expected) and UU_7_1945 (not expected; not in this topic's scope
      list). `metadata.book_title` on all 31 points under UU_7_1945 reads "UU No 7 Tahun 1945
      Tentang HARMONI SASI PERATURAN PERPAJAI(AN" — legal_type=UU, legal_number=7, legal_year=1945
      on every point. This is not a real Indonesian statute: Indonesia had no tax-administration
      law in 1945, and "HARMONI SASI...PERPAJAI(AN" is garbled OCR of "Harmonisasi Peraturan
      Perpajakan" — HPP's own name. Content-level evidence corroborates the garbled title, not
      just the title itself: its Pasal 2 chunk carries an ayat (1a) — "Nomor Pokok Wajib Pajak
      sebagaimana dimaksud pada ayat (1) bagi Wajib Pajak orang pribadi yang merupakan penduduk
      Indonesia menggunakan nomor induk kependudukan" (the NIK-as-NPWP provision) — that
      UU_28_2007's own Pasal 2 chunk does NOT carry, because that provision did not exist until
      HPP introduced it in 2021; UU_28_2007 is a 2007 instrument and cannot contain 2021 text.
      Practical consequence: HPP's CONTENT may be reachable in production even though the identity
      UU_7_2021 is confirmed absent — checked three independent ways, see this file's UU_7_2021
      row above — zero points under that id anywhere in legal_unified. The bookkeeping "instrument
      absent" and the practical "is this content retrievable" question have come apart; a client
      question about HPP could plausibly retrieve this mislabeled fragment even though the
      identity-level absence claim remains literally true. Separately, `metadata.legal_status` on
      this id reads "dicabut" (revoked) — noted but NOT asserted confidently, since it may itself
      be an OCR/mislabel artifact of the same ingest defect that produced the wrong year, rather
      than a genuine status determination.
    owner: "lane C (tax), flagged for repair-stage — reindexing/relabeling is out of scope for this measurement pass"
    severity: medium
