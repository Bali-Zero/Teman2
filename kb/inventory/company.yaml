# ── UU_25_2007 fragment-by-fragment categorisation, MANDATE §7 decision 2's
#    containment order STEP 1: "prove what the 65 points contain, fragment by
#    fragment, with a printed ratio" — BEFORE writing over that document_id.
#    Every one of the 65 points in production was read (not sampled).
uu_25_2007_fragment_categorisation:
  method: >
    Full scroll of legal_unified_hybrid_hybrid filtered to document_id == UU_25_2007
    (both top-level and metadata.document_id, per §4.1) — all 65 points retrieved
    and read individually, categorised by content shape, cross-checked against a
    live peraturan.go.id fetch confirming the correct title/enactment/status.
  total_points: 65
  categories:
    bare_cukup_jelas: 21 # e.g. "Cukup jelas." with no other content
    cukup_jelas_plus_more: 15 # "Cukup jelas." combined with adjacent ayat/huruf explanation in the same chunk
    other_elucidation_narrative: 26 # explanatory prose without the literal phrase, e.g. "UMUM Salah satu tujuan pembentukan pemerintahan negara...", "Yang dimaksud dengan..."
    administrative_boilerplate: 2 # enactment/promulgation signature block; one of these two literally contains the string "PENJELASAN ATAS UNDANG UNDANG REPUBLIK INDONESIA NOMOR 25 TAHUN 2007 TENTANG PENANAMAN MODAL", confirming these are the law's OWN Penjelasan
    genuine_operative_article_text: 0 # zero — no point carries a direct normative provision ("Pasal N: every investor shall...")
  ratio: "0/65 operative articles present (0.0%); 65/65 are Penjelasan or administrative boilerplate (100.0%)"
  pasal_marker_finding: >
    Exactly one "Pasal N" string occurs anywhere across all 65 points: "Pasal 33".
    Read in context (point id ffe421b0): "...telah dijabarkan dalam Pasal 33
    Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan merupakan amanat
    konstitusi..." — this is a citation to Article 33 of the 1945 Constitution
    (the economy clause), NOT to UU 25/2007's own Pasal 33. UU 25/2007's own
    operative-article count present in production is therefore 0, not 1.
  disposition: >
    STOPPED AT STEP 1 of the mandated three-step order (prove containment -> retire
    -> write whole instrument). Step 1 is now complete with a decisive, fragment-
    level printed ratio: what is stored is genuinely the law's own Penjelasan (not
    a different document, not corrupted text — identity and content both check out
    as UU 25/2007's own elucidation), it is simply the WRONG HALF of the
    instrument. Steps 2 (retire the 65-point fragment) and 3 (ingest the whole
    instrument — batang tubuh + Penjelasan, using the same section-tagged
    hierarchical-indexer path that repaired UU_40_2007/UU_6_2011) require invoking
    the production legal-ingestion pipeline
    (backend/services/ingestion/legal_ingestion_service.py /
    legal_full_ingestion_worker.py) against a freshly-fetched official PDF
    (https://peraturan.go.id/id/uu-no-25-tahun-2007, confirmed live and %PDF-
    fetchable) and handling the identity guard (#4869) so the new ingest is
    recognised as the SAME document_id rather than refused as a claim collision.
    This lane deliberately did not execute an unreviewed production write in this
    pass — recorded as the explicit next unit of work (kb/topics/company.yaml
    owner_decisions_log), not silently deferred. The existing 65 points must NOT be
    deleted before the fuller instrument is written and verified (MANDATE §4.6):
    they are genuine (if partial) content, not garbage.

