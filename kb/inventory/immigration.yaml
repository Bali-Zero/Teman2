# ── Findings measured this session that lane A does NOT chase (§8, rule 8) ─────
open_findings:
  - id: LANE-A-1
    title: "`legal_status` metadata is wrong on at least one live, in-force instrument"
    owner: "unassigned — likely a corpus-wide ingestion/parsing defect, not a lane-A ingest edit"
    detail: >-
      Permen_22_2023 (current, in-force Visa dan Izin Tinggal regulation) carries
      `legal_status: dicabut` ("revoked") on every one of its 402 points, sampled
      directly. Permen_29_2021 (genuinely superseded) carries the SAME value. Any
      retrieval-time filter that trusts this field to exclude revoked content (e.g.
      `SearchService.search(..., apply_filters=True)`'s documented exclude_repealed
      behaviour) would either do nothing here (both flagged identically) or exclude
      the WRONG document. This is the field that would have been the clean fix for
      journey 4's defect (below) and it cannot be trusted as-is. Scope of the defect
      beyond these two documents is UNDETERMINED — not measured this session.
    severity: high

  - id: LANE-A-2
    title: "Superseded Permen_29_2021 outranks current Permen_22_2023 for a live ITAS-duration question"
    owner: "lane A / whoever owns retrieval ranking + the legal_status defect above"
    detail: >-
      MEASURED via kb/ops/probe_retrieval.py, journey 4, on 2026-08-25: asking
      "Berapa lama masa berlaku Izin Tinggal Terbatas (ITAS)...?" retrieves the
      SUPERSEDED Permen_29_2021 duration text (a different tier structure:
      5y/2y/1y/180d/90d) at rank 3, while the equivalent phrase from the CURRENT
      Permen_22_2023 (journey 3) does not rank in the top 10 for the identical
      question. This is MANDATE.md §7 decision 5's exact concern, confirmed live —
      not repaired here (repair is a re-rank or an ingest-time supersession flag,
      both outside a single lane-A PR's ~200-logic-line budget).
    severity: high

  - id: LANE-A-3
    title: "immigration_circulars and visa_oracle are live, routed collections lane A did not build journeys against"
    owner: "future lane-A work, or a dedicated cross-collection routing lane"
    detail: >-
      `surface_router.py:63` sends "visa"/"kitas"/"imigrasi" questions to
      `visa_oracle` FIRST in production, with `immigration_circulars` as a
      documented fallback — collection_registry.py, query_router.py and
      fallback_manager.py all confirm both are live-wired, not scaffolding.
      immigration_circulars (1,979 points, single ingestion generation, rich
      per-chunk metadata: regulation_number/title/ministry/issuing_authority) holds
      the SAME Golden Visa provisions (Permen_22_2023 BAB V/VI) under a different
      chunking, plus PP 31/2013, UU 63/2024, and several instruments not measured
      as part of this pass (Permen 8/2021, Permen 34/2021, UU 8/2019, etc. — see
      the full regulation_number census this session captured but did not turn into
      journeys). visa_oracle (90 points, curated per-visa-type "expert cards": C9,
      C13, E28C, E31H, E31E, E28B, KITAS→KITAP conversion, overstay/deportation —
      no dedicated Golden Visa card, but 5 of its cards mention Golden Visa in
      passing) is the collection a REAL production Golden Visa chat message would
      actually be routed to first, and lane A's 8 journeys never probe it. This is
      a real coverage gap in what "current" means for this topic, named rather than
      silently assumed equivalent to the legal_unified journeys above.
    severity: medium

  - id: LANE-A-4
    title: "UU_63_2024 exists as two unreconciled ingestion generations"
    owner: "Lane P (parser capability) or a lane-A follow-up re-ingest"
    detail: >-
      10 points shape `modern_id_only` + 28 points shape `legacy_metadata_text` for
      the same 10-article law, with no cross-reference between the two. Not the
      same defect class as the two poisoned identities (both generations here carry
      the CORRECT identity) — it is an unreconciled-duplicate-generation defect,
      the same shape Work Item Zero found and repaired for UU_6_2011/UU_40_2007,
      just not yet repaired for this instrument.
    severity: medium

  - id: LANE-A-5
    title: "The visa index codes real clients use (C1/C5/D12/E33/E31/E28) have zero lexical grounding in legal_unified's lane-A corpus"
    owner: "future lane-A work, or the collection-routing question LANE-A-3 already names"
    detail: >-
      OWNER-SWITCHBOARD.md §1.3 (measured over 2,752 real immigration questions):
      clients ask via bare index codes (C1, C5, C12, D1, D12, E33G, E31/E28A) or
      colloquial handles, never a statute number. A targeted regex scroll of ALL 402
      Permen_22_2023 points and ALL 345 Permen_11_2024 points (the two lane-A
      instruments most likely to carry the index table) for the literal tokens
      `C1`/`C5`/`D12`/`E33`/`E31`/`E28`/"Indeks" found ZERO hits in either — the
      index-code vocabulary is not lexically present anywhere in this lane's scoped
      legal_unified corpus. It IS present elsewhere: LANE-A-3 already recorded that
      visa_oracle's 90 curated cards use index codes (C9, C13, E28C, E31H, E31E,
      E28B — a different, non-overlapping set from OWNER-SWITCHBOARD's examples,
      which is itself worth a second look). This sharpens LANE-A-3: a client
      question phrased as a bare index code most likely needs visa_oracle's
      per-visa-type cards, not legal_unified's statute text, regardless of retrieval
      tuning — no amount of re-ranking legal_unified surfaces a token it does not
      contain.
    severity: medium

  - id: LANE-A-6
    title: "hak pakai / property-tenure mechanics for second-home KITAS are absent from legal_unified's lane-A corpus"
    owner: "Lane D (property) or a joint A×D follow-up"
    detail: >-
      OWNER-SWITCHBOARD.md §1.4 names "secondary-home KITAS against hak pakai and
      property value rather than a bank deposit" as a real A×D cross-lane question
      shape. Pasal 185/186's "rumah kedua" (second-home) visa category, WITH an
      explicit 60-plus "lanjut usia" (retirement) sub-clause, IS genuinely present
      in Permen_22_2023 (confirmed by direct scroll, not assumed) — but a targeted
      search for `hak pakai` and `deposit`/`deposito` across the same 402+345 points
      found ZERO hits for either. MEASURED via kb/ops/probe_retrieval.py, journey
      10, on 2026-08-25 (3 stable runs, all red): the retirement/second-home
      question does not even clear the visa-eligibility half from Pasal 185/186, so
      the property-tenure half's absence could not even be separately isolated this
      session — both are open. Not chased here (property-tenure mechanics are Lane
      D's domain by MANDATE.md's own lane split).
    severity: medium
