  - question: "Kalau saya pegang KITAS, itu masa berlakunya berapa lama sih?"
    verbatim_phrase: "Izin Tinggal Terbatas bagi Orang Asing yang masuk ke Wilayah Indonesia dengan Visa tinggal terbatas"
    instrument_id: Permen_22_2023
    collection: legal_unified
    phrasing: client
    language: id
    cross_topic: false
    expectation: retrieves
    probe_state: red
    probe_run_at: "2026-08-25"
    note: >-
      OUTSTANDING, not broken: this exact phrase is confirmed present in
      legal_unified's Permen_22_2023 copy (kb/topics note), but did not rank in the
      top 10 for this exact question wording — measured AGAIN after rewording to
      colloquial "KITAS" phrasing, same result. Journey 4 below shows WHY this red
      matters more than an ordinary coverage gap.

  # 4 — NEGATIVE CANARY, client-phrased (same real question as 3), MEASURED GREEN —
  # a live defect, not a hypothetical. Asking about CURRENT ITAS duration surfaces
  # the superseded Permen_29_2021 text (a DIFFERENT duration structure:
  # 5y/2y/1y/180d/90d) at rank 3, while journey 3's phrase from the CURRENT
  # Permen_22_2023 does not rank in the top 10 for the identical question. This is
  # exactly MANDATE.md §7 decision 5: "an amended article still answering with its
  # old text is worse than silence."
  # ROOT CAUSE FOUND, not yet fixed (out of lane A's ingest-repair scope for this
  # PR): both Permen_29_2021 AND Permen_22_2023 carry `legal_status: dicabut`
  # ("revoked") in their own payload — Permen_29_2021 correctly, Permen_22_2023
  # WRONGLY (it is the current in-force regulation). So `SearchService.search(...,
  # apply_filters=True)`'s exclude_repealed path — if pointed at this field — could
  # not fix this: it would either do nothing (both flagged the same way) or exclude
  # the WRONG document. Recorded as an inventory finding (LANE-A-1/2); the fix is a
  # corpus-wide `legal_status` re-derivation, not a lane-A ingest edit.
  - question: "Berapa lama masa berlaku Izin Tinggal Terbatas (ITAS) bagi WNA yang masuk dengan visa tinggal terbatas?"
    verbatim_phrase: "Izin Tinggal Terbatas diberikan untuk jangka waktu paling lama"
    instrument_id: Permen_29_2021
    collection: legal_unified
    phrasing: client
    language: id
    cross_topic: false
    expectation: retrieves
    probe_state: green
    probe_run_at: "2026-08-25"
    measured_rank: 3
    canary: true
    canary_meaning: "green means a question about CURRENT stay-permit duration surfaces a regulation officially revoked by Permen_22_2023 — MEASURED TRUE on 2026-08-25, not a hypothetical. See the note above."

