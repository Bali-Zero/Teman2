# kb/journeys/immigration.yaml — Lane A (immigration & visa), KB current-live campaign
# MANDATE.md §2, second artifact. Written BEFORE promotion/repair work, per G2: this
# suite must fail RED against production cleanly on the day it is written.
#
# `probe_state` / `probe_run_at` below are the OUTPUT of running
# `kb/ops/probe_retrieval.py kb/journeys/immigration.yaml` against PRODUCTION on
# 2026-08-25 — not a prediction. First run (before this file was corrected) reported
# DRIFT on journeys 1, 4 and 7: recorded 'red', production measured 'green'. Values
# below are the corrected, re-verified state — a re-run against the corrected file
# exits 0/2 (AT TARGET / OUTSTANDING), never 1 (DRIFT), or this file is lying about
# itself again.
#
# `collection:` is explicit on every entry (MANDATE §5 routing note): production's
# own router sends "visa"/"kitas"/"imigrasi" questions to visa_oracle first, with
# immigration_circulars as a documented fallback (surface_router.py:63) — NOT to
# legal_unified. Every journey here targets legal_unified deliberately, because that
# is the collection Work Item Zero closed on and the one every OTHER legal query in
# this campaign reads; visa_oracle / immigration_circulars coverage is recorded as an
# open finding in kb/inventory/immigration.yaml, not silently assumed equivalent.
#
# Journeys 2 and 8 are NEGATIVE CANARIES, not positive coverage checks: their
# `verbatim_phrase` is drawn from a POISONED instrument's own text, and `probe_state:
# red` (phrase NOT found) is the SAFE, CORRECT, permanent state. If either ever
# measures green, that is a regression — the poison has leaked into production —
# and MANDATE.md §7 decision-log / this topic's kill_criterion both name it directly.
#
# `expectation` (2026-08-25, cross-family review finding — MANDATE §8 vs a canary's
# forever-red state contradicted each other with no valid resolution before this):
# journeys 2 and 8 carry `expectation: must_not_retrieve` plus a `reason` — for them,
# `probe_state: red` is SATISFIED, not outstanding, and `at_target` no longer requires
# them to turn green (they never should). Every other journey here keeps the implicit
# default, `expectation: retrieves`, which is what `probe_state` always meant before
# this field existed. `probe_state` itself is UNCHANGED semantics for every journey —
# it still records exactly what production measured, never what was hoped for.
#
# `phrasing`/`language`/`cross_topic` were added to the contract by another lane's
# landing on feature/kb-current after this file's first draft (measured over 10,929
# real client WhatsApp messages: not one named an instrument by citation). Every
# question below was re-read against that measurement, not just tagged to satisfy
# the gate: `client`-phrased journeys carry no statute citation; `statute`-phrased
# ones are the technical/procedural questions a lawyer, not a walk-in client, would
# ask.
#
# SECOND PASS (2026-08-25, same day) — the orchestrator measured OWNER-SWITCHBOARD.md
# §1.3/§1.4/§1.5 directly against 2,752 immigration question-bearing messages: real
# clients ask via index codes (C1/C5/C12/D1/D12/E33G/E31/E28A) and colloquial handles
# ("investor KITAS", "secondary home KITAS", "retirement KITAS", "nomad/remote-working
# visa"), never a statute number. Lane A checked the corpus for the literal index
# codes first, honestly: a targeted regex scroll of ALL 402 Permen_22_2023 points and
# ALL 345 Permen_11_2024 points for `C1`/`C5`/`D12`/`E33`/`E31`/`E28`/"Indeks" found
# ZERO hits in either instrument — the alphanumeric index table clients actually use
# has no lexical grounding anywhere in this lane's scoped corpus (recorded as finding
# LANE-A-5 in the inventory, not fabricated into a journey here). What the same scroll
# DID find, genuinely present and previously unused: Pasal 185/186's "rumah kedua"
# category (second-home KITAS, WITH an explicit "Orang Asing lanjut usia berusia 60
# tahun atau lebih" sub-clause — the real retirement-KITAS route), and Pasal 33's
# "pekerja jarak jauh (remote worker)" visa (the real nomad/remote-work visa, with a
# US$60,000/year income floor). Journeys 3 and 6 were reworded from official
# terminology ("Izin Tinggal Terbatas (ITAS)") to the colloquial "KITAS" clients
# actually use, same instrument and verbatim_phrase, then RE-RUN — a question's
# wording is what production embeds and searches, so this is a real re-measurement,
# not a relabeling. Journeys 10 and 11 are new, built on the rumah-kedua/lanjut-usia
# and remote-worker findings. 7 of 11 are in Indonesian (`id`); journey 11 is
# deliberately `en` — OWNER-SWITCHBOARD §1.5 measured English/Indonesian/Italian/
# Spanish mixed in one corpus, and an Indonesian-only suite would still under-certify
# what an English-speaking client actually sends.

