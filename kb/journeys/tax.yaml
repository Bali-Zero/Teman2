# Lane C — Tax, journey probes (MANDATE §2/§3). Written BEFORE any ingestion or repair.
# Every verbatim_phrase below is a real substring pulled from an actual chunk's own TEXT this
# pass (never invented, never taken from a title/metadata field alone) — three exceptions
# (J5, J7, J8) target instruments confirmed ABSENT from legal_unified this pass, where the
# phrase instead comes from the instrument's real text in its ONE known home (a retired
# collection for J5) or from the instrument's standard, widely-published statutory phrasing
# corroborated by a WebSearch/WebFetch this pass (J7, J8) — see kb/inventory/tax.yaml and
# kb/topics/tax.yaml for the method behind each.
#
# REBASED 2026-08-25 onto origin/feature/kb-current@79a926cba, which added three required
# per-journey fields and three set-level rules (measured over 10,929 real client
# WhatsApp questions — see docs/plans/2026-08-25-kb-current-live/OWNER-SWITCHBOARD.md §1):
#   - phrasing: client|statute — NOT ONE of 10,929 sampled client questions named an
#     instrument. `question` phrased the way a client actually asks (index code / colloquial
#     handle) is `client`; `question` invoking the statute's own name/number is `statute`.
#     `verbatim_phrase` is UNAFFECTED either way — it stays the statute's own words, because
#     that is what must be found in the retrieved context regardless of how the question reads.
#   - language: en|id|it|es — the sampled traffic is four languages, often mixed in one message.
#   - cross_topic (+cross_topic_lane) — OWNER-SWITCHBOARD §1.4 names "reporting tax under the
#     accommodation NIB" as a real B×C crossing in the sample; J10 below is that journey.
# Re-audit performed this pass, per an adversarial finding against kb/ops/probe_retrieval.py
# (no floor on verbatim_phrase length or distinctiveness, in the probe itself — the 12-char
# floor lives only in the schema gate; a generic/boilerplate phrase can clear both and prove
# nothing): J1, J3 and J4's green verdicts were re-checked by pulling the actual retrieved hit
# and confirming ITS OWN document_id equals the claimed instrument_id — not just phrase
# presence in unattributed context. All three are genuine, source-confirmed hits (see notes).
# J8 (HPP, UU_7_2021) was NOT defensible on re-check: TAXC-4 (kb/inventory/tax.yaml) had
# already shown its original phrase, the law's own short name, is boilerplate that recurs in
# every OTHER instrument's amendment-citation clause. J8 was rewritten below with a
# numeric-rate phrase distinctive to HPP's substantive content and re-probed fresh; see its
# note for the honest result and the sourcing caveat.
#
# LOWER BOUND CAVEAT (adversarial finding, this pass): every verdict below was measured from a
# local venv where google-genai is version-skewed against this repo's lock (requirements.lock.txt
# pins a different version than installed), which makes Gemini query expansion raise and get
# swallowed — kb/ops/probe_retrieval.py's own `warn_if_degraded()` prints this banner live.
# Retrieval below runs WITHOUT multilingual query expansion. Every RED recorded here is
# therefore a LOWER BOUND on what production actually retrieves, never an upper one — a red
# measured in this environment could be green in production once expansion is live. Every
# GREEN is unaffected by this caveat (a hit under a degraded path is still a real hit).
#
# Collection target: ALL ten journeys are run with `--collection legal_unified` (the probe
# tool's default and the collection kb/inventory/tax.yaml measures — the only collection any
# journey in this file targets; there is no non-default --collection anywhere in this campaign
# for lane C, so the probe's silent-fallback-on-typo defect, also found this pass, is N/A here).
# tax_genius_hybrid (the curated Q&A guide corpus, no citable document_id — see
# kb/topics/tax.yaml) is deliberately NOT probed here: it has no instrument_id this schema can
# anchor a journey to. A red on any journey below means "not indexed in legal_unified", not "in
# the other collection".
#
# Run: ./apps/backend-rag/.venv/bin/python kb/ops/probe_retrieval.py kb/journeys/tax.yaml
# probe_state / probe_run_at below are the REAL recorded verdicts from that run, not filled in
# ahead of running it (MANDATE §3: the suite must fail red against production on day one, and
# this tool deliberately will not write its own expected value back — a human/lane does).

