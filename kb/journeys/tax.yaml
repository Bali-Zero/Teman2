# Lane C — Tax, journey probes (MANDATE §2/§3). Written BEFORE any ingestion or repair.
# Every verbatim_phrase below is a real substring pulled from an actual chunk's own TEXT this
# pass (never invented, never taken from a title/metadata field alone) — three exceptions
# (J5, J7, J8) target instruments confirmed ABSENT from legal_unified this pass, where the
# phrase instead comes from the instrument's real text in its ONE known home (a retired
# collection for J5) or from the instrument's standard, widely-published statutory phrasing
# corroborated by a WebSearch/WebFetch this pass (J7, J8) — see kb/inventory/tax.yaml and
# kb/topics/tax.yaml for the method behind each.
#
# Collection target: ALL eight journeys are run with `--collection legal_unified` (the probe
# tool's default and the collection kb/inventory/tax.yaml measures). tax_genius_hybrid (the
# curated Q&A guide corpus, no citable document_id — see kb/topics/tax.yaml) is deliberately
# NOT probed here: it has no instrument_id this schema can anchor a journey to. A red on any
# journey below means "not indexed in legal_unified", not "in the other collection".
#
# Run: ./apps/backend-rag/.venv/bin/python kb/ops/probe_retrieval.py kb/journeys/tax.yaml
# probe_state / probe_run_at below are the REAL recorded verdicts from that run, not filled in
# ahead of running it (MANDATE §3: the suite must fail red against production on day one, and
# this tool deliberately will not write its own expected value back — a human/lane does).

