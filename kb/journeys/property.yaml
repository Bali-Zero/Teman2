      differ from a private party's Hak Atas Tanah?
    verbatim_phrase: "Perolehan tanah Hak Pengelolaan atau Hak Atas Tanah"
    instrument_id: Permen_18_2021
    probe_state: red
    probe_run_at: "2026-08-25"

