    declared_identity: >
      Carried forward from a prior investigation as two candidate labels — "UU
      31/2010" and "Perda 15/2019" — described as "contradictory on all four of
      id, metadata, filename, and text". This lane's own re-measurement (2026-08-25)
      could not locate the underlying record that prior finding described.
    verified_identity: >
      UNVERIFIED. Neither "UU_31_2010" nor "Perda_15_2019" appears among the 388
      distinct document_id values in production `legal_unified` (exact string
      match, both tried). The only near-match by number+year, UU_15_2019 (4 pts),
