      Peninjauan terhadap Undang-Undang" (post-enactment legislative review
      procedure, DPR/DPD/Pemerintah), nothing about land or Bali. Whether the
      original entry is buried inside one of the four UNKNOWN-identity buckets
      (UU_UNKNOWN_UNKNOWN: 2,953 pts, Permen_UNKNOWN_UNKNOWN: 2,435 pts,
      UU_UNKNOWN_2023: 94 pts, UU_UNKNOWN_1945/2000: 83 pts) was not established —
      searching ~5,565 unidentified points for one instrument was out of this
      lane's time budget. Genuinely UNDETERMINED, not confirmed absent by content.
    identity_verdict: lost
    status: unknown
    source_url: "https://peraturan.go.id/uu?tahun=2010"
    source_verified: false
