      national PP series, so "Nomor 7 Tahun 2025" collides across two entirely
      different instrument types — this is the same defect class as UU_13_2017 and
      UU_49_2021 above, one level further: not just the wrong issuing body, but a
      genuine cross-type number collision. Confirmed live via peraturan.go.id (fetched
