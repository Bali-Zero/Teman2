      reads verbatim "UU - NO 13 - TAHUN 2017 - TENTANG PEDOMAN DAN TATA CARA
      PERIZINAN DAN FASILITAS PENANAMAN MODAL".
    verified_identity: >
      Peraturan Badan Koordinasi Penanaman Modal (BKPM) Nomor 13 Tahun 2017 tentang
      Pedoman dan Tata Cara Perizinan dan Fasilitas Penanaman Modal — a BKPM HEAD
      REGULATION, not a national Undang-Undang. Confirmed live via peraturan.go.id
      (fetched 2026-08-25): exact title match, enacted 4 December 2017, published
      Berita Negara 11 Dec 2017 No. 1767 — which matches the production chunk text
      itself verbatim ("www.peraturan.go.id 2017, No.1767"), independent
      cross-validation between the live source and the stored content. Status: "Tidak
      Berlaku" (revoked), superseded by TWO successor regulations: Peraturan BKPM No.
      5 Tahun 2018 (pioneer-industry tax facility procedure) and Peraturan BKPM No. 6
      Tahun 2018 (licensing/facility guidelines, the direct successor of this
      document's own subject matter).
    identity_verdict: contradictory
    status: superseded
    superseded_by: "Peraturan BKPM Nomor 6 Tahun 2018 (licensing/facility guidelines); Peraturan BKPM Nomor 5 Tahun 2018 (pioneer-industry tax facilities)"
    source_url: "https://peraturan.go.id/id/peraturan-bkpm-no-13-tahun-2017"
    source_verified: true

