    verified_identity: >
      Peraturan Kepala Badan Pusat Statistik (BPS) Nomor 7 Tahun 2025 tentang
      Klasifikasi Baku Lapangan Usaha Indonesia (KBLI 2025) — a BPS regulation, NOT a
