    source_verified: true

  # ── Consistent identity, present, but content is HOLLOW — MANDATE §7 decision 2 ──
  - id: UU_25_2007
    declared_identity: "Undang-Undang Republik Indonesia Nomor 25 Tahun 2007 tentang Penanaman Modal"
    verified_identity: "Undang-Undang Republik Indonesia Nomor 25 Tahun 2007 tentang Penanaman Modal"
    identity_evidence: >
      declared_identity == verified_identity — the STORED IDENTITY IS CORRECT, which
      is what makes this worse than absence. Confirmed live via peraturan.go.id
      (fetched 2026-08-25): exact title match, enacted 26 April 2007, status
      "Berlaku" (amended by Perpu 2/2022 / Cipta Kerja). Independently re-measured in
      production (2026-08-25, full scroll of all 84,283 points, all 65 points read
      fragment-by-fragment — see kb/inventory/company.yaml for the categorised
      breakdown): every one of the 65 points is either literal "Cukup jelas."
      boilerplate (36), other elucidation-register narrative (26, e.g. "UMUM Salah
      satu tujuan pembentukan pemerintahan negara..."), or administrative/enactment
      boilerplate (2, e.g. the promulgation signature block, which itself contains
      the phrase "PENJELASAN ATAS UNDANG UNDANG REPUBLIK INDONESIA NOMOR 25 TAHUN
      2007 TENTANG PENANAMAN MODAL" — confirming these are the law's own Penjelasan,
      not a different document). ZERO points contain the operative body (batang
      tubuh) of the law: no chunk carries a direct normative provision ("Pasal N:
      Every investor shall..."). The sole "Pasal 33" marker found anywhere in the 65
      points is a CITATION, not the law's own article — it appears inside elucidation
      prose citing "Pasal 33 Undang-Undang Dasar Negara Republik Indonesia Tahun
      1945" (the 1945 Constitution's Article 33 on the economy), not UU 25/2007's
      own Pasal 33. So the correct count of UU 25/2007's own operative articles
      present in production is not "1 of ~40" as first measured — it is 0 of ~40.
    identity_verdict: consistent
    status: in_force
    source_url: "https://peraturan.go.id/id/uu-no-25-tahun-2007"
    source_verified: true

