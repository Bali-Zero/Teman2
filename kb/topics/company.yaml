    identity_verdict: contradictory
    status: in_force
    source_url: "https://peraturan.go.id/id/perpres-no-49-tahun-2021"
    source_verified: true

  # ── Contradictory: a BPS regulation, filed under a PP (Peraturan Pemerintah) id ──
