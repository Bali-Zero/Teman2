# kb/topics/company.yaml — Lane B (company & investment), KB current-live campaign.
#
# MANDATE §2/§3 G0: who asks, the questions this topic must never get wrong, primary
# metric, guardrails, kill criterion. Nothing here blocks build — it is a prepared
# proposal; Zero's signature is collected at the end (MANDATE §7 row 1).
#
# All `instruments` below are MEASURED against production `legal_unified`
# (physically `legal_unified_hybrid_hybrid`, 84,283 pts / 388 docs) on 2026-08-25 by a
# full scroll of the collection (not a sample), independently re-read fragment by
# fragment — see kb/inventory/company.yaml for the point-level measurement and the
# UU_25_2007 containment proof this topic's opening decision (OWNER-SWITCHBOARD.md
# decision 2) required before any write.

schema_version: 1
lane: B
topic: company

asker: >
  A foreigner (or their agent) asking Bali Zero how to found, hold, or restructure a
  PT/PT PMA in Indonesia — capital rules, which KBLI code covers their activity,
  OSS/BKPM licensing, and whether a numbered instrument they were told about is the
  real, current law or a mislabeled fragment of something else.

must_never_get_wrong:
  - "What is the minimum paid-up capital for a PT PMA, and has BKPM 5/2025 changed it?"
  - "Can a PT PMA be converted into a local PT (PT PMDN), or sold/transferred to new owners?"
  - "Which KBLI code covers a given business activity (e.g. real estate leasing,
    short-stay rental, management services), and can it be changed after formation?"
  - "What form can paid-up share capital take besides cash?"
  - "What does UU 25/2007 (the Investment Law) actually say about investor rights and
    obligations — and is what the corpus returns under that number the whole law?"
  - "Is a cited BKPM/OSS regulation still in force, or has a later one replaced it
    (e.g. Perka BKPM 13/2017, PP 5/2021 vs PP 28/2025)?"
  - "Does my existing NIB/business license cover a KBLI activity I never actually
    started (e.g. licensed for real estate + retail, only opened one)?"
  - "What is the fast-track licensing threshold (investment value / labour absorption)
    for large PMA/PMDN projects, and is that rule still current?"
  - "Which business fields are open vs closed to foreign investment, and what is the
    default rule when a field is not explicitly listed?"
  - "Does a merger, consolidation, acquisition or spin-off of a PT require specific
    protections for minority shareholders, employees and creditors?"

primary_metric: >
  Of the journeys in kb/journeys/company.yaml, the fraction whose verbatim_phrase is
  found in RETRIEVED CONTEXT from production `legal_unified` (probe_state: green),
  measured by kb/ops/probe_retrieval.py --collection legal_unified.

guardrails:
  - Never let a document restarting its own numbering under a national-statute prefix
    (UU_/PP_/Permen_) answer as if it carried that standing — UU_13_2017, UU_49_2021
    and PP_7_2025 below are all live examples of a BKPM/Presidential/BPS regulation
    stored under the wrong instrument-type prefix.
  - Never treat UU_25_2007 as a complete statute without flagging that production
    holds only its Penjelasan (elucidation) — see instrument row and containment
    proof in kb/inventory/company.yaml. An absent law abstains; this one must not be
    allowed to answer from commentary as if it were the operative text.
  - Never report "missing" or "superseded" from a single lookup (MANDATE §4.2) —
    three distinct methods, or it is not a finding. Every status claim below carries
    a live peraturan.go.id fetch, not an inherited assumption.
  - Never merge two ministries' regulations sharing one document_id (Permen_1_2026 is
    a measured 7+-way collision — PMK tax, Permenimipas immigration, Kemenperin SNI
    standards, Kemenko Pangan, Kemenpora, health-crisis, KUR credit — none of which is
    lane B's own instrument; recorded, not chased, not scoped into this topic).

kill_criterion: >
  If, after G4 build, UU 25/2007 still answers a client's investment-law question from
  its Penjelasan alone with no signal that the operative articles are absent, this
  topic does not ship as "current" — an investor being told the law "says" something
  when the corpus only holds the commentary is a client-harm class of error, not a
  coverage gap.

owner_decisions_log:
  - date: "2026-08-25"
    note: >
      Decision 2 (OWNER-SWITCHBOARD.md) signed by Zero: re-acquire UU 25/2007 whole
      under the containment order. This topic file records step 1 of that order
      (prove what the 65 points contain) with a fragment-by-fragment categorisation —
      see kb/inventory/company.yaml. Steps 2-3 (retire the fragment, ingest the whole
      instrument via the production legal-ingestion pipeline) are NOT executed in this
      pass — they require a production write against `legal_full_ingestion_worker.py`
      / `legal_ingestion_service.py` with a fetched official PDF, which this session
      stopped short of to avoid an unreviewed production mutation. Recorded as the
      explicit next unit of work, not silently deferred.

