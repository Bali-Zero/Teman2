# Lane C — Tax. Scope: UU KUP / PPh / PPN, PMK, e-Faktur & Coretax, expatriate-relevant
# obligations (SPT Tahunan, NIK-NPWP). MANDATE §2: this file is the SCOPE — the instruments
# a client tax question must be answered against. Presence/measurement lives in
# kb/inventory/tax.yaml; probe questions live in kb/journeys/tax.yaml.
#
# Every declared_identity / verified_identity pair below was measured against production
# Qdrant (legal_unified_hybrid_hybrid) and, where noted, the retired legal_unified_2026 on
# 2026-08-25 — never inherited from the mandate's head start without a fresh lookup (mandate
# rule: re-verify before acting). Two corrections to that head start are recorded inline
# because they change what a downstream reader should trust:
#
#   1. UU_13_2016 is NOT a tax instrument and is NOT the identity collision the mandate
#      described. All 118 points of legal_unified's UU_13_2016 were pulled and are 100%
#      consistent Indonesian Patent Law (book_title "UU No 13 Tahun 2016 Tentang PATEN",
#      legal_type=UU/number=13/year=2016 on every point) — real, correctly identified, and
#      outside this lane's scope (it belongs with company/IP, not tax). The "PMK 9/2018 /
#      PBB-KB governor's annex" contradiction the mandate cites lives in a SEPARATE, tiny
#      (7-point) fragment inside the RETIRED legal_unified_2026 collection that merely shares
#      the same document_id string by coincidence. `leaked_to_production: true` on that
#      fragment's row in kb/inventory/legal_unified_2026.yaml is therefore not supported by
#      what is actually in production and should be revisited by whoever owns that file — not
#      chased further here (mandate §8: a defect outside tax is an inventory row, not a chase).
#   2. The head start's proposed real_identity for "Permen_32_2022" — "PER-7/PJ/2025 —
#      NIK-NPWP Coretax", drawn from that point's METADATA and FILENAME — does not survive
#      reading its own TEXT. Six independently pulled chunks are a Peraturan Gubernur Sumatera
#      Selatan on non-auction sale of regional government property (Penjualan Tanpa Lelang
#      Barang Milik Daerah), with zero mention of NIK, NPWP or Coretax. Per mandate §4.3 the
#      document's own text outranks its metadata/filename. So Permen_32_2022 is RETRACTED as a
#      match for PER-7/PJ/2025 (see instruments below): that instrument remains genuinely
#      unidentified anywhere in this KB, not merely mislabeled.
#
# A third corpus, `tax_genius_hybrid` (340 points, single Qdrant point-id namespace, ALL
# `orphan_no_identity` shape — no document_id anywhere), is a curated consultant-dialogue
# guide (Q&A on e-Faktur errors, PPh 21 examples, VAT filing deadlines — categories
# value_added_tax/income_tax/general_tax/corporate_tax/tax_registration/social_security/
# tax_residency) rather than primary legal text. It carries no citable instrument identity, so
# it is out of scope for the `instruments` list below and for kb/journeys/tax.yaml's
# instrument_id-anchored probes this pass — noted here so its absence from the list below
# reads as a decision, not an oversight.

