# ── Questions this topic must never get wrong (G0, MANDATE.md §3/§7#1) ───────
# Owed by Zero; nothing blocks on them. Drafted here from what lane A actually
# measured today, not from a generic checklist — every one maps to a verified
# fact or a verified gap above.
questions_must_never_get_wrong:
  - "What counts as a Golden Visa in Indonesia, and what ongoing condition must a holder meet?"
  - "Is the current Visa dan Izin Tinggal regulation Permenkumham 22/2023, and has it been amended?"
  - "How long can a foreigner be subject to Pencegahan (exit ban) or Penangkalan (entry ban), under the law as it stands after the 2024 amendment?"
  - "Does asking about a current visa/stay-permit topic ever surface a superseded regulation's numbers (Permen 29/2021) as if current?"
  - "Does asking about Golden Visa ever surface unrelated municipal correspondence rules (the Permen_35_2012 poison)?"
  - "Does asking about Visa dan Izin Tinggal ever surface an unrelated regency price schedule (the UU_14_2024 poison)?"
  - "What are the requirements to extend a limited stay permit (ITAS)?"
  - "What is a re-entry permit (Izin Masuk Kembali) and how long is it valid relative to the stay permit it attaches to?"
  - "Where is immigration supervision (pengawasan keimigrasian) legally conducted?"
  - "Can Bali Zero quote a PNBP (government fee) figure from PP 45/2024? (It must not — revoked.)"

# ── Primary metric, guardrails, kill criterion (G0 gate) ────────────────────
primary_metric: >-
  Every journey in kb/journeys/immigration.yaml measures green against legal_unified
  in production, and stays green for 48h under the scheduled probe (MANDATE.md §8).
guardrails:
  - "A poisoned identity (Permen_35_2012, UU_14_2024) must never re-enter legal_unified under a visa/Golden-Visa question — the two canary journeys must never flip to green."
  - "A superseded instrument (Permen_29_2021) must not be promoted or repaired in place; a fuller/correct answer means Permen_22_2023 out-ranks it, not that 29/2021 is edited."
  - "Never write onto a document_id already held by a different source (identity guard, MANDATE.md §4.4) — none of this topic's repairs are 'in place' edits."
kill_criterion: >-
  If a canary journey (2 or 8) measures green against production at any point, halt
  all lane A promotion work immediately and escalate — that state means a poisoned
  identity has entered the collection every legal query reads.

