    cmd: "gh run list --workflow=merge-gate-integrity-watch.yml --limit 12 --json conclusion"
    result: "12 of 12 runs: failure. Sampled 2026-08-23 07:46Z-09:50Z."
    exit: 0
    ts: "2026-08-23T10:05Z"
    seat: "session (mini)"
  - claim: "The mandate's stated cause (squash produces a SHA with no pre-merge runs) is WRONG — the probe resolves the squashed SHA to its PR correctly and finds 51 merge_group jobs"
    cmd: "gh api repos/Bali-Zero/Teman2/commits/b72f1885f44b155b379fc7601665dc9dd40ce76b/pulls --jq '.[] | \"\\(.number) \\(.merged_at)\"'"
    result: "4654 2026-08-23T09:50:02Z — resolves cleanly; the probe then finds 51 merge_group jobs on that SHA. The squash hypothesis is not the cause."
    exit: 0
    ts: "2026-08-23T10:07Z"
    seat: "session (mini)"
  - claim: "DEFECT 1 — the old idiom captures NOTHING under the runner's real shell, the new one captures the exit code"
    cmd: 'bash -e -o pipefail -c ''set -uo pipefail; python3 -c "import sys; sys.exit(3)" > /tmp/v.json; rc=$?; echo OLD_CAPTURED_rc=$rc''  ;  same with ''rc=0; ... || rc=$?'''
    result: "OLD: prints nothing at all (step aborted by -e before rc=$? ran). NEW: prints NEW_CAPTURED_rc=3. Independently re-verified by the refuter, which also measured rc=143 captured on SIGTERM."
