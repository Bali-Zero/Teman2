runtime_proof:
  - "Merging IS the deploy for this artifact: GitHub Actions picks the workflow up on the next
    event, no apply step exists. PROVE-LIVE is therefore a post-merge observation that the job
    actually appears and runs on a subsequent PR — recorded as the follow-up, not claimed here."
