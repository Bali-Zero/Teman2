brief_ref: evidence/brief.yml
plan_ref: "S12/C3 — auto-update-branch organ for stuck PRs (mandate ~/sessioni-2026-08-23/S12-mini-ship-accelerators.md, Mini, 2026-08-23)"
lanes:
  - lane: s12-c3
    role: build
    seat: "claude-sonnet-5 (implementer subagent, Mini)"
  - lane: s12-c3-gate
    role: review
    seat: "claude-opus-5 (S12 conductor — generator != grader, did not write the diff)"
diff:
  net_lines: >-
    3 new files, +802/-0: scripts/queue_unstick.py (488),
    scripts/queue_unstick_cron.sh (56), scripts/tests/test_queue_unstick.py
    (258). Deterministic gear floor computed from the diff = 1 (no hot-zone
    hit); declared Gear 2 because it is a new 500-line organ with a cron, not
    because the floor demanded it. Declaring Gear 1 to dodge the ceremony
    would be gaming a classifier the repo relies on.
  behaviour_change: >-
    Nothing existing changes behaviour. This adds a script and a cron wrapper;
    the cron is NOT installed by this PR (see notes).
