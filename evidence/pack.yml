dissent:
  - seat: "session (S12 conductor/team-lead — a separate session from the diff's author, generator != grader holds)"
    objection: "First-round design review: the initial CLI-wiring draft would have let CI compute a per-PR evidence slug directly from a merge_group ref (github.event.merge_group.head_ref), which is gh-readonly-queue/main/pr-NNNN-<sha>, NOT the PR's own branch — slug_for_ref() on that ref would name a DIFFERENT directory than the one the PR actually wrote on its pull_request run, deadlocking every Gear-3 PR's first merge-queue transit. CONFIRMED and redesigned: CI now only DISCOVERS a path (resolve_evidence_path(), over the already-enumerated changed-files list), it never computes one from a ref. Second-round gate finding: the brief_ref staging-layout contract (a per-PR pack must still declare brief_ref: evidence/brief.yml, never its own real per-PR-looking path, because evidence_pack_lint.py lints a synthetic staging tree, not the pack in place) was a real, undocumented trap of exactly the shape this PR exists to remove. CONFIRMED and fixed — documented at the staging call site in harness-floor.yml and in evidence_paths.py's module docstring, where a future pack author will actually be looking."
    status: CONFIRMED
residual_risks:
  - "actionlint could not be verified by the gate reviewer locally (not installed on their machine) — only by this session, using a version downloaded fresh from GitHub releases rather than the repo's own vendored/pinned artifact. If CI's actual run disagrees, that is round 1 of a real disagreement, not a surprise the gate missed silently — the gate reviewer explicitly declined to claim actionlint passed rather than assume it from this session's report."
  - "This PR ships the DISCOVERY/WRITE-TIME machinery only. No existing PR (including this one) has actually adopted the per-PR evidence/<YYYY-MM>/<slug>/ layout yet — every current and near-term PR still writes the literal root evidence/brief.yml + evidence/pack.yml, so the collision this PR exists to fix is not yet resolved in practice. That adoption (calling `evidence_paths.py --ref` at write time instead of the root paths) is a follow-up, not part of this PR's scope."
  - "The bootstrap-window fallback in the new 'Resolve this PR's evidence paths' step is intentionally NOT scoped to a single PR number (unlike the sibling tracked_file_present_in_diff.sh / harness_gate_read.py bootstrap guards in the same file) — reasoned as safe because it degrades to exactly this workflow's pre-existing hardcoded behavior. That reasoning has not been independently adversarially attacked beyond the gate reviewer's read-through; it is a judgment call about equivalence to prior behavior, not a property proven by a test."
