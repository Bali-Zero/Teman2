dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      BLOCKER — the trigger aborts the caller's UPDATE. `new_status` was declared NOT NULL while
      PROD's `practices.status` is nullable, so `UPDATE practices SET status = NULL` entered the
      trigger, violated the constraint, and rolled back the whole transaction — including migration
      075's trigger effects. This contradicted the migration's own comment, three lines above, that
      "history must never be able to block the transition it records".
    status: CONFIRMED
    resolution: >-
      Reproduced before accepting, on a prod-shaped throwaway database: after `UPDATE ... SET
      status = NULL`, the row still read `status=inquiry` — the transition was vetoed. `new_status`
      is now nullable, a convergence ALTER carries that to databases holding an earlier shape, and
      the live test drives BOTH NULL directions and asserts the UPDATE commits.
  - seat: codex-gpt-5.6-sol
    objection: >-
      BLOCKER — the ROLLBACK section is a no-op the runner reports as success. All three DROP
      statements were commented out, so the runner executes a comments-only string, deletes the
      version row, and leaves table, function and trigger installed. The accompanying assertion
      `assert rollback is not None` passes on that string, so the suite could never catch it.
    status: CONFIRMED
    resolution: >-
      Verified via the repo's own `split_migration_sql`: the section returned 165 characters and
      ZERO executable lines. Statements uncommented; the test now asserts executable statements and
      names DROP TRIGGER / DROP FUNCTION / DROP TABLE specifically.
  - seat: codex-gpt-5.6-sol
    objection: >-
      SHOULD-FIX — `DEFAULT NOW()` is TRANSACTION-START time while the reader does
      `ORDER BY changed_at ASC` and treats the last row as current. Two concurrent transitions on
      one practice can therefore be recorded in the reverse of their commit order, showing the
      timeline out of sequence and marking the wrong step current.
    status: CONFIRMED
    resolution: "Changed to clock_timestamp() in both the CREATE and a convergence ALTER."
  - seat: codex-gpt-5.6-sol
    objection: >-
      SHOULD-FIX — the NULL test does not constrain what it names. On a database where the column
      is NOT NULL it always took the `pytest.raises` arm and returned, so the trigger was never
      driven with `OLD.status IS NULL`; replacing IS DISTINCT FROM with `<>` would leave it green.
    status: CONFIRMED
    resolution: >-
      Confirmed by mutation, not by agreement. The test now makes the database prod-shaped inside
      its own transaction (`ALTER TABLE ... DROP NOT NULL`, transactional in Postgres, undone by the
      rollback) instead of branching, and the `<>` mutation is now KILLED by that test.
  - seat: codex-gpt-5.6-sol
    objection: >-
      SHOULD-FIX — the test named "..._is_logged_not_swallowed" asserts `len(steps) == 1`, i.e. it
      asserts the swallowing. `asyncpg.PostgresError` also covers QueryCanceledError and
      UndefinedColumnError, so a timeout or a schema drift still renders as a synthetic one-step 200.
    status: CONFIRMED
    resolution: >-
      The name overclaimed and is corrected to `..._still_degrades_but_is_no_longer_SILENT`. The
      degradation is deliberate and unchanged — a client asking about their own practice should not
      get a 500 because history is unavailable — and the docstring now names the classes that share
      that path. Surfacing any of them to the client is a product decision, not made here.
  - seat: session (self, on its own mutation battery)
    objection: >-
      The mutation battery had a BLIND SPOT the refuter's findings exposed: `CREATE TABLE IF NOT
      EXISTS` is a no-op against a database that already holds the table, so mutating the CREATE
      clause changes the FILE without changing the SCHEMA and every executing test stays green.
      Restoring the NOT NULL blocker and removing the convergence ALTER left the live suite at
      7 passed — a real defect, invisible to execution.
    status: CONFIRMED
    resolution: >-
      Closed with a deliberately weaker instrument that names its own weakness:
      `test_the_migration_declares_the_shape_its_execution_cannot_prove` pins both properties in the
      SQL TEXT. M5 and M6 are now killed by it. Disclosed rather than presented as full coverage —
      only a fresh database proves these by execution, and the suite does not control that.
