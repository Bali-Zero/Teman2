residual_risks:
  - "FALSIFIED 2026-08-22 BY THE CHECK ITSELF, and left here because how it was wrong is the useful
    part. This entry read: the 30k size_tokens cap is DOCUMENTATION, not an armed check (superscar
    #2), a repo-wide grep finds the field only in evidence packs, no code reads it. The cap is
    ARMED: scripts/evidence_pack_lint.py re-derives an approximate token count from the pack's own
    bytes and fails the build, and it blocked THIS PR -- 'size: approx 32947 tokens exceeds the
    30000 hard cap', job 97007151455 -- which is why the pack was condensed before it could land.
    The verifier grepped for the FIELD NAME and concluded nothing enforced it; the lint never reads
    that field, it re-measures the file, which is exactly why the self-reported number cannot be
    gamed. Grepping for the name of a self-report is not how you learn whether a budget is armed:
    what arms a budget is a check that re-derives it. What DOES survive of the original claim is
    much smaller: nothing compares the self-reported size_tokens field to the real count, so that
    field can drift and mislead a reader. Cosmetic drift, not an unarmed cap."
  - 'SURVIVING UNDER-MATCH, each driven through the real hook rather than reasoned about: (a) `<any-prefix>KEY=` outside the bounded vocabulary -- `PUBKEY=`, `M5KEY=`, `QKEY=`, `ORIGINALAPIKEY=`, `MACHINEHMACKEY=` leak in full; their delimited twins are caught. This is the deliberate price of keeping `monkey=patch` innocent. RETRACTED 2026-08-22: this used to call itself THE ONE class where the matcher is knowingly weaker than a bare-substring one. An independent gate falsified that by driving 383 inputs through the real hook and finding a second, larger one -- the bare SUFFIX, where TOKEN_2= was caught and TOKEN2= was not. The NUMERIC half of that class is now CLOSED in code (TOKEN1, SECRET3, PGPASSWORD1, APIKEY2, AUTH1, PWD9, TOKENS1, X-Auth-Token2, 8 witnesses, bite-proved 8/165); the LETTER half (TOKENA=, TOKENV2=) stays open and is priced below. The remaining KEY-prefix gap: on the live log, 40 distinct names / 136 occurrences the substring version caught and this one does not, though most (KEYWORDS 15, KEYCHAIN 12, StrictHostKeyChecking 21, MONKEYPATCH 3, ONKEYDOWN 2) were that version''s own over-match. (b) Credential words outside the six: `--pin=`, `--otp=`, `--salt=`, `--cookie=`. (c) HALF-RETRACTED 2026-08-22: `Authorization:` with an OPAQUE token still leaks (measured), but the `Basic <b64>` half is false -- anchor 4b has caught it since the tenth round, verified on this head (a `curl -H` carrying an `Authorization: Basic <b64>` header logs `curl -H` then the marker). A residual that outlives its own cure is worse than none: it reads as a known hole and hides that the hole was closed. (d) RE-LABELLED 2026-08-22, because the old title `a POSITIONAL secret with no name` was contradicted by its own example: a secret NOT JOINED TO A CREDENTIAL-ISH NAME BY `=` OR `:`. That class INCLUDES every `--flag <value>` form, because rule 2 needs the separator between name and value and a SPACE there defeats it outright. Measured leaking: `gh auth login --token <v>`, `mytool --api-key <v>`, `mysql --password <v>`, `echo <v> | gh secret set FOO`, plus the genuinely nameless `mytool deploy <v>` / `mysql -p<v>`, plus `curl -u admin:<v>` and `curl --user admin:<v>` -- those two DO carry a `:` but hang it off a USERNAME, which is not a credential-ish name. (e) REWRITTEN 2026-08-22 -- the old text read `an UNQUOTED value containing a space: only the first word is redacted`, which described the RETIRED cascade, not this head. Measured on this head: `export TOKEN=<v> extra words here` logs `export <REDACTED>`. The cut runs to end-of-string, so the whole tail goes. That is not an under-match at all -- it is the over-match damage already priced below, and it was sitting in the under-match list saying the opposite. (f) NEW 2026-08-22, the UNDER-MATCH HALF of the dot-lookbehind, which all four artifacts described only as over-match protection: a SINGLE-SEGMENT attribute assignment leaks in full -- `c.token = "<v>"`, `c.secret = "<v>"`, `jq ''.password = "<v>"'' cfg.json`. CORRECTED 2026-08-22 by an independent gate that measured it: the claim used to read `multi-segment names are still caught`, which is true only when the LAST segment is itself a credential word. `cfg.api_key = <v>` is caught (it matches at `key`, after the `_`); `cfg.TOKEN_ref = <v>` and `cfg.token_value = <v>` LEAK IN FULL, 10 of 13 names in the gate''s sweep. What scopes the hole is not segment COUNT but whether a credential word survives the lookbehind at the position it occupies. Same named-price shape as the KEY vocabulary. (g) NEW 2026-08-22: an INDEX between the name and the separator -- `SECRETS[0]=<v>`, `TOKEN[0]=<v>` leak, because `[0]` is neither the optional quote nor the separator rule 2 permits between them.'
  - "Redact-before-truncate widens the truncation window by shortening the string, so a secret that used to fall outside the 200 chars can be pulled in. Smaller exposure, not zero. Pinned in the other direction by the straddle case, which proves truncate-first is strictly worse."
  - "The already-leaked material remains valid: 1 whole-token-length run plus 2 truncation-clipped partials. Two earlier drafts of this pack inflated that (11 tokens -- a LINE count read as a VALUE count; then 2 whole tokens -- an end-of-window artifact read as two more secrets). Both caught by the Gear-3 gate; the rotation decision hangs on this number."
  - "OVER-MATCH (cicatrix #3), stated with its full damage rather than as value-only: the name match has no notion of whether a value is actually secret, AND (i) it swallows the rest of an unquoted value, so `sed -i 's/key=old/key=new/''` loses its second half entirely, and (ii) DELETED 2026-08-22: this used to claim the replacement NORMALISES the separator to `=`, so a header or JSON `name: value` is logged as `name=<REDACTED>`. Measured false on this head: a `curl -H` carrying an `X-Api-Key` header logs the marker starting INSIDE the name, at `X-Api-`. Nothing is normalised because nothing is re-emitted: the earliest-anchor cut discards from the match START, so the NAME is inside the cut too. The real damage is larger than the sentence it replaces, and is stated correctly in (i): the rest of the line goes. Concretely over-redacted today: `redis-cli --scan --pattern 'keys:*'` (1 of 35 ordinary-command probes), `PWD=/tmp`, any `FEATURE_FLAG_KEY=`. Measured rate on the real log: 2291 lines / 0.686% of 333,832 at 2026-08-21T22:49:57Z, higher than the 1875 / 0.562% of the version rejected for over-matching. Accepted: over-redacting a non-secret beats under-redacting a real one."
  - "CONDENSED for the size cap, four risks that described the CASCADE architecture this PR then DELETED, and that no longer name anything in the shipped matcher: the over-match belonging to cascade rules 3 and 4; the widening that closing the mirror class forced on those same two rules; the accidental coverage lost when their tail was tempered (94 of 200,000 random fuzz assemblies, every one a nameless secret); and the third-direction pattern note, now stated once and in full by the FOUR-directions entry that follows. The earliest-anchor cut has no rule order, no per-rule tail and no marker registry, so none of the four transfers - what over-match the SHIPPED design carries is stated separately and was measured on it, not inherited from these. Verbatim: `git show 4b0209c2c:evidence/pack.yml` (PR #4547 head -- after the squash merge that object lives on refs/pull/4547/head, not on main)."
  - "hook-innocence-gate.yml's path filter still does not cover .claude/hooks/ -- the hooks that actually run from the repo's own hook dir are outside the gate that exists to prove hooks bite only the guilty. Deliberately not widened here."
  - "check_guard_conformance's is_armed() is substring-based, so it cannot detect deletion of the workflow step that executes this suite. The step is genuine today; its removal would not be caught by the registration."
  - "An identical UNTRACKED .codex/hooks/ copy exists in the main checkout; git does not track it, so this diff cannot fix it."
  - "No independent seat has verified any live-log figure in this pack (the 3 secret-bearing runs,
