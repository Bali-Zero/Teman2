    objection: "The Basic anchor I had just shipped stalls for 18 seconds on a 50KB credential-free command and 346 seconds at 200KB. It is the same unbounded-class-before-a-literal trap I had already cured on the URL scheme four commits earlier, and the comment I wrote there forbidding it was in the file when I wrote the violation. Documentation did not hold it; only a wall-clock test will."
