brief_ref: evidence/brief.yml
plan_ref: "the heartbeat receptor could not read status=warning, and dropped the organ's stated reason on 57 of 58 note-bearing sidecars; arming its corpus then exposed a test green on one machine only"
diff:
  files: 6
  net_lines: "+310/-9 across 4 code/test/workflow files, measured at merge-base 5b4354892 with `git diff --no-renames --numstat <merge-base> HEAD` — never a two-dot diff against a moving origin/main, which attributes main's own commits to this PR (W102). Of that, 217/2 is the test corpus and 57/7 the detector; the workflow hunk is 28/0 and adds one run-step plus path entries."
  behaviour_change: "yes, and stated: a node whose only finding is a warning now prints an ORGANISM block at SessionStart where it previously stayed silent (3 warnings fleet-wide at time of writing). No pre-existing finding kind changes verdict; metadata.note keeps precedence so existing findings are byte-identical."
