    because an innocence case asserting this input survives would FAIL -- a green test claiming coverage
    this rule does not have is worse than a declared hole. Narrowing it further would re-open the
    digit-leading-password guilt case (`https://alice:123?x<v>@db.test/query`), which is a real
    credential shape and has a witness in the corpus; over-redacting one URL shape beats leaking one."
  - "LETTER SUFFIX ON THE CREDENTIAL NAME, still open after the numeric half was closed: `TOKENA=<v>`,
    `TOKENV2=<v>` leak in full. Priced rather than closed -- a bare ALPHANUMERIC suffix is not separable
    from `TOKENIZER=fast` (an innocence case) by any rule of this shape, which is the same reason KEY
    carries a bounded prefix vocabulary. Digits have no such innocent role, which is why the numeric
    half could be closed and this half cannot."
  - "IMPRECISION IN A PUSHED COMMIT MESSAGE, corrected here because a pushed message cannot be amended:
    the commit for the ReDoS cure says `shellcheck clean`. Bare `shellcheck` on the hook exits 1 (SC2016,
    severity INFO, on the single-quoted python block). What is true, and what every check in this PR
    actually ran, is `shellcheck -S warning` -> exit 0. No CI check is contradicted: actionlint runs with
    `-shellcheck=`, which disables the pass entirely. Recorded rather than quietly dropped."
  - "MEASURED OVER-MATCH RATE IS SCOPED, NOT RE-MEASURED: the `2291 lines / 0.686% of 333,832` figure
    carries the timestamp 2026-08-21T22:49:57Z and describes the matcher AS IT WAS THEN. Nothing in the
    later rounds re-measures it, and the honest reading is that it is a LOWER BOUND for the shipped
    matcher, not its rate. It is deliberately not refreshed here: the only corpus that could refresh it is
    the live hook log, and reading that log is reading a credential archive -- the exact thing this PR
    exists to stop. A number that would cost a secret to update is a number that stays scoped."
  - "UNDER-MATCH RE-OPENED ON PURPOSE 2026-08-22, after the digit suffix was scoped: a BARE `KEY` with a
    digit (`KEY1=<v>`) and the generic branch with any suffix (`AUTH1=<v>`, `PASS2=<v>`, `AUTHS=<v>`) leak
    in full. They were caught for the length of one commit and the catch was withdrawn on measurement,
    because the same rule truncated `curl -d key1=value1`, `--from-literal=key1=hello`,
    `UPDATE t SET key1=1`, `AUTH2=off`, `PASS2=on` and `PWD2=/srv/build2`. The trade is the one this
    matcher already makes for `monkey=patch`, one level deeper: a credential WORD earns the digits, a
    bare placeholder name does not. A real delimited credential on the generic branch is `AUTH_TOKEN`,
    which branch (a) catches."
  - "UNDECLARED UNTIL 2026-08-22, and NOT fixed: a SINGLE-FIELD URL userinfo leaks in full --
    `git clone https://<token>@gitlab.test/a/b.git`, `git remote set-url origin https://<token>@…`,
    `curl https://<token>@api.example.test/v1/me`. Anchor 6 requires TWO userinfo fields (a colon
    between them), and this form has one. GitHub is incidentally covered because `ghp_`/`github_pat_`
    have their own prefix anchors; GitLab, Bitbucket and any generic host are not. It is NOT covered by
    the declared class (d) `a secret not joined to a credential-ish name`, which also swallows
    `postgres://u:pw@h` -- a shape rule 3 DOES catch -- so (d) was never the operative declaration for
    URL forms. Left open rather than patched because the fix is a real design question (a bare
    `://<run>@` anchor would fire on every `user@host` in an scp path or a git SSH remote) and this PR
    has already replaced its architecture once; it is declared here so the next round starts from a
    named hole instead of rediscovering it. Same round, same family, also undeclared: the RFC-4716
    four-dash PEM header `---- BEGIN SSH2 ENCRYPTED PRIVATE KEY ----` anchors on nothing, because the
    PEM rule requires five dashes."

sources:
  - ~/logs/codex-spalla-trigger.jsonl (counted and replayed in-process, never printed)
  - .claude/settings.json (hook registration path)
pii_scan: clean
# ESTIMATE, not a measurement, and labelled so on purpose: 131,697 bytes / 4.0 chars-per-token.
# No offline tokenizer for this model family exists on the fleet, and nothing in the repo reads
# this field (grep in scripts/ and infra/ finds no consumer -- see residual_risks), so it is
# documentation. The previous value, 16067, was left behind by later edits to this pack.
size_tokens: 29328
