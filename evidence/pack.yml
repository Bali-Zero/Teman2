plan_ref: "codex-spalla hook wrote credentials to a world-readable log (2026-08-21)"
diff:
  net_lines: >-
    +2834/-319 (net +2515), measured at SHA c36e83877 by
    `git diff --shortstat 062269dc9 c36e83877`. The SHA is the load-bearing part: this line lives
    INSIDE its own diff, so re-running the command at whatever the head is NOW returns a larger
    number, and a bare figure with no SHA would be false the moment the next commit lands. It is
    anchored one commit BEHIND the head on purpose: a figure that measured its own commit could never
    be written truthfully, so the honest form names a SHA that already exists.
    Base is the MERGE-BASE, not a fixed base, so main's own landings are not counted as this PR's.
  behaviour_change: "none to trigger logic; the log's mode and logged value change by design"
