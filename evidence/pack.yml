brief_ref: evidence/brief.yml
plan_ref:
  "the harness gate's own recovery procedure deadlocks the PR it is meant to unblock (measured
  on #4543)"
diff:
  behaviour_change: none
  net_lines: "CODE +81/-3 (comments only, proven structurally); WHOLE DIFF +331/-253 (net +78); measured at merge-base 9def77f51..HEAD with `git diff --numstat 9def77f51..HEAD`, LAST, iterated to a fixed point."
receipts:
  - claim:
      "The two runs on #4543's head SHA live in DIFFERENT check suites; the PR's rollup kept the
      failing one"
    cmd:
      'gh api "repos/Bali-Zero/Teman2/commits/33f12fb4af43777430d0a0873653079891f639d8/check-runs?filter=all&per_page=100"
      --jq ''.check_runs[]|select(.name=="Harness floor recompute")|"\(.completed_at) \(.conclusion) suite=\(.check_suite.id)"''
      -> THREE rows today, newest first: 14:07:22Z success suite 88070314010, 14:01:20Z success
      suite 88072653107 (the dispatch), 13:51:47Z failure suite 88070314010 (the pull_request attempt the
      PR was pinned to). Rows TWO AND THREE are the deadlock; row ONE is the post-cure rerun, i.e. the cure,
      and it did not exist during the incident. `&per_page=100` is load-bearing: without it this same command
      returns only the first TWO rows -- re-measured 2026-08-21, which is how an earlier version of this
      receipt came to record an output its own command could not produce.'
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: "session (m5)"
  - claim:
      "CORRECTED, and the correction REVERSES this receipt's original claim: PAGINATION hides the row you
      need, not filter=latest. filter=latest drops only attempts superseded WITHIN their own suite, so during
      the #4543 deadlock the default would have returned BOTH rows and there was no contradiction to hide"
    cmd:
      'gh api "repos/Bali-Zero/Teman2/commits/76edf60e29846e4e45b41842da7110aa64b55036/check-runs?filter=all"
      --jq ''"total=\(.total_count) returned=\(.check_runs|length) failures=\([.check_runs[]|select(.conclusion=="failure")]|length)"''
      -> total=55 returned=30 failures=0; the identical URL with &per_page=100 appended -> total=55
      returned=55 failures=1. Run verbatim this session, both exit 0. The URL MUST be quoted (& is a
      shell metacharacter) and "failure" MUST be quoted inside the jq filter, or jq answers
      "function not defined: failure/0" — an earlier revision of this receipt recorded a command that
      exited 127, which is the same defect dissent[2] raised against receipt 1.'
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: "session (m5)"
  - claim:
      gh run rerun on the ORIGINAL pull_request run cleared the rollup; mergeStateStatus BLOCKED ->
      CLEAN
    cmd: gh run rerun 32489011695; gh pr view 4543 --json mergeStateStatus -> CLEAN
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: "session (m5)"
  - claim: The documented flow was actually followed first, and did not work — this is not a hypothetical
    cmd:
      gh workflow run harness-floor.yml --ref agent/air-m5/ops/gate-header-truth -> run 32489857553 workflow_dispatch
      success on 33f12fb4a, PR still BLOCKED
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: "session (m5)"
  - claim: "No behaviour change: the workflow's non-comment body is byte-identical to origin/main"
    cmd: git show origin/main:<wf> | grep -v '^\s*#' > a; grep -v '^\s*#' <wf> > b; diff -q a b
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: "session (m5)"
  - claim: actionlint passes on the rewritten workflow
    cmd: actionlint .github/workflows/harness-floor.yml
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: "session (m5)"
dissent:
  - seat: "gear3-final-gate (opus 5, fresh context, read-only, not the author)"
    objection:
      "The W111 scoping was FACTUALLY BACKWARDS. W111's own incident was #3463 re-run against
      refs/pull/3463/merge -- a PULL-REQUEST merge ref, not merge_group. The note narrowed the scar onto
      the one event type it did not happen on, and replaced it with a categorical 'a pull_request re-run
      ... nothing about it is stale', which is exactly W111's original scenario. Superscar #6 / W78, in
      a header every session reads."
    status: CONFIRMED
  - seat: "gear3-final-gate (opus 5, fresh context, read-only, not the author)"
    objection:
      "CASE A is safe for THIS job for a reason the note did not give: the workflow checks out
      a PINNED base sha (github.event.pull_request.base.sha), never refs/pull/N/merge, so no moving ref
      exists for a rerun to resolve differently. Unstated, a reader copies CASE A to a workflow that DOES
      check out a merge ref."
    status: CONFIRMED
  - seat: "gear3-final-gate (opus 5, fresh context, read-only, not the author)"
    objection:
      "Receipt #1's jq was not runnable as written (missing .check_runs[]) and listed 2 of 3 rows;
      receipt #2's recorded output is false at its own timestamp; sources attributed run 32489102357 to
      #4543 when it belongs to #4544."
    status: CONFIRMED
  - seat: "session (m5), against its own earlier fix in #4543"
    objection:
      "In #4543 I 'fixed' a wrong net_lines by writing a precise value measured at the PREVIOUS
      SHA — the same disease at higher confidence, in the one field a gate had already conditioned. The
      gate returned REWORK-BUILD for it. This pack therefore measures net_lines LAST, at the merge base,
      after every other edit, and writes it as a 1-for-1 line swap so the value describes the tree that
      contains it."
    status: CONFIRMED
  - seat: "gear3-final-gate (opus 5, on #4543)"
    objection:
      "CI cannot catch a wrong net_lines: evidence_pack_lint prefers a MEASURED --net-lines/--numstat-file
      over the pack field because the field is untrustworthy, but a STRING field yields None and the rule
      never fires. Green lint is not evidence for this field."
    status: CONFIRMED
  - seat: "session (m5), scoping the change rather than widening it"
    objection:
      "Rewriting the corollary could be read as repealing W111. It is not, and a note that merely
      dropped the prohibition would be a regression: a merge_group rerun replays a ref whose base moved.
      SUPERSEDED BY dissent[0], which is what actually shipped. The note does NOT scope the ban to merge_group: it says in terms that reruns are only dangerous on merge_group is FALSE, and scopes CASE A by this workflow PINNED base ref instead. This entry describes a draft that dissent[0] caused to be reversed; it is kept for the trail, not as a description of the diff that ships."
    status: CONFIRMED
  - seat: "gear3-final-gate (opus 5, fresh context, read-only, not the author) - round 2 on 76edf60e2"
    objection:
      "The DIAGNOSTIC TRAP paragraph named a mechanism that cannot occur in the state a reader consults it
      in. It said check-runs defaults to filter=latest and returns only the GREEN run. filter=latest drops a
      check-run only once a SAME-SUITE rerun supersedes it, which is not the deadlock state - during the
      #4543 deadlock the default would have returned both rows. What actually hides the red row is
      PAGINATION, which the paragraph never mentioned: the endpoint returns 30 of ~55-63 rows. So the
      prescribed remedy (pass filter=all) does not by itself surface the row."
    status: CONFIRMED
  - seat: "session (m5), re-measuring the gate objection on this PR own head SHA rather than accepting it"
    objection:
      "Verified before acting, because a refuter hallucinates too (W65). On 76edf60e2: no per_page ->
      returned=30 of 54, failures=0; filter=all with no per_page -> returned=30 of 55, failures=0;
      filter=all&per_page=100 -> returned=55, failures=1. The gate is right and the paragraph shipped in the
      previous revision was wrong. Corrected in the header, in the brief acceptance criterion, in receipts 1
      and 2, and in the session memory note that carried the same false mechanism - which would otherwise
      have propagated it to the next session."
    status: CONFIRMED
  - seat: "gear3-final-gate (opus 5) - round 2, provenance findings"
    objection:
      "Two dissent seat scalars were unquoted and ended mid-phrase: YAML ate #4543 and everything after it as
      a comment. The linter only checks non-emptiness, so CI could not see it. Separately, receipt 1 recorded
      an output its own recorded command cannot produce (2 rows, not 3), and dissent[5] described a draft
      that dissent[0] had already caused to be reversed - both CONFIRMED, with no marker telling a reader
      which one describes the artifact that ships."
    status: CONFIRMED
  - seat: "gear3-final-gate (opus 5, fresh context, round 3 on ea0801247, did not run round 2)"
    objection:
      "Round-2 condition 2 and 4 were applied to the WORKFLOW only and left standing in brief.yml, which
      then contradicted its own acceptance criterion two blocks down. A condition is not satisfied by
      editing the file the reviewer quoted - it is satisfied when the claim is gone from every artifact
      that repeats it. Also: the ESCAPE paragraph added for condition 4 pointed the reader at CASE B,
      which the same header proves is inert on an open BLOCKED PR - the fix introduced a contradiction
      with the block above it."
    status: CONFIRMED
  - seat: "gear3-final-gate (opus 5) - round 3, on the precision paragraph"
    objection:
      "The note quotes its own ref: expression and concludes i.e. a PINNED base SHA. The third branch is
      'main', a MOVING ref, and it is the branch workflow_dispatch falls through to. A reader applying the
      note's own transfer test to this very workflow gets the opposite answer. Separately, the paragraph
      argues pinning away W111's hazard without stating the flip side: a rerun replays the ORIGINAL event
      payload, so the base checkout - and the helper scripts the job executes - stay frozen at PR-event
      time. Pinning removes the stale-BASE hazard; it does not make the rerun current."
    status: CONFIRMED
  - seat: "session (m5), verifying the two conditions the gate REASONED rather than executed"
    objection:
      "Two findings were derived from the file, not observed, so they were checked before being acted on
      (W65). Both hold. The trigger list really is types: [opened, synchronize, reopened], so close+reopen
      does fire a fresh pull_request run on the unchanged head SHA - a cheap escape the previous text
      denied outright. And the ref: expression really does carry 'main' as its third branch. Neither was
      taken on the refuter's word."
    status: CONFIRMED
  - seat: "session (m5), against its own round-2 repair"
    objection:
      "Receipt 2 was rewritten in round 2 to cure a non-reproducing command, and the replacement did not
      run either: exit 127 unquoted (& is a shell metacharacter), and jq answers 'function not defined:
      failure/0' when the literal is unquoted inside the filter. The same defect dissent[2] raised against
      receipt 1, reproduced one receipt over, in the commit that claimed to fix it. The command now in the
      file was extracted from the YAML and executed verbatim this session: exit 0, output identical to the
      one recorded."
    status: CONFIRMED
  - seat: "gear3-final-gate (opus 5, fresh context, round 4 on e48c1b0f5, did not run earlier rounds)"
    objection:
      "The head commit's own subject was 'a condition is satisfied when the claim is gone from every
      artifact, not from the one the reviewer quoted' -- and the repealed instruction was still standing
      in the two artifacts a session actually meets. Worst: scripts/ci/harness_gate_read.py PRINTS it as
      the CI failure annotation, i.e. it is pushed at a session at the instant it is stuck, which is a
      strictly worse home than a header a session may or may not open. The gate read it live in this PR's
      own red X. Also: the consumer_map asserted 'no other artifact carries it', false since #4557; and
      residual_risks[0] named a follow-up that had merged five minutes before the commit was authored."
    status: CONFIRMED
  - seat: "session (m5), verifying and then acting on the round-4 findings"
    objection:
      "Re-measured before acting (W65). harness_gate_read.py:193-194 and its docstring at :42-45 did carry
      the repealed text; #4549 does have 9 pull_request runs and ZERO workflow_dispatch, so the runbook
      sentence 'cost two sessions the same detour' -- which this same session wrote in #4557 -- is false;
      and the runbook quoted the ref: expression with '|| main' truncated. Fixed in #4558, not here: those
      are code and sibling-doc surfaces, and folding them in would cost this PR its comment-only proof."
    status: CONFIRMED
residual_risks:
  - "CLOSED, and the previous revision shipped this line already stale. It read: CLAUDE.md's Agent PR
    Contract rule 3 still reads unqualified at origin/main, named follow-up a CLAUDE.md PR carrying the
    same scoping. That follow-up had ALREADY landed -- 61f87383c / PR #4557, merged 2026-08-21T20:18:14Z,
    five minutes before this branch's next commit was authored. Same disease as dissent[3] and dissent[4],
    a value written once and never re-read, relocated from net_lines into residual_risks. The residual that
    ACTUALLY remained was scripts/ci/harness_gate_read.py, which PRINTS the repealed instruction as the CI
    failure annotation at the moment of need -- found by the round-4 gate, fixed in #4558."
  - "#4549 is NOT a second reproduction of the deadlock and must not be cited as one: it has no workflow_dispatch
    run at all. It independently confirms CASE A's REMEDY a second time -- a weaker, different claim."
  - "The quoted suite ids are one incident's measurement, not constants. The note frames them as the #4543
    evidence, not as values to expect."
  - "This diff does not change the job, so it cannot itself prove the new procedure works; the proof is
    #4543's own history, already on main."
  - The modus PENDING-ARMS row opened for this defect is NOT closed by this diff — that file carries a merge=union
    driver and is deliberately kept out of a hot-zone PR. It gets its own follow-up.
sources:
  - "PR #4543 run history: 32489011695 (pull_request, the run the PR was pinned to) and 32489857553 (workflow_dispatch,
    the documented flow)"
  - "Run 32489102357 was previously cited here as #4543's — it is NOT, it belongs to #4544 (agent/air-m5/ops/readme-promote-timing,
    sha 36c755d6). Caught by the Gear-3 gate."
  - memory discovery_workflow_dispatch_rerun_does_not_clear_a_prs_rollup_2026_08_21
tests:
  - "None applicable: comment-only. The behavioural proof is the byte-identical non-comment body receipt,
    which is stronger here than a test would be."
static:
  - actionlint 1.7.12 exit 0
runtime_proof:
  - None claimed. Nothing in this diff executes; the consumer-map records that both consumers are unchanged,
    so merged == live.
pii_scan: clean
size_tokens: 1300
