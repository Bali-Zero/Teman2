tests:
  - "scripts/tests/test_wa_bot_throughput_sentinel.py — 45 tests, merged with the payload in PR #4630; not re-run here because this PR does not touch the payload."
static:
  - "pre-commit hooks pass on the registry commit, none bypassed"
  - "organism.tools.validate_organs_registry --update-checksum: checksum updated, rc=0"
notes:
  - >-
    THE ONE THING THIS PR DOES NOT PROVE. Merging arms nothing. The organ is
    real only when the plist is bootstrapped on Pro and the heartbeat sidecar
    is read TWICE, at least one interval apart, and seen to ADVANCE — plus a
    negative control confirming it reports wrong-database, not dead-channel,
    against a history-free DB. A zero exit code and the presence of a plist
    line are not proof. That is superscar #2, which is the exact defect this
    sentinel exists to detect, so committing it here would be self-refuting.
dissent:
  - seat: "the build lane, against its own artifact — the interpreter was the one UNCHECKED precondition"
    objection: >-
      The wrapper's header states that "a missing precondition is a
      wrapper-level failure with a heartbeat, not a paging storm". That is
      true for the three preconditions it checks (secrets file, DSN name,
      tunnel) and FALSE for the interpreter, which it did not check. With the
      venv python missing, `exec "$PYBIN"` fails, `set -e` exits 1, and NO
      heartbeat is written at all — so the only remaining signal is the
      sidecar going stale (>1350s), which is slower than the other paths and
      carries no cause. In an organ built specifically against superscar #2,
      a path that fails without emitting a signal is the wrong defect to
      leave in.
    status: CONFIRMED
    note: >-
      Found by the build lane, not by the gate, and measured rather than
      reasoned: a byte-identical copy of the wrapper with PYBIN repointed at
      a nonexistent path, run with ORGANISM_LAST_SEEN_DIR isolated to a
      scratch directory, left that directory with ZERO files (counted with
      `/bin/ls -1A | wc -l`, not with a glob). Cured in this PR by an
      executability guard that emits the same error-heartbeat shape as the
      other three preconditions and exits 78.

      Recorded because the FIRST version of that probe was invalid and would
      have produced the same conclusion for the wrong reason: copied to the
      scratchpad, the wrapper's REPO_ROOT resolved outside the repo and it
      died at line 44 failing to source heartbeat.sh — never reaching the
      exec at all. The second run reached line 91 for the right reason. A
      probe that fails early gives you the answer you expected with none of
      the evidence.
  - seat: "the build lane, against the plist header's own hardening claim"
    objection: >-
      The plist header ends with "Plist permissions hardened to 0444 per
      cicatrix P0-3", stated as accomplished fact. The install procedure
      documented ten lines above it is `cp` followed by `launchctl
      bootstrap`, with no chmod anywhere — so nothing in the documented path
      produces 0444, and git cannot carry it either (the blob is 100644,
      identical to the sibling organ's). The claim has no mechanism behind
      it.
    status: CONFIRMED
    note: >-
      Cured by putting the chmod into the install steps rather than by
      deleting the sentence, because the hardening is wanted; what was
      missing was the instruction that achieves it. This is the same shape
      as the rest of this PR: a stated property nobody executes is
      indistinguishable from a property that holds, right up until it
      matters.
