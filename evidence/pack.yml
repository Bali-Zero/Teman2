    ts: "2026-08-23T14:11Z"
    seat: "session (pro, build lane)"
  - claim: "bridge_source describes what the script ACTUALLY writes, read from the writer rather than copied from a neighbouring entry"
    cmd: "read scripts/lib/heartbeat.py:26-42 and scripts/wa_bot_throughput_sentinel.py:92"
    result: >-
      ORGAN_ID = "pro.wa_bot_throughput_sentinel"; the helper writes
      ~/.organism/last_seen/<organ_id>.json with keys ts/status/note. The
      registry entry names exactly that path and those two fields. W110/W120:
