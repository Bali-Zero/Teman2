    seat: "session (pro, build lane)"
  - claim: "The organ conformance gate passes, and the pass is CAUSED by the registry entry — guilt-tested, not merely observed green"
    cmd: "infra/organ-conformance/check_organ_conformance.py  (cwd = the worktree; with the registry label replaced by a placeholder, then restored)"
    result: >-
      With the label removed the gate reproduces the exact CI message —
      "NEW organ without genes: ...wa-bot-throughput-sentinel.plist missing
