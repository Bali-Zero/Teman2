    role: review
    seat: "sonnet-5 subagent (Anthropic) — adversarial, did not write the code"
    note: "8 findings, 6 real. Confirmed sound the five surfaces it was asked to attack first (ssh-trampoline pid, $$ in command substitution, set -u, $REPO scope in the trap, explicit-close vs trap-close ordering). Found the two HIGH ones: a hang was invisible AND blinded the whole healer via the pidfile; one abandonment kept the healer permanently non-idle forever."
  - lane: R2
    role: review
    seat: "kimi-code/k3 (Moonshot, NON-Anthropic) — adversarial, fresh context, same diff"
    note: "Six MORE real defects on the ALREADY-CURED diff, including two R1 had explicitly cleared. Decisive: the lock's new p0 fired BEFORE secrets were sourced (mute alarm, W108 rebuilt inside its own cure); prune() deleted exactly what its docstring promised it never would; the lock check counted every spawner's hangs then named the healer's own run. Cross-family lens found what a second same-family lens did not."
  - lane: G1
    role: review
    seat: "opus-5 (session, mini-pro2) — final on-disk gate"
    note: "Reproduced EVERY finding before acting on it, including the two factual premises new code was built on (the watchdog sends one SIGTERM and never escalates: verified by grep of the watchdog body; liveness was resolved eagerly: verified at the call site). Declined two R1 findings with stated reasons. Re-proved live end-to-end after each round of fixes."
seat_diversity: satisfied
seat_diversity_note: "One build lane, so the >=2-build-lane rule does not fire — but the review side is genuinely cross-family (R2 = kimi-code/k3, non-Anthropic), and it was NOT ceremonial: it produced six real defects on a diff that had already passed a same-family adversarial pass, two of which that pass had explicitly cleared. Recorded because it is the measurement that justifies the doctrine, not because a field demanded it."
