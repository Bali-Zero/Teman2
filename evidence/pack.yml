dissent:
  - seat: "sonnet-5 subagent (R1)"
    objection: "FINDING 1 — record the cascade child's pid ($CPID) instead of the wrapper's ($$), and escalate the watchdog from SIGTERM to SIGKILL."
    status: "CONFIRMED"
    resolution: "The CONSEQUENCE was accepted and is now detected: a HUNG state, checked at the lock itself. The two proposed cures were declined with reasons. The declaration is about the RUN, whose owner is the wrapper — swapping to the child's pid would make a wrapper that outlives its child unobservable. SIGKILL escalation is a real gap but changes the healer's kill semantics: its own concern, declared out of scope in the brief."
  - seat: "sonnet-5 subagent (R1)"
    objection: "FINDING 7 — the wrapper invokes `python3` by bare name; if PATH lost it, declaration coverage silently drops to zero."
    status: "CONFIRMED"
    resolution: "The objection is real; the cure is declined here. A pre-existing whole-script pattern the refuter itself flagged as 'not a new regression'. Changing every invocation is a separate sweep. The new code does log a WARN when the open fails."
  - seat: "sonnet-5 subagent (R1)"
    objection: "FINDING 8 (SPECULATIVE) — locale-dependent `ps -o lstart=` formatting could make an unchanged process read as a different one."
    status: "PLAUSIBLE"
    resolution: "The refuter could not construct a trigger and said so. BSD lstart is ctime()-style and both calls run in the same context. Recorded rather than acted on."
  - seat: "kimi-code/k3 (R2, non-Anthropic)"
    objection: "Six defects on the already-cured diff: mute alarm (secrets sourced after the lock's p0), prune() deleting live OPEN records against its own docstring, the lock check counting every spawner's hangs then naming the healer's own run, a recycled pid making the healer permanently green-and-dead through the lock, an unparseable declaration reported in a field nothing consumed, and the trap able to signal a recycled pid."
    status: "CONFIRMED"
    resolution: "All six fixed and pinned by five new tests plus a live stale-lock proof. Two of them (the lock ordering and the trap) sat inside code R1 had explicitly cleared — which is the measurement that justifies a cross-family second lens rather than a second pass of the same one."
  - seat: "kimi-code/k3 (R2)"
    objection: "A forward NTP step inflates apparent age past the hung margin, so a healthy run could read HUNG."
    status: "PLAUSIBLE"
    resolution: "The mechanism is real but I did NOT reproduce an NTP step here, so it is recorded as plausible rather than claimed as measured. Unfixed. A declaration must survive process death, so elapsed time cannot be held in memory and monotonic clocks do not persist. Declared as residual risk rather than silently carried."
residual_risks:
  - "NTP forward steps can produce a false HUNG on a healthy run (above). Bounded: the alarm names the pid, and the next scan after the step is correct."
  - "Coverage is one producer. The healer declares its runs; the other ~20 fleet spawners do not, so an abandonment there is still invisible. Wiring them is a migration, deliberately not bundled."
  - "The store is per-host and unreplicated: a machine nobody scans is not covered."
  - "A stale pidfile is ALERTED on but not auto-cleared, so a healer left in that state stays skipped until someone acts. Chosen over weakening the anti-overlap invariant inside this PR."
  - "The retired DECLARED-SPAN-UNMET verdict still exists in fleet_sessions.py. Harmless (informational-only, no organ routes on it) but two verdicts about one question is a documentation hazard until the follow-up lands."
  - "prune() now calls classify() for old unclosed records, which spawns `ps` per record. Bounded by how few such records exist, but it is real work on the open() path."
