brief_ref: evidence/brief.yml
plan_ref: |
  arm the section-number guard that #4562 shipped unarmed, and prove it bites rather than
  passing trivially
diff:
  behaviour_change: |
    yes, in CI only: a new blocking job runs on every pull_request / merge_group / push:main.
    No product code, no runtime surface, no deploy step.
    The whole-diff net line count is near zero only because this PR REPLACES the inherited
    evidence/brief.yml and evidence/pack.yml (a prior PR's, larger) with its own; the CODE it
    adds is +91/-0 across the two workflow files.
  net_lines: "+262/-262 (net +0) vs merge-base 2eb20d836; code alone +91/-0"
receipts:
  - claim: "The guard was UNARMED on origin/main — nothing in .github/workflows/ named it."
    cmd: "git grep -c test_runbook_section_numbers_are_unique origin/main -- .github/workflows/"
    exit: 1
    ts: "2026-08-22T00:34:21Z"
    seat: author-session (M5, claude-opus-5)
  - claim: "actionlint accepts both changed workflows."
    cmd: "actionlint .github/workflows/runbook-section-numbers.yml .github/workflows/main-push-failure-watch.yml"
    exit: 0
    ts: "2026-08-22T00:33:52Z"
    seat: author-session (M5, claude-opus-5)
  - claim: "The guard itself passes on the current tree (3 tests)."
    cmd: "python -m pytest scripts/tests/test_runbook_section_numbers_are_unique.py -q"
    exit: 0
    ts: "2026-08-22T00:33:52Z"
    seat: author-session (M5, claude-opus-5)
  - claim: "timeout-minutes clears the 10m checkout floor (131 jobs scanned)."
    cmd: "python scripts/lint_workflow_timeout_floor.py"
    exit: 0
    ts: "2026-08-22T00:33:53Z"
    seat: author-session (M5, claude-opus-5)
  - claim: "The new push:main job is registered in the watcher — 99 live workflows covered."
    cmd: "python scripts/check_watcher_coverage.py"
    exit: 0
    ts: "2026-08-22T00:34:20Z"
    seat: author-session (M5, claude-opus-5)
  - claim: "The workflow is shaped so it CAN be promoted to required without the
      'Expected — waiting' deadlock (merge_group present, no top-level pull_request paths)."
    cmd: "python scripts/ci/check_required_workflow_conformance.py"
    exit: 0
    ts: "2026-08-22T00:33:53Z"
    seat: author-session (M5, claude-opus-5)
  - claim:
      "PROOF OF BITE, run locally against the same anchor the CI step uses: the sed mutation
      changes the file's sha256 (not a NO-OP), and the guard FAILS on the reintroduced 6quater
      collision, naming it — `duplicated section numbers ['6quater']`."
    cmd:
      "sed -i '' 's/^## 6septies\\. .../## 6quater. .../' docs/runbooks/merge-queue-discipline.md
      && python -m pytest scripts/tests/test_runbook_section_numbers_are_unique.py -q"
    exit: 1
    ts: "2026-08-22T00:34:06Z"
    seat: author-session (M5, claude-opus-5)
  - claim:
      "…and the restore is byte-identical by sha256, with the guard green again — so the
      failure above is the mutation, not an unrelated breakage."
    cmd:
      "cp /tmp/rb.orig docs/runbooks/merge-queue-discipline.md && shasum -a 256 ... (compared)
      && python -m pytest scripts/tests/test_runbook_section_numbers_are_unique.py -q"
    exit: 0
    ts: "2026-08-22T00:34:06Z"
    seat: author-session (M5, claude-opus-5)
dissent:
  - seat: "scripts/lint_workflow_timeout_floor.py (CI, non-author)"
    objection:
      "The first revision shipped `timeout-minutes: 5`, which budgets the CHECKOUT out of
      existence — actions/checkout on this repo intermittently takes ~2 minutes, and a job that
      runs out reports `cancelled`, not `failure`, so a required check would hang un-green with
      nothing red to fix. Raised to 10 and re-verified (131 jobs, floor 10m)."
    status: CONFIRMED
  - seat: "scripts/check_watcher_coverage.py (CI, non-author)"
    objection:
      "The first revision added `push: main` without registering the job in
      main-push-failure-watch.yml, leaving a main-push failure unwatched — exactly the silent-cron
      shape (superscar #2) this PR exists to close. Registered mid-list per that file's own
      comment, re-verified at 99/99 covered."
    status: CONFIRMED
  - seat: "Harness floor recompute (CI, non-author)"
    objection:
      "This PR touches only .github/workflows/ — a hot-zone path, deterministic floor 3 —
      and carried NO evidence/brief.yml of its own; the brief at HEAD was inherited from a prior
      merge. A Gear-3-floor diff cannot silently pass as 'not a harness task'. This pack and its
      brief are that objection's remedy, authored after the gate refused."
    status: CONFIRMED
  - seat: "author-session self-audit (M5)"
    objection:
      "A uniqueness check is green on any file that happens to have no duplicates, so
      merging this workflow would prove only that the repo is currently clean — not that the guard
      can detect anything. Without a guilt proof, an accidentally-broken guard (bad path, wrong
      parser, silent exception) would look identical to a working one. Remedied by the
      proof-of-bite step, which is itself protected against a drifted anchor by the NO-OP check."
    status: CONFIRMED
residual_risks:
  - "The context is NOT required yet. Merging arms the workflow (it runs and reports) but a red run
    does not block until infra/required.d/contexts.json is regenerated with
    scripts/ci/snapshot_required_contexts.py. That second step is deliberately out of this diff and
    tracked in PENDING-ARMS; claiming 'blocking' before it is done would be exactly the
    esiste!=armato lie this PR is curing."
  - "check_watcher_coverage.py emits a standing `::warning::stale entry in watcher's workflows:
    list, no matching workflow: AI PR review (advisory)` — pre-existing (that workflow was disabled
    2026-08-20), unrelated to this diff, and not fixed here."
  - "The proof-of-bite step's anchor is a literal heading string; a reword makes it a NO-OP. The
    step errors loudly in that case, but nothing prevents a future PR from reintroducing the
    collision on a DIFFERENT heading pair, which this one mutation would not exercise. The guard
    itself is general; only the proof is anchored."
sources:
  - "PR #4562 — shipped the guard (scripts/tests/test_runbook_section_numbers_are_unique.py) with
    guilt/innocence fixture and anti-vacuity test, and no workflow executing it."
  - "PR #4557 — the incident: gave a new runbook section the number 6quater, already held by the
    Dependabot section since #3381."
  - ".claude/rules/cicatrix-superscar.md #2 (esiste != armato) and #3 (guard needs guilt AND
    innocence)."
  - "scripts-tests-sweep.yml — the repo-wide scripts/tests/ sweep, continue-on-error: true, which
    is why 'a test exists under scripts/tests/' does not mean it gates anything."
tests:
  - "scripts/tests/test_runbook_section_numbers_are_unique.py — 3 passed (shipped in #4562, not
    modified here)."
  - "The proof-of-bite receipt pair is the behavioural test OF THE ARMING: guilt (exit 1 on a
    mutated file) and innocence (exit 0 after a byte-identical restore)."
static:
  - "actionlint exit 0"
  - "scripts/lint_workflow_timeout_floor.py exit 0 (131 jobs, floor 10m)"
  - "scripts/check_watcher_coverage.py exit 0 (99 workflows covered)"
  - "scripts/ci/check_required_workflow_conformance.py exit 0 (27 required contexts, 0 violations)"
runtime_proof:
  - "Merging IS the deploy for this artifact: GitHub Actions picks the workflow up on the next
    event, no apply step exists. PROVE-LIVE is therefore a post-merge observation that the job
    actually appears and runs on a subsequent PR — recorded as the follow-up, not claimed here."
pii_scan: clean
size_tokens: 1917
