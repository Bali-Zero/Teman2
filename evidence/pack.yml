  - claim: "DEFECT 3 — 'skipped' really does satisfy branch protection: the proof is a MERGE, not a doc"
    cmd: "probe --sha b72f1885f... (PR #4654, docs-only, touching only .claude/skills/modus/PENDING-ARMS.md)"
