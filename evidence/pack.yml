tests:
  - "scripts/ci/test_shard_tests.py — 28 cases, run on the frozen committed bytes. GUILT (each is a way a sharded suite can silently under-run and look green): a dropped module, a module running twice, a module outside the corpus, a shard that never ran, a shard running someone else's files, a stray chunk index, and the worst case of all — every shard publishing an empty list. INNOCENCE: a sound partition, a corpus smaller than the shard count (scoped PR lane, shard 3 legitimately empty), determinism across calls, the e2e exclusion, and the fail-open target resolution (narrowing requires BOTH the flag and a non-empty selection; 'banana' as IMPACT_RUN_ALL yields the full corpus)."
  - "The union/security mode has its OWN guilt+innocence split, because it is the pass a malicious diff has to defeat: it must keep catching a dropped module, an overlap, an empty partition and a missing shard, while accepting a different assignment algorithm and a PR that adds test modules — and the full/drift mode must still reject both of those, which is what makes the two passes distinct rather than redundant."
static:
  - "actionlint .github/workflows/tests.yml -> clean"
  - "scripts/ci/lint_unreachable_workflow_conditions.py -> exit 0"
  - "pre-commit hook chain (lease-check, anti-reward-hacking test lint, secrets, python lint, off-limits) -> all passed on all three commits"
runtime_proof:
  - "MEASURED on run 32629845135 (conclusion success, head 27b8dea23), and it is the FULL corpus,
    not a scoped PR selection — each shard log reads `owns 476 of 1428 test modules`. Wall-clock:
    Backend Shard 3 283s, Shard 2 259s, Shard 1 249s, Backend Static 195s (concurrent, never the
    critical path), Backend Tests (Python) fan-in 66s. Critical path for the required context =
    slowest shard + fan-in = 283 + 66 = 349s = 5.8 min, against a 1068s (17.8 min) baseline on
    merge_group run 32626973483. That is a 67% reduction, and code PRs pay it twice."
  - "Every fan-in gate actually ran and passed, read from the job step list rather than inferred
    from the job conclusion: Assert every upstream job succeeded / Verify the partitioner own
    guilt and innocence corpus / Extract trusted partitioner (base ref) / Partition guard / Prove
    each shard reported executed tests / Combine shard coverage / Report shard balance. `Upload
    coverage to Codecov` shows `skipped`, exactly as predicted from the absent token."
  - "The partition guard printed BOTH passes on real data: `partition sound (union mode): 1428
    test modules, 3 shards, disjoint and complete` and `partition sound (full mode): ...`. The
    shards executed 8858 + 8695 + 8364 = 25,917 tests with 0 collection errors."
  - "Shard balance MEASURED, not assumed: `slowest/fastest = 1.32x`, below the ~2x threshold at
    which a duration-aware splitter would be worth adding. Round-robin over path order is
    adequate for this corpus today; the instrument that would say otherwise is now in the job."
  - "NOT PROVEN, stated because the run is green and could be over-read: the coverage combine +
    --fail-under path did NOT execute. This was the pull_request lane, where BACKEND_COLLECT_COVERAGE
    is false, so the step exited early on `threshold not applicable`. The combine, the version
    agreement check and the 55% gate are exercised only on merge_group / schedule / dispatch — the
    first real test of them is this PR's own queue transit."
  - "ALSO NOT PROVEN: this measurement is of head 27b8dea23. The commits after it (receipts moved
    out of the pytest cwd, the coverage decision moved to workflow env, the trusted-extraction
    fail-closed, the deps-guard re-anchor) change the plumbing and need their own green run."

dissent:
  - seat: "kimi-code/k3 (Moonshot, cross-family, fresh context) — ROUND 1, against the live worktree"
    objection: 'Two CONFIRMED findings, both real, both cured before this pack was written. (1) THE MONEY QUESTION: the shards and the fan-in both ran the PR OWN copy of scripts/ci/shard_tests.py, so a diff appending one entry to EXCLUDED_DIRS made both agree perfectly on a shrunken corpus — chunks tile it exactly, guard green, required context green, and the test catching the diff regression never ran. It noted the author had built exactly this defence (BASE_SHA extraction) for change_map.py/impact_map.py and not for the new file, and that the change-map classifying the PR as run_all=true does not help, because forcing the jobs to RUN does not stop a modified enumerator from shrinking what they run. Cured in 0b298c253. (2) The fan-in derived its coverage pin from requirements.lock.txt while the shards install the lock closure and then an unpinned pytest-cov on top, so the comment claimed a same-version guarantee the code did not deliver. Cured in 535b27784. It REFUTED the ARG_MAX concern (~28KB of args vs a ~2MB limit), the stuck-required-context paths, and a pytest python_files mismatch. Its FINAL "CRITICAL FINDING" — that test_shard_tests.py references a --union flag shard_tests.py does not have — is an ARTEFACT OF THE AUTHOR OWN METHOD: it was reading a worktree being edited in response to its own earlier finding, so it got a torn read. Disproved by re-running the corpus against a frozen `git archive` of the committed SHA: 28/28. Recorded in modus AMENDMENTS as the author lesson, not the refuter finding.'
    status: CONFIRMED
  - seat: "codex gpt-5.6-sol at xhigh (OpenAI, cross-family, fresh context, read-only sandbox) — ROUND 2, against an immutable `git archive` snapshot of 535b27784"
    objection: 'Verdict DEFECTIVE, 7 numbered findings. CURED HERE: (a) the `trusted=introduced` branch treated ANY `git show` failure as "the file is new", so an unfetched base SHA or a transient git error silently downgraded the security gate to the diff own copy — now three explicit states, and only a READABLE base commit that genuinely lacks the file is allowed to degrade; anything else exits 1. (b) The junit gate checked only `tests > 0` and `errors == 0`, so a conftest that blanket-skips passes it — now also refuses when every collected test was skipped, and the step is RENAMED from "Prove each shard actually executed its chunk" to "Prove each shard reported executed tests", because the old name claimed a per-module guarantee it does not deliver. (c) The `collect-coverage-N.txt` receipt was written into the same directory pytest then runs PR code in, so a `pytest_sessionfinish` could rewrite every shard to `false` and the fan-in would skip the combine and the threshold entirely — the decision now lives in a workflow-level `env:` that nothing the job runs can write, still ONE definition read by both sides. (d) All remaining receipts moved out of the pytest cwd into $RUNNER_TEMP. (e) The comment claiming "the BASE ref corpus" was false and is corrected in place: it is BASE LOGIC over the HEAD tree. (f) The `push:` trigger it flagged as absent IS absent — verified independently against the parsed `on:` block — and the brief acceptance criterion that listed it has been corrected. ACCEPTED AND NOT CURED, because they are pre-existing and not sharding regressions: deleting a test file, relocating one into backend/tests/e2e/, the change-map skip path, and PR-lane impact scoping all remove tests from a run under ANY design that reads the working tree; the pre-split job had the same properties. It REFUTED the matrix-aggregate concern and found no current bash bypass.'
    status: CONFIRMED
  - seat: "kimi-code/k3 — ROUND 2, same frozen snapshot, dispatched independently of the Codex run"
    objection: "Reached the same top two findings independently (unmergeable-on-target-removal, and the git-error/absent conflation), which is corroboration rather than novelty. Its distinct catch, CURED HERE: `resolve_targets` passed a selection NOT under `apps/backend-rag/` through repo-root-relative, and since the shards run from `apps/backend-rag` that path does not exist there — so the first impact-map change that ever emitted one (a bot test, a packages/ test) would abort enumeration and red every shard. Worse, this module OWN test suite ASSERTED the broken form, which is how a latent false-red gets blessed as intended behaviour; the test now asserts the `../../` form and carries a guilt case for the old one. Also cured: the SystemExit on a target that no longer exists made renaming `backend/tests/` permanently unmergeable — the security pass now drops a vanished target with a loud ::warning:: instead of aborting, while the shards keep failing loud, and both halves have tests. Also flagged and fixed: two sibling comments had drifted to two different corpus counts (1423 vs 1425) while the true figure was 1428 — the counts are removed rather than corrected, since a number in a comment is a claim with no test behind it."
    status: CONFIRMED
  - seat: "Nuzantara:fleet-watch (a sibling session on another machine, via the fleet mailbox) — CI-red triage"
    objection: 'Reported two red required checks and diagnosed them. Both confirmed by direct inspection rather than taken on trust, and its diagnosis of the first was correct but INCOMPLETE in the way that mattered: it said "declare coverage in the backend test deps file". Declaring it was necessary; the real defect was that `scripts/tests/test_test_deps_declared.py` anchors on the single job id `backend-tests`, and the sharding split moved the test-runtime install (`pytest pytest-cov pytest-asyncio pytest-mock fakeredis pytest-xdist`) out of it into `backend-shard`. The anchor still resolved, still found run: steps, still parsed a package — so no assertion fired — while the install line the guard exists to police had left its field of view entirely. That is this PR own thesis turned on the PR: a guard silently narrowed by a change that never touched it. Re-anchored to the whole backend test lane, with a guilt test that fails if the anchor is narrowed back (falsified locally: it then sees only [coverage]). Measured before/after: 1 package visible vs 7.'
    status: CONFIRMED

residual_risks:
  - "THE WALL-CLOCK TARGET IS NOT YET PROVEN. The <=8min figure is arithmetic on a measured breakdown plus one measured data point (Backend Static 170s). The honest status is: projected, not demonstrated. If the measured shard wall-clock lands above target, the next lever is the duration-aware splitter this design already instruments for (see below) -- not a wider matrix."
  - "SHARD BALANCE IS UNMEASURED BY CONSTRUCTION. Round-robin over the canonical path order balances FILE COUNT exactly (475/475/475) and says nothing about TIME. The fan-in emits a slowest/fastest ratio from junit's own `time` attribute precisely so the pytest-split decision is made on data; above ~2x, round-robin is the wrong splitter. Deferring that to v2 is a declared choice, and this PR's own transit is its first measurement."
  - "RUNNER SLOT PRESSURE, DECLARED. This turns 1 job into 5 per run, and both the PR lane and the merge-group lane run. tests.yml's own concurrency comments identify runner slots as the binding constraint on main's velocity, so trading slots for wall-clock is a real trade, not a free win. Public repo => the minutes are free; the SLOTS are not. Not mitigated in this PR."
  - "THE 'INTRODUCED' BRANCH OF THE TRUST BOUNDARY IS WIDE OPEN ON THIS PR AND ONLY THIS PR. `git show BASE_SHA:scripts/ci/shard_tests.py` fails because the base ref has no such file, so this PR's own guard adjudicates with its own head copy. That is unavoidable for the commit that introduces a trusted file; it is declared loudly (a ::warning:: in the run log) rather than silently downgraded, and the CODEOWNERS entries added here mean every LATER edit always has a base copy to be judged against."
  - "A PR whose base predates this commit will have a base copy of shard_tests.py without the `--union` flag, and the security pass would fail on an argparse error. That fails CLOSED (red), not open, and the window closes as soon as this lands."
  - "Codecov remains unarmed. There is no CODECOV_TOKEN secret in this repository, so the upload step has been skipping on every run since before this change (measured 0s). Carried over unchanged rather than deleted; arming it is a separate decision and is NOT part of this PR."
