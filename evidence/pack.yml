      the scanner to every future evidence pack, including one that really does paste a token."
    status: CONFIRMED
  - seat: "Gear-3 gate round 5 (opus 5, fresh context, non-author) — finding 1, BLOCKER"
    objection:
      "The reorder opened the MIRROR of the leak it closed. Rule 4 consumes an 8+ char
      [A-Za-z0-9._-] run after `Bearer`, and a credential NAME is exactly such a run, so
      `Bearer refresh_token=<v>` logged as `Bearer <REDACTED>=<v>` — the marker landed on the NAME,
      the value survived in full, and the output READS as if redaction fired. That is precisely the
      'less safe than not matching at all' property this round claimed to eliminate. Twelve shapes
      demonstrated, plus one on rule 1 (`echo ghp_MYTOKENS=<v>`). The gate measured it as a
      REGRESSION against the branch's own history: three shapes ok at 9ac5e3956 and fbcaff303, LEAK
      at the round-5 head — so this round traded one leak direction for the other and was NOT
      net-strictly-safer. Reproduced by the author before fixing: 12/12 leak. Cured STRUCTURALLY,
      not by another reorder — every marker-anchored rule now carries ASSIGN_TAIL. The gate's own
      proposed regex used a bare `[^\\s\"']*` tail; measured, that leaves the QUOTED forms leaking,
      so the shipped tail reuses the full VALUE alternation instead."
    status: CONFIRMED
  - seat: "Gear-3 gate round 5 (opus 5, fresh context, non-author) — finding 2, MAJOR"
    objection:
      "'Rule 2 is the destructive one' and 'the order is pinned, all five permutations fail the
      suite' were both load-bearing and both overreached. Rules 1, 3 and 4 destroy rule 2's marker
      in exactly the same way — finding 1 is the demonstration — and a mutation set can only prove
      the SUITE constrains the order, never that the order is safe, because the corpus contained no
      instance of the mirror shape. The stated principle ('marker-anchored rules first, the generic
      NAME rule LAST') is what PRODUCED the leak. Rewritten in the hook, the brief and the registry
      note as a measured trade with the mirror named: a mutation score is a statement about the
      corpus, not about the world."
    status: CONFIRMED
  - seat: "Gear-3 gate round 5 (opus 5, fresh context, non-author) — finding 3, MINOR"
    objection:
      "'Redacting before truncating trades one exposure for a smaller one' is contradicted by
      measurement. Re-measured by the author on the shipped file: a 205-char command with a
      redactable 140-char value first and a NAMELESS 20-char secret starting at char 185 — the base
      clips it to a 15-char partial, the shipped head redacts first, the string shortens, and the
      WHOLE value is pulled inside the window. Larger, not smaller. The comment disclosed that
      redaction pulls bytes in but stated the direction wrongly; corrected in place. The gate
      separately CONFIRMED the good half: a MATCHED token planted at char 190 cannot survive as a
      clipped partial."
    status: CONFIRMED
  - seat: "Gear-3 gate round 5 (opus 5, fresh context, non-author) — finding 4, MINOR"
    objection:
      "The Detect Secrets dissent entry said 'six new unaudited findings'; the baselines diffed entry
      by entry give EIGHT added (6 Secret Keyword + 2 Basic Auth), 0 removed. Same miscount class
      this PR has already corrected in itself three times. Corrected."
    status: CONFIRMED
  - seat: "Gear-3 gate round 5 (opus 5, fresh context, non-author) — what it could NOT check"
    objection:
      "The gate declined to read ~/logs/codex-spalla-trigger.jsonl at all: reading it is itself a
      credential action, and by this pack's own admission the act of measuring inflates the next
      measurement. So EVERY live-log figure in this pack — the 3 secret-bearing runs, the 2291 lines
      / 0.686% of 333,832, the byte-identical replay — is UNVERIFIED by any non-author seat. It is
      neither confirmed nor disputed. Recorded here rather than left implicit, because the rest of
      this pack was independently checked and those numbers were not."
    status: PLAUSIBLE
  - seat: "Gear-3 gate round 6 (opus 5, fresh context, non-author) — BLOCKER"
    objection:
      "ASSIGN_TAIL's bare branch runs to the next whitespace, so it could CROSS a later rule's
      marker and blind the rule that owns it. `github_pat_<8+>=bearer <v>` had rule 1 — which runs
      FIRST — eat the word `bearer` as its own value; rule 4 then had nothing to anchor on and the
      token stood in the clear beside a `<REDACTED>` that had fired for something else. Six
      reproducers plus a greedy sub-case killing two markers in one bite, and 258 inputs in a
      differential fuzz against the pre-tail version. Third round, third direction, SAME misleading
      shape — and the gate named the framing error precisely: the widening WAS disclosed, but as a
      cost in 'log usefulness'; when the swallowed word IS a marker it is a security hole. The gate
      also refused to hand over a patch, having measured that its own one-line guard only halved the
      class (142 -> 74) because a marker can sit at the END of a run. Cured structurally instead:
      the bare branch is TEMPERED — it may not cross a position where any later marker starts — and
      the URL-scheme marker is length-bounded so a value glued to a URL is not mistaken for one.
      Re-measured on the REAL hook over the same 271,874 probes: 0 inputs leak that fa06a285a did
      not."
    status: CONFIRMED
  - seat: "Gear-3 gate round 6 (opus 5, fresh context, non-author) — MAJOR, pre-existing"
    objection:
      "A backslash-escaped quote defeats VALUE in EVERY rule: `API_KEY=\\\"<v>\\\"` logs the value
      beside a `<REDACTED>`, and a JSON body written with escaped quotes inside a double-quoted shell
      string is not touched at all. NOT caused by any commit on this branch — fa06a285a leaks
      identically — and undisclosed until now. Re-measured on this head: all three shapes confirmed.
      DISCLOSED in the under-match block, NOT fixed here: a change to VALUE's quoting is its own
      diff, and this round has already replaced one leak with another twice. The gate's own lesson
      is recorded with it: the corpus's JSON guilt case uses the single-quoted-outer form, which
      works, so the corpus proved the shape it enumerated and this one hid behind it."
    status: CONFIRMED
  - seat: "Gear-3 gate round 6 (opus 5, fresh context, non-author) — what it could NOT break"
    objection:
      "Rule 3 having no tail: the gate ran url-then-NAME, url-then-Bearer-header, NAME inside the
      userinfo, userinfo abutting a NAME, no-space url+NAME, and rule 3 firing on a password that IS
      the word Bearer — none showed rule 3 destroying a following NAME. It also re-verified the 7
      mirror cases non-vacuous by mutation, that innocence did not shrink (15 -> 15, diffed by case
      name), and that the two rewritten claims did not replace one overreach with another. Recorded
      so the emptiness is auditable rather than assumed."
    status: RETRACTED
  - seat: "Gear-3 gate round 7 (opus 5, fresh context, non-author) — BLOCKER"
    objection:
      "FOURTH direction. MARKER guarded the anchors of rules 1, 3 and 4 and omitted rule 2 NAME --
      the rule that does the most work -- so the tempered tail could still cross TOKEN: / PASSWORD= /
      API_KEY = and swallow the anchor whose value it then left behind. Five deterministic
      reproducers, all of them a regression against fa06a285a, which redacts every one correctly.
      Reproduced by the author before fixing: 5/5. Cured by the gate own proposed cure, which it had
      verified end to end rather than merely proposed: hoist rule 2 NAME shapes above MARKER and add
      one alternative."
    status: CONFIRMED
  - seat: "Gear-3 gate round 7 (opus 5, fresh context, non-author) — MAJOR, receipt falsified"
    objection:
      "The pack claimed the differential fuzz found ZERO regressions. Re-running the gate own
      generator with a different seed found 48 of its 258 still leaking, 52 total. The pack was
      simultaneously carrying the honest half -- residual_risks said a fourth direction was more
      likely than not -- and a receipt claiming the measurement found none; those cannot both stand.
      Corrected in place with the mechanism: ZERO of the 52 came from the deterministic triples,
      because the class needs four fragments and a three-fragment core cannot emit it. A fuzz score
      is a statement about the GENERATOR."
    status: CONFIRMED
  - seat: "Gear-3 gate round 7 (opus 5, fresh context, non-author) — MAJOR, overclaim"
    objection:
      "The replacement for the deleted rule-1 sentence read: rule 1 position is now held by
      CONSTRUCTION, no rule tail can cross a later rule marker. True only under a definition of
      marker that silently excluded rule 2 NAME -- the hole in the BLOCKER. Same overclaim shape as
      the two previous rounds: a real property stated as the safety it does not deliver. Now
      qualified in place: no tail can cross an anchor THAT MARKER LISTS, and MARKER is the thing
      that has to be kept complete."
    status: CONFIRMED
  - seat: "Gear-3 gate round 7 (opus 5, fresh context, non-author) — what it could NOT break"
    objection:
      "Two arguments survived a real attack. The LENGTH BOUND: six scheme lengths up to 20
      characters, each as a URL inside a tail, none leaked on either head -- because the bare run has
      no whitespace to stop at inside a URL, so it consumes the whole URL, which IS redaction; the
      bound only has to stop the tail halting mid-URL. The UNTEMPERED QUOTED BRANCHES: seven probes,
      four leak and all four leak on fa06a285a too (documented nameless-secret class), and the three
      that could have regressed did not. The gate also confirmed the 7 third-direction cases
      non-vacuous by mutation and that innocence did not shrink (15 -> 15, diffed by name). Recorded
      so the emptiness is auditable."
    status: RETRACTED
  - seat: "Gear-3 gate round 7 (opus 5, fresh context, non-author) — on the deferral"
    objection:
      "Explicitly agreed the backslash-escape fix should NOT land in this PR: pre-existing so
      deferring ships no new leak, now NAMED with all three reproducers, and a change to VALUE
      quoting touches rule 2 core AND every rule tail in one diff -- precisely the blast radius that
      produced the mirror, the third and the fourth direction. Its one condition: give it a
      PENDING-ARMS line with an owner, not only a comment, because a named hole with no ledger entry
      is how a residual becomes permanent. Done in this diff."
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: "THE FIFTH DIRECTION: TEMPERED_VALUE tempers only its bare branch. Its two QUOTED branches are untempered, and the comment asserting they are safe by construction -- because they consume a COMPLETE delimited value -- is false: the marker is swallowed INSIDE the quotes and the value it introduces sits BEHIND the closing quote. Do not write a sixth patch; the architecture is the defect."
    status: CONFIRMED
  - seat: session (m5), on its own five cures
    objection: "Five directions of one defect is evidence about the DESIGN, not about the five patches. Each cure was verified and each was followed by the next direction of the same disease, which is the signature of a blacklist that must enumerate every structure a secret can hide in. Acting on the gate's advice, the cascade was deleted rather than extended."
    status: CONFIRMED
  - seat: session (m5), against its own redesign
    objection: "COUNTER-ARGUMENT recorded because it is real and was overridden knowingly: a cut to end-of-string is a BIGGER blast radius than a sixth patch, and it costs the diagnostic tail after any early credential. Overridden on two measured grounds -- the 15 innocence cases are unchanged and still pass, so the over-match risk did not materialise on the corpus that exists; and the target field has NO programmatic consumer, so the tail is diagnostic-only. Both are stated as risks below rather than dismissed."
    status: CONFIRMED
  - seat: session (m5), attacking its own redesign before shipping
    objection: "The redesign does NOT close the class the deferred ledger row named. Measured on the three shapes that row cites: two die with the cascade, but a JSON body inside a double-quoted shell arg still leaked with NOTHING firing at all -- the line unchanged byte for byte. Soundness of the CUT and recall of the ANCHOR are separate obligations; the first proves nothing about the second. Fixed explicitly, not by side effect."
    status: CONFIRMED
  - seat: refuter subagent (sonnet, fresh context, snapshot only, not the author)
    objection: "The \\? backslash tolerance is a point-patch for exactly one backslash, not an answer to arbitrary escaping depth. A nested remote dispatch arrives with two or three and defeats it again -- the same disease one layer deeper, within an hour of the cure, and an instance of the enumeration trap the redesign claims to have replaced."
    status: CONFIRMED
  - seat: refuter subagent (sonnet, fresh context, snapshot only, not the author)
    objection: "A PEM private-key block anchors on nothing at all: PRE?KEY requires KEY glued to its prefix and PRIVATE KEY contains a space. The most unambiguous credential shape in existence was invisible to every rule."
    status: CONFIRMED
  - seat: refuter subagent (sonnet, fresh context, snapshot only, not the author)
    objection: "The cut is sound about text AFTER the earliest anchor and says nothing about text BEFORE it, so every vocabulary gap is a FULL silent leak of everything preceding it. Demonstrated with COOKIE=, SESSION_ID=, PAT=, SIGNING_CERT=, redis-cli AUTH <v>, mysql -p<v>, API_KEY -> <v>, and a secret sitting before a later Bearer anchor."
    status: CONFIRMED
  - seat: author-session (M5), re-measuring the refuter's own findings before acting on them
    objection: "The refuter's list reads as findings against the NEW design; measured, EVERY ONE of them leaks identically on the OLD one. They are pre-existing anchor-recall gaps, not regressions, and most are already named in this pack's residual risks. Recorded because the distinction changes what the reader should do: none of them is a reason to revert the redesign, and two of them (escaping depth, PEM) were worth fixing on their own merits."
    status: CONFIRMED
  - seat: refuter subagent (sonnet, fresh context, snapshot only, not the author)
    objection: 'The cut makes over-match WORSE IN SCOPE even where the trigger is unchanged: echo "PASSWORD: must be at least 12 chars" lost only one word under the cascade and now loses the whole line. Same for a policy/help string, a status message, and an env-var REFERENCE like echo "TOKEN: ${SECRET_TOKEN}" that contains no secret at all.'
    status: CONFIRMED
  - seat: author-session (M5), attacking its own diff after the refuter had finished
    objection: "The unbounded \\* I had just introduced was fine, but the unbounded URL SCHEME next to it was not: 2278 ms on a 50KB no-credential command, in a hook that runs on every tool call. I had copied the rule forward verbatim during the redesign and deleted, with the old MARKER, the only comment in the file that argued for bounding it. Deleting a cascade also deletes the reasoning attached to it, and that is a cost of wholesale replacement worth naming."
    status: CONFIRMED
residual_risks:
  - "The 30k size_tokens cap is DOCUMENTATION, not an armed check (superscar #2). A repo-wide grep
    finds the field only in evidence packs and research/operations/2026-08-09-harness-v2-teman2.md:155
    -- no code reads it, so a pack could breach the gate's input allowance and every check would stay
    green. Found by the third-party verifier on 2026-08-22. Not this PR's regression and not fixed
    here; it needs its own ledger line and its own executor."
  - 'SURVIVING UNDER-MATCH, each driven through the real hook rather than reasoned about: (a) `<any-prefix>KEY=` outside the bounded vocabulary -- `PUBKEY=`, `M5KEY=`, `QKEY=`, `ORIGINALAPIKEY=`, `MACHINEHMACKEY=` leak in full; their delimited twins are caught. This is the deliberate price of keeping `monkey=patch` innocent and is the ONE class where this matcher is knowingly weaker than a bare-substring one: on the live log, 40 distinct names / 136 occurrences the substring version caught and this one does not, though most (KEYWORDS 15, KEYCHAIN 12, StrictHostKeyChecking 21, MONKEYPATCH 3, ONKEYDOWN 2) were that version''s own over-match. (b) Credential words outside the six: `--pin=`, `--otp=`, `--salt=`, `--cookie=`. (c) `Authorization:` with anything but `Bearer` -- `Basic <b64>` or an opaque token. (d) RE-LABELLED 2026-08-22, because the old title `a POSITIONAL secret with no name` was contradicted by its own example: a secret NOT JOINED TO A CREDENTIAL-ISH NAME BY `=` OR `:`. That class INCLUDES every `--flag <value>` form, because rule 2 needs the separator between name and value and a SPACE there defeats it outright. Measured leaking: `gh auth login --token <v>`, `mytool --api-key <v>`, `mysql --password <v>`, `echo <v> | gh secret set FOO`, plus the genuinely nameless `mytool deploy <v>` / `mysql -p<v>`, plus `curl -u admin:<v>` and `curl --user admin:<v>` -- those two DO carry a `:` but hang it off a USERNAME, which is not a credential-ish name. (e) An UNQUOTED value containing a space -- only the first word is redacted. (f) NEW 2026-08-22, the UNDER-MATCH HALF of the dot-lookbehind, which all four artifacts described only as over-match protection: a SINGLE-SEGMENT attribute assignment leaks in full -- `c.token = "<v>"`, `c.secret = "<v>"`, `jq ''.password = "<v>"'' cfg.json`. Multi-segment names are still caught (`cfg.api_key = "<v>"` matches at `key`, after the `_`), which is exactly what scopes the hole. Same named-price shape as the KEY vocabulary. (g) NEW 2026-08-22: an INDEX between the name and the separator -- `SECRETS[0]=<v>`, `TOKEN[0]=<v>` leak, because `[0]` is neither the optional quote nor the separator rule 2 permits between them.'
  - "Redact-before-truncate widens the truncation window by shortening the string, so a secret that used to fall outside the 200 chars can be pulled in. Smaller exposure, not zero. Pinned in the other direction by the straddle case, which proves truncate-first is strictly worse."
  - "The already-leaked material remains valid: 1 whole-token-length run plus 2 truncation-clipped partials. Two earlier drafts of this pack inflated that (11 tokens -- a LINE count read as a VALUE count; then 2 whole tokens -- an end-of-window artifact read as two more secrets). Both caught by the Gear-3 gate; the rotation decision hangs on this number."
  - "OVER-MATCH (cicatrix #3), stated with its full damage rather than as value-only: the name match has no notion of whether a value is actually secret, AND (i) it swallows the rest of an unquoted value, so `sed -i 's/key=old/key=new/'` loses its second half entirely, and (ii) it NORMALISES the separator to `=`, so a header or JSON `name: value` is logged as `name=<REDACTED>`. Those lines stop being replayable commands. Concretely over-redacted today: `redis-cli --scan --pattern 'keys:*'` (1 of 35 ordinary-command probes), `PWD=/tmp`, any `FEATURE_FLAG_KEY=`. Measured rate on the real log: 2291 lines / 0.686% of 333,832 at 2026-08-21T22:49:57Z, higher than the 1875 / 0.562% of the version rejected for over-matching. Accepted: over-redacting a non-secret beats under-redacting a real one."
  - 'OVER-MATCH in rules 3 and 4, undisclosed until the Gear-3 gate drove it. (i) Rule 4''s `Bearer` is a BARE WORD in prose, not a header: it eats the next >=8-char `[A-Za-z0-9._-]` run in ANY text, with no name, assignment or separator. `gh pr create --title "Bearer authentication rollout"` is logged as `Bearer <REDACTED> rollout` and `git commit -m "fix: bearer credentials refresh loop"` is mangled the same way -- and `gh pr create` is TRIGGER RULE 1 of this very hook, so those are the lines it exists to record. Corpus at 2026-08-21T22:50:35Z / 333,833 lines: 8 lines carry a match, 10 matches, 3 of the 10 carry no digit at all (one of which is this session''s own probe string -- this log inflates its own denominator, as documented). DELIBERATELY NOT narrowed to require a digit: that trades a 3-occurrence over-match for an under-match on an all-lowercase bearer token, inverting the preference stated one bullet above. (ii) Rule 3 redacts a PORT when the port sits in the userinfo PASSWORD position -- `curl ''https://example.com:8443@evil.test/''` logs `example.com:<REDACTED>@`. It cannot fire on a genuine `host:port`, which has no `@` after it (verified: `postgres://appuser@db.host.test:5432/x` and `https://api.example.test:8443/health` are untouched). An all-digits carve-out was considered and REJECTED on measurement: 0 of 367 URL-userinfo matches in the live log have an all-digit password, so it fixes nothing real while opening an under-match on any numeric credential. Scale on the same rule: 354 of those 367 matches are a single test-fixture DSN, i.e. this rule too fires overwhelmingly on non-secrets.'
  - "hook-innocence-gate.yml's path filter still does not cover .claude/hooks/ -- the hooks that actually run from the repo's own hook dir are outside the gate that exists to prove hooks bite only the guilty. Deliberately not widened here."
  - "check_guard_conformance's is_armed() is substring-based, so it cannot detect deletion of the workflow step that executes this suite. The step is genuine today; its removal would not be caught by the registration."
  - "An identical UNTRACKED .codex/hooks/ copy exists in the main checkout; git does not track it, so this diff cannot fix it."
  - "No independent seat has verified any live-log figure in this pack (the 3 secret-bearing runs,
    2291 lines / 0.686% of 333,832, the byte-identical replay). The round-5 gate deliberately
    refused to read the file — reading it is a credential action and inflates the next measurement —
    so those numbers rest on the author alone. They are load-bearing for the 'the fix has zero
    RETROACTIVE effect' claim and for the over-match rate."
  - "The mirror class was closed by widening what rules 1 and 4 consume, which necessarily widens
    OVER-match too: `Bearer <8+ run>: <word>` now loses the following word, and a Bearer-prefixed URL
    is swallowed whole rather than partially. Deliberate, in the direction this hook has always
    chosen (over-redacting a non-secret beats under-redacting a real one), but it is a real
    regression in log usefulness and is not free."
  - "The tempering costs some ACCIDENTAL coverage the untempered tail had: 94 of 200,000 random
    fuzz assemblies leak on this head that did not on the untempered version. Every one is a
    nameless secret glued to a marker with no whitespace, a class fa06a285a leaks too — so it is
    coverage the greedy tail bought by accident, not protection this diff removes. Stated because
    'never worse than the baseline' and 'never worse than the previous commit' are different claims
    and only the first is true."
  - "This is the THIRD leak found in this PR by an adversarial gate, each one created by the cure
    for the previous. The pattern is not that the fixes were careless — each was measured — but that
    a matcher made of rules that REWRITE overlapping spans has a defect class no corpus enumerates.
    A fourth direction is more likely than not; the honest posture is that this hook reduces
    exposure rather than closing it, which is what the under-match block is for."
  - "FOUR directions of the same defect have now been found in this PR, each by an adversarial gate
    and each created by the cure for the previous. Three of the four were invisible to a
    hand-written corpus AND to a differential fuzz until the generator was widened to reach them.
    The standing conclusion is not that the matcher is now complete -- it is that completeness is
    not a property this shape of matcher can be argued into, only measured toward. MARKER is the
    single place where that completeness lives: any future rule MUST add its anchor there in the
    same diff."
  - "DECLARED AND DELIBERATE COST of the earliest-anchor cut: a command whose credential appears early
    loses the diagnostic tail that follows it -- `TOKEN=x && git push origin main` now logs as
    `<REDACTED>`, where the old cascade kept the `&& git push origin main`. Affordable HERE and nowhere
    else in the repo, because the target field has no programmatic consumer: the hook's own routing
    reads TARGET in memory (lines 91-112) and never reads the log back. Stated precisely, because a
    strict reading of 'no consumer' would be wrong: a repo-wide grep for the log filename returns the
    hook itself (the WRITER), its own test (which reads the last line back to assert redaction, i.e.
    the guard verifying itself), and one design doc that documents the field list without reading it.
    No product code, no cron, no report. If anything ever starts parsing this log, this trade must be
    re-opened before that consumer is written, not after."
  - "ANCHOR RECALL is bounded by the NAME vocabulary and the four prefix shapes, and the earliest-anchor
    cut does NOT improve it -- it only guarantees that once something anchors, nothing behind it
    survives. Every under-match listed above therefore survives the redesign UNCHANGED. This is stated
    explicitly because the architecture change is easy to over-read as a general strengthening: it
    retired ONE class (a value stranded behind a swallowed anchor) and left recall exactly where it was,
    except for the backslash-separator case fixed here on purpose."
  - "A SECOND live invocation path is NOT fixed by merging this PR: .codex/hooks.json hardcodes an
    absolute path to an UNTRACKED copy of the hook, byte-identical to the stale unredacted version, and
    lint_home_fork.py --discover reports 0 undeclared payloads against it. Superscar #1 with the twist
    that the fork is inside the working tree and merely untracked. Ledgered as an OPEN PENDING-ARMS row
    with an owner; kept out of this diff because widening that lint gates other people's PRs and belongs
    in its own blast radius. Until it is done, PROVE-LIVE for this PR must cover BOTH paths by hand."
  - 'OVER-MATCH DAMAGE IS A REAL REGRESSION, and the only one this redesign carries. The TRIGGER is
    unchanged -- the same inputs fire, and the 15 innocence cases still pass untouched -- but what a
    firing COSTS grew from one value to the rest of the line. Measured on lines a diagnostic log
    actually contains: `echo "PASSWORD: must be at least 12 chars"` (policy help text) kept
    `be at least 12 chars` under the cascade and now yields `echo "<REDACTED>`; likewise a status
    message `echo "rotate STRIPE_SECRET_KEY: done"`, an env-var REFERENCE `echo "TOKEN:
    ${SECRET_TOKEN}"` that contains no secret at all, and `sed -i "/^AUTH:/d" config.ini`. Accepted
    knowingly: over-redacting a diagnostic line costs legibility, under-redacting one costs a
    credential, and this field has no programmatic consumer. It is NOT accepted silently -- if the log
    stops being useful in practice, this is the line to revisit, and the answer then is a narrower cut
    (to end-of-token-run) plus a soundness proof for it, not a return to the cascade.'
  - "The NAME vocabulary was deliberately NOT widened in this PR even though the refuter leaked COOKIE=,
    SESSION_ID=, PAT= and SIGNING_CERT= in full. Reason, stated so the omission is not read as an
    oversight: the cut made every anchor MORE expensive to fire, so adding a word now buys a bigger
    over-match than the same word would have bought last week -- `cookie` and `session` in particular
    appear in innocent commands. Widening the vocabulary is its own diff with its own innocence corpus.
    The same holds for separators outside {=,:} (`redis-cli AUTH <v>`, `mysql -p<v>`, `API_KEY -> <v>`),
    all of which leak identically on the pre-change hook."
  - "THE NO-REGRESSION RESULT IS A STATEMENT ABOUT THE GENERATOR, not about the world. 18,480 structured
    plus 7,331 random token-bearing inputs found 0 cases where the old cascade redacted a token and the
    new cut did not -- but the structured product is built from 8 prefixes, 11 names, 10 separators,
    3 quotings and 7 suffixes that a human chose, and the random arm draws from that same fragment
    vocabulary on one seed. A shape absent from the fragment list is absent from the result. This is the
    same caveat the fourth direction earned the hard way: a fuzz score describes the generator exactly as
    a mutation score describes the corpus."
sources:
  - ~/logs/codex-spalla-trigger.jsonl (counted and replayed in-process, never printed)
  - .claude/settings.json (hook registration path)
pii_scan: clean
# ESTIMATE, not a measurement, and labelled so on purpose: 81,222 bytes / 4.0 chars-per-token.
# No offline tokenizer for this model family exists on the fleet, and nothing in the repo reads
# this field (grep in scripts/ and infra/ finds no consumer -- see residual_risks), so it is
# documentation. The previous value, 16067, was left behind by later edits to this pack.
size_tokens: 20305
