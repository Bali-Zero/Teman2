notes:
  - >-
    This PR's central finding reframes the mandate: Zero's 2026-08-27 GO
    order asked to remove a trigger that had already been removed 11-12
    days earlier (#4210, #4218). The most credible root cause, found by
    reading the file this session was told to edit before editing it: both
    files' own `on:` block comments, and a matching PENDING-ARMS.md row,
    still narrated the removal as pending work. This PR ships the honest
    correction (comment fixes + ledger cleanup + a machine-checked
    regression tripwire) rather than a no-op "confirmed, nothing to do" —
    per CLAUDE.md's ship-lifecycle-ownership rule, a session does not park
    a surprising finding, it fixes what is actually still broken.
  - >-
