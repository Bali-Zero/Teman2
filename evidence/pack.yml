pii_scan_note:
  Nothing in this diff, brief or pack transcribes applicant data. The migration touches policy
  metadata (interval, anchor, scope, approval reference) and never a decision payload; the receipts quote
  counts, timestamps, policy version strings and function names only. The one live POST used a synthetic
  persona, and its request body is not reproduced here.
dissent:
  - seat: claude-sonnet-5 (refuter, dispatched without the brief)
    objection:
      '"I cannot confirm ''the Oracle went dark at 2026-08-26 04:40:27Z''." The build lane dated
      the outage from a gap in `visa_decisions`, but that table structurally cannot record a blocked call:
      the gate refuses BEFORE any INSERT, and zero rows carry verdict TEMPORARILY_UNAVAILABLE in any environment,
      ever. Worse, the ledger''s last PRODUCTION row (2026-08-24 09:10:52Z; real traffic stops earlier still,
      02:02:47Z) predates the defect by ~43 hours, and the same window already shows zero-decision spans
      on 16-18, 21-22 and 25 August while the gate was healthy. The silence is not a signal.'
    status: CONFIRMED
    resolution:
      "Accepted in full and the claim withdrawn — from the migration header, the Python docstring,
      the commit history (87b83626d) and the PR description, each corrected in the open rather than quietly
      edited. Two facts are asserted now and no more: the invariant broke at 04:40:27Z, and the gate is
      broken now. How many real visitors that turned away is UNKNOWN and, given the instrumentation, unknowable."
  - seat: claude-sonnet-5 (refuter)
    objection:
      No independent signal exists to corroborate or refute user impact. `api_audit_trail` is live
      and busy (33,877 rows since 04:40:27Z) but holds ZERO rows for `/api/visa-oracle/evaluate`, ever —
      the middleware does not instrument that router. `visa_evaluate_idempotency` is empty. Frontend telemetry
      is gated on NEXT_PUBLIC_ANALYTICS_ENDPOINT, deliberately unset for this surface pending a DPIA blocker.
    status: CONFIRMED
    resolution:
      "Not fixed here, and deliberately not: adding observability to the evaluate path is a separate
      concern and would violate one-PR-one-concern on a P0. Recorded as the finding it is — the front door
      of every visa sale has no server-side failure signal, which is why the owner discovered this by using
      the product. Follow-up lane, not this PR."
  - seat: claude-sonnet-5 (proof lane)
    objection:
      "Not an objection but a defect the lane caused: it proved RED by reverting the scope predicate
      IN PLACE in the shipped `retention.py`. A `git add -A` on the build lane staged that revert while
      the working tree had the fix back."
    status: CONFIRMED
    resolution:
      "Caught before the commit by counting the missing line, not by any git warning — the index
      was inspected and the revert unstaged. Rule imposed on the lane for the rest of the run: no RED proof
      may touch a tracked file; read the old version with `git show origin/main:<path>` instead, which yields
      the same proof with none of the risk. The build lane's own red-on-main proof was already done that
      way."
  - seat: session (self-review while building the tripwire)
    objection:
      The tripwire's first implementation split each migration on the literal string `-- === ROLLBACK
      ===`, which cuts at the HEADER PROSE that names the marker rather than at the marker itself — so it
      read a comment block as the entire forward half and would have passed for the wrong reason.
    status: CONFIRMED
    resolution:
      'Replaced with the runner''s own `split_migration_sql`, whose regex is line-anchored (`^\s*--\s*===\s*ROLLBACK\s*===\s*$`),
      so the probe and the migration runner can never disagree about where a migration ends. A second trap
      found the same way: `ALTER FUNCTION public.f()` names a signature without redefining it (268 does
      exactly that), so the supersession check matches CREATE only.'
  - seat: claude-sonnet-5 (independent frontend lane)
    objection:
      'The owner''s reported screen ("No evaluation was submitted") is NOT caused by this defect.
      It is `NON_ENGINE_MODE`: production runs SHADOW, `resolve_response_mode()` returns "CURATED", and
      the frontend''s `requireEngineResponse()` throws unless mode is "ENGINE" — a designed rendering boundary
      that predates this outage by a month.'
    status: CONFIRMED
    resolution:
      Verified independently by the build lane at evaluate_path.py:243, runtime-mode.ts, engine-response.ts:499
      and outcome-fallbacks.ts:39. It reframes this PR's value — it restores the shadow-evidence ledger
      the go-live gate accumulates, NOT the client experience, which is withheld by design in SHADOW. The
      brief and PR description say so explicitly rather than letting the fix read as a restoration of service.
  - seat: claude-sonnet-5 (adversarial grader, dispatched on the finished diff)
    objection:
      '289''s ROLLBACK section claimed to restore 264''s bodies "verbatim" and did not: the decision
      binder''s rollback body was missing three plpgsql comment lines present in both 264 and 289''s own
      forward half. Behaviourally identical, but a rolled-back database would have held a THIRD textual
      variant of the function that never existed anywhere -- and the migration''s own claim of verbatim
      restoration was false.'
    status: CONFIRMED
    resolution:
      "Comments restored, and the claim replaced with a checked one: the rollback bodies now differ
      from 264's by exactly the `SECURITY DEFINER` attribute (268's addition, which MUST be restated or
      CREATE OR REPLACE demotes both functions to SECURITY INVOKER) and by nothing else -- verified line-by-line
      against `git show <base>:...264...sql`, not by eye."
  - seat: claude-sonnet-5 (adversarial grader)
    objection:
      The structural tripwire censused an ALLOWLIST of three directories (`services/`, `scripts/`,
      `db/migrations_v2/`) and never descended into `backend/app/` -- 287 shipped Python files including
      163 routers. A planted unscoped resolver under `app/routers/` or `app/services/` was invisible to
      it. Latent today (nothing under `app/` touches the table), but a retention- status endpoint is a plausible
      place for the next reader, and it would sail through.
    status: CONFIRMED
    resolution:
      "The allowlist WAS the same defect one level up -- a guard that silently stops covering
      whatever is added next. Replaced with a walk of the whole backend tree minus test/vendor paths, so
      a new directory cannot fall outside it by omission. Proven rather than asserted: an unscoped reader
      planted at `backend/app/routers/` is now reported by name (`{'app/routers/_tmp_planted_unscoped_reader.py':
      [(6, 'AND effective_period @> ...')]}`), and removing it returns the census to green."
  - seat: session (declared limit, unresolved)
    objection:
      This pack asserts that the outage stops the go-live gate's evidence accumulating, but the
      build lane did not measure `shadow_evidence.py`'s gate consuming those rows — the causal chain from
      "no new visa_decisions row" to "G-a-vol gate stalls" is read from structure, not from a probe.
    status: PLAUSIBLE
    resolution:
      Left standing and labelled, rather than quietly upgraded. It does not affect the fix, only
      the framing of its urgency. Settling it is a one-query follow-up against the shadow evidence gate's
      own inputs.
  - seat: session (self-refutation mid-build, RESOLVED by redesign)
    objection:
      "The first draft of 289 assumed the migration runner could replace two functions owned by
      `visa_ledger_owner`. It cannot: migrations connect with `settings.database_url` (migration_manager.py:96)
      with no `SET ROLE`, i.e. as the runtime role. The migration would have failed inside Fly's `release_command`,
      aborting the whole deploy — a strictly larger blast radius than the outage it repairs. CI cannot see
      this class at all: fly-deploy.yml validates against an ephemeral Postgres where the connecting role
      owns everything it created."
    status: CONFIRMED
    resolution:
      "Redesigned in 68b8d8a81: each replacement sits in a `DO $guardN$` catalog guard that declines
      instead of raising. Because a declined migration is still recorded APPLIED and never retried (scar
      #2), the no-op is made loud OUTSIDE the migration by operational_preflight's `binder:retention-policy-scoped`
      check, which reads the live body from pg_proc and cannot be satisfied by merging the PR — only by
      289 having actually run."
  - seat: session (declared limit, unresolved)
    objection:
      Migrations 281/284-287 are recorded applied in production although the runtime role could
      not have executed 281's bare `ALTER TABLE` on a `visa_ledger_owner`-owned table. The out-of-band superuser
      apply that must have followed the 2026-08-26 deploy abort is INFERRED from the ownership evidence
      (286's `OWNER TO visa_ledger_owner` succeeded, and only superusers are members) — no log or ledger
      entry recording it was found. `_schema_versions.applied_by` stores the literal 'system' for every
      row and discriminates nothing.
    status: PLAUSIBLE
    resolution:
      "Left standing and labelled. It does not change this PR: 289 is now correct whether the
      applying role can or cannot own the binders. It does mean nobody should assume a future ledger-owned
      migration will be applied by hand — the preflight check is what will say so."
