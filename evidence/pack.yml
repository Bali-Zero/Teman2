    repro: "migration_manager.py:249-263 — the rollback transaction's only cleanup statement is DELETE FROM _schema_versions WHERE migration_name = $1; nothing touches schema_migrations."
    resolution: "Not fixed here — patching the runner while 277/278 are mid-flight through it risks breaking both to fix neither. 277/278 each carry a local, per-migration workaround in their own ROLLBACK sections (an explicit DELETE FROM schema_migrations). Runner-level fix tracked in .claude/skills/modus/PENDING-ARMS.md, opened 2026-08-21."
  - seat: kimi-k3
    objection: "Round 3, the most serious finding across all four rounds: round 1's rollback fix (the schema_migrations DELETE added to close the finding above) was dead code. Both migrations' forward SQL carried a self-INSERT into _schema_versions, copied from three historical migrations (165/166/184) under the belief it was harmless defensive redundancy protected by ON CONFLICT DO NOTHING. It was not — BaseMigration.apply() runs the forward SQL first, then calls _log_migration(), which inserts into BOTH schema_migrations and _schema_versions carrying the real rollback_sql; by then the self-INSERT had already claimed the _schema_versions row for that migration_name, so _log_migration()'s own insert silently no-opped on conflict. _schema_versions.rollback_sql stayed NULL forever, and MigrationManager.rollback_migration() reads rollback_sql ONLY from _schema_versions — so round 1's fix, though correct as text, would never have been reached: the runner would log 'No rollback SQL' and do nothing before ever executing it."
    status: CONFIRMED
    repro: "migration_base.py:405-421 (self-INSERT + _log_migration's own INSERT, both ON CONFLICT DO NOTHING on migration_name), :534 (forward SQL runs first), :547 (_log_migration runs after) — independently re-verified against the real code by both team-lead and sonnet-5 before the fix was written, not trusted from the refuter's summary alone. Team-lead independently re-checked that only 165/166/184 (of 159 total migration files) share the self-INSERT pattern, rather than trusting the count as asserted."
    resolution: "Removed the self-INSERT entirely from both 277 and 278 — _log_migration() alone is sufficient, exactly as it is for the other 156 migrations that don't self-insert. 165/166/184 untouched (already applied in production, touching them risks their stored checksum)."
  - seat: kimi-k3
