brief_ref: evidence/brief.yml
plan_ref: "the harness gate's own recovery procedure deadlocks the PR it is meant to unblock (measured on #4543)"
diff:
  behaviour_change: none
  net_lines: "CODE +29/-3 (harness-floor.yml, comment block only); WHOLE DIFF +117/-246 including the two evidence files, whose large deletion count is the previous task's pack being replaced. Measured at merge-base 5b4354892 with git diff <merge-base> --numstat, never two-dot against a moving origin/main (W102), and written LAST as a 1-for-1 swap so the value describes the tree containing it."
receipts:
  - claim: "The two runs on #4543's head SHA live in DIFFERENT check suites; the PR's rollup kept the failing one"
    cmd: 'gh api repos/Bali-Zero/Teman2/commits/33f12fb4a.../check-runs?filter=all --jq ''select(.name=="Harness floor recompute")|.completed_at,.conclusion,.check_suite.id'' -> 14:01:20Z success suite 88072653107 / 13:51:47Z failure suite 88070314010'
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: session (m5)
  - claim: "The default filter hides the contradiction: check-runs returns ONLY the green run unless filter=all is passed"
    cmd: "same endpoint without filter=all -> one row, success"
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: session (m5)
  - claim: "gh run rerun on the ORIGINAL pull_request run cleared the rollup; mergeStateStatus BLOCKED -> CLEAN"
    cmd: "gh run rerun 32489011695; gh pr view 4543 --json mergeStateStatus -> CLEAN"
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: session (m5)
  - claim: "The documented flow was actually followed first, and did not work — this is not a hypothetical"
    cmd: "gh workflow run harness-floor.yml --ref agent/air-m5/ops/gate-header-truth -> run 32489857553 workflow_dispatch success on 33f12fb4a, PR still BLOCKED"
    exit: 0
