dissent:
  - seat: "github-actions (organ-conformance, first armed run)"
    objection: "The corpus this PR calls a strength is machine-dependent: test_innocence_unrelated_organ_named_like_arsenal_probe_prefix_still_flags omitted host=, inherited socket.gethostname(), and asserted the anchored-regex behaviour ONLY on M5 — on Pro, Mini and every runner its m5.-prefixed fixture is skipped as foreign-jurisdiction before the regex is consulted, so `len(findings) == 1` failed against an empty list. Green on exactly one machine in the fleet since 2026-08-07."
    status: CONFIRMED
    resolution: "Reproduced locally under four hostnames (green on air-m5, red on nuzantara, mini-pro2, fv-az1234-567). Pinned host='air-m5', matching what its own sibling test already does. Re-verified green under all four; removing the pin goes red again. The other 10 host-less calls are named in the brief's risks and deliberately left — pinning them is not mechanical."
  - seat: "self-mutation round 1 (M7)"
    objection: 'Reverting the report''s grouping predicate to `kind != "unhealthy"` left all tests passing, so the corpus did not actually pin the grouping. That mutation makes a `warning` organ render ALSO under ''not breathing'' as `stale -1.0d` — a breathing organ described as mute, carrying an invented negative age.'
    status: CONFIRMED
    resolution: "Test strengthened from two membership asserts to also assert the organ appears ONCE, that 'not breathing' is absent from the report, and that neither the mute glyph nor the -1.0d age appears. Mutant then killed."
  - seat: "independent grounding subagent (fresh context, origin/main only)"
    objection: "Framing the lane around DEFAULT_STALE_DAYS is wrong twice over: --stale-days is declared but passed by no live caller, and the per-organ cadence this PR calls missing is already declared for 169 organs in organs_registry.yaml — a registry the detector never opens. The audit of 2026-07-19 recorded it as a known unimplemented gap, not a discovery."
    status: CONFIRMED
    resolution: "Re-measured independently rather than taken on trust (169 organs; zero registry references in the detector; the 900s vs 604800s factor of 672). The threshold is deliberately NOT touched here — wiring a cadence source is a behaviour change for 169 organs and gets its own lane. Both facts are recorded in the PR body so the 'seen and left alone' ledger is complete."
  - seat: "session (m5), self-refutation of its own first report to the operator"
    objection: "I told the operator the detector might not act on the status field at all, and that the 7-day threshold was the hole. Both were wrong: scan_sidecars_status produces real unhealthy findings, and the freshness axis fires on 1 sidecar out of 183 fleet-wide — it is nearly dead, not the live gap."
    status: RETRACTED
    resolution: "Corrected to the operator in the same session, before any code was written, and the lane was re-aimed at the two defects the measurement actually supports."
