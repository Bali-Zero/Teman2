dissent:
  - seat: >-
      claude-opus-5 (independent review lane, different Claude session from the original builder,
      commit cf34c8ad7, 2026-08-23T17:13:02+08:00 -- verified via `git show cf34c8ad7`, not
      transcribed from an unread claim)
    objection: >-
      Adversarially reviewed the original build (commit 126f7a000, authored by a separate
      claude-sonnet-5 session per its Co-Authored-By trailer -- generator != grader) and confirmed
      4 real defects: (1) Quality.checks entries were bare mutable dicts inside a frozen tuple, so
      a MediaManifest's object_hash could go stale after a post-validation mutation the outer
      frozen=True never blocked -- fixed by making each checks[] entry its own FrozenCoreModel;
      (2) content_object.schema.json didn't enforce the revision<->supersedes conditional the
      Python model already enforced -- fixed via a json_schema_extra allOf/if-then pair, verified
      extra=forbid/frozen=True survive the ConfigDict merge; (3) the happy-path media_manifest
      fixture silently exercised an undocumented classification-lowering escape -- fixed by
      raising it to an ordinary specimen and adding a dedicated labeled fixture for the escape
      case; (4) two test-shape gaps (an assertion against the fixture dict instead of
      model_fields; missing invalid-fixture coverage for AudioMetadata/IdentityMetadata internals)
      -- both closed with new tests/fixtures. Also EXPLICITLY reported, not fixed, out of that
      review's stated scope: ExtensionValue.payload's extension-jail top-level-only coverage,
      _UTC_OFFSET_PATTERN's missing regex anchor, cli.py's _hash() field-ordering, and
      cli.py::_check_fixtures() reporting checked:0 (not an error) on an empty tree -- carried
      forward here as residual risk, not silently dropped.
    status: CONFIRMED
  - seat: "session (this lane, evidence-only revision, 2026-08-23)"
    objection: >-
      Checked whether declaring 2 Anthropic build lanes (the original builder, claude-sonnet-5,
      plus the reviewer-who-also-fixed, claude-opus-5) would be the honest lanes: shape -- and
      concluded it is not: cf34c8ad7's role in this PR's lifecycle was adversarial review that
      then applied its own confirmed fix, which is the intended generator!=grader pattern
      (CLAUDE.md ship-lifecycle rule), not a second independent build lane. Declared 1 build + 1
      review below. Flagging this judgment call rather than asserting it silently, since a
      different reasonable reader could classify cf34c8ad7 as build; either way there is
      truthfully only 1 build lane, so the D3 seat-diversity floor (which needs >=2 build lanes to
      even apply) does not engage regardless of which classification is right.
    status: PLAUSIBLE
