    seat: session (m5)
  - claim: "Guilt+innocence suite passes against the fixed hook: 11 guilt, 9 innocence, 1 mode (widened from 3 guilt/1 innocence/1 mode -- the gate's central finding was 10 guilt against only 1 innocence, so 8 innocence forms + 1 Bearer guilt form were added)"
    cmd: "bash scripts/tests/test_codex_spalla_trigger_redaction.sh"
