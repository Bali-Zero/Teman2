  - seat: kimi-k3
    objection: "Round 2 (out of scope for this PR, ledgered): MigrationManager.rollback_migration() clears _schema_versions on rollback but never schema_migrations — the table _is_applied() actually reads. Not specific to 277/278: affects all 159 migrations in this repo with a rollback path."
