dissent:
  - seat: "kimi-code/k3 (Moonshot, cross-family, fresh context — the diff's author was tp1-deepseek-v4-pro, so generator != grader holds)"
    objection: "Attacked false-green and leak paths. CONFIRMED and fixed: K1 (remote self-failure exits 0 -> healer silent), K3 (lookback drops corpses exactly when the healer was itself down; and a declared span may exceed the window), K4 (declared_long both misses real Italian/English phrasings and still fires on narrative), K5 (ssh stderr unbounded in a field that reaches Telegram). PARTIALLY ACCEPTED: K2 — 'UNMAPPED is treated as dead-eligible, so a live session idle at a prompt gets accused'. The refuter's proposed cure (require NO-PROCESS) was REJECTED on measurement: the one Pro true-positive was itself UNMAPPED, so that fix would have destroyed detection. It is moot in the shipped state anyway, since the verdict no longer alarms. NOT ACCEPTED but recorded: a zombie subagent outliving its parent would mark a dead parent ALIVE — real, low-frequency, and unfixable from process data alone."
    status: CONFIRMED
residual_risks:
  - "THE HEADLINE VERDICT IS UNCALIBRATED AND SHIPS THAT WAY, DECLARED. DECLARED-SPAN-UNMET matched 10 of 10 healthy healer ticks on the live fleet. It is reported, never alarmed on, and the healer reads only UNREACHABLE/BLIND. The mandate asked for this detector as the deliverable's centre; it is delivered as an INFORMATIONAL field instead, because shipping it as an alarm would wire an organ to a signal that is wrong every time it fires. This is the one place the delivered scope is narrower than the scope requested, and it is narrowed deliberately and visibly, not quietly."
  - "The real fix is a design change, not a regex: the runner should write its own expected duration into a sidecar the way it already writes a heartbeat. Text cannot distinguish 'this document declares its runtime' from 'this document's title names a cron cadence' — three narrowings each traded one error direction for the other, which is the repo's three-rounds signal that the surface is under-specified."
  - "HOME-fork (superscar #1) is OPEN until post-merge sync: the wrapper reads $HOME/scripts/HEALER-MANDATE.md FIRST, and that copy has 0 occurrences of fleet_sessions.py while the repo copy has 2. Proven this session — the stubbed tick's prompt did NOT carry the new mandate step. Both files are DECLARED pairs in infra/home-fork/declared-pairs.json, and the healer cannot sync them itself (its own files are outside its perimeter, by constitution). ALIGN-FLEET action, tracked."
  - "The identity slice is PII-BOUNDED, not PII-free: the first 90 characters of a first message ARE emitted, by design, and a test pins the cap. Nothing past it ever leaves the host."
  - "alive detection on Pro rests on UNMAPPED for most rows: many sessions share one project dir, so a cwd match cannot attribute a process to a session id. The tool says UNMAPPED rather than guessing — honest, but it means Pro liveness is weaker than Mini's."
