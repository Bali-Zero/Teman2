brief_ref: evidence/brief.yml
plan_ref:
  "PR #5059 (agent/nuzantara/db/visa-retention-scope-p0) — P0 retention-scope repair, 2026-08-26.
  Governing mandate: docs/plans/2026-08-24-visa-oracle-live/MANDATE.md."
lanes:
  - lane: visa-retention-scope-p0
    role: build
    seat:
      claude-opus-5 (conducting session — diagnosed the defect, censused the family, authored migration
      289, the two Python predicates, the tripwire and this pack)
  - lane: visa-retention-scope-refute
    role: review
    seat:
      claude-sonnet-5 (adversarial subagent, dispatched WITHOUT this brief and told to attack the diagnosis
      rather than confirm it — it killed the timeline claim, see dissent[0])
  - lane: visa-retention-scope-proof
    role: review
    seat:
      claude-sonnet-5 (second subagent, red/green proof on a throwaway Postgres; also the source of
      dissent[2], a near-miss it caused)
seat_diversity: not_applicable
seat_diversity_note:
  "All three lanes are Anthropic seats. Declared rather than left to read as satisfied:
  every load-bearing question here is settled by a query against the live catalog or by a linter's exit
  code, not by an opinion — the arbiter is the probe, and cross-family breadth adds nothing a second seat's
  judgement could contribute."
diff:
  net_lines:
    4 files, +538/-2 measured by `git diff --stat origin/main...HEAD`. One new .sql migration,
    two one-line predicate changes plus docstring corrections in Python, one new test file. Zero frontend,
    zero workflow.
  behaviour_change:
    Two SECURITY DEFINER trigger functions are redefined with one added predicate each
    (`AND policy_scope = 'VISA_DECISION'`); no table is created, altered or dropped, and no row is read,
    written or deleted at apply time. Two Python readers gain the same predicate. The observable change
    is that the retention gate stops counting other data classes' policies as if they were its own.
