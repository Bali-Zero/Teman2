  - seat: kimi-k3
    objection: "Round 2: the fix directly above (the log-vs-effect guard) was itself a defect — it asserted the arbitrary literal assigned_to='ari.firda@balizero.com' instead of the true orphan-predicate invariant. That would permanently false-block 278 under three legitimate scenarios: client 11500 reassigned to a different active operator after 277 runs, the client merged/deleted, or ari.firda@'s roster email changing — all three leave the true invariant satisfied but would trip the literal check forever, fixable only by hand-editing a shipped migration file."
