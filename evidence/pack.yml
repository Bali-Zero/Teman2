  - "scripts/tests/test_no_push_main_trigger_on_heavy_suites.py::test_security_yml_push_trigger_excludes_main — PASS on current state, FAIL (correctly) on a mocked push:main-restored security.yml, and on a mocked weekly-only schedule missing the daily backstop cron."
  - "scripts/tests/test_organism_digest_pending_arms.py, test_pending_arms_ref.py, test_pending_arms_report.py — 115 passed, confirming the two PENDING-ARMS row deletions did not break ledger tooling."
