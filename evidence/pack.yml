    cmd: "git show origin/main:<wf> | grep -v '^\\s*#' > a; grep -v '^\\s*#' <wf> > b; diff -q a b"
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: session (m5)
  - claim: "actionlint passes on the rewritten workflow"
    cmd: "actionlint .github/workflows/harness-floor.yml"
    exit: 0
    ts: "2026-08-21T16:26:04Z"
    seat: session (m5)
dissent:
  - seat: session (m5), against its own earlier fix in #4543
    objection: "In #4543 I 'fixed' a wrong net_lines by writing a precise value measured at the PREVIOUS SHA — the same disease at higher confidence, in the one field a gate had already conditioned. The gate returned REWORK-BUILD for it. This pack therefore measures net_lines LAST, at the merge base, after every other edit, and writes it as a 1-for-1 line swap so the value describes the tree that contains it."
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, on #4543)
    objection: "CI cannot catch a wrong net_lines: evidence_pack_lint prefers a MEASURED --net-lines/--numstat-file over the pack field because the field is untrustworthy, but a STRING field yields None and the rule never fires. Green lint is not evidence for this field."
    status: CONFIRMED
  - seat: session (m5), scoping the change rather than widening it
    objection: "Rewriting the corollary could be read as repealing W111. It is not, and a note that merely dropped the prohibition would be a regression: a merge_group rerun replays a ref whose base moved. The rewrite scopes the ban to merge_group explicitly instead of leaving it implied."
    status: CONFIRMED
residual_risks:
  - "The quoted suite ids are one incident's measurement, not constants. The note frames them as the #4543 evidence, not as values to expect."
  - "This diff does not change the job, so it cannot itself prove the new procedure works; the proof is #4543's own history, already on main."
  - "The modus PENDING-ARMS row opened for this defect is NOT closed by this diff — that file carries a merge=union driver and is deliberately kept out of a hot-zone PR. It gets its own follow-up."
