tests:
  - "scripts/tests/test_codex_spalla_trigger_redaction.sh — 21 named cases, 11 guilt / 9 innocence / 1 mode, run against the REAL hook with a temp HOME."
static:
  - "actionlint exit 0 on guard-conformance.yml"
  - "shellcheck clean on both the hook and the test"
  - "check_guard_conformance.py -> 0 violations"
runtime_proof:
  - "The hook is the runtime: the suite invokes the real file, not a copy or a mock, and asserts on the actual log it writes."
dissent:
  - seat: implementer subagent (sonnet, fresh context)
    objection: "The conformance checker's initial PASS was FALSE — is_armed() matched the substring 'scripts/tests/' present in 31 other workflow files, so the registration passed without any workflow actually executing the new .sh test. scripts-tests-sweep.yml collects only test_*.py via pytest and is continue-on-error anyway. This is W81 theater: armed on paper, executed by nothing."
    status: CONFIRMED
  - seat: session (m5), on its own measurement
    objection: "I first recorded the mutated suite as exiting 0, i.e. a test that fails loudly but reports success. False: I had captured tail's exit code through a pipe (W97). Re-measured without the pipe: rc=1. Nearly logged a fabricated defect against the implementer's work."
    status: RETRACTED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: "The redactor closed a SUFFIX off-by-one and opened a PREFIX one of the same family: the variable-name branch required >=1 char before the keyword, so `CLAUDE_CODE_OAUTH_TOKEN_1=` matched while a bare `TOKEN=`/`KEY=`/`SECRET=`/`PASSWORD=` did not. Lowercase names, `--flag=` and header `Name: value` forms also leaked. Driven live through the real hook, 6 leaking cases."
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: 'The prose claimed "11 real sk-ant-oat values, 108 chars each" in four artifacts, and the residual-risk and rotation decision hang on it. Reconstructed by run length: only ONE run is 108 chars; the histogram is 8x10/5x13/1x46/1x87/1x108, so most matching lines carry the bare literal and no secret. A LINE count was restated as a VALUE count and the maximum as "each" — in the very brief that claims run-length discipline as its method.'
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: "Redact-before-truncate is not strictly protective, as the comment implied. Redaction SHORTENS the string and pulls previously-truncated bytes into the 200-char window — proven on a 277-char command with a secret at char 253 that truncate-only had cut off."
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: "check_guard_conformance's is_armed() is substring-based and cannot detect deletion of the run: step that executes this test — verified by simulating the removal, which still reported armed. The executor is genuine today; its removal would not be caught."
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: 'The corrected magnitude claim ("3 runs carry secret material, 2 of whole-token length") was itself imprecise: "whole-token length" was inferred from raw run LENGTH (87 and 46 chars), not from where the run ends. Reconstructed by END POSITION inside the 200-char logged field: the 108-char run ends at char 151, well short of the field''s end -- a complete token. The 87-char and 46-char runs both end EXACTLY at char 200, the field''s hard cap -- that is what a token gets cut off by truncation looks like, not evidence of two more full-length secrets. True statement: 1 whole token + 2 truncation-clipped partials.'
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: "The suite shipped with 10 guilt cases and only 1 innocence case for a matcher that had just been WIDENED from a bounded-substring form to a segment-anchored-but-still-substring form. Guilt coverage without a matching innocence corpus does not demonstrate the widening is safe (cicatrix #3, guard-over-match)."
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: "The comment's closing line credited an optional leading `(?:--?)?` with helping 'close the class' of coverage. Measured false: a leading dash is neither alnum nor `.`, so the negative lookbehind already permits the match to start immediately after it with or without that group. Removing `(?:--?)?` produced byte-identical redacted output across 22 cases including `--token=`/`-key=` flag forms -- it is not a coverage lever, and (contrary to the implementer's own guess) not even a readability lever, since the dashes survive untouched in the output either way."
    status: CONFIRMED
residual_risks:
  - "Redaction only closes the shapes it can name. A secret passed POSITIONALLY with no variable
    name (`mytool deploy s3cr3t`) is caught only if it carries a known prefix; the value branch
    cannot see it. Stated in the hook's own comment rather than left as an implied closed class."
  - "Redact-before-truncate widens the truncation window by shortening the string, so a secret that
    used to fall outside the 200 chars can be pulled in. Smaller exposure, not zero."
  - "The already-leaked material remains valid: 1 whole-token-length run (108 chars, ends at char 151) plus 2 truncation-clipped partials (87 and 46 chars, both ending exactly at the 200-char boundary). The first draft of this pack said 11 tokens -- a LINE count read as a VALUE count; a later draft said 2 whole tokens -- an end-of-truncation-window artifact read as two more complete secrets. Both caught by the Gear-3 gate; the rotation decision hangs on this number, so it is corrected rather than quietly dropped."
  - "OVER-MATCH (cicatrix #3, the guard-over-match twin of the positional-secret blind spot above): the segment-anchored keyword match has no notion of 'is this actually a secret' -- a legitimately-named non-secret value using a `_KEY=`/`_TOKEN=`-suffixed identifier (an internal cache-partition name, a feature-flag name, ...) redacts just as hard as a real credential would. The guilt/innocence corpus proves the specific forms it enumerates stay innocent; it is not a proof that no such legitimately-named value anywhere can still trip the match. Between over-redacting a non-secret and under-redacting a real one, the hook accepts the former."
  - "hook-innocence-gate.yml's path filter still does not cover .claude/hooks/ — the hooks that actually run from the repo's own hook dir are outside the gate that exists to prove hooks bite only the guilty. Deliberately not widened here."
  - "An identical UNTRACKED .codex/hooks/ copy exists in the main checkout; git does not track it, so this diff cannot fix it."
