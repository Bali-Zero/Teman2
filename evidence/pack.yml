dissent:
  - seat: "Harness floor recompute (CI, deterministic)"
    objection: >-
      PR #4701 touches `.github/workflows/wr3-spend-gate-tests.yml`, which is hot-zone by path —
      floors at Gear 3 regardless of the diff's small size (2 files, +73/-3) or the fact that the
      runtime logic it tests is unmodified — and the PR shipped with no `evidence/brief.yml` or
      `evidence/pack.yml` in its own diff, so the check correctly FAILED with "hot-zone diff with
      no evidence/brief.yml — a Gear-3-floor diff requires a brief+pack".
    status: CONFIRMED
    note: >-
      Verified independently, not accepted on the FAIL message alone: recomputed the floor from
      the PR's actual changed-file list via `evidence_pack_lint.py --print-floor` and got 3,
      matching the check. Answered here by supplying both files, never by editing the check
      (per this repo's Rule 3 precedent — CLAUDE.md §Agent PR Contract item 3 / the sibling
      PR #4649's own notes field describes the identical shape of correctly-rejected-then-
      complied-with).
  - seat: "session (this evidence-authoring task), against its own first instinct"
    objection: >-
      The mandate offered the PR body's own self-reported mutation-test result (comment out
      assert_spend_authorized, both tests go red, restore) as sufficient grounding. Quoting it
      verbatim without re-running it would have been citing a tool output this turn never
      actually executed — exactly the anti-hallucination failure mode CLAUDE.md §6 exists to
      prevent, applied to a prior session's claim rather than to memory.
    status: RETRACTED
    note: >-
      Re-ran the mutation probe independently in this task's own turn (see the mutation-test
      receipt above) rather than trusting the PR body's report. Result matched: both tests went
      red with the identical `AssertionError: network path reached`, file restored clean.
      Retracted because the concern was real but the independent re-run resolved it — the
      PR body's claim held up under a fresh execution, it was not merely repeated.
