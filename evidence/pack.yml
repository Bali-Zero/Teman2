    exit: 0
    ts: "2026-08-23T13:58Z"
    seat: "session (pro, build lane)"
  - claim: "expected_hb_seconds is 1350 rather than the generator's naive copy of the 900s interval, for a measured reason"
    cmd: "read scripts/sentinel-aggregate.py:19-21 and scripts/organ_birth.py:286"
    result: >-
      sentinel-aggregate classifies stale at age > expected_hb_seconds and
