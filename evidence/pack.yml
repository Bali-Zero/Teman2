tests:
  - "scripts/ci/test_shard_tests.py — 28 cases, run on the frozen committed bytes. GUILT (each is a way a sharded suite can silently under-run and look green): a dropped module, a module running twice, a module outside the corpus, a shard that never ran, a shard running someone else's files, a stray chunk index, and the worst case of all — every shard publishing an empty list. INNOCENCE: a sound partition, a corpus smaller than the shard count (scoped PR lane, shard 3 legitimately empty), determinism across calls, the e2e exclusion, and the fail-open target resolution (narrowing requires BOTH the flag and a non-empty selection; 'banana' as IMPACT_RUN_ALL yields the full corpus)."
  - "The union/security mode has its OWN guilt+innocence split, because it is the pass a malicious diff has to defeat: it must keep catching a dropped module, an overlap, an empty partition and a missing shard, while accepting a different assignment algorithm and a PR that adds test modules — and the full/drift mode must still reject both of those, which is what makes the two passes distinct rather than redundant."
