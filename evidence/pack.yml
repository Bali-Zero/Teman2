    cmd: "apps/backend-rag/.venv/bin/python -m pytest scripts/tests/test_queue_unstick.py -q"
    result: "20 passed in 0.05s"
    exit: 0
    ts: "2026-08-23T11:05Z"
    seat: "session (mini, conductor)"
  - claim: "LIVE dry-run against the real open PRs classifies correctly and mutates nothing"
    cmd: "python3 scripts/queue_unstick.py --dry-run"
    result: >-
      examined=15 updated=0 dirty_signalled=1 skipped=14
      skip_reasons={"draft": 6, "queued": 2, "recent_commit": 2,
      "status_BLOCKED": 1, "status_UNKNOWN": 3}. TWO QUEUED PRs were present
      and both were skipped — that is the destructive case (updating a queued
      PR evicts it) exercised against live state, not a fixture.
    exit: 0
    ts: "2026-08-23T11:05Z"
    seat: "session (mini, conductor)"
  - claim: "The conflicting-file prober WORKS on a real DIRTY PR and names the real file — the one path --dry-run never reaches, so the gate exercised it directly"
    cmd: 'python3 -c ''import queue_unstick as q; q.get_conflicting_files({"number":4653,"base_ref":"main"})'''
    result: >-
      "evidence/pack.yml" — the real conflicting path on a real open PR. Note
      what this independently confirms: PR #4653 is stuck on exactly the
      fixed-root-path evidence collision that S12/C6 exists to remove, found
      here by a completely different code path (a local merge simulation)
      than the one that diagnosed it (a git merge on another lane's branch).
    exit: 0
    ts: "2026-08-23T11:08Z"
    seat: "session (mini, conductor)"
  - claim: "The prober leaves NO refs behind — it fetches into PID-namespaced scratch refs and deletes them in a finally block"
    cmd: "git -C ~/nuzantara for-each-ref 'refs/queue-unstick/' | wc -l   (before and after the call above)"
    result: "0 before, 0 after"
    exit: 0
    ts: "2026-08-23T11:08Z"
    seat: "session (mini, conductor)"
  - claim: "The merge-queue membership field was VERIFIED live, not assumed — `gh pr view --json isInMergeQueue` does not exist"
    cmd: "gh pr view <N> --json isInMergeQueue  ->  error; then gh api graphql ... pullRequest{mergeQueueEntry{state position}}"
    result: >-
      'Unknown JSON field: \"isInMergeQueue\"' from the REST-ish view; the
      GraphQL `mergeQueueEntry` field exists and returns null for a
      non-queued PR. The script uses GraphQL.
    exit: 0
    ts: "2026-08-23T10:55Z"
    seat: "s12-c3 implementer, re-read by the gate in the script docstring"
  - claim: "The exclusion order is correct BY CONSTRUCTION: every exclusion precedes every action, in a pure function"
    cmd: "read scripts/queue_unstick.py::classify (lines 230-247)"
    result: >-
      draft -> queued -> hold_label -> recent_commit, all returning skip,
      and only then BEHIND/DIRTY dispatch. plan_actions() is pure over
      already-fetched dicts, which is what makes the 20 tests able to
      exercise the destructive case without a network.
    exit: 0
    ts: "2026-08-23T11:03Z"
    seat: "session (mini, conductor)"
pii_scan: clean
dissent:
  - seat: "S12 conductor (gate) against the implementer's first draft"
    objection: >-
      The mandate required the DIRTY signal to NAME the conflicting files,
      and `--dry-run` prints "conflicting files not computed in dry-run" —
      which could equally mean the capability was never built. The claim was
      therefore unverified by the dry-run that appeared to demonstrate it.
    status: CONFIRMED
    note: >-
      Resolved by exercising `get_conflicting_files()` directly against real
      PR #4653 rather than accepting either reading (receipt above). It is
      built and it works. Recorded because "the demo did not cover the clause
      the demo appeared to cover" is a shape that passes review by default.
  - seat: "S12 conductor, carrying a correction it had itself sent to the implementer"
    objection: >-
      An earlier instruction from the conductor told the implementer that
      `mergeQueueEntry` is THE discriminator for "is this PR armed". That is
      wrong at the edge, per cicatrix W111: neither `autoMergeRequest` nor
      `isInMergeQueue` alone answers "armed" — armed-but-not-yet-queued and
      queued-with-the-request-consumed are both real states.
    status: CONFIRMED
    note: >-
      The correction was sent mid-build and the script's docstring records
      the distinction: `mergeQueueEntry` alone IS the right question for
      "will an update evict this PR", which is the only question this script
      asks. It never asks "is this armed", so the W111 trap is out of its
      scope by construction rather than by care.
  - seat: "S12 conductor (gate), on a gap deliberately left open"
    objection: >-
      A PR deliberately disarmed WITHOUT a hold label gets re-armed by this
      organ's own update-branch push, because auto-merge-whitelist.yml runs
      on `synchronize` with `draft == false` as its only gate (W123).
    status: CONFIRMED
    note: >-
      Left open ON PURPOSE and named in the brief's risks. There is no
      reliable signal distinguishing "disarmed on purpose" from "never
      armed", and inventing a heuristic for it would be a guard built on a
      guess — the #3 scar family in one move. The durable hold is draft,
      which this script already excludes.
tests:
  - "scripts/tests/test_queue_unstick.py — 20 tests, pure functions over fixtures, no network. Guilt: queued PR not selected; 2-minute-old commit not selected; hold-labelled not selected; draft not selected; DIRTY never update-branch; a second run on the same DIRTY PR+SHA emits zero additional signals; the 6th BEHIND PR in a tick is not updated. Innocence: a BEHIND, non-draft, unlabelled, 30-minute-old PR IS selected."
static:
  - "bash -n scripts/queue_unstick_cron.sh -> clean"
  - "pre-commit hooks pass (lease-check, anti-reward-hacking, secret scan, python lint)"
notes:
  - >-
    The cron is written but NOT installed by this PR. Installation is a
    separate, deliberate arming step so the organ is observed on real state
    before it is allowed to act unattended — and until it is installed this
    is a built-but-not-armed artifact, which is why it carries a PENDING-ARMS
    line rather than being declared done.
  - >-
    Generator != grader was real here, not ceremonial: the implementer that
    wrote all 802 lines is a different model (Sonnet 5) from the seat that
    gated it (Opus 5), and the gate re-ran every claim rather than reading
    the implementer's report. Seat diversity across FAMILIES is nonetheless
    DEGRADED and declared — both seats are Anthropic. The non-Anthropic
    seats were live-probed this session: kimi alive, codex AUTH_DEAD
    (refresh token revoked), glm CRED_UNAVAILABLE, agy TIMEOUT. Kimi was
    spent on the C1 diff, which had the larger blast radius.
