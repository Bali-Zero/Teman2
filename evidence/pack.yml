diff:
  net_lines: >-
    +459/-6 (net +453) across 4 files, measured at SHA 5b790247b by
    `git diff --shortstat 10c1a1729 5b790247b`. Base is the MERGE-BASE, so main's own landings are
    not counted as this PR's. The SHA is the load-bearing part: this line lives inside its own diff,
    so re-running the command at whatever the head is NOW returns a larger number, and a bare figure
    with no SHA would be false the moment the next commit lands.
  behaviour_change: >-
    New table + trigger (not applied to any running database by this diff). One behaviour change in
    the reader: a non-Postgres exception in the history query now PROPAGATES where it was previously
    swallowed, and the two degraded paths now log.
