pii_scan: clean
dissent:
  - seat: "kimi-code/k3 (independent adversarial refuter, non-Anthropic, fresh context, not the author)"
    objection: >-
      MAJOR — the skipped allowance opens a real hole and its mitigation is
      decoration as wired. Concrete scenario given: an over-narrow paths filter
      lets a PR that changes an imported package skip `Backend Tests (Python)`;
      GitHub's gate is satisfied, the probe returns clean:true, and a merge
      lands with zero backend-test compute — which by the probe's own mission
      statement IS the #3227 class, now blessed. And `skipped_contexts` never
      reaches Telegram: on rc=0 the classify step emits tier=none so no alert
      fires at all, and even on a VIOLATION the alert body interpolated only
      `findings`.
    status: CONFIRMED
    note: >-
      The half that could be fixed without manufacturing new alarm traffic was
      fixed in this PR: the alert body now carries the skipped list whenever a
      message is already being sent, so a human reading a VIOLATION page sees
      what else was waved through on that commit. The other half is REFUSED on
      purpose and the refusal is the point of the PR — a skipped context is
      not a finding, and alerting on one would page on every docs-only merge,
      which is precisely the fatigue being removed. Detecting an over-broad
      paths filter is a different detector and is not claimed here; it is in
      the brief's risks and in PENDING-ARMS, not smuggled into this diff.
  - seat: "kimi-code/k3 (same)"
    objection: >-
      MAJOR — the snapshot fallback is fail-open on drift and the code does
      nothing about it. Add a 28th required context in GitHub Settings without
      re-running snapshot_required_contexts.py and the probe verifies 27 of 28
      and reports CLEAN; `generated_at: 2026-08-11` is never read; there is no
      staleness tripwire. Reverse drift (a rename in Settings) produces false
      p0s instead.
    status: CONFIRMED
    note: >-
      Correct, and it was already named in the brief's risks before the
      refutation arrived — recorded here as CONFIRMED-BY-A-SECOND-PARTY rather
      than discovered. Partially mitigated after the review: the verdict's
      `required_source` now carries the snapshot's own generation date
      (`snapshot:infra/required.d/contexts.json@2026-08-11`), so a suspicious
      CLEAN says out loud how old the list it trusted was. The real cure is a
      scheduled freshness check that regenerates and diffs — a new workflow,
      i.e. a separate PR, and it is going to PENDING-ARMS rather than being
      bundled here. Weighed honestly: this trades a TOTAL blind spot that
      screams 26 times a day for a PARTIAL blind spot that is quiet. That is
      an improvement, not a fix, and it is not being sold as one.
  - seat: "kimi-code/k3 (same)"
    objection: >-
      MINOR ×2 — a timeout- or SIGKILL-killed probe leaves truncated but
      NON-EMPTY JSON, which the size-only `[ ! -s ]` guard waved through; the
      alert step's json.load then raised under `-e`, and the CANNOT-VERIFY
      step below was skipped by its implicit success() — a red run with no
      Telegram at all, the opposite of the stated intent. Separately, a `"` in
      a workflow_dispatch sha input broke the printf-built fallback JSON into
      the same silent path.
    status: CONFIRMED
    note: >-
      Both closed by one change: the guard now validates that the file PARSES
      (json.load) instead of merely being non-empty, and rebuilds it with
      json.dump, which escapes the SHA for free. All three cases tested
      individually under `bash -e -o pipefail` — receipt above.
  - seat: "kimi-code/k3 (same)"
    objection: >-
      MINOR, latent, pre-existing — the per-run jobs fetch used no per_page, so
      GitHub's default of 30 would silently truncate a run with more jobs and
      every context that fell off the page would report "never evaluated
      pre-merge": a false VIOLATION p0 manufactured by pagination. Measured max
      on the real corpus: 10 jobs per run, so not live today.
    status: CONFIRMED
    note: "One query parameter (per_page=100). Pre-existing, but closed on sight — the failure direction is a false page to a human at night."
  - seat: "session (author, against the mandate that dispatched it)"
    objection: >-
      The mandate stated the cause as structural squash-SHA behaviour
      ("the pushed main SHA is a brand-new commit that NEVER had pre-merge
      check runs of its own") and proposed resolving the SHA to its PR as the
      cure. Reading the script first showed the probe ALREADY does exactly
      that, correctly, and had done so since it was written.
    status: CONFIRMED
    note: >-
      Recorded because building the ordered cure would have produced a PR that
      changed working code, shipped green, and left all 26 reds in place. The
      mandate's INSTRUCTION to "confirm by reading the called script first" is
      what saved it — the instruction was right even though the hypothesis
      attached to it was wrong.
  - seat: "session (author, against its own first draft)"
    objection: >-
      The first draft of the new tests fabricated `started_at == completed_at`
      for a skipped job. Real GitHub data has completed_at one second BEFORE
      started_at.
    status: CONFIRMED
    note: >-
      A test that passes while pinning a shape production never emits is the
      "green for the wrong reason" class. Caught by measuring the live API
      instead of reasoning about it. Recorded because a dissent list showing
      only other people's findings, and none the author had to withdraw, is
      the suspicious-consensus shape this field exists to prevent.
tests:
  - "scripts/tests/test_probe_merge_gate_integrity.py: 13 -> 28 tests, all passing. New coverage is deliberately two-directional: 3 innocence tests (skipped is not a finding; skipped survives the negative-duration rule; the measured 4-skipped docs-merge shape is clean) and 6 guilt tests (a parametrized case per non-passing conclusion — failure, cancelled, timed_out, action_required, neutral, None — plus 'skipped does not substitute for a missing job'), then 5 on the required-context source (snapshot present and dated; API preferred; snapshot used when API denied; empty API list falls through rather than passing vacuously; both sources failing raises)."
  - "`neutral` is in the GUILT list on purpose. It is commonly said to satisfy required checks, was NOT measured on this repo, and therefore stays a finding — the test's own docstring says a future lane may move it by adding evidence, never by assuming symmetry."
static:
  - "yaml.safe_load on the modified workflow -> parses; permissions read back as {contents: read, actions: read, pull-requests: read}"
  - "the embedded python's indentation verified by extracting the post-YAML `run` scalar and reading it, not by eyeballing the file (a block-scalar indent error would only surface in CI)"
  - "actionlint NOT run locally — not installed on this machine. Stated rather than omitted; CI runs it."
notes:
  - >-
    Seat diversity is DEGRADED and declared, not silent. Non-Anthropic seats
    were live-probed this session rather than trusted from the 3h-old
    SessionStart report: kimi PONG (alive); codex `401 Unauthorized ... refresh
    token was revoked` (AUTH_DEAD, needs an interactive `codex login` — an
    operator gesture); glm CRED_UNAVAILABLE; agy TIMEOUT. One non-Anthropic
    family available, not the two a full quorum wants. The refutation happened;
    the diversity did not.
  - >-
    Three defects, one PR, deliberately not split. They are not independent:
    fixing 1 and 2 without 3 would have converted 26 ignorable digest reds per
    day into 26 p0 Telegram pages per day, one per docs-only merge. Shipping
    them separately would have made the alarm strictly worse in the window
    between the two PRs.
