    seat: "session (mini)"
  - claim: "ACCEPTANCE (a) — zero CANNOT-VERIFY on the 10 most recent first-parent pushes to main"
    cmd: "for sha in $(git log --first-parent -10 --format=%H origin/main); do probe --sha $sha --json; done"
    result: "10/10 CLEAN, rc=0 each, CANNOT-VERIFY count = 0. Was 100% CANNOT-VERIFY. skipped counts per commit: 4,4,4,0,4,1,0,4,0,0."
    exit: 0
    ts: "2026-08-23T10:32Z"
    seat: "session (mini)"
  - claim: "ACCEPTANCE (b) — guilt preserved: a fabricated SHA still returns CANNOT-VERIFY"
    cmd: "probe --sha b72f1885f7f9b8b0e17c1c9f0ba7e1a9a3f6d3ef --json   (real prefix, invented tail)"
    result: '{"verdict": "CANNOT-VERIFY", "error": "... No commit found for SHA ... (HTTP 422)"} — this was run BEFORE the real-SHA run, by accident, and is kept because an accidental guilt case is still a guilt case.'
