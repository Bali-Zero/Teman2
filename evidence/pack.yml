    status: CONFIRMED
    repro: "SELECT COUNT(*) FROM orphan_client_reassignment_archive WHERE old_assigned_to IS NULL after a dry run of the archive INSERT returns 152 (measured by team-lead)."
    resolution: "Added AND c.assigned_to IS NOT DISTINCT FROM archive.old_assigned_to (NULL-safe, not the lower(BTRIM(...))=lower(BTRIM(...)) equality form 277 uses) to 278's final UPDATE, and corrected 278's header, which still claimed an unconditional safe no-op on second run — the same class of false claim already corrected in 277 at round 2."
  - seat: kimi-k3
    objection: "Round 4 (SAFE-TO-APPLY, first clean pass after three dirty ones, explicit read perimeter: migration_base.py/migration_manager.py/migrations_v2/*.sql allowed, .env*/backend/data/client-record fixtures denied): two non-blocking observations, not defects. (1) A guard comparing the live value against the archived old value cannot distinguish 'never touched since apply' from 'reverted to exactly the same value it started at' — intrinsic to comparing against a stored old-value, not a defect in this migration; the header now documents this semantics correctly rather than overclaiming. (2) The rollback section's SET lock_timeout/statement_timeout run on a POOLED connection (unlike the forward section, which uses a dedicated connection that gets closed), so the settings persist on that pooled session after commit — benign values, short-lived pool, and a pre-existing pattern across the repo's migrations, not introduced by this PR."
    status: CONFIRMED
    repro: "Traced end-to-end against the runner rather than trusting the header text: walked all four execution orders for the NULL-safe guard (first legitimate run — 152 NULL rows update correctly since NULL IS DISTINCT FROM new is true and NULL IS NOT DISTINCT FROM NULL is true; unchanged re-run — no-op; re-run after human reassignment — the human's change survives; re-apply after rollback — proceeds correctly) and confirmed nothing else in the runner (reconciliation path, applied_by, schema_audit.py, checksum, verify()/verify_apply()) reads the removed self-INSERT line."
    resolution: "Not cured — accepted as inherent to the guard's form (1) and as a benign pre-existing pattern (2). Both recorded in residual_risks below rather than silently dropped."
  - seat: team-lead
    objection: "The PR body's opening draft (published to GitHub at PR-open, before this pack existed) named seven staff members alongside their individual client caseloads, including one personal gmail address — on Bali-Zero/Teman2, a PUBLIC repository. This is exactly the boundary CLAUDE.md Law 2 / UU PDP treats as absolute; that the people are colleagues rather than clients does not move it. Same pattern also present in this pack's own dissent/residual_risks and in the unpublished round-4 PR-body-rewrite draft."
    status: CONFIRMED
    repro: "gh pr view 4542 --json body -q .body | grep -c -i '@gmail\\.com|Dea |Rina |Ruslana |Marta ' returned 2 (non-zero) before the fix."
    resolution: "The live PR body was corrected in place the same turn it was flagged (gh pr edit — mutable metadata, not a git-history rewrite, so no delay was defensible) to an aggregate form: '146 clients in total, individually ranging from 1 to 74', no names, no email. Same redaction applied to this pack (two locations) and to the held PR-body rewrite. The four already-pushed commits were independently re-checked and found clean — the exposure was confined to the mutable PR description, never to committed history."
  - seat: team-lead
    objection: "The exposure above was not confined to an unpublished draft — it was LIVE on the published PR body, publicly readable on Bali-Zero/Teman2, from 2026-08-21T13:18:24Z to 2026-08-21T14:36:51Z (78 minutes). GitHub retains both the exposed revision and the corrected one in the PR body's edit history — the gh pr edit fix removed the data from the current view, not from GitHub's archive."
    status: CONFIRMED
    repro: "PR body edit history queried via the GitHub API; both the pre-fix and post-fix revisions return deletedAt: null."
    resolution: "Not curable from this side — neither gh pr edit nor any other repo-side action can reach a retained PR-body revision. Escalated to Zero (2026-08-21): a GitHub support removal request for the retained revision, and notifying the affected person, both Legge-5 business decisions outside this task's authority. True cause, recorded honestly rather than as 'PII removed': the information read as an internal operational detail (staff caseload counts), and nobody asked where publishing it on a PUBLIC repo would end up before it went out — a gap the aggregate-form fix closes going forward, not one this fix undoes for the 78 minutes it was already live."
  - seat: github-actions
    objection: "Round 5, and the only finding across five rounds that no refuter produced: the six-recipient guard added at round 2 raised 'Migration 278 requires all six water-filling recipients to be active team_members rows -- 6 of 6 are missing or inactive' when CI smoke-applied 278 against a fresh test database with an empty team_members table. The guard was not misfiring — it was enforcing exactly what it said, and what it said was 'these six rows must exist', a condition on the WORLD rather than on the operation. As written, 278 was inapplicable to every environment except production."
    status: CONFIRMED
    repro: "Backend Tests (Python) on PR #4542, migration smoke-apply against an empty schema: the RAISE EXCEPTION fires with missing_count = 6 before any CTE runs."
    resolution: "Subordinated the six-recipient check to IF orphan_work_count > 0, where orphan_work_count counts rows matching the orphans CTE predicate COPIED VERBATIM (not re-derived — a second, diverging copy of that predicate is precisely the defect class round 1 introduced). The true invariant was never 'the six must exist'; it is 'we must not assign a client to a nonexistent or inactive recipient', satisfied vacuously when there is no client to assign. With any pool (production has 323) the check runs unchanged. This is round 2's own literal-vs-invariant lesson one level up, and the contrast sits inside the same file: the OTHER guard, immediately above, asserts 'client 11500 does not satisfy the orphan predicate' and passes vacuously on an empty database."
    note: "Recorded against seat github-actions rather than folded into a team-lead entry deliberately. Four adversarial rounds read this guard and approved it, round 4 explicitly SAFE-TO-APPLY; none EXECUTED it against an empty table, they only reasoned about its semantics, and the semantics read fine. A refuter that reads and a runner that executes are not redundant reviewers of the same claim."
  - seat: kimi-k3
    objection: "Round 5 (targeted single question — 'does this cure reopen the hole the guard closed?' — run from an isolated directory containing only the redacted migration, closing the read-beyond-the-prompt channel round 4 left open by luck of subject matter). Verdict FIX-SOUND, with one residual seam named: the guard's DO block and the later WITH orphans statement are separate statements, so under READ COMMITTED a concurrent committed INSERT INTO clients carrying a NULL or invalid assigned_to, landing between them, would be counted as zero by the guard yet picked up by the CTE and assigned to a possibly-missing literal."
    status: CONFIRMED
    repro: "Predicate equivalence checked textually (byte-equivalent to the orphans CTE); the seam is snapshot, not text. BaseMigration.apply() wraps the migration in one transaction, but READ COMMITTED gives each STATEMENT a fresh snapshot."
    resolution: "Not cured — accepted and declared (see residual_risks). Reaching it requires three conditions at once: zero orphans at guard time, a missing or inactive recipient, AND a live writer creating an orphan inside the window. Any environment where the six recipients are genuinely absent is an empty non-production one with no such writer; anywhere with production traffic orphan_work_count is 323 and the guard runs at full strength. The refuter also established the fix adds no new failure CLASS: the same check-then-act seam already existed at round 4 on the other side (a recipient could be deactivated between the guard and the final UPDATE). Recorded as its own residual-risk line rather than leaning on the pre-existing generic TOCTOU line, because this is a NEW instance the fix introduced, and 'already covered as a class' is not the same as declared."
residual_risks:
  - "NEW at round 5, introduced by the round-5 fix itself (kimi-k3, CONFIRMED, accepted): between the recipient guard's DO block and the orphans CTE, READ COMMITTED gives each statement its own snapshot, so a client that becomes orphaned in that window is invisible to the guard but visible to the CTE — the guard can be skipped for a pool it would have protected. Unreachable where it could matter (needs zero orphans at guard time AND a missing/inactive recipient AND a concurrent writer, and the first two only co-occur on empty non-production databases), and it is the same check-then-act class already present before this fix, not a new one."
  - "Live orphan-pool and caseworker-load counts continue to drift by small amounts (±1-2) during this investigation window due to ordinary CRM activity — expected and immaterial (see dissent above), but means any number quoted in this pack is a snapshot, not a guarantee of what apply-time will show; acceptance criteria are phrased as post-apply re-measurements for this reason, not fixed targets."
  - "Seven active staff members hold clients outside the six-person water-filling pool (146 clients in total, individually ranging from 1 to 74 — all verified active, non-client-role). Whether any should join future rebalancing rounds is a business decision for Zero (Legge 5), not resolved by this task."
  - "The 515 team_members rows with role='client' and the dead BaseMigration.dependencies mechanism are both logged in .claude/skills/modus/PENDING-ARMS.md as separate, deliberately-deferred findings — neither touched by this diff."
  - "PLAUSIBLE (kimi-k3, not cured here — requires an out-of-runner application path to matter): a manual re-run of 278 with the archive table already populated would re-derive and overwrite human reassignments made SINCE the first apply, because the archive's IS DISTINCT FROM guard only protects against re-applying an identical value, not a value that has since been legitimately changed again by a human."
  - "PLAUSIBLE (kimi-k3, not cured here — same class): a manual `psql -f` application path (outside the migration runner) would not write schema_migrations at all, so 278's dependency guard would wrongly refuse to run even after 277's real effect landed via that path — both risks require applying outside the runner to manifest, and this task's own apply goes through the runner."
  - "Coordination, not correctness (team-lead, 2026-08-21): 278 reassigns hundreds of live client rows in one transaction while the CRM continues to see ordinary staff activity (measured drift above). Correctness is not at risk (single transaction, coherent snapshot), but a hand-made reassignment landing a moment before 278's transaction starts gets absorbed by 278's water-filling if the hand-picked recipient is not one of the six active caseworkers in its team CTE — worth a line here, not a code change."
  - "TOCTOU between the guards and the CTEs under Postgres's default READ COMMITTED isolation: a narrow window against a live CRM table. The existing lock_timeout='5s' makes real contention fail clean rather than hang; tightening isolation is a design decision deserving its own review, not a last-minute addition after four rounds already landed."
  - "current_loads does not normalize the team side of its join (= team.tm_email, not lowercased). Not a live bug today — the six literals are already lowercase — but becomes one the day someone edits that list with different casing."
  - "Round-4, non-blocking (kimi-k3, not a defect): a guard comparing the live value against the archived old value cannot distinguish 'never touched since apply' from 'reverted to exactly the same value it started at' — intrinsic to comparing against a stored old-value. 277/278's headers now document this semantics correctly."
  - "Round-4, non-blocking (kimi-k3, not a defect): the rollback section's SET lock_timeout/statement_timeout run on a pooled connection (the forward section uses a dedicated, closed connection) and persist on that session after commit. Benign values, short-lived pool, and a pre-existing pattern across this repo's migrations — noted only because it had never been examined before."
