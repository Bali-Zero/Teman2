  - seat: kimi-k3
    objection: "Round 2: the six water-filling recipients (damar/surya/vino/adit/ari.firda/krisna) are literals in the team CTE, never checked against team_members — a stale or misspelled recipient would silently receive zero clients while the level computation still counted them as an active bucket, with no error raised."
