brief_ref: evidence/brief.yml
plan_ref:
  "PR #5302 (agent/air-m5/db/garuda-magic-link-owner) — cure of the production outage that has kept
  the authenticated half of GARUDA VOA unreachable since migration 285 shipped, plus the static lint
  that stops the omission recurring. Governing mandate: GARUDA VOA dark launch to production."
lanes:
  - lane: garuda-magic-link-owner-build
    role: build
    seat:
      claude-opus-5 (conducting session — measured the outage against production, falsified four
      competing hypotheses, authored migration 299, the static lint, the preflight extension and this pack)
  - lane: garuda-magic-link-owner-refute
    role: review
    seat:
      codex gpt-5.6-sol at xhigh effort (OpenAI, ChatGPT Pro flat subscription) — given the diff and the
      production measurements and told to break both the migration and the lint. Returned REJECT with
      three findings, all CONFIRMED and all fixed; see receipts and dissent.
seat_diversity: satisfied
seat_diversity_note:
  "The build lane is Anthropic and the adversarial lane is OpenAI — different families, and the grader
  is not the author. This mattered rather than being ceremony: the REJECT killed a migration that would
  have recorded false success, and one of the two counterexamples it supplied (a commented-out transfer)
  was a shape the author's own tests did not cover."
diff:
  net_lines:
    "5 files measured by `git diff --stat origin/main...HEAD` plus the working tree: one new .sql
    migration (299), one new static test file, two touched Python files (preflight check + its frozen
    authority), and this evidence pair. Zero frontend, zero workflow, zero runtime code path."
  behaviour_change:
    "At apply time against production, migration 299 changes NOTHING and says so: the runner connects as
    backend_rag_v2, which is not a member of visa_ledger_owner, so the ALTER cannot succeed and the
    migration RAISES rather than recording itself applied. The observable cure arrives only when the
    ALTER runs on a superuser connection — after which the BEFORE INSERT trigger on
    garuda_magic_link_tokens can finally take its FOR SHARE lock and magic-link issuance stops
    answering 500. The static lint and the preflight extension change no production behaviour at all."
receipts:
  - claim:
      "Magic-link issuance is dead in production, and has never worked: the endpoint answers 500
      INTERNAL_ERROR and garuda_magic_link_tokens holds zero rows."
    evidence:
      "Live POST against the production endpoint returned 500 INTERNAL_ERROR; `SELECT count(*)` on
      garuda_magic_link_tokens through scripts/pg.sh (nuzantara_readonly, primary confirmed by
      pg_is_in_recovery = f) returned 0. The exception class asyncpg InsufficientPrivilegeError
      (PostgreSQL 42501) was read from the production log only after PR #5297 taught the blind
      catch-all to log the class name — before that the handler swallowed it."
  - claim:
      "The cause is ownership, not privilege on the app role: the trigger is SECURITY DEFINER but owned
      by backend_rag_v2, which cannot take a FOR SHARE lock on a visa_ledger_owner-owned table."
    evidence:
      "pg_proc on the production primary: bind_garuda_magic_link_token_retention_policy has
      prosecdef = t and proowner = backend_rag_v2, while its working twin
      bind_garuda_voa_check_retention_policy has prosecdef = t and proowner = visa_ledger_owner.
      The two functions differ by owner and by nothing else that touches the lock. Grants were read
      from pg_class.relacl, NOT from information_schema.role_table_grants — that view is filtered by
      the calling role, so its empty answer means 'invisible to me', never 'absent'."
  - claim:
      "This is a recurrence, not a new class: migration 268 cured the shape on 2026-08-07 and 281
      carried the role-guarded transfer forward; 285 created a trigger of the same shape and omitted it."
    evidence:
      "Read from the migration files themselves in this worktree — 281 contains the guarded ownership
      transfer, 285 creates the trigger with no transfer at all."
  - claim: "The static lint would have blocked migration 285. Guilt and innocence both proven, not asserted."
    evidence:
      "Guilt: with 299 removed — the real state of production — the lint names
      bind_garuda_magic_link_token_retention_policy in 285_garuda_magic_link.sql. Innocence: with 299
      present it is green, and it does not accuse prepare_visa_evaluate_idempotency_reservation
      (migration 264), which production confirms is correctly owned and does not read the ledger.
      A third test asserts the detector matches the shape at all, so a guard that has quietly stopped
      matching anything cannot pass forever."
  - claim: "The live catalog check that SHOULD have caught this had never been told these functions exist."
    evidence:
      "operational_preflight.py's RETENTION_BINDING_TRIGGER_FUNCTIONS listed neither GARUDA binder.
      Both are now listed, and the independently frozen schema authority in
      test_operational_preflight.py's CANONICAL_SENSITIVE_FUNCTIONS was updated in step so the two
      cannot drift apart silently."
  - claim: "The full test surface is green as of this pack."
    evidence:
      "`PYTHONPATH=. python -m pytest backend/tests/db/test_retention_lock_triggers_are_ledger_owned.py
      backend/tests/scripts/visa_engine/test_operational_preflight.py` — 43 passed in 0.38s, run in
      this worktree's .venv this turn."
pii_scan: clean
pii_scan_note:
  "No client data is touched, read or transcribed. Production reads were catalog queries (pg_proc,
  pg_class) and one row COUNT; no row contents left the database. No secret value was read: the
  ownership ALTER is handed to the operator as a command that references $OPERATOR_PASSWORD in place
  on the target machine rather than printing it."
dissent:
  - seat: codex gpt-5.6-sol (adversarial grader)
    objection:
      "The migration would record FALSE SUCCESS. Its first draft caught insufficient_privilege and
      emitted a NOTICE, mirroring migration 268 — but a declined migration is still written to
      _schema_versions as applied and is never retried. Production would carry a migration claiming to
      have cured an outage that is still live, and nothing downstream would ever say otherwise."
    status: CONFIRMED
    resolution:
      "Rewritten to assert its own postcondition and RAISE: after attempting the ALTER it re-reads
      pg_proc.proowner and, if the function is still not owned by visa_ledger_owner, raises an exception
      naming the consequence ('magic-link issuance still answers 500') and refuses to be recorded
      applied. The ROLLBACK section is a deliberate no-op that says why — restoring backend_rag_v2 as
      owner would re-create the outage."
  - seat: codex gpt-5.6-sol (adversarial grader)
    objection:
      "The lint's transfer collector was too permissive: it treated any appearance of a function name
      near an ownership transfer as evidence that THAT function was transferred, so an unrelated
      transfer in the same file laundered an offender, and a mere mention counted as a cure."
    status: CONFIRMED
    resolution:
      "Rewritten to parse real ALTER FUNCTION ... OWNER TO statements and the DO-block transfer arrays
      used by migrations 268/281, binding each transfer to its own function name. Five tests now encode
      the grader's counterexamples directly: unrelated transfer, mere mention, commented-out transfer,
      SECURITY DEFINER inside a comment, and DO-block array."
  - seat: codex gpt-5.6-sol (adversarial grader)
    objection:
      "Comments produced false results in both directions — a commented-out transfer read as a real one,
      and the words SECURITY DEFINER inside a comment read as a real offender."
    status: CONFIRMED
    resolution:
      "Line comments are stripped before analysis, and dollar-quoted bodies are matched by their real
      tags rather than split coarsely. This also fixed a false positive the author's own innocence
      control had caught earlier against prepare_visa_evaluate_idempotency_reservation."
  - seat: session (self-refutation during build, RESOLVED)
    objection:
      "The lint's own MIGRATIONS path was wrong (parents[3] instead of parents[2]), so it globbed a
      directory that does not exist. A glob over a missing directory returns empty silently — the lint
      was green because it was looking at nothing."
    status: CONFIRMED
    resolution:
      "Caught by the innocence control the lint carries. Path corrected, and an explicit
      `MIGRATIONS.is_dir()` assertion added so the same failure can never be silent again."
  - seat: session (declared limit, unresolved)
    objection:
      "The lint reads SQL text, not a database. A migration whose trigger takes the lock through a
      helper function rather than inline would not be caught."
    status: PLAUSIBLE
    resolution:
      "Left standing and named in the brief's risks. The live catalog check in operational_preflight,
      now aware of both GARUDA binders, is the layer that would catch that shape at runtime."
  - seat: session (declared limit, unresolved at merge BY DESIGN)
    objection:
      "Merging this PR does not end the outage. The ALTER needs a superuser connection, which the
      session's permission classifier declines to make — it is an operator action."
    status: CONFIRMED
    resolution:
      "Stated in the brief's risks and in the migration's own RAISE message rather than papered over.
      PROVE-LIVE is explicitly NOT claimed by this PR: the proof is two calls with one
      Idempotency-Key returning 202 against the live endpoint, run after the ALTER lands. Note the cure
      is invisible in the response body — both states return a non-enumerating 202 — so the observable
      signal is the Idempotency-Replayed header, false->true before the cure and false->false after."
