  - seat: author-session (M5), on its own two fuzzers
    objection: "Both of my fuzzers reported 0 regressions on a class neither could emit. The fragment product only ever held REAL schemes; the character-level run cannot randomly assemble a well-formed userinfo URL with an over-long scheme. W100 in one line: cross-family beat same-author, and it beat it on the exact axis I had declared verified twice."
