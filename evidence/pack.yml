  reviewer is real and is declared rather than left to read as satisfied.
  Roster state measured this session by the SessionStart arsenal probe:
  codex UNKNOWN_ERR, and the probe itself returned PARTIAL (1 of 17 seats),
  so most seats were not measured at all rather than measured dead — see
  lesson_a_seat_board_that_under_reports_silently_narrows_every_routing_decision_2026_08_22.
  The honest statement is that no cross-family seat was CONVOKED for this
  lane, not that none was available.
diff:
  net_lines: >-
    3 files, +222/-1: scripts/wa_bot_throughput_sentinel_run.sh (91),
    infra/launchagents/com.nuzantara.wa-bot-throughput-sentinel.plist (102),
    apps/organism/organism/organs_registry.yaml (+30/-2, entry + checksum).
    Deterministic gear floor RECOMPUTED from this diff = 3 (hot-zone:
    infra/launchagents/). Gear 3 is the floor, not a choice.
  behaviour_change: >-
    NOTHING changes on any machine when this merges. It adds the artifacts
    that let an operator install the organ; installing it is a separate,
    post-merge step. Once installed, Pro runs a read-only SELECT max() pair
    against production every 900s and can emit p0/digest Telegram alerts.
