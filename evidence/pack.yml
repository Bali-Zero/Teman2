  net_lines: "+353 net on .github/workflows/tests.yml (526 insertions / 173 deletions), +2 new files under scripts/ci/ (partitioner 280 lines, its guilt+innocence corpus 380 lines), +11 lines on .github/CODEOWNERS. Measured by `git diff --numstat origin/main...HEAD`. Larger than the ~400-line PR guideline and DECLARED as such: a job cannot be split into three without restating the setup blocks each piece needs, and roughly half the tests.yml delta is load-bearing comments carried over verbatim from the pre-split job so the scar rationale is not lost."
