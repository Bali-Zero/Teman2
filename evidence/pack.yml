diff:
  net_lines: >-
    5 files. Three substantive (scripts/probe_merge_gate_integrity.py,
    scripts/tests/test_probe_merge_gate_integrity.py,
    .github/workflows/merge-gate-integrity-watch.yml) plus evidence/brief.yml
    and evidence/pack.yml, which are per-PR scratch rewritten by every
    harness-gated PR.
  behaviour_change: >-
    The probe's verdict changes on two inputs and only two: a required context
    concluding "skipped" is no longer a finding, and the required-context list
    can now come from the checked-in snapshot when the live API is denied. The
    workflow's classification changes on ALL non-zero outcomes, because it
    previously captured no exit code at all. Nothing about what the workflow
    DOES with a verdict changes: still not required, still non-blocking,
    still signal-only.
receipts:
