    repro: "The guard's second condition, pre-fix, was a bare string equality against one hardcoded email — any of the three scenarios above changes clients.assigned_to for id=11500 to a value other than that literal while the client still has a valid, active owner."
    resolution: "Rewrote the guard to assert client 11500 does NOT satisfy the same orphan predicate the orphans CTE uses below (deleted_at IS NULL AND NOT EXISTS an active team_members match) — the true invariant, immune to a legitimate future reassignment. This finding is the most instructive in the pack: a guard fix that itself violates 'assert the entity, not a literal form' is still that same defect (cicatrix-superscar.md family #3), even when the fix was written specifically to close a different gap."
