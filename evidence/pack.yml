runtime_proof:
  - "PENDING at the time of writing, and deliberately not claimed: the >=8-minute wall-clock target and the guilt/innocence probes are being measured on this PR's own transit. See residual_risks — this pack does NOT assert the target is met, only that the arithmetic and the first data point (Backend Static 170s) are consistent with it."
dissent:
  - seat: "kimi-code/k3 (Moonshot, cross-family, fresh context, `kimi -p ... -m kimi-code/k3`, independent of the diff's author)"
    objection: "Two CONFIRMED findings, both real, both fixed before this pack was written. (1) THE MONEY QUESTION: the shards and the fan-in both ran the PR's OWN copy of scripts/ci/shard_tests.py, so a diff appending one entry to EXCLUDED_DIRS made both agree perfectly on a shrunken corpus -- chunks tile it exactly, guard green, required context green, and the test catching the diff's regression never ran. It noted the author had built exactly this defense (BASE_SHA extraction) for change_map.py/impact_map.py and not for the new file, and that the change-map's own classification of the PR as run_all=true does not help, because forcing the jobs to RUN does not stop a modified enumerator from shrinking what they run. Cured in 0b298c253. (2) The fan-in derived its coverage pin from requirements.lock.txt while the shards install the lock closure and then an unpinned pytest-cov on top, so the comment claimed a same-version guarantee the code did not deliver; it also correctly flagged that if the lock had no coverage== the step would go red on every coverage lane and block the queue. Cured in 535b27784. It REFUTED: the ARG_MAX concern (~28KB of args vs a ~2MB limit), the stuck-required-context paths, and a pytest python_files mismatch (pyproject declares exactly ['test_*.py','*_test.py'], which is what _is_test_file implements). Its final 'CRITICAL FINDING' -- that test_shard_tests.py references a --union flag shard_tests.py does not have -- is an ARTEFACT OF THE AUTHOR'S OWN METHOD, not a defect: it was reading the live worktree while that worktree was being edited, so it got a torn read. Disproved by re-running the corpus against a frozen `git archive` of the committed SHA: 28/28 pass. The lesson is the author's, not the refuter's -- point a refuter at an immutable snapshot."
    status: CONFIRMED
residual_risks:
  - "THE WALL-CLOCK TARGET IS NOT YET PROVEN. The <=8min figure is arithmetic on a measured breakdown plus one measured data point (Backend Static 170s). The honest status is: projected, not demonstrated. If the measured shard wall-clock lands above target, the next lever is the duration-aware splitter this design already instruments for (see below) -- not a wider matrix."
  - "SHARD BALANCE IS UNMEASURED BY CONSTRUCTION. Round-robin over the canonical path order balances FILE COUNT exactly (475/475/475) and says nothing about TIME. The fan-in emits a slowest/fastest ratio from junit's own `time` attribute precisely so the pytest-split decision is made on data; above ~2x, round-robin is the wrong splitter. Deferring that to v2 is a declared choice, and this PR's own transit is its first measurement."
  - "RUNNER SLOT PRESSURE, DECLARED. This turns 1 job into 5 per run, and both the PR lane and the merge-group lane run. tests.yml's own concurrency comments identify runner slots as the binding constraint on main's velocity, so trading slots for wall-clock is a real trade, not a free win. Public repo => the minutes are free; the SLOTS are not. Not mitigated in this PR."
  - "THE 'INTRODUCED' BRANCH OF THE TRUST BOUNDARY IS WIDE OPEN ON THIS PR AND ONLY THIS PR. `git show BASE_SHA:scripts/ci/shard_tests.py` fails because the base ref has no such file, so this PR's own guard adjudicates with its own head copy. That is unavoidable for the commit that introduces a trusted file; it is declared loudly (a ::warning:: in the run log) rather than silently downgraded, and the CODEOWNERS entries added here mean every LATER edit always has a base copy to be judged against."
  - "A PR whose base predates this commit will have a base copy of shard_tests.py without the `--union` flag, and the security pass would fail on an argparse error. That fails CLOSED (red), not open, and the window closes as soon as this lands."
  - "Codecov remains unarmed. There is no CODECOV_TOKEN secret in this repository, so the upload step has been skipping on every run since before this change (measured 0s). Carried over unchanged rather than deleted; arming it is a separate decision and is NOT part of this PR."
