    resolution: "four NAME branches collapsed to three; the mutation re-run at the time reported 54/54 killed, 0 survivors -- a claim the ROUND-4 gate then falsified with five counterexamples, because those 54 mutants never touched rules 3 and 4. Superseded by the scoped 63-mutant set above"
