    objection: "The conformance checker's initial PASS was FALSE -- is_armed() matched the substring 'scripts/tests/' present in 31 other workflow files, so the registration passed without any workflow actually executing the new .sh test. scripts-tests-sweep.yml collects only test_*.py via pytest and is continue-on-error anyway. This is W81 theater: armed on paper, executed by nothing."
    status: CONFIRMED
  - seat: session (m5), on its own measurement
    objection: "I first recorded the mutated suite as exiting 0, i.e. a test that fails loudly but reports success. False: I had captured tail's exit code through a pipe (W97). Re-measured without the pipe: rc=1."
    status: RETRACTED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: "The redactor closed a SUFFIX off-by-one and opened a PREFIX one of the same family: a bare `TOKEN=`/`KEY=`/`SECRET=`/`PASSWORD=` did not match. Lowercase names, `--flag=` and header `Name: value` forms also leaked. Driven live through the real hook, 6 leaking cases."
    status: CONFIRMED
  - seat: gear3-final-gate (opus 5, fresh context, read-only, not the author)
    objection: 'THE SECURITY DEFECT: the segment-anchored fix over-corrected into a serious UNDER-match. 12 of 16 probed forms leak IN FULL -- APIKEY= apikey= apiKey= AUTHTOKEN= SECRETKEY= accesskey= mytoken= TOKENS= pass= auth=, plus a JSON `{"api_key": "<v>"}` body and a `postgres://user:<v>@db` URL. Cause: the right-side rule demands a `_`/`-` delimiter and the lookbehind forbids matching mid-word, so undelimited compounds never match at all.'
    status: CONFIRMED
  - seat: session (m5), on the gate's own proposed design
    objection: "The gate's prescribed bounded prefix vocabulary closes all 12 forms and still leaks PGPASSWORD= -- 99 occurrences in the live log, more than every hypothetical hole the session had guessed combined. A vocabulary can only contain words someone thought of, and nobody thinks of `PG`. Adopted a stricter variant: any prefix for the five wide words, vocabulary for KEY alone, because KEY is the one word that routinely ends an innocent identifier."
    status: CONFIRMED
    resolution: "design widened BEYOND the gate's prescription -- vocabulary for KEY only, open prefix for the five wide words"
  - seat: mutation run (54 mutants), on the session's own first widened design
    objection: "21 of 60 mutants SURVIVED: with a wide-word branch present, most of the prefix vocabulary and five of the six credential words were redundant -- deleting them changed nothing. An alternation nothing can fail on is dead weight, exactly like the two wildcards deleted above."
