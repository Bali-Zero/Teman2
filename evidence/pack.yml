dissent:
  - seat: codex-sol
    objection: "L'assenza del brief disattiva proprio il floor che dovrebbe imporlo — un PR hot-zone poteva omettere evidence/brief.yml e ottenere default-success senza mai consultare il diff"
    status: CONFIRMED
    repro: "harness-floor.yml:112/137 pre-fix; fixed by computing the floor unconditionally and FAILing a floor-3 diff with no brief"
  - seat: codex-sol
    objection: "Il vero Evidence Pack linter non viene mai eseguito sul PR — solo --print-floor sul brief, mai evidence_pack_lint.py sul pack reale"
    status: CONFIRMED
    repro: "harness-floor.yml:158 pre-fix; fixed by adding a Gear-3-only step that fetches pack.yml+brief.yml and runs evidence_pack_lint.py for real"
  - seat: codex-sol
    objection: "harness_fable_gate.py non prova chi abbia emesso il verdetto — qualunque credenziale con statuses:write può pubblicare PASS su qualunque SHA"
    status: CONFIRMED
    repro: "harness_fable_gate.py:104-146; NOT fixed in this PR — doctrine-level trust boundary, ledgered as a residual risk blocking branch-protection promotion"
  - seat: codex-sol
    objection: "I Gear 3 entrano in deadlock nella merge queue: il verdetto umano vive sul head SHA del PR, ma merge_group crea un head_sha sintetico che nessun dispatcher ripubblica"
    status: CONFIRMED
    repro: "harness-floor.yml (Gear-3 branch leaves the context unpublished, by design); NOT fixed — the primary reason branch-protection promotion is reported BLOCKED"
  - seat: codex-sol
    objection: "compute_floor() restituisce solo 1 o 3, mai 2 — le categorie Gear-2/Gear-3-per-contenuto del contratto ratificato non sono mai mecanizzate, e il gear-3 labeler citato dal brief è assente"
    status: CONFIRMED
    repro: "evidence_pack_lint.py:153 (compute_floor); not a defect — the function's own docstring documents the floor as a deterministic LOWER BOUND only, and a gear-3 labeler was not among this PR's explicit deliverables per pr3-brief.md"
  - seat: codex-sol
    objection: "PASS-WITH-CONDITIONS è trattato come successo senza condizioni obbligatorie — --conditions-ref era opzionale e non enforced"
    status: CONFIRMED
    repro: "harness_fable_gate.py:65/74-90 pre-fix; fixed by requiring --conditions-ref when --verdict PASS-WITH-CONDITIONS (exit 1 otherwise)"
  - seat: codex-sol
    objection: "Il rilevamento del brief fallisce aperto — git fetch ... || true ignora errori transitori, e l'assenza dell'oggetto Git viene letta come 'brief assente'"
    status: CONFIRMED
    repro: 'harness-floor.yml:121 pre-fix; fixed by requiring the HEAD commit to resolve (git cat-file -e "$HEAD_SHA^{commit}") before accepting ''no brief'' as a conclusion'
  - seat: codex-sol
    objection: "Il kill switch è disallineato dal nome documentato (HARNESS_FLOOR_ENFORCEMENT_ENABLED vs HARNESS_ENFORCEMENT) e, se armato, blocca tutti i PR non pubblicando il default"
    status: CONFIRMED
    repro: "harness-floor.yml:53 pre-fix; fixed by renaming to HARNESS_ENFORCEMENT and publishing the default success from the kill-switch step itself"
  - seat: codex-sol
    objection: "Il parser YAML accetta gear con tipi sbagliati — gear: true e gear: 1.0 passavano perché Python tratta bool/float come == int"
    status: CONFIRMED
    repro: "evidence_pack_lint.py:259 pre-fix (gear not in (1,2,3)); fixed with an explicit type(gear) is int check"
  - seat: codex-sol
    objection: "brief_ref non è confinato al repository (path assoluti e ../ accettati) e può causare IsADirectoryError non gestita"
    status: CONFIRMED
    repro: "evidence_pack_lint.py:237 pre-fix; fixed with absolute-path rejection, repo_root confinement, and .is_file() instead of .exists()"
  - seat: codex-sol
    objection: "Le sei regole sono più deboli del contratto dichiarato: receipts assenti accettati, pii_scan è autocertificazione, dissent: [{}] passa su Gear 3, size controllata dopo yaml.safe_load"
    status: CONFIRMED
    repro: "evidence_pack_lint.py various pre-fix line ranges; receipts/dissent/size-ordering FIXED, pii_scan self-certification is a documented deliberate scope boundary (module docstring rule 3 — a real scanner is a separate tool)"
  - seat: codex-sol
    objection: "I test del publisher (test_harness_fable_gate.py) sono coverage non armata — nessun workflow li esegue"
    status: CONFIRMED
    repro: "guard-conformance.yml:19 pre-fix path filter; fixed by adding a real pytest-executing step (not registered as a guard — it's a publisher, per its own docstring)"
  - seat: codex-sol
    objection: "I PR da fork/Dependabot possono non ottenere il default status perché il GITHUB_TOKEN di default è spesso read-only su repository pubblici"
    status: PLAUSIBLE
    repro: "reproducibility depends on repo settings, per Codex's own labeling; NOT fixed — contributes to blocking branch-protection promotion alongside findings #3 and #4"
