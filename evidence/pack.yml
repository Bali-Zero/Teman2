    exit: 0
    ts: "2026-08-23T14:02Z"
    seat: "session (pro, build lane)"
  - claim: "An earlier green from this same gate was a FALSE green, and is recorded because the trap is reusable"
    cmd: "check_organ_conformance.py --repo <worktree>   vs   the same script run with cwd inside the worktree"
    result: >-
      Both printed an identical "178 plists scanned". `--repo` does not
