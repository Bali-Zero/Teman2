dissent:
  - seat: codex gpt-5.6-sol xhigh (refuter, dispatched on the diff without the brief)
    objection:
      "BLOCK, 15 findings. The decisive class: sentence segmentation. An Indonesian abbreviation
      ('PP No. 28') severed a marker from its amount; a full-width stop failed to segment at all, letting
      one sentence's inclusion wording exempt another sentence's split levy; a WhatsApp bullet with the
      label and the amount on separate LINES was cut by the newline rule. Separately, ANY inclusion wording
      in a sentence exempted it, so 'tidak termasuk' — a NEGATED inclusion — read as an inclusion."
    status: CONFIRMED
    resolution:
      "14 of the 15 were re-run against the code and reproduced verbatim; the 15th (EUR already fires) did
      NOT and is pinned by an innocence test so it is never 'fixed' again. The segmenter was DELETED rather
      than patched — association is now a 140-char proximity window, which dissolves five findings as one
      class — and the exemption logic was inverted so that an explicit 'paid separately' statement is
      checked FIRST and beats any inclusion wording."
  - seat: claude-opus-5 (same session, acting on a live measurement rather than a review)
    objection:
      "The widened exemption list would have VETOED wa_outbox row 385, which is a CORRECT answer: one
      all-in total followed by 'This includes our service fee plus the IDR 9.5m government fee'. The list
      knew 'is included' but not 'all-in' nor the bare verb 'includes'."
    status: CONFIRMED
    resolution:
      "Both live texts added as innocence tests. Then adding bare 'mencakup' to cover them REGRESSED the
      guilt case — row 379 says the PNBP 'mencakup visa, ITAS', which describes what the levy BUYS, not
      that it sits inside the price — and the reproduced-defect test went red and caught it. Only the bound
      form 'sudah mencakup' survives. This is the entire reason a guard ships with a guilt case."
  - seat: "codex gpt-5.6-sol xhigh (refuter, on the coupled PR #5346)"
    objection:
      "The two guards together leave a client price question with almost no legal answer: the split shape
      fails this veto, the all-in shape fails the anchoring veto, and the only survivor passes because
      'IDR 26.5m' canonicalizes to 265 — under the veto floor. It passes by blindness."
    status: CONFIRMED
    resolution:
      "This PR was DISARMED for six hours rather than merged, #5346 was built, refuted three times and
      merged first (2026-08-30T20:26:41Z), and the sequencing receipt above re-measures the matrix with
      both guards live. Merging this alone would have converted a wrong answer into no answer."
  - seat: "kimi-code/k3 (refuter, dispatched on this diff, no brief)"
    objection:
      "FIX-FIRST, 12 findings. The decisive pair are both false POSITIVES on COMPLIANT answers, and they
      are one defect twice: the separation list mixed already-negative forms (`tidak termasuk`,
      `not included` — they contain their own negator and MEAN separation) with positively-asserted
      claims (`terpisah`, `billed separately` — they reverse when negated). Since separation is checked
      before inclusion and beats it, the most natural compliant sentence in the bot's register was the
      one shape guaranteed to fail: `tidak perlu membayar PNBP secara terpisah - total Rp15.000.000
      sudah mencakup semua biaya pemerintah`, and its English twin `you will not be billed separately
      ... already included`."
    status: CONFIRMED
    resolution:
      "Both reproduced by direct measurement on the shipped code — they returned ['pnbp',
      'biaya_pemerintah'] and ['pnbp']. Cured by splitting the separation list in two and
      negation-testing only the positive forms, within 40 characters AND within the same sentence; the
      sentence bound is what keeps `Kami tidak bisa memberikan diskon. PNBP Rp9.500.000 dibayar
      terpisah.` guilty, because that negator belongs to the discount. Four tests added in both
      directions, and the guilt case (row 379) and innocence case (row 385) — both real production
      answers rather than fixtures — are unchanged. The reviewer's remaining ten findings are COVERAGE
      GAPS this change inherits rather than defects it introduces: bare `termasuk`/`included` absent
      from the inclusion list, `di luar paket` and `payable directly` absent from separation, marker
      inflection, non-ASCII space variants past U+00A0. A measurement pass on the four cheapest of them
      showed two TRADE one error class for another — bare `termasuk` alone cures a false positive and
      opens a false negative, and `dibayar langsung` added to separation is itself negation-blind — so
      they go to the typed operand contract (PR #5352), not a fifth predicate round here. Agent PR
      Contract rule 8."
