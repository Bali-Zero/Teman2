task_id: xendit-quarantine-alarm
gear: 3
l_level: L2
gate_class: opus
objective: |
  Give `garuda_payment_inbox.outcome = 'quarantined'` a reader, an alarm,
  and a recorded cause.

  GROUND FIRST — the dispatch was WRONG, and the correction is the first
  deliverable. This lane was dispatched to build "an append-only webhook
  event ledger and a reconciliation path" for the Xendit payment flow, on
  a Beyond-SOTA lane finding (F2/B5). That claim is FALSE on origin/main
  @ 22dabc1166 and no part of it was built. Measured, each with the
  command in the pack's receipts: the append-only ledger exists
  (`garuda_payment_inbox` + `garuda_order_journal`, migration 284, the
  journal append-only ENFORCED BY A DB TRIGGER that RAISEs on UPDATE and
  DELETE); the inbox INSERT is already the first statement inside
  `handle_paid_event`'s transaction, so events are recorded before they
  are acted on; idempotency is already structural
  (`ON CONFLICT (provider, provider_event_id) DO NOTHING` -> `OP-09`);
  and reconciliation already exists AND IS ARMED
  (`reconciliation.py::reconcile_expired_checkouts`, called from
  `main_api.py:396` under a `pg_try_advisory_lock`). Building the
  dispatched thing would have duplicated three tables and an armed sweep.

  The REAL defect, invisible under that framing and found by measuring
  instead: `git grep -n "FROM garuda_payment_inbox" origin/main` returns
  exactly ONE line in the entire tree, and it is a test. Meanwhile
  `quarantined` is SET at five sites in `repository.py` (389, 406, 540,
  580, 649). Five writers, one reader, and the reader is a test.

  What that means in money: a quarantined row is not an error we
  swallowed. It is an AUTHENTIC, signature-valid provider callback we
  DELIBERATELY REFUSED TO ACT ON — unreconcilable to exactly one order,
  or claiming a PAID event for the wrong amount.
  `garuda_orders_router.py::receive_payment_webhook` is declared
  `status_code=204` and discards the handler's return value, so Xendit
  records a successful delivery and STOPS RETRYING. The provider moved
  money, we declined to move our state to match, and nothing paged
  anyone.

  THE REUSABLE FINDING, which is why this is worth a Gear-3 record: this
  is the THIRD instance of write-only state in ONE subsystem. The
  2026-08-28 cure armed `count_undrained` and `reconcile_expired_checkouts`
  in the SAME TICK and left this one behind — `outbox_alarm.py`'s own
  docstring opens with "A comment is not a caller. Superscar #2."
  Generalisation: curing one instance of "nobody reads this" does not
  cure its siblings. When you find a write-only state, enumerate every
  other state the same subsystem persists and check each one in the same
  turn.

  Gear 3 by PATH, not by blast radius: the diff touches
  `apps/backend-rag/backend/db/migrations_v2/`, a hot-zone path. The floor
  is deterministic and CI-recomputed, not the author's choice — recomputed
  locally in the pack's receipts and independently by the
  `Harness floor recompute` job, both 3.
constraints:
  - "SHIPS DARK. No flag flipped, no live Xendit key needed by anything
    here. `GARUDA_PUBLIC_ENABLED` is untouched."
  - "PII boundary absolute. The ledger table holds no applicant columns
    (those live on `garuda_orders`) and this code never joins to it. The
    page carries counts, the closed reason vocabulary, provider event ids
    and order ids — never a name, email, phone or passport. Pinned by
    `test_the_quarantine_page_carries_no_pii`, which feeds
    applicant-shaped poison through the only string-carrying fields and
    asserts nothing ELSE reaches the text, i.e. the alarm cannot have
    grown a lookup."
  - "No hardcoded Telegram credentials. Both `TELEGRAM_BOT_TOKEN` and
    `TELEGRAM_OWNER_CHAT_ID` are read from the environment BY NAME; no
    token and no chat id appears anywhere in this diff. (119 hardcoded
    fallbacks in this repo once pointed at a mailbox nobody can open —
    this is not the 120th.)"
  - "The reason vocabulary is CLOSED, enforced by a CHECK constraint. An
    open one would let an unbounded string — and one day PII — into a
    column the alarm prints verbatim."
  - "The alarm must not be able to kill the queue it watches. Its own
    try/except, separate from the outbox alarm's, so a failed inbox read
    takes down neither the drain nor the OP-04 sweep."
  - "generator != grader: this lane does NOT post its own gate verdict.
    The Gear-3 verdict is for an independent adjudicator dispatched by the
    team-lead."
acceptance:
  - "A quarantined row reaches a human: `count_quarantined` sees it and
    `QuarantineAlarm.decide` returns a page naming the cause and the ids
    needed to act (`test_a_quarantined_row_is_seen`,
    `test_the_page_carries_the_ids_and_the_cause_needed_to_act`)."
  - "The alarm shuts up when it should: clean window, unchanged standing
    condition inside the hour, and the quiet notice announced exactly once
    (`test_an_empty_inbox_is_clean`,
    `test_committed_and_received_rows_are_not_a_condition`,
    `test_the_same_condition_does_not_page_again_within_the_hour`,
    `test_the_quiet_notice_is_announced_exactly_once`)."
  - "An UNDELIVERED page does not consume the suppression window
    (`test_a_page_that_was_never_delivered_does_not_silence_the_next_hour`)."
  - "The scheduler actually calls the reader — the arming assertion, since
    the whole defect was a reader nobody called
    (`test_the_periodic_tick_reads_the_payment_quarantine`)."
  - "Every guarantee above is falsifiable: a mutation that removes it
    turns a named test RED, replayed against the shipped code (four
    mutations in the pack's receipts, each red on exactly the intended
    test)."
  - "The real write path records the real cause: the existing
    `test_paid_event_with_wrong_amount_is_quarantined_never_marks_paid`
    now also asserts `quarantine_reason == 'amount_mismatch'`."
