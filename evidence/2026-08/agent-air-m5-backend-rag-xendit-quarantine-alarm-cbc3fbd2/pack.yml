diff:
  net_lines: >-
    12 files, +1584/-16, measured by
    `git diff --numstat origin/main HEAD`. Over the ~400-line guidance and
    declared as such rather than hidden: roughly 595 of those lines are
    tests (test_quarantine_alarm.py 320, test_payment_inbox_watch.py 275)
    and 97 are the migration's header comment, while this evidence pair and
    the PENDING-ARMS rows account for most of the rest. It remains ONE
    concern — a refused payment callback must reach a human, with enough to
    act on.
  behaviour_change: >-
    Adds a reader, an alarm and a `quarantine_reason` column. The five
    quarantine decision POINTS are unchanged — same branches, same
    returns, same OP-F03 — they now record WHICH cause fired. The failure
    and refund paths previously recorded two genuinely different incidents
    ("no such checkout session" and "the order's state does not admit this
    event") identically; they now distinguish them. Nothing else in the
    payment path is touched, and no flag is flipped.
