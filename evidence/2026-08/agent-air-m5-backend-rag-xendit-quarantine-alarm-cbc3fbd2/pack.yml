seat_diversity_note: >-
  Exactly ONE build lane, so the D3 floor does not fire (it applies to
  packs declaring >= 2 build lanes). Stated rather than omitted: this was
  a single-session backend change with a real Postgres to measure against.
  The REVIEW side is a different matter and is no longer single-family: a
  cross-family council of two seats (kimi-code/k3 and codex-gpt-5.6-sol)
  reviewed the frozen diff and is journalled in `council_run` above. It
  found two HIGH defects in this lane's own code that four rounds of the
  author's own mutation testing had missed, because every one of those
  mutations lived inside the class while both defects lived in the wiring
  and the transport above it.
diff:
  net_lines: >-
    MEASURED_PLACEHOLDER, measured by
    `git diff --numstat origin/main...HEAD` and pasted verbatim from
    `evidence_pack_lint.py --print-measured`. Over the ~400-line guidance
    and declared as such rather than hidden: the great majority is tests,
    the migration's header comment, this evidence pair and the PENDING-ARMS
    rows. Deliberately NO secondary per-file counts here — the countable
    claims lint reads every countable phrase in this field, not just the
    headline, so a numeric gloss beside the measured value is one more
    thing that goes stale on the next commit. It remains ONE concern — a
    refused payment callback must reach a human, with enough to act on —
    and the Gear-3 gate ruled it one concern too.
  behaviour_change: >-
    Adds a reader, an alarm and a `quarantine_reason` column. The five
    quarantine decision POINTS are unchanged — same branches, same
    returns, same OP-F03 — they now record WHICH cause fired. The failure
    and refund paths previously recorded two genuinely different incidents
    ("no such checkout session" and "the order's state does not admit this
    event") identically; they now distinguish them. Nothing else in the
    payment path is touched, and no flag is flipped.
