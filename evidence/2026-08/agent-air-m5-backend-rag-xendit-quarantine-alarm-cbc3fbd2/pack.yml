dissent:
  - seat: "Harness floor recompute (CI, deterministic)"
    objection: >-
      This PR touches `apps/backend-rag/backend/db/migrations_v2/` — a
      hot-zone path — so it floors at Gear 3 regardless of the change being
      one additive nullable column with no data migration and no existing
      column altered.
    status: CONFIRMED
    note: >-
      Verified independently rather than accepted on a FAIL message alone:
      recomputed the floor from this PR's own changed-file list via
      `evidence_pack_lint.py --print-floor` and got 3 (receipt above).
      Answered by supplying this brief+pack at the per-branch evidence path
      resolved by `scripts/ci/evidence_paths.py`.
  - seat: "session, self-check on scope (the honest version, because the first answer was wrong)"
    objection: >-
      Adding a migration to a PR dispatched as "an alarm" is scope creep,
      and Agent PR Contract rule 1 exists to stop exactly that.
    status: PLAUSIBLE
    note: >-
      Not retracted, because it is a real cost and the reader should weigh
      it rather than be told it was fine. The reason it was done anyway:
      without `quarantine_reason` the three causes inside
      `handle_paid_event` alone are indistinguishable in the schema, so the
      alarm could only emit "N quarantined, cause unknown" — which is the
      half-cure this subsystem has now produced three times, and it could
      not satisfy the explicit instruction that the page name the amount
      mismatch when that is the cause. The alternative considered and
      rejected was shipping the alarm first and the reason second: that
      lands a page nobody can act on, and the second PR would touch the
      same five call sites again. The cost is declared in `diff.net_lines`
      rather than hidden.
  - seat: "session, self-check on the windowed count"
    objection: >-
      Windowing the page at 24h means a quarantined payment that nobody
      handles goes SILENT after a day — the alarm stops mentioning real
      money that is still unreconciled.
    status: CONFIRMED
    note: >-
      Confirmed, not argued away, and the design answers it only partly.
      Unwindowed, the population only ever grows and no tooling lets a
      human clear a row, so the alarm would page hourly forever after the
      first quarantine and be muted within a day — a muted alarm is worse
      than a windowed one. Two mitigations are in the shipped code: the
      LIFETIME total travels with every message including the quiet one,
      so history can never read as "none at all"; and the quiet notice
      deliberately never says "recovered", because a row leaves the window
      by ageing out rather than by being handled. The real fix is an
      acknowledgement column, which is a schema change with its own review
      — the honest limitation is stated in `payment_inbox_watch.py`'s
      module docstring rather than papered over.
    resolution: >-
      THIS DISSENT WAS THE ONLY CONFIRMED ONE IN THE PACK WITH NO ROW, NO
      OWNER AND NO ARMING STEP, while the other CONFIRMED one had all three
      — the pack performing rigor at exactly one point (Gear-3 gate). Worse,
      the docstring it pointed at CLAIMED the limitation was "Ledgered in
      PENDING-ARMS" when no such row existed. BOTH council seats then
      confirmed the dissent independently and both called the defence above
      a FALSE DICHOTOMY: the third option needs no schema change and no
      acknowledgement column — a second, much longer stale timer keyed on
      `lifetime`, which already travels in every snapshot. Measured
      consequence, now in the docstring instead of a vague "goes silent":
      26 hourly pages, then permanent silence on a row still unhandled.
      A real row exists (search PENDING-ARMS for `REQUIRED FOLLOW-UP: the
      lifetime digest`), owner named, arming step concrete, marked REQUIRED
      rather than optional. The WINDOWING ITSELF stays — it is right; what
      was wrong was the claim of having ledgered its cost.
  - seat: "kimi-code/k3 (cross-family council, review seat)"
    objection: >-
      `_send_quarantine_alarm` returns None on every path while the caller
      runs `confirm_sent` unconditionally, so a page Telegram REFUSED still
      consumes the hour-long suppression window. The decide/confirm_sent
      discipline, heavily documented and tested at unit level, is voided by
      the wiring.
    status: CONFIRMED
    note: >-
      Cured in this diff. The helper now returns whether the page landed and
      the caller gates on it, with a guilt/innocence PAIR rather than a
      single test: "always return False" would satisfy a guilt test alone
      while turning a mute alarm into a spamming one, and an operator mutes
      a spamming alarm, so the money state goes dark by a different road.
      All three mutations the gate named (delete the send, delete
      `confirm_sent`, force `page = None`) now die to a named test. Not one
      of the author's own four mutations could have caught this: every one
      of them lived inside the class, and the defect lived above it.
  - seat: "codex-gpt-5.6-sol (cross-family council, review seat)"
    objection: >-
      The page interpolates reasons and identifiers unescaped while the
      transport hardcodes `parse_mode="Markdown"`. Every `quarantine_reason`
      contains an underscore, so Telegram answers 400 "can't parse entities"
      — and `send_telegram_message` treats 4xx as NON-retryable. Every page
      this alarm produces would have been dropped.
    status: CONFIRMED
    note: >-
      The most serious finding of the round and cured in this diff: an alarm
      built to cure "nobody reads this state" would itself have delivered
      nothing. The cure is not novel — this subsystem had ALREADY solved it
      in `outbox_handlers` (ids in backtick code spans, backticks stripped
      to a visible marker, free text escaped) and carries a Kimi K3 scar
      from 2026-08-28 for the backtick-breaks-the-span case. This module
      simply failed to reuse it. Square brackets around the order id are
      gone too: `[` is reserved in its own right. Mutation-proved by making
      the escaper a no-op — both new tests go RED, and only those two.
  - seat: "session, self-check on duplicating OutboxAlarm"
    objection: >-
      `QuarantineAlarm` re-implements `OutboxAlarm`'s state machine instead
      of extracting a shared base — ~60 lines of duplicated discipline, and
      the two can now drift.
    status: RETRACTED
    note: >-
      Investigated rather than assumed innocent. The thing that MUST not
      drift is the re-alert cadence, and that is shared for real:
      `REALERT_SECONDS` is IMPORTED from `outbox_alarm`, not re-declared.
      What differs is the condition type, the vocabulary and every line of
      message text, so a shared base would have been a parameterised
      template rather than a reuse. Against that: `OutboxAlarm` is the LIVE
      money-page for the outbox queue, and rewriting it inside a PR about
      the payment inbox is a second concern and a real regression risk for
      a dozen saved lines. The reasoning is recorded in the new module's
      docstring so the next reader can overturn it deliberately.
  - seat: "session, on the two residuals this lane did NOT fix"
    objection: >-
      Two defects were found and left open: `outcome = 'received'` is
      unreachable as a persisted state, and "received but never processed"
      is undetectable. Leaving known defects open is how they become
      permanent.
    status: CONFIRMED
    note: >-
      Both are ledgered in `.claude/skills/modus/PENDING-ARMS.md` with this
      session as owner, and the second row leads with "this is BY DESIGN,
      not an oversight — read this row before fixing it": the inbox INSERT
      shares the handler's transaction, which is precisely what buys the
      provider a clean retry, so a naive "fix" would be a regression. Its
      arming step is therefore to MEASURE whether the failure ever occurs
      once GARUDA is live, then decide — not to build a detector whose own
      orphan class would be unbounded.
