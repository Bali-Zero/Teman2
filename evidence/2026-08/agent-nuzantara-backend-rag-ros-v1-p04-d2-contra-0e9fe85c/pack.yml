receipts:
  - claim: >-
      Migration integer 279 is genuinely free at bind time: origin/main's highest present
      migrations_v2 file is 278 (278_reassign_orphaned_clients_setup_team.sql); 279 does not
      exist anywhere on origin/main
    cmd: >-
      git fetch origin main && git rev-parse origin/main ; git ls-tree -r --name-only
      origin/main -- apps/backend-rag/backend/db/migrations_v2/ | sort | tail -3 ; git cat-file
      -e origin/main:apps/backend-rag/backend/db/migrations_v2/279_research_os_contract_core.sql
    exit: 128
    ts: "2026-08-23T20:52:58Z"
    seat: "session (pro)"
    # exit 128 is git's own code for "path exists on disk (this worktree) but not in
    # origin/main" -- the TRUTHFUL, non-fabricated result of the collision check: it proves
    # absence on origin/main, it does not mean the check itself failed. Reported as measured,
    # not normalized to a friendlier-looking 1.
  - claim: "Zero of the (17, including this PR) open PRs other than #4740 itself touch anything under migrations_v2/"
    cmd: 'gh pr list --state open --limit 200 --json number,files | python3 -c "...filter migrations_v2 hits, exclude 4740..."'
    exit: 0
    ts: "2026-08-23T20:52:58Z"
    seat: "session (pro)"
  - claim: >-
