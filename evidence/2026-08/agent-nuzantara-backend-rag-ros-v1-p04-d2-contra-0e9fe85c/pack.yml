    +277/-0, 1 file -- the PR's actual product diff (apps/backend-rag/backend/db/migrations_v2/
    279_research_os_contract_core.sql), measured this session via `git diff --numstat` against
    the merge-base with origin/main (32e38dc701dd3f1d15f4b96593c89f220f31b733). CORRECTION to
    this lane's own prior report to the conductor: an earlier message claimed the PR also
    "removed packages/research-os-core/db/research_os_contract_core.sql" and that git recognized
    an 81%-similarity rename -- that rename was real INSIDE this worktree's local history (the
    draft file existed on this branch's own prior commits and was git-rm'd), but that path was
    NEVER on origin/main at all, so against the PR's actual base there is no deletion in the
    diff -- confirmed by the conductor's independent pass and re-verified fresh by this lane in
    this same turn (`git diff --numstat <merge-base> HEAD` shows exactly one changed file). The
    PR is correctly +277/-0, one file. This pack.yml and evidence/brief.yml are this revision's
    own addition on top of that unchanged product diff (evidence-only, per harness-v2 §5's own
    convention of describing product diff separately from the evidence pair that describes it).
  behaviour_change: >-
    New database object only: one additive migration (apps/backend-rag/backend/db/migrations_v2/
