    cmd: "python3 scripts/lint_migration_numbers.py"
    exit: 0
    ts: "2026-08-23T21:04:24Z"
    seat: "session (pro)"
  - claim: "279_research_os_contract_core.sql carries the mandatory -- === ROLLBACK === marker (W42 lint), same as all 157 post-cutoff migrations"
    cmd: "python3 scripts/lint_migration_rollback.py"
    exit: 0
    ts: "2026-08-23T21:04:24Z"
    seat: "session (pro)"
  - claim: >-
      Target database is genuinely PostgreSQL 15 (15.19, Debian), not the shared local PG17 on
      :5432 and not the :15432 flyctl production proxy -- isolated Docker container started by
      this session on 127.0.0.1:5433
    cmd: 'docker run -d --name ros-p04-d2-pg15-ev -p 5433:5432 ... postgres:15 ; psql -h 127.0.0.1 -p 5433 -U postgres -d ros_test -c "SELECT version();"'
    exit: 0
    ts: "2026-08-23T20:53:05Z"
    seat: "session (pro)"
  - claim: "squawk --pg-version=15.0 (this repo's exact CI exclude-flag set) reports 0 issues on 279_research_os_contract_core.sql"
    cmd: "squawk --pg-version=15.0 --exclude=<12 repo-standard rules> apps/backend-rag/backend/db/migrations_v2/279_research_os_contract_core.sql"
    exit: 0
    ts: "2026-08-23T20:53:05Z"
    seat: "session (pro)"
  - claim: >-
      Forward DDL (split at the -- === ROLLBACK === marker with migration_base.py's own regex)
      applies clean: CREATE TABLE, COMMENT, 2x CREATE INDEX, CREATE FUNCTION, CREATE TRIGGER,
      all present afterward (\d, pg_indexes, pg_trigger all confirm)
    cmd: "psql -h 127.0.0.1 -p 5433 -U postgres -d ros_test -v ON_ERROR_STOP=1 -f forward.sql ; psql ... -c '\\d public.research_os_objects' ; psql ... -c 'SELECT indexname FROM pg_indexes ...' ; psql ... -c 'SELECT tgname FROM pg_trigger ...'"
    exit: 0
    ts: "2026-08-23T20:53:24Z"
    seat: "session (pro)"
  - claim: >-
      Presence-preserving JSONB null semantics hold: a row inserted with an explicit
      nullable_field: null key reports payload ? 'nullable_field' = true and payload->
      'nullable_field' = null (key present, value null -- not absent)
    cmd: >-
      INSERT INTO research_os_objects (...) VALUES ('workflow_run', 'synthetic-wfr-ev-0001', ...,
      '{"workflow_run_id":"synthetic-wfr-ev-0001","note":"synthetic evidence-leg row",
      "nullable_field":null}'::jsonb); SELECT payload ? 'nullable_field', payload->
      'nullable_field' FROM research_os_objects WHERE object_id='synthetic-wfr-ev-0001';
    exit: 0
    ts: "2026-08-23T20:53:32Z"
    seat: "session (pro)"
  - claim: "A malformed object_kind ('BadKind!') is rejected by CHECK research_os_objects_kind_format"
    cmd: >-
      INSERT INTO research_os_objects (object_kind, ...) VALUES ('BadKind!', 'x-ev', repeat('a',
      64), 'research-os/v1.0.0', '{}'::jsonb);
    exit: 1
    ts: "2026-08-23T20:53:34Z"
    seat: "session (pro)"
  - claim: "A duplicate object_id ('synthetic-wfr-ev-0001', already inserted above) is rejected by the UNIQUE constraint (CONTRACTS.md sect1.1 global uniqueness)"
    cmd: >-
      INSERT INTO research_os_objects (object_kind, object_id, ...) VALUES ('claim',
      'synthetic-wfr-ev-0001', repeat('b',64), 'research-os/v1.0.0', '{}'::jsonb);
    exit: 1
    ts: "2026-08-23T20:53:34Z"
    seat: "session (pro)"
  - claim: "UPDATE on research_os_objects is rejected by the append-only trigger: 'research_os_objects is append-only'"
    cmd: "UPDATE research_os_objects SET tenant='hacked' WHERE object_id='synthetic-wfr-ev-0001';"
    exit: 1
    ts: "2026-08-23T20:53:35Z"
    seat: "session (pro)"
  - claim: "DELETE on research_os_objects is rejected by the same append-only trigger"
    cmd: "DELETE FROM research_os_objects WHERE object_id='synthetic-wfr-ev-0001';"
    exit: 1
    ts: "2026-08-23T20:53:35Z"
    seat: "session (pro)"
  - claim: "The rollback DDL (DROP TRIGGER, DROP FUNCTION, DROP TABLE, all IF EXISTS) applies clean"
    cmd: "psql -h 127.0.0.1 -p 5433 -U postgres -d ros_test -v ON_ERROR_STOP=1 -f rollback.sql"
    exit: 0
    ts: "2026-08-23T20:53:38Z"
    seat: "session (pro)"
  - claim: >-
      Schema state after rollback is byte-identical to schema state before apply (pg_dump
      --schema-only, before vs after, diffed with pg_dump 15's random per-invocation
      \restrict/\unrestrict anti-tamper tokens stripped -- those tokens are dump-tool noise, not
      schema content). Belt-and-suspenders: public schema has exactly 0 tables and 0 functions
      post-rollback
    cmd: >-
      pg_dump --schema-only ... > after.sql ; grep -v '^\\restrict\|^\\unrestrict' before.sql >
      before.norm.sql ; grep -v same after.sql > after.norm.sql ; diff before.norm.sql
      after.norm.sql ; SELECT (SELECT count(*) FROM pg_tables WHERE schemaname='public'),
      (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE
      n.nspname='public');
    exit: 0
    ts: "2026-08-23T20:53:42Z"
    seat: "session (pro)"
  - claim: >-
      This directory's own slug (agent-nuzantara-backend-rag-ros-v1-p04-d2-contra-0e9fe85c) was
      independently regenerated by this lane, not copied from the conductor's message, and
