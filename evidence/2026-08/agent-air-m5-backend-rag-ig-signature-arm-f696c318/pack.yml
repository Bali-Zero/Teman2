      PR #5013 touches `apps/backend-rag/backend/app/core/config.py`, which is hot-zone by path —
      floors at Gear 3 regardless of the diff's small size (6 files, +203/-25) — and the PR shipped
      with no `evidence/brief.yml`/`evidence/pack.yml` in its own diff, so the check correctly
      FAILED with "this diff touches a hot-zone path (deterministic floor 3) but carries no
      evidence/brief.yml".
    status: CONFIRMED
    note: >-
      Verified independently, not accepted on the FAIL message alone: recomputed the floor from
      the PR's actual changed-file list via `evidence_pack_lint.py --print-floor` and got 3,
      matching the check. Answered here by supplying both files, never by editing the check
      (CLAUDE.md Agent PR Contract rule 3 precedent).
  - seat: "session (this evidence-authoring task), against its own first instinct"
    objection: >-
      The PR body already reports "Mutation check (see above)" — quoting that verbatim without
      re-running it would have been citing a tool output this turn never actually executed, the
      anti-hallucination failure mode CLAUDE.md §6 exists to prevent, applied to a prior session's
      claim rather than to memory.
    status: RETRACTED
    note: >-
      Re-ran the mutation probe independently in this task's own turn (receipts above) rather than
      trusting the PR body's report. Result matched: the pinning test went red with the expected
      failure, file restored clean. Retracted because the PR body's claim held up under a fresh,
      independent execution.
