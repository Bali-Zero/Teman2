plan_ref: |
  docs/plans/2026-08-29-beyond-sota-craft-wave/L12-data-schema-migrations.md, PR-3 (second half).
  PR-3 was split: #5260 shipped the Level-5 verifier `scripts/ci/restore_drill_verify.py`; this PR
