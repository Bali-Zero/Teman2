      asserted `"ON_ERROR_STOP=1" in body` over the whole step body; that literal occurs FIVE times
      there — once on the executing `psql "$DSN" -v ON_ERROR_STOP=1` line, and four times in prose
      (three `#` comments plus an `echo "::error title=Restore aborted (ON_ERROR_STOP=1)::…"`).
    cmd: |
      perl -pi -e 's{psql "\$DSN" -v ON_ERROR_STOP=1}{psql "\$DSN" -v ON_ERROR_STOP=0}' restore-drill.yml
      # comments deliberately untouched; then pytest
    result: |
      BEFORE the fix: 5 passed — the flip was invisible.
      AFTER  the fix: 1 failed, 4 passed, with 4 comment mentions of ON_ERROR_STOP=1 verified still
      present in the file at the moment of the run.
    exit: 0
    ts: "2026-08-30T01:35:00Z"
    seat: claude-opus-5 (gate)
  - claim: |
      THE FIRST FIX COULD FALSE-RED ON A COMMENT — the mirror of the bug it cured. Its
      belt-and-braces `assert "ON_ERROR_STOP=0" not in body` scanned comments too, green today only
      because the existing comment reads `# ON_ERROR_STOP=1 (was 0)` rather than `# was ON_ERROR_STOP=0`.
    cmd: |
      append `# historical note: this drill used to run with ON_ERROR_STOP=0` INTO the run: body,
      then pytest, both before and after scoping the assertion to _executable_lines()
    result: |
      unscoped: 1 failed, 4 passed — a cosmetic reword of non-load-bearing prose fails the build.
      scoped:   5 passed. Restore cmp -s byte-identical; re-innocence 5 passed.
    exit: 0
    ts: "2026-08-30T01:52:00Z"
    seat: claude-opus-5 (gate)
  - claim: |
      THE SURROUNDING GUARDS ARE ARMED — mutation battery re-run by the gate on the PRODUCTION
      workflow, every restore from a `cp` backup and verified byte-identical with `cmp -s`, never
      `git checkout --` (W125). PYTHONDONTWRITEBYTECODE=1 and `-p no:cacheprovider` throughout (W121).
    cmd: cp backup -> mutate -> pytest -> cp restore -> cmp -s, per guard
    result: |
      reintroduce `|| true` on the log-tail line ......... 2 red
      RESTORE_RC=${PIPESTATUS[0]} (gunzip's rc) .......... 1 red
      drop `exit "$VERIFY_RC"` .......................... 1 red
      let TG_RC gate the exit in success-notify ......... 1 red
      Baseline 5 passed. Restore byte-identical after every one.
    exit: 0
    ts: "2026-08-30T01:30:00Z"
    seat: claude-opus-5 (gate)
  - claim: |
      A MUTATION THAT DOES NOT APPLY IS INDISTINGUISHABLE FROM ONE THAT SURVIVES, and this session's
      own harness produced two false survivors before the gate noticed. `perl -0pi` slurps and,
      without `/g`, replaces the FIRST occurrence — which in this codebase is usually the comment or
      docstring that EXPLAINS the expression, not the expression.
    cmd: grep for the mutated text on the EXECUTABLE line before believing any pytest result
    result: |
      `ON_ERROR_STOP=1` non-global flip edited a COMMENT at line 129 and left the psql call at 168
      intact -> "5 passed" read as "guard present". Only after asserting the mutation LANDED did the
      real defect become visible. `cmp -s` says "the file changed"; it does not say "the thing you
      meant to change, changed".
    exit: 0
    ts: "2026-08-30T01:33:00Z"
    seat: claude-opus-5 (gate)
  - claim: |
      TWO SEATS, TWO ROUNDS, AND THE CURE ITSELF HAD TO BE CURED. Round 1 found twelve defects
      including a BLOCKER neither the implementer nor the gate had seen: the corpus was executed by
      NOTHING that can go red. Round 2, briefed to hunt what the CURE broke, found that the gunzip
