notes: |
  What this PR is really about is visible in its own history: a diff whose purpose is to stop a
  restore drill from swallowing its own exit code shipped a test suite that swallowed the evidence
  for its most important claim — and the guard was held up by the sentence explaining why the guard
  mattered.
