dissent:
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      BLOCKER — `_PIPE_STATUSES` captures both statuses and only index 1 is read. A truncated .gz
      makes gunzip exit non-zero while psql consumes the valid prefix and exits 0; the drill reports
      SUCCESS on an incomplete restore.
    disposition: |
      ACCEPTED, and independently found by the OTHER seat in the same round. Kimi qualified it better
      than Codex — mid-stream truncation usually leaves a partial statement psql rejects anyway, so
      the silent case needs truncation on a statement boundary — and Kimi's narrower framing is what
      went into the comment. The louder claim would have invited someone to delete the guard on its
      authority.
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      BLOCKER — the new corpus is not wired into blocking PR CI. A PR flipping ON_ERROR_STOP back to
      0 fails the test locally and nowhere else, and merges green.
    disposition: |
      ACCEPTED — the sharpest finding of round 1, and invisible to the gate because it had run the
      tests by hand and they passed. A PR whose subject is a drill that could not fail was shipping a
      guard that could not fail. New dedicated blocking workflow, house pattern.
  - status: CONFIRMED
    seat: kimi-code/k3
    objection: |
      HIGH — nothing pins the `set +e` brackets around the RESTORE pipe. Delete that one line and a
      failing psql under errexit kills the step instantly: the capture never runs, the tail never
      prints, the ::error is never emitted — W101 recurring, with all tests green.
    disposition: |
      ACCEPTED. The gate's own brief had asked only for the TELEGRAM brackets; this is the gap that
      briefing missed. All four capture sites are now pinned.
  - status: CONFIRMED
    seat: kimi-code/k3
    objection: |
      MEDIUM — the psql finder keys on the literal `psql "$DSN"`, which is both an under-match (a
      refactor away from $DSN plus a dead debug line reads green) and an over-match (an added
      legitimate flagless psql reads red).
    disposition: |
      ACCEPTED — two defects in the gate's OWN morning fix, pointing opposite ways, cured by one
      structural change: identify the psql that is the captured pipeline's second stage. Both
      directions are now probes, and the over-match probe (16 PASSED) is in the receipts above.
  - status: CONFIRMED
    seat: kimi-code/k3
    objection: |
      LOW — a comment claims `shell: bash` is Actions' default `bash -e {0}` and that pipefail is not
      part of it.
    disposition: |
      ACCEPTED — factually wrong, verified. An explicit `shell: bash` runs
      `bash --noprofile --norc -eo pipefail {0}`; `bash -e {0}` is the default only when no shell is
      declared, and this step declares one. No behavioural defect (`-u` is genuinely new) but a wrong
      "measured, not assumed" rationale is worse than none. Corrected.
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      ROUND 2, MEDIUM — the cure's gunzip check misclassifies: gzip exit 2 is a documented WARNING
      (trailing garbage, output complete) and SIGPIPE 141 means the consumer died first.
    disposition: |
      ACCEPTED and fixed — see the receipt above for the measured matrix. THE TWO SEATS DISAGREED:
      Codex called failing on exit 2 a false RED; Kimi called it "defensible fail-loud, noted but not
      a finding". It still fails, because for a BACKUP drill an anomalous archive is worth surfacing,
      but the message no longer claims truncation.
  - status: CONFIRMED
    seat: kimi-code/k3
    objection: |
      ROUND 2 — the adjacency pins use CONTAINMENT, so splicing `echo debugging \\` between the
      pipeline and the capture leaves all five assertions passing while the assignment never executes
      and `set -u` aborts the drill. Tests green, drill broken. Kimi EXECUTED this.
    disposition: |
      CONFIRMED, NOT CURED — SUSPENDED under the depth-1 rule with a written spec
      (research/operations/specs/W-restore-drill-wiring-harness-evasions.md), which carries this
      reproduction, the `\\`-join false-RED beside it, the proposed fixes, and the attacks round 2
      tried and COULD NOT break. The battle plan is explicit: if the correction is itself wrong, the
      surface is under-specified — write the spec, do not open the third PR. Branch stays alive.
tests: |
  5 passed (scripts/tests/test_restore_drill_workflow_wiring.py). Four mutations re-run by the gate
  on the production workflow; the executable-line-only flip goes red where it previously did not,
  and a comment-append probe stays green where the intermediate fix would have gone red.
static: |
  actionlint on the changed workflows rc=0 (run on the sibling H3 PR's tree in the same session for
