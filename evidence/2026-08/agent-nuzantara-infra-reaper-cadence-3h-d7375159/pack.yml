residual_risks:
  - "RECIDIVA DEL DIFETTO CHE QUESTA PR CURA, trovata sul commit già pubblicato.
    Il difetto ereditato è un doppio trattino letterale dentro il commento XML,
    che rende il file illeggibile a plistlib. L'ho curato, ho preso la ricevuta,
    e poi ho scritto DUE volte nello stesso header un nome di flag nella sua
    forma trattata — una recependo un rilievo di kimi-code/k3, una nel paragrafo
    di provenienza. Il commit 1b70763, quello che è stato pubblicato e su cui la
    PR è rimasta aperta, NON parsava. La ricevuta che dichiarava il contrario era
    vera quando fu presa e falsa per l'artefatto spedito.
    PERCHÉ È SFUGGITA, ed è la parte che vale: `plutil -lint` risponde OK su un
    file che plistlib rifiuta. Le due sonde non concordano, e quella permissiva è
    quella che un autore usa per prima. La sonda giusta è plistlib, perché è
    quella che usa il consumatore reale (audit_launchd_crons.py).
    CURA APPLICATA QUI: entrambe le occorrenze rimosse, ri-verificato con
    plistlib sul contenuto finale, più un controllo che scandisce TUTTI i
    commenti invece di fermarsi al primo errore riportato dal parser; e una nota
    nell'header stesso che dice al prossimo autore di non scrivere un flag nella
    forma trattata. La cura è un TESTO, non una guardia: nulla in questa PR
    impedisce a un contributore di ricommettere la stessa forma. Se la copertura
    CI risultasse assente, la guardia è un mandato separato — non si allarga
    questa PR per costruirla."
  - "COUNCIL COMPLETO A DUE SEGGI, con un terzo irraggiungibile. kimi-code/k3 e
    tp1-qwen3.8-max hanno entrambi risposto CONCERNS in modo indipendente e
    convergente sui due rilievi sostanziali (nessuna mutua esclusione; `-ctime`
    non è tempo di creazione). Il terzo, codex-gpt-5.6-sol, resta irraggiungibile:
    `--full-auto` rimosso in codex-cli 0.149.1, il wrapper esce 2 che il suo
    stesso header documenta come 'diff vuoto'. Nessuna copertura è stata
    rivendicata per quel seggio."
  - "L'ARITMETICA NON CHIUDE, ed è il rilievo più importante dell'intero giro.
    ~40 checkout a ~1,2 GB fanno ~48 GB; il salto da ~80 GB liberi a 753 MB ne
    implica ~79. I worktree sono il contributore PIÙ GRANDE IDENTIFICATO e
    l'unico che questa PR cura, non l'intera caduta: restano ~30 GB non
    attribuiti. Ri-misurato dopo il recupero, come STATO ATTUALE e mai come
    delta notturno (nessuno aveva fotografato quei path prima): .worktrees
    41 GB su 36 directory (media 1,14 GB), ~/.ollama 49 GB, e la cartella
    autonomy di OSINT-Nexus 18 GB con uno scrittore autonomo vivo al momento
    della misura. Questi ultimi due sono il resto plausibile PER DIMENSIONE, in
    ipotesi. Un sospetto è invece ESCLUSO positivamente: /private/var/vm/sleepimage
    pesa 26 GB ma ha mtime 2026-08-18, tredici giorni prima — occupante fisso,
    non partecipante. Cura per la prossima volta, dato che la risposta onesta
    qui è 'non esisteva una linea di base': catturare un `du -sh` datato di
    questi path, così la domanda successiva si risolve per sottrazione."
  - "NESSUNA MUTUA ESCLUSIONE, ed è questa PR a moltiplicarne l'esposizione.
    Verificato: nessun `flock` in `agent_worktree_cleanup_cron.sh` né sul
    percorso `--cleanup` di `agent_start.py`. `launchd` non esegue due istanze
    della stessa label, quindi l'auto-sovrapposizione non è il pericolo; il
