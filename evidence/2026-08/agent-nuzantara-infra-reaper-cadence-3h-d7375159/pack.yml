residual_risks:
  - "IL LINT DEGLI EVIDENCE PACK NON LEGGE I PROPRI NUMERI DI TESTATA, ed è il
    buco che ha lasciato passare la ricevuta falsa qui sopra. Il giudice l'ha
    stabilito eseguendo il lint col numstat reale: torna clean, exit 0, su un
    pacchetto il cui blocco `diff` sbaglia di un ordine di grandezza. La causa è
    strutturale, non una svista di taratura: il walker delle affermazioni
    numerabili ha COUNTABLE_SUBTREES = (diff, lanes) ma ispeziona soltanto nodi
    str, e `files`/`insertions`/`deletions` sono INTERI — invisibili per
    costruzione. Vale per OGNI pacchetto di OGNI PR, non solo per questo.
    NON CURATO QUI DI PROPOSITO: toccherebbe evidence_pack_lint.py, cioè lo
    strumento che giudica ogni PR del repo, ed è esattamente il genere di
    modifica che non si infila di straforo in una PR sulla cadenza di un cron.
    È un mandato a sé, con un test di colpevolezza ovvio (un pacchetto con
    `diff.files` palesemente falso deve diventare rosso)."
  - "IL DIFETTO XML NON È COPERTO DA NULLA IN CI, misurato e non supposto. Sweep
    indipendente su tutti i 169 `infra/launchagents/*.plist*`: 168 parsano, uno
    solo fallisce ed è questo. Tre strumenti avrebbero potuto vederlo e nessuno
    lo fa: lint_plist_keepalive.py filtra con endswith('.plist') e quindi scarta
    un `.plist.example` PRIMA di tentare il parse; check_organ_conformance.py —
    l'unico che fallirebbe davvero, exit_code |= 4 — usa pathspec git `*.plist`,
    stessa esclusione; audit_launchd_crons.py non guarda affatto il repo, legge
    ~/Library/LaunchAgents (forma HOME-fork, famiglia #1).
    Conseguenza da tenere in conto quando si legge la cura: dopo questa PR il
    file è corretto, ma nulla impedisce alla prossima mano di rimetterci la
    coppia di trattini, e nessun rosso comparirà. La chiusura naturale è una
    riga sola — estendere la scoperta di quei lint a `*.plist*` invece che
    `*.plist` — e resta fuori da questa PR per la stessa ragione del punto
    precedente."
  - "RECIDIVA DEL DIFETTO CHE QUESTA PR CURA, trovata sul commit già pubblicato.
    Il difetto ereditato è un doppio trattino letterale dentro il commento XML,
    che rende il file illeggibile a plistlib. L'ho curato, ho preso la ricevuta,
    e poi ho scritto DUE volte nello stesso header un nome di flag nella sua
    forma trattata — una recependo un rilievo di kimi-code/k3, una nel paragrafo
    di provenienza. Il commit 1b70763, quello che è stato pubblicato e su cui la
    PR è rimasta aperta, NON parsava. La ricevuta che dichiarava il contrario era
    vera quando fu presa e falsa per l'artefatto spedito.
    PERCHÉ È SFUGGITA, ed è la parte che vale: `plutil -lint` risponde OK su un
    file che plistlib rifiuta. Le due sonde non concordano, e quella permissiva è
    quella che un autore usa per prima.
    PORTATA REALE, misurata e non presunta (2026-08-31): sul file rotto `plutil`
    risponde OK **e** la sua modalità extract stampa lo schedule corretto. Il
    parser Apple — quello che usa launchd — non se ne cura, quindi il cron
    avrebbe continuato a girare. A cecarsi è lo STRATO DI AUDIT in Python
    (audit_launchd_crons.py e chiunque faccia plistlib.load), non il job. La
    prima stesura di questa voce lasciava intendere una severità maggiore.
    CURA APPLICATA QUI: entrambe le occorrenze rimosse, ri-verificato con
    plistlib sul contenuto finale, più un controllo che scandisce TUTTI i
    commenti invece di fermarsi al primo errore riportato dal parser; e una nota
    nell'header. La nota è stata RISCRITTA dopo il rilievo di kimi-code/k3: la
    prima versione diceva di non nominare i flag, che è insieme troppo largo (un
    flag a trattino singolo è legale, e questo commento ne nomina diversi) e
    troppo stretto (la coppia di trattini è illegale anche come pura
    punteggiatura, e un commento non può nemmeno terminare su un trattino). Ora
    la regola è enunciata sui CARATTERI, che è ciò che XML vieta davvero.
    La cura è un TESTO, non una guardia: nulla in questa PR impedisce a un
    contributore di ricommettere la stessa forma. Se la copertura CI risultasse
    assente, la guardia è un mandato separato — non si allarga questa PR per
    costruirla."
  - "TIMESTAMP FABBRICATI IN QUESTO STESSO PACCHETTO, trovati da kimi-code/k3 al
