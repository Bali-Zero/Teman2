seat_diversity_note: >-
  ONE build lane, so D3's own floor (>=2 build lanes) does not fire and the
  field is "degraded" on that basis alone. The REVIEW side is not degraded and
  that is where the argument sits: two seats from two different families
  outside Anthropic, run independently on fresh context with the same narrow
  question, produced 13 ranked findings and agreed on 4 — two of which were
  real false-REDs that would have paged on a healthy server.

  Recorded because it is the measurement rather than the principle: the seats
  did NOT find the worst defect. `send_alert` reading `proc.returncode` instead
  of the gateway verdict — an alarm that reports delivery when the gateway
  refused — was caught by a machine gate in CI
  (`test_gateway_callers_read_the_verdict.py`), after both model reviews had
  finished. Two cross-family reviews plus a deterministic gate found strictly
  more than either alone, and the ordering matters: the gate is not a
  formality behind the models, it is a third reviewer that sees a different
  class of thing.

  NO GATE VERDICT IS RECORDED IN THIS PACK. The mandate reserves it: "Do not
  post your own gate verdict. Report to me when green and I dispatch an
  adjudicator." The `grader` block in brief.yml describes what the build lane
  put the diff through and is not a verdict.
