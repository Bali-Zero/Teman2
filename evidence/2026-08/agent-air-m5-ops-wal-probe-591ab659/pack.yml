    status: "CONFIRMED"
    resolution: >-
      Accepted and declared rather than hidden. The mandate forbade touching
      production, so the contract is pinned by fixtures and the live path is
      proven by the first scheduled run. This is precisely why the install
      ledger row REFUSES `launchctl list` as proof of arming and demands a
      state file containing a real `archived_count` and `last_archived_wal`,
      advanced by a second run — a state file holding only
      `cannot_verify_streak` means installed and BLIND, which is not armed.
