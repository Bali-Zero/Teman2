      stall check still reads the LSN and the counter, so it stays OK. Escalating those
      too would have paged three nights after every base backup, and an alarm that cries
      wolf on a routine event is how the real one gets ignored. The reasoning is in the
      code beside `EVIDENCE_ERASING_NOTES`, and the boundary is pinned from both sides
      by `test_a_stall_check_that_cannot_run_says_so` and
