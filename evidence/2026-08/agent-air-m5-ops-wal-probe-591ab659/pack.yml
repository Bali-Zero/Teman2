# STAGING PATH, NOT THE REAL ONE — the documented contract, not an oversight.
# harness-floor.yml copies both files into a synthetic tree at
# /tmp/evidence-check/evidence/{brief,pack}.yml under their CANONICAL names,
# whatever their real location, and evidence_pack_lint.py resolves brief_ref
# against THAT root. So this field must read the literal `evidence/brief.yml`
# even though the real file lives at
# evidence/2026-08/agent-air-m5-ops-wal-probe-591ab659/brief.yml. Writing the per-PR
# path here — the "obviously correct" value — is the exact trap the workflow
# comment warns about. Do not "fix" this back.
brief_ref: evidence/brief.yml
# R9 — the Gear-3 council journal, resolved relative to THIS pack's own directory (not
# the staged root that brief_ref uses; they are two different resolution rules and
# conflating them is how the previous round declared none at all). Two seats, both in
# COUNCIL_REVIEW_SEATS, both with real delivered findings. Written AFTER the seats
# answered, never before: an `ok: true` for a seat that did not deliver would pass the
# very check that exists to prove a council happened, which is worse than the NOTICE.
council_run: council-journal.jsonl
# `clean` is a claim about THIS diff, and it is cheap to justify: the probe
# handles no client data at all. Its inputs are Postgres archiver counters and
# WAL segment filenames; the one field that could carry a credential
# (`archive_command`) is dropped at the boundary by `sanitize_observation` and
# pinned by a test. No name, phone, document or client_id passes through any
# path in this PR.
pii_scan: clean
