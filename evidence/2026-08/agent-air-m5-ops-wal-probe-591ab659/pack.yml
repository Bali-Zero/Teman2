# handles no client data at all. Its inputs are Postgres archiver counters and
# WAL segment filenames; the one field that could carry a credential
# (`archive_command`) is dropped at the boundary by `sanitize_observation` and
# pinned by a test. No name, phone, document or client_id passes through any
# path in this PR.
