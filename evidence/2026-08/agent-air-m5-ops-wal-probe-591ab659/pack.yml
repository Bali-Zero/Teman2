dissent:
  - seat: "gpt-5.6-sol xhigh"
    objection: >-
      CRITICAL — a lying `archive_command` (`/bin/true`, or an uploader exiting
      0 before durability) leaves every check green with nothing recoverable;
      `pg_stat_archiver` proves neither presence nor durability of the archive.
    status: "CONFIRMED"
    resolution: >-
      NOT cured, and deliberately not: it is unreachable from this data source,
      which is the one the mandate correctly asked the probe to read. Written
      into the module docstring under its own heading (§WHAT THIS PROBE CANNOT
      SEE) and ledgered in PENDING-ARMS with a concrete arming step — a
      bucket-side listing that diffs the archived WAL sequence against what is
      actually in Tigris, with its own guilt tests. Scoped as a separate PR:
      different data source, different failure surface, one PR one concern.
  - seat: "gpt-5.6-sol xhigh"
    objection: >-
      CRITICAL — SEQUENCE_GAP is mathematically insufficient: `.backup`,
      `.history` and re-archived files also increment `archived_count`, so a
      skipped intermediate segment can hide when `seg_delta <= count_delta`.
    status: "CONFIRMED"
    resolution: >-
      Accepted as a stated BOUND rather than papered over. The check is
      one-directional and detects gaps larger than the number of non-segment
      archives in the same window; it catches the large, obvious hole and does
      not prove the set is complete. Written into the docstring in those words.
      Making it tighter is impossible without knowing WHICH archives were
      segments — which only the bucket-side listing above can establish.
  - seat: "gpt-5.6-sol xhigh"
    objection: >-
      HIGH — false RED with `archive_library`: a healthy PG15+ server using an
      archive module has an empty `archive_command` and was declared
      ARCHIVING_DISABLED.
    status: "CONFIRMED"
    resolution: >-
      CURED. The query now reads `archive_library` (with `missing_ok`, so it
      still works against a pre-15 server) and disabled requires NEITHER to be
      set. Innocence test
      `test_innocence_an_archive_module_with_an_empty_command_is_healthy` plus
      mutant M8, which removes the conjunction and turns the suite red.
  - seat: "gpt-5.6-sol xhigh"
    objection: >-
      HIGH — a stats reset erases the evidence: `arch_seg` becomes None, deltas
      are skipped, and the run re-baselines GREEN, so any hole spanning the
      reset is invisible. Should be CANNOT_VERIFY.
    status: "PLAUSIBLE"
    resolution: >-
      PARTIALLY accepted — not promoted to CANNOT_VERIFY — a stats reset is a legitimate operation
      and the ABSOLUTE checks (disabled, failing, lagging) still run through
      it, so the probe is not blind, only delta-blind for one window. But the
      silence was real and is fixed: STATS_RESET is now a voiding note, and any
      voiding note raises a digest alert instead of exiting 0 quietly. The
      residual disagreement is recorded rather than argued away: a session
      resetting archiver stats before every probe run would defeat the delta
      checks, and only the bucket-side listing would notice.
  - seat: "kimi-code/k3"
    objection: >-
      LOW — a counter reset WITHOUT a `stats_reset` change (a crash can lose
      the stats file): `count_delta` goes negative, the stall check requires
      `== 0` and the gap check `>= 0`, so both skip and the run is green with
      no note at all.
    status: "CONFIRMED"
    resolution: >-
      CURED — COUNTERS_WENT_BACKWARDS, a voiding note, therefore alerting.
      Mutant M10. Found by only one of the two seats, which is the argument for
      running both.
  - seat: "kimi-code/k3"
    objection: >-
      LOW — a missing `current_wal_lsn` silently disables stall and lag; a
      non-segment `last_archived_wal` on the PREVIOUS side silently disables
      the gap check (the first cure covered only the current side).
    status: "CONFIRMED"
    resolution: >-
      CURED — CHECKS_UNRUNNABLE on both, mutants M11 and M12. The second half
      is W107 in miniature: the first cure covered the half that bit, and the
      other half sat one run earlier with the identical silence.
  - seat: "gpt-5.6-sol xhigh and kimi-code/k3 (both)"
    objection: >-
      MEDIUM — false RED after a transient recovery: one failed attempt that
      then succeeded before the probe ran still raised RED on the failed_count
      delta.
    status: "CONFIRMED"
    resolution: >-
      CURED — downgraded to a FAILURES_RECOVERED note when
      `last_archived_time > last_failed_time`, the same pair ARCHIVER_FAILING
      uses in the other direction. Still visible (it alerts at digest), never
      paging. Mutant M9.
  - seat: "gpt-5.6-sol xhigh"
    objection: >-
      LOW — `wal_segment_size` is handled parametrically but the suite fixes
      16 MiB everywhere, so a hardcoded 256 would survive review.
    status: "CONFIRMED"
    resolution: >-
      CURED in the tests rather than the code (the code was already correct):
      `test_the_arithmetic_holds_at_a_non_default_wal_segment_size` replays the
      healthy and stalled scenarios at 64 MiB, where segments-per-logid is 64.
  - seat: "gpt-5.6-sol xhigh"
    objection: >-
      LOW — `archived_count` int64 overflow makes deltas negative and disables
      the stall and gap checks.
    status: "RETRACTED"
    resolution: >-
      The seat itself rated this an accepted trade-off at ~9x10^18 archive
      operations, and it is now covered incidentally anyway: any negative
      `count_delta` emits COUNTERS_WENT_BACKWARDS, so the overflow case is
      loud rather than silent even though it will never occur.
  - seat: "session (m5, build lane) — self-declared, found by no reviewer"
    objection: >-
      `read_archiver_state_via_fly()` has NEVER been executed against
      production. Its live behaviour — credential resolution, the psql
