    role: build
    role_note: "authored the two-job split from a spec naming the concurrency hazard and requiring verbatim comment preservation"
    seat: "kimi-code/kimi-for-coding"
  - lane: orchestrator
    role: review
    role_note: "ground (the file's two-promises header, the empty-expansion hazard, the corpus's real git dependency), spec, the comment-set diff that caught the builder's two drifts, the final on-disk gate, and the three guilt mutations"
    seat: "claude-opus-5 (xhigh)"
  - lane: refuter
    role: review
    role_note: "round 1 — blind cross-family refutation; found the permissions-replace BLOCKER"
    seat: "agy-gemini-3.1-pro"
  - lane: refuter
    role: review
    role_note: "round 2 — blind review of the corrected diff; independently retraced the concurrency expression"
