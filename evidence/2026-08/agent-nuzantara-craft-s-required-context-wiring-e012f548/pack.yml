# THE STAGING LAYOUT, not this directory's layout. Both refs name where
# harness-floor.yml STAGES these files; evidence_pack_lint.py resolves brief_ref
# against --repo-root and council_run against the PACK'S OWN directory. Locally
# the verdict inverts — the per-PR path reads clean and the correct value reads
# broken. CI is authoritative. PR 1 of this lane learned it the expensive way.
