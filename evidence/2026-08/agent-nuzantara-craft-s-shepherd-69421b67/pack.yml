dissent:
  - seat: gpt-5.6-sol (codex-sol, cross-family refuter, round 1)
    objection: >-
      `read_fable_gate_state`'s REST call to commits/{sha}/status was
      unpaginated — GitHub defaults to 30 results per page, and
      harness_gate_read.py itself (which this function deliberately mirrors)
      does not paginate it either. A context sitting past page 1 would read
      as "never posted" -> a false gate-verdict-missing.
    status: CONFIRMED
    note: >-
      Fixed: added `?per_page=100` plus an explicit check of the response's
      own `total_count` field against what was actually fetched; a truncated
      response with the context not found raises (-> CANNOT-VERIFY at the
      caller) rather than returning "never posted". Verified live that this
      endpoint exposes a usable `total_count` (currently 1 for a real commit
      in this repo).

  - seat: gpt-5.6-sol (codex-sol, cross-family refuter, round 1)
    objection: >-
      `_describe_cause`'s required-check-red detail text unconditionally
      said "(a real verdict was posted and it is not success)" whenever
      fable_gate_state was not None — including when it was literally
      `"success"` (the documented #4543 stale-check-landed-before-the-verdict
      shape from harness_gate_read.py's own docstring), which is factually
      false in that case.
    status: CONFIRMED
    note: >-
      Fixed: a dedicated `if fable_gate_state == "success":` branch now
      recommends `gh run rerun <original pull_request run>` instead of
      claiming the verdict is not success. Confirmed live against a REAL PR
      in this exact classifier run (#5350) — see the Bite #2 receipt above.

  - seat: gpt-5.6-sol (codex-sol, cross-family refuter, round 1)
    objection: >-
      Empty `commits.nodes` on an open PR (impossible for a real PR — every
      open PR has >=1 commit) was silently treated as normal data: rollup
      state defaulted to None in `_normalize_open_pr`, and
      `fetch_check_runs_flat` returned `([], False)` — either could hide a
      possibly-red gate behind a GraphQL data anomaly instead of flagging it.
    status: CONFIRMED
    note: >-
      Fixed: `_normalize_open_pr` now sets a `commits_missing` flag,
      `_classify_one` checks it FIRST (before any other classification
      logic) and returns CANNOT-VERIFY, and `fetch_check_runs_flat` raises
      RuntimeError on the same anomaly instead of fabricating an
      empty-but-valid-looking tuple.

  - seat: gpt-5.6-sol (codex-sol, cross-family refuter, round 1)
    objection: >-
      `fetch_open_prs`'s MAX_PAGES exhaustion logged a warning and returned
      the PARTIAL PR list collected so far, letting `main()` exit 0 on a
      board that was silently never fully examined — undermining the
      mandate's own "must go RED if it examined ZERO PRs" requirement by
      allowing "examined SOME but silently not ALL" to pass as clean.
    status: CONFIRMED
    note: >-
      Fixed: raises RuntimeError instead (-> a loud top-level failure, the
      same shape an outright `gh` error already produces). Deliberately
      diverges from queue_shepherd.py's OWN warn-and-return-partial
      convention for its analogous MAX_PAGES-bounded fetches — those have a
      secondary cancel-time recheck that independently re-verifies liveness
      before acting, so a partial list there is safe; this reporter has no
      such safety net, so a partial board must never be reported as complete.

  - seat: kimi-code/k3 (cross-family refuter, round 2, independent second seat)
    objection: >-
      `find_named_check_conclusion` returned the textually-FIRST checkRun
      matching HARNESS_FLOOR_CHECK_NAME — but the Agent PR Contract's own
      rule 3 documents that a `workflow_dispatch` rerun of the same job
      lands in a DIFFERENT check suite on the SAME commit, so two checkRuns
      sharing this exact name with DIFFERING conclusions is a real,
      repo-documented occurrence, not a hypothetical. First-match is
      order-dependent on GraphQL's unspecified checkSuites ordering and can
      go wrong in EITHER direction: a stale FAILURE found first while the
      latest rerun is green fabricates a gate-verdict-missing; a stale
      SUCCESS found first while the latest is red demotes a real
      gate-verdict-missing into required-check-red — exactly the swallow
      this module's own docstring says must never happen.
    status: CONFIRMED
    note: >-
      Fixed: `find_named_check_conclusion` now collects the SET of
      conclusions across every matching run; when they agree it returns
      that shared conclusion unchanged (the common case, unaffected); when
      they disagree it returns a new `AMBIGUOUS_CHECK_CONCLUSION` sentinel,
      which `_classify_one` reads as CANNOT-VERIFY — reusing this module's
      own pre-existing discipline for the structurally identical truncation
      case (trap (d)) rather than inventing a new pattern. Documented as
      trap (h) in the module docstring. Not exercised against a live
      duplicate-suite PR (none exists on the current board) — verified only
      via monkeypatched unit tests; risk acknowledged in brief.yml.

  - seat: kimi-code/k3 (cross-family refuter, round 2, independent second seat)
    objection: >-
      `RED_CHECK_CONCLUSIONS = ("FAILURE",)` omitted `TIMED_OUT` — a genuine
      gate-rejection shape (a required job that overran its timeout-minutes
      is exactly as rejected as one that failed outright). The exclusion
      comment named CANCELLED/NEUTRAL/SKIPPED/ACTION_REQUIRED as deliberately
      excluded and never mentioned TIMED_OUT at all, reading as an oversight
      rather than a deliberate narrowing.
    status: CONFIRMED
    note: >-
      Fixed: `"TIMED_OUT"` added to `RED_CHECK_CONCLUSIONS` alongside
      `"FAILURE"`, comment corrected to explain the addition. Guilt test
      (a TIMED_OUT gate run classifies as gate-verdict-missing, not
      swallowed into required-check-red) + innocence test (SKIPPED, one of
      the genuinely-excluded conclusions, still does not count as red) both
      added.

  - seat: kimi-code/k3 (cross-family refuter, round 2, independent second seat)
    objection: >-
      `classify_stall` never consults `mergeStateStatus == "BLOCKED"` (or
      `"UNSTABLE"`): an armed PR blocked on a non-check requirement (e.g. a
      missing required review) with an otherwise-green rollup is reported
      `queued-and-advancing` — "no known blocker" while GitHub is actually
      reporting one.
    status: PLAUSIBLE
    note: >-
      Triaged, not fixed: the mandate specifies a CLOSED 5-cause set by
      design ("classify it correctly ... from a closed set"), and BLOCKED/
      UNSTABLE do not map cleanly onto any of the 5 without either widening
      the set (out of this PR's scope, a new mandate decision) or silently
      overloading an existing cause's meaning. `queued-and-advancing`
      remains technically true (nothing REQUIRED is red) even if incomplete
      as a diagnosis. Left for a future PR if Zero widens the cause set.

  - seat: kimi-code/k3 (cross-family refuter, round 2, independent second seat)
    objection: >-
      A TOCTOU window exists between the bulk discovery read (rollup state,
      head sha) and the per-PR fresh fetches (check runs, fable-gate state):
      DIRTY gets an explicit fresh re-check (trap (c)), but a head push
      between the two reads could mix an old rollup verdict with new check
      data into one label instead of CANNOT-VERIFY.
    status: PLAUSIBLE
    note: >-
      Triaged, not fixed: real but low-probability (requires a push landing
      in the exact multi-second window between two fetches in the same
      classifier pass), and the fix (re-reading headRefOid in
      CHECK_RUNS_QUERY and comparing) is a larger structural change than
      this PR's two-item scope. Recorded as a risk in brief.yml for a future
      PR.

  - seat: kimi-code/k3 (cross-family refuter, round 2, independent second seat)
    objection: >-
      `gc_uncancellable_state` (queue_shepherd.py) can drop a quarantined run
      id if it falls on a page `fetch_queued_runs` did not reach under its
      own pre-existing MAX_PAGES partial-fetch bound, causing that run to be
      re-hammered for up to 3 ticks before re-quarantining.
    status: PLAUSIBLE
    note: >-
      Triaged, not fixed: this interaction PRE-DATES this PR (both
      gc_uncancellable_state and fetch_queued_runs' page bound already
      existed for the original "uncancellable_409" persistence mechanism);
      the reviewer's own assessment calls it "bounded and self-healing".
      Out of this PR's Item-1 scope (quarantine-after-N-failures), not
      introduced by it.

  - seat: kimi-code/k3 (cross-family refuter, round 2, independent second seat)
    objection: >-
      `is_quarantined` fails open (returns False, allowing a retry) on an
      unparseable `quarantined_at` timestamp, and `--dry-run` bypasses the
      skip-list entirely (loads `{}` instead of the real uncancellable
      state), so dry-run output overstates what a real tick would cancel.
    status: PLAUSIBLE
    note: >-
      Not a defect: fail-open-to-retry on a malformed timestamp is an
      INTENTIONAL design choice in this PR (fail-open beats a permanently
      stuck skip on a corrupted entry) and is already directly tested —
      test_is_quarantined_malformed_timestamp_fails_open_to_retry_never_permanent_skip.
      The dry-run behavior matches the PRE-EXISTING convention
      run_rearm_pass already uses for budget_state/alerted_state
      (`{} if dry_run else _load_json(...)`) — this PR's uncancellable_state
      simply follows the same established pattern, not a new inconsistency.

