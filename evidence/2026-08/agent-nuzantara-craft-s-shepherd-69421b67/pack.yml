plan_ref: >-
  Issue #5316 (comment 02:32) — squad S's unowned task, reassigned. Item 1:
  quarantine queue_shepherd.py's uncancellable runs after 3 consecutive
  failures. Item 2: a read-only stall classifier for queue_stall_classifier.py.
  One PR, both items, plus 6 real findings from two independent cross-family
  adversarial review rounds, all fixed in the same PR per the Agent PR
  Contract's "fix real findings" instruction.

