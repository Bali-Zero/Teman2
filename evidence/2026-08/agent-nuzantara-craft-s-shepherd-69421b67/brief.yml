risks:
  - "The 4 non-blocker findings from the kimi-code/k3 round are triaged, not fixed, in this PR
    (reasoning in dissent below): mergeStateStatus BLOCKED/UNSTABLE is never consulted by
    classify_stall's closed 5-cause set (a mandate-specified closed set, not an oversight to
    silently widen); a TOCTOU window between the bulk discovery read and the per-PR fresh
    checkRuns/fable-gate fetches (the DIRTY case already gets a fresh re-fetch per trap (c),
    rollup does not); a pre-existing (not introduced by this PR) interaction between
    gc_uncancellable_state and fetch_queued_runs' page-bounded partial fetch, bounded and
    self-healing per the reviewer's own assessment; and is_quarantined's fail-open on a
    malformed timestamp, which this session considers an intentional, already-tested design
    choice (fail-open to retry beats a permanently stuck skip) rather than a defect."
  - "AMBIGUOUS_CHECK_CONCLUSION and the TIMED_OUT addition are both NEW code paths this
    session could not exercise against a live duplicate-check-suite PR (none exists in the
    live board at measurement time) -- verified only via monkeypatched unit tests, not an
    observed real occurrence. The Agent PR Contract's rule 3 (workflow_dispatch reruns landing
    in a separate check suite) is the documented basis for the scenario being real, not
    hypothetical."
grader: |
  generator != grader, twice over, by two DIFFERENT non-Anthropic cross-family seats. Round 1:
  `codex exec -m gpt-5.6-sol -c model_reasoning_effort="high" --sandbox workspace-write
  --skip-git-repo-check` reviewed the classifier adversarially AND independently wrote+verified
  6 genuine test cases (checkSuites/checkRuns truncation guilt+innocence, render_table markdown
  escaping) -- satisfying both a real non-Anthropic BUILD lane and a real REVIEW lane in one
  dispatch, confirmed by its own pasted `160 passed`/`79 passed`-shaped pytest output at the
  time. Round 2: `kimi -m kimi-code/k3 -p "..."` (a second, independent seat that had not seen
  round 1's prompt or findings beyond a one-line "these 4 are already fixed, look elsewhere"
  steer) read both changed files in full plus the adjacent harness_gate_read.py they mirror,
  and found 2 further real blockers neither this session nor gpt-5.6-sol had caught. Both
  blockers were verified against the actual current source (grep + Read, not taken at face
  value) before being fixed; the fix design (a dedicated ambiguity sentinel read as
  CANNOT-VERIFY, never a guess) follows this module's own pre-existing discipline for the
  structurally identical truncation case, deliberately reusing a pattern rather than
  inventing a new one.
