objective: |
  Issue #5316 (comment 02:32): squad S was assigned this task and exited without building it —
  unowned, reassigned here. Two items, one PR, both scoped by a prior "Zero" ruling that this
  session does not re-litigate.

  Item 1 — quarantine the uncancellable. `scripts/queue_shepherd.py`'s janitor was doing
  nothing useful: `~/logs/queue-shepherd.log` showed every tick ending `rearmed=0 cancelled=0`,
  with the SAME four `cancel_run(...) failed rc=1 err=gh: Failed to cancel workflow run (HTTP
  500)` lines every tick, forever, on run ids 32217208723/32217208752/32217399769/32212086540.
  Added `record_cancel_failure`/`clear_cancel_entry`/`is_quarantined`: after
  UNCANCELLABLE_FAILURE_THRESHOLD=3 consecutive non-cancelled outcomes on the same run id, it
  is written to `uncancellable.json` with its last error + timestamp and skipped for
  UNCANCELLABLE_RETRY_COOLDOWN_HOURS=24 (a single "uncancellable_409" outcome jumps straight to
  quarantine, preserving exact backward compatibility with the pre-existing
  `test_janitor_uncancellable_409_persisted_and_skipped_next_tick` test); a later successful
  cancel clears the entry; an expired quarantine allows exactly one retry, re-quarantining on a
  second failure and restarting the cooldown.

  Item 2 — a stall CLASSIFIER, a reporter never an actuator. New
  `scripts/queue_stall_classifier.py`: for every open, non-draft PR older than
  DEFAULT_MIN_AGE_MINUTES=30 that is not merging, emits ONE cause from a closed 5-value set
  (conflict / gate-verdict-missing / required-check-red / not-armed / queued-and-advancing,
  precedence in that order) or CANNOT-VERIFY on any network/parse failure for that PR. Never
  reruns a check, never posts a commit status, never merges, never edits a PR — enforced by
  this module's own static AST self-protection tests (mirrors
  scripts/tests/test_harness_gate_read.py's technique), not just by inspection. Rationale
  (verbatim, per the mandate, and present in the module's own docstring): "the night of
  2026-08-30/31, this repo's merge queue never stalled for a mechanical reason — nothing was
  ejected, nothing needed a rerun. It stalled on JUDGEMENT: a missing gate verdict, red checks
  needing diagnosis. Those are exactly the moves a bot must not make on its own — rerunning a
  red check replays a stale merge ref (W111), and posting a gate verdict with no independent
  reader is self-grading."

  SECOND AND THIRD PASS (same PR, same session): two independent, cross-family adversarial
  reviews on the classifier (generator != grader, twice over) found 6 real issues before this
  ever reached CI, all fixed here:
    Round 2 (codex-sol, gpt-5.6-sol, read-only sandbox) — 4 findings, all fixed:
    1. `read_fable_gate_state`'s REST call to `commits/{sha}/status` was unpaginated (GitHub
       defaults to 30/page, and harness_gate_read.py itself does not paginate it either) — a
       context sitting past page 1 would read as "never posted". Fixed: `?per_page=100` plus
       an explicit `total_count` truncation check that raises (-> CANNOT-VERIFY) rather than
       risking a false "never posted".
    2. `_describe_cause`'s required-check-red text unconditionally said "a real verdict was
       posted and it is not success" even when the posted state literally WAS `"success"` (the
       documented #4543 stale-check-landed-before-the-verdict-did shape). Fixed: a dedicated
       branch recommending `gh run rerun <original pull_request run>` instead.
    3. An empty `commits.nodes` on an open PR (impossible for a real PR, an anomalous GraphQL
       response) was silently read as normal data. Fixed: a `commits_missing` flag surfaced
       through `_normalize_open_pr` -> `_classify_one` as CANNOT-VERIFY, and
       `fetch_check_runs_flat` now raises on the same anomaly instead of returning `([], False)`.
    4. `fetch_open_prs`'s MAX_PAGES exhaustion logged a warning and returned a PARTIAL PR list,
       letting `main()` exit 0 on a silently-incomplete board — undermining the mandate's own
       "must go RED if it examined ZERO PRs" spirit by allowing "examined SOME but not ALL,
       silently". Fixed: raises instead, deliberately diverging from queue_shepherd.py's own
       warn-and-return-partial convention for its own (lower-stakes, cancel-time-rechecked)
       page-bounded fetches.
    Round 3 (kimi-code/k3, second independent seat) — 2 more BLOCKERS found and fixed, plus 4
    non-blockers triaged (see dissent below):
    5. `find_named_check_conclusion` returned the textually-FIRST checkRun named "Harness floor
       recompute" — but the Agent PR Contract's own rule 3 documents that a `workflow_dispatch`
       rerun of the same job lands in a DIFFERENT check suite on the SAME commit, so two
       same-named runs with DIFFERING conclusions is a real, repo-documented shape, not
       speculation. First-match was order-dependent on GraphQL's unspecified checkSuites
       ordering and could either fabricate a gate-verdict-missing (stale FAILURE found first
       while the latest rerun is green) or swallow a real one (stale SUCCESS found first while
       latest is red) — exactly the swallow the module's own docstring says must never happen.
       Fixed: a new `AMBIGUOUS_CHECK_CONCLUSION` sentinel returned when matches disagree, read
       by `_classify_one` as CANNOT-VERIFY rather than guessed.
    6. `RED_CHECK_CONCLUSIONS = ("FAILURE",)` omitted `TIMED_OUT` — a genuine gate-rejection
       shape (a required job that overran its timeout is exactly as rejected as one that failed
       outright); the exclusion comment named 4 deliberately-excluded conclusions and never
       mentioned this 5th real one at all. Fixed: added alongside FAILURE.
