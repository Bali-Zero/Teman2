council_run: council-run.jsonl

dissent:
  - seat: codex gpt-5.6-sol (round 1)
    objection: >-
      BLOCKER — the attestation is unprovable and slightly overstated. Nothing in
      the diff proves anyone read the eighteen pages; running the fold offline
      against the seq-16 payload yields the identical stamp. The stamp instant
      also sits after the last reader returned.
    status: CONFIRMED
    resolution: >-
      Not repairable inside a signed, already-active artifact, and NOT papered
      over. Recorded in full in
      research/visa/2026-08-30-freshness-restamp-seq17-attestation.md, which
      states plainly that the reading happened but left no per-record receipt,
      and refuses to reconstruct quotes from memory because that would look like
      evidence. The rule it produces — write the ledger DURING the reading, and
      stamp the EARLIEST reader's instant — applies to the next ceremony in this
      lane, which is the one that raises the window.
  - seat: codex gpt-5.6-sol (round 1)
    objection: >-
      MAJOR — the "nothing else changes" guarantee was not enforced. The guard
      listed keys that must not move and left version, environment, jurisdiction,
      decision_domain and the three engine_*_version keys unguarded; the record
      comparison covered only NON-portal records, so content_sha256 on a portal
      record could drift unnoticed.
    status: CONFIRMED
    resolution: >-
      Fixed. The polarity is inverted: an explicit allow-list of what MAY change,
      universal equality for everything else, at both the payload level and the
      record level, plus RulePackPayload.model_validate on the result. Extracted
      as assert_only_expected_changes so it can be tested at all — the first
      guilt test was VACUOUS, because mutating the fold's input is caught by the
      chain-anchor digest first, which is exactly how a green test can prove
      nothing.
  - seat: codex gpt-5.6-sol (round 1)
    objection: >-
      MINOR — "seq-16 does not exist in this repository at all" is false; the
      signed bundle is on origin/feature/visa-oracle with the active digest.
    status: CONFIRMED
    resolution: >-
      Verified with git show, then corrected in all three places the false claim
      had already reached: the fold docstring, this PR's brief, and this pack.
      The real gap is narrower and still open — seq-16's source never reached
      main.
  - seat: codex gpt-5.6-sol (round 1)
    objection: >-
      MAJOR — the operational cause is untouched. The records expire again one
      week out, and the sentinel's dedup is stable per sequence, so if the first
      seq-17 alert is not acted on the rest are suppressed and the Oracle goes
      quiet again.
    status: CONFIRMED
    resolution: >-
      Out of scope here and NOT claimed as fixed. Raising the window is a
      separate signed ceremony (the value lives only in the pack; there is no
      config override anywhere), already ordered. The dedup that swallowed the
      warning is its own open item and this PR does not touch it.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MINOR — `version` still reads 2026.8.26 although earlier folds set it to
      the fold date, so the catalog holds a pack created 2026-08-30 whose version
      says 2026-08-26.
    status: CONFIRMED
    resolution: >-
      Real and NOT fixable here: the artifact is signed and live, so changing it
      would invalidate the signature and diverge from the activated row. Nothing
      reads the field for decisions. Recorded in the attestation document so the
      next fold sets it.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MINOR — the E23V copy narrows the pack's own product name, dropping "and
      Economic" and calling it a "trade representative office".
    status: CONFIRMED
    resolution: >-
      Fixed. Both entries now follow the pack's product names verbatim — "Foreign
      Diplomat House Assistant" and "Trade and Economic Office" — in EN and ID.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MINOR — no backend witness file for seq-17, where every pack from seq-6 to
      seq-15 has one.
    status: CONFIRMED
    resolution: >-
      Fixed: test_seq17_freshness_restamp.py adds identity, chain, signature,
      freshness-shape and the guard's guilt/innocence witnesses.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MAJOR — every prior restamp in this lane shipped an evidence document with
      verbatim per-record quotes plus a source-restamp-edits.json ledger; seq-17
      ships none, breaking the lane's convention.
    status: RETRACTED
    resolution: >-
      The convention does not exist. Searched the worktree, origin/main and all
      440 remote branches: zero hits for freshness-restamp or
      source-restamp-edits, and doctrine-factory is absent from main. The cited
      paths and dates were fabricated. The reviewer's underlying point — that the
      attestation is unprovable — is separately CONFIRMED above and acted on; only
      the claimed precedent is refuted. Recorded because a finding taken on trust
      is how a wrong fact enters the record.
  - seat: session (self-audit)
    objection: >-
      This PR ships an artifact that was ALREADY ACTIVE in production before
      review. The ordering was forced — every visa product was answering nothing
      — but it inverts the usual guarantee: review documents a change that is
      already load-bearing.
    status: CONFIRMED
    resolution: >-
      Stated rather than smoothed over. The honest remedy for any rejected
      finding is a forward pack, never an edit to a signed artifact that is live;
      that is what happened for every finding above that could not be fixed here.
  - seat: session (self-audit)
    objection: >-
      content_sha256 was deliberately left untouched on every record, on the
      readers' judgement that no page changed semantically. Nothing in CI can
      check that judgement.
    status: CONFIRMED
    resolution: >-
      Named as a residual risk in the attestation document, including the exact
      circumstance that would make it wrong: a page that changed while a reader
      judged the change non-semantic leaves a fresh attestation over a stale
      fingerprint, undetectable by any later hash audit because the method was
      reading, not re-hashing.
