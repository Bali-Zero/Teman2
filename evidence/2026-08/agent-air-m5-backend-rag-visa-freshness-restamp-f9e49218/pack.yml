      a broken convention.
    cmd: >-
      find in the worktree; git ls-tree -r --name-only on origin/main; then the
      same grep across every remote branch
    result: >-
      zero hits for freshness-restamp or source-restamp-edits across 440 remote
      branches; doctrine-factory absent from main. The convention was invented.
      The reviewer's underlying point about unprovable attestation stands on its
