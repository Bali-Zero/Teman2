receipts:
  - claim: >-
      The uuid5 rule_pack_id convention is real and current, not inferred from
      the fold scripts alone: it reproduces the ids of the packs on disk AND
      the id of the row that was active in production at the time of the fold.
    cmd: >-
      python3 -c "import uuid; B='https://balizero.com/visa-oracle/rule-pack/
      PRODUCTION/ID/IMMIGRATION_VISA/'; [print(n, uuid.uuid5(uuid.NAMESPACE_URL,
      B+str(n))) for n in (14,15,16,17)]"
    result: >-
      14 -> 821e2ddc-4e7c-5a06-8609-2f402c6e51f0 (equals rulepack-prod-014 on
      disk); 15 -> ff48ba21-2eae-5fe7-ad1d-20f2cb0050e5 (equals
      rulepack-prod-015 on disk); 16 -> 08e07e77-eb71-5490-b246-d980b6f3afb6
      (equals the id of the then-active production row); 17 ->
      a51a3142-df1d-5467-b015-623d9a8644e6 (minted here).
    exit: 0
    ts: 2026-08-30T15:20Z
    seat: session (build lane)

  - claim: >-
      The semantic diff between the live seq-16 payload and the seq-17 source
      is exactly the intended one. At the top level only sequence, rule_pack_id,
      created_at, created_by, previous_payload_sha256 and source_records differ;
      inside source_records the only records that moved carry authority_type
      OFFICIAL_PORTAL, and on those the only fields that moved are verified_at
      and verified_by.
    cmd: >-
      python3 - (structural JSON comparison of the DB export against the folded
      source: per-key equality at top level, then per-record equality and
      per-field diff across source_records)
    result: >-
      top-level keys changed = [created_at, created_by, previous_payload_sha256,
      rule_pack_id, sequence, source_records]; changed records carry
      authority_type OFFICIAL_PORTAL only; fields touched = [verified_at,
      verified_by]; no rule, product, hit_policy, valid_period or non-portal
      source record differs.
    exit: 0
    ts: 2026-08-30T15:25Z
    seat: session (build lane)

  - claim: >-
      The signed bundle verifies against the pinned PRODUCTION trust-store key,
      and still verifies after the repo's formatter rewrote the file — the
      signature covers the canonical payload, not the file's text.
    cmd: >-
      VISA_ENGINE_TRUST_STORE_KEYS_JSON=<pinned prod-2026-07-1 public key>
      PYTHONPATH=. python -c "verify_rule_pack(raw,
      trust_store=StaticTrustStore.from_env(), observed_at=now)" — run before
      and after `npx prettier --write` on both pack files
    result: >-
      FIRMA OK both times; recomputed JCS digest of the source equals the
      payload_sha256 the signer emitted (97cb9647...).
    exit: 0
    ts: 2026-08-30T15:52Z
    seat: session (build lane)

  - claim: >-
      The activation ceremony refused the FIRST seq-17 artifact rather than
      corrupting the ledger. The initial fold carried seq-16's rule_pack_id, and
      the writer rejected it because packs are immutable under that key. Nothing
      was written on that attempt; the guard is why this PR contains a corrected
      fold and not a corrupted row.
    cmd: >-
      python -m backend.scripts.visa_engine.activate_pack
      /tmp/rulepack-prod-017.signed.json --current-sequence 16 ... --yes
      (operator ceremony on Pro, two distinct ephemeral non-superuser logins)
    result: >-
      "FAIL: visa_rule_packs already holds 08e07e77-... with a DIFFERENT
      payload_sha256 (ef17dc122380d1e5... vs 49a18d790ea011bf...) — packs are
      immutable"
    exit: 1
    ts: 2026-08-30T15:25Z
    seat: operator[credential] ceremony (activation requires two distinct
      non-superuser logins; the session does not create logins)

  - claim: >-
      The corrected artifact activated in production, and the anti-rollback
      pre-gate passed on the real chain anchor.
    cmd: >-
      python -m backend.scripts.visa_engine.activate_pack
      /tmp/rulepack-prod-017.signed.json --current-sequence 16
      --current-payload-sha256 ef17dc12... --yes
    result: >-
      "verified against trust store: kid=prod-2026-07-1"; "anti-rollback
      pre-gate passed"; "pack row inserted"; "activated
      rule_pack_id=a51a3142-df1d-5467-b015-623d9a8644e6
      activation_id=80e6dda6-0ffb-4005-8a9c-706c23f1094d"
    exit: 0
    ts: 2026-08-30T15:35:49Z
    seat: operator[credential] ceremony

  - claim: >-
      Verified from the CATALOG through the read-only production role — never
