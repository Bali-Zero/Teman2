    exit: 0
    ts: 2026-08-30T23:55Z
    seat: session (build lane)

  - claim: >-
      The frontend red is cured by the copy, proven by running the test that
      failed rather than by reading the fix.
    cmd: >-
      cd apps/mouth && npx vitest run
      "src/app/(visa-oracle)/visa-oracle/_lib/engine-adapter.test.ts"
    result: "1 file passed, 25 passed"
    exit: 0
    ts: 2026-08-30T23:57Z
    seat: session (build lane)

  - claim: >-
      The rewritten fail-closed guard BITES. Eight ways a field could drift are
      each rejected, the real fold passes, and the fold still reproduces the
      activated artifact byte for byte after the rewrite.
    cmd: >-
      re-run the fold and byte-compare against the committed source; then call
