      at verified_at 2026-08-30T13:18:00Z; the non-portal authorities are
      unmoved and sit inside their own much longer window.
    exit: 0
    ts: 2026-08-30T15:38Z
    seat: session (independent verification)

  - claim: >-
      PROVEN LIVE against the deployed service after activation: the endpoint
      answers with real candidates on the very cases that were folding to
      HUMAN_REVIEW_REQUIRED, and reports the new pack as the one it used.
    cmd: >-
      PYTHONPATH=. python -m backend.scripts.visa_engine.probe_evaluate --url
      https://nuzantara-rag.fly.dev/api/visa-oracle/evaluate --payload
      <tourist> ; same for an E31A spouse payload
    result: >-
      both HTTP 200, mode CURATED, state SUPPORTED_CANDIDATES, rule_pack
      sequence=17 rule_pack_id=a51a3142-df1d-5467-b015-623d9a8644e6.
    exit: 0
    ts: 2026-08-30T15:45Z
    seat: session (independent verification)

  - claim: >-
      No restart or cache invalidation was needed for that to be true, and this
