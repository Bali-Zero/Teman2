    cmd: >-
      scripts/pg.sh -c "SELECT p.sequence, encode(p.payload_sha256::bytea,'hex'),
      a.activated_by FROM visa_ruleset_activations a JOIN visa_rule_packs p ON
      p.id=a.rule_pack_id WHERE upper_inf(a.system_period)" and a second query
      grouping source_records by authority_type and verified_at
    result: >-
      sequence 17, sha 97cb964780b114a2fa936230055327102a5af59efb010b6bf04090bb7321890b,
      activated_by operator.zero.freshness-restamp-2026-08-30, opened
