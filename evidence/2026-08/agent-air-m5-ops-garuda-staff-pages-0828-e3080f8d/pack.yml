  Nothing in this diff, brief or pack transcribes client data. The tests seed a synthetic
  applicant (SPECIMEN TRAVELLER, X0000000, a placeholder phone, addresses at example.invalid) whose
  whole purpose is to be searched FOR in outgoing pages and log lines. The bot token used in the scrub
