dissent:
  - seat: gpt-5.6-sol (gate rounds 1, 3 and 5 — the same claim, three times)
    objection:
      The scrub regex omits the hyphen, which is valid in Telegram token secrets, so it redacts
      only through the first hyphen and then the literal secret replacement cannot match because its
      prefix was already removed, leaving most of the secret durable.
    status: RETRACTED
    resolution:
      "A hyphen in FINAL position inside a character class is a LITERAL, not a range, so the
      class does include it. Driven against the REAL _scrub on a deliberately hyphen-rich token across
      all four error shapes, checking every window of 8 or more characters of the secret half — zero
      survive in all four. Rejecting a finding three times is not a resolution, so the third round was
      answered STRUCTURALLY instead: dropping the hyphen from the class, i.e. making the code behave
      the way the finding claimed it already behaved, now turns the tripwire RED. It stayed GREEN before,
      which is exactly why the claim could keep returning. The dispute is settled by a mutation rather
      than by whoever argues last."
  - seat: gpt-5.6-sol (gate round 5)
    objection:
      test_no_form_of_the_bot_token_survives_into_the_durable_error checks only secret fragments
      beginning at the secret's FIRST character, so it passes while the suffix leaks.
    status: CONFIRMED
    resolution:
      Accepted in full — a real weakness in this session's own tripwire, and the same shape
      of defect this session had found in the builder's tests two rounds earlier. It now checks every
      window of eight or more characters, with a floor on the size of the window set so a broken comprehension
      cannot pass as a clean run. This is also what made the structural answer to the finding above
      possible.
  - seat: gpt-5.6-sol (gate round 2)
    objection:
      The payment-failure and refund-out-of-order handlers always return True and so have no
      mechanism to suppress a retry after a human closes the case.
    status: RETRACTED
    resolution:
      They report an event that HAPPENED, not a case that is OPEN. There is no closure flag
      for them to consult — late_case_open belongs to the OP-08/OP-F04/OP-F05 remediation cases only
      — and the outbox marks a job dispatched on success, so a second page can only follow a FAILED
      send, which is precisely when a human still has not been told. Written as a comment at both _should_page
      methods so the next reader does not re-open it.
  - seat: gpt-5.6-sol (gate round 3)
    objection: _scrub never removes the chat id; a provider error echoing it reaches last_error.
    status: RETRACTED
    resolution:
      The chat id is not a secret — it is the owner's own chat id, recorded in this repo's
      own instructions, and sending to it requires the bot token, which is what the method exists to
      protect. Scrubbing it would only make a failed page harder for a human to trace back to a destination.
      Written in place.
  - seat: gpt-5.6-sol (gate round 3)
    objection:
      "Timestamp alone does not establish case ordering: a resolution sharing an occurred_at
      with a later trigger satisfies >= and wrongly SUPPRESSES the later case's page."
    status: PLAUSIBLE
    resolution:
      "Accepted as free insurance and DECLARED UNPINNED rather than dressed up as coverage.
      The comparison is now strict greater-than, so a tie resolves toward PAGING — suppressing is the
      worse direction by this lane's own rule. Reverting it to >= leaves every test GREEN and the PR
      says so: the tie is unreachable because the append-only trigger forbids the UPDATE that would
      create one, and each writer appends one row per statement while statement_timestamp() advances
      between statements. What IS pinned is that trigger, by a test that DRIVES an UPDATE and a DELETE
      and asserts the append-only guard rejects both — an earlier version grepped the migration for
      the words update and delete and would have passed on updated_at alone."
  - seat: gpt-5.6-sol (gate round 2)
    objection:
      PracticeReceivedEmailHandler silently returns unless the order state is paid, so a late-paid
      failed or expired order with a real practice loses a valid customer notice.
    status: RETRACTED
    resolution:
      practice_received_email is enqueued ONLY inside mint_received_practice, which requires
      an OP-02 payment.paid journal event. An OP-F05 late payment emits payment.late_paid_after_terminal,
      never OP-02, so no such job can exist for a failed or expired order and the guard cannot drop
      a valid notice. Read on disk before rejecting — the honoured resolution path enqueues practice_release,
      a different job.
  - seat: session (declared limit, unresolved)
    objection:
      Not one of these five pages has ever been DELIVERED. Every proof here is a test or a
      mutation; the live path is unexercised because with GARUDA_XENDIT_SECRET_KEY unset the order lane
      answers 503 and none of these job types is produced.
    status: PLAUSIBLE
    resolution:
      "Left standing and labelled rather than quietly counted as done. Merged is not armed
      (superscar #2). The ledger row in #5132 keeps this open with an explicit proof-of-armed — a real
      duplicate-charge callback putting one page in the owner chat. The one gesture that is not this
      session's is fly secrets set for the two Xendit values."
  - seat: session (declared limit, unresolved)
    objection:
      This PR routes the five staff pages to a GRANDFATHERED direct sender rather than through
      scripts/tg_notify.py, the gateway the anti-regrowth lint points at, so it does not advance the
      migration that lint exists to drive.
    status: PLAUSIBLE
    resolution:
      Deliberate and declared. The gateway is an argparse CLI with a spool directory, dedup
      keys and mute windows; no backend-rag production code uses it, and reaching it from an async FastAPI
      worker means a subprocess per page. Migrating telegram_notifier.py's cohort is the lint's own
      stated plan and a separate change. What this PR does NOT do is grow the family the lint shrinks
      — it adds no new direct sender and needed no grandfather entry.
