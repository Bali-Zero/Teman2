dissent:
  - seat: kimi-code/k3 (cross-family refuter)
    objection: >-
      Three findings on the diff as first opened. (1) The "wrong target"
      guilt fixture used `../..` where claude_skills/ and agents_skills/
      are direct siblings under tmp_path (the innocence fixture's own `..`
      proves the correct depth) — the symlink dangled outside tmp_path
      instead of resolving to the `decoy` dir the test built, so the test
      passed for "dangling symlink" reasons, not "resolves to a real wrong
      target" as its name claims. (2) The docstring's claim that the
      structural rule "needs no allowlist to stay correct as skills are
      added or removed" is overstated: a Tier-B skill MOVED (not copied)
      into `.agents/skills/` — deleted from `.claude/skills/` in the same
      change — never appears on both sides, so the structural rule cannot
      see it; only the pinned KNOWN_CLAUDE_ONLY_NAMES list catches this for
      skills that exist today, and it goes stale for skills authored later.
      (3) `find_canonicity_violations` returns `[]` vacuously if either
      tree is missing entirely, so a whole-architecture disappearance would
      pass `test_real_repo_has_zero_canonicity_violations` with no real
      protection (mitigated only as a side effect of the pinned-name
      tests' own assertions).
    status: CONFIRMED
    note: >-
      (1) and (3) fixed: the wrong-target fixture now uses the correct `..`
      depth plus a self-checking assertion that would catch this exact
      class of fixture bug on its own; a new
      test_real_repo_both_skill_trees_exist makes the existence
      precondition explicit rather than incidental. (2) disclosed, not
      fixed: closing it fully would require judging whether new content is
      tool-agnostic, which a directory-shape check cannot do — the
      docstring and this pack now say so plainly instead of overclaiming
      coverage. Re-ran full suite after the fixes: collected 11, 11 passed
      (was 10 — the new existence test).

  - seat: session self-refutation (recorded because the dispatching mandate's own author could not have caught it without re-measuring)
    objection: >-
      The dispatching Q0 mandate's "measured today" claim was not
      reproducible: 21 dirs / 11 divergent SKILL.md / a stale Fable-first
      line at a specific file:line were all checked directly this turn and
      all three are false. Executing the mandate's literal instructions
      (port .claude Tier-B content into .agents/skills as byte-identical
      copies) would have violated the documented 2026-07-23 architecture
      and polluted the cross-agent canonical store with Claude-Code-only
      orchestration prose.
    status: CONFIRMED
    note: >-
      Not executed. Scope corrected instead: ship a regression test
      encoding the REAL contract (including a guilt fixture for exactly
      the mirroring mistake the original mandate asked for), reported back
      to the dispatching team-lead via teammate message before opening
      this PR.

