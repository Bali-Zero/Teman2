dissent:
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "A hostile search_path defeats both the migration and the preflight. Both called
      `pg_get_userbyid` unqualified; the migration runner is `backend_rag_v2`, which can CREATE in
      `public`, so `CREATE FUNCTION public.pg_get_userbyid(oid) RETURNS name AS $$ SELECT
      'visa_ledger_owner'::name $$` plus `SET search_path = public, pg_catalog` makes the census report
      a forged owner and answer ok=True, and makes the migration skip its ALTER, pass its own
      assertion and be recorded applied with the ownership still wrong."
    status: CONFIRMED
    resolution:
      "Every catalog relation and catalog function in both is now `pg_catalog.`-qualified. The evasion
      is a live test — it plants the shadow, asserts the shadow is really reachable (otherwise the test
      would pass for the wrong reason), then asserts the census still reports the real owners and the
      migration still raises. Unqualifying `pg_get_userbyid` turns it red."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "An absent target function was a false-success path: `to_regprocedure` returns NULL, the loop
      CONTINUEs, and 300 is recorded applied with the ownership never established for that target —
      the exact defect the file claims to make impossible."
    status: CONFIRMED
    resolution:
      "An absent target is now a collected failure, reported as `<signature> (ABSENT)`. Safe because
      the branch is only reachable past the role guard, where the ledger role exists and migrations
      281/286 — which create all five unconditionally — have already run. A test drops one of the five
