    resolution:
      'The census returns `prokind::text` and the violation line carries `[function]` / `[procedure]`,
      with the detail naming ALTER PROCEDURE where it applies. Filtering procedures OUT was rejected —
      a definer procedure carries the identical hazard and must be caught. The `::text` cast is
