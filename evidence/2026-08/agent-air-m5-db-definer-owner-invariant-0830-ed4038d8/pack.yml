# brief_ref is the LITERAL 'evidence/brief.yml' even though this pack lives in a per-PR
# directory: harness-floor.yml stages both files into a synthetic tree under those fixed
# names before validating, so any other value fails to resolve in CI.
brief_ref: evidence/brief.yml
plan_ref:
  "agent/air-m5/db/definer-owner-invariant-0830 — codify the five ownership transfers migrations 281
  and 286 announced and never performed, and replace the hand-maintained list that let migration 285
  through with a class-level invariant. Companion to PR #5302 (migration 299), which cures the one
  transfer migration 285 forgot."
lanes:
  - lane: definer-owner-invariant-build
    role: build
    seat:
      claude-opus-5 (this session — verified the production census independently, authored migration
      300, the class-level preflight check, both test surfaces and this pack)
  - lane: definer-owner-invariant-refute
    role: review
    seat:
      codex-gpt-5.6-sol at xhigh effort (OpenAI, ChatGPT Pro flat subscription) — given the full diff
      plus the production measurements and told to break the migration, the census SQL and the tests.
      Returned REJECT with six findings; four fixed, one answered with a measurement, one handed to
      the gate owner. See dissent.
  - lane: definer-owner-invariant-gate
    role: review
    seat:
      the mandating session (claude-opus-5), which owns the Gear-3 gate and the merge and did not
      author this diff. This lane does not arm auto-merge.
seat_diversity: satisfied
seat_diversity_note:
  "Build lane Anthropic, adversarial lane OpenAI — different families, and the grader is not the
  author. It earned its keep rather than being ceremony: it produced a working search_path evasion
  that made both the migration and the check answer clean with the ownership wrong, and it caught a
  rollback section that would have told the migration framework it had reversed something it had not."
diff:
  net_lines: "6 files, +1510/-0 (git diff --numstat over the merge-base)"
  behaviour_change:
    "No production behaviour changes. Migration 300 is a no-op against the production primary because
    the five ALTERs already landed there by hand on 2026-08-30 before this lane opened; it exists so an
    unattended environment converges instead of coming up with the trap re-armed, and it now RAISES
    rather than recording a cure that did not happen. The preflight gains one extra read-only
    `connection.fetch` per run. Zero frontend, zero workflow, zero runtime request path."
