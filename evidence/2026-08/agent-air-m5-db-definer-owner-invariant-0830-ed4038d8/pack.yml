      and poisoning any dependent rollback of 281/286."
    status: CONFIRMED
    resolution:
      "Verified at backend/db/migration_manager.py:249-263 before acting. The section now RAISES, so
      the transaction aborts, the ledger row survives, and the operator is told the migration is
