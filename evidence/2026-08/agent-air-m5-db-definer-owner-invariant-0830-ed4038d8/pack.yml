pii_scan: clean
pii_scan_note:
  "No client data was touched, read or transcribed. Every production read was a catalog query
  (pg_proc, pg_namespace, pg_roles, pg_extension, pg_depend) through scripts/pg.sh as
  nuzantara_readonly; no table row contents left the database and no DDL was issued from this lane.
  Every destructive experiment ran against throwaway local databases and uuid-suffixed roles created
  and dropped by the test fixtures. No secret value entered any transcript."
dissent:
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "A hostile search_path defeats both the migration and the preflight. Both called
      `pg_get_userbyid` unqualified; the migration runner is `backend_rag_v2`, which can CREATE in
      `public`, so `CREATE FUNCTION public.pg_get_userbyid(oid) RETURNS name AS $$ SELECT
      'visa_ledger_owner'::name $$` plus `SET search_path = public, pg_catalog` makes the census report
      a forged owner and answer ok=True, and makes the migration skip its ALTER, pass its own
      assertion and be recorded applied with the ownership still wrong."
    status: CONFIRMED
    resolution:
      "Every catalog relation and catalog function in both is now `pg_catalog.`-qualified. The evasion
      is a live test — it plants the shadow, asserts the shadow is really reachable (otherwise the test
      would pass for the wrong reason), then asserts the census still reports the real owners and the
      migration still raises. Unqualifying `pg_get_userbyid` turns it red."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "An absent target function was a false-success path: `to_regprocedure` returns NULL, the loop
      CONTINUEs, and 300 is recorded applied with the ownership never established for that target —
      the exact defect the file claims to make impossible."
    status: CONFIRMED
    resolution:
      "An absent target is now a collected failure, reported as `<signature> (ABSENT)`. Safe because
      the branch is only reachable past the role guard, where the ledger role exists and migrations
      281/286 — which create all five unconditionally — have already run. A test drops one of the five
      and asserts the raise names it."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "The rollback lies to the migration framework. `MigrationManager.rollback_migration` runs the
      rollback SQL and then deletes the `_schema_versions` row and returns True, so a NOTICE-only body
      advertises a successful reversal while preserving the entire effect — corrupting schema history
      and poisoning any dependent rollback of 281/286."
    status: CONFIRMED
    resolution:
      "Verified at backend/db/migration_manager.py:249-263 before acting. The section now RAISES, so
      the transaction aborts, the ledger row survives, and the operator is told the migration is
      irreversible and why. Restoring the NOTICE turns the test red."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "The census ignores `prokind`: a SECURITY DEFINER PROCEDURE is reported as a function and the
      remediation tells the operator to run ALTER FUNCTION, which is the wrong statement."
    status: CONFIRMED
    resolution:
      'The census returns `prokind::text` and the violation line carries `[function]` / `[procedure]`,
      with the detail naming ALTER PROCEDURE where it applies. Filtering procedures OUT was rejected —
      a definer procedure carries the identical hazard and must be caught. The `::text` cast is
      load-bearing: `"char"` decodes to BYTES in asyncpg and the label printed `[b''p'']`, which the
      real-Postgres test found on its first run and the fake could not have.'
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "Migration 300 is recorded applied when `visa_ledger_owner` is absent while the five remain
      wrongly owned. Missing prerequisites become permanent schema history."
    status: CONFIRMED, deliberately not changed
    resolution:
      "Measured rather than argued: both `visa_ledger_owner` and `backend_rag_v2` are ABSENT on the
      local cluster and on CI's Postgres service, so raising would block the migration chain on every
      unprovisioned database — and there is no role to transfer to in that state anyway. It is not a
      silent hole: `operational_preflight` already carries a `role:visa_ledger_owner` check that goes
      red on exactly it. The reasoning is written into the block so the next reader does not have to
      re-derive it."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "The census produces guaranteed false reds for legitimate extension routines: `CREATE EXTENSION
      dblink WITH SCHEMA public` installs `dblink_connect_u`, SECURITY DEFINER and owned by the
      installer, so a healthy database would fail this preflight."
    status: CONFIRMED as a hypothetical; NOT exempted — handed to the gate owner
    resolution:
      "The mandate is explicit that a legitimate exception must be reported, not silently exempted. So
      no `pg_depend deptype='e'` carve-out was added, and the case is named in the code, in the brief's
      risks and in the handback. It is a hypothetical HERE: measured on production, zero of the 21
      definer functions belong to an extension, with postgis/pgcrypto/pg_trgm/btree_gist/uuid-ossp all
      installed into public. If dblink or a similar extension is ever installed the check goes red and
      the exemption becomes a deliberate diff — which is the intended cost, because an exemption
      written before a real case is how a floor turns back into the list that let migration 285
      through."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "The tests certify the implementation's blind spots. The migration test seeded only two of the
      five targets and treated the other three as a successful `not present` path, so misspelling any
      of the unseeded three changed nothing; the absent-role branch was untested; and the fake returns
      fabricated rows whenever the query merely contains `prosecdef`, so `WHERE NOT proc.prosecdef`
      would still pass it."
    status: CONFIRMED
    resolution:
      "All five targets are now seeded and asserted, so a typo in any one of the five reddens the
      suite. The fake's weakness is real and is precisely why the real-Postgres file exists: `WHERE NOT
      proc.prosecdef` fails there, because that file asserts the invoker function is NOT censused and
      the definer ones ARE. Named openly in the file's docstring rather than papered over — the fake
      owns the verdict logic, the real catalog owns the SQL."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "Migration 299 (PR #5302) compounds the defect: on a fresh database without visa_ledger_owner it
      takes the identical NOTICE-and-RETURN branch and is recorded applied, so fixing 300 alone does
      not produce convergence."
    status: PLAUSIBLE, out of this lane's scope
    resolution:
      "Handed to the mandating session, which owns PR #5302 and this gate. 299 is not in this diff and
      this lane does not edit another open PR's branch. The observation is correct as far as it goes;
      the answer to it is the same measurement as above — with the role absent there is nothing to
      transfer to, and the `role:visa_ledger_owner` preflight check is the layer that reports that
      state."
  - seat: claude-opus-5 (declared limit)
    objection:
      "The class check covers schema `public` only, as the mandate scoped it. A SECURITY DEFINER
      function created in `mata_garuda` — the only other non-system schema on production — would not be
      seen."
    status: PLAUSIBLE
    resolution:
      "Measured: `mata_garuda` holds zero SECURITY DEFINER functions today. Named in the brief's risks
      rather than widened, because widening the schema set is a governance decision about which schemas
      the ledger role is supposed to own, not a bug fix."
