notes:
  - 'SELF-CAUGHT BUG DURING BUILD, WORTH RECORDING: the first pass of the 7-site
    fix accidentally dropped the `MESSAGE="..."` assignment line at 6 of 7 sites
    (the Edit tool''s old_string/new_string pair captured the MESSAGE line as
    context but the replacement omitted it) — caught by grep-counting `MESSAGE=`
    occurrences before vs after (expected 8 total: 7 fixed + 1 untouched HTML site;
    found only 2), then restored all 6 via a targeted Python script with an assert
    per insertion point, then re-verified with the same count. Recorded so a
    reviewer knows this was caught and fixed BEFORE push, not left for the gate to
    find — actionlint and the offline proof script both passed only after the
    restoration, not before.'
  - "SCOPE-COUNT CORRECTION MID-FLIGHT: the dispatching session initially relayed
    a count of 8 `parse_mode=Markdown` sends; this session re-measured on
    origin/main directly (git show + grep) and found 7 Markdown + 1 HTML = 8
    parse_mode sends total, but only 7 are Markdown. No rework was needed — this
    session had already fixed the whole 7-site Markdown class, not the 2 originally
    named — but the discrepancy was reported back with its composition rather than
    silently assumed correct in either direction."
  - "AXIS CORRECTION MID-FLIGHT: the first draft of the HTML-site exemption
    justified leaving it alone by checking only whether github.actor could contain
    `<>&`. The dispatching session correctly flagged this as reasoning about one
    interpolation rather than the whole payload, and asked for a full enumeration.
    Re-derived (receipt above): the HTML message interpolates exactly two values
    (github.sha, github.actor), both confirmed on the correct axis. The exemption
    holds, but now for a stated, checkable reason rather than an unstated
    generalization."
  - "The 'Harness floor recompute' required check was NOT part of the original
    mandate and was discovered only once the PR was open and checks landed. This
    pack + brief exist specifically to satisfy it; the Gear-3 verdict itself
    (harness/fable-gate) is posted by a separately dispatched, independent session
    per generator != grader (CLAUDE.md §Agent PR Contract / §2) — this session
    authored the brief/pack (mechanical) but does not adjudicate its own diff."
