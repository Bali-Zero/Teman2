    workflow YAML (bash inside run: blocks), no Python/JS/TS source. The 'test' for
    this change is the offline guilt/innocence proof (receipt above) plus the live
    CI required checks, which exercised the real Backend Tests / E2E Tests suites
    unrelated to but unaffected by this diff."

