  - "pre-commit hooks (lease-check, anti-reward-hacking lint, secret scan, python
    lint, off-limits check) — passed."
  - "pre-push hooks (prettier, path-aware suite classification) — passed."
  - "Deterministic gear floor, merge-base anchored — floor=3, source=path, matching
