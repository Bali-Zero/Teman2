seat_diversity_note: |
  ONE build lane, so D3's >=2-build-lane non-Anthropic requirement does not bind. This is stated
  plainly because the rule DID fire on an earlier draft of this pack, which declared the Sonnet
  implementers as a second build lane: two Anthropic build seats, zero non-Anthropic builders.
  The correction is a truer description, not a dodge — a "lane" here is a unit of INDEPENDENT
  work, and the implementer subagents were not independent: they drafted to this lane's spec,
  their reports were re-measured rather than trusted, and the orchestrator authored every fix that
  ships. Declaring them separately overstated the structure. Both REVIEW seats are cross-family
  and non-Anthropic (OpenAI gpt-5.6-sol, Moonshot kimi-code/k3), dispatched on the finished diff
  with their own file access rather than on a description of it — which is also what supplies R9's
  council quorum. A reader who thinks the collapse is wrong has, in this paragraph, everything
  needed to challenge it.
diff: |
  NO FILE OR LINE COUNT IS NARRATED HERE, on purpose, and the reason is a defect this pack already
  committed once. The first version quoted a file-and-line figure emitted by
  `evidence_pack_lint.py --print-measured` — accurate for the first commit, stale by the next, and
  the countable-claims rule caught it in CI on exactly the shape this same paragraph warned about
  ("a number that goes stale between the edit and the push is exactly what that rule exists to
  catch"). Reprinting the retired figure even to explain its retirement trips the same rule, which
  is itself the lesson: a figure that must be rewritten on every push will eventually ship wrong.
  CI recomputes it from the payload, and that computation is the number that governs. The commit count is deliberately not narrated: it changes with every push
  and a number that goes stale between the edit and the push is exactly what that rule exists to
  catch.

  OVER the ~400 net-line guidance and DECLARED rather than split. The parts do not stand alone: the
  wrapper without the census is unenforced (nothing stops the next workflow from invoking the
  instrument bare), and the census without the corpus is a guard nobody proved bites — which is the
  precise failure class (superscar #2) this whole PR exists to close. Splitting would ship the
  measurement fix without the thing that keeps it measured.

  BEHAVIOUR CHANGE: `.github/workflows/p1s2-mutation-incremental.yml` gains one self-canary step and
  routes its two existing instrument invocations through the wrapper; its `push: paths:` list and
  its relevance regex each gain the three W121 trust-path files. `scripts/hermetic_verify.sh` and
  `scripts/ci/lint_hermetic_instruments.py` are new. `scripts/mutation_incremental.py` is NOT
  modified.
receipts:
