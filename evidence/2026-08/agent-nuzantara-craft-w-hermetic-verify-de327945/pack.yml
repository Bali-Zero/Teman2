pii_scan: clean
pii_note: |
  No client data, no credentials, no PII touched or referenced. The diff is CI tooling: a bash
  wrapper, a workflow-text lint, a workflow file and a pytest corpus. No network egress is
  introduced; the wrapper spawns only the command it is handed.
dissent:
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane, round 3)"
    objection: |
      HIGH — the same-line twin survives. `_COMMAND_ENDERS` closed only the multi-line shape;
      `bash scripts/hermetic_verify.sh -- echo ok; python3 <instrument>` and its `&&` variant both
      return ZERO violations while the instrument runs bare.
    disposition: |
      ACCEPTED, and it ended the patching. Three successive proximity rules were each defeated by
      their own twin — "anywhere earlier in the block", then "same line or backslash-joined", then
      "reject separators before the backslash". Every version answered "is a wrapper mention NEAR
      this instrument?" when the question is "is this instrument running INSIDE a wrapped command?".
      So the rule was REPLACED, not patched a fourth time: the block is segmented into shell
      commands and each is judged alone. A 12-row matrix now pins every historical bypass and every
      legitimate wrapping shape; degrading segmentation back to proximity turns 4 of them red.
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane, round 3)"
    objection: |
      MEDIUM — `run: | # comment` leaves the block unscanned, the `|2` bug's sibling; and the pack's
      own `static:` claim of a clean `py_compile -W error::SyntaxWarning` was FALSE on disk at that
      moment, because a docstring edit had just reintroduced an invalid escape.
    disposition: |
      BOTH FIXED. The block-scalar pattern accepts a trailing comment; the escape is gone and
      `py_compile -W error::SyntaxWarning` exits 0. The second finding is the sharper one — the pack
      moralised about warnings training readers to ignore output while the file emitted one.
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane, round 3)"
    objection: |
      LOW-MEDIUM — two mutations survive the corpus: the post-run `rc` branch (`if [ "$rc" -eq 0 ]`
      -> `if true`) and deleting `unset PYTHONPYCACHEPREFIX`. Both behaviours are narrated in the
      header as deliberate and pinned by nothing.
    disposition: |
      ACCEPTED and FIXED. Two pins added; each now kills exactly one test under its own mutation.
      A behaviour a header calls load-bearing and no test defends is a claim, not a guarantee.
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane, round 3)"
    objection: |
      MEDIUM — push-side census gap: the job fires on push only for six paths, so a direct-to-main
      push adding a bare invocation to another workflow never runs the census. LOW — the SWEPT_TREES
      header calls the list "this repo's first-party importable Python", which is false.
    disposition: |
      Gap DECLARED with its cost, not half-fixed: adding `.github/workflows/**` to the push paths
      would also fire the full mutation gate on every workflow push to main, because the relevance
      step answers true for non-PR events. The honest fix teaches that step to compute changed files
      on push — a different concern. The header sentence is corrected to what the list can honestly
      claim: a superset of the DECLARED instruments' trees, pinned as such.
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane, round 2 on the corrected diff)"
    objection: |
      BLOCKER — the census lint and this corpus are EXECUTED BY NOTHING. Both are named in
      p1s2-mutation-incremental.yml only under `paths:` and the sentinel regex, which decide whether
      the JOB runs; no `run:` step ever invokes either. The corpus's only other executor is
      `scripts/tests/ sweep`, which is `continue-on-error: true` and in no required context.
    disposition: |
      ACCEPTED and FIXED, and it is the sharpest finding of either round because it is the defect
      this PR's own commit message accuses its predecessor of. Confirmed before believing it:
      `grep -rln lint_hermetic_instruments .github/workflows/` returned exactly one file, from its
      `paths:` list. I had fixed the TRIGGER and not the EXECUTION — the half that looks right.
      Two steps added: the census lint runs UNCONDITIONALLY (its subject is every workflow in the
      tree, so a PR adding a bare invocation to an unrelated workflow — which matches no sentinel
      path here — is exactly the case it exists for), the corpus runs relevance-gated (its subject
      IS this workflow's trust-path files). A new pin asserts both are INVOKED in a `run:` step and
      that the lint carries no `if:`; removing the invocation and gating it are each CAUGHT.
      Third instance of superscar #2 inside this single PR.
  - status: CONFIRMED
    seat: "codex-gpt-5.6-sol (review lane)"
    objection: |
      BLOCKER — "the workflow step is not unconditional": every work step is gated on
      `steps.relevant.outputs.run == 'true'`, and the relevance regex does not list the wrapper, so
      a PR that edits ONLY scripts/hermetic_verify.sh runs nothing and the required check stays
      green.
    disposition: |
      ACCEPTED and FIXED. Verified in the workflow before believing it. The wrapper, the census lint
      and this corpus are now in BOTH the `push: paths:` list and the relevance regex, and the
      corpus pins the two lists EQUAL so neither can gain a path the other lacks.
  - status: CONFIRMED
    seat: "codex-gpt-5.6-sol (review lane)"
    objection: |
      BLOCKER — "the wrapper can exit 0 using stale bytecode": PYTHONDONTWRITEBYTECODE forbids
      writes, not reads; the sweep covered only scripts/ and apps/ while the driver also mutates
      packages/; and `rm -rf ... || true` never verifies the removal succeeded.
    disposition: |
      ACCEPTED and FIXED, both halves. Verified against scripts/mutation_incremental.py:204 in this
      worktree first. SWEPT_TREES now covers the driver's whole include_glob (and infra/), the
      corpus pins it as a SUPERSET of that glob with a premise check, and removal is VERIFIED by
      re-counting — a surviving cache is exit 3, never a silent pass. Measuring the fix also
      surfaced the vendored-tree cost (3216/3679) and produced PRUNED_DIRS, which the objection did
      not anticipate and which the fix needed to be correct rather than merely broader.
  - status: CONFIRMED
    seat: "codex-gpt-5.6-sol (review lane)"
    objection: |
      BLOCKER — "the measurement driver stays fail-open when mutmut fails":
      `_run_mutmut_on_targets` never inspects `proc.returncode`, so a mutmut that exits non-zero
      having done nothing yields an empty survivor list and the gate prints STRATO-2 PASS. Its own
      docstring claims the opposite ("a mutmut harness error must not silently PASS ... so we log
      loudly") while the code does not log on that path at all.
    disposition: |
      ACCEPTED AS REAL, NOT FIXED HERE, AND NOT DROPPED. Verified at
      scripts/mutation_incremental.py:593-622: `check=False`, returncode never read, and the only
      logging is in the `except OSError` branch — which a non-zero exit does not enter. It is
      PRE-EXISTING code outside this diff, and the fix flips a gate from pass to fail, which needs
      its own guilt+innocence and its own blast-radius thinking rather than riding along on a
      measurement-environment PR. Ledgered as a PENDING-ARMS follow-up and named in the PR body so
      the next reader inherits the finding rather than rediscovering it.
  - status: CONFIRMED
    seat: "codex-gpt-5.6-sol (review lane)"
    objection: |
      HIGH — "the canary verifies a different process than the one producing the measurement": the
      canary probes the interpreter resolved at canary time; `env -u PYTHONDONTWRITEBYTECODE`,
      `python -E`, a nested interpreter or a conftest setting `sys.dont_write_bytecode = False`
      all defeat the environment AFTER the canary has passed.
    disposition: |
      ACCEPTED and CONVERTED FROM A DECLARED LIMITATION INTO A MEASURED ONE. A limitation that can
      be measured should be measured. The wrapper now re-checks SWEPT_TREES after the command: a
      command that exits 0 having written bytecode exits 3 instead, because a green produced under
      a defeated environment is exactly the artifact this script exists to stop; a command that
      already failed keeps its own exit code (it carries more information than a generic 3) and
      gets a loud warning. It still cannot PREVENT a hostile command — that residue is stated in
      the wrapper's own "WHAT THIS CANNOT DO" block rather than left implicit.
  - status: CONFIRMED
    seat: "codex-gpt-5.6-sol (review lane)"
    objection: |
      HIGH — "the lint has direct bypasses": a wrapper mention anywhere earlier in the block
      excuses a bare call; `run: |2` is not recognised as a block scalar; and `cd scripts && python3
      mutation_incremental.py`, `PYTHONPATH=... -m mutation_incremental`, a `make` target, a
      `${{ matrix.* }}` indirection, a composite action under .github/actions/, and a
      concatenated path all evade a textual rule.
    disposition: |
      SPLIT. The two that make the lint report a FALSE GREEN are fixed and pinned by guilt fixtures:
      an earlier-line wrapper mention now only protects an invocation when every intervening line
      ends with a backslash continuation (the real wrapping shape), and the block-scalar pattern
      accepts YAML indentation indicators in either order. The remaining evasions are genuine limits
      of a textual rule; they are ENUMERATED in the module docstring and in this pack's `risks:`
      rather than papered over. Basename matching would catch the `cd scripts &&` form but
      false-positives on `test_mutation_incremental.py`, so it is deferred with its reason stated
      instead of bolted on.
  - status: CONFIRMED
    seat: "codex-gpt-5.6-sol (review lane)"
    objection: |
      HIGH — "if the lint were made unconditional it would turn unrelated PRs red": a `run:` line
      that merely ECHOES an instrument path is classified as a bare invocation.
    disposition: |
      ACCEPTED AS TRUE, AND ALREADY DECLARED — the module docstring states the scope limit and that
      the bias is deliberately toward FALSE POSITIVES, "the safer direction for a guard whose job is
      catching an unwrapped instrument". The objection is a correct reading of a documented trade,
      not an undisclosed defect. The empirical answer to the harm it predicts is the live-tree
      measurement: 106 workflows, 0 violations — the lint reddens nothing today.
  - status: CONFIRMED
    seat: "codex-gpt-5.6-sol (review lane)"
    objection: |
      HIGH — "the 13 tests do not prove the wrapper mode": every wrapper test uses
      `--self-test-only`, so mutating `"$@"; rc=$?` to `true; rc=0` leaves all 13 green. The
      wrapper's actual job — running a command and propagating its status — is untested, and the
      W121 reproduction test can end SKIPPED, so the suite can be green without ever having
      reproduced the phenomenon.
    disposition: |
      ACCEPTED and FIXED. This was the single most valuable finding of the round: a corpus that
      cannot notice the wrapper not running its command is the same class of defect as the bug the
      wrapper cures. The corpus now exercises the command path directly (exit-code propagation,
      empty command, a sentinel file proving the command actually ran, and the hermetic env reaching
      the child), which is what kills the `"$@"` -> `true` mutation.
  - status: CONFIRMED
    seat: "codex-gpt-5.6-sol (review lane)"
    objection: |
      MEDIUM — the "propagates its exit code EXACTLY" contract is not met for three shapes: a
      command killed by SIGTERM surfaces as a normal exit 143 rather than the same wait-status; an
      exported SHELLOPTS can leak `set +e` into a later child shell; and a non-existent TMPDIR makes
      `mktemp` fail with 1, not the documented 3.
    disposition: |
      ACCEPTED AS TO THE CLAIM, corrected by weakening the CLAIM rather than the code. The word
      "EXACTLY" was doing work the implementation does not do, which is the overclaim this PR is
      about. The header now says "whatever bash reports as the command's exit status, not a faithful
      re-raise", names the SIGTERM case explicitly, and notes that no caller in this repo inspects
      wait-status directly. Signal re-raise is not implemented: it would add a trap dance for a
      distinction nothing consumes.
tests: |
  scripts/tests/test_hermetic_census.py — 13 -> 43 tests, 43 passed (re-counted on disk at gate
  time; this field said "28" until then, a number true after round 1 and stale after rounds 2-3
  added the 12-row historical-bypass matrix. A pack that narrates a test count is making a
  countable claim, and it drifts the moment the corpus grows). Run under the hermetic
  environment the PR itself installs (PYTHONDONTWRITEBYTECODE=1, -p no:cacheprovider, caches
  cleared each run), because a corpus that measures its own subject must not be measured through
  the defect it is measuring (W121, and W107's "the probe that measures a disease can have it").

  MUTATION-PROVED BY THE GATE, not by the implementer's report. Three mutations applied to the
  PRODUCTION files by the orchestrator, each verified APPLIED before running and restored
  byte-identical after:
    - `"$@"; rc=$?` -> `true; rc=0` (the wrapper stops running its command) -> 5 FAILED
    - SWEPT_TREES back to the pre-fix "scripts apps" (BLOCKER 2) -> 2 FAILED, naming `packages`
    - the lint's earlier-line loophole reopened -> 1 FAILED
  The implementer additionally reported a per-test revert measurement for all 15 new tests; those
  three are the ones the gate re-ran independently, and they are the three the PR turns on.

  RE-RUN AT FINAL GATE (fresh orchestrator context, caches disabled): the segmentation rule
  degraded to whole-block proximity — `_segments` returning the entire block as one segment, i.e.
  the ORIGINAL defeated rule — turns 6 rows RED: all five historical-bypass matrix rows (round-1
  completed-call-above, round-2 `&&`-before-backslash, and all three round-3 same-line separators
  `;` `&&` `|`) plus the named earlier-already-exited-wrapper test. Restored from a byte copy
  (never `git checkout --`, W125) and re-run: 43 passed.
static: |
  `bash -n scripts/hermetic_verify.sh` clean under bash 3.2.57; `py_compile` of the census lint
  clean with `-W error::SyntaxWarning` (an earlier draft emitted two SyntaxWarnings from backslash
  escapes in docstrings — a lint that prints warnings trains its readers to ignore its output);
  `actionlint` on the modified workflow; ruff.
notes: |
  ORDERING NOTE, recorded because it was wrong. The refuter's round-1 report was already on disk
  when this PR was opened and was not read until the next session picked the lane back up. Nothing
  merged on the strength of it, so no damage — but "dispatched" is not "dispositioned", and a
  refuter verdict sitting unread is indistinguishable from one that never ran.
