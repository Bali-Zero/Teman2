dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      Self-disarming wiring check: test_organ_heartbeat_workflow_wiring.py's
      module docstring claimed that CI running this file at all already
      proves the required step exists ("no step actually executes the
      guards" was asserted to be uncoverable). That claim is wrong -- this
      file's own collection does not depend on the required step; on a
      deletion of the whole step it would keep passing by falling back to
      the gateless continue-on-error `scripts/tests/` sweep. The two
      existing superset assertions prove the PATH LISTS are wired, not that
      any step actually invokes pytest against the guard files.
    status: CONFIRMED
    resolution: >-
      Added test_a_step_actually_executes_both_guard_files, requiring the
      literal "pytest" token plus both guard filenames in the same step's
      run: text (not merely mentioned in a comment or pathspec elsewhere --
      caught live while first drafting this test: the `id: relevant` step's
      own explanatory comment mentions both filenames without invoking
      pytest on either). Guilt/innocence-verified via a mutation dropping
      one filename from the real step (correctly RED with an `assert []`
      failure) and a restore (correctly GREEN). The docstring was corrected
      to state the honest residual risk instead: a step deleted OUTRIGHT
      still escapes this specific test (its own executor is gone with it),
      but that is a structural property of every named step in every
      required workflow in this repo, not a gap unique to this one -- and
      it is already covered by this repo's Gear-3 hot-zone gate on any
      `.github/workflows/*` edit (the gate this very diff went through),
      not by a test file trying to out-recurse its own deletion.
  - seat: codex-gpt-5.6-sol
    objection: >-
      Fragile multi-match PASS-count parsing: an early draft of the new
      step scanned the ENTIRE captured pytest output for every `\d+ passed`
      occurrence. If that substring shape ever appeared more than once (a
      warning line, or any future line that happens to contain the same
      shape), `$PASSED` became multi-line, `[ "$PASSED" -lt 3 ]` errored
      with "integer expression expected" instead of comparing, `[` returned
      non-zero either way, and the `if` body was skipped -- a SILENT PASS
      on a value the check could not actually parse, precisely on the
      input shape this check exists to catch.
    status: CONFIRMED
    resolution: >-
      Reproduced the exact failure live against a synthetic two-match
      string before accepting the finding. Fixed by anchoring extraction to
      the LAST line matching pytest's own summary shape
      (`grep -E '^[0-9]+ (passed|failed|error|skipped|warning)' | tail -1`),
      asserting that line starts with "<N> passed" before parsing at all
      (an early exit with a clear `::error::` if it does not), and only
      then extracting the leading integer. Re-verified the anchored fix
      against 5 constructed scenarios (clean pass, clean fail, an
      all-skipped exit-0 run, the original two-match adversarial string,
      and the real current output) -- correct verdict in all 5.

