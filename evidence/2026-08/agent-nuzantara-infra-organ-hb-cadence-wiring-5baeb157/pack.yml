what_changed: |
  3 files, all under .github/workflows/organ-conformance.yml's own
  "conformance" job:

  1. .github/workflows/organ-conformance.yml -- added the 4 missing
     GUARD_READ_SET paths (the two guard test files, the bridge script, and
     the renamed plist fixture) to both `on.push.paths` and the in-job
     `id: relevant` step's bash pathspec; added a new named step "An organ
     cannot beat faster than its bridge's poller", gated on
     `steps.relevant.outputs.hit == 'true'`, placed after "Install test
     deps" (so pytest/pyyaml are on the runner) and after the sibling
     stale-detector step. The step captures pytest's output via
     `OUT=$(...) && EXIT=0 || EXIT=$?` (safe under bash's real default
     `-eo pipefail {0}` invocation -- see team-lead's own PR #5438
     REWORK-BUILD finding on the bare, unprotected form), echoes it
     unconditionally, fails loudly with `::error::` on non-zero exit, then
     additionally asserts the pytest summary line starts with "<N> passed"
     with N >= 4 -- an exit-0 run where every case was skipped (or
     collection came back empty) must not read as green.

  2. scripts/tests/test_organ_heartbeat_exceeds_poller_interval.py --
     added the GUARD_READ_SET frozenset constant (consumed by file 3) and
     a code comment (no logic change) explaining the drift-check test's
     whole-dict comparison.

  3. scripts/tests/test_organ_heartbeat_workflow_wiring.py (new file) --
     three pytest tests parsing the workflow's own YAML: two assert
     `on.push.paths` and the in-job pathspec are supersets of
     GUARD_READ_SET; the third (test_a_step_actually_executes_both_guard_files,
     added in this PR's own council round after codex-gpt-5.6-sol's finding
     1) asserts some step's `run:` text contains the literal token
     "pytest" AND both guard filenames together -- catching the case where
     the two superset checks are wired but no step actually executes the
     guards, without the earlier version's guard-over-match bug (a
     filenames-only match also matched the unrelated `id: relevant` step's
     own explanatory comment).

