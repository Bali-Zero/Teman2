task_id: canon-block-comparator-craft-h-l10pr2
gear: 3
l_level: L2
gate_class: opus
objective: |
  Nothing compares the fleet's three copies of the global `~/.claude/CLAUDE.md`, and they
  disagree about how work ships.

  That file is injected at turn 1 into every session and every subagent on the machine that
  holds it. It is per-machine by design — it carries paths and roles that MUST differ — and it
  is control-plane, so no automation owns it. The consequence, measured 2026-08-31: M5 is
  27,377 B, Pro and Mini are 22,795 B, and the difference is not cosmetic. Pro and Mini carry
  no SHIP-LIFECYCLE HARD RULE at all; they carry the SUPERSEDED "no paid APIs ever" wording of
  a rule Zero downgraded on 2026-06-04; and they still name a seat retired on 2026-07-19. Two
  of those govern how work ships and what it may cost, on the machines where most of the
  fleet's work happens.

  This ships the organ that would have said so: a read-only proprioception probe that compares
  MARKED BLOCKS, not files, plus the separate write-half that publishes the digests.

  It does NOT mark any blocks and it does not touch the operator's file. Marking the doctrine
  blocks and porting the three missing sections is control-plane work the session may not do;
  it is escalated, not smuggled in here.

constraints:
  - "BLOCK LEVEL, NEVER WHOLE FILE. The file is supposed to differ per machine, so a whole-file
    hash alarms on every legitimate difference and is switched off inside a week — at which
    point the organ is worse than absent, because its silence now reads as agreement. Only
    regions a human has explicitly marked `<!-- CANON:id -->` are compared."
  - "UNPROBEABLE WHEN NOTHING IS MARKED, and this is today's state on every machine: `grep -c
    'CANON:'` returns 0 on M5 and 0 on Pro. A comparator reporting 'all blocks agree' across
    three files containing zero blocks would be the purest instance of the disease it exists to
    detect (superscar #2). Every absence — no file, no markers, no report, unreadable report,
    stale report, every peer quiet — is reported AS an absence and never as agreement."
  - "The probe NEVER writes. The file it watches is control-plane and per-machine; a watcher
    that can also write is one `--fix` away from becoming the thing that makes the three copies
    diverge (superscar #1). The write half is a separate, explicitly-invoked script, and it
    publishes DIGESTS ONLY — a report carrying the text would be a fourth copy of the file, and
    the whole point is that there are three."
  - "Whitespace is normalised and nothing else is. Trailing spaces and line endings differ
    between machines for reasons that are not doctrine, and treating them as drift makes the
    first real finding arrive inside a crowd of false ones. A single reworded sentence must
    change the digest, or the comparator is decorative. Both directions are pinned."
  - "The comparison is symmetric. A block present here and absent on a peer, and a block present
    on a peer and absent here, are BOTH findings — the machine doing the reading might be the
    stale one, and a comparator that only looked outward would never say so. The real Pro/Mini
    divergence is exactly the first shape: an entire section missing on one side."
  - "No allowlist, no exemptions, no grandfathering. Nothing in this PR is exempted from the
    probe, because nothing yet is marked; the first marked block is judged by the same rule as
    the last."

acceptance:
  - text: >-
      WHEN one machine's fixture copy carries a canon block whose body differs from another's,
      the probe SHALL report DIVERGED and name the peer it differs from.
    probe: >-
      pytest scripts/tests/test_canon_blocks.py -k "reworded_rule or block_missing_on_a_peer or
      present_only_on_a_peer" — and, end to end, the two-machine M5->Pro fixture run recorded in
      the pack's third receipt.
  - text: >-
      WHILE every fixture copy carries identical canon blocks, the probe SHALL be silent, and IF
      the copies differ only OUTSIDE a marked block it SHALL still be silent.
    probe: >-
      pytest scripts/tests/test_canon_blocks.py -k "identical_blocks_are_silent or
      divergence_OUTSIDE"
  - text: >-
      WHERE no machine has marked any canon block — today's state on every machine — the probe
      SHALL report UNPROBEABLE naming that absence, and SHALL NOT report agreement.
    probe: >-
      pytest scripts/tests/test_canon_blocks.py -k "no_markers or report_holding_ONLY_this_machine"
  - text: >-
      IF this PR's sentinel path is removed from immune-enforcement.yml, the trigger-symmetry check
      SHALL fail — the arming is proven by mutation, never by the line's presence.
    probe: >-
      delete the `scripts/tests/test_canon_blocks.py|\` line, then
      pytest scripts/tests/test_immune_enforcement_trigger_symmetry.py — recorded in the pack's
      "THE ARMING IS PROVEN" receipt.
  - text: >-
      WHILE the corpus runs, it SHALL read no file under the operator's real ~/.claude: every test
      builds a synthetic HOME under tmp_path.
    probe: >-
      grep -c 'Path.home()\|~/.claude' scripts/tests/test_canon_blocks.py restricted to
      non-comment lines; every test takes tmp_path and calls _home().
out_of_scope:
  - "Marking the canon blocks in `~/.claude/CLAUDE.md`. That is an edit to the operator's
    control-plane file on three machines — operator[control-plane], escalated separately."
  - "Porting the three missing sections into Pro's and Mini's copies. Same reason, and it is the
    finding this organ exists to surface, not something to fix silently while shipping the
    detector."
  - "Scheduling the publisher. It is a script with no LaunchAgent here on purpose: a cron that
    writes to `~/.claude/` on three machines is a separate decision with a separate blast
    radius, and shipping it in the same PR as its own watchdog would arm the writer and the
    reader in one motion."
