lint_notices_accepted: >-
  `acceptance-probe: 7 declared probe(s) appear in no receipt's claim/cmd` is accepted rather than
  chased. It read 5 until this round's two under-match clauses were added; the count is restated
  rather than left stale, because a number that quietly stops matching its own artifact is the
  defect this wave has now produced four times. The outcomes ARE recorded — the receipt above
  pii_scan runs the original five and reports 3/2/2 passed plus the red-then-green sentinel
  deletion, and the guilt/innocence and mutation receipts run the two new ones — but the rule matches the probe
  text as a SUBSTRING of a receipt's cmd, and my receipt states the five commands as one
  YAML-folded line. Reshaping that text until a substring matcher is satisfied would be exactly the
  form-instead-of-entity move this whole PR spent the day removing from its own guards, so the
  outcome is recorded plainly and the notice is left standing. `evidence_root_deprecated` fires
  only because the lint was run against the harness copy at /tmp/evidence-check/evidence/pack.yml;
  the real pack lives at its per-PR path.
pii_scan: clean
pii_scan_note: >-
  Nothing in this diff, brief or pack transcribes client data. The probe reads a doctrine file and
  emits sha256 digests; the publisher transmits digests and block IDs and never block text. One
  residual is named rather than left implicit: block IDs DO travel verbatim as JSON keys, so an id
  chosen to look like a document number would travel too. The IDs are author-chosen topic names
  constrained to [A-Za-z0-9._-], the marking step is the operator's, and the constraint is written
  where the marker regex is defined — but it is a convention, not an enforcement, and it is
  recorded here as such.
dissent:
  - seat: codex gpt-5.6-sol (blind refuter) and kimi-code/k3, independently
    objection: >-
      "The only deployed state explicitly covered is 'no markers', accepted as UNPROBEABLE; nothing
      in the diff installs markers or invokes the publisher. The registered P1 guard therefore has
      no reachable comparison path on the stated fleet state." Kimi put it more sharply: nothing
      schedules the publisher either, so the steady state is UNPROBEABLE forever absent an operator
      remembering a manual step.
    status: CONFIRMED
    resolution: >-
      Accepted as stated and NOT fixed here, deliberately. Marking canon blocks is an edit to the
      operator's ~/.claude/CLAUDE.md on three machines, and scheduling a writer into ~/.claude is a
      separate blast radius — shipping the writer's cron in the same PR as its own watchdog would
      arm both in one motion. What was done instead: the reachability is PROVEN across two real
      machines on a fixture path (receipt 3), so the wire is known to work rather than assumed, and
      UNPROBEABLE is checked to be low-noise — the receptor counts it in a header and does not page
      it as P1, so a permanently-unprobeable organ is honest rather than an alarm nobody reads. The
      marking and the schedule are named in the brief's out_of_scope as operator[control-plane].
  - seat: kimi-code/k3
    objection: >-
      The skip-self guard in the publisher compares an SSH ALIAS (`pro`, `mini`) against a HOSTNAME
      (`Air-M5`, `Nuzantara`), so it can never fire: a machine copies its fragment onto itself and
      reports "push pro: ok", masking a failure to reach any other machine.
    status: CONFIRMED
    resolution: >-
      Half-fixed and the remainder named. Under the fragment scheme a self-copy is a byte-identical
      no-op rather than a corruption, so the danger is gone; what remains is a push that proves
      nothing being reported as success. That is now written at the call site rather than left for
      the next reader to rediscover. Mapping aliases to hostnames needs a fleet-topology lookup this
      script does not have and should not grow.
  - seat: session (grading the non-Anthropic build lane's test)
    objection: >-
      Not an objection to the build lane but a defect in what it delivered, found by mutating rather
      than by reading: the test pinned `Path.replace` by NAME, so `os.replace(tmp, path)` — an
      equally correct atomic commit — turned it RED on working code.
    status: CONFIRMED
    resolution: >-
      Amended in place with the reason written into the test: both rename primitives are recorded,
      the property (the final path is never written into directly) is asserted alongside the
      mechanism, and exact-list equality became membership because Path.replace is itself
      implemented on os.replace and one rename was being seen twice. All three mutation directions
      re-run afterwards.
  - seat: session (self-review, first draft of the quiet-peer filter)
    objection: >-
      The filter matched a machine NAME against a prefix of its own display line, and the test
      written to catch that used Pro/Pro2 — which the trailing space already separates, so the
      mutant survived and the test was VACUOUS.
    status: CONFIRMED
    resolution: >-
      Rewritten with a name that is a space-delimited prefix of another; the mutant now dies, and
      the vacuous first attempt is recorded in the test's own docstring so the next reader sees why
      that fixture shape was chosen.
  - seat: session (self-review)
    objection: >-
      Three of this lane's mutations silently failed to apply — ruff had reflowed their target lines
      — and each reported a green run as a KILL.
    status: CONFIRMED
    resolution: >-
      Every mutation after that ran through a harness that asserts its target string exists before
      writing, and the earlier ones were re-run through it. No mutation result in this pack comes
      from an unasserted substitution.
