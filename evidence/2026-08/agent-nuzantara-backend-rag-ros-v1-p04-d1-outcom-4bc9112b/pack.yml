dissent:
  - seat:
      "independent reviewer (fresh context, not this diff's author), cross-checked by a
      second reviewer from a different model family converging on the same file:line"
    objection: >-
      fixtures/outcome_event/valid_with_supersedes_and_extension.json supersedes
      valid_minimal.json with a byte-identical recorded_at (2026-04-15T00:05:01Z on
      both). graph.py:124 quarantines exactly that condition
      (successor.recorded_at <= predecessor.recorded_at ->
      successor_recorded_at_not_later, CONTRACTS.md:863 requires strictly later).
      The one fixture whose entire purpose is to demonstrate a working supersedes
      chain was rejected by the resolver it exists to exercise.
    status: CONFIRMED
    note: >-
      FIXED. Timestamp bumped to ...:02Z, object_hash recomputed through the real
      object_hash(). The cure is not the value edit:
      test_supersedes_fixture_is_current_in_the_real_graph_resolver drives the actual
      GraphMember/ObjectSuccessorEdge/select_current_member and proves BOTH arms with
      returned values recorded, not asserted-and-forgotten — ARM 1 (fixed):
      Current(member=GraphMember(..., recorded_at=2026-04-15 00:05:02+00:00)). ARM 2
      (tied, reproduced on purpose): Quarantined(reason_codes=('successor_recorded_at_not_later',)).
      Re-verified this session: present at line 179, passing in the 13/13
      test_outcome_event.py run (receipt above).
  - seat: "independent reviewer (fresh context)"
    objection: >-
      outcome_event.schema.json contained zero conditional constructs (no
      if/then/allOf/oneOf/dependentRequired, only pydantic's nullable anyOf). The
      metric_profile_ref/metric_result_ref joint-presence rule (CONTRACTS.md:865)
      lived only in outcome_event.py's validator, in prose in the spec — a consumer
      validating against the published schema alone accepts documents the model
      rejects.
    status: CONFIRMED
    note: >-
      FIXED, following the precedent an existing sibling kind in this package already
      set (bidirectional if/then via ConfigDict(json_schema_extra=...)). The obvious
      fix (dependentRequired) would have been wrong: it tests key presence while the
      model's is-None check tests value, and this contract uses presence-preserving
      null semantics — a present-and-explicitly-null key hashes as a different
      document from an absent key, so dependentRequired alone would accept a
      present-but-null field the model still rejects. Verified by enumeration, not by
      example: all nine combinations of {absent, explicit null, value} x {profile,
      result} checked against an independently derived expected verdict (never
      schema==model, which would be an identity check, not a guard) — all nine agree.
      Schema regenerated through the real schema_bytes() generator, never
      hand-edited; re-verified this session: checked_in_schemas_match() == () and
      validate_schema_artifacts() == () (receipt above).
  - seat: "independent reviewer (fresh context)"
    objection: >-
      V1_RESERVED_EXTENSION_FIELD_NAMES (primitives.py) is a flat, top-level-only set,
      so a core field name nested inside extensions.<ns>.payload is accepted although
      the field's own docstring and CONTRACTS.md:46 both say a reserved name "cannot
      be smuggled ... at ANY DEPTH". Real, and repo-wide rather than specific to this
      kind.
    status: CONFIRMED
    note: >-
      NOT FIXED here, deliberately. Already recorded in
      .claude/skills/modus/PENDING-ARMS.md (opened 2026-08-23, "The extension jail
      ... protects only TOP-LEVEL core field names"): re-deriving the reserved set
      from every model field across all 9 registered kinds finds ~51 unreserved
      names, about half bare common English words (count, name, size, type, kind,
      role, threshold, ...) — jailing those rejects legitimate extension payloads
      wholesale, superscar #3 (over-match on a bare token). The real fix is
      path-aware, a design decision, not a patch. primitives.py is genuinely absent
      from this PR's own three-dot diff against origin/main (re-verified this
      session); a third correcting PR on that file here would be a fix-of-a-fix at
      depth 2, forbidden by the Agent PR Contract rule 8.
  - seat: "independent reviewer (fresh context)"
    objection: >-
      Both fixture-loading loops in test_outcome_event.py iterate a glob with no
      assertion that the glob matched anything — rename or empty the fixtures
      directory and the tests pass having validated zero fixtures, the identical
      green as a run that validated all of them.
    status: CONFIRMED
    note: >-
      FIXED. Both loops (test_valid_fixtures_round_trip,
      test_invalid_fixtures_reject_with_exact_expected_reason) now assert non-empty
      (assert fixture_paths, f"expected at least one ... fixture for
      {CONTRACT_KIND}"), matching the shape three sibling test files already use
      rather than inventing a fourth. Re-verified this session by reading the
      current file: both asserts present at lines 31 and 46. The remaining
      vulnerable sibling test files are ledgered separately, not fixed here — out of
      this PR's one concern.
  - seat: "session (this evidence migration, against its own merge)"
    objection: >-
      Merging origin/main into a 47-commits-behind branch and resolving the two
      fixed-root evidence files by taking main's side whole is exactly the kind of
      wide, mechanical merge where a union-style resolution can drop a line silently
      and look identical to a correct one (W125) — a real risk worth naming even
      though this merge's only two conflicts were on files this PR does not need to
      keep any content from.
    status: CONFIRMED
    note: >-
      Checked, not assumed: `git show origin/main:evidence/brief.yml | diff -q -
      evidence/brief.yml` and the same for pack.yml both report identical — the
      resolved files are byte-for-byte main's, zero silent loss possible on a file
      that was supposed to end up byte-identical. The three registration files
      (cli.py, models/__init__.py, schemas/__init__.py), which DID need a real
      three-way merge of both sides' changes, are checked separately by the set-diff
      receipt above (14->15, outcome_event the only addition) rather than by a
      diff-against-one-side check, since both sides of that merge were live.
