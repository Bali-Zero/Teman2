    role: build
    seat:
      claude-opus-5 (conducting session — integration, the organ rebirth, the
      merge resolutions, and the evidence in this pack)
  - lane: kb-topic-artifacts
    role: build
    seat:
      claude-sonnet-5 (four topic lanes (immigration, property, tax, company) —
      inventories, journeys, probes, contract tests)
  - lane: kb-topic-artifact-floor
    role: build
    seat: kimi-for-coding (Kimi K3, non-Anthropic) — authored the change turning
      printed coverage into an asserted ratchet in test_kb_topic_contract.py;
      graded by the conducting session, never by itself
  - lane: kb-adversarial-review
    role: review
    seat: kimi-k3 (cross-family refuter on the integrated diff and on the two
      research documents)
  - lane: kb-independent-graders
    role: review
    seat: claude-sonnet-5 (fresh-context graders; each re-measured against
      production rather than reading a predecessor's report)

