plan_ref: >-
  PR #4974 (feature/kb-current -> main) — kb-current-live campaign integration,
  per docs/plans/2026-08-25-kb-current-live/MANDATE.md and the product procedure
  in docs/factory/ASSEMBLY-LINE.md. Local-first integration branch: lanes merged
  by the conducting session only, no per-lane PRs of state.

lanes:
