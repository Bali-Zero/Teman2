dissent:
  - seat: organ-conformance gate (CI, deterministic)
    objection: >-
      The scheduled job this campaign built to prove its own 48h-green claim was
      itself an organ with no genes — a bare `zsh -lc` one-liner with no registry
      entry, no heartbeat, no kill switch and no fail-visibility. It could only ever
      have been observed as green, never as working: superscar #2 committed inside
      the PR whose stated purpose is measurability.
    status: CONFIRMED
    note: >-
      Not waived and not grandfathered (the baseline ratchet forbids grandfathering a
      new path, and doing so would have been the reward-hacking answer). Rebuilt via
      scripts/organ_birth.py as pro.kb_probe_history; each gene then proven load-bearing
      by mutation. A defect in organ_birth.py's own TEMPLATE was found while filling it:
      it emits `RC=$?` immediately after a COMMENT, capturing the exit status of the
      preceding log call, so a generated organ heartbeats "ok" however its payload died.

  - seat: independent grader (fresh context)
    objection: >-
      This campaign's headline finding was stated as "legal_status is systemically false
      and nothing reads it". The second half is wrong: the repealed-instrument filter is
      ALREADY ARMED and runs on every call — it simply tests a different key
      (`status_vigensi`).
    status: CONFIRMED
    note: >-
      Re-measured, not accepted on report: `status_vigensi` is present on 0 of 84,283
      points and 0 across all 14 collections of the instance. This inverts the remedy.
      Populating that key from `legal_status` — the "obvious tidy-up" a future reader
      proposes on seeing two names for one concept — emits a Qdrant `must_not`, HARD-
      excluding 42,420 points from queries rather than demoting them. The fence is now
      an explicit PENDING-ARMS dependency, not a memory.

  - seat: independent grader (fresh context, second pass)
    objection: >-
      The correction above was itself partial. `build_search_filter()` builds not one
      suppression clause but three fields' worth, and the third — `retrieval_scope` —
      is real, populated, and non-disableable by construction.
    status: CONFIRMED
    note: >-
      Verified by executing build_search_filter on the apply_filters=False path and
      observing it deliberately rebuild as exclude_historical=True. Distribution over
      84,283 points: absent 79,584 / current 4,697 / historical_only 2. So a working
      supersession mechanism exists and has been used on 2 points out of 84,283.

  - seat: session self-refutation (recorded because nothing external caught it)
    objection: >-
      "The reader exists" was then used to imply "the cure needs nothing built". False:
      the only service-side historical write is document-level and all-or-nothing.
      Applying it to UU_6_2011 would mark all 413 of its points historical — removing
      the entire immigration base law from current-law answers, the exact catastrophe
      Decision 5 warned about, reached by a different road.
    status: CONFIRMED
    note: >-
      Third instance of one shape on one surface in a single session: a finding that is
      TRUE and PARTIAL is worse than one that is wrong, because there is nothing to
      refute — only something missing, and nobody looks for what they do not know is
      absent. Transferable rule now recorded: when you find half a mechanism, go find
      the other half BEFORE recommending anything.

  - seat: kimi-k3 (cross-family refuter)
    objection: >-
      Findings against the two research documents carried by this campaign, including a
      headline that generalised a "two-thirds" rate from a partial population and an
      arithmetic error in a breakdown that did not sum.
    status: CONFIRMED
    note: >-
      Re-measured on the FULL population (27/48 = 56.2%, refuting the two-thirds
      headline) and the arithmetic corrected. A causal story in the same document was
      disproved by `git log -S` rather than by argument.

