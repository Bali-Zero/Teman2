notes:
  - "BUILT IS NOT ARMED. The cron organ is not installed by this PR and must not be until
    this branch is on main — the plist runs `cd ~/nuzantara`, the MAIN checkout, where
    kb/journeys/ still holds only .gitkeep. Arming earlier would record `nothing_measured`
    against the wrong tree four times a day. MANDATE §8's 48h-green clock has therefore
    NOT started, and nothing in this PR claims it has."
  - "Zero Qdrant writes and zero deletions across the whole campaign. The probes read
    production and assert; the one repair identified as necessary is fenced, not performed."
  - "`gh pr merge --auto` is deliberately NOT armed toward the integration branch: it
    carries no required contexts, so arming there means 'merge on any green', and green
    there certifies nothing."
