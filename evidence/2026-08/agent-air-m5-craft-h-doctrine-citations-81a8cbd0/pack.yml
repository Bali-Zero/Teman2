  SQUAD H lane 4 of 5 — L03-PR2 of
  docs/plans/2026-08-29-beyond-sota-craft-wave/L03-architecture-decision-making.md,
  under the wave-2 rules in 01-INVENTORY-AND-WAVE-2-PLAN.md §5.1. Ledger: issue #5320.

