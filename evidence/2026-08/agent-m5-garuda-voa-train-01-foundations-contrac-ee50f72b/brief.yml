task_id: garuda-voa-train-01-foundations-contracts
gear: 3
l_level: L2
gate_class: opus
objective: >
  First of four PRs landing the GARUDA VOA product on main for a production
  dark launch. This slice carries the frozen contract suite
  (products/garuda-voa/contracts/), the CI workflow that runs it
  (.github/workflows/garuda-contract-parity.yml), and the shared UI
  foundations the later frontend slice depends on (packages/core AppFrame,
  AppWizard) plus the admin preview adapter and the assembly-line doc.
  The workflow and the contract suite are INSEPARABLE and that is the whole
  point of this slice's shape — see constraints.
constraints:
  - "The workflow and products/garuda-voa/contracts/ MUST ship together. garuda-contract-parity.yml has `on: pull_request:` with NO paths filter, so it runs against every PR in the repository, and it exits 1 when `pytest products/garuda-voa/contracts/tests/ --collect-only` yields fewer than 12 tests. Those tests do not exist on main. Landing the workflow alone would redden every open PR in the fleet."
  - "No backend files. This slice must not touch apps/backend-rag/**, because that path auto-deploys to production via fly-deploy.yml and this PR is deliberately deploy-free."
  - "PENDING-ARMS.md is excluded from every train slice — it is being appended to independently by ledger PRs on main and would conflict on arrival."
acceptance:
  - "products/garuda-voa/contracts/tests/ collects >= 12 tests (the workflow's own guard) and passes."
  - "No file under apps/backend-rag/ in the diff, so no production deploy is triggered."
  - "packages/core/components/apps/AppStampReveal.tsx is already on main — verified — so this slice's packages/core subset is complete and the later frontend slice has its dependency."
consumer_map:
  - "CI: garuda-contract-parity.yml begins running on every PR in the repo the moment this lands."
  - "apps/mouth (Vercel) consumes packages/core AppFrame/AppWizard — this slice must precede the frontend slice."
  - "No runtime consumer on nuzantara-rag: this slice deploys nothing."
risks:
  - "The contract suite collects EXACTLY 12 tests against a guard that requires >= 12 — zero margin. Removing or renaming one test turns the guard red for the whole repository, not just for this product."
  - "The workflow has no paths filter by design (it must catch a contract drifting anywhere), so it adds a job to every PR in the repo. That is intended, but it is a fleet-wide cost."
grader: opus-5-session
budget:
  seats: [opus-5-session]
  fable_gate_est_tokens: not-applicable-gate-class-opus
pii: none
