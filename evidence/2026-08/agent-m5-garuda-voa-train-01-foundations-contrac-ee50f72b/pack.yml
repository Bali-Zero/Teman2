dissent:
  - seat: opus-5-session-self-review
    objection: >
      My original train plan put .github/workflows/garuda-contract-parity.yml in
      this slice and products/garuda-voa/ in the LAST slice. That would have
      landed a workflow - running on every pull request in the repository, with
      no paths filter - whose collection guard requires at least 12 tests that
      would not have existed on main until three PRs later. The blast radius was
      not this PR going red; it was every open PR in the fleet going red,
      including other people's. Caught by reading the trigger block rather than
      trusting the plan.
    resolution: "Workflow and contracts restructured into a single slice."
  - seat: opus-5-session-self-review
    objection: >
      I assembled this slice with `git checkout <ref> -- <paths>`, which applies
      additions and modifications but silently ignores deletions. This slice
      happens to contain none, so it is faithful - but the same method applied to
      the frontend slice would have dropped two route.ts deletions and broken the
      Vercel build, because Next refuses to build a route.ts and a page.tsx at the
      same path. Recorded because the method, not this diff, is the hazard.
    resolution: "Frontend slice will use git rm for the two deletions; noted in its manifest."
residual_risks:
  - "The contract suite collects exactly 12 against a >=12 guard - zero margin. A future PR that renames or removes one contract test turns the gate red for the entire repository, and the error will name the collection count rather than the rename that caused it."
  - "This workflow adds a job to every PR in the repo from the moment it lands. Intended - a contract can drift from anywhere - but it is a fleet-wide cost nobody outside this product opted into."
  - "products/garuda-voa/contracts/README.md and REVIEW.md are documentation shipped beside executable contract fixtures; nothing enforces that they stay consistent with the YAML they describe."
