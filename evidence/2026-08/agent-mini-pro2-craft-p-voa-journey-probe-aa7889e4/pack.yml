dissent:
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — `--dry-run` writes the authoritative heartbeat while skipping
      every API and cleanup check, so a dry-run could publish verdict "pass" to
      the exact file the dead-man reads. The dead-man cannot distinguish that
      synthetic green from a real run.
    status: CONFIRMED
    repro: >
      Fixed: dry-run now writes only when VOA_PROBE_HEARTBEAT is set
      explicitly, never to the default path, and every heartbeat carries
      mode: full|dry_run. Verified live this session — after `rm` of the
      default heartbeat, a --dry-run run left it absent (receipt above).
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — any laptop-side DNS/Wi-Fi/TLS/timeout failure is classified as
      a production failure. One packet-loss event while balizero.com is
      perfectly healthy yields fail/exit 1 and would authorize the dead-man to
      darken a LIVE funnel. There is no unknown state.
    status: CONFIRMED
    repro: >
      This was the most valuable finding: the probe's only downstream power is
      to turn a public surface OFF, so a false red is an outage the probe
      itself causes. Fixed by adding a fourth verdict `unknown` for
      transport-level errors we cannot attribute, exit 0, while an HTTP answer
      from a real server stays attributable and can still be fail. Both sides
      verified live (receipts above): unresolvable host -> unknown/exit 0;
      HTTP 500 -> fail/exit 1.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — the verify-GET treats every 404 as proof of deletion. If
      GARUDA_PUBLIC_ENABLED flips off between the GET and the DELETE, the
      router-level gate returns GARUDA_PUBLIC_DISABLED, which is ALSO a 404;
      the probe records verified_gone while the row survives.
    status: CONFIRMED
    repro: >
      Verified independently against the router's _ERROR_CATALOG before
      accepting (receipt above): GARUDA_PUBLIC_DISABLED is indeed (404, ...).
      Cleanup now reads the error CODE and gained a fourth counter:
      RESULT_NOT_FOUND -> verified_gone, GARUDA_PUBLIC_DISABLED -> unverified,
      200 -> leaked, anything else -> unverified. leaked forces fail;
      unverified forces unknown, never a silent pass.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      HIGH — cleanup can never mean zero production rows: check_store.py
      inserts a 30-day idempotency row on the create path AND on the delete
      path. At 96 runs/day that converges on thousands of durable rows,
      indistinguishable from customer traffic, while the heartbeat reports
      verified_gone.
    status: CONFIRMED
    repro: >
      Verified at source (receipt above) — both INSERTs exist and expires_at
      defaults to +30 days. This falsified a claim the orchestrator had
      already written in its own squad ledger ("0 rows left"), which has been
      corrected there rather than quietly dropped. The rows are the anti-replay
      ledger and deleting them would be wrong, so the honest fix is
      documentation, not code: the residual is declared below and carried as a
      needs-ruling (whether the VOA tables should grow a probe-tenancy marker
      is a backend/migration decision outside this lane).
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      HIGH — the probe validates only verdict == "ACCEPT". A body of literally
      {"verdict":"ACCEPT"} passes although the contract requires reason_codes,
      published_filing_deadline and price_idr, which the customer result page
      actually renders.
    status: CONFIRMED
    repro: >
      Fixed: the probe now asserts the contract shape (verdict in
      ACCEPT/DECLINE, reason_codes an array, and for ACCEPT a positive
      price_idr plus a YYYY-MM-DD published_filing_deadline). Corpus case (g)
      drives a missing price_idr through runJourney and expects broken.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      HIGH — hardcoding "USA issuance must ACCEPT" makes a volatile business
      outcome load-bearing. A legitimate rule or freshness change that
      correctly returns a fail-closed DECLINE would be reported as broken: a
      false red on a service working exactly as designed.
    status: CONFIRMED
    repro: >
      Fixed, and it sharpened the design: the health signal is "the funnel
      answered with a well-formed verdict", not "the answer was yes". The
      observed verdict is still recorded in the heartbeat so a human can see a
      DECLINE trend. Corpus case (f) asserts a contract-shaped DECLINE is
      healthy.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      HIGH — if a proxy strips Set-Cookie while preserving the 201 and
      Location, the DELETE is unauthorized and the verify-GET returns 404
      BECAUSE the cookie is absent. The probe records verified_gone although
      the row remains.
    status: CONFIRMED
    repro: >
      Fixed: with no cookie the probe skips the verify entirely and counts
      unverified, naming the missing cookie. Corpus case (d) drives it; the
      mutation that disabled the guard was caught only by the call-sequence
      assertion, which is why that assertion exists.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      HIGH — every process shares one <path>.tmp, so overlapping runs can
      clobber each other and one rename can publish the wrong run's verdict.
      Separately, the heartbeat write sits OUTSIDE the catch-all and main() is
      called without .catch(), so a disk-full produces an unhandled rejection
      and NO heartbeat — breaking the file's own promise.
    status: CONFIRMED
    repro: >
      Both fixed: per-process temp name, and the write is wrapped with a loud
      stderr FATAL plus a .catch() on the main() invocation.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      HIGH — the corpus never calls runJourney at all, so a mutation deleting
      DELETE entirely, or treating every verification as success, leaves it
      green. The wrapper cases stub only a successful probe, so a wrapper that
      always returned 0 would pass.
    status: CONFIRMED
    repro: >
      Fixed: corpus grew 8 -> 37 checks and now injects a fake fetchImpl into
      the exported runJourney for the happy path, leaked row, flag-off 404,
      missing cookie, transport error, DECLINE, and contract-missing-field;
      wrapper cases now cover missing-probe (exit 2) and nonzero propagation.
      Mutation-tested: breaking the leaked branch (4 red), the flag-off branch
      (4 red), the no-cookie guard (1 red) and the transport classifier (3 red).
      One mutation left the self-test green while the runJourney cases went
      red — evidence the two layers are not redundant.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — the plist ships unresolved __HOME__/__REPO_ROOT__ placeholders
      and the commit adds no installer or bootstrap step, so merging schedules
      nothing.
    status: CONFIRMED
    repro: >
      Fixed by adding infra/launchagents/install_voa_probe.sh (substitutes the
      placeholders, refuses if the resolved repo root lacks the probe,
      plutil-lints the rendered plist, bootout-then-bootstrap, prints the
      verification commands). The orchestrator arms it on Mini and records
      launchctl print + a real heartbeat line as the proof — a merged plist is
      not an armed one (superscar #2).
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      MEDIUM — the implementation contradicts its own lane spec: the spec's
      acceptance says a dark route must produce FAIL, the probe returns `dark`
      and exits 0, and no test detects the drift.
    status: PLAUSIBLE
    repro: >
      Accepted as a real deviation, REJECTED as a defect, and made explicit
      rather than hidden. Taken literally the spec's rule makes the heartbeat
      permanently red before go-live, so the dead-man would fire on every tick
      — an alarm that always fires is an alarm nobody reads (W104). The
      deviation and its reasoning are recorded in the squad ledger and in this
      pack's brief; the tri-state decision is pinned by self-test assertions so
      a future silent drift is visible. The spec's underlying intent — a dead
      funnel must be detectable — is preserved: `page dark + API broken` is
      still fail (proven live).
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — the probe never drives the browser. Broken JS chunks, failed
      hydration, dead buttons or a broken client-side result page all still
      yield a green if the server-rendered marker and the APIs survive.
    status: CONFIRMED
    repro: >
      Accepted as TRUE and NOT fixed in this PR — declared as a residual risk
      instead of silently carried. An HTTP-level probe is a legitimate first
      receptor at a 15-minute cadence and is what this lane's spec scoped;
      browser-grade journeys are L11's lane (which owns Playwright production
      sentinels). Fixing it here would duplicate that lane and widen a PR that
      is already over its line target. Recorded in residual_risks so the gap is
      visible to whoever reads the heartbeat.

  - seat: kimi-code/k3 (blind, cross-family, second seat)
    objection: >
      MEDIUM — sanitizeReasonString's leading `\b` can never match inside an
      underscore-compound credential name. `_` is a word character, so
      `\b(token|secret|...)=` does not match `access_token=`,
      `refresh_token=` or `client_secret=` — the three commonest shapes a real
      secret takes in an exception message — and they land VERBATIM in the
      0644 heartbeat and the append-only wrapper log. A module whose header
      makes secret hygiene a headline has a hole exactly where secrets live.
    status: CONFIRMED
    repro: >
      Verified empirically before accepting, not reasoned: importing the real
      exported function and feeding it each shape printed
      `LEAKS | access_token=eyJabc123def -> access_token=eyJabc123def` for all
      three underscore-compounds while bare `token=`/`apikey=` redacted
      correctly. Fixed by replacing the `\b` with an explicit
      `(^|[^A-Za-z0-9_])` boundary plus an optional `[A-Za-z0-9_]*` prefix.
      All three now redact while the key stays readable. Pinned by three new
      self-test assertions, one per shape; reverting to `\b` turns exactly
      those three red (measured). The first seat passed over this line.
  - seat: kimi-code/k3 (blind, cross-family, second seat)
    objection: >
      LOW — `main(argv)` is invoked with no `.catch()`. Anything thrown in the
      few lines before main's inner try (env reads, defaultHeartbeatPath with
      HOME unset) becomes an unhandled rejection: the process dies with NO
      heartbeat, which by this file's own contract reads as "the probe did not
      run" rather than "the probe failed".
    status: CONFIRMED
    repro: >
      Both seats found this; the first round wrapped the heartbeat WRITE and
      left the invocation bare, so it survived to be found twice — which is
      the argument for a second seat in one line. Verified on disk
      (`grep -n 'main(argv)\|\.catch('` showed the call at line 1385 with no
      handler) rather than trusting either the refuter or the implementer's
      "fixed" report. Now `.catch()`-ed with a sanitized FATAL to stderr and
      `process.exitCode = 1`.
  - seat: kimi-code/k3 (blind, cross-family, second seat)
    objection: >
      MEDIUM — a failure to BUILD the request is misfiled as a transport
      error. `JSON.stringify(syntheticCheckBody())` sat inside the fetch
      try/catch, so a RangeError from our own date arithmetic (an Invalid Date
      on a small-icu Node build where `en-CA` does not yield ISO) would be
      reported as `post_transport_error` -> verdict `unknown` -> exit 0. The
      probe is broken, nothing pages, and the dead-man stays disarmed on a lie.
    status: CONFIRMED
    repro: >
      Accepted as the same class as the finding that drove `unknown` in the
      first place, with the sign inverted: `unknown` exists so an
      unattributable failure cannot fire the dead-man, and it must not become
      a place where OUR OWN bugs go to be forgotten. Request construction moved
      OUT of the transport try; a build failure is now `fail` with reason
      `post_request_build_failed:<name>`, because it is ours and attributable.
  - seat: kimi-code/k3 (blind, cross-family, second seat)
    objection: >
      MEDIUM — a 4xx carrying a recognised `_ERROR_CATALOG` code is
      attributable to CONTRACT EVOLUTION, not downtime. If the funnel adds a
      required request field, the probe's frozen body gets 422 INVALID_REQUEST
      and reports `fail` on a service that is working fine for real users.
    status: PLAUSIBLE
    repro: >
      Accepted as a real and well-argued asymmetry, NOT fixed this round, and
      declared instead — see residual_risks. Fixing it means teaching the probe
      to distinguish "prod rejected my body because prod changed" from "prod
      rejected my body because prod broke", and the honest version of that is a
      contract-version check, not a status-code special case bolted on late.
      Doing it badly would hand the probe a new way to stay quiet. The exposure
      is bounded today: the dead-man ships DRY-RUN only (Zero's ruling), so a
      false red cannot flip anything until real-fire is armed — and that arming
      is the natural gate for this fix.
  - seat: kimi-code/k3 (blind, cross-family, second seat)
    objection: >
      LOW — server-controlled strings reach the 0644 heartbeat unscrubbed
      (`body.code` in assessEligibilityBody, `finalPath` in classifyPage), and
      the heartbeat has no fsync before rename, and a kill between write and
      rename orphans a `.tmp`.
    status: PLAUSIBLE
    repro: >
      Declared, not fixed. Both strings are server-authored vocabulary from our
      OWN origin, not a known secret vector, and the reason field is already
      length-capped downstream. fsync on a 15-minute heartbeat buys durability
      against power loss that the next tick restores anyway; an orphaned `.tmp`
      is cosmetic. Recorded so the next reader inherits the knowledge rather
      than the surprise.

residual_risks:
  - "A run does NOT leave zero production rows. The eligibility RESULT is
    deleted and verified gone, but two garuda_voa_check_idempotency rows (one
    create-path, one delete-path) persist for 30 days by design — they are the
    anti-replay ledger. At a 15-minute cadence that is ~96 runs/day and roughly
    5,760 steady-state rows, indistinguishable from customer traffic because
    the VOA tables have no probe-tenancy column. Any analytics counting
    'eligibility checks created' will include probe traffic. Whether to add
    such a marker is a backend/migration decision outside this lane."
  - "HTTP-level, not browser-level: broken hydration, dead buttons or a broken
    client-rendered result page can still read green here. L11 owns
    browser-grade production journeys."
  - "Probe and dead-man will be colocated on Mini — a single failure domain.
    Worst-case actuation is ~30 min (15-min interval + 15-min silence
    threshold), the honest figure, not the source report's optimistic <20 min."
  - "Only the issuance/tourism/USA branch is exercised. The extension branch
    has different required fields and could be broken while this probe is
    green."
  - "Cookie ATTRIBUTES are not validated — the probe replays name=value
    manually, so a wrong Path/Domain or an immediate expiry that a real browser
    would reject stays invisible."
  - "If the POST commits upstream but its response times out locally, the
    result id is lost and cleanup is skipped; the run reports unknown, but that
    orphan row is not recoverable by a later run."
  - "A 422 INVALID_REQUEST caused by the funnel ADDING a required request
    field would read as `fail`, though the service is working for real users
    whose frontend sends it. Contract evolution and downtime are not the same
    event and the probe cannot yet tell them apart. Bounded today because the
    dead-man is DRY-RUN only; arming real-fire is the gate for curing this."
  - "Server-authored strings (`body.code`, the redirect `finalPath`) reach the
    heartbeat unscrubbed, the heartbeat is not fsync'd before rename, and a
    kill between write and rename leaves an orphan `.tmp`. All declared, none
    cured — see the kimi-code/k3 dissent entry for why each was judged not
    worth the added surface."
