dissent:
  - seat: codex gpt-5.6-sol (non-Anthropic refuter)
    objection: >-
      NO-DEFECT on tautology (A), pollution (C), isolation (D) and
      writer->column mapping (E). TWO CONFIRMED-DEFECTs. B: "absent/non-public
      tables cause skips, and pytest treats skips as success. A stale or
      wrongly configured database can therefore produce a green run without
      exercising any writer." F: "the two idempotency residues are not
      observably 'tagged': only the SHA-256 digest is stored, making the
      claimed `jsonbparity-` prefix unrecoverable."
    status: CONFIRMED
    note: >-
      BOTH FIXED. B: `_require_table` fails in CI, skips locally, proven in
      both directions. F: the docstring now names what is actually
      recoverable (`response_body ->> 'probe'`) and states plainly that the
      prefix survives only on garuda_order_journal -- the same overclaim class
      as the `database.py` "every pool" line corrected in the base PR. Codex
      also noted the diff it was given lacked the `->> 'probe'` assertions:
      correct, and it was MY staleness -- the diff was generated before they
      were added. Recorded because a refuter reading a stale artifact is a
      failure of the dispatching process, not of its analysis.
  - seat: kimi-code/k3 (non-Anthropic, second refuter)
    objection: >-
      INCOMPLETE — ran out of turn mid-investigation and never reached a
      verdict on isolation or "anything else". What it did complete was
      CONFIRMATORY rather than refutational: it read migration 284 directly
      and verified the diff's claims about the guards ("Idempotency guard: on
      UPDATE it forbids changes to key/payload/created/expires ... allows bind
      and atomic complete. So `complete()` works. DELETE on unexpired raises.
      Confirmed — test claims accurate"), the journal append-only guard, the
      `order_id` CHECK regex against the probe's format, and the partial
      UNIQUE on `result_id_ref`.
    status: PLAUSIBLE
    note: >-
      Recorded as INCOMPLETE rather than dressed up as a clean pass. Its
      verified half is real evidence and is why the trigger claims in the
      docstring are trusted here; its unverified half is the reason Codex sol
      was dispatched to finish the refutation instead of shipping on one seat.

