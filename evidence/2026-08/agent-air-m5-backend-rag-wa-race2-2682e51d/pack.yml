  - "wa_reply_claims has no TTL/retention: it grows by one row per inbound
    WhatsApp message forever. Declared in the migration's own header as
    future work (a claimed_at-based sweep or partitioning), not implemented
    in this PR (one-concern rule)."
  - "During a sustained DB outage, the double-reply race RETURNS: both paths
    fail to acquire/claim (best-effort, by design — a DB hiccup must never
    mute a genuinely legacy message), so both proceed and can both answer
    the same wamid. This is the deliberate trade-off #4878 already made
    (never-mute over never-duplicate during DB unreachability) and this PR
    preserves it rather than changing it — flagging it explicitly so the
    trade-off is visible, not an oversight."
  - "A crash between a won claim and the reply/ledger write leaves that
    wamid permanently claimed with no answer ever sent, unless Meta
    redelivers the webhook (which would retry the whole flow with the same
    wamid — the claim UPSERT's same-path-retry handling covers that case,
    but a redelivery is not guaranteed to happen)."
  - "The meta-inbox path claims a wamid (winning the race) even on
    human_handling=True threads, where the bot deliberately does not answer
    — this is intended silence (a human is handling the conversation), not a
    defect, but it means a 'won the claim' log line does not imply a reply
    was actually sent."

