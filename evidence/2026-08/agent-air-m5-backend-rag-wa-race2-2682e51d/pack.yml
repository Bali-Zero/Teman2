dissent:
  - seat: sonnet-5-self-review
    objection: >
      The cross-path atomic claim in process_whatsapp_message originally ran
      BEFORE the allowlist check (whatsapp_triage_service.is_allowed). A
      number this legacy path will silently ignore could still WIN the wamid
      claim and then discard it — if that same wamid also has a legitimate,
      later-arriving meta-inbox delivery (the exact double-subscription shape
      this PR defends against), meta-inbox's own claim attempt would then
      lose to a claimant that was never going to answer, leaving a real
      customer with silence from BOTH paths instead of one correct reply
      from meta-inbox.
    status: CONFIRMED
    repro: >
      Traced whatsapp_triage_service.is_allowed(): returns True
      unconditionally only when WHATSAPP_ALLOWED_NUMBERS is unset; otherwise
      gates on an allowlist, so an out-of-allowlist number is a real,
      reachable input. Reordered the claim to run AFTER the allowlist check
      in apps/backend-rag/backend/app/routers/whatsapp_chat.py
      (process_whatsapp_message, steps "0"/"0.5"); updated
      test_wamid_already_claimed_by_meta_inbox_skips_legacy_generation,
      test_wamid_claimed_by_legacy_proceeds_to_legacy_flow, and
      test_dedup_db_error_is_non_blocking to prove the new ordering.
      Full suite green after the fix: 1502 passed, 0 failed.
  - seat: independent-gear3-grader
    objection: >
      REWORK verdict on the first evidence pack, 4 findings: (1) migration
      281 collides with PR #4854's own open 281_garuda_voa_retention.sql
      (main tops out at 280 — W40 collision class), and the table needs a
      declared retention note (unbounded growth, one row per message
      forever). (2) test_wamid_claimed_by_legacy_proceeds_to_legacy_flow and
      test_dedup_db_error_is_non_blocking pass even under mutants M1 (the
      legacy claim gate hardcoded to always early-return) and M2 (the
      claim's except re-raising instead of swallowing) — both tests only
      asserted `result is None`, which the outer try/except in
      process_whatsapp_message also produces on an early-return or a
      swallowed re-raise, so neither mutant was actually being caught. (3)
      the pack's own dissent text claimed the DB-error test "actually
      exercises the DB-error path" before that claim was true. (4) the
      pack's diff insertions/deletions were stale (316/43) against a
      measured 371/52 at review time.
    status: CONFIRMED
    repro: >
      Production code judged CORRECT by the grader — only evidence and one
      number were at fault. Cured in this same PR, same branch: migration
      renamed 281 -> 282 with a retention comment declaring the gap as
      future work; both flagged tests now capture the should_escalate mock
      and call should_escalate_mock.assert_awaited_once() after the
      `result is None` assertion; re-ran M1 and M2 against the corrected
      tests — both mutants now turn the correct single test RED (receipts
      above), then the file was cleanly reverted (0-diff against a
      pre-mutation backup) and the full suite re-confirmed green; this
      pack's own diff numbers were re-measured with `git diff --numstat`
      against origin/main after all fixes (379/52, not the earlier 316/43
      nor the grader's interim 371/52 — both stale snapshots from before the
      mutation-test fix's own diff was added).

