dissent:
  - objection: "F4 HIGH — a spend of .nan escapes BOTH the violation and the unmeasured notice: type(nan) is float admitted it as a MEASUREMENT, and every NaN comparison is False, so the rule fell totally silent. Report any overrun as .nan and nothing is said."
    seat: "kimi-k3 (blind cross-family refuter)"
    status: CONFIRMED
    disposition: "Reproduced on disk, then fixed in _appetite_numeric (math.isfinite). The finding's real weight is not the bug: the ORCHESTRATOR HAD ALREADY EXAMINED THIS EXACT INPUT, called it 'fail-open, therefore safe', and written a test asserting ([], []) as correct. Half right — fail-open on the VIOLATION is safe, fail-open on the NOTICE is a bypass, and the docstring already promised a notice for a dimension with no comparable numeric value. The author's own test would have carried the defect to main as a certified invariant. That test is now rewritten, and it carries this history in its docstring."
  - objection: "F1 HIGH — appetite_exceeded: yes parses as the YAML bool True, so an honest pack was convicted with a message reading 'no appetite_exceeded: acknowledgment' while the author had plainly written one."
    seat: "kimi-k3 (blind cross-family refuter)"
    status: CONFIRMED
    disposition: "Reproduced, then SPLIT: confirmed as a message defect, retracted as a false positive. The conviction is correct and stays — this field mirrors gear_override, where the REASON is the artifact, and accepting a bare 'yes' would turn the lane's only failing rule into a one-token bypass. Only the message changed; it now names the type. An innocence twin pins that a genuinely-absent acknowledgment still gets the original wording."
  - objection: "F3 MED — a negative ceiling (adversarial_rounds: -1, a typo) is a genuine int, so an honest spend of 0 convicted via 0 > -1."
    seat: "kimi-k3 (blind cross-family refuter)"
    status: CONFIRMED
    disposition: "Reproduced and fixed by the same numeric guard as F4 (>= 0). The over-correction twin is pinned in the same commit (W94): the bound is >= 0 and never > 0, so wall_clock_hours: 0 remains a real declaration and a real observation."
  - objection: "F5/F6 MED/LOW — -.inf spend is the same silent bypass as F4; a negative spend passes as a clean measurement."
    seat: "kimi-k3 (blind cross-family refuter)"
    status: CONFIRMED
    disposition: "Both closed by the single isfinite/non-negative guard. One cure, four findings — which is what a class fix looks like versus patching the instance that bit you."
  - objection: "F2 MED — raw IEEE > on self-reported floats convicts over 4e-17: 0.1+0.2 = 0.30000000000000004 against a declared 0.3."
    seat: "kimi-k3 (blind cross-family refuter)"
    status: CONFIRMED
    disposition: "Reproduced, and DECIDED rather than smoothed. No epsilon: picking a tolerance is picking a NUMBER, and ceiling values are explicitly a Zero ruling this rule carries rather than decides; and an epsilon wide enough for float noise on wall_clock_hours would silently forgive a real breach on tokens. The message prints both values, so the edge is visible rather than silent. Written into the docstring as a known sharp edge, not left for the next reader to rediscover."
  - objection: "LOW nit — the acknowledged notice embedded the reason unquoted, so a reason reading 'nothing' rendered as 'acknowledged: nothing', which reads as the rule reporting no acknowledgment."
    seat: "kimi-k3 (blind cross-family refuter)"
    status: CONFIRMED
    disposition: "Fixed by quoting the reason. Cheap, and this rule has not landed yet so there is no landed output to churn."
  - objection: "Four categories returned NONE FOUND: no crash path (None/str/list/int in every position, non-str keys, 10**100, mixed int/float), no message injection, and independent confirmation of 'must NEVER raise', 'equality is not a breach' and the after-sanitising emptiness rule."
    seat: "kimi-k3 (blind cross-family refuter)"
    status: RETRACTED
    disposition: "Recorded as evidence, not filler. The refuter re-derived on its own that \\x1b[31m'.isspace() is False, that the isprintable filter also kills bidi overrides and zero-width characters, and that truncation happens AFTER sanitising — design claims confirmed by someone who did not write them."
  - objection: "Self-refutation while gating: the acknowledgment reason reached stderr with no sanitising at all, so a newline split the notice across two stderr lines and ESC/BEL reached the terminal verbatim."
    seat: "opus-5 (orchestrator, gating its own implementer's diff)"
    status: CONFIRMED
    disposition: "Found by READING the code, not by running the suite, which was green. It is the identical defect blind review found in rule 13 one PR earlier — the sanitiser existed and rule 14 simply did not call it. Cured structurally rather than locally: _sanitize_notice_text extracted as a shared named function now used by rules 12, 13 and 14, proven byte-identical on rules 12/13 across nine shapes, with a mutation deleting its filter killing their tests."
size_note:
  "1,210 net lines is three times the mandate's ~400 guideline, and it is stated here
  rather than hidden in the diffstat. The breakdown: 889 lines of code+corpus (535 lint,
  354 tests), 275 of REQUIRED evidence ceremony (this pack and its brief), 38 registry,
  11 doctrine. It is not splittable along any honest seam — shipping the rule without its
  corpus would be superscar #2 in one commit (a convicting rule with no proof it bites),
  and the lane spec itself defines PR-3 as rule + tests + the SKILL.md paragraph, in that
  unit, after PR-2. Of the 535 lint lines, roughly 90 are docstring: this repo treats the
  honest limit as something that must live IN THE CODE, not only in a PR body, and that
  is a cost paid deliberately."
notes: "Two of my own measurement errors, recorded because they are the instructive part. (1) A background launch reported 'exit code 0' and I nearly read it as the sweep's verdict — it was the exit of the echo that launched it; the sweep was still running with a zero-byte log because Python buffers when stdout is not a tty. (2) The first floor measurement returned 3 from a two-dot diff against a main that had moved 1,514 lines under me, which is W102 exactly: the tool answered honestly, the question was wrong. Both were caught by re-measuring rather than by reasoning about what the number ought to be. A third near-miss belongs to the refuter: it was ALSO nearly wasted, because the mutation sweep it informed was first run against a linter I had already changed — re-run on the final bytes, which is the only version that means anything."
