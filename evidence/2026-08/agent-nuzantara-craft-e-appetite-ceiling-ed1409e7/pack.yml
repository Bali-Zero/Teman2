seat_diversity:
  "Build and grade are separated by FAMILY, not only by instance: the diff was built by
  Sonnet 5 and refuted by Kimi K3, which was handed the rule and its one helper with no
  tests, no PR framing and no author intent. The final on-disk gate is the orchestrating
  Opus 5 session, which re-ran every measurement itself rather than accepting either
  subordinate's report. That gate found a defect the implementer missed AND had one of its
  own findings overturned by the refuter — in both directions, the separation earned its
  keep rather than performing it."
spend:
  wall_clock_hours: 0.7
  adversarial_rounds: 1
spend_note:
  "Measured, not estimated. wall_clock_hours is the branch lifetime at pack-write time
  (created 2026-08-29T09:13:33Z per git reflog); it necessarily excludes the CI and
  merge-queue tail, which is precisely the PR-lifetime limitation rule 14's own docstring
  declares. adversarial_rounds is 1: one Kimi K3 dispatch, RC=0 first try. `tokens` is
  DELIBERATELY ABSENT — this session has no instrument to measure its own token
  consumption at pack-write time, so rule 14 emits its 'not verified this run' NOTICE on
  the very pack that introduces the rule. That is the honest dogfood: the rule SPEAKS on a
  live artifact, and speaks the truth, which is that one of the three ceilings it was
  given cannot be checked from here."
