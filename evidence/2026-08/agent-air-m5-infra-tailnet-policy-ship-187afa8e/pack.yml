dissent:
  - seat: codex-gpt-5.6-sol (round 1, xhigh)
    status: CONFIRMED
    objection: >-
      THE CORRECTIONS THEMSELVES OVERCLAIMED, AND THAT IS THE MOST IMPORTANT LINE IN THIS PACK.
      This PR exists because #5192's documents credited the guard with coverage it lacked. On its
      first pass, this session's replacement text did the same thing six times: "does NOT check the
      ssh block" (it checks team-reaching src and dst there); "every destination selector resolves
      to a named node or is refused" (one exception exists, ALLOWED_NON_NODE_DSTS =
      {tag:team-device}); "the two allowlisted nodes" (SHELL_PORT_ALLOWED_SOURCES holds four);
      "any tag other than tag:team-device is skipped" (the check is the PREFIX `tag:team`, so
      tag:team-other IS caught); "re-pointing the alias alone is caught as
      UNRESOLVABLE_DST_SELECTOR" (not cleanly caught at all); and "the SHELL-ROUTE comment must
      still name 7681/term/ttyd" (the check scans the WHOLE FILE — and the correction's own text
      now satisfies it). Each finding arrived with an executed reproduction. All six rewritten.
    resolution: >-
      Fixed in commit 03d3ca470b and re-measured green by rounds 2 and 3.
  - seat: session (build lane, self-caught while verifying the refuter)
    status: CONFIRMED
    objection: >-
      A SEVENTH, WHICH NO REVIEWER CAUGHT. The corrected text claimed Pro's magic IP
      "100.107.22.111 appears nowhere in the guard". False: `grep -c` returns 6. All six are in
      comments or in one canonicalisation test's fixture, and none is an assertion — which is the
      true, narrower claim and the one that actually supports the point being made. Recorded
      because it shows the refuters are a floor, not a ceiling: the session still has to verify
      its own text after they pass on it.
    resolution: >-
      Both documents now say "no assertion pins the alias to that IP", with the six occurrences
      characterised.
  - seat: codex-gpt-5.6-sol (round 2, xhigh)
    status: CONFIRMED
    objection: >-
      TWO OF ROUND 2's THREE FINDINGS WERE INHERITED FROM #5192 AND HAD SURVIVED ALL THREE OF ITS
      GRADERS. The "fire-and-forget POST" whose failure is "silent" is contradicted by
      `profile-monitor.swift:48-79`: a 5s timeout, a 6s semaphore wait, and a POST_FAIL log. The
      third was this session's: "acls and grants blocks, and nowhere else" needed to carve out the
      team-reaching source check, which `ssh` also gets; and the 9099 grant needed its `proto:
      "tcp"` qualifier to justify "and nothing else".
    resolution: >-
      All three fixed. The honest statement is that the failure is invisible to Bali Zero, not
      unrecorded — the evidence exists on the far side of the fence this policy raises.
  - seat: codex-gpt-5.6-sol + kimi-code/k3 (round 3)
    status: CONFIRMED
    objection: >-
      POST_FAIL covers TRANSPORT ERRORS ONLY — an HTTP 4xx/5xx logs POST_OK carrying the status,
      and a semaphore expiry logs nothing (codex). And policy.hujson still lacked the src-column
      carve-out the runbook already had: a src aimed at the shell port IS required to be a named
      node, so the documented gap was stated wider than it is (kimi, explicitly "not a merge
      blocker on the guard").
    resolution: >-
      Both fixed. An ACL drop IS a transport error, so the POST_FAIL claim holds for this policy's
      case and is now scoped to it rather than asserted generally.
  - seat: session (build lane, methodological)
    status: CONFIRMED
    objection: >-
      FINDINGS PER ROUND WERE 6 -> 3 -> 2 AND THE LOOP WAS STOPPED DELIBERATELY, WHICH IS ITSELF A
      JUDGEMENT CALL OPEN TO CHALLENGE. Every round re-measured the previous round's fixes green
      and both round-3 verdicts confirm the substance of all five claim families. That reads as
      convergence rather than #5192's pattern — there, each round found a NEW BYPASS AXIS in code,
      genuinely new surface. Here the residue was documentation precision. A fourth cross-family
      round would likely find a seventh phrasing to sharpen, and spending it would be the same
      disease this program diagnoses, in a different costume. The independent Gear-3 gate, not
      another council round, is the right judge of whether that call was correct.
    resolution: >-
      Loop stopped after round 3. Every round's findings and verdicts are in journal.jsonl for the
      gate to weigh.
  - seat: session (build lane, declared limitation)
    status: CONFIRMED
    objection: >-
      THE GUARD IS STILL INCOMPLETE ON FOUR AXES AFTER THIS MERGES, AND THE DIFF IS FAR OVER THE
      ~400-LINE TARGET. The incompleteness is deliberate and is the point of the PR: the exposure
      is unchanged from before, and what is removed is the false claim about it. On size, roughly
      1,470 of the lines are #5192's content carried byte-identical; splitting would put the
      corrected documents in one PR and the policy in another, meaning either a knowingly false
      claim on a security gate live on main between them, or holding the policy that unblocks the
      team expansion.
    resolution: >-
      Four axes carry executed reproductions in PENDING-ARMS, specified concretely enough (A-C in
      ONE PR, D optional and last) that the successor works from a spec. Size accepted and declared.
  - seat: session (build lane, scope limit)
    status: PLAUSIBLE
    objection: >-
      ONE THING THIS PR CANNOT ESTABLISH AT ALL: whether Tailscale ACCEPTS the policy. No offline
      validator exists and the fleet holds no API token, so every green in this pack is about
      grammar and intent. A reader could take "23 passed" as more assurance than it is.
    resolution: >-
      Both documents state it explicitly at the apply step; the admin console at save time is named
      as the sole authority. Nothing here should be read as evidence the policy will compile.

open_questions:
  - >-
    `scripts/profile-monitor/` — grant `tag:team-device -> pro:9099` as one named exception, or move
    that client off the tailnet? Legge 5, owner=operator[business], and ORDERING-CRITICAL: it must
    be answered before the enrolment runbook's step 2 mints an auth key, because afterwards a
    dropped checkout POST is indistinguishable from an employee who never checked in. Stated in the
    enrolment runbook where it bites, and in PENDING-ARMS.
  - >-
    Hardening ttyd itself (`-c user:pass`, or moving `/term` off port 443 so the ACL can separate it
    from `/deck`) changes how Zero reaches his own machine from his own phone. Business call,
    unchanged from #5192, still in the ledger. This policy contains the blast radius without it.
  - >-
    `check-tailnet-acl` is not a required check. Promoting it is a branch-protection change and
    therefore operator-only; until then a red there is a loud signal on the PR, not a merge block.
    Worth weighing against the fact that the guard it would enforce is knowingly incomplete on four
    axes — promoting it would give a green there more authority than it has earned.
