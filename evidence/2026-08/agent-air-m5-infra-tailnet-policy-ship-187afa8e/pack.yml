    On size: this is far over the ~400-line target, and the shape is why. The large majority of the
    diff is #5192's content carried across byte-identical (policy, guard, 18 fixtures, runbook,
    README), which this PR does not modify — see the first receipt, which proves it unchanged. The
    genuinely new surface is the documentation correction, five ledger rows and this pack.

