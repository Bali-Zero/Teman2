objective: |
  P04-D1 of the Research OS foundation-contracts program: ship the canonical, machine-checkable
  definitions of CONTRACTS.md §9 `ContentObject` and §10 `MediaManifest` — the two governance
  objects that every downstream WR2/WR3/NAGA/Intel Lake surface anchors its content lineage and
  media-asset receipts to. Concretely: two frozen Pydantic models (`extra="forbid"`,
  `frozen=True`), their generated Draft 2020-12 JSON Schemas, a fixture corpus (valid + invalid
  per the package's `_check_fixtures` idiom — the §9/§10 spec's own >=3-valid/>=3-invalid-per-kind
  rule), unit tests, and registration in the three package entry points (`cli.py`
  `CONTRACT_MODELS`, `models/__init__.py`, `schemas/__init__.py`).

  THIS IS PR #4643 (branch `agent/nuzantara/backend-rag/ros-v1-p04-d1-content`). Its
  `evidence/brief.yml` and `evidence/pack.yml` — fixed root paths every Gear>=2 PR overwrites —
  were inherited unchanged from an ancestor commit and described unrelated foreign work (PR
  #4592, task_id `ops-visaoracle-wrapper-header-0823`, a 2-line wrapper-header comment fix). This
  revision replaces both files with the truthful account of what #4643 actually ships, verified
  fresh against the real diff and the real gates in this worktree — not transcribed from the prior
  (wrong) pack, not from memory of an earlier turn.

  BE HONEST ABOUT THE SIZE: this is a real 53-file / +4264/-0-line PR (measured this session via
  `git diff --numstat` against the merge-base with `origin/main`), the first and smallest of four
  serialized P04-D1 PRs (#4643 -> #4653 -> #4610 -> #4621 per the fleet's ordering, 2026-08-23).
  Most of the 53 files are the fixture corpus the spec itself mandates per object kind (>=3 valid
  + >=3 invalid), not narrative padding.
