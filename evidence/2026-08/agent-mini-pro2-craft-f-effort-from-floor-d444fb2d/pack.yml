dissent:
  - seat: codex-gpt-5.6-sol (blind refutation)
    objection: >-
      Refusals that fire before the derivation emit the report with
      effort_source="" -- an undocumented state indistinguishable from
      "resolved to nothing". The refuter proposed moving the derivation earlier.
    status: CONFIRMED
    resolution: >-
      Reproduced on four refusal paths, then fixed by naming the state
      "unresolved" rather than by reordering. Moving the derivation earlier
      would be wrong: it must run AFTER --gear is validated, or it would derive
      from a gear the script is about to reject. The finding was right; its
      proposed remedy was not, and the difference is recorded rather than
      quietly resolved either way.
  - seat: codex-gpt-5.6-sol (blind refutation)
    objection: >-
      The floor-2 advisory notice was unasserted -- stderr was redirected to a
      file the test never inspected, so deleting the printf left the suite green.
    status: CONFIRMED
    resolution: >-
      Reproduced (notice deleted -> 8/8 still green), then asserted both ways:
      floor-2 prints it, floor-3 does not. That notice is the only user-visible
      signal the needs-ruling hold exists.
  - seat: codex-gpt-5.6-sol (blind refutation)
    objection: >-
      No workflow executes this shell corpus; scripts-tests-sweep.yml runs
      pytest, which does not collect .sh, and is continue-on-error besides.
    status: CONFIRMED
    resolution: >-
      Verified, and it is broader than the finding: NONE of the three
      seat_build shell suites is named by any workflow, so this corpus joins an
      already-unarmed family (W108, guardian whose only executor cannot go red).
      Deliberately NOT fixed in this PR -- the battle plan reserves every
      .github/workflows/ edit for Squad W. Ships as a PENDING-ARMS row and a
      handoff instead of a workflow diff authored by the wrong lane.
