notes: |
  DECLARED LIMIT, not cured: the self-guard walks other steps' `run:` bodies via YAML. A future edit
  that moves the checker invocation into a composite action, a `uses:` step, or a shell script file
  takes it out of the guard's view — the guard would stay green while the off-switch became
  reachable. Curing that means following invocations across files, which this diff does not carry.

  DECLARED, not this PR's: `check_token_contrast.py:524` rounds to 2dp before the floor comparison
  (`floor_check_value = round(computed, 2)`), so a raw 4.4951 passes a 4.50 floor. Pre-existing
  behaviour; the workflow header now says so instead of claiming green proves no duty-floor violation.
