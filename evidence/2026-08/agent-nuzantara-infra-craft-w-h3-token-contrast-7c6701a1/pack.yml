dissent:
  - status: CONFIRMED
    seat: kimi-code/k3
    objection: |
      HIGH — the guard asserts a NEGATIVE and never the positive. Delete the invocation step
      ("it duplicates scripts-tests-sweep.yml", a plausible refactor) and the guard prints
      `OK — no other run: step passes --tolerance`, the corpus runs against its own fixtures rather
      than the shipped token file, and the job is GREEN. Nothing asserts that any step actually
      invokes the checker.
    disposition: |
      ACCEPTED — this is the sharpest finding of the wave. A PR whose whole purpose is curing
      "exists != armed" never checked that the thing was armed. Measured on the old guard: invocation
      deleted -> rc=0. The guard is INVERTED to a positive pin; the same case now gives rc=1 with
      "this is the finding this guard exists to catch."
  - status: CONFIRMED
    seat: kimi-code/k3
    objection: |
      MEDIUM — false RED: the guard cannot distinguish flag-in-argv from flag-in-prose in ANOTHER
      step's run body. A bare comment `# never add --tolerance here` inside the invocation step fails
      a completely correct workflow.
    disposition: |
      ACCEPTED, and it FALSIFIED A RECEIPT THIS PACK HAD ALREADY MADE. The gate had written that the
      guard "judges the entity, not the form" — having tested only a comment OUTSIDE any run body
      (line 146), where it is indeed immune. Reproduced on the production workflow: rc=1 accusing a
      correct step. The receipt above is narrowed to what was measured rather than deleted. The
      guard's own comment describes exactly this trap as the reason it does not filter on content —
      it had moved the trap off itself and onto every other step.
  - status: CONFIRMED
    seat: kimi-code/k3
    objection: |
      MEDIUM — the id-based self-exclusion is itself the evasion hole: append the flagged invocation
      to the GUARD'S OWN run block and delete the separate step, and the one body never scanned is
      exactly where a "simplify the workflow" refactor would put it.
    disposition: |
      ACCEPTED. The id-exclusion is GONE; the guard is now scanned like every other step and made
      self-immune by building its needle from two fragments at runtime. Verified structurally: the
      raw run body contains zero contiguous occurrences of the checker's name. Probe G (flag in the
      guard's own body, real step deleted) -> rc=1, naming the guard's own step.
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      HIGH — the guilt example is false: `--tolerance 0.5` and `99` are REFUSED by the checker, whose
      maximum is 0.1. The test proves the substring scanner reacts, not that it prevents a false green.
    disposition: |
      ACCEPTED — a second falsification of this pack's own evidence, from the other seat. Measured:
      MAX_TOLERANCE = 0.1; `--tolerance 99` -> rc=2 REFUSED. The guilt probe now uses 0.1, the largest
      value the checker ACCEPTS and therefore the largest that genuinely widens the gate.
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      HIGH — a contrast failure on main notifies nobody: job-level `continue-on-error: true` keeps the
      workflow-run conclusion `success`, and the watcher gates on that conclusion. The registration is
      inert.
    disposition: |
      CONFIRMED AND DECLARED, not cured — the job may not become blocking until the 6-item follow-up
      lands. It also falsified this PR's BRIEF, which justified the registration by citing a
      `schedule:` trigger: measured, the triggers are exactly ['pull_request', 'push'] and there is no
      `schedule:`. That sentence was lifted from a sibling pack where it was true. Corrected in the
      brief. THE TWO SEATS SPLIT HERE: Kimi did not count it against the verdict because the file
      headers disclose it; Codex counted it HIGH. Both recorded; neither leniency saves the brief's
      wording, which failed both tests.
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      MEDIUM — PENDING-ARMS claims the corpus runs "on every PR", but fail-fast skips the pytest step
      when the checker step fails, so a PR carrying both drift and a corpus regression reports no
      corpus result at all.
    disposition: |
      ACCEPTED — `if: always()` on the corpus step; both now always run and both are visible.
  - status: CONFIRMED
    seat: kimi-code/k3
    objection: |
      HIGH — the guard is blind to indirection: env-split, shell construction, matrix values,
      `uses:` composite actions, reusable workflows, and a shell-script file all pass a run-body scan.
    disposition: |
      MOSTLY CURED BY CONSTRUCTION, one residual DECLARED. Rules (1)+(2) mean the only permitted
      invocation is a verbatim argument-free command and nothing else may reference the checker, so an
      env-split invocation is no longer the pinned form (probe E -> rc=1) and a `uses:` reference is
      caught (probe F -> rc=1). What they CANNOT catch is `run: bash some_wrapper.sh` where the
      wrapper invokes the checker with a flag — stated explicitly in the guard's comment rather than
      papered over. No such step exists in this job today.
