      refuter falsified the stronger claim this receipt originally made. What IS true and measured:
      the file contains `--tolerance 99` at line 146 inside explanatory prose, and the guard does not
      fire on it, because it parses the YAML and walks each step's `run:` body rather than the file
      text, excluding ITSELF by `id:` rather than by matching its own error message.
      What is NOT true, and what this receipt originally claimed: that the guard judges the entity
      rather than the form. It does not. A bare comment INSIDE another step's `run:` body trips it —
      reproduced on the production workflow, rc=1 accusing a completely correct step. It scans that
      body as TEXT. The guard's own comment describes exactly this trap as the reason it does not
      filter on content; it moved the trap off itself and onto every other step.
      A SECOND overstatement, from the other seat: the guilt value used here was `--tolerance 99`,
      which `check_token_contrast.py` REFUSES outright (MAX_TOLERANCE = 0.1, rc=2). So this probe
      demonstrated that the scanner reacts to a string; it did NOT demonstrate that the guard
      prevents a false green, because that value could never produce one.
