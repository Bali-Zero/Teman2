objective: |
  Research OS v1.0.0 Wave 0, Work Packet 04, deliverable D3 (legacy-to-canonical adapters, no
  silent field dropping): SLICE 3a of 3 of the Magazine `ops_intents`/`ops_receipts` "action
  chain" adapter subsystem under `apps/backend-rag/backend/services/research_os/`.

  CORRECTED 2026-08-24 (team-lead ruling, this session) -- this brief originally described a
  WORKING adapter (`(ops_receipts row, its parent ops_intents row)` -> canonical
  `OperationalReceipt`, CONTRACTS.md §13.5, composing the sibling ActionItem adapter for
  `subject_refs`/`classification`). That version shipped a defect team-lead found by
  independently re-reading `operational_receipt.py` rather than trusting this lane's own
  "bare pointer, so it's fine" resolution: `execution_attempt_ref` was a SYNTHESIZED_UNBACKED
  `{execution_attempt_id, object_hash}` pointer to an `ExecutionAttempt` object never
  constructed anywhere in this deliverable. That is NOT a harmless disclosed placeholder the
  way `decision_packet_ref`/`requested_action_spec_ref` are elsewhere in this package --
  `receipt_type="execution.result"` (this adapter's own settled, non-open choice, since
  `ops_receipts` structurally cannot express any other v1 receipt_type) REQUIRES
  `execution_attempt_ref` (`operational_receipt.py:170-175`), and
  `EXECUTION_ATTEMPT_CAPABLE_RECEIPT_TYPES` (`operational_receipt.py:101-103`) has EXACTLY ONE
  member -- `execution.result` -- so no other receipt_type may carry it either. Worse:
  `close_execution_attempt()` (`operational_receipt.py:224-249`) compares the ref against a
  REAL `ExecutionAttempt` object's own id/hash -- a synthesized ref can never match an object
  that does not exist, so every receipt this adapter produced was PERMANENTLY unclosable, not
  merely incomplete. This is precisely the failure shape `operational_receipt.py`'s own
  2026-08-23 revision comment (lines 84-100) records being hardened against, after a
  cross-family Kimi K3 adversarial review broke the PRIOR blocklist-shaped guard the same way
  (a synthetic `execution_attempt_ref` sailed through unchallenged on an unregistered
  `queue.closed` receipt_type in that incident). Shipping a synthesized ref on the type that
  IS registered walks the same forbidden cargo in through the front door.

  THIS PR NOW IMPLEMENTS THE CORRECTED DESIGN: `adapt_ops_receipt_to_operational_receipt`
  performs every row-level validity check a future, unblocked version would still need
  (pairing between the receipt and its parent intent row, delegation to the sibling
  ActionItem adapter's own admissibility check, terminal-status validity, clock-skew ordering
  between the parent intent's `completed_at` and this receipt's own `created_at`) and then
  UNCONDITIONALLY REJECTS every row that passes those checks, disclosing the architectural
  blocker as the rejection reason, rather than constructing an object. "Reject rather than
  fabricate" -- the same discipline `action_item_adapter.py`'s own Sla check and this
  package's `synthesis.py` module docstring already establish for every other adapter in this
  deliverable, now applied to the one field where SYNTHESIZED_UNBACKED is not a legitimate
  disclosure pattern at all: an authorization/closure-bearing reference, not a descriptive one.

  This is currently the ONLY adapter in D3 that cannot successfully adapt any row from its
  legacy source. That is the correct, honest state of this slice until an S9-C0 freeze-change
  ruling decides how a legacy Magazine execution result can be represented as a canonical
  `OperationalReceipt` without a real, constructible `ExecutionAttempt` -- see the
  PENDING-ARMS.md row this PR carries.
