risks:
  - "execution_attempt_ref is a SYNTHESIZED_UNBACKED pointer to an ExecutionAttempt object that is
    never constructed anywhere in this deliverable's three slices -- disclosed, not asserted as
    resolved. See the Kimi K3 adversarial review of the sibling ActionIntent adapter (same
    session) for the general shape of this risk class on this lane (a real-looking value that
    cannot verify is worse than a marked placeholder) -- this adapter's own execution_attempt_ref
    is marked unbacked from the start, not a verbatim legacy-value reuse, so that specific failure
    mode does not apply here, but the review's broader finding (pending_ruling under-covering
    inherited placeholders) directly informed this adapter's classification.* additions above."
  - "idempotency_key reuses intent_id verbatim: ops_receipts has no receipt-level idempotency
    column at all; matrix §1.5's own words, idempotency is enforced structurally by intent_id
    UNIQUE, a different mechanism than a comparable per-receipt key. Disclosed via pending_ruling."
  - "Composing action_item_adapter from within this adapter creates the same one-directional
    coupling slice 2 has with the same sibling: a future change to ActionItem's own construction
    logic silently changes what this adapter's subject_refs/classification carry, without this
    file's own diff showing it."
