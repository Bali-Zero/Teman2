acceptance:
  - "Every one of ops_receipts' 11 legacy columns has an entry in the adapter's loss report with
    a fate in {mapped, approximated, synthesized_unbacked, omitted, rejected} and a reason --
    enforced by assert_every_legacy_field_accounted_for, called both inside the adapter and
    independently from the test suite."
  - "A mismatched (receipt_row.intent_id != intent_row.intent_id) pairing is rejected before any
    composition happens -- test_mismatched_intent_id_pairing_is_rejected."
  - "A row the sibling ActionItem adapter rejects on the parent intent row is ALSO rejected here,
    via delegation rather than a duplicated check."
  - "A non-terminal receipt status is rejected (receipts must represent a completed execution) --
    test_non_terminal_status_is_rejected, and every one of the four terminal statuses IS
    adaptable -- test_status_value_set_map_covers_every_terminal_status."
  - "subject_refs and classification pin the REAL sibling ActionItem's own action_item_id/
    object_hash/risk_class/sensitivity, not a placeholder -- test_subject_refs_pins_the_real_
    sibling_action_item, test_classification_matches_sibling_action_item."
  - "outcome_code best-effort parses receipt_json for a 'code' key and discloses (not silently
    swallows) a parse failure or missing key via an honest fallback string --
    test_outcome_code_falls_back_when_receipt_json_unparseable,
    test_outcome_code_falls_back_when_code_key_absent."
  - "pending_ruling and unbacked_refs are disclosed twice: in loss_report.warnings (prose) AND
    in extensions['com.balizero.research-os-adapters'].payload (machine-checkable) -- from the
    first version of this adapter, including the classification keys added after the sibling's
    Kimi K3 review, not retrofitted after a review of THIS adapter."
  - "PYTHONPATH=. pytest backend/tests/services/research_os/ -q exits 0 in full (this PR's 15 new
    tests + the pre-existing tests in the same directory, none regressed)."
