objective: |
  Research OS v1.0.0 Wave 0, Work Packet 04, deliverable D3 (legacy-to-canonical adapters, no
  silent field dropping): SLICE 3a of 3 of the Magazine `ops_intents`/`ops_receipts` "action
  chain" adapter subsystem under `apps/backend-rag/backend/services/research_os/`.

  Slice 1 (shared infrastructure + `ActionItem` adapter, PR #4749, corrected in PR #4758) and
  slice 2 (`ActionIntent` adapter, this session, built in parallel with this slice) are the
  siblings this PR composes. This PR ships the third canonical kind:
  `(ops_receipts row, its parent ops_intents row)` -> canonical `OperationalReceipt`
  (CONTRACTS.md §13.5).

  DESIGN DECISION (structural, same argument slice 2 makes for `action_item_ref`): this adapter
  takes BOTH the `ops_receipts` row AND its parent `ops_intents` row (the FK is UNIQUE per matrix
  §1.5) and COMPOSES `action_item_adapter.adapt_ops_intent_to_action_item` on the parent row,
  rather than deriving `subject_refs`/`classification` independently. The referenced `ActionItem`
  genuinely exists once that adapter runs on the same row, so a synthesized-unbacked placeholder
  for `subject_refs` would be a strictly worse disclosure than the real object reference.

  SCOPE FINDING (re-verified against the CORRECTED D3 matrix, merged as PR #4756): §1.5's own
  table grades `execution_attempt_ref` and `idempotency_key` both 🔴 "unmappable as-is -- needs a
  ruling". `receipt_type` is this adapter's OWN settled choice (always "execution.result" --
  `ops_receipts` structurally cannot express any other v1 receipt_type), not an open question.
  `operational_receipt_family_id`/`supersedes_operational_receipt_ref` are a settled true-negative
  (matrix §1.5 confirms `ops_receipts.intent_id UNIQUE` structurally forbids more than one receipt
  per intent -- no correction/supersession model is expressible here at all).

  SCOPE RESOLUTION (this session, reported to team-lead): `OperationalReceipt.execution_attempt_ref`
  is a bare `ExecutionAttemptRef{execution_attempt_id, object_hash}` pointer, NOT the full
  `ExecutionAttempt` object (whose own mandatory `approval_receipt_ref` would require constructing
  `ApprovalReceipt`, a confirmed true-negative per matrix §1.3/§2.0). This means the original
  3-adapter-kind scope for D3 (ActionItem, ActionIntent, OperationalReceipt) stands -- no 4th
  "ExecutionAttempt adapter" is needed for this deliverable.

  ADVERSARIAL-REVIEW-DRIVEN ADDITION (post Kimi K3 review of the sibling slice-2 adapter, same
  session, 2026-08-24): the review found that `pending_ruling`'s machine-checkable channel
  under-covers what `loss_report.warnings`' prose discloses -- specifically, `classification`
  (`risk_class`/`sensitivity`) composed from the sibling `ActionItem` are themselves inherited
  placeholders (that item defaults them to green/internal), but were absent from `pending_ruling`
  on the reviewed sibling. This adapter includes `classification.risk_class`/
  `classification.sensitivity` in its own `pending_ruling` from its FIRST version, alongside
  `execution_attempt_ref`/`idempotency_key`, rather than shipping the same disclosure gap a
  second time and waiting for a second review to find it.
