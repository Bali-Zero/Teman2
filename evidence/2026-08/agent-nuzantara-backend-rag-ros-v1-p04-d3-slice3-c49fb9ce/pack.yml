  net_lines: >-
    Two commits on this branch, measured against this branch's own merge-base with
    origin/main (0545d251d2f9e142b5bd8ae0c9d317e7fc7ae4ed, re-fetched fresh this session):
    +383/-0 net across 4 files (the original commit's construction code was fully replaced by
