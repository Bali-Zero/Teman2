runtime_proof:
  - >-
    No live consumer (zero non-test consumers repo-wide, receipt above) and, by design, no
    successful construction either: this adapter's "functional proof" is that it correctly
    REFUSES to construct anything from any input, rather than a round-trip demonstration of a
    working adapter. The 4 row-level-check tests prove those checks still fire independently
    and correctly BEFORE the universal architectural rejection, which is the only thing this
    adapter can currently do for any row that passes them.
dissent:
  - seat: "team-lead"
    objection: "This lane's own resolution -- 'execution_attempt_ref is a bare
      {execution_attempt_id, object_hash} pointer, not the full ExecutionAttempt object, so
      synthesizing it is fine, same as other SYNTHESIZED_UNBACKED refs elsewhere in this
      deliverable' -- is wrong. operational_receipt.py:170-175 makes execution_attempt_ref
      MANDATORY for receipt_type='execution.result' (the only v1 receipt_type ops_receipts can
      express), operational_receipt.py:101-103's EXECUTION_ATTEMPT_CAPABLE_RECEIPT_TYPES has
      exactly one member so no other receipt_type may carry it either, and
      close_execution_attempt() (operational_receipt.py:224-249) compares the ref against a
      REAL ExecutionAttempt object -- a synthesized ref can never match an object that was
      never constructed, making every receipt this adapter produced PERMANENTLY unclosable.
      This is precisely the failure shape a 2026-08-23 revision to this same file was hardened
      against, after a prior Kimi K3 review broke an earlier blocklist-shaped guard the same
      way on an unregistered receipt_type."
    status: CONFIRMED
    # Outcome: FIXED. Every claim independently re-verified against operational_receipt.py
    # directly (receipt above) before any code change was made. adapt_ops_receipt_to_
    # operational_receipt rewritten to unconditionally reject rather than construct. The
    # general rule this establishes (shared with the sibling ExecutionAttempt-exclusion
    # PENDING-ARMS row on the slice-2 PR): SYNTHESIZED_UNBACKED is legitimate for descriptive
    # fields and banned for authorization/closure-bearing ones, regardless of whether the
    # field is mechanically "just a bare pointer."
