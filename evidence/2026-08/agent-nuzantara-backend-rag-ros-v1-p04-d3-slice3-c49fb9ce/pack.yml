residual_risks:
  - >-
    This adapter adapts ZERO rows successfully, by design, until an S9-C0 freeze-change ruling
    lands (see PENDING-ARMS.md row). It is NOT a working OperationalReceipt adapter for
    Magazine as of this PR -- the value shipped is the row-level validity checks (reusable once
    unblocked) and a structural, tested refusal that prevents reintroducing the unsafe
    synthesized-ref form. No downstream consumer (slice 3b's shadow/parity probe, or any future
    persistence work) should assume this adapter can produce output.
  - >-
    The PENDING-ARMS.md row this PR carries is a hard architectural blocker, not routine
    disclosed-placeholder debt -- flagged explicitly in brief.yml's risks section so it is not
    mistaken for an ordinary "ship with a caveat" row.
