    design), test_operational_receipt_adapter.py (97 lines, final: 8 rejection-path tests),
    PENDING-ARMS.md (+2/-0, one ledger row -- edited in place across both commits since it was
    never pushed before the correction, not two separate rows), brief.yml (130 lines,
    corrected). No existing file touched.
  behaviour_change: >-
    This adapter has never successfully adapted any row, in either commit version that reached
    origin: the FIRST commit (060d23051) constructed a full OperationalReceipt with a
    synthesized execution_attempt_ref -- that version was never pushed and is not part of this
    diff's history as seen by origin/main; only the corrected, unconditional-rejection version
