brief_ref: evidence/brief.yml
plan_ref: >-
  PR #5333 (agent/air-m5/backend-rag/visa-window-seq18-0831 -> main) — seq-18 widens the
  OFFICIAL_PORTAL freshness window from seven days to thirty-two, putting the next boundary on
  2026-10-01T13:18:00Z. Ordered by Zero on 2026-08-30 after the seven-day window expired unnoticed
  and took the Visa Oracle silent for ~5 hours. Fold doctrine inherited from
  backend/scripts/visa_engine/fold_pack_seq17.py; ceremony runbook
  docs/runbooks/visa-engine-key-ceremony.md.

seat_override: >-
  R8 asks for a ground_truth lane because this diff touches visa_engine, and none was consulted —
  correctly. This fold changes a POLICY NUMBER that Zero ordered (the OFFICIAL_PORTAL freshness
  window, 7 days -> 32), not a regulatory fact: there is no external authority to ground "how long
  may a reading stay trusted" against, and the pages themselves are unchanged. Declaring a
  ground_truth lane here would mean inventing a notebook query that never happened, which is the
  exact failure the rule exists to prevent. The fact this PR could have grounded — whether anyone
  re-read the eighteen portal pages — is deliberately NOT claimed anywhere: seq-17's verified_at is
  inherited untouched, and the unprovable-attestation gap is recorded in dissent and in
  research/visa/2026-08-30-freshness-restamp-seq17-attestation.md as open work, not as evidence.

lanes:
  - lane: seq18-window-build
    role: build
    seat: claude (this session — M5 interactive, sole build lane)
  - lane: seq18-refuter-r1
    role: review
    seat:
      codex gpt-5.6-sol xhigh (non-Anthropic) — adversarial grader on the diff, dispatched
      without the brief; never the build seat

diff:
  files: 13
  net_lines: 19682
  measured_at: c59d527faa
  note: >-
    git diff --no-renames --numstat $(git merge-base origin/main HEAD)..HEAD, where the merge-base
    is 0857ce15bc — the branch was repointed onto fresh main to pick up a workflow the base
    predated, so the base moved off the sequence-17 landing. Measured from the MERGE-BASE, never a two-dot
    diff against a stale PR_BASE — that mistake pulls in hundreds of unrelated changes and accuses
    this PR of main's files (cicatrix #9 / W102). The two pack JSONs (9068 + 9005 lines) are
    generated artifacts of the deterministic fold plus the offline signer; the hand-authored
    surface is the fold script, its witness file, the signer's forward guard and its tests, one
    content-keyed triage rule with its contract test, and this evidence.

    Wording note: an earlier revision of this note put the word "commit" immediately after a
    sequence number, and the countable-claims lint read that adjacency as a claim about how many
    commits the branch carries (two). The phrasing here keeps the two apart; the lint's own
    over-match (superscar #3) is ledgered separately rather than worked around in silence.

