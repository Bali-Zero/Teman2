council_run: council-run.jsonl

dissent:
  - objection: >-
      seq-18 shipped with no witness test file, where seq-15 and seq-17 each have one. Nothing on
      disk would have caught a wrong window constant, and a wrong constant is invisible until the
      Oracle goes silent — the exact failure mode this pack exists to postpone.
    seat: session (build lane, self-audit before the refuter reported)
    status: CONFIRMED
    resolution: >-
      Fixed in this PR: test_seq18_freshness_window.py, 24 tests, whose load-bearing case
      recomputes the 1 October boundary from the payload rather than trusting the constant.

  - objection: >-
      Four places still describe the portal freshness window as "7-day" and are now false:
      scripts/visa_freshness_sentinel.py:5, scripts/tests/test_visa_freshness_sentinel.py:27,
      apps/organism/organism/organs_registry.yaml:2557, and
      infra/launchagents/wrappers/pro-visa-freshness-sentinel.sh:2.
    seat: session (build lane, grep of 604800 / "7-day" across the worktree)
    status: CONFIRMED
    resolution: >-
      Deliberately NOT all fixed here, and named rather than left silent. The two sentinel files
      belong to PR #5339, which is open on exactly those files and is the honest home for them.
      The wrapper is a HOME-fork declared pair (infra/home-fork/declared-pairs.json[146]) — editing
      the repo side makes it diverge from the live copy on Pro until synced, so it needs the sync
      in the same gesture and gets its own PENDING-ARMS row rather than being smuggled into a pack
      ceremony. The registry note is prose with no live pair and is corrected here.

  - objection: >-
      The widened window is itself the risk: the engine may now decide on an official immigration
      portal page last read a MONTH ago. Seven days was the assertion that these pages change often
      enough to matter.
    seat: session (build lane) and Zero's own framing of the order
    status: CONFIRMED
    resolution: >-
      Accepted deliberately and stated in the fold's own docstring rather than smoothed over.
      Nothing about the pages changed; what changed is that the re-attestation lane meant to honour
      the seven days does not run, so the promise was being kept by nobody. A thirty-two-day window
      that is actually honoured is safer than a seven-day one that silently lapses. This is NOT a
      substitute for building that lane, and the pack says so.

  - objection: >-
      Nothing in the artifact proves anyone re-read the pages, and this fold does not fix that —
      it inherits seq-17's unprovable verified_at wholesale.
    seat: seq-17's adversarial review (codex + kimi), carried forward
    status: CONFIRMED
    resolution: >-
      Out of scope by construction and correctly so: this fold changes a POLICY, and a policy change
      needs no attestation. Moving a stamp without a reading is the false attestation that review
      named. The attestation gap is recorded in
      research/visa/2026-08-30-freshness-restamp-seq17-attestation.md and is the subject of separate
      work, not of this pack.

  - objection: >-
      CRITICAL (codex, refuter finding 1): the signed seq-18 artifact declares it was created
      AFTER its own signature. payload.created_at = 2026-08-31T00:00:00Z; the envelope's
      protected.signed_at = 2026-08-30T17:18:16.587039Z. The signature proves those bytes already
      existed, so the timestamp is internally false by 6h41m43s. Nothing in the chain could see it:
      sign_pack.py only compared signed_at to the wall clock, bundle.py's verifier only compares
      signed_at to observed_at, and no model validator relates the two. seq-17 is coherent
      (created 13:20Z, signed 15:16Z), so this is this fold's defect, not an inherited one:
      FOLD_CREATED_AT was authored as a round placeholder.
    seat: codex gpt-5.6-sol xhigh (cross-family refuter, no brief)
    status: CONFIRMED
    resolution: >-
      Split, because the artifact is signed and live and CANNOT be edited. (a) The defect is PINNED
      rather than hidden: test_seq18_claims_to_be_created_after_it_was_signed asserts the
      incoherence with the arithmetic in the failure message, and says in its own docstring that
      seq-19 must replace it with the positive invariant, not delete it quietly. (b) The forward
      guard is added HERE so no future pack can repeat it: sign_pack.py now refuses to sign a
      payload whose created_at is after signed_at. (c) The artifact itself is corrected only by
      seq-19, per the same rule that governed seq-17's inherited version string.

  - objection: >-
      HIGH (codex, refuter finding 2): assert_only_expected_changes excludes CHANGED_TOP_LEVEL_KEYS
      from comparison ENTIRELY, so a field is free not merely to move but to move to a WRONG value.
      The refuter ran real mutations against the fold's own output and all of these passed both the
      guard and RulePackPayload.model_validate: max_age_seconds=1, sequence=19,
      version="2026.9.99", created_at="2099-01-01T00:00:00Z", previous_payload_sha256="a"*64,
      rollback_of_payload_sha256="b"*64. A guard the fold's docstring calls fail-closed was
      fail-open on exactly the fields the fold exists to change.
    seat: codex gpt-5.6-sol xhigh (cross-family refuter, no brief)
    status: CONFIRMED
    resolution: >-
      Fixed in this PR: assert_changed_fields_hold_their_expected_values pins every one of the seven
      changed top-level keys to its expected value (sequence 18, the uuid5 rule_pack_id, version,
      created_at, created_by, the seq-17 chain digest, rollback None), requires exactly 18 portal
      records in the OUTPUT, and requires every portal window to be exactly 2764800. Wired into
      fold() between the shape guard and model validation, and covered by seven parametrized
      wrong-value cases plus the window=1s and window-left-at-604800 cases.

  - objection: >-
      MEDIUM (codex, refuter finding 3): the fold does not prove its input is signed or active — it
      recomputes the source digest and compares it to a constant written in the same file. An author
      who pinned the digest of a valid but never-activated pack would sail through a check whose
      failure message calls the input "the activated artifact".
    seat: codex gpt-5.6-sol xhigh (cross-family refuter, no brief)
    status: CONFIRMED
    resolution: >-
      Half fixed here, half correctly out of reach, and the halves are named rather than blurred.
      Fixed: fold() now REQUIRES the signed seq-17 envelope and
      assert_anchor_is_a_verified_signed_artifact verifies its Ed25519 signature against the SAME
      trust store production uses (VISA_ENGINE_TRUST_STORE_KEYS_JSON — a public key, not a secret),
      then requires the verified payload_sha256 to equal the digest recomputed from the source. Not
      fixed, deliberately: signed is not active, and only the production catalog can settle that.
      That receipt is in this pack (active sequence 18, digest 5a24472d…5849 matching the on-disk
      artifact, read through the read-only role) — the fold does not query production, and should
      not.

  - objection: >-
      HIGH (codex, refuter finding 4): the seq-18 witness test existed only as an untracked file at
      the reviewed HEAD, so CI and every reviewer of the branch would have received none of it.
    seat: codex gpt-5.6-sol xhigh (cross-family refuter, no brief)
    status: CONFIRMED
    resolution: >-
      An artifact of reviewing a dirty worktree, and resolved by the commit that carries this pack:
      the witness is tracked, and grew from 24 to 35+ tests answering the specific gaps the same
      finding named (the temporal defect it had masked, and the wrong-value cases the guard now
      pins). Recorded rather than dismissed, because "the reviewer saw a state the branch did not
      have" is exactly the excuse that hides a real omission.

  - objection: >-
      LOW (codex, refuter finding 6): the seq-18 triage rule is correctly scoped — pinned to the
      exact path, the exact assignment and the exact digest, end-anchored, rejecting a different
      path, a different value and a ride-along credential on the same line — but the TEST gesture
      was incomplete. seq-17 has a dedicated contract test (path/value/API-key/ride-along); seq-18
      had only the count assert and generic anchoring properties. The comment above that assert
      still said "count (15)" while the assert required 22.
    seat: codex gpt-5.6-sol xhigh (cross-family refuter, no brief)
    status: CONFIRMED
    resolution: >-
      Fixed in this PR: test_fold_seq18_rule_is_exact_and_rejects_ride_alongs mirrors the seq-17
      contract test (and adds the scoping assertions that the rule must NOT forgive the seq-17 or
      seq-14 folds, which legitimately hold the same digest as their own output); the stale count
      comment now reads 22 with its date.

  - objection: >-
      SPECULATIVE (codex): json.dumps(sort_keys=True) treats {"1": x} and {1: x} as equal, so the
      guard could be fooled by integer-key coercion.
    seat: codex gpt-5.6-sol xhigh (cross-family refuter, no brief)
    status: PLAUSIBLE
    resolution: >-
      Marked speculative by the reviewer itself and not acted on: both the input and the clone come
      from json.loads, which cannot produce a non-string key, so the path is unreachable here. Noted
      rather than fixed because a future caller that builds the payload in Python instead of parsing
      it would make it reachable; a structural comparison would remove the ambiguity for good.
