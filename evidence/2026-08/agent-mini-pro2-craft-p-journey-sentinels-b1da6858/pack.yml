dissent:
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — visa-clock writes a durable production row every hour. The
      interception misses /api/funnel/session/touch, which the visa layout's
      SessionInit POSTs; funnel.py INSERTs a funnel_sessions row carrying the
      probe's IP hash, retained 90 days, and a fresh Playwright context
      guarantees a new session id every run.
    status: CONFIRMED
    repro: >
      Verified at source AND with a live request log before acceptance. The log
      also showed a Sentry envelope POST that neither seat named — visible only
      because the requests were instrumented rather than reasoned about. This
      falsified "It does not POST" in the previous commit message, the SECOND
      time in this session a cleanliness claim of mine was falsified by
      measurement. Fixed with a shared no-write guard on all four specs that
      also re-checks every observed request, so a spec that starts writing goes
      red. Proven by response provenance, not by the guard's own accounting.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — the "zero analytics pollution" claim is false. The route blocks
      only the first-party analytics POST, but emitFunnelAppEvent calls gtag
      first and production loads GA, so page views and funnel events reach GA4
      every run.
    status: CONFIRMED
    repro: >
      Measured: 3 GA/GTM requests fired. Cured by the same guard, which blocks
      google-analytics.com, googletagmanager.com, doubleclick and /g/collect.
      Post-fix the GA request is answered by a local stub with no server headers.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — a missing, unloadable or skipped sentinel can produce GREEN.
      The wrapper reads only the collected suites, ignores Playwright's
      top-level errors, never validates the spec inventory, and Playwright
      reports a skipped test as ok.
    status: CONFIRMED
    repro: >
      The first fix handled top-level errors and the skipped case (verified:
      test.skip surfaces as "[SKIPPED — never actually ran]" in real_failures)
      but NOT deletion: it diffed the report against a disk glob, so removing a
      spec shrank both sides together. Measured — moving dream.spec.ts away gave
      `missing_files: []` and a clean exit 1. Corrected with a required-spec
      FLOOR (exit 8, names the file). A floor rather than a full inventory: a
      complete list drifts on every legitimate addition, a floor drifts only
      when a sentinel is deliberately retired.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      CRITICAL — the /prime sentinel passes when the map is entirely absent. It
      checks only for five error strings, so a 404, a blocked SDK, a CSP
      failure, a renamed error code or a blank map all pass.
    status: CONFIRMED
    repro: >
      Fixed with positive assertions — response ok, the Maps SDK actually
      loaded, the map element present, the loading skeleton gone — on top of a
      broadened error-string check. It still fails today for the real expired
      key, with the operator[GUI] message intact.
  - seat: codex gpt-5.6-sol (blind, cross-family)
    objection: >
      HIGH — dream can pass without exercising the guarded path (SSR HTML is
      typeable with dead hydration); a stale lock disables the sentinel forever;
      a stale JSON report can override a crashed run; an unrestricted baseURL
      lets the cron green against a different deployment while calling it
      production; retries:0 turns one network blip into a P0 whose dedup key can
      then mute a later real defect.
    status: CONFIRMED
    repro: >
      All five fixed. dream now awaits the real autosave 401. The lock carries
      pid+timestamp and a stale one is taken over WITH an alert. A report older
      than this run's start is refused. baseURL must be an allowlisted https
      production host — verified live, localhost exits 7. One confirmation retry
      plus an error-text fingerprint in the dedup key.
  - seat: kimi-code/k3 (blind, cross-family, second seat)
    objection: >
      L4 — LOCK_ACQUIRED is set and never read (dead code).
    status: RETRACTED
    repro: >
      FALSE. It is read at journey_sentinel.sh:291 (`if [ "$LOCK_ACQUIRED" -ne 1 ]`),
      the branch that skips an overlapping tick. My own first grep was truncated
      and appeared to agree with it; I nearly deleted live code on a refuter's
      say-so. Checking is the only reason I did not (W65 — the refuter
      hallucinates too).
  - seat: kimi-code/k3 (blind, cross-family, second seat)
    objection: >
      L3 — analytics pollution is only half-handled (visa-clock stubs the
      first-party POST, the other three specs fire real pageviews/GA/Sentry
      hourly); L8 — JOURNEY_SENTINEL_BASE_URL can point the whole suite at
      localhost with no guard.
    status: CONFIRMED
    repro: >
      Both were reviewed against the PRE-fix diff and both are cured by the same
      round: the no-write guard is now installed by ALL FOUR specs, and the
      baseURL allowlist refuses a non-production host (verified live: exit 7).
      Re-checked rather than assumed cured.
  - seat: kimi-code/k3 (blind, cross-family, second seat)
    objection: >
      L1/L2/L6/L7 — dedup keys truncated to 40 chars can merge two conditions;
      any title rewording resets the alert ladder; tg_notify exits 0 by contract
      even when an alert is spooled unsent, so the wrapper's rc capture implies
      a guarantee it does not have; visa-clock asserts "Valid until" is absent
      from the whole body, so future legitimate copy containing that phrase
      would be a false red.
    status: PLAUSIBLE
    repro: >
      All four accepted as real and DECLARED rather than fixed — see
      residual_risks and the wrapper's own "Known limits" block. L6 in
      particular is worth a reader's attention: the wrapper logs an alert rc
      that cannot express delivery failure.

residual_risks:
  - "The seeded self-test proves DETECTION, not alert DELIVERY: on its expected
    failure the wrapper takes the normal path and never calls alert. Once
    /prime is fixed, the Telegram path could rot with every run reporting
    healthy. Compounded by tg_notify exiting 0 even when an alert is spooled
    unsent, so the logged rc cannot express a delivery failure."
  - "magic-link asserts the form renders but never types or submits (submitting
    sends a real email), so a broken onChange/onSubmit stays green; and it
    hardcodes my.balizero.com, so a legitimate migration back to balizero.com
    would read RED."
  - "The installer does not verify it is running on Mini while the wrapper
    always emits mini.journey_sentinel — installing on another host would
    fabricate Mini liveness."
  - "visa-clock's hydration wait is a fixed 2.5s timing assumption, not an
    observable condition; CPU contention or a slow CDN can turn it into a false
    red. It also intercepts its API rather than POSTing, so it exercises the
    client-side surface (#5170 was a Math.max bug) but not the server leg."
  - "Three of the four sentinels currently guard already-cured defects. Only
    /prime is detecting anything today. Their value is future regressions, and
    that is stated rather than dressed up."
  - "Dedup keys are truncated to 40 chars, so two spec titles sharing a prefix
    could merge into one condition as the suite grows; and rewording a title
    resets the alert ladder."
  - "The suite drives a real browser against production hourly. If it ever
    starts writing again, the guard's own re-check is the tripwire — but that
    tripwire is code in the same PR, not an independent observer."

