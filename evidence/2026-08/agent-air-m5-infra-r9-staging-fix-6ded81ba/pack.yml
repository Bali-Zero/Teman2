dissent:
  - seat: "kimi-code/k3 (review lane)"
    objection: >-
      sanitize_relpath's absoluteness test was a string compare on `parts[0] == "/"`, but POSIX
      reserves a LEADING DOUBLE SLASH: PurePosixPath("//x").parts[0] is "//", so the check accepted
      it. `staged_dir / "//x"` then discards the left operand (the right is absolute) and the write
      lands outside the staged tree — while R9 itself refuses the value via Path.is_absolute(). The
      docstring's claim to "mirror R9's confinement by construction" was therefore false.
    status: CONFIRMED
    note: >-
      Fixed by asking PurePosixPath for is_absolute() instead of comparing strings. Verified rather
      than reasoned: test_sanitize_relpath_mirrors_r9s_confinement_in_both_directions asserts
      sanitize_relpath("//etc/passwd") is None. The seat also traced why the end-to-end path could
      not observe it (git show refuses that pathspec before any write), which is exactly why that
      case is pinned by a direct unit assertion instead.
  - seat: "kimi-code/k3 (review lane)"
    objection: >-
      The blanket `".." in parts -> refuse` was WRONG IN THE OTHER DIRECTION: R9 resolves
      `(pack_dir / council_run).resolve()`, so "a/../b" is a perfectly good reference to "b" inside
      the pack dir and R9 accepts it. The helper refused it, staged nothing, and R9 then failed a
      legitimate pack — this PR's own defect reproduced in miniature by its own fix.
    status: CONFIRMED
    note: >-
      Fixed by resolving `..` lexically the way R9's .resolve() does, refusing only what actually
      leaves the pack dir. Pinned end-to-end by
      test_council_run_shapes_r9_accepts_are_staged_verbatim[council/../council-journal.jsonl],
      which goes red against the pre-review implementation.
  - seat: "kimi-code/k3 (review lane)"
    objection: >-
      A `council_run:` naming "pack.yml" or "brief.yml" resolves to the canonical names CI stages the
      pack and brief under, so the helper would write over the very files the lint is about to read.
      The seat worked through whether this could fail-open (it cannot — two JSON-object lines are not
      a single valid YAML document, and one line cannot carry two distinct seats) and still asked for
      a guard rather than an argument.
    status: CONFIRMED
    note: >-
      Fixed with STAGED_RESERVED_NAMES. Costs no legitimate pack anything (R9 finds no quorum in a
      YAML document either way) and removes the clobber. Pinned by the [pack.yml] and [brief.yml]
      legs of test_absolute_escaping_or_reserved_council_run_stages_nothing — whose assertion had to
      be moved onto the script's REPORTED DECISION, because staging those two blobs rewrites them
      with byte-identical content and leaves the staged file LIST unchanged.
  - seat: "codex-gpt-5.6-sol (review lane)"
    objection: >-
      CRITICAL, git object-type confusion: journal_bytes_at_head used `git show <sha>:<path>` with no
      check on the object's type or mode, and wrote whatever came back as a regular file. `git show`
      on a TREE succeeds and prints the child FILENAMES, so a pack could declare a DIRECTORY as its
      council_run and fill it with files whose names are complete JSON review records — the staged
      listing then reads as a valid two-seat journal and R9 reaches quorum, while on a real tree R9
      refuses it outright because `journal_path.is_file()` is False.
    status: CONFIRMED
    note: >-
      Verified independently before fixing, not accepted on the refuter's word: `git show HEAD:<a
      pack dir>` on this repo prints "tree <sha>:<path>" then brief.yml / council-journal.jsonl /
      pack.yml. Fixed with a git MODE gate (100644/100755 only) — a type check would not have been
      enough, because a symlink is also a blob and only mode 120000 distinguishes it (measured on
      .claude/skills/bot). Pinned by test_guilt_a_directory_named_as_the_journal_is_never_staged.
  - seat: "codex-gpt-5.6-sol (review lane)"
    objection: >-
      HIGH: `a/../b` is cancelled LEXICALLY here but resolved SYMLINK-AWARE by R9, so with a symlink
      at `a` the two name different files — the script stages the pack-root journal and synthetic R9
      then passes, where R9 on the real tree would have followed the symlink and refused.
    status: CONFIRMED
    note: >-
      Demonstrated by the seat with a symlink already tracked in this repo (.claude/skills/bot ->
      ../../.agents/skills/bot). Fixed by verifying, for every prefix a `..` cancels, that it is a
      directory at HEAD. Scoped on measurement rather than adopted wholesale: a prefix that does NOT
      exist is not a disagreement, because Path.resolve() is non-strict and normalizes it lexically
      too — refusing those as well would have re-broken kimi-code/k3's finding above. Pinned by
      test_guilt_dotdot_cancelling_a_symlink_is_never_staged.
  - seat: "codex-gpt-5.6-sol (review lane)"
    objection: >-
      HIGH: the new corpus was not a PR gate at all. No workflow ran it — guard-conformance.yml runs
      only the linter's corpus, and scripts-tests-sweep.yml is scheduled/manual with
      `continue-on-error: true` — so a regression of this fix would never turn a required check red.
    status: CONFIRMED
    note: >-
      The sharpest finding of the round, and the one that would have made the whole PR theatre.
      Fixed by adding the corpus as an executed step in guard-conformance.yml (whose job IS a
      required context on main) and adding the four relevant paths to its relevance filter — then
      verifying the filter actually matches this PR's own changed files, rather than assuming it.
  - seat: "codex-gpt-5.6-sol (review lane)"
    objection: >-
      HIGH: harness-floor.yml runs the helper from the BASE checkout, which makes it trusted decision
      code, but CODEOWNERS protected the workflow and not the helper or its test. A malicious edit
      would be judged only after merge, because a PR's own run still uses base's copy.
    status: CONFIRMED
    note: >-
      Fixed by adding both files to the CODEOWNERS Tier-1 block, alongside the change_map.py /
      impact_map.py / shard_tests.py entries that exist for exactly this trust-boundary reason.
  - seat: "codex-gpt-5.6-sol (review lane)"
    objection: >-
      MEDIUM: the bootstrap guard treated ANY future absence of the helper as a legitimate bootstrap
      window and continued with exit 0. Deleting the helper would therefore silently un-stage every
      council journal, and while R9 is still a NOTICE (before 2026-09-02) that window passes Gear-3
      PRs with no council at all.
    status: CONFIRMED
    note: >-
      Fixed by binding the exemption to this PR's own number and failing closed otherwise — the
      SENTINEL shape this same step already uses twice for tracked_file_present_in_diff.sh, rather
      than a new invention.
  - seat: "codex-gpt-5.6-sol (review lane)"
    objection: >-
      LOW: the wiring pin was a substring-and-order search over the raw workflow file, so a
      COMMENTED-OUT invocation, or three flags scattered anywhere in the file, would satisfy every
      assertion without any staging happening.
    status: CONFIRMED
    note: >-
      Partially fixed and the remainder declared rather than papered over: comment lines are now
      stripped before the search (this step's own comments quote the invocation, so the
      commented-out bypass was live). A line parked under `if false` would still pass — presence is
      what a static pin can prove, not reachability, and that limit is now written into the test's
      own docstring.
  - seat: "claude-opus-5 (build lane), against its own first implementation"
    objection: >-
      read_council_run returned `raw.strip()`, but R9 tests `.strip()` only for emptiness and then
      resolves the RAW string — so a value like " journal.jsonl" names a file whose first character
      is a space, and the helper would have staged it under a different name than the one R9 goes
      looking for.
    status: CONFIRMED
    note: >-
      Found while writing the review prompt's own question list, before either seat reported;
      recorded here rather than quietly fixed. The value is now returned unstripped and the fixture
      writes council_run as a JSON-quoted YAML scalar so the whitespace survives the round-trip —
      a plain scalar would have been stripped by the YAML parser and the test would have proved
      nothing.
  - seat: "claude-opus-5 (build lane), on the direction of the fix itself"
    objection: >-
      The cheaper fix was to make R9 resolve `council_run` against --repo-root, which would have made
      every Gear-3 PR green immediately with a one-line change to the rule.
    status: RETRACTED
    note: >-
      Retracted on evidence, not on principle. R9's docstring declares `council_run` pack-dir-relative
      and confines it there, and the only real council pack in the tree commits the journal into that
      directory — so repo-root resolution would have been loosening a gate to make PRs pass. It is
      also unimplementable here: this job checks out BASE, so the real per-PR pack directory does not
      exist on disk at all and the pack itself only reaches CI through `git show`.
