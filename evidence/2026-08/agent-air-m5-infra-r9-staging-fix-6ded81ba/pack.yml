notes:
  - >-
    The workflow guards its call with `if [[ -f scripts/ci/stage_council_journal.py ]]`, the same
    bootstrap shape as the --source-path probe a few lines below: this job's checkout is BASE, so the
    script this PR adds is not present on this PR's own run. Missing script -> stage nothing and say
    so, which is exactly today's behavior; self-consistent from the first Gear-3 run after merge.
    That branch is declared in `risks:` as the one path this PR cannot exercise against its own CI.
  - >-
    This pack exists because the diff touches `.github/workflows/`, a hot-zone path that floors at
    Gear 3 regardless of size — the same reason PR #5000 needed one. Its `council_run:` is not
    ceremonial: it is the first pack in the repo authored under the rule this PR repairs, and its
    journal records the two cross-family seats that actually reviewed the diff.
