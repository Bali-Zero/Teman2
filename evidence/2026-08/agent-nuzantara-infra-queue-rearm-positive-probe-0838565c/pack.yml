dissent:
  - seat: session (self-review while writing the jq enrichment join)
    objection: 'The first attempt at the `mergeQueueEntry` enrichment transform
      (`($inq | map(tonumber)) as $inqnums | map(. + {mergeQueueEntry: (if ($inqnums |
      index(.number)) != null then {} else null end)})`) failed outright:
      `jq: error (at <stdin>:0): Cannot index array with string "number"` — because
      `index(.number)` evaluates `.number` against the piped-in value (`$inqnums`, an array),
      not the outer PR object being mapped.'
    status: CONFIRMED
    resolution:
      "Bound `.number as $n` first inside the `map(...)`, then tested membership with
      `$inqnums | any(. == $n)`. Verified empirically via a direct standalone jq invocation
      before writing the corrected expression into `queue_rearm.sh` — never trusted as
      'should work' reasoning alone."
  - seat: session (self-review while testing the fix in-worktree)
    objection:
      "Running `python3 scripts/lint_arm_probe.py --json` from inside this worktree, AFTER the
      fix to `queue_rearm_population.sh` had already been applied on disk, still reported the OLD
      (pre-fix) findings — appearing to say the fix had not taken effect."
    status: CONFIRMED
    resolution:
      "The lint's own `_canonical_repo_root()` detects `.worktrees` in the resolved path and
      redirects `REPO_ROOT` to the MAIN checkout, which does not yet have this worktree's
      uncommitted edits — a correct anti-sibling-race behaviour for its intended use, but a trap
      for testing in-progress worktree changes. Fixed by explicitly passing `--repo-root . --root
      .` to force the lint to scan this worktree instead of the auto-redirected main checkout;
      the new `TestRealAllowlistEntries` pytest class deliberately uses
      `git rev-parse --show-toplevel` rather than the lint's own `REPO_ROOT` constant for the same
      reason."
  - seat: session (self-review while choosing an exemption mechanism for the 2 false positives)
    objection:
      "Considered reusing `lint_arm_probe.py`'s pre-existing `SUPPRESSION_MARKER` for the 2 real
      false positives instead of building a new mechanism."
    status: CONFIRMED
    resolution: "Rejected after re-reading the lint's own governing test
      (`test_marker_appears_only_in_this_lints_own_test_file_and_its_definition`), which git-greps
      the tracked tree and asserts the marker appears ONLY in the lint's own source and test file
      — using it on real production code or a historical evidence-pack receipt would both break
      that test AND misrepresent what those lines are (the marker specifically means 'synthetic
      test fixture', not 'real code, exempted'). A separate, honestly-named `ALLOWLIST` mechanism
      was built instead, modelled on the sibling lint's own existing `ALLOWLIST`+tripwire pattern
      — the closest non-inventive precedent already in this repo, per the dispatching mandate's own
      instruction to use a documented mechanism rather than invent one from nothing."
  - seat: session (self-review, discovered mid-session, not flagged by the dispatching mandate)
    objection:
      "This diff's own fix to `queue_rearm_population.sh` silently made a DIFFERENT, already-armed
      lint's (`lint_queue_field_verdict.py`) one existing `ALLOWLIST` entry's written justification
      FALSE: that entry excused `queue_rearm_population.sh` on the grounds that the file 'has no
      awareness of its own' `mergeQueueEntry` — which stopped being true the moment this diff added
      the literal text `mergeQueueEntry` to that file's own selectors."
    status: CONFIRMED
    resolution:
      "Removed the now-stale entry per that lint's own documented SHRINK-ONLY allowlist policy
      (confirmed via a full-tree re-scan: allowlisted count genuinely dropped from 1 to 0, not
      just an unenforced claim). Reworked its 2 `run_selftest()` tripwire cases and 3 pytest tests
      to inject/remove a SYNTHETIC subject/orchestrator pair instead of depending on the real
      (now-cured) path, so the tripwire MECHANISM stays tested independent of any specific
      production file's future state. Re-verified: 16/16 selftest cases and 36/36 pytest tests
      still pass after the rework."
  - seat: session (self-review, caught via re-running a command without truncating its output)
    objection:
      "This pack's own first-draft acceptance criterion for `lint_arm_probe.py --selftest`
      stated '11/11' — a number carried over from a mid-session view of that command's output that
      had been piped through `tail -20`, which silently dropped earlier `[PASS]` lines from a
      total output longer than 20 lines."
    status: CONFIRMED
    resolution:
      "Re-ran the exact same command with no truncation this session and counted PASS/FAIL lines
      directly against the full captured file (`grep -c` against an untruncated redirect to
      /tmp/arm_selftest.txt): the true count is 15 PASS, 0 FAIL. Corrected in brief.yml's
      acceptance section and in this pack's own receipts before either was committed — caught by
      re-verifying the actual count in this turn rather than trusting a number carried over from
      an earlier, differently-scoped view of the same command, per this repo's own
      anti-hallucination discipline."
