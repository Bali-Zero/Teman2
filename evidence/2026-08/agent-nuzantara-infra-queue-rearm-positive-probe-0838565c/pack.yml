diff:
  net_lines: |
    11 files, +1318/-82, 2 commits
  behaviour_change: |
    Two files change RUNTIME BEHAVIOUR; the rest are tests, a lint's own exemption data, and CI
    wiring. (a) `scripts/ci/queue_rearm_population.sh`'s `--candidates`/`--undecidable` selectors
    gain one additional jq condition each (`mergeQueueEntry==null`) — a PR already sitting in the
    merge queue can no longer be misread as an unarmed candidate or an undecidable orphan, however
    its `mergeable`/`autoMergeRequest` fields read. (b) `scripts/ci/queue_rearm.sh` gains a new join
    step (no new network call) that enriches its already-fetched open-PR list with each PR's
    `mergeQueueEntry` before handing that list to the population script, plus a fail-closed
    `enriched_count != open_count` guard. Everything else in this diff is tests
    (`test_queue_rearm_population.sh`'s new guilt+innocence fixtures), a lint's own data
    (`lint_arm_probe.py`'s new `ALLOWLIST` dict and `--selftest` mode; `lint_queue_field_verdict.py`'s
    ALLOWLIST removal and reworked tests), and CI configuration
    (`immune-enforcement.yml`'s new paths-filter lines, pytest-loop line, and one new unconditional
    step) — none of which change what any script does at merge-queue-arming time.
