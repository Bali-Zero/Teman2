seat_diversity: ok
seat_diversity_note: >-
  Two build lanes across two families and two review lanes across two more. D3 is
  satisfied by a real build lane, not by seat_override.

  The measurement worth recording: the two reviewers ran in parallel on the same
  diff with the same attack list and overlapped on four of thirty findings. k3
  found the duplicate-KEY hole and the origin/main CI landmine; sol found that
  `cat-file -e` is true for a DIRECTORY, that the rename had left four LIVE .py
  files behind, and that one of the registry's own records asserted a
  contradiction that does not exist. Neither would have been enough alone.
diff:
  net_lines: >-
    AS OF this commit (pinned): 14 files, +1471/-21, measured against the MERGE
    BASE with `git diff --cached --numstat`. Three of those files are this
    evidence pack, and the count includes them.

    Deterministic gear floor recomputed from this diff = 3 (source: path —
    .github/workflows/immune-enforcement.yml, edited to ARM the corpus).
  behaviour_change: >-
    A new registry and a new lint over it, plus a rename. The lint is read-only
    and writes nothing. The workflow edit adds the lint, its corpus and the
    registry to the in-job paths detector and the corpus to the unit-test runner,
    so editing the registry runs the lint that guards it. No required check is
    added or removed.

    The rename `docs/adr/ADR-006-* -> ADR-012-*` repoints 4 live .py files, one
    live README and 16 references inside one plan document. Dated research
    captures and the 2026-05-07 dated spec are deliberately untouched.
