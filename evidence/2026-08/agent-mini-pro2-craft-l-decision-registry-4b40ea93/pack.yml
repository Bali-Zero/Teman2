dissent:
  - seat: "kimi-code/k3"
    objection: "A duplicate KEY inside one entry overwrites silently, so a pasted record with two `id:` lines hides one and R1 — the hard fail — never sees the collision."
    status: CONFIRMED
    disposition: "Fixed: a repeated key is a ParseError naming both lines. This was the likeliest hand-edit accident and the one case the collision rule was blind to."
  - seat: "kimi-code/k3"
    objection: "`superseded-by:` as a KEY is a ParseError, although the STATUS value is literally spelled that way."
    status: CONFIRMED
    disposition: "Fixed: hyphenated keys are accepted and normalised, and the duplicate check runs on the normalised name so the two spellings still collide. The schema's inconsistency stops being the writer's problem."
  - seat: "kimi-code/k3"
    objection: "The resolver gates every check on origin/main, whose only fetch in the immune workflow sits ~750 lines after the battery that runs this lint."
    status: CONFIRMED
    disposition: "Fixed, and it is the most expensive finding of the round: it would have turned a REQUIRED job red on innocent PRs for a ref nobody fetched. Probes for any usable ref; CANNOT-VERIFY is now a typed exception rendered as exit 4, since the docstring promised a verdict and the code delivered a traceback."
  - seat: "kimi-code/k3"
    objection: "A scalar `contradicts:` and an empty `superseded_by` both pass silently."
    status: CONFIRMED
    disposition: "Both fixed. A malformed field that reads as 'nothing to see' is the silent-skip disease; a present-but-empty field is worse than an absent one, because absence is honest."
  - seat: "gpt-5.6-sol"
    objection: "D-001 is falsely superseded by D-016; backend/llm/config.py:67-76 still makes Gemini primary, and D-016 governs the review gate."
    status: CONFIRMED
    disposition: "Already corrected by this gate before the review returned, from CLAUDE.md:261 — and sol's citation is the better one. Two independent measurements that the SPEC's instruction was wrong. Escalated as NEEDS-RULING rather than decided silently."
  - seat: "gpt-5.6-sol"
    objection: "`evidence: docs` resolves because `cat-file -e` is true for a tree; `/etc/passwd` resolves out of the repository."
    status: CONFIRMED
    disposition: "Fixed: `cat-file -t` must say `blob`, absolute/`~`/`..` paths are refused lexically before any filesystem call, and the working-tree fallback is `is_file()`."
  - seat: "gpt-5.6-sol"
    objection: "D-012's `contradicts: [D-006]` is a fabricated conflict."
    status: CONFIRMED
    disposition: "Removed, and it is the finding I am least comfortable with because it was mine: I recorded a NUMBER collision as a SEMANTIC contradiction in a registry whose only value is that its facts are true."
  - seat: "gpt-5.6-sol"
    objection: "The rename leaves live source comments in four .py files and a heading/commit-message inside the edited plan citing ADR-006."
    status: CONFIRMED
    disposition: "Fixed. My first sweep was `--include='*.md'`, so it could not see the .py files; and the plan pass replaced the FILENAME while leaving the bare number, so executing that plan would have recreated the collision inside the renamed file."
  - seat: "gpt-5.6-sol"
    objection: "`test_the_live_run_against_the_shipped_registry_is_clean` still passes with the resolver replaced by `bool(path)`."
    status: CONFIRMED
    disposition: "Fixed with two tests that exercise the REAL resolver. The mutation now kills both. This is the eighth vacuous fixture mutation has caught in me across this session's four PRs."
  - seat: "gpt-5.6-sol"
    objection: "D-009's 2GB rationale is stale against fly.toml:90 (api is 3gb since 2026-05-28); the eleven ADR dates are all the document's last-updated stamp, not decision dates."
    status: CONFIRMED
    disposition: "Both recorded rather than papered over: D-009 is retitled so it does not assert a moved number as current, and the date coarseness is stated in the registry header. Guessing eleven per-ADR dates from git archaeology would have put eleven plausible wrong facts where one known-coarse one is honest."
  - seat: "gpt-5.6-sol"
    objection: "D-002 is marked accepted although a 2026-04-10 spec calls the Generals tables obsolete; D-012 remains accepted after its migration condition occurred."
    status: PLAUSIBLE
    disposition: "NOT cured. Both are judgements about whether a decision is still in force, which is what the registry is FOR — and deciding them from a reviewer's citation without measuring the running system would put exactly the kind of unverified status into it that this PR spent its time removing. Recorded as the first two candidates for a status review, with their evidence, rather than flipped."
  - seat: "gpt-5.6-sol"
    objection: "Three-space indentation, block scalars and quoted-escape forms are valid YAML and are rejected; `next_free_id` at D-999 returns D-1000, which R2 rejects."
    status: PLAUSIBLE
    disposition: "NOT cured, declared. The parser is a documented SUBSET over a file this repo controls, and every rejection is loud. The D-1000 ceiling is 981 decisions away and would be a visible, immediate failure rather than a silent one."
