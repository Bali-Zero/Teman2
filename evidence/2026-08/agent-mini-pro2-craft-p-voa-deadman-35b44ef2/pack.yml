dissent:
  - objection: "CRITICAL — fresh `unknown` heartbeats can conceal a genuine outage forever."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "FIXED. Reproduced first (three consecutive ticks, fire=False). NOT cured by firing on `unknown` — PR-2's refutation established that firing on a single unattributable blip would be an outage the dead-man itself caused, and both refutations are correct. The discriminator is DURATION: UNKNOWN_ESCALATION_STREAK=3 distinct observations, keyed on ts_epoch so a faster poll cannot double-count, reset by any other verdict. Both directions proven live."
  - objection: "HIGH — the silence threshold has no scheduling margin (threshold == producer interval)."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "FIXED. Measured: SILENCE_THRESHOLD_S was 900.0 and the producer's interval is exactly 900s, so a probe delayed one second reads as stale — and a FALSE fire darkens a LIVE funnel, the worst direction. Now derived as PRODUCER_INTERVAL_S + SILENCE_MARGIN_S, both named, with a pin so the margin cannot silently return to zero."
  - objection: "CRITICAL — the heartbeat's identity and target are not validated; a fresh `pass` from staging or another probe is accepted as proof production is healthy."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "FIXED. `probe == voa_journey` and `mode == full` are now required; a mismatch is SILENCE naming the mismatch. `probe_version`/`base_url` explicitly declared-not-gated with their own pin."
  - objection: "HIGH — future or non-finite timestamps create an immortal false green (1e309 is inf)."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "FIXED via math.isfinite plus an OverflowError catch on huge JSON ints, each routed to a distinct SILENCE code."
  - objection: "HIGH — a nan/inf threshold disables silence detection entirely; a negative one causes constant false fires; a non-numeric one crashes before run_once()."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "FIXED. CLI and env validated identically; a bad value is refused loudly and falls back to the default rather than running with a threshold that cannot fire."
  - objection: "HIGH — OverflowError inside classify() emits no decision, no P0 and no DEADMAN_RESULT on input the spec says counts as SILENCE."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "FIXED — caught in read_heartbeat(), never reaches classify()."
  - objection: "MEDIUM — Path.read_bytes() with no regular-file check can block the tick forever on a FIFO/device/stalled mount."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "FIXED. A hung watcher is a dead watcher, and launchd will not start another instance while it hangs. is_file() check plus a 64 KiB stat()-based bound."
  - objection: "LOW — `schema != 1` is not exact: True == 1 and 1.0 == 1 in Python."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "FIXED — the check now matches what its docstring claims."
  - objection: "HIGH — a non-atomic heartbeat write causes a false fire; there is no retry, stable-read check or last-known-good snapshot."
    seat: codex-gpt-5.6-sol
    status: PLAUSIBLE
    disposition: "REFUTED WITH EVIDENCE, not fixed. False for THIS producer: voa_journey_probe.mjs writes <targetPath>.<pid>.<randomUUID>.tmp then renames, and its own comment records that the per-PID-random name exists precisely so a concurrent reader (this organ) cannot observe a torn file. Rename on one filesystem is atomic. Pinned with a test that a live sibling .tmp never leaks into a read, plus a NO-RETRY-ON-READ paragraph in read_heartbeat()'s docstring so nobody 'fixes' this into existence later."
  - objection: "CRITICAL — the watcher shares the probe's failure domain."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "DECLARED, not fixed — it was already declared in the brief before the refutation. Curing it means a second machine, which is an infrastructure decision outside this PR."
  - objection: "HIGH — persistent fire conditions would cause repeated production restarts; Telegram dedup does not deduplicate GitHub workflows."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "DECLARED, and escalated. It cannot bite today (dry-run only, no dispatch exists) but it makes a dispatch idempotency LATCH a PREREQUISITE for ever authorising real-fire. Written into the brief's risks so needs-ruling item 2 is asked with this attached rather than discovered afterwards."
  - objection: "HIGH — the dry-run materially understates repeated actuation."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "DECLARED — same root as the latch above and cured by the same future change."
  - objection: "MEDIUM — the 'full blast radius' is a stale hardcoded copy, not derived from a pinned workflow revision."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "DECLARED in the docstring and the brief. Deriving it would mean parsing the workflow at runtime; the honest interim is to say plainly that it is a transcription that can drift."
  - objection: "MEDIUM — the runtime kill switch is indefinite, with no expiry or notification."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "DECLARED. A forgotten VOA_DEADMAN_ENABLED=false leaves the funnel unguarded while reporting the state as intentional."
  - objection: "HIGH — absence fires immediately rather than after an observed silence window."
    seat: codex-gpt-5.6-sol
    status: PLAUSIBLE
    disposition: "DECLARED, not fixed — defensible as designed (an absent heartbeat means the probe never ran, which IS the condition), with the bootstrap-order caveat recorded."
  - objection: "MEDIUM — wrapper mktemp failure, and the plist's StandardOutPath requires ~/logs to pre-exist."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "DECLARED. Verified that ~/logs exists on Mini, so neither bites at this arming; both are fresh-host concerns."

