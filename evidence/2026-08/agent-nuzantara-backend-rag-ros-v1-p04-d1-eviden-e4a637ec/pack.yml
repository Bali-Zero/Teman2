dissent:
  - seat: "cross-family adversarial review (Kimi K3, independently reproduced by a Claude reviewer)"
    objection: >-
      9 findings against the original IntelEvent/Evidence/Claim/StoryCluster draft. HIGH:
      DurablePayloadReference.uri was an unconstrained string, so a data:/blob:/javascript: URI
      could pass as a "reference" while actually being the payload, inline. Also: the
      inline/reference sensitivity gate on IntelEvent.payload_ref was narrower than section 4's
      wire text; InlinePublicPayload.content_hash was decorative and unchecked;
      StoryClusterDecision.layers_run ordering over-specified one fixed total order across five
      layers where section 11 only requires deterministic-before-semantic; StoryCluster's
      independent_source_groups attestation counted a syndicated-only source group as
      corroboration (the exact mistake section 11's purpose clause names); invalid fixtures were
      not built mutate-then-hash, risking multi-cause fixtures.
    status: CONFIRMED
    note: >-
      All fixed in commit 4da3c6cb1 on this branch (verified: mypy --strict clean on 15 source
      files, 120 passed at that commit, checked-in schemas byte-identical to regeneration). One
      HIGH item (object_hash wire-parity) was out of this diff's scope and was cured separately
      in sibling PR #4615/#4635's freeze-change-proposal-001, not here.
  - seat: "follow-up adversarial finding on commit 4da3c6cb1's own StoryCluster docstring"
    objection: >-
      The attested_groups comprehension excludes only relationship=="syndicated" from
      independent corroboration; the members[].relationship enum has six values, so the other
      five (including translation/update) silently count as attestation with no stated
      rationale in the docstring, unlike the module's other three declared §11 gaps. A fixture
      (valid_with_extension.json) also smuggled a contested case (a source group attested only
      by a single "translation" member) as a side effect of an unrelated extensions fixture.
    status: CONFIRMED
    note: >-
      Fixed in commit 59cdb8b81: docstring now declares the exclusion scope explicitly and
      states translation/update are counted DELIBERATELY; the smuggled fixture was corrected to
      an uncontested case and a dedicated
      valid_translation_and_update_attestation.json fixture was added to state the permitted
      case as a deliberate assertion, not incidental coverage.
  - seat: "this session, independent re-verification of the merge (fresh context, not the PR's original author)"
    objection: >-
      A 3-way merge across three shared registration files (cli.py, models/__init__.py,
      schemas/__init__.py) that every P04-D1 sibling PR rewrites is exactly the shape where a
      union resolution silently drops one side's entries — the task brief itself named this as
      the risk to check for, not to trust.
    status: CONFIRMED
    note: >-
      Independently computed origin/main's registered-kind set (14) and this branch's merged set
      (18) from the actual __all__/SCHEMA_MODELS/CONTRACT_MODELS dict contents in all three
      files (not from diff hunks or visual inspection), cross-checked against the .py and
      .schema.json files that actually exist on disk. All three files agree exactly: 14 subset
      of 18, difference = this PR's own 4 kinds. No loss.
  - seat: "this session, independent gate re-run beyond what the receipts above required"
    objection: >-
      Commit 4908da40a's own message claims "ruff format --check 0" for this PR's original
      contents; that claim does not hold today under this PR's own declared canonical config
      (--config apps/backend-rag/pyproject.toml, per 59cdb8b81's own commit message) — 1 file
      genuinely needs reformatting.
    status: CONFIRMED
    note: >-
      Verified the drift is real (ruff format --diff on models/intel_event.py shows one line
      wanting to collapse) and that it predates this session (git diff against this branch's
      pre-merge tip is empty for that file — this session never touched it). NOT fixed: this
      session's mandate is the merge resolution plus the two evidence files only. Left as an
      open, honestly-reported gap rather than silently fixed outside scope or silently omitted.
