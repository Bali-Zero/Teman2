pii_note: |
  A CI lint over source-code text, its tests, and this evidence pack. No client data, no
  credentials, no PII anywhere in the diff.
dissent:
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane)"
    objection: |
      MEDIUM -- a nested function parameter or a `for` loop target rebinds a short alias name
      (`auto`, `state`) without the stale-reassignment guard recognizing it, so an unrelated later
      `if not auto:` inside a shadowing `def helper(auto):` or `for state in other_states:` gets
      blamed on the field. Reproduced: `(4, 'if not auto:', 'auto')` and `(3, 'if not state:',
      'state')`.
    disposition: |
      ACCEPTED and FIXED, reproduced first by this session before the fix and again after. Added
      `for_rebind`/`param_rebind` regexes: `for_rebind` requires the name in LOOP-TARGET position
      specifically (before `in`), verified NOT to break on `for x in auto:` (which READS the alias
      and must still track); `param_rebind` covers `def`/`function` parameter lists (JS/TS arrow-
      function params are a further, declared, undeclared-until-now gap -- out of this pass's
      modest scope, stated in the docstring).
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane)"
    objection: |
      MEDIUM -- type annotations are invisible to Shape C in BOTH directions. `auto: dict | None =
      pr.get("autoMergeRequest")` is not matched as an assignment (false negative, and this repo's
      own golden rule #5 mandates type hints); `auto: str = "unrelated"` is not recognized as a
      stale reassignment either (false positive, blames the alias past its own rebinding).
    disposition: |
      ACCEPTED and FIXED. Both the assign regex and the stale-reassignment regex now tolerate an
      optional `: <type>` between the name and `=`, sharing one `_OPTIONAL_ANNOTATION` fragment so
      the two can never drift apart again. Proved both directions: the annotated form is now
      caught, and an annotated reassignment now correctly stales the alias.
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane)"
    objection: |
      MEDIUM -- a column-0 comment between the assignment and its usage aborts the scan entirely:
      the dedent check fires on the comment line (which carries no real scope semantics), missing a
      genuine usage two lines later. Reproduced: returns None where it should flag.
    disposition: |
      ACCEPTED and FIXED. Blank and comment-only lines (`#`, `//`) are now fully transparent to the
      scan -- neither a dedent/rebind boundary nor a usage signal, which also incidentally answers
      this review's paired LOW (a comment merely DISCUSSING the null-check idiom near the alias was
      being read as a usage, an over-match in the same family Shape B's own `_COMPACT` filler
      already guards against for the literal-token case).
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane)"
    objection: |
      LOW -- this session's OWN docstring, written earlier in the same PR, claimed Shape C "matches
      the single-line alias idiom" in .github/workflows/merge-queue-watch.yml and
      scripts/lane_ship.sh but "clears via awareness markers". Measured false: `find_aliased_hit`
      returns None on both -- the only later use of the alias in each is a plain truthy check,
      never a null-comparison or negated-truthy test, so Shape C never matches either file at all.
      The outcome (clean) was right; the stated mechanism was fabricated.
    disposition: |
      ACCEPTED and FIXED, and re-verified independently by the build lane before being believed
      (this repo's anti-hallucination discipline does not exempt another seat's finding). The
      docstring now states the true mechanism, and both real-file tests in the pytest suite now
      assert `find_aliased_hit(...) is None` directly rather than only asserting the outcome.
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane)"
    objection: |
      LOW -- the dedent stop's rationale comment ("left the enclosing block") overclaims real
      Python scope semantics: leaving an `if` block does not unbind a name, so a realistic variant
      (assigned inside an `if`, checked after it in the same function) is missed, and the stated
      reason for the miss was not quite honest about why.
    disposition: |
      ACCEPTED and FIXED (docstring wording only -- the stop RULE itself was already correctly
      documented and is unchanged). Now states this is an indentation heuristic approximating scope,
      not real scope analysis, and names the missed variant explicitly as a known limitation rather
      than implying a modeled boundary.
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane)"
    objection: |
      LOW -- Shape C explicitly supports `const|let|var`, inviting JS/TS, where `=== null` /
      `!== null` is the canonical null idiom -- the alias null-check only accepted `==`/`!=`/`is`/
      `is not`, inherited from Shape A's operator set (Python has no `===`).
    disposition: |
      ACCEPTED and FIXED for the alias check specifically (Shape A/B's own operator set is
      untouched -- out of this rescue's scope, and already independently verified). Added `===`/
      `!==` to the alias null-check only, with a code comment explaining the deliberate asymmetry
      from Shape A/B.
  - status: CONFIRMED
    seat: "kimi-code/k3 (review lane)"
    objection: |
      LOW -- the alias negated-truthy check's `_COMPACT` filler lets a negated function CALL
      wrapping the alias match (`not is_valid(state)`), which is broader than a direct truthiness
      test on the name's own value.
    disposition: |
      ACCEPTED, NOT FIXED. This is the same design already accepted for Shape B's literal-token
      case (identical `_COMPACT` filler, same broadening) -- narrowing only the alias version would
      make the two shapes inconsistent for no principled reason, and risks reintroducing false
      negatives on the equivalent literal-token idiom this session was told not to re-litigate.
      Left as a stated, known broadening rather than silently accepted.
tests: |
  35 tests total in scripts/tests/test_lint_queue_field_verdict.py (19 original + 16 added this
  session: 8 for Shape C's first cut, 8 for the hardening round), plus the module's own
  --selftest (16 guilt+innocence cases, no pytest dependency) and a full live-tree scan at every
  stage of the change.
static: |
  python3 -m py_compile on both changed files, clean. No new lint config or CI step added by this
  session -- the workflow's own --selftest + full-scan step already runs both.
notes: |
  This is a rescue of an abandoned PR, not new work from scratch: the guard's core logic (Shape A/B,
  the allowlist tripwire, the workflow wiring) was already independently verified by the reader who
  handed this off, and is deliberately not re-reviewed or re-tested here beyond confirming it still
  passes unchanged. Everything in this pack's receipts/dissent is scoped to what this session
  actually added (Shape C) and the adversarial round it triggered on that addition alone.
