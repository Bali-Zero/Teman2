diff: |
  No file or line count is narrated here, deliberately, in prose or otherwise: CI recomputes it
  from the payload, and any number written by hand in this pack goes stale on the very next push --
  which is not hypothetical, it is exactly the trap that made this per-task pack necessary in the
  first place. The shared root evidence/pack.yml this branch fell back to belongs to an unrelated
  task and narrates stale diff-stat claims that do not match this PR's real diff at all -- the
  precise mismatch is what an independent reader flagged before this rescue began.

  BEHAVIOUR CHANGE: none outside CI. scripts/ci/lint_queue_field_verdict.py gains a third detection
  shape (an intermediate-variable alias, bounded single-hop tracking, not dataflow analysis) plus a
  same-session hardening round (type-annotated assignments in both directions, `for`/`def`
  rebinding, comment-line transparency, JS strict-equality, and two corrected docstring claims).
  scripts/tests/test_lint_queue_field_verdict.py gains matching guilt+innocence tests.
  .github/workflows/immune-enforcement.yml is untouched by this session -- its diff (case-list +
  executor-loop registration + an unconditional --selftest step) is the original PR's own change,
  already independently verified by the reader who handed off this rescue.
