plan_ref: |
  PR #5218 rescue mandate (conductor handoff, original author gone). The three things to fix, in
  priority order, per the independent reader's already-verified findings: (1) the guard misses its
  own motivating incident shape (an intermediate-variable alias, not a direct comparison) -- decide
  honestly between a bounded non-dataflow extension or an explicit "cannot verify" declaration, and
  prefer the extension if achievable in a modest amount of code with guilt+innocence fixtures; (2)
  it is a GitHub draft; (3) it has no evidence pack of its own.
