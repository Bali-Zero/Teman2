risks:
  - 'Shape C is deliberately bounded and will still miss a multi-line assignment (the literal
    `autoMergeRequest` token must appear on the SAME line as `name =`), a second-hop alias
    (`x = auto` then `x is None`), a container/attribute assignment target (`d["auto"] = ...`,
    `self.auto = ...`), and a JS/TS arrow-function parameter shadow (`(auto) => ...` is not
    recognized as a rebinding, only `def`/`function` parameter lists are). Each is stated in the
    module docstring as a declared scope boundary, not a silent gap.'
  - "The dedent-based block boundary is an indentation heuristic, not real Python scope analysis:
    a variable assigned inside an `if` and read after it in the same function (still in scope in
    real Python) is treated as having left the block and is missed. Corrected in the docstring
    wording after the cross-family review flagged the original parenthetical ('left the enclosing
    block') as overclaiming scope semantics the heuristic does not have."
  - "The alias negated-truthy check can still match a negated function call wrapping the alias
    (`not is_valid(state)`), which is broader than a direct truthiness test — this is the same
    design already accepted for Shape B's literal-token case (`_COMPACT` filler), not a new
    broadening introduced by Shape C, and was left as-is rather than narrowed, to avoid
    reintroducing false negatives on the equivalent literal-token idiom."
