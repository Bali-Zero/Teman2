objective: |
  Research OS v1.0.0 Wave 0, Work Packet 04, deliverable D3 (legacy-to-canonical adapters, no
  silent field dropping): SLICE 2 of 3 of the Magazine `ops_intents`/`ops_receipts` "action
  chain" adapter subsystem under `apps/backend-rag/backend/services/research_os/`.

  Slice 1 (shared infrastructure + `ActionItem` adapter, PR #4749, corrected in PR #4758) is
  already merged on `origin/main`. This PR ships the second canonical kind:
  `ops_intents` row -> canonical `ActionIntent` (CONTRACTS.md §13.2).

  DESIGN DECISION (structural, not a convenience): this adapter COMPOSES the already-merged
  `action_item_adapter.adapt_ops_intent_to_action_item` on the same row rather than
  re-deriving the paired `ActionItem` independently. `action_intent.py`'s own
  `verify_action_intent_matches_action_item` requires `action_item_ref` to pin the exact
  `ActionItem.object_hash`, and `requested_action_spec_ref`/`risk_class`/`sensitivity` to be
  byte-identical across both objects -- composing the sibling adapter is the only way to
  satisfy that without either duplicating its logic (drift risk) or leaving `action_item_ref`
  as yet another synthesized-unbacked placeholder when the referenced object in fact exists.

  SCOPE FINDING (re-verified against the CORRECTED D3 matrix, now merged on `origin/main` as
  PR #4756 -- not the stale FROZEN version this deliverable started from): §1.1's own table
  grades `action_intent_id`, `action_item_ref`, `target{system,object_ref,surface}`,
  `input_revision_hash`, and `authority_required{scope,expires_after_seconds}` all
  🔴 "unmappable as-is -- needs a ruling", a materially harder field mix than slice 1's
  `ActionItem` faced. Of these: `action_intent_id`/`action_item_ref` are resolved by this
  adapter's own composition argument above (disclosed, not treated as matrix-endorsed);
  `target`/`input_revision_hash`/`authority_required.scope`/`.expires_after_seconds` remain
  genuinely open and are disclosed via BOTH a loss-report warning (prose) AND a
  machine-checkable `pending_ruling` marker in the object's own
  `extensions['com.balizero.research-os-adapters'].payload['pending_ruling']` -- the exact
  two-channel discipline PR #4758 established for slice 1's own open rulings, applied here
  from the start rather than retrofitted after a REFUSE verdict.

  A pre-existing draft of this adapter (stacked branch
  `ros-v1-p04-d3-adapters-2-action-intent`, written before the matrix correction landed) was
  read as a REFERENCE ONLY and discarded rather than reused: it silently resolved several of
  these same 🔴 rows as ordinary 🟢/🟡 mapped/approximated fates in its own loss-report field
  list, without the pending_ruling disclosure -- exactly the "matrix as approval" defect
  PR #4758 fixed on the sibling `ActionItem` adapter. This PR is a from-scratch rewrite
  against the corrected matrix, not that draft with patches applied.
