risks:
  - "target{system,object_ref,surface} and authority_required.scope/.expires_after_seconds are
    disclosed placeholders for fields the corrected matrix flags as having NO usable legacy
    analogue at all -- unlike slice 1's placeholders (which reused a real, if mis-slotted,
    legacy value), target's object_ref.object_id/object_hash and authority_required.scope
    resolve to nothing Magazine's own system would recognize. See the Kimi K3 adversarial
    review below for whether this crosses from 'disclosed gap' into 'actively misleading'."
  - "request_hash is reused across THREE canonical slots (arguments_hash, input_revision_hash,
    lineage.input_hashes) -- the matrix's own words call this an open ruling on which ONE slot
    the value actually satisfies; populating all three is this adapter's own placeholder
    pending that ruling, not a settled 1:many mapping."
  - "Composing action_item_adapter from within this adapter creates a real (if currently
    one-directional) coupling between the two sibling adapters: a future change to
    ActionItem's own construction logic silently changes what this adapter's action_item_ref/
    requested_action_spec_ref/risk_class/sensitivity carry, without this file's own diff
    showing it. No test currently pins that coupling explicitly beyond re-running both
    adapters together."
