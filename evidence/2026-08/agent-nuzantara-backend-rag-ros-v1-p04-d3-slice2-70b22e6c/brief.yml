    PR stays with auto-merge NOT armed until the conductor signals the queue is clear."
acceptance:
  - "Every one of ops_intents' 27 legacy columns has an entry in the adapter's loss report with
    a fate in {mapped, approximated, synthesized_unbacked, omitted, rejected} and a reason --
    enforced by assert_every_legacy_field_accounted_for, called both inside the adapter and
    independently from the test suite."
  - "A row the sibling ActionItem adapter rejects (unrecognized status, clock skew) is ALSO
    rejected here, via delegation rather than a duplicated check -- verified by
    test_unrecognized_status_is_rejected_with_full_field_ledger and
    test_clock_skew_row_is_rejected_not_silently_coerced."
  - "The package's OWN cross-object invariant function, action_intent.verify_action_intent_matches_action_item,
    is called directly against a real (item, intent) pair produced by the two sibling adapters
    on the same row and raises nothing -- not a hand-rolled assertion about what SHOULD hold,
    the actual invariant the frozen contract enforces."
  - "pending_ruling and unbacked_refs are disclosed twice: in loss_report.warnings (prose) AND
    in extensions['com.balizero.research-os-adapters'].payload (machine-checkable) -- from the
    first version of this adapter, not retrofitted after review."
  - "PYTHONPATH=. pytest backend/tests/services/research_os/ backend/tests/unit/research_os/ -q
    exits 0 in full (this PR's 13 new tests + the 24 pre-existing tests in the same
    directories, none regressed)."
