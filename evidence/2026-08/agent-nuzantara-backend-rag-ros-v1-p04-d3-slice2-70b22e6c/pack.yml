runtime_proof:
  - >-
    No live consumer, by design (zero non-test consumers repo-wide, receipt above). Functional
    proof is the adapter's own round-trip: a synthetic ops_intents row -> ActionIntent with
    target/authority_required correctly derived or honestly placeholder'd, arguments_hash a
    real recomputable content hash, and the package's own verify_action_intent_matches_action_item
    invariant function raising nothing when run directly against this adapter's output paired
    with the sibling ActionItem adapter's output on the identical row -- not a hand-rolled
    assertion about what "should" hold.
dissent:
  - seat: "kimi-code/k3"
    objection: "Q1 -- composition of action_item_adapter makes
      verify_action_intent_matches_action_item's cross-object invariant tautological for this
      source (a bug in the sibling propagates to both objects and still verifies), leaks the
      sibling's queue-side admissibility policy (the Sla clock check) into ActionIntent's own
      validity, and inherited risk_class/sensitivity placeholders were disclosed only in prose,
      not in pending_ruling's machine-checkable channel."
    status: CONFIRMED
    # Outcome: partially fixed. risk_class/sensitivity ARE now in pending_ruling (a real code
    # change, applied to both this adapter and the sibling slice-3a adapter proactively). The
    # tautological-invariant and admissibility-policy-leak observations were left as disclosed
    # residual risks (see residual_risks below), not code-fixed: the alternative (independent
    # re-derivation) reintroduces the exact drift risk composition was chosen to avoid. The
    # docstring's overstated "only way" claim was corrected to name the honest alternative.
  - seat: "kimi-code/k3"
    objection:
      "Q2 -- arguments_hash reused row['request_hash'] verbatim, but request_hash
      hashes the WHOLE request envelope (schema_version+intent_kind+reason_code+expires_at+
      params), not the arguments alone; syntactically valid sha256 but can never verify
      against a consumer's own recompute -- a materially worse lie than a marked placeholder."
    status: CONFIRMED
    # Outcome: FIXED. arguments_hash now = legacy_content_hash(params_json), a real,
    # recomputable content hash of the actual arguments. input_revision_hash stays a disclosed
    # placeholder (still reuses request_hash -- genuinely unresolved, its "revision" changes
    # when only expires_at changes with no input change).
  - seat: "kimi-code/k3"
    objection:
      "Q3 -- target's docstring premise ('no usable legacy analogue... out of this
      adapter's scope') was FALSE: Magazine's own targetId()/targetKey() is a 6-line, 4-branch
      pure function over params_json, already-available data, and the old placeholder broke
      Magazine's own target-key co-reference (its concurrency model IS target-key fencing).
      Also: object_ref.object_kind asserted intent_kind (the ACTION type) as if it were the
      TARGET's kind -- a false statement, not a disclosed gap."
    status: CONFIRMED
    # Outcome: FIXED. Ported _derive_target(), deriving the real target kind+id from
    # params_json per intent_kind, matching Magazine's own logic exactly. object_kind now
    # derives from the same port, no longer asserting the action type as the target's kind.
    # Falls back to the old intent-scoped placeholder only defensively (params_json
    # unparseable or missing the expected key) -- tested for all 5 intent_kind values plus
    # both fallback paths. target stays in pending_ruling on a narrower basis now (object_hash
    # remains a synthesized-unbacked hash, since no real canonical Target object exists to
    # hash), not because the kind/id are fabricated anymore.
  - seat: "kimi-code/k3"
    objection:
      "Q4 -- the max(1, ...) clamp on authority_required.expires_after_seconds was a
      latent fabrication path: unreachable today only because the sibling ActionItem adapter
      rejects expires_at<=created_at first; if that assumption is ever revisited, the clamp
      would silently manufacture a 1-second grant instead of failing."
    status: CONFIRMED
    # Outcome: FIXED. Clamp removed. The field's own gt=0 Pydantic validator now rejects
    # honestly if that assumption is ever violated, rather than silently fabricating a
    # 1-second window. Kimi separately assessed this field's core design (reusing a real 24h
    # operator-authorization-window delta as a per-grant expiry) as "the least unsound of the
    # four" -- disclosed and left as a genuine open placeholder in pending_ruling, not further
    # changed.
