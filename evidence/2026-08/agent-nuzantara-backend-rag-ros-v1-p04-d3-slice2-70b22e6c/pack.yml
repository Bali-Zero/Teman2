diff:
  net_lines: >-
    Two commits on this branch, measured against this branch's own merge-base with
    origin/main (17f2457bc0ca4115f9e0e73594ea7b0237ebc953, re-fetched fresh this session):
    +793/-0 total across 4 files. action_intent_adapter.py (+546 lines total, includes both
    the original construction and the Kimi-driven corrections), test_action_intent_adapter.py
    (+243 lines, 17 tests), PENDING-ARMS.md (+4/-0, two new ledger rows -- the original
    five-field pending_ruling disclosure row plus the separately-corrected ExecutionAttempt
    -exclusion row), brief.yml (+119, evidence pack). No existing file touched.
  behaviour_change: >-
    This is a NEW adapter (no prior behaviour to change) with one internal correction cycle
    before merge: the first commit (4419e3064) shipped arguments_hash=row["request_hash"] and
    target=ExactObjectRef(object_kind=intent_kind, object_id=f"unbacked:{intent_id}", ...); the
    second commit (bffc1045f) replaced both after a Kimi K3 adversarial review found the first
    was a real-looking-but-unverifiable hash (worse than a marked placeholder) and the second
    rested on a false premise ("no usable legacy analogue" when a 6-line port of Magazine's own
    targetId()/targetKey() exists). Both are now: arguments_hash =
    legacy_content_hash(params_json), a real recomputable content hash; target derives its real
    kind+id from params_json via a ported _derive_target() function, falling back to the old
    placeholder only when params_json is unparseable or lacks the expected key (defensively
    tested, not expected to trigger for any row that passed the sibling adapter's own
    validation).
