residual_risks:
  - >-
    Two fields remain genuinely open placeholders after the Kimi-driven corrections:
    authority_required.scope (no legacy source of any kind) and input_revision_hash (reuses
    request_hash, semantically shifts when expires_at changes with no input change). Both
    disclosed via pending_ruling, business/architecture ruling owned by Zero via team-lead, not
    resolved by this PR.
  - >-
    risk_class/sensitivity are inherited placeholders from the composed sibling ActionItem
    (defaults green/internal) -- now disclosed in pending_ruling per this session's own finding,
    but the UNDERLYING placeholder value itself is not resolved by this PR; it is the sibling
    ActionItem's own open ruling (already ledgered) that would resolve it.
  - >-
    The composition coupling with action_item_adapter (Q1 above) is a real, if currently
    one-directional, architectural dependency: a future change to the sibling's construction
    logic silently changes what this adapter's action_item_ref/requested_action_spec_ref/
    risk_class/sensitivity carry, without this file's own diff showing it. Not fixed in this
    PR -- disclosed as a residual risk, same as the sibling slice-3a adapter's identical
    coupling.
