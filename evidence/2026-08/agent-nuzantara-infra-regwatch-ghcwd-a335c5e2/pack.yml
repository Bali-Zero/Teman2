dissent:
  - seat: agy (Gemini 3.1 Pro, cross-family, non-Anthropic)
    objection: >-
      Dispatched on the FIRST commit (339fcb428) only, asked five specific
      questions: does --repo actually solve real-launchd resolution; is the
      heartbeat rc-capture correct zsh (quoting, EXIT-trap ordering,
      possible clobber of _PROMOTE_RC); any risk from the hardcoded repo-slug
      default; does find_unguarded_gh_calls have a constructible
      false-positive or false-negative; anything else wrong or overstated.
      Verdict returned: "VERDICT: CONFIRMED SAFE" on the core fix (--repo
      resolution: "No failure mode identified"; heartbeat rc-capture:
      "Correct" -- walked the EXIT trap / organism_hb_finalize logic itself
      and confirmed a status already set to "error" survives finalize()
      unchanged; default slug: "Negligible risk"). BUT it constructed two
      concrete counter-examples against the checker itself: (1) a `gh` call
      inside a `$(...)` nested inside a double-quoted string
      (`summary="$(gh pr create --head feat)"`) was invisible to
      find_unguarded_gh_calls -- a false negative; (2) an unrelated nested
      subshell before a gh call inside the same cd-guard
      (`(cd "$_wt" && (echo init) && gh pr view 123)`) made the old
      last-open-paren heuristic conclude the guard had already closed -- a
      false positive. Two minor additional observations: PR-number
      extraction assumes `gh pr create`'s stdout is exactly the URL (already
      handled gracefully downstream, pre-existing code, not introduced by
      this diff); the test file needs the repo's venv pytest, not system
      Python (expected, matches CLAUDE.md golden rule #1).
    status: CONFIRMED
    resolution: >-
      Both counter-examples ACCEPTED and CURED before the second commit,
      not merely noted: find_unguarded_gh_calls now tracks a `cmdsub`
      lexical frame so a $(...) nested inside a double-quoted string is
      correctly treated as live code, and _in_cd_subshell now walks a
      proper paren stack (innermost STILL-OPEN paren) instead of
      "last '(' with no ')' after it". The cmdsub fix introduced a new risk
      of its own, found and cured in the SAME round before shipping: this
      file's real commit-message heredoc contains a literal apostrophe in
      its body ("checkout's"), which a naive "cmdsub content is just code"
      treatment would misread as opening a stray single-quote -- heredocs
      are now detected explicitly and their bodies treated as fully opaque.
      Three new regression tests pin both fixes plus the heredoc-safety
      correction (test_guilt_gh_inside_cmdsub_inside_dquote_is_flagged,
      test_innocence_nested_subshell_before_gh_still_passes,
      test_heredoc_with_apostrophe_in_body_does_not_corrupt_the_scan), all
      passing (receipt above, 13/13). The two minor observations required
      no code change (pre-existing/expected behavior) and are recorded
      here, not silently dropped.

  - seat: spalla-review/sonnet-5 (second independent pass, same-family but
      dispatched fresh with no access to the build lane's reasoning beyond
      the diff itself)
    objection: >-
      Dispatched on the full diff (both commits at the time: 339fcb428,
      2c245ac2f), asked the same five questions as the agy round plus a
      request for a counter-example DIFFERENT from agy's two. Own verdict
      label: "CONCERNS, not a code-correctness problem -- everything in the
      diff itself is sound and well-tested". Five findings: (1) the --repo
      cure is correct AS CODE, but the live cron on Pro executes a SEPARATE
      $HOME-fork copy (/Users/nuzantara/scripts/regulatory-watcher-run.sh,
      declared pair infra/home-fork/declared-pairs.json, machines pro+m5)
      that stays on the pre-fix version until refreshed post-merge --
      `lint_home_fork.py --check` reports the pair clean today only because
      it still compares against origin/main's pre-fix content, flipping to
      DIVERGED the instant this PR merges; this is the single most
      important finding. (2) heartbeat rc-capture is correct for the two
      cases it handles (traced organism_hb_finalize's status=="starting"
      guard by hand, confirmed no silent overwrite), but `gh pr merge
      --auto` failing (line ~392) is PRE-EXISTING WARN-only/return-0 code
      this diff does not touch -- an opened-but-unarmed PR would not
      surface on the heartbeat, making the "cures the silence" framing
      slightly broader than what is actually delivered. (3) no risk found
      in the hardcoded REGWATCH_GH_REPO default. (4) four NEW checker
      counter-examples, two found independently (backtick cmdsub nested in
      a dquoted string -- false negative; a `case` statement pattern-arm's
      `)` inside a `(cd && ...)` guard confusing the paren-stack heuristic
      -- false positive) and two cross-checked from an ad hoc manual codex
      dispatch after finding codex-spalla.sh's --full-auto broken on this
      machine's codex-cli 0.149.1 (`--repo` appearing as a redirect-target
      filename rather than a real flag -- false negative; two heredocs
      opened on one physical line, only the first body correctly blanked
      -- false positive); none of the four exist in any real file in
      infra/launchagents/wrappers/ today (verified: no case statements
      anywhere, backticks only inside comments, one isolated heredoc). (5)
      scope/consistency across commits: clean, no dead code, no debug
      artifacts, _PRE_FIX_SHA verified accurate.
    status: CONFIRMED
    resolution: >-
      Findings (1) and (2) were NOT code-fixed in this diff -- both are
      pre-existing/inherited (the HOME-fork copy predates this PR; the
      auto-merge-arm WARN/return-0 path predates this PR too) and cicatrix-
      superscar family #9 plus this repo's own "cure what the diff
      introduces, spec what it inherits" discipline argue against a
      fix-of-a-fix expanding this PR's blast radius. Both are instead
      documented precisely: brief.yml risks now name the exact
      lint_home_fork.py DIVERGED-flip mechanism for (1) and scope the
      "cures the silence" claim exactly to the failure paths this diff
      actually captures for (2), so neither is silently left implicit or
      overclaimed. Of the four counter-examples in (4): the backtick gap
      was FIXED (mirrors agy's $(...) fix, same "recognize live code inside
      a dquoted string" strategy, new guilt test
      test_guilt_gh_inside_backtick_inside_dquote_is_flagged, passing). The
      other three (case-statement, argv-blind --repo, multi-heredoc) are
      deliberately NOT fixed -- named explicitly in-code (bottom of
      scripts/tests/test_regulatory_watcher_gh_context.py) and in this
      pack's residual_risks, since none is exercised by any real file today
      and each would meaningfully deepen an already hand-rolled lexer.
      Finding (5) required no change. One thing this round's own
      dispatch surfaced independently of its review content: while
      re-verifying the teammate's directory-wide scope request (a
      DIFFERENT ask from this dissent), the directory-wide scan found a
      REAL false-positive (`command -v gh` presence checks in two actual
      files) -- fixed the same round, receipt above.

