    cmd: "python3 infra/claude-hooks/test_lane_check.py -v"
    result: "16/16. Guilt on fail/tautology/||-tail/malformed/timeout; innocence on absent/escape/pass/out-of-scope/entity-wise-tautology/quoted-separator; under-match on unknown AND empty change sets; security on an untrusted origin."
    exit: 0
    ts: "2026-08-31T06:20Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
  - claim: "ARMED — the decision reaches a real stop boundary, not merely an import"
    cmd: "python3 infra/claude-hooks/test_lane_check_wiring.py"
    result: "11/11 by driving subagent_stop_verify.py as a subprocess with a real SubagentStop payload and reading the exit code the harness reads. Includes the untracked-directory scope case and the two-marker case."
    exit: 0
    ts: "2026-08-31T06:20Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
  - claim: "Eleven mutants, each ASSERTED to have applied before its verdict was read"
    cmd: "mutate, run both corpora, revert"
    result: >-
      Killed 10: blocks() failing open; tautology becoming a substring match; an
      unknown change set read as out-of-scope; the hook dropping changed_paths;
      the hook never calling lane_check; an empty change set read as
      out-of-scope; the ||-tail rule removed; the trusted-origin gate removed;
      the change set computed eagerly again; -uall dropped; markers shared again.
      SURVIVED 1, declared not hidden: making the separator split quote-blind.
      It is an EQUIVALENT mutant — a mangled fragment keeps its closing quote
      (`true"`), which is never the exact token the tautology set holds, so
      quote-blindness cannot fabricate a false verdict. Written into the
      function's own docstring as correct-and-unproven rather than papered over
      with a contrived test. TWO of the eleven were no-ops on the first attempt
      and were re-written after the assert caught them: a mutant that does not
      apply proves nothing, and would have been read as a corpus gap.
    exit: 0
    ts: "2026-08-31T06:25Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
  - claim: "Two of the refuter's claims MEASURED before curing, rather than accepted"
    cmd: "build a throwaway repo with an untracked directory and a path containing a space; run git status --porcelain with and without -uall -z"
    result: >-
      default -> '?? \"has space.txt\"\\n?? newdir/\\n' — both defects reproduce
