# STAGING LAYOUT, not this directory's. harness-floor.yml stages both files as
# evidence/{pack,brief}.yml; the lint resolves brief_ref against --repo-root and
# council_run against the pack's own dir. Locally the verdict inverts. CI decides.
council_run: council.jsonl
brief_ref: evidence/brief.yml
pii_scan: clean
lanes:
  - lane: implementer
    role: build
    role_note: "authored lane_check.py in full from a rule-by-rule contract"
    seat: "kimi-code/kimi-for-coding"
  - lane: orchestrator
    role: review
    role_note: "ground (the four termination surfaces, which of them exist in repo), the spec, the two corpora, the wiring, the CI executors, the final on-disk gate, and eleven mutants"
    seat: "claude-opus-5 (xhigh)"
  - lane: refuter
    role: review
    role_note: "blind cross-family refutation — 10 findings, 6 real and all 6 cured, 2 minors accepted"
    seat: "agy-gemini-3.1-pro"
seat_diversity: 3
seat_diversity_note: >-
  Three families, build lane non-Anthropic (Moonshot) — D3 by a real build lane,
  never seat_override. The refuter is a third family (Google) because Kimi built
  this; Codex sol, the natural second reviewer, is out of credits.
diff:
  net_lines: >-
    AS OF the commit this pack ships with: 8 files, +1694/-9, net 1685 —
    THREE-DOT against the merge base, never two-dot (W102). Gear floor
    recomputed = 3 (hot-zone: .github/workflows/); declared Gear 3, at the
    floor. WELL OVER the ~400 target; see the size objection in dissent, where
    the composition and the reason splitting was rejected are stated in full
    rather than left for a reviewer to reconstruct.
  behaviour_change: >-
    A worktree with no `.lane-check.json` behaves exactly as before — asserted by
    a side-effect probe AND by a callable that records whether the change set was
    computed, because the first wiring silently broke that promise. A worktree
    WITH one gains a block at the SubagentStop boundary when the declared check
    fails, is unusable, or cannot run. The pre-existing dirty-worktree block is
    unchanged and now has its own anti-loop marker, so the new reason cannot
    consume its shot. `.github/workflows/guard-conformance.yml` gains two
    executor steps inside its existing relevance gate.
receipts:
