notes:
  - "SPEC DELTA (declared): L01/PR-1's stated innocence fixture — 'the live visa-retention-scope pack's acceptance shape must stay silent' — is unsatisfiable alongside its own Build text once the shape is measured (that pack's 5 bullets are bare strings, 0 probes). A rule honouring the fixture would fire only on mapping bullets, of which zero exist: a guard that cannot fire, superscar #2. The Build text governs; innocence is re-derived as a probe-covered pack, a Gear-1 pack, and a pack with no acceptance block. Recorded in SQUAD-LEDGER.md for the lane-spec correction PR."
  - "Rule 12 has NO phased flip date, deliberately unlike rules 8-10. Flipping NOTICE to FAIL is explicitly out of scope for this lane; it requires a CI step that actually executes the probe, tracked as ASSEMBLY-LINE.md enforcement-backlog item 8."
  - "Diff is 598 net lines against the contract's ~400 target. It is one concern (rule 12) and splitting it would ship the linter apart from the corpus that proves it. 350 of the 598 are in the linter, and the house style there is heavily documented — the executable body of the new rule is roughly a third of that."
