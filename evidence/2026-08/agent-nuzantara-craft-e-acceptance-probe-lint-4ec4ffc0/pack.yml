dissent:
  - seat: kimi-k3
    objection: "N2 bound a declared probe by bare substring, so probe 'ls' counted as bound by a receipt reading 'run the tools suite' — the under-match direction of superscar #3: the notice that should have fired stayed silent."
    status: CONFIRMED
  - seat: kimi-k3
    objection: "_acceptance_examples interpolated bullet text raw, so a bullet carrying a newline or a double quote (both routine in YAML block scalars) made one NOTICE span several stderr lines with unclosed delimiters — a grep-hostile message."
    status: CONFIRMED
  - seat: kimi-k3
    objection: "pack.get('receipts') raised AttributeError when pack was not a mapping; a NOTICE-only rule must never be able to fail a run."
    status: CONFIRMED
  - seat: kimi-k3
    objection: "Two bullets naming the SAME probe were counted twice, so the notice overstated the gap ('2 declared probe(s)' for one string)."
    status: CONFIRMED
  - seat: kimi-k3
    objection: "The \b in _EARS_KEYWORD_RE treats '-' as a boundary, so 'PRE-SHALL review' passes the EARS check; use (?<![A-Za-z])...(?![A-Za-z]) instead."
    status: RETRACTED
  - seat: kimi-k3
    objection: "Receipt entries that are plain strings are skipped, so a pack whose receipts are a list of strings would have every probe flagged unbound — a false positive."
    status: RETRACTED
  - seat: kimi-k3
    objection: "N1 counts legacy string bullets as uncovered, so any pack with legacy bullets emits guaranteed, unfixable noise; restrict N1 to mapping bullets."
    status: RETRACTED
