      (6 original, 8 round-1 grader, 4 round-2 gate, 4 round-3 gates), plus parser and
      canonicalisation tests.
    cmd: >-
      python3 -m pytest scripts/tests/test_tailnet_acl_deny_by_default.py -q
    result: "27 passed in 0.10s"
    exit: 0
    ts: 2026-08-29T03:10Z
    seat: session (build lane)

  - claim: >-
      The guard actually FAILS when the real policy is widened — not merely passes as shipped.
      Two independent mutations were applied to infra/tailscale/policy.hujson and reverted from
      a /tmp copy: (A) mini's dst widened from pro:22 to pro:1-65535, the range that hides the
      shell port without containing the string "pro:443"; (B) pro:443 quietly appended to mini's
      dst list. Both turned test_real_policy_is_deny_by_default_and_names_the_shell red.
    cmd: >-
      cp policy.hujson /tmp/backup; python3 -c "<replace dst>"; python3 -m pytest
      scripts/tests/test_tailnet_acl_deny_by_default.py -q; cp /tmp/backup policy.hujson
    result: >-
      A -> "assert ['OVERBROAD_DST_PORT_RANGE', 'SHELL_PORT_SRC_NOT_ALLOWLISTED'] == []";
      B -> "assert ['SHELL_PORT_SRC_NOT_ALLOWLISTED'] == []"; restored -> 19 passed
    exit: 1
    ts: 2026-08-29T03:32Z
    seat: session (build lane)

  - claim: >-
      Run against the PREVIOUS on-disk draft of this same policy — the one that granted
      `antonellosiano@gmail.com -> antonellosiano@gmail.com:*` — the guard reports the exact
      defect this PR removes. The guard catches a real historical widening, not only a fixture.
    cmd: >-
      cp policy.hujson /tmp/p.bak; <restore HEAD's older draft into a scratch copy>;
      python3 -m pytest scripts/tests/test_tailnet_acl_deny_by_default.py -q
    result: "assert ['WILDCARD_DST_PORT'] == [] — 1 failed, 8 passed"
    exit: 1
    ts: 2026-08-29T02:41Z
    seat: session (build lane)

  - claim: >-
      Both watcher-coverage violations reported by the `check` job are cleared: the new
      check-tailnet-acl workflow and the pre-existing, inherited check-skills-canonical (landed
      unwatched with PR #5041) are both registered in main-push-failure-watch.yml.
    cmd: python3 scripts/check_watcher_coverage.py
    result: "watcher-coverage: all 105 live workflow(s) covered by main-push-failure-watch.yml"
    exit: 0
    ts: 2026-08-29T03:05Z
    seat: session (build lane)

  - claim: >-
      Both touched workflow files are actionlint-clean.
    cmd: >-
      actionlint .github/workflows/check-tailnet-acl.yml
      .github/workflows/main-push-failure-watch.yml
    result: "no findings (exit 0)"
    exit: 0
    ts: 2026-08-29T03:06Z
    seat: session (build lane)

  - claim: >-
      The deterministic gear floor for this diff is 3, sourced from PATH (.github/workflows/**
      is hot-zone), not from size — so this pack is required regardless of the diff's length.
    cmd: >-
      python3 -c "import evidence_pack_lint as m; m.compute_floor(<changed files>,
