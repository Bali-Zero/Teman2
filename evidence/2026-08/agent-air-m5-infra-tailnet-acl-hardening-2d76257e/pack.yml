brief_ref: evidence/brief.yml
plan_ref: >-
  PR #5192 (agent/air-m5/infra/tailnet-acl-hardening -> main) — deny-by-default Tailscale ACL,
  apply runbook, and CI guard, on the orchestrator's tailnet-security mandate. Anchors:
  infra/tailscale/README.md (the 2026-08-11 live measurement), research/operations/
  2026-08-11-apple-vision-pro-tailnet-leverage.md (the vision-deck consumers), and the two
  PENDING-ARMS rows opened 2026-08-11 for the ttyd exposure and the blocked team enrollment.

lanes:
  - lane: tailnet-acl-build
    role: build
    seat: claude (this session — M5 interactive, sole build lane)
  - lane: tailnet-acl-refuter-r1
    role: review
    seat:
      codex gpt-5.6-sol xhigh (OpenAI, non-Anthropic) — round-1 grader, REJECT with
      executed bypasses against the guard; never the build seat
  - lane: tailnet-acl-gate-r3
    role: review
    seat:
      claude opus 5 (SECOND independent gate seat, fresh context — never the build
      seat) round-3 adjudication; 12 self-authored mutations, 7 missed, REWORK-BUILD
  - lane: tailnet-acl-gate-r2
    role: review
    seat:
      claude opus 5 (independent gate seat, fresh context — never the build seat)
      round-2 Gear-3 adjudication, REWORK-BUILD with three executed destination-axis
      bypasses; re-adjudicated after the fix
  - lane: tailnet-acl-dependency-audit
    role: read
    seat:
      claude sonnet 5 subagent (fresh context, repo-only read) — enumerated the fleet's
      real cross-machine flows so the matrix is evidence-backed rather than guessed

diff:
  files: 33
  net_lines: 1653
  measured_at: d88ffb1f55
  note: >-
    git diff --no-renames --numstat $(git merge-base origin/main HEAD)..HEAD. The hand-authored
    surface is the ACL, the guard, the runbook and 22 guilt fixtures; there is no generated
    artifact in this diff. Larger than the ~400-line target and declared as such in the PR body:
    the shape is policy-as-code plus its runbook plus its guard plus the fixture corpus that
    proves the guard fails, and the policy's comments ARE the artifact — the SHELL-ROUTE block
    exists so the next reader cannot mistake pro:443 for an ordinary port.

pii_scan: clean

receipts:
