      before: ssh wildcards and users:* both returned []; after: SSH_SRC/DST_NOT_ALLOWLISTED,
      SSH_USERS_NOT_ALLOWLISTED, SSH_ROOT_GRANT, UNRESOLVABLE_SRC_SELECTOR, SHELL_HOST_IP_MOVED
      — baseline still []
    exit: 0
    ts: 2026-08-29T05:20Z
    seat: session (build lane, verifying both gates' reports independently)

dissent:
  - seat: codex gpt-5.6-sol xhigh (round-1 grader)
    objection: >-
      Finding 3 (MEDIUM) — every ACL rule omitted `proto`, so each granted UDP alongside the TCP
      service it named, plus ICMP for the pair; "Only SSH" and "port 443 only" were therefore
      overstated.
    status: CONFIRMED
    resolution: >-
      FIXED. `"proto": "tcp"` added to all seven ACL rules (not to the ssh block, where it is
      not a field). Consequence declared rather than hidden: plain `ping` between fleet nodes
      now fails, while `tailscale ping` — the probe fleet_watch.py actually uses — is a disco
      probe and unaffected. Recorded in the apply runbook and the enrollment runbook.
  - seat: codex gpt-5.6-sol xhigh (round-1 grader)
    objection: >-
      Finding 5 (MEDIUM) — the workflow header claimed a regression would "fail the build",
      but the check is non-required, so a red does not block a merge. The same overstatement
      appeared in policy.hujson.
    status: CONFIRMED
    resolution: >-
      FIXED as a wording correction, not by making the check required. Promoting a check to
      required is a branch-protection change and therefore operator-only; both files now say
      "goes RED on the PR" and name the non-required status explicitly.
  - seat: codex gpt-5.6-sol xhigh (round-1 grader)
    objection: >-
      Finding 6 (MEDIUM) — the runbook's guilt test accepted curl exit 7 / HTTP 000 as proof the
      packet filter dropped the connection, but exit 7 also means the service is down, so a
      broken endpoint would read as a passing security test.
    status: CONFIRMED
    resolution: >-
      FIXED. The runbook now requires a POSITIVE CONTROL first (from M5, which the policy
      allows, expecting 200) before the negative test from Mini, and it distinguishes a timeout
      (exit 28, the packet-filter signature) from exit 7, which is explicitly called out as NOT
      a clean pass.
  - seat: session (build lane, self-audit after the grader round)
    objection: >-
      The grader's HIGH finding 2 was fixed only halfway. Requiring the shell-port source to be
      a NAMED NODE still allowed any fleet node — a mutation re-pointing `mini` at
      `pro:1-65535` stayed GREEN, handing the least-attended machine a writable shell.
    status: CONFIRMED
    resolution: >-
      FIXED, and this is why the mutation receipt above exists: the guard now enforces an
      explicit allowlist (SHELL_PORT_ALLOWED_SOURCES) plus an OVERBROAD_DST_PORT_RANGE ceiling.
      Both mutations now go red. Found by running the mutation rather than by reading the fix —
      the grader's finding was correct and the first correction to it was not sufficient.
  - seat: codex gpt-5.6-sol xhigh (round-1 grader)
    objection: >-
      Finding 1 (HIGH) — the auditor read only `acls`, so a valid `grants` block or the legacy
      `users`/`ports` fields granted access invisibly. Probe: the modified policy returned [].
    status: CONFIRMED
    resolution: >-
      FIXED STRUCTURALLY rather than by enumeration: `grants` and the legacy fields are now
      audited, AND the guard fails closed on any top-level key it does not know how to audit
      (UNKNOWN_TOP_LEVEL_KEY). A future access surface must grow an auditor in the same commit
      instead of arriving silently.

  - seat: claude opus 5 (round-2 independent Gear-3 gate)
    objection: >-
      REWORK-BUILD. The guard was blind on the DESTINATION axis of the one invariant it exists to
      protect: _canon_node keyed on the alias rather than the IP, so a duplicate alias was a
      different machine; and the shell check fired only when a destination resolved to a host, so
      every non-node selector (user, group:, autogroup:, CIDR) skipped it entirely. The gate's
      mutation B is the exact defect this PR removes with one character class changed — the
      minimal edit a maintainer would make to "narrow" the old blanket — and it was green.
    status: CONFIRMED
    resolution: >-
      FIXED STRUCTURALLY, not by enumerating more spellings. Canonicalisation now resolves every
      node to its IP (the identity that cannot be aliased), and UNRESOLVABLE_DST_SELECTOR fails
      closed on any destination the guard cannot resolve to a node — the same posture
      UNKNOWN_TOP_LEVEL_KEY already applied to top-level keys. Four new fixtures, 19 -> 23 tests,
      and all four of the gate's mutations replayed red against the real policy.
  - seat: claude opus 5 (round-2 independent Gear-3 gate)
    objection: >-
      Two files claimed `scripts/fleet_watch.py` has a "ping probe" that survives the proto:tcp
      narrowing because disco pings are not ACL-gated. fleet_watch.py has no ping probe at all —
      check_tailscale() reads the local daemon and check_ssh() uses OpenSSH:22. The conclusion
      survived but the cited mechanism did not exist, in a lane whose quality claim is file:line
      anchoring.
    status: CONFIRMED
    resolution: >-
      FIXED in both places (policy.hujson and the apply runbook), and verified by grep before
      rewriting rather than by trusting the gate: fleet_watch.py defines check_tailscale (:100)
      and check_ssh (:120) and contains no ping probe.
  - seat: claude opus 5 (round-2 independent Gear-3 gate)
    objection: >-
      scripts/profile-monitor/ is a repo-resident consumer in exactly the direction this policy
      fences — an employee Mac POSTs to 100.107.22.111:9099 — and it appeared in neither the
      matrix nor the "deliberately NOT granted" notes, contradicting the pack's own claim that no
      rule lacks a cited consumer. Worse, the failure is SILENT on an HR-monitoring surface.
    status: CONFIRMED
    resolution: >-
      DECLARED, not silently granted. Verified independently (wrapper.py:44, profile-monitor.swift
      :12, mac-client/setup-balizero.sh). Granting it would be the file's only team-device-as-
      source rule, i.e. the single property keeping the laptop off the shell — so the trade is a
      business decision (Legge 5). It is now named in policy.hujson beside rule 7 and carries its
      own "decide this BEFORE you enrol" section in enroll-team-device.md.

  - seat:
      claude opus 5 (round-3 gate A, resumed round-2 seat) and claude opus 5 (round-3 gate B,
      fresh seat) — INDEPENDENTLY, on the same sha
    objection: >-
      The ssh block never went through audit_rule, so it had no wildcard or selector check at
      all: src/dst ["*"] returned clean while the identical wildcard in an acls rule went red,
      and SSH_ROOT_GRANT was a denylist of the single literal "root" so users:["*"] — strictly
      wider, and a superset of autogroup:tagged — passed. Gate A dispositioned it as a
      next-PR condition; gate B called it blocking because two operator-facing documents claim
      the invariant it does not enforce.
    status: CONFIRMED
    resolution: >-
      FIXED IN THIS DIFF rather than deferred, because two independent seats converging on one
      hole is not a taste difference. The ssh block is now allowlisted on all three axes;
      UNRESOLVABLE_SRC_SELECTOR mirrors the dst check; SHELL_HOST_IP pins Pro's address so
      re-pointing the alias cannot move the anchor. 4 fixtures, 27 tests, all five mutations
      replayed red against the real policy. The two documents are consequently TRUE again and
      were rewritten to state what is enforced clause by clause, rather than weakened.
  - seat: claude opus 5 (round-3 gate B)
    objection: >-
      The profile-monitor note called "a team device is never a SOURCE" the single property
      keeping the laptop off the writable shell. That is false as Tailscale semantics — ACL
      rules are independent allow entries — and it inflates the cost of granting pro:9099,
      biasing a decision deliberately handed to the owner.
    status: CONFIRMED
    resolution: >-
      Reworded in enroll-team-device.md to the defensible narrower claim: what fences the shell
      is the absence of a grant to pro:443; the real cost is that the bright line is what this
      repo mechanically enforces (TEAM_TAG_AS_SOURCE) and port-scoping it means teaching that
      check an exemption. The deferral itself was confirmed by both gates as the right call.

open_questions:
  - >-
    Port 443 cannot be split by URL path in a Tailscale ACL, so the m5 and iOS grants
    necessarily carry /term alongside /deck. The real fix is moving /term to its own port in
    Pro's `tailscale serve` config — a change to a live machine, out of scope for this
    repo-only lane, and a business call for the owner. Left in the ledger, declared in the
    policy's SHELL-ROUTE block, not silently accepted.
  - >-
    Two secondary findings are flagged as follow-ups, not fixed here: Pro's OpenClaw Control
    binds *:18789 (all interfaces, LAN-reachable independently of the tailnet), and the public
    Funnel on 8443 bypasses ACLs entirely by design.
