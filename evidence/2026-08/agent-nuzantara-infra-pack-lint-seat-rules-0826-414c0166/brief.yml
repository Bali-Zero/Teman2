risks:
  - "Path-glob over/under-match (cicatrix family #3) — `fnmatch.fnmatchcase` in this
    module treats `*` as matching `/` too, so `*/visa_engine/*` also matches
    `apps/backend-rag/backend/tests/services/visa_engine/...` (test files, not just
    engine logic). This is the literal glob shape the spec named; flagged here rather
    than silently narrowed, for the refuter round to weigh in on."
  - "NOTICE-mode means neither rule can actually block a bad PR before 2026-09-02 — by
    design (a grace window for existing lanes to adapt), but it means this PR's own
    day-0 measurement is the only signal anyone gets before the flip date unless someone
    reads stderr."
  - "`seat_override: <reason>` is a per-PACK escape with no length/content validation
    beyond non-blank — a one-word override defeats both rules identically to a detailed
    one. Same shape as the pre-existing D3 override pattern in this file; not a new
    weakness this PR introduces."
grader: |
  Independent verification by this session (generator == author here — the mandate is
  an implementer-lane dispatch, not a review dispatch; the adversarial gate is the
  mandatory post-PR Codex/Kimi refuter round recorded in pack.yml's dissent, not this
  brief). Re-ran the full guilt+innocence suite, guard-conformance, selftest, ruff, and
  a live mutation-test proof against the shared trigger helper, all in this session.
budget: |
  1 implementer lane (this session, worktree-isolated), 2 rules of 4 (PR-B follows for
  the remaining 2), 1 mandatory post-open cross-family refuter round (Codex gpt-5.6-sol,
  fallback Kimi K3).
pii: none — this PR touches only the CI-gate script, its test corpus, and the
