task_id: pack-lint-seat-rules-0826
gear: 3
gate_class: opus
objective: |
  Implement enforcer E3 (seat rules by path class) in `scripts/evidence_pack_lint.py`, per
  `2026-08-26-PIANO-SPEC-receptor-live.md` §8. Two of the four spec'd rules land in this PR:

  - R8 (ground_truth lane): a diff touching a ground-truth path (backend KB, visa_engine,
    a KBLI dataset file, an official pricing table, research/regulatory, or a mouth
    claim page) must declare a well-formed `{role: ground_truth, seat, nb, query_hash}`
    lane, or the pack is rejected.
  - R10 (pii_local seat): a diff touching a PII-bearing path (intake, CRM, CRM-guardian,
    the WhatsApp channel, or the yield-optimizer pitch gate) must have every LLM seat in
    its `lanes:` start with `ollama-`, unless the pack also declares `cloud_ok: <DPA ref>`
    AND `pii_scan: clean`.

  Both rules are phased: NOTICE (rc=0, stderr warning) before 2026-09-02
  (`SEAT_RULES_ENFORCEMENT_DATE`), hard FAIL (rc=1) on/after, with a per-pack
  `seat_override: <reason>` escape that always downgrades a hit to a reported NOTICE
  rather than a violation, at any date.

  Gear 3 by SCOPE, not by the deterministic floor (which is 1 for the three changed
  files — none is HOTZONE by path): this PR changes a CI-enforced anti-Goodhart gate
  that every future Gear-3 PR touching a ground-truth or PII path will be judged
  against, and it is registered in `infra/guard-conformance/registry.json` — a wrong
  glob here either lets a real ground-truth/PII diff through unguarded (under-match) or
  clobbers innocent PRs repo-wide (over-match, cicatrix family #3). The evidence below
  is sized to that blast radius, not to the line count.
constraints:
  - "R9 (council_run on gear:3) and R11 (cheap-seat floor on mechanical-only diffs) are
    OUT OF SCOPE for this PR. The full 4-rule implementation measured 958 net lines
    against origin/main — over the Agent PR Contract's 'aim ~400 net lines' target. The
    mandate named the exact fallback for this case ('if the diff passes 400 split
    ground_truth+PII from seat_floor+council into two PRs'); R9/R11 land in a follow-up
    PR (PR-B) once this one merges, reusing the shared `_seat_rule_verdict` /
    `SEAT_RULES_ENFORCEMENT_DATE` plumbing this PR introduces rather than re-deriving it."
  - "No change to `compute_floor`, `compute_ceiling`, or the `--print-floor` CLI — a
    parallel lane (L13-floor-size-term) owns that surface concurrently. This PR's new
    code is appended as new functions after `check_lanes_build_seat_diversity`, with a
    single new call site inside `lint()`."
  - '`VALID_LANE_ROLES` is extended with `"ground_truth"` (was `("build", "review",
    "read")`) so an R8 lane doesn''t trip D3''s own role-enum check. `ground_truth` lanes
    are never counted toward D3''s build-lane seat-diversity math.'
  - "New tests are appended to the EXISTING `scripts/tests/test_evidence_pack_lint.py`,
    not a new `test_evidence_pack_lint_seat_rules.py` file as originally suggested — see
    dissent entry in pack.yml for the verified reason (a second registry surface pointing
    at the same source file would double-census it in `check_guard_conformance.py`)."
