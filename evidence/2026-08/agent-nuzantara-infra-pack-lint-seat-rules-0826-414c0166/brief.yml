consumer_map:
  - "`scripts/evidence_pack_lint.py` — two new check_* functions, one new call site in
    `lint()`, `VALID_LANE_ROLES` extended, module docstring section 9 updated."
  - "`scripts/tests/test_evidence_pack_lint.py` — sole guilt+innocence corpus for both
    new checks (also the corpus the guard-conformance registry resolves test names
    against for the `evidence_pack_lint` surface)."
  - "`infra/guard-conformance/registry.json` — two new `guards` entries under
    `surfaces.evidence_pack_lint`, keeping census parity with the two new check_* defs."
  - "Every future Gear>=1 pack under `evidence/**/pack.yml` that touches a ground-truth
