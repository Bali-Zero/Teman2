dissent:
  - seat: session self-refutation (recorded because nothing external caught it)
    objection: >-
      The mandate suggested a new test file, scripts/tests/test_evidence_pack_lint_seat_rules.py,
      for the R8-R11 corpus. This PR instead appends all new tests into the EXISTING
      scripts/tests/test_evidence_pack_lint.py — a deviation from the literal instruction.
    status: CONFIRMED
    note: >-
      Verified by reading infra/guard-conformance/check_guard_conformance.py's
      check_bridge(): the registry's test_file field is a single string per surface, and
      its AST census scans the ENTIRE declared source file for check_* defs regardless
      of which surface references it. A second surface pointing at the same
      scripts/evidence_pack_lint.py would double-census its check_* functions, and any
      guilt/innocence test-name reference would fail the anti-phantom check (C3) unless
      the actual test functions live in the ONE file the pre-existing evidence_pack_lint
      surface already names as test_file. Confirmed empirically: check_guard_conformance.py
      passes with 0 violations only with the tests appended to the existing file, not a
      new one.

  - seat: session self-refutation (recorded because nothing external caught it)
    objection: >-
      The mandate described one PR implementing all 4 rules (R8 ground_truth, R9
      council_run, R10 pii_local, R11 seat_floor). The full 4-rule implementation
      measured 958 net lines against origin/main — well over the Agent PR Contract's
      "aim ~400 net lines" target.
    status: CONFIRMED
    note: >-
      The mandate itself named the exact fallback for this case ("if the diff passes
      400 split ground_truth+PII from seat_floor+council into two PRs, this lane opens
      both sequentially"). Executed that split: this PR ships R8+R10 (525 net lines —
      still over the 400 aim, but the smallest coherent unit that lands the shared
      _seat_rule_verdict/SEAT_RULES_ENFORCEMENT_DATE infra together with its first two
      real consumers, rather than shipping infra with zero call sites or fragmenting
      the two rules from their common plumbing). R9 (council_run) + R11 (seat_floor)
      follow in PR-B once this merges, reusing the same shared infra without re-deriving
      or re-reviewing it.

