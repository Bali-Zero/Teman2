dissent:
  - seat: codex gpt-5.6-sol (finding 1, declared BLOCKER)
    status: RETRACTED
    objection: >-
      REFUTED, and the cause was mine. It reported that the diff modifies only CLAUDE.md and copies
      the block into no other door. That is true of the diff I HANDED IT — I excluded AGENTS.md,
      GEMINI.md and QWEN.md from the refutation input to keep it under 30 KB, and then asked a
      question those files answer. A refuter fed a partial diff returns a confident BLOCKER about
      the part you withheld. Recorded rather than quietly dropped, because the next session will be
      tempted to trim a diff the same way.
  - seat: codex gpt-5.6-sol (finding 2, declared BLOCKER) and kimi-code/k3
    status: CONFIRMED
    objection: >-
      ACCEPTED AS A LIMIT, not cured, and it is the deepest thing either seat said. An identical
      tracked QWEN.md proves a filename agrees; it does not prove the installed Qwen CLI, in its
      real invocation directory, with its real config, LOADS it. A CLI pointed elsewhere yields
      RECONCILED over a dead seat — family #2 at the top of this lane rather than inside it.
      Closing it needs a liveness probe: a unique canary in each door, read back through each CLI's
      real resolution path. That is a separate lane with its own blast radius (it runs four
      external CLIs), and shipping a parity probe is not the same as claiming the doors are read.
      The probe's own name says parity, and its evidence line says "identical across", never "in
      force".
  - seat: codex gpt-5.6-sol (findings 3, 9, 11)
    status: CONFIRMED
    objection: >-
      ACCEPTED AS LIMITS. (3) Text AFTER the block can contradict it and still hash equal — the
      probe compares the marked region, it does not adjudicate a door's whole meaning. (9)
      errors="replace" collapses two different invalid byte sequences to the same U+FFFD run, and
      text-mode reading erases CRLF. (11) A paragraph reflowed at a different column hashes
      unequal though it reads the same. All three are properties of `_canon_blocks`, which is
      SHARED with the fleet comparator and the publisher; changing it here would change all three
      organs, so it is named rather than quietly widened.
  - seat: codex gpt-5.6-sol (finding 10)
    status: CONFIRMED
    objection: >-
      ACCEPTED and the test changed. Two trailing spaces are a Markdown hard line break, so the
      normaliser erases a difference a renderer honours — and my innocence fixture used exactly
      that, blessing it. Rewritten to use CRLF, which is genuinely insignificant, with the
      trailing-space cost written into the docstring so nobody reads the fixture as a ruling.
  - seat: codex gpt-5.6-sol (finding 12)
    status: CONFIRMED
    objection: >-
      ACCEPTED and the DOCTRINE changed, not the code. The ban was written as a spelling —
      "never `from anthropic import Anthropic`" — which an alias, a wrapper or a Bedrock route
      satisfies while reaching the same paid endpoint. The block now names the ENTITY (a paid
      per-token Anthropic endpoint) and keeps the two literals as the shapes that usually carry
      it. This is the repo's own family-#3 lesson applied to a rule ABOUT guards.
  - seat: codex gpt-5.6-sol (finding 13)
    status: CONFIRMED
    objection: >-
      ACCEPTED and the test rebuilt. The case fixture created an uppercase file and left it
      untracked, which a generic tracked-file check passes without ever exercising case. It now
      builds the real disease state — the LOWERCASE name in git, the uppercase lookup succeeding
      through the filesystem — and asserts the premise (`_git_tracked_names` returns exactly
      {"qwen.md"}), so on a case-SENSITIVE volume it fails loudly instead of passing for the wrong
      reason.
  - seat: codex gpt-5.6-sol (finding 17) and kimi-code/k3 (finding 7)
    status: PLAUSIBLE
    objection: >-
      SPLIT. The root_guard half is REFUTED by measurement: `.github/workflows/root-guard.yml:51`
      runs `root_guard.py --check`, and reverting QWEN.md in the allowlist makes it exit 1 — an
      existing job already catches it. The nested-door half is ACCEPTED as a limit: a conflicting
      AGENTS.md deeper in the tree would change a subtree's instructions without touching parity.
      The arming-evaporates-on-deletion half is ACCEPTED as PRE-EXISTING: the `[ -f "$t" ]` guard
      is the workflow's own documented choice for the window before a lane's PR merges, it is not
      introduced here, and narrowing it is a change to a shared gate rather than to this lane.
  - seat: kimi-code/k3 (finding 2, index vs HEAD)
    status: PLAUSIBLE
    objection: >-
      OVERRULED WITH REASONS, and the reasons are in the probe's docstring rather than here alone.
      It argued existence should come from HEAD, since the property that matters is what a fresh
      clone gets. The counter-argument is that a session editing a door in THIS checkout is
      precisely the reader who most needs the verdict, and a HEAD-based probe would report parity
      on a tree where parity is already broken. The costs of the index choice are stated in the
      docstring — a staged-uncommitted door reads present, a `git rm --cached` door reads absent —
      so the trade is visible rather than assumed.
  - seat: kimi-code/k3 (finding 8) and codex (finding 8, git absence)
    status: RETRACTED
    objection: >-
      REFUTED by measurement. `scripts/proprioception.py` IS in the workflow's trigger path list
      (line 81) — Kimi correctly flagged its own inability to see that from the diff window rather
      than asserting it, which is why the finding cost nothing to check.

pii_scan: clean
pii_scan_note: >-
  Nothing here transcribes client data. The probe reads four repo-tracked doctrine files and emits
  sha256 digests and block ids; no path leaves the repository. The doors' own content is doctrine,
  not client material.
