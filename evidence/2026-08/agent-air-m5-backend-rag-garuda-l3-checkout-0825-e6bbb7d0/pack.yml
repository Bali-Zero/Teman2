dissent:
  - seat: sonnet-5 (self, bite-proof — generator!=grader holds even
      against one's own reading of the router file's docstring)
    objection: >
      garuda_orders_router.py's own module docstring stated mounting was
      "orchestrator-scoped per LANES.md" and deliberately NOT this lane's
      job ("this file is NOT wired into router_registration.py by this
      lane"). Read literally, editing router_registration.py here
      contradicts the file's own stated intent.
    status: RETRACTED
    resolution: >
      test_router_manifest.py structurally requires every router file
      under backend/app/routers/ to have either a manifest entry or an
      explicit NON_ROUTER_FILES/DEAD_ROUTER_FILE_HASHES whitelist entry —
      "orchestrator wires it later" was never a state this repo's own gate
      allows a live router file to sit in indefinitely. Mirrored the exact
      shape L2 used for garuda_voa_public (commit 20ef324d1): mount
      unconditionally, GARUDA_PUBLIC_ENABLED re-checked per-request inside
      the router (already true here via _require_flag on every route), and
      updated the stale docstring to match. Real adapter wiring
      (EligibilityCheckLookup/PaymentProvider/magic-session verifier) is
      unaffected — get_repository()/the auth seam still fail closed with
      503/401 until L4/L7/the orchestrator inject the real instances.
  - seat: sonnet-5 (self, bite-proof)
    objection: >
      Before reading repository.py and migration 282, considered whether
      PersistencePolicyUnavailable might indicate the DB function
      active_garuda_order_policy_available() itself was missing, broken, or
      reading the wrong policy_scope value — i.e. that the defect was in
      product code, not in test fixtures.
    status: RETRACTED
    resolution: >
      Read migration 282_garuda_orders.sql:173-189 — the function is
      correctly defined (mirrors L1's active_garuda_check_policy_available
      exactly, reads policy_scope='GARUDA_ORDER' from the same
      visa_decision_retention_policies table L1's migration 281 already
      widened its CHECK constraint to admit). The function and table are
      correct by design; no product-code bug exists. The only thing
      missing was a policy row, which per DECISIONS.md must never come from
      a migration — so the fix is exactly the test-fixture pattern L1's own
      test_retention.py already established for GARUDA_CHECK, applied here
      for GARUDA_ORDER.
  - seat: sonnet-5 (self, bite-proof)
    objection: >
      The `ON CONFLICT DO NOTHING` (no target) on the fixture policy insert
      could theoretically mask a real duplicate-policy bug if two different
      test runs raced to insert conflicting policy_version values under
      concurrent CI sharding against the same DSN.
    status: PLAUSIBLE
    resolution: >
      Not fully closed here — the fixture uses a fixed policy_version
      ('l3-test-fixture-v1') and a wide open-ended effective_period
      specifically so repeated per-test-function pool-fixture runs within
      one process are idempotent, which is what was verified (47/47 pass,
      single process, single DSN). Cross-process/sharded-CI concurrent
      first-insert races against the SAME DSN were not exercised in this
      verification and remain a residual risk if this suite is ever
      sharded across parallel workers pointed at one shared Postgres.
pii_scan: clean
