dissent:
  # Every entry below was RE-VERIFIED by this session against the code before being
  # written down — the refuter hallucinates too (superscar #6). Where a seat's severity or
  # framing did not survive that check, the entry says so rather than repeating it.

  - seat: codex-gpt-5.6-sol
    objection: >-
      HIGH — magic-link ISSUANCE has no ownership check, so anyone who knows a `result_id`
      can have a link for it emailed to an address of their choosing. `request_magic_link`
      accepts any non-empty `garuda_result_session` cookie; the store then throws the
      secret away without ever matching it.
    status: CONFIRMED
    note: >-
      VERIFIED by this session, and it is worse than a missing check — the check exists
      elsewhere and this path alone skips it.
      `garuda_portal_auth.py:329` short-circuits only on
      `garuda_result_session is None or <malformed result_id>`; any junk string passes.
      `magic_link_store.py:222` is literally
      `del result_session_secret  # not persisted`. Meanwhile
      `garuda_voa_check_results.session_secret_hash` EXISTS (migration
      `286_garuda_voa_check_results.sql:99`) and `check_store.py:267,314` DO filter
      `WHERE result_id = $1 AND session_secret_hash = $2`. So the ownership key is real and
      enforced by the result-page readers, and only issuance ignores it — while
      `request_magic_link`'s own docstring claims "Always 202 for an unknown or NON-OWNED
      result".
      SCOPE: pre-existing, NOT introduced or touched by this PR (this diff modifies only
      `_default_send_magic_link_email` and a class docstring in that file; `issue()` and
      `request_magic_link` are untouched). NOT live: `GARUDA_PUBLIC_ENABLED` is false, and
      the router answers a fabricated token with 401. Deliberately NOT fixed here — it is a
      backend authorization change, a different concern, and folding it in would be exactly
      the fix-of-a-fix widening rule 8 exists to stop. Escalated to the team lead as a
      separate PR, and it must land before go-live: it is what turns the login-CSRF entry
      below from "attacker uses their own application" into "attacker uses yours".

  - seat: codex-gpt-5.6-sol
    objection: >-
      HIGH — login CSRF is fully exploitable: an attacker mails the victim the ATTACKER's
      link, the victim clicks Continue, and the victim's browser ends up holding the
      attacker's session, then uploads a passport into the attacker's application.
    status: CONFIRMED
    note: >-
      Confirmed, and already named by the code itself — `continue/page.tsx:30-38` declares
      it as a KNOWN RESIDUAL, explains that closing it needs a non-consuming
      recipient-identity lookup the backend does not expose, and states that the sentence
      shown to the customer is a mitigation and not a fix. This pack does not upgrade that
      to "handled". The operative protection is that the funnel is dark; the standing
      condition in that comment — "The funnel is dark while this stands" — is a go-live
      gate, and this PR does not lift it.

  - seat: codex-gpt-5.6-sol
    objection: >-
      LOW — an invalid landing GET does not clear an ALREADY-LIVE pending credential. Link A
      sets `garuda_magic_pending`; the browser then visits a malformed link; the failure
      page appears, but A stays usable for up to ten minutes from another tab.
    status: CONFIRMED
    note: >-
      VERIFIED in this PR's own code: `route.ts:93-95` is
      `if (!usable) { return seeOther(FAILURE_LOCATION); }` — `seeOther`'s cookie argument
      is omitted, so no expiry is emitted on that path. This is the ONE confirmed finding
      that lands inside this diff. It is NOT fixed here, deliberately: the fix is a
      production-code change, and this PR's central claim — and the reason an independent
      gate can trust it — is that no production code path differs from the version already
      measured sound. Changing one now to answer a LOW finding would trade that guarantee
      for a small hardening. Handed to the team lead as a follow-up; the residual is bounded
      by the cookie's own 600-second `Max-Age` and by the token's server-side TTL.

  - seat: codex-gpt-5.6-sol
    objection: >-
      MEDIUM — an ACTIVE scanner can still consume the token: a cookie-preserving sandbox
      that follows the 303, parses the continuation form and submits it presents
      `Sec-Fetch-Site: same-origin` and burns the token before the recipient arrives.
    status: CONFIRMED
    note: >-
      Correct, and the code already claims exactly this much and no more —
      `exchange/route.ts:22-28` says a POST "is NOT proof of a human gesture", names the
      cookie-preserving sandbox by description, and records it as accepted residual. What
      POST-only buys is that no PASSIVE fetch spends the token, which both seats confirmed
      separately. Recorded here so the ledger shows the limit was measured, not assumed.

  - seat: codex-gpt-5.6-sol
    objection: >-
      HIGH — the account cookie is minted with `Domain=.balizero.com` and `SameSite=None`,
      so every sibling subdomain's server receives the bearer and a compromised sibling can
      replay it against GARUDA endpoints.
    status: PLAUSIBLE
    note: >-
      The mechanism is real and this session verified the SameSite half directly:
      `cookie_auth.py:49-61` returns `"none"` in production, by design, for cross-subdomain
      fetch. But the severity is not this PR's to carry and the framing is downgraded on
      purpose: the attributes are the BACKEND's runtime choice
      (`_set_account_session_cookie` reads `get_cookie_domain()` / `get_samesite_policy()`),
      and this PR forwards the `Set-Cookie` verbatim precisely so it cannot drift from what
      the backend intends. Re-deriving narrower attributes in the frontend would be a copy
      that silently goes stale — the failure this design deliberately avoids. Left as a
      declared property of the existing SSO cookie policy, not a defect introduced here.

  - seat: kimi-code/k3
    objection: >-
      The result-id/token pair in the pending cookie is unsigned, so a sibling subdomain
      that can plant a `Domain=balizero.com` cookie of the same name desyncs the redirect
      target from the session the backend mints.
    status: RETRACTED
    note: >-
      Retracted as an AUTHORIZATION break after both seats and this session checked the
      server side — not merely disputed. `garuda_orders_router.py:208` is
      `if result_id != actor:` -> 404, where `actor` IS the session's result_id, so a
      desynced redirect fails CLOSED on every order operation. The seat that raised it
      reached the same conclusion on re-reading ("the desync fails closed server-side"), and
      the other seat scoped its own version the same way ("does not forge the backend
      session or grant access to B when downstream ownership checks work"). What remains is
      a URL/session mismatch reachable only via the login-CSRF path already recorded above,
      not a new capability.

  - seat: kimi-code/k3
    objection: >-
      Minor/operational — a double-click on Continue races two POSTs. The first redeems and
      sets the session; the second gets a refusal and its 303 may be the one the browser
      renders, so a customer who now HOLDS a valid session can be shown "This link is no
      longer valid".
    status: PLAUSIBLE
    note: >-
      Not verified end-to-end by this session — asserting it would need a concurrent
      two-request test this pack does not have, and the outcome depends on browser
      navigation ordering rather than on anything in the code. Recorded honestly as
      unmeasured. Reading the code, the ingredients are present: both paths clear the
      pending cookie, only the first receives an account cookie, and no test in the corpus
      submits concurrently. It is a UX defect, not a security one — the session the first
      POST minted is real either way.

  - seat: codex-gpt-5.6-sol + kimi-code/k3 (independently, same finding)
    objection: >-
      MEDIUM — the destination this PR redirects to cannot actually work: the upload step's
      API, `POST /api/visa/voa/eligibility-checks/{result_id}/documents`, has no backend
      route, and `/visa/voa/upload/[resultId]` is a client component with no server-side
      session check.
    status: CONFIRMED
    note: >-
      VERIFIED by this session, and it is why the brief's scope sentence was narrowed
      before this pack was written rather than after a gate caught it.
      `apps/mouth/src/app/visa/voa/upload/api-client.ts:3` declares that path;
      `git grep "eligibility-checks" -- apps/backend-rag/backend/app` returns only
      `garuda_voa_public.py:477,541,570` plus two public-endpoint allowlist entries — no
      `documents` sub-path anywhere.
      `upload/[resultId]/page.tsx:1` is `"use client"` with no session check, so with the
      flag on the PAGE renders for anyone; nothing sensitive is displayed and the order APIs
      independently require the magic session, so this is a UI-reachability fact, not an
      authorization bypass. Consequence for how this PR should be read: merging it makes the
      magic link REACH the upload page; it does not make an upload succeed. Out of scope
      here, named in the PR body, escalated.

