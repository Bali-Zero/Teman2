brief_ref: evidence/brief.yml
plan_ref: >-
  PR reshipping #5157 (agent/air-m5/ops/garuda-magic-link-consume-0828) onto a fresh
  origin/main. #5157 was SUSPENDED under Agent-PR-Contract rule 8 after three consecutive
  Gear-3 BLOCKs, none of them on the code: each was an inaccuracy in the pack's own prose.
  The code is brought across; the pack is written from scratch by a lane that did not write
  the code. Nothing in this pack is copied from #5157's pack, and every number here was
  re-measured on THIS branch.

lanes:
  # The seat values are QUOTED block scalars on purpose: a bare `#5157` in a plain YAML
  # scalar opens a comment, and an earlier draft of this very block lost the rest of the
  # line to it silently. Caught here by the linter refusing to parse, which is the good
  # failure mode — the bad one is a value that truncates and still validates.
  - lane: voa-magic-link-code-bring-across
    role: build
    seat: >-
      claude-opus-5 (this session — the only build lane; it authored no new production
      code, it transplanted #5157's and corrected two test files plus one comment)
  - lane: voa-magic-link-refuter-codex
    role: review
    seat: >-
      codex-gpt-5.6-sol (OpenAI, non-Anthropic) — adversarial security review on a fresh
      context, never the seat that wrote the code
  - lane: voa-magic-link-refuter-kimi
    role: review
    seat: >-
      kimi-code/k3 (Moonshot, non-Anthropic) — second, independent cross-family refuter,
      no visibility of the first seat's output

council_run: journal.jsonl

diff:
  net_lines: "14 files, +1980/-14"
  measured_by: >-
    scripts/evidence_pack_lint.py --print-measured --numstat-file <merge-base numstat>,
    taken immediately before the final commit. Not hand-counted. The commit count is
    deliberately NOT narrated anywhere in this pack: it changes between the last edit and
    the push, so any value written here would be stale by the time it is read.
  note: >-
    See the receipt "measured countable claims" below for the verbatim sentence the linter
    printed and the exact command that produced it.

pii_scan: clean

