seat_override: >-
  This override is shared plumbing and silences TWO rules on this pack — R8 and R9 — so it
  states a reason for each rather than one reason wearing two hats.

  R8 (ground-truth lane not convened): the rule fires on the path glob
  `apps/mouth/src/app/visa/*`, and this diff's four non-test files under it
  (auth/route.ts, auth/contract.ts, auth/exchange/route.ts, auth/continue/page.tsx) carry
  no visa/tax/KBLI/zoning claim of any kind — they are session plumbing for an emailed
  link, and the only customer-visible prose is "Continue your application" plus an expiry
  notice. Convening a NotebookLM ground-truth seat against them would produce a receipt
  about nothing, which is the shape of evidence this gate exists to reject.

  R9 (Gear-3 council quorum): two cross-family review seats WERE convened and their
  findings are in `dissent`; `journal.jsonl` sits next to this pack and records them. The
  quorum still reads as unmet because harness-floor.yml copies only pack.yml and brief.yml
  into its check directory, so the journal is never present for the linter to open —
  a CI limitation, measured on PR #5177, not an absent council. R9 flips from NOTICE to
  violation on 2026-09-02 and the fix belongs in .github/workflows/ (CODEOWNERS tier-1),
  which is out of scope for this PR and must not be smuggled into it.
