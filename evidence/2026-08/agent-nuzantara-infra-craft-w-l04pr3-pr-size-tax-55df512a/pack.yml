pii_scan: clean
pii_note: |
  A CI reporting tool. It reads PR numbers, titles and file paths from `gh`; it writes to a job
  summary. No client data, no credentials, no PII.
dissent:
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol (review lane, round 1)
    objection: |
      BLOCKER — the docstring froze "31 of 100 / 11 residual" four lines after promising every number
      is "never a constant (W106)". You could change it to 99/98 and nothing went red.
    disposition: |
      ACCEPTED. The RUN carries the numbers; the docstring carries the method. A 100-PR fixture was
      considered and rejected — it decays into a false red on an unrelated PR (W129).
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol (review lane, round 1)
    objection: |
      BLOCKER — "MANDATED" is an inference from a path, not a measurement. `path.startswith("evidence/")`
      proves position. A PR dumping 9,000 unrequested lines into `evidence/` classifies identically
      to a required pack.
    disposition: |
      ACCEPTED and generalised: "MANDATED" is gone from the docstring, the report and the PR title.
      Every class now reads as an attribution by location. The gate notes this is the same error it
      had made itself that morning one level up — reading a path as an entity.
  - status: CONFIRMED
    seat: kimi-code/k3 (review lane, round 2)
    objection: |
      HIGH — 44 executable files (its figure: "300+") are classified `docs` and therefore EXEMPT,
      three of them live guards under `.claude/`; and 503 `.md` files are classified `code`.
    disposition: |
      ACCEPTED, both cured, both re-measured to 0 by the gate. Its magnitude was WRONG — the "300+"
      counted `.json` artifacts as code. Measured with the real classifier: 44. The pack records the
      gate's number, not the seat's (W65 — the refuter allucina too).
  - status: CONFIRMED
    seat: kimi-code/k3 (review lane, round 2)
    objection: |
      HIGH (test corpus) — `assert "split-required" in out` is satisfied by the static header, so the
      guilt half of the end-to-end test is vacuous.
    disposition: ACCEPTED, reproduced on an empty report, fixed to assert the row.
  - status: CONFIRMED
    seat: kimi-code/k3 (review lane, round 2)
    objection: |
      (g) — the taxonomy exempts this PR's own arming corpus, and being path-derived it cannot
      distinguish a genuinely armed test suite from 10,000 lines of padding. It grades its author.
    disposition: |
      ACCEPTED AS A STATED LIMIT, deliberately not cured. It is a property of ANY path-derived
      scheme, and the alternative — judging whether tests are "real" — is not something a path
      classifier can do. Recorded here rather than answered, because a residual taciuto is the next
      defect.
  - status: CONFIRMED
    seat: kimi-code/k3 (review lane, round 2)
    objection: |
      (c) — a PR whose `add`/`del` are present but NULL skips reconciliation entirely and proceeds to
      a confident verdict on an unreconciled file list. Reachable via `--fixture`.
    disposition: |
      ACCEPTED as a real gap, NOT cured in this PR. Reconciliation fires only when both totals are
      present, which is the correct behaviour for `gh` (which always supplies them) and a hole for a
      hand-written fixture. Curing it means deciding whether a fixture without totals is
      `unknown` — a semantic choice, not a bug fix, and this PR has 3 lines of budget left. Carried
      as a declared limit rather than smuggled in under the line count it is about.
