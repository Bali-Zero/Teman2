diff: |
  `scripts/pr_size_taxonomy.py` (new, 349 lines), its corpus `scripts/tests/test_pr_size_taxonomy.py`
  (642 lines, 67 tests), `.github/workflows/pr-size-taxonomy.yml` (new, 47 lines, schedule +
  workflow_dispatch only), and one line registering that workflow with the failure watcher.

  CODE-CLASS NET 397 against the 400 contract — measured with the tool's own class rules, three
  lines of headroom. This PR therefore cannot absorb another change without breaking the rule it
  measures, which is stated here so the next person to add "just one more thing" is told.

  NO BEHAVIOUR CHANGE ANYWHERE ELSE. The tool gates nothing: no `--check` flag exists, the workflow
  is not in required-checks, and no job `needs:` it.
