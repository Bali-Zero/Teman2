dissent:
  - seat: "gpt-5.6-sol (xhigh, read-only) — on the diff, with an attack list"
    objection: >-
      DO-NOT-SHIP, 25 findings, 5 blockers. The first voided the PR's claim and
      was reproduced rather than argued: with the producer emitting
      entries[].class and the consumer reading e.get("classification"), the
      submitted lint returned C1=[], C3=[], C4=[], exit 0 — W120 itself passing
      its own cure, because C3 kept only literals that were ALREADY declared
      producer keys and `classification` is precisely a key the producer does
      not declare. Also: C2 compared two registry lists to each other, so a
      consumer switching from "LIVE" to "live" stayed green; C4 read only
      top-level emits and only the declared function's own body; one uncheckable
      side disabled BOTH anchors; and the workflow's `if [ -f ... ]` guards let
      a PR delete the linter and turn the REQUIRED job green.
    status: CONFIRMED
    disposition: >-
      All 25 accepted, all reproduced on disk, 0 rejected. C3 is now provenance-
      based (`_Taint`), C2b reads literals out of the source, C4 covers nested
      keys and declared helpers, each anchor runs on its own merits, the workflow
      guards are gone and an empty registry is C6. Four limits are DECLARED at
      the site rather than fixed — first-same-named-definition, dynamic keys,
      consumer-side helper calls, and `writer_function` being documentation only
      — because each needs a design decision this PR is not the place for.
  - seat: "claude-opus-5 (this session, on its own registry)"
    objection: >-
      The `live`/`green` known-gap said "no producer CAN emit it". False:
      organism_heartbeat writes whatever status string it is handed and
      validates nothing. The measurement was of CALLERS and was written as a
      property of the function.
    status: CONFIRMED
    disposition: >-
      Corrected in the registry, with the distinction stated rather than
      smoothed over. The gap stands on the caller measurement, which is the
      claim that was actually made.
  - seat: "kimi-code/k3 — third family, on the cured diff"
    objection: >-
      REWORK, five MAJORs, no blockers left. The sharpest: C2b matched only
      INLINE comparisons, while the live shape is
      `status = str(data.get("status","")).lower()` then `status not in (...)` —
      so the one case this registry declares as a known gap was precisely the
      case C2b could not see, and the gap's own existence proved the check
      blind. Also: provenance died at `list(data["entries"])` and leaked into
      nested function scopes; and the ratchet guarded `known_gaps` alone, while
      `function: null`, a non-python `kind` and `caller_supplied` were three
      unguarded ways to convert any red into a printed-but-passing line.
    status: CONFIRMED
    disposition: >-
      Four fixed — an alias pass for C2b (with the C2b twins of both gaps now
      declared), container builtins made provenance-transparent, scope
      discipline in both the taint pass and the collector, and every downgrade
      door ratcheted together as a stripped SET of identities. Two DECLARED at
      the site: C4 does not check that the dict carrying a key flows into the
      returned payload (needs return-value dataflow), and taint never UNtaints
      on rebinding (a false-RED direction, loud rather than silent, which is why
      it is declared rather than rushed).
