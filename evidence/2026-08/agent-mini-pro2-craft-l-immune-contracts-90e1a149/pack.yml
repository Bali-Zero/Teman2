seat_diversity_note: >-
  Three build lanes across two families, review by a third. D3 satisfied by a
  real build lane, never seat_override.

  The measurement, not the principle: the cross-family reviewer found that the
  lint could not detect the single defect it was written to detect, and proved
  it by running the submitted code rather than by arguing about it. Three
  Anthropic-side lanes and this gate had all missed that.
diff:
  net_lines: >-
    AS OF a361363cc3 (pinned — an unqualified byte count inside a file every
    later commit rewrites decays by construction): 7 files, +2947/-0 against the
    merge base, INCLUDING this evidence pack (3 of the 7 files) —
    which is what `git diff --numstat` measures, and a figure that quietly
    excluded itself would be the convenient half-truth this pack spends its
    receipts refusing. 1,050 of those lines are the corpus and
    roughly 400 more are load-bearing comment; the executable surface is one
    lint and six registry entries.

    Deterministic gear floor recomputed from the diff = 3 (source: path —
    .github/workflows/ is a hot zone). Gear 3 is the floor, not a choice.
  behaviour_change: >-
    Three steps join a REQUIRED job on every PR: the lint's self-test, the
    registry check, and the corpus. A registry that stops matching the code, a
    consumer that starts reading an undeclared key, a producer that stops
    writing a declared one, an empty registry, or a deleted linter all turn that
    job red. Nothing else in the repo changes: the lint reads and never writes,
    and no producer or consumer is modified by this PR.
