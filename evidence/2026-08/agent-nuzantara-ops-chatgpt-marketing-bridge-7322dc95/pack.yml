brief_ref: evidence/brief.yml
plan_ref: >-
  PR #4925, agent/nuzantara/ops/chatgpt-marketing-bridge; private allowlisted
  marketing MCP plus owner-only OpenAI Secure MCP Tunnel activation runbook.
lanes:
  - lane: chatgpt-marketing-bridge
    role: build
    seat: Codex GPT-5.6, Pro worktree, implementation and verification
  - lane: chatgpt-marketing-bridge-hostile-gate
    role: review
    seat: Claude Opus, MAX OAuth, effort=max, detached Air-M5 review worktree
seat_diversity: satisfied
seat_diversity_note: >-
  One build lane and one independent review lane from a different model family;
  no second build lane exists, so the multi-build non-Anthropic diversity rule
  does not fire.
diff:
  net_lines: >-
    16 files, 3643 insertions and 0 deletions at reviewed commit
    8358370379a35885a38bff8b64f5e5a0a54bd061, measured with git diff
    --shortstat and --numstat origin/main...HEAD.
  behaviour_change: >-
    Adds two authenticated GET-only News Room projections, one fresh
    allowlisted FastMCP server with exactly 10 tools, bounded read-only queue
    projections, isolated SOL strategy jobs, bounded Flow image/video
    generation, and an owner-run outbound-only tunnel installer. It adds no
    approve, send, publish, CRM, document, OSINT, or arbitrary-path capability.
