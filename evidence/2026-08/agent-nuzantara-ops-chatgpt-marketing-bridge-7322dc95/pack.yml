  - "Final Opus code gate at 1e2b8a7e9: 80 tests plus mutation probes passed."
  - "Ruff on all touched Python: clean."
  - "Shell syntax for the tunnel installer: clean."
  - "FastAPI critical import chain: clean."
static:
  - "Exact live tool inventory: 10 expected names, no forbidden name."
  - "Secret literal scan: no credential literal in the diff."
  - "git diff --check: clean."
  - "OpenAI tunnel-client 0.0.12 present on Pro and managed-runtime commands verified."
runtime_proof: >-
  Not live by design. The current Pro measurement has no workspace projection
  key and no `nuzantara-marketing` tunnel runtime, so the owner-only OpenAI
  association and post-merge secret/deploy gate remain. FlowKit itself was
  healthy and extension-connected at the latest measurement. The PR is draft,
  not armed, not merged, and not deployed.
residual_risks:
  - "Some list-summary fields remain empty because the list projector withholds article body text."
  - "A worker killed outside its managed timeout/cancellation path fails closed; the runbook now requires stopped-runtime, atomic, operator-only orphan recovery."
  - "The currency carve-out trusts an explicit IDR/Rp prefix; the operating rule still forbids private identifiers in all prompts."
  - "The secrets parser accepts the normal `export NAME=value` form; unusual tab-separated export syntax can pass installer preflight and then fail closed at runtime."
  - "Pro-specific local binary paths are deployment assumptions in this Pro-only bridge."
sources:
  - "OpenAI Secure MCP Tunnel guide: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels"
  - "docs/runbooks/chatgpt-business-marketing-bridge.md"
  - "research/operations/2026-08-09-harness-v2-teman2.md"
notes:
  - >-
    No client PII, credential value, CRM row, private document, or raw OSINT was
    used in implementation, tests, reviews, or this pack.
  - >-
    This pack records both independent FAIL verdicts and their fixes. It does
    not treat an early green test run as final evidence.
  - >-
    Generator contract is preserved: a separate Claude session must review and
    merge; the generator did not arm auto-merge or deploy.
