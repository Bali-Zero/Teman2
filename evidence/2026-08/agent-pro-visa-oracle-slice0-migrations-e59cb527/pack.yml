dissent:
  - seat: "Harness floor recompute (CI, deterministic)"
    objection: >-
      PR #5037 touches migrations_v2/**, hot-zone by path, floors at Gear 3 regardless of being
      3 files and +570/-0, and shipped with no evidence/brief.yml — so the check FAILED with
      "hot-zone diff with no evidence/brief.yml".
    status: CONFIRMED
    note: >-
      Verified independently rather than accepted on the message alone: recomputed the floor from
      the actual changed-file list and got 3. Answered by supplying brief+pack, never by touching
      the gate.
  - seat: "session (Pro), against its own first reading"
    objection: >-
      An early grep reported ZERO ROLLBACK markers across all three files and was one step away
      from being written up as a blocker.
    status: RETRACTED
    note: >-
      The grep pattern was `^-- ROLLBACK`. The marker the W42 lint actually requires — read out of
      `scripts/lint_migration_rollback.py:41` rather than from memory — is `-- === ROLLBACK ===`,
      and all three files carry it (293:80, 294:372, 295:70). The files were right; the probe was
      wrong. CI's own `Detect missing ROLLBACK markers` agrees: SUCCESS.
  - seat: "session (Pro), against its own second reading"
    objection: >-
      The first apply probe printed "FORWARD ROTTO" for all three migrations, which read as the
      migrations being broken.
    status: RETRACTED
    note: >-
      rc=127, "command not found" — zsh does not word-split an unquoted parameter, so `$PSQL`
      holding a command line was treated as a single command NAME. The harness was broken, not the
      migrations. Re-run with a shell function: rc=0 on all three. This is why the receipts above
      capture rc directly rather than judging by a pipeline's exit status.
  - seat: "visa-oracle-slice0-refute (adversarial subagent, no sight of this brief)"
    objection: >-
      Dispatched to find reasons these three migrations are UNSAFE across six axes — rollback
      markers, Squawk locking hazards, idempotency, destructive surface, dependencies, PII — and
      told not to bless them. On the destructive axis it found no blocker; on idempotency it
      returned PARTIAL/UNKNOWN, because 293's CREATE TABLE / CREATE TRIGGER carry no IF NOT EXISTS
      and it could not find a runner-level "already applied, skip" guard in the files it read. It
      also raised one dependency UNKNOWN it was not permitted to close: whether
      migration_080a_visa_oracle_sessions — the legacy Python migration that creates the table 295
      alters — has actually RUN in production, as opposed to merely existing in the repo.
    status: RETRACTED
    note: >-
      Both open points are closed by measurement, not by argument. IDEMPOTENCY: the forward SQL of
      every migration runs inside `async with conn.transaction()` (migration_base.py:511, comment
      "Use transaction for atomicity") — re-grepped in this session rather than taken from the
      refuter's citation — so a mid-file failure rolls back entirely and cannot leave the
      partial-apply state a bare CREATE TABLE would be vulnerable to. Confirmed empirically: the
      probe database was taken forward, rolled back, and taken FORWARD AGAIN on the same database,
      rc=0 each time. DEPENDENCY: visa_oracle_sessions was measured present in production
      (to_regclass -> true) with expires_at defaulting to (now() + '90 days'::interval), which is
      exactly the value 080a sets — that is the evidence 080a did run. Retracted because both
      objections were legitimate from a read-only vantage and both are now answered.
  - seat: "CI (GitHub Actions, tests.yml Backend Shards 1/2/3)"
    objection: >-
      Migration 295 could not be applied to a fresh database at all: `relation
      "public.visa_oracle_sessions" does not exist`, killing the job before pytest
      collected a test. The pack's central receipt had reported the forward apply as clean.
    status: CONFIRMED
    note: >-
      Confirmed and CURED, not argued away. The receipt was true of the probe and false of the
      world: the probe fabricated the missing precondition by hand. 295 now creates the table it
      alters (production-faithful DDL, production's index names) so migrations_v2 owns its
      existence; re-proven on a CI-shaped database with the table's absence asserted first. This
      is the pack's own retracted-dissent discipline applied to the strongest claim it made: the
      first probe was believed because it was green, and green only meant probe and object agreed.
  - seat: "codex-gpt-5.6-sol (R9 council, review lane visa-oracle-slice0-council-sol)"
    objection: >-
      Verdict FAIL, not PASS. (1) 294's purge/retention-evidence join is not policy-unique: a
      single request whose `requested_at` and `created_at` fall under two different-anchor
      retention policies can match BOTH — the shared `EXCLUDE (effective_period WITH &&)`
      constraint on the policy table does not prevent this because each policy compares a
      different anchor column. Consequence: `retention_evidence()` can double-count one request as
      two `expired_rows`, and the purge's `DELETE ... RETURNING candidates.policy_id` attributes
      the deletion to a non-deterministic policy when both match; the duplicate row also consumes
      `p_limit`. (2) 295's rollback does not restore the pre-forward state on a fresh database:
      it recreates `visa_oracle_sessions` plus its two indexes on forward-apply, but the rollback
      section only restores the 90-day `DEFAULT`, leaving the table and indexes in place; if 294
      created the `btree_gist` extension, rollback does not drop it either — the PR's "each
      rollback is symmetric with its forward half" claim does not hold for every initial state the
      forward halves support. (3) 295's `CREATE INDEX IF NOT EXISTS` / `ALTER TABLE ... SET
      DEFAULT` acquire their locks BEFORE checking whether the object already exists — "rewrites
      no rows" does not imply "takes no long lock"; under concurrent DML on the live
      `visa_oracle_sessions` table both statements can block and then fail on `lock_timeout=5s`.
      (4) `REVOKE ALL ... FROM PUBLIC` on the purge function does not stop the table/function
      OWNER (or a role with inherited EXECUTE via `ALTER DEFAULT PRIVILEGES`) from calling it —
      the PR's "application role cannot reach it by accident" claim depends on an owner/role
      separation the diff itself does not establish. (5) `requested_at`/`created_at` =
      `'infinity'::timestamptz` satisfies 293's constraints and, under either retention anchor,
      never becomes a purge candidate — a row can be made permanently retention-exempt.
    status: PLAUSIBLE
    note: >-
      Not independently reproduced by this session against a live Postgres — per the ship
      lifecycle, verifying/curing this is the gate's call, not something the council-journal task
      is authorized to fix. Recorded as PLAUSIBLE rather than CONFIRMED because this session did
      not itself run the migrations to observe the described failures; it is not a bare opinion
      either — finding (2) above converges, independently and without shared context, with
      tp1-qwen3.8-max's dissent entry below, and finding (3) converges with that same entry's
      secondary point, which is the strongest signal this session has that both are real rather
      than one seat's hallucination.
  - seat: "tp1-qwen3.8-max (R9 council, review lane visa-oracle-slice0-council-qwen)"
    objection: >-
      Verdict FINDING, not PASS. Primary (converges with codex-gpt-5.6-sol's objection (2) above,
      reached independently, no shared context): 295's rollback is asymmetric with its forward
      half on any database where 295 itself creates `visa_oracle_sessions` (a fresh CI database, a
      new environment, a DR replay) — the forward `CREATE TABLE IF NOT EXISTS` plus its two
      `CREATE INDEX IF NOT EXISTS` are never dropped by the rollback section, which only restores
      the 90-day `DEFAULT`; the table and both indexes are left behind. This directly contradicts
      the PR body's "Each rollback is symmetric with its forward half" gate for that path.
      Secondary (converges with codex-gpt-5.6-sol's objection (3) above): on production, where the
      table already exists, 295's `CREATE TABLE IF NOT EXISTS` and `CREATE INDEX IF NOT EXISTS`
      still acquire catalog/table locks BEFORE checking existence, so the migration's own claim
      that these statements are inert "no-ops" on production is true in effect but not in locking
      — under concurrent write load to the live `visa_oracle_sessions` table the "no-op" can still
      fail on `lock_timeout=5s`. Tertiary, lower-confidence notes: a legacy-named-index
      environment (one built from the old migration_080a rather than from production) would get a
      second, duplicate index rather than a no-op, because `IF NOT EXISTS` matches by name, not by
      definition; no independent REVOKE on the two guard/trigger functions (flagged as
      low-severity, since they only RAISE).
    status: PLAUSIBLE
    note: >-
      Same caveat as the codex-gpt-5.6-sol entry above: not independently reproduced by this
      session against a live Postgres. Recorded PLAUSIBLE, not CONFIRMED. Both of this entry's
      main points converge with codex-gpt-5.6-sol's own dissent items (2) and (3) above — two
      independent, no-shared-context seats naming the same two defects from each seat's own read
      of the diff.
