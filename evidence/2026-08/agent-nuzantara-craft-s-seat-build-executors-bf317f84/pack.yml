diff:
  net_lines: >-
    AS OF the commit this pack ships with: 4 files, +308/-2, net 306 — THREE-DOT
    against the merge base, never two-dot (W102). Gear floor recomputed = 3
    (hot-zone: .github/workflows/); declared Gear 3, at the floor. Inside the
    ~400 target. One file is the workflow; three are this evidence pack.
  behaviour_change: >-
    Three shell suites that had no CI executor anywhere now run on every PR and
    push that touches seat_build.sh, its source closure, or the suites
    themselves. They run BEFORE this job's apt install and origin/main fetch,
    because they need neither. A fourth step asserts their combined assertion
    count has not fallen below 51. No existing step changes; the job name, the
    concurrency block and every pre-existing path entry are untouched.
