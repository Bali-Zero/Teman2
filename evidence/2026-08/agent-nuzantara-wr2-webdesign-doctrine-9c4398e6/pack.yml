brief_ref: evidence/brief.yml # STAGING layout, never the real per-PR path (harness-floor S12/C6)
plan_ref: >-
  PR from agent/nuzantara/wr2/webdesign-doctrine -> main. Web surface spec for the
  bali-zero-brand skill, the sixteen-lane research capture behind it, and a stdlib lint
  that enforces the mechanically-decidable subset. Study only: no product code, no deploy.

lanes:
  - lane: corpus-and-spec-build
    role: build
    seat: claude opus 5 (this session, M5 interactive) + one opus subagent for the spec repair
  - lane: lint-repair
    role: build
    seat:
      codex gpt-5.6-sol xhigh (non-Anthropic) — the lint was WRITTEN by a Claude model, so
      its repair was deliberately routed out of that family rather than back to the author
  - lane: adversarial-review-r1
    role: review
    seat:
      kimi-code/k3 (non-Anthropic) — given both files and asked to RECOMPUTE, not to opine;
      never the build seat, never briefed on the build reasoning
  - lane: adversarial-review-r2
    role: review
    seat: >-
      tp1-qwen3.8-max (non-Anthropic, a third family) — run AFTER the round-1 repairs, and told
      which findings were already closed so the pass was spent on new ground rather than on
      re-finding known defects. Codex was NOT eligible for this lane, having repaired the lint;
      grading it would have been grading its own work
  - lane: cross-family-research
    role: read
    seat:
      gemini 3.1 pro (agy) · codex gpt-5.6-sol · kimi k3 · qwen3.8-max — four of the
      sixteen research lanes, one per family, on the same contract as the twelve topic lanes

diff:
  files: 29
  net_lines: 9060
  measured_at: HEAD (post-merge with origin/main)
  note: >-
    Far past the ~400-net-line target in the Agent PR Contract, and declared rather than split.
    The shape: the research capture is the bulk (the lane reports plus SYNTHESIS/INDEX/CONTRACT —
    an append-only auditable record, not reviewable code), then the spec, then the lint with its
    tests, which cannot be separated from each other — a guard without its guilt-and-innocence
    tests is exactly what this repo's scar family #3 forbids shipping. The three organs are
    mutually citing: the lint's messages name the capture's gate numbers, and the spec cites both.
    Every countable figure lives in the scalar fields above and nowhere in this prose, deliberately:
    a count narrated in a sentence is a count nobody re-measures. The earlier value here was taken
    at 9c4398e6a and was true only there — the lane reports the corpus INDEX.md points at were
    being silently swallowed by a bare `reports/` in .gitignore, so they were never in the counted
    diff at all. That figure did not merely go stale: it measured a commit which did not contain
    the evidence it claimed to ship.

pii_scan: clean

