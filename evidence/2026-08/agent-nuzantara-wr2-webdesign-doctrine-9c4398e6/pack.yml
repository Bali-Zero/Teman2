council_run: council-run.jsonl

dissent:
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MAJOR — gate 2 states WCAG's large-text threshold as "≥18px, or ≥14px bold". SC 1.4.3
      defines it in POINTS: 18pt / 14pt bold, which is 24px / 18.66px CSS. As written the gate
      silently demotes every string between 16px and 18.66px bold out of the 4.5:1 tier.
    status: CONFIRMED
    resolution: >-
      Fixed in the spec, with the conversion stated inline, and fixed in the research capture
      that the spec cites as its authority. The rest of the file was grepped for the same
      confusion: no other instance.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MAJOR — gates 8 and 9 contradict the file's own multiplier. +7 L dark against −3.5 L
      light is exactly 2.0x, outside the 1.2–1.6x envelope stated in gate 8's own parenthetical
      and again in W2.4 (measured max 1.57x).
    status: CONFIRMED
    resolution: >-
      Resolved toward the MEASURED side rather than by splitting the difference: the multiplier
      has evidence behind it and the absolute steps were invented, so the dark step is now
      DERIVED (>= +4.2 L, 1.2–1.6x the light step). Same correction applied to the capture and
      to the published dossier, which carried the same figure.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MAJOR — gate_guarantee fires on NEGATIONS. "Refunds are not guaranteed for government
      refusals" and "Keputusan akhir tidak dijamin oleh agen mana pun" are flagged, and those
      are precisely the honest register the spec demands. The lint also blocks the anti-scam
      sentence the corpus recommends publishing.
    status: CONFIRMED
    resolution: >-
      Fixed with a negation window and a documented reporting carve-out, each carrying the
      reviewer's exact string as an innocence fixture. This is scar family #3 in its pure form:
      a guard that flags the copy its own doctrine requires teaches people to disable the guard.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MAJOR — gate_artificial_delay matches PROXIMITY, not causality: a setTimeout whose body
      only scrolls, plus an unrelated synchronous setPhase("success") four lines below, is
      flagged.
    status: CONFIRMED
    resolution: >-
      The state-setter must now sit INSIDE the timeout's balanced-paren callback. Guilty and
      innocent fixtures both from the reviewer's construction.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MINOR — gate_flag_switcher is defeated by a hyphen: `lang-flag` inside
      `language-switcher.css` reports clean.
    status: CONFIRMED
    resolution: >-
      Fixed; verified with both the CSS and the JSX guilty form, plus an innocent nationality
      picker so the fix does not overshoot into "a flag may never appear".
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MINOR — the module docstring promises "a code comment can never trip a gate", and that
      promise is false in three places: the flag gate reads the raw text, HTML and SCSS
      comments are never blanked, and JSON KEYS are treated as user-visible copy.
    status: CONFIRMED
    resolution: >-
      The promise was made true rather than struck, and the CLI help now states the narrower
      form it can actually keep. A docstring that lies is worse than one that admits a limit.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MINOR — the gate count is wrong: W9 claims 116 total with 31 "that did not make the cut",
      but only 76 gates are actually printed.
    status: CONFIRMED
    resolution: >-
      Recounted independently rather than trusting either number: 76 printed, 116 in the
      capture with none missing, so the remainder is 40. Both ends now carry the arithmetic.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      MINOR — three behavioural figures are stated bare, and the file's own W7.4 rule requires
      every unverified number to carry an [M] mark.
    status: CONFIRMED
    resolution: >-
      Two of the three were unattributed and are now cited: gate 44's 41% to Baymard's
      line-length research, and W4.5's 45.01 Mbps / +53.1% to DataReportal — both
      VERIFIED-LIVE in their lanes. The third is handled separately in the next entry.
  - seat: kimi-code/k3 (round 1), third figure only
    objection: >-
      Gate 72's "60% of test subjects could not locate guest checkout" carries no attribution
      and no [M] mark, and does not resolve to any source in the capture — L06's only 60% is a
      different Baymard measurement about mobile keyboard optimisations.
    status: RETRACTED
    resolution: >-
      The finding is wrong and the correction made on it is reversed. Lane L06 carries TWO
      distinct 60% figures, and the second is verbatim the cited one — "in qualitative testing
      60% of subjects struggled to even locate the guest-checkout option when it wasn't
      presented as a clearly separate, equally-weighted choice" — inside a paragraph the lane
      marked VERIFIED-LIVE (fetched 2026-08-31). Caught by re-grepping the lane report rather
      than trusting the finding: the claim never needed defending, it needed reading. The gate
      is restored with its citation and the whole episode is recorded as F9-bis in the spec's
      Corrections section rather than quietly reverted, because a correction that deletes a
      TRUE statement costs more than the error it was aimed at, and only the record makes that
      visible to the next reader.
  - seat: tp1-qwen3.8-max (round 2)
    objection: >-
      BLOCKER — the suppression directive is parsed off the RAW line, so it can be embedded inside
      the very string it excuses. `const claim = "guaranteed lint-web-surface: ignore
      GATE-108-GUARANTEE -- internal test copy";` both violates the gate and suppresses it. That is
      a universal bypass of every gate in the file, writable in shipped copy.
    status: CONFIRMED
    resolution: >-
      Fixed: suppressions are now read off a comment-only view of the line, never the raw text.
      Verified by the session on the reviewer's exact string — it fires GATE-108-GUARANTEE and is
      not suppressed — while a genuine trailing-comment suppression still works.
  - seat: tp1-qwen3.8-max (round 2)
    objection: >-
      MAJOR — `_decompose_js()` treats `//` in JSX text as a comment start, so `<p>See
      https://balizero.com guaranteed approval</p>` has its copy blanked from `https:` onward and
      the banned phrase is never seen. A URL and copy on one line is an ordinary shape.
    status: CONFIRMED
    resolution: >-
      Fixed: a `//` immediately preceded by `:` is no longer a comment start. Guilty fixture fires.
  - seat: tp1-qwen3.8-max (round 2)
    objection: >-
      MAJOR — a hyphen defeats the affiliation patterns: `"official-partner"` and `"agen-resmi"`
      escape because the regex requires whitespace between the words.
    status: CONFIRMED
    resolution: >-
      Fixed (`\s+` -> `[\s-]+` in all four patterns). This is the SAME defect as round 1's
      `lang-flag` finding on a different gate — the family recurring in a second place, which is
      the argument for keeping every fix's fixture rather than trusting the class was learned.
  - seat: tp1-qwen3.8-max (round 2)
    objection: >-
      MAJOR — two over-matches on honest copy. `_is_negated_or_reported()` only inspects the 100
      characters BEFORE a match, so `"Official partner claims are a scam."` fires; and
      `"Our office is at #1 Jalan Raya Kerobokan"` fires the rank gate on a street number.
    status: CONFIRMED
    resolution: >-
      Both fixed — the reporting window now looks forward as well as back, and an address context
      defuses `#1`. Verified silent on the reviewer's exact strings.
  - seat: tp1-qwen3.8-max (round 2)
    objection: >-
      MAJOR — the hue-drift formula cannot be confirmed by the values cited beside it.
      `H(n) = H_base + 5*(1-n)` has a total span of 5 degrees; the Radix figures quoted as
      confirmation drift 12.7 -> 23.0, a span of 10.3.
    status: CONFIRMED
    resolution: >-
      Fixed in the doctrine: the equation is now stated as a simplified illustrative model and the
      empirical Radix numbers are the ground truth, rather than the two being presented as
      agreeing. The arithmetic was checked independently before the edit.
  - seat: tp1-qwen3.8-max (round 2)
    objection: >-
      MAJOR — "keep 4.9 … they sit in the empirically optimal band (purchase likelihood peaks
      4.0-4.7 and falls toward 5.0)" is self-contradictory: 4.9 is outside 4.0-4.7 by the
      sentence's own numbers.
    status: CONFIRMED
    resolution: >-
      Fixed: 4.9 is now stated as sitting past the peak, not inside it. The underlying advice —
      keep the real rating, solve the rendering, never fabricate a number — survives the correction
      and is what the section was actually for.
  - seat: tp1-qwen3.8-max (round 2)
    objection: >-
      MAJOR — assembled phrases escape: `official {role}` in JSX and the template-literal form
      `` `official ${role}` `` are never seen as the banned phrase.
    status: CONFIRMED
    resolution: >-
      DECLINED, deliberately, and recorded as a known gap rather than papered over. Catching it
      needs either flagging `official` before any interpolation — which fires on innocent dynamic
      copy like `official {documentType}` — or a data-flow trace that guesses intent. This gate
      already dropped a bare `100%` check for measuring 17 false positives out of 18; the same
      judgement applies. The gap is documented inline above the patterns and in the doctrine's
      Corrections table.
  - seat: session (independent verification of both reviewers)
    objection: >-
      A reviewer can be wrong, and one already was in round 1. Neither review was acted on as
      given.
    status: CONFIRMED
    resolution: >-
      Every finding was reproduced as a fixture before it was fixed, and the round-2 fixes were
      re-verified by the session on the reviewer's own strings after the fact: six guilty shapes
      all fire, three innocent shapes are all silent, including a legitimate trailing-comment
      suppression. Round 2 also independently re-derived round 1's corrections (pt-to-px 24 /
      18.66, the 4.2 dark step, 76/40, white-on-red 5.88:1) and found them sound — so those are
      no longer this session's own arithmetic taken on trust.
  - seat: session (self-audit)
    objection: >-
      The diff is 5,169 net lines against a ~400-line target, and it ships three things at once.
    status: CONFIRMED
    resolution: >-
      Declared, not split. The capture is append-only evidence rather than reviewable code; the
      lint and its tests cannot be separated without shipping a guard with no innocence test.
      The honest cost is that a reviewer cannot read this in one sitting, and the mitigation is
      that every mechanical claim in it has a re-runnable receipt above.
  - seat: session (self-audit)
    objection: >-
      The lint is not wired into CI by this PR, so nothing yet PREVENTS the defects it names.
      By this repo's own principle — if a critical rule is violable, write a hook — a lint that
      no gate runs is documentation with a shebang.
    status: CONFIRMED
    resolution: >-
      Deliberate and stated. Arming it while 30 real findings stand in apps/mouth would either
      break the build or force `continue-on-error`, and a gate that is allowed to fail is worse
      than no gate because it teaches everyone to ignore it. The order is: fix the 30, then arm
      it blocking. That sequencing is the ledger's, not this PR's.
  - seat: session (self-audit)
    objection: >-
      The corpus's own weakest point, carried forward into the spec rather than hidden: 111 of
      365 sources are FROM-MEMORY, and two of the four cross-family lanes returned ZERO live
      sources by their own admission.
    status: CONFIRMED
    resolution: >-
      Every such figure keeps its [M] mark, §7.5 of the capture names each lane's sourcing
      record explicitly, and §7 lists what could not be verified at all — including the most
      important methodological caveat in the corpus, that the canonical web-credibility
      literature is ~2002 and no modern replication of comparable authority was found.
