  - claim: "The new interpreter guard is guilt-tested: without it the failure wrote NO heartbeat, with it the failure names its own cause"
    cmd: "copy of the wrapper with PYBIN repointed at /nonexistent/venv/bin/python, ORGANISM_LAST_SEEN_DIR isolated to a scratch dir; then the real wrapper unchanged"
    result: >-
      BEFORE the guard: rc=1 and the last_seen dir held 0 files (counted with
      `/bin/ls -1A | wc -l`). AFTER: rc=78 and exactly 1 file —
