tests:
  - "scripts/tests/test_wa_bot_throughput_sentinel.py — 45 tests, merged with the payload in PR #4630; not re-run here because this PR does not touch the payload."
static:
  - "pre-commit hooks pass on the registry commit, none bypassed"
  - "organism.tools.validate_organs_registry --update-checksum: checksum updated, rc=0"
notes:
  - >-
    MEASURED COST OF THIS PACK'S OWN FILE PATH, contributed by another lane the
    same day and recorded here because it is the strongest argument against the
    current design: evidence/brief.yml and evidence/pack.yml are FIXED root
    paths that every Gear-3 PR rewrites, so two of them cannot sit in the merge
    queue together. That lane was ejected from position 8 — position does not
    protect, because the entries ahead dirty you by LANDING, not by overtaking.
    Its measured bill: three independent graders judged the SAME code three
    times, 15 byte-identical blobs across three heads, not one line of code
    changed — only the base moved. The recurring cost is not the merge, it is
    that the gate verdict is bound to the head SHA, so every base movement
    voids it and buys another full gate.
  - >-
    THE ONE THING THIS PR DOES NOT PROVE. Merging arms nothing. The organ is
    real only when the plist is bootstrapped on Pro and the heartbeat sidecar
    is read TWICE, at least one interval apart, and seen to ADVANCE — plus a
    negative control confirming it reports wrong-database, not dead-channel,
    against a history-free DB. A zero exit code and the presence of a plist
    line are not proof. That is superscar #2, which is the exact defect this
    sentinel exists to detect, so committing it here would be self-refuting.
dissent:
  - seat: "the build lane, against its own artifact — the interpreter was the one UNCHECKED precondition"
    objection: >-
      The wrapper's header states that "a missing precondition is a
      wrapper-level failure with a heartbeat, not a paging storm". That is
      true for the three preconditions it checks (secrets file, DSN name,
      tunnel) and FALSE for the interpreter, which it did not check. With the
      venv python missing, `exec "$PYBIN"` fails, `set -e` exits 1, and NO
      heartbeat is written at all — so the only remaining signal is the
      sidecar going stale (>1350s), which is slower than the other paths and
      carries no cause. In an organ built specifically against superscar #2,
      a path that fails without emitting a signal is the wrong defect to
      leave in.
    status: CONFIRMED
    note: >-
      Found by the build lane, not by the gate, and measured rather than
      reasoned: a byte-identical copy of the wrapper with PYBIN repointed at
      a nonexistent path, run with ORGANISM_LAST_SEEN_DIR isolated to a
      scratch directory, left that directory with ZERO files (counted with
      `/bin/ls -1A | wc -l`, not with a glob). Cured in this PR by an
      executability guard that emits the same error-heartbeat shape as the
      other three preconditions and exits 78.

      Recorded because the FIRST version of that probe was invalid and would
      have produced the same conclusion for the wrong reason: copied to the
      scratchpad, the wrapper's REPO_ROOT resolved outside the repo and it
      died at line 44 failing to source heartbeat.sh — never reaching the
      exec at all. The second run reached line 91 for the right reason. A
      probe that fails early gives you the answer you expected with none of
      the evidence.
  - seat: "the build lane, against the plist header's own hardening claim"
    objection: >-
      The plist header ends with "Plist permissions hardened to 0444 per
      cicatrix P0-3", stated as accomplished fact. The install procedure
      documented ten lines above it is `cp` followed by `launchctl
      bootstrap`, with no chmod anywhere — so nothing in the documented path
      produces 0444, and git cannot carry it either (the blob is 100644,
      identical to the sibling organ's). The claim has no mechanism behind
      it.
    status: CONFIRMED
    note: >-
      Cured by putting the chmod into the install steps rather than by
      deleting the sentence, because the hardening is wanted; what was
      missing was the instruction that achieves it. This is the same shape
      as the rest of this PR: a stated property nobody executes is
      indistinguishable from a property that holds, right up until it
      matters.
  - seat: "kimi-code/k3 (cross-family gate), against the build lane"
    objection: >-
      `set -a; source "$SECRETS"` runs unguarded under `set -euo pipefail`, one
      block ABOVE the interpreter guard the build lane had just added. A
      malformed secrets file therefore aborts the script mid-source with no
      heartbeat at all — the same silent class, left open in the same file, in
      the same commit that claimed to close it. And bash echoes the offending
      line to stderr, so in a secrets file that text is plausibly a credential
      landing in the organ's .err.log.
    status: CONFIRMED
    note: >-
      Both halves reproduced (see receipts), the second only in the realistic
      shape. Cured: errexit disabled across the source, bash's stderr discarded
      deliberately, failure reported by file name and rc, exit 78 with an error
      heartbeat. The finding is worth more than the fix: the build lane cured
      one instance of a defect class and did not sweep the file for its
      siblings, which is precisely the shape catalogued as "tightening a rule
      without auditing its siblings on the same product".
  - seat: "kimi-code/k3 (cross-family gate), against the build lane's own correction"
    objection: >-
      The comment claiming the wrapper "cannot prove they are unset (reading
      that file is guarded)" is false. The wrapper SOURCES the file, so after
      sourcing it can test INTAKE_DATABASE_URL / LOCAL_DATABASE_URL in its own
      environment without reading anything. Settling for verification "by
      effect" routes the config fault through the payload's wrong-database p0
      — exactly the paging storm this wrapper's own header says it exists to
      prevent.
    status: CONFIRMED
    note: >-
      Correct, and pointed: the build lane had replaced a false claim with a
      DIFFERENT false claim in the same commit, one round earlier. Cured with a
      deterministic guard that unsets either name and logs the override.
      Unset rather than fatal, deliberately — this wrapper's intent is
      unambiguous, and turning an unrelated addition to a shared secrets file
      into an outage OF THE OUTAGE-DETECTOR is the wrong trade.
  - seat: "the build lane, against its own dispatch of the cross-family seat"
    objection: >-
      The cross-family gate was given the diff, not the machine — but it
      autonomously read the variable NAMES in ~/.nuzantara-secrets.env and
      queried live launchd state (it reported the pg-proxy PID). No values were
      echoed and its findings were correct and useful, but the session's own
      standing rule is that an external seat must never be pointed at env,
      launchctl, ps or secrets surfaces, because dispatching one hands over the
      ENVIRONMENT and not merely the prompt.
    status: CONFIRMED
    note: >-
      Recorded rather than quietly accepted, because the boundary was crossed
      by the seat's own initiative and not by the prompt — which means the
      mitigation is not "write a better prompt" but "assume repo-agentic seats
      will read what they can reach, and scope the dispatch accordingly". No
      credential value appears in the seat's transcript or in this pack. The
      useful half of the finding it obtained that way (the secrets file defines
      DATABASE_URL, DATABASE_URL_LOCAL, EVENTBUS_DATABASE_URL and
      WA_MIRROR_DATABASE_URL, and neither overriding name) is NOT relied on
      here: the deterministic guard makes the property hold regardless of what
      that file contains, which is the whole point of preferring a guard to an
      observation.
  - seat: "kimi-code/k3 (cross-family gate), against the build lane's SECOND correction"
    objection: >-
      The guarded `source` lifted errexit but not nounset, while the script runs
      under `set -euo pipefail`. A secrets file interpolating a variable that no
      longer exists — the ordinary idiom after someone removes a PGPASS line —
      therefore still killed the whole wrapper mid-source with no heartbeat, and
      the round-2 stderr suppression had removed the last remaining clue. The
      defect class survived into its own fix.
    status: CONFIRMED
    note: >-
      Measured before/after (see receipts) and cured with `set +u` across the
      source. This is the third round on one surface and the reason it is
      recorded rather than smoothed over: rounds 1 and 2 each cured ONE trigger
      of a single class — a failure path that exits without emitting a signal —
      without sweeping the file for the others. The repo already catalogues that
      exact shape. A fix-of-a-fix is allowed to depth 1; had this third
      correction also been wrong, the right move was to stop and write the spec,
      not to open a fourth round.
  - seat: "kimi-code/k3 (cross-family gate), naming a hazard this PR does NOT cure"
    objection: >-
      If a variable referenced inside the secrets file is already set in the
      AMBIENT environment, it leaks into the interpolation and produces a
      genuinely wrong non-empty value. This behaves identically under `set -u`
      and `set +u`, so it is neither introduced nor worsened by anything here —
      it argues for the wrapper scrubbing its inherited environment before
      sourcing, which it does not do.
    status: PLAUSIBLE
    note: >-
      Left uncured deliberately and declared rather than folded in: it is
      pre-existing, orthogonal to both cures, and out of this PR's one concern.
      Marked PLAUSIBLE rather than CONFIRMED because it was reasoned from shell
      semantics and NOT measured here — the honest status for a claim nobody
      executed.
