seat_diversity_note: >-
  Single BUILD lane, so the D3 rule's own floor (>=2 build lanes) does not fire
  and the field stays "degraded" on that basis alone. The review side is NOT
  degraded: a cross-family seat (kimi-code/k3) gated this diff and found two
  CONFIRMED MEDIUMs, both of which the Anthropic review lanes missed. That is
  the whole argument for cross-family review stated as a measurement rather
  than a principle.

  Recorded because it cost something to learn: the first Anthropic gate
  subagent went idle FOUR times without ever emitting a report. An idle
  notification is not a verdict, and reading it as one would have shipped this
  PR with both MEDIUMs open. The cross-family seat was reached for as a
  delivery fix and turned out to be the substantive one.
diff:
  net_lines: >-
    AS OF 85954fccd (pinned deliberately — see below): 5 files, +749/-78,
    measured THREE-DOT against the merge base. Never two-dot, which on a moved
    base blames this PR for files that landed on main after the branch point
    (W102). Two of the five are evidence/brief.yml and evidence/pack.yml, which
    already exist on main and are therefore REWRITTEN, not created — the
    fixed-path collision hazard, which duly bit: PR #4693 landed rewriting both
    while this PR was in flight, GitHub marked it CONFLICTING, and a
    CONFLICTING PR fires ZERO workflows, so the green could never arrive and
    nothing was red to say why. Deterministic gear floor recomputed from this
    diff = 3 (hot-zone: infra/launchagents/). Gear 3 is the floor, not a choice.

    The pin is the point. An earlier revision of this field carried a bare
    "3 files, +222/-1", which an independent fact-check found to be both stale
    AND arithmetically wrong when written (91+102+30 is 223, not 222). A byte
    count stated unqualified inside a file that every subsequent commit
    changes is a claim that decays by construction; the only form that stays
    true is one bound to a named SHA.
  behaviour_change: >-
    NOTHING changes on any machine when this merges. It adds the artifacts
    that let an operator install the organ; installing it is a separate,
    post-merge step. Once installed, Pro runs a read-only SELECT max() pair
    against production every 900s and can emit p0/digest Telegram alerts.
