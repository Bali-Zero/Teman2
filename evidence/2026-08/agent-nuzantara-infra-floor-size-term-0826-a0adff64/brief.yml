    lane L8 is concurrently appending new seat-rule functions at the END of
    the same file plus one call site in the main check loop; this PR does not
    touch either, to minimize merge conflict."
  - "No paid API. The refuter round used `codex exec` (ChatGPT Pro, flat
    subscription, unmetered) — zero metered spend."
  - "No PII. This PR touches only CI governance code (a linter + a workflow)
    and its own test suite; nothing here processes client data."
  - "The bootstrap-guard fallback semantics in harness-floor.yml (missing
    numstat -> path-only floor + NOTICE, never a hard fail) are preserved
    exactly through the step reorder — verified by the fallback test and by
    actionlint."
