risks:
  - "SIZE_GEAR3_THRESHOLD (1828) is a POINT-IN-TIME snapshot (churn p90 over
    170 PRs merged as of 2026-08-27). No auto-recalibration cron exists yet —
    if the fleet's typical PR shape drifts meaningfully, this constant will
    need a manual re-measure. Out of scope for this PR (S1 only asks for the
    initial calibration methodology, not an ongoing recalibration mechanism)."
  - "The generated/fixtures directory-name exemption remains AUTHOR-CONTROLLED
    — a PR could name a directory `generated/` to dodge the size term. Same
    trust boundary evidence/brief.yml itself already carries (a PR author can
    also just declare a false gear); narrowing this further was flagged by the
    refuter as a real but separate, larger change and is not attempted here."
  - "`--no-renames` amplifies a pure file move into a full add+delete pair in
    the numstat, inflating churn for a rename-only diff. Accepted deliberately
    — a rename still shows real diff volume to review, and `--no-renames`
    matches `sum_numstat()`'s own existing convention (no new inconsistency
    introduced)."
grader: |
  generator != grader, twice over. Round 1 (the size-term feature): cross-family
  adversarial review via `codex exec --sandbox read-only --skip-git-repo-check
  -m gpt-5.6-sol -c model_reasoning_effort="high"` against the real PR diff
  (`gh pr diff 5049`), producing 3 HIGH + 2 MEDIUM findings — all addressed in
  the round-2 commit, with two sub-findings explicitly triaged and left
  unchanged (reasoning recorded above under risks). One refuter claim was
  independently checked rather than trusted at face value: the refuter's stated
  mechanism for Finding 3 (an unguarded `git diff` leaving `available=true` over
  a truncated file) was tested live in an isolated bash invocation matching GH
  Actions' actual default shell (`bash --noprofile --norc -eo pipefail`) — the
  underlying risk was real, but the refuter's exact described failure mode was
  not (GH Actions' implicit `-e` already aborts the step on that failure); the
  fix implemented reflects the corrected mechanism, not the refuter's literal
  claim.

  Round 2 (the refuter-fix commit itself): independently re-verified by a
  `backend-verifier` subagent on fresh context, read-only, before this pack was
  written — re-ran the full test suite, the selftest, and actionlint from
  scratch, and independently confirmed each of the 3 HIGH fixes both by reading
  the diff and by re-executing the exact behavioral case that exposed the bug
  (e.g. the balanced-rewrite regression). Verdict: CLEAN, all 8 checks pass.
budget: |
