task_id: floor-size-term-0826
gear: 3
l_level: L2
gate_class: opus
objective: |
  S1 (blast-radius term in the gear floor): `scripts/evidence_pack_lint.py`'s
  `compute_floor(changed_files)` was PATH-ONLY — 15 hot-zone globs floored a
  diff at Gear 3, anything else floored at Gear 1, regardless of size.
  Measured: PR #4959 (24,582 net lines), #4960 (4,979 lines / 40 files, the
  public funnel UI rewrite), #4797 (10,107 net lines) and #4898 (1,618-line
  PII-in-logs cure) all floored at Gear 1 and got no evidence brief, none of
  them touched .github/workflows/* or the other hot-zone globs.

  This PR gives `compute_floor` an optional SIZE term: `compute_floor(changed_files,
  numstat=None)` computes churn (added+deleted, Σ over non-generated/non-vendored/
  non-lockfile/non-binary files) and floors at Gear 3 when it clears
  SIZE_GEAR3_THRESHOLD (measured churn p90 over the 170 most recently merged PRs,
  clamped >=1500 — 1828), or raises the floor to at least Gear 2 past
  SIZE_GEAR2_THRESHOLD (400, the Agent PR Contract's own net-line target).
  `harness-floor.yml`'s numstat computation step is moved earlier (before the
  floor step, not after) so the size term is available unconditionally, with the
  bootstrap-guard fallback semantics (missing file -> path-only floor + NOTICE)
  preserved exactly. `--print-floor` gains `--numstat-file` to accept the same
  numstat format the workflow already produces for the ceiling.

  SECOND PASS (same PR, same session): cross-family adversarial review
  (codex-sol, gpt-5.6-sol, read-only sandbox) on the first cut found 3 HIGH +
  2 MEDIUM real gaps before this ever reached CI. All 5 are fixed here, in one
  follow-up commit, findings recorded in the PR body per the Agent PR Contract's
  "fix real findings" instruction:
    1. HIGH — a floor==2 diff with no evidence/brief.yml passed the workflow's
       "not a harness task" step silently (it only guarded floor==3). Fixed:
       Step 5a/5b's condition is now floor==1 (pass) vs floor!=1 (fail without
       a brief), so floor==2 is no longer a free bypass.
    2. HIGH — the size term's per-file formula was `abs(added-deleted)`,
       cancelable by a balanced in-place rewrite (2000 added + 2000 deleted in
       ONE file netted to 0). Fixed: switched to churn (added+deleted), which
       cannot cancel this way; SIZE_GEAR3_THRESHOLD recalibrated to the
       churn-based p90 (1828, was 1790 on the old metric, same 170-PR sample).
    3. HIGH — the workflow's `git diff --numstat > file` line ran unguarded
       under `set -u` only. Fixed: explicit `if ! git diff ...` guard, failing
       to `available=false` rather than risking `available=true` over a
       truncated/empty file.
    4. MEDIUM — no vendored-directory exclusion (this repo has a real
       `vendor/evoskill` tree). Fixed: added vendor/vendored/node_modules/
       dist/build to the exclusion list.
    5. MEDIUM — the lockfile exclusion was a blanket `*.lock` suffix match,
       which would also exempt this repo's own hand-written `agent_lock:
       <resource>` coordination-pattern files. Fixed: narrowed to the named
       package-manager lockfile list only.
constraints:
