dissent:
  - seat: gpt-5.6-sol (codex-sol, cross-family refuter)
    objection: >-
      A floor==2 diff (400-1789 net lines/churn, non-hot-zone) with no
      evidence/brief.yml passes harness-floor.yml's Step 5a silently — the
      step's condition only guarded floor==3, so omitting the brief entirely
      dodges the new Gear-2 floor completely.
    status: CONFIRMED
    note: >-
      Fixed: Step 5a's condition changed from `floor != '3'` to `floor ==
      '1'`, and Step 5b's from `floor == '3'` to `floor != '1'` — floor==2 now
      routes through the FAIL step exactly like floor==3 does (both require at
      minimum a brief). Re-verified via actionlint + independent subagent read.

  - seat: gpt-5.6-sol (codex-sol, cross-family refuter)
    objection: >-
      `_size_term_net_lines()` summed the per-file ABSOLUTE net
      (abs(added-deleted)), not churn — a balanced in-place rewrite (2000
      added + 2000 deleted in the SAME file) nets to zero, hiding a
      genuinely full-file rewrite from the floor entirely. Pure deletions
      counted correctly; the bug was specific to balanced same-file diffs.
    status: CONFIRMED
    note: >-
      Fixed: formula changed to added+deleted (churn), which cannot cancel
      this way. SIZE_GEAR3_THRESHOLD recalibrated to the churn-based p90 over
      the same 170-PR sample (1828, was 1790 on the old |add-del| metric).
      Regression test added; behaviorally re-verified (receipt above).

  - seat: gpt-5.6-sol (codex-sol, cross-family refuter)
    objection: >-
      Step 2c's `git diff --no-renames --numstat ... > file` runs under
      `set -u` only, with no exit-status check — a failure could in
      principle leave `available=true` emitted over a truncated/empty file,
      which the linter would read as net_lines=0 (a false-small signal on
      what could be the run's largest diff).
    status: CONFIRMED
    note: >-
      Fixed: the `git diff` line is now wrapped in an explicit `if ! git diff
      ...; then ... available=false; exit 0; fi` guard, independent of the
      runner's implicit `-e` default. Separately, the refuter's STATED
      MECHANISM for how this manifests was checked empirically (a live bash
      test matching GH Actions' real default shell, `-eo pipefail`) and found
      NOT to match — the runner's implicit errexit already aborts the step on
      such a failure, it does not fall through to `available=true`. The
      underlying gap (relying on an implicit default for a security-relevant
      guarantee) was real and is fixed regardless; the fix reflects the
      corrected mechanism, not the refuter's literal claim.

  - seat: gpt-5.6-sol (codex-sol, cross-family refuter)
    objection: >-
      Exclusions and threshold are not fully robust: (a) generated/fixtures
      directory names are author-controlled labels; (b) any *.lock is
      excluded even if hand-written; (c) vendor/node_modules/dist/build are
      NOT excluded, and this repo has a real vendor/evoskill tree; (d)
      --no-renames amplifies a move into add+delete; (e) the threshold was
      calibrated on a different metric (|total add - total del|) than what
      the runtime computed (per-file absolute net).
    status: CONFIRMED
    note: >-
      (c) and (e) fixed directly: vendor/vendored/node_modules/dist/build
      added to the exclusion list; threshold recalibrated on the churn metric
      the (now-fixed) runtime actually computes. (b) fixed by narrowing to the
      named package-manager lockfile list, closing the hand-written-.lock gap
      the refuter named. (a) and (d) triaged and left unchanged, with reasoning
      recorded in brief.yml's risks section — both are real but separate,
      larger changes than this PR's scope (a author-controlled-label trust
      boundary already exists at the brief.yml level; --no-renames matches
      sum_numstat()'s own existing convention).

  - seat: gpt-5.6-sol (codex-sol, cross-family refuter)
    objection: >-
      Tests prove guilt/innocence only at the helper level; missing coverage
      for no-brief-at-floor-2, balanced same-file rewrite, deletion-only,
      real code under generated/fixtures, vendored directories, rename-only,
      git-diff failure/partial output, the workflow's bootstrap/missing-flag/
      merge-group matrix, and a true end-to-end lint() run with numstat_text.
    status: PLAUSIBLE
    note: >-
      Partially addressed: 3 new unit tests added (balanced-rewrite
      regression, vendored-dir exclusion, named-vs-blanket lockfile). NOT
      added: workflow-level integration tests (bootstrap/missing-flag/
      merge-group matrix) and a dedicated end-to-end lint()+numstat_text test
      — the existing check_gear_floor size-term tests already exercise
      numstat threading through check_gear_floor, and actionlint + the live
      manual --print-floor checks (receipts above) cover the workflow-level
      behavior this PR's scope reaches; a full YAML-execution integration
      harness for harness-floor.yml is a separate, larger investment than one
      focused fix commit, left for a future PR if warranted.

