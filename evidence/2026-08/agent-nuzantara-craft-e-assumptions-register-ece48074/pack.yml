notes:
  - "SHARED-SURFACE CHANGE, declared: _acceptance_examples is called by rule 12 as well, so hardening it moves PR-1's landed output for any bullet carrying a control byte. Accepted knowingly because the alternative was a docstring that lies, and measured rather than assumed — full suite re-run (262 passed, rule 12's own tests green) and the zero-new-reds sweep re-run after the change."
  - "TWO OF MY OWN PROBES WERE WRONG, and both are recorded because they are the instructive part. (1) I read ${PIPESTATUS[0]} after piping through tail, so three commands reported an EMPTY exit code — I measured the pipe, not the command (W97, whose own entry in this file notes it as a fifth recurrence). (2) The same probe said 'No module named ruff' while the implementer had reported ruff green: both true, different binaries. Had I trusted my probe I would have called a green step red; had I trusted the report I would never have known which binary answered."
  - "A THIRD MUTANT 'SURVIVED' AND TAUGHT NOTHING: my mutation re-implemented the guard it claimed to delete, so it was semantically equivalent. Re-cut as a true deletion, it kills. A surviving mutant is a claim about the corpus only when the mutation actually changes behaviour."
  - "Diff is 775 net lines against the contract's ~400 target, and 241 of those are this evidence pack. It is one concern (rule 13) and splitting it would ship a lint rule apart from the corpus that proves it is not vacuous. The executable body of the new function is roughly 45 lines; the rest is the house's documented style, the guilt+innocence corpus, and this pack."
  - "Two needs-ruling items from the lane spec are NOT decided here and are not touched by this PR: appetite auto-suspend (spec item 1) and default appetite ceiling values (spec item 3). They belong to PR-3."
