dissent:
  - seat: kimi-k3
    objection: "_acceptance_examples collapses whitespace and swaps double quotes, but ESC/BEL/NUL are not whitespace, so a control byte in a text reaches stderr verbatim while the helper's docstring claims 'Every item is SANITIZED first' — a terminal-injection shape and a docstring that promises more than the code delivers."
    status: CONFIRMED
  - seat: kimi-k3
    objection: "text[:60] truncates by code point and can split a grapheme cluster, leaving a dangling combining mark or half a flag emoji inside the quotes."
    status: PLAUSIBLE
  - seat: kimi-k3
    objection: "A text-less entry renders as '<non-text bullet>' — rule-12 vocabulary leaking into a rule-13 notice via the shared helper; a neutral '<non-text entry>' would read better."
    status: PLAUSIBLE
  - seat: kimi-k3
    objection: "Under-match: no input found where an unverified assumption escapes all three notices. Coverage is total by construction — every entry lands in exactly one of verified(silent) / N1 / N2 — and entry.get('probe') is reachable only from the dict branch, so it cannot raise. The only escape is a literal status: verified lie, which the docstring already disclaims."
    status: RETRACTED
  - seat: kimi-k3
    objection: "Raise: no input found. Every access is guarded — isinstance before .get, before iteration, before .strip()/.lower(), and _acceptance_examples only ever receives str."
    status: RETRACTED
  - seat: kimi-k3
    objection: "Over-match: no input found. status: verified in any case or whitespace variant is silent; absent, non-list and empty blocks are silent; N2 firing on 'pending' and on the 'unverfied' typo is the documented intent."
    status: RETRACTED
  - seat: kimi-k3
    objection: "Counting: no contradiction found. N1 and N2 partition the non-verified entries, N3 is a subset of N1, total = len(assumptions), and the helper's 60+3=63 truncation math matches its own docstring."
    status: RETRACTED
