    the only slice with a real import dependency on the full stack, which is why it is the LAST
    slice and stacked on top of all three."
  - "Slightly over the ~400-net-line soft target (438 lines) -- not split further because
    shadow.py and parity.py are the two halves of this deliverable's remaining non-negotiable
    properties (dual-write + parity) and splitting them apart would leave either one landing
    without its sibling test coverage story being reviewable as a whole."
  - "No PII: synthetic fixtures only, reused from slice 1's conftest.py."
  - "Branch stays unopened as a PR until slices 2/3a themselves open (gated on slice 1, #4749,
    merging first) -- same 'one PR per lane at a time' serialization practice."
acceptance:
  - "Flag OFF (default, no env var set): shadow_adapt_magazine_action_chain never calls any
    adapter -- proven by test_flag_off_never_calls_any_adapter, which monkeypatches every adapter
    function in the module's own namespace to raise AssertionError if invoked."
  - "Flag ON: an adapter exception is caught, logged via logger.error (observable), and reported
    through ShadowRunResult.error -- it never propagates and never corrupts legacy truth, proven
    by test_flag_on_isolates_an_adapter_failure_never_raises."
  - "Each parity probe reports ParityDivergence entries rather than raising or asserting equality
    -- a deliberately corrupted canonical object (via .model_copy(update=...)) is caught as a
