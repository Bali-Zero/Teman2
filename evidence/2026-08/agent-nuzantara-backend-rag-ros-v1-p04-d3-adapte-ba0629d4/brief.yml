objective: |
  Research OS v1.0.0 Wave 0, Work Packet 04, deliverable D3. Slice 3b of 3 (final slice): the
  shadow dual-write flag (`shadow.py`) and the parity probe (`parity.py`) the packet's own
  "Shadow and rollback" section and this deliverable's non-negotiable properties both require.

  `shadow.py` implements the flag: "All domain dual-write flags default off ... canonical write
  failures must be observable but must not corrupt legacy truth." The flag-OFF path is a genuine
  no-op -- it returns a shared, pre-built sentinel `ShadowRunResult` WITHOUT calling any adapter,
  proven by a test that monkeypatches every adapter function to raise if called
  (`test_flag_off_never_calls_any_adapter`). This is the acceptance test itself, not an
  aspiration. There is deliberately no canonical persistence layer to write INTO yet -- the
  compatibility matrix's own finding, re-verified this session, is that the canonical models have
  zero non-test consumers anywhere in the repo. (A naive `grep -rl "ActionItem("` outside this
  package's own files DOES surface two hits -- `backend/services/naga/actions/action_engine.py`
  and its test -- but reading them shows a pre-existing, unrelated, locally-defined `ActionItem`
  dataclass in NAGA's own module, importing only `backend.core.claims.models`, never
  `research_os.models.action_item` -- a pure name collision, not a consumer of this deliverable's
  canonical model. A precise import-level grep for `research_os.models.action_item`/
  `action_intent`/`operational_receipt` also surfaces one further hit,
  `backend/tests/unit/research_os/test_decision_chain.py` -- but that is
  `packages/research-os-core`'s OWN pre-existing unit-test suite for the canonical models
  themselves (constructs the Pydantic objects directly to test the models, predates this
  deliverable, and does not import anything from this adapter package). The claim that actually
  matters -- that THIS package's own adapter modules (`action_item_adapter`, `action_intent_adapter`,
  `operational_receipt_adapter`, `shadow`, `parity`) have zero importers anywhere outside their
  own package and test tree -- checks out with zero hits.) That is Work Packet 04 Deliverable 5
  (`research_os_contract_core`, a different
  deliverable, already merged per this session's origin/main fetch) -- a `# TODO` in shadow.py
  marks exactly where its writer slots in once wired.

  `parity.py` implements the second non-negotiable property: it compares an adapted canonical
  object back against its legacy record and REPORTS divergence, never asserts blanket equality.
  Only fields each adapter's own loss report marks MAPPED (a genuine 1:1 or
  independently-recomputable value) are compared -- comparing an APPROXIMATED or
  SYNTHESIZED_UNBACKED field against the raw legacy value would be a false test of a documented
  design decision, not a real regression check.
