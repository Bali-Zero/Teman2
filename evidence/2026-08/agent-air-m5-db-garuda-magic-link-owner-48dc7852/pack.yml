pii_scan: clean
pii_scan_note:
  "No client data was touched, read or transcribed. Production reads were catalog queries (pg_proc,
  pg_class, information_schema.columns) and one row COUNT; no row contents left the database. The two
  synthetic eligibility checks the prove-live harness created were deleted by it (204 each). The
  magic links minted during the proof were addressed to zantara@balizero.com, our own alias — no third
  party received anything. No secret value entered any transcript: the ownership ALTER referenced
  $OPERATOR_PASSWORD in place on the target machine rather than printing it."
dissent:
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "The migration would record FALSE SUCCESS. Its first draft caught insufficient_privilege and
      emitted a NOTICE, mirroring migration 268 — but a declined migration is still written to
      _schema_versions as applied and is never retried, so production would carry a migration claiming
      to have cured an outage that was still live, and nothing downstream would ever say otherwise."
    status: CONFIRMED
    resolution:
      "Rewritten to assert its own postcondition and RAISE: after attempting the ALTER it re-reads
      pg_proc.proowner and, if the function is still not owned by visa_ledger_owner, raises an
      exception naming the consequence ('magic-link issuance still answers 500') and refuses to be
      recorded applied. The ROLLBACK section is a deliberate no-op that says why — restoring
      backend_rag_v2 as owner would re-create the outage."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "The lint's transfer collector was too permissive: it treated any appearance of a function name
      near an ownership transfer as evidence that THAT function was transferred, so an unrelated
      transfer in the same file laundered an offender, and a mere mention counted as a cure."
    status: CONFIRMED
    resolution:
      "Rewritten to parse real ALTER FUNCTION ... OWNER TO statements and the DO-block transfer arrays
      used by migrations 268/281, binding each transfer to its own function name. Five tests now
      encode the grader's counterexamples directly: unrelated transfer, mere mention, commented-out
      transfer, SECURITY DEFINER inside a comment, and DO-block array."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "Comments produced false results in both directions — a commented-out transfer read as a real
      one, and the words SECURITY DEFINER inside a comment read as a real offender."
    status: CONFIRMED
    resolution:
      "Line comments are stripped before analysis, and dollar-quoted bodies are matched by their real
      tags rather than split coarsely. This also removed a false positive against
      prepare_visa_evaluate_idempotency_reservation that the author's own innocence control had caught."
  - seat: claude-opus-5 (self-refutation during build, RESOLVED)
    objection:
      "The lint's own MIGRATIONS path was wrong (parents[3] instead of parents[2]), so it globbed a
      directory that does not exist. A glob over a missing directory returns empty silently — the lint
      was green because it was looking at nothing."
    status: CONFIRMED
    resolution:
      "Caught by the innocence control the lint carries. Path corrected and an explicit
      MIGRATIONS.is_dir() assertion added, so the same failure can never be silent again."
  - seat: claude-opus-5 (declared limit, unresolved)
    objection:
      "The lint reads SQL text, not a database. A migration whose trigger takes the lock through a
      helper function rather than inline would not be caught."
    status: PLAUSIBLE
    resolution:
      "Left standing and named in the brief's risks. The live catalog check in operational_preflight,
      now aware of both GARUDA binders, is the layer that would catch that shape at runtime."
  - seat: claude-opus-5 (measured during PROVE-LIVE, out of scope for this PR)
    objection:
      "F3 of the prove-live harness shows the magic-link endpoint still issues for a result_id the
      caller does not own: a second, unrelated session cookie got '202 false' then '202 true',
      i.e. it reached store.issue and minted one of the two tokens."
    status: CONFIRMED
    resolution:
      "Orthogonal defect, already cured in PR #5298 (router-level ownership check) which is open and
      queued. Named here rather than left implicit: this PR ends the outage, it does not close that
      hole, and neither cure makes the other unnecessary — with #5298 alone the endpoint would still
      have answered 500."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, fresh context)
    objection:
      "The lint missed SECURITY DEFINER declared AFTER the body — `AS $b$...$b$ LANGUAGE plpgsql
      SECURITY DEFINER;`, ordinary valid Postgres. The detector read only the text before the
      dollar-tag, so an offender written that way passed green with the defect present. Zero of the
      twelve migrations on disk use that ordering, which is exactly why nothing caught it."
    status: CONFIRMED
    resolution:
      "The attribute is now read from both sides of the body, up to the statement's terminating
      semicolon. The gate's own counterexample is kept as a test, and it fails against the previous
      detector (RED captured, see receipts) — a corpus that happens to be uniform is not a guarantee
      about the next file."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, fresh context)
    objection:
      "DO-block laundering, one level below the file-level laundering codex rejected: a block that
      transfers one function while merely NAMING another marked both transferred, because every
      quoted signature in the block was collected. `to_regprocedure('public.<name>()')` is migration
      299's own idiom, so this is not an exotic shape."
    status: CONFIRMED
    resolution:
      "A signature now counts only if it REACHES the ALTER: it is read from the variable that
      `format('ALTER FUNCTION %s OWNER TO %I', <var>, ...)` passes — assigned directly (299's scalar),
      held in the array that variable iterates with FOREACH (281), or subscripted from it. Three
      tests pin it: the laundering case, and both real migration shapes as innocence controls."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, fresh context)
    objection:
      "The brief's constraints said the superuser ALTER and #5298 were 'not in this PR by design'
      while the pack recorded both as already landed — the two documents contradicted each other."
    status: CONFIRMED
    resolution:
      "The brief now says what is true: neither is part of this DIFF, and both happened out of band
      during the work (ALTER 07:03Z, #5298 merged and deployed 08:19Z with F3 green)."
