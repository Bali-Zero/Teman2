# brief_ref is the LITERAL 'evidence/brief.yml' even though this pack lives in a per-PR
# directory: harness-floor.yml stages both files into a synthetic tree under those fixed
# names before validating, so any other value fails to resolve in CI.
brief_ref: evidence/brief.yml
plan_ref:
  "PR #5302 (agent/air-m5/db/garuda-magic-link-owner) — cure of the production outage that kept the
  authenticated half of GARUDA VOA unreachable from the day migration 285 shipped, plus the static
  lint that stops the omission recurring. Governing mandate: GARUDA VOA dark launch to production."
lanes:
  - lane: garuda-magic-link-owner-build
    role: build
    seat:
      claude-opus-5 (conducting session — measured the outage against production, falsified four
      competing hypotheses, authored migration 299, the static lint, the preflight extension, this pack)
  - lane: garuda-magic-link-owner-refute
    role: review
    seat:
      codex-gpt-5.6-sol at xhigh effort (OpenAI, ChatGPT Pro flat subscription) — given the diff plus
      the production measurements and told to break both the migration and the lint. Returned REJECT
      with three findings, all CONFIRMED and all fixed; see dissent.
  - lane: garuda-magic-link-owner-gate
    role: review
    seat:
      claude-opus-5 on a FRESH context, dispatched as the Gear-3 final on-disk gate (the author never
      gates its own diff). It ran the receipts rather than reading them, and broke the lint with two
      shapes the first adversarial round had not reached — see dissent.
seat_diversity: satisfied
seat_diversity_note:
  "Build lane Anthropic, adversarial lane OpenAI — different families, and the grader is not the
  author. It earned its keep rather than being ceremony: the REJECT killed a migration that would have
  recorded false success, and one counterexample it supplied (a commented-out transfer) was a shape
  the author's own tests did not cover."
diff:
  net_lines:
    "6 files, +NETLINES, computed by `git diff --numstat $(git merge-base origin/main HEAD)..HEAD`.
    One new .sql migration, one new static test file, two touched Python files (the live preflight
    check and its independently frozen authority), and this evidence pair. Zero frontend, zero
    workflow, zero runtime request path."
  behaviour_change:
    "At apply time against production, migration 299 changes nothing and says so: the runner connects
    as backend_rag_v2, which is not a member of visa_ledger_owner, so the ALTER cannot succeed and the
    migration RAISES rather than recording itself applied. The cure itself landed out of band on a
    superuser connection (receipt below). The static lint and the preflight extension change no
    production behaviour at all."
receipts:
  - claim:
      "The ownership cure landed on the production PRIMARY and the trigger function is now owned by
      visa_ledger_owner — read back from a SEPARATE read-only connection, not from the output of the
      command that wrote it."
    cmd:
      'env -u FLY_API_TOKEN scripts/pg.sh -A -t -c "SELECT proname||'' ''||pg_get_userbyid(proowner)
      FROM pg_proc WHERE proname=''bind_garuda_magic_link_token_retention_policy''"'
    exit: 0
    ts: "2026-08-30T07:09:20Z"
    seat: claude-opus-5
    result:
      "bind_garuda_magic_link_token_retention_policy visa_ledger_owner — all three bind_garuda_*
      binders now ledger-owned. scripts/pg.sh routes through haproxy to the primary
      (pg_is_in_recovery = f, verified in the same session)."
  - claim:
      "PROVE-LIVE: magic-link issuance answers 202 in production, for the first time since it was
      written. Before the cure every call returned 500 and garuda_magic_link_tokens had zero rows
      ever; after it, the table holds the rows those calls minted."
    cmd: "bash scratchpad/prove-live-garuda.sh (F2: two POSTs to
      https://nuzantara-rag.fly.dev/api/visa/voa/auth/magic-links sharing one Idempotency-Key), then
      `SELECT count(*) FROM garuda_magic_link_tokens` via scripts/pg.sh"
    exit: 0
    ts: "2026-08-30T07:03:06Z"
    seat: claude-opus-5
    result:
      "F2 owner path: '202 false' then '202 true'. Table count 0 -> 2, both rows PRODUCTION, both with
      retention_policy_id and retention_until populated — i.e. the trigger that used to raise 42501
      ran to completion. The response body is deliberately non-enumerating and identical either way,
      so the Idempotency-Replayed header is the observable signal, not the status code."
  - claim:
      "The static lint would have blocked migration 285. GUILT control, run this turn: with 299
      removed — the real state of production until today — the lint fails and names the offender and
      the file."
    cmd:
      "mv 299_garuda_magic_link_binding_owner.sql /tmp && PYTHONPATH=. python -m pytest
      backend/tests/db/test_retention_lock_triggers_are_ledger_owned.py -k transferred"
    exit: 1
    ts: "2026-08-30T07:10:04Z"
    seat: claude-opus-5
    result:
      "Failure names `bind_garuda_magic_link_token_retention_policy` in `285_garuda_magic_link.sql`.
      The migration was restored immediately and `git status --porcelain` returned zero lines."
  - claim:
      "INNOCENCE control: with 299 present the whole guarded surface is green, and the lint does not
      accuse prepare_visa_evaluate_idempotency_reservation (migration 264), which production confirms
      is correctly owned and does not read the ledger."
    cmd:
      "PYTHONPATH=. python -m pytest backend/tests/db/test_retention_lock_triggers_are_ledger_owned.py
      backend/tests/scripts/visa_engine/test_operational_preflight.py"
    exit: 0
    ts: "2026-08-30T07:09:19Z"
    seat: claude-opus-5
    result:
      "43 passed in 0.38s. Includes a third control asserting the detector matches the shape at all,
      so a guard that has quietly stopped matching anything cannot pass forever."
  - claim:
      "The cause is ownership, not a missing grant on the app role: the trigger is SECURITY DEFINER
      but was owned by backend_rag_v2, which cannot take FOR SHARE on a visa_ledger_owner-owned
      table. Its working twin differs by owner and by nothing else that touches the lock."
    cmd:
      'env -u FLY_API_TOKEN scripts/pg.sh -A -F''|'' -c "SELECT proname, prosecdef,
      pg_get_userbyid(proowner) FROM pg_proc WHERE proname LIKE ''bind_garuda%'' ORDER BY proname"'
    exit: 0
    ts: "2026-08-30T07:02:00Z"
    seat: claude-opus-5
    result:
      "Before the ALTER: magic_link binder prosecdef=t owner=backend_rag_v2; voa_check binder
      prosecdef=t owner=visa_ledger_owner. Grants were read from pg_class.relacl, NOT from
      information_schema.role_table_grants — that view is filtered by the calling role, so its empty
