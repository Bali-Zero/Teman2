dissent:
  - seat: claude-opus-5 (Gear-3 final on-disk gate, fresh context)
    objection:
      "REWORK-DESIGN. The static lint ships green on the exact class it exists to catch. Two measured
      holes in its comment scanner: an `E'...'` escape string (Postgres ends `E'\\''` at the backslash
      escape; the scanner reads the following `''` as an escaped quote and stays inside the literal
      for the rest of the file) and an unclosed dollar tag (`closing == -1` emits the whole remainder
      un-stripped). After either, a commented-out `-- ALTER FUNCTION ... OWNER TO visa_ledger_owner;`
      is read as a REAL transfer — laundering, against the detector whose declared polarity is
      FAIL-CLOSED. Plus a pre-existing hole the scanner does not touch: `DOLLAR_TAG.search` is
      unbounded, so a legacy `AS '...'` body binds to a LATER statement's dollar body and a real
      offender goes unreported."
    status: CONFIRMED
    resolution:
      "Reproduced independently by the session on disk before acting — both laundering cases return
      True. The lint is WITHDRAWN from this PR rather than patched a fifth time. Rule 8: the fourth
      attempt failed in the same direction as the third, so the surface is under-specified and gets a
      spec, not another patch — docs/specs/2026-08-31-security-definer-ledger-lock-lint.md, which
      records all four rounds, the measured holes, and six requirements for whatever ships (including
      R6: decide explicitly whether a hand-written SQL lexer should exist at all, given the
      catalog-driven census in #5309 answers the same question by asking Postgres). Migration 301 and
      the preflight inventory extension — which the gate found clean and said it would land as-is —
      ship here."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, fresh context)
    objection:
      "The withdrawn lint had five tests, both polarities, and was mutation-proven. That was all true
      and it was still unsound."
    status: CONFIRMED
    resolution:
      "Recorded because it is the transferable lesson, not a footnote: an innocence control proves a
      guard does not fire on correct input, and says NOTHING about the inputs the guard cannot see.
      Mutation testing has the same blind spot — it only mutates code that exists, so a missing branch
      is invisible to it. Neither technique can find a hole in the SET OF CASES CONSIDERED; only an
      adversary constructing inputs from the spec can."
  - seat: kimi-code/k3 (adversarial grader, second council seat)
    objection:
      "The header claims the block 'ends by asserting the POSTCONDITION', but the two early RETURNs
      (role absent; function not present) exit before that assert. A staging environment that
      provisions visa_ledger_owner after migrations run records 301 as applied with the transfer
      never performed -- the same 'esiste != armato' false green the file says it refuses."
    status: CONFIRMED
    resolution:
      "Verified on disk before adoption: RETURN at lines 95 and 101, RAISE EXCEPTION at 118. The
      header was corrected to state exactly how far the guarantee reaches. The deferral itself is
      kept: it is the inherited 251/253/268/281 convention, and raising would refuse to bootstrap
      any clone that has not provisioned the role. Cure what the diff introduces (the false claim),
      spec what it inherits (the convention)."
  - seat: kimi-code/k3 (adversarial grader, second council seat)
    objection:
      "The static lint's comment stripper `--[^\\n]*` is applied to the whole forward section,
      including inside string literals and dollar-quoted bodies. Postgres treats `--` inside a
      literal as data. A SECURITY DEFINER function whose body contains a literal with a double
      hyphen ahead of its FOR SHARE loses the lock clause to the stripper and is not reported --
      a miss in the detector whose own spec says it must be PERMISSIVE because a miss is a silent
      production 500."
    status: CONFIRMED
    resolution:
      "Verified, and not merely synthetic: the stripper mangles migration 301's own text
      `-- the SECURITY DEFINER trigger cannot take its FOR SHARE lock`. Replaced with a
      character-scanning stripper that tracks single-quoted literals (including '' escapes) and
      dollar-quoted bodies. Four tests added -- two guilt, two innocence -- plus one pinned to
      migration 301 itself. Reverting to the regex reddens three of them."
  - seat: kimi-code/k3 (adversarial grader, second council seat)
    objection:
      "Moving a SECURITY DEFINER function to a more privileged owner increases the search_path
      hijack surface: any object created in a schema on the path could shadow an unqualified
      reference in the body."
    status: RETRACTED
    resolution:
      "REFUTED by the session against 285_garuda_magic_link.sql:214-218 -- the function is declared
      `SET search_path = pg_catalog, public` and references
      `public.visa_decision_retention_policies` fully qualified. Not adopted."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "The migration would record FALSE SUCCESS. Its first draft caught insufficient_privilege and
      emitted a NOTICE, mirroring migration 268 — but a declined migration is still written to
      _schema_versions as applied and is never retried, so production would carry a migration claiming
      to have cured an outage that was still live, and nothing downstream would ever say otherwise."
    status: CONFIRMED
    resolution:
      "Rewritten to assert its own postcondition and RAISE: after attempting the ALTER it re-reads
      pg_proc.proowner and, if the function is still not owned by visa_ledger_owner, raises an
      exception naming the consequence ('magic-link issuance still answers 500') and refuses to be
      recorded applied. The ROLLBACK section is a deliberate no-op that says why — restoring
      backend_rag_v2 as owner would re-create the outage."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "The lint's transfer collector was too permissive: it treated any appearance of a function name
      near an ownership transfer as evidence that THAT function was transferred, so an unrelated
      transfer in the same file laundered an offender, and a mere mention counted as a cure."
    status: CONFIRMED
    resolution:
      "Rewritten to parse real ALTER FUNCTION ... OWNER TO statements and the DO-block transfer arrays
      used by migrations 268/281, binding each transfer to its own function name. Five tests now
      encode the grader's counterexamples directly: unrelated transfer, mere mention, commented-out
      transfer, SECURITY DEFINER inside a comment, and DO-block array."
  - seat: codex-gpt-5.6-sol (adversarial grader)
    objection:
      "Comments produced false results in both directions — a commented-out transfer read as a real
      one, and the words SECURITY DEFINER inside a comment read as a real offender."
    status: CONFIRMED
    resolution:
      "Line comments are stripped before analysis, and dollar-quoted bodies are matched by their real
      tags rather than split coarsely. This also removed a false positive against
      prepare_visa_evaluate_idempotency_reservation that the author's own innocence control had caught."
  - seat: claude-opus-5 (self-refutation during build, RESOLVED)
    objection:
      "The lint's own MIGRATIONS path was wrong (parents[3] instead of parents[2]), so it globbed a
      directory that does not exist. A glob over a missing directory returns empty silently — the lint
      was green because it was looking at nothing."
    status: CONFIRMED
    resolution:
      "Caught by the innocence control the lint carries. Path corrected and an explicit
      MIGRATIONS.is_dir() assertion added, so the same failure can never be silent again."
  - seat: claude-opus-5 (declared limit, unresolved)
    objection:
      "The lint reads SQL text, not a database. A migration whose trigger takes the lock through a
      helper function rather than inline would not be caught."
    status: PLAUSIBLE
    resolution:
      "Left standing and named in the brief's risks. The live catalog check in operational_preflight,
      now aware of both GARUDA binders, is the layer that would catch that shape at runtime."
  - seat: claude-opus-5 (measured during PROVE-LIVE, out of scope for this PR)
    objection:
      "F3 of the prove-live harness shows the magic-link endpoint still issues for a result_id the
      caller does not own: a second, unrelated session cookie got '202 false' then '202 true',
      i.e. it reached store.issue and minted one of the two tokens."
    status: CONFIRMED
    resolution:
      "Orthogonal defect, already cured in PR #5298 (router-level ownership check) which is open and
