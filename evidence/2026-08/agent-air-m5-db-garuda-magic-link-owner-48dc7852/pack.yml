    cmd:
      "temporarily restore the old detectors (header-only SECURITY DEFINER scan; collect every quoted
      signature in a DO block), then PYTHONPATH=. python -m pytest
      backend/tests/db/test_retention_lock_triggers_are_ledger_owned.py"
    exit: 1
    ts: "2026-08-30T10:24:00Z"
    seat: claude-opus-5
    result:
      "RED: 2 failed, 8 passed — test_security_definer_declared_after_the_body_is_still_an_offender
      and test_a_do_block_does_not_launder_a_signature_it_merely_names. File restored from a copy and
