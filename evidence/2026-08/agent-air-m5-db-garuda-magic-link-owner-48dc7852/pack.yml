  - claim:
      "The live catalog check that should have caught this on its first run had never been told these
      functions exist; both GARUDA binders are now listed, and the frozen authority moved with them."
    cmd: "PYTHONPATH=. python -m pytest backend/tests/scripts/visa_engine/test_operational_preflight.py"
