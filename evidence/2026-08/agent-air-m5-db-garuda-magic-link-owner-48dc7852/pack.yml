  - seat: claude-opus-5 (Gear-3 final on-disk gate, fresh context)
    objection:
      "The lint missed SECURITY DEFINER declared AFTER the body — `AS $b$...$b$ LANGUAGE plpgsql
      SECURITY DEFINER;`, ordinary valid Postgres. The detector read only the text before the
      dollar-tag, so an offender written that way passed green with the defect present. Zero of the
      twelve migrations on disk use that ordering, which is exactly why nothing caught it."
    status: CONFIRMED
    resolution:
      "The attribute is now read from both sides of the body, up to the statement's terminating
      semicolon. The gate's own counterexample is kept as a test, and it fails against the previous
      detector (RED captured, see receipts) — a corpus that happens to be uniform is not a guarantee
      about the next file."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, fresh context)
    objection:
      "DO-block laundering, one level below the file-level laundering codex rejected: a block that
      transfers one function while merely NAMING another marked both transferred, because every
      quoted signature in the block was collected. `to_regprocedure('public.<name>()')` is migration
      299's own idiom, so this is not an exotic shape."
    status: CONFIRMED
    resolution:
      "A signature now counts only if it REACHES the ALTER: it is read from the variable that
      `format('ALTER FUNCTION %s OWNER TO %I', <var>, ...)` passes — assigned directly (299's scalar),
      held in the array that variable iterates with FOREACH (281), or subscripted from it. Three
      tests pin it: the laundering case, and both real migration shapes as innocence controls."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, fresh context)
    objection:
      "The brief's constraints said the superuser ALTER and #5298 were 'not in this PR by design'
      while the pack recorded both as already landed — the two documents contradicted each other."
    status: CONFIRMED
    resolution:
      "The brief now says what is true: neither is part of this DIFF, and both happened out of band
      during the work (ALTER 07:03Z, #5298 merged and deployed 08:19Z with F3 green)."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, round two)
    objection:
      "All three of the round-two fixes were still evadable, by three shapes of one class. (a) The
      transfer binding matched `\\b<var>\\b[^;]*?:=`, which walks from a MENTION of the ALTER variable
      — inside an `IF to_regprocedure(signature) IS NULL THEN`, migration 301's own idiom — into the
      NEXT line's assignment to a DIFFERENT variable, because nothing between them is a semicolon. A
      throwaway migration carrying a live offender reported it transferred and the file-level test
      passed. (b) The same regex counted both literals when a variable is reassigned. (c) A function
      body written `AS '...' LANGUAGE plpgsql` instead of `$tag$...$tag$` has no dollar tag, so the
      offender detector skipped the statement before reading any attribute."
    status: CONFIRMED
    resolution:
      "Not patched a third time — CLAUDE.md rule 8 says a correction that is itself wrong means the
      surface is under-specified, so the SPEC was written and the detectors were reframed around it.
      The two have OPPOSITE polarity, and getting that backwards is what produced every round: the
      OFFENDER detector must be PERMISSIVE (a miss is a silent production 500) and now reads the whole
      CREATE FUNCTION statement in either body-quoting form; the TRANSFER detector must FAIL CLOSED (a
      false transfer launders an offender into silence) and now recognises exactly one binding shape —
      a single `format('ALTER FUNCTION %s OWNER TO %I', <var>, <role>)` whose variable has exactly one
      statement-anchored assignment — yielding the empty set for anything ambiguous. Both spec notes
      are in the file. Four tests, all RED against the previous detectors (receipt above)."
  - seat: claude-opus-5 (declared limit, deliberately not chased)
    objection:
      "A text-based detector can always be evaded by a sufficiently unusual SQL formatting. This is
      the third round of exactly that, and a fourth is not promised."
    status: PLAUSIBLE
    resolution:
      "Named rather than papered over, and rule 8 applied: no fourth patch round. What makes this
      acceptable is that the text lint is the CHEAP layer, not the only one — the live catalog check
      in operational_preflight.py reads `pg_proc.proowner` from the running database and cannot be
      evaded by any SQL formatting whatsoever. That check is what would have caught migration 285 on
      its first run IF ANYTHING RAN IT -- see the correction below -- and this PR is what finally tells it these two functions exist. A real SQL parser
      (pglast/sqlglot) would close the text layer properly; that is a separate decision with a
      dependency attached, not something to smuggle into an outage fix."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, round three — verdict PASS with one nit)
    objection:
      "The spec docstring claimed the offender detector 'reports the function anyway rather than
      skipping it' when it cannot parse a statement confidently, but the code still `continue`d. The
      substantive polarity was right; that clause overstated it — a spec promising more than the code
      delivers is exactly the failure mode this file exists to prevent."
    status: CONFIRMED
    resolution:
      "Corrected by making the code true rather than by softening the claim. A SECURITY DEFINER
      function with no readable body in either quoting form is now reported, and so is one written
      `LANGUAGE c` / `internal`, where what looks like a body is an object file and a link symbol.
      Two tests pin it — the accusation and its innocence control (unreadable alone is not an
      accusation; unreadable AND SECURITY DEFINER is). RED captured first: `1 failed, 51 passed`.
      52 passed now."
  - seat: claude-opus-5 (Gear-3 final on-disk gate, round three — residual limits, PLAUSIBLE)
    objection:
      "Three text-layer evasions survive, demonstrated end-to-end: (1) ORDER-BLINDNESS — a later
      migration that DROPs and re-CREATEs a binder resets its ownership in Postgres, but the transfer
      lives in an earlier file, so the lint passes (throwaway migration 904: 14 passed with the
      defect on disk); (2) an ARRAY subscript `target_function[2]` marks every entry of the array;
      (3) a correctly-bound ALTER inside `IF false THEN` counts, because text cannot evaluate control
      flow."
    status: PLAUSIBLE
    resolution:
      "Recorded against the boundary this pack already declares, not chased — rule 8, no fourth patch
      round. (1) is the most reachable and worth naming precisely: migration 289 already re-creates
      two transferred binders and is safe only because it uses CREATE OR REPLACE, which preserves the
      owner; its own header says so. The backstop for all three is not textual — operational_preflight
      reads pg_proc.proowner from the live database, where a DROP+CREATE that reset ownership shows up
      immediately and no SQL formatting evades it. Closing the text layer properly means a real SQL
      parser (pglast/sqlglot), which is a dependency decision, not an outage fix."
  - seat: claude-opus-5 (CORRECTION to this pack's own claim, measured after the gate passed)
    objection:
      "This pack twice called operational_preflight's live catalog check 'the backstop' and said it
      'would have caught migration 285 on its first run'. That overstates it in exactly the way this
