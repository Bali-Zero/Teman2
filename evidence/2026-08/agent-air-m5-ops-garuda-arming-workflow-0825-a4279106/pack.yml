dissent:
  - seat: "Harness floor recompute (CI, deterministic)"
    objection: >-
      This PR touches `.github/workflows/garuda-arm.yml` — hot-zone by path
      (`.github/workflows/*` is a literal HOTZONE_PATTERNS entry) — floors
      at Gear 3 regardless of the change being a net-new, additive file
      with no existing workflow modified.
    status: CONFIRMED
    note: >-
      Verified independently rather than accepted on a FAIL message alone:
      recomputed the floor from this PR's actual staged changed-file list
      via `evidence_pack_lint.py --print-floor` (receipt above) and got 3.
      Answered by supplying this brief+pack at this PR's own per-branch
      evidence path, per `scripts/ci/evidence_paths.py`.
  - seat: "session, self-check on the workflow's own design"
    objection: >-
      Does defaulting `stage_only` to `false` (immediate restart) risk an
      accidental production disruption if someone runs this workflow
      without understanding the restart happens right away?
    status: RETRACTED
    note: >-
      Investigated rather than assumed innocent: the workflow is
      `workflow_dispatch`-only (no push/schedule trigger, cannot fire by
      accident) and the `stage_only` input's description states the
      restart behaviour explicitly at the point of choice, and the PR body
      states the reasoning ("arming is meant to take effect immediately")
      for the orchestrating session/Zero to confirm or override before the
      first real run. The team-lead's own instruction (#8 in the mandate)
      asked for a deliberate decision and stated justification, not
      necessarily `--stage` by default — retracted because the concern is
      already answered by the input's own description plus the PR body,
      not because it was dismissed unexamined.
  - seat: "session, self-check on secret-masking"
    objection: >-
      Does building `KEY=value` strings inside a bash array and passing
      them as `flyctl secrets set` command-line arguments risk the value
      leaking into Actions logs even though no `echo`/`set -x` touches it?
    status: RETRACTED
    note: >-
      Checked rather than assumed safe: the two secret values are sourced
      from `${{ secrets.GARUDA_XENDIT_SECRET_KEY }}` /
      `${{ secrets.GARUDA_XENDIT_CALLBACK_TOKEN }}` into step-scoped env
      vars — GitHub Actions registers every value read from the `secrets`
      context for automatic log redaction (masked as `***`) everywhere it
      appears in the log stream, including command-line invocations,
      independent of this workflow's own `set -x` state (which is never
      enabled here). The workflow's own discipline (never `echo`ing the
      value, printing only key names in the summary) is a second,
      independent layer on top of that platform guarantee, not a
      substitute for checking it exists.
