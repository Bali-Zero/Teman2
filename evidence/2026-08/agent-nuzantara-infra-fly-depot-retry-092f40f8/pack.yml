      retry branch + timeout + alert-condition diff, wrote this brief; per its own account relayed
      2026-08-31, also ran the two council seats below itself, then hand-applied their findings to
      the working tree and hand-wrote `journal.jsonl` from their text reports — neither reviewing
      seat has write access to this worktree)
