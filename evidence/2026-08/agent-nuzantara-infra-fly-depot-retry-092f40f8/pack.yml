  pack's own directory, found already present mid-session; see receipts). Per the build lane's own
  account (relayed 2026-08-31, not independently verifiable by this evidence-pack lane): the build
  lane ran both seats itself as the conducting session, then hand-wrote `journal.jsonl` from their
  text reports and hand-applied their findings to the working tree — neither seat has write access
  to this worktree, and neither wrote this journal autonomously. Both entries are `role: review`,
  `ok: true`, timestamped 2026-08-31T04:14:03Z. tp1-qwen3.8-max was ALSO dispatched (per the build
  lane) and is genuinely absent from the journal — but not because it silently failed to report: it
  was invoked and failed with a read timeout, root cause identified as a non-streaming call against a
  door that requires `stream: true` — the build lane's own operational error, not a defect in the
