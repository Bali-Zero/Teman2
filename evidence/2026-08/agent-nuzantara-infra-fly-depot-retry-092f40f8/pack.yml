  attributed, not verified. Two seats reporting is still a real quorum (rule 9, >=2 distinct
  COUNCIL_REVIEW_SEATS) — the third seat's absence is explained rather than papered over — verified
  against the linter's own `_read_council_journal_seats` (receipts). Only one build lane exists
  (claude-opus-5), so D3's build-seat-diversity floor does not apply regardless."
council_run: "journal.jsonl"
diff:
  net_lines: |
    4 files, +732/-3 (git diff --numstat against the merge-base with origin/main,
    2d788a3855a708c907c693722f980db909605f99), 4 commits — the workflow file plus this pack.
  behaviour_change: |
    Two independent changes bundled in one small diff to one file. (a) The `deploy` job's
    pre-existing 3-attempt retry loop gains a second, narrowly-scoped retry condition — a log match
    on the literal string `error releasing builder` sets `depot_flag=--depot=false` and retries on
    Fly's non-depot remote builder, instead of falling straight through to `exit "$status"` as every
    other non-lease failure still does; `timeout-minutes` on that job rises from 20 to 35. (b) The
    `deploy-failure-alert` job's `if:` condition widens from firing only on `failure` to also firing
    on `cancelled`, for both `run-migrations` and `deploy`. No other file changes; no schema, no
    dependency, no application code. The comment-only corrections the council review raised
    (kimi-code/k3 + codex-gpt-5.6-sol per `journal.jsonl`, text-only, no write access to this
    worktree) were applied by the build lane (conducting session) by hand and are now COMMITTED:
    they were an uncommitted working-tree edit when this pack was first written, which is why an
    earlier draft described them that way. They change comments only — the real worst case named
    honestly instead of a case that cannot occur, and `--depot=` corrected to `--depot=false` —
    so this diff's own LOGIC is unchanged by them. Evidence that it is unchanged: actionlint's
    token set is byte-identical between the run against commit 092f40f80 and a rerun against the
    corrected text (14 findings both times — see receipts).
