plan_ref:
  "PR #5422 (agent/nuzantara/infra/fly-depot-retry, base main) — 'ci(deploy): fall back off the depot
  builder, on the one string that means depot'. No separate governing mandate doc exists: this is a
  direct infra fix dispatched ad hoc after the 2026-08-30/31 depot-outage pattern was diagnosed live
  against real GitHub Actions job logs, not planned in advance."
