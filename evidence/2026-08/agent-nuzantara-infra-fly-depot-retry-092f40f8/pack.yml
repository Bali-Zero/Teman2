      trigger regex rather than confirm it — it killed an over-broad first draft and, on its own,
      narrowed a second claim it had made after seeing more logs; see dissent[0])
  - lane: fly-depot-retry-evidence
    role: review
    seat:
      claude-sonnet-5 (this evidence-pack lane — independently re-fetched and grepped all 8 cited
      GitHub Actions job logs via `gh api`, ran a live prod health check, built and ran an isolated
      mock-flyctl harness against the loop extracted verbatim from the shipped workflow, and found
      two of the build lane's chat-relayed claims stale or incorrect; see dissent[2] and dissent[3])
