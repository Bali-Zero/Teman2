risks:
  - "The true worst-case wall-clock under the new 35-minute cap is UNMEASURED, by the CORRECTED
    comment's own admission — that comment is still uncommitted, see the objective's correction #1
    and #3. No non-depot (`--depot=false`) build has ever
    been timed in this repo's history — every measured build went through depot. If a cold non-depot
    cache is materially slower than a depot build, the job could still overrun 35 minutes; the diff's
    only mitigation for that case is that the job would conclude `cancelled` and the widened alert
    would fire — loud, not silent, but not prevented either."
  - "Under-match is genuinely unmeasured. Only ONE depot-failure signature has ever been observed —
    `error releasing builder: deadline_exceeded` — and all four occurrences come from a single ~4-hour
    flapping window on one calendar night (2026-08-30T23:06:48Z–2026-08-31T03:04:23Z). A
    differently-worded depot failure (auth, quota, region-unavailable) might not match this trigger at
    all, and nobody has a counter-example in hand either way."
  - "A lease-retry (pre-existing, unchanged: `sleep 90` on a machine-lease conflict) could still stack
    with a depot-retry within the SAME 3-attempt budget — e.g. attempt 1 hits a lease conflict and
    sleeps 90s, attempt 2 hits the depot outage (~10m01s), attempt 3 runs an unmeasured non-depot
    build. Neither this pack nor the shipped code's own comment bounds that mixed case."
  - "The floor's PATH term puts this at Gear 3 regardless of the diff's actual small behavioral
    surface (one retry branch, two constants, one widened OR) — noted so the gate calibrates effort
    to the real diff, not to the gear number alone."
  - "A whole-workflow cancellation could still prevent `deploy-failure-alert` from running at all
    (codex-gpt-5.6-sol, council review, `journal.jsonl`) — `if: always()` protects against the JOB's
    own outcome, not against the RUN never scheduling that job in the first place. Re-verified this
    session: this workflow's own `concurrency: cancel-in-progress: false` (line 22) rules out
    same-group auto-cancellation as the cause, narrowing the residual vector to a MANUAL cancel via
    the GitHub UI or a runner-level kill — not eliminated, but narrower than the note's own wording
    might suggest, and not something this diff introduces or could itself close."

