  `seat_override` is pack-level (_seat_rule_verdict), so it covers R9's quorum
  as well as R8's ground-truth lane whether or not that was intended. Measured
  by running the lint: both now report "(overridden)". (1) GROUND TRUTH: a price
  is an owner ruling, not an external fact — no notebook, regulator or
  competitor can ground-truth what Bali Zero charges, and manufacturing an `nb:`
  and a `query_hash:` to fill the fields would be the phantom-citation failure
  the rule exists to prevent, pointed the other way. (2) QUORUM: it is genuinely
  NOT met, and the override is not a claim that it is. One seat reviewed
