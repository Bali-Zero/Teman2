risks:
  - "The 2026-09-05 grace window means a Gear>=2 PR still writing the root
    path today is NOTICE-only, not blocked — this PR does not retroactively
    fix any currently-open PR still on the old convention; each must migrate
    on its own before the cutover date (tonight's queue-shepherd sweep is
    itself doing exactly that migration PR-by-PR as it re-evidences reds)."
  - "`--source-path`'s default-to-PACK_PATH behavior means a caller who
    forgets to pass it under CI staging conditions would silently judge the
    wrong (always-compliant, staged-canonical) path — this is a real
    footgun for any FUTURE CI integration point that stages the pack under a
    different name and doesn't thread the flag through; today's only such
    integration point (harness-floor.yml) is fixed in this same diff."
