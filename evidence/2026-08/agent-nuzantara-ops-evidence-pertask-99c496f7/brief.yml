    passes `--source-path "$PACK_PATH"` (the pre-staging real path).'
  - "`scripts/evidence_pack_lint.py` — new rule 9
    (`check_pack_not_at_deprecated_root` / `_pack_source_relpath`), consumed
    by every Gear>=2 PR's own CI run from this PR forward."
  - "`infra/guard-conformance/registry.json` — rule 9 is a new censused
