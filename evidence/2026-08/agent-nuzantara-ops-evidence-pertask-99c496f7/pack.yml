dissent:
  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "Silent CI bypass: if CI invokes the linter programmatically (e.g.,
      test harnesses, custom runners) without passing source_path,
      violations are silently skipped." Plus: "Dangerous fail-open: library
      callers should require source_path or fail closed when path metadata
      is missing, rather than skipping rules uninspected."
    status: CONFIRMED
    note: >-
      Real, and NOT fixed in this PR — this session verified it is the
      SAME gap this pack's own `risks:` section already names: today's
      only CI integration point (harness-floor.yml) explicitly passes
      `--source-path "$PACK_PATH"` (confirmed in the receipt above), so
      the bypass is inert in practice right now, but a future second
      integration point that forgets the flag would silently pass. Not
      hardened to fail-closed in this PR because doing so would also
      break the documented, intentional use case of a plain Python library
      caller inspecting a pack with no diff/path context at all (e.g. a
      laptop spot-check) — narrowing that to fail-closed is a real design
      question for a follow-up, not a defect introduced here. Declared
      residual limit, not silently dropped.

  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "Path normalization failures: positional PACK_PATH varies by
      execution context (absolute paths, ./pack.yml, or temporary scratch
      copies), easily breaking naive pattern checks."
    status: RETRACTED
    note: >-
      Investigated and does not hold against the actual shipped code —
      retracted, not merely disputed. `_pack_source_relpath()` explicitly
      POSIX-normalizes and dot-segment-resolves the source path before
      comparing it to EVIDENCE_ROOT_PACK_PATH (read in the diff — not
      assumed), and the test suite carries two cases built specifically
      for this: `test_evidence_root_guilt_dot_segments_normalize_to_root_post_flip`
      and `test_evidence_root_innocence_dot_segments_normalize_to_per_task_clean`
      (both real function names, present in the 140-pass pytest run
      above, listed verbatim in the registry.json guilt/innocence arrays
      too). The refuter's concern was raised without having read that
      helper or those tests; this session verified both exist and pass
      before retracting.

tests:
  - "scripts/tests/test_evidence_pack_lint.py — 140 passed, 0 failed (rc=0,
    venv python), including 13 new rule-9 guilt+innocence cases."

static:
  - "python3 -m py_compile scripts/evidence_pack_lint.py — clean."
  - "infra/guard-conformance/registry.json's new check_* entry carries both
    guilt and innocence test-name arrays, matching this repo's
    guard-conformance census requirement (superscar #3)."

notes:
  - "This pack is itself evidence that the migration works end-to-end: it
    lives at evidence/2026-08/<slug>/, not evidence/pack.yml, and this PR's
    own new rule 9 would NOTICE (not fail, pre-2026-09-05) a pack at the
    deprecated root — a case this PR deliberately avoids by construction."
  - "The --source-path default-skip semantics (only a Python-caller with
    zero source_path info is skipped; every CLI invocation, bare or
    flagged, is judged) mirrors rules 6/7's existing 'skip only on missing
    context, never silently pass a judged case' shape — reused, not
    reinvented, per this repo's own stated design continuity."
