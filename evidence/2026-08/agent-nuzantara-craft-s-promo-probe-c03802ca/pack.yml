      correct/intended (repo_slug's whole job is discovering the repo when
      --repo isn't given, exactly like `gh` itself defaults to cwd) — only
      the docstring's unqualified wording was wrong. Docstring corrected.
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      real — argparse.ArgumentParser.parse_args() raises SystemExit(2) on any
      CLI syntax error (e.g. --max-newly-blocked nope), colliding with this
      script's own documented exit-2 = CANNOT-VERIFY and making a usage typo
      indistinguishable from a network failure.
    disposition: |
      CONFIRMED and reproduced empirically across 4 argparse error shapes
      before fixing. Cured with an ArgumentParser subclass overriding
      .error() itself (exit_on_error=False alone does not cover
      "unrecognized arguments" — verified empirically, not assumed). Two
      guilt tests mutation-verified.
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      real — gh's underlying GraphQL query pages statusCheckRollup contexts
      at first:100; fetch_pr_rollup() treats the result as complete with no
      truncation detection, so a PR with 101+ checks and the candidate past
      position 100 would read as a false ABSENT.
    disposition: |
      CONFIRMED on the page-size claim itself (verified live via `gh issue
      view 12904 --repo cli/cli`, whose pasted debug log contains gh's actual
      query text with `contexts(first:100)` verbatim). NOT confirmable either
      way on whether gh actually follows pagination internally — this repo's
      live PRs top out at 81 checks today, so it cannot be tested
      empirically. Given genuine unresolved uncertainty, added a defensive
      guard rather than waiting for certainty: fetch_pr_rollup() now raises
      CannotVerify at or above 100 entries. Cost of a false CANNOT-VERIFY on
      an innocent large PR is far lower than a false ABSENT blocking a real
      promotion.
  - status: CONFIRMED
    seat: codex-gpt-5.6-sol
    objection: |
      real — load_already_required()'s docstring promises "NEVER raises",
      but sorted({c["name"] for c in contexts if isinstance(c, dict) and
      c.get("name")}) uses a bare truthy check; a JSON "name": 1 passes it
      and sorting a set mixing str/int raises TypeError on valid JSON.
    disposition: |
      CONFIRMED by direct read of the set comprehension. Cured with an
      explicit isinstance(str) check; malformed non-string entries are
      dropped rather than crashing, matching this being an advisory-only
      file per the function's own docstring.
tests: |
  57 passed (scripts/ci/test_check_promotion_readiness.py), up from the
