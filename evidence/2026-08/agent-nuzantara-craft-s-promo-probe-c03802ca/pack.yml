notes: |
  The mandate's own framing — "wiring a context and being able to require it
  are two different states, and this repo has no instrument that can tell them
  apart" — applied recursively to this PR's own evidence twice over: brief.yml
  declared acceptance probes that were never run against the real test names,
  and the instrument itself had a --limit/--base gap that is the exact same
  disease as the mandate it exists to cure (a bound computed over the wrong
  universe, still reporting a clean answer). Two blind review rounds, three
  vendor families, zero visibility between seats, found nine real defects and
  zero in the actual classify() state table that is this tool's core claim to
  correctness — every finding was in orchestration, reporting, or peripheral
  I/O, which is where 9 of 9 defects clustering suggests the next build of a
  tool shaped like this one should spend proportionally more adversarial
  attention. The live measurement itself both refutes and confirms the
  conductor's earlier-tonight numbers: far more PRs than thought already
  carry all four contexts — but the promotability verdict is unchanged,
  because the PRs that don't are still the majority.
