diff: |
  New: `scripts/ci/check_promotion_readiness.py` (the instrument — classify() /
  evaluate() / fetch_open_prs() / fetch_pr_rollup() / fetch_all_rollups() /
  main(), full state table for PASS/SKIPPED/NEUTRAL/PENDING/FAIL/ABSENT, exit
  codes 0/1/2/3), its corpus `scripts/ci/test_check_promotion_readiness.py`, its
  dedicated CI executor `.github/workflows/promotion-readiness-tests.yml` (no
  existing scripts/ci/ sweep would ever have run this corpus — checked against
  shard_tests.py's DEFAULT_TARGETS and scripts-tests-sweep.yml's own declared
  scope, neither covers this path), and this task's own brief.yml.

  Two blind review rounds — agy alone, then kimi-code/k3 and codex-gpt-5.6-sol
  in parallel against the post-agy-fix diff, neither seeing the other's or
  agy's output — found nine real, confirmed defects total, ONE graded blocker
  by its finder (codex-gpt-5.6-sol). None were in the core classify() state
  table itself; all were in main()'s orchestration, the report layer, or
  peripheral I/O: an uncaught OSError on a missing --candidates-file, a
  misnamed duplicate test, six stale probe citations in brief.yml, `--limit`
  bounding the wrong universe because `--base` was never passed to `gh pr list`
  itself (the blocker), fetch-failed PRs silently classified as measured-and-
  ABSENT (phantom rows AND a misleading PROMOTABLE verdict on partial data — two
  distinct symptoms of one root cause, found independently by kimi and codex),
  a docstring overclaim about --repo (found independently by both non-Anthropic
  seats), argparse's own hardcoded exit-2-on-parse-error contradicting this
  script's documented exit-3 usage-error code, an unconfirmed-but-plausible
  statusCheckRollup pagination cap, and a TypeError-on-valid-JSON in the
  advisory contexts.json reader. All nine cured; see dissent and receipts for
  the mutation-kill proof on each behavioral fix.
