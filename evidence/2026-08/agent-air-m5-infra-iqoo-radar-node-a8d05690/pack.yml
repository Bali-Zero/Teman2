  - "Live phone guilt/innocence proof: exact capsule accepted, duplicate idempotent, extra free-text field rejected, explicit cleanup verified."
static:
  - "Ruff lint and formatting clean."
  - "ShellCheck clean across all six new shell surfaces."
  - "Both LaunchAgent plists parse with plutil."
  - "Organ conformance and organs-registry checksum/schema validation clean."
  - "git diff --check clean before evidence authoring."
runtime_proof:
  - "iQOO `radar status`: 0 safe capsules, no alarm after synthetic cleanup."
  - "iQOO `radar health`: SSH active, Termux wake-lock requested, Android notifications absent."
  - "Pro/Mini automatic relay intentionally not live; both jobs remain PENDING-ARMS for Opus 5."
residual_risks:
  - "The prior SHA passed independent Opus 5 review, but its findings changed the code; a new Opus 5 verdict on the hardened evidence head is still pending."
  - "Termux:Boot post-reboot execution is not yet proven."
  - "Native Android notification/vibration remains optional and unavailable until Termux:API is installed."
  - "No real P0 source alert has been forwarded because source LaunchAgents are deliberately unarmed."
sources:
