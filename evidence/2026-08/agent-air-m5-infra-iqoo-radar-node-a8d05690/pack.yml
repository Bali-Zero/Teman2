dissent:
  - seat: "Harness floor recompute (GitHub CI, deterministic)"
    objection: >-
      The first PR run correctly rejected this hot-zone diff because it carried no
      per-PR evidence brief and pack, even though local tests were green.
    status: CONFIRMED
    note: >-
      Recomputed independently from the real changed-file set and obtained floor 3.
      The answer is this per-branch brief+pack pair; no gate, workflow, or protection
      was weakened.
  - seat: "codex red-team self-check"
    objection: >-
      The staged boot hook alone does not prove that Android will execute it after a
      physical reboot, and the phone currently cannot raise native notifications or
      vibration because Termux:API is absent.
    status: CONFIRMED
    note: >-
      Kept as a residual limitation instead of being hidden: Termux:Boot needs its
      separate official add-on/open-once/reboot proof, while Termux:API is optional.
      Neither limitation weakens closed-schema receipt storage or CLI inspection.
  - seat: "opus-5 (independent Gear-3 review of d6874988)"
    objection: >-
      A sleeping phone was treated as an organ failure and could trigger a healer
      restart loop; the receiver could lose an incomplete spool line, short-read a
      fragmented SSH stream, retain a stale Android-kill lock or accept multiple
      JSON documents; SSH/runtime/wrapper assumptions also needed tightening.
    status: CONFIRMED
    note: >-
      `cc53c4c3` classifies delivery unavailability as retryable exit 75 with a
      healthy deferred heartbeat, preserves incomplete lines, reads with `head -c`,
      accepts exactly one document, recovers stale locks, disables global host keys,
      rejects option-prefixed targets, uses the real backend venv on both Macs and
      expands the hermetic suite from 18 to 27 tests. A fresh Opus verdict on the
      hardened evidence head remains mandatory.
  - seat: "opus-5 (independent Gear-3 review of 0c03ef47)"
    objection: >-
      Source-side configuration failures still shared the temporary-offline path;
      the sender did not preserve a safe SSH return code, output capture was
      memory-unbounded, user SSH config was not fully ignored, pending-file atomic
      rename semantics were undocumented, and a recycled Android PID could keep a
      stale receiver lock alive.
    status: CONFIRMED
    note: >-
      `2cb293ec` preflights local SSH state before spool processing, separates
      retryable delivery from software/security failures, logs only bounded safe
      reason strings with `ssh_rc`, uses file-backed 4 KiB receipt reads plus
      `ssh -F /dev/null`, documents the pending secondary-view race and dedicated
      restricted-key audit, and binds locks to PID plus process-start token. The
      suite is now 30 tests. Because these fixes changed code, a third fresh Opus
      verdict remains mandatory.
  - seat: "opus-5 (independent Gear-3 review of 2072bb4b)"
    objection: >-
      A rejected public key could remain healthy-deferred indefinitely; Telegram
      pending restoration could change byte offsets and create duplicate incident
      IDs; fatal SSH markers lacked an automated test; a stale cursor temporary
      could collide after PID reuse; the operator CLI inherited a permissive umask;
      and wrapper defaults exposed the private Tailnet endpoint and Termux UID.
    status: CONFIRMED
    note: >-
      `1cb51bec` classifies public-key and host-key/configuration failures as
      permanent, removes byte offsets/storage location from the allow-listed event
      identity, adds direct fatal-marker and stale-temp tests, uses random private
      cursor temporaries, sets CLI umask 077, and moves the private target into a
      mode-0600 source-local file. The suite is now 37 tests. Because these fixes
      changed code, a fourth fresh Opus verdict on the evidence head remains
      mandatory.
tests:
