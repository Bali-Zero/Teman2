notes:
  - >-
    This evidence lives at the branch-specific path produced by
    `scripts/ci/evidence_paths.py`; it does not rewrite the shared root evidence
    files. `brief_ref` remains the canonical literal `evidence/brief.yml` because CI
    stages the pair under canonical names before linting.
  - >-
    This pack records evidence, not a verdict. The builder records the independently
    observable prior-SHA verdict but does not claim the hardened evidence head has
    passed, does not post its own `harness/fable-gate`, and does not merge, deploy,
    or load the two source LaunchAgents.
