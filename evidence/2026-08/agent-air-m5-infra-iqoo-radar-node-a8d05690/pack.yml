    This evidence lives at the branch-specific path produced by
    `scripts/ci/evidence_paths.py`; it does not rewrite the shared root evidence
    files. `brief_ref` remains the canonical literal `evidence/brief.yml` because CI
    stages the pair under canonical names before linting.
