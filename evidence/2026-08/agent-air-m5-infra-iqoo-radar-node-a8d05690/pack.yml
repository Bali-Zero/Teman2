    Adds a source-side P0 spool relay, two staged LaunchAgent definitions and
    wrappers, two organism entries, a closed-schema Termux receiver, phone CLI,
    install/boot hooks, and hermetic tests. Pro/Mini relay jobs remain unarmed;
    the only live mutation is the receiver/CLI/boot-hook installation inside the
    authorized iQOO Termux home.
