task_id: iqoo-radar-node-0825
gear: 3
l_level: L2
gate_class: opus
objective: |
  Add the iQOO 15 as a PII-safe reactive fleet pager. Pro and Mini retain raw
  Telegram P0 spools and repair context; the phone receives only a closed-schema
  incident capsule, while existing bounded Sonnet 5 healers remain the repairers
  and an independent Opus 5 session owns the final review gate.
constraints:
  - "Never copy raw logs, client PII, source names, alert keys, free text, credentials, or OSINT to the phone."
  - "The phone is a receipt/pager surface only: it must not run autonomous repair, merge, deploy, or irreversible commands."
  - "Reuse the existing Pro/Mini Telegram P0 spool and healer hierarchy; do not create a competing repair daemon or install an LLM on the phone."
  - "Pro/Mini LaunchAgents and dedicated forced-command keys remain unarmed until independent Opus 5 review; no merge, deploy, or auto-merge is part of this PR."
  - "The Termux receiver must fail closed on unknown fields, remote commands, invalid enums, malformed JSON, and payloads larger than 8 KiB."
acceptance:
  - "The relay and receiver hermetic test suites pass: 18 tests, including PII exclusion, EOF bootstrap, retry safety, replay idempotence, oversize rejection, and remote-command rejection."
  - "Ruff, Ruff format, ShellCheck, plutil, git diff check, organ conformance, and organs-registry validation are clean."
  - "A live synthetic capsule sent to the iQOO is accepted once, recognized as a duplicate on replay, and rejected when an extra free-text field is added; all synthetic phone state is then removed and `radar status` reports zero capsules."
  - "The branch is pushed as a draft PR with auto-merge absent; the source-side relays remain recorded in PENDING-ARMS instead of being loaded."
consumer_map:
  - "Pro P0 Telegram spool -> `scripts/iqoo_radar_relay.py` -> forced-command SSH receiver on the iQOO (staged, deliberately unarmed on Pro)."
  - "Mini P0 Telegram spool -> the same relay and receiver path (staged, deliberately unarmed on Mini)."
  - "iQOO Termux -> `radar status|list|show|health` over mode-0600 closed-schema capsule files."
  - "Existing Pro/Mini Sonnet 5 healers -> independent medium review -> Opus 5 for high-risk/final review; the phone never becomes a repair authority."
risks:
  - "Automatic start after a physical reboot is not proven until the official Termux:Boot add-on is installed from the same signing source, opened once, and one reboot proof is recorded."
  - "Android notification/vibration is unavailable until the optional Termux:API app/package is installed; receipt and inspection still work through the `radar` CLI."
  - "A source node cannot deliver while Tailscale, SSH, or the phone is offline; relay cursors advance only after an exact success/duplicate receipt, so recovery is retry-safe."
  - "The source-side LaunchAgents intentionally remain unarmed pending independent review, so live P0 events are not yet forwarded automatically."
grader: >-
  Independent Opus 5 session, xhigh, fresh context. It must review this branch and
  evidence pack, spot-check the receipts, and alone approve or reject arming. This
  Codex builder does not post its own gate verdict, merge, deploy, or arm auto-merge.
budget: >-
  One non-Anthropic Codex build lane plus one pending independent Opus 5 review lane;
  no paid per-token API and no on-phone model download.
pii: none
