    objection:
      'The file''s own inner frontmatter declares `model: Claude (Anthropic) (pinned lane)` while
      the seat that generated it is tp1-deepseek-v4-pro — either (a) genuine DeepSeek
      self-identification confusion ("actually happens with DeepSeek models trained on synthetic
      data"), or (b) a fabrication artifact suggesting the file wasn''t really generated by that
      seat. INDEX did not mention this anomaly anywhere.'
    status: CONFIRMED
    disposition:
      "accepted (visibility, not a body edit) — this is a real, verified anomaly (squad X had
      already caught and disclosed it in the PR body and issue comments before this refuter pass
      independently confirmed it); left uncorrected in the file body per protocol §7's
      body-never-edited contract, but INDEX §I's Honest-limits paragraph now names it explicitly
      so it is not only in the PR description. Hypothesis (b) is not supported: the run-header
      squad X wrote (which the seat cannot influence) independently records duration_s=343,
      words=3948, prompt_sha256_16 matching the sibling qwen-13 cell's identical prompt hash — all
      consistent with a genuine TP1 API round-trip, not a fabricated file."
