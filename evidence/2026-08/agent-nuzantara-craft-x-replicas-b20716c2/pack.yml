    file: research/operations/2026-08-28-beyond-sota-xfamily/10-organizational-learning-loop--tp1-qwen3.8-max.md
    severity: LOW
    objection:
      "Computing the gap between the file's own `started`/`finished` ISO timestamps
      (17:35:59Z..17:47:08Z) gives 669 seconds, but the file's `duration_s` field says 668 — a
      1-second discrepancy."
    status: PLAUSIBLE
    disposition:
      "survives as a non-issue, not fixed — `duration_s` is measured independently via
      `time.monotonic()` deltas inside the runner (sub-second precision), while `started`/
      `finished` are formatted to whole-second ISO strings; a run whose true wall-clock span was
      e.g. 668.4s prints started/finished timestamps that, naively subtracted as whole seconds, can
      read 1s higher due to rounding on each end independently. Both fields are accurate to their
      own precision; there is nothing to reconcile."
