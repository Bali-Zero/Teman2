    response, byte-for-byte, including one honest anomaly (below) that was left uncorrected."
  - "Same-shape ground pack, not byte-identical: API seats never had filesystem access in the
    original run either (protocol §7 access model) — only a redacted hot-file pack embedded in
    the prompt. This PR's ground pack is freshly built from the same merge-base commit, same
    per-lane brief + protocol §0-§4 shape, not a replay of an unrecoverable original prompt."
  - "PII/OSINT output boundary: every new file scanned for email-shaped and Indonesian-phone-shaped
    strings — zero on all 6 (receipt below)."
  - "Do not weaken any check. This diff answers the deterministic floor with a proportionate pack,
    never by touching evidence_pack_lint.py or harness-floor.yml."
acceptance:
  - text:
      "WHEN any of the 6 new xfamily replica files is read, THEN it SHALL carry the run-header
      contract (panel/lane/seat/model/started/finished/duration_s/exit/words/prompt_sha256_16/
      prompt_chars/snapshot/blind/note/adversarial_review) matching the 59 pre-existing siblings
      byte-for-shape — the `adversarial_review:` field specifically is what the R1 generator!=
      grader gate reads."
    probe: "grep -l '^adversarial_review:'"
  - text:
      "WHEN section headings are counted on any of the 6 new files, THEN it SHALL find all 10
      (## 0 through ## 9) present."
    probe: "grep -c '^## [0-9]'"
  - text:
      "IF `ls research/operations/2026-08-28-beyond-sota-xfamily/` is piped to `wc -l`, THEN it
      SHALL print 65."
    probe: "ls research/operations/2026-08-28-beyond-sota-xfamily/ | wc -l"
  - text:
      "WHEN INDEX §I's coverage matrix is grepped for the deferral marker after this PR, THEN
      it SHALL find zero remaining 'deferred — TP1 quota' cells."
    probe: 'grep -c "deferred — TP1 quota" research/operations/2026-08-28-beyond-sota-panel-INDEX.md'
