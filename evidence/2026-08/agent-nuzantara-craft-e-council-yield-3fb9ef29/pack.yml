spend:
  adversarial_rounds: 2
spend_note: >-
  TWO cross-family blind rounds, exactly at the declared ceiling of 2 and not
  over it. Round 1 was Kimi K3; round 2 was Codex GPT-5.6-sol, dispatched
  BECAUSE the Gear-3 quorum NOTICE said one seat was not enough — and it was
  right: 12 findings, several Kimi never saw, including a `UnicodeDecodeError`
  that broke the tool's one headline contract (exit 0 always) and a family
  misattribution that credited a finding's yield to the model being REVIEWED.
  A notice that names a real gap and gets acted on is the difference between
  a gate and a formality.
  `wall_clock_hours` is deliberately NOT declared as a ceiling — this session
  has no instrument that measures its own wall clock at pack-write time, and
  declaring a ceiling I cannot measure, then staging a spend for it, would be
  theatre.
pii_scan: clean
pii_scan_note: >-
  Seat names and dispositions only. No client data enters this tool at any
  point: it reads `dissent:` blocks written by agents about their own diffs.
tests: >-
  78 in scripts/tests/test_council_yield_report.py. Red-before-green proven,
  not assumed: the 6 AMENDMENTS-extension tests give 3 FAILED against the
  pre-change code, and the 15 refutation-cure tests give 13 FAILED against the
  pre-refutation code. Mutation 14/14 on the cures plus 8/8 on the extension.
static: "ruff clean on both new files; the lint on the surface this PR does not touch (evidence_pack_lint.py) is unchanged."
notes: >-
  Dogfood, the speaking kind: this pack's own `dissent:` block is what the tool
  it ships reads. The `council_yield:` block is deliberately ABSENT here — the
  honest counts for this PR come from `dissent:`, and declaring a block just to
  exercise the override path would be staging evidence for my own instrument.
  The tool's own live output on this corpus is in the receipts.
dissent:
  - seat: "kimi-code/k3 (blind cross-family refuter, code-only payload)"
    objection: >-
      Any non-empty `council_yield:` mapping took the override branch and
      returned before `dissent:` was ever read, so a block carrying only
      `est_tokens:` silently DELETED the pack's entire dissent list — and,
      because the derived counts then read zero findings, also silenced the
      AMENDMENTS antidote on exactly the pack that needed it.
    status: CONFIRMED
    note: >-
      Reproduced on disk before accepting: totals went {findings: 0} with
      AMENDMENTS [] and now read {findings: 1, retracted: 1} with one
      candidate plus a warning naming the cause. An override that overrides
      with nothing is not an override.
  - seat: "kimi-code/k3 (blind cross-family refuter, code-only payload)"
    objection: >-
      `isinstance(True, int)` is True in Python, so `applied: yes` counted as
      one applied finding and `rejected: -3` flowed into the report as a
      negative total; and malformed dissent items were counted then discarded
      at both call sites while the docstring promised they were "never
      silently vanished from the pack's diagnostics".
    status: CONFIRMED
    note: >-
      Cured with this lane's own precedent from days earlier — rule 14's
      `_appetite_numeric`: validate the NUMBER, not the type. A docstring
      describing behaviour the code does not have is worse than silence; it
      tells the next reader not to look.
  - seat: "kimi-code/k3 (blind cross-family refuter, code-only payload)"
    objection: >-
      The markdown fallback FABRICATED findings: the section terminator matched
      h2 only so an `# Appendix` table below it was ingested as phantom seats;
      only the first data row was separator-checked so a second table donated
      its header and `---` as findings; code fences were not stripped so a
      dossier showing the reader an example table was convicted by its own
      illustration.
    status: CONFIRMED
    note: >-
      Cured despite the path having zero live consumers today (1 of 3 dossiers
      parses; 2 are prose-only). Fabricated data is the worst failure mode for
      a tool whose only product is a number people will trust.
  - seat: "kimi-code/k3 (blind cross-family refuter, code-only payload)"
    objection: >-
      `classify_role` filed "kimi-k3 on opus's own diff" as `self` — a KIMI
      seat reviewing an OPUS diff, i.e. the cross-family case the report exists
      to measure, deleted from council yield by a phrase that described the
      SUBJECT rather than the seat.
    status: CONFIRMED
    note: >-
      Real, and curing it birthed the under-match twin TWICE (W94). First my
      own innocence test caught "the build lane, against its own correction"
      flipping to `review` — `its own` is reflexive, `opus's own` names a third
      party. Then the live-corpus diff caught that dropping the dead
      `against its own` had also dropped `this session`, flipping two genuine
      self-refutations. Resolved by MEASUREMENT: the corpus uses "this session"
      both ways, so it is a WEAK signal, decisive only when nothing else
      identifies the seat. Net on the live corpus: 3 distinct seats / 6
      findings move, and family changed for 0 strings.
  - seat: "session (orchestrator on-disk gate, against the implementer's diff)"
    objection: >-
      The AMENDMENTS antidote gated on `used_override`, so it could fire only
      through a schema present in 0 of 54 packs while four real packs carried
      findings with nothing applied. It printed "AMENDMENTS candidates: none"
      over a corpus that was misfiring.
    status: CONFIRMED
    note: >-
      Superscar #2 (Esiste != Armato), in its sharpest form: the antidote to
      "the misfire log was silent while misfiring", built so that it was itself
      silent while the corpus misfired. Now reads both sources and NAMES which
      one each candidate came from.
  - seat: "session (orchestrator on-disk gate, against the implementer's diff)"
    objection: >-
      Eight test assertions froze the corpus as it stood at 15:00 that day —
      packs_scanned == 54, findings == 267, len(seats) == 126 and five more.
      Every one is a moving measurement, not a property.
    status: CONFIRMED
    note: >-
      This would have made the test file a REPO-WIDE merge blocker: the corpus
      grows by one pack on every merged PR, including this one. Proven in both
      directions by creating a 55th pack — old file RC=1 with 3 FAILED, new
      file RC=0. Replaced with invariants that survive growth. One assertion
      deliberately NOT tightened: `unparseable == []` would fail this PR's CI
      over a malformed pack landed by another squad, so what is pinned is that
      nothing vanishes silently, never that the list is empty.
  - seat: "session (orchestrator on-disk gate, against its own first cure)"
    objection: >-
      My `declared_block_still_wins` test asserted the right verdict by a road
      that proved nothing: parsing returns early on `council_yield:`, so a
      scalar override leaves findings empty and a mutant ignoring the block
      entirely also acquits.
    status: CONFIRMED
    note: >-
      Found by a surviving mutant, not by reading. Inverted the fixture so
      honouring the block must CONVICT while ignoring it acquits. A guilt test
      that reaches its verdict by another route is not evidence about the route
      it names.
  - seat: "session (orchestrator, against the spec's stated ground)"
    objection: >-
      The lane spec asserts twice that PR-3's `council:` is "a NEW top-level
      key, additive only". It is not: evidence_pack_lint.py already reads
      `bool(pack.get("council"))` for the R11-CEILING rule, and `council_run:`
      is a third meaning in the same namespace.
    status: CONFIRMED
    note: >-
      Deviation from the spec's literal wording, taken deliberately and stated
      openly. Its INTENT is preserved verbatim; only the token changes, because
      the token it named is occupied. Probed rather than argued: a populated
      `council:` mapping convicts a Gear-3 pack while an EMPTY one passes, so
      adopting the block would have cost a merge precisely on the 0-applied
      case the antidote targets.
  - seat: "codex-gpt-5.6-sol (blind cross-family refuter, round 2, code-only payload)"
    objection: >-
      `except OSError` does not catch `UnicodeDecodeError` (a ValueError), so a
      single undecodable byte in any input propagated out of run() and main()
      and the tool exited non-zero — violating "exit 0 always", its one
      headline contract, on the very path that exists to report unreadable
      inputs gracefully.
    status: CONFIRMED
    note: >-
      Cured on BOTH read paths. Pinning only one is how a mis-aimed mutant
      looks like a passing suite: the first mutation of this line survived
      because it hit load_pack while the only test exercised the markdown
      loader. Two call sites, two proofs.
  - seat: "codex-gpt-5.6-sol (blind cross-family refuter, round 2, code-only payload)"
    objection: >-
      Family precedence scanned the whole seat phrase, so
      `normalize_family("sonnet reviewing codex")` returned `codex-gpt-5.6` and
      `"gemini reviewing kimi"` returned `kimi` — the REVIEWED model became the
      reviewer's family, crediting a finding's yield to the wrong seat in a
      report whose entire product is per-family yield.
    status: CONFIRMED
    note: >-
      The same lesson as the role axis one axis over: identity lives to the
      LEFT of the words that name what was reviewed. Cured with an identity
      cut, and its over-correction twin pinned — a cut that leaves nothing
      nameable falls back to the whole string rather than returning
      `unattributed`.
  - seat: "codex-gpt-5.6-sol (blind cross-family refuter, round 2, code-only payload)"
    objection: >-
      A pack whose only finding is `Harness floor recompute (CI)` emitted
      "council raised findings, applied none" — the AMENDMENTS antidote did not
      filter by role, so deterministic CI gates and self-refutations counted as
      council yield.
    status: CONFIRMED
    note: >-
      This reintroduced the exact review/self/gate pooling the report claims to
      avoid, INSIDE the antidote that is its headline feature. Now only
      REVIEW-role findings count. Measured on the live corpus: candidates went
      4 -> 3 and one pack's count 3 -> 1, i.e. the number got smaller and
      truer.
  - seat: "codex-gpt-5.6-sol (blind cross-family refuter, round 2, code-only payload)"
    objection: >-
      Six more, each with a running trigger: a `seats:` list whose every entry
      is malformed still took the override and zeroed a good `dissent:`;
      `findings: 1, applied: 2` was silently rewritten to findings=2; an
      explicit `self` marker lost to a generic `reviewing`; `est_tokens` was
      promised in `--json` and dropped; an unrelated `Metric/Value` table in
      the section was merged into the findings table; an escaped `\|` split a
      cell; and the same fallback doc named twice was counted twice.
    status: CONFIRMED
    note: >-
      All cured and pinned. ZERO of the round-2 cures move a number on the live
      corpus (family changed for 0 strings, role for 0) — they are latent
      defects, which is exactly the kind a second seat exists to find, and the
      argument for dispatching one even when the first round looked thorough.
  - seat: "codex-gpt-5.6-sol (blind cross-family refuter, round 2, code-only payload)"
    objection: >-
      "There is no per-seat yield: kimi-k3 and kimi-k2 both collapse into one
      `kimi x review` row, and the raw seat string is discarded."
    status: RETRACTED
    note: >-
      Correct as an observation, refused as a defect: collapsing to family IS
      the design (DECISION 1), taken because 126 raw strings fragment one seat
      into dozens and every per-seat number would then be an artifact of
      punctuation. The refuter read the spec's phrase "per-seat" literally
      without the ground that produced it. Kept as written; the auditability
      concern underneath it is real and is answered by `--json`, which carries
      the per-pack detail.
  - seat: "kimi-code/k3 (blind cross-family refuter, code-only payload)"
    objection: >-
      An inline comment claims the scalar-override branch contributes "not to
      the family x role matrix" while the code three lines below adds it, and
      the module docstring says the opposite of the comment.
    status: CONFIRMED
    note: >-
      Code and module docstring agreed with each other, so the inline comment
      was the wrong one. A comment that misdescribes the code beside it sends
      the next auditor hunting a bug that is not there.
