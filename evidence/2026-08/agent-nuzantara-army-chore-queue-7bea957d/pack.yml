dissent:
  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "The Comment-Grep CI Gate Gap": the gate tests for vocabulary in a
      comment, not behavior in code — a developer could delete the real
      kill-switch/heartbeat logic in chore_dispatch.py entirely and CI
      would stay green as long as the wrapper's comment text survives.
      Replicating the sibling's workaround "normalizes" a false-conformance
      pattern repo-wide.
    status: CONFIRMED
    note: >-
      Real and NOT fixed in this PR — this is a PRE-EXISTING gate design
      limitation (documented in this pack's own `risks:` section before
      the dissent round, and already knowingly exploited by the merged
      sibling jules_lane_dispatch_wrapper.sh, not introduced here).
      Hardening the gate itself (e.g. synthetic execution instead of
      static content-scan, per the refuter's own remediation #1) is a real
      follow-up but out of scope for a mechanical gene-birth fix on ONE
      organ — it would need to apply repo-wide to be meaningful, and would
      change the gate's own contract for every other organ using this same
      pattern. This session verified the REAL python-level implementation
      exists and is independently tested (2 new guilt+innocence tests),
      which is the actual guarantee here — the gate's comment-match is not
      being relied upon as the sole proof.

  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "Interactive Bypass vs. Emergency Intent": if an operator runs
      `chore_dispatch.py --dispatch <id>` directly during an incident, the
      CHORE_DISPATCH_ENABLED kill switch is completely bypassed since it
      is only checked in the `--dispatch-next` branch.
    status: PLAUSIBLE
    note: >-
      True as stated, verified by reading main() — but this matches this
      file's OWN documented contract (its module docstring: "a cheap seat
      GENERATES, it never lands anything. Every dispatched chore still
      needs an interactive session's independent verification"): `--list`/
      `--dispatch`/`--harvest` are explicitly session-driven human/agent
      tools, not the automated cron organ this gate is birthing genes for.
      An operator invoking `--dispatch <id>` by hand during an incident is
      a deliberate, attended action — gating it behind the SAME kill switch
      as the unattended daily cron would conflate two different trust
      boundaries this file's own design already separates. Out of scope
      for this mechanical fix; a genuine design question if a future PR
      ever makes `--dispatch`/`--harvest` cron-invoked too (flagged in this
      brief's `risks:` section already).

  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "Sidecar Directory & Permission Preconditions": if `~/.organism/` is
      missing, read-only, or wrong-UID when launchd runs, the error-path
      heartbeat write would itself raise an unhandled exception, masking
      the original dispatch failure.
    status: RETRACTED
    note: >-
      Investigated and does not hold against the actual shipped code —
      retracted. `heartbeat()`'s ENTIRE body (mkdir(parents=True,
      exist_ok=True), tmp-file write, atomic replace) is inside one
      `try/except Exception` block that only `logger.warning()`s on
      failure (read in the diff, not assumed) — the exact same shape as
      scripts/army/jules_lane.py's heartbeat(), which this PR deliberately
      copies. A mkdir/write/permission failure cannot raise past this
      function; it can only fail to observe, never crash the caller. The
      refuter's concern was raised without having read the function body.

  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "Non-Atomic Sidecar Writes": if the heartbeat JSON write is
      interrupted mid-write, the sidecar file can be left truncated/invalid
      JSON, and a concurrent watchdog read could crash or falsely escalate.
    status: RETRACTED
    note: >-
      Investigated and does not hold — retracted. The write goes to a
      pid-suffixed tmp file (`{ORGAN_ID}.json.tmp.{os.getpid()}`) which is
      then atomically `Path.replace()`d onto the final path; a reader can
      only ever see the previous complete file or the new complete file,
      never a partial one. Verified by reading the actual write sequence,
      not assumed from the sibling's pattern.

  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "Success Masking in Schedulers" / "Prolonged Disabled Livelock": a
      naive watchdog that only checks heartbeat mtime/freshness (not the
      `status` field) would read a organ stuck in `status="disabled"` for
      months as fully healthy, while its actual work queue starves.
    status: CONFIRMED
    note: >-
      Real, and identical in shape to a concern already dispositioned on
      PR #5071 tonight (the "zombie pulse" gap) — a property of EVERY
      heartbeat-based organ in this repo's convention (100+ registered
      organs), not something this one PR's mechanical gene-birth fix
      introduces or is scoped to fix. The status field IS present and
      correctly differentiated (disabled/ok/error), which is the
      per-organ half of the contract; a smarter fleet-wide watchdog that
      reads `status` rather than mtime alone is a real, repo-wide follow-up
      — declared residual limit, not silently dropped.

