risks:
  - "The organ-conformance gate's content-scan only reads the FIRST
    resolvable wrapper file in the plist's argv chain
    (chore_dispatch_wrapper.sh), never the python file it execs — so the
    gate is provably satisfiable by a comment alone, with zero guarantee
    the described behavior is real. This is a PRE-EXISTING gate design
    limitation (already exploited, knowingly, by the merged sibling
    jules_lane_dispatch_wrapper.sh) — not introduced by this PR, and out of
    scope for a mechanical gene-birth fix to harden. This session
    independently verified the real python-level heartbeat/kill-switch code
    exists and is tested (not just the comment), which is the actual
    guarantee here, not the gate."
  - "chore_dispatch.py's other three subcommands (--list/--dispatch/
    --harvest) still have no heartbeat coverage — by design (they are
    session-driven tools, not the cron organ this gate is judging), but a
    future change that makes any of them cron-invoked would need its own
    genes-birth pass; this is a real edge the registry entry's `notes`
    field does not currently flag."
  - "runtime/host in the new registry entry (mini_launchd / mini) follows
    the plist's own documented placement, which is NOT consistent with
    where its two sibling lanes (army.jules_dispatch, army.spark_lane) are
    actually registered (both pro_launchd/pro) despite the plist's comment
    claiming to match them — a pre-existing doc-accuracy question in the
    PR's own plist comment, not something this mechanical fix resolves or
    should resolve."
