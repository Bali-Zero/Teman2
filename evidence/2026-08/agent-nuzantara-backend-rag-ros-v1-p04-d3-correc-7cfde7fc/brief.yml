    are the direct next consumers of this correction's pattern (both the comment-truthfulness
    fix and the `pending_ruling` mechanism, if any of their own fields turn out to await a
    similar ruling)."
  - "Zero / the conductor: the actual ruling on matrix items 0 and 6 (new PENDING-ARMS row) is
    a business decision this PR explicitly does not make."
risks:
  - "`extensions` participating in `object_hash` means every already-adapted `ActionItem` from
    the pre-correction code has a DIFFERENT `object_hash` than the same row adapted after this
    correction. Confirmed harmless today (no hardcoded hash literal, no parity-probe hash
    comparison, zero persistence) -- but this stops being free the moment any future PR
    persists these objects or compares hashes across adapter versions; flagged here so that
    future work does not discover it by surprise."
  - "The `pending_ruling` marker is itself a disclosure mechanism, not a gate -- nothing in this
    PR prevents a downstream consumer from ignoring `pending_ruling` and treating `priority`/
    `current_intent_ref` as authoritative today. That is an accepted, pre-existing property of
    the whole `unbacked_refs`/`pending_ruling` disclosure design (already true of `unbacked_refs`
    since PR #4749; not new to this correction)."
