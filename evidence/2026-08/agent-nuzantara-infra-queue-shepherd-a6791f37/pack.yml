dissent:
  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "The Zombie Pulse Gap": a heartbeat written on both success and
      failure paths means a crash-looping organ still ticks fresh
      heartbeats every run — a naive mtime-only watchdog would read the
      organ as 100% healthy while 0% of its real payload executes, unless
      the payload explicitly differentiates status.
    status: CONFIRMED
    note: >-
      The status-differentiation half is already handled — verified by
      reading the actual diff, not assumed: `_write_heartbeat("error", ...)`
      vs `_write_heartbeat("ok", ...)` are distinct branches, and the error
      branch carries `str(exc)` in metadata, so a status-aware monitor CAN
      distinguish a crash-loop from healthy work. The residual risk (a
      naive mtime-only monitor still can't) is real but is a property of
      EVERY heartbeat-based organ in this repo (100+ registered organs use
      the identical status-field convention) — not something introduced or
      fixable by this one PR's mechanical gene-birth fix. Declared residual
      limit, not silently dropped.

  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "Control Flow & Exception Bypasses": `except Exception` misses
      `BaseException` subclasses (KeyboardInterrupt, SystemExit) and an
      early `return` added by a future refactor would silently skip the
      success heartbeat; a hang in a blocking I/O call inside tick() would
      reach neither heartbeat path at all.
    status: PLAUSIBLE
    note: >-
      Real in the general case but low-probability for THIS organ: it runs
      non-interactively under launchd (no KeyboardInterrupt path), and
      tick() has exactly one early return (the kill-switch branch — now
      itself heartbeat-covered per the fix below) with no other return
      before the success heartbeat, verified by reading the full function
      body. The blocking-hang case is real and NOT mitigated here (no
      timeout wrapping this PR's `gh api` calls) — out of scope for a
      mechanical gene-birth fix; a hang would show up as a stale heartbeat
      after `expected_hb_seconds`, which is exactly what the staleness
      monitor this organ registers for is built to catch.

  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "The G5 Kill-Switch Inconsistency": when QUEUE_SHEPHERD_ENABLED=false,
      tick() returned 0 without writing any heartbeat at all — verified true
      by reading the code — so the conformance gate has no way to tell
      "alive but intentionally idle" from "dead", risking a false staleness
      alert (or a false "healthy" read) for an organ deliberately switched
      off.
    status: CONFIRMED
    note: >-
      Confirmed by direct code inspection, then FIXED in this same PR (not
      deferred): the kill-switch early-return branch in tick() now calls
      `_write_heartbeat("disabled", {"reason": "QUEUE_SHEPHERD_ENABLED=false"})`
      before returning. A new test
      (test_kill_switch_writes_a_disabled_heartbeat_not_silence) asserts the
      written JSON's status and reason field; full suite re-verified green
      (55 passed) after the fix. This directly matches G5's documented
      contract ("writes final heartbeat status=disabled") that the
      pre-existing kill switch had not actually satisfied.

  - seat: agy (Gemini 3.1 Pro, cross-family refuter)
    objection: >-
      "Filesystem & Concurrency Hazards": non-atomic writes could produce
      torn reads for a concurrent watchdog, and the parent directory
      (~/.organism/last_seen) might not exist on first run.
    status: RETRACTED
    note: >-
      Investigated and does not hold against the actual shipped code —
      retracted, not merely disputed. `_write_heartbeat()` already does
      `ORGANISM_DIR.mkdir(parents=True, exist_ok=True)` then writes to a
      pid-suffixed tmp file and atomically `Path.replace()`s it onto the
      final path (read in the diff, not assumed) — exactly the tmp+rename
      pattern the refuter itself recommended, already present before this
      dissent round (mirrors dlq_autopilot.py's existing organ-heartbeat
      pattern per the function's own docstring). The refuter's concern was
      raised without having read that helper; this session verified the
      atomic-write code before retracting.

