pii_scan_note:
  "No client data of any kind is touched. The diff is one CI workflow plus this pack; the corpus it
  arms fakes `gh` and `ssh` as executables and reads nothing from a real spool. The P0 spool records
  that motivated the sibling PR #5433 carry a `text` field that can hold client PII — deliberately
  never read, quoted, or counted here, in code or in prose."

