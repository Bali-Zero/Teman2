pii_scan: clean
pii_scan_note:
  "No client data of any kind is touched. The diff is one CI workflow plus this pack; the corpus it
  arms fakes `gh` and `ssh` as executables and reads nothing from a real spool. The P0 spool records
  that motivated the sibling PR #5433 carry a `text` field that can hold client PII — deliberately
  never read, quoted, or counted here, in code or in prose."

spend:
  wall_clock_hours: 2
  adversarial_rounds: 2

appetite_exceeded: |
  Both ceilings doubled, for one reason: the gate returned REWORK-BUILD on a defect this pack had
  declared PROVEN. The round-1 proof ran the step body under a bare local `bash`; CI runs
  `bash -e {0}`, so the three "each RUN rather than reasoned about" rows described a shell no run of
  this workflow will ever use. Round 2 is the re-measurement under the right shell, the one-line
  cure, and the reinstatement of a cross-family finding round 1 had wrongly retracted.

  Recorded rather than absorbed, because the overrun is the useful part: an appetite set from how
  big the change looks (one workflow file, four paths) cannot price a round spent discovering the
  harness was wrong. The declared ceiling was honest and the estimate was still bad — which is an
  argument for measuring under the target harness in round 1, not for declaring a larger appetite.

