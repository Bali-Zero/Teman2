brief_ref: evidence/brief.yml
council_run: "journal.jsonl"
plan_ref:
  "PR (agent/nuzantara/infra/queue-doctor-arm, base main) — 'ci(arm): give the queue-doctor corpus an
  executor that can go red'. No separate governing mandate: this is the arming half of PR #5433,
  split out because #5433 is armed and therefore frozen (Agent PR Contract rule 2)."
lanes:
  - lane: queue-doctor-arm-build
    role: build
    seat:
      claude-opus-5 (conducting session — measured the absence with a positive control, wrote the
      workflow, ran the three cross-family seats itself, applied the one seat's findings by hand,
      and wrote this pack; no reviewing seat has write access to this tree)
  - lane: queue-doctor-arm-council-kimi
    role: review
    seat: kimi-code/k3 (UNAVAILABLE — weekly quota, see journal.jsonl)
  - lane: queue-doctor-arm-council-codex
    role: review
    seat: codex-gpt-5.6-sol (UNAVAILABLE — workspace out of credits, see journal.jsonl)
  - lane: queue-doctor-arm-council-gemini
    role: review
    seat: >-
      agy/gemini-3.1-pro (verdict NO-GO — the only seat that answered, and it changed the artifact:
      three findings confirmed and fixed, four refuted by measurement, one written into the file as
      a promotion instruction; see journal.jsonl and dissent below)

what_changed: |
  One new file, `.github/workflows/queue-doctor-tests.yml`, plus this evidence pack.

  It triggers on `pull_request` and on `push` to main, over a path list that is the corpus's actual
  read-set: the corpus, the script it drives as a subprocess, `scripts/tests/conftest.py` (autouse
  fixtures), and the workflow itself. The two lists are symmetric, this file included. There is NO
  `merge_group:` trigger, so the `paths:` filter has nothing to diverge from — the head-green /
  queue-red split a filter can create needs both.

  One job step installs pytest and runs the corpus ONCE, then asserts on the number of cases that
  PASSED. Not on the exit code alone, which is 0 when every case is skipped; not on the collected
  count, which counts skipped cases too. The capture is guarded `|| RC=$?` so that pytest's own
  output, tracebacks included, survives to be printed before any verdict is reached.

  ROUND 2 also added the FIFTH file, and it was CI that named it: `check_watcher_coverage.py` went
  red with "`queue doctor tests` (queue-doctor-tests.yml) is not covered by
  main-push-failure-watch.yml". A workflow that runs on `push: main` and is watched by nobody is
  armed to the second layer only — the trigger exists and covers the right paths, but a red on main
  reaches no one. The sibling `mq-oracle-tests.yml` IS in that list; this one was not, which is the
  same failure-to-transfer as the shell defect, caught this time by a lint instead of a gate.

  ROUND 2. The first version of this file wrote that capture BARE and this summary claimed `set -e`
  was "deliberately absent" — both false. A `run:` block with no `shell:` key runs under GitHub's
  default `bash -e {0}`, which `set -uo pipefail` does not clear, so the bare capture aborted the
  step the instant pytest failed: no output, no `::error::`, red with an EMPTY log and pytest's exit
  code in place of the step's own. Caught by the gate, then re-measured under `bash -e` (below).

proof: |
  The absence, measured with a positive control in the same command:
    grep -rln 'test_queue_doctor' .github/   -> 0 hits
    grep -rn  'test_organism_stale_detector' .github/workflows/*.yml -> 3 hits (organ-conformance.yml)

  The floor, from the real tool rather than by inspection:
    evidence_pack_lint.py --print-floor --changed-files-file <changed> -> 3   (hot-zone path)

  actionlint on the new file: clean.

  The step's three branches, each RUN rather than reasoned about, against the corpus as it stands on
  main (fourteen cases):
    innocence, FLOOR=14                     -> "queue doctor corpus: 14 passing cases (floor 14)", rc 0
    guilt, corpus shrank (FLOOR=15)        -> "::error::... below the floor of 15", rc 1
    guilt, nothing collected (-k no-match) -> pytest exit 5, caught by the RC branch, rc 1
    guilt, corpus ENTIRELY SKIPPED         -> rc 1

  ROUND 2 — the same branches RE-RUN under GitHub's own shell, which is what the first round got
  wrong. Those four rows were measured under a bare local `bash`; CI runs `bash -e {0}`. Both
  shells, same corpus, same step body, before and after the `|| RC=$?` guard:

    probe                       BARE capture (as first shipped)      `|| RC=$?` (as shipped now)
    innocence, corpus green     rc 0, verdict line                   rc 0, verdict line
    guilt, a test really fails  rc 1, ZERO lines of log              rc 1, full traceback + ::error::
    guilt, -k matches nothing   rc 5, ZERO lines of log              rc 1, "14 deselected" + ::error::
    guilt, entirely skipped     rc 1, ::error:: printed              rc 1, ::error:: printed

  Two things that table says and the prose above did not. First, the bare form still went RED on
  every guilt probe — it DETECTED and could not SPEAK, which is a diagnosability defect, not a
  fail-open; saying otherwise would overstate it. Second, the skipped-entirely branch was never
  affected either way, because pytest exits 0 there and errexit has nothing to trip on: the defect
  was confined to the pytest-non-zero class, which is the only class anyone reads this log for.

  That last one deserves its own line, because a branch that cannot be reached is not a guard. It
  was proved reachable on a scratch module carrying `pytestmark = pytest.mark.skip`: pytest exits 0
  and prints "2 skipped", no "N passed" line appears, and the step goes red saying so. Writing a
  fail-closed branch that no input can reach is W101, and this one is not that.

dissent:
  - seat: agy/gemini-3.1-pro (cross-family review seat, verdict NO-GO)
    objection:
      "setup-python provisions a clean interpreter (pip/setuptools/wheel only) and the draft never
      installed pytest, so the corpus would have died on `No module named pytest`."
    status: CONFIRMED
    resolution:
      "Added `pip install --quiet pytest` — the same line organ-conformance.yml:155 carries, minus
      pyyaml, since this corpus is stdlib-only."
  - seat: agy/gemini-3.1-pro
    objection:
      "A green that hides an empty run: pytest exits 0 when every case is SKIPPED, and
      `--collect-only` counts skipped cases, so the draft's collection floor could pass with zero
      assertions executed."
    status: CONFIRMED
    resolution:
      "The assertion is now on cases that PASSED, from one run. Proved reachable on a scratch module
      carrying `pytestmark = pytest.mark.skip` — pytest exits 0, prints '2 skipped', no 'N passed'
      line appears, step goes red. A fail-closed branch no input can reach is W101; this one is not."
  - seat: agy/gemini-3.1-pro
    objection:
      "`scripts/tests/conftest.py` was missing from the path list, and its fixtures are autouse, so
      a change there breaks this corpus while touching none of the listed paths."
    status: CONFIRMED
    resolution: "Added to both path lists, with the reason written beside it."
  - seat: agy/gemini-3.1-pro
    objection:
      "`actions/checkout@v7` and `actions/setup-python@v7` do not exist (current are v4 and v5), so
      the runner fails at step resolution."
    status: RETRACTED
    resolution:
      "Measured: this repo uses checkout@v7 in 117 workflows and setup-python@v7 in 70. A
      knowledge-cutoff error, not a defect. The file matches the house standard."
  - seat: agy/gemini-3.1-pro
    objection: "`scripts/mq.sh` belongs in the read-set, since it wraps queue_doctor in production."
    status: RETRACTED
    resolution:
      "The corpus never invokes mq.sh — measured, zero references; it drives queue_doctor.py
      directly as a subprocess. Listing it would arm this workflow on edits it cannot judge."
  - seat: agy/gemini-3.1-pro
    objection: "`2>/dev/null` discards pytest's traceback, leaving only a generic message."
    status: CONFIRMED
    resolution:
      "Retracted in round 1, reinstated in round 2 — the retraction was the error. The MECHANISM the
      seat named was genuinely gone (the `2>/dev/null` belonged to a draft that ran the suite twice),
      and refuting the mechanism was treated as refuting the OUTCOME. It was not: under GitHub's
      `bash -e {0}` the bare capture aborted before the printf, so a failing corpus produced no
      traceback at all — strictly worse than the generic message the seat feared. The seat was right
      about what the reader would end up holding and wrong only about which line took it away.
      Fixed by `|| RC=$?`; re-measured under `bash -e`, both columns in `proof:`."
  - seat: agy/gemini-3.1-pro
    objection: "push/pull_request asymmetry: push filters `branches: [main]`, pull_request names no branches."
    status: RETRACTED
    resolution:
      "The comment's symmetry claim is scoped to the PATH list, which is symmetric. The sibling
      mq-oracle-tests.yml has the identical branch shape."
  - seat: agy/gemini-3.1-pro
    objection:
      "If this becomes a Required Status Check, a PR touching none of the filtered paths hangs
      forever on 'Expected — Waiting for status to be reported'."
    status: CONFIRMED
    resolution:
      "True, and not fixable here: promotion happens in repo settings. The instruction to drop the
      pull_request filter first — the shape organ-conformance.yml already uses — is now written into
      the workflow file, where the next reader meets it."
  - seat: claude-opus-5 (conducting session, on its own council)
    objection:
      "Two of three cross-family seats were UNAVAILABLE on quota within the same hour, so this pack
      rests on ONE outside opinion, not three."
    status: CONFIRMED
    resolution:
      "Said plainly rather than presented as a council. The R9 council_run quorum NOTICE is expected
      here and is not being explained away."

