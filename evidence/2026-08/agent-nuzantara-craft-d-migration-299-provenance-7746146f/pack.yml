dissent:
  - seat: codex gpt-5.6-sol (non-Anthropic refuter, migration class)
    objection: >-
      FIVE CONFIRMED-DEFECTs and one PLAUSIBLE. (A) the rollback is not the exact
      inverse — ADD IF NOT EXISTS / DROP IF EXISTS would take a pre-existing
      column, and ADD CHECK takes ACCESS EXCLUSIVE. (B) `pg_constraint.conname`
      is not globally unique, so a same-named constraint on ANY table makes the
      guard skip the ADD silently. (C) `current_user` is the effective role, not
      the actor; a bare membership without SET ROLE is invisible, contrary to the
      docstring; and `applied_via` is env-spoofable with Fly-before-CI precedence
      wrong, because `flyctl ssh console` FROM CI carries FLY_APP_NAME. (D) THE
      DEPLOY-BREAKER: migrations 165/166 self-insert symbolic checksums that
      ON CONFLICT DO NOTHING never replaces, so the audit reports mismatches on a
      healthy database. (E, PLAUSIBLE) the allowlist is keyed on number alone, so
      a renumbered row bypasses verification. (F) the tests CREATE/DROP a table
      literally named `_schema_versions` on TEST_DATABASE_URL, and the provenance
      probe omits table_schema.
    status: CONFIRMED
    note: >-
      ALL SIX ACTED ON. D cured at the CLASS rather than the two instances it
      named — shape-matching (64-hex = real, anything else symbolic), which is
      what surfaced a THIRD literal and, through the new test, a FOURTH
      attribution (194 backfills 107's row). E closed by keying on the
      (number, name) pair. F closed on both halves: a unique per-run scratch
      table with an assertion refusing the real ledger name, and a
      table_schema-scoped probe. B scoped to conrelid. C now records
      session_user when it differs, flips the precedence to GITHUB_ACTIONS/CI
      first, and the docstring's overclaim about role membership is corrected in
      place rather than softened. A is ACCEPTED WITH REASON and documented in the
      migration itself: PostgreSQL does not record which column an
      `ADD IF NOT EXISTS` created, the three names appear nowhere else in
      migrations_v2, and the ACCESS EXCLUSIVE scan is negligible on a ledger of
      this size — a narrow, written limit rather than an unknown one.

