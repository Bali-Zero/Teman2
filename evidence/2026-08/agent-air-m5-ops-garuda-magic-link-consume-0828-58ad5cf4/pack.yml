ground_truth_lane_absent_note:
  "Declared rather than overridden: the diff matches a ground-truth PATH
  glob (it touches apps/mouth pages) but adds no ground-truth CLAIM. There is no regulation, article
  number, KBLI code, visa rule, deadline or price anywhere in it — the only customer-facing prose added
  is a button reading 'Continue', a 'link no longer valid' notice, and an email link label changed
  from 'View my VOA result' to 'Continue my application' to match the destination this PR moves
  it to. Nothing here is checkable against NotebookLM, so a {role: ground_truth, seat, nb, query_hash}
  lane would have to invent a query_hash to satisfy a linter. `seat_override` was deliberately NOT used,
  because in this script it is shared with the council_run rule and would have silenced a cross-family
  review this PR actually ran."
pii_scan: clean
pii_scan_note:
  "No client PII anywhere in the diff. Every test fixture is synthetic and obviously so
  ('t'.repeat(40), 'R'.repeat(24), visitor@example.com, probe@example.com). The live probes used
  a synthetic eligibility payload — nationality/dates/booleans only, no name, passport or document.
  The token values in this pack and in every log line the new code emits are absent by construction:
  the handlers log status codes and component/action, never the token or the URL carrying it, and that
  is asserted by test ('never echoes the token back into the redirect'). One production magic-link
  probe used probe@example.com against a non-enumerating 202, so no real address was involved."
dissent:
  - seat: claude-sonnet-5 (spalla-review refuter)
    objection:
      "BLOCKER — the landing PAGE leaks the single-use token to Google: the root layout renders
      <GoogleAnalytics> and GA4's page_view carries page_location = document.location.href, so the credential
      ships to a third party on load, before the customer touches anything. The page's own docblock reasoned
      about Sentry Session Replay and missed GA autotrack."
    status: CONFIRMED
    resolution:
      "ACCEPTED and fixed structurally, not per-vendor. Verified independently first (the gtag
      id is live in production HTML; RouteChangeTracker.tsx:33 sends the full href). The page was replaced
      by a GET route handler that runs no layout, loads no script and returns no document — so the token
      URL renders nothing at all — and the page a human sees now carries NOTHING. Commit 2. (Corrected:
      the redirect target has no query at all — `route.ts:107`.)"
  - seat: claude-sonnet-5 (spalla-review refuter)
    objection:
      SHOULD-FIX — `setCookies.length === 0` checks that SOME cookie came back, not that the
      ACCOUNT cookie did. If the backend ever emits an unrelated cookie on the no-op/replay 204 path,
      an unauthenticated visitor is redirected onto the authenticated upload page.
    status: CONFIRMED
    resolution:
      "ACCEPTED and fixed: now `forwarded.some(c => c.startsWith('garuda_session='))`, with
      a test that sends a 204 carrying only an unrelated cookie and asserts the failure redirect. The
      mutation swapping the name check back for a length check turns that test red."
  - seat: claude-sonnet-5 (spalla-review refuter)
    objection:
      SUGGESTION — sentry.server.config.ts / edge.config.ts have no query scrubbing, and it could
      not be confirmed or ruled out that Next's Sentry instrumentation captures the full URL (with the
      token) on server transactions.
    status: PLAUSIBLE
    resolution:
      "NOT FIXED, ACCEPTED AS RESIDUAL AND DECLARED. Out of scope for this PR and NOT claimed
      clean: the risks section and the new route's own docblock both state that the token remains in
      the URL of one first-party GET and can therefore reach Vercel's access log or a server-side Sentry
      transaction. Left as a named follow-up rather than an unstated assumption."
  - seat: claude-sonnet-5 (spalla-review refuter)
    objection:
      NITs — the formData() catch branch is untested; the UPPER length boundaries (token 2048,
      result_id 128) have no boundary tests while the lower ones do; a double-click submits twice and
      the second POST shows 'link no longer valid' even though the first succeeded.
    status: PLAUSIBLE
    resolution:
      ACKNOWLEDGED, not fixed. The catch branch fails closed already; the upper bounds are correct
      by inspection and mirror the backend, which is the real boundary; the double-submit case is a confusing
      message, never an unsafe state (the session is already granted). Recorded rather than silently dropped.
  - seat: session (self-correction)
    objection:
      "Two claims this session made mid-investigation were WRONG and were retracted before they
      reached the diff: (a) that the Vercel proxy and Fly disagreed structurally (a 503 through the proxy)
      — it was transient, and the next three attempts were 201/201/201; (b) that curl had refused the
      cookie — the jar filter excluded lines starting with '#', which is exactly how curl writes HttpOnly
      cookies. Both were broken probes, not findings."
    status: RETRACTED
    resolution:
      RETRACTED and recorded. Neither reached a design decision. Kept here because a pack that
      lists only the claims that survived reads as if none had to be withdrawn.
  - seat: claude-sonnet-5 (two contract-mapping subagents)
    objection: No report delivered — both went idle twice without producing their findings.
    status: CONFIRMED
    resolution:
      REPLACED BY DIRECT VERIFICATION. The session re-ran every question itself (proxy runtime
      and Set-Cookie path, base-URL resolution, exchange contract, origin allow-list, cookie attributes,
      flag gate, result_id and token patterns), each cited by file:line in the two commits. Recorded so
      that three declared review lanes are not read as three lanes of coverage.
  - seat: codex-gpt-5.6-sol (cross-family council)
    objection:
      "BLOCKER — the exchanged token and the redirect target were not bound. The token came from
      the pending cookie; result_id came from a hidden form field. Two tabs: open link A, then link B
      overwrites the shared cookie; submit tab A and token B is redeemed while the browser lands on /upload/A.
      A forged hidden field does the same deliberately."
    status: CONFIRMED
    resolution:
      "ACCEPTED and fixed at the root: both halves now travel together in the ONE pending cookie
      (`encodePending`/`decodePending` in contract.ts), the form carries no fields at all, and a forged
      result_id is ignored because nothing reads the body. Verified in my own code before acting on the
      report — exchange/route.ts:92 took it from `form.get('result_id')` and :158 redirected with it.
      Two new tests bite: the two-tab overwrite asserts the redeemed token and the upload URL name the
      SAME application, and the forged-field test asserts the cookie decides. Reverting the binding turns
      3 tests red."
  - seat: codex-gpt-5.6-sol (cross-family council)
    objection:
      SHOULD-FIX — the POST's comment claimed the pending cookie is cleared on EVERY path out,
      but the flag-off 404 returned before the clear was even computed. The comment was the defect.
    status: CONFIRMED
    resolution:
      "ACCEPTED. `clear` is now computed before the flag gate and attached to the 404 too. Test:
      'clears the pending cookie even on the flag-off 404'. This is the second lying comment this diff
      has had to fix, which is the pattern worth naming: a comment asserting a universal ('every path',
      'nothing here carries it') is a claim that needs a test, not prose."
  - seat: kimi-code/k3 AND codex-gpt-5.6-sol, independently
    objection:
      BLOCKER — login CSRF / session fixation. An attacker requests their OWN magic link and
      induces the victim to top-level-navigate to it. The pending cookie is set, the victim sees a GENERIC
      'Continue your application', clicks, and the ATTACKER's account session is planted in the victim's
      browser — which then uploads a passport into the attacker's application for the attacker to read
      later.
    status: CONFIRMED
    resolution:
      "CONFIRMED AND NOT CLOSED IN THIS PR — recorded as the gating condition for promotion,
      not for merge. Two seats of different families reached it independently, so it is not one refuter's
      imagination. It cannot be closed from the frontend: every complete fix needs the recipient's identity
      shown on the continuation page ('Continue as a***@example.com'), and the backend exposes no NON-CONSUMING
      lookup from token to email — `exchange` is the only reader and it burns the token. The store does
      hold `email` beside `token_hash` and `result_id` (magic_link_store.py, INSERT at :285), so the endpoint
      is buildable; it is the immediate follow-on PR. Merging this PR does not expose it: `GARUDA_PUBLIC_ENABLED`
      is off on Vercel, every surface in this diff re-checks it, and the mandate is a dark launch. What
      ships now is a one-sentence mitigation on the page ('Continuing opens the application this link
      was emailed for. If you did not ask us for it, close this page instead.') which is a mitigation
      and is labelled as one in the code."
  - seat: kimi-code/k3 (cross-family council)
    objection:
      "Proposed fix for the login-CSRF finding: switch the pending cookie from SameSite=Lax to
      SameSite=Strict, which 'would break the attack chain at the continue-page step while keeping the
      legitimate email flow'."
    status: PLAUSIBLE
    resolution:
      "REJECTED, and the reason is the one the proposal does not account for. Under Strict the
      browser withholds the cookie on a request whose navigation was cross-site-INITIATED, and the redirect
      from the landing handler to ./continue is part of that same navigation chain. A click in a NATIVE
      mail client has no initiator and would work; a click in WEBMAIL (Gmail in a browser, which rewrites
      links through google.com) is cross-site-initiated and would NOT send the cookie — the legitimate
      customer would be told the link is no longer valid. That is the majority of users for this product.
      Declared honestly as REASONED, NOT MEASURED: I did not build a two-origin browser fixture to observe
      it, so this is an argument from the SameSite redirect-chain rule and the well-known 'Strict breaks
      email links' behaviour, not an experiment. If it is wrong, Strict becomes the cheap fix and the
      follow-on PR is unnecessary — which is exactly why the login-CSRF entry above names the backend
      endpoint as the fix rather than this."
  - seat: codex-gpt-5.6-sol + kimi-code/k3 (both)
    objection:
      SHOULD-FIX — the account-cookie check tested only the name prefix, so `garuda_session=`
      with an EMPTY value (which is how a cookie is DELETED) would read as a successful sign-in and send
      an anonymous visitor to the authenticated upload page.
    status: CONFIRMED
    resolution:
      "ACCEPTED. `hasAccountSession` in contract.ts now requires a non-empty value. Test: 'rejects
      an account cookie whose value is EMPTY (that is a deletion)'. Reverting it turns 1 test red. Note
      this is the THIRD tightening of the same three-line check across three review rounds (presence ->
      name -> name+value), which is the shape rule 8 warns about; it stops here because the check now
      asserts the property that actually matters."
  - seat: codex-gpt-5.6-sol (cross-family council)
    objection:
      SHOULD-FIX — the exchange POST validated no Origin/Sec-Fetch-Site. SameSite=Lax stops an
      ordinary cross-site POST but NOT one from a sibling subdomain, which is same-site.
    status: CONFIRMED
    resolution:
      "ACCEPTED. CORRECTED after the Gear-3 gate caught this entry describing a behaviour the
      diff does not have: an earlier draft refused an ABSENT `Sec-Fetch-Site`, and the same commit that
      changed it left this text behind. What ships (`exchange/route.ts:98-110`) requires `Sec-Fetch-Site:
      same-origin`, OR an absent header together with an exactly-matching `Origin` — because Safari before
      16.4 and some in-app mail webviews send no Fetch Metadata, and an emailed link is precisely what
      opens in a webview. The vector is still closed: cross-site and same-site are refused regardless
      of `Origin`, the fallback is unreachable for any browser that does send the header, and a sibling-subdomain
      `Origin` is refused by a named test. FIVE tests bite, not four."
  - seat: codex-gpt-5.6-sol (cross-family council)
    objection:
      SHOULD-FIX — the landing's flag-off branch returned a bare 404 while the request URL still
      held the token, so it could reach a cache or the next page's Referer. Proposed a 303 to a token-free
      page instead.
    status: CONFIRMED
    resolution:
      "PARTIALLY ACCEPTED, deliberately diverging on the remedy. The 404 now carries `Cache-Control:
      no-store` and `Referrer-Policy: no-referrer` (test bites). It stays a 404 rather than becoming a
      redirect because while the funnel is dark this route must be indistinguishable from one that does
      not exist, and a dark funnel issues no links — so there is no live token to strip, while a 303 would
      confirm the route to anyone probing. Concealment beats sanitisation on a path where the credential
      cannot exist."
  - seat: codex-gpt-5.6-sol (cross-family council)
    objection:
      BLOCKER — a POST does not prove a human gesture. A cookie-preserving sandbox could GET
      the emailed URL, follow the 303, parse the plain form and POST it, consuming the token. Proposed
      a server-verified human-presence challenge.
    status: PLAUSIBLE
    resolution:
      ACCEPTED AS RESIDUAL, not fixed, and the overclaiming comment corrected. What POST-only
      actually buys is that no PASSIVE fetch spends the token — GET/HEAD/prefetch/redirect-following do
      not, which is the behaviour mail scanners and link-preview bots actually exhibit. A sandbox that
      parses and submits forms is a different adversary, and a challenge in front of every emailed link
      is a product cost this dark launch does not justify. The doc comment claiming 'the POST that a human
      gesture produces' now says so plainly instead.
  - seat: claude-opus-5 (Gear-3 gate, independent)
    objection:
      The forwarded account cookie keeps the backend's `Domain=.balizero.com`. On a Vercel PREVIEW
      host (non-apex) the browser drops it, while `hasAccountSession` — which reads header text, not the
      jar — still redirects to the authenticated page. A 'signed in but not' state.
    status: CONFIRMED
    resolution:
      "ACCEPTED AS RESIDUAL, production unaffected. It follows from this brief's own forward-verbatim
      constraint: the account cookie's attributes are the backend's runtime choice (`get_cookie_domain()`),
      and re-deriving them here is the drift that constraint exists to prevent. Raised independently by
      Kimi K3 and by the third review as a NIT on preview hosts only. Not fixed here because the fix belongs
      on the backend side of that boundary, not in a frontend override."
  - seat: claude-opus-5 (Gear-3 gate, independent)
    objection:
      "CI never sees the council attestation. The floor-recompute job copies `pack.yml` ALONE
      into /tmp, so `council_run: journal.jsonl` — declared relative to the pack dir — cannot resolve
      there. CI emits the 'no council_run journal' NOTICE where the same lint is silent locally."
    status: CONFIRMED
    resolution:
      "CONFIRMED as a defect of the HARNESS, not of this PR, and deliberately not fixed inside
      it (a diff that touches the floor-recompute workflow is its own hot-zone concern). Consequence worth
      stating plainly: the cross-family review requirement is currently UNENFORCED in CI — it passed here
      because two seats really did review, evidenced by journal.jsonl and by the findings they produced,
      not because a gate compelled it. Recorded for its own PR."
council_run: journal.jsonl
