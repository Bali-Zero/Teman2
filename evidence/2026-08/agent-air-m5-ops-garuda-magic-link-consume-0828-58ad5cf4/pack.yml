ground_truth_lane_absent_note:
  "Declared rather than overridden: the diff matches a ground-truth PATH glob (it touches
  apps/mouth pages) but adds no ground-truth CLAIM. There is no regulation, article number, KBLI
  code, visa rule, deadline or price anywhere in it — the only customer-facing prose added is a
  button reading 'Continue', a 'link no longer valid' notice, and an email link label changed from
  'View my VOA result' to 'Continue my application' to match the destination this PR moves it to.
  Nothing here is checkable against NotebookLM, so a {role: ground_truth, seat, nb, query_hash}
  lane would have to invent a query_hash to satisfy a linter. `seat_override` was deliberately NOT
  used, because in this script it is shared with the council_run rule and would have silenced a
  cross-family review this PR actually ran."
pii_scan: clean
pii_scan_note:
  "No client PII anywhere in the diff. Every test fixture is synthetic and obviously so ('t'.repeat(40),
  'R'.repeat(24), visitor@example.com, probe@example.com). The live probes used a synthetic eligibility
  payload — nationality/dates/booleans only, no name, passport or document. The token values in this
  pack and in every log line the new code emits are absent by construction: the handlers log status
  codes and component/action, never the token or the URL carrying it, and that is asserted by test
  ('never echoes the token back into the redirect'). One production magic-link probe used
  probe@example.com against a non-enumerating 202, so no real address was involved."
dissent:
  - seat: claude-sonnet-5 (spalla-review refuter)
    objection:
      "BLOCKER — the landing PAGE leaks the single-use token to Google: the root layout renders
      <GoogleAnalytics> and GA4's page_view carries page_location = document.location.href, so the
      credential ships to a third party on load, before the customer touches anything. The page's own
      docblock reasoned about Sentry Session Replay and missed GA autotrack."
    status: CONFIRMED
    resolution:
      "ACCEPTED and fixed structurally, not per-vendor. Verified independently first (the gtag id is
      live in production HTML; RouteChangeTracker.tsx:33 sends the full href). The page was replaced by
      a GET route handler that runs no layout, loads no script and returns no document — so the token
      URL renders nothing at all — and the page a human sees now carries only result_id. Commit 2."
  - seat: claude-sonnet-5 (spalla-review refuter)
    objection:
      "SHOULD-FIX — `setCookies.length === 0` checks that SOME cookie came back, not that the ACCOUNT
      cookie did. If the backend ever emits an unrelated cookie on the no-op/replay 204 path, an
      unauthenticated visitor is redirected onto the authenticated upload page."
    status: CONFIRMED
    resolution:
      "ACCEPTED and fixed: now `forwarded.some(c => c.startsWith('garuda_session='))`, with a test that
      sends a 204 carrying only an unrelated cookie and asserts the failure redirect. The mutation
      swapping the name check back for a length check turns that test red."
  - seat: claude-sonnet-5 (spalla-review refuter)
    objection:
      "SUGGESTION — sentry.server.config.ts / edge.config.ts have no query scrubbing, and it could not
      be confirmed or ruled out that Next's Sentry instrumentation captures the full URL (with the
      token) on server transactions."
    status: PLAUSIBLE
    resolution:
      "NOT FIXED, ACCEPTED AS RESIDUAL AND DECLARED. Out of scope for this PR and NOT claimed clean:
      the risks section and the new route's own docblock both state that the token remains in the URL
      of one first-party GET and can therefore reach Vercel's access log or a server-side Sentry
      transaction. Left as a named follow-up rather than an unstated assumption."
  - seat: claude-sonnet-5 (spalla-review refuter)
    objection:
      "NITs — the formData() catch branch is untested; the UPPER length boundaries (token 2048,
      result_id 128) have no boundary tests while the lower ones do; a double-click submits twice and
      the second POST shows 'link no longer valid' even though the first succeeded."
    status: PLAUSIBLE
    resolution:
      "ACKNOWLEDGED, not fixed. The catch branch fails closed already; the upper bounds are correct by
      inspection and mirror the backend, which is the real boundary; the double-submit case is a
      confusing message, never an unsafe state (the session is already granted). Recorded rather than
      silently dropped."
  - seat: session (self-correction)
    objection:
      "Two claims this session made mid-investigation were WRONG and were retracted before they reached
      the diff: (a) that the Vercel proxy and Fly disagreed structurally (a 503 through the proxy) —
      it was transient, and the next three attempts were 201/201/201; (b) that curl had refused the
      cookie — the jar filter excluded lines starting with '#', which is exactly how curl writes
      HttpOnly cookies. Both were broken probes, not findings."
    status: RETRACTED
    resolution:
      "RETRACTED and recorded. Neither reached a design decision. Kept here because a pack that lists
      only the claims that survived reads as if none had to be withdrawn."
  - seat: claude-sonnet-5 (two contract-mapping subagents)
    objection: "No report delivered — both went idle twice without producing their findings."
    status: CONFIRMED
    resolution:
      "REPLACED BY DIRECT VERIFICATION. The session re-ran every question itself (proxy runtime and
      Set-Cookie path, base-URL resolution, exchange contract, origin allow-list, cookie attributes,
      flag gate, result_id and token patterns), each cited by file:line in the two commits. Recorded so
      that three declared review lanes are not read as three lanes of coverage."
