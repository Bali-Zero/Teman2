seat_diversity_note:
  "All lanes are Anthropic seats, and unlike the usual form of this declaration that
  is a real limitation here rather than a non-issue. The decisive finding — that the root layout's
  Google Analytics would ship the token — was a JUDGEMENT about a surface the author had forgotten,
  not a measurement; that is exactly the shape where a cross-family seat adds what a same-family one
  may not. It was caught, by an Anthropic refuter, and then CONFIRMED by measurement (the live gtag
  id in production HTML, and RouteChangeTracker.tsx:33 sending window.location.href). Declared plainly:
  a second forgotten third-party surface would not have been found by the arbiter used here."
diff:
  net_lines:
    11 files, +1195/-119 measured by `git diff --stat origin/main...HEAD` across two commits.
    Five new frontend files (3 source, 2 test) plus one rewritten test file, one Python default + docstring
    correction, one Python test class, one workflow one-liner, one sitemap-guard declaration. The first
    commit's `auth/page.tsx` and `auth/page.test.tsx` are deleted by the second — the leak fix replaced
    the page with a redirect handler.
  behaviour_change:
    A URL that previously 404'd (`/visa/voa/auth`) now redeems a magic-link token and
    mints an account session — but only behind `GARUDA_PUBLIC_ENABLED`, which is off on Vercel, so no
    visitor-visible behaviour changes on merge. The emailed link's destination changes from the funnel's
    first page to the redeeming route. No database object is created, altered or read at apply time.
    No existing route's behaviour changes.
