    cmd: "pytest scripts/tests/test_p1s2_relevance_sentinel.py -q"
    result: "12 passed in 2.23s. Includes both directions on merge_group (trust path -> run=true; nothing relevant -> run=false), a case where the pull_request and merge_group bases DISAGREE so reading the wrong key is detectable, empty base, unresolvable base, grep rc=2, grep rc=1, and push/workflow_dispatch/schedule still unconditional."
    exit: 0
    ts: "2026-08-31T02:55Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
  - claim: "The corpus goes RED on a regression — six mutants, each reverted after measuring"
