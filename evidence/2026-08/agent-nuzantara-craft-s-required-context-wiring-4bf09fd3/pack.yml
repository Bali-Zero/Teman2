    result: "4 failed, 2 failed, 1 failed, 1 failed, 4 failed (and the census pin also broke), 1 failed. Restored tree: 55 passed. A corpus that only passes on the fix proves nothing."
    exit: 0
    ts: "2026-08-31T02:58Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
  - claim: "The census pin still holds — push paths and the grep alternation remain one relevance decision"
