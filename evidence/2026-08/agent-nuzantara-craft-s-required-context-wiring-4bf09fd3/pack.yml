    result: "clean. on -> {'pull_request': None, 'merge_group': None, 'push': ['branches','paths']}. No paths under pull_request, none under merge_group. `git diff --check` clean."
    exit: 0
    ts: "2026-08-31T02:58Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
dissent:
  - objection: "grep's exit code is three-valued and the sentinel collapsed two of them: `if grep ...; then run=true; else run=false; fi` treats rc=1 (no match) and rc>1 (ERROR — unreadable file, exhausted descriptors) identically, so a grep that could not READ the changed-file list would be recorded as 'nothing relevant changed' and skip the mutation gate."
    seat: "agy-gemini-3.1-pro"
    status: CONFIRMED
    disposition: accepted
    note: "The finding that justified the review. It is the same disease the fail-open handling above it was written to prevent, surviving one line further down — a failure to measure reported as a measurement. Now rc is captured and discriminated three ways, with rc>1 resolving run=true and emitting a ::warning::. Proved by a test that puts a `grep` shim exiting 2 ahead of the real one on PATH, and by the mutant that collapses it back."
  - objection: "The header comment says a queue entry touching no trust path 'now ends at the sentinel'. That is false: three unconditional steps run below it on every event."
    seat: "agy-gemini-3.1-pro"
    status: CONFIRMED
    disposition: accepted
    note: "True the moment those steps were added, in the same diff, by me. Rewritten to say what actually happens — the entry skips the EXPENSIVE steps and pays ~10s of cheap ones. A comment that inventories mutable state will lie (W106), and this one started lying before it was ever committed."
  - objection: "The test executes the sentinel body under plain `bash`, while GitHub runs a `run:` step as `bash --noprofile --norc -e -o pipefail {0}`. The test shell would source the caller's profile and rc files, so it tests a contaminated environment rather than the isolated one the runner provides."
    seat: "agy-gemini-3.1-pro"
    status: CONFIRMED
    disposition: accepted
    note: "Accepted and matched exactly. The script sets its own `set -euo pipefail` so the semantics were already right, but a corpus whose whole claim is 'this is the real body running' should not run it under different flags than the runner does."
  - objection: "BLOCKER — `python3 -m pip install` on ubuntu-latest's system python will crash under PEP 668 (externally-managed-environment) without --break-system-packages, on every PR and every queue entry."
    seat: "agy-gemini-3.1-pro"
    status: RETRACTED
    disposition: rejected
    note: "Plausible as a general fact about modern Debian-derived images, and FALSE for this repo's runners — measured rather than argued. `restore-drill-wiring-tests.yml` does exactly this (system python3, no actions/setup-python anywhere in the file) and its last 6 completed runs are all green, one of them at 17:06Z today. Rejecting a BLOCKER needs evidence, not confidence, so the evidence is the receipt above. The SECOND half of the same finding — that a PyPI dependency on the unconditional path of a required check can redden a PR for reasons unrelated to its diff — is real, is inherent to running any corpus in CI, and is declared at the step rather than argued away."
  - objection: "The sentinel relies on `$base` existing locally, and actions/checkout defaults to a shallow clone, so `git diff` would fail on every run and the optimisation would be neutered."
    seat: "agy-gemini-3.1-pro"
    status: RETRACTED
    disposition: rejected
    note: "The premise is false — line 94 sets `fetch-depth: 0` explicitly, and the refuter had not been shown the checkout step. But the failure MODE it describes is real and unusually quiet: if someone later 'optimises' that checkout, the sentinel correctly fails open, the gate stays correct, and the saving silently disappears with nothing red — only a ::warning:: nobody reads. So the finding is rejected as stated and its substance is kept as a test that pins fetch-depth: 0, with the reasoning and the refuter's role written into the docstring."
  - objection: "merge_group.base_sha is the correct key; three-dot is correct on a queue ref (HEAD is a synthetic merge whose parent is base, so merge-base(base,HEAD)==base); and the fail-open branch IS reachable under set -e because errexit is suspended on the left of an AND-OR list."
    seat: "agy-gemini-3.1-pro"
    status: RETRACTED
    disposition: rejected
    note: "Reported as NOT-A-FINDING after being checked. Recorded because a checked-and-cleared claim is evidence too, and these three were the load-bearing assumptions of the whole change — an independent family arriving at them separately is worth more than the gate asserting them."
  - objection: "SEAT AVAILABILITY — R9's review-seat allowlist still cannot be satisfied from this machine. Carried forward from PR 1 of this lane, unchanged and re-measured."
    seat: "claude-opus-5 (orchestrator, measured this turn)"
    status: CONFIRMED
    disposition: accepted
    note: >-
      R9 wants >=2 review seats from ('codex-gpt-5.6-sol', 'kimi-code/k3',
      'tp1-qwen3.8-max'). Codex is out of credits across the whole seat and
      tp1-qwen3.8-max times out at 400s; on THIS PR kimi-code is spent as the
      BUILD lane, so family exclusion rules out kimi-code/k3 as its own
      refuter and the reachable count from the allowlist is ZERO. The review
      was done properly — by a fourth family, Gemini, which found the one
      defect that mattered — and R9 will still score this pack at zero
      allowlisted seats. That is the lane-6 question in its sharpest form: on
      2026-09-02 this PR, reviewed by a working cross-family seat that found a
      real BLOCKER-adjacent defect, would be hard-blocked for using the wrong
      brand of reviewer. Reported, not decided; R9 is a NOTICE today.
