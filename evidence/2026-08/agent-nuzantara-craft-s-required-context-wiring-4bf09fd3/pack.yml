    exit: 0
    ts: "2026-08-31T02:55Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
  - claim: "Conformance: p1s2 is no longer named as a violation for the candidate context"
    cmd: "python3 scripts/ci/check_required_workflow_conformance.py --contexts <candidate file>"
    result: "0 violations mentioning p1s2-mutation-incremental.yml (it was 1 before this diff: 'missing merge_group: trigger'). The remaining violations are the two workflows PRs 1 and 3 of this lane cover."
    exit: 1
