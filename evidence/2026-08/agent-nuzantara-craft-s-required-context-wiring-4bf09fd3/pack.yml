# THE STAGING LAYOUT, and it is NOT the layout of this directory. Both refs below
# name where `harness-floor.yml` STAGES these files (/tmp/evidence-check/evidence/),
# never where they live in the repo — and the two resolve against different bases:
# evidence_pack_lint.py resolves `brief_ref` against --repo-root and `council_run`
# against the PACK'S OWN directory. Running the lint LOCALLY inverts both verdicts:
# the per-PR path reads clean and the correct staging value can read broken. CI is
# authoritative here; PR 1 of this lane learned it the expensive way.
council_run: council.jsonl
brief_ref: evidence/brief.yml
pii_scan: clean
lanes:
  - lane: implementer
    role: build
    role_note: "authored the replacement relevance-sentinel shell body against a spec that named the census pin as untouchable"
    seat: "kimi-code/kimi-for-coding"
  - lane: orchestrator
    role: review
    role_note: "ground (the header's own named fix, the census pin's extraction regex, fetch-depth), the workflow header and trigger, the executing corpus, the wiring, the final on-disk gate, and the mutation proof"
    seat: "claude-opus-5 (xhigh)"
  - lane: refuter
    role: review
    role_note: "blind cross-family refutation of the whole diff — 7 findings, 3 accepted, 2 refuted by measurement, 2 confirmed as non-findings"
    seat: "agy-gemini-3.1-pro"
seat_diversity: 3
seat_diversity_note: >-
  Three families, and the build lane is non-Anthropic (Moonshot Kimi-for-coding):
  D3 satisfied by a real build lane, never by seat_override. The refuter is a
  THIRD family (Google Gemini 3.1 Pro) rather than Kimi K3, because Kimi BUILT
  this one — family exclusion (battle plan §4 rule 3) governs over the
  workflow-class default, and the default's seat (Codex sol) was measured
  unreachable anyway. PR 1 of this lane went the other way round: Codex built,
  Kimi refuted.
diff:
  net_lines: >-
    AS OF the commit this pack ships with: 5 files, +706/-24, net 682 — measured
    THREE-DOT against the merge base, never two-dot (W102). Deterministic gear
    floor recomputed from this diff = 3 (hot-zone: .github/workflows/); declared
    Gear 3, at the floor. The ~400 net-line target is EXCEEDED and it is stated
    rather than hidden: the workflow change itself is small, and the bulk is
    `scripts/tests/test_p1s2_relevance_sentinel.py`, a corpus that EXECUTES the
    sentinel's shell body against synthetic git repositories for twelve event
    shapes. Six of its cases exist only because a mutant or a refuter proved the
    sentinel wrong in that exact case; deleting them to hit a line target would
    delete the evidence that the cures work. The rest is this evidence pack.
  behaviour_change: >-
    The job now runs on merge-queue entries as well as pull requests. On an entry
    that changes no trust path it does the same cheap work an irrelevant PR does
    (~10s: checkout, sentinel, instrument census, this PR's new corpus) and skips
    the mutation pass; before, every non-pull_request event ran everything. On an
    entry that DOES change a trust path it runs the full gate, as a PR would.
    No existing step's command changes. Two unconditional steps are added (a dep
    install and the sentinel's own corpus) and the `relevant` step's body is
    rewritten. The grep's exit code is now discriminated three ways instead of
    two — the only change that alters an existing verdict, and it alters it in
    exactly one case that previously resolved WRONG.
receipts:
