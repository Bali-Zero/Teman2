  - claim: "REFUTED the refuter's BLOCKER: system pip on ubuntu-latest is not PEP-668-blocked in this repo's runners"
    cmd: "read restore-drill-wiring-tests.yml for setup-python; gh api its last 6 completed runs"
    result: "That workflow runs `python3 -m pip install --quiet ... pytest pyyaml` on the SYSTEM python3 with NO actions/setup-python step, and its last 6 completed runs are all `success` (including one at 17:06Z today on this lane's own PR-1 branch). The claim was plausible in general and false here."
    exit: 0
    ts: "2026-08-31T02:45Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
  - claim: "REFUTED the refuter's shallow-clone finding: fetch-depth is 0, explicitly"
    cmd: "grep -n fetch-depth .github/workflows/p1s2-mutation-incremental.yml"
    result: "line 94: `fetch-depth: 0 # full history so git diff sees the PR changes`. The refuter had not been shown the checkout step and reasoned correctly under that uncertainty; the premise is false, but the silent-degradation mode it described is real and is now PINNED by a test."
    exit: 0
    ts: "2026-08-31T02:45Z"
    seat: "claude-opus-5 (orchestrator on-disk gate, re-run this turn)"
  - claim: "actionlint green; the on: block parses to the intended shape"
