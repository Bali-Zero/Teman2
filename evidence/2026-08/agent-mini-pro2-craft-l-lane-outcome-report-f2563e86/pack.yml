dissent:
  - seat: "kimi-code/k3"
    objection: "`earlier.ts >= commit.ts` rejects every same-second pair, so a fix and the commit it corrected can never chain if a merge queue landed them together — and the docstring promised ties would resolve by position."
    status: CONFIRMED
    disposition: "Fixed to `>`, with ties resolved by list position as the docstring always claimed. sol independently cited a real same-second pair (20292599f3cd / 679806e7f26a, both ct=1779164922, sharing scripts/agent-library-evolver-run.sh)."
  - seat: "kimi-code/k3"
    objection: "`int((n-1)*0.9)` truncates to index 0 at n=2, so p90 of [1h, 100h] is reported as 1h — the minimum."
    status: CONFIRMED
    disposition: "Fixed with ceil, clamped to the last index. A percentile that can return the smallest sample is not a percentile."
  - seat: "kimi-code/k3"
    objection: "The rate denominator counts fixes that cannot chain, so the harder you tune the high-churn filter the better the rate looks."
    status: CONFIRMED
    disposition: "Fixed by reporting an eligible denominator alongside the raw one — extracted as `eligible_fix_commits` so a test can call the rule instead of recomputing it. Measured: on the real window it does not move (every fix there touches something besides the ledger), which is exactly why it is pinned by a fixture rather than left as unexercised code that looks like a safeguard."
  - seat: "kimi-code/k3 + gpt-5.6-sol"
    objection: "`gh --limit 1000` with no merged: search drops long-open PRs — precisely the p90-defining tail — and reports `fetched, 0/0` as if the window were empty."
    status: CONFIRMED
    disposition: "Fixed: the search now carries `base:main merged:<since>..<until>`. The 1000 ceiling remains and is declared in the brief; not reached today at 118 merges in 48h."
  - seat: "kimi-code/k3 + gpt-5.6-sol"
    objection: "The git window is local-timezone committer date and the gh window is UTC mergedAt — two populations presented as one cohort."
    status: CONFIRMED
    disposition: "Not collapsible (the two sources genuinely differ), so it is STATED in the published block where a reader meets it, with an explicit instruction not to compute a ratio across them. sol measured the gap on this very window: 120 git commits against 118 under explicit UTC bounds."
  - seat: "gpt-5.6-sol"
    objection: "A duplicated commit in the input emits two identical chains and inflates the rate."
    status: CONFIRMED
    disposition: "Fixed with a seen-fixes set. The report is about DISTINCT corrections."
  - seat: "gpt-5.6-sol"
    objection: "`is_fix` misses the real subject `fix queue baseline census and public timing (#4047)`, dropping it from both numerator and denominator."
    status: CONFIRMED
    disposition: "Fixed to `^fix[:(\\s]`. Verified against real history before acting: exactly 1 such subject in two months, commit 2184b00a63 — the one sol named. `fixup!` and `prefix:` are still excluded, pinned by test."
  - seat: "gpt-5.6-sol"
    objection: "Python's `$` also matches before a final newline, so `(#42)\\n` is accepted although the marker is not at the literal end."
    status: CONFIRMED
    disposition: "Fixed to `\\Z`."
  - seat: "gpt-5.6-sol"
    objection: "`number` is fetched and never used, so a duplicated PR row makes attribution 2/3 where the truth is 1/2."
    status: CONFIRMED
    disposition: "Fixed with `_dedupe_prs`. Rows with no usable number are kept rather than collapsed, since they cannot be shown to be duplicates of anything."
  - seat: "gpt-5.6-sol"
    objection: "No `--base main` filter: PRs merged into another base are counted as main-line work."
    status: CONFIRMED
    disposition: "Fixed — `base:main` is in the search."
  - seat: "gpt-5.6-sol"
    objection: "A mergedAt before createdAt puts a negative duration into the distribution and can drag the median and p90 negative."
    status: CONFIRMED
    disposition: "Fixed: negatives are discarded and COUNTED (`negative_discarded`), because silently dropping data is its own kind of lie."
  - seat: "gpt-5.6-sol"
    objection: "`--write` concatenates the heading onto the last line when the document has no terminal newline, producing a section no renderer shows as a heading."
    status: CONFIRMED
    disposition: "Fixed with a terminal-newline check before the append."
  - seat: "gpt-5.6-sol"
    objection: "`test_skipping_gh_is_reported_as_skipped_not_as_zero` performs a real unmocked `gh pr list`, so the pure unit corpus fails on a runner's auth state instead of on source behaviour."
    status: CONFIRMED
    disposition: "Fixed — `_fetch_prs` is stubbed. Measured side-effect: the suite went from 2.6s to 0.76s, which is itself the proof the network call was there. A red that can mean two things is worse than no test, and this one was mine."
  - seat: "gpt-5.6-sol"
    objection: "A commit can become its own origin when the same sha appears twice."
    status: CONFIRMED
    disposition: "A guard was written for it and then REMOVED after mutation proved it unreachable: the slice excludes the commit by index, and an origin must be a non-fix commit while any duplicate of a fix is a fix. Recorded at the site — dead code that looks like a guard tells the next reader a case is handled and stops them asking whether it can happen."
  - seat: "gpt-5.6-sol"
    objection: "The high-churn filter can be removed from the earlier side and the corpus stays green."
    status: CONFIRMED
    disposition: "Proven EQUIVALENT rather than cured: an element removed from the fix side can never appear in the intersection, so filtering the earlier side is unobservable while the fix side is filtered. Reported as an equivalence with its proof, not as a passing mutant."
  - seat: "gpt-5.6-sol"
    objection: "A revert commit is an actual corrective rollback and is excluded from the metric; a direct commit with no PR suffix is counted as a squash-merged fix; an uppercase host splits one machine into two buckets; a gh failure has no `source: failed` state in the report."
    status: PLAUSIBLE
    disposition: "NOT cured, declared. Widening to reverts changes the metric's DEFINITION, which is a spec question and not a bug fix; the others are cosmetic or already fail-loud (a gh failure exits 3 with stderr rather than emitting a report that could be misread). Named here rather than left for the next reader."
