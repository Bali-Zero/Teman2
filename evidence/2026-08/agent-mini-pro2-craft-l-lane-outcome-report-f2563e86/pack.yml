seat_diversity_note: >-
  Two build lanes across two families (Moonshot + Anthropic) and two review lanes
  across two more (Moonshot + OpenAI). D3 is satisfied by a real build lane, not
  by seat_override.

  Recorded because it is the measurement: the two reviewers ran on the same diff
  with the same attack list, in parallel, and overlapped on only three of
  twenty-eight findings. Each caught defects the other did not — k3 found the
  same-second tie rejection and the p90 truncation, sol found the duplicate-chain
  emission and a real repo subject the fix-detector was silently dropping. And
  sol found a defect in MY corpus that neither I nor k3 saw: a test that shells
  out to `gh`, which would have gone red on a CI runner for the runner's auth
  state rather than for the code.
diff:
  net_lines: >-
    AS OF this commit (pinned — a bare byte count inside a file every subsequent
    commit rewrites is a claim that decays by construction): 7 files, +1439/-0,
    measured against the MERGE BASE with `git diff --cached --numstat`.

    Over the ~350-line target the spec names, and said plainly rather than split:
    439 of those lines are the test corpus, 25 are the SEAT-MIX section the tool
    itself produced as prove-live, and three files are this evidence pack. The
    executable surface is one module.

    The count INCLUDES this pack, because that is what `git diff --numstat`
    measures against the merge base and a number that quietly excluded itself
    would be the same convenient half-truth these receipts spend their time
    refusing.

    Deterministic gear floor recomputed from this diff = 3 (source: path —
    .github/workflows/immune-enforcement.yml, which is edited to ARM the corpus).
    Gear 3 is the floor, not a choice.
  behaviour_change: >-
    A new read-only report. It writes nothing unless `--write` is passed, and
    then only appends a dated section to docs/factory/SEAT-MIX.md.

    The workflow edit adds the module and its corpus to the two lists
    immune-enforcement.yml needs, so a PR touching either runs the tests. Nothing
    else in CI changes; no required check is added or removed.
