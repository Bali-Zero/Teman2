dissent:
  - objection: "UNDER-MATCH — `pull_request_target` with a paths filter alongside merge_group creates the identical trap, and the rule only inspects `pull_request`."
    seat: "agy-gemini-3.1-pro"
    status: CONFIRMED
    disposition: accepted
    note: "Correct. Both triggers start a run on a PR and both support `paths:`, while merge_group supports neither — so either one filtered produces the same divergence. This repo has exactly one workflow using it (measured), which is precisely the kind of rare surface an under-match hides in. Now both are judged, with a guilt case naming the trigger in the violation text so a reader is not sent to the wrong one."
  - objection: "OVER-MATCH — the rule forbids a shape a careful author could make safe: keep the PR-side paths filter for runner economy, and have the merge_group job self-skip with an in-job path filter."
    seat: "agy-gemini-3.1-pro"
    status: CONFIRMED
    disposition: accepted
    note: >-
      Fair, and it is superscar #3 pointed at this lint's own rule: the rule
      judges the FORM (`paths:` present) while the hazard is about the ENTITY
      (can the queue run diverge from the PR run), and the two are not statically
      decidable apart. Rather than pretend otherwise, an explicit per-file opt-out
      marker was added — deliberately NOT the central allowlist the spec asked
      for, because the justification should travel with the workflow it excuses,
      where the next reader of that workflow will meet it. A marker with no reason
      does not excuse: an exemption is a guard running in reverse and wants its
      own justification. Every exemption is printed, never silent.
  - objection: "The docstring's required-context claim is mechanically wrong: a PR whose required check is pending cannot be ADDED to the merge queue at all, so that case is not a queue-red trap."
    seat: "agy-gemini-3.1-pro"
    status: CONFIRMED
    disposition: accepted
    note: "Right, and the conflation would have sent whoever hit the second symptom looking in the wrong place. The paragraph now separates them: non-required -> head-green/queue-red; required -> a PR that can never be queued, with nothing red to fix. Same root cause, different mechanism, different symptom."
  - objection: "A workflow that parses perfectly but simply omits `on:` is reported as 'unparseable' — the file is valid YAML and merely missing a schema key."
    seat: "agy-gemini-3.1-pro"
    status: CONFIRMED
    disposition: accepted
    note: "A mislabel that sends a reader hunting for a syntax error that is not there. The parse now happens at the call site so the two failures are told apart and reported separately. Both remain violations — this lint cannot guard a file whose triggers it cannot read — but each is named for what it is."
  - objection: "The `doc.get(True)` YAML-1.1 fallback would accept a literal `true:` key: a document with no `on:` block but a top-level `true: something` satisfies the fallback and sails through."
    seat: "agy-gemini-3.1-pro"
    status: CONFIRMED
    disposition: accepted
    note: "Real, and it defeats the missing-block check for exactly that file. The fallback is now taken only when what it finds is trigger-shaped (a mapping or a list), never an arbitrary scalar. Pinned by its own guilt case."
  - objection: "BLOCKER — the relevance gate's `.github/workflows/*.yaml` glob does not recurse under micromatch, so a `.yaml` workflow would never trigger the lint and the arming is bypassed."
    seat: "agy-gemini-3.1-pro"
    status: RETRACTED
    disposition: rejected
    note: >-
      Refuted by EXECUTION rather than argument. The relevance gate is not a
      GitHub `paths:` filter — it is a bash `case` statement over `git diff
      --name-only`, where `*` crosses `/`. The matcher was extracted from the
      workflow and run against real paths: `.github/workflows/bad.yml` ->
      relevant=true, `.github/workflows/bad.yaml` -> relevant=true,
      `docs/unrelated.md` -> relevant=false. The finding was a correct reading of
      the wrong mechanism, and it was worth checking: had it been a `paths:`
      filter it would have been right, and the arming would have been theatre.
  - objection: "SEAT AVAILABILITY — R9's allowlist unsatisfiable from Pro. Sixth PR."
    seat: "claude-opus-5 (orchestrator, measured this turn)"
    status: CONFIRMED
    disposition: accepted
    note: "Codex out of credits; tp1-qwen3.8-max timing out; kimi-code is this PR's build lane. Zero reachable allowlisted review seats. Reported for lane 6; R9 is a NOTICE today."
  - objection: "SPEC DEVIATION — the spec asks for a dated, shrink-only central allowlist; this ships a per-file opt-out marker instead."
    seat: "claude-opus-5 (orchestrator)"
    status: CONFIRMED
    disposition: accepted
    note: >-
      Declared. The spec anticipated live asymmetries to grandfather; measured,
      there are ZERO across 112 workflows, so a central allowlist would ship
      empty and could only ever be used to admit the FIRST violation — an escape
      hatch built ahead of any case needing it. The refuter then named a shape
      that genuinely might need one, so an escape does ship: a per-file marker
      that must carry a reason and is always reported. It is narrower than the
      spec's allowlist and keeps the justification where the next reader will
      meet it.
