task_id: backend-rag-pytest-verbosity-guard
gear: 3
l_level: L1
gate_class: opus
objective: |
  Land PR #5243's new pytest-verbosity guard (a conftest-wired plugin that refuses any pytest
  run whose EFFECTIVE verbosity — config `addopts` plus argv, cumulative: each `-v` is +1, each
  `-q` is -1 — reaches -2, because at that level pytest prints no pass/fail tally at all, so a
  green exit code is not evidence anything ran) WITHOUT leaving any of the call sites it correctly
  condemns still red.

  `apps/backend-rag/pytest.ini`'s `addopts` already carries one `-q` (verbosity -1 at that config
  root). Every pytest invocation that ALSO passes `-q` on the command line while resolving to that
  config root (cwd=apps/backend-rag, or args under it) reaches -2 and is refused. The PR's own CI
  run went red on exactly this, across 7 checks (antidotes unrelated — see dissent).

  Three rounds of scope, all driven by re-deriving the verbosity math per site rather than trusting
  a fixed list of line numbers:
  - Round 1 (commit 584e92bc01): `.github/workflows/tests.yml`, the 2 sites actually cited by the
    dispatching message — a third cited site (apps/evaluator job) turned out INNOCENT on inspection
    (that root's own `addopts = "-v --tb=short"` cancels the command-line `-q` to net 0, not -2).
  - Round 2 (commit dae8d6f1ec): the dispatcher's own citation of "three sites in
    tests.yml" was itself imprecise — the real third+ site was `apps/backend-rag/scripts/
    backend_stability_gate.py` (3 separate pytest calls), found by reading the LIVE CI failure log
    for "Backend Shard 1", not by grep. Reported to the dispatcher, scope was explicitly expanded
    to "fix the family, not the instance". An adversarial subagent (dispatched with no prior
    context, told to try to break the fix) then found two MORE genuinely-missed live-automation
    sites this session's own first pass did not catch: `.husky/pre-push`'s local backend suite,
    and the `autonomous_lab` verification-command allowlist family (which turned out to need THREE
    coordinated edits, not one — see acceptance).
  - Round 3 (commit 6ebb73601b, this pack): the guard itself found a NINTH site in live CI —
    `backend/tests/db/test_xdist_worker_isolation.py`'s guilt case spawns a nested `pytest -n 2
    --dist loadfile -q ...` subprocess from cwd=apps/backend-rag. Fixed by dropping the redundant
    `-q` (not `-o addopts=`): the probe's own assertion is on `returncode` plus JSON files the two
    workers write, nothing depends on the suppressed tally, so this is the same shape as every
    other site — a deliberate choice, not the default, see acceptance for the reasoning and for
    two adjacent sites where the same choice was NOT free of side effects. Searching specifically
    for "pytest invoked from inside Python code" (the shape invisible to every workflow/shell
    predicate used in rounds 1-2) across `apps/backend-rag/backend/tests/` and `scripts/` found two
    more real siblings: `scripts/cron-agent-python/tdd_pipeline.py`'s `_verify_tests()` and
    `scripts/coverage_trend.py`'s `run_coverage()` — both cron/automation scripts, both a nested
    `pytest ... -q` from cwd=apps/backend-rag. A fourth site, `scripts/quickcheck.sh` (a shell
    script, not "Python code", but the identical mechanical cause), was found while checking known
    dev-loop shell scripts for the same cwd+flag pattern rather than by the directed search itself.
constraints:
  - "Do not weaken, special-case, or add an escape hatch to the guard itself — the guard being
    strict is the entire point of the PR it ships in. Every fix here removes a redundant flag,
    never touches `pytest_verbosity_guard.py`, `config_roots.py`, or `pytest.ini`'s own `addopts`."
  - "No client PII in any output/log/artifact. This is a CI-infrastructure fix; nothing in scope
    touches client data, so this is true by construction, not by redaction."
  - "No `fly`, no `launchctl`, no plist load, no production database connection, no external
    endpoint call, and specifically: never send anything to Telegram / use a real bot token, even
    though `fly-deploy.yml` (one of the edited files) is full of Telegram send steps on OTHER
    lines. Every verification in this pack is local/offline: real pytest.ini + real conftest.py +
    real repo test files, run from a worktree, never through the actual workflow runners."
  - "Read-only on the repo apart from the files this fix actually needs. No `gh` mutations beyond
    pushing this branch — no merge, no arm/disarm auto-merge, no new PR, no edits to any other PR."
  - "Fix the family, not the instance (dispatcher's explicit instruction after round 1): every site
    sharing the exact structural cause — cwd/args resolving to apps/backend-rag's config root PLUS
    a redundant command-line `-q`/`-qq`/`--quiet` — gets fixed in this PR, not filed as a follow-up,
    because the guard this PR ships makes every one of them a live, immediate break the moment this
    PR merges (CI sites) or the moment a teammate next pushes (the `.husky/pre-push` site) or the
    moment the autonomous-lab worker next runs its verification command."
acceptance:
  - text:
      "Every command-line `-q` stacked on top of `apps/backend-rag/pytest.ini`'s own `-q` is
      removed, and NOTHING ELSE on those lines changes (no other flag added/removed, no reordering)."
    probe: 'git diff between this session''s own fix commits'' parent
      (15261bbd61, the PR tip before this session started) and their tip (6ebb73601b), scoped to
      the 12 files those 3 fix commits touch (excludes the merge commit and an unrelated
      teammate fix that landed on the branch in between) — every hunk a single `-q`/`"-q",`
      removal (or, for the two `autonomous_lab` test files, an assertion updated to match). See
      `diff.net_lines` for the exact machine-measured count.'
  - text:
      "For every one of the 12 pytest call sites this session touched (tests.yml x2,
      backend_stability_gate.py x3, fly-deploy.yml, .husky/pre-push, the autonomous_lab
      verification-command family as one logical site matched across 4 files, and round 3's
      test_xdist_worker_isolation.py, tdd_pipeline.py, coverage_trend.py, quickcheck.sh), the
      SAME real command WITH the old redundant `-q` reproduces the guard's `UsageError` (exit 4,
      config in force = apps/backend-rag/pytest.ini) and WITHOUT it completes (exit 0) and prints
      a real pass/fail or collected-count tally, run against the actual repo content on this
      branch — not a synthetic pytest root."
    probe:
      "11 paired before/after runs recorded as receipts below (one pair covers both
      backend_stability_gate.py's 3rd command and fly-deploy.yml, since their file-set is
      byte-identical), each showing exit 4 -> exit 0 — jointly covering all 12 sites."
  - text:
      "The fix-shape choice for the 4 round-3 sites (drop the redundant `-q` vs. neutralize the
      inherited config with `-o addopts=`) is made deliberately per site, not defaulted, and the
      choice is recorded even where it surfaces a PRE-EXISTING, unrelated defect rather than
      hiding it."
    probe:
      "tdd_pipeline.py's `_verify_tests()` counts the substring `<Function test_` in
      `--collect-only` stdout — a format pytest only emits at verbosity >= 0. Since
      apps/backend-rag/pytest.ini's OWN `-q` already puts this invocation at -1 even after
      dropping the redundant CLI `-q`, this counter has returned 0 unconditionally since BEFORE
      this PR existed (proven: dropping only the CLI `-q` still yields the flat nodeid format, not
      the tree format the counter expects — see the r3 receipts). `-o addopts=` would restore the
      tree format as a side effect, but was rejected here: it would also drop
      `--strict-markers`/`--import-mode=importlib`/the warning filters from this one invocation,
      a larger behavior change than this PR's mandate, for a bug that predates the guard entirely
      and is not something the guard's own PR broke. Flagged in dissent, not fixed — the same
      discipline as the unrelated `antidotes` CI job in round 2."
  - text:
      "The autonomous_lab verification-command allowlist, its real execution argv, its
      independent defense-in-depth shape-check, and both test files pinned to its exact shape all
      agree with each other after the edit — none is stale relative to the others."
    probe:
      "PYTHONPATH=. python -m pytest backend/tests/unit/services/autonomous_lab (from
      apps/backend-rag) -> 173 passed, 0 failed."
  - text:
      "All 4 pre-push shell test suites that exercise `.husky/pre-push`'s content/behaviour
      still pass after the hook edit — the fix does not silently break the hook's OWN test
      coverage while fixing the bug the hook shipped with."
    probe:
      "bash scripts/tests/test_prepush_suite_lock.sh / test_prepush_failclosed.sh /
      test_prepush_default_off.sh / test_prepush_tip_drift.sh -> 22+23+14+14 = 73 passed, 0 failed."
  - text:
      "`actionlint` on both edited workflow files reports the SAME finding set before and after
      (zero new, zero removed) — the edit introduces no new lint surface."
    probe:
      "diff of `actionlint fly-deploy.yml` output between HEAD~1 (pre-edit) and the edited
      tree is empty; 14/14 identical pre-existing shellcheck info/style notes, none on the touched
      lines."
consumer_map:
  - "GitHub Actions `Backend Static (Python)` job, step `Run core tests (fast gate — always run)`
    (`.github/workflows/tests.yml`) — was the CI failure the dispatching message was responding to."
  - "GitHub Actions `Backend Shard 1/2/3` jobs, step `Run backend stability gate`
    (`apps/backend-rag/scripts/backend_stability_gate.py`, invoked at tests.yml:910) — the ACTUAL
    cause of those 3 red checks; the sharded pytest step this PR's round-1 commit fixed in
    tests.yml is never reached because this step aborts the job first."
  - "GitHub Actions `pre-deploy-gate` job (`.github/workflows/fly-deploy.yml`) — not exercised by
    this PR's own `pull_request`-triggered checks at all (fly-deploy runs on a different trigger),
    so this defect was invisible to this PR's CI and would only have surfaced on the next real
    deploy attempt after merge, as a blocked deploy with a misleading gate-failure alert."
  - "Every developer's local `git push` on a meaningfully-sized backend-rag diff
    (`.husky/pre-push`, `PREPUSH_RUN_BACKEND=1` path) — was about to start printing
    `❌ Python tests FAILED — push blocked` for a suite that never ran (exit 4 isn't 0/75/>=128,
    so it fell through to the generic 'tests failed' branch), with a reproduce command that
    (already, pre-existing) omits `-q` and so would not have reproduced the false failure either."
  - "The autonomous-lab worker's self-verification step
    (`backend/services/autonomous_lab/sandbox_runner.py` + `command_policy.py`) — a live execution
    path (matched by exact-string allowlist, not test scaffolding), gated by its own independent
    shape-check that would have rejected a plan built from a stale constant against an updated
    argv list, or vice versa, had the three sites been fixed out of lockstep."
  - "Two archival JSON receipts under `research/operations/autonomous-lab/receipts/` still contain
    the OLD `-q` command verbatim — deliberately NOT touched: they are records of what actually ran
    at the time (2026-05-31), not live code, and rewriting them would falsify the historical record."
  - "`backend/tests/db/test_xdist_worker_isolation.py`'s own guilt case (GitHub Actions `Backend
    Shard 3`) — the guard the PR ships found this site in live CI before this pack's own final
    sweep did, which is the guard working exactly as designed: refusing a run that would print no
    tally, on a nested probe whose caller asserts a `returncode` that a silent run cannot actually
    stand behind."
  - "The TDD cron pipeline (`scripts/cron-agent-python/tdd_pipeline.py`, LaunchAgent-scheduled) —
    was silently reporting `tests_added: 0` for every AI-generated test file, every run, once this
    PR's guard shipped (before this PR, verbosity was already -2 there too and the collect-only
    parsing was already broken by a separate, older bug — see acceptance bullet 3)."
  - "The coverage-trend cron job (`scripts/coverage_trend.py`) — was about to log `Coverage
    measurement failed` on every run, misdiagnosing a guard refusal as a coverage-tooling failure,
    because `run_coverage()` only checks whether the `--cov-report=json` file was written, never
    `returncode`, and the guard fires before pytest would ever write that file."
  - "`scripts/quickcheck.sh`'s scoped impact-map test runner (dev-loop, invoked by agents before
    committing) — was about to misreport `scoped suite reported failures (advisory, rc=4)` for
    diffs where nothing was actually wrong, burying the guard's own precise error text inside a
    generic 'failures' line."
risks:
  - "A workflow-file change is auto-merge-eligible per this repo's own auto-merge-whitelist gate
    (mechanical CI-flag edits, not a guardrail/migration/force-push class) — armed `gh pr merge
    --auto` bare, not `--squash`/other strategy flags, per this repo's own merge-queue doctrine."
  - "`.github/workflows/**` is a hot-zone path by this repo's own CODEOWNERS-tier classification,
    which is exactly why this pack exists at Gear 3 regardless of this session's own diff being
    small — the floor is PATH-driven, not size-driven, and correctly overrides size here
    (`evidence_pack_lint.py --print-floor-source` -> `path`; the exact measured size is in
    `diff.net_lines`, not restated by hand here to avoid a second, driftable copy of the number)."
  - "An unrelated CI job named `antidotes` is ALSO red on this PR, for a completely different
    reason: `apps/zantara-media` imports `pytest_verbosity_guard` (a module this PR's own
    conftest.py wiring adds) which `magazine-auto-assets.yml` does not install, so collection dies
    there. This is a real, separate defect (a workflow missing a dependency install this PR's OWN
    conftest-wiring change now requires), but it is OUT OF SCOPE for this pack — it is not a
    redundant-`-q` site, it is a missing `pip install`. Flagged, not fixed, not hidden."
  - "GitHub's Actions queue was visibly saturated while this PR's checks were pending (many
    concurrent `merge_group`/`pull_request` runs from other PRs observed) — CI verdicts for the
    final pushed SHA were not yet available at pack-authoring time. Every acceptance criterion
    above is therefore proven by LOCAL reproduction against the real repo content (pytest.ini +
    conftest.py + actual test files on this branch), not by a fresh green CI run, which is exactly
    the kind of evidence a Gear-3 pack exists to substitute for/complement."
  - "Between round 2's push and round 3's dispatch, the PR briefly showed `mergeable: CONFLICTING`
    against `origin/main` on `.claude/skills/modus/PENDING-ARMS.md` — a file none of this session's
    commits touch; it was already part of the PR's diff before this session started, and
    origin/main had moved on that same high-churn shared ledger. Resolved externally (commit
    24774b0fd0 landed on the branch via a merge from origin/main before round 3's dispatch message
    arrived) — not by this session, and not by editing PENDING-ARMS.md, which stayed outside this
    pack's authorized file list throughout."
  - "Round 3's sibling search (`apps/backend-rag/backend/tests/` + `scripts/`, the 'pytest invoked
    from inside Python code' shape) was done by THIS session directly, not by a dispatched
    adversarial subagent — round 2's fresh-context review pattern was not repeated for round 3.
    The search was systematic (grep for pytest-as-argv-literal patterns, followed by cwd+addopts
    verification per candidate, not a single grep taken at face value) but is a single reviewer's
    pass, not an independently-verified one."
grader: |
  Round 2: independent verification via a dispatched adversarial subagent (Agent tool,
  spalla-review, fresh context — did not see this session's reasoning, told explicitly to try to
  break the fix rather than confirm it). It found the round-1 dispatching message's own site count
  was imprecise in a NEW way (two of what it initially read as "claimed fixed" sites were, at the
  moment it looked, edited-but-not-yet-committed working-tree state rather than pushed commits —
  a sequencing artifact of when it was dispatched mid-session, since resolved by commit+push) and,
  more importantly, found two genuinely-missed sites (`.husky/pre-push`,
  `autonomous_lab/command_policy.py`) that this session's own first pass did not catch. Both
  confirmed independently against the live repo (not taken on the subagent's word) before being
  fixed. See `dissent:` in pack.yml for the full record, including what was investigated and NOT
  changed (deploy_staging.sh's `-v -q` combo: net 0, confirmed safe; several docs/skill files with
  stale `-q` in PROSE examples: self-correcting if followed, not a live execution path, left as a
  lower-priority follow-up rather than expanding this PR's scope further).

  Round 3: the 9th site (`test_xdist_worker_isolation.py`) was found by the GUARD ITSELF in live
  CI (Backend Shard 3, run 33288015368), reported by the dispatcher, not by this session or any
  subagent — the guard doing its job, per the dispatcher's own framing. The 3 further siblings
  (`tdd_pipeline.py`, `coverage_trend.py`, `quickcheck.sh`) were found by this session's own
  targeted search, NOT independently reviewed by a fresh-context subagent this round — see the
  risks entry above naming this gap explicitly rather than silently presenting round 3 as having
  the same review depth as round 2.
