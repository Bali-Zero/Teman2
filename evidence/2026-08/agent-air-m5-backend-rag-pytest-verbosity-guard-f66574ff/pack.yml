      (dropping --strict-markers/--import-mode=importlib/warning filters along with it), a larger
      behavior change than 'remove one redundant flag' for a bug this PR's guard did not create.
      Flagged in brief.yml's acceptance + risks, not fixed, not hidden — same discipline as the
      antidotes finding above."
