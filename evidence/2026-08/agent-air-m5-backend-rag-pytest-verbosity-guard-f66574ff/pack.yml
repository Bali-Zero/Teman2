pii_scan_note:
  Nothing in this diff, brief, or pack touches client data, credentials, or any PII-bearing
  field. Every changed file is CI/tooling infrastructure (workflow YAML, a git hook, a Python
  test-command allowlist and its argv construction, two test-file assertions). Receipts quote
  pytest exit codes, test counts, and file:line locations only.
dissent:
  - seat: claude-sonnet-5 (spalla-review adversarial subagent)
    objection:
      "Two of the four sites this session initially reported as 'fixed' (backend_stability_gate.py,
      fly-deploy.yml) were, at the moment the subagent looked, edited in the working tree but NOT
      YET COMMITTED OR PUSHED — `git show HEAD:...` for both files still contained the old `-q`.
      The subagent traced this to a real, currently-failing CI run (33284494761) whose failing
      step is exactly the site that was locally fixed but not shipped, and called it a BLOCKER:
      commit and push before claiming done."
    status: CONFIRMED
    resolution:
      "Sequencing artifact of when the subagent was dispatched (mid-session, before the commit
      step) — not a defect in the edits themselves, which the subagent separately verified as
      correct and minimal. Both files committed (dae8d6f1ec) and pushed in the same turn the
      dissent was read. No further action needed beyond the commit/push already required by the
      task."
  - seat: claude-sonnet-5 (spalla-review adversarial subagent)
    objection:
      "`.husky/pre-push:700` was missed by this session's own first pass. It runs the local backend
      suite via `cd apps/backend-rag ... python -m pytest backend/tests/ --ignore=backend/tests/e2e
      --tb=short -q` — same stacked-`-q` shape as every CI site, but in a LOCAL git hook that runs
      on every qualifying `git push` (`PREPUSH_RUN_BACKEND=1`), not in CI. Exit code 4 (the guard's
      UsageError) is not handled by any of the hook's own branches (0 = pass, 75 = lock not
      acquired, >=128 = signal-killed), so it falls into the generic else-branch and prints
      '❌ Python tests FAILED — push blocked' for a suite that never actually ran — a misdiagnosis,
      not just a failure."
    status: CONFIRMED
    resolution:
      "Fixed (dae8d6f1ec): the redundant `-q` removed from line 700. Verified the hook's own printed
      'Reproduce' command (line 747-749) already omitted `-q` before this fix — so post-fix the real
      run and the printed reproduce command are finally consistent with each other, where pre-fix
      they were consistently-worded but the printed command would not have reproduced the guard
      failure either. All 4 shell test suites exercising this hook re-run green (73/73)."
  - seat: claude-sonnet-5 (spalla-review adversarial subagent)
    objection:
      "`apps/backend-rag/backend/services/autonomous_lab/command_policy.py:18`
      (PYTEST_AUTONOMOUS_LAB_COMMAND) was missed by this session's first pass — a live, allowlisted
      autonomous-lab verification command with the same stacked-`-q` bug, matched by EXACT STRING
      EQUALITY so a caller cannot work around it by dropping the flag; the constant itself has to
      change."
    status: CONFIRMED
    resolution:
      "Fixed, and turned out to require 3 coordinated edits, not 1 (found while acting on the
      dissent, not by the subagent itself): the allowlist constant string
      (command_policy.py:18), the ACTUAL argv list built in plan_for_allowlisted_command()
      (command_policy.py:120, a second independent embedding of the same flag), and the
      defense-in-depth shape-check's expected argv in sandbox_runner.py's
      _command_shape_refusal_reason (:224) — all three must agree, or the shape-check rejects an
      otherwise-correct plan as argv_not_allowlisted. Two test assertions pinned to the old shape
      (test_run_cli.py:237, an exact-argv-tail assertion; test_runtime_worker.py:285, a hardcoded
      literal fixture value not itself exercising the allowlist match) updated to match. Full
      173-test autonomous_lab suite re-run green. Two archival JSON receipts under
      research/operations/autonomous-lab/receipts/ still show the old command verbatim —
      deliberately left untouched as historical record, not source."
  - seat: session (self-check while acting on the dissent above)
    objection:
      "Is `apps/backend-rag/scripts/deploy_staging.sh:29`'s `pytest ... -v --tb=short -q` (BOTH
      `-v` and `-q` on the same command line) a 5th real site, or is the mixed flag combination
      actually safe? Not obvious without doing the arithmetic."
    status: RETRACTED
    resolution:
      "Confirmed safe, not a defect: cumulative verbosity math is +1 (`-v`) then -1 (`-q`) = net 0
      on the command line, combined with the config's own -q = net -1 overall — the SAME verbosity
      the fixed sites land at, not -2. Left untouched. Recorded here so the next reader does not
      re-open it as an open question."
  - seat: session (declared limit, unresolved — intentionally left open)
    objection:
      "Several docs/skill files (`.clinerules`, `VADEMECUM.md`, `.kimi-code/skills/
      nuzantara-context/SKILL.md`, `docs/AI_ONBOARDING.md`, plus a handful of test-file/module
      docstrings inside apps/backend-rag) carry the same `pytest <file> -q` PROSE pattern as an
      example command for a human or agent to type. The subagent flagged these as a SUGGESTION,
      not a blocker: nobody following one of these verbatim silently loses a verdict — they get
      the guard's own loud, self-explanatory UsageError immediately and self-correct. They are not
      a live automated execution path (the definition this pack's 'fix the family' scope used for
      the 4 code/hook sites above)."
    status: PLAUSIBLE
    resolution:
      "Deliberately NOT fixed here — expanding scope a third time from 'live automation the guard
      newly breaks' to 'every prose example anywhere in the repo' is a different, larger, and
      lower-urgency cleanup with a different acceptance shape (a docs consistency pass, not a CI
      fix), and this PR is already at round 2 of the 'three rounds, then suspend' discipline this
      repo runs its PRs under. Left as a named follow-up rather than silently dropped or silently
      absorbed into an already-larger-than-planned PR."
  - seat: session (self-check while writing this pack)
    objection:
      "An unrelated CI job on this PR, `antidotes`, is ALSO red — does it belong in THIS pack's
      scope, since it is a real defect and the PR is already touching the guard's own conftest
      wiring?"
    status: CONFIRMED
    resolution: "Investigated and explicitly scoped OUT: the failure is
      'apps/zantara-media imports pytest_verbosity_guard, which magazine-auto-assets.yml does not
      install' — a workflow missing a pip-install step for a module THIS PR's own conftest.py
      additions newly require it to import, not a redundant-`-q` site. Different bug class, different
      file, different fix shape (add a dependency install, not remove a flag). Named in brief.yml's
      risks: as flagged-not-fixed rather than silently left unexplained."
  - seat: dispatcher (team lead, round 3)
    objection:
      "The guard's own test suite found a 9th guilt site in live CI, on the branch's OWN new
      test file (`test_xdist_worker_isolation.py`) — the guard refusing its own repo's
      nested-probe pytest invocation, the exact 'exit code and tally are two different claims'
      distinction this PR exists to make. Fix it in this PR; do not weaken the guard to make it
      pass; choose deliberately between dropping the redundant -q and neutralizing the config with
      `-o addopts=`, and say which and why."
    status: CONFIRMED
    resolution:
      "Fixed (6ebb73601b): dropped the redundant -q. Chose this over -o addopts= because the
      probe's assertion is on returncode + the two workers' own JSON files, nothing depends on the
      suppressed tally — the same shape as every other site in this PR, no reason to reach for a
      broader escape. Verified the -o addopts= alternative WOULD have been the correct call for a
      different site (tdd_pipeline.py, see the next entry) precisely BECAUSE that site's downstream
      logic depends on non-quiet output — the choice is genuinely per-site, not a rule of thumb
      applied blindly."
  - seat: session (self-check while fixing the 9th site's siblings)
    objection:
      "tdd_pipeline.py's `_verify_tests()` counts `<Function test_` in `--collect-only` stdout —
      does dropping the redundant -q actually restore correct behavior here, or only stop the
      guard from refusing the run?"
    status: CONFIRMED
    resolution:
      "Only stops the refusal. Proven empirically (see the r3 receipt): apps/backend-rag/
      pytest.ini's OWN -q already selects the flat nodeid collect-only format at verbosity -1,
      identical in shape to the -2 this PR's guard refuses — so this counter has silently returned
      0 for every generated test file since before this PR, or the guard, existed. This is a
      genuinely SEPARATE, pre-existing defect (wrong output-format assumption, not a verbosity-
