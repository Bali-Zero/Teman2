dissent:
  - objection: "HIGH — fail-open contract violated: once touch makes locking functional, rc=2 enters the exit-0 branch without invoking the probe. A hung first run suppresses every subsequent health check indefinitely while emitting fresh warning heartbeats."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "PARTIALLY ACCEPTED — mechanism confirmed, consequence OVERTURNED by measurement. There is indeed no timeout on the node call (line 247). But this system has TWO heartbeats and the refuter saw only the diff: the skip branch calls heartbeat(), which writes the ORGANISM heartbeat (~/.organism/last_seen/mini.voa_probe.json); the PROBE's own heartbeat (~/logs/voa-probe-heartbeat.json) — the one PR-3's dead-man reads — is written ONLY by the node probe, so a stuck run makes it go STALE and the dead-man correctly detects silence and fires. Declared not patched: the fleet organ view reads warning+fresh during a stuck run, which understates it. Bounding probe runtime is a different concern from creating a lockfile."
  - objection: "HIGH — the claimed symlink guard does not guard symlinks: zsh's -f follows symlinks."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "ACCEPTED, declared not patched. Correct: [[ -f ]] follows symlinks, so a symlink to a regular file passes. MEASURED, not reasoned: a symlink to a REGULAR FILE passes the guard (refuter right), while a symlink to a DIRECTORY is still caught (because -f follows the link and the target is not a regular file) — sharper than the objection stated. The comment claims a 'non-regular-path guard', which is precisely what it is. Widening it to symlink semantics is a scope increase on a two-file fix."
  - objection: "MEDIUM — the lock is released before the protected result is consumed (unlock precedes the heartbeat read)."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "ACCEPTED, reproduced exactly — unlock at line 252, heartbeat read at 259-267. Newly reachable only because the lock now works at all. Declared not patched (depth-1)."
  - objection: "MEDIUM — pathname operations are TOCTOU-prone across [[ ]], touch and flock."
    seat: codex-gpt-5.6-sol
    status: PLAUSIBLE
    disposition: "ACCEPTED in principle, declared not patched. The path is user-owned under $HOME/logs on a single-user machine; the mitigation (open-once-and-lock-the-fd) is a rewrite of the primitive, not a precondition fix."
  - objection: "MEDIUM — the tests never prove a wrapper RETAINS its lock while the probe runs; an implementation that acquired and immediately released would pass 14a-14d."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "ACCEPTED, declared. A true proof needs a long-running stub plus a concurrent second wrapper. Recorded as a known corpus limit rather than claimed to be covered."
  - objection: "LOW — the regression pin accepts comments as executable evidence; grep would match a commented-out touch."
    seat: codex-gpt-5.6-sol
    status: CONFIRMED
    disposition: "ACCEPTED, declared. This is a class this repo has been bitten by (a guard that reads the comment rather than the code) — and the implementer independently hit the same shape in its own no-flock test for the sibling dead-man wrapper and fixed it there by stripping comment lines. Noted for the follow-up rather than widened here."
  - objection: "LOW — holder cleanup is unsafe: bash does not run an EXIT trap on SIGTERM, and a reaped PID left in CLEANUP_PIDS could be reused."
    seat: codex-gpt-5.6-sol
    status: PLAUSIBLE
    disposition: "ACCEPTED, test-harness-only, declared. The holder is also killed explicitly and waited on immediately after each use, so the trap is a backstop rather than the primary mechanism."

