seat_diversity: ok
seat_diversity_note: >-
  One build lane (Anthropic) and TWO review lanes across two other families
  (OpenAI, Moonshot). D3 is satisfied by real review lanes, not by
  seat_override.

  Recorded because it is the measurement, not the principle: the two reviewers
  ran on the same diff with the same attack list and overlapped on only four of
  eighteen findings. Kimi alone caught that the cure for the out-of-HOME defect
  was ITSELF fooled — `home in Path("<home>/../../usr/local/bin").parents` is
  True, because `.parents` walks the string — which the first round had asked
  about and not reached. A second family was not redundancy here; it was the
  difference between shipping the fix and shipping the fix's own twin defect.
diff:
  net_lines: >-
    AS OF this commit (pinned — a bare byte count inside a file every subsequent
    commit rewrites is a claim that decays by construction): 7 files, +1112/-2,
    measured against the MERGE BASE with `git diff --cached --numstat`.

    Over the ~400-line target and said plainly rather than split: 590 of those
    lines are the test corpus and roughly 150 more are load-bearing comment —
    the executable surface is one enumerator, one containment predicate, one
    CLI flag and one refusal. Splitting the corpus from the code it guards would
    land an instrument whose guilt fixtures arrive in a later PR, which is the
    exact shape this lane exists to stop.

    The count INCLUDES this evidence pack (3 of the 7 files), because that is
    what `git diff --numstat` against the merge base measures and a number that
    quietly excluded itself would be the same convenient half-truth these
    receipts spend their time refusing.

    Deterministic gear floor recomputed from this diff = 3 (source: path —
    .github/workflows/). Gear 3 is the floor, not a choice.
  behaviour_change: >-
    `--discover` gains a third finding: `.bak` shadows beside a declared live
    payload. Advisory by default — the exit code is byte-for-byte what it was
    unless `--strict-bak` is passed, which adds bit 8 and nothing else. Measured
    on Mini: rc stays 2 (undeclared payloads, pre-existing) with the flag off,
    and 10 with it on.

    `--check` alone is completely unchanged, which matters because
    pro-healer.sh — the lint's only executable consumer — calls exactly that and
    reads the result with a bitmask.

    `--strict-bak` combined with `--check` and no `--discover` now REFUSES with
    exit 2 instead of being accepted and silently ignored.
