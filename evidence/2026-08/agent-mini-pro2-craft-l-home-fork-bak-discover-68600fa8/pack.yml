dissent:
  - seat: "gpt-5.6-sol"
    objection: "The scan walks system directories without --system: the registry holds pairs under /usr/local and /Library/LaunchDaemons, so a vendor's backup becomes an organism finding and a foreign unreadable directory raises the error bit."
    status: CONFIRMED
    disposition: "Fixed. Measured 7 such pairs in the real registry. Non-HOME directories are now skipped unless --system, which is the file's own stated policy (its docstring: 'LaunchDaemons are scanned only with --system')."
  - seat: "gpt-5.6-sol"
    objection: "The diff hand-rolls a `~`-only resolver while the file already has expand_home(), which handles $HOME and ${HOME} too — a second source of truth for one question."
    status: CONFIRMED
    disposition: "Fixed by deleting the second resolver and calling expand_home(). Partially downgraded on verification: the registry has zero $HOME pairs today, so nothing was being missed in practice — the defect was latent, not active, and is recorded as such."
  - seat: "gpt-5.6-sol"
    objection: "The run prints 'clean — no .bak shadow' even when a directory could not be scanned; the unreadable test asserts the bit and the string but never that the clean line is ABSENT, so a mutant printing it unconditionally survives."
    status: CONFIRMED
    disposition: "Fixed on both sides. The verdict now reads CANNOT-VERIFY when any bak-scan error occurred, and the test asserts the clean line is absent as well as that CANNOT-VERIFY is present."
  - seat: "gpt-5.6-sol"
    objection: "`--check --strict-bak` accepts the flag and silently ignores it, because run_discover is false and no shadows are ever computed."
    status: CONFIRMED
    disposition: "Fixed. The combination is now refused with a message naming the working form. A flag that does nothing while looking like it did is superscar #2 in a single argument."
  - seat: "gpt-5.6-sol"
    objection: "Two pairs naming one physical directory under different spellings scan it twice and double-count."
    status: CONFIRMED
    disposition: "Fixed by keying identity on (st_dev, st_ino) from the stat already being performed, which also collapses symlinked aliases."
  - seat: "kimi-code/k3"
    objection: "The out-of-HOME cure is itself fooled: `home in Path('<home>/../../usr/local/bin').parents` is True because .parents walks the string, so `..` still escapes."
    status: CONFIRMED
    disposition: "Fixed, and this is the most valuable finding of either round — it is a defect INSIDE the cure for another defect. Containment is now measured on os.path.realpath of both sides. realpath rather than Path.resolve() because resolve() raises RuntimeError on a symlink loop, which the OSError handlers would not catch."
  - seat: "kimi-code/k3"
    objection: "`.BAK`, `.bak2` and `.bak~` are the same extension the rule claims to cover and are all missed; macOS is case-insensitive by default, which is the filesystem this lint exists for."
    status: CONFIRMED
    disposition: "Fixed: the separator class gained digits, `~` and space, and the match is IGNORECASE. Innocence re-proved AFTER widening rather than assumed to survive it — `recipes.baklava` and `BAKERY.SH` still pass."
  - seat: "kimi-code/k3"
    objection: "The strict-bak additivity test asserts `& ~8`, which any surviving bit satisfies; moving NO-REPO-TWIN from breaches to errors would downgrade the divergence verdict and leave the test green."
    status: CONFIRMED
    disposition: "Fixed. The test now asserts bit 1 by name. This is the same class the same reviewer was asked to hunt in the corpus, found in the corpus."
  - seat: "kimi-code/k3"
    objection: "The unreadable-directory test measures euid rather than behaviour: chmod 0o000 does not stop root, so under a root runner it reddens for the runner's identity."
    status: CONFIRMED
    disposition: "Fixed by skipping under euid 0 with the reason written out. A red that can mean two different things is worse than a skip that means one."
  - seat: "kimi-code/k3"
    objection: "A `.bak` DIRECTORY is counted as a shadow file while the real backups inside it are never scanned — a false positive and a false negative in one entry."
    status: CONFIRMED
    disposition: "Half fixed, half declared. Directories and symlinks are now annotated distinctly so the operator's purge is not sent at a `rm` that will not work. Non-recursion is deliberate and is written at the site: the next step for a directory is to look in it, and recursing turns one honest line into an unbounded listing."
  - seat: "gpt-5.6-sol + kimi-code/k3"
    objection: "The workflow's unit loop is `if [ -f $t ]; then pytest; else ::notice::skip`, so deleting the newly-listed corpus passes CI — it is not deletion-armed."
    status: CONFIRMED
    disposition: "NOT FIXED, declared. Verified in the workflow. Pre-existing, applies to all 40+ listed corpora, and has a stated rationale (the window before a lane's PR merges). Changing it would redden every lane whose corpus has not landed yet, which is a repo-wide decision and not a rider on a .bak lint. Carried in the brief's risks and to the ledger."
  - seat: "kimi-code/k3"
    objection: "TOCTOU: a directory deleted between stat and iterdir is CANNOT-VERIFY, while the identical state observed one syscall earlier is silent — the same world gets opposite verdicts."
    status: CONFIRMED
    disposition: "Fixed for consistency, and the coverage gap declared rather than papered over: no fixture can open that race deterministically, so a mutation narrowing the tuple SURVIVES the corpus. Said at the site and in the brief, because a surviving mutant that is not equivalent is a gap, not a pass."
  - seat: "gpt-5.6-sol"
    objection: "Exit bit 8 could collide with or be masked by an existing meaning."
    status: PLAUSIBLE
    disposition: "Not reproduced. The one executable consumer reads the code with a bitmask and never calls --discover; bit 8 was unassigned. Recorded as checked-and-not-found rather than dismissed unexamined."
