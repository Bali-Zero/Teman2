dissent:
  - seat: "claude-opus-5 (commit 93337550d, self-flagged in-code)"
    objection: >-
      TopicLock/CreativeLock's lock_version<=>supersedes_ref coupling (lock_version==1
      forbids a supersedes ref, lock_version>1 requires one, checked both directions) is
      applied by analogy to the family_id+revision pattern sections 7 and 13.1 spell out
      literally for DecisionPacket/ActionItem — sections 8.1/8.2 never say this in so many
      words for locks. Code comment (topic_lock.py validate_topic_lock): "FLAGGING FOR
      RATIFICATION: strong-but-inferred, not spec-literal."
    status: PLAUSIBLE
  - seat: "claude-opus-5 (commit 93337550d, self-flagged in-code)"
    objection: >-
      Six fields across the four kinds (DecisionPacket.evidence_summary / .alternatives /
      .downstream_candidates, TopicLock.audience, CreativeLock.tone / .narrative_arc /
      .must_keep / .must_avoid) are modeled as free-form JSON objects because the frozen
      CONTRACTS.md prose gives zero or near-zero key-name guidance for their shape — an
      invented shape (mirroring ExtensionValue.payload's precedent) that could diverge from
      what a future consumer actually expects on the wire, not presented as spec-derived.
    status: PLAUSIBLE
  - seat: "claude-sonnet-5 (commit 8e859c0d0)"
    objection: >-
      EvidenceSummary.citations originally carried Field(min_length=1) on the reasoning that
      a field called "citation-bearing" with zero citations contradicts its own name.
    status: RETRACTED
    resolution: >-
      Removed after verifying it rejected a DecisionPacket that CONTRACTS.md Rule 9 (section
      1) explicitly permits — "Missing evidence is not negative evidence. `unknown`,
      `inconclusive`, and `insufficient_evidence` are valid outcomes." DecisionPacket already
      accepts empty claim_refs and empty evidence_refs (neither has a min_length); the
      citations constraint rejected that same already-permitted packet one field later.
      Proven by fixtures/decision_packet/valid_no_evidentiary_support.json (an operational/
      scheduling packet with empty claim_refs, empty evidence_refs, empty
      evidence_summary.citations), added in the same fix commit.
