council_run: council-run.jsonl
dissent:
  - seat: kimi-code/k3
    objection: >-
      A review date in the FUTURE returns OUTCOME_OK. A negative age is trivially inside the
      interval and no real trace can be newer than a date that has not happened, so the shape
      slips past every check — the reason literally read "reviewed -123 days ago".
    status: CONFIRMED
    resolution: >-
      Reproduced before adoption. New OUTCOME_ANOMALY, exit 1, covering a future last_updated and
      a future verified_on alike. Commit e7ef7e9dc0.
  - seat: kimi-code/k3
    objection: >-
      With no trace at all the contradiction check passes VACUOUSLY, so the sentinel reports OK
      saying "nothing shows the sheet changed" when nothing could have. Reachable: git_last_change
      returns None on any git failure and only 2 of 113 entries carry verified_on.
    status: CONFIRMED
    resolution: >-
      Reproduced. OK now requires corroboration, not merely absence of contradiction; the case
      returns CANNOT_VERIFY. The asymmetry is preserved — REVIEW_DUE is still decided first,
      because overdue is provable from the field alone. Commit e7ef7e9dc0.
  - seat: kimi-code/k3
    objection: >-
      A malformed `metadata` crashes on .get(); Python exits 1 on a traceback and the wrapper reads
      rc=1 as "finding delivered", so the organism sees a healthy organ that reported a finding it
      never computed.
    status: CONFIRMED
    resolution: >-
      Reproduced for null, str and list. Fixed at both levels: an isinstance guard for the
      instance, and a catch around classify() plus one around main() for the class, so rc=1 means
      only what the wrapper thinks it means. Commit e7ef7e9dc0.
  - seat: kimi-code/k3
    objection: The grace day's UTC/WITA justification is factually inverted.
    status: CONFIRMED
    resolution: >-
      Correct — UTC is BEHIND WITA, so a commit's UTC date can never run ahead of the WITA date a
      reviewer would type. The real reason is merge lag. The value stays 1; the comment is now true
      and states the cost it buys. Commit e7ef7e9dc0.
  - seat: codex-gpt-5.6-sol
    objection: >-
      An empty or structurally incomplete sheet returns OK with priced_entries=0. The >=100
      invariant exists only in a test against today's artifact, not at runtime.
    status: CONFIRMED
    resolution: Zero priced entries is CANNOT_VERIFY at runtime now. Commit 72a92ae9a1.
  - seat: codex-gpt-5.6-sol
    objection: _ISO_DATE is not end-anchored, so a trailing-garbage date is partially believed.
    status: CONFIRMED
    resolution: End-anchored on a date or a full ISO instant. Commit 72a92ae9a1.
  - seat: codex-gpt-5.6-sol
    objection: >-
      An uncommitted working-tree edit leaves git history untouched, so an edited sheet reads as
      reviewed-and-unchanged.
    status: CONFIRMED
    resolution: >-
      Not theoretical — the Pro checkout routinely carries uncommitted files. `git status
      --porcelain` is a third trace, dated today, which is the conservative direction.
      Commit 72a92ae9a1.
  - seat: codex-gpt-5.6-sol
    objection: >-
      Alert delivery is never verified but the wrapper claims it happened; and the supplied
      failing-gateway test enshrines believing the printed line over the return code.
    status: CONFIRMED
    resolution: >-
      send_alert returns a Delivery record, a non-zero gateway rc is not a delivery, an undelivered
      finding exits 3, and the wrapper maps 3 to error. The offending test is rewritten to assert
      the opposite. Commit 72a92ae9a1.
  - seat: codex-gpt-5.6-sol
    objection: >-
      The sidecar records only organism health and discards the domain condition, so four months
      overdue looks identical to a clean run.
    status: CONFIRMED
    resolution: >-
      The sentinel prints one machine-readable last line (outcome, delivery, rc) and the wrapper
      carries it into the heartbeat note. Commit 72a92ae9a1.
  - seat: codex-gpt-5.6-sol
    objection: >-
      test_every_outcome_has_a_deliberate_exit_code enumerates OUTCOME_ constants, not outcomes the
      classifier returns, so Verdict(outcome="TYPO") stays green.
    status: CONFIRMED
    resolution: >-
      Replaced by a matrix that drives classify() down every branch and asserts each RETURNED
      outcome is mapped, with a non-vacuity floor on how many distinct branches it reached. The
      constant-vs-table check is kept separately, for what it does cover. Commit 72a92ae9a1.
  - seat: codex-gpt-5.6-sol
    objection: >-
      The 90-day boundary is off by one — a 90-day interval has elapsed at day 90, and the code
      printed "due in 0 day(s)" while returning APPROACHING.
    status: CONFIRMED
    resolution: ">= not >. The test that locked in the delay is rewritten. Commit 72a92ae9a1."
  - seat: codex-gpt-5.6-sol
    objection: >-
      Several tests are vacuous with respect to the central logic — the resolver test, the parser
      test and the gateway tests would all pass with classification deleted.
    status: PLAUSIBLE
    resolution: >-
      Accurate as a description, declined as a defect. Those are resolver, parser and gateway
      tests; they are not claimed to exercise classification, and the classification branches are
      covered by the guilt/innocence pairs and the outcome matrix. Not adopted, recorded so the
      next reader knows it was weighed rather than missed.
  - seat: session (build lane, self-audit while fixing the delivery finding)
    objection: >-
      send_alert took the gateway as a DEFAULT ARGUMENT bound at import, so a test patching
      TG_NOTIFY reached the REAL gateway and ran it at tier p0.
    status: CONFIRMED
    resolution: >-
      Nothing was delivered — the tg_notify spool holds no matching entry and its last write
      predates the run — but that is luck, not design. The path resolves at call time now, and the
      shape is written into the docstring: a module constant used as a default argument is frozen
      at import. Commit 72a92ae9a1.
  - seat: session (build lane, refuting a subagent)
    objection: >-
      A consumer-map subagent reported that practice_types.base_price has ALREADY drifted from the
      sheet, calling it "drift that has already happened, not a hypothetical".
    status: RETRACTED
    resolution: >-
      Refuted on the numbers. The claim was inferred from migration dates. Measured against the
      live DB: 74 of 112 rows match by normalized name and all 74 are identical to the cent. One
      real divergence exists (B1 - VOA 750.000 vs the sheet's 790.000) and five placeholder-priced
      rows exist but are is_active = f. The structural risk — two stores, no shared naming, no
      reconciliation — is real and is recorded in PENDING-ARMS; the asserted broad drift is not.
