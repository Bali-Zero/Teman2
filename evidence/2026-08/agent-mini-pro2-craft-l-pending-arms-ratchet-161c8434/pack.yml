seat_diversity_note: >-
  Three build lanes across two families (Moonshot + Anthropic), two review
  rounds by a third family (OpenAI). D3 is satisfied by a real build lane, not
  by seat_override.

  Recorded because it is the measurement, not the principle: the cross-family
  reviewer found 18 defects across two rounds that three Anthropic-side lanes
  and one Opus gate had all missed, including two that falsified claims written
  in the code's own comments. Round 2 was worth more than round 1 — it was
  aimed at the CURES, and four of its eight findings were blockers introduced
  or left open by round 1's fixes.
diff:
  net_lines: >-
    AS OF 6b501570dd (pinned — a bare byte count inside a file every subsequent
    commit rewrites is a claim that decays by construction): 9 files,
    +2425/-8, measured against the MERGE BASE. Deliberately over the ~400-line
    target and said plainly rather than split: 1,004 of those lines are the two
    test corpora and roughly 320 more are load-bearing comment — the executable
    surface is one CLI mode and one sort. Splitting the corpus from the code it
    guards would land a gate whose guilt fixtures arrive in a later PR, which
    is the shape this whole lane exists to stop.

    The count INCLUDES this evidence pack (3 of the 9 files), because that is
    what `git diff --numstat` against the merge base measures and a number that
    quietly excluded itself would be the same kind of convenient half-truth this
    pack spends its receipts refusing. The first attempt at pinning it added
    six lines of prose ABOUT converging, and so did not converge — corrected.

    Deterministic gear floor recomputed from this diff = 3 (source: path —
    .github/workflows/ is a hot zone). Gear 3 is the floor, not a choice.
  behaviour_change: >-
    On merge, PRs that touch PENDING-ARMS.md, pending_arms_report.py,
    organism_digest.py, or either corpus gain three steps on the NON-REQUIRED
    check-ledger-no-silent-loss job: a self-test of the ratchet's own detector,
    the two corpora (one of which had no executor at all), and the live ratchet.
    A red is loud on the checks list and does not block. Nothing changes for a
    PR that touches none of those paths.

    The digest's DEFAULT boot path is byte-for-byte unchanged on all three
    machines: ORGANISM_DIGEST_PENDING_ARMS unset still prints nothing, "1" still
    prints exactly one line. Only the new "rows" state costs anything.
