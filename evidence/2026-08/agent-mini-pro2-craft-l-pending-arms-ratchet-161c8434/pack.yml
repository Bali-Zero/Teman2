dissent:
  - seat: "gpt-5.6-sol (xhigh, read-only) — round 1, on the diff"
    objection: >-
      DO-NOT-SHIP, 10 findings, 1 blocker. The blocker falsified a claim the
      code made about itself: "an override cannot become a permanent blanket"
      was false, because an override inherited from BASE licensed every later
      branch — PR A writes <=445, merges, and PR B raises the count writing
      nothing. Also: a fenced or 4-space-indented EXAMPLE in the ledger granted
      a live ceiling (the gate disarmed by its own documentation); a 5000-digit
      ceiling crashed int() instead of being reported malformed; only the BASE
      read was guarded, so an unreadable HEAD escaped as a traceback and the
      process reported exit 1 — CANNOT-VERIFY wearing the costume of "this
      branch raised the count"; and two tests were tautologies, one of them
      the very test claimed to arm the gate.
    status: CONFIRMED
    disposition: >-
      All 10 accepted, all 10 reproduced on disk first, 0 rejected. Fixed in
      commit 91ff2e20ab.
  - seat: "gpt-5.6-sol (xhigh, read-only) — round 2, aimed at what the round-1 CURES broke"
    objection: >-
      DO-NOT-SHIP, 8 findings, 4 blockers. The deepest killed the headline
      claim: freezing a shared `now` does NOT remove the calendar, because it
      cancels ageing only for rows present on BOTH sides — a row the branch ADDS
      ages on one side of the subtraction alone, so the same unmodified PR reads
      delta 0 on the day it is opened and delta 1 three days later. A test in
      this branch had been written to ASSERT that late red, blessing the
      behaviour that contradicted the claim. Also: keying override identity on
      RAW BYTES meant restyling an inherited line (one extra space, an em dash,
      a comment wrapper) minted a "new" approval nobody reviewed — the round-1
      blanket restored by formatting; `[>#*+-]` stripped BLOCKQUOTES, so the
      ordinary way to quote an override in prose was a live authorisation; a
      boolean fence tracker let ``` close a ~~~ block, and a fence marker inside
      an HTML comment falsely opened a fence and silently ate a valid override.
    status: CONFIRMED
    disposition: >-
      All 8 accepted, all 8 reproduced on disk, 0 rejected. The clock is now the
      base commit's date — time removed from the computation rather than held
      still. Fixed in commit 1f303dcc4b. One trade-off declared rather than
      resolved: four spaces under a list item is legal Markdown continuation, so
      an override indented that far is refused; refusing a real override costs a
      red the author fixes by unindenting, accepting a documented example costs
      a silent blanket, and the safe direction is the refusal. Written at the
      site, and the RED output names the rejected line so it is never silent.
  - seat: "kimi-code/k3 — third family, on the final diff"
    objection: >-
      See journal.jsonl and the SHIP comment on issue #5319 for the verbatim
      findings and their dispositions.
    status: CONFIRMED
    disposition: >-
      Recorded with the round-1 and round-2 dispositions; a third family was
      reached for precisely because the first two rounds proved that a single
      reviewing family leaves defects a different one sees immediately.
