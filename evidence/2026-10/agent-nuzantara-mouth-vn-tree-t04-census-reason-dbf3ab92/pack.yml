decisions:
  - id: D-signed-sequence-only
    decision: >-
      The reason table is pinned for the signed sequence (27) only, like the dead-end and state tables:
      a fold adds its own sequence, and test_the_census_pins_the_signed_sequence names the omission.
  - id: D-order-pinned
    decision: >-
      Reason codes are compared as ordered tuples, because the sheet prints them in that order; a reorder is
      a visible change to the applicant and a reviewer should see it.
  - id: D-funnel-delta
    decision: >-
      The 7 walks a disclosure flag rewrites are a delta over the engine table, so the funnel sheet is pinned
      whole without restating the 20 rows the flags do not touch.
dissent:
  - seat: "codex gpt-5.6-sol (read-only red team, rollout 01a12dde-3ade-7240-b740-31c4f7afa2db, /Users/nuzantara/.codex/sessions/2026/10/12/rollout-2026-10-12T10-08-21-01a12dde-3ade-7240-b740-31c4f7afa2db.jsonl)"
    objection: "HIGH: test_interview_walk_census.py:1305 pins PAID_ACTIVITY_WITHOUT_INDONESIAN_SPONSOR for offshore/other/paid/employer_no, but the sheet says flatly no catalogue visa covers the combination, while E33G covers employment by a company established abroad at USD 60,000 a year (bontang.imigrasi.go.id)."
    status: RETRACTED
    disposition: >-
      REJECTED (dissent, no code change): the premise about the copy is false and the rule is not the one E33G answers. (1) The sheet for this
      code (engine-adapter.ts PAID_ACTIVITY_WITHOUT_INDONESIAN_SPONSOR, EN and ID) does not say no visa
      covers the combination: it says the work routes are closed because an Indonesian work permit is issued
      to a sponsoring entity in Indonesia, then NAMES the Second Home Visa - Remote Worker (E33G) as the open
      door when the work is done from Indonesia for that same foreign employer with no Indonesian-source pay,
      and the Business Visit Visa (C2) for meetings. (2) The pinned rule hf.employment-without-indonesian-sponsor
      (seq-27 source) reads purpose EMPLOYMENT (work done in Indonesia) with work.employer_is_indonesian_entity;
      E33G eligibility (el.e33g.remote-work) reads purpose REMOTE_WORK, a separate interview branch whose walks
      (offshore/remote, onshore/remote, offshore/remote/foreign_only and its income_59999/income_60000
      boundary walks) are already pinned, so the USD 60,000 income question belongs to that branch and is not
      asked on the paid-activity branch by design. (3) The pin records what the signed pack evaluates today
      (state, candidates and codes were already pinned as NO_SUPPORTED_PATH before this PR); it is a
      regression pin, not a legal certification, and this PR is test-only with the E33 copy and the pack owned
      by other tracks. If a reviewer wants the paid-activity branch to route a foreign-employer worker into
      the remote branch, that is a tree change with its own PR and would move this pin by name, which is what
      the pin is for.
  - seat: "codex gpt-5.6-sol (read-only red team, rollout 01a12dde-3ade-7240-b740-31c4f7afa2db, /Users/nuzantara/.codex/sessions/2026/10/12/rollout-2026-10-12T10-08-21-01a12dde-3ade-7240-b740-31c4f7afa2db.jsonl)"
    objection: "MEDIUM: the candidate-pack replay requires reason pins only for _SIGNED_SEQUENCE and never calls _reason_violations, so an unsigned fold could change reason codes or their order and stay green until signing."
    status: RETRACTED
    disposition: >-
      CURED in the commit that carries this pack: real. Test first: three tests (candidate sequence without a reason table is caught by name, a reordered
      reason on a candidate replay is caught, seq-27's own source replays clean through the candidate path)
      failed on NameError. Then _candidate_reason_violations(sequence, replayed) was added and wired into
      test_every_walk_ends_in_its_pinned_outcome_on_the_candidate_pack, so an unsigned candidate is graded
      against its own sequence's EXPECTED_REASONS_BY_SEQUENCE row and a candidate with no row fails by name.
      The candidate test is skipped today (no unsigned source above seq-27), which is why the helper is
      tested directly, including a replay of seq-27's source through the same _outcomes_on path.
