decisions:
  - id: D-signed-sequence-only
    decision: >-
      The reason table is pinned per signed sequence (27 kept, 28 added by the post-gate rework), like the
      dead-end and state tables: a fold adds its own sequence, and test_the_census_pins_the_signed_sequence
      names the omission. test_the_reason_pins_name_the_causes_this_audit_found_unpinned asserts each
      sequence's table explicitly (the business row differs: seq-27 pairs it with AGE_BELOW_55, seq-28 does not).
  - id: D-order-pinned
    decision: >-
      Reason codes are compared as ordered tuples, because the sheet prints them in that order; a reorder is
      a visible change to the applicant and a reviewer should see it.
  - id: D-funnel-delta
    decision: >-
      The 7 walks a disclosure flag rewrites are a delta over the engine table, so the funnel sheet is pinned
      whole without restating the 20 rows the flags do not touch.
dissent:
  - seat: "codex gpt-5.6-sol (read-only red team, rollout 01a12dde-3ade-7240-b740-31c4f7afa2db, /Users/nuzantara/.codex/sessions/2026/10/12/rollout-2026-10-12T10-08-21-01a12dde-3ade-7240-b740-31c4f7afa2db.jsonl)"
    objection: "HIGH: test_interview_walk_census.py:1305 pins PAID_ACTIVITY_WITHOUT_INDONESIAN_SPONSOR for offshore/other/paid/employer_no, but the sheet says flatly no catalogue visa covers the combination, while E33G covers employment by a company established abroad at USD 60,000 a year (bontang.imigrasi.go.id)."
    status: CONFIRMED
    disposition: >-
      PREMISE CONFIRMED, NO CODE CHANGE IN THIS PR (rewritten after the fresh gate, head 1a5de160f5; the
      first disposition wrongly rebutted the premise). What the applicant of this walk actually reads is NOT
      the static PAID_ACTIVITY_WITHOUT_INDONESIAN_SPONSOR sheet (engine-adapter.ts:742-745, which names E33G
      and C2): reason() sends the code through FACT_DERIVED_NO_PATH_CODES (engine-adapter.ts:1242) into
      paidActivityWithoutIndonesianPayerReason (engine-adapter.ts:1208-1218), and for the facts of this walk
      (other_paid_activity=yes, work_payer=no) that function returns "No visa in our catalogue covers that
      combination" (ID: "Tidak ada visa dalam katalog kami yang mencakup kombinasi tersebut"). The pack's own
      catalogue carries the Second Home Visa - Remote Worker (E33G) and the imigrasi.go.id page grants it for
      work for a company abroad at USD 60,000 a year or more, so that sentence is too flat: the red team's
      premise about the copy is true. WHY the pin still stays, and why no code changes here: (1) this PR
      pins reason CODES, test-only; the code pinned is exactly what the signed pack (seq-27) emits today,
      and state and candidates of this walk were already pinned as NO_SUPPORTED_PATH before this PR, so the
      pin adds no new claim about the copy. (2) The pinned rule hf.employment-without-indonesian-sponsor reads
      purpose EMPLOYMENT with employer_is_indonesian_entity=false; E33G eligibility (el.e33g.remote-work)
      reads purpose REMOTE_WORK, a separate branch whose walks (including the income_59999 / income_60000
      boundary) are pinned, so routing a foreign-employer worker into that branch is a tree change with its
      own PR and would move this pin by name. (3) The pin is a regression pin, not a legal certification;
      the E33 copy is owned by another track. WHERE THE COPY DEFECT GOES: the fact-derived sentence
      (paidActivityWithoutIndonesianPayerReason, EN and ID) is a client-copy fix for the work family. The
      work-family plan entry PR-01 only rewrites the static sheet, which this walk never reaches, so PR-01
      needs its acceptance widened to the fact-derived sentence (or that sentence needs its own plan entry);
      reported to the orchestrator, not done here because copy is out of this PR's scope.
  - seat: "codex gpt-5.6-sol (read-only red team, rollout 01a12dde-3ade-7240-b740-31c4f7afa2db, /Users/nuzantara/.codex/sessions/2026/10/12/rollout-2026-10-12T10-08-21-01a12dde-3ade-7240-b740-31c4f7afa2db.jsonl)"
    objection: "MEDIUM: the candidate-pack replay requires reason pins only for _SIGNED_SEQUENCE and never calls _reason_violations, so an unsigned fold could change reason codes or their order and stay green until signing."
    status: CONFIRMED
    disposition: >-
      CURED in commit 1a5de160f5 (the finding was real; the first pack wrongly marked it RETRACTED, and the
      fresh gate confirmed the cure). Test first: three tests (candidate sequence without a reason table is
      caught by name, a reordered reason on a candidate replay is caught, seq-27's own source replays clean
      through the candidate path) failed on NameError. Then _candidate_reason_violations(sequence, replayed)
      was added and wired into test_every_walk_ends_in_its_pinned_outcome_on_the_candidate_pack, so an
      unsigned candidate is graded against its own sequence's EXPECTED_REASONS_BY_SEQUENCE row and a
      candidate with no row fails by name. The candidate test is skipped today (no unsigned source above
      seq-27), which is why the helper is tested directly, including a replay of seq-27's source through the
      same _outcomes_on path. The fresh gate re-proved it by mutation: a swapped cause in a scratch copy of
      the seq-27 source is invisible to the old outcome check and caught by the new reason check.
  - seat: "fresh Opus 5.5 final-gate seat on Pro (rollout gate on head 1a5de160f5, verdict REWORK-BUILD)"
    objection: "Four rework items: (1) the rebuttal of the HIGH dissent is false (pack dissent, body Review bullet and the commit message of 1a5de160f5 say the sheet names E33G, but the applicant reads the fact-derived 'No visa in our catalogue covers that combination'); (2) dissent statuses wrong (HIGH marked RETRACTED though codex never retracted; MEDIUM was real and cured, so CONFIRMED); (3) implementer seat named 'Claude Sonnet 5.5', not a roster alias; (4) the commit message of 1a5de160f5 carries the same false sentence."
    status: CONFIRMED
    disposition: >-
      ALL FOUR CURED in the commit that carries this pack. (1) The HIGH disposition above is rewritten to
      concede the copy premise, cite engine-adapter.ts:1208-1218, keep the code-pin reasons and name where the
      copy defect goes (work-family PR-01 acceptance). (2) Statuses are now CONFIRMED for both codex entries.
      (3) lanes[0].seat records the seat that built the work (claude-opus-5-5, the model named in the commit
      trailers). (4) The branch is unpushed but the repo rule is never --amend, so the false sentence in the
      body of 1a5de160f5 is superseded by the message of this cure commit, and the PR body (T04.body.md) and
      the squash message carry the corrected text; the original commit body is not rewritten.
