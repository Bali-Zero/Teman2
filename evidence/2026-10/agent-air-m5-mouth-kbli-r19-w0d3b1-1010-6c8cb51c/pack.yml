dissent:
  - seat: claude-opus-5-5
    objection: "The WIP's shadow reach (the sum of a shadow's lengths, any stacking) made the first M5 run print shared-component-drift 15: the /v2 mobile CTA bar (fixed, z-40, a shadow cast down) 'occluded' the footer links above it, and the nav behind the opened MobileNav 'occluded' its labels."
    status: CONFIRMED
    resolution: "The reach is per side (blur plus spread less the offset away from that side, a transparent or inset shadow reaching nothing) and only from an overlay elementsFromPoint names above the run's ancestors where its box comes nearest. Rows I-glow-behind-the-surface, I-shadow-cast-down, I-transparent-shadow; mutants B15-B17. The second run printed drift 0."
  - seat: claude-opus-5-5
    objection: "The second M5 run counted 14 'occluded' runs at rest that no reader is meant to see: the content of closed <details> on the code pages, whose boxes are laid out under the section after them."
    status: CONFIRMED
    resolution: "Text that is not rendered (checkVisibility false) is not a run. Row I-closed-details fails without the cure; mutant B18. The third run printed G 440."
  - seat: claude-opus-5-5
    objection: "Three of the first seventeen mutants survived: B3 (hides ignores the walk's scrims), B7 (the reach ignores a blur), B16 (a shadow reaches against its offset)."
    status: CONFIRMED
    resolution: "B3: I-under-the-walks-scrim had #d over the run, so the roots clause, not the scrim clause, cleared it; #d moved to the bottom. B7: no row isolated a blur's reach; G-blur-reach added. B16: I-shadow-cast-down's run sat beyond the mutant's reach; moved within it. Each row was traced under its mutant before the full rerun."
