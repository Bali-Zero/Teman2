objective: |
  Mission kbli-nav-design-loop, Track W, lot W0d-3b-1 (ruling: W0d-3a -> 3b-1 -> 3b-2): the
  instrument cures of the #8202 and #8228 gates' notes, on today's list (30 captures, 10 walks,
  25 opened, 24 shared), with no scenario added or changed.
    1. #8228 note 1: a run that stays under an occluder its reader cannot see is counted (its own
       line under G at rest and under K opened), so K 0 reads as clean only when it is.
    2. Note 2: a walk whose page reloads under it is walked once more.
    3. Note 3: a faint fixed layer is read through, not an occluder of every run.
    4. Note 4: a blur or a shadow reaches past its box, side by side (three blur radii; a visible
       outer shadow's blur plus spread less its offset away from that side; up to 64px), and only
       from an overlay painted above the run.
    5. Note 5: the theme a walk starts in holds at every scroll position, or the walk fails.
    6. A scrim is found by any paint (a colour, or an image or backdrop filter at opacity 0.1 or
       more); a colourless scrim or one over an image is off contract.
    7. The TanStack Query devtools button is never painted; the sector card is not hovered.
    8. The #8237 gate's notes: every count a missing part feeds reads INCOMPLETE (reads and colours
       without `rest` included); part dumps are never mixed across machines; a re-run part replaces
       its own dump (`overwrite`), exercised once in CI.
  Every cure ships with its guilt or innocence row, the fixture is regenerated on M5, and a CI
  pair (four parts, and the single full job) runs on the head.
