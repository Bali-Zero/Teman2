  - text: "WHEN the regenerated fixture is replayed, THEN it prints the M5 live verdict byte for byte, and its counts are the ones the fixture tests pin."
    probe: "python3 -m pytest scripts/mouth/tests -q -k 'not e2e'"
  - text: "WHEN CI runs the four parts and, on the same commit, the single full job, THEN the two wrapper-census-states verdicts are byte-identical and all five asserts pass; WHEN one part job of the sharded run is re-run, THEN it replaces its dump and the re-run aggregate prints the same text."
    probe: 'gh workflow run r19-wrapper-census-tests.yml --ref agent/air-m5/mouth/kbli-r19-w0d3b1-1010 (default parts, then -f parts=''["full"]''); cmp the two verdict texts'
