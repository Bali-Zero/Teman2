residuals:
  - "L1: an exception raised mid-walk inside a candidate (only through a bug) journals that candidate failed:internal with 0 bytes and the rule error:internal although some of its files were unlinked; rc is 10, the cooldown is stamped and freed_fs_bytes still reports the filesystem's figure."
  - "L2: the unreadable-link-registry early return keeps its audit-error entries in code, but no test pins it (a mutant that drops them passes the suite)."
  - "Processes of other users and root are invisible to lsof without root, and a same-user hostile process is out of scope: the organ is a hygiene tool, not a security boundary (the spec's threat model)."
  - "A browser launched by path from an unpinned revision in the instant between the last look and the unlinks: one failed automation run and a re-download, as Playwright's own GC accepts."
  - "Dry-run first: the apply flip (PRO_JANITOR_APPLY=true) and the removal of disk_janitor.sh's uv step are rollout step 3, after a merger-tick trough is observed."
