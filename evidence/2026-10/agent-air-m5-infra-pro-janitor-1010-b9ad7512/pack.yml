task_id: pro-janitor-1010
mission: LOCALCI-SOVEREIGN (Pro free-space keeper, rollout step 2 of 3)
colour: BLUE
gear: 3
gear_reason: >-
  The lint floor is 3 by path (a new launchd organ with wrapper, plist, declared pairs and registry entry); the organ deletes files
  on Pro.
l_level: L2
gate_class: opus
brief_ref: evidence/brief.yml
council_run: council-journal.jsonl
objective: >-
  pro.janitor keeps Pro's free space up from host caches only (uv cache prune, npm cache verify, old unpinned Playwright revisions),
  with tiers and hysteresis, fd-anchored removal under Playwright's own install lock held as a monotonic lease, blast-radius caps, a
  kill switch and dry-run first; nothing inside Colima or docker.
acceptance:
  - text: A failed INSTALLATION_COMPLETE (EPERM, young, changed, stat error) SHALL stop the candidate with nothing else in it touched.
    probe: "scripts/tests/test_pro_janitor.py (marker cases, real chflags UF_IMMUTABLE)"
  - text: Every unlink and rmdir SHALL be refused once the lock lease ran out, the lock is not our inode, or the wall clock drifted from the monotonic clock.
    probe: "scripts/tests/test_pro_janitor.py (lease cases)"
  - text: No planted name, number or file SHALL crash the run; journal and state are always written.
    probe: "scripts/tests/test_pro_janitor.py (symlink chain, vanishing link, error:internal cases)"
  - text: A tool past its deadline SHALL be killed by process group with its leader un-reaped until the last killpg.
    probe: "scripts/tests/test_pro_janitor.py (deadline ordering case)"
consumer_map:
  - launchd organ pro.janitor on Pro (com.nuzantara.janitor, StartInterval 600), its journal ~/logs/pro-janitor/journal.jsonl and heartbeat ~/.organism/last_seen/pro.janitor.json.
