    role: review
    seat: codex-gpt-5.6-sol and kimi-code/k3, two rounds (council-journal.jsonl)
pii_scan: clean
pii_scan_note: A stdlib payload, a bash wrapper, a plist, registry entries and tests on tmp fixtures. Tool cache revision names only; no client data.
what_changed: |
  scripts/ops/pro_janitor.py (new, stdlib, Python 3.9): tiers AMBER/RED/BLACK with hysteresis on statvfs of the Data volume; rules
  uv-prune (6 h), npm-verify (24 h) and playwright-old (24 h, RED) with Playwright's .links registry pins honoured and fail-closed;
  removal through descriptors anchored at /, re-audited per object (.git in any case, mtime/ctime under 7 days, other device, inode
  change); invariant 8, Playwright's __dirlock taken the same way and held as a lease on the monotonic clock (acquire within 4 s,
  refresh every 2 s by a thread with its own fd, check before every unlink and rmdir with a wall/mono drift check, release by the
  same sequence); invariant 9, INSTALLATION_COMPLETE first and any failure on it stops the candidate; blast radius 10 GB and 200 000
  objects per run; kill switch read at least once a second; lsof completeness by a held canary; unresolvable input is a skip or
  error:internal (entries kept, cooldown stamped in apply), never a crash; a tool past 300 s is killed by group with its leader
  un-reaped until the last killpg. scripts/tests/test_pro_janitor.py (275). infra/launchagents/com.nuzantara.janitor.plist
  (StartInterval 600, no KeepAlive, PRO_JANITOR_APPLY=false); the wrapper with the organ genes; three declared pairs; the registry
  entry. docs/specs/pro-janitor-2026-10-10.md: the threat model and invariants 1-9, the arbiter of every review.
proof: |
  The suite on tmp fixtures (fake uv/npm/lsof, real chflags, real symlink chains, injected clocks); every gate reproduced its
  findings and their cures on disk under /usr/bin/python3 -I (3.9.6, Pro's interpreter) with its own scripts, and applied its own
  guilt mutations through PJ_PAYLOAD. A read-only plan probe on Pro found 25 pins and 0 candidates today.
