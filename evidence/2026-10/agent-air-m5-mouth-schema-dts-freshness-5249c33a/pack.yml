  floor job fails by design on the missing verdict.
mission: >-
  Arm layer 2 of the schema.d.ts freshness problem. Layer 1 (backend OpenAPI JSON vs the
  pinned sha256) is guarded by test_generate_openapi_schema_pin.py (SHWEB-20260911
  PR-RISYNC); its own docstring names the render layer as the deliberate scope gap this PR
  closes: regenerate the backend OpenAPI with the repo's own scripts.generate_openapi,
  re-render schema.d.ts with the lockfile-pinned openapi-typescript, Prettier --write, and
  git diff --exit-code over schema.d.ts + the drift pin, as steps of the already-required
  mouth leg of frontend-tests in .github/workflows/tests.yml (NOT a new job — branch
  protection pins required contexts by name, W69).
