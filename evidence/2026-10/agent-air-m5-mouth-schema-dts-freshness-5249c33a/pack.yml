# committed apps/mouth/src/lib/api/schema.d.ts. Written by the builder seat
# (kimi-code/k3, Air-M5 thin client, worktree .worktrees/mouth-schema-dts-freshness).
# Every receipt is a command this seat executed on 2026-10-05 (UTC stamps); outputs are
# quoted from those runs. The worktree's apps/backend-rag/.venv and node_modules are
# read-only symlinks into the main checkout — nothing was installed on M5.
