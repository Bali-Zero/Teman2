    which executes the new steps green; the first observation of the red direction in
    CI belongs to the first backend-contract PR that skips regeneration after merge.
decisions:
  - id: D-home
    decision: >-
      Steps live in the existing frontend-tests mouth leg, not a new job and not
      frontend-typecheck.yml. Rationale: (a) W69 — a new context is born unrequired;
      (b) the job already installs the mouth workspace deps this step needs
      (openapi-typescript, prettier at the root workspace bin); (c) the GARUDA
      generated-contract step directly above is the exact precedent (mouth-gated step in
      this leg, comment says so). frontend-typecheck.yml was rejected: it would need the
      same Python+uv additions anyway and its sentinel relevance regex would also have to
      learn backend-rag paths.
  - id: D-openapi-source
    decision: >-
      The step regenerates openapi.json from the backend app (python -m
      scripts.generate_openapi) rather than any committed snapshot or live URL. No
      committed openapi.json snapshot convention exists (apps/backend-rag/openapi.json is
      gitignored; the only committed artifacts are schema.d.ts and its pin), and fetching
      the deployed /openapi.json would test a moving external truth. The generation is
      side-effect-free (no ASGI lifespan, no DB/network — the pin test's own docstring
      proves it, receipt R6 re-proves it with env -i and no .env reachable).
  - id: D-cache
    decision: >-
      Council finding F-1 (tp1-qwen3.8-max, round 1): the first draft's comment claimed
      "restores main's warm copy" but no cache step existed — every run would have been a
      cold multi-minute uv install pressing the 16-minute cap. Cured before merge by
      adding the actions/cache/restore@v6 step with the byte-identical key Backend Shard
      uses (restore-only, same hygiene as the node cache in this job).
  - id: D-error-banner
    decision: >-
      Council finding F-7 (tp1-qwen3.8-max, round 1): bare git diff --exit-code prints a
      raw diff that is easy to miss in a long log. Cured with an ::error annotation
      naming the regeneration command, matching the repo's readable-failure style.
  - id: D-unpinned-uv
    decision: >-
      Council finding F-2 (tp1-qwen3.8-max, round 1) suggested pinning uv. NOT cured:
      the install line is byte-identical to Backend Shard's own
      `pip install --upgrade pip uv` (tests.yml), and this task's contract says to follow
      the neighbouring step style exactly. A divergence from the neighbour to satisfy a
      reviewer is its own risk; recorded here and in dissent instead.
  - id: D-vacuous-output-path
    decision: >-
      Council findings F-8 (tp1-qwen3.8-max round 1, LOW) and M1 (codex-gpt-5.6-sol round
      2, MEDIUM — the sharper form): if generate:api became a no-op or were repointed, the
      step would format and diff the stale committed file against itself and go green. CURED
      in the final candidate: `rm -f src/lib/api/schema.d.ts` runs before `npm run
      generate:api`, so an un-recreated target survives as a deletion in the git diff and
      the step reds regardless (the rm line itself is mutation-pinned by the new test, so
      removing the guard is a visible diff, not a silent one). Receipt R9 proves the attack
      direction red with the cure in place.
  - id: D-mutation-pin
    decision: >-
      Council finding M2 (codex-gpt-5.6-sol round 2): the 21 existing required-context-map
      tests pin the neighbouring typecheck step but nothing pinned the new gate — deleting
      or disarming all four freshness steps would leave every test green. CURED: scripts/
      tests/test_required_context_map.py gains _assert_mouth_schema_freshness (presence,
      exact mouth gate, non-advisory posture, position between the GARUDA contract step and
      the mouth typecheck, fixed diff targets, the rm guard, the env trio, and identically
      gated setup steps) plus seven parametrized disarming mutations. 29 tests pass.
  - id: D-change-map-latency
    decision: >-
      Council finding (codex-gpt-5.6-sol round 3, MEDIUM): scripts/ci/change_map.py
      classifies apps/backend-rag/scripts/generate_openapi.py backend-only, so a PR touching
      ONLY the renderer would skip frontend-tests and this gate (the backend pytest checks
      the schema dict and pin, not the writer's bytes). NOT cured here: the resulting drift
      lands RED on the very next PR that touches any frontend or backend-contract path —
      loud with one-PR latency, never a silent permanent green — and re-routing the
      classifier corpus is a different concern with its own owners. Named as a follow-up.
