    the required check `Frontend Tests (Next.js) (mouth, true)` in tests.yml, mouth leg,
    on every PR the change-map routes to frontend-tests; a stale committed
    apps/mouth/src/lib/api/schema.d.ts (skipped generate:api, openapi-typescript bump,
    hand edit) turns that leg red at the "Check API schema.d.ts freshness (regenerate +
    diff)" step with an ::error naming the cure (npm run contract:visa-oracle).
  observation: >-
    Local, exact-command proof in the worktree (receipts R4/R5): a fresh regeneration +
    render + prettier exits 0 against the committed files (14:24Z), and a committed
    stale schema.d.ts (one-line hand edit in a local-only temp commit) makes the same
