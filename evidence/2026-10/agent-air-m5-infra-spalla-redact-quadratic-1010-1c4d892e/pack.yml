task_id: spalla-redact-quadratic-1010
mission: SPALLA-REDACT-QUADRATIC
colour: BLUE
gear: 3
gear_reason:
  scripts/lib/spalla_redact.sh is a hot-zone path (hot-zone-pr-gate.yml, evidence_pack_lint.py), so the lint floor
  and ceiling are gear 3 although the diff is 15 net lines.
l_level: L2
gate_class: opus
brief_ref: evidence/brief.yml
objective:
  redact_for_external's blank check no longer uses bash 3.2's quadratic pattern substitution, so a 70 KB branch diff
  reaches the Codex seat instead of spinning for 25 minutes in the redactor.
acceptance:
  - text:
      WHEN redact_for_external receives a body made only of tab, CR, LF and space THEN it SHALL return it as is; any other
      body (\v, \f, NBSP, an invalid byte, text) SHALL go through the redactor, under the C and a UTF-8 locale.
    probe: scripts/tests/test_codex_spalla_diff_redaction.sh (locale matrix rows)
  - text: WHEN the caller's LC_ALL is integer or readonly THEN an invalid-byte body SHALL still reach the redactor.
    probe: scripts/tests/test_codex_spalla_diff_redaction.sh (caller-attribute rows)
  - text:
      WHEN redact_for_external receives 200 KB of whitespace, 200 KB of clean text, or 200 KB with one email THEN on /bin/bash
      3.2 it SHALL return the first two unchanged and the third with only the email removed, every call exiting 0, inside a
      60 s watchdog.
    probe: scripts/tests/test_codex_spalla_diff_redaction.sh (large-body probe)
  - text: The existing redaction rows of the same test file SHALL stay green.
    probe: bash scripts/tests/test_codex_spalla_diff_redaction.sh
consumer_map:
  - .claude/scripts/codex-spalla.sh — the Codex second-opinion helper; every external-seat review prompt passes redact_for_external.
pii_scan: clean
pii_scan_note: A shell library line and a test with generated filler text. No client data was read or written.
plan_ref:
  Branch agent/air-m5/infra/spalla-redact-quadratic-1010 from origin/main; code commits (4b14c0fa5a the linear check,
  cd9fa5d3d8 byte-wise in the C locale, 189f5d0731 caller attributes and the hardened probe, f036f7d571 the locale proven
  by behaviour); a council (Codex, Kimi) each round and fresh Opus gates.
lanes:
  - lane: spalla-redact-build
    role: build
    seat:
      claude-opus-5-5 (interactive session on M5; every code commit; the first pack draft by a claude-sonnet subagent of
      that session)
  - lane: spalla-redact-gate
    role: review
    seat:
      "claude-opus-5-5, fresh read-only seats: CONFIRMED 189f5d0731 (2 LOWs, fixed in f036f7d571); a second fresh seat on
      f036f7d571"
  - lane: spalla-redact-codex
    role: review
    seat: "codex-gpt-5.6-sol via codex-spalla.sh (read-only, xhigh): rounds 1-4, journaled"
  - lane: spalla-redact-kimi
    role: review
    seat: "kimi-code/k3 via scripts/kimi_client.py (no tools, scrubbed env): round 1 timed out (non-judgement), rounds 2-3 journaled"
what_changed:
  'scripts/lib/spalla_redact.sh: redact_for_external''s blank check was ${input//[$''\t\r\n '']/}, quadratic on
  bash 3.2. It is now a regex match in a subshell that sheds the caller''s LC_ALL and its own variables, sets LC_ALL=C, proves
  the C locale by behaviour (a two-byte character counts as two), and counts only a no-match (status 1) of [^\t\r\n ] as blank;
  every step is chained, so a step that fails sends the body to the redactor. Blank keeps origin/main''s four bytes exactly.
  scripts/tests/test_codex_spalla_diff_redaction.sh: a locale matrix (C and a UTF-8 locale the host activates) of eight bodies
  with a stub redactor that makes the path visible; integer and readonly LC_ALL caller rows; the real redactor never returns
  an invalid-byte body with its email; a static guard against ${var//...} in code; a large-body probe in /bin/bash under a
  60 s process-group watchdog (200 KB blank, clean and one-email bodies, every exit checked, every other line compared).'
proof:
  "Measured on M5 with /bin/bash 3.2.57 (the consumer's interpreter). Guilt: the suite fails on origin/main's library
  (watchdog rc 142, static guard, readonly row), on 4b14c0fa5a (10 rows: vt, ff, NBSP, invalid byte), on cd9fa5d3d8 (integer
  LC_ALL), on a >100 KB passthrough and on a last-line redactor; ALL OK on f036f7d571. 8 MB blank in 1 s."
bites:
  consumer: .claude/scripts/codex-spalla.sh (the Codex second-opinion helper)
  observation:
    "Made before arming, from this branch: codex-spalla.sh on a branch diff of at least 70 KB (the size that never
    reached codex) returns a Codex verdict line instead of spinning in the redactor. After merge: the same from main."
