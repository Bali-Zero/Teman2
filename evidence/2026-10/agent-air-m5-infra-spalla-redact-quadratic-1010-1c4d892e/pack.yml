dissent:
  - seat: codex-gpt-5.6-sol round 1 (4b14c0fa5a)
    objection:
      'BLOCKER: under a UTF-8 locale an invalid byte fails [^[:space:]], so a body starting with one read as blank
      and its email skipped the redactor; \v, \f, NBSP became blank; the large-body test could not see a passthrough; no watchdog.'
    status: CONFIRMED
    resolution:
      "cd9fa5d3d8: byte-wise check of the four bytes in LC_ALL=C in a subshell; locale matrix with a stub redactor;
      an email inside 200 KB must be removed; 60 s watchdog."
  - seat: codex-gpt-5.6-sol round 2 (cd9fa5d3d8)
    objection:
      "MEDIUM: a caller with declare -i LC_ALL turns C into 0 (conditional bypass); the probe passed a last-line redactor
      with rc 1; the watchdog left children holding the pipe; the email body was 168 KB."
    status: CONFIRMED
    resolution:
      "189f5d0731: attributes shed and every step chained (fail toward the redactor); every exit status and every
      other line checked; a 200 KB body; a fork/setpgrp watchdog that kills the group."
  - seat: kimi-code/k3 round 2 (cd9fa5d3d8)
    objection:
      "MEDIUM: a missing en_US.UTF-8 silently degenerates the matrix; Linux bash 5 would hide a 3.2 quadratic; perl
      dependency."
    status: CONFIRMED
    resolution:
      "189f5d0731: the UTF-8 leg uses a locale the host activates, else SKIP; a static guard against ${input//...};
      coreutils timeout where perl is absent. The test runs in no CI workflow: its consumer is codex-spalla.sh on macOS."
  - seat: codex-gpt-5.6-sol round 3 and kimi-code/k3 round 3 (189f5d0731)
    objection:
      "LOW (Codex): the blank probe compared only the length; the static guard skipped lines with a # before the substitution.
      MEDIUM (Kimi, tests only): the matrix ran PATH bash while the probe pinned /bin/bash; LOW attribute rows gated on UTF-8;
      LOW the guard knew one spelling."
    status: CONFIRMED
    resolution:
      "f036f7d571: /bin/bash pinned for every child; whole-result compare; readonly blank row in any locale; the guard
      refuses ${var//...} over any variable on non-comment lines."
  - seat: claude-opus-5-5 gate (189f5d0731)
    objection:
      "LOW: a regex error status read as blank; [[ $LC_ALL == C ]] checks spelling, so a bash >= 4.3 nameref LC_ALL
      would keep UTF-8."
    status: CONFIRMED
    resolution:
      "f036f7d571: only status 1 is blank; the C locale is proven by behaviour (a two-byte character counts as two).
      The nameref case is untestable on M5 (bash 3.2 only) and is covered by the behavioural check whatever the version."
  - seat: codex-gpt-5.6-sol round 4 (f036f7d571)
    objection:
      "LOW: the static guard misses a ${var//...} that starts a continuation line; the watchdog could wait on a descendant
      that keeps stdout open after the probe's shell exits (not the current path)."
    status: PLAUSIBLE
    resolution:
      "Accepted as residuals: the guard is a tripwire for the known regression, not a parser; the probe starts no
      background descendants."
residuals:
  - "A caller with a readonly LC_ALL (or a no-op unset over an integer LC_ALL) sends every body, blank ones included, to the
    redactor, which fails closed on a short body: codex-spalla.sh would refuse instead of sending. Fail-closed by the contract;
    no current caller has that state."
  - The test runs in no CI workflow; its consumer is codex-spalla.sh on the macOS hosts (bash 3.2).
  - "The static guard is a line tripwire, not a parser: a substitution starting a continuation line passes it (Codex round 4)."
  - The watchdog kills the probe's process group on timeout; a descendant that kept stdout open after the probe's shell exited
    would hold the capture (the probe starts none).
council_run: council-journal.jsonl
appetite_exceeded:
  "A one-expression fix became four review rounds: the first replacement was itself fail-open under a UTF-8
  locale (Codex BLOCKER), and each later round hardened the contract and the tests against the seats' findings."
