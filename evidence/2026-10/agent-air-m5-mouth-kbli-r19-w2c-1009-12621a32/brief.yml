  - text: "WHEN the W1 test runs, THEN palette-outside-direction-a (r19 scope, 30/30 captures) prints 0."
    probe: "cd apps/mouth && npm test -- r19-wrapper"
  - text: "WHEN every painted state row whose class Tailwind generates is injected in the wrapper and driven into its state, THEN each paints its row hex with no alpha."
    probe: "python3 state_rows_probe.py"
  - text: "WHEN live_probe.py composites element opacity into the text colour on 5 pages x 6 states, THEN no text pair is below its threshold."
    probe: "python3 live_probe.py"
consumer_map:
