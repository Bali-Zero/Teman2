task_id: kbli-nav-design-n1-night
mission: kbli-nav-design-loop (Track A, build, lot N1 — night RootView renders are night)
colour: BLUE
gear: 2
gear_reason: >-
  Harness and census change in the render path (Snapshot and FoldCensus pin the theme override a user's toggle sets) with a
  new census check (N1) and a new mutant. The app's own theme logic is untouched; content frozen; no visible app change.
  Gear 2 so a fresh gate reads the diff.
l_level: L1
gate_class: opus
objective: >-
  One concern: a render or census named night is night. RootView re-syncs its theme from the persisted themeOverride and the
  system appearance on its first render, so a harness that only set Theme.mode drew a day window with night chips and a cream
  title on light paper when the machine's override was light. The harness pins themeOverride for its own process only, and
  png_census N1 fails a night root render whose chrome is not a night surface token or whose sheet title ink is under 4.5:1.
constraints:
  - Harness only: no change to RootView or any app behaviour; the override is pinned in the process argument domain, never written to the persisted defaults.
  - Content frozen.
acceptance:
  - text: A night root render SHALL be night all the way and a wrong one SHALL fail by its cause.
    probe: "Pro: png_census N1 on night root renders 0 FAIL; the same set without the pin: 2 FAIL (chrome not night, title 1.16:1); self-test 253/253 with 5 N1 cases"
  - text: The mutant table SHALL grow and hold.
    probe: "Pro: head_mutants.sh control rc 0 and all 14 mutants rc 1, nightrevert FAILs on N1 (night and day both)"
