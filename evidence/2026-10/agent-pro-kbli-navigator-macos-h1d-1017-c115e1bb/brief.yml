  - Expanding the sheet never makes it shorter than the collapsed one (E6).
  - The census windows are 1040x700 sidebar 300, 1040x700 sidebar 232, 1180x800 sidebar 232 (E7); the app's minimum window is 1040x700.
  - Step 9 (title whole) runs in the bare host as the NAMED CONTROL: the window host reads 0 words through PDFKit. Carried to H1g, not claimed here.
