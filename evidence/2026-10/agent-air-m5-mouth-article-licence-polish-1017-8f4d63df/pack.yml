    objection: >-
      llms-full.txt keeps a standalone MERP price (MERP (IDR 4-5M) in the
      stm-exit-reentry-permit-guide section) and the guard lets it pass: the test claims to scan
      both exports but does not recognise the defect present.
    status: CONFIRMED
    resolution: >-
      Resolved by 7918487eab (8 sections replaced from a fresh regeneration, 0 mismatches) and
      637376ebbc (parenthesis/clause MERP rule; a mutant restoring the line turns the guard red
      at public/llms-full.txt:245291).
  - seat: codex-gpt-5.6-sol
    objection: >-
      False positive: "Government PIRT filing fee: IDR 100,000." is flagged by the PIRT rule.
    status: CONFIRMED
    resolution: >-
      Resolved by 637376ebbc: a government / PNBP / market-range exemption with an innocence
      fixture.
  - seat: kimi-code/k3
    objection: >-
      Alcohol licence lines without the literal NPBBKC escape with any wrong price.
    status: CONFIRMED
    resolution: >-
      Resolved by 637376ebbc: a licence label accepts only 4M, 10M or 12M; guilt fixture
      "| Licenza alcolici (Golongan A) | 5.000.000 |".
  - seat: kimi-code/k3
    objection: >-
      "- MERP — IDR 1,000,000" and the PIRT market range would be mis-judged by the MERP and
      PIRT rules.
    status: CONFIRMED
    resolution: >-
      Resolved: the bullet form is a guilt fixture, the PIRT market range an innocence fixture.
  - seat: kimi-code/k3
    objection: >-
      A government MERP fee written in PROSE would still be flagged.
    status: PLAUSIBLE
    resolution: >-
      Accepted residual risk. The ruling's government MERP fact lives in the exit-reentry table
      row exempted by governmentMerpFact; no prose instance exists in the corpus, so the guard
      does not block today's truth.
