task_id: localci-b6-1008
mission: LOCALCI-SOVEREIGN (phase B, step B6)
colour: BLUE
gear: 3
gear_reason: >-
  The mandate declared gear 2; evidence_pack_lint floors it at 3 because the change adds a launchd plist
  (infra/launchagents/com.nuzantara.disk-floor.plist is a hot-zone path), so 3 is declared and the rest is the mandate's: retention the gate owns over its own objects (deps images by tag, run directories under the
  merger's state dir), a start floor on the tick and a read-only disk organ. Nothing flips: no workflow, branch protection,
  status or credential is touched; the candidate and base images are outside every removal set; decisions.jsonl is never
  touched; the organ and the new wrapper reach Pro only when the lead arms and deploys them.
l_level: L2
gate_class: opus
objective: >-
  From the spec paragraph RULED 2026-10-08 under Zero's directive (Pro keeps > 100 GB free, always): every merger tick ends
  with a prune it owns and journals — localci-deps images removed by explicit tag when no plan of the last 48 h names them and
  they are not the newest of their recipe, the builder cache older than 24 h, run directories trimmed at 7 and 30 days, fstrim
  after a removal — the tick starts no run under 60 GB host-free, and an organ pro.disk_floor reads the free space every 30
  minutes and pages under the floor.
constraints:
  - No .github/ file, branch protection, commit status or credential is touched; nothing is pushed, armed or run on Pro.
  - localci-candidate:* and localci-deps-base:* are never in a removal set; removal is `docker image rm <tag>`, never -f, prune -a or until= on images.
  - decisions.jsonl and everything outside <state>/runs and the gate's localci-deps images are never touched.
  - The tick decides first; the prune runs after it, never before.
acceptance:
  - text: WHEN a plan 47 h old names a deps image, it SHALL be kept; WHEN an image 72 h old is unnamed and not the newest of its recipe, it SHALL be removed by tag with the rule journalled.
    probe: "test_prune.py::test_an_image_a_plan_named_47_hours_ago_is_kept_and_one_unnamed_for_three_days_goes"
  - text: WHEN an image is the newest of its recipe, or was built under 48 h ago, it SHALL be kept with no reference.
    probe: "test_prune.py::test_the_newest_of_a_recipe_is_kept_with_no_reference_and_a_young_image_is_kept_unreferenced"
  - text: localci-candidate:1 and localci-deps-base:* SHALL never be in a removal set.
    probe: "test_prune.py::test_the_candidate_and_base_images_are_never_in_a_removal_set"
  - text: WHEN --dry-run is given, the prune SHALL remove nothing and journal would_remove.
    probe: "test_prune.py::test_a_dry_run_removes_nothing_and_journals_the_would_list"
  - text: A run directory SHALL stay whole under 7 days, lose logs/ and the call graphs from 7, and keep only status.json, hosted_compare.json and state/plan.json from 30.
    probe: "test_prune.py::test_a_run_keeps_everything_for_seven_days_then_its_verdict_and_loses_logs_and_call_graphs"
  - text: WHEN at least one image was removed and --fstrim is given, the prune SHALL run `colima ssh -- sudo fstrim -av` and journal the host GB after it; never otherwise.
    probe: "test_prune.py::test_fstrim_runs_only_after_an_image_went_and_the_host_is_read_again_after_it"
  - text: The wrapper SHALL run the tick, then the prune with --fstrim, passing the host's free GB to the tick.
    probe: "test_merger.py::test_the_tick_decides_first_then_prunes_with_fstrim_and_passes_the_host_reading"
  - text: WHEN the host has under 60 GB free, the tick SHALL journal skipped host_below_floor with free_gb and start no run, and the organ heartbeat SHALL be warning with the number.
    probe: "test_merger.py::test_the_tick_refuses_to_start_a_run_under_the_floor_and_journals_why"
  - text: pro.disk_floor SHALL write ok above 100 GB, warning from 60 to 100 and failed (status error) under 60, the free GB in note.
    probe: "test_disk_floor.py::test_ok_above_100_warning_from_60_to_100_failed_under_60"
assumptions:
  - text: The runner's `docker build` uses the current builder, which on Pro is colima (docker driver), so `docker builder prune` without --builder prunes the gate's own cache.
    status: verified
    note: Read on Pro with `docker buildx ls` (read-only) at 2026-10-08T12:03Z — `colima*` current, docker driver; localci-isolated is a docker-container builder that no file on origin/main names (git grep).
    probe: phase D — the prune line's builder_prune.tail on Pro names a reclaimed total.
  - text: A plan's mtime is the time it named its images (the plan is written once, at the run's start).
    status: unverified
    note: A run resumed days later rewrites its plan and so refreshes the reference; that only keeps an image longer.
    probe: phase D — prune lines whose kept rule is "named by a plan" against the run names' timestamps.
consumer_map:
  - scripts/localci/localci_merger_tick.sh on Pro (live copy ~/.nuzantara-cron/localci_merger_tick.sh) — the floor reading, the tick flags, the prune call, the heartbeat.
  - scripts/localci/merger.py tick and prune on Pro — the host_below_floor skip and the prune line in decisions.jsonl.
  - scripts/ops/pro_disk_floor_tick.sh on Pro (live copy ~/.nuzantara-cron/pro_disk_floor_tick.sh) — ~/.organism/last_seen/pro.disk_floor.json, read by the sentinel and the healer.
appetite:
  wall_clock_hours: 2.5
  adversarial_rounds: 0
