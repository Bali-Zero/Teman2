what_changed: |
  scripts/localci/prune.py (new): plan_refs reads every run's state/plan.json (a plan younger than 48 h names images by tag
  or id; any plan records the check that named a tag, the recipe when no label says it); image_decisions keeps an image named
  by a plan of the last 48 h, built under 48 h ago, the newest of its recipe or in the never-list (localci-candidate:*,
  localci-deps-base:*, and only localci-deps: is listed), and removes the rest by `docker image rm <tag>` (never -f), then
  `docker builder prune -f --filter until=24h` on the current builder; trim_runs trims run directories by the timestamp in
  their name (7 days: logs/ and the call graphs go; 30 days: only status.json, hosted_compare.json, state/plan.json stay);
  with --fstrim, `colima ssh -- sudo fstrim -av` after a removal; the VM's free GB through B3's df probe and the host's
  (/System/Volumes/Data) before and after.
  scripts/localci/merger.py: `prune` subcommand (--state-dir, --docker, --dry-run, --fstrim, --colima, --code-sha), one
  {"kind":"prune"} line; refuses a dir with no tick-written repo binding. `tick --host-free-gb N --min-host-free-gb 60`:
  under the floor it journals skipped host_below_floor and starts no run.
  scripts/localci/runner.py: the deps build labels its recipe (org.nuzantara.localci.recipe=<check slug>).
  scripts/localci/localci_merger_tick.sh: reads the host GB, passes the floor flags, runs the prune after the tick with
  --fstrim and --code-sha, heartbeat warning under the floor or on a failed prune; a main before B6 still ticks.
  scripts/ops/pro_disk_floor_tick.sh + infra/launchagents/com.nuzantara.disk-floor.plist + registry pro.disk_floor + two
  declared pairs: the organ, born via organ_birth.py.
  Spec paragraph after B5's (prettier: `*…*` to `_…_`, a blank line before the list); README rows and arming block; 38 B6
  mutant rules (8 of them from the council's round 1) and one realigned (sh-heartbeat-always-ok); tests test_prune.py, test_disk_floor.py (new) and rows in
  test_merger.py.
  Council round 1 (f1454d471f): no image removed while a plan is unreadable, a half-written plan still names its tags,
  Created to the nanosecond with ties kept, a linked runs/ never trimmed, the builder prune on every real prune and guarded,
  `failed` and exit 1 on a failed builder prune, fstrim or image, the prune under the tick's lease, an unread df starting no
  run, the organ's warning on a live previous run and its limits in MB.
  Addenda (583ee49243, 7b5ded52e5, 028b3f27bd): the never-list adds every service_images value of the BASE matrix,
  read from contexts_matrix.yaml (extracted by the wrapper at the tick's sha), each present one journalled under kept; an
  unreadable matrix removes nothing; per recipe two slots held by distinct images (the newest; the next image a plan of the
  last 48 h names), an unnamed image takes no slot, beyond them only an image named under 6 h ago stays; what a run without
  status.json names is kept. The young-image guard of B6-1 is retired under the cap.
  B6-1b (the lead's fold request, on top of 07ee910880): the never-list's journal rule names its reason — "service stand-in
  of the BASE matrix: never pruned", "never-list (the candidate or a base image): never pruned" — and a stand-in no plan names,
  10 days old, is kept under that rule (guilt test per real stand-in); mutant b6-stand-in-rule-unnamed.
  The addenda post-date council rounds 1 and 2; round 3 of both seats reviewed them at 583ee49243; the B6-1b delta (rule
  text and one test) was reviewed by no seat.
proof: |
  See receipts. Every behaviour is produced by the committed code on fixtures (a fake docker over a JSON world, fake colima,
  df, du and hostname); nothing ran on Pro but read-only looks. The prune and the floor reach Pro only when the lead replaces
  the wrapper's live copy, and the organ only when the lead arms it.
