  tests 556 (test_prune.py 403, test_disk_floor.py 77, test_merger.py 76), mutant rules 64, spec and README 95. The council's
  rounds and the lead's two addenda added about 280 of them. The organ alone (B6-4, about 270 with its test, registry, pairs
