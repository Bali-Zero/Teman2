dissent:
  - seat: codex-gpt-6-astra
    objection: "P1: trim_runs checks only the children: a runs/ that is a symlink to an archive gets its dated directories trimmed."
    status: CONFIRMED
    resolution: "trim_runs refuses a linked runs/ (`refused: <path> is a symlink`); test_a_linked_runs_directory_is_never_trimmed; mutant b6-runs-link-followed killed."
  - seat: codex-gpt-6-astra
    objection: "P1: a df that prints no number drops --host-free-gb, so the tick starts a run under the floor and the heartbeat says ok."
    status: CONFIRMED
    resolution: "An unread host reading starts no run and sets the heartbeat to warning (`host free space unreadable (df -Pk <path>): no run started`); the prune still runs. Same finding as Gemini's P1. Test and mutant b6-wrapper-df-unread-ticks."
  - seat: codex-gpt-6-astra
    objection: "P2: an unreadable plan is skipped, so an image only it names can be removed."
    status: CONFIRMED
    resolution: "While any plan is unreadable no image is removed: the plan is in images.errors and the prune exits 1. Gemini's P2 (a half-written plan skips the tag regex) is cured with it: the regex reads the raw text. Mutants b6-unreadable-plan-ignored, b6-half-plan-unread killed."
  - seat: codex-gpt-6-astra
    objection: "P2: Created truncated to the second can remove the truly newest of a recipe when two builds share a second."
    status: CONFIRMED
    resolution: "Created is read to the nanosecond, and an exact tie keeps every tied image. Mutant b6-nanoseconds-dropped killed."
  - seat: codex-gpt-6-astra
    objection: "P2: a failed builder prune, fstrim or VM measurement does not change the prune's exit, so the organ says ok; and an exception after a removal loses the line and the fstrim."
    status: CONFIRMED
    resolution: "The builder prune and fstrim are each guarded and journalled; `failed` lists builder_prune, fstrim or images, and the prune exits 1 on any, so the wrapper writes warning. A failed VM measurement reads as unmeasured (null), not as a failure. Mutant b6-prune-failure-ok killed."
  - seat: codex-gpt-6-astra
    objection: "P2: the prune does not take the tick's lease: a second wrapper could prune while a tick is naming an image."
    status: CONFIRMED
    resolution: "merger.py prune takes the same lease (flock on lease.lock plus lease.json); held, it journals {kind: prune, skipped: lease, holder} and removes nothing. Mutant b6-prune-beside-tick killed."
  - seat: codex-gpt-6-astra
    objection: "P2: the organ's single-instance skip writes ok without reading the disk."
    status: CONFIRMED
    resolution: "It writes warning `skipped: previous run alive (pid N), free space not read`. Same as Gemini's P1. Mutant b6-floor-organ-alive-ok killed."
  - seat: codex-gpt-6-astra
    objection: "P3: whole-GB flooring makes 100.5 GB a warning, against 'ok above 100 GB'."
    status: CONFIRMED
    resolution: "The organ compares in MB (ok above 100000, failed under 60000); 100.5 is ok and 59.9 failed, both tested."
  - seat: agy-gemini-3.1-pro
    objection: "P2: docker builder prune runs only after an image removal, though the cache grows with every build."
    status: CONFIRMED
    resolution: "It runs on every prune that is not a dry run. Mutant b6-builder-never killed (replaces b6-builder-always)."
  - seat: agy-gemini-3.1-pro
    objection: "P2: a missing runner.py makes the VM probe raise AttributeError, which cmd_prune does not catch."
    status: CONFIRMED
    resolution: "vm_free_gb reads any failure of the probe as unmeasured (null). test_an_unmeasurable_vm_is_none_never_a_crash."
  - seat: agy-gemini-3.1-pro
    objection: "P1: taint-output.json and receipts are deleted after 30 days although the spec protects receipts that carry a verdict."
    status: RETRACTED
    resolution: "The spec's rule 2 says that after 30 days a run keeps only status.json, hosted_compare.json and state/plan.json; the code follows it. The tension with 'receipts that carry a verdict stay' is in the spec itself and is named as a residual for the lead."
  - seat: agy-gemini-3.1-pro
    objection: "Round 2, P1: on the success path the prune drops the lease before it writes its journal line, exposing the journal to a tick that takes the lease at once."
    status: RETRACTED
    resolution: "journal() appends one line with O_APPEND and a torn-tail guard; a tick that cannot take the lease already writes its `skipped: lease` line without it. The lease guards the images and the runs, not the journal."
  - seat: codex-gpt-6-astra
    objection: "Round 2, P1: Path.glob swallows PermissionError, so a plan inside a run or state directory that cannot be traversed is never counted unreadable and its images can be removed."
    status: CONFIRMED
    resolution: "Not cured here: the round-1 fix is the depth-1 correction and the contract stops a fix-of-a-fix there. Named as a residual with its cure; the impact is a deps image rebuilt on the next run that needs it, never the candidate or base image."
  - seat: codex-gpt-6-astra
    objection: "Round 2, P3: a float holds Created to about a microsecond, so two images nanoseconds apart read as a tie."
    status: CONFIRMED
    resolution: "Not cured: a false tie keeps both images, the safe direction. Named as a residual."
  - seat: codex-gpt-6-astra
    objection: "Round 3, P2: the cap's rank counts tags, not distinct images: a newest image with two deps tags pushes a second image named 47 h ago to rank 3, and it is removed."
    status: CONFIRMED
    resolution: "Cured in 7b5ded52e5 and then by 028b3f27bd: two slots held by distinct image ids; a kept image's other tags keep it. Tests for a two-tag newest and a two-tag second; mutant b6-cap-counts-tags killed."
  - seat: codex-gpt-6-astra
    objection: "Round 3, P2: distinct images with an identical Created, or an image with no Created, all rank as newest and exceed the cap."
    status: CONFIRMED
    resolution: "Not changed: both err toward keeping, never toward removing a protected image; named as a residual."
  - seat: agy-gemini-3.1-pro
    objection: "Round 3, P1: image-id references never match because im['id'] carries `sha256:` and ID_RE extracts 64 hex characters."
    status: RETRACTED
    resolution: "ID_RE is `sha256:[0-9a-f]{64}`: it extracts the prefix with the hex (checked: findall returns 'sha256:aaaa…')."
  - seat: agy-gemini-3.1-pro
    objection: "Round 3, P1: an unlabelled image no plan names is its own recipe, the only image there, and is kept forever."
    status: CONFIRMED
    resolution: "Not changed: it errs toward keeping; images built from B6 on carry the recipe label, and older ones take it from any plan that named them (plans are kept 30 days and more). Named as a residual."
  - seat: agy-gemini-3.1-pro
    objection: "Round 3, P3: localci-deps-base:* images are journalled twice under kept."
    status: RETRACTED
    resolution: "localci-deps-base: does not start with localci-deps:, so deps_images never lists them; they appear once, from the never-list."
residuals:
  - "Council round 3, keep-side: distinct images with an identical Created, an image whose Created cannot be read, and an unlabelled image no plan ever named are all kept beyond the cap; none can remove a protected image."
  - "The spec paragraph in docs/specs/localci-sovereign-2026-10-07.md is the one handed over (verbatim); the lead's two addenda (service stand-ins, the cap of 2 with the 6 h grace) live in the code, the README and this pack, not in the spec text."
  - "A sample prune at 7b5ded52e5 kept one E2E image where the addendum allows two (an unnamed second ranked as image 2); 028b3f27bd gives the slots to named images only. Found by this lane on its own sample line, not by a seat."
  - "Council round 2 (Codex, confirmed, not cured because the fix-of-a-fix depth is reached): a run or state directory the prune cannot traverse hides its plan from Path.glob, which swallows the PermissionError, so the unreadable-plan guard does not fire. The cure is to walk runs/ with iterdir and treat any OSError other than FileNotFoundError on <run>/state/plan.json as unreadable. Impact until then: a deps image a hidden recent plan names can be removed and is rebuilt by the next run that needs it; the never-list is unaffected."
  - "Council round 2 (Codex, P3): Created as a float keeps about a microsecond, so two images nanoseconds apart read as a tie and both are kept."
  - "The spec's tension, named by Gemini round 1: rule 2 keeps only three files after 30 days, while 'what this does not do' says receipts that carry a verdict stay. The code follows rule 2; the lead rules if the 30-day set should keep receipts/*.junit.xml and taint-output.json."
  - "The prune runs on Pro only after the lead deploys the wrapper's home-fork copy (~/.nuzantara-cron/localci_merger_tick.sh, the README's cp/mv/cmp block); until then Pro ticks with the B5 wrapper and nothing is pruned."
  - "The floor organ pro.disk_floor is armed by the lead (README block 'Disk floor organ (B6, Pro)'); no PENDING-ARMS row was written by this lane."
  - "The one-shot cleanup of 2026-10-08 (contract, review, ~/logs/pro-disk-cleanup.log) is separate and not replaced."
  - "The organ's threshold tests live in scripts/localci/tests: no workflow runs a test under scripts/ops/** without a .github/ edit, so a change to the organ alone does not trigger them."
  - "The three biggest directories of ~ are in the organ's note only when it is not ok (the walk took 94 s on Pro)."
  - "failed is written as status error, prefixed 'failed:' in the note: the sentinel reads anything but ok/success/healthy/starting/degraded/warning as dead, and heartbeat.sh canonicalises failed to error."
  - "fstrim runs inside the prune (--fstrim), not as a wrapper line: the prune knows whether an image went and journals host_free_gb.after_fstrim."
  - "Images built before B6 carry no recipe label: their recipe comes from the plans that named them; one that no plan ever named is its own recipe and stays until removed by hand."
  - "B6-2's commit body says the call graphs are 77-125 MB; the read-only re-measure gives 77-114 MB, corrected in prune.py's comment."
