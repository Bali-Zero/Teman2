plan_ref: >-
  Mandate LOCALCI-SOVEREIGN phase B, step B6 (spec paragraph RULED 2026-10-08 under Zero's directive "Pro keeps > 100 GB
  free, always", handed over in full by the orchestrator), to Dux B6 on 2026-10-08 with a 2.5-hour budget from about 11:25Z,
  from origin/main bd01d19f93. Measured in the spec: Pro's data volume fell 82 -> 46 -> 13 GiB free in 48 h with the merger
  running, and the writer was the gate (five localci-deps images in 24 h, Pysa receipts of ~630 MB per run). Two addenda
  from the lead the same day, after 12:46Z: service stand-ins of the BASE matrix in the never-list (07:48Z's prune had removed
  postgres:15 and redis:7 and #8093's backend tick was BLOCKED), and a cap of 2 deps images per recipe (#8093 built a second
  11.9 GB E2E image; 46 GB of deps images in the VM, the sparse disk 38 -> 50.7 GiB in one tick).
