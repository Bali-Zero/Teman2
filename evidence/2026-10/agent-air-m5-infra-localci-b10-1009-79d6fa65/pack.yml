brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-SOVEREIGN step B10, from the lead's message of 2026-10-09 (rule B10 RULED by the lead after the lead read the journal
  on Pro and GitHub: the only FALSE_GREEN of 84 decisions, pr7961 Backend Tests (Python), was a hosted run of 2026-10-06 on an older
  main), to the Dux implementer, from origin/main 11d0d5ebfa, 60-minute budget. Build only; a separate session gates and ships.
lanes:
  - lane: localci-b10-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux implementer, M5; Pro, GitHub and the journal not touched: the measurement is the lead's)"
pii_scan: clean
pii_scan_note: Comparator and merger code, tests on synthetic git repos under tmp, a README bullet and a spec paragraph. The pr number and context names are the repository's own CI metadata; no client data was read or written.
what_changed: |
  scripts/localci/hosted_compare.py: class HOSTED_STALE (counted apart, outside COMPARED); hosted_entries keeps each entry's
  completed_at; hosted_verdict returns the completed_at of the entries that decided the verdict (the reds when red, else the counted
  ones; None when any is unreadable); compare takes an optional stale_judge: a compared row (AGREE, FALSE_GREEN, FALSE_RED) whose
  judge answers stale becomes HOSTED_STALE with class_before, hosted_completed_at, hosted_main, main_moved_paths (at most 20) and
  main_moved_count; a judge that cannot answer, raises or answers in any other shape keeps the class with stale_check
  "unknown (<why>)". Without a judge nothing changes.
  scripts/localci/merger.py: StaleJudge reads, in the mirror, the BASE matrix (runs_when per context), the newest first-parent commit of
  base_sha dated at or before the hosted completed_at, the paths between it and base_sha, and classifies each path with the BASE
  scripts/ci/change_map.py run as the runner runs it (-I, trusted_env from the runner module that sits beside merger.py);
  hosted_summary passes the judge and journals stale / stale_unknown beside the counts; decide builds it from the mirror and the
  decided base. The report applies the judge to its own comparison and, for each decision with a recorded FALSE_GREEN, re-reads the
  run dir's hosted_compare.json and the head's check-runs through read-only GETs, reclassifies a row only when the red is still the hosted verdict
  and the evidence holds, and prints false_green=N (recorded=R, reclassified HOSTED_STALE=S: [...]); the JSON carries
  recorded_context_false_green (the remainder), recorded_false_green_as_journalled and recorded_reclassified_hosted_stale.
  README: the HOSTED_STALE bullet and the corrected F1 residual (a conflict never counts a git error). Spec: one B10 paragraph before
  "Phase E never precedes D".
  Tests: test_hosted_stale.py (new, 25 cases on a fake mirror with dated main, the compare classes, the tick summary) and
  tests/stale_fixture.py; 5 cases in test_merger_report.py, 1 in test_merger.py. 16 mutant rules in their own block after the F1 rules.
proof: |
  Every behaviour is produced by the committed code on fixtures under tmp (real git repos with dated commits and the real
  change_map.py, GitHub faked); nothing ran on Pro and nothing was pushed. It reaches Pro when the tick next extracts merger.py and
  hosted_compare.py from main.
bites:
  consumer: >-
    The launchd tick com.balizero.localci-merger on Pro (decisions.jsonl and the run dir's hosted_compare.json) and
    `merger.py report` on Pro (report.json and its phase E line).
  observation: >-
    Owed after merge and the tick's next extraction (this lane does not ship): on Pro, `merger.py report` prints
    reclassified HOSTED_STALE=2 naming both recorded rows, pr7961 (2026-10-08T18:25:57Z) and pr7962 (2026-10-08T19:25:16Z), each
    `Backend Tests (Python): main moved ... after hosted ran 2026-10-06T02:...`, report.json carries them under
    recorded_reclassified_hosted_stale, and any recorded row it keeps is listed with its reason under kept. The remaining
    false_green=N drops by those two recorded rows AND by whatever the live per-context recompute moves to HOSTED_STALE
    (context_counts.HOSTED_STALE in report.json); the next decision whose hosted run is older than its base journals a
    hosted_compare.stale or stale_unknown entry.
