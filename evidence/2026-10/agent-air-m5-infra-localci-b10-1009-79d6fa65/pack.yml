dissent: []
residuals:
  - "No adversarial round: the lint's gear-2 floor comes from its size term alone and asks for none; the independent gate is the lead's."
  - "A context with no runs_when in the BASE matrix is selected by no path: its stale hosted verdict stays unknown and keeps its class. Narrow on purpose; an always-run context would make every old hosted run stale."
  - "The PR-level class (merger vs GitHub's red-dominant verdict on the queue commit or head) is not judged for staleness; only the per-context rows are. A stale red at PR level still counts under counts.FALSE_GREEN."
  - "The enqueue criterion's hosted_required_green still reads the live verdicts as they are: a stale hosted red on the PR head keeps refusing an enqueue."
  - "The report reclassifies a recorded row only when the head's check-run is still red at report time and still carries the same completed_at evidence; a hosted re-run since then leaves the recorded false green where it is."
  - "The judge classifies paths one by one with the BASE change_map; a diff of many thousands of paths costs one subprocess, not one per path, but the whole list goes through stdin."
  - "PyYAML in Pro's merger venv is assumed (prune.py already needs it); without it every context reads unknown."
  - "The spec paragraph is longer than the one sentence the lead asked for, because it carries the pr7961 measurement."
