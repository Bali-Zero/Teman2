  - seat: codex-gpt-5.6-sol and kimi-code/k3 (DEFECT label_intent.py:223/226, SIGNAL_INTENT_SHOW_CONFIG=1 exits 0 without labelling; SIGNAL_INTENT_VERIFY override)
    objection: >-
      SIGNAL_INTENT_SHOW_CONFIG=1 exits 0 without reading the label, and SIGNAL_INTENT_VERIFY can override the verify command in test environments.
    status: PLAUSIBLE
    disposition: >-
      Not changed: the header states "WITHOUT labelling anything: a diagnostic, never export it", and SIGNAL_INTENT_VERIFY is the shell-suite test seam (test_signal_merge_intent.sh and test_label_census.py). Same as gate-b31pp LOW.
  - seat: codex-gpt-5.6-sol, agy-gemini-4-argon and kimi-code/k3 (DEFECT label_intent.py:102/173/171/176, verify success at or after the deadline; arm with no deadline check)
    objection: >-
      A verify that completes at/after the deadline is accepted, and arm is called without asking the deadline.
    status: PLAUSIBLE
    disposition: >-
      NOT changed: the deadline gates STARTING a call (spec D2: asked before every network call and sleep); a read that returned rc 0 is a valid label read whenever it returned, and the arm is a single idempotent call after a
      settled label. Changing it would move the reviewed plan() and the oracle (fix-of-a-fix depth); carried as a residual for the gate to rule.
  - seat: agy-gemini-4-argon (DEFECT label_intent.py:171, arm when the label failed and a queue is present)
    objection: >-
      plan() still arms when the label failed with queue present.
    status: PLAUSIBLE
    disposition: >-
      By design (spec L1): the arm is independent of the label; exit is 2 and the label failure is loud. The merge label, not the arm, is what merges after the flip.
  - seat: agy-gemini-4-argon (DEFECT label_intent.py:117/121/201, view rc nonzero treated as absent; retry resets out; run_act ignores env; verify repo.split)
    objection: >-
      Several world/plan details: an unknown view rc proceeds to add; the retry overwrites out; run_act does not pass env to _run; label_census verify on a bad repo.
    status: PLAUSIBLE
    disposition: >-
      NOT changed: an unknown view only skips the remove, and the read-back after the add still has to show a valid label (fails closed, exit 2); the out overwrite changes only the message tail;
      the child inherits os.environ and receives repo/pr as arguments; label_census main turns any exception into rc 2. gate-b31pp's independent 1.44M-script properties agree. No behaviour was wrong.
  - seat: codex-gpt-5.6-sol and kimi-code/k3 (DEFECT/NOTE label_intent.py:210/212, elapsed floored to whole seconds)
    objection: >-
      A 1.9 s elapsed counts as 1 s, so a sleep of up to a second can overrun the deadline.
    status: PLAUSIBLE
    disposition: >-
      Known and bounded (one second), the bash-era SECONDS granularity the spec D2 states; not changed.
