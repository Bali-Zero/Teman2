      the code returned 3. The code was changed, not the spec (gate-b31pp LOW).
  - id: D-gear-3
    decision: >-
      The floor is 3 by churn (above 1828), so the brief is gear 3 with this pack; nothing was cut to get under the line.
  - id: D-timeout-15
    decision: >-
      Every network command in label_intent.py has a 15 s subprocess timeout (CMD_TIMEOUT = 15, rc 124 = unknown) and post_publish_poller.py invokes signal_merge_intent.sh with timeout=105
      (converting TimeoutExpired into rc 2 and returning False on rc 2). Worst-case helper wall time is probe 15 + deadline 45 + last_cmd 15 + arm 15 = 90 s < 105 s, leaving a 15 s margin
      so the helper always reaches its own exit 2 before the caller times out, without changing plan() or adding conditionals to label_intent.py.
