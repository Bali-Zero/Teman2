      bitwise & | ^ raise outside annotations (Q13, Q14); .get() on a dispatch dict raises (Q17); indexing a tuple/list variable raises (Q18).
  - seat: agy-gemini-4-argon, codex-gpt-5.6-sol and kimi-code/k3 (DEFECT test_label_intent.py:157/175/165, transcripts not compared)
    objection: >-
