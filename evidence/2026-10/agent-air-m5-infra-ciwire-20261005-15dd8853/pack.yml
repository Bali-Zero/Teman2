# between 10:25Z and 10:56Z; outputs are quoted from those runs. Scratch logs live in the session scratchpad.
gear: 3
brief_ref: evidence/brief.yml
ruling: >-
  Mandate from the imperator, 2026-10-05: ship one small PR that makes CI run
  scripts/tests/test_ai_dispatch_shared_watchdog.sh and scripts/tests/test_pr_watch.sh; the other orphans
  go in the report, not in this PR.
mission: >-
  Both suites were merged today (#7881, #7894) and are referenced by no workflow, so the behaviour they pin
  can rot unseen (superscar #2, exists != armed). This PR adds two steps and four path-filter entries to the
  workflow that already owns the shell corpora of the seat/dispatch surface.
lanes:
  - lane: ciwire
    role: build
    seat: Claude Sonnet 5.5 (Dux dux-ciwire, M5)
pii_scan: clean
bites:
  consumer: >-
    the job "Fleet burst dispatcher tests" of .github/workflows/fleet-burst-tests.yml, steps "ai-dispatch
    still kills a TERM-ignoring agy through the shared watchdog and fails loud without the lib" and "pr_watch
    still reports merge, close, dedup, missing-required, pagination and timeout correctly", on every PR or push
    to main that touches either suite or the script it executes.
  observation: >-
    This PR's own run of that job (the PR touches both paths lists) logs "test_ai_dispatch_shared_watchdog.sh:
    3 passed (floor 3)" and "test_pr_watch.sh: 51 ok checks (floor 51)" and concludes success; the run id
    and the two log lines are quoted in the PR after the checks finish.
decisions:
  - id: D-home
    decision: >-
      Wired into the existing fleet-burst-tests.yml rather than a new workflow: it already owns the seat_build
      shell corpora, the same exists-!=-armed reasoning, an ubuntu job that is not a required context, and its
      paths filter already lists scripts/lib/seat_watchdog.sh. Two suites are offline (stub agy, fake gh on
      PATH), so the steps sit before the zsh install and the origin/main fetch, like the seat_build steps.
  - id: D-floor-count
    decision: >-
      Each step re-asserts the count it prints (3 from the SUMMARY line, 51 `  ok ` lines for pr_watch,
      which prints no SUMMARY) with the same shape as the seat_build floor step, so a suite that shrinks or
      aborts goes red instead of green. The counts equal the number of check calls in each suite
      (receipt R2; confirmed by codex-gpt-5.6-sol with `rg -c '^check "'`).
  - id: D-no-merge-group
    decision: >-
      The workflow has no merge_group trigger (pull_request and push only) and neither does the sibling
      step set; adding one is a trigger change outside this mandate and the job is not a required context.
      Reported, not changed.
  - id: D-mutation-choice
    decision: >-
      The first watchdog mutation (removing the `exit 1` of the fail-loud branch in ai-dispatch.sh) did NOT
      turn the step red (receipt R4a): the FATAL message and the source error still satisfy check (b). It was
      replaced by a mutation of the behaviour check (a) pins (receipt R4b). Recorded so the first one is not
      mistaken for a proof.
