dissent:
  - seat: agy-gemini-3.1-pro (DEFECT 2) and kimi-code/k3 (NOTE 5)
    objection: >-
      infra/launchagents/wrappers/mini-vercel-autopromote.sh:201-203 maps "upload already in progress — lock busy" to ok
      "build in progress (lock held)" with no bound. The 35-minute pidfile age covers only a run of this wrapper; a wedged
      manual or other upload run holding the cure script's flock (vercel_prod_deploy.py:765-770) keeps every tick green
      (superscar #2).
    status: CONFIRMED
    disposition: >-
      CURED in 3135c3511e (consecutive busy ticks in lock-busy-ticks, ok below 35 minutes, warning from the 18th tick; both
      seats confirmed the boundary in R10/R11) but the cure carries the new defect recorded below. Kimi bounds the likelihood
      by the cure's CLI timeout and --no-wait. Cure options: a consecutive lock-busy counter in a state file escalating to
      warning after N ticks, or a distinct rc for lock busy.
  - seat: agy-gemini-3.1-pro (DEFECT 1)
    objection: >-
      The invalid-mode branch (:29-37) runs before the node guard (:40-44), so a wrong host with a bad
      MINI_VERCEL_AUTOPROMOTE_MODE writes an error heartbeat instead of disabled.
    status: PLAUSIBLE
    disposition: >-
      Mode validation now follows the node guard and the kill switch (3135c3511e), confirmed by kimi. Earlier: kimi judged the order correct (a bad mode must be visible; the sidecar is host-local;
      the variable is set only in the Mini plist). Recorded as a divergence between the seats; at worst harmless noise on
      a foreign host.
  - seat: agy-gemini-3.1-pro (NOTE) and kimi-code/k3 (NOTE 6, NOTE 7)
    objection: >-
      safe_last_line (:180-189) misses a JSON-keyed token, an Authorization header without Bearer and URL userinfo, and
      does not strip control characters (tab, carriage return), so a future final line could leak a secret or make the
      sidecar JSON invalid.
    status: CONFIRMED
    disposition: >-
      CURED in 3135c3511e (control characters stripped, optional-quote keyed tokens, 32+ character runs redacted; both seats
      confirmed). Was latent (R8 reproduces the gap). Every reachable rc=1 and rc=3 last line of the cure script
      today is a fixed clean string or a json.dumps-escaped one, per kimi. Cure: add the three redaction rules and pipe the
      note through tr -d '[:cntrl:]' before the escapes.
  - seat: agy-gemini-3.1-pro (NOTE) and kimi-code/k3 (NOTE 2)
    objection: >-
      The rc=4 sed (:257) hardcodes "2 failed upload builds"; if UPLOAD_FAILURE_LIMIT changes, the sha is lost and the
      note falls back to the generic text.
    status: CONFIRMED
    disposition: >-
      CURED in 3135c3511e ([0-9]+); confirmed by both seats in R10/R11.
  - seat: kimi-code/k3 (NOTE 3, NOTE 4)
    objection: >-
      A SIGKILLed run leaves a pidfile whose pid may be recycled: up to 35 minutes of ok then warning forever; the
      pidfile check and write are not atomic and the write is unchecked.
    status: PLAUSIBLE
    disposition: >-
      Accepted as a contained residual: launchd does not overlap one label and the cure script holds its own flock; the
      worst case ends in warning, not green past 35 minutes.
  - seat: kimi-code/k3 (R10 DEFECT 1) and agy-gemini-3.1-pro (R11 DEFECT 1)
    objection: >-
      infra/launchagents/wrappers/mini-vercel-autopromote.sh:213-214 reads the lock-busy-ticks file without validating it:
      a non-numeric word, a leading-zero number or a two-line file makes the arithmetic fail under set -u, so the script
      aborts before the heartbeat and every later busy tick dies the same way. Kimi: "One case ''|*[!0-9]*) PREV=0 ;; esac
      fixes the whole class. Trigger requires out-of-band corruption of a file only this script writes."
    status: CONFIRMED
    disposition: >-
      SUPERSEDED: cured for the word, empty, two-line and newline inputs by 2ecc910007 (R14), but the zero-padded case (08) still
      aborts, see the next entry. Earlier text: the fix-of-a-fix bound of the Builder Contract is reached (depth 1 is the cure
      commit), and this session may not edit code. R12 reproduces it. Likelihood is low (a file only the wrapper writes);
      the failure shows as a stale sidecar, which the sentinel's staleness rule eventually reports.
  - seat: agy-gemini-3.1-pro (R11 DEFECT 2) and kimi-code/k3 (R10 NOTE 4)
    objection: >-
      The 32+ character redaction (:190) also hides a 40-hex sha or a long dpl id in an rc1/rc3 last line. Kimi: "nothing
      required is hidden; but an sha carried by an error's last line is. Security-first trade-off; acceptable."
    status: PLAUSIBLE
    disposition: >-
      ACCEPTED trade-off, not a defect: the identifiers the notes need (9-hex sha, dpl_ plus 24 characters, the rc4 sha) are
      under 32 characters or parsed from the raw output; the full text stays in run.log.
  - seat: kimi-code/k3 (R14, single-seat check of 2ecc910007)
    objection: >-
      infra/launchagents/wrappers/mini-vercel-autopromote.sh:214-215, kimi: "The guard case "$BUSY" in ''|*[!0-9]*
      rejects only strings containing a non-digit; 08 is all digits, so it passes the case unchanged, and line 215's
      $(( BUSY + 1 )) evaluates the value as an arithmetic expression where a leading 0 means octal. Cure is one token:
      BUSY=$(( 10#$BUSY + 1 ))."
    status: CONFIRMED
    disposition: >-
      CURED in 040ff7c663 by stating the counter's whole accepted domain once (R17, kimi PASS); this entry's earlier text follows.
      Was: OPEN, residual, NOT cured: R15 reproduces it. This is a fix-of-a-fix at depth 2 (cure 3135c3511e, then 2ecc910007), past
      the Builder Contract bound of depth 1, so the surface needs a spec rather than a third patch; and this session may not edit
      code. The residual was open at that point and is cured at 040ff7c663. Trigger needs out-of-band corruption of a file only the wrapper
      writes; the symptom is a stale sidecar. The conditional absent-file point of the same kimi answer is not a defect (R15).
