task_id: visa-oracle-law-guide-family-e30-1018
gear: 3
l_level: L2
gate_class: opus
objective: >-
  Extend the visa oracle Law + Guide model to family E30 (student): five Law cards (E30A, E30B with substantive
  content; E30, E30E, E30F recorded as NOT_FOUND / TO_VERIFY), a Guide resolver with four questions, migration 332
  (nullable stay_options JSONB column with an immutable validator and CHECK constraint) and migration 333
  (generated by importer.py, projects the five E30 codes). Owner ruling: initial stays given in years are kept as
  discrete options and never converted to days or months. Merging a backend-rag PR deploys and runs apply-all on
  prod; both migrations are additive, idempotent and carry an inline rollback. The gear-3 verdict is not asserted
  here; a fresh independent gate (Opus) reads the diff before merge and posts it.
constraints:
  - Legacy visa_types columns and their readers are untouched; migrations only add one column and upsert the Law columns of the five E30 rows.
  - Law cards are verbatim from imigrasi.go.id and never edited by hand after the page_sha256 pin; 333 is regenerated from the cards, never hand-edited.
  - Initial stay choices, cumulative extension limits, visa validity and ITAP conversion are distinct facts; unknown values stay NULL and TO_VERIFY, nothing is inferred.
acceptance:
  - text: WHEN the family C and E30 Guides, the importer and the Golden Rules are exercised the tests SHALL pass with the PostgreSQL tests running, not skipped.
    probe: pytest test_family_c_guide.py test_family_e30_guide.py test_family_importer.py test_family_e30_postgres.py test_golden_rules.py with PostgreSQL 16 on PATH (221 passed, 0 skipped on Pro)
  - text: WHEN 330-333 run on a throwaway PostgreSQL 16 cluster with the production-shaped 24-column visa_types the legacy columns SHALL be unchanged, both new migrations idempotent, and both rollbacks restoring the previous state.
    probe: test_family_e30_postgres.py (24 cases incl. 4 valid and 19 invalid stay_options shapes); throwaway cluster only, no existing database touched
  - text: WHEN the importer drift check runs for C against 331 and for E30 against 333 it SHALL report no drift.
    probe: importer --family C --check 331 and --family E30 --check 333 (both rc=0)
assumptions:
  - text: A fresh independent gate (Opus) reads the full diff before merge.
    status: pending
    note: dispatched by the coordinator after the PR opens; no verdict exists yet
  - text: E30A/E30B offshore-vs-onshore application location, ITAP eligibility and cumulative maximum stay are not stated by the source pages.
    status: to_verify
    note: stored as NULL + TO_VERIFY; see the PR body list
consumer_map:
  - apps/backend-rag/backend/db/migrations_v2/332_visa_types_stay_options.sql and 333_visa_types_law_family_e30.sql — run by apply-all on deploy of backend-rag.
  - apps/backend-rag/backend/services/visa_engine/families/ — importer and Guide generalised for a second family; family C output (331) is byte-identical.
