decisions:
  - id: D-seq27-by-name
    decision: >-
      The cases evaluate rulepack-prod-027.signed.json by name, not the highest pack on disk, so the file
      stays a statement about seq-27 after seq-28 is signed; the gold-coverage floor keeps covering the
      highest pack.
  - id: D-no-ride-along-pins
    decision: >-
      Ride-along reasons beside a named cause (BRIDGING_ONSHORE_ONLY beside a C6 miss, BVK_NATIONALITY_ONLY
      and AGE_BELOW_55 beside a tourist miss) are not pinned: several are known copy defects awaiting a later
      pack, and pinning them would turn a defect into a requirement. Only the named cause is asserted, as a subset.
