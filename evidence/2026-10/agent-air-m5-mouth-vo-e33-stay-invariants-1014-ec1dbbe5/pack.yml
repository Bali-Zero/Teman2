  - lane: build
    role: build
    seat: gemini-4-argon-high via agy (external seat; edits files only, never runs git), driven by a Claude session
  - lane: review-claude-opus
    role: review
    seat: claude-opus-5-5
  - lane: review-cross-family-codex
    role: review
    seat: codex-gpt-5.6-sol

ground:
  ts: "2026-10-15T00:14:00Z"
  siblings: >-
    The branch was rebased with git rebase --onto origin/main f408a74f72 once #8494 was squash-merged as
    3d2c743a48; the three lane commits sit on origin/main ed39c54869. The replay fixture drifted on main (a dropped
    reason code) and was regenerated by the replay generator, never hand-merged.

what_changed: |
  apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/engine-response.ts: stayPolicy() still fail-closes on a
  structural break (missing keys, non-integer, negative, above 36500, extension checks) but no longer throws on a
  stay-kind invariant break (unknown kind, FIXED_DAYS without a maximum, NOT_APPLICABLE with days, min above max);
  a comment says why, so nobody hardens it again. visa-oracle-contract.ts widens the stay kind type.
  engine-adapter.ts: stayPolicyBreaksInvariant() (known kinds FIXED_DAYS, NOT_APPLICABLE, VARIABLE_BY_GRANT)
  gates the top of duration(), so a broken stay policy omits that product's permit-length line, also when the
  candidate carries a selected duration option; a broken candidate never removes a valid sibling's line.
  Tests: engine-response.test.ts (accepting case), engine-adapter.test.ts (guilt for all four shapes, with and
  without options; innocence for 365/365, 1825/1825, 365/730 with options, VARIABLE_BY_GRANT, NOT_APPLICABLE
  null/null, FIXED_DAYS null/60, 730/730), stay-policy-census.test.ts (39 cases: one per product of pack 029 plus
  the coverage case; the pack is chosen from the signed payloads, never the file name).
  scripts/ci/observe_visa_oracle_stay_invariants.py with its pytest is the Bites observer.
  scripts/ci/observe_visa_oracle_replay_pins.py: EXPECTED_TESTS 312 (measured).

proof: |
  Whole visa-oracle vitest tree, tsc and the replay-pin observer green on the final tree (see receipts). The
  Bites observer runs the census, the engine-response guard and the engine-adapter test and requires the exact
  census of the first two (39 and 20) plus six guilt and innocence titles. Guilt: the Codex HIGH was reproduced
  before the cure (FIXED_DAYS null/null with a valid option still showed 365) and the cure is pinned by a guilt
  test over all four shapes. Residuals for the PR body: the backend accepts FIXED_DAYS with no maximum,
  NOT_APPLICABLE with days and min above max because there is no cross-field validator (visa_engine/models.py:301),
  an unknown kind is rejected there by the closed enum, so the mouth tolerance for it is forward-compatibility;
  tightening the backend validator is a separate signed-pack hot-zone change. The observer does not yet pin the
  engine-adapter total, only titles.

dissent:
  - seat: claude-opus-5-5
    objection: >-
      MEDIUM: the branch base is stale; #8494 is merged as 3d2c743a48 and the branch still carries its 5 commits,
      with content conflicts in four files.
    status: CONFIRMED
    resolution: >-
      Cured before any push by git rebase --onto origin/main f408a74f72 (replayed cleanly); the three lane commits
      now sit on origin/main ed39c54869. Cure commits: 9b8168a2df, f628566038, 55f51accd5.
  - seat: claude-opus-5-5
    objection: >-
      MEDIUM: the census moves only stay_policy and extension_policy and drops duration_options, so 9 of 38 products
      (E31A-E31J, 365/730) are not built the way the page shows them; the docblock claims an if-and-only-if that is
      only true of the synthetic shape.
    status: CONFIRMED
    resolution: >-
      Cured in f628566038: the census projects the pack's duration_options and the selected option into the
      candidate, splits duration-option and stay-policy groups, and states in the docblock that pricing is synthetic.
  - seat: codex-gpt-5.6-sol
    objection: >-
      HIGH: duration() returned selected_duration_days before any stay check, so FIXED_DAYS null/null with a valid
      option still produced selectedDays 365, breaking the decision to omit the line.
    status: CONFIRMED
    resolution: >-
      Cured in f628566038: stayPolicyBreaksInvariant() gates the top of duration(); a guilt test runs all four
      broken shapes with a valid duration block, an innocence test keeps E31 365/730 with options.
  - seat: codex-gpt-5.6-sol
    objection: >-
      MEDIUM: the census picks the highest sequence from the file name, not from the signed payload; the backend
      resolver filters payload.environment PRODUCTION and rejects duplicate maxima.
    status: CONFIRMED
    resolution: >-
      Cured in f628566038: the census reads each signed envelope payload only (no key), keeps environment
      PRODUCTION, takes the highest payload.sequence, throws on a duplicate maximum and asserts the file name
      matches the sequence.
  - seat: claude-opus-5-5
    objection: >-
      LOW (x5): the NOT_APPLICABLE 60/60 guilt case passes without the guard; the EN/ID label check is decorative;
      the it.each title renders undefined and coverage depended on shared state; no comment at the parser; the
      residual wording overstated what the backend rejects.
    status: CONFIRMED
    resolution: >-
      Cured in f628566038: 365/365 case plus a VARIABLE_BY_GRANT 365/365 no-length case, selectedDays and copy
      assertions kept where OutcomeSheet's private durationLabel cannot be reached, titles use a plain separator
      and the coverage test is static, the parser comment is added, and the residual is worded exactly in what_changed.
  - seat: claude-opus-5-5
    objection: >-
      LOW: a broken stay policy on a candidate that has selected_duration_days is unstated (spec says omit only
      that product's line); and the older observer observe_visa_oracle_stay_permit_length.py does not require the new titles.
    status: CONFIRMED
    resolution: >-
      The decision is omit the length, enforced by the guilt test and stated in the PR body. The new Bites observer
      requires the new titles itself; adding them to the older observer is left alone to keep one concern per PR.

