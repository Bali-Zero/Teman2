plan_ref: >-
  Ruling: the fresh Opus gate of PR #8494 (PR-7 v2, permit length; head f408a74f72), carry-over conditions (a) and
  (b), under Zero's mandate to close the E33 family end to end. Decision recorded in the lane spec: do (b) on the
  mouth side, never edit the backend contract.

