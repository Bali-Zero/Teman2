seat_override: >-
  ground_truth: this lane states no new regulatory or price claim and adds no copy: it only makes the result omit a
  permit-length line when a stay policy is internally inconsistent. The ground truth it is checked against is the
  active signed pack (rulepack-prod-029.signed.json payload), read directly by the census test itself on every run;
  no notebook query was made and none is invented here.

pii_scan: clean
pii_scan_note: >-
  No client data, OSINT or credential is read, written or quoted. The census reads the payload of the signed
  public rule pack and never its key; test fixtures are synthetic. External reviewers received the diff and
  repository code only.

