      wrapper :155-156, agy: "When the SIGALRM fires, the bash process is killed, but it does not kill its children (the actual Python
      scripts executing the regen). The timeout is logged, but the heavy workloads leak into the background and run indefinitely."
    status: CONFIRMED
    disposition: >-
      CURED in a719f65355 (the regen runs in its own process group and the bound kills the group) and re-cured in ade0e00fab after round 2
      found the first cure left the TERM path unbounded. Pinned by "the bound kills the regen's whole process tree", green at the head.
      The mechanism was first reproduced in the fly-cost-guard dossier of this session.
  - seat: kimi-code/k3 (DEFECT 1b) and agy-gemini-3.1-pro (DEFECT 5)
    objection: >-
      A SIGKILL, or a TERM that is deferred until the foreground regen returns and then met by launchd's 60 s ExitTimeOut, bypasses
      the EXIT trap and leaves the registered worktree, run.XXXXXX and .latest.$$ behind; later runs prune only their own worktree.
    status: PLAUSIBLE
    disposition: >-
      CURED in a719f65355 (a start-of-run sweep under the lock removes old run.* directories and prunes worktrees) and in ade0e00fab (the
      TERM is forwarded and reaped at once, so launchd's ExitTimeOut 60 is not reached). Pinned by the stale-sweep case; round 2 and round 3
      probed the sweep. A direct SIGKILL of the helper alone remains the documented spec residual R1.
  - seat: kimi-code/k3 (DEFECT 2) and agy-gemini-3.1-pro (DEFECT 4)
    objection: >-
      wrapper :142 builds from the local refs/heads/main with no fetch; if the zero-sync organ stalls, the organ writes a green heartbeat
      for a stale bundle forever, and the registry declares dependencies [] although it depends on mini.zero_sync.
    status: PLAUSIBLE
    disposition: >-
      OPEN, residual and a design choice (decision D-local-main-detached-worktree): freshness is owned by zero-sync. Cure options: declare
      the dependency in the registry or record the main sha age in the heartbeat note.
  - seat: kimi-code/k3 (DEFECT 6, NOTE) and agy-gemini-3.1-pro (NOTE 6)
    objection: >-
      Every outcome writes a fresh heartbeat (error, warning, disabled, and ok for already-running), so staleness alone cannot see
      a run that failed; the old liveness workflow required a successful run and lived on GitHub, independent of the publisher. If the
      registry evaluator also lives on Mini, a dead Mini silences organ and evaluator together.
    status: PLAUSIBLE
    disposition: >-
      OPEN, residual. The bridge's use of status_field is declared in the registry diff but its evaluation was not read here; the
      common-mode question is the same for every Mini organ moved off GitHub in this series.
  - seat: agy-gemini-3.1-pro (BLOCKER 2)
    objection: >-
      wrapper :44, agy: "Hardcodes the system python (3.9 on Mini) for the Telegram alert script, despite enforcing >= 3.11 for the regen
      via PYTHON_BIN. If tg_notify.py uses 3.10+ syntax, it will crash, resulting in completely silent failures."
    status: PLAUSIBLE
    disposition: >-
      NOT adopted as a blocker. R10: tg_notify.py parses under the 3.9 grammar, and the other Mini organ wrappers call the same gateway with
      /usr/bin/python3; agy's own text is conditional ("if it uses 3.10+ syntax"). The gateway's stdlib-only design is stated in its header.
