  - id: D-registry-staleness-replaces-liveness
    decision: >-
      The 14 h registry window (12 h cadence plus 2 h) replaces the liveness workflow; every outcome writes a heartbeat with a status,
      so the bridge must evaluate the status field and not only freshness.
