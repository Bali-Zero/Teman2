dissent:
  - seat: kimi-code/k3 (DEFECT 8)
    objection: >-
      scripts/tests/test_docs_inventory_blame.py:184, kimi: "still asserts docs-derived-state CI artifact in content — a live test,
      untouched by the diff, and not among the three suites reported green; tests.yml runs the full suite -> likely red on main or
      asserting retired wording."
    status: CONFIRMED
    disposition: >-
      OPEN, not cured: this session may not edit code. R9 reproduces a failing test on the head. This is the finding most likely to
      turn the first CI run red; the shipping session should change the assertion to the new pointer wording (or the pointer) before pushing.
  - seat: kimi-code/k3 (DEFECT 4) and agy-gemini-3.1-pro (BLOCKER 1)
    objection: >-
      wrapper :155-156, agy: "When the SIGALRM fires, the bash process is killed, but it does not kill its children (the actual Python
      scripts executing the regen). The timeout is logged, but the heavy workloads leak into the background and run indefinitely."
    status: CONFIRMED
    disposition: >-
      OPEN, residual. The mechanism was reproduced in the fly-cost-guard dossier of this session (an orphan outlives the alarm). Here the regen
      output goes to a file, not a pipe, so the wrapper does not hang waiting for it (the fly case did); the cost is an orphan per
      timed-out run and a lock released while it still runs. Cure: run the regen in its own process group and kill the group.
  - seat: kimi-code/k3 (DEFECT 1b) and agy-gemini-3.1-pro (DEFECT 5)
    objection: >-
      A SIGKILL, or a TERM that is deferred until the foreground regen returns and then met by launchd's 60 s ExitTimeOut, bypasses
      the EXIT trap and leaves the registered worktree, run.XXXXXX and .latest.$$ behind; later runs prune only their own worktree.
    status: PLAUSIBLE
    disposition: >-
      OPEN, residual. Read from the code (:60-91, :139-142), not reproduced: both seats agree and the lock and an unpublished bundle heal
      (dead-pid reclaim, 30-day rotation). Cure: a start-of-run sweep of old run.* directories and git worktree prune, and a longer ExitTimeOut.
  - seat: kimi-code/k3 (DEFECT 2) and agy-gemini-3.1-pro (DEFECT 4)
    objection: >-
      wrapper :142 builds from the local refs/heads/main with no fetch; if the zero-sync organ stalls, the organ writes a green heartbeat
      for a stale bundle forever, and the registry declares dependencies [] although it depends on mini.zero_sync.
    status: PLAUSIBLE
    disposition: >-
      OPEN, residual and a design choice (decision D-local-main-detached-worktree): freshness is owned by zero-sync. Cure options: declare
      the dependency in the registry or record the main sha age in the heartbeat note.
  - seat: kimi-code/k3 (DEFECT 6, NOTE) and agy-gemini-3.1-pro (NOTE 6)
    objection: >-
      Every outcome writes a fresh heartbeat (error, warning, disabled, and ok for already-running), so staleness alone cannot see
      a run that failed; the old liveness workflow required a successful run and lived on GitHub, independent of the publisher. If the
      registry evaluator also lives on Mini, a dead Mini silences organ and evaluator together.
    status: PLAUSIBLE
    disposition: >-
      OPEN, residual. The bridge's use of status_field is declared in the registry diff but its evaluation was not read here; the
      common-mode question is the same for every Mini organ moved off GitHub in this series.
  - seat: agy-gemini-3.1-pro (BLOCKER 2)
    objection: >-
      wrapper :44, agy: "Hardcodes the system python (3.9 on Mini) for the Telegram alert script, despite enforcing >= 3.11 for the regen
      via PYTHON_BIN. If tg_notify.py uses 3.10+ syntax, it will crash, resulting in completely silent failures."
    status: PLAUSIBLE
    disposition: >-
      NOT adopted as a blocker. R10: tg_notify.py parses under the 3.9 grammar, and the other Mini organ wrappers call the same gateway with
      /usr/bin/python3; agy's own text is conditional ("if it uses 3.10+ syntax"). The gateway's stdlib-only design is stated in its header.
      Kimi rates the same point a NOTE. A run on Mini is the real proof (assumption in the brief).
  - seat: agy-gemini-3.1-pro (DEFECT 3) and kimi-code/k3 (NOTE)
    objection: >-
      wrapper :122-126: a process hung before the alarm starts (for example git worktree add) holds the lock, later runs see it older than
      7200 s, write a warning and never reclaim; the stuck process is never killed.
    status: PLAUSIBLE
    disposition: >-
      OPEN, residual: the heartbeat reads warning, not green, after two hours; kimi rates it a NOTE. Cure: bound the pre-regen git steps too.
  - seat: kimi-code/k3 (DEFECT 8b)
    objection: >-
      docs-inventory-organ-tests.yml filters omit the retired workflow paths, so a PR that resurrects them never triggers the architecture pin
      (test :184-190), and omit scripts/tg_notify.py.
    status: PLAUSIBLE
    disposition: >-
      OPEN, residual: add the two retired paths and the gateway to the filters.
