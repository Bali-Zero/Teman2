objective: >-
  One concern: at the app's real windows (RootView with its sidebar, 1040x648, 1040x700, 1180x800) the Bali verdict band of the
  collapsed sheet is on the screen for every one of the 1,559 titles, en and id. The collapsed sheet height adapts to its head
  (title, band, one-row plate, official title) with cap min(0.8 x window, pane - 64) and a 12 pt margin under the band; the
  title steps down 44 -> 34 -> 28 and is never truncated; the census runs on the real RootView (fold_census over 9,354 rows)
  and C27 names its cause.
constraints:
  - No fact, verdict, cap, basis or reason changes; the title is never truncated (no lineLimit, no ellipsis).
  - Bindings 11, 12 and 13 of the #8492 gate (compact-plate composition guard, the source mark read from what is drawn, rule and band measured on ink and headline) are deferred to H1g by name; this PR does not claim the compact head composition or the source state is guarded.
  - The 24 pt title floor was tried and REMOVED (it changed 0 pixels: the 4 failing codes were band-bound).
