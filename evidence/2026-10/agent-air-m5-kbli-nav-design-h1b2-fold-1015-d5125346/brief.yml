    probe: "Pro: fold_census over the real RootView, 1,559 codes x en/id x 1040x648, 1040x700, 1180x800 = 9,354 rows, 0 FAIL, minimum margin 12 pt in every window, least list left 72 pt at 648 (56102)"
  - text: Binding 3. The layout answer at the stacked width SHALL hold at the minimum window.
    probe: "Pro: the fold census above runs at the minimum window 1040x648 with the sidebar; the plate stacks under the title there and the band still fits"
  - text: Binding 4 and 5. C27 SHALL name its cause and C26 SHALL bind head.compact to the collapsed state.
    probe: "Pro: png_census.py 0 FAIL, 1 VACUOUS (the known xxl C8), C26 armed 45, C27 armed 30 (27 root-sheet + 3 bare pane); head_mutants compactexp FAILs by 'head.compact is marked on a render the record does not call collapsed'"
  - text: Binding 6 and 7. The band mark SHALL name the band its rule heads, and an armed row matching no render SHALL fail.
    probe: "Pro: head_mutants bandmove FAILs by 'the verdict rule is outside the band mark'; a set with zero matching renders FAILs"
  - text: Binding 8. A title SHALL never be cut.
    probe: "Pro: content_check.sh step 9 title-whole over 12,472 rows (1,559 codes x en/id x collapsed/open x 783 and 924 pt), 0 FAIL; title_whole_mutant.sh: the control passes, .lineLimit(2) FAILs"
  - text: Binding 9 and 10. head_mutants.sh SHALL stop when its mutant build fails and SHALL survive SIGPIPE; the mutant table only grows.
    probe: "Pro: head_mutants.sh control rc 0 and 13 mutants rc 1; head_mutants_trap_test.sh ok 1 (closed pipe leaves Sources clean), ok 2 (without the PIPE trap Sources is left mutated: the test bites), ok 3 (staged Sources refused, exit 4)"
  - text: A1 and A3a of the addendum SHALL hold.
    probe: "Pro: A1 (47192 en/id, 87202 en at 1040x700) are rows of the fold census, 0 FAIL; A3a is the trap test above"
  - text: Content SHALL stay frozen.
    probe: "Pro: word census vs origin/main, counts identical per language and mode; the only difference is the id national chip case (textCase), 16 lost / 16 gained, 0 / 0 case-insensitive"
  - text: The detail-identity scan and the mark order SHALL hold on this head.
