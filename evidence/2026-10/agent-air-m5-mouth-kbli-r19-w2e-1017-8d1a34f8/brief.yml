objective: |
  Mission kbli-nav-design-loop, lot W2'''' (Track W, BLUE). This PR carries two things.
  (1) The replay of W2''' (PR 8627, commit 187f9702a7, unchanged), successor of the closed PR 8161
  (W2'', gate BLOCK), PR 8139 and PR 8118, on top of the merged census instruments PR 8583 and PR 8620.
  It puts all 9 /kbli* routes (/kbli, /kbli/55203, /kbli/51101, /kbli/56101, /kbli-explorer,
  /kbli/sectors, /kbli/sectors/[id], /kbli/builder, /kbli/decoder) and all 51 opened surfaces onto the
  R19 wrapper token contract (Direction A + PMA triad):
    - every opened surface renders inside .kbli-r19 and paints its section 8.1 ground opaque (or translucent ink scrim);
    - the re-cut transparent explorer logo (/images/logo-zantara-transparent.png) passes section 8.3's five proofs;
    - zantara-pending mobile/system-dark gets solid plates, leaves NOT_JUDGEABLE, returns to the walks and passes at min 5.64:1;
    - every page ground at rest and every opened ground reads 0 off-contract and 0 resolver disagreement;
    - all 24 shared-component walks outside /kbli* hold 0 drift against the origin/main pin;
    - r19-wrapper-census-tests asserts all 15 lines of the section 8.8 exit block and 48/48 captures.
  (2) The cure of the two states PR 8627's gate blocked: the /kbli hero primary-action hover keeps
  elevated text on copper, and /kbli-explorer Sonner richColors controls use only R19 surface, border
  and ink tokens, with real-browser innocence and mutant-guilt tests.
  PR 8627's evidence directory (agent-air-m5-mouth-kbli-r19-w2d-1016-0886045c) is folded into this one,
  so the PR has exactly one brief and one pack; its original receipts stay readable on PR 8627.
constraints:
  - Contract is the authority, row by row, sections 5, 7, 8 and 9 included.
  - No shared file outside the pin matrix is mutated; packages/core/components/NavShell.tsx is untouched and its glass
    shadow is suppressed inside .kbli-r19 via kbli-r19-wrapper.css per the contract row component NavShell { shadow
    } = not painted on this surface.
  - No npm install or npm ci.
  - "Content is frozen: no copy, string, aria, alt, title, placeholder, href or data change."
  - Do not change scripts/mouth/r19_wrapper_token_census.py.
  - "External builder seat prepares only: no commit, push, merge, arm or deploy."
  - Wrapper selectors follow :is(.kbli-r19, .kbli-r19 *) and escaped Tailwind conventions.
acceptance:
  - text:
      WHEN the 4 census parts (rest, kbli, explorer, shared) run live and replay together, THEN all 15 lines of
      the section 8.8 exit block print 0 (with 54/54 captures ok and 51/51 opened-surfaces ok).
    probe:
      python3 scripts/mouth/r19_wrapper_token_census.py --replay scripts/mouth/tests/fixtures/r19_wrapper_census.jsonl
      --diff-base origin/main
  - text:
      WHEN the W1 test runs on the 8 fixed routes x 6 states, THEN palette-outside-direction-a (r19 scope, 48/48
      captures) prints 0.
    probe: cd apps/mouth && R19_WRAPPER_LIVE=1 npx vitest run src/test/r19-wrapper.test.ts
  - text:
      WHEN the offline and browser e2e census test suites run against the re-pinned W2''' fixture, THEN every
      test passes.
    probe: python3 -m pytest scripts/mouth/tests -q -p no:cacheprovider
  - text:
      WHEN the real CTA is pointer-hovered, THEN its computed elevated text over copper rounds to at least 5.64:1;
      deleting the cure reproduces about 2.47:1.
    probe:
      python3 -m pytest scripts/mouth/tests/test_r19_wrapper_token_census.py -q -p no:cacheprovider -k 'cta_hover
      or sonner_rich_controls'
  - text:
      WHEN success and error richColors toasts render, THEN close glyphs are at least 4.5:1 on a contract surface
      and action/cancel controls remain on contract; deleting the cure reproduces about 1.23:1 and 1.29:1.
    probe:
      python3 -m pytest scripts/mouth/tests/test_r19_wrapper_token_census.py -q -p no:cacheprovider -k 'cta_hover
      or sonner_rich_controls'
  - text: WHEN the offline mouth census tests run, THEN they remain green.
    probe: python3 -m pytest scripts/mouth/tests -q -p no:cacheprovider -k 'not e2e'
consumer_map:
  - r19-wrapper-census-tests / wrapper-census-states runs on every apps/mouth PR and gates all 15 lines of the section
    8.8 exit block.
  - "r19-wrapper-census-tests / wrapper-census-live gates palette-outside-direction-a (r19 scope, 48/48 captures):
    0."
  - r19-wrapper-census-tests / Browser guilt and innocence of the opened-surface walk selects both new test_e2e_ tests
    with -k e2e.
  - The /kbli hero CTA and /kbli-explorer Sonner toasts consume the wrapper rules in real Chrome.
risks:
  - "Parts of one aggregate must come from one machine kind (section 9 note 2): CI runs all four parts in one workflow
    run."
  - A source-only assertion can miss cascade or richColors specificity; the browser tests load both real stylesheets
    and read computed colours.
