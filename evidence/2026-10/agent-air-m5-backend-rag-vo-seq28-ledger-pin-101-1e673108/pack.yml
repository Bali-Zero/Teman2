gear: 1
brief_ref: evidence/brief.yml
ruling: >-
  Condition 5 of the fresh gate on PR 8300: a follow-up PR from a fresh origin/main, ideally before the
  weekly re-attestation organ run of 2026-10-18T18:00Z, pins the seq-28 tests to their own ledger.
mission: >-
  The seq-28 pack tests fold the ledger that produced the signed seq-28 bundle, not whichever ledger is newest.
lanes:
  - lane: seq28-ledger-pin
    role: build
    seat: claude-sonnet-5 (Claude Code workflow subagent), worktree backend-rag-vo-seq28-ledger-pin-1012 on M5.
  - lane: seq28-ground-truth
    role: ground_truth
    seat: >-
      the signed seq-28 bundle on main and the ledger directory research/visa/2026-10-11-organ-reattest-seq28; the
      change asserts no rule, it only fixes which ledger the tests fold.
    nb: apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-028.signed.json
    query_hash: "00f1d66dd0d77f520a3929c5ffa9245a7de99cf9e892fce56ec5ab8f3f16c358" # pragma: allowlist secret
    note: query_hash = sha256 of rulepack-prod-028.signed.json at origin/main.
pii_scan: clean
bites:
  consumer: >-
    the weekly re-attestation organ pro.visa_reattestation (next run 2026-10-18T18:00Z) and every CI run of the
    visa_engine suite, through the seq-28 signed observer.
  where: ci
  observe: python3 scripts/ci/observe_visa_seq28_signed.py
  expect: "contains:all three consumers green"
receipts:
  - claim: The seq-28 pack tests pass folding the pinned ledger, including the two new pin tests.
    cmd: cd apps/backend-rag && python3 -m pytest backend/tests/services/visa_engine/test_seq28_pack.py -p no:cacheprovider
    result: "34 passed in 6.96s"
    exit: 0
    ts: "2026-10-12T11:11:11Z"
    seat: this session
  - claim: The seq-28 signed observer passes on the branch head after the rebase.
    cmd: python3 scripts/ci/observe_visa_seq28_signed.py
    result: "inventory reads seq-28 and all three consumers green"
    exit: 0
    ts: "2026-10-12T11:12:27Z"
    seat: this session
  - claim: The whole visa_engine directory shows the same tally as origin/main outside the seq files, all seq pack and census tests green.
    cmd: cd apps/backend-rag && python3 -m pytest backend/tests/services/visa_engine -p no:cacheprovider
    result: "4 failed, 3053 passed, 15 skipped, 39 errors in 257.94s"
    exit: 1
    ts: "2026-10-12T11:16:52Z"
    seat: this session
  - claim: The 4 failures and 39 errors are pre-existing local-environment ones (scratch DB schema, missing psutil), not caused by the diff.
    cmd: cd a detached worktree of origin/main/apps/backend-rag && python3 -m pytest the five failing files (test_bundle_verify, test_evaluate_endpoint, test_visa_engine_retention_fk_registry, test_shadow_evidence, test_shadow_match) -p no:cacheprovider
    result: "4 failed, 398 passed, 39 errors in 12.51s"
    exit: 1
    ts: "2026-10-12T11:18:00Z"
    seat: this session
decisions:
  - id: D-pin-not-discover
    decision: >-
      The test fixture returns the literal ledger directory and a test pins its payload digest; discover_newest_ledger
      stays in fold_pack_seq28.py for the CLI.
  - id: D-retire-seq27-observer
    decision: >-
      observe_visa_seq27_signed.py is deleted because seq-28 superseded seq-27; the old seq-27 evidence pack that names
      it is history and is left untouched.
