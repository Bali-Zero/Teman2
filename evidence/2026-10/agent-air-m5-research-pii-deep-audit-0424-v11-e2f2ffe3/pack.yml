brief_ref: evidence/brief.yml
plan_ref: >
  Mandate from the team lead (SendMessage, 2026-10-02, resumed 2026-10-03 after the first Dux
  window ended): land the client-PII removal that #7491 and #7516 did not, as v11 from a fresh
  origin/main, under spec S6 R6.7/R6.8. Branch agent/air-m5/research/pii-deep-audit-0424-v11,
  created by the broker from origin/main 370ab29aae (the merge-base of this PR). Reference
  content fetched by SHA from #7516's head edec8a21f9917a56c0724fe83a081027aba4e880, then
  amended by b4f0edc6d1 after the independent review (dissent items 6, 7 and 8).
lanes:
  - lane: pii-v11-build
    role: build
    seat: "claude-opus-5-5 (Dux sessions: content re-application, review cure, this pack, the PR)"
  - lane: review-pii-v11
    role: review
    seat: "claude-opus-5-5 (fresh read-only reviewer outside the contribution chain, commissioned above the Dux)"

