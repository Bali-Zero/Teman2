what_changed: |
  - The removed_paths above are deleted from the tree.
  - Each redacted_paths file starts from the blob of #7516's head for that path. Real client
    literals are replaced by placeholders or synthetic fixtures; query_lab.py imports its ground
    truth from an untracked local module when present and falls back to synthetic fixtures
    otherwise.
  - After the independent review, b4f0edc6d1 also drops the pilot docstring's case notes, replaces
    the Drive and NotebookLM ids of test documents and notebooks in the wa-corpus report with
    placeholders, and removes two dates that would be wrong after merge. The "Blob compare" and
    "Paths changed after the review" receipts show which redacted paths differ from #7516's head.
  - .gitignore ignores the generators' output paths and that local module, with neutral comments.
  - Size: the diff exceeds the PR contract's net-line guideline only through deleted data lines;
    the floor receipt below names its source.

proof: |
  Every PII count in this pack is a verbatim pii_receipt.py block under `receipts`, generated at
  the final content head. Prose cites block keys only. Private inputs live in the lane's 0700
  quarantine dir (~/.agent/pii-quarantine/pii-deep-audit/, files 0600) and appear in each argv as
  an @hmac token under the lane salt the S6 amendment pack already used:
  - pilot-names-7.txt: the lane's pilot name set, unchanged since the S6 amendment pack (same
    hmac token).
  - redacted-tokens-v11.txt: name-shaped and phone-shaped tokens taken from the removed lines of
    the redacted_paths, keeping only tokens absent from the post-image of their file.
  - lane-all-v11.txt: the union of redacted-tokens-v11.txt and the multi-word name values of the
    removed data files' name fields (also in plain, title and upper case) plus the pilot set.
  - r66-residuals.txt: the residual-basename list written by the lane's gate session
    (gate-pii-v11) against this content head, per R6.6. The builder did not edit it.

  Deletion (R6.5): `git ls-tree` of the removed_paths returns no line at HEAD.
  Redaction (R6.5): over the redacted_paths, the merge-base blocks show `files` above 0 for the
  pilot set, the redacted-token set and the lane union set, and the HEAD blocks show `files: 0`
  and `hits: 0` for all three. The redacted-token AFTER block is a construction check: that set
  keeps only tokens absent from each post-image, so its zero holds by construction. The pilot-set
  and union-set pairs are the informative measurements.
  Name-free evidence: the block over this evidence directory shows `files: 0` for the union set.
  Its `scope_files: 0` is by design, because `scope_files` excludes evidence/ while the counts
  include it; the same invocation with a pattern file holding a phrase from brief.yml gives a
  nonzero `files`, so the zero is a real measurement. The r66 block shows
  `residual_hits=0 hedge_hits=0` over brief, pack and body file.
  No residual file is named or described in this evidence (R6.1), no descriptor ships (R6.8 is
  not engaged), no client id appears, and no block runs with --categories (R6.2).
  Non-generator receipts: "Deletion probe at HEAD", "The same probe at the merge-base", "Blob
  compare", "Paths changed after the review" and "Egress probe" record the output of the git or
  shell command in their `cmd`. pii_receipt.py has no ls-tree or log-scan mode, so these are not
  pii_receipt blocks; a gate re-runs the command as written.
  Egress: the "Egress probe" receipt measures the M5 local logs of the external seats since the
  lane began. Beyond that measurement, that no external seat (Codex, agy/Gemini, Kimi, TP1)
  received this diff or these files is the Dux's attestation.

seat_override:
  "PII removal lane under Builder Contract §4 (output boundary): the deleted content may not
  leave the Anthropic OAuth boundary — on 2026-09-27 an external spalla forwarded this lane's
  deletion hunks to a cloud vendor (memory
  discovery_codex_spalla_forwarded_a_pii_removal_diff_to_openai). Independent review is provided
  by a fresh read-only Claude Opus seat commissioned by the imperator window; its findings are
  recorded in dissent. Waiver granted by the imperator window (Fable 5.1, owner-opened)
  2026-10-02."

dissent:
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      1. BLOCKING — R6.6/R6.7, receipt `r66` (`r66_line`). The PR body file the r66 block was generated from no longer exists. Another session overwrote `scratchpad/pr-body.md` in the shared scratchpad, so it now holds an unrelated PR's body. Re-running your checkin.sh `r66` line against the current file gives exit 4 (NO-BLOCK): the `@text:` body digest no longer matches. Cure: rewrite the body under a lane-unique filename, point checkin.sh `--body` at it, and regenerate and paste the r66 block. Cmd: `pii_receipt.py r66 --patterns r66-residuals.txt --brief <brief> --pack <pack> --body scratchpad/pr-body.md --check-in <pack>`, which gave rc=4.
    status: CONFIRMED
    disposition: "Accepted. Re-measured by the resumed Dux: the r66 check-in returned NO-BLOCK. The body lives under a lane-unique file in the Dux's own scratchpad, checkin.sh points at it, and the r66 block below was regenerated from that file at the final content head."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      2. BLOCKING — evidence_pack_lint at this head. Committed HEAD fails 2 rules: `dissent` is empty on a Gear-3 pack, and `council_run` is missing. Your uncommitted `seat_override` cures `council_run`, which drops to an overridden NOTICE. `dissent` still fails. So 3c735e17e2 cannot ship. The next head needs `seat_override` and `dissent` committed, then every block re-checked at that head. The r66 counts read the pack's text, so they must be regenerated after the dissent text lands. Cmd: `scripts/evidence_pack_lint.py <pack> --changed-files-file <mb..HEAD> --numstat-file <mb..HEAD> --brief-source-path <brief> --commit-count 4`, run once on the committed pack and once on the working-tree pack.
    status: CONFIRMED
    disposition: "Accepted. seat_override and this dissent are committed together, and every block was regenerated after the dissent text landed. Running the lint as harness-floor.yml stages it (pack and brief copied under evidence/ of a synthetic root) surfaced one more defect the direct invocation could not: brief_ref named the real per-PR path instead of the staging literal evidence/brief.yml. Fixed in the same commit."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      3. BLOCKING — R6.6 list consistency, receipt `r66` (`lines=` in `r66_line`). R6.6 defines the residual list against HEAD: tracked at HEAD, carrying the lane's PII, outside the diff. The list used here is unchanged from the v9 gate. At this HEAD it contains basenames that are no longer tracked anywhere in the tree. It also does not cover the files outside the diff that carry the lane's own v11 union set (see the whole-tree blocks in item 5). A gate cross-check of "N consistent" against a v11 report cannot pass on this list. The lane's gate session must rewrite the list; the builder cannot. My direct check is clean, so this is a receipt-validity defect, not an exposure: across brief and pack I found no residual path, no residual basename (one substring hit is part of an in-diff path) and no residual filename stem. Cmd: basename comparison of r66-residuals.txt against `git ls-tree -r --name-only HEAD`, plus `git grep -l -F -f lane-all-v11.txt HEAD -- . ':(exclude)evidence/'` minus `git diff --name-only mb..HEAD`.
    status: CONFIRMED
    disposition: "Accepted. The resumed Dux re-measured the stale list (untracked basenames present, none inside the diff) and did not edit it. The lane's gate session gate-pii-v11 rewrote r66-residuals.txt against the final content head, and the r66 block was regenerated from the rewritten list."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      4. NOTICE — R6.5, receipts "R6.5 AFTER, redacted-token set". The proof builds redacted-tokens-v11.txt by keeping only tokens absent from each file's post-image. That makes `files: 0` / `hits: 0` in the AFTER block true by construction, so it cannot detect a partial redaction. Only the merge-base half of that pair, and the pilot-set pair, carry information. I checked independently: the lane union set and the names set over the redacted_paths at HEAD both give 0 lines, and every name- or phone-shaped token on a removed line that survives in a post-image is a generic word, a staff member or a team line. So the redaction holds. Cure: add a block over the redacted_paths at the merge-base and at HEAD with `--patterns lane-all-v11.txt`, or state in the proof that the AFTER token block is a construction check.
    status: CONFIRMED
    disposition: "Accepted, both cures. The receipts carry a union-set pair over the redacted_paths (merge-base and HEAD), and the proof labels the redacted-token AFTER block a construction check."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      5. NOTICE — out-of-scope residual (G5 class, outside S6). Two whole-tree blocks at this tree_digest, pasteable verbatim, `--check-in`-verifiable: [the two blocks, `tree --patterns <lane union set> --rev HEAD` and `tree --patterns <redacted-token set> --rev HEAD` with no `--path`, are pasted under receipts as "Whole tree, lane union set" and "Whole tree, redacted-token set", regenerated at the final content head because b4f0edc6d1 moved tree_digest]. The union-set `files` count includes generic-name collisions. Classifying them is the gate's job, for a follow-up lane. Neither block names or isolates a file. Cmd: `pii_receipt.py tree --patterns <set> --rev HEAD` with no `--path`.
    status: CONFIRMED
    disposition: "Accepted as a disclosure. The blocks sit under receipts, generated at the final content head, rather than inline here, so the pack carries one copy of each argv. Classifying the out-of-diff hits is left to a follow-up lane, as the item says."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      6. NOTICE — R6.2 in-diff content, scripts/crm_guardian_phase15_*.py docstring and research/operations/2026-06-04-wa-corpus-miner-session-report.md. Both keep CRM ids next to placeholders. Re-link check: no kept id sits within three lines of a pilot-set name, or of a lane-set name for the same client, anywhere at HEAD (evidence/ excluded), so each id is "no longer re-linkable" by that probe. The pilot docstring also keeps two parenthetical case notes beside the ids, and the second records a sensitive personal status. Consider dropping both notes. That changes the blob-identity receipt, so re-paste it with a one-line reason. Cmd: `git grep -z -w -F -C 3 <id> HEAD`, then a set intersection against the pilot and lane sets.
    status: CONFIRMED
    disposition: "Accepted and cured in b4f0edc6d1: both case notes are dropped. The blob-compare receipt is re-pasted, and the 'Paths changed after the review' receipt is its one-line reason. The pilot script's path is written in this item and in item 8 in the same pathspec form as scope (see paths_note)."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      7. NOTICE — research/operations/2026-06-04-wa-corpus-miner-session-report.md keeps Google Drive document ids for test documents whose titles carried a client phone. If any of those documents still exists with link sharing, the public repo points straight at it. This cannot be measured from the repo. Either confirm they are deleted from Drive (a GUI step for the owner) or redact the ids too.
    status: CONFIRMED
    disposition: "Accepted and cured in b4f0edc6d1: the Drive document ids and the NotebookLM notebook ids in that report are replaced with placeholders. The ids remain in git history, so confirming the documents are deleted from Drive stays an owner step outside this PR."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      8. NOTICE — comment accuracy, scripts/wa_corpus/query_lab.py ("tracked ... until 2026-09-27") and scripts/crm_guardian_phase15_*.py ("redacted 2026-09-27"). Both dates come from the v9 blobs. The literals are still on origin/main today, so both dates will be wrong after merge. Cosmetic, and fixing them breaks the blob-identity receipt. Accept, or fix and re-receipt.
    status: CONFIRMED
    disposition: "Accepted and cured in b4f0edc6d1: both comments drop the date. Re-receipted with the blob-compare pair."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      9. NOTICE — R6.7 reach, the receipts "Deletion probe at HEAD", "The same probe at the merge-base" and "Blob compare". These are hand-recorded results of git commands, not pii_receipt output. I re-measured all three and they hold. pii_receipt has no ls-tree mode, so a strict reading of R6.7 ("files ... output of the committed script") could still flag them. Label them non-generator receipts in the proof.
    status: CONFIRMED
    disposition: "Accepted. The proof labels them, plus the two receipts added in this round, as non-generator receipts. Their results are command output captured by the generator script at the final content head, not typed."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      10. NOTICE — receipt "Name-free evidence", key `scope_files: 0`. A reader will take this as "measured nothing". It is by design, because `scope_files` excludes evidence/. Innocence probe: the same invocation with a one-line pattern file holding a phrase from brief.yml gives a nonzero `files`, so `files: 0` here is a real measurement. Add one proof sentence saying so.
    status: CONFIRMED
    disposition: "Accepted. The proof carries that sentence."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      11. NOTICE — R6.3/R6.4, proof "Egress: no external seat ... received this diff". This is an unmeasured negative claim. Partial measurement: October Codex session logs on M5 and Pro, and the Kimi dir on M5, carry no mention of the lane or its worktree. Add that grep as a receipt, or label the line as the Dux's attestation.
    status: CONFIRMED
    disposition: "Accepted, both cures. The 'Egress probe' receipt scans the M5 log dirs of Codex, codex-spalla, Kimi, Gemini and Qwen since the lane began, with a positive control, and the proof labels whatever lies beyond that measurement as the Dux's attestation."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
    objection: |
      12. NOTICE — `seat_override`. It exists only in the working tree (uncommitted). Its text, and the brief's line on gate-7453, restate a past vendor-egress incident. #7516's public body and evidence already disclose it, so this adds no new exposure. The waiver itself is an imperator attestation that no command can verify. The council substitute is this single read-only review.
    status: CONFIRMED
    disposition: "Accepted. seat_override is committed with its text unchanged; the waiver stays an attestation."
  - seat: "claude-opus-5-5 (review-pii-v11, read-only, head 3c735e17e2)"
