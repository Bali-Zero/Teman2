task_id: pii-deep-audit-0424-v11
gear: 3
l_level: L2
gate_class: opus
objective: |
  Remove the client-PII data files of the 2026-04-24 deep-audit lane from origin/main and
  replace the real client literals in the files that only need a redaction. The repository is
  public. This is v11 of the lane: #7491 (v8) and #7516 (v9/v10) were suspended after three
  consecutive gate reds on two evidence causes, while the gate measured their content diff as
  holding. v11 starts from a fresh origin/main, re-applies that content blob-for-blob, and
  writes its evidence under spec S6 R6.1-R6.8 (docs/specs/2026-09-27-evidence-pack-fixed-point.md).
  After the independent review, b4f0edc6d1 also drops the pilot docstring's case notes, the
  test-document and notebook ids of the wa-corpus report, and two dates that would be wrong
  after merge (pack dissent items 6, 7 and 8).

  Gear 3 by the deterministic floor (source: size, from the deleted data lines).

  Defect -> requirement -> cure:
  - Counts typed by hand drifted between places (gate-7481 K2, gate-7491 K2, gate-7516 B1, C2)
    -> R6.3 + R6.7 -> every PII count in this pack is a block printed by
    scripts/evidence/pii_receipt.py at the final head and pasted verbatim; prose cites block
    keys only, and a gate re-runs each block with --check-in.
  - A locator or category descriptor isolated a residual file (gate-7481 K3, gate-7491 K3,
    gate-7516 B3, C1) -> R6.1 + R6.8 -> this evidence names no residual file and describes no
    residual category, so no descriptor ships and no R6.8 block is needed; the r66 block proves
    the residual list reaches none of brief, pack or body.
  - An id paired with a per-file count (gate-7491 K3) -> R6.2 -> no client id appears in this
    evidence, and no block runs with --categories, so no per-file count is printed.
  - A redaction brief re-listed the names it redacted (gate-7462) -> R6.1 -> a block over this
    evidence directory with the lane name set and the redacted-token set.
  - A spalla forwarded deletion hunks to a cloud vendor (gate-7453) -> Builder Contract §4 ->
    no external seat received this diff or these files.
  - R6.5 and R6.6 were measured cured at #7516 (B4, B2) -> kept: Bites is a post-merge probe,
    and the body carries the generated r66 line.

acceptance:
  - text:
      "WHEN this PR merges, git ls-tree -r origin/main SHALL list none of the removed
      paths."
    probe: "git ls-tree -r --name-only"
  - text:
      "The redacted-path set SHALL carry 0 hits of the lane's pilot name set, of its
      redacted-token set and of its union set at HEAD, where the merge-base showed more than 0
      for each."
    probe: "scripts/evidence/pii_receipt.py tree --patterns"
  - text:
      "This evidence directory SHALL carry 0 hits of the lane name set and of the
      redacted-token set, and the r66 line SHALL read residual_hits=0 hedge_hits=0."
    probe: "scripts/evidence/pii_receipt.py r66 --patterns"
  - text: "The wa_corpus tests SHALL pass with the synthetic fixtures."
    probe: "-m pytest -q -p no:cacheprovider tests/wa_corpus"

appetite:
  wall_clock_hours: 3
  adversarial_rounds: 2
