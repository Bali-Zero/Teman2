diff:
  net_lines: |
    Source-only import: roughly 30,000 added lines across 133 files, of which about 9,800 are two
    pretty-printed i18n JSON files and the rest Swift sources, tests, tools, deploy scripts and
    markdown. The size floor is the import itself.
  behaviour_change: >-
    New directory apps/kbli-navigator-macos. build.sh: first dataset probe is the monorepo root
    (data/source_documents), book PDFs come from KBLI_BOOK_PDF_DIR with a loud exit 5 when missing,
    truncated or not a PDF, manifest commit falls back to 'unknown' outside git, dirty also covers
    the canonical dataset and overlay. sync_kbli_dataset.sh: APP_REPO defaults to the in-repo app.

