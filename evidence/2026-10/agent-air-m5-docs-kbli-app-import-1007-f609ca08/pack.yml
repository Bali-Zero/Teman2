dissent:
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM: the manifest dirty flag only inspects the app subdirectory, while dataset and overlay are copied from data/, so an uncommitted canonical edit can ship with dirty=false."
    status: CONFIRMED
    resolution: "Fixed: dirty now also checks the canonical dataset and overlay directory in the checkout they were copied from; proved with a scratch git repo."
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM: the PDF preflight only checks the file exists; a truncated or wrong file would ship."
    status: PLAUSIBLE
    resolution: "Fixed: size above 1 MB and a %PDF header are required; proved accept and reject cases. A content hash was not added because the books are replaced on purpose when a new edition is built."
  - seat: agy-gemini-3.1-pro
    objection: "HIGH: no copy logic exists for the three overlay files, so they would be missing from the bundle on a clean checkout."
    status: REFUTED
    resolution: "The reviewer saw only the diff. The unchanged lines 198-212 of build.sh sync all three files from data/kbli-app-overlay into Resources/; the Pro build log prints 'editorial overlay: synced' and the file lists match the installed app."
  - seat: agy-gemini-3.1-pro
    objection: "HIGH: build.sh never copies the canonical dataset into the source Resources/, so consumers read a missing or stale file."
    status: REFUTED
    resolution: "The unchanged lines 172-182 copy the canonical into Resources/ at every build ('refreshed Resources/ from canonical' in the Pro log); the bundle copy then follows."
  - seat: agy-gemini-3.1-pro
    objection: "MEDIUM: REPO_ROOT may be undefined in sync_kbli_dataset.sh."
    status: REFUTED
    resolution: "scripts/sync_kbli_dataset.sh defines REPO_ROOT at line 46 under set -euo pipefail, before APP_REPO."
  - seat: agy-gemini-3.1-pro
    objection: "LOW: the ROOT/../nuzantara probe is a stale fallback in the monorepo."
    status: CONFIRMED
    resolution: "OPEN, accepted: harmless because the monorepo probe precedes it and the path simply does not exist; left to keep the change surgical."
