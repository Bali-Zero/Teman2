residuals:
  - "The worker cap is a local capacity adaptation: hosted runs 4 workers on 16 GB, Pro now runs 2. The tests and the command are the same and `--dist loadfile` keeps each file whole on one worker, but the worker count, and with it the scheduling of files, differs from hosted; an inter-file ordering dependency that shows only at 4 workers would show hosted and not here."
  - "An OOM in another context (the E2E browser leg, the frontend vitest leg) is not covered: no cap there, and the dead-worker reason reads only xdist's words. A browser or node process killed by the cgroup still reads as a plain timeout or a test failure."
  - "The VM resize is the parity cure and is the operator's: the day Colima runs with enough memory for 4 x 2.1 GB plus the services, the matrix line goes (its comment says so)."
  - "Not measured: the two-worker wall time and memory on Pro (assumptions in the brief). The estimate from the four-worker figures is ~950 s for the slowest shard, under its 1800 s timeout."
  - "The dead-worker line is read from candidate output: a candidate can print it. It changes only the reason of a run that already timed out (no verdict before and after), never a status."
  - "No adversarial round: the independent gate is the orchestrator's (generator is never grader)."
