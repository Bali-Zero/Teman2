what_changed: |
  scripts/localci/contexts_matrix.yaml: the Backend Tests (Python) context's backend-shard job carries
  `env: { PYTEST_XDIST_AUTO_NUM_WORKERS: "2" }`, its comment carrying the measurement and the day it goes (the VM resize).
  No runner change was needed for it: plan_service_context already merges a local job's env into the job env
  (BASE workflow env, BASE job env, then the matrix job's), resolve_steps puts it on every step's env, _run_leg writes
  it into the leg's steps.json, and the steps driver sets it on each step's process environment. The container's own
  `docker create --env=` carries HOME and LANG only, before and after.
  scripts/localci/runner.py: XDIST_DEAD_WORKER and xdist_dead_worker(log); in execute_contained's TimeoutExpired branch,
  after `docker kill`, the first dead-worker line and its 1-based number go into the reason; rc None, the leg ERROR.
  scripts/localci/tests/test_shard_workers.py (new, 14 tests); the mutant table gains 14 B4 rules and reads the
  original of every file it mutates (the same line B3 #8077 carries, so the two merge cleanly). README: the capacity
  row and one paragraph.
