task_id: vo-e28-pricing-terms-1015
gear: 2
l_level: L1
gate_class: opus
mission_colour: BLUE
objective: |
  Zero ruled on 2026-10-15 (Q7) that the Investor KITAS prices are all-inclusive (government fees
  and the Bali Zero service included; standing rule R1, 2026-07-17) and (Q11) that the Golden Visa
  navigation link leads to the Golden Visa guide. The /visa/terms page still said government fees
  are separate, the three Investor KITAS catalogue rows carried no all-inclusive note, the
  /services/visa investor requirement was a vague "minimum investment", and the footer Golden Visa
  link went to /services/visa.
constraints:
  - "Prices unchanged (17.000.000 / 19.000.000 / 18.000.000 IDR); no fee split anywhere."
  - "Only the row notes change in the catalogue; the mouth mirror is regenerated, never hand-edited."
  - "No push, PR or arm from the implementer."
acceptance:
  - text: "The three Investor KITAS 2 Years rows carry notes 'All-inclusive price.' in the canonical catalogue and the mouth mirror at unchanged prices."
    probe: "cd apps/backend-rag && .venv/bin/python -m pytest backend/tests/services/pricing/test_investor_kitas_all_inclusive_1015.py -p no:cacheprovider"
  - text: "/visa/terms, the footer link and the investor requirement are pinned by vitest."
    probe: "cd apps/mouth && npx vitest run src/app/visa/terms src/app/v2/_components/Footer.golden-visa.test.tsx src/data/services_data.investor-requirement.test.ts"
consumer_map:
  - "balizero.com /visa/terms, the site footer, the news topic pills, /services/visa requirements."
  - "PricingTool and MCP search_service_pricing read the catalogue row notes."
risks:
  - "The terms sentence is a legal-adjacent statement: it keeps an honest clause that authorities set and may change their fees and the price confirmed at booking applies."
grader: "Fresh Opus 5.5 final gate commissioned by the team lead."
