decisions:
  - id: D-allowlist-caches
    text: >-
      ~/Library/Caches is cleaned only for an allowlist of self-refilling caches (Homebrew, Google,
      Codex, ollama, pip, go-build, the Windsurf updater); a manual wipe on 2026-10-17 deleted
      ms-playwright browser binaries and broke the production journey-sentinel until they were
      reinstalled, so unknown entries are fail-closed.
  - id: D-no-work-dir
    text: >-
      The runner's _work tree, _work/_tool included, is never touched: recreating _tool from docker
      exec can give it the wrong owner, and a job mid tool-setup breaks harder than one that loses a
      pip cache. pip and uv caches and old /tmp entries carry the measured growth.
  - id: D-rename-then-delete
    text: >-
      Inside the container each target is renamed to a same-parent trash sibling right after a
      fail-closed idle re-check, then deleted; the residual race is the rename instant, not the
      deletion, and no runner lock exists to close it fully.
  - id: D-heartbeat-vocabulary
    text: >-
      The Mini healer treats only ok-class statuses as alive, so level warning, a busy runner and a
      fresh previous run write ok with the condition in the note (warning also sends a digest-tier
      notify); error is reserved for errors, level unknown, level critical (which also pages p0) and
      a deadline kill.
  - id: D-no-brew
    text: >-
      No brew command runs: a brew autoremove once killed node on this Mini; the Homebrew download
      cache is covered by the allowlist.
