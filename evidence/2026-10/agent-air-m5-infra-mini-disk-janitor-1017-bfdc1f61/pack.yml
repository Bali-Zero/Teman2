ruling: >-
  Zero 2026-10-17, after the Mini disk reached 97% and the runner container 100%: "vai subito a
  recuperare tanto spazio", then "crea un demon automatico che fa pulizia giornaliera". Standing
  rules that bound it: never kill or restart processes or containers, PII is an output boundary,
  M5 ~/Backups and owner data are never cleanup targets.
mission: >-
  The Mini cleans its regenerable disk accumulators every night and tells the owner when the host
  or the CI runner disk is running out, so a full runner never again blocks backend deploys
  silently.
