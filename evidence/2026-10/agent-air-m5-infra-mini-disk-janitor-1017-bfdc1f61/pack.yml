dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      Rounds 1 and 2: the busy-runner guarantee is probabilistic; no re-check proves a busy runner is
      never touched without atomic coordination with job admission.
    status: PLAUSIBLE
    resolution: >-
      Accepted as residual: rename-then-delete shrinks the window to the rename instant, the run is
      scheduled at 03:30 WITA, and the worst case is a job that re-downloads its pip or uv cache.
  - seat: kimi-code/k3
    objection: >-
      Round 2: the mv plus mkdir of _work/_tool assumes the docker-exec uid equals Runner.Worker's.
    status: CONFIRMED
    resolution: Resolved by removing the _tool step entirely (987956e0da); a test asserts no exec script mentions _work.
  - seat: codex-gpt-5.6-sol
    objection: >-
      Round 2: ok-with-note can hide a stale pidfile forever, the in-exec ps re-check failed open,
      and a docker inspect failure read as a stopped container.
    status: CONFIRMED
    resolution: >-
      Resolved in 987956e0da and 6f5a38689a: pidfile older than 120 minutes is stale and removed, a
      90-minute payload deadline writes error, the re-check exits 74 when ps fails or is empty, and
      inspect is tri-state (absent, error, running).
spend:
  wall_clock_hours: 2.5
