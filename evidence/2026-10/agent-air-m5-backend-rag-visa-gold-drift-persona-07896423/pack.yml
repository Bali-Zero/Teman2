    role: build
    seat: Claude Fable 5.1 implementer, own worktree, no push.
  - lane: gold-drift-ground-truth
    role: ground_truth
    seat: >-
      the signed seq-25 pack rules traced (hf.citizen, hf.a1.not-bvk-nationality,
      hf.b1.voa-dual-nationality, hf.e33e and hf.e33f age-below-55, el.d12-multi-entry-support,
      hf.d12-onshore-conversion-excluded, hf.e28a.paid-capital-below-min,
      hf.bridging.from-visit-itk) and the commits 587f468fe7 and 97f56f2b56
    nb: apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-025.signed.json
    query_hash: "603f777e5fdd8ffbd5824282593b6584893f39b0b6b192f59c4563ae6d9c9d11" # pragma: allowlist secret
    note: query_hash = the seq-25 payload_sha256 the trace was run against.
  - lane: gold-drift-red-team
    role: review
    seat: codex-gpt-5.6-sol (Codex GPT-5.6, read-only sandbox) on the staged patch.
pii_scan: clean
bites:
