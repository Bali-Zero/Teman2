    the offline gold replay driver and the floor test in the backend CI shard, which read the
    production expectation table; the observer below runs the driver and checks its report.
  where: ci
  observe: python3 scripts/ci/observe_visa_gold_replay.py
  expect: "contains:offline gold replay 18/20, unexplained = personas 9 and 10 (engine gap, ledgered)"
decisions:
  - id: D-persona-1
    decision: >-
      Persona 1 expectation lists the four no-path codes the seq-25 pack emits, in engine order.
      State and the citizen exclusion were already right; the other products' hard filters fire on
      the same facts since seq-23, as already re-derived for personas 2, 3 and 4.
  - id: D-persona-9-10
    decision: >-
      Personas 9 and 10 stay divergent. No production pack has a rule on the application channel
      fact, so the engine answers D12 for all channels. The 2026-09-10 floor test decision not to
      launder them stands; the gap is ledgered as an engine modelling question for the owner.
