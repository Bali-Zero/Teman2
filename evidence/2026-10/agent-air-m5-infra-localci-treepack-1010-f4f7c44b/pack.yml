dissent: []
residuals:
  - "A reused pack is re-checked by commit and size, not sha256 (hashing 845 MB per container costs more than it saves); state/ is outside every sandbox and index-pack verifies every object, so a damaged pack is no verdict, never a wrong one."
  - "The sandbox repo holds two packs instead of one, and in contained-steps checks with overrides the candidate's own blob at an overridden path is present unreferenced: invisible to porcelain, and content the candidate already has."
  - "The copy-in grows by the 845 MB pack (~+6 s per container), inside the measured net (82 s -> 23.5 s on probe 5)."
appetite_exceeded: none
