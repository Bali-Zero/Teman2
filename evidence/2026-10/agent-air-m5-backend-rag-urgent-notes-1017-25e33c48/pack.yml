dissent:
  - seat: agy-gemini-4-argon
    objection: >-
      The committed brochure PDF (apps/mouth/public/static/brochure_balizero_en.pdf, served on
      kita.balizero.com) was not regenerated from brochure_en.html and still printed "urgent
      handling is quoted separately"; the observer never read it.
    severity: major
    status: CONFIRMED
    resolution: >-
      The PDF is regenerated by apps/backend-rag/scripts/generate_brochure.py in this PR; the
      observer reads it through pypdf (guilt case receipted on the HEAD PDF) and backend CI's
      test_brochure_price_parity gains a tripwire that the PDF never mentions urgent handling.
  - seat: kimi-code/k3
    objection: >-
      The Qdrant pricing payloads embed the note in payload.notes and in the semantic text, and
      scripts/sync_pricing_collection_prices.py only syncs prices, so the live RAG would keep
      quoting the surcharge while the new observer stays green.
    severity: major
    status: CONFIRMED
    resolution: >-
      Measured on the live collection: all four points still carried the note (three in the 2025
      wording "Plus 400k urgent"). A backed-up one-off blanked notes and dropped the Notes line
      from the text; verified clean. Named as follow-up: the sync script should carry notes/text
      drift, and three of the four payloads predate the 2026 template (old contact address, no
      description line).
  - seat: agy-gemini-4-argon
    objection: >-
      Migration 328 matched description ILIKE '%urgent%' instead of the four exact surcharge
      strings, and the observer walked only two levels, skipping the nested tax_accounting rows.
    severity: minor
    status: CONFIRMED
    resolution: >-
      The forward UPDATE and its postcondition pair each code with its exact measured text; the
      observer walks every nested notes field and matches the surcharge shape, not the bare word.
  - seat: kimi-code/k3
    objection: >-
      The observer's price-list check was case-sensitive on one phrase while the other checks
      lowercased everything (under-match), and the canon/mirror/brochure checks over-matched on
      any "urgent" (the owner keeps "Including Urgent" on two CRM rows).
    severity: minor
    status: CONFIRMED
    resolution: >-
      One surcharge-shaped, case-insensitive pattern ("+ Rp N for urgent", "Plus Nk urgent", the
      brochure sentence) is used on every text surface; "Including Urgent" is not a hit.
  - seat: kimi-code/k3
    objection: >-
      The rollback restores the surcharge text on any of the four rows whose description is
      NULL, including one nulled for another reason; not an exact inverse.
    severity: minor
    status: PLAUSIBLE
    resolution: >-
      Accepted and written into the migration header: a value-clearing step cannot know an
      earlier NULL from its own; the forward is now exact-text so the pair is symmetric on the
      measured production state (all four rows carry the surcharge text at writing).
  - seat: agy-gemini-4-argon
    objection: The observer did not assert the ROLLBACK marker or that migration 328 spares the two "Including Urgent" codes; a tuple concatenation was dead code; the brochure was read twice.
    severity: nit
    status: CONFIRMED
    resolution: The marker and the spared codes are asserted; the dead concatenation and the duplicate read are gone.
  - seat: agy-gemini-4-argon
    objection: The DO-block postcondition cannot fire inside the same transaction unless a trigger rewrites the row.
    severity: nit
    status: PLAUSIBLE
    resolution: Kept as the precedent of migration 327 sets it; it guards exactly the trigger case and costs nothing.
  - seat: kimi-code/k3
    objection: The 2025 sheet (bali_zero_official_prices_2025.json) still carries the "Plus 400k urgent" notes; PricingService still emits an empty URGENT PROCESSING heading into LLM context.
    severity: nit
    status: PLAUSIBLE
    resolution: >-
      The 2025 sheet is historical (referenced only by migration_066's comments) and is left as
      the record it is; the empty heading in PricingService is named as a follow-up, out of this
      PR's one concern.
  - seat: claude-sonnet-5 (pr-a-brochure)
    objection: >-
      The backend venv's pypdf (6.12) extracts the brochure as "urgen t han dlin g is quoted
      separately", so a plain substring check on the PDF text counts zero hits on the OLD PDF: the
      observer's PDF check and the new tripwire test would both pass blind in CI.
    severity: major
    status: CONFIRMED
    resolution: >-
      Both guards match the text with every whitespace removed; the guilt case is receipted under
      pypdf 6.13 and 6.12 on the pre-regeneration PDF, and the regenerated PDF passes both.
      Pushed as the one depth-1 fix of this PR after disarming and before re-arming.
decisions:
  - id: D-exact-text-pairs
    decision: >-
      Migration 328 names (code, description) pairs measured on production on 2026-10-17 rather
      than a substring, so the two "Including Urgent" rows and any edited description are
      untouchable by construction.
  - id: D-pdf-is-a-surface
    decision: >-
      The committed brochure PDF is treated as its own surface: regenerated in the PR, read by the
      observer and by a backend tripwire test, because the template alone is not what clients
      download.
  - id: D-qdrant-by-hand-once
    decision: >-
      The Qdrant payloads are cleared by a backed-up one-off (notes blanked, Notes line removed
      from the text, nothing else rewritten) instead of widening the price sync script in this PR;
      carrying notes/text drift in the sync is a named follow-up.
