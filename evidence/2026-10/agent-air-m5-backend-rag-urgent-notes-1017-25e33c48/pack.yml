    Three consumers, one observation each. (1) balizero.com/services/visa details dialog for
    Reset Molina, Mutation Passport, EPO and ERP (apps/mouth mirror): no "urgent processing"
    feature line. (2) The CRM catalogue (practice_types via crm_practices routes, deployed by this
    merge = backend deploy): description NULL on the four codes after migration 328. (3) The
    brochure PDF served at kita.balizero.com/static/brochure_balizero_en.pdf: no urgent sentence.
    scripts/ci/observe_pricing_retire_1017.py proves the repo side of all three on every checkout
    (sheet, mirror, price list, template, PDF through pypdf, migration 328 pairs and spared codes);
    backend CI's test_brochure_price_parity reads the same PDF; the Qdrant payloads were cleared
    by hand with a backed-up one-off and verified (receipt below).
  where: ci
  observe: python3 scripts/ci/observe_pricing_retire_1017.py
  expect: "contains:retired rows of 2026-10-17 hold"
