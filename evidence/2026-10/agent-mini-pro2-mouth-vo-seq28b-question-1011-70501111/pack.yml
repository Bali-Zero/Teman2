decisions:
  - id: D-replay-027
    decision: >-
      The no-path-doors replay is regenerated against seq-27; the guard exemption is now an exact walk+fact pair
      (still_unsure:secondhome.passive_monthly_income_usd), where the visitor gets the Bali Zero handoff instead of a
      dead sentence. The live seq-27 NEEDS_INPUT on that walk is a follow-up, not part of this step.
  - id: D-why-window
    decision: >-
      The why copy claims the amount decides eligibility; until the seq-28 pack rule (step C) is active the engine
      ignores the fact. Recorded as a known window; production promotion of the mouth deploy should wait for step C.
  - id: D-no-anchor
    decision: >-
      The interview copy asks for the yearly income without naming any threshold, and offers no not-sure option
      (the seq-28 rule will require the figure; an unknown would only re-ask it). The USD 60,000 figure appears
      only in the E33G_INCOME_BELOW_THRESHOLD result copy, in EN and ID.
  - id: D-ordered-rollout
    decision: >-
      Step B empties the step-A parity exception (ORDERED_ROLLOUT_OPTIONAL_PATHS); the fact is accepted and
      ignored by the engine until the seq-28 rule activates in step C, so the only visible change is the new
      question.
