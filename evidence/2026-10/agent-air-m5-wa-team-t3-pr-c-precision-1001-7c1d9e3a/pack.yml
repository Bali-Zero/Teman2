what_changed: |
  1. `--audit-resolution [--sample N]` (N 1-100, per kind): a random sample of resolved promises per
     resolution kind, judged by the local Ollama model; read-only transaction on team_promises;
     counts only (judged/plausible/implausible/invalid/precision) on stdout.
  2. A non-local Ollama host is refused (rc 2) before any DB connection or model call. After the
     council: the hostname localhost passes only if it resolves exclusively to loopback, and the
     opener never follows a 3xx (a redirect is a transport failure, never a verdict).
  3. Verdict parsing is strict: one boolean key, and after the council a duplicate key is invalid.
     The judge shares the parser, so a duplicate-key judge answer is now invalid too.
  4. The last counts are stored int-only on Pro and quoted by the resolution digest as
     `precision media_sent X/N`; stale, malformed or (after the council) future-dated state beyond
     a 300 s skew is ignored.
  5. scripts/wa_team_promises_audit_cron.sh (weekly, Sunday 04:41, installed by the conductor).
  6. The #7688 C3 fixture edits (mutants M23/M24 killed).
  7. Floors: unit 311 -> 406, real-PG 84 -> 105; the audit cron joins both path filters.

proof: |
  Unit corpus 406 passed, 105 skipped. Real-PG corpus 105 passed. The 9 council-round tests run
  against the module before 4f043d4fb2 fail (9 failed, 86 passed in the audit file) and pass after.
  Gate history: REWORK-BUILD @ 682de46f68 (grader restated the resolver's media rule), then delta
  PASS-WITH-CONDITIONS @ e9e6dfb47f (Pro qwen3.5:9b, synthetic non-PII cases: mismatches 1/10,
  true positives 7/8; 39 of 42 mutants killed). The council ran after that delta gate.

dissent:
  - seat: codex-gpt-5.6-sol
    objection: "HIGH: duplicate JSON keys collapse in json.loads, so a false-then-true verdict counts plausible."
    status: CONFIRMED
    resolution: "object_pairs_hook rejects a repeated key; the answer counts invalid. Guilt test parametrized over the audit and judge keys."
  - seat: kimi-code/k3
    objection: "HIGH: the guard checks only the configured URL; urllib's default redirect handling can take the request off-host."
    status: CONFIRMED
    resolution: "The opener carries a no-redirect handler; a 3xx raises a transport error and is never counted. Note: stock urllib re-issues 301/302/303 as a GET without the body and refuses 307/308 on POST, so the measured risk was an off-host REPLY read as a verdict rather than the body leaving; closed either way."
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM: redirects not revalidated, and localhost accepted without resolving it."
    status: CONFIRMED
    resolution: "Same no-redirect fix; localhost must resolve only to loopback, else rc 2 before any connection (unit and CLI tests)."
  - seat: codex-gpt-5.6-sol
    objection: "LOW: a future-dated state timestamp stays trusted indefinitely."
    status: CONFIRMED
    resolution: "Age must lie in [-300 s, 21 days]; guilt test with a state one day ahead."
  - seat: kimi-code/k3
    objection: "LOW: the unit floor comment says audit (80) but the floor moved by 82."
    status: CONFIRMED
    resolution: "Floor re-measured to 406 and the comment states +82 then +13."

