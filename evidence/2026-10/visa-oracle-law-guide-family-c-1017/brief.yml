task_id: visa-oracle-law-guide-family-c-1017
gear: 3
l_level: L2
gate_class: opus
objective: >-
  Introduce the Law + Guide model for the visa oracle: 13 verbatim Law cards for
  family C sha256-pinned to imigrasi.go.id pages, a Guide resolver with at most 3
  questions, migration 328 (additive Law columns on visa_types) and migration 329
  (generated by importer.py, upserts only the Law columns of the 13 C rows). Merging
  a backend-rag PR deploys and runs apply-all on prod; both migrations are additive,
  idempotent and carry an inline rollback. The gear-3 verdict is not asserted here;
  a fresh independent gate (Opus) reads the diff before merge and posts it.
constraints:
  - Legacy visa_types columns and their readers are untouched; migrations only add columns and upsert the Law columns of the 13 C rows.
  - Law cards are verbatim from imigrasi.go.id and never edited by hand after the page_sha256 pin; 329 is regenerated from the cards, never hand-edited.
  - C18 = 90 days not extendable is an owner ruling; C12 price is pending from the team; C1/C2 sponsor-exception country list is TO VERIFY.
acceptance:
  - text: WHEN the family C cards, the Guide resolver and the 329 drift check are exercised the tests SHALL pass, every Guide leaf covered.
    probe: backend/tests/services/visa_engine/test_family_importer.py + test_family_c_guide.py (76 passed)
  - text: WHEN 328 and 329 run on a throwaway Postgres with the production visa_types shape the 13 C rows SHALL be VERIFIED, legacy names kept, both migrations idempotent, and both rollbacks restore the original table.
    probe: throwaway-Postgres run reported by the author (read-only prod schema check used only to copy the table shape)
  - text: WHEN the prod visa_types schema is read the shape SHALL match the shape used for the throwaway proof.
    probe: read-only prod schema check, no write to prod
assumptions:
  - text: A fresh independent gate (Opus) reads the full diff before merge.
    status: pending
    note: dispatched by the coordinator after the PR opens; no verdict exists yet
consumer_map:
  - apps/backend-rag/backend/db/migrations_v2/328_visa_types_law_projection.sql and 329_visa_types_law_family_c.sql — run by apply-all on deploy of backend-rag.
  - apps/backend-rag/backend/services/visa_engine/families/ — new package; no existing reader imports it.
