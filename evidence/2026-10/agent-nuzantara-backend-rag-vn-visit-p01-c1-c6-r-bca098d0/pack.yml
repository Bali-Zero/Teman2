    decision: >-
      Price, validity, notes and keys are untouched; the descriptions name no fee split and no invented price.
  - id: D-md-pricelist
    decision: >-
      docs/pricing/Bali_Zero_Price_List_2026.md (a hand-kept printable list that does not even carry C6) still
