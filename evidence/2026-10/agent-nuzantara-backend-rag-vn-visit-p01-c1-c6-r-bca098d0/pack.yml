gear: 2
brief_ref: evidence/brief.yml
ruling: >-
  Visa-night family "visit", plan P01 (audit findings F047 and the description part of F068): decision-free,
  truth to the official page. No owner decision, no pack change (the latent pack field prohibited_activities
  business_meetings is a seq-29 matter and untouched here).
mission: >-
  The C1 and C6 price rows say what the official imigrasi.go.id pages say.
spend:
  seats: one Claude Sonnet 5.5 implementer, no external seat, no paid per-token endpoint.
  wall_clock: about 40 minutes.
lanes:
  - lane: p01-c1-c6-rows
    role: build
    seat: Claude Sonnet 5.5 implementer, worktree backend-rag-vn-visit-p01-c1-c6-rows on the Mac.
  - lane: p01-ground-truth
    role: ground_truth
    seat: >-
      The official pages https://www.imigrasi.go.id/wna/daftar-visa-indonesia/C1 and
      https://www.imigrasi.go.id/wna/daftar-visa-indonesia/C6, as read by the audit ground dossiers of
      2026-10-11 (visit/ground/C1.md, C6.md). C1 page: first stay "maksimal 60 hari", extendable "hingga
      maksimal 180 hari"; "Visa validity 90 days from issue" ("masa berlaku visa dan masa tinggal berbeda");
      MICE participation, "diskusi, negosiasi, dan atau penandatanganan perjanjian bisnis", site visits to
      offices, factories and investment sites, medical-related activity; prohibited "menjual barang atau jasa
      atau menerima imbalan, upah, atau sejenisnya" and "mengisi acara sebagai Pembicara". C6 page: social
      activity, "Termasuk dengan visa ini anda dapat berwisata", "mengunjungi teman dan keluarga", sponsor
      required, same 60/180/90 figures, same selling and pay prohibition; no business-meetings notion.
    nb: apps/backend-rag/backend/data/bali_zero_official_prices_2026.json
    query_hash: "d2c88dd35bb5422ccd73f5c522037cbcc87e761141dd59ec7802d2038cec6425" # pragma: allowlist secret
    note: >-
      nb and query_hash identify the TARGET file (query_hash = sha256 of the pricing file at origin/main before the change), not the official source.
      No retrieval-date hash of the pages is recorded; the quotes were read by the audit lane on 2026-10-11.
pii_scan: clean
bites:
  consumer: >-
    PricingService.get_all_prices() (the pricing knowledge layer loader) and the two data files it and the
    Mouth loader read; the /book Most popular C1 tagline (book-data.ts reads description_en of the mirror).
    The public endpoint and the live /book card are left to the post-deploy PROVE-LIVE step, not claimed here.
  where: ci
  observe: python3 scripts/ci/observe_c1_c6_price_descriptions.py
  expect: "contains:C1 C6 descriptions hold"
