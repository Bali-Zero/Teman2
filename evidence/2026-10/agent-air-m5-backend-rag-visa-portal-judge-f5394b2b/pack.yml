dissent:
  - seat: codex-gpt-5.6 red-team of #8069 (relayed by the lead)
    objection: "[BLOCK] a quote was searched across ALL saved texts of a record while judged_at was checked against the FIRST read, so a quote that exists only in a fetch made AFTER the judgement was accepted."
    status: CONFIRMED
    note: cured in this PR - a judgement binds to the latest successful receipt with fetched_at <= judged_at, names it (receipt_fetched_at, text_sha256) and the quote must sit in THAT text only
  - seat: codex-gpt-5.6 red-team of #8069 (relayed by the lead)
    objection: "[BLOCK] portal_judge.saved_text() read any absolute text_file, so page text from outside the ledger entered the prompt."
    status: CONFIRMED
    note: cured in this PR - one shared resolver, ledger_paths.py, used by the judge and the fold (basename under ledger/text, traversal guard, old-layout fallback)
  - seat: codex-gpt-5.6 red-team of #8069 (relayed by the lead)
    objection: "[MEDIUM] invalid JSON was accepted as a verdict because the parser extracted an embedded object and ignored leading and trailing garbage."
    status: CONFIRMED
    note: cured in this PR - the whole reply must be one JSON object (one json fence allowed), else unsure with notes invalid_json
  - seat: codex-gpt-5.6 red-team of #8069 (relayed by the lead)
    objection: "[LOW] prompt delimiters were reproducible from page text, and a fake reader could be accepted by a real fold."
    status: CONFIRMED
    note: cured in this PR - per-call random nonce plus a DATA-not-instructions line; the fold refuses readers starting with fake unless --allow-fake-reader, the judge forces fake judges onto fake readers, and the fold default verified_by carries the reader names
  - seat: codex-gpt-5.6 red-team of #8069 (relayed by the lead)
    objection: "[LOW] sandbox: 294 test errors."
    status: RETRACTED
