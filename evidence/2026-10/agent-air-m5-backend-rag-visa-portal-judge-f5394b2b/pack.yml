    the fold's attestation_instant, run by scripts/ci/observe_visa_portal_judge.py against a temp
    copy of the 2026-10-07 ledger whose judgements this tool regenerated with the fake judge; the
    weekly organ that schedules the tool is a separate mandate.
  where: ci
  observe: python3 scripts/ci/observe_visa_portal_judge.py
  expect: "contains:fake judge regenerates an accepted ledger"
decisions:
  - id: D-wrapper
    decision: >-
      The judge reaches Claude only through claude-cascade.sh --stdin --claude-only (OAuth seats),
      prompt on stdin. No HTTP API, no API key, no SDK. The python-backend rule names
      backend/llm/claude_oauth_client.py for serving code; this offline script follows the
      lead's instruction to reuse the cron wrapper instead.
  - id: D-quote
    decision: >-
      A quote is accepted only if it matches the saved text after whitespace normalisation, and
      the line stores the text's own raw span so the fold's plain substring check also passes.
