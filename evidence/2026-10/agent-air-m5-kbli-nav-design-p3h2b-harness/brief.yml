task_id: kbli-nav-design-p3h2b-harness
mission: kbli-nav-design-loop (Track A, build, lot PR 3-h-2 — the pixel half of the harness lot)
colour: BLUE
gear: 2
gear_reason: >-
  Set to the floor evidence_pack_lint computes for this change set by its size term, with no hot-zone path. Tools,
  one new Sources file that draws nothing (CensusFrame.swift) and the band snapshot's frame dump; renders stay
  byte-identical (35/35 against en1b-labelbook), proven at the head.
l_level: L1
gate_class: opus
objective: >-
  PR 3-h, second half (lead ruling 2026-10-10: 3-h-1 → 3-h-2 → PR 5): png_census gains SPEC-detail-polish v3's
  C11–C23, each with a guilt image, before the View PRs land on them. (1) Census frames: a View names the element a
  C-check measures with `.censusFrame(name, value)` (a clear GeometryReader background feeding a PreferenceKey);
  the band snapshot's `--layout-json` writes every mark's frame in pt beside the PNG. Frames only, under the lead's
  ruling that encensus stays the one text instrument. It replaces the accessibility walk the spec named for
  `--dump-text`, which an off-screen NSHostingView never builds (measured on Pro 2026-10-11: one node and no text,
  bare, run loop pumped, in a borderless window, ordered front at alpha 0, after finishLaunching and key window;
  dataWithPDF holds no text either). (2) C11–C23 in png_census.py, each at most 12 lines, measuring ink inside the
  named frames (ink = summed RGB distance > 60 from the frame's dominant colour, read 3 px inside the frame). (3)
  Every C has a synthetic innocent image that must pass and a guilt image that must FAIL, run on every invocation.
  (4) ARMED is empty: each View PR arms its own bands when it names their frames (lead ruling 2026-10-11, Q18), and
  a missing frame on an armed band FAILs. (5) The two bands spec D6/D14 add: search-results-multi (query 552; the
  band refuses fewer than three results) and registry-table at 51101 (2400 pt tall, so its rows reach division
  51), day-en/id. (6) #8200 gate P2-2: a white written with 255/255 components is caught. (7) P2-5: an xxl PNG with
  no table head is VACUOUS, printed and counted. (8) The #8239 gate's 3-h-2 bindings: (a) each row anchors its last
  drawn element too — registry-row its risk cell, search-row and search-peak their heads-up line, the chromes their
  census line; (b) is 3-h-1''s (#8247, the lead's ruling); (c) each View PR that joins GATED carries the English
  words its View draws. (9) The lead's three conditions on census frames (2026-10-11): on an armed band a frame
  the check reads that is missing FAILs naming it (VACUOUS only for an unarmed band); every frame it reads holds ink
  against the ground around it and meets the spec's measure where the spec gives one (cap: §3 title(36); heads-up
  sentence: D2 serif(20); bar: D5 48 x 2 pt; matrix: D1's 2 pt structure rule), with guilt images for a forgotten
  mark, a mark on an empty area and `cap` on a 13 pt element; a frame's value is a descriptor (tone, step,
  fraction) or nothing, never drawn text. (10) The mark draws only while a band snapshot collects, and
  CENSUS_IDENTITY=1 renders every band again without the collector: every PNG byte-identical.
constraints:
  - No View is tagged and no C is armed by this lot; renders byte-identical (35/35).
  - The frame mark draws nothing; a PNG with it equals the PNG without it.
  - Each C stays at most 12 lines; each has a guilt image that FAILs and an innocent image that passes.
  - No PNG is committed.
acceptance:
  - text: The render set SHALL stay byte-identical, with frames written beside every PNG.
    probe: "Pro: prove.sh at the head; MANIFEST en1b-labelbook 35/35 identical, 4 extra (the two new bands), 39 JSONs"
  - text: Every C11–C23 SHALL reject its guilt image, a forgotten mark and a mark on an empty area, and accept its innocent one.
    probe: "M5/Pro: png_census.py prints 'C11-C23 self-test: 73/73'"
  - text: A render SHALL be byte-identical with and without the census collector.
    probe: "Pro: CENSUS_IDENTITY=1 render_set.sh — every PNG identical, at the head and on the marked probe stack"
  - text: On real renders the checks SHALL accept a-prep-3's prepared Views and reject the spec's guilt renders.
    probe: "Pro: probe branches, never shipped — census tags on the PR 5+6+3 stack (innocent) and on today's Views (guilt), probe ARMED"
  - text: A chip painted in a tone its record's state does not dispatch SHALL fail C23.
    probe: "Pro: the stack probe with the card's national chip painted .open — C23 FAIL naming the chip"
  - text: A row drawing only its code SHALL read INCOMPLETE.
    probe: "Pro: a copy whose KBLIRegistryRow draws only its code — rc=1 INCOMPLETE"
  - text: The white scan SHALL catch a 255/255 white and still pass every innocent spelling.
    probe: "measure_contrast.py WHITE=0 on Sources; the 255/255 guilt rows hit, main's scan misses them"
