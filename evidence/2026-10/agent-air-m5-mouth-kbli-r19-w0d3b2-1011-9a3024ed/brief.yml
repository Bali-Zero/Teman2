objective: |
  Mission kbli-nav-design-loop, Track W, lot W0d-3b-2a (ruling: the 3b-2 split, a then b): the
  census grows to the scope SPEC-W0d-census section 1.a sets, and reads motion at its end.
    1. Nine pages, 54 captures: /kbli/sectors, its first sector (resolved at run time from the
       first card the server links), /kbli/builder and /kbli/decoder join the five.
    2. S5-S21: 50 opened walks (51 scenarios, one declared not judgeable: zantara-pending at mobile/system-dark, whose every text run is over-image; W2''' puts it back) (sector code detail and table, the three code pages' details,
       the Zantara chat answered / pending / failed, the explorer compare bar, glossary tooltip,
       toasts and thinking state), with stubs that answer, fail or never answer.
    3. Motion is finished, not removed (NO_MOTION), at rest, opened and in the state walk; every
       context asks for reduced motion, so script motion that honours it is read at its final
       frame. The composer row proves both directions: an entrance held with `forwards` is read
       at its end state, one without it is still counted where it ends.
    4. The exit block asserts captures 54 and opened-surfaces 50; the kbli part's CI headroom is
       re-measured on the grown list (the #8237 gate's note 5).
  The fixture is regenerated on M5 and a CI pair runs on the head.
