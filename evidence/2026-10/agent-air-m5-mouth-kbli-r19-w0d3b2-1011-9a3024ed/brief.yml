    probe: "python3 -m pytest scripts/mouth/tests -q -k 'cut_from_one_list or walks_51'"
  - text: "WHEN a motion change is undone, THEN its row fails (reduced motion, held entrances at rest, opened and in the state walk, the not-held entrance); WHEN a scope change is undone, THEN its row fails."
    probe: "python3 evidence/2026-10/agent-air-m5-mouth-kbli-r19-w0d3b2-1011-9a3024ed/instrument_mutants.py"
  - text: "WHEN the regenerated fixture is replayed, THEN it prints the M5 live verdict byte for byte."
    probe: "python3 -m pytest scripts/mouth/tests -q -k 'not e2e'"
  - text: "WHEN CI runs the four parts and, on the same commit, the single full job, THEN the two verdicts are byte-identical, captures 54 ok and opened-surfaces 50 ok, and no part takes more than 30 minutes."
    probe: 'gh workflow run r19-wrapper-census-tests.yml --ref agent/air-m5/mouth/kbli-r19-w0d3b2-1011 (default parts, then -f parts=''["full"]''); cmp the two verdict texts; phase-seconds per part'
