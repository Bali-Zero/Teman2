task_id: localci-host-floor-1011
mission: LOCALCI-SOVEREIGN (phase B - B15, Pro's host floor held through the run)
colour: BLUE
gear: 2
gear_reason: >-
  The lint floor is 2 by size (about 370 net lines, no hot-zone path). The gate must never be weakened: an eviction is a host no-verdict,
  and the change touches the merger's run path, so it is not a Gear 1 diff.
l_level: L2
gate_class: opus
objective: >-
  Pro keeps more than 100 GB free through a localci run: a run starts only at 110 GB, a watchdog evicts the run (process group and its
  own labelled containers) under 101.5 GB as a host no-verdict, and the prune drops second-slot deps images under host pressure.
constraints:
  - An eviction is never a FAIL or an ERROR of the candidate and never counts toward READY; it changes no verdict already decided.
  - Containers are stopped and removed only by THIS run's label, never by name pattern or age; images only by explicit tag, never -f.
  - Stdlib only; match the merger's Python and style.
acceptance:
  - text: A start under 110 GB free SHALL be skipped and journalled with floor_gb 100 and start_floor_gb 110.
    probe: "scripts/localci/tests/test_host_floor.py (start floor)"
  - text: A sample under 101.5 GB SHALL kill the runner's process group and remove exactly this run's labelled containers, never another run's.
    probe: "scripts/localci/tests/test_host_floor.py (eviction cases)"
  - text: An eviction SHALL be journalled as kind evicted, not as a decision, and the same key SHALL be decided again.
    probe: "scripts/localci/tests/test_host_floor.py (no-verdict case)"
  - text: Under host pressure the prune SHALL drop second-slot images and never the run in progress's image.
    probe: "scripts/localci/tests/test_prune.py (b15 cases)"
consumer_map:
  - scripts/localci/merger.py and prune.py (the merger tick on Pro, com.balizero.localci-merger) - every tick after merge.
pii_scan: clean
pii_scan_note: Harness code, tests on synthetic fixtures and docs. No client data.
