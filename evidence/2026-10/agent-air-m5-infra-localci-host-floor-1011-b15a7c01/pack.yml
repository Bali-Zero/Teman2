    seat: claude-sonnet-5-5 implementer on M5
  - claim: "20/20 mutants KILLED (every B15 and B6 floor rule, including evict-not-rotated, evict-cap-ignored, evict-cap-off-by-one, parent-pid-not-handed, parent-watch-unwired, parent-watch-pid-1, parent-gone-never, prune-pressure-no-builder-prune, prune-pressure-rule-silent-on-cost); survivors none, errors none, stale none."
    cmd: python3 scripts/localci/tests/mutants/merger_mutants.py --only <each rule>
    exit: 0
    ts: "2026-10-11T14:00:00Z"
    seat: claude-sonnet-5-5 implementer on M5
  - claim: "contract_verify --local printed no failing line; ruff check reports only 6 findings, all in files this change does not touch (test_isolation.py, test_merger_phase_f.py)."
    cmd: python3 scripts/contract_verify.py --local; ruff check scripts/localci
    exit: 0
    ts: "2026-10-11T14:00:00Z"
    seat: claude-sonnet-5-5 implementer on M5
residuals:
  - "L4, pre-existing and not B15: test_runner.py::test_sigterm_during_a_check_leaves_interrupted_not_running uses a fixed threading.Timer(1.0) and races under load; passed in the last run, left alone."
  - "L-pre-existing, not B15: mutant b6-undated-run-trimmed is STALE on origin/main too (its text no longer occurs in prune.py); not this lane's, left alone, so the full sweep still exits 1 on it."
  - "LOW, owed: replay evictions have no cap; the EVICT_CAP alternation counts only decisions. Bounded and rare at a 90 floor."
  - "LOW, owed hardening: the parent watcher has no pid-reuse guard. It fails safe (a reused pid looks alive); the hardening is getppid() != pid for the direct child."
  - "LOW: the janitor's BLACK band (under 105 GB) will warn on heavy ticks under a 90 floor; aligned in the janitor rollout-3 PR."
  - "The pro.disk_floor organ (scripts/ops/pro_disk_floor_tick.sh) still warns under 100 GB: a separate organ, not moved to 90 by this change."
