    role: build
    seat: claude-sonnet-5-5 (implementer on M5, on the lead's spec)
what_changed: |
  merger.py: HOST_FLOOR_GB 100, START_MARGIN_GB 10, EVICT_MARGIN_GB 1.5; HostGuard (breach: fail-closed after 3 unreadable samples;
  evict: TERM then KILL to the runner's process group, then docker rm -f -v of the containers carrying this run dir's label);
  runner_exec(guard=) samples every 5 s in the plan and run steps; HostEvicted is journalled by decide() as kind evicted (never a
  decision); --min-host-free-gb default 110, --host-floor-gb, --docker; the skip line carries floor_gb and start_floor_gb.
  prune.py: prune(pressure_gb=) removes non-newest, non-live, non-never deps images by tag under host pressure; host_pressure on
  the line. localci_merger_tick.sh: MERGER_MIN_HOST_FREE_GB default 110. Tests: test_host_floor.py (14), 4 b15 prune tests, B6 floor
  tests re-pinned; 7 new mutants and 2 re-pinned.
proof: |
  Unit and process-level tests on a fake docker; the eviction test runs a real process group and checks the child is gone and that
  another run's containers survive. No Pro measurement before merge: the observation is the first live tick (see bites).
