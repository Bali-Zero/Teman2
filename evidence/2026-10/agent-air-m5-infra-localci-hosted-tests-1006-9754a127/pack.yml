    299 passed, 1 skipped. After the first cure, on ea37c76df6: 331 passed, 1 skipped,
    cases=332 executed=331 undeclared=0 stale=0 overused=0 missing=0. After the Codex lane, on 4f17fe095e:
    332 passed, 1 skipped, executed=332 against a floor of 331. After the consolidation, on dd9f737ba0: 335 passed,
    1 skipped, cases=336 executed=335 undeclared=0 stale=0 overused=0 missing=0 ambiguous=0. The one skip is
    always the declared Pysa test; all five required tests executed, under the anchored patterns too. The same tree on M5, without docker
    and hypothesis, has 9 skips, and the budget with the workflow's own arguments exits 1 there.
