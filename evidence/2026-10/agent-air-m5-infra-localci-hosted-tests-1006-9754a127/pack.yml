dissent:
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER, on the first draft. The budget judged skips only: with the hard tests deselected or never collected (PYTEST_ADDOPTS, -k, --ignore) pytest and the budget both exit 0, down to cases=1 executed=0 (reproduced)."
    status: CONFIRMED
    resolution: "--require names tests that must have executed (the contained-attack test, the contained timeout, the seal forgery test, the hypothesis state machine, the comparator corpus) and --min-executed sets a floor, default 1. Corpus rows, including a real pytest report written with -k."
  - seat: codex-gpt-6.1-sol
    objection: "MEDIUM, on the first draft. An allowance was a reason only: two tests, or a whole module, could skip under the Pysa reason, and deleting the allowed test did not make the allowance stale if another skip reused the reason (reproduced)."
    status: CONFIRMED
    resolution: "An allowance is now a (test id, reason) pair and must explain exactly one skip: none is STALE, two or more is OVERUSED. Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "LOW, on the first draft. The blanket-pattern refusal covered the empty string only; (?=.) explained every non-empty reason, and the docstring claimed more than the code did (reproduced)."
    status: CONFIRMED
    resolution: "A pattern that matches a sentinel no id or reason contains is refused in every position, and the docstring now says patterns in general are not policed."
  - seat: codex-gpt-6.1-sol
    objection: "MEDIUM, on the first draft. The path filter missed real-repo inputs: the suite copies the six runner.TRUSTED_CLASSIFIER_FILES from scripts/ci into its fixture repos, so a change there did not start the job."
    status: CONFIRMED
    resolution: "The six paths are in both triggers, and test_hosted_workflow.py fails when the runner's list and the filter drift apart."
  - seat: codex-gpt-6.1-sol
    objection: "LOW, on the first draft. A skipped element outside a test case was ignored (synthetic XML, not a shape pytest 9.1.1 writes)."
    status: CONFIRMED
    resolution: "Such a report is refused, and so is one whose testsuites do not add up to its test cases. Both checked against real pytest reports first."
  - seat: agy-gemini-3.1-pro
    objection: "MEDIUM, pass 1. A test that is deselected or renamed and is not one of the required ones leaves no trace in the junit; while the floor still holds the budget exits 0."
    status: CONFIRMED
    resolution: "Inherent to reading a junit. The Codex lane moved the floor to the last proved hosted count (331), pinned it with a test, and stated the remaining limit in the workflow header, the README and the module docstring."
  - seat: agy-gemini-3.1-pro
    objection: "MEDIUM, pass 1. A pytest configuration file or conftest.py added at the repository root or in scripts would change the suite without starting the job."
    status: CONFIRMED
    resolution: "The Codex lane added the sixteen configuration paths pytest 9 looks for (root and scripts) to both triggers, with a test pinning them. The orchestrating window had drafted a different cure (a pytest invocation that ignores outside configuration) and discarded it unshipped so that this lane was built by one seat."
  - seat: agy-gemini-3.1-pro
    objection: "MEDIUM, pass 2. Two allowances can explain the same skip: neither is stale, neither is overused, so a removed test's allowance survives by matching another declared skip."
    status: CONFIRMED
    resolution: "A skip explained by two or more allowances is AMBIGUOUS, exit 1. Corpus rows for guilt and innocence."
  - seat: agy-gemini-3.1-pro
    objection: "LOW, pass 2. The workflow's test-id patterns were not anchored at the start, so a module named fake_test_pysa_check could take the allowance."
    status: CONFIRMED
    resolution: "Every test-id pattern of the step, allowance and requirements alike, now starts with ^scripts\\.localci\\.tests\\. and a test pins that."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER as filed, pass 2. observed() strips SGR sequences only; a line prefixed by another CSI sequence would make it return an empty dict and the containment test would falsely pass."
    status: RETRACTED
    resolution: 'Not withdrawn by the seat: refuted by the orchestrating window on the code the objection names, and the final gate can re-check it. Both callers index the dict straight away (seen["canary"]), so an unread observation is a KeyError and the test fails; no caller passes on an empty dict (receipt). The candidate in these tests is the fixture''s own attack, not an outside party. No change.'
  - seat: agy-gemini-3.1-pro
    objection: "MEDIUM, pass 2. The floor is pinned at 331 in a test as well as in the workflow, so a legitimate removal of tests needs two edits."
    status: CONFIRMED
    resolution: "Kept on purpose: lowering the floor is the one edit that should be loud. The real cost is elsewhere and is recorded in owed: the floor lives in a workflow file, a hot zone, so changing it is a Gear-3 change."
  - seat: agy-gemini-3.1-pro
    objection: "LOW, pass 2. pytest.toml, .pytest.toml and .pytest.ini are not real configuration names; and scripts/__init__.py is missing from the filter."
    status: CONFIRMED
    resolution: "Half confirmed, half refuted. scripts/__init__.py is now in both triggers and pinned by a test. The three names are real: pytest 9.1.1's findpaths.py lists them (receipt), so they stay."
owed:
  - The final on-disk gate and the arming are HELD for the owner. The mission's resumed session told Zero at 16:01Z that this step is a new mandate waiting for his word, while this window had already built it from his "continua". The pull request stays a draft until he answers.
  - At merge, the mission ledger row written with pull request 7993 needs its hosted-job arm closed.
  - The job is not a required context, so a red informs and does not hold the merge queue. Making it bind is an edit of the required set, which is the operator's (spec §5.7).
  - The budget's arguments (allowance, requirements, floor) live in the workflow file, which is a hot zone. Any change to them is a Gear-3 change. A follow-up can move them to a file under scripts/localci and pass it with argparse's file prefix; not done here.
  - The Pysa end-to-end test stays unrun on hosted metal.
  - Loop note for AMENDMENTS. The second build lane was routed to Sonnet before the D3 rule was read; the pack lint caught it. Read D3 before opening a second build lane at Gear 2 or above.
