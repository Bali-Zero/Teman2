appetite_exceeded: >-
  Three adversarial rounds against a declared two. Codex on the first draft and Gemini on its cure were the two
  planned. The third (Gemini on 4f17fe095e) exists because the tree changed again when the build composition was
  corrected: a second Anthropic build lane had been opened, the D3 rule then requires a non-Anthropic builder,
  that builder's lane needed a review from another family, and the only other live family was Gemini. The third
  round's findings were consolidated in one commit with no fourth round; the final gate reads the final tree.
