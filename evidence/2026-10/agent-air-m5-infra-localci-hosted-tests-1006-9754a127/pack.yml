seat_override: >-
  One external family reviewed the tree independently: Gemini 3.1 Pro, two refuter passes. Codex reviewed the first
  draft and its five reproduced findings drove the first cure, but it then built the lane that cures the refuter's
  findings, so from that point it is a contributor and is not offered as an independent reviewer; its journal line
  says so. (Its true name, gpt-6.1-sol, would not have counted for R9 either: the roster still names
  codex-gpt-5.6-sol.) The other titular seats were dead. The final on-disk gate is the independent judgment of
  record and has not run yet.
seat_fallback_reason: >-
  The reserve agy-gemini-3.1-pro stood in because the two remaining titular seats were dead: kimi TIMEOUT and
  tp1-qwen3.8-max QUOTA_DEAD (monthly plan quota, reset 2026-10-11; tp1-glm-5.2 shares it). Observed by
  arsenal_probe at 2026-10-06T08:03:06Z (recorded in the mission's first pack) and again in the organism report
  injected at this session's start, 2026-10-06T15:45Z; not re-probed by hand in this session.
pii_scan: clean
pii_scan_note: Workflow, a junit reader, tests and docs only; no client data was read or written.
what_changed: |
  .github/workflows/localci-tests.yml (new): runs scripts/localci/tests on pull requests and main pushes that
  touch scripts/localci, the six scripts/ci files the suite copies into its fixture repos, scripts/__init__.py or
  one of the sixteen pytest configuration paths above the suite. It builds the candidate image and installs
  hypothesis so the containment tests and the state machine execute, then judges the junit report. Not a
  required context.
  scripts/localci/skip_budget.py (new): reads a junit report. An allowance is a (test id, reason) pair that must
  explain exactly one skip, and a skip must be explained by exactly one allowance; required tests must have
  executed; a floor bounds the executed count; blanket patterns and inconsistent reports are refused.
  scripts/localci/tests/test_skip_budget.py (new): guilt and innocence corpus, including a round trip through a
  real pytest report. scripts/localci/tests/test_hosted_workflow.py (new): pins the workflow's path filter, the
  anchoring of its test-id patterns and its floor.
  scripts/localci/tests/test_isolation.py: observed() strips colour sequences before matching.
  scripts/localci/README.md: one paragraph on the hosted run and what a green job does and does not mean.
proof: |
  See receipts. Nothing in this change edits an existing workflow, the required set or branch protection, and
  nothing posts a status. The job runs with contents read and no secret.
bites:
