decisions:
  - id: D-noise-stems
    text: >-
      A query token is noise when it equals a noise word or a noise word of 4+ characters plus a
      light suffix of the closed set row matching uses; the 24 noise words of 4+ characters were
      checked against the suffix set (selling, years, licensee, balian become noise; none is a
      distinctive catalogue word).
  - id: D-license-sell-noise
    text: >-
      license, licence, licensing and sell join the noise list; permit and izin do not (work
      permit, stay permit, re-entry permit and permit keep their counts).
  - id: D-alcohol-keywords
    text: >-
      The three Alcohol License rows carry the words a client types for the product in English,
      Italian and Indonesian (liquor, beer, wine, alcol, alcolici, alcolico, bir, and the phrases
      spirits license / spirits licence); keywords only, no price, name or note changed. spirit
      alone and vodka are deliberately absent (vodka license goes from 3 to 0, accepted).
  - id: D-noise-only-fallback
    text: >-
      A query made only of noise words keeps the raw-query fallback, so license, licenses, prices
      or selling alone still return the rows carrying that word; documented in the spec.
  - id: D-rebase-8658
    text: >-
      Rebased onto origin/main b68797826d (PR 8658, Zero 2026-10-17: Driving License, Urgent 1/2/3
      Hari and Created Molina Express retired). The corpus keeps 8658's deletions; no expectation
      names a retired row (26f5240aee); the council ran on the pre-rebase 025e2ee9c9, whose matcher
      code is unchanged by the rebase.
