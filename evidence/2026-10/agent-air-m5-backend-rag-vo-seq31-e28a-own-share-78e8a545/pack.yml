decisions:
  - id: D-retire-and-insert
    decision: >-
      hf.e28a.total-investment-below-min is retired and hf.e28a.own-shareholding-below-min is inserted at the end of the
      rule list (seq-29 E31J pattern), not edited in place: the semantics changed, so the reason code is renamed and a
      replayed E28A_TOTAL_INVESTMENT_BELOW_MIN from seq-20..30 keeps its old meaning. Rule count stays 118.
  - id: D-no-pack-explanation-text
    decision: >-
      The pack carries only explanation_key for hf.e28a.paid-capital-below-min; there is no pack prose to reword. The
      "company law, not the visa" sentence already lives in the mouth copy E28A_PAID_CAPITAL_BELOW_MIN (step B, "under
      the company rules" / "menurut ketentuan perusahaan").
  - id: D-no-citation
    decision: >-
      No regulation number is written into the pack. The pinpoint Permenkumham 22/2023 jo 11/2024 Pasal 38(2)(a) is
      UNVERIFIED in the repository (TO VERIFY against source); the new rule reuses source_record 6f5135f2-1f77-571f-88ed-26d1d2b9efba
      (the Indeks Visa catalogue record, locator /wna/daftar-visa-indonesia/E28A) that every E28A rule already cites.
  - id: D-e28a-persona
    decision: >-
      The E28A gold persona gains investment.own_shareholding_idr = 10000000000: on seq-31 an unanswered own shareholding
      is NEEDS_INPUT, so the persona would otherwise stop reaching E28A. It replays identically on seq-30 and seq-31.
  - id: D-rebase-step-b-cure
    decision: >-
      Rebased onto the cured step B (PR #8649, 547873bfa5). Its corpus answers an own shareholding of IDR 10,000,000,000 by
      default, so offshore/invest/pt_pma/full_capital keeps E28A and ONLY the 9,999,999,999 witness loses it (recomputed by
      evaluating the candidate against the 182-walk corpus, never by hand). Step B's expiring pending exemption in
      engine-adapter.test.ts is removed outright: from seq-31 the pack emits E28A_OWN_SHAREHOLDING_BELOW_MIN. Step B's
      replay fixture (38 walks) and its buildNoPathDoors abstentions are kept as they are.
  - id: D-not-asked-vehicles
    decision: >-
      Gate forward note: on the 165 corpus walks whose own shareholding is NOT_ASKED (merit, family, undecided, bank deposit,
      property vehicles, pt_pma after "no", every non-investment branch) no outcome moves between seq-30 and seq-31 and no
      walk is NEEDS_INPUT on investment.own_shareholding_idr; asserted by
      test_seq31_pack.py::TestCorpusOnTheCandidate.
  - id: D-replay-fixture-deferred
    decision: >-
      no-path-doors.replay.json and no-path-doors.test.tsx name the highest SIGNED pack, so they cannot be bumped before
      rulepack-prod-031.signed.json exists. Step B (cured, #8649) already regenerated the replay at the seq-30 signed_at (38
      walks); no no-path walk changes on seq-31 (only one SUPPORTED walk changes candidates), so after signing the bump is
      header-only (file, sequence, version, as_of) and the signer does it. Not regenerated here.
  - id: D-support-copy
    decision: >-
      E28A_INVESTMENT_ELIGIBLE keeps its original copy (company capital, valid for seq-20..30 decisions) and is retired
      replayable from seq-31; the seq-31 rule emits the new E28A_OWN_SHAREHOLDING_ELIGIBLE with own-shares copy built from
      E28A_OWN_SHAREHOLDING_THRESHOLD_IDR and E28A_PAID_UP_CAPITAL_THRESHOLD_IDR, anchored to the backing rule. Ordering:
      the mouth copy is safe to ship before activation; activation must wait until the mouth deploy carrying the new code is live.
