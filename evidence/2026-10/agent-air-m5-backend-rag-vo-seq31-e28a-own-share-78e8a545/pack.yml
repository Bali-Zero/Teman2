    decision: >-
      E28A_INVESTMENT_ELIGIBLE copy said "total investment capital of IDR 10 billion", which seq-31 makes false; it now says
      the applicant personally owns shares worth IDR 10 billion or more in the PT PMA, and the SUPPORT-copy anchor test maps
