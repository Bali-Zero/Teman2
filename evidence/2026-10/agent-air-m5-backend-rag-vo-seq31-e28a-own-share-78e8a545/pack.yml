    decision: >-
      no-path-doors.replay.json and no-path-doors.test.tsx name the highest SIGNED pack, so they cannot be bumped before
      rulepack-prod-031.signed.json exists (the generator reads signed packs). No no-path walk changes on seq-31 (only
      two SUPPORTED walks change candidates), so the seq-30 precedent applies after signing: header-only bump (file,
      sequence, version, as_of). Do NOT regenerate: step B found the committed fixture (27 walks) already behind its
      generator (38) on base; regenerating would silently change scope.
