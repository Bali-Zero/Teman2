    decision: >-
      The step-B walk offshore/invest/pt_pma/full_capital answers an own shareholding of IDR 1,000,000,000, so on seq-31
      it loses E28A (pinned). It is not edited here: the corpus is step B's; the E28A support route is named by the
      own_shareholding_10000000000 witness.
