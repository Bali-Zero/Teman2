decisions:
  - id: D-coverage-not-promise
    decision:
      The longer-stay verified sentence is bounded by the pack's own coverage (stay maximum plus
      renewals); beyond it the advisor sentence is shown, never a promise.
  - id: D-no-prohibited-activities
    decision: prohibited_activities validation stays out of this PR; PR-20 owns it.
  - id: D-census-open
    decision:
      A pack-driven census test over every product is not in this PR; recorded as PLAUSIBLE dissent,
      to be taken up in the E33 closing PR.
dissent:
  - seat: claude-opus-5-5 adversarial red team, PR-7, head 251af8464594ed44ee2a7ec0ead110aca8db48b7, read-only
    severity: HIGH
    where: apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/engine-adapter.ts:2040-2042
    objection:
      The longer-stay VERIFIED sentence fired for any stay_days above the first permit with no
      upper limit; the signed rule for E33F/E33G covers 365 days plus 5 renewals of 365 (2190 days), so
      at 3000 or 36500 days the page promised what the pack does not say.
    status: CONFIRMED
    disposition:
      "Cured: coverage = stay maximum + maximum_extensions x days_per_extension from the VERIFIED
      and allowed policy only; the verified sentence needs stay_days <= coverage, above it the advisor line.
      Guilt test pins 2190 verified and 2191, 3000, 36500 advisor."
    cure_commit: 372fb039df789fb821b9086e27d639b49ce27fb6 # pragma: allowlist secret
  - seat: claude-opus-5-5 adversarial red team, PR-7, head 251af8464594ed44ee2a7ec0ead110aca8db48b7, read-only
