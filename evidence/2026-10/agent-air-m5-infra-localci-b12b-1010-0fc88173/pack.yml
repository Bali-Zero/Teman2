residuals:
  - "Live proof on Pro is owed to the first extraction after merge: the Bites observation above."
  - "Neither the annotations API nor the jobs API was called by this lane: the annotation shape is read from receipt R8 of evidence/2026-10/agent-air-m5-ci-bites-head-tree-v3-ac882ce3 (#7526's PENDING log carried exactly the PENDING line and `Process completed with exit code 1.`), the job document's shape (steps with name/conclusion, check_run_url) from GitHub's documented REST job object, recalled, not re-read offline. The equality of job id and check-run id is NOT assumed: the code requires check_run_url to end in /check-runs/{id} on every read, and a mismatch is unknown. If GitHub's real documents differ, the judgement answers fresh or unknown and the FALSE_GREEN is kept: the error direction is a kept red, never a hidden one."
  - "MEDIUM-1 deviation, stated: the lead asked that every later step be skipped. A failed Actions job still runs its `Post …` steps and `Complete job`, which conclude success, so a literal rule would never hold on a real job. The rule requires every step the BASE matrix lists after the reader step to be skipped, and the reader step to be the job's only step concluded other than success/skipped, so a runner step that failed is still caught."
  - "The 50-annotation cap is the number the lead gave for GitHub's per-job limit; it was not re-read from GitHub's documentation in this lane."
  - "frozen_reads reads state/plan.json as it is on disk: the tick reads it right after `status --seal` re-derived the seal over its bytes, but the report reads it later without re-deriving the seal or the plan_hash (created_at is outside the plan_hash by design)."
  - "Recorded rows journalled before this fix carry no hosted_red: the report keeps every one of them with `gate: unknown`; only rows the tick journals after merge can be reclassified on this ground."
  - "The head's statuses come from the combined status (newest per context): when the newest harness/fable-gate status postdates the plan, an earlier post it replaced is not seen and the row is kept."
  - "plan_at is stamped after the plan's host reads, so it bounds the read from above; the frozen rc 0 and the success anchor together say what the local reader read."
  - "The PR-level class (merger vs GitHub) is still not judged for staleness (B10's residual, unchanged): a PASS beside the pre-post red stays a PR-level FALSE_GREEN until GitHub's re-run."
