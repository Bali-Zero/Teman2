  - lane: localci-b12b-1010
    role: build
    seat: claude-opus-5-5 (Dux implementer on M5)
what_changed: |
  hosted_compare.py: hosted_entries keeps each check run's id (a status carries None); hosted_verdict also returns `red`, the red
  entries with id and completed_at. compare takes an optional gate_judge, a second judge beside B10's (B10's judge(context,
  completed_at) is unchanged): for a compared row B10 did not already call stale, gate_reading asks judge(context, hosted, statuses),
  totally (raise or a bad shape -> gate_check unknown), and with_gate composes the two grounds: stale when either is, else unknown
  when either is, else fresh. A B12b-stale row is HOSTED_STALE with stale_why gate_posted_after_hosted, hosted_completed_at,
  gate_posted_at and plan_at; the class_before / not-compared handling is B10's own line, unchanged.
  merger.py: StaleJudge reads the BASE matrix once (contexts()) for flag_of and the new pending_of (the pending_when lines of a
  context's steps and its jobs' steps; [] for a context the BASE matrix does not carry). GateJudge(repo, matrix, plan_at,
  annotations): None for a hosted verdict that is not RED or a context with no pending_when step; otherwise (a) every red is a check
  run whose newest completed_at is strictly before the newest harness/fable-gate status (the head's combined status) whose updated_at
  is at or before plan_at, and (b) each red run's annotations (GET repos/{repo}/check-runs/{id}/annotations through gh_pages, paged,
  at most hc.MAX_PAGES) carry at least one failure whose message starts with pending_when minus `::error::`, at most one
  `Process completed with exit code N.`, and no other failure (notice and warning do not count; any other level does). plan_time(run_dir)
  reads state/plan.json created_at. decide hands hosted_summary gate=GateJudge(a.repo, judge, plan_time(run_dir)); hosted_summary's
  stale entries carry the B12b keys when present. The report builds one GateJudge per non-replay decision (shared annotation cache),
  passes it to its own comparison and to reclassify_recorded, whose new recorded_gate finds the recorded red again among every attempt
  of the head's runs of that name (check-runs?check_name=<name>&filter=all, red, completed at or before the row's hosted_completed_at,
  one of them at it; a red commit status of that name is added as a non-run) and judges it with hc.gate_reading; a stale row is
  reclassified with stale_why, a kept row carries the ground's word as `gate`, and the phase E line names both shapes.
  tests/test_gate_stale.py (43 tests), one tick wiring test in test_merger.py, 11 b12b-* mutant rules, 2 B10 rules re-anchored
  (b10-judge-unwired-in-the-tick, b10-report-compare-without-judge). README section and spec addendum.

  Fix round (the independent gate's NO-GO on 6fad79e1c1). HIGH-1: GateJudge(repo, matrix, plan_at, reads, cache) is stale only when the
  local run read a success: the newest harness/fable-gate status at or before plan_at must be `success` (a failure/error/pending anchor
  is fresh: a real disagreement), AND the plan must have frozen rc 0 for the context's reader step — new frozen_reads(run_dir) reads
  state/plan.json checks -> jobs -> steps whose side.where is host and that carry precomputed (the runner's run_host_reader answer, under
  the seal), as {context: {step name: [rc, ...]}}; no answer, rc None or any non-0 rc is fresh, an unreadable plan unknown. pending_of
  now returns {step (workflow_step), line (pending_when), later (the workflow_step names after it in the same list)}; GateJudge needs
  exactly one such step named by its workflow_step, else unknown. test_gate_stale.py's gate_status() has no default state: every call
  names it. MEDIUM-1: per red run, GET repos/{repo}/actions/jobs/{id} (read-only); the job's check_run_url must end in /check-runs/{id}
  (the identity is checked per read; source below), its steps must list the reader step exactly once (else unknown), that step must be
  the job's only step concluded other than success/skipped, and every step the BASE matrix lists after it must be skipped (else fresh).
  The annotation check stays as the second condition; a raw annotation list of 50 or more (GitHub's per-job cap) is unknown; a failed
  job read or a missing steps field is unknown. LOW-1: hosted_verdict's red entries carry `conclusion`; any red not concluded `failure`
  is fresh. LOW-2 (the better option): compare journals `hosted_red` (id, conclusion, completed_at; a status has id null) on every RED
  row of hosted_compare.json; recorded_gate finds EVERY recorded red run again by id among filter=all runs (completed, red), a recorded
  status judged as one, and is unknown when the row journals no hosted_red (every row before this fix), a recorded run is no longer
  listed red, or none was completed at the recorded hosted_completed_at. The rebuild from today's red statuses is gone. LOW-3: with_gate
  writes the gate judge's own word as stale_check when no B10 judge ran; hosted_summary's stale entries go through stale_entry: a B10
  row needs every B10 key (a missing one raises KeyError, as before B12b), a B12b row its own six plus B10's when present.
  test_gate_stale.py 75 tests (+29), the tick wiring test asserts the frozen reads, 12 new b12b-* rules, 3 re-anchored
  (newest-post-any-time, context-by-name, gate-unwired-in-the-tick). README section and spec addendum rewritten for the fix round.
