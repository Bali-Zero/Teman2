bites:
  consumer: The launchd tick com.balizero.localci-merger on Pro (decisions.jsonl and the run dir's hosted_compare.json) and `merger.py report` run by hand on Pro.
  observation: >-
    Owed after merge and the tick's next extraction on Pro (this lane does not ship). Primary: the first decision whose
    `Harness floor recompute` row sits beside a pre-post PENDING red journals it under hosted_compare.stale with class_before
    FALSE_GREEN, stale_why gate_posted_after_hosted, hosted_completed_at, gate_posted_at and plan_at, and counts.FALSE_GREEN without
    it. Fallback, if no such race occurs in the window: `merger.py report` on Pro re-judges the recorded tick-time FALSE_GREEN rows.
    What the code path does with the two named so far (B10's pack: pr7961 and pr7962, `Backend Tests (Python)`, both journalled
    2026-10-08): that context's BASE matrix entry has no pending_when step, so recorded_gate returns {} and B12b changes nothing for
    them — they stay where B10's rule puts them (reclassified HOSTED_STALE with main_moved_paths when the head's red is still listed with
    the recorded completed_at, otherwise kept with B10's reason and no `gate` key). A recorded `Harness floor recompute` row of this
    shape is reclassified only when its hosted_compare.json row carries hosted_completed_at (every row journalled since B10), its run
    dir's state/plan.json survives retention, and the red run is listed under filter=all with only the PENDING and exit-code
    annotations; otherwise it is kept with `(gate: unknown (...))` or `(gate: fresh (...))` on the phase E line. Not observed: this
    lane did not read Pro's journal.
