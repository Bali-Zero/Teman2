residuals:
  - "Live proof on Pro is owed to the first extraction after merge: the Bites observation above."
  - "The annotation shape is read from GitHub's documented workflow-command behaviour and from receipt R8 of evidence/2026-10/agent-air-m5-ci-bites-head-tree-v3-ac882ce3 (the log of #7526's PENDING red carried exactly the PENDING line and `Process completed with exit code 1.` as its ##[error] lines); the annotations API itself was not called by this lane. If GitHub's real annotations differ (another title, a truncated message, a second runner line), the judgement answers fresh and the FALSE_GREEN is kept: the error direction is a kept red, never a hidden one."
  - "The head's statuses come from the combined status (newest per context): when the newest harness/fable-gate status postdates the plan, an earlier post it replaced is not seen and the row is kept."
