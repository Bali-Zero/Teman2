what_changed: |
  scripts/healer_receptor_registry.py: on node pro, a fresh sidecar (age <= 3 x expected_hb_seconds) with an unhealthy status
  is ALIVE WITH FINDINGS (new `findings` list, state alive_with_findings, completion_evidence) when it matches its own organ's
  entry in the closed allowlist _COMPLETION_PROOF: pro.kbli_surface_conformance error + note "detector_rc=1 result=divergence";
  pro.launchd_liveness degraded + note "<N>=1..> alarm(s)"; pro.meta_one_steward warning + note "token=alive|dead";
  cell.organism fail + metadata exactly {pulse_count (int >= 0), tier, action}. Everything else unhealthy stays dead with note
  "no detector completion evidence: <note>" (pro.visa_freshness_sentinel's "rc=1" is STALE or an uncaught exception, so it
  is not listed). Mini is unchanged (node gate). Findings never count in dead / dead_session / dead_owner or the exit code.
  scripts/healer_run_checks.py: registry-summary prints two more lines (findings count, ids); an absent bucket is none, a
  malformed one exits 3 (registry-receptor-broken).
  infra/launchagents/wrappers/pro-healer.sh: receptor A reason registry:<session>/<dead>-dead <findings>-findings; a findings
  line in run.log; the prompt asks for one final "HEALER_VERDICT: cured|incurable|partial <n_cured>/<T>" with T computed by
  the wrapper (every session-curable item, receptor-broken token and new arsenal death of the tick); the verdict is
  verdict-from-session --expect-total T: a valid line is recorded; no line at all logs verdict-line-missing and falls back to
  the unchanged escalation classifier; a malformed or wrong-total last line logs verdict-line-invalid and records unknown.
  scripts/healer_memo.py: verdict_from_session (last line naming HEALER_VERDICT, stripped, full-match strict, counts coherent
  with the word, total > 0 and == T); partial is persistable and never skips; the memo still skips only on incurable.
  Tests: test_healer_receptor_findings.py (34-row producer branch table), test_healer_session_verdict.py (21-row parser table,
  tick total, skip semantics), test_healer_run_checks.py (findings bucket), test_pro_healer_receptors.py (reason, findings-only,
  malformed bucket, verdict table, tick total).
