brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-SOVEREIGN phases C-D (the merger), handed by the team lead of the 2026-10-07 mission to this BLUE Dux;
  plan docs/specs/localci-sovereign-2026-10-07.md §2, ruling docs/rules/RULINGS.md RULED 2026-10-07. PR-C1 (#8017) and
  PR-C2b (#8021, merged 856f1ab6b2) are on main. The lead's C3 brief carries the notices of #8020's and #8021's gates;
  it allows a split C3a (`merge --armed` and its one live proof) / C3b (the rest). This is C3b. C3a waits on the lead's
  ruling: main's merge queue (ruleset 19779175, no bypass actor) refuses a direct PUT merge, and the runner never says
  PASS/SUBSET_PASS while review.independent is QUEUED, so the brief's proof cannot happen as written.
