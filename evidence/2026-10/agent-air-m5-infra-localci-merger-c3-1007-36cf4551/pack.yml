what_changed: |
  infra/launchagents/com.balizero.localci-merger.plist: MERGER_PYTHON is the merger's own coordinator venv
  (~/.nuzantara-pilots/local-ci/merger/venv, pytest 9.0.3 + PyYAML 6.0.3) instead of the shared backend-rag venv, whose
  pip freeze changed mid-run twice on 2026-10-07 and turned every PASS receipt STALE.
  scripts/localci/merger.py: `tick --code-sha` (40 lowercase hex, else exit 2) stamps code_sha on every journal line;
  the decision line journals each check's duration_s. `report`: error and skipped counts; the longest gap between
  DECISIONS, between any lines, and the age of the last line; a compared merge is GitHub merging the decided candidate
  (merge commit whose sole parent is the decided base) with >= 12 contexts compared (spec §2 phase B), counted once per
  PR at merged_at, sorted; the phase E line is READY only on 0 FALSE_GREEN and (>= 50 compared merges or >= 14 days
  between the first and last of them), never on days alone; a recorded FALSE_GREEN that is not a non-negative int, a
  timestamp or sha that does not fullmatch, or a merged candidate without merged_at is exit 2; rows carry code_sha and
  elapsed_s; the ticks line prints the longest and median tick and the slowest run of each check.
  scripts/localci/localci_merger_tick.sh: heartbeat through scripts/lib/heartbeat.sh run in its own process (never
  sourced); an interpreter that is not executable is exit 2 before any git; --code-sha passed only when the extracted
  merger.py knows the flag; the note says code=none when no sha was resolved.
  apps/organism/organism/organs_registry.yaml: pro.localci_merger expected_hb_seconds 1800 → 3600 (checksum recomputed
  over the parsed organs, two lines changed).
  Tests: test_merger.py 41 → 50 cases (wrapper pinned to /bin/bash, required variables isolated, heartbeat library
  hostile, older merger on main, non-executable python, code sha stamping and refusal; the watchdog test no longer trips
  on a loaded host's clone); test_merger_report.py 25 → 56 cases. README: the report paragraph, the schedule
  paragraph, a capacity note (sequential runner, cadence, heartbeat budget) and the own-venv install.
  Net size 413 added, 102 deleted (tests 240, merger.py 99, README 50, wrapper/plist/registry 24): one concern — the
  owed notices of the merger's two gates, which all land on the same three files; the tests are most of it.
proof: |
  See receipts. Every GitHub call is still a GET through hosted_compare.gh_get; runner.py, contexts_matrix.yaml and
  hosted_compare.py are untouched; nothing is merged, enqueued, labelled or posted.
