dissent:
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER: one PR decided twice fourteen days apart reads compared_merges=1, compared_days=14, phase E READY — the span was measured between decisions, not between merges."
    status: CONFIRMED
    resolution: "Each compared PR counts once, at GitHub's merged_at (a merged candidate without merged_at is exit 2); the span runs between the first and last of those. Test (one merge decided twice → 1 merge, 0 days, NOT READY); mutant (no dedupe) killed."
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER: 50 merged PRs with contexts_status ok but no comparable context ({} or all BLOCKED) read READY with LOCAL_BLIND=50 and AGREE=0."
    status: CONFIRMED
    resolution: "A merge counts as compared only when at least 12 contexts had a verdict on both sides (AGREE + FALSE_GREEN + FALSE_RED >= MIN_COMPARED_CONTEXTS = 12, the AGREE >= 12 of 14 of spec §2 phase B). Until phase B lands no live merge qualifies, and the README says so. Test parametrised on all-blind and one-blind; two mutants (threshold - 1, threshold ignored) killed."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR: `or 0` turns a recorded FALSE_GREEN of false, 0.0, [], {}, '' or null into zero before the type check."
    status: CONFIRMED
    resolution: "recorded_false_green() reads the value before any default: counts absent (a comparison that failed at tick time) is 0; counts present must hold a non-negative int under FALSE_GREEN, else exit 2. Thirteen parametrised shapes plus the failed-comparison innocence case; two mutants killed."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR: the heartbeat library, sourced from a mutable checkout before the trap, controls the wrapper: `exit 0` ends it green, `set +e` lets a later failure pass as ok."
    status: CONFIRMED
    resolution: "The wrapper runs heartbeat.sh in its own process (the library's CLI mode), never `source`; a failed write is said on stderr. Guilt test: a library that runs `set +eu; exit 0` beside a tick that fails leaves the wrapper's exit 1; mutant (sourced) killed."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR: rollout breaks both ways — the new wrapper passes --code-sha to main's merger.py, which argparse rejects with exit 2 (no tick, no journal line); the old wrapper beside the new merger writes lines without code_sha."
    status: CONFIRMED
    resolution: "The wrapper passes --code-sha only when the extracted merger.py knows the flag, so a newer wrapper beside an older main (or a stale mirror after a failed fetch) still ticks. Test with an older merger on main; mutants (flag always, flag never) killed. The other direction is accepted and visible: a line without code_sha is reported as such (the window lists the code shas it saw), and the install after merge replaces the wrapper the same hour."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR: a 40-hex sha followed by a newline passes the `$`-anchored match and lands in the journal."
    status: CONFIRMED
    resolution: "is_sha() and is_ts() use fullmatch (code sha, merge commit sha, heads, journal timestamps, --since). Tests: a code sha with a newline or upper case is exit 2; a journal timestamp with a newline is exit 2; both mutants killed."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR: reversing the journal's lines turns compared_days negative and READY into NOT READY."
    status: CONFIRMED
    resolution: "The merged_at events are sorted before the span is taken. Test with the journal reversed; mutant (unsorted) killed."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR: the report drops the provenance the tick now writes."
    status: CONFIRMED
    resolution: "Every row carries its decision's code_sha and the window lists the code shas seen; the gaps line prints them. Test; mutant killed."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR: the README promises to show a merger that stopped writing, but a gap needs two lines — the silence since the last line is not measured."
    status: CONFIRMED
    resolution: "The window carries last_line_age_h, the age of the last line against the clock, and the gaps line prints it. Assertion added; mutant killed."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR: readiness that ignores per-context FALSE_GREEN survives all 38 report tests."
    status: CONFIRMED
    resolution: "Readiness is tested with fifty compared merges against each FALSE_GREEN source apart (recorded at tick time, per context now, per decision); mutant killed."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: merged_here ignores the base, so every decision of a merged head reads GitHub GREEN (hiding a false green on an older base) and joins the compared span."
    status: CONFIRMED
    resolution: "merged_here now holds only when the queue merged the decided candidate (the merge commit whose sole parent is the decided base); a decision on another base is judged on its head's checks. The base test now also asserts github RED and no compared merge; mutant killed."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR: CODE_SHA is a module global, so a run without --code-sha after one with it stamps the stale value; an empty SHA writes `code=` in the heartbeat."
    status: PLAUSIBLE
    resolution: "cmd_tick assigns CODE_SHA from its own argument on every call, so no value leaks (Codex measured the sequence and found none); the test now runs a tick without the flag after one with it and asserts no code_sha (mutant `a.code_sha or CODE_SHA` killed). The heartbeat note says code=none when no sha was resolved."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: the new wrapper passes --code-sha to an older merger.py; sourcing the library lets a working checkout alter or kill the wrapper."
    status: CONFIRMED
    resolution: "Same cures as the Codex findings: the flag only when the extracted merger knows it; the library in its own process. Tests and mutants as above."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: the merger's venv has only pytest and PyYAML, so the BASE runner crashes on missing project dependencies such as docker; a missing venv fails with 127 instead of 2."
    status: PLAUSIBLE
    resolution: "Measured, the first half does not hold: runner.py imports only the standard library and drives docker through its CLI (shutil.which('docker')); the own-venv tick on Pro ran PASS 7 / QUEUED 1 / not applicable 3 / BLOCKED 2, the shape of the last shared-venv tick. The second half is cured: an interpreter that is not executable is exit 2 before any git, with an error heartbeat. Test; mutant killed."
  - seat: agy-gemini-3.1-pro
    objection: "MINOR: the README's '14 days between the first and the last compared merge' is computed between decisions of the same merge."
    status: CONFIRMED
    resolution: "Cured with the dedupe at merged_at; the README now says what is counted and when a merge is compared."
  - seat: agy-gemini-3.1-pro
    objection: "MINOR: the code-sha test stays green if CODE_SHA is only set when the flag is given."
    status: CONFIRMED
    resolution: "The test runs a tick without the flag after one with it and asserts the line carries no code_sha; the sticky mutant is killed."
owed:
  - "After merge, on Pro: re-take the wrapper from main (copy beside, mv, cmp -s against origin/main's blob), install the plist with only __HOME__ substituted and bootout/bootstrap it (MERGER_PYTHON changes), then prove one launchd tick whose decision line carries code_sha and durations and whose heartbeat comes through heartbeat.sh; scripts/lint_home_fork.py --check clean for the pair. Until then the launchd job runs the C2b wrapper on the shared venv and its receipts can go STALE again."
  - "PR-C3a, per the lead's ruling (B + ENQUEUE), built from origin/main after this merges: `merge --armed` behind LOCALCI_MERGER_ARMED=1 + the label localci:merge-shadow-ok set by a maintainer (labeler read from the issue events) or a PR of the repo's own bot/sessions; local criterion 'no local red' (no FAIL/ERROR/STALE, every executed required context OK, only review.independent QUEUED and not_implemented contexts allowed, both counted on the line, never the word PASS) AND GitHub's required checks green on the head; enqueue via GraphQL enqueuePullRequest with expectedHeadOid, never PUT /merge; a moved head or a dequeue journalled, never retried blindly; proved once on a docs-only PR, flag off after."
  - "Pen residual: anything the merger does on GitHub (C3a's enqueue included) runs under the ambient gh token, the shared identity of every session on Pro. Only Zero's dedicated merger credential (spec §4.1, a GitHub App or machine user under an OS user no agent session can read) cures it."
  - "review.independent has no local seat: the runner plans it and leaves it QUEUED, so overall is never PASS. The end state needs either a local review seat or a ruling that drops it as a required check — not decided here."
  - "compared_merges stays 0 until phase B: a merge counts only with >= 12 contexts compared and A2 reaches 7/14. Phase D's window effectively starts when B lands."
  - "Capacity: ticks take 883-1265 s with the runner's sequential loop; StartInterval stays 600 and launchd serialises. Parallel checks are phase B's runner work; expected_hb_seconds 3600 holds while tick + 600 s stays under it (a tick past 3000 s needs the budget raised again, with a receipt)."
  - "The wrapper decides whether to pass --code-sha by grepping the extracted merger.py for the flag. Once every main the mirror can serve carries it, a later PR can drop the probe."
  - "Carried from C1/C2: a kill -9 of a tick leaves its runner child running to the runner's own deadline; a second host (Mini) needs the Postgres lease of spec §3 before it may tick; GIT_ATTR_NOSYSTEM has no guilt test (planting a system attributes file needs root)."
