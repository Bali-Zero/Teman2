    seat: "claude-opus-5-5 (BLUE Dux, M5 worktree infra-localci-merger-c3-1007 and its Pro mirror; code, tests, Pro proofs, this pack)"
  - lane: localci-merger-c3b-redteam
    role: review
    seat: "codex-gpt-6.1-sol (codex-companion via the codex:codex-rescue subagent, read-only, effort high)"
