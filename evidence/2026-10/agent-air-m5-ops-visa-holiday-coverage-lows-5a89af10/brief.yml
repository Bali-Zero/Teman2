    probe: "apps/backend-rag/backend/tests/services/visa_engine/test_holiday_coverage.py"
  - text: Three CANNOT_VERIFY ticks stay digest-quiet, the fourth is a BLIND p0 with a board row and rc 4, and an OK or WARN resets the count.
    probe: "scripts/tests/test_visa_holiday_coverage_lane.py"
  - text: Loading the 2028 decree does not turn the two formerly pinned tests red.
    probe: "apps/backend-rag/backend/tests/services/visa_engine/test_holiday_coverage.py"
pii_scan: clean
pii_scan_note: Holiday decree dates and product codes only; no client data.
bites:
  consumer: The launchd tick com.nuzantara.visa-freshness-sentinel on Pro (every 6 h, runs scripts/visa_freshness_sentinel.py).
  observation: >-
    After merge a sentinel tick on Pro still logs HOLIDAY_COVERAGE OK first_gap=2027-11-19; the guilt tests prove the STALE text and the
    BLIND escalation.
