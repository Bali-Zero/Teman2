task_id: visa-holiday-coverage-lows
gear: 2
gear_reason: >-
  Floor 2 by blast radius (about 190 net lines across a backend helper, the sentinel and tests). One sentinel lane; no hot-zone path,
  workflow, plist or wrapper change. Gear 2's adversarial seat is the fresh on-disk gate.
l_level: L2
gate_class: opus
objective: >-
  Cure the three LOW gaps the gate left on the holiday-coverage lane (PR 8206). L1: after the gap day the STALE text must keep naming the
  day the gap began, not today. L3: a coverage probe that stays CANNOT_VERIFY for 4 consecutive ticks (one day at the 6 h cadence) must
  reach the exit code, the heartbeat and the owner alert path. L4: the two tests pinning the real 2027 data become data-relative.
acceptance:
