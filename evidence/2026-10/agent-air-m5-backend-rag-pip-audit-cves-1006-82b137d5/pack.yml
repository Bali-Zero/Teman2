# Gear-3 evidence pack — cure main's pip-audit red in the backend-rag locks.
# Written by the Dux of this mandate (dux-pipaudit, Claude Opus 5.5, M5). Every receipt is a command this
# writer ran on 2026-10-06 between 02:05Z and 02:45Z UTC; `ts` values are minute-level readings of the
# session clock. Scratch logs live under ~/.agent/campaign-20261005/work/dux-pipaudit/ and are not committed.
gear: 3
brief_ref: evidence/brief.yml
ruling: >-
  Mandate from the imperator window (team lead), 2026-10-06: appointed Dux for a MAIN-blocking cure, from the
  round-2 gate receipt of PR #7928 (notice N1: required "Backend Tests (Python)" is red on every backend PR
  because Backend Static's pip-audit fails on origin/main's own locks).
mission: >-
  Bump only the flagged packages to their minimal fixed versions in the locks the job audits, decide
  python-jose (no fixed release), keep the change minimal because the merge is a Fly production deploy.
lanes:
  - lane: pipaudit-build
    role: build
    seat: >-
      Claude Opus 5.5 (Dux, M5): uv pip compile of both locks, the tests.yml ignore and guard, the doc entry,
      the proofs.
  - lane: pipaudit-council
    role: review
    seat: >-
      Codex O2 (codex-gpt-5.6-sol roster seat; CLI reported gpt-6.1-sol) and Kimi k3, sealed in parallel,
      then one refutation round each; verbatim in council-journal.jsonl.
  - lane: pipaudit-review
    role: review
    seat: >-
      Codex O2 and Kimi k3, read-only review of the full uncommitted diff in the worktree; both VERDICT PASS;
      verbatim in council-journal.jsonl.
seat_diversity: >-
  Three families: Anthropic (the Dux's sealed proposal), OpenAI (Codex O2) and Moonshot (Kimi k3). The builder
  is Claude; every review is non-Anthropic. TP1 qwen3.8-max (titolare) not asked: the Alibaba monthly quota is
  exhausted until 2026-10-11 (campaign rules). Gemini agy reads BUSY (owner's windows). No reserve seat counted.
pii_scan: clean
bites:
  consumer: >-
    (1) The Backend Static (Python) job's pip-audit step on this PR, and through it the REQUIRED aggregate
    "Backend Tests (Python)" that every apps/backend-rag PR needs (PR #7928 waits on it). (2) The Fly app
    nuzantara-rag: the merge of this PR deploys requirements-prod.lock.txt (multidict 6.9.1, langgraph-sdk
    0.4.4) to production automatically.
  observation: >-
    Backend Static green on this PR with "pip-audit requirements.lock.txt: clean" and
    "pip-audit requirements-prod.lock.txt: clean" in its log (gh run view --log); after the merge,
    `fly status -a nuzantara-rag` (read only) shows the new release's machines started and passing checks,
    `curl -s -o /dev/null -w '%{http_code}' https://nuzantara-rag.fly.dev/health` prints 200, and a forged
    bearer token on /api/auth/profile prints 401.
decisions:
  - >-
    python-jose stays and is ignored (CVE-2026-85394 only): it is imported by 11 production modules, so removal
    is a migration, not a lock edit; both council seats agreed the migration is a separate PR.
  - >-
    One id, not two: alias resolution measured (R3). If a future record lacked the alias the step goes red,
    the safe direction. Kimi's sealed answer asked for both ids (dissent D1).
  - >-
    The ignore is bound in CI to python-jose==3.5.0 and to 2026-11-06 (both refutations converged, D2). The
    guard turns the step red on that date on purpose: the migration or a re-justification is then required.
