dissent:
  - seat: kimi-code/k3 (sealed council)
    objection: "Ignore BOTH CVE-2026-85394 and GHSA-3qf3-8w2g-rqmx; one id risks staying red."
    status: PLAUSIBLE
    disposition: >-
      Not adopted. R3 shows pip-audit 2.10.1 resolves aliases, so one id suppresses either form. The residual
      (a record without the alias) fails red, which is the safe direction; Codex's sealed answer preferred one
      id once alias resolution was proven.
  - seat: codex-gpt-5.6-sol and kimi-code/k3 (refutation round, converged)
    objection: >-
      The ignore's version and expiry bounds are only documentary: a python-jose change or the re-check date
      passing would keep the audit green with no re-evaluation.
    status: CONFIRMED
    disposition: >-
      Adopted before the hot-zone edit: the step fails while the ignore exists if either lock stops pinning
      python-jose==3.5.0 or the date reaches 2026-11-06 (R6 guilt and innocence).
  - seat: kimi-code/k3 (refutation round)
    objection: >-
      The OWED PyJWT migration has no named owner; the repo's own ignore file shows doc-only dates lapsing.
    status: PLAUSIBLE
    disposition: >-
      The date now enforces itself (red step on 2026-11-06). The owner is not chosen here: the OWED line goes in
      the PR body and in the Dux report to the imperator, who assigns the lane.
  - seat: codex-gpt-5.6-sol (sealed council)
    objection: "Build the Fly image before merging; the merge itself deploys."
    status: PLAUSIBLE
    disposition: >-
      Docker is not installed on M5. The nearest proof is R10: the prod lock installed exactly as the
      Dockerfile does (uv pip install -r requirements-prod.lock.txt), the CMD module imported and booted, health
      200. The image build happens in the deploy; a failed build leaves the current release serving.
  - seat: kimi-code/k3 (review)
    objection: "Scope creep: the diff guts claude-cascade.sh and deletes test_claude_cascade_shell.py."
    status: RETRACTED
    disposition: >-
      Artifact of reviewing against a moving origin/main while the worktree base was 3 commits behind (Codex
      flagged the same as base drift). The change itself touches only the 4 files plus this evidence dir; the
      branch was rebased on fresh origin/main before the commit.
