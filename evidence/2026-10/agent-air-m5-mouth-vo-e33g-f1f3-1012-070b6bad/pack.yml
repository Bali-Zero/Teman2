decisions:
  - id: D-lookbehind
    decision: >-
      The new threshold alternatives (60 thousand, 60 ribu, 60ribu) carry a (?<!\d) lookbehind so 160 ribu and 16 thousand
      are not read as the threshold; a table test pins 14 matching and 5 non-matching spellings.
  - id: D-min-tests-9
    decision: >-
      MIN_TESTS is 9, the real count (8 existing plus the new table test), not the 6 the row named; the observer pytest
      shifts its accept and reject lists to the same floor.
  - id: D-close-row
    decision: >-
      The F1-F3 PENDING-ARMS row is closed in this PR and test_f1_f3 in the seq-28 ledger test accepts either the open row
      or the closed row carrying CLOSED BY, so the ledger count stays pinned.
