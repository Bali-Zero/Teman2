objective: >-
  Lead ruling Q20 (2026-10-10): the instrument lot that closes Q16 for the PR 5/6/3 Views before they land, with the
  #8227 gate's bindings (i), (ii) and its Q16 gaps 1–7. (1) One curated-language rule: en_purity reads a basis or note
  by LabelBook.isEnglishText (the clause rule over the whole text, "(;—" blanked — PR 5's BasisBlock.isOriginal rule),
  and census --curated proves Swift and Python identical on every record, naming the codes #8227's rule read
  otherwise. (2) The analyser loads kbli-overlay.json: the Indonesian a curated overlay sentence quotes in (…) is bound
  to that sentence (C6); a curated overlay line or sentence drawn whole is curated prose (Q17's last sentence, ruling
  1) — never an Indonesian-only one, one carrying the raw official title, or one with a Q17 value of the record left
  in it. Q17: each of the record's own kewenangan / perizinan / non-numeric jangka_waktu values outside (…) is a gap
  the View fills with English, the original in parentheses after it at most (gap 4, gap 1 in prose); one inside
  (…), quotes or a longer name ("Instruksi Gubernur Bali No. 6/2025") is the curator's original. The 22 curated
  Bali reasons with a status word or record key (gap 3): the record's own status word and every enum or record key
  are gaps that hold the pinned English word; the View (LabelBook.humanise) draws the record's own status word in
  English by exact match against pma_status and a record key as its LabelBook.field label. (3) LabelBook.originalLabel.
  (4) Per statute field: its value under the original label (innocence), another record's value under it, the value
  unlabelled and the value under another field's label (guilt). (5) The fallback partition covers every occurrence;
  a label lends itself only to the line next to it, or to a text forming one run of lines with it (binding 3), and a
  line another record span holds is no piece of another text. (6) #8227 gate (i) closed-set maps pinned, (ii) the
  statute field names read as raw by the never-drawn check. No KBLI fact, verdict, cap, basis or overlay changes.
