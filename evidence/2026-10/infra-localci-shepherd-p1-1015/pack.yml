what_changed: |
  scripts/localci/shepherd.py (observe core: one bounded paginated GraphQL listing of at most 5 pages, aliased brief reads, classifier for
  classes 4 and 7, lease, budget, would_* journal, no write verb), scripts/localci/localci_shepherd_tick.sh (wrapper: code from its own
  clone --shared bare mirror at one sha, heartbeat on every exit path), infra/launchagents/com.balizero.localci-shepherd.plist (StartInterval 600,
  no KeepAlive), organs_registry.yaml entry pro.localci_shepherd, a declared pair, scripts/localci/tests/test_shepherd.py (64 cases),
  33 b34-* mutants in merger_mutants.py, the spec section. Round-1 cures: rate_limit counted in the 60, a truncated label set fails closed
  (labels_truncated, no would_label, no role read), a PR in both classes journals both would_* actions, the wrapper's EXIT-trap cleanup can no
