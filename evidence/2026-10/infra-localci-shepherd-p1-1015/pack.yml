dissent:
  - seat: codex-gpt-5.6-sol (DEFECT, round 1)
    objection: >-
      shepherd.py:235 "The rate_limit GET bypasses Rest/CallCap, so 60 permission GETs plus this request produce 61 REST calls."
    status: CONFIRMED
    disposition: >-
      CURED in c202caec6f: rate_limit goes through Rest and is call 1 of 60; test_the_rate_limit_read_is_counted_so_a_tick_never_makes_a_61st_rest_call
      (70 authors, exactly 60 GETs) failed on af081b6c68 (R4) and passes; mutants b34-rate-limit-uncounted and b34-ratelimit-error-acts are killed.
  - seat: codex-gpt-5.6-sol (DEFECT, round 1)
    objection: >-
      shepherd.py:52 "Labels are limited to 30 without totalCount or truncation handling, so an arm label beyond the first 30 is falsely classified as absent."
    status: CONFIRMED
    disposition: >-
      CURED in c202caec6f: totalCount is read, a cut set without the arm label gives labels_truncated, no would_label, no role read; three tests and four mutants.
      Confirmed sound by both seats in round 2.
  - seat: codex-gpt-5.6-sol (DEFECT, round 1)
    objection: >-
      shepherd.py:187 "A PR in both classes records only its gate action; would_label is suppressed even though label_candidate is present."
    status: CONFIRMED
    disposition: >-
      CURED in c202caec6f: actions is a list and every action is journaled as its own event; test_a_pr_in_both_classes_carries_and_journals_both_would_actions
      and mutants b34-gate-suppresses-label, b34-journal-first-action-only.
  - seat: codex-gpt-5.6-sol (DEFECT, round 1)
    objection: >-
      shepherd.py:100 "Open-PR listing can execute up to five GraphQL calls, contradicting the ONE-query listing contract."
    status: PLAUSIBLE
    disposition: >-
      Wording, not behaviour: the five pages are the bounded, already-tested design (a sixth page is refused as a truncated queue). Spec, brief and docstring now say
      "one bounded paginated query (<= 5 pages)".
  - seat: codex-gpt-5.6-sol (DEFECT, round 1 — wrapper lines 34 and 81)
    objection: >-
      localci_shepherd_tick.sh:34 "Cleanup runs under set -e; a failed rm can abort the EXIT trap before heartbeat emission." and :81 "HB_NEW is not included in EXIT
      cleanup and can be left behind if replacement fails or execution is interrupted."
    status: CONFIRMED
    disposition: >-
      CURED in c202caec6f: || true scoped to the three cleanup commands only, HB_NEW removed by the trap; a failing-rm wrapper test and a SIGTERM-during-extraction test
      failed on af081b6c68 and pass; four trap mutants killed. Round 2 confirmed the trap still exits with the original rc.
  - seat: codex-gpt-5.6-sol (DEFECT, round 1 — wrapper lines 13 and 61)
    objection: >-
      localci_shepherd_tick.sh:13 "Heartbeat is not guaranteed: a missing, empty, or failing heartbeat library only emits stderr" and :61 "The wrapper creates state and
      performs clone/fetch work before the Python host guard, so a wrong host still touches disk and network."
    status: PLAUSIBLE
    disposition: >-
      NOT cured, accepted as NOTE by the coordinator: both shapes are the production merger wrapper's (localci_merger_tick.sh), the plist and declared pair name Pro only,
      and a missing heartbeat is itself caught by the organ's expected_hb_seconds silence net. Both round-2 seats re-listed them as accepted NOTE.
  - seat: agy-gemini-4-argon (NOTE, round 1)
    objection: >-
      shepherd.py:200 roles_for does not pre-filter PRs that classify will reject on a NEVER predicate (non-main base, fork, truncated files, off-limits, changes requested),
      which can spend one counted REST call per distinct login on a PR that cannot become a label candidate.
    status: PLAUSIBLE
    disposition: >-
      Bounded by the 60 cap and by one read per login per tick; the cost is a few wasted counted calls, never a wrong row. Left for P2 where the reads feed an action.
  - seat: codex-gpt-5.6-sol and agy-gemini-4-argon (NOTE, round 2)
    objection: >-
      shepherd.py:165 the classify docstring still reads {classes, action, reason, ...}; organs_registry.yaml:3283 notes prose says "one GraphQL query" while list_open paginates.
    status: PLAUSIBLE
    disposition: >-
      Stale words, no behaviour. Not edited after the council: the registry edit would recompute the file's checksum and the docstring edit would move a reviewed
      head for a comment. Carried as residuals.
