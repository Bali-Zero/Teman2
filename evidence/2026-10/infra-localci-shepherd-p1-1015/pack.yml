decisions:
  - id: D-rate-limit-counted
    decision: >-
      GET rate_limit goes through the counter and takes the first of the 60 calls (at most 59 role reads). GitHub does not charge /rate_limit to the
      core quota, but the written contract is 60 REST calls and a contract that exempts one call silently is the shape a later edit breaks.
  - id: D-labels-fail-closed
    decision: >-
      A label set cut at 30 with no arm label in the page is not "no arm label": the PR gets class labels_truncated, no would_label and no role read.
      A PR whose arm label is in the first 30 is decided as before.
  - id: D-actions-list
    decision: >-
      The row carries actions (a list); each action is journaled as its own event with the row's fields, so a PR in classes 4 and 7 yields would_gate
      and would_label. The single-valued action field is gone; nothing else read it.
  - id: D-rebase-union
    decision: >-
      The only conflict of the rebase was docs/specs/localci-sovereign-2026-10-07.md, where B25-prime (#8561) appends a section at the same spot as the B34 section; both are kept.
  - id: D-wrapper-notes-accepted
    decision: >-
      Wrapper clone/fetch before the Python host guard and the stderr fallback of a missing heartbeat library mirror the production merger wrapper and
      stay NOTE; the plist is only installed on Pro (declared pair machines: pro).
