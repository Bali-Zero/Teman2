  - id: D-truth-table-spec
    decision: >-
      The copy follows spec-interview-truth-table-c4v3.md (scratchpad), whose rows were derived
      from flow.ts, fact-mapper.ts, tree.ts and the signed pack rulepack-prod-026 with sha256
      dcbc12cd5844301c18c89bf9311d061fe6ad718ebbe13755afc9dd5b01c070cf. Section 2-A (27 keys),
      2-C (7 keys) and the 9 addendum (16 rows) the 10 addendum (4 keys) and the 11 addendum (13 keys) are applied byte-exactly in both languages; 2-C covers keys outside the
      original diff because they are visible and false on main. The dead keys of section 2-B are
      not touched here: deleting them is a separate PR.
  - id: D-full-subtree-before-push
    decision: >-
      The whole visa-oracle test subtree must run green before any push. The seven-file subset
      never ran the engine adapter test that scans the shipped condition strings for reassuring
      stems, which is how three Indonesian assumption notes with the stem pasti got through. The
      full-subtree receipt below carries the real totals.
  - id: D-successor-of-8145
    decision: >-
      Successor of the closed PR 8145. The final gate verified all 98 rendered changed keys true
      and blocked only on the red full subtree: three assumption notes said pastikan. They now
      say konfirmasi. Built on a fresh origin/main with the v4 code commits cherry-picked in
      order, without their evidence commits.
  - id: D-successor-of-8140
    decision: >-
      Successor of the closed PR 8140 (gate BLOCK on two keys that referred to an answer the
      visitor never gave on that path: the code list above and the marriage registered above).
      Built on a fresh origin/main that already holds C2 and C3; the v3 code commits were
      cherry-picked without their evidence commits and the spec addendum 10 applied on top.
  - id: D-penjamin-note-present-tense
    decision: >-
      Row 13 of the 11 addendum rewrites the penjamin assumption note in the present tense,
      keeping the owner's service wording that Bali Zero can act as the penjamin (PR-M ruling).
      Its not-sure handling was checked in the question tree and the fact mapper: the answer
      becomes no. The past-tense assumption wording is now banned across every assumption key by
      the truth test, and the conservative handling of that note is no longer a special case.
  - id: D-no-reference-to-unseen-answer
    decision: >-
      A helper text never refers to an earlier answer (above, earlier, di atas, sebelumnya)
      unless the flow guarantees that question precedes it on every path showing the text. The
      only two references left were checked against the flow: the channel conflict message
      shows only once the status-change answer exists, and the undecided-basis hint follows the
      basis question in every retirement walk.
  - id: D-no-promised-advisor
    decision: >-
      No interview sentence promises that a Bali Zero advisor confirms, reviews or checks
      something the code does not guarantee; the advisor is offered, never promised. The same
      rule is applied to the ten assumption sentences and the family sponsor basis hint, as the
      lead's extension of Codex's rule (rows 6 to 16 of the spec addendum). Each assumption
      preface was checked against the question's not-sure handling in the question tree and
      the fact mapper: all ten state an assumption the mapper really makes. The hint on the
      sponsor permit basis is rewritten because that answer reaches no rule of the signed pack.
  - id: D-successor-of-8128
    decision: >-
      Successor of the closed PR 8128 (gate BLOCK on three HIGH truth findings: the retirement
      basis hint, the sponsor category hint, the other-purpose and paid-activity hints). The
      v2 code commits were cherry-picked from that branch, without its evidence commits, then
      the truth table was applied on top.
  - id: D-no-staff-channel
    decision: >-
      No sentence says an answer reaches Bali Zero staff: the only network call carrying answers
      is the evaluation request, and the WhatsApp handoff states that interview answers are not
      included. Answers that do not decide anything automatically are described as such, without
      claiming a person reads them.
  - id: D-identifier-guard
    decision: >-
      A dotted engine identifier inside a sentence is banned by both the census test and the
      observer; template placeholders are exempt and a dotted dictionary key is not copy.
