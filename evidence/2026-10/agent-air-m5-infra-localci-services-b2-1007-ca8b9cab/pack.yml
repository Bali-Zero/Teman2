residuals:
  - "Owed (B3): hosted_compare carries each context's `coverage` on its row and the merger counts `partial` AGREEs apart from full ones. Today a `coverage: partial` AGREE (E2E) counts as full in both."
  - "Gate LOW: test_every_container_removal_takes_its_anonymous_volumes_with_it walks runner.py's AST only; a container removal in another module, or written as a list literal whose first element is a constant, would escape it."
  - "12/14 on the final head is owed: 535dbff589 read 11/14 with E2E, Frontend and Visa Oracle smoke AGREE, and Backend Tests FALSE_RED on disk while the shadow merger ran beside it. A Backend-only re-run needs the VM to itself (the merger paused, an operator decision), or a larger VM disk. 1df44b9b65 read 12/14 on runner 1c26bf7a8b."
