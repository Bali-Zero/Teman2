  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 2): the reader's no-verdict marker matched echoed text, so a genuine red could become no verdict."
    status: CONFIRMED
    resolution: "Only the reader's own stderr line, line-anchored, counts (d7599e3fe9). Probe rows in test_a_host_reader_that_could_not_read_github_is_asked_again_then_gives_no_verdict."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR (round 2): the browser symlink is writable within a leg; DEPS_BARE keeps the base image's python3."
    status: PLAUSIBLE
    resolution: "Residual, declared: hosted's ~/.cache is user-writable too, and candidate-produced verdicts are already the stated residual. The candidate image keeps /usr/local/bin/python3 (checked on Pro)."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER (round 1): repository secrets are overridden to empty."
