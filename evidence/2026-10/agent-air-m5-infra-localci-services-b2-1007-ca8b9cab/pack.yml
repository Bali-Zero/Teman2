brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-SOVEREIGN phase B (ruling docs/rules/RULINGS.md, RULED 2026-10-07), PR-B2: E2E Tests (Playwright),
  Frontend Tests (Next.js) (mouth, true) and Visa Oracle fullstack smoke as service contexts. Design anchor:
  docs/specs/localci-sovereign-2026-10-07.md §2 phase B. The first B2 Dux died mid-work; a fresh Opus 5.5 Dux resumed from
  its disk state on 2026-10-08, rebased onto origin/main 538251ee69 (B1's seven commits dropped: main carries them as the
  squash ba445b84a1, #8032) and folded the B1 final gate's notices a-f handed by the team lead.
lanes:
  - lane: localci-services-b2-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux of LOCALCI-SOVEREIGN PR-B2, M5; two successive sessions, the second resumed from disk; heavy execution on Pro over ssh)"
  - lane: localci-services-b2-redteam
    role: review
    seat: "codex-gpt-6.1-sol (codex:codex-rescue runtime, read-only, default-to-defective; 2 rounds)"
  - lane: localci-services-b2-refuter
    role: review
    seat: "agy-gemini-3.1-pro (agy --sandbox --model gemini-3.1-pro-high, prompt-only; 2 rounds)"
council_run: council-journal.jsonl
seat_override: >-
  Two external families reviewed the candidate (OpenAI Codex, Google Gemini 3.1 Pro), but the Codex home's configured
  default is gpt-6.1-sol while the roster names codex-gpt-5.6-sol, so the Codex lines are journalled under their true name
  and do not qualify for R9 — the position A1's, PR #7991's and PR-B1's packs took.
seat_fallback_reason: >-
  The reserve agy-gemini-3.1-pro stood in for the titular seats. The last arsenal probe on record
  (scripts/arsenal_probe.py --seats kimi,tp1-qwen3.8-max,tp1-glm-5.2, 2026-10-07T15:52:47Z on M5, journalled by PR-B1)
  read kimi QUOTA_DEAD (membership quota) and both TP1 seats QUOTA_DEAD (HTTP 429, monthly plan quota, reset 2026-10-11
  16:00 UTC); B2's two rounds ran at 17:41Z and 19:19Z, inside that window. The first B2 Dux journalled no fresh probe.
pii_scan: clean
pii_scan_note: Runner code, a contexts matrix, tests, CI logs of the repository's own suites and GitHub check metadata only; no client data was read or written.
what_changed: |
  scripts/localci/runner.py (v0.6.0): three more required contexts run as service contexts (kind contained_jobs), every
  BASE step run verbatim or not_applicable with a written reason. E2E Tests (Playwright): Postgres + Redis, a live FastAPI
  backend, the Next.js build and the Playwright specs BASE selects; the six repository secrets are stood in for by "" and
  E2E's coverage is declared partial. Visa Oracle fullstack smoke: a disposable Postgres, the signed TEST RulePack, the
  fullstack spec. Frontend Tests (Next.js) (mouth, true): exactly the leg the required context names (typed values, bound to
  the context name). The deps image gains an npm cache filled from the candidate's lock (registry entries with an integrity,
  workspace links, github repos at a full commit; anything else BLOCKED), the lock's Playwright browser and apt packages,
  with bounded apt retries; a node-only recipe for Frontend. Step timeout-minutes is emulated in a service context and
  BLOCKED elsewhere; a network failure in the egress sandbox or a host reader that could not read GitHub is no verdict,
  never green or red. Folded from the PR-B1 gate (a-f): the queue ref without --pr-number BLOCKS; a declared env.X in a
  text the runner evaluates itself BLOCKS; a service with volumes BLOCKS; every refusal names its step and variable, never a
  value; tests.backend_shards/tests.frontend_mouth are superseded once their contexts are planned. Every container the
  runner removes (candidate, service, reaped orphan) goes with `docker rm -f -v`, so the anonymous volumes postgres/redis
  declare die with it (89 had filled Pro's VM).
  scripts/localci/contexts_matrix.yaml: 12 executed, the two CodeQL contexts blocked; parity_gaps for the three contexts.
  scripts/localci/README.md (service contexts, refusals, capacity); tests/test_service_contexts.py, tests/test_runner.py.
proof: |
  See receipts. Nothing in this change posts a status, edits branch protection, touches a workflow or arms the adapter.
  Before it: E2E, Frontend (mouth, true) and Visa Oracle smoke LOCAL_BLIND on every commit (9/14 with B1). After it, on
  Pro, the final head 535dbff589 on origin/main's head ebdad0739f read agreement=11/14 false_green=0 false_red=1: E2E,
  Frontend (mouth, true) and Visa Oracle smoke all executed and AGREE. The one FALSE_RED is Backend Tests, whose service
  Postgres ran out of disk (DiskFullError, then recovery mode) while the shadow merger ran its own Backend Tests on the
  same 59 GB VM; it is not the candidate. 1df44b9b65 read 12/14 with all three AGREE (runner 1c26bf7a8b). Guilt
  candidates turned only their own context red.
bites:
  consumer: >-
    scripts/localci/hosted_compare.py run on Pro over a local run of a merged hosted-green main commit (the comparator
    spec §4 makes the only place a local claim is stated).
  observation: >-
    Pro, 2026-10-08T02:35Z, runner of the final head 535dbff589 (sha256 b8081acd…), origin/main head ebdad0739f (#8041,
    base 538251ee69), run dir ~/.nuzantara-pilots/local-ci/executor-b/runs/b2h-main-ebdad0739f, live GETs:
    agreement=11/14 false_green=0 false_red=1 local_blind=2 (CodeQL x2 only). E2E Tests, Frontend Tests (Next.js)
    (mouth, true) and Visa Oracle fullstack smoke AGREE, executed. Backend Tests FALSE_RED on the VM's disk (a concurrent
    shadow-merger run), so 12/14 on the final head is owed a run with the VM to itself.
