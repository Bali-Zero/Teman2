dissent:
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER (round 1): the Install Playwright browsers step is not_applicable, so a hosted failure of that step (apt + CDN, the W118 flake) is not reproduced."
    status: PLAUSIBLE
    resolution: "Kept, by mandate: the browsers live in the deps image (the lock's playwright-core `install --with-deps chromium`, retried at build) and the sandbox never has root or network. Declared in the matrix parity_gaps for E2E and Visa Oracle smoke; a failed build is BLOCKED, never green."
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER (round 1): E2E empties six repository secrets hosted holds (QDRANT_URL, QDRANT_API_KEY, OPENAI_API_KEY, JWT_SECRET, E2E_TEST_EMAIL/PIN)."
    status: CONFIRMED
    resolution: "Not curable without prod credentials in a sandbox, which the constraints forbid. Declared: E2E coverage partial, the FALSE_GREEN shape named in parity_gaps; BASE's selected specs (page Page|@offline) read neither credential today."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): the egress network rule could turn a real vulnerability finding into no verdict."
    status: CONFIRMED
    resolution: "A log that holds a finding keeps its verdict, network error or not (2087d23a2f). Corpus row: test_a_network_failure_in_the_egress_sandbox_is_no_verdict_on_the_candidate."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR (round 1): the leg selector compares 1 == true and is not bound to the context name."
    status: CONFIRMED
    resolution: "Typed comparison, exactly one leg of the context's own job, its rendered values must end the context name (2087d23a2f). Probe: test_a_leg_selector_takes_exactly_the_leg_the_required_context_names."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR (round 1) then PARTIAL (round 2): a 0.001-minute step timeout was dropped; the round-1 cure (ceil) lengthened a 0.06 s budget."
