      WHEN any of the six articles or /visa/kitas states an E28G, a seven-sub-variant frame, "strictly passive" or
      "passive investors", an 18/24-month passport, "5-7 working days", an IDR 350M threshold, "Golden Visa (ITAP)",
      KPPA/representative office for E28D, paid-in capital as the E28A test, a fee split, or "renewable annually" for
      E28A, the truth test SHALL go red naming file and line; WHEN the correct sentences are present it SHALL be green.
    probe: "apps/mouth: npx vitest run src/content/e28-family-articles.truth.test.ts (784 tests, five locales)"
  - text: >-
      WHEN the E28G sub-variant line is put back into the E28A guide the truth test SHALL go red, and green again once
      the file is restored.
    probe: "fourteen mutations in pack.yml mutation_receipts (cp backup, restore by cp)"
  - text: >-
      WHEN the six touched articles are compiled with the production MDX options they SHALL compile, and the en/id
      corpus guards SHALL stay green.
    probe: "src/components/blog/MDXContentRSC.all-articles-en/id/selftest.test.tsx"
