  truth test (whole-body matching, forbidden families, required sentences, structure) holds that in place.
constraints:
  - Change only sentences, table cells or FAQ entries that state something false or unsupported about E28 codes,
    thresholds, durations, sponsor, work rights, passport, processing time, extension, permanence, price or E28E/E28G.
  - Price is all-inclusive, never a government/service fee split; Golden Visa routes are price on consultation.
  - MDX stays valid (bare '<' before a digit is &lt;), no new JSX, components or imports, frontmatter keys kept.
  - Local commits only, no push, no npm install/ci, no Playwright on M5, no paid per-token API.
acceptance:
