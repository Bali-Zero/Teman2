decisions:
  - id: D-committed-schema-coverage
    decision: >-
      No new test: the existing TestContractSnapshotDriftTripwire::test_every_exported_schema_matches_its_committed_snapshot
      (test_schema_contracts.py) already compares committed condition.schema.json and contract.schema.json to
      build_schemas(); mutation-checked above.
  - id: D-fingerprint-once
    decision: >-
      ACCEPTED: the new default enters whole-snapshot fingerprinting, so every facts fingerprint, decision id,
      public id, trace hash and persisted request_fingerprint changes once at deploy for identical facts.
      Outcomes and trace nodes are identical across all gold personas (node count still 84). Same as seq-28
      step A (#8272).
  - id: D-out-of-scope-sentry
    decision: >-
      Out-of-scope finding, separate follow-up: the Sentry scrub token list has no entry for paid_up_capital,
      investment_capital or birth_date style keys; only own_shareholding was added here.
  - id: D-rollout-default
    decision: >-
      The new key is optional on the wire with an UnknownFact(NOT_ASKED) default built by default_factory,
      never zero, because the request model rejects unknown keys and the deployed mouth does not send it yet;
      the mouth step closes the seam, the pack step adds the rule.
  - id: D-mouth-seam
    decision: >-
      Mouth files touched are generated or parity-only: schema.d.ts and its OpenAPI pin are regenerated, and
      ORDERED_ROLLOUT_OPTIONAL_PATHS admits the key so the fact-mapper parity test and the e2e key count stay
      true. No question, copy or mapper behaviour changes.
  - id: D-idempotency-409
    decision: >-
      Same accepted limit as seq-28 step A: the defaulted key enters the idempotency HMAC, so a visitor who
      evaluated before the deploy and reloads within the client identity TTL can get HTTP 409 once. Structural
      fix (exclude unset rollout defaults from canonical_request) is a separate PR.
  - id: D-sentry-scrub
    decision: >-
      The field is SENSITIVE and /evaluate is public, so the Sentry facts scrub lands in THIS step (red-team
      HIGH): own_shareholding is in _PII_KEY_SUBSTRINGS with a nested-facts PII_SAMPLES case. Not covered (already
      on main, same as work.annual_foreign_income_usd): a request body Sentry attaches as a raw JSON string rather
      than a parsed dict.
