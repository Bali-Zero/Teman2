mission: >-
  The Visa Oracle engine accepts the fact investment.own_shareholding_idr on /evaluate so the E28A test can be
  re-keyed to the applicant's OWN shareholding in the sponsoring company (step A of the E28A own-shareholding
  chain; the pack rule and the mouth question follow).
objective: >-
  The engine registers FactPath investment.own_shareholding_idr (whole IDR, sensitive; 63 paths = 59 applicant
  plus 4 derived) and accepts it on /evaluate; a body that omits it validates with UnknownFact NOT_ASKED built
  by default_factory, never zero; a supplied KNOWN non-negative integer is honoured and negative, fractional,
  string and boolean values are rejected; the compiler accepts a rule whose required_facts include it;
  contracts, OpenAPI pin and schema.d.ts are regenerated and the count pins moved. No pack rule and no mouth
  question change in this PR; the active seq-30 outcomes do not change.
