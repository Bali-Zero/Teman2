objective: >-
  The prune keeps online discard on the Colima VM's data disk: before its fstrim it reads /proc/mounts in the VM, remounts
  /mnt/lima-colima with discard if the option is off, and journals vm_discard. Measured reason: inside a tick the datadisk's host
  allocation reached 54.0 GiB while the VM used 36.6-40 GiB, and the host's free space fell to 104.0 GiB (100.3 GiB by another
  session's read) against the owner's floor of more than 100 GB.
acceptance:
  - text: A disk mounted without discard SHALL be remounted once with exactly "remount,discard" on /mnt/lima-colima, before the fstrim.
    probe: "test_prune.py::test_b8b_a_disk_mounted_without_discard_is_remounted_once_before_the_trim"
  - text: A disk already mounted with discard SHALL NOT be remounted.
    probe: "test_prune.py::test_b8b_a_disk_already_mounted_with_discard_is_not_remounted"
