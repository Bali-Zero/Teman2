brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-GATE pasted by Zero into a Fable 5.1 window on 2026-10-06 and confirmed by him in the same
  session ("execute all": ground, decision spec, first PR armed, fresh Opus 5.5 gate). Design artifact:
  docs/specs/localci-gate-2026-10-06.md. First step of the chosen shape: scripts/localci/hosted_compare.py.
lanes:
  - lane: localci-gate-design-build
    role: build
    seat: "claude-fable-5-1 (imperator window opened by Zero; ground, spec, comparator, tests, this pack)"
  - lane: localci-gate-redteam
    role: review
    seat: "codex-gpt-6.1-sol (codex-companion 1.0.6, read-only, effort high)"
  - lane: localci-gate-refuter
    role: review
    seat: "agy-gemini-3.1-pro (agy --sandbox --model gemini-3.1-pro-high, prompt-only)"
  - lane: localci-gate-final-gate
    role: review
    seat: "claude-opus-5-5 (fresh session outside the chain; final on-disk gate, published as harness/fable-gate)"
council_run: council-journal.jsonl
seat_override: >-
  Two external families reviewed the candidate (OpenAI Codex and Google Gemini 3.1 Pro), but only one line counts
  for R9: the Codex home's configured default is gpt-6.1-sol and the roster still names codex-gpt-5.6-sol, so the
  Codex line is journalled under its true name and does not qualify. The seat was not renamed to fit the roster.
seat_fallback_reason: >-
  The reserve agy-gemini-3.1-pro stood in because both remaining titular seats were dead at dispatch (arsenal_probe
  2026-10-06T08:03:06Z): kimi TIMEOUT twice, tp1-qwen3.8-max QUOTA_DEAD (HTTP 429, monthly plan quota, reset
  2026-10-11); tp1-glm-5.2 shares that quota.
pii_scan: clean
pii_scan_note: Code, a decision spec and GitHub check metadata only; no client data was read or written.
what_changed: |
  scripts/localci/hosted_compare.py (new): read-only comparator. Reads the live required contexts, the check runs
  and the commit statuses of a local run's candidate sha through bare GETs, and classes every required context as
  AGREE, FALSE_GREEN, FALSE_RED, LOCAL_BLIND or HOSTED_PENDING. The hosted side is order-free and red-dominant and
  honours the pinned app_id; a hosted document for another repo, branch or commit is refused.
  scripts/localci/tests/test_hosted_compare.py (new): guilt and innocence corpus, offline.
  scripts/localci/README.md: one command row and one section for the comparator.
  docs/specs/localci-gate-2026-10-06.md (new): the decision — hosted writes, local predicts, execution may move
  later through a runner; per-context table; operator-only steps; meta-pattern.
proof: |
  See receipts. Nothing in this change posts a status, edits branch protection, registers a runner or touches a
  workflow: the comparator's only GitHub calls are GETs and its corpus asserts that on the live path.
bites:
  consumer: >-
    docs/specs/localci-gate-2026-10-06.md §2 (its agreement line and local column are this tool's output) and the
    Dux of any later local-CI mission at GROUND.
  observation: >-
    Pro, 2026-10-06, live GETs against run dir gate-ground-1006-f42fd16429 (candidate f42fd16429, hosted green):
    one row per live required context, agreement=0/14, local_blind=14, false_green=0, hosted_pending=0, drift none,
    unpinned_source=11/14, exit 0.
ground:
  ts: "2026-10-06T07:26:59Z"
  siblings: >-
    No open PR touched scripts/localci or docs/specs/localci at probe time; nine open PRs touched other workflow
    files and none of this change's paths. Broker leases showed no local-CI lane. Four peer sessions were live on
    M5, none on these paths. Fleet mailbox carried nothing addressed to this lane.
spend:
  adversarial_rounds: 1
  wall_clock_hours: 2
