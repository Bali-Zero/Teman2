dissent:
  - seat: codex-gpt-6.1-sol
    objection: "Hosted verdict by 'latest entry wins': a same-named commit status that failed, a red run from the pinned app beside a newer green from another app, two same-named runs, or non-UTC and missing timestamps all read AGREE with exit 0 (reproduced)."
    status: CONFIRMED
    resolution: "The hosted verdict is now order-free and red-dominant, counts only the pinned app's entries toward green, and compares no timestamp. Corpus rows for each reproduction; four mutants on these rules are killed."
  - seat: codex-gpt-6.1-sol
    objection: "The combined-status read took one page only; a red required status on page two was missed (reproduced). Same point raised by the Gemini seat."
    status: CONFIRMED
    resolution: "Check runs and statuses are both paged to the short page, a failed page or a page cap refuses the comparison. Corpus rows; one mutant killed."
  - seat: codex-gpt-6.1-sol
    objection: "A required set of [{}] produced required=0, agreement=0/0, exit 0; fixtures were not bound to repo, branch or sha, so a document for another commit was reported under this one (both reproduced)."
    status: CONFIRMED
    resolution: "A nameless, duplicate or empty required set is refused; a hosted document must carry the same repo, branch and sha, and a check run of another commit refuses it. Corpus rows; four mutants killed."
  - seat: codex-gpt-6.1-sol
    objection: "The GET-only test checked a helper and some strings; swapping the real call for a POST left it green (reproduced)."
    status: CONFIRMED
    resolution: "The corpus now replaces subprocess.run on the live path and asserts every argv is exactly gh, api, path. The POST mutant is killed."
  - seat: agy-gemini-3.1-pro
    objection: "Exit 0 while required contexts are still HOSTED_PENDING lets an incomplete comparison read as clean."
    status: CONFIRMED
    resolution: "Exit 3 = incomplete. Severity lowered from the seat's BLOCKER: the tool gates nothing."
  - seat: agy-gemini-3.1-pro
    objection: "Attachment is not an impossibility: merge-group refs can be polled; Pen is curable with a dedicated OS user and a pinned GitHub App; shape C was rejected on premises that are curable. Codex adds that a separate CI controller was never weighed and 'the only honest route' overclaims."
    status: CONFIRMED
    resolution: "Spec §1 now states each blocker as true today with its cure and owner; §3 adds shape D (separate controller) and rejects it as dominated by the runner route, not as impossible; 'each sufficient' and 'only honest route' are gone."
  - seat: agy-gemini-3.1-pro
    objection: "Capacity arithmetic: the VM can be resized, so a 6x ratio is wrong. Codex adds that 133 job-hours is hosted workload of whole workflows, not Pro throughput, so Capacity is not an independently proven blocker."
    status: CONFIRMED
    resolution: "Capacity is now 'unproven, not disproven': 5.5 hosted-size jobs on average against 3.5 for the whole machine, a ~1.6x per-job speed needed at full utilisation, the ratio unmeasured, a timed canary named as the settling measurement."
  - seat: codex-gpt-6.1-sol
    objection: "Going private drops free hosted minutes and needs a Code Security entitlement for CodeQL; 'safe to extend to tests.yml' ignores the spec's own Tier R conditions; Tier R gives no independence from a GitHub control-plane outage; sampling merged shas only keeps the survivors and a re-run can erase a hosted red."
    status: CONFIRMED
    resolution: "Spec §5 items 1 and 3, §7 and the Tier L promotion rule (§4.2) rewritten accordingly: rejected candidates required, pairs stored when observed."
  - seat: claude-opus-5-5
    objection: "Final gate on ee2bfcaa4a, PASS with notices: the red-dominance wording overstates the live path (GitHub lists only the latest attempt of each check); the corpus did not pin the 'error' status state as red; the brief named a test that no longer exists; the spec's 369 local tests and 165 ubuntu-latest jobs were not reproduced (252 collected before this change, 166 on this tree); reading classic protection only is an unlisted residual; a hand-forged status.json with an out-of-vocabulary verdict reads LOCAL_BLIND."
    status: CONFIRMED
    resolution: "Cured in the follow-up commit on this branch: wording in the docstring, README and spec §8, an 'error' row in the corpus, the brief's probe name, both numbers, the residual. The forged-status case stays as documented behaviour: a real runner cannot emit it and blind is never green."
owed:
  - Run scripts/localci/tests in a hosted job (spec §4 step 2); until then the comparator's corpus has no hosted consumer.
  - After merge, re-run the comparator on Pro from main and record the output on the PR (prove-live).
  - Operator-only steps of spec §5, first of all pinning app 15368 on the 11 unpinned required contexts.
  - The council roster still names codex-gpt-5.6-sol while the Codex home defaults to gpt-6.1-sol.
