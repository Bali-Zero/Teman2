      WHEN the 4 census parts run live on this head and replay together, THEN all 15 section 8.8 exit lines
      print 0 with 54/54 captures and 51/51 opened surfaces.
    probe:
      python3 scripts/mouth/r19_wrapper_token_census.py --replay scripts/mouth/tests/fixtures/r19_wrapper_census.jsonl
      --diff-base origin/main
  - text: WHEN the W1 live guard runs, THEN palette-outside-direction-a prints 0 on 48/48 captures.
    probe: cd apps/mouth && R19_WRAPPER_LIVE=1 npx vitest run src/test/r19-wrapper.test.ts
  - text:
      WHEN the handoff bar and the canvas are loaded with the real wrapper CSS in Chrome, THEN the bar sits
      below the page content and the canvas is paper; deleting each cure reproduces the overlap and the dark canvas.
    probe: python3 -m pytest scripts/mouth/tests -q -p no:cacheprovider -k 'handoff_bar or canvas_behind'
  - text: WHEN the whole mouth census suite runs, THEN every test passes.
    probe: python3 -m pytest scripts/mouth/tests -q -p no:cacheprovider
consumer_map:
