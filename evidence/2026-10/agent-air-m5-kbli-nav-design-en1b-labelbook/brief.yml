gear_reason: >-
  Set to the floor evidence_pack_lint computes for this change set by its size term, with no hot-zone path. The code
  churns 350 lines (+262/−88, net +174) across LabelBook.swift (new, 156), KBLIVerdict.swift (headsUp only),
