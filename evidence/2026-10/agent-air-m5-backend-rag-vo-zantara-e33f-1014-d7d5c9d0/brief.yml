task_id: zantara-e33f-everywhere-1014
mission: catalogue-decisions-1014
gear: 3
gear_reason: >-
  The diff touches apps/backend-rag/** (hot zone): the pricing service that feeds Zantara on WhatsApp, the team
  pricing tools and the legacy visa recommender, plus a Qdrant sync script that can delete production points
  when an explicit flag is passed. It changes what a client is quoted and what the assistant may cite.
l_level: L2
gate_class: opus
ruling: >-
  Zero, 2026-10-14 (session question, answer 'E33F everywhere'; recorded in memory as a decision), extending
  the catalogue decisions of the same day: the three generic internal Retirement rows leave every client-facing
  path and the E33F rows are proposed instead, at identical prices.
mission_text: >-
  Zantara (WhatsApp) and the team's pricing tools stop citing 'Retirement (Altus/Onshore)', 'Retirement
  (Offshore)' and 'Retirement (Extend)' (catalogue rows marked internal) and propose the E33F Second Home
  Senior rows (Offshore 14.000.000, Altus/Onshore 16.000.000, Extend 10.000.000 IDR, all-inclusive, never a
  fee split). The generic rows stay in the catalogue because old signed packs seq-009..027 resolve
  'Retirement (Offshore)' and the compliance renewal rules use 'Retirement (Extend)'.
objective: >-
  search_service, format_for_llm_context, the no-query client projection get_pricing_for_clients, the legacy
  recommend_visas('retire'), /api/pricing/all and /api/pricing/search never return an internal row, while
  get_service_by_key, get_all_prices and get_pricing stay raw; the Qdrant sync stops upserting internal rows and
  can delete exactly their points only behind an explicit opt-in flag, dry-run by default.
constraints:
  - No row and no key is deleted or renamed and no price changes; the only data edit is a keywords list on the three E33F rows.
  - The internal-row helper exists once (pricing_service.py), reused by the router and the visa oracle service.
  - Nothing is run against production in this PR; the Qdrant purge is a separate authorized run.
appetite:
  wall_clock_hours: 4
acceptance:
  - text: WHEN a client path asks for retirement pricing THEN no internal Retirement row SHALL be returned and the three E33F rows SHALL be.
    probe: apps/backend-rag/backend/tests/services/pricing/test_internal_rows_leave_search_1014.py
  - text: WHEN the raw service is asked for an internal key THEN it SHALL still resolve it (old packs, renewal rules).
    probe: apps/backend-rag/backend/tests/services/pricing/test_pricing_service.py
  - text: WHEN the sync script runs without --purge-internal THEN it SHALL not delete or upsert internal points and SHALL report them.
    probe: tests/scripts/test_sync_pricing_collection_prices_internal_1014.py
