diff:
  behaviour_change: >-
    The instrument opens every context from one place (reduced motion), a drop-shadow reaches
    nothing, a flat scrim's child is counted (a fixed scrim's is not), the walk line names the
    occluded runs behind the walk's own scrim, bring() keeps occludedBy and hides,
    ground-resolver-disagree is INCOMPLETE on a capture not read through, the full job has 75
    minutes, and the exit step lists the declared-not-judgeable line. The fixture is regenerated
    on a quiet machine: G 577, O 18, K 188, M 741, state 51, drift 0 (the 3b-2a fixture read
    G 579, M 784). The movement is the tree, not the cures: the search-dropdown red code chips
    now read at 5.09 or more where the old fixture had 3.3 and 3.26, a 'TERBUKA' chip is 11px
    where it was 10px, and the pages the cures cannot touch moved with them. The K count did not
    move, so no flat-scrim child exists on the tree.
