what_changed: |
  guardrails_static_core.py: _dangerous_rm_command runs in _eval_bash before the legacy patterns and
  can only add blocks. It drops heredoc bodies (data; substitutions inside an unquoted one still run),
  extracts $(...) and backticks outside single quotes, joins backslash-newline, splits shlex tokens on
  ; & | ( ) and newline, strips leading assignments, shell keywords and wrappers (sudo, doas, env incl.
  -S, command, builtin, exec, nohup, time, nice, ionice, stdbuf, caffeinate, watch, timeout, flock,
  chroot, xargs), recurses into bash/sh/zsh/dash/ksh/fish/su -c and eval, and blocks a recursive rm
  (any r/R short cluster, --recursive or a prefix of it) whose target, after one level of brace
  expansion and normpath, is /, /*, /Users, /Users/<x>, home (~, $HOME, ${HOME...}) or their /*.
  If shlex refuses the line, the raw words are judged the same way (protected target only).
  test_guardrails_overmatch.py: 52 GUILT rows (all ALLOW on origin/main) and 23 INNOCENCE/KEPT rows.
  The seat's own test file (scripts/test_guardrails_rm_protected.py) is NOT shipped: pytest-only and
  run by no workflow; its rows live in the CI-run file (hook-innocence-gate.yml step "Existing hook
  regression tests", registry surface guardrails_static).
  Dux changes to the seat diff: (1) newline was whitespace for shlex, so `ls` + newline + rm was
  never split: whitespace is now " \t\r"; (2) the seat blocked EVERY rm segment when shlex failed:
  13 real-history commands (heredocs with apostrophes) flipped to BLOCK, now judged by target; (3) the
  seat protected the whole home subtree for every spelling: rm -r -f /Users/<x>/repo/.worktrees/<y>
  flipped to BLOCK, now only home itself and its ancestors; (4) wrappers, keywords, assignments,
  substitutions in double quotes, backticks, other shells, -lc, eval, heredocs, continuation, braces.
