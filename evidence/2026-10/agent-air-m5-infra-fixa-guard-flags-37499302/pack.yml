dissent:
  - seat: tp1-qwen3.7-plus
    objection: |-
      (1) Bypasses - `env -S "-i rm -rf /"`: `_unwrap_command` sees `env` in `_WRAPPERS`. It pops `-S` (which is in `_WRAPPERS["env"]`) and then unconditionally pops the next token as the argument to `-S`. `remaining` becomes empty. In a real shell, GNU `env -S` splits the string and executes `rm -rf /`.
    status: CONFIRMED
    disposition: >-
      Reproduced (row X56 ALLOW on 8c738d764c). Cured in c3c6d35494: env -S (separate or attached)
      re-enters the wrapper stripping with its split argument; GUILT row added to the CI-run table.
  - seat: tp1-qwen3.7-plus
    objection: |-
      (2) Over-matches - `rm -rf /Users/Shared/` and `rm -rf /Users/Shared/*`: the legacy regex only targeted `/Users/<name>`, so this was allowed; the new code blocks it.
    status: RETRACTED
    disposition: >-
      Retracted on evidence (refuted by the Dux, not withdrawn by the seat): origin/main already blocks it: legacy rule 3 matches /Users/[\w.-]+ followed by /, and the live
      hook blocked a Bash call of this session carrying that string. KEPT row added (verdict unchanged).
  - seat: final gate gate-7930 (Claude, 2026-10-05T12:36Z, verdict BLOCK)
    objection: |-
      B1 (robustness, attack 3): head is O(n^2) in `_shell_views` (growing `carry` on backslash-newline joins) + super-linear on big single tokens. backslash-cont n=1000 827ms, n=2000 10s, n=4000 15s+ (base n=10000 18ms); token 300KB 9.5s, 1MB HANG (base 1.5s). C1/C2: the out-of-reach list omits stdin-fed shells and busybox/multiplexers.
    status: CONFIRMED
    disposition: >-
      Cured in cure round 2 (what_changed): list joins, linear brace search, depth bound 8, a 64 KiB cap with a
      fail-closed linear scan above it; red-first tests in scripts/test_guardrails_overmatch.py. C1/C2 added to the
      PR body's out-of-reach list.
