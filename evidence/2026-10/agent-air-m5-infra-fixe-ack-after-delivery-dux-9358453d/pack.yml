  - seat: tp1-qwen3.8-max
    objection: "D2: a gateway crash between publish and SADD republishes the event once on the next boot drain."
    status: PLAUSIBLE
    disposition: "Accepted by design: at most one duplicate downstream instead of a lost event (task contract)."
  - seat: tp1-qwen3.8-max
    objection: "D3: a rejected alert dead-letters all its items together, innocent ones included."
    status: PLAUSIBLE
    disposition: "Accepted: the failure is per message (gateway missing/timeout/unparseable), not per item; each dead-letter line keeps the public url for a re-send."
  - seat: tp1-qwen3.8-max
    objection: "D4: an item past the bound whose seen-mark keeps failing is re-marked every run with no specific log line."
    status: PLAUSIBLE
    disposition: "Accepted: such a run already ends status=error (paged by run_job) and redis_mark_error is logged on exceptions."
  - seat: tp1-qwen3.8-max
    objection: "D5: the state file is replaced without fsync; a power loss can reset attempt counters."
    status: PLAUSIBLE
    disposition: "Accepted: a reset counter restarts the bound once; it never loses or duplicates an item beyond the bound."
