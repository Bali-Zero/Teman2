    The scrim exemption is a hit-test fact, as the SPEC states it: an occlusion by the walk's scrim, or by a
    descendant of it, is exempt only when the scrim itself is in elementsFromPoint above the run's own layer at
    that point (at the overlay's nearest point on the reach path). No style of the scrim or of any ancestor is
    read, so the opacity leak of #8579 and the position leak of #8560 cannot return, and no trigger list exists.
    A scrim absent from the stack or under the run never exempts. Everything else of #8579 is carried. No verdict
    line moves on the tree (every scrim has 0 descendants): G 577, O 18, K 188, M 741, state 51, drift 0.
