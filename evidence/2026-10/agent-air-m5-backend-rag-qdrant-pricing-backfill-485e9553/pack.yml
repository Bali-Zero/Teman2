decisions:
  - id: D-name-is-display-name
    text: >-
      The new points carry the row's display name (row["name"]), not the JSON key that
      prepare_payloads.py used, because the sync matches on the display name; otherwise the
      22 rows whose key differs would stay "without point" forever.
  - id: D-price-shape
    text: >-
      The payload price is expected_price(row) and the text's Price line carries that exact
      string once, so a later price sync can update the point; a create whose price would
      occur 0 or 2+ times is refused.
  - id: D-contact-from-catalog
    text: >-
      The contact trailer comes from the catalog's metadata.contact (Ari's line), not from the
      live points, which still carry the bot's inbound number +62 821 3465 159 (canonical only
      2026-08-31..09-01). Patching those 67 trailers is an UPDATE and is left to Zero's go.
