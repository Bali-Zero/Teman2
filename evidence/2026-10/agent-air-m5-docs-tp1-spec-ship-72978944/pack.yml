what_changed: |
  - docs/specs/tp1-input-screen.md: the spec. Threat model; decision order; literal/placeholder
    semantics; named-assignment tiers P/S/K with value placement (same line, next line, block
    scalar) and annotations; credential-bearing CLI/HTTP/URL contexts; bounded families; decoded
    views (URL, unicode/hex escapes, HTML, base64 joined across 64/76-column wraps, two layers);
    phones on group-aligned digit windows with date/amount/sign exemptions; e-mail allowlist of exact
    role locals on own domains, one exact vendor no-reply address and RFC-reserved names; national IDs
    and CRM names; structural refusals; O(n) bound, summary schema with the builder's keys; six
    declared limits; measurable acceptance.
  - scripts/tp1max/screen_corpus.yaml: 274 rows, 196 guilt / 78 innocence (Codex draft 185 = 131/54);
    after cure round 1 (gate-7988) 307 rows, 223 guilt / 84 innocence.
  - cure round 1 (gate-7988 B1/B2): Codex O2 built the spec/corpus cure (seat_build.sh, 01:29-01:47Z,
    2026-10-07); the Claude verifier re-ran the gate's 36 shapes on the cured text, corrected 8 defects
    of the cure (9-digit passports, the real Tailscale shape, a Tier K regression on hex and 20-31
    character keys, bypass/compass, registry auth slots, the B2 wording, bundled guilt rows, PGP
    armor) and added g7988_20-27 and g7988_innocent_04-06. 33 rows carry source gate-7988.
  - scripts/tp1max/test_screen_corpus.py: schema, reconstruction, claimed shapes, base64 round trip,
    setup coherence, source counts, limits = spec list, summary keys = reason enum, raw-literal scan.
  - .github/workflows/tp1-runner-tests.yml: the corpus test as a step of the existing TP1 workflow
    (py3.9 + 3.11), with the corpus, the test and the spec added to its paths.
proof: |
  Deterministic floor 3, source path, measured with --print-floor / --print-floor-source.
  Coverage: gate-7927 B1 31 rows, gate-7971 B1 16, gate-7971-r2 B1-r2 12, N1 6, YAML next line 1
  (machine-counted by the test); 78 innocence rows, 73 outside the structural category (69 also
  excluding the 4 cost rows). After cure round 1: gate-7988 33 rows (27 guilt, 1 a declared limit;
  6 innocence), 84 innocence rows, 79 outside structural, 75 also excluding cost.
  Test: 463 passed on 3.11 and on 3.9.6. Mutations on scratch copies: 18 of 19 corpus/spec mutants
  red, the survivor is equivalent (standard and urlsafe base64 coincide for that payload); a
  materialiser mutant (drop the last encoded byte) turns 10 tests red.
