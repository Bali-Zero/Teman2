pii_scan: clean
pii_scan_note: >-
  Docs, invented data and a schema test only. Every credential-, DSN-, phone- and e-mail-shaped
  value in scripts/tp1max/screen_corpus.yaml is assembled by its construct (concatenation, repeat,
  base64) and never appears whole on one line; the corpus test scans the raw file for those shapes
  and finds none. Domains are invented (client.corp, *.invalid, RFC 2606 names) or the project's own;
  locals on own domains are synthetic. US/UK/AU numbers use the reserved fictional ranges.
  detect-secrets v1.5.0 (pre-commit hook form) and the repo's DSN, Telegram and Google OAuth lints
  report 0 findings on every changed file, this journal included. No provider call was made.
