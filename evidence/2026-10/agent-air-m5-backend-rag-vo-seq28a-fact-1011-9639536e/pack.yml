decisions:
  - id: D-rollout-default
    decision: >-
      The new key is optional on the wire with an UnknownFact(NOT_ASKED) default built by default_factory,
      never zero, because the request model rejects unknown keys and the deployed mouth does not send it yet;
      step B closes the seam, step C adds the rule.
  - id: D-overlap
    decision: >-
      Open PR 7897 (fact-count-derive) really conflicts with this change (git merge-tree conflict, 7 files
      overlap incl. both contract schemas, enums.py, schema.d.ts) and needs a rebase. PR 7941 (gold-coverage-7)
      has zero file overlap and merges with this head cleanly: no rebase needed.
  - id: D-idempotency-409
    decision: >-
      Accepted limit, named in the PR risks: the defaulted key enters the idempotency HMAC, so a visitor who
      evaluated before the deploy and reloads within the 2 h client identity TTL gets HTTP 409 (guard page)
      once. Same class as every rollout default since 3732. Structural fix (exclude unset rollout defaults from
      canonical_request) is a separate PR.
