  tp1-deepseek-v4-pro sat in sealed round 1 (10:58Z) in place of kimi-code/k3: the imperator's
  addendum-3 (read 10:15Z) recorded Kimi's 5-hour window exhausted with HTTP 403 from ~08:00Z, and
  addendum-4 records it answering again only from ~11:10Z. codex-gpt-5.6-sol is not claimed: the Codex
  door used (scripts/with_seat.sh with CODEX_HOME) ran the default home with model gpt-6-astra, so those
  rows are journaled as codex-default-home. Kimi K3 sat later, post-build, as the diff refuter.
council_timing: >-
  Rounds 1-2 on the rule (10:58Z, 11:06Z) ran BEFORE the first build commit (486fbbea19, 11:20Z). The
  diff reviews (11:30Z, 11:40Z) and the Kimi K3 refutations (12:06Z, and the pass on 7c881b79b7) are
  post-build by construction: they judge built diffs. So are the final gate (BLOCK, 2026-10-06T01:54Z)
  and the codex-o2 review of the cure delta (PASS, 2026-10-06T02:01Z).
what_changed: |
  wr2-ig-metrics-analyst-run.sh: claude_stderr_retryable / claude_stdout_retryable /
  claude_retryable_files are replaced by one claude_failure_class(stdout, stderr, rc) that prints
  timeout | subscription_disabled | session_limit | quota_or_auth | empty_output, or nothing.
  Rule taken from claude-cascade.sh:174-239 (read, not edited): stderr is authoritative; stdout is a
  notice only when the WHOLE payload is one (bare, CLI banner with its hint, "Error:"-framed) or a
  JSON error envelope, and a stdout carrying a file path (the analyst's answer ends with its amendment
  path) is never a notice. Heads: "organization has disabled Claude subscription access" and the
  session-limit family over every "You've hit your ..." notice the installed CLI builds (session, weekly,
  usage, Opus, Sonnet, Fable, usage credit, fast, monthly, monthly spend limits, the team's shared
  budget), plus "reached", "out of extra usage" and "out of usage credits". A path counts plain,
  quoted or backticked. After the head: punctuation then the
  rest of THAT line, or a hint verb, then at most one hint line. JSON envelopes are searched on decoded
  string values. run_claude_account keeps its exit in a local; only the account loop writes
  CLAUDE_EXIT, so the keychain fallback is reachable again and every seat failing ends exit 1 with
  "all Claude OAuth accounts unavailable (last failure: <class>)" and the alert; a CLI exiting 98 on
  its own is an unclassified failure, never the loop's next-account signal. Unchanged: slot order,
  RETIRED_TOKEN_VARS (#7898), timeouts, model, and an unclassified non-zero exit still stops the loop.
  .github/workflows/immune-enforcement.yml (cure round): the antidotes job's "wr2-ig-metrics-analyst
  wrapper corpus" step runs the test module, and the module is a sentinel path of that job, so a revert
  of any of the three cures turns a required check red (the shell corpus and test_claude_cascade_shell.py
  are green on the defective base).
