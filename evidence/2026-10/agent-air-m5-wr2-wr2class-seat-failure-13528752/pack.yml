  - "Class audit: scripts/ai-dispatch.sh and infra/launchagents/wrappers/cron-agent.sh carry the same claude_stderr_retryable/claude_stdout_retryable family (ai-dispatch.sh:407-474) and are not cured here."
  - "claude-cascade.sh's stdout rule has no disabled-subscription head either; it moves on for any non-zero exit, so only an exit-0 stdout notice is exposed there (owned by dux-cascadeobs today, not edited)."
