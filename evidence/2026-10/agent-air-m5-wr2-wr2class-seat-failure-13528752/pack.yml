    objection: "BLOCK: two-line real answers that open with a newly named limit and end with a backticked path the guard does not read as a path (relative 'research/.../2026-10-05-ig.md', '.claude/skills/.../ig-insights.md', or one with a space) are classified session_limit; and 'You've hit your monthly limit\\nSwitch to another model to continue.' / 'You've hit your fast limit\\n/model to switch models.' are unclassified (pre-existing)."
