plan_ref: >-
  Branch agent/air-m5/wr2/wr2class-seat-failure from origin/main beb6991b30 (after #7898): red tests
  with a fake claude binary for the three seat-loop defects of wr2-ig-metrics-analyst-run.sh, a
  three-family council on the classification rule before the build, then one classifier
  (claude_failure_class) and a local attempt exit. Mission WR2CLASS-20261005. The first Dux
  (dux-wr2class) died at the 12:00Z window jump with four local commits never pushed; its successor
  (dux-wr2class2) rebased them onto origin/main 5ec3d63463 at 12:21Z (none of the three new main
  commits touches these files), disposed the post-build Kimi K3 refutation, added one cure commit and
  shipped. Rebase map: 486fbbea19 -> 64db389f04, 545fd985e7 -> b70b8f49c5, 22f957ed30 -> a3f6134473,
  f22ee522cb -> a39574409d; cure 5dad03b98f (its first, unpushed version 7c881b79b7 was amended after Kimi K3's second pass).
  Cure round 2026-10-06 (dux-wr2class3) after the final gate's BLOCK: one commit wires the test module
  into the required antidotes job; no wrapper or test byte changes.
