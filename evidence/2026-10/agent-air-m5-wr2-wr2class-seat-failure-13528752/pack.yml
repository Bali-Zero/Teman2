dissent:
  - seat: codex-o2 (diff review)
    claim: "BLOCK on 486fbbea19: (1) 'You have hit your session limit\\nPlease try again later.' accepted as an answer; (2) 'You have hit your session limit: this hook earned 2x saves.\\nretry-amendment.md' read as a notice; (3) LAST_FAILURE_CLASS stale when the cascade deadline has already expired."
    status: CONFIRMED
    reason: "Cured in 545fd985e7: a hint may start with 'Please'; a hint verb must be followed by a space or sentence-final punctuation; the deadline refusal records class timeout. (1) and (2) are fixtures now."
  - seat: tp1-qwen3.8-max
    claim: "An unclassified non-zero exit should MOVE ON (as claude-cascade.sh does): stopping on an unknown phrasing recreates defect 1 for the next wording."
    status: OVERRULED
    reason: "codex-o2, codex-o3 and tp1-deepseek-v4-pro hold STOP: the agent writes files, a deterministic failure repeats on every seat at up to $10 each, and the mandate keeps behaviour beyond the failure classes unchanged. Every known seat-failure wording is now a class; a new wording is a one-line head."
  - seat: codex-o3 / tp1-qwen3.8-max (round 2)
    claim: "Synthesized rule FALSIFIED: a newline before punctuation swallowed a path line ('Rate limit\\n/tmp/a.md'); 'Quota exhausted\\nretry.md' and 'quota exhausted.md' read as notices; two-line notices with a period before the hint line were missed; the JSON dump hid a notice behind an escaped newline."
    status: CONFIRMED
    reason: "Each case is now a fixture in test_every_notice_shape_is_classified / test_no_real_answer_is_classified_as_a_seat_failure and passes: same-line separator only ([ \\t]*), '.' or '/' glued to a word is a file name, at most one hint line, hint verbs refuse a following '.word', envelopes searched on decoded strings."
  - seat: codex-o2 / codex-o3 / tp1-deepseek-v4-pro
    claim: "stderr substring authority can discard a valid answer when stderr carries a warning or logged content."
    status: ACCEPTED-TRADEOFF
    reason: "Kept for parity with claude-cascade.sh and the mandate (a notice is rejected on stderr, exit 0 or not). claude -p writes only CLI diagnostics to stderr; the cost of a false positive is one more seat, the cost of a false negative is a quota notice passed as the answer."
residuals:
