  - lane: wr2class-build
    role: build
    seat: "claude-opus-5.5 (Dux dux-wr2class; tests first, then the wrapper)"
  - lane: wr2class-council-codex-o2
    role: review
    seat: "codex-o2 (sealed round 1 on the rule; VERDICT AMEND)"
  - lane: wr2class-council-qwen
