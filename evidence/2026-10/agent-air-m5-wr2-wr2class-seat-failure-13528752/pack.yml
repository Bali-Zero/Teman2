pii_scan: clean
plan_ref: >-
  Branch agent/air-m5/wr2/wr2class-seat-failure from origin/main beb6991b30 (after #7898): red tests
  with a fake claude binary for the three seat-loop defects of wr2-ig-metrics-analyst-run.sh, a
  three-family council on the classification rule before the build, then one classifier
  (claude_failure_class) and a local attempt exit. Mission WR2CLASS-20261005.
