    objection: "An unclassified non-zero exit should MOVE ON (as claude-cascade.sh does): stopping on an unknown phrasing recreates defect 1 for the next wording."
    status: PLAUSIBLE
    reason: 'Overruled: codex (default home, rounds 1-2) and tp1-deepseek-v4-pro hold STOP: the agent writes files, a deterministic failure repeats on every seat at up to $10 each, and the mandate keeps behaviour beyond the failure classes unchanged. Every limit and subscription notice the installed CLI builds ("You''ve hit your ...", the disabled-subscription constant, out of extra usage / usage credits) is now a class; a new wording is a one-line head.'
  - seat: codex-default-home / tp1-qwen3.8-max (round 2)
    objection: "Synthesized rule FALSIFIED: a newline before punctuation swallowed a path line ('Rate limit\\n/tmp/a.md'); 'Quota exhausted\\nretry.md' and 'quota exhausted.md' read as notices; two-line notices with a period before the hint line were missed; the JSON dump hid a notice behind an escaped newline."
    status: CONFIRMED
    reason: "Each case is a fixture in test_every_notice_shape_is_classified / test_no_real_answer_is_classified_as_a_seat_failure and passes: same-line separator only ([ \\t]*), '.' or '/' glued to a word is a file name, at most one hint line, hint verbs refuse a following '.word', envelopes searched on decoded strings."
  - seat: codex-default-home / tp1-deepseek-v4-pro
    objection: "stderr substring authority can discard a valid answer when stderr carries a warning or logged content."
    status: PLAUSIBLE
    reason: "Accepted trade-off: kept for parity with claude-cascade.sh and the mandate (a notice is rejected on stderr, exit 0 or not). claude -p writes only CLI diagnostics to stderr; the cost of a false positive is one more seat, the cost of a false negative is a quota notice passed as the answer."
