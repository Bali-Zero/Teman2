  - lane: wr2class-diff-review
    role: review
    seat: "codex-o2 (independent review of the built diff, family != builder)"
council_run: journal.jsonl
what_changed: |
  wr2-ig-metrics-analyst-run.sh: claude_stderr_retryable / claude_stdout_retryable /
  claude_retryable_files are replaced by one claude_failure_class(stdout, stderr, rc) that prints
  timeout | subscription_disabled | session_limit | quota_or_auth | empty_output, or nothing.
  Rule taken from claude-cascade.sh:174-239 (read, not edited): stderr is authoritative; stdout is a
  notice only when the WHOLE payload is one (bare, CLI banner with its hint, "Error:"-framed) or a
  JSON error envelope. New heads: "organization has disabled Claude subscription access" and the
  session-limit family (cascade's CLI_USAGE_BANNER head, plus "reached", "out of extra usage").
  The old stdout matcher's free 240-character tail (which crossed lines and swallowed real answers
  such as "Rate limit mitigation: ...\n/tmp/a.md") is replaced by: punctuation then the rest of
  THAT line, or a hint verb, then at most one hint line. JSON envelopes are searched on decoded
  string values. run_claude_account keeps its exit in a local; only the account loop writes
  CLAUDE_EXIT, so the keychain fallback is reachable again and every seat failing ends exit 1 with
  "all Claude OAuth accounts unavailable (last failure: <class>)" and the alert. Unchanged: slot
  order, RETIRED_TOKEN_VARS (#7898), timeouts, model, and an unclassified non-zero exit still stops
  the loop.
