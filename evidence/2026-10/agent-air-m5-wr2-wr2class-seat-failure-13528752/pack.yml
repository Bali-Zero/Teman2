dissent:
  - seat: codex-default-home (diff review)
    objection: "BLOCK on 486fbbea19: (1) 'You have hit your session limit\\nPlease try again later.' accepted as an answer; (2) 'You have hit your session limit: this hook earned 2x saves.\\nretry-amendment.md' read as a notice; (3) LAST_FAILURE_CLASS stale when the cascade deadline has already expired."
    status: CONFIRMED
    reason: "Cured in 545fd985e7: a hint may start with 'Please'; a hint verb must be followed by a space or sentence-final punctuation; the deadline refusal records class timeout. (1) and (2) are fixtures now; (3) has no test (it only changes the alert text) — stated, not hidden."
  - seat: codex-default-home (diff re-review)
    objection: "BLOCK on 545fd985e7: 'You have hit your session limit: ...\\nPlease retry this hook next week; amendment saved to /tmp/ig/amendment.md.' and '...\\nLogin conversion increased 25%; saved /tmp/ig/amendment.md.' classified session_limit; 'You have hit your session limit\\nRetry—after 60 seconds.' and '...\\nResets… at 11:20pm' accepted as answers."
    status: CONFIRMED
    reason: "Cured in f22ee522cb: a stdout carrying a file path is never a notice; bare 'login' is no longer a hint; dash and ellipsis follow a hint verb. All four payloads are fixtures."
  - seat: kimi-code/k3 (post-build refutation, F1)
    objection: "'Claude usage limit reached. Your limit will reset at 8pm.' (and 'Claude AI usage limit reached|1759708800') on stdout, rc 1, is unclassified, so the loop stops instead of moving on."
    status: CONFIRMED
    reason: "Partly: those exact strings are not in the installed CLI (2.1.289): NONE in its strings, and base beb6991b30 did not classify them either; with rc 1 the run stops with exit 1 and the alert, never passes them as an answer. The CLASS is real, though: the CLI's own template 'You've hit your Sonnet limit · resets ...' (the cap this Sonnet analyst meets) was unclassified on stdout and stderr. Red first, cured in 5dad03b98f."
  - seat: kimi-code/k3 (post-build refutation, F2)
    objection: "The file-path guard unclassifies a stdout notice that mentions a path: 'You've hit your weekly limit. Logs in /Users/x/.claude/usage.json', 'Error: rate limit exceeded — see /var/log/claude/retry.log for details' (rc 1)."
    status: PLAUSIBLE
    reason: "Accepted trade-off, not cured: neither the CLI's limit builder o_() nor its subscription notice carries a path (strings receipt). The guard is the cure of the re-review's false positives on real answers ending with the amendment path. On rc != 0 such a payload ends the run with exit 1 and the alert (fail closed); base classified F2b but not F2a."
  - seat: kimi-code/k3 (post-build refutation, F3)
    objection: "A real answer on stdout (rc 0) with a transient stderr warning 'stream warning: rate limit hit, retried OK' is classified quota_or_auth and discarded."
    status: PLAUSIBLE
    reason: "Accepted trade-off, not cured: base-identical (base claude_retryable_files: retryable on the same payload) and the claude-cascade.sh rule the mandate names: stderr is authoritative. Cost of the false positive: one more seat; cost of the false negative: a quota notice passed as the answer. Already raised by the council (row below)."
  - seat: kimi-code/k3 (post-build refutation, T13)
    objection: "Notice + hint + a third line ('You've hit your weekly limit\\nResets at 3am\\nSee https://status.anthropic.com for details', rc 1) is unclassified and stops the loop."
    status: PLAUSIBLE
    reason: "Not acted on: the CLI's notice builders emit one line (o_() and the subscription constant); base did not classify this payload either (dispose receipt); rc 1 ends the run with exit 1 and the alert."
  - seat: kimi-code/k3 (post-build refutation pass 2, finding 1)
