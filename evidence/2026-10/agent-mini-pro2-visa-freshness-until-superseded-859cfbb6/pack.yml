decisions:
  - id: D-exemption-needs-kind
    decision: >-
      The organ's no-boundary exemption is positive, not residual: it requires at least one OFFICIAL_PORTAL record
      and freshness_policy.kind == UNTIL_SUPERSEDED (exact, dict) with verified_at on every one; absence of a
      time-bound policy is not evidence of a non-expiring one.
  - id: D-closed-union
    decision: >-
      A second class under a discriminated union instead of making max_age_seconds optional: a MAX_AGE policy
      without a window stays a validation error, and UNTIL_SUPERSEDED with a window is rejected (extra=forbid).
  - id: D-applicability-not-bypassed
    decision: >-
      The evaluator branch only answers freshness. status, legal_period, recorded_period and authority are
      judged by _source_applicability_status and the primary-source gate, which new tests pin (REVOKED, non
      primary, expired legal period still abstain under UNTIL_SUPERSEDED).
  - id: D-future-verified-first
    decision: >-
      verified_at in the future still returns UNKNOWN before the policy is read, in the engine and in the
      sentinel; a non-expiring source is not exempt from a clock that cannot be true.
dissent:
  - seat: "self-review (implementer)"
    objection: "An older engine that receives a pack carrying the new kind rejects the pack at schema validation, so the whole Oracle would abstain, not just the source."
    status: CONFIRMED
    disposition: "Not cured in code, by design: the closed vocabulary is what makes a typo fail loud. Ordering constraint instead: this engine must be live (build_sha ancestry) before any pack with the kind is signed-and-activated, stated in the PR body."
