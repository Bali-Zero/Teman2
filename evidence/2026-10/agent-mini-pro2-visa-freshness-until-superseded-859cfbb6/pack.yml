ruling: >-
  Owner ruling 2026-10-12 (Zero): the Visa Oracle pack must not expire or degrade on a date; internal staleness
  reporting stays but must not change what clients see. This PR is the engine half only: it adds the closed kind
  UNTIL_SUPERSEDED. No pack file changes here and no pack carries the kind; switching the pack's policies is a
  later PR and signing ceremony, and it must follow the engine deploy.
mission: >-
  The engine can evaluate a source as CURRENT until it is superseded, with applicability (status, legal period,
  recorded period, authority) still judged separately, so a later pack can stop time from silencing the card.
