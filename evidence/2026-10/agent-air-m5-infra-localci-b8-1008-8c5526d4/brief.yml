task_id: localci-b8-1008
mission: LOCALCI-SOVEREIGN (phase B, step B8)
colour: BLUE
gear: 2
gear_reason: >-
  evidence_pack_lint's floor for this change set is 2 by its size term alone (churn 660 with this pack, 500 without it,
  over the 400-line target once the amendment landed), no hot-zone path. The change is the merger's own prune, its tests and mutants, a README section
  and the spec paragraph it amends; no workflow, credential, wrapper or plist changes, so the deploy is the mirror's next fetch.
l_level: L2
gate_class: opus
objective: >-
  From the lead's rule B8 of 2026-10-08, after the Colima VM filled at about 15:27Z, and its amendment after 17:26Z (a
  4.4 GB pass refilled by the next tick): beyond the two slots of a recipe an image stays only when the lease run names it
  (no clock grace); slot 2 goes to the image the most plans of the last 48 h name; under a VM free floor of 15 GB images go
  fewest references first, ties to the oldest, the newest of a recipe included, only the never-list and the lease run's
  images untouchable; the build cache is pruned with -af to a 4 GB budget after the cap and after each floor removal; the
  per-tree deps recipe is written as the open question B9, not built.
constraints:
  - localci_merger_tick.sh is unchanged.
  - The never-list (localci-candidate:*, localci-deps-base:*, the BASE matrix's service stand-ins) is never removed, under the floor too.
  - Under the floor only the never-list and what the run in progress names are untouchable; above it the newest of a recipe is never removed.
  - A dry run, an unreadable input or an unmeasured VM never triggers a floor removal.
  - No .github/ file, no push, nothing on Pro.
acceptance:
  - text: WHEN three images of one recipe are all named under 1 h ago and no run in progress names the third, the third SHALL be removed (no clock grace).
    probe: "test_prune.py::test_b8_a_third_image_named_under_an_hour_ago_goes_when_no_run_in_progress_names_it"
  - text: WHEN the run in progress names the third image, it SHALL be kept.
    probe: "test_prune.py::test_b8_the_run_in_progress_keeps_the_third_image_it_names"
  - text: Slot 2 SHALL go to the image named by three plans over a younger one a single plan names, and a tie SHALL go to the youngest reference.
    probe: "test_prune.py::test_b8_slot_2_goes_to_the_image_three_plans_name_over_a_younger_one_a_single_plan_names, test_prune.py::test_b8_a_tie_in_plans_gives_slot_2_to_the_youngest_reference"
  - text: 'WHEN the VM has 5 GB free and three recipes each hold a newest and a slot-2 image, the image with 1 reference SHALL go before the one with 4 even if newer, ties to the oldest, each rule "vm floor: VM free X GB < 15 GB after the cap; N plan(s) of the last 48 h name it, built H h ago", the builder pruned after each, the last call after the last removal.'
    probe: "test_prune.py::test_b8_under_the_vm_floor_the_fewest_references_go_first_even_the_newest_of_a_recipe"
  - text: Under the floor, images named by equally many plans SHALL go oldest first, an undated one last.
    probe: "test_prune.py::test_b8_equal_references_under_the_floor_evict_the_oldest_first_and_an_undated_image_last"
  - text: Above the floor the newest of a recipe SHALL never be removed, even named by no plan; at the floor nothing goes; the floor stops once met.
    probe: "test_prune.py::test_b8_above_the_floor_the_newest_of_a_recipe_is_never_removed_even_named_by_no_plan, test_prune.py::test_b8_the_floor_stops_once_met_and_a_vm_at_the_floor_keeps_every_image"
  - text: Under the floor, the never-list and what the lease run names SHALL be untouched.
    probe: "test_prune.py::test_b8_the_floor_never_touches_the_never_list_or_what_the_lease_run_names"
  - text: The build cache SHALL be pruned with -af --keep-storage 4GB, never by age; builder_prune SHALL carry the last call's rc, keep_storage_gb and tail, and the number of calls.
    probe: "test_prune.py::test_b8_the_build_cache_is_pruned_to_a_budget_not_by_age, test_prune.py::test_b8_the_line_carries_the_last_builder_prune_and_how_many_ran"
  - text: A cap removal docker refuses SHALL be journaled as an error and SHALL NOT stop the floor from acting on the other images.
    probe: "test_prune.py::test_b8_a_refused_cap_removal_is_journalled_and_the_floor_still_acts_on_the_others"
  - text: An image named by its tag in one plan and by its id in another SHALL count two plans; one plan naming both SHALL count one.
    probe: "test_prune.py::test_b8_an_image_named_by_tag_in_one_plan_and_by_id_in_another_counts_two_plans_and_one_plan_naming_both_counts_one"
assumptions:
  - text: The VM probe still measures a full VM (it reads 0.0 rather than failing).
    status: unverified
    note: The lead's prune lines on Pro read vm_free_gb 0.0 while the VM was full, so the probe ran; if it fails instead, the floor journals skipped (unmeasured) and acts on nothing.
    probe: phase D — the first prune lines on Pro carrying vm_floor.
consumer_map:
  - scripts/localci/merger.py prune, run by the launchd tick on Pro after every tick — the image removals, the builder prune and the {"kind":"prune"} line in decisions.jsonl.
appetite:
  wall_clock_hours: 1.0
  adversarial_rounds: 0
