what_changed: |
  scripts/localci/prune.py (fd26ed6bfb, then 60c347e01f for the amendment): plan_refs also returns, per tag and image id,
  how many distinct plans of the last 48 h name it. image_decisions: slot 1 is the newest's; slot 2 goes to the named image
  with the most plans (ties: the youngest reference, then the newest image); beyond the slots only the run in progress keeps
  an image (IN_FLIGHT_GRACE_H and its branch removed); each decision carries its slot, its references and whether the run in
  progress names it. prune(): after the cap, `docker builder prune -af --keep-storage <BUILDER_CACHE_GB>GB` (4, env
  LOCALCI_BUILDER_CACHE_GB) and the run trim; then, while vm_free_gb.after < VM_MIN_FREE_GB (15, env LOCALCI_VM_MIN_FREE_GB),
  images go fewest references first, ties to the oldest, the newest of a recipe included, never the never-list or what the
  run in progress names, each followed by another builder prune and a fresh VM measurement, rule "vm floor: VM free X GB
  < 15 GB after the cap; N plan(s) of the last 48 h name it, built H h ago"; the line carries vm_floor {floor_gb, removed, met} or skipped (dry run, unreadable
  input, unmeasured VM) and builder_prune {keep_storage_gb, cache_gb {before, after} from `docker system df`, runs, and rc and
  tail of the last call}. An env value that is not a finite number >= 0 reads as the default. Spec: item 1 of the B6
  paragraph (slot 2, the lease, the builder sentence with -a) amended with the measurements, the VM floor as an addendum, the
  measured arithmetic (one image per recipe plus scratch fits a 60 GiB VM; the floor is the rule that holds), B9 as an open
  question. README rows and the example line. Tests: the B8 guilt and innocence set, the lead's three-recipe floor case,
  floor boundaries (14.5, 15.0, 15.5), the cache size parser, the last builder rc both ways, a tie case, env overrides; the fake docker
  frees an image's size on removal and answers `system df`. Mutants: b6-grace-4 and b6-grace-8 retired; b6-cap-off,
  b6-second-kept-unnamed and b6-rm-forced re-aimed; b6-cap-counts-tags replaced by b6-twin-tag-untagged; b8-* rules for every
  constant and rule (b8-floor-takes-slot-1 retired by the amendment, the floor's order, the suspended newest protection, the
  lease, -a, the per-removal builder prune and the cache size added). 25a71fd3bf re-aimed b6-rm-forced after the first full
  sweep found it STALE once the floor added its own `image rm`. b9c2b9db00 aligns with the lead's binding text of 18:35Z:
  the floor's rule reads "vm floor: VM free X GB < 15 GB after the cap; N plan(s) of the last 48 h name it, built H h ago"
  ("undated" without a readable Created), builder_prune's rc and tail are the last call's with `runs` the count, the spec
  carries the lead's sentence and the 17:23Z/17:27Z builder measurements; a tie test and the last-rc test both ways;
  b8-cache-first-failure-lost replaced by b8-cache-first-rc-kept, b8-floor-undated-first added. 6742f743ac is the fix round
  after the lead's gate at 470fdba320 (CONFIRMED, one MEDIUM, three LOWs): the floor is gated on `blind`, captured before the
  cap loop, so a refused cap removal stays in errors/failed but no longer skips the floor as "an input is unreadable"; an
  image's plan count is the union of the plans naming its tag or its id; the VM_MIN_FREE_GB comment and the README sentence
  follow the amended rule and the spec's wording. localci_merger_tick.sh unchanged.
