plan_ref: >-
  Lead's mandate B8, 2026-10-08 (budget 60 minutes), from origin/main 86b151beec (B7 merged), and its amendment received
  at 18:27Z (same budget). Measured on Pro by the lead: the Colima VM's /var/lib/docker (60 GiB) at 100 % from about 15:27Z,
  every contained context ERROR/BLOCKED since (no verdict, B3's rule held); vm_free_gb 0.0 in every prune line; at 17:20Z
  images 58.85 GB (E2E x4 at 5.35 GB, the oldest named by 4 armed PRs; frontend x4 at 0.46 GB; backend x2 at 4.64 GB), build
  cache 16.93 GB with 0.5 GB reclaimable under until=24h; every deps image named by a plan under 3 h old, so
  IN_FLIGHT_GRACE_H=6 kept all; recovered by hand at 17:3xZ (~/logs/vm-recovery-20261008.log). Amendment, 17:26Z: the hand
  pass freed 4.4 GB and the next tick (pr7945) refilled the VM (cache 16.9 -> 21.8 GB, VM 0 free); `builder prune
  --keep-storage 4GB` without -a removed 0 B; 2 images x 3 recipes (~46 GB) + 7 GB not the gate's + ~12 GB scratch > 60 GiB.
