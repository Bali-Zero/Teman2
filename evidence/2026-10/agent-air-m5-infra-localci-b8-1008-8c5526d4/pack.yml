residuals:
  - "An unmeasured VM (the probe failing rather than reading 0.0) skips the floor: the floor acts on a measurement, never on its absence. The lead's lines on the full VM read 0.0, so the probe ran there; if phase D shows a failing probe on a full VM, the floor needs a second source."
  - "Under the floor the newest image of a recipe can go, so the next tick of that recipe rebuilds its deps image: the floor trades a rebuild for a verdict, as ruled. If every remaining image is named by the run in progress or on the never-list, the floor ends unmet and the line says met false."
  - "The builder prune runs once after the cap and once per floor removal; each run is bounded at 600 s. If phase D shows it long, the floor's removals can be batched before one prune."
  - "A run of the last 48 h without status.json keeps what it names, as in B6: a run that crashed before writing status.json holds its images until its plan ages out of the window."
  - "References count distinct plans, one per run: a PR re-run often counts once per run."
  - "B9 (a deps recipe keyed on the merge result) is written in the spec as an open question, not built."
  - "The full sweep was not rerun after the fix round, by the lead's instruction (the VM filled a second time 22:33Z-01:40Z and B8 must ship): its last full run is 232/232 at b9c2b9db00; the fix round's 14 rules were run with --only and every rule's text was checked present exactly once."
  - "No adversarial round: the lint's gear-2 floor comes from its size term alone and asks for none; the independent gate is the lead's."
