pii_scan_note: The merger's prune code, its tests and mutants, a spec paragraph and a README section; no client data was read or written.
what_changed: |
  scripts/localci/prune.py: plan_refs also returns, per tag and image id, how many distinct plans of the last 48 h name it.
  image_decisions: slot 1 is the newest's; slot 2 goes to the named image with the most plans (ties: the youngest reference,
  then the newest image); beyond the slots only the run in progress keeps an image (IN_FLIGHT_GRACE_H and its branch
  removed); each decision carries its slot. prune(): after the cap, the builder prune and the run trim, while vm_free_gb.after
  < VM_MIN_FREE_GB (15, env LOCALCI_VM_MIN_FREE_GB) slot-2 images go oldest first, re-measured after each, rule "vm floor: ...";
  the line carries vm_floor {floor_gb, removed, met} or skipped (dry run, unreadable input, unmeasured VM). The builder prune
  is `--keep-storage <BUILDER_CACHE_GB>GB` (4, env LOCALCI_BUILDER_CACHE_GB), journaled as builder_prune.keep_storage_gb; an
  env value that is not a finite number >= 0 reads as the default. Spec: item 1 of the B6 paragraph (slot 2, the lease, the
  builder sentence) amended with the measurement, the VM floor as an addendum, B9 as an open question. README rows and the
  example line. Tests: the B8 guilt and innocence set plus floor boundaries (14.5, 15.0, 15.5) and env overrides; the fake
  docker frees an image's size on removal. Mutants: b6-grace-4 and b6-grace-8 retired; b6-cap-off and b6-second-kept-unnamed
  re-aimed at the new code; b6-cap-counts-tags replaced by b6-twin-tag-untagged; 22 b8-* rules added. A second commit
  (25a71fd3bf) re-aims b6-rm-forced at the cap's removal, which the first full sweep found STALE once the floor added its
  own `image rm`, adds b8-floor-rm-forced, and makes the floor test assert the exact `image rm` calls.
  localci_merger_tick.sh unchanged.
