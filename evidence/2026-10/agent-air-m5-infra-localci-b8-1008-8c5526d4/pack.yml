dissent: []
residuals:
  - "An unmeasured VM (the probe failing rather than reading 0.0) skips the floor: the floor acts on a measurement, never on its absence. The lead's lines on the full VM read 0.0, so the probe ran there; if phase D shows a failing probe on a full VM, the floor needs a second source (B3's probe is the only one today)."
  - "A run of the last 48 h without status.json keeps what it names, as in B6: a run that crashed before writing status.json holds its images until its plan ages out of the window."
  - "Slot 2 counts distinct plans, and a plan per run: a PR re-ticked many times counts once per run, so a PR that re-runs often can outweigh several PRs that ran once. The 17:20Z case (one image named by 4 PRs) is decided correctly either way."
  - "B9 (a deps recipe keyed on the merge result) is written in the spec as an open question, not built."
  - "No adversarial round: the lint's gear-2 floor comes from its size term alone and asks for none; the independent gate is the lead's."
