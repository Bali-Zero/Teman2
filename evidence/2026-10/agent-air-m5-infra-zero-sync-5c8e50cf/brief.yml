task: >-
  Keep FastLabsNet/zero (the private, product-only, history-less export of this repository, owner decision
  2026-10-09/10: Teman2 is public and exposes clients, so it is deleted with its history) current with
  canonical main, without a human. A one-way mirror organ on Mini rebuilds zero's tree from canonical's
  (perimeter declared in zero's own .slim/ manifests) and pushes one fast-forward commit, refusing whenever
  the push would revert a change made directly on zero.
lane: infra
machine: m5
date: 2026-10-10
gear: 3
gear_reason: >-
  Deterministic floor 3, measured: evidence_pack_lint.compute_floor per changed file gives 3 for
  .github/workflows/zero-sync-tests.yml, infra/launchagents/com.nuzantara.zero-sync.plist and
  infra/launchagents/wrappers/mini-zero-sync.sh (hot-zone path term) and 1 for every other file; the husky
  preflight refused the push on floor-needs-brief. The floor sets the gear, not the size.
acceptance:
  A1:
    text: >-
      WHEN canonical changes inside the perimeter the tool SHALL push exactly one fast-forward commit to zero
      main whose tree is keep paths minus cut paths with .github/, .slim/ and local paths taken from zero only,
      carrying the Zero-Sync-Canonical trailer; WHEN nothing changed it SHALL push nothing.
    probe: python -m pytest scripts/zero_sync/tests -q -p no:cacheprovider
  A2:
    text: >-
      IF a non-sync commit on zero changed a product path and the built tree would differ there, the tool
      SHALL refuse (exit 3, heartbeat error naming the paths) and push nothing; IF canonical already carries
      the same content it SHALL NOT refuse.
    probe: python -m pytest scripts/zero_sync/tests -q -p no:cacheprovider
  A3:
    text: >-
      IF a git network call hangs, the push is refused by the remote, or the payload never reaches its own
      heartbeat, the run SHALL end with an error heartbeat; only a lost fast-forward race SHALL be a
      retryable warning.
    probe: python -m pytest scripts/zero_sync/tests -q -p no:cacheprovider
  A4:
    text: >-
      WHEN run for real against both remotes before #8195 landed, the dry run SHALL refuse on the portal
      conftest.py that zero carried and canonical did not.
    probe: python3 scripts/zero_sync/zero_sync.py --dry-run --no-ci-check --state-dir <scratch>
  A5:
    text: >-
      Live after delivery: WHEN the launchd job runs on Mini, a sync commit SHALL land on zero main, zero's CI
      push run on it SHALL be green on mini-zero-1 and ~/.organism/last_seen/mini.zero_sync.json SHALL read ok.
    probe: gh run list -R FastLabsNet/zero --branch main --limit 3; cat ~/.organism/last_seen/mini.zero_sync.json on Mini
out_of_scope: >-
  Moving the sync source from Teman2 to the LOCALCI phase-F mirror (a later env change, docs/runbooks/zero-cutover.md
  gate 3); deploys from zero; recreating zero to drop the old history (an org-owner action); the staff roster
  shim (its own PR).
assumptions:
  - text: Mini has git, gh (authenticated with push to FastLabsNet/zero, credential helper for github.com) and npm on /opt/homebrew/bin.
    status: verified
    probe: ssh mini 'gh auth status; git config --global --get-regexp credential; /opt/homebrew/bin/npm -v'
  - text: zero's npm-lock-sync check is `npm ci --dry-run`, so a lock regenerated by Mini's npm 11 (which drops the extraneous entries npm 10 kept) is accepted.
    status: verified
    probe: grep -n "npm ci --dry-run" on zero's .github/workflows/npm-lock-sync.yml
  - text: Gear 3 needs the independent final-gate verdict on the head SHA, commissioned after the last push.
    status: unverified
    probe: gh pr checks <pr> after the verdict is posted.
