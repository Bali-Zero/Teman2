  CI push run on it green on mini-zero-1, and Mini's ~/.organism/last_seen/mini.zero_sync.json reading ok.
decisions:
  - id: D-perimeter-on-zero
    decision: >-
      The perimeter manifests live on zero (.slim/), the code lives here. zero owns .github/ (its self-hosted CI)
      and .slim/ exclusively; a canonical workflow never overwrites them and a workflow deleted on zero never
      comes back.
  - id: D-ff-only-cas
    decision: >-
      One commit per sync, parent = zero's fetched tip, pushed as a compare-and-swap on that exact tip
      (--force-with-lease=refs/heads/main:<tip>): a fast-forward from that tip or nothing. zero's ruleset also
      forbids non-fast-forward on main.
  - id: D-refuse-not-revert
    decision: >-
      A direct product change on zero is never overwritten: the sync refuses (exit 3, error heartbeat) until the
      same content lands in canonical. Recognising the last sync needs committer zero-sync AND a git-parsed trailer.
  - id: D-red-ci-does-not-stop
    decision: >-
      A red zero CI on the previous sync is a warning, not a stop: it means the perimeter needs a cut (an organism
      test exported by mistake) or a real break that canonical's own gate already let through; stopping the mirror
      would hide the next canonical fix.
  - id: D-npm-unpinned
    decision: >-
      The lock is regenerated with Mini's npm (11.19.1); the cache key includes npm --version. Not pinned: zero's
      lock check is `npm ci --dry-run`, which accepts both npm 10 and 11 output (verified), and a version change
      only produces a lock-only sync commit that zero's CI validates.
