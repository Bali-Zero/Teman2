bites: >-
  Prose form on purpose: the consumer is the launchd job com.nuzantara.zero-sync on Mini (organ mini.zero_sync,
  ~/scripts/mini-zero-sync.sh) and what it changes is the private FastLabsNet/zero, neither of which a CI runner
