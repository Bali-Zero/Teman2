dissent:
  - seat: codex-gpt-5.6-sol (round 2)
    objection: >-
      The never-push-to-canonical invariant rested on URL syntax; host aliases, insteadOf or symlinked file
      remotes bypass a URL comparison.
    status: CONFIRMED
    disposition: >-
      Cured in layers: content identity (target must carry .slim/keep_paths.txt, source must not carry .slim/),
      refusal of any URL rewriting rule for either URL, and the push as a compare-and-swap on zero's fetched tip.
  - seat: codex-gpt-5.6-sol (round 4)
    objection: >-
      url_rewrites() split `git config --get-regexp` output at the first space; a pushInsteadOf rule whose
      url.<base> contains a space was misread and not refused.
    status: CONFIRMED
    disposition: Cured in 80ffa5ee27 (records read with -z, key and value split on the first newline); guilt test fails on the old parser; round 5 PASS.
  - seat: kimi-code/k3 (rounds 1-3)
    objection: >-
      The .slim/ manifests are the perimeter's SSOT yet live on the gate-less target; a keep-path swap that deletes
      under 25% of the products still ships. Recommends a ruleset on zero requiring review for .slim/**.
    status: PLAUSIBLE
    disposition: >-
      Not adopted here: rulesets on zero are an org-owner setting (FastLabsNet). The empty-perimeter refusal and
      the 25% mass-change guard bound the damage; recorded for the cutover runbook.
  - seat: kimi-code/k3 (round 3)
    objection: lock_cache/ under the state dir grows one file per distinct npm/input hash and is never pruned.
    status: PLAUSIBLE
    disposition: >-
      Owed, not widened: an entry is written only when canonical's root lock/manifests or npm change (a few per
      week, ~1 MB each). Keep-newest-N pruning is a follow-up.
  - seat: codex-gpt-5.6-sol (round 1)
    objection: npm depends on the machine's installed version while the tests stub it; pin it and add a real-npm test.
    status: PLAUSIBLE
    disposition: Not adopted (decision D-npm-unpinned); the cache key carries the npm version.
