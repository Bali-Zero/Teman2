gear: 2
gear_reason: >-
  Size floor (diff with the card rewrites, tests, observer and pack above 400 churn). Docs and registry
  only plus a no-argument card-versus-pack diff script and its observer; no engine, no pack, no pricing,
  no mouth file.
mission: >-
  The E33-family doctrine cards and the E33 fact registry describe the active signed pack and the official
  imigrasi pages, so the next session that reads them is not misled by pre-seq-28 rules.
