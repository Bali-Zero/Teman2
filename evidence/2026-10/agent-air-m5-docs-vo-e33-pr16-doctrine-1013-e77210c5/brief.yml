  The seven cards E33, E33A, E33B, E33C, E33E, E33F and E33G carry the rules of rulepack-prod-029 and cite
  the per-code imigrasi.go.id page as a page source; the E33 fact registry states the rangkap-kegiatan
  sentence, the disputed E33F sponsor fact and the E33G requirements; a no-argument script prints nothing
  when each card and the active pack agree on rule ids.
