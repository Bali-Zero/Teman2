what_changed: |
  1. _flush_batch supersedes instead of piling up: older open PRs of the family that do not hold
     a merge-queue slot are carried (3-way per file against their merge-base) onto a fresh branch
     off main with the new batch, then closed once the successor PR exists; a PR with a file main
     changed since it branched is kept open and alerted.
  2. homepage-layout.json is replayed from slugs onto main's current layout (older PRs' promoted
     slugs + this tick's rotations), never carried as bytes.
  3. Arming: `gh pr merge <n> --auto` (no --squash), then autoMergeRequest OR mergeQueueEntry is
     read back; neither = Telegram alert + flush False.
  4. run_image treats a cover held by any open covers PR as existing; staged covers that landed on
     main during the run are dropped at flush.

