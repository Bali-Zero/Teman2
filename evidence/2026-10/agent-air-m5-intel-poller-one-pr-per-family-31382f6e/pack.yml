spalla:
  seat: "codex exec read-only, default account model (gpt-6-astra), effort high - 9 findings"
  fixed:
    - "1 HIGH carried-path collision closed both PRs: non-generated kinds now keep the older PR open when a newer copy overrides its edit"
    - "2 HIGH base race: main is read ONCE per flush, every check uses that sha and the branch is cut from it"
    - "3 HIGH promotions cascaded into latest_*: promoted slugs are read across hero+latest slots"
    - "4 MED slug in main's latest treated as published: only main's HERO slots count as already promoted"
    - "5 HIGH head moved after carry: carry pinned to headRefOid, close refused when the head moved"
    - "8 MED unreadable PR list silently disabled cover dedupe: run_image leaves the item queued; PR files read paginated (no 100-file cap)"
    - "9 MED fake accepted a PUT without sha for a file existing on main: fresh branch now snapshots main, sha asserted"
  dismissed:
    - "3b promotion of a slug already in the base hero list is not replayed: ordering only, the slug stays on the page"
    - "6 MED queue entry between re-check and close: GitHub has no conditional close; the closed PR's files are already in the successor, so the residual cost is CI, never content"
    - "7 MED steps marked done when arming fails: the content is safe in an open PR and the failure is alerted; retrying the arm without new content needs a per-tick heal sweep, which would start closing the legacy pile with no new content - left as a follow-up, not in this PR"

