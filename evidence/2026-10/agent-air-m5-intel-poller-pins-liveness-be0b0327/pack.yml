     carried, not closed). Only unarmed or conflicting ones are superseded. Layout and SEO keep
     superseding every unqueued older PR.
  2. _rotate_layout drops the promoted slug from latest_*; trailing latest keys left without a slug
     are removed instead of keeping a stale copy.
  3. Three tests pin guards no test held: no close after a failed PUT (M1), no close when the PR
     entered the queue before the close (M2), the 300-file compare cap keeps the PR open (M3).
  4. One PENDING-ARMS row: apps/bali-intel-scraper/tests runs in no CI workflow.

