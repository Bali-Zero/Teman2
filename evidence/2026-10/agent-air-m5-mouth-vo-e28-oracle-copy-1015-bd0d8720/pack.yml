decisions:
  - id: D-no-figures
    decision: "Golden Visa reasons name no US dollar figure and point to the per-code official page; the figures wait for source records in the pack."
  - id: D-e28a-renewal-line
    decision: "The 730 mapping surfaces the E28A longer-stay renewal line ('your stay can continue by renewal'); intended and true: the E28A page states the permit is extendable (df3ba889 lines 69 and 72, extension online by the sponsor). The 2-years-only ruling concerns duration options, not renewal."
  - id: D-e28c-no-90-days
    decision: "The E28C page asks proof of ownership of the instruments; its 90 days is the visa validity. The threshold question is route-neutral and the 90-day commitment sits in the hint for the company, branch and subsidiary routes only."
  - id: D-lint-brief-ref
    decision: "evidence_pack_lint reports brief_ref evidence/brief.yml unresolved locally; CI stages that file. Linted with brief.yml copied to evidence/brief.yml temporarily (copy removed): clean when run without the changed-files inputs. With them, the ground_truth check (rules 9b-c) is not exercised here; CI lints the pack only at gear 3, and this PR stays gear 2 (floor 2)."
  - id: D-process-amend
    decision: "One unpushed commit was amended once (an observer test-title match fixed after the red-team fix commit); nothing had been pushed."
