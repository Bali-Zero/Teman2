decisions:
  - id: D-no-price
    decision: >-
      The E33A/B/C line carries no IDR figure (priced on consultation, Zero 2026-10-11); a guard test pins that and pins the E33E line
      at IDR 45.000.000 as unchanged.
  - id: D-observer-reuse-guard
    decision: >-
      The observer runs the existing llms-public-file-guard test file rather than a new script-side parser, so the file CI already reads is the file observed.
  - id: D-owner-decision-12
    decision: >-
      The audit spec gates PR-18 on owner decision 12 (whether E33A-C are sold) and depends_on PR-3; the lane was instructed to implement
      it and PR-3 merge state was not checked here - the PR body must say so.
