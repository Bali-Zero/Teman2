  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-13T20-18-16-01a13532-fdbf-7ed3-a194-76358795b738.jsonl, model verified in the rollout file)"
    objection: "MEDIUM - brief_ref evidence/brief.yml does not resolve to a file on disk."
