ruling: >-
  Zero, 2026-10-11 E33/retirement audit plan PR-18 - E33A, E33B and E33C are priced on consultation (Zero 2026-10-11);
  the public llms.txt read by LLM crawlers must describe them as government-linked routes, as the official pages and the live Visa Oracle copy (#8266) do.
mission: >-
  llms.txt names E33A, E33B and E33C as Second Home government-linked routes handled by consultation, as the official pages and the live Visa Oracle copy do.
