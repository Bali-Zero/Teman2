decisions:
  - id: D-no-not-sure
    decision: >-
      No not-sure option, as in the seq-28 step B precedent: the seq-31 rule will need the figure and an unknown
      would only re-ask it. The no-notSure pin in tree.test.ts moves 16 -> 17.
  - id: D-why-copy
    decision: >-
      The why-copy says the Investor visa looks at the shares the applicant holds personally, not only at the
      company's capital: true before and after the pack reads the figure, and it names no threshold.
  - id: D-reason-copy-ahead-of-pack
    decision: >-
      E28A_OWN_SHAREHOLDING_BELOW_MIN copy lands one step ahead of the seq-31 pack; the I-M01 orphan census
      carries a one-key PENDING list that step C deletes. The English copy says "personally own" rather than
      "held by you" because the client-copy jargon guard rejects the word "held".
  - id: D-red-team-B-1-pt-pma-gate
    decision: >-
      Codex red team (FIX-FIRST, 4 MEDIUM), finding 1: on the pt_pma vehicle the question was asked even after
      investment_pt_pma "no". Cured: asked only after "yes", like capital_market and the explorer; innocence
      test (no / unanswered commitment never asks it). No walk in the corpus answers "no" there, so the
      regenerated corpus is byte-identical.
  - id: D-red-team-B-2-raw-syntax
    decision: >-
      Finding 2: QuestionScreen converted the raw string first, so 9999999999.9999999 rounded to 10000000000.
      Cured with parseWholeNumberInput (_lib/whole-number-input.ts): the raw string must be ASCII digits only,
      then safe-integer and bounds. The shared number path serves every step-1 whole-number question; a test
      pins that every number question has step 1 and min >= 0. The UI never accepted thousand separators
      (input type=number), so none are accepted now. Component test submits 9999999999.9999999, 1e10,
      10000000000.0, -5 and empty (never answered) and 10000000000 (answered).
  - id: D-red-team-B-3-no-path-doors
    decision: >-
      Finding 3: the replay fixture is regenerated in full by replay-no-path-doors.py at the active pack's
      signed_at (a valid census instant, no network): 38 non-supported walks (30 NO_SUPPORTED_PATH, 4
      HUMAN_REVIEW_REQUIRED, 4 NEEDS_INPUT) against 27 recorded. The regeneration is the same before and after
      this step on the base corpus, so the gap predates step B. Covering the missing walks exposed a real
      over-match: the tourist door was named on the calling-visa and active-overstay dead ends, where the
      replay shows every door shut. buildNoPathDoors now abstains for those three global-filter reason codes;
      the door test asserts positive abstention where no door is open.
  - id: D-red-team-B-4-pending-expiry
    decision: >-
      Finding 4: the PENDING exemption for E28A_OWN_SHAREHOLDING_BELOW_MIN is logic now, not a comment: it
      holds only while the highest signed pack is seq-30 or lower; from seq-31 the pack must emit the reason.
      Guilt and innocence cases pin it (seq-31 without the reason is an orphan; seq-31 with it, and seq-30,
      pass).
  - id: D-corpus-default-own-shareholding
    decision: >-
      Coordinator item: the generator's generic numeric default (IDR 1,000,000,000) sat below the E28A minimum, so
      the seq-31 candidate would drop E28A from every qualifying walk. The default answer for
      investment_own_shareholding_idr is now IDR 10,000,000,000; the two boundary witnesses keep 9,999,999,999 and
      10,000,000,000. 15 walk fixtures changed that one answer (17 walks carry the fact: these 15 plus the 2 boundary witnesses) (pt_pma, below_published_threshold, company_only,
      foreign_branch_only, full_capital, ikn_subsidiary, no_route, offshore_application, sponsor_government,
      sponsor_government/not_world_figure, capital_market, capital_market_only, business_exploring, the stay_361
      explorer walk, onshore_invest). Seq-30 does not read the fact: census and gold-coverage pins unchanged and green.
