what_changed: |
  runner.py: run_host_reader takes `pending` (matrix key pending_when): on a non-zero exit with a stderr line starting with it, it returns
  rc None with reason "gate_pending: host, at plan: ..." at once (no retry); evaluate_contexts names a BLOCKED context whose reason carries
  that mark `no_verdict: gate_pending`. contexts_matrix.yaml: pending_when on the harness-floor reader step.
  merger.py: decide journals gate_pending: true; triage takes gate_posted/capped and decides a gate_pending key again only when
  gate_status_posted (one GET of repos/{repo}/commits/{head}/statuses, paged, context harness/fable-gate) says so, at most
  GATE_PENDING_CAP = 3; tick journals skipped gate_pending_cap once per key; report counts gate_pending decisions and prints one line.
  tests/test_gate_pending.py (27 tests), one report test, 12 b12-* mutant rules; README section and spec addendum.

  Fix round (gate CONFIRMED 3d7146932a with one MEDIUM and five LOW findings):
  MEDIUM: merger.py gate_ready = gate_posted_at (newest updated_at/created_at of the head's harness/fable-gate statuses) AND, for every
  context the decision found pending, hosted_rerun_after: the check runs named exactly as that context (GET
  repos/{repo}/commits/{head}/check-runs?check_name=<name>&filter=latest, paged and bounded by gh_pages over hc.gh_get), latest attempt per
  check suite, all completed after the post. None, in progress, completed at or before the post, or a failed read: not eligible. The name
  is the decision's gate_pending_contexts, the context names of the plan's contexts_map (the BASE matrix entry), never a literal in code.
  L1: decide journals gate_pending (and gate_pending_contexts) only when overall is BLOCKED; triage also honours it only on a BLOCKED line.
  L2: Bites restated below. L3: run_host_reader's pending answer carries gate_pending: true, frozen in the plan's precomputed; _run_leg
  copies it onto the BLOCKED step it answered; gate_pending_of marks the context result only when it is BLOCKED and every step that did not
  pass is such a read; the run keeps the flag of the current attempt only (dropped at RUNNING and on worktree moved); evaluate_contexts reads
  the flag, and the GATE_PENDING text constant is gone. L4: a test runs BASE scripts/ci/harness_gate_read.py main() with its two reads
  stubbed: the not-posted stderr line starts with the matrix pending_when, the posted states pending/failure/error do not. L5: the report
  counts gate_pending on non-replay rows only and its line says "(replays not counted)".
  Also: the waits fixture records the runner's own sleep instead of patching time.sleep for every thread (a cross-thread sleep made one
  test fail once in a combined run), and a pre-existing ruff F811 on the world fixture is silenced like pending_world's.
  tests/test_gate_pending.py now 65 tests, one more report test, 26 b12-* mutant rules (14 new, 3 re-anchored).
proof: |
  Tests and mutants on M5 against temporary repos and fake GitHub reads; nothing ran on Pro and nothing was pushed.
