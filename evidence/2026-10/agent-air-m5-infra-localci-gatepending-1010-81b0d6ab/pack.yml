residuals:
  - "Live proof on Pro is owed to the first extraction after merge: the Bites observation above."
  - "The re-decision costs one commit-status GET and one check-run GET per pending context per gate_pending PR per tick, at most three decisions per key."
  - "Eligibility trusts GitHub's check-run completed_at against the status's updated_at: two clocks of the same service, compared as UTC strings to the second; a re-run completing in the same second as the post is not eligible (strictly after)."
  - "A PR whose session posts the status but never runs `gh run rerun` stays not eligible: the key waits for its next head or base, as before B12."
  - "The c.pop of gate_pending on the worktree-moved and RUNNING transitions covers the paths that change a check's status; other BLOCKED transitions (trusted rerun refused, plan-time dirty) start from QUEUED/INTERRUPTED states that never carry the flag."
