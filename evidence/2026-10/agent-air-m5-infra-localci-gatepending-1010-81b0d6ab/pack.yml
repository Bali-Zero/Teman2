    gate_pending: true with gate_pending_contexts ["Harness floor recompute"] and overall BLOCKED, ctx.harness-floor BLOCKED in its contexts
    map, and `merger.py report` classes that row BLIND, not FALSE_RED. Secondary: after the session posts the status and the hosted
