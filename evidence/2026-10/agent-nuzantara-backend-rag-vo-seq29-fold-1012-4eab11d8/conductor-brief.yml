gear_reason: >-
  A rule-pack candidate for the Visa Oracle production engine under apps/backend-rag/** (hot zone) plus the
  interview-tree corpus and census pins that read it. It changes who is admitted to E31D, E31J and E28F, and
  which reason a family applicant is shown. The pack is unsigned: signing and activation are the owning session's
  act (Zero's standing authorization, CONDUCTOR amendment 2026-10-12T06:55Z), not this branch's.
l_level: L2
gate_class: opus
ruling: >-
  Zero, 2026-10-11 - cover the 38 visas; Zero via nuzantara-57, 2026-10-12T06:55Z - the signing session signs
  and activates seq-29 itself, the builder only brings it to READY-TO-SIGN.
mission_text: >-
  seq-29 = signed seq-28 plus four decision-free rule corrections: two E31J hard filters, hf.e31j-adult-excluded and
  hf.e31j-married-excluded, and one E31J review hold, review.e31j-marital-status-other, for 'Another status' (retiring el.e31j-dependency-age), hf.e31d-sponsor-not-indonesian, the foreign-parent
  conjunct on el.e28f.ikn-subsidiary, and the E31E age and marital exclusions scoped to the PARENT relation.
  The A1 conversion gate and the E30A/E30B multi-year options were built and tested, then moved to seq-30 when
  the slice passed ~400 net lines. The OFFICIAL_PORTAL re-stamp is built to run in two modes; the committed
  source was the dry-run output and is now the REAL fold on the 2026-10-13 organ ledger
  (research/visa/2026-10-13-organ-reattest-seq29).
objective: >-
  rulepack-prod-029.source.json is exactly what fold_pack_seq29 produces from signed seq-28, chains to the
  seq-28 payload digest a23a5bf5, and every consumer that grades a candidate (the walk census, the unreached-
  product guard, the gold personas, the mouth copy guard) is green on it.
constraints:
  - Nothing is signed, activated, pushed or armed by this branch; the source is generated by the fold and never hand-edited (a formatter-only prettier --write changes bytes, not the canonical payload, and the test compares canonical bytes).
  - fold_pack_seq28.py, rulepack-prod-028.* and every E33-family rule and copy are untouched.
  - The only differences from seq-28 are identity, three modified rules, three appended hard filters, one appended review rule and one retired rule; no product moves, and no source record moves except the 18 portal stamps (verified_at/verified_by only).
appetite:
  wall_clock_hours: 3
