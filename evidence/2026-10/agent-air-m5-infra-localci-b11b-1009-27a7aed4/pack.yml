    probe: "test_replay.py::test_replays_and_pr_decisions_alternate_newest_merge_first_and_a_replayed_commit_is_not_asked_again"
  - text: The replay SHALL still judge the merge commit with its first parent as the BASE, never the commit's own matrix.
    probe: "test_replay.py::test_the_replay_judges_the_merge_commit_with_its_first_parent_as_the_base_never_the_commits_own_matrix"
