  compared 0 to 9. Main took 31 merges on 10-07, 56 on 10-08 and 26 on 10-09 by 09:5xZ; the gate decides about one PR or replay an
  hour. Oldest-first would spend days on replays that cannot count and build a deps image per old lockfile; newest-first replays a
  current base and recipe, and the merges left behind are not owed (phase D counts compared merges).
