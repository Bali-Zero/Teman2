dissent:
  - seat: agy-gemini-3.1-pro
    objection: "MEDIUM: a request beyond the last option silently gets the last option; the display must say an extension is needed."
    status: CONFIRMED
    disposition: "cured in this PR: additive extension_required flag on the candidate display, true only when the wish exceeds the last option; contract.schema.json regenerated."
  - seat: agy-gemini-3.1-pro
    objection: "LOW: the product's top-level pricing_key may diverge from the first option's key."
    status: CONFIRMED
    disposition: "cured in this PR: the model refuses a product whose pricing_key differs from duration_options[0].pricing_key."
  - seat: agy-gemini-3.1-pro
    objection: "LOW: duration_options could sit on a stay policy that is not FIXED_DAYS."
    status: CONFIRMED
    disposition: "cured in this PR: the model refuses options on any other stay kind."
  - seat: codex-gpt-5.6-sol
    objection: "BLOCK: the response dump restores null selected_duration_days and duration_options on every product without options (99 of 116 walk responses changed); the old contract rejects them."
    status: CONFIRMED
    disposition: "cured in this PR: a wrap serializer on the candidate display drops all three new keys when the product has no options; a response-layer test over every census walk checks the keys and the OLD candidate contract, and goes red when the serializer is disabled."
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM: duration options on a non-FIXED_DAYS stay policy bypass every bound."
    status: CONFIRMED
    disposition: "cured in this PR (same cure as the Gemini LOW): the model refuses options on any stay kind other than FIXED_DAYS."
  - seat: codex-gpt-5.6-sol
    objection: "LOW: the full suite could not run inside the read-only sandbox (tmp_path fixture)."
    status: RETRACTED
    disposition: "A sandbox limit, not a defect; the full directory ran outside the sandbox and is receipted above."
