    decision: >-
      Drop both rows instead of editing the figure: the engine already maps a product with no snapshot row to
      the UNKNOWN / PROCESSING_TIMELINE_NOT_VERIFIED object, so no engine, tree, i18n or pack file changes.
  - id: D-e23-untouched
    decision: >-
      E23 (20-30 working days, source text "4-6 weeks (RPTKA+IMTA)") is left as is: the IMTA wording lives in a
      production catalogue row and waits on OD-5; the snapshot is a copy of that row.
  - id: D-no-observer
    decision: >-
      No new CI observer: the existing test file already runs the whole snapshot-versus-pack comparison on every
      backend run, and a new observer would restate it.
dissent:
  - seat: "self-review (implementer)"
    objection: "Other unpriced products (E28B-D, E28F, E30, E30E/F, E33A-C) also show 7-10 with no price row."
    status: PLAUSIBLE
    disposition: "Out of scope by the plan: PR-08 names E23U and E23V only (empty official pages); the test pins only those two plus the general rule that a row-less unpriced product renders pending, not that every unpriced product must lack a window."
  - seat: "codex gpt-5.6-sol (red team)"
    rollout: "01a12d18-e796-75d0-99d7-88fbd895de07"
    objection: "MEDIUM: the premise that no official source gives a window is false; imigrasi.go.id indexes a 4-day window on the E23V page and a newer Kanim Bontang page a 5-day standard, so sources conflict or are stale, not absent; document and resolve it rather than bake a false premise into tests and the pack."
    status: PLAUSIBLE
    disposition: >-
      CURED, and the objection was partly right. Checked live 2026-10-12 (re-fetched in the cure round): the
      per-code pages (daftar-visa-indonesia/E23V and /E23U) say "Data Belum Tersedia" and contain no
      "hari kerja". The generic klasifikasi-visa-tinggal-terbatas-indeks-e23v URL returns a page whose text is
      byte-identical for an invented slug; it names E23U (once) and E23V (twice) in its description list and
      stay/extension table, but its 93 "Empat hari kerja setelah pembayaran visa diterima" blocks carry no visa
      code. So an official generic issuance step of four working days does exist: it is uniform across classes,
      covers only the issuance after payment, and does not support the 7-10 Bali Zero figure, so no end-to-end
      window is established for these codes and UNKNOWN stays (OD-5 owns which authority wins). The Bontang file
      reachable from search is a one-hour service-compensation decision and says nothing about E23U or E23V; the
      5-day statement was not found, and an office-local standard would not govern a national catalogue figure.
      An earlier wording of this record said the strings E23U and E23V never occur in the generic page; that
      premise was false and is withdrawn. The snapshot interpretation and the test reasons say "no code-specific
      official window" and "the 4-day text ... never names it", which stay literally true.
