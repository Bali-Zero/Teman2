gear: 1
brief_ref: evidence/2026-10/agent-nuzantara-backend-rag-vn-work-pr08-e23uv-t-a65b92c8/brief.yml
ruling: >-
  Visa-night family audit 2026-10-12, plan PR-08 (findings F14, F22, F37; dedup group G19): the 7-10 working-day
  figure for E23U and E23V is a catalogue default shared by about thirty codes, the per-code imigrasi.go.id pages
  for both are empty ("Data Belum Tersedia"), the pack carries no rule for a window and the price catalogue has no
  row; conservative default of owner decision OD-5 is the pending timeline. Authority note (red team, checked
  2026-10-12): official sources are silent for these codes, not absent in general. The generic imigrasi.go.id
  klasifikasi-visa-tinggal-terbatas page prints "Empat hari kerja setelah pembayaran visa diterima" 93 times as
  a template; that page returns byte-identical text for any slug (an invented slug included), and the strings
  E23U and E23V never occur in it, so it is not a code-specific window. A Kanim Bontang decision dated 2025
  (WIM.18.IMI.7-1132.PW.02.01) sets a one-hour compensation rule, not a visa standard, and names neither code. The E23 figure and its IMTA source text are untouched
  (production catalogue row, OD-5).
mission: >-
  The E23U and E23V cards stop showing "typically 7-10 working days" that no rule, official page or price row
  supports, and show the pending-timeline sentence until an owner-confirmed figure exists (OD-5).
