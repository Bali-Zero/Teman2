decisions:
  - id: D-conservative-default
    decision: >-
      Drop both rows instead of editing the figure: the engine already maps a product with no snapshot row to
      the UNKNOWN / PROCESSING_TIMELINE_NOT_VERIFIED object, so no engine, tree, i18n or pack file changes.
  - id: D-e23-untouched
    decision: >-
      E23 (20-30 working days, source text "4-6 weeks (RPTKA+IMTA)") is left as is: the IMTA wording lives in a
      production catalogue row and waits on OD-5; the snapshot is a copy of that row.
  - id: D-no-observer
    decision: >-
      No new CI observer: the existing test file already runs the whole snapshot-versus-pack comparison on every
      backend run, and a new observer would restate it.
dissent:
  - seat: "self-review (implementer)"
    objection: "Other unpriced products (E28B-D, E28F, E30, E30E/F, E33A-C) also show 7-10 with no price row."
    status: PLAUSIBLE
    disposition: "Out of scope by the plan: PR-08 names E23U and E23V only (empty official pages); the test pins only those two plus the general rule that a row-less unpriced product renders pending, not that every unpriced product must lack a window."
  - seat: "codex gpt-5.6-sol (red team)"
    rollout: "01a12d18-e796-75d0-99d7-88fbd895de07"
    objection: "MEDIUM: the premise that no official source gives a window is false; imigrasi.go.id indexes a 4-day window on the E23V page and a newer Kanim Bontang page a 5-day standard, so sources conflict or are stale, not absent; document and resolve it rather than bake a false premise into tests and the pack."
    status: PLAUSIBLE
    disposition: >-
      CURED: premise corrected, figure rejected. Checked live 2026-10-12: the per-code pages (daftar-visa-indonesia/E23V and /E23U) say "Data Belum Tersedia". The klasifikasi-visa-tinggal-terbatas-indeks-e23v URL returns the generic page whose text is byte-identical to an invented slug and never contains E23U or E23V, so its "Empat hari kerja" is a template, not an E23V window (and it is the visa-issuance step, while the 7-10 default was never tied to it). The Bontang file reachable from search is a one-hour service-compensation decision and says nothing about E23U or E23V; the 5-day statement was not found, and an office-local standard would not govern a national catalogue figure anyway. UNKNOWN stays (OD-5 owns which authority wins). Cure: the pack ruling, the snapshot interpretation text and the test reasons now say "no code-specific official window" and record the conflict instead of "no official page".
  - seat: "codex gpt-5.6-sol (red team)"
    rollout: "01a12d18-e796-75d0-99d7-88fbd895de07"
    objection: "MEDIUM: the now-exposed fallback tells clients processing times 'vary by office and season' (EN) and 'bervariasi menurut kantor dan musim' (ID); no rule or page supports a seasonal cause; it should say only that Bali Zero has no verified window."
    status: CONFIRMED
    disposition: >-
      CURED: real, copy reworded. outcome.timeline_pending (en, id) reworded to "Bali Zero has no confirmed processing time for this visa yet. A Bali Zero advisor can confirm the calendar for your case before you book travel." / "Bali Zero belum memiliki kepastian lama proses untuk visa ini. Konsultan Bali Zero dapat mengonfirmasi jadwal untuk kasus Anda sebelum Anda memesan perjalanan." No cause, no figure, advisor offered not promised ("verified" is avoided because an existing test bars internal-note words from this copy). A new client-copy test (red first, 2 failed) bars season, office, vary and digits from it; the two OutcomeSheet pins of the old sentence were updated. The key is shared by every UNKNOWN timeline, so the cure reaches all of them, which is the intent: the old cause was unsupported for all.
  - seat: "codex gpt-5.6-sol (red team)"
    rollout: "01a12d18-e796-75d0-99d7-88fbd895de07"
    objection: "LOW: no price or PNBP split defect; git diff --check clean; the full pytest suite could not run in the read-only sandbox, only a functional probe."
    status: RETRACTED
    disposition: "No defect to cure; the whole suites were run in this lane (see results)."
