gear: 2
gear_reason: >-
  Test-only change (one backend test file plus its evidence), no product code, no data, no pack and no copy; it only
  reads the signed pack and the price catalogue. Gear 2 because the red-team cure grew the churn past the 400-line
  size floor (test file 384 lines), not because any hot zone is touched; one adversarial round was spent.
mission: >-
  The price a Visa Oracle visitor is quoted for E23 is pinned against the real price catalogue on the
  highest signed pack, and E23U and E23V are pinned as deliberately unpriced.
objective: >-
  A backend test asserts, on the highest signed pack VERIFIED through verify_rule_pack under the production key,
  that E23 prices from the Working KITAS (Offshore) catalogue row and is quoted AVAILABLE at IDR 34,500,000 through
  the real PricingService and through run_evaluation end to end (candidate, quote, display, persisted quote), that
  E23U and E23V carry no pricing key and resolve to CONTACT_REQUIRED / PRICING_KEY_NOT_CONFIGURED with no amount, and
  that an edited row amount, a deleted row, an E23 product re-aimed at a neighbouring row and a pack edited after
  signing each turn the pin red. E23 duration is deliberately not pinned.
scope:
  - apps/backend-rag/backend/tests/services/visa_engine/test_e23_family_pricing.py
appetite:
  wall_clock_hours: 1
  adversarial_rounds: 1
