decisions:
  - id: D-fact-derived
    decision: >-
      RETIREMENT_INCOME_BELOW_THRESHOLD is fact-derived: the declared figure is echoed against USD 3,000 a
      month; a not-sure answer says it counted as zero (the fact mapper's conservative 0); the static
      fallback names the figure. E33E_RETIREMENT_ELIGIBLE appends the income condition after the deposit figure.
  - id: D-pinned
    decision: >-
      RETIREMENT_INCOME_THRESHOLD_USD = 3000 and E33E_DEPOSIT_THRESHOLD_USD = 50000 are exported and pinned by
      tests to the newest signed pack, so a pack change fails the build instead of drifting the copy.
  - id: D-age-rewording-dropped
    decision: >-
      The E33E_AGE_55_59_ADVISOR_CHECK rewording is deliberately NOT in this change: the Permenkumham 11/2024
      text could not be opened, and primary sources show Permenimipas 3/2025 revokes only Pasal 43/45/52-55
      while the E33 articles 56-63 stay in force. Say so in the PR body.
