  retirement visitor below the passive-income bound got a reason that never named the figure the rules
  check; the page must say USD 3,000 a month, and the deposit reason must name the USD 50,000 figure and
  the income condition.
mission: >-
  A retirement visitor below the passive-income bound is told the figure the rules check - USD 3,000 a month -
  and the E33E reason names the USD 50,000 deposit and the income condition.
