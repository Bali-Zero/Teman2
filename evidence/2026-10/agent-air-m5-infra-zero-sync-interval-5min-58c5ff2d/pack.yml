dissent:
  - seat: kimi-code/k3 (round 1)
    objection: >-
      expected_hb_seconds 1200 was derived from the tick, not from the run: RUN_BUDGET 3300 and NET_TIMEOUT 1800
      make a legitimate run exceed it, so the organ reads stale and, near 3 x 1200, dead (healer kickstart).
    status: CONFIRMED
    disposition: >-
      Cured in d406012f69 (expected_hb_seconds 3600 above RUN_BUDGET 3300); round 2 kimi PASS, dead line now 10800.
  - seat: codex-gpt-5.6-sol (round 1)
    objection: >-
      Same window finding; additionally the wrapper checks the sidecar only after the payload returns, so a slow
      fetch between 1200 and 1800 s is a false silence; suggests in-progress heartbeats or a test that includes run
      duration.
    status: CONFIRMED
    disposition: >-
      Window finding cured in d406012f69; the residual zero margin (300 + 3300 = 3600 exactly) is raised again in round 2
      and stays open, see the round-2 entry below.
  - seat: both seats
    objection: >-
      Comments in zero_sync.py:38 ("under two ticks") and :542 ("a run never spans a tick for long") are false at a
      300 s cadence.
    status: CONFIRMED
    disposition: Cured in d406012f69 (both comments rewritten); round 2 kimi found them accurate, with one nit on 'only by hand'.
  - seat: kimi-code/k3 (round 1)
    objection: >-
      The edited plist does not change the loaded job; it is a declared pair that needs copy plus bootout/bootstrap
      on Mini, and the registry takes effect at merge while the job still runs at 1800 s.
    status: CONFIRMED
    disposition: Already in acceptance A4 and in bites (reinstall, then two run.log ticks about 300 s apart).
  - seat: kimi-code/k3 (round 1, note)
    objection: >-
      hb("warning") on red zero CI or push rejection is classed dead by the Mini healer (warning is not in
      HEALTHY_STATUSES), and more frequent runs mean more such spells.
    status: PLAUSIBLE
    disposition: Pre-existing status contract, listed out of scope in the brief.
  - seat: codex-gpt-5.6-sol (round 2)
    objection: >-
      expected_hb_seconds 3600 equals StartInterval 300 + RUN_BUDGET 3300, zero margin: the heartbeat is written only
      at the end and the watchdog starts after the wrapper, so a legitimate full-budget run can exceed 3600 s of
      silence. Wants an explicit margin (3900) or a running heartbeat at start. The false near-dead kickstart is
      resolved (dead is 3 x 3600 = 10800).
    status: PLAUSIBLE
    disposition: >-
      OPEN, reported to the coordinator, code untouched. kimi (round 2) judged the same boundary inert: only an
      already-wedged run reaches it, stale never pages, and the sentinel's PID override reads a running job as ok.
