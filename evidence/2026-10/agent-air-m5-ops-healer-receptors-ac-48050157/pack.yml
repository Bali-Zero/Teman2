what_changed: |
  scripts/healer_receptor_registry.py: each dead organ carries cure session|owner (dead_session / dead_owner). Owner only on a
  declared registry cure: owner; "operation not permitted" (caseless, the entity proprioception.py's launchd classifier reads)
  in the sidecar status/note or in launchctl print's "last exit" lines; or launchctl rc 113 (not loaded) AND a
  <label>.plist.disabled-* rename or an owner_note/disabled_reason. Undeclared cure value -> ValueError -> exit 2. On Pro a
  renamed-away plist is a visible owner-cured dead organ; Mini keeps the disabled exemption.
  scripts/healer_run_checks.py: registry-summary (dead, session-curable, ids; non-str/undeclared cure rejected) and
  home-fork-summary (drifted, session-curable, ids, session-curable ids; live path uid 0 or not writable = owner; stat error
  and a line without a judgeable live path = session; malformed report rejected).
  infra/launchagents/wrappers/pro-healer.sh: receptor A spawns on dead_session > 0 (reason registry:<k>/<n>-session-curable),
  else one skip line; exit 1 with no dead organ or a malformed report = registry-receptor-broken. Receptor C reads
  lint_home_fork.py --check --json (stderr to run.log, verdict logged), spawns on session-curable drift (reason
  home-fork-drift:<k>/<n>-session-curable), else one skip line; malformed JSON or rc 1 with no breach =
  home-fork-receptor-broken. The memo state carries diverged probes id:cure, drifted pairs path:cure and the three counts.
  scripts/healer_memo.py: fingerprint = dead (id, cure, recovery_action, label) + diverged probe id:cure + drifted pair
  path:cure + session-curable counts + receptor-broken tokens + new arsenal deaths; age bucket, status and note removed.
  scripts/proprioception.py: unchanged (Codex's widening reverted).
  Tests: branch tables in test_healer_receptor_disabled_plist.py, test_healer_run_checks.py, test_healer_memo.py and
  wrapper rows in test_pro_healer_receptors.py (the #7995 swap-cures memo test restored).
