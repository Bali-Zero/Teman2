dissent:
  - seat: kimi-code/k3 (refutation round)
    objection: >-
      auth-sentinel's third state is unreachable for per-probe failures: scripts/auth_sentinel.py:97 catches
      every probe exception, main() is "exit 0 sempre" (:439-441), so a missing `claude` binary yields an
      UNKNOWN row and rc=0, and the wrapper heartbeats ok. Only an uncaught crash outside run_all reaches the
      rc!=0 branch.
    status: CONFIRMED
    disposition: >-
      The defect of the finding (the wrapper's `|| true` hiding a crash of the sentinel PROCESS) is cured and
      proven. The deeper point is real and is OWED, not widened: making the sentinel's own UNKNOWN/NOT_FOUND
      rows count would change the sentinel's documented output contract and needs a ruling on what fraction of
      UNKNOWN probes is "the sentinel is blind". Depth-1 rule: not stacked on this PR.
  - seat: kimi-code/k3 (refutation round)
    objection: >-
      The ALARM marker certifies the alarm branch, not the dispatch: send() swallows dispatch exceptions
      (llm_burn_alarm.py:421-424), so a dead notifier prints the marker, rc=1, and the note says "ALARM
      dispatched". Pre-existing semantics.
    status: CONFIRMED
    disposition: Owed (note wording, producer side). Not a regression, and the status stays ok as before.
  - seat: kimi-code/k3 (refutation round)
    objection: >-
      error is consumed as dead by the healer registry (healer_receptor_registry.py:198), and both
      pro.llm_burn_alarm and auth-sentinel carry recovery_action launchctl_kickstart, so one crashed tick gets
      a live organ re-run by the healer; organism_stale_detector files it as unhealthy without paging.
    status: CONFIRMED
    disposition: >-
      Accepted: that is the existing reader doing its job on the new truthful status; the action is a forced
      extra run of an interval job, not destructive, and nobody is paged. Recorded so the consumer is named.
  - seat: kimi-code/k3 and codex O3 (council)
    objection: >-
      receptor-broken should be report-only and never spawn a paid healer session each tick.
    status: PLAUSIBLE
    disposition: >-
      Not adopted: the registry-receptor exit 2 precedent in the same script spawns, and the healer session is
      the cure path for a broken receptor. Pro has the memo; Mini healer-run.sh does not (owed).
