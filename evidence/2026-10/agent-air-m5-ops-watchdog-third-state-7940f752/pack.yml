decisions:
  - id: D-rule
    decision: >-
      One rule for all three: the probe's own failure (crash, missing or unparsable output, non-zero exit that
      is not the "found something" code) is a third state, heartbeat status error with a note, never ok and
      never alarm. Council (Kimi k3, Codex O3) agreed on status error, on wrappers keeping exit 0 (the readers
      read sidecars, not launchd rc), and on not building the cure on Telegram, which is dead fleet-wide.
  - id: D-healer
    decision: >-
      Receptor 2 on both healers: a non-zero proprioception exit or an unparsable, schema-less or empty report
      becomes the ACTIONABLE reason proprioception-receptor-broken, the same semantics as registry receptor
      exit 2. healer_run_checks.py now raises on an unreadable report (exit 3) instead of returning 0. The
      Pro twin drops its inline python, which read only the legacy `verdict` key, so it never counted a
      divergence in the current `status` schema.
  - id: D-marker
    decision: >-
      Burn alarm: rc=1 means ALARM only with the output marker `llm_burn_alarm: ALARM` (logged only on that
      path, scripts/llm_burn_alarm.py:497). Codex O3 proposed moving ALARM to rc=10 so that exit space alone
      separates it from a crash; rejected because it changes the producer's contract and every caller of it
      in one PR, and a marker needs no producer change. A failed cd is rc 70, error.
  - id: D-exit0
    decision: >-
      Wrappers keep exit 0. auth_sentinel_cron.sh states the contract ("never fail launchd noisily on a
      monitoring cron") and its FATAL branch already does exit 0 with heartbeat error; the brief asked for a
      non-zero exit only "where the scheduler or the heartbeat reader expects one", and neither does.
