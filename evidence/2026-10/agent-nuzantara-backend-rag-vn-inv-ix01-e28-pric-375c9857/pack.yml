dissent:
  - seat: "self (no external red team spent: test-only change that mirrors the red-teamed test_e23_family_pricing.py of PR 8304)"
    objection: "The end-to-end walk is the offshore_invest_pt_pma_full_capital corpus walk; if the interview corpus changes the sibling candidates E28B, E28D, E28F may stop appearing, and the sibling assertion would go red for a reason unrelated to pricing."
    status: PLAUSIBLE
    disposition: "Accepted and stated. The sibling check asserts E28B, E28D and E28F are present AND unpriced because that is what the corpus produces today; a corpus change that drops them should make whoever changes it re-read this pin, not silently lose the unpriced guarantee. The direct unit-level pins (every E28B/C/D/F has no pricing_key, CONTACT_REQUIRED, no amount) do not depend on the walk."
