    disposition: "CURED by narrowing the claim. Real as a claim, rejected as a test. The claims are narrowed in the test docstring and the PR body to the backend wire (name, status, reason, hash). The CONTACT_REQUIRED-to-advisor mapping is one generic branch of the mouth engine-adapter (not E28-specific), owned by the mouth suite (engine-adapter.test.ts, duration.test.ts pins the exact EN advisor sentence); a TypeScript test inside a backend test-only PR would break one-PR-one-concern and widen the verification to vitest and tsc. A residual gap remains and is recorded: the Bahasa advisor sentence on the CONTACT_REQUIRED branch has no exact-text pin in the mouth suite; it is a mouth-lane follow-up, not E28."
