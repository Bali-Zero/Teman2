    disposition: "Accepted and stated. The sibling check asserts E28B, E28D and E28F are present AND unpriced because that is what the corpus produces today; a corpus change that drops them should make whoever changes it re-read this pin, not silently lose the unpriced guarantee. The direct unit-level pins (every E28B/C/D/F has no pricing_key, CONTACT_REQUIRED, no amount) do not depend on the walk."
  - seat: "codex gpt-5.6-sol, rollout rollout-2026-10-12T14-04-48-01a12eb6-b562-7d63-a84a-51a41d882ed5"
    objection: "MEDIUM: the test does not prove the trust chain or the pack that is actually active; select_highest_repository_pack takes the highest sequence, verify_rule_pack does not check previous_payload_sha256, and the end-to-end run swaps the DB binding, so a signed-but-not-activatable pack could become the reference and the trust-chain and live wording is unsupported."
    status: CONFIRMED
    disposition: "CURED. Real. The fixture now verifies the predecessor (found by sequence, not name) and runs validate_activation on the highest pack over it (sequence, previous_payload_sha256 chain, environment, engine range); guilt twins refuse a wrong predecessor hash and a non-increasing sequence. The docstring no longer says live or trust chain through verify_rule_pack alone: it states the pin is the repository's highest activatable pack, that the DB-active pack is a database fact this file does not read, and that the end-to-end walk stands the DB binding in."
  - seat: "codex gpt-5.6-sol, rollout rollout-2026-10-12T14-04-48-01a12eb6-b562-7d63-a84a-51a41d882ed5"
    objection: "MEDIUM: the client-facing EN/ID claims are not covered end to end; the test stops at the backend JSON and never crosses the TypeScript adapter or the rendered copy."
