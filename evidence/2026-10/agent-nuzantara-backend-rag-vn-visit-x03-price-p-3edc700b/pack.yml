decisions:
  - id: D-pin-amounts-typed
    decision: >-
      The nine amounts are typed in the test, not read from the row they guard; A1 is pinned as a real zero
      (an AVAILABLE signed quote with amount 0), and duration or validity is deliberately not pinned.
dissent:
  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-12T13-20-15-01a12e8d-eb12-7aa3-97c2-f9af67d26eff.jsonl)"
    objection: "MEDIUM: the test called resolve_candidate_pricing and build_price_quote directly; run_evaluation, candidate selection, quote attachment, persistence and display were never exercised, so an unreachable product or a quote dropped from the response stayed green."
    status: RETRACTED
    disposition: "Cured in the follow-up commit: eight of the nine codes are driven by the real interview-corpus walk that names them through the real run_evaluation (real verify, compile, price, seal, projection; only the retention gate, the pack binding and the decision writer are replaced), asserting the quote in the sealed decision, the persisted row and the public response and the display row hash; BRIDGING uses the census recipe at engine level (the funnel never asks which permit is wanted, owner ruling D4). Edited-row and prose-row twins prove a moved amount or a dropped quote turns it red. Partial dissent on the display amount: for these nine products the display carries pricing status and row hash only (no duration options), so the amount the client renders is the response decision quote, which is what is pinned."
  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-12T13-20-15-01a12e8d-eb12-7aa3-97c2-f9af67d26eff.jsonl)"
    objection: "MEDIUM: the no-PNBP-split guard was only price.endswith(' IDR'); structured pnbp, government_fee, service_fee fields and split wording passed, and a live counterexample still resolved AVAILABLE 2300000."
    status: RETRACTED
    disposition: "Cured: _split_findings refuses unknown keys, a price that is not one grouped IDR amount, a second figure or PNBP/fee-split wording in client-visible fields, with guilt twins for each shape across all nine rows, innocence over the nine real rows (the A1 and B1 notes that merely state inclusion stay clean), and the red-team counterexample pinned as a witness that the resolver alone does not see a split."
  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-12T13-20-15-01a12e8d-eb12-7aa3-97c2-f9af67d26eff.jsonl)"
    objection: "LOW: the docstring claimed trust-chain and anti-rollback verification, but verify_rule_pack checks one envelope and the fixture picks the highest file, not the active database binding."
    status: RETRACTED
    disposition: "Cured: the claim is dropped; the docstring now states signature, protected header and payload hash of one envelope, and says plainly that the previous-payload chain (validate_activation) and the database-active pack are not claimed."
  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-12T13-20-15-01a12e8d-eb12-7aa3-97c2-f9af67d26eff.jsonl)"
    objection: "LOW: the words 'signed quote' are inaccurate; build_price_quote returns a plain PriceQuote that the test never seals."
    status: RETRACTED
    disposition: "Cured: renamed to a quote built from the signed product; the sealing claim now lives only in the end-to-end test, which asserts decision_integrity is present on the response."
  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-12T13-20-15-01a12e8d-eb12-7aa3-97c2-f9af67d26eff.jsonl)"
