decisions:
  - id: D-pin-amounts-typed
    decision: >-
      The nine amounts are typed in the test, not read from the row they guard; A1 is pinned as a real zero
      (an AVAILABLE signed quote with amount 0), and duration or validity is deliberately not pinned.
dissent:
  - seat: "none dispatched: a test-only mirror of the cured pattern of PR 8304 (verified-pack fixture, row-identity rewire twins); the final on-disk gate is left to a fresh seat"
    objection: "Residual: the end-to-end run_evaluation walk and the mouth rendering of the price are not covered here; the evaluate body carries pricing status and the quote carries the amount, and the E23 file already holds the end-to-end pattern."
    status: PLAUSIBLE
    disposition: "Stated limit, not cured: the visit codes have no single priced walk in the interview corpus that surfaces all nine, so the pin sits at the resolver and the signed-quote boundary; a mouth render pin would be a separate PR."
