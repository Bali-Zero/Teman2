seat_fallback_reason: >-
  Kimi K3 (titolare) was unavailable: its 5-hour window was exhausted at ~08:00Z (403, campaign
  addendum 3) and not expected back before ~13:00Z; agy reads BUSY (the owner's windows). DeepSeek v4
  Pro sat the refuter chair in round 1 so that three families answered sealed.
what_changed: |
  claude-cascade.sh: OAUTH_SLOT_SEATS=(A1 A5 A3 A4 A2 AZ) (index = token slot, pinned to the registry);
  cascade_attempt_log writes `[cascade-attempt] v=1 job slot seat class rc dur_s src` at every exit
  of try_claude (answered / ledger skip / retryable / non-zero exit / empty / hop failures) and at the
  retired-slot `continue`; cleanup_cascade captures `$?` first and writes `[cascade-result] v=1 job
  slot seat rc` once per run. attempt_failure_class names timeout from a flag run_bounded sets on its
  two timeout paths, else auth_dead (AUTH_PATTERN or the new ORG_DISABLED_PATTERN), else rate_limited
  (QUOTA_PATTERN), else other; it reads stderr from the file and stdout only when the whole stdout is a
  diagnostic (existing envelope rule or the org-disabled banner), never through a pipe. The job name is
  CLAUDE_CASCADE_JOB, else the caller's entry-point basename, else the launchd label, validated whole.
  No retry predicate, return code, slot order or stdout byte changed. Header no longer lists token_2.
  Gate cure (B1): the rate_limited class also reads `hit your (<word> )?limit`, so the CLI session-limit
  banner logs rate_limited on stdout exit 0, stdout exit 1 and stderr exit 1 (QUOTA_PATTERN itself unchanged).
  Naga (owner-appointed reviewer) is mailed after PR-open; not recorded as a seat.
dissent:
  - seat: tp1-qwen3.8-max (r1) vs codex-gpt-5.6-sol (r1)
    objection:
      "Non-zero-exit stdout. Qwen (r1): stderr only. Codex (r1): only under strict envelope validation.
      Taken: Codex's rule. Stderr-only would hide the very org-disabled slot this PR exists for if the
      CLI prints it on stdout; innocence test: a failed attempt whose stdout is prose about a weekly limit
      classifies `other`."
    status: PLAUSIBLE
  - seat: codex-gpt-5.6-sol (r1) + tp1-qwen3.8-max (r2)
    objection:
      "Guard-cap INCOMPLETE logged `answered`. Codex (r1) and Qwen (r2): log it `other`. Rejected:
      the class reports the SEAT's outcome (what the owner rotates on); the seat answered and its stdout
      is what the caller got with rc 0. The incomplete MANDATE keeps its existing `[cap]` line and HIGH
      escalation; calling it `other` would make a healthy seat look broken."
    status: PLAUSIBLE
  - seat: codex-gpt-5.6-sol (r1, r2, cure review) + tp1-qwen3.8-max (r1)
    objection:
      "Job name from the caller. Codex (r1/r2) and Qwen (r1): operator allowlist only. Rejected
      as stated (no caller sets CLAUDE_CASCADE_JOB, so every line would read job=unknown); cured instead:
      entry point only, option/assignment/URL words refused, value validated whole. Two reproductions (URL
      argument, -Xtenant= option) are now tests, RED before their cures."
    status: CONFIRMED
  - seat: tp1-qwen3.8-max (r2)
    objection:
      'Qwen (r2): a pre-dispatch global-deadline refusal logged `timeout` "lies". Kept: the job''s
      time budget expired (dur_s=0 shows nothing ran); the old stderr calls the same event "quota/auth failure".'
    status: PLAUSIBLE
  - seat: codex-gpt-6.1-sol (gate-cure review, O2)
    objection:
      "Codex (cure review, minor): stderr prose like 'if you hit your session limit, wait' or the word
      'limitation' now reads rate_limited. Kept: stderr is the diagnostic channel and QUOTA_PATTERN already
      reads 'weekly limit' on stderr the same way; the class drives no retry; stdout prose stays `other`
      (innocence test failed_attempt_prose_mentions_session_limit)."
    status: PLAUSIBLE
refuted:
  "Refuted by execution, not withdrawn by the seat (kept out of dissent): Qwen (r2) claimed zsh
  treats a quoted `=~` RHS as a literal so every job reads unknown. Refuted by execution: test_job_name_is_validated_whole_never_rewritten[indexing-daily-run.sh]
  and every golden record (job=golden-job) pass. || DeepSeek (r1) D1 assumed the org pattern was added
  to a retry predicate; it is not — innocence test answer_with_org_text_on_stderr stays `answered` on
  the same seat."
owed:
  - Exit-0 org-disabled banner on stdout is accepted as an answer today (behaviour defect; separate PR that changes retry).
  - '{"error":null,...} answers match the JSON envelope rule and rotate (existing retry over-match; separate behaviour PR).'
  - No existing report or probe reads the new lines (only two wrappers mention the `used:` line, in comments); a reader (per-seat last class across ~/logs on Pro) is owed — not built here.
  - WR2 wrapper classification (dux-wr2class), slot order/rotation (owner), the 18 other readers of slot 2 — out of scope.
  - Delivery to Pro ~/scripts/claude-cascade.sh is manual. Today it equals the base wrapper (blob 19b74bf33f, mtime 2026-10-05T10:46:08Z); after merge cp + cmp -s. Pro callers that run the wrapper from $REPO_ROOT are not covered by that step (gate N3).
  - "Gate N1: under a UTF-8 locale, a FAILED attempt whose stdout has invalid bytes adds 2 `tr: Illegal byte sequence` lines to stderr (the class's tr pipeline and the pre-existing envelope check it calls); stdout, calls and rc unchanged. One LC_ALL=C on the new pipeline leaves 1 line (measured), so the fix is owed."
  - "Gate N3: 684 net lines, over the ~400 contract (code+tests 427, the rest golden fixture and pack)."
  - "Codex (cure review, minor): `hit your 5-hour limit` (digits) is matched neither by the class nor by the pre-existing stdout envelope."
