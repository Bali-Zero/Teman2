  [cascade-attempt] and per-run [cascade-result] stderr lines in claude-cascade.sh, class named at
  try_claude's existing return-code branches, slot->seat pinned to FLEET_TOPOLOGY by test, golden
  fixture recorded on the pre-change wrapper. Mission CASCADEOBS-20261005, gear 3 = measured floor.
  Gate N2, stated as found: the build overlapped council round 1 (tests ran 10:52:12Z, before the last
  round-1 answer at 10:53:54Z), so round 1 is partly post-hoc for the scaffold; round 2 refuted the built diff.
  Gate-cure round (2026-10-06, Dux dux-cascadeobs2): final gate BLOCK B1, one commit.
