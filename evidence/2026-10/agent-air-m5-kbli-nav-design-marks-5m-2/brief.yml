task_id: kbli-nav-design-marks-5m-2
mission: kbli-nav-design-loop (Track A, build, PR 5m' — the ledger band and the live sheet arm in png_census)
colour: BLUE
gear: 2
gear_reason: >-
  Depth-1 cure of the #8292 gate BLOCK (lead ruling 2026-10-12, gate comment 6114335941): C24 passed with the ring on any other
  row of 56101, because nothing named the row. #8292 is frozen; this PR is its commits plus the cure, from a fresh origin/main.
  Harness-only arming of an already-merged surface (after #8290 merged as 452bad3b4c): the ledger's elements are marked for
  png_census and its checks are armed on the bands that carry them. No fact, verdict, cap, basis, title, reason or string
  changes; the marks draw nothing (CENSUS_IDENTITY proves it byte for byte). The glyph and the map (2b), the choreography,
  ribbon and hover (2c), the keys (2k) and the basis plate (M6) are separate PRs.
l_level: L1
gate_class: opus
objective: >-
  One concern: the ledger's elements name themselves (ladder, matrix, matrix.head/.chip, cap, chip.national, chip.bali,
  bali.label, headsup and its label/sentence, ring, detail, hint), after any offset or Beat, and png_census arms C11, C12, C13,
  C14, C21 and C23 on the sheet-ledger bands and a new C24 (the selection cue: the shown cell's ring is the accent on all
  4 sides, sits on the chip of the row the detail shows, is clear of what lies beside it, and the hint is drawn iff the record
  offers more than one cell) on the expanded live sheet, flat and immersive; every armed check has a guilt that FAILs on a
  real render, not only a synthetic one.
constraints:
  - No fact, verdict, cap, basis, title or reason changes; no string is added; no colour changes.
  - A mark draws nothing: the render set is byte-identical with and without the collector.
  - A mark sits after any .offset or Beat, so the frame says where the element lands.
acceptance:
  - text: The collector SHALL draw nothing.
    probe: "Pro: CENSUS_IDENTITY=1 IMM=1 render_set.sh, 91 PNGs byte-identical with and without the collector"
  - text: The armed bands SHALL pass on the real renders, and the census SHALL FAIL a real render that carries the guilt.
    probe: "Pro: png_census.py on the 91-PNG set 0 FAIL; mutant builds with an env switch, one render per guilt (4 pt gap, no ring, a clear ring, a hint over one cell, no hint over many, serif(24) sentence, ladder 9 pt off, a tone the record disagrees with): each rc 1 naming the cause, the control rc 0"
  - text: A single-record band that arms C23 SHALL carry a record with all three axes, and the live sheet SHALL write its record.
    probe: "Pro: png_census.py selftest RECORD cases (three axes passes, one axis FAILs naming it); registry-sheet JSONs carry national, bali, headsup, cells"
  - text: The ring, the cell detail and the chip SHALL name one row, the ring SHALL surround that chip, and every cell SHALL have its chips marked.
    probe: "Pro: mutant builds with env switches: the ring on k0 and k5 of 56101 (immersive and flat), on the lower chip of 85510 night, displaced onto the chip below with its mark left or moved with it, and only the shown chip marked (03300, 85510 night): each rc 1 naming the cause; the control rc 0"
  - text: A chip's own colours touching it SHALL fail C11, and a plane's gradient SHALL NOT turn a figure into the ground.
    probe: "Pro: png_census.py selftest (a chip with its colours attached on both sides FAILs; the cap passes on imm/sheet-ledger-day-en, where the surface has no commonest colour)"
