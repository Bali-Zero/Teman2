# Written by the imperator session (Claude Opus 5.5, M5), verifier and shipper. The port is a Claude Sonnet builder
# session's; the council cures are the imperator's. Every receipt is a command this writer ran on 2026-10-09; scratch
# under ~/.agent/campaign-20261005/work/imperator-minimemo/ and work/build-mini-memo/ (not committed).
