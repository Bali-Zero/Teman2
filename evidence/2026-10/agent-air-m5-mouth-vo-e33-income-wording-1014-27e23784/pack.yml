    decision: >-
      The observer scans the adapter source for banned phrases (now including the hyphenated income-or-allowance)
      outside comment lines, checks each of the 14 E33 sentences (EN and ID, both dynamic branches) on its own line against
      its expected wording, then runs the adapter test file with the four retirement-income pin tests required as run, so
      reverting the wording turns it red.
