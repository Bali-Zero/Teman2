decisions:
  - id: D-reporting-wording
    decision: >-
      The E33_EMPLOYMENT_NOT_COVERED change from "permission" to "reporting" is kept: the fact registry entry
      e33_not_work_visa (confirmed, live fetch 2026-10-13) quotes "pelaporan rangkap kegiatan ke kantor imigrasi
      yang menerbitkan izin tinggal" and says E33E carries the same sentence (doctrine cards E33.md:62-64,
      E33E.md:57-58). The copy says only "report to Immigration", without the issuing-office detail.
  - id: D-business-meetings-unrendered
    decision: >-
      business_meetings renders nothing (UNRENDERED_PROHIBITED_ACTIVITIES, no copy). The pack lists it on A1/B1/C1/C6
      but the official C1 page, doctrine cards CL-A1B1-01 and tests/scripts/test_c1_c6_price_descriptions.py
      (KNOWN_DIVERGENCE) say those visas allow business meetings, negotiations and signing. The pack field is a
      seq-30 correction item; until then the result must not contradict the price catalogue.
  - id: D-census-floor
    decision: >-
      EXPECTED_TESTS in observe_visa_oracle_replay_pins.py goes 252 to 255 because the lane adds tests to pinned
      files; the new copy census test file is covered by its own observer, not by the pins.
