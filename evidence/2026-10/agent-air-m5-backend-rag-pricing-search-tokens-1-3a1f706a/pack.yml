decisions:
  - id: D-word-not-substring
    text: Descriptive text matches by word (prefix of 3+ characters or with a digit; a row word of 4+ characters prefixing the token only with a closed light-suffix remainder; inside-word only for tokens of 5+ characters), never as an arbitrary substring.
  - id: D-keyword-phrase
    text: Curated multi-word keywords count only when the whole phrase is in the query; single-word keywords never match inside a word. The Alcohol License rows gain keywords alkohol and beralkohol.
  - id: D-acronym-aliases
    text: itas to kitas, itap to kitap, tka to rptka, because the old substring match found them and clients type them.
  - id: D-negators-and-empty
    text: non, tanpa, senza and without drop the next word; hyphen compounds match as phrases; an empty query returns no rows (all nine callers checked, none relies on all-rows).
  - id: D-driving-license-out-of-scope
    text: '"driving license" still returns the alcohol rows through the word "license" in their names; license family out of scope per the spec, reported.'
