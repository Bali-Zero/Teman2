  No new owner ruling: the matching cure the PR 8633 gate asked for (its finding 1-2), written as a
  spec because the fix-of-a-fix depth on this surface was reached. Catalog content untouched.
mission: >-
  A client's price question gets the rows it names, not rows that happen to contain its short
  words as substrings; curated keywords stop widening unrelated queries.
