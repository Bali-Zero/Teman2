decisions:
  - id: D-word-not-substring
    text: Descriptive text matches whole words; prefix only for tokens of 4+ characters or containing a digit (keeps e33 -> e33g, visa -> visas).
  - id: D-keyword-phrase-in-query
    text: Curated keywords match only as whole phrases contained in the query, so one shared word never widens a query.
  - id: D-driving-license-out-of-scope
    text: '"driving license" still returns the alcohol rows through the word "license" in their names; out of scope per the spec, reported.'
