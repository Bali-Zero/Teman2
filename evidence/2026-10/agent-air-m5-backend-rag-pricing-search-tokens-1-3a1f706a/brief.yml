task_id: pricing-search-tokens-1017
gear: 2
l_level: L2
gate_class: opus
objective: >-
  PricingService.search_service stops including a row when a query token is merely a SUBSTRING
  of the row text. Descriptive text matches by word (prefix only for tokens of 4+ characters or
  containing a digit); curated keywords match only as whole phrases contained in the query; short
  function words join the noise list. Spec: docs/specs/2026-10-17-pricing-search-token-matching-spec.md.
  This is the spec-level cure after two catalog-side corrections (PR 8632 blocked, PR 8633
  merged with a residual over-match measured by its gate).
acceptance:
  - text: >-
      A committed 86-query corpus (EN/ID/IT, codes, WhatsApp-style sentences) passes in both
      directions: every must-find row is found, every must-not row is absent (incl. alcohol rows
      for "izin usaha minuman ringan", "PIRT minuman", "berapa biaya NIB ke OSS", "SLHS as a
      restaurant").
    probe: cd apps/backend-rag && PYTHONPATH=. .venv/bin/python -m pytest -p no:cacheprovider backend/tests/services/pricing/test_search_token_matching_1017.py
  - text: >-
      Existing pricing tests and the catalog decision pins stay green; no corpus query gains a
      row; every row lost is a substring-only match, listed and justified in the PR.
    probe: cd apps/backend-rag && PYTHONPATH=. .venv/bin/python -m pytest -p no:cacheprovider backend/tests/services/pricing
assumptions:
  - text: >-
      The WhatsApp bot passes the client's message to search_service (wa_package_builder.py ~717),
      so fewer spurious rows means a cleaner price context; a query with no real match now yields
      no rows instead of substring noise.
    status: verified
    probe: "PR 8633 gate (wa_package_builder.py:717-718); before/after table in the PR body"
appetite:
