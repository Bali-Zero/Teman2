    cmd: python3 scripts/ci/observe_visa_check_catalogue_e33.py
    result: "observe_visa_check_catalogue_e33: 55 passed in 0.12s; E33 and E33G catalogue notes hold"
    exit: 0
    ts: "2026-10-14T02:09:16Z"
    seat: claude-sonnet-5-5 (verifier of the gemini-4-argon-high build)
  - claim: Whole visa_check backend test directory green after the fix round.
    cmd: cd apps/backend-rag && .venv/bin/python -m pytest backend/tests/services/visa_check -p no:cacheprovider
    result: "488 passed in 10.75s"
    exit: 0
    ts: "2026-10-14T02:09:16Z"
    seat: claude-sonnet-5-5 (verifier of the gemini-4-argon-high build)
decisions:
  - id: D-stored-visa-checks-untouched
    decision: >-
      Stored visa_checks database rows are left untouched as historical records; no migration or data
      backfill is performed.
  - id: D-endpoint-retire-owner-decision
    decision: >-
      Whether to retire POST /api/visa/match now that the UI door /visa/match is a 308 to /visa-oracle
      is an owner decision not taken here; this change repairs the catalogue notes and purposes served
      by the live endpoint.
  - id: D-other-fields-untouched
    decision: >-
      duration_days, extensions and min_budget_idr on E33 and E33G are left untouched; the audit finding's
      min_days, max_days and cost_label do not exist on VisaMeta.

