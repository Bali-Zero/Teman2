ruling: >-
  Zero, 2026-10-14 audit plan (entry CAT-visa-check-e33-e33g, follow-up to PR17 D-catalogue-followup) —
  the legacy visa_check catalogue's E33 and E33G notes and E33G purposes must follow the signed rulepack
  (seq-29) and saved official imigrasi.go.id pages: dual-activity (rangkap kegiatan) reporting for E33,
  annual foreign salary/income proof of at least USD 60,000 a year (no savings claim) and WORK_REMOTE-only
  purpose for E33G.
mission: >-
  The legacy visa_check catalogue's E33 and E33G notes and E33G purposes follow the signed rulepack
  and official pages: dual-activity (rangkap kegiatan) reporting for E33, annual salary/income proof
  of at least USD 60,000 a year (not savings) and WORK_REMOTE-only purpose for E33G.
