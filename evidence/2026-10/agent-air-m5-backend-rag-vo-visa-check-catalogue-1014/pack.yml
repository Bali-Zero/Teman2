    role: build
    seat: gemini-4-argon-high via agy (build, prepare-only) with the Claude driver; worktree backend-rag-vo-visa-check-catalogue-1014 on M5.
  - lane: red-team-opus
    role: review
    seat: claude-opus-5-5 adversarial review, read-only, head c22fd7de70.
  - lane: red-team-codex
    role: review
    seat: gpt-5.6-sol via codex exec, read-only, session rollout-2026-10-14T05-42-48-01a13737-d484-7d70-886b-36176c5df0f7.jsonl.
  - lane: cat-visa-check-e33-e33g-ground-truth
    role: ground_truth
    seat: >-
      ACTIVE signed pack apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-029.signed.json
      (seq-29), where rule el.e33g.remote-work requires {"fact": "work.annual_foreign_income_usd", "op": "gte",
      "value": 60000} (yearly income, not savings), hf.e33g.annual-income-below-minimum is lt 60000, the E33G
      product has covered_purposes ["REMOTE_WORK", "TOURISM", "FAMILY"] and prohibited_activities including
      "indonesian_company_ownership", and hf.e33g.local-company-ownership excludes on investment.pt_pma_committed;
      research/visa/2026-07-24-w2-factbase-e33.md:131 quoting the official E33G page verbatim:
      "Rekening bank yang membuktikan penghasilan berupa gaji atau penghasilan senilai paling sedikit US$60.000
      per tahun"; and research/secondhome/e33-fact-registry.json fact e33_not_work_visa (JELAS, fetched
      2026-10-13) stating for the E33 page that "work, study or other activities are allowed only after
      rangkap-kegiatan (dual-activity) reporting to the immigration office that issued the stay permit".
    nb: apps/backend-rag/backend/services/visa_check/catalogue.py
    note: >-
      nb identifies the modified target file in the repository. Normative sources are in-tree:
      apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-029.signed.json,
      research/visa/2026-07-24-w2-factbase-e33.md:131, and research/secondhome/e33-fact-registry.json
      (fact e33_not_work_visa).
pii_scan: clean
bites:
  consumer: >-
    match_tree._reason() via recommend_visa() behind POST /api/visa/match on nuzantara-rag (reading
    VISA_META[E33].notes, VISA_META[E33G].notes and VISA_META[E33G].purposes). The UI door /visa/match
    has been a 308 to /visa-oracle since 2026-08-25, so the remaining callers are direct API calls and
    any new stored result. Post-merge live verification on nuzantara-rag is a read-only in-container
    probe via fly ssh console (no DB write, unlike POST /api/visa/match which inserts a visa_checks row).
  where: ci
  observe: python3 scripts/ci/observe_visa_check_catalogue_e33.py
  expect: "contains:E33 and E33G catalogue notes hold"
