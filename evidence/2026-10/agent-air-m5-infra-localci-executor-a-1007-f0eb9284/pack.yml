dissent:
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER: a declared tool version does not authenticate the host tool — a fake actionlint earlier on PATH (relative or inside the candidate) reporting 1.7.12 would be probed and then run as a trusted host check."
    status: CONFIRMED
    resolution: "A pinned tool that resolves relative or inside the candidate worktree is never probed (BLOCKED); its realpath and sha256 are pinned at plan time and re-checked before it runs (gone -> BLOCKED, changed -> ERROR). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR: the sandbox gets raw blobs while GitHub's checkout applies .gitattributes conversions (working-tree-encoding reproduced with cat-file --filters): a candidate can make the hosted guard crash while the local one is green."
    status: CONFIRMED
    resolution: "Any changed .gitattributes in the diff keeps a contained green from being claimed (BLOCKED). BASE's .gitattributes carries only merge=union and binary, which convert nothing. Corpus row."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR: actions/setup-python is ignored — Merah Putih pins 3.12, the image was 3.11; a candidate failing only on 3.12 is a FALSE_GREEN."
    status: CONFIRMED
    resolution: "A setup-python pin must name the interpreter the steps run under (image PYTHON_VERSION for container, the coordinator for host), else BLOCKED. Image moved to python 3.12; R1's 3.11 pin matches the host venv. Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR: duplicate step names collapse in by_name and a BASE step is silently skipped (reproduced: planned=1, hosted_first_rc=1). Gemini found the same."
    status: CONFIRMED
    resolution: "A BASE job with duplicate step names plans BLOCKED. Corpus row."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR: job/workflow defaults.run.working-directory ignored, and the host executor ignored the step cwd (reproduced). Gemini found the same."
    status: CONFIRMED
    resolution: "cwd = step working-directory, else the job/workflow default, validated to stay inside the tree; both executors honour it. Corpus rows (resolver and a host job run)."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR: bash -c is not GitHub's script-file shell (BASH_SOURCE differs, reproduced)."
    status: CONFIRMED
    resolution: "A verbatim body is written to a file and run with GitHub's own templates: `bash -e {0}` when shell is unspecified, the pipefail form for `shell: bash`; any other shell plans BLOCKED. Corpus row."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR: a step killed by a signal is reported FAIL by the driver."
    status: CONFIRMED
    resolution: "Signal -> junit error type=signal, driver rc 4, verdict ERROR (no verdict on the candidate). Classifier rows."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR: step if: conditions are neither evaluated nor blocked."
    status: PLAUSIBLE
    resolution: "Running a step GitHub might skip can only add red: a hosted red comes from a step that also runs locally unless the matrix marks it not_applicable with a written reason. The condition is now recorded per step (if_not_evaluated) and the argument is an assumption in the brief, with the observation that would refute it."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: a workflow env PYTHONPATH merged into a host step lets a pinned tool spawn python that imports candidate modules."
    status: RETRACTED
    resolution: "trusted_env() already drops PYTHONPATH, PYTHONSTARTUP, PYTHONHOME, PYTEST_ADDOPTS and PYTEST_PLUGINS after the merge and sets PYTHONSAFEPATH=1. Proven with a corpus row: a workflow setting PYTHONPATH/PYTHONSTARTUP plans them and no host process sees them."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR: env_fingerprint omits contained_steps, so an image change would not stale a PASS."
    status: RETRACTED
    resolution: "contained_steps is in CANDIDATE_KINDS, whose first env_fingerprint branch records image_id and the docker identity; the seat saw the diff only, not that unchanged branch."
residuals:
  - "On a PR head (not a merge_group commit) hosted catE runs the #40c model judgment with a vendor key and the PR-scoped prose scan; the local run has no counterpart for the first — a FALSE_GREEN there is possible and is listed in the matrix's parity_gaps."
  - "Contained verdicts stay candidate-produced (junit written inside the sandbox), as trusted_pytest was before: a deliberately malicious candidate can forge its own contained green, exactly as it can make its own hosted job exit 0."
  - "test_the_real_matrix_accounts_for_every_step… reads workflows outside the hosted localci-tests path filter: a later workflow change is caught by `plan` (BLOCKED), not by that test. Widening the filter is a workflow edit, outside this mandate."
  - "PR size: +840/-185 lines before this pack (runner +307/-20, steps_driver +87, test_contexts_exec +324, matrix +91/-159, README +25), about 655 net — above the ~400 guide; the split the mandate named (A1/A2) is kept and this half is not divisible without shipping a planner no context uses."
