brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-EXECUTOR phase A, handed by the team lead of Zero's session on 2026-10-07 ("make the local CI
  fully operational, no excuses"); this pack is PR-A1 (planning mechanism + R1 + actionlint + Merah Putih + catE).
  Design anchor: docs/specs/localci-gate-2026-10-06.md §4 sequence step 3.
lanes:
  - lane: localci-executor-a-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux of LOCALCI-EXECUTOR, M5; heavy execution on Pro over ssh)"
  - lane: localci-executor-a-redteam
    role: review
    seat: "codex-gpt-6.1-sol (codex:codex-rescue runtime, read-only, default-to-defective)"
  - lane: localci-executor-a-refuter
    role: review
    seat: "agy-gemini-3.1-pro (agy --sandbox --model gemini-3.1-pro-high, prompt-only, diff inlined)"
  - lane: localci-executor-a-final-gate
    role: review
    seat: "claude-opus-5-5 (fresh session outside the chain, commissioned by the team lead on the committed sha)"
council_run: council-journal.jsonl
seat_override: >-
  Two external families reviewed the candidate (OpenAI Codex, Google Gemini 3.1 Pro), but only one line counts for
  R9: the Codex home's configured default is gpt-6.1-sol (~/.codex/config.toml, codex-cli 0.160.1) while the roster
  names codex-gpt-5.6-sol, so the Codex line is journalled under its true name and does not qualify — the same
  position PR #7991's pack took. The seat was not renamed to fit the roster.
seat_fallback_reason: >-
  The reserve agy-gemini-3.1-pro stood in because both remaining titular seats were dead at dispatch
  (scripts/arsenal_probe.py --seats kimi,tp1-qwen3.8-max, 2026-10-07T03:55:06Z on M5): kimi QUOTA_DEAD
  (membership quota, transition TIMEOUT -> QUOTA_DEAD), tp1-qwen3.8-max QUOTA_DEAD (HTTP 429, monthly plan quota,
  reset 2026-10-11 16:00 UTC).
pii_scan: clean
pii_scan_note: Runner code, a contexts matrix, tests and GitHub check metadata only; no client data was read or written.
what_changed: |
  scripts/localci/runner.py (v0.4.0): plans one check per `mapping: executed` context (local.check = ctx.<slug>).
  resolve_steps maps EVERY step of the BASE copy of the workflow job (argv / verbatim run: body / not_applicable
  with reason); unmapped, not_run, duplicated, expression-bearing or continue-on-error steps plan BLOCKED.
  plan_context_check: where=host -> kind trusted_steps (BASE copies of judges under python -I, or a tool whose
  -version equals the BASE pin and which resolves outside the candidate, its sha256 pinned; trusted, sealed, run
  before candidate code); where=container -> kind contained_steps (candidate sandbox, BASE trusted_files laid
  over, merge_group environment, setup-python pin checked against the image). A green while the candidate
  rewrites a trusted file, the workflow or a .gitattributes is BLOCKED. Step results land in receipts and status.
  scripts/localci/steps_driver.py (new): runner-owned, sha-pinned; one junit testcase per step, rc/junit cross-checked.
  scripts/localci/candidate.Dockerfile: python 3.12 (ubuntu-latest's python3, the MP/catE interpreter).
  scripts/localci/contexts_matrix.yaml: R1, actionlint, Merah Putih, catE rewritten to the step map; executed now
  means the runner executes it; never_claim_parity_for = exactly the other ten (suite-checked); parity_gaps added.
  scripts/localci/README.md, tests/test_contexts_exec.py (new), fixture_repo.py, test_runner.py (version, trust kinds).
proof: |
  See receipts. Nothing in this change posts a status, edits branch protection, touches a workflow or arms the
  adapter. Before it: agreement=0/14 on hosted-green main commits (spec §2). After it, measured on Pro: 4/14 AGREE
  with 0 FALSE_GREEN on three distinct hosted-green main commits, and each of the four contexts RED on a
  deliberate violation (five guilt candidates) while the other three stay green.
bites:
  consumer: >-
    scripts/localci/hosted_compare.py run on Pro over a local run of a hosted-green main commit (the comparator
    that spec §4 makes the only place a local claim is stated).
  observation: >-
    Pro, 2026-10-07 04:27Z, runner at 19137db (sha256 8acf38ba…) on 01d1241330 (base 1df44b9b65), live GETs:
    AGREE for R1 gate, actionlint, Merah Putih and catE-sovereignty-lint; agreement=4/14 false_green=0 false_red=0
    local_blind=10 hosted_pending=0, exit 0. Same on 1df44b9b65 and d961f053b4.
