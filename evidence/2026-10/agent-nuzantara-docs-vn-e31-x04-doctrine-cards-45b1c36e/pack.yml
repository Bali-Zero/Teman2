    cmd: pdftotext -layout Permenkumham-22-2023.pdf and read Pasal 33, 43-50
    result: "angka 4 and Pasal 46: no age/marital limit; angka 6 and Pasal 48: none; angka 7 and Pasal 49: 21 (dua puluh satu) tahun atau lebih"
    exit: 0
    ts: "2026-10-13T09:30:00Z"
    seat: this session
  - claim: "The official E31D, E31F and E31G page snapshots (seq-28 reattest text) state no age or marital limit."
    cmd: grep -n -i -E 'usia|umur|belum kawin|21|18 \(' research/visa/2026-10-11-organ-reattest-seq28/text/{50457cd0,f9306203,86880290}-*.txt
    result: "no age or marital-status line on any of the three pages"
    exit: 0
    ts: "2026-10-13T09:35:00Z"
    seat: this session
  - claim: "Permenimipas 5/2025 Pasal 1 repeals Permenkumham 36/2021 (ditetapkan 7 February 2025, effective on promulgation)."
    cmd: pdftotext -layout Permen-Imipas-5-2025.pdf and read Pasal 1-2
    result: "Pasal 1: dicabut dan dinyatakan tidak berlaku"
    exit: 0
    ts: "2026-10-13T09:40:00Z"
    seat: this session
