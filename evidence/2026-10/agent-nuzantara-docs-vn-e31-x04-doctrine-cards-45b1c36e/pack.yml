gear: 1
brief_ref: evidence/brief.yml
ruling: >-
  Visa-night family "e31", plan entry E31-X04 (findings F045, F144, F145): the doctrine cards contradicted the regulation text
  on E31D (age/marital gate), left E31G's child-age rule as a GAP, did not record that E31F has no age limit, and did not
  record that the E31B page document list and the 36/2021 Penjamin instrument are repealed. Docs-only; no owner decision.
mission: >-
  The four E31 doctrine cards say only what the cited regulation and the official pages say.
lanes:
  - lane: e31-x04-doctrine-cards
    role: build
    seat: Claude Opus 5.5 session on Pro (worktree docs-vn-e31-x04-doctrine-cards).
  - lane: e31-x04-doctrine-cards
    role: review
    seat: Codex gpt-5.6-sol read-only red team (generator is not grader); model verified in the rollout file.
pii_scan: clean
bites: >-
  Consumer: whoever reads these cards as input to a pack fold or an engine change. No code parses the cards (claim_ledger.py
  parses the claims/*.md ledgers, not cards/*.md); the readers are the /visaoracle corner skill and the seq-29 author, and
  apps/mouth/.../fact-mapper.ts points at E31B.md section 4 in a comment. Observation: after merge, a grep of
  research/visa/doctrine-factory/cards/E31D.md on origin/main finds no sentence proposing `applicant.age < 18` as a gate and
  finds the "Age limits. None." paragraph in section 3.10; E31G.md section 3.4 contains "21 (dua puluh satu) tahun atau lebih".
results:
