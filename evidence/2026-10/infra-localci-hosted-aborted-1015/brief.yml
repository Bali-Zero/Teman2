gear: 2
l_level: L1
gate_class: opus
objective: >-
  READY went false at 21:08Z with false_green=2, one context counted twice (the live context-level FALSE_GREEN and
  the recorded one kept): PR #8514, Backend Tests (Python), LocalCI OK/executed/full against a hosted check run
  cancelled because actions/checkout hung 15 min in setup and every later step was skipped. No hosted test logic ran.
  Phase F would not have merged (hosted_required_green is in GATE), so it was a READY-liveness hole. B27 adds a
  hosted reading HOSTED_ABORTED ("no hosted verdict") in hosted_compare.compare() and merger.reclassify_recorded():
  not compared, not AGREE, not FALSE_GREEN, counted and listed apart (pr, head, context, check_run_id, step). It
  applies only when every red run of the context is a check run concluded cancelled, whose annotations are the job
  timeout (and at most the runner's cancel line), whose job maps step for step onto ONE workflow job read at the
  job's head_sha, whose cancelled step is a setup step by its uses repository (checkout, setup-python, setup-node,
  cache, download-artifact), with only setup steps or success/skipped before it and everything after it skipped.
  Anything unreadable or ambiguous keeps the class. GATE, hosted_required_green, phase_f_arming and the tick's merge
  criterion are untouched. The report prints false_green as pr-level + context-level + recorded, and keeps the
  phase E READY line format. The gear-2 verdict is not asserted here; a fresh Opus gate reads the diff.
residuals:
  - >-
    Rule 4 as first written (every earlier step a setup step) would NOT have classified #8514: its job ran a run step,
    "Assert every upstream job succeeded", before the hung checkout. The rule now also allows a run step that came before
    the first successful checkout (empty workspace, no repository code judged); a run step after a checkout still blocks it.
  - Beyond the brief, the PR-level class follows the contexts (spec A6) - the owner's request named only the context
    and recorded levels; without it an open PR whose only hosted red is a setup hang still froze READY at the PR level.
  - The workflow file is read at the check run's head_sha, not the pull_request merge ref the hosted run executed; a
    base that changed the workflow after the branch point reads a different file and, on any step/name mismatch, fails closed.
  - An aborted context is no longer a compared context, so a decision with one aborted context among 12 can fall below
    the compared-merge threshold (12 contexts, 11 full) and not count toward READY until the job is re-run.
  - HOSTED_ABORTED is wired at report time only; the tick's journalled hosted_compare still shows such a row as FALSE_GREEN
    (it carries the new class count at 0) and is cleared by the report's recorded re-read, which needs the cancelled attempt
    to stay listed (filter=all).
  - Two more GitHub GETs per candidate red (job, annotations; cached and shared with B12b) and one per recorded cancelled
    row (the attempts of the head).
