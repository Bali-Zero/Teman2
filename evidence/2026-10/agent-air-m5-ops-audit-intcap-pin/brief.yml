task: >-
  Two bounds of scripts/secrets_permissions_audit.py's design-tokens classifier were not pinned by CI (final gate of
  #8163, notices N1/N2): on Python 3.11 the interpreter's own int-string cap hides the module's 4300-digit bound, so
  dropping parse_int=_bounded_json_int stayed green; and no test accepts a file of exactly DESIGN_TOKENS_MAX_BYTES, so
  a cap off-by-one survived. Pin both with tests; the module is unchanged.
lane: ops
machine: m5
date: 2026-10-09
gear: 2
gear_reason: >-
  Measured floor 1 (one test file). Campaign rule after #8079: at least gear 2 so harness-floor holds for the
  independent final gate.
acceptance:
  A1:
    text: >-
      With the interpreter's int-string cap disabled for the test (sys.set_int_max_str_digits(0) where it exists), a
      4300-digit integer still classifies as design tokens and a 4301-digit one does not; dropping parse_int or raising
      the bound turns the test red.
    probe: scripts/tests/test_secrets_permissions_audit.py (run by immune-enforcement), and the same against mutant copies.
  A2:
    text: >-
      A benign tokens.json of exactly DESIGN_TOKENS_MAX_BYTES bytes classifies as design tokens and one byte more does not;
      a cap that rejects at >= turns the test red.
    probe: the same file and a mutant copy.
