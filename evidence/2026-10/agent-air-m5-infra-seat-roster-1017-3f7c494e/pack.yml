dissent:
  - seat: codex gpt-5.6
    objection: |-
      BLOCKING: scripts/lib/claude_seat.sh:191 _claude_seat_is_retired_value only guards the legacy fallback; the runner loop (:178) and the picker (:281) accept slots 1/5/6 without comparing them to retired values. Reproduced on Bash 3.2: _1 equal to _3 is queued by the runner and selected by the picker.
    status: CONFIRMED
    disposition: >-
      Reproduced on disk by reading claude_seat.sh at 70901350f7: only the legacy branch called the helper. Cured in 4d94f23c75 by skipping a retired value in both numbered loops; new negatives test_claude_seat_pick.sh case 8 (picker) and test_claude_seat_helper.sh closed-account loop (runner, slots 2/3/4, aliased into slot 1 and the legacy name) are green.
  - seat: agy gemini
    objection: |-
      NON-BLOCKING 1: same claude_seat.sh gap as codex (numbered slots not compared to retired values). NON-BLOCKING 2: _claude_seat_load_secrets returns early when CLAUDE_CODE_OAUTH_TOKEN is already set, so a caller exporting a retired legacy token while the retired numbered vars live only in the secrets file is not recognised as retired. NON-BLOCKING 3: stale prose in FLEET_TOPOLOGY.json (_invariants[0] rotation, A5 retired_note, tail of the owed-readers entry).
    status: CONFIRMED
    disposition: >-
      1 cured with the codex finding (4d94f23c75). 3 cured in the following docs commit. 2 is real but needs a caller that exports a dead legacy token itself without the retired numbered vars; it was the pre-existing behaviour for the legacy name and fails open only to a closed (dead) token, so it is recorded here and left for the operator cure (delete the three secrets lines), not widened into this PR.
  - seat: kimi-code/k3
    objection: |-
      NON-BLOCKING: value-alias inversion. Dedup is value-based with retired values seen first, so an operator who aliases a LIVE slot to the same value as a retired slot (TOKEN_1 equal to TOKEN_2) now has the live slot skipped too; before this change first-seen-wins kept it.
    status: CONFIRMED
    disposition: >-
      Confirmed and accepted as the price of the fail-closed requirement: the registry says slots are distinct accounts, so a live slot sharing a value with a closed one is a misconfiguration, and skipping it is the safe side (the same shape the 2026-10-05 council required for claude-cascade.sh). Recorded; no code change.
