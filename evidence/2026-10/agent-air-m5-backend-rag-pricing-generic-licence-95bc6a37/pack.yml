decisions:
  - id: D-generic-trade-fallback
    text: >-
      An all-noise query that holds a generic trade word (license, licence, licensing, sell or a
      light-suffix form) is generic and gets no whole-query fallback, so it matches no row; every
      other all-noise query keeps the fallback unchanged.
  - id: D-alcohol-keywords-owner
    text: >-
      bar, birra, vino and minol join the keywords of the three Alcohol License rows by owner
      ruling; bar is three letters, so it matches by equality only; keywords only, no price, name
      or note changed.
  - id: D-sell-side-effect
    text: >-
      Bare sell/selling also stop returning C1 Tourism, C6 Social Activity, E33 Second Home and
      E33E rows that merely carry the sale word; under the ruling the word names no service, and
      mixed queries with a distinctive word are unchanged.
