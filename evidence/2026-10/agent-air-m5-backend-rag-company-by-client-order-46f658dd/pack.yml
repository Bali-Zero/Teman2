brief_ref: evidence/brief.yml
plan_ref:
  "team-lead dispatch (2026-10-02, BLUE, Dux): PR-1 = deterministic order of the by-client company
  listing, primary first then a stable tiebreak; guilt = primary not first in storage comes back
  first, innocence = single link unchanged. task-id company-by-client-order, lane backend-rag."
lanes:
  - lane: company-by-client-order
    role: build
    seat:
      "claude-opus-5-5 (Dux: read the route, its twin and the link schema, wrote the real-Postgres
      tests first, ran them red, added the ORDER BY, ran them green and against two mutants)"
  - lane: company-by-client-order-spalla-codex
    role: review
    seat: "codex default model, read-only sandbox, env -i, high effort (not-ok: 3 MEDIUM on the tests, 0 on the SQL)"

pii_scan: clean
pii_scan_note:
  "Fixtures use placeholder company names and an example.invalid address; the spalla prompt carried
  only this diff. No PROD read or write."

diff:
  net_lines: |
    One SQL line in company_router.py, one new test module, this brief and pack. Totals are not
    declared: the pack is part of the diff it would count.
  behaviour_change: >-
    GET /api/crm/companies/by-client/{client_id} now returns rows ORDER BY
    COALESCE(ccl.is_primary, FALSE) DESC, ccl.id: primary links first, then link-id order, NULL
    is_primary treated as not primary. Response fields unchanged.

receipts:
  - claim: "RED before the fix: the unordered query returns heap order; 3 order tests fail, the single-link innocence test passes."
    cmd: "TEST_DATABASE_URL=postgresql://postgres@localhost:55432/nuzantara_test PYTHONPATH=. pytest backend/tests/unit/app/modules/crm/test_company_by_client_order.py (ORDER BY line removed)"
    result: "3 failed, 1 passed — [1,2,3]!=[3,1,2]; [1,3,2]!=[2,3,1]; [2,3,1]!=[1,2,3]"
    exit: 1
    ts: "2026-10-02"
    seat: claude-opus-5-5
  - claim: "MUTANT: the twin endpoint's `ORDER BY ccl.is_primary DESC` (no NULL handling) puts a NULL row ahead of the primary."
    cmd: "same module with `ORDER BY ccl.is_primary DESC, ccl.id`"
    result: "2 failed, 1 passed — [1,3,2]!=[3,1,2]"
    exit: 1
    ts: "2026-10-02"
    seat: claude-opus-5-5
  - claim: "GREEN with the fix (test_primary_link_comes_first_even_when_inserted_last, test_several_primary_links_keep_link_id_order, test_without_a_primary_links_come_back_in_link_id_order, test_single_link_is_returned_unchanged), together with the existing mock-based company router tests; no throwaway database left behind."
    cmd: "same env, pytest test_company_by_client_order.py test_company_router.py; psql count of company_by_client_test_% databases"
    result: "58 passed; 0 leftover databases"
    exit: 0
    ts: "2026-10-02"
    seat: claude-opus-5-5
  - claim: "ruff check + format --check on both changed Python files; docs_sync --diff reports no drift."
    cmd: "ruff check ...; ruff format --check ...; python3 scripts/docs_sync.py --diff"
    result: "All checks passed; 2 files already formatted; No changes."
    exit: 0
    ts: "2026-10-02"
    seat: claude-opus-5-5
  - claim: "Spalla round 1 on the diff."
    cmd: 'env -i PATH=... HOME="$HOME" codex exec --skip-git-repo-check -s read-only -c model_reasoning_effort=high - < prompt.txt'
    result: "SEAT-VERDICT: not-ok (3 MEDIUM on tests; INFO: ORDER BY correct and fully deterministic, no response-contract change)"
    exit: 0
    ts: "2026-10-02T10:21:49Z"
    seat: codex

dissent:
  - seat: codex
    objection: "MEDIUM test:95 — pool creation and schema setup ran before the cleanup try, so a failure there leaks the throwaway database."
    status: CONFIRMED
    resolution: "Fixed: pool creation and schema now sit inside the try; teardown closes the pool only if it exists."
  - seat: codex
    objection: "INFO — several primary links not covered."
    status: CONFIRMED
    resolution: "Fixed: test_several_primary_links_keep_link_id_order added; red on the unordered query, green on the fix."
  - seat: codex
    objection: "MEDIUM test:151 — red without the fix depends on the plan (seq scan of the link table) and was shown on PG17, not PG15."
    status: PLAUSIBLE
    resolution: "Accepted: with the fix the order is fully deterministic, so the green cannot flake; the red is demonstrated on three distinct heap layouts. The test schema has no index on client_id, so the filter is a seq scan."
  - seat: codex
    objection: "MEDIUM test:98 — rebuilding the DSN by splitting at the last '/' drops query parameters."
    status: PLAUSIBLE
    resolution: "Accepted: same idiom as test_wa_meta_inbox_onconflict.py; the CI DSN carries no query parameters."

sibling_check:
