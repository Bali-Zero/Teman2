  Mandate LOCALCI-SOVEREIGN step B11, from the lead's message of 2026-10-09 (rule B11 RULED by the lead after the report on Pro showed
  17 of 26 merged PRs merged onto a main that had moved), to the Dux implementer, from origin/main 4443d209f1, 90-minute budget.
  Build only; a separate session gates and ships.
lanes:
  - lane: localci-b11-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux implementer, M5; Pro and GitHub not touched)"
pii_scan: clean
pii_scan_note: Merger code, tests on synthetic git repos under tmp, a README paragraph and a spec paragraph. PR numbers are the repository's own metadata; no client data was read or written.
what_changed: |
  scripts/localci/merger.py: decide takes an optional replay (merge_commit, schedule): the candidate is the merge commit, the BASE its
  first parent, the hosted comparison is read on the merge commit's sha without a stale judge, and nothing is enqueued or rehearsed;
  the line is a decision with replay true, merge_commit, schedule. replay_pending picks the oldest merge commit on the mirror's
  first-parent line since the journal's first PR decision whose subject ends (#N) and which GitHub confirms (merged, merge_commit_sha
  equals the commit); an unconfirmed commit is journalled once (skipped replay_unmapped), an ERROR replay is retried once. tick
  alternates: a replay when the previous decision was not one, or when no PR is waiting. triage ignores replay lines. queue_sha returns
  the merge commit for a confirmed replay, else the head. The report marks replay rows, skips the stale reclassification for them,
  counts a PR once, and prints and records replays and compared_merges_from_replays (a PR that qualified before its merge is not
  credited to the replay).
  README and spec: the replay, the alternation and the measurement. Tests: test_replay.py (8), 6 in test_merger_report.py, and
  FakeRunner now binds the status to the decision in progress. 12 mutant rules in their own block after the B10 rules.
  4b806bcf0c (fix) and 65b139224a (test) are the fix round after the lead's gate at c2fc46c875 (CONFIRMED, five LOWs): decide
  journals ANY non-Stopped failure of a replay (subprocess.TimeoutExpired included) as its ERROR decision line with replay and
  merge_commit, recorded as `<Type>: <msg>` when it is not a gate error, so the alternation advances and the two-attempt bound
  holds; Stopped still propagates and a PR decision keeps its rule (MergerError/OSError its ERROR line, anything else to the
  tick). The report lists a replay's recorded FALSE_GREEN under kept with why "replay: the same tree on both sides, never stale".
  The test fixture's M1 is now a real two-parent merge whose second parent is a confirmed `(#14)` commit with another matrix.
  README: merged_here holds while GitHub's merge_commit_sha for the PR still equals the replayed commit at report time. Spec:
  FALSE_GREEN 0 moved out of the per-merge threshold parenthesis, stated as phase D's global READY term. 6 new mutant rules.
proof: |
  Every behaviour is produced by the committed code on fixtures under tmp (real git repos with merge commits, GitHub and the runner
  faked); nothing ran on Pro and nothing was pushed. It reaches Pro when the tick next extracts merger.py from main.
