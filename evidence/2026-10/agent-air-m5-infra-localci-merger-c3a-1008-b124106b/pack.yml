  - "B1 (#8032) open at this pack's writing: the first merger tick after B1 merges must show 'Harness floor recompute' AGREE on a gear >= 2 PR through --pr-number; observe it on the live journal and comment it on this PR."
  - "C3a-2: the enqueue path per the lead's ruling (consent label set by a maintainer, the no-local-red criterion of ruling A — no FAIL/ERROR/STALE/BLOCKED check, review.independent the only QUEUED, every executed required context OK, every other context named with its mapping, executed_required on the line —, GitHub's required checks green on the head, GraphQL enqueuePullRequest with expectedHeadOid, never PUT, one enqueue per (pr, head), the queue entry followed from issue events) and its one live proof, run from main's code after its gate."
  - "After merge on Pro: re-take the wrapper from main (copy beside, mv, cmp -s against the blob); the next tick writes ~/.nuzantara-pilots/local-ci/merger/heartbeat.sh — prove it equals main's blob and that the heartbeat lands; lint_home_fork --check for the pair."
  - "Pen residual (carried): anything the merger does on GitHub runs under the ambient gh token; only Zero's dedicated merger credential cures it. review.independent has no local seat (carried)."
