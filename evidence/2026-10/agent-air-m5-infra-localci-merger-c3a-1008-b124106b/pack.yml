dissent:
  - seat: codex-gpt-6-astra
    objection: "P1: the sweep counts 'no test ran' as a kill — with PYTEST_ADDOPTS selecting one unrelated test, pytest exits 5 on the report file and the mutant reads KILLED."
    status: CONFIRMED
    resolution: "KILLED only on pytest exit 1; exit 0 is SURVIVED and any other exit ERROR (the sweep fails); inherited PYTEST_* variables are dropped; a baseline runs for every test-file set a mutant uses. The reproduction now reports KILLED for the right reason."
  - seat: codex-gpt-6-astra
    objection: "P2: a code_sha that is a list, dict, int or bool raises TypeError while building the window's sha set or printing it, after report.json was written."
    status: CONFIRMED
    resolution: "The window's code shas are built from valid shas only; every other value is counted as invalid. Test with six odd JSON types."
  - seat: codex-gpt-6-astra
    objection: "P2: two overlapping wrappers share .heartbeat.sh.new; one can publish the other's half-written copy."
    status: CONFIRMED
    resolution: "Each run extracts into its own mktemp file and moves it only when non-empty; a failed extraction removes it. launchd never overlaps the job, but a hand run beside it can. Test: no temp copy left behind."
  - seat: codex-gpt-6-astra
    objection: "P2: an empty heartbeat cache runs as a silent no-op — no heartbeat, no diagnostic."
    status: CONFIRMED
    resolution: "An empty library counts as absent (said on stderr) and an empty extraction is never published. Test parametrised absent/empty; mutant killed."
  - seat: codex-gpt-6-astra
    objection: "P2: no case just under 14 days — `compared_days >= 13.999` survives the report tests."
    status: CONFIRMED
    resolution: "The readiness matrix carries 50 merges over 14 days minus one second (NOT READY); the boundary mutant joins the table and is killed."
  - seat: agy-gemini-3.1-pro
    objection: "MINOR: a test with no compared merge stays green if AND becomes OR again."
    status: PLAUSIBLE
    resolution: "That test was never the guard; the readiness matrix is — (50, 14 days minus one second) and (50, 0 days) fail under OR, and the ready-either mutant is killed in the sweep."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR: on a host that never ticked, the kill switch or a missing variable leaves the organ silent, where the checkout's library used to beat."
    status: PLAUSIBLE
    resolution: "True for the first run of a new host only, and kept on purpose: running heartbeat.sh from a checkout is what N4 removes, and extracting before the kill switch would make the switch touch git. The wrapper says 'no heartbeat library' on stderr and the organ reads stale, the fail-safe signal; Pro already holds an extracted copy after its first tick. Documented in the README."
  - seat: agy-gemini-3.1-pro
    objection: 'BLOCKER: r["code_sha"] raises KeyError for journal lines without the key.'
    status: RETRACTED
    resolution: "The rows are built by the report itself with code_sha always present (d.get('code_sha')); the provenance test journals a decision without the key and the report exits 0 counting it."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR: merger.py mutants paired with test_merger.py pass vacuously because those tests use a fake merger.py; sh-code-flag-always survives."
    status: RETRACTED
    resolution: "Only the wrapper tests use a fake interpreter; the tick tests run the real module loaded from scripts/localci/merger.py (of the temporary copy). Measured: all four code-sha mutants and sh-code-flag-always are KILLED in the 45/45 sweep (the older-merger test ticks a main without the flag)."
  - seat: agy-gemini-3.1-pro
    objection: "Round 2 (c4b9a8cd0d) BLOCKER: a HOSTED_RED_MERGED class overriding classify() hides a decision FALSE_GREEN when the local gate passed what the merge commit failed."
    status: CONFIRMED
    resolution: "hosted_red_merged is no longer a class: classify() decides the row, and the hosted red merge is listed apart (b042083b22, then read per merged PR at 08648551e5). Mutant hosted-red-merged-overrides-class was killed before the shape changed."
  - seat: agy-gemini-3.1-pro
    objection: "Round 2 MAJOR: a merged candidate whose merge commit has not reported reads GREEN."
    status: CONFIRMED
    resolution: "Merging is no verdict: PENDING. The C2b test that pinned 'merged at the decided head = GREEN even before its queue commit reports' is inverted; mutants merged-pending-is-green and merged-red-is-green killed."
  - seat: agy-gemini-3.1-pro
    objection: "Round 2 MAJOR: the substring probe for --pr-number fires on a comment or a string and misses single quotes."
    status: CONFIRMED
    resolution: "The probe parses the BASE runner with ast and counts only an add_argument call naming the flag; nine runner-source variants (double and single quotes, comment plus help string, another flag, p.error, unparsable, not UTF-8, absent) and four mutants."
  - seat: agy-gemini-3.1-pro
    objection: "Round 2 MAJOR: a context FALSE_GREEN on a hosted red merge still blocks READY, against 'never a blocker'."
    status: RETRACTED
    resolution: "Intended and now worded so: the hosted red by itself never blocks; a context the local gate passed and the merge commit failed is a local false green on the very candidate GitHub tested, which is what phase E exists to catch. The parametrised test pins both sides (local FAIL: READY; local OK: NOT READY, rc 1)."
  - seat: claude-opus-5-5
    objection: "Self-found on the live journal at b042083b22: the decision-level flag never fires for #8026, the case that motivated it — decided on base 53de39e6a07c, merged on 9068e322b6f9, so its row is judged on its green head."
    status: CONFIRMED
    resolution: "08648551e5 reads the merge commit of every PR the window decided that GitHub merged; the live report lists #8026 (antidotes). Test with #8026's exact shape; mutant hosted-red-merged-compared-only killed."
  - seat: agy-gemini-3.1-pro
    objection: "Round 3 (08648551e5) MAJOR: a PR merged in the window whose decisions all fall before the window is never read."
    status: PLAUSIBLE
    resolution: "Scoped on purpose: the instrument compares the merger's decisions, and a merge the merger never decided in the window is evidence about neither gate. The README now says 'every PR the window decided that GitHub merged'."
  - seat: agy-gemini-3.1-pro
    objection: "Round 3 MINOR: an empty required set makes github_side GREEN without evidence."
    status: RETRACTED
    resolution: "hc.required_names refuses an empty required set (exit 2) before github_side runs, for the row sha and the merge commit alike."
  - seat: agy-gemini-3.1-pro
    objection: "Round 3 MAJOR: an add_argument('--pr-number') on another subcommand than plan would pass the flag to plan, rc 2, ERROR decision."
    status: PLAUSIBLE
    resolution: "Kept: the consequence is a loud ERROR on every decision of the first tick, never a silent verdict; the only runner that declares the flag (B1, #8032) declares it on plan; B2 makes the runner BLOCK when the number is absent."
  - seat: agy-gemini-3.1-pro
    objection: "Round 3 MINOR: removing ValueError from the probe's except survives."
    status: CONFIRMED
    resolution: "The reachable ValueError is UnicodeDecodeError on a BASE runner that is not UTF-8 (a null byte is SyntaxError on 3.11); case and mutant pr-number-undecodable-crashes added at 0bdf56f75d, killed."
owed:
