dissent:
  - seat: codex-gpt-6-astra
    objection: "P1: the sweep counts 'no test ran' as a kill — with PYTEST_ADDOPTS selecting one unrelated test, pytest exits 5 on the report file and the mutant reads KILLED."
    status: CONFIRMED
    resolution: "KILLED only on pytest exit 1; exit 0 is SURVIVED and any other exit ERROR (the sweep fails); inherited PYTEST_* variables are dropped; a baseline runs for every test-file set a mutant uses. The reproduction now reports KILLED for the right reason."
  - seat: codex-gpt-6-astra
    objection: "P2: a code_sha that is a list, dict, int or bool raises TypeError while building the window's sha set or printing it, after report.json was written."
    status: CONFIRMED
    resolution: "The window's code shas are built from valid shas only; every other value is counted as invalid. Test with six odd JSON types."
  - seat: codex-gpt-6-astra
    objection: "P2: two overlapping wrappers share .heartbeat.sh.new; one can publish the other's half-written copy."
    status: CONFIRMED
    resolution: "Each run extracts into its own mktemp file and moves it only when non-empty; a failed extraction removes it. launchd never overlaps the job, but a hand run beside it can. Test: no temp copy left behind."
  - seat: codex-gpt-6-astra
    objection: "P2: an empty heartbeat cache runs as a silent no-op — no heartbeat, no diagnostic."
    status: CONFIRMED
    resolution: "An empty library counts as absent (said on stderr) and an empty extraction is never published. Test parametrised absent/empty; mutant killed."
  - seat: codex-gpt-6-astra
    objection: "P2: no case just under 14 days — `compared_days >= 13.999` survives the report tests."
    status: CONFIRMED
    resolution: "The readiness matrix carries 50 merges over 14 days minus one second (NOT READY); the boundary mutant joins the table and is killed."
  - seat: agy-gemini-3.1-pro
    objection: "MINOR: a test with no compared merge stays green if AND becomes OR again."
    status: PLAUSIBLE
    resolution: "That test was never the guard; the readiness matrix is — (50, 14 days minus one second) and (50, 0 days) fail under OR, and the ready-either mutant is killed in the sweep."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR: on a host that never ticked, the kill switch or a missing variable leaves the organ silent, where the checkout's library used to beat."
    status: PLAUSIBLE
    resolution: "True for the first run of a new host only, and kept on purpose: running heartbeat.sh from a checkout is what N4 removes, and extracting before the kill switch would make the switch touch git. The wrapper says 'no heartbeat library' on stderr and the organ reads stale, the fail-safe signal; Pro already holds an extracted copy after its first tick. Documented in the README."
  - seat: agy-gemini-3.1-pro
    objection: 'BLOCKER: r["code_sha"] raises KeyError for journal lines without the key.'
    status: RETRACTED
    resolution: "The rows are built by the report itself with code_sha always present (d.get('code_sha')); the provenance test journals a decision without the key and the report exits 0 counting it."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR: merger.py mutants paired with test_merger.py pass vacuously because those tests use a fake merger.py; sh-code-flag-always survives."
    status: RETRACTED
    resolution: "Only the wrapper tests use a fake interpreter; the tick tests run the real module loaded from scripts/localci/merger.py (of the temporary copy). Measured: all four code-sha mutants and sh-code-flag-always are KILLED in the 45/45 sweep (the older-merger test ticks a main without the flag)."
owed:
  - "C3a-2: the enqueue path per the lead's ruling (consent label set by a maintainer, the no-local-red criterion — pending the lead's answer on contexts mapped blocked —, GitHub's required checks green on the head, GraphQL enqueuePullRequest with expectedHeadOid, never PUT, one enqueue per (pr, head), the queue entry followed from issue events) and its one live proof, run from main's code after its gate."
  - "After merge on Pro: re-take the wrapper from main (copy beside, mv, cmp -s against the blob); the next tick writes ~/.nuzantara-pilots/local-ci/merger/heartbeat.sh — prove it equals main's blob and that the heartbeat lands; lint_home_fork --check for the pair."
  - "Pen residual (carried): anything the merger does on GitHub runs under the ambient gh token; only Zero's dedicated merger credential cures it. review.independent has no local seat (carried)."
