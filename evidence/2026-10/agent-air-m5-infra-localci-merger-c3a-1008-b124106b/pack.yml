what_changed: |
  scripts/localci/merger.py (report): READY = 0 FALSE_GREEN AND >= 50 compared merges AND >= 14 days between the first
  and the last compared merge (was OR); decisions without a valid code_sha of any JSON type are counted, never refused,
  and the window lists valid shas only; the last line's age is clamped at 0 and future-dated lines are counted.
  scripts/localci/localci_merger_tick.sh: heartbeat.sh is extracted from the merger's mirror at the tick's resolved sha
  into a per-run temp file and published to <state-dir>/heartbeat.sh only when non-empty; exits before the extraction run
  the copy the last tick extracted; an empty library counts as absent. Nothing on the tick path reads ~/nuzantara.
  scripts/localci/tests/mutants/merger_mutants.py (new): 45 single-rule mutants of merger.py and the wrapper, applied to
  a temporary copy of scripts/localci and scripts/lib; KILLED only on pytest exit 1, ERROR on any other non-zero exit,
  STALE when a rule's text does not occur once or equals its replacement; inherited PYTEST_* options dropped.
  merger.py (report, lead's #8026 ruling): merging is no verdict — a row's GitHub side is the judged sha's required checks
  red-dominant (merge commit when the queue merged the decided candidate, else the head; a merge commit that has not
  reported is PENDING, never GREEN); the merge commit of every PR the window decided that GitHub merged is read and each one
  merged with a required check red is listed as hosted_red_merged (PR, merge commit, red contexts), one printed line each
  and a count on the phase E line, information only: a local false green on a merged candidate still blocks READY.
  merger.py (tick, lead's B1 ruling): `runner plan` gets --pr-number <N> when an add_argument call in the BASE runner's
  source names the flag (ast; a comment, a help string, another call or a source that does not parse never counts), so
  merge_group.head_ref names the PR as the queue's does; a BASE runner older than the flag is planned without it.
  The median tick prints rounded to 0.1 s. Mutant table: 56 rules.
  Tests: test_merger.py +4 cases (9 runner-source variants), test_merger_report.py +7 (one C2b test inverted: it pinned
  'merged at the decided head = GREEN'); README: READY rule, heartbeat source, sweep, the hosted red merge and its mechanism.
  Net size 417 added, 63 deleted (mutant table and runner 169, tests 128, README 47, code 73).
proof: |
  See receipts. Every GitHub call is still a GET through hosted_compare.gh_get; runner.py, contexts_matrix.yaml and
  hosted_compare.py are untouched; nothing is merged, enqueued, labelled or posted.
  Why GitHub merged #8026 with a required check red (GET only, 2026-10-07 18:31-18:32Z, inside the 15 minutes the lead
  allotted): main's merge-queue ruleset 19779175 `merge-queue-main` (active, no bypass actor) sets grouping_strategy
  HEADGREEN, max_entries_to_build 5, max_entries_to_merge 4, merge_method SQUASH — the UI's 'Only merge non-failing pull
  requests' turned off, under which GitHub's documentation says a pull request with failed required checks can merge as part
  of a group whose last entry passed. Ruleset 20608865 carries only deletion, non_fast_forward and copilot_code_review; the
  classic protection lists antidotes among its 14 required contexts (strict false, no app pinned, enforce_admins true).
  #8026's queue commit 2a1e00e0d3 (parent 9068e322b6f9) has one antidotes run, failure (merge_group, 16:40:57Z);
  #8027's queue commit 9637bf5a5e, parent 2a1e00e0d3, has antidotes success (16:45:39Z); both merged at 17:18:25Z. The
  local gate judges each candidate on its own. Changing the queue setting is Zero's call; nothing here touches it.
