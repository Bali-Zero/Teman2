brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-SOVEREIGN phases C-D (the merger), handed by the team lead of the 2026-10-07 mission to this BLUE Dux;
  plan docs/specs/localci-sovereign-2026-10-07.md §2, ruling docs/rules/RULINGS.md RULED 2026-10-07. PR-C3b (#8027,
  merged 9637bf5a5e, proved live on Pro) carried seven gate notices to C3a; the lead ruled N2 (READY needs both thresholds,
  stated in the spec by #8028) and ruled the enqueue path (B + ENQUEUE). Split agreed with the lead in flight: C3a-1 (this
  PR: N1, N2, N4, N5, N6) and C3a-2 (the enqueue path and its one live proof), serialized because both touch merger.py.
