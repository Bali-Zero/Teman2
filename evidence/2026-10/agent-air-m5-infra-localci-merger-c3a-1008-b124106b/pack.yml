    seat: "claude-opus-5-5 (BLUE Dux, M5 worktree infra-localci-merger-c3a-1008 and its Pro mirror; code, tests, Pro proofs, this pack)"
  - lane: localci-merger-c3a1-redteam
    role: review
    seat: "codex-gpt-6-astra (codex-companion via the codex:codex-rescue subagent, read-only, effort high)"
  - lane: localci-merger-c3a1-refuter
    role: review
    seat: "agy-gemini-3.1-pro (agy --sandbox --model gemini-3.1-pro-high, prompt-only, diff and wrapper inlined)"
council_run: council-journal.jsonl
seat_override: >-
  Two external families reviewed the candidate (OpenAI Codex and Google Gemini 3.1 Pro), but only the Gemini line counts
  for R9: the Codex runtime printed gpt-6-astra while the roster names codex-gpt-5.6-sol, so the Codex line is journalled
  under its true name and does not qualify. The seat was not renamed to fit the roster.
seat_fallback_reason: >-
  The reserve agy-gemini-3.1-pro stood in because the remaining titular seats were dead at dispatch (arsenal_probe
  2026-10-07T15:52:47Z on M5, ~/.organism/arsenal/last.json): kimi, tp1-qwen3.8-max and tp1-glm-5.2 QUOTA_DEAD. agy
  answered this review (rc 0 at 17:56:47Z).
pii_scan: clean
pii_scan_note: >-
  Code, tests and GitHub metadata only (PR numbers, shas, check names). The journal and the report carry no PR title,
  author or body; no client data was read or written.
what_changed: |
  scripts/localci/merger.py (report): READY = 0 FALSE_GREEN AND >= 50 compared merges AND >= 14 days between the first
  and the last compared merge (was OR); decisions without a valid code_sha of any JSON type are counted, never refused,
  and the window lists valid shas only; the last line's age is clamped at 0 and future-dated lines are counted.
  scripts/localci/localci_merger_tick.sh: heartbeat.sh is extracted from the merger's mirror at the tick's resolved sha
  into a per-run temp file and published to <state-dir>/heartbeat.sh only when non-empty; exits before the extraction run
  the copy the last tick extracted; an empty library counts as absent. Nothing on the tick path reads ~/nuzantara.
  scripts/localci/tests/mutants/merger_mutants.py (new): 45 single-rule mutants of merger.py and the wrapper, applied to
  a temporary copy of scripts/localci and scripts/lib; KILLED only on pytest exit 1, ERROR on any other non-zero exit,
  STALE when a rule's text does not occur once or equals its replacement; inherited PYTEST_* options dropped.
  Tests: test_merger.py +3 cases, test_merger_report.py +5; README: the READY rule, the heartbeat source, the sweep.
  Net size 269 added, 40 deleted (mutant table and runner 143, tests 77, README 30, code 19).
proof: |
  See receipts. Every GitHub call is still a GET through hosted_compare.gh_get; runner.py, contexts_matrix.yaml and
  hosted_compare.py are untouched; nothing is merged, enqueued, labelled or posted.
