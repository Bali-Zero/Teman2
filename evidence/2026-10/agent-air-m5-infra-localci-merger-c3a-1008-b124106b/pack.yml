    copy left), decided #7979 BLOCKED (hosted 7/14, 973.7 s, code_sha c5e8c27b2d0d, 16 durations) and wrote the heartbeat
    through that copy {"ts":"2026-10-07T18:28:52Z","status":"ok","note":"tick rc=0 code=c5e8c27b2d0d"}; err log empty.
    The C3a-1 report on the live journal at 18:11:22Z: 27 decisions without a valid code_sha counted, phase E NOT READY
    under the both-thresholds line, rc 0. After merge (owed): the launchd tick on main's wrapper does the same.
