decisions:
  - id: D-page-words-only
    decision: >-
      The income question and hint say income or an allowance the visitor can document, which is the page's own
      wording (Bukti penghasilan atau tunjangan). The audit's list of pension, rent and dividends and the
      employment-pay exclusion are not on the page and are not written.
  - id: D-no-figure
    decision: >-
      No digit appears in the four changed keys; a test pins it so the interview does not anchor the answer.
  - id: D-passive-aligned
    decision: >-
      The option label, the deposit-or-income option, the field label, the assumption copy and the tree label
      say income or allowance in the same PR (EN and ID), so the journey never shows passive then allowance.
  - id: D-hint-neutral
    decision: >-
      The hint says Immigration asks for documentary proof; it does not say documented income automatically
      qualifies. The basis option says only A penjamin supports my application, with no category list.
