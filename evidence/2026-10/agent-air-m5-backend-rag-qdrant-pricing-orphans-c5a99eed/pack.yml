decisions:
  - id: D-names-not-prices
    text: >-
      Orphan detection uses every catalog row name, public and internal, whatever its price.
      catalog_prices drops unpriced and duplicated names, so using it would turn the point of a
      real row into an orphan.
  - id: D-count-binds-apply
    text: >-
      --apply needs --expect-orphans N equal to the reviewed dry run's count, so a catalog that
      changed or loaded short between review and apply deletes nothing.
  - id: D-delete-only
    text: >-
      --delete-orphans refuses --create-missing, --purge-internal and --only and never applies
      price updates: one mode, one kind of write.
  - id: D-info-email-kept
    text: >-
      The older trailers keep info@balizero.com: it is the live settings.SUPPORT_EMAIL, not a
      retired address. Only the WhatsApp line was wrong, which is what the patcher rewrites.
