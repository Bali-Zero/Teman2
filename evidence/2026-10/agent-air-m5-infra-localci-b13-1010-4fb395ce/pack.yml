what_changed: |
  prune.py: builder_prune_flag reads `docker builder prune --help` once per prune run (30 s bound). flag_deprecated matches, line by
  line, our flag name plus "deprecated" or "has been changed to" (case-insensitive), over stdout+stderr of every call; deprecated_flag
  is sticky across the run's calls and `failed` names builder_prune for it. freed_gb sums prune_total_gb over the calls. After the last
  call buildx_du_gb reads `docker buildx du` (120 s bound, no --verbose) into du_gb {shared, private, reclaimable, total}.
  The size-based `ineffective` rule and builder_prune_verdict are removed. Image removal rules, floors and VM discard are untouched.
  tests/test_prune.py: the fake logs `--help` calls to a separate list (asserted exactly one per run), prints a configurable stderr
  and answers `buildx du`. Mutants: b13-deprecation-ignored and b13-deprecation-any-flag replace b13-ineffective-not-failed.
  README and spec: the entity rule, the measurements, the live numbers, the old-daemon note.
proof: |
  Tests and mutants on M5 against a fake docker; nothing ran on Pro and nothing was pushed.
bites:
  consumer: The merger tick's prune on Pro (the builder_prune object of the prune line in the journal) and the organ's failed list.
  observation: >-
    Already shown by the live call (Pro, 2026-10-10 ~04:05Z): one `-af --max-used-space 4GB` printed Total: 12.53GB where the old flag
    freed 0 B. Owed after merge, all three together: the first prune line on Pro carries builder_prune.flag "max-used-space",
