what_changed: |
  prune.py: builder_prune_flag reads `docker builder prune --help` once per prune run (30 s bound) and picks --max-used-space, or
  --keep-storage only when the help lists that and not the new flag; an unreadable help gives --max-used-space. builder_prune creates the
  journal object once (with `flag`) and records `freed_gb` from buildx's own Total: line (prune_total_gb; null when absent) per call.
  builder_prune_verdict, run after the final cache read, sets `ineffective` (rc 0, freed 0, cache after > budget + 1 GB) with a `why`;
  `failed` names builder_prune for it. Image removal rules, floors and VM discard are untouched.
  tests/test_prune.py: the fake docker answers `builder prune --help` (not logged) and prints a configurable Total:; the argv pins moved to
  --max-used-space; 14 new b13 tests. 4 b13-* mutant rules. README B13 paragraph with the measured numbers; spec addendum line.
  Shared bytes are not freeable: buildx du is not read; a call that freed anything is never flagged, so a prune that leaves the shared
  18.96 GB of a 22.83 GB cache over budget after freeing the private part is not ineffective.
proof: |
  Tests and mutants on M5 against a fake docker; nothing ran on Pro and nothing was pushed.
