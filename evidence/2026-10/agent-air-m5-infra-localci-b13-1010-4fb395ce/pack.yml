mission: LOCALCI-SOVEREIGN (phase B, step B13)
colour: BLUE
gear: 2
gear_reason: >-
  A change to the prune organ's cache cap: which docker flag it calls and when it reports failure. No hot-zone path, workflow, plist or
  wrapper change; image removal rules, floors and VM discard are untouched; the lint floor is 2.
l_level: L2
gate_class: opus
objective: >-
  The builder prune keeps the build cache at its budget and says so when it does not. buildx 0.34 turned --keep-storage into a reserved
  floor (rc 0, Total: 0B against a 22.83 GB cache on Pro). The flag is read once per prune run from `docker builder prune --help`
  (--max-used-space, else --keep-storage on an old buildx, else --max-used-space), the journal carries flag and freed_gb (buildx's own
  Total: line), and rc 0 with 0 B freed while the cache is over budget by more than 1 GB is ineffective and fails the prune.
constraints:
  - Image removal rules, floors and VM discard stay untouched.
  - A call that freed anything is never flagged ineffective; a missing Total: line or an unread cache says nothing.
acceptance:
  - text: A buildx whose help lists --max-used-space SHALL be pruned with it, and an old buildx whose help lists only --keep-storage with that; an unreadable help SHALL use --max-used-space.
    probe: "test_prune.py::test_b13_a_buildx_that_lists_max_used_space_is_pruned_with_it_and_the_line_says_so"
  - text: The help SHALL be read once per prune run.
    probe: "test_prune.py::test_b13_the_help_is_read_once_per_prune_run_not_per_call"
  - text: "buildx's Total: line SHALL be journalled as freed_gb (GB, MB, kB, 0B), null when absent."
    probe: "test_prune.py::test_b13_the_total_line_is_parsed_into_gb_and_an_absent_one_is_none"
  - text: rc 0 with 0 B freed and the cache over budget by more than 1 GB SHALL be ineffective and name builder_prune in failed; an effective or within-budget prune SHALL NOT.
    probe: "test_prune.py::test_b13_a_prune_that_exits_0_frees_0_b_and_leaves_the_cache_over_budget_is_ineffective_and_failed"
