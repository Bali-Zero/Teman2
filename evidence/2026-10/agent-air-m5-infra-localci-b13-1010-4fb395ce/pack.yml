task_id: localci-b13-1010
mission: LOCALCI-SOVEREIGN (phase B, step B13)
colour: BLUE
gear: 2
gear_reason: >-
  A change to the prune organ's cache cap: which docker flag it calls and when it reports failure. No hot-zone path, workflow, plist or
  wrapper change; image removal rules, floors and VM discard are untouched; the lint floor is 2.
l_level: L2
gate_class: opus
objective: >-
  The builder prune calls the cap flag the installed buildx still means as a cap, and says so when buildx deprecates the flag it was
  given. buildx 0.34 turned --keep-storage into a reserved floor (rc 0, Total: 0B against a 22.83 GB cache on Pro). The flag is read
  once per prune run from `docker builder prune --help` (--max-used-space, else --keep-storage on an old buildx, else
  --max-used-space); a call whose output has a line naming the flag we passed with "deprecated" or "has been changed to" sets
  deprecated_flag and fails the prune. The journal carries flag, freed_gb (the sum of buildx's Total: lines) and du_gb (docker buildx
  du, a measurement). No size-based verdict: BuildKit's cap accounting is opaque.
constraints:
  - Image removal rules, floors and VM discard stay untouched.
  - freed_gb and du_gb are measurements and never a failure; only a deprecation line naming our flag fails the prune.
acceptance:
  - text: A buildx whose help lists --max-used-space SHALL be pruned with it, and an old buildx whose help lists only --keep-storage with that; an unreadable help SHALL use --max-used-space.
    probe: "test_prune.py::test_b13_a_buildx_that_lists_max_used_space_is_pruned_with_it_and_the_line_says_so"
  - text: The help SHALL be read exactly once per prune run.
    probe: "test_prune.py::test_b13_the_help_is_read_once_per_prune_run_not_per_call"
  - text: The exact Pro line naming --keep-storage SHALL set deprecated_flag and name builder_prune in failed; another flag's warning and a clean output SHALL NOT.
    probe: "test_prune.py::test_b13_the_exact_pro_deprecation_line_naming_our_flag_fails_the_prune"
  - text: The buildx du summary SHALL be journalled as du_gb in GB (no Shared line means private is the total), null when unreadable, and never fail the prune.
    probe: "test_prune.py::test_b13_the_buildx_du_summary_is_parsed_into_gb_and_garbage_is_none"
  - text: freed_gb SHALL be the sum of the calls' Total lines, null only when every call is unparsed.
    probe: "test_prune.py::test_b13_freed_gb_sums_the_totals_of_the_calls_and_is_none_only_if_every_call_is_unparsed"
consumer_map:
  - scripts/localci/merger.py prune (the merger tick on Pro) — the builder_prune object of the prune line in the journal, and the organ's failed list.
