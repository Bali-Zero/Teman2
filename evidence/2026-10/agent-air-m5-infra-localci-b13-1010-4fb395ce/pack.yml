residuals:
  - "Live proof on Pro is owed to the first prune after merge: the Bites observation above."
  - "freed_gb is buildx's record-size sum, not disk bytes: live, 12.53 GB 'freed' against about 2-3 GB of VM data disk (39G to 37G used)."
  - "BuildKit's cap accounting is opaque: after --max-used-space 4GB, 10.29 GB stayed reclaimable on Pro. du_gb records it; no rule judges it, so a cache above budget is never a failure by itself."
  - "An old daemon (BuildKit before 0.17) ignores max-used-space and -a then empties the cache: a rebuild cost, never a wrong verdict."
  - "A deprecation notice reworded so that it no longer says deprecated or has been changed to, or no longer names the flag, is not caught; nor is a flag re-meant in place without pflag's MarkDeprecated, or by the daemon."
  - "An OLD buildx client (help lists only --keep-storage) against a NEW daemon (BuildKit 0.17 or later) sends keep-storage, which the daemon may read as reserved-space: the same no-op as B13, with no notice. Not live on Pro (client 0.34.1)."
