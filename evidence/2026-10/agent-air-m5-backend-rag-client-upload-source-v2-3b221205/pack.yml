prove_live: |
  After the fly-deploy run for the merge commit succeeds and /health build_sha descends from it,
  read-only (nuzantara_readonly):
    SELECT d.id, d.uploaded_source, (d.uploaded_by IS NOT NULL) AS has_uploader,
           d.document_category, d.created_at
    FROM practice_required_documents prd
    JOIN documents d ON d.id = prd.uploaded_file_id
    WHERE d.created_at > '<deploy finished, UTC>'
    ORDER BY d.created_at DESC;
  Expected: every row has has_uploader = true; a row created by a portal client session reads
  uploaded_source = 'client'; a row created by a staff session reads 'team'; a passport reads
  'personal'. Correlate client vs staff from the API audit trail by id only.

