objective: >-
  SPEC-swiftui §3.2 and §4. SearchListView's browse mode becomes set A's filter-rail table: a 248 pt rail on wash with the
  stacked pickers and a PadiLine pair; a display(64) "Codes"/"Kode" header with the census; a 2 pt structure rule; the
  column header; and wrapping rows with opaque chip(tone) verdicts, riskChip risk cells, lineSoft rules and group breaks.
  It carries B2/N4 (risk tiers by fill weight, including the sheet's matrix legend and cells), B4 (png_census C8 counts
  only row rules, narrow judged, xxl VACUOUS), N8 (white-scan escapes and comment consistency) and N9 (byte-equal frozen
  predicates), plus the #8196 gate's bindings: contenttest's per-view mustNotRead (`.judul` in SearchListView), census rows
  for the ruled heads-up label, the 16 pt field-to-PadiLine gap, the census column's trailing 32 pt, and a caption that
  repeats the rail picker's truncated sector label in full. Presentation only: no KBLI fact, verdict, cap, basis or Bali
  overlay changes.
