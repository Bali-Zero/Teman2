what_changed: |
  apps/backend-rag/backend/db/migrations_v2/324_practices_practice_type_id_nullable.sql:
  new migration. Forward: `ALTER TABLE practices ALTER COLUMN
  practice_type_id DROP NOT NULL` — the exact statement the bootstrap
  issues, now with a committed counterpart like 132 (lkpm_reports) and 137
  (team_members). Header documents the measured prod verdict (read-only
  information_schema, is_nullable = 'YES', 2026-10-05) and the two
  deliberate divergences that remain: the SQLModel CRM model still declares
  nullable=False, and the CRM INNER JOINs practice_types so a NULL-typed
  practice is product-invisible (migration 311's placeholder row exists for
  exactly that reason). Rollback (after council round 1): a DO block that
  LOCKs practices IN ACCESS EXCLUSIVE MODE, restores SET NOT NULL only when
  no NULL rows exist, and RAISE WARNINGs when it declines — never silent,
  race-closed. The forward changes no constraint on prod or bootstrap-built
  CI but still takes ACCESS EXCLUSIVE for the catalog rewrite (header says
  so, council Q5).
  apps/backend-rag/backend/tests/db/test_legacy_promotion_migrations.py:
  324 added to LEGACY_PROMOTION_FILES with a dated comment, so the batch's
  structural invariants (ROLLBACK marker, non-empty forward/rollback,
  idempotency, no SET NOT NULL in forward) now guard this file too; plus
  new tripwire test_practices_drop_not_null_stays_tracked (council Q2)
  pinning the bootstrap statement — whitespace-normalized — to the exact
  counterpart staying inside LEGACY_PROMOTION_FILES, and the counterpart's
  forward to the same statement. Guilt verified both directions: removing
  the tuple entry reds the tripwire; so does drifting the forward.
  apps/backend-rag/backend/db/migrations_v2/LEGACY_PROMOTION_README.md:
  dated addendum under the mapping table recording the third DROP NOT NULL
  family, its migration counterpart, and the fact that — unlike the
  129–137 batch — its prod claim was measured before the file was written.
  No change to ci_bootstrap_schema.py (its ALTER is now corroborated, not
  orphaned) and no change to the intake fixtures (branch 2a conditions do
  not hold).

proof: |
  See receipts. Structural suites: 55 passed. Corpus scanners over every
  migrations_v2 glob (uniqueness, checksum, rollback extraction,
  policy-scope, data-invariant tripwires, garuda environment, retention
  family, visa seed): 144 passed across 10 files. Intake suites: 79
  passed, 12 errors — byte-identical result on a clean origin/main tree
  (git stash -u on the same worktree), so all 12 are pre-existing
  local-Postgres drift on this thin client, none caused by this diff (which
  touches no intake code, fixtures, or bootstrap). ruff check and ruff
  format clean. Council: codex round 2 PASS-WITH-FINDINGS on the final
  merge-base diff ("merge ammissibile"); qwen round 1 PASS-WITH-FINDINGS,
  its curable findings (Q2/Q5) cured and independently verified by codex
  round 2; qwen round 2 attempted 3 times, provider cancelled every long
  run (recorded as non-judgement in the journal).

dissent:
