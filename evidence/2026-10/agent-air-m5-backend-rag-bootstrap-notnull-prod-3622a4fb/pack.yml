plan_ref: >-
  Mandate from the commissioning session (2026-10-05, PENDING-ARMS row
  2026-08-26, external-builder seat on Air-M5): settle what production
  enforces on practices.practice_type_id with ONE read-only
  information_schema query via scripts/pg.sh, then take branch (2a) or (2b)
  by the verdict. Verdict: is_nullable = 'YES' → branch (2b): promote the
  bootstrap's orphaned DROP NOT NULL to a tracked migration (next free
  number, ROLLBACK marker) and register it in LEGACY_PROMOTION_README.md.
  No intake fixture change (prod-sanctioned blindness stays, documented).

