      F2 MEDIUM (round 1): the rollback was not equivalent to restoring the
      pre-migration state — with no NULL rows it would introduce a
      constraint that did not exist before the migration; with NULL rows it
      silently no-op'd while the runner recorded success.
    status: CONFIRMED
    resolution: >-
      Cured in ba63ccff97: the contract is explicit in the file (on prod
      and bootstrap-built CI the column was already nullable, so decline is
      the honest outcome; only a fresh create_all DB has something to
      restore), the decline branch RAISE WARNINGs, and codex round 2 judged
      the corrected block correct.
  - seat: codex-gpt-5.6-sol
    objection: >-
      F3 MEDIUM (round 1): the NULL-check and the ALTER were not protected
      against concurrent inserts landing a NULL row between them.
    status: CONFIRMED
    resolution: >-
      Cured in the same commit: LOCK TABLE public.practices IN ACCESS
      EXCLUSIVE MODE before the check; the lock covers check-and-alter to
      its conclusion. Codex round 2 confirmed.
