    cmd: python3 -m pytest scripts/tests/test_lint_roster_dispatch.py -p no:cacheprovider -q
    result: "15 passed"
    exit: 0
    ts: "2026-10-14T03:27:00Z"
    seat: this session
  - claim: The observer passes on the branch head and accepts only a full pass of at least 3 tests.
    cmd: python3 scripts/ci/observe_council_reserve_seat.py
    result: "3 passed, 969 deselected; council reserve seat holds"
    exit: 0
    ts: "2026-10-14T03:26:46Z"
    seat: this session
  - claim: The observer's summary parser rejects reduced, failed, skipped, error, warning and missing summaries.
    cmd: python3 -m pytest tests/scripts/test_observe_council_reserve_seat.py -p no:cacheprovider -q
    result: "4 passed"
    exit: 0
    ts: "2026-10-14T03:26:46Z"
    seat: this session
