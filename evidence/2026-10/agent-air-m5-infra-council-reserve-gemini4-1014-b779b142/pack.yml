gear: 1
brief_ref: evidence/brief.yml
ruling: >-
  Zero, 2026-10-14 - the gear-3 council reserve seat agy-gemini-3.1-pro is replaced by agy-gemini-4-argon-high.
  Observed the same day on M5: agy 1.3.4 lists gemini-4-argon-low/-medium/-high and gemini-3.8-flash-* but no
