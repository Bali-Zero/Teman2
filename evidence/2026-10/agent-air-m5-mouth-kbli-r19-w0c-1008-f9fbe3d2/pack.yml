diff:
  net_lines: |
    Code: 561 lines for the census with its in-page probe, 103 for the test, 33 for the workflow
    and 1 in main-push-failure-watch.yml.
    Data: a 439-line JSON Lines fixture (one read or colour per line) and the 489-line spec, which
    is mostly the 357-row contract table. The table is the deliverable; the size is the surface.
    Against #8047's head 94f8f4a1a0, only the spec differs, by 6 changed lines.
  behaviour_change: >-
    New read-only tooling and a spec; no runtime surface changes. scripts/mouth/r19_wrapper_token_census.py
    walks the rendered /kbli* DOM and judges it against the contract table in
    docs/specs/2026-10-08-kbli-r19-wrapper-token-contract.md. A new advisory workflow replays the
    committed census on PRs touching those paths.

