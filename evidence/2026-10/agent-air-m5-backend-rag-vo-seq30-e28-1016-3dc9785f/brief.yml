  2026-10-13T00:07:47Z), plus the bundle signed on M5 (kid prod-2026-07-1, signed_at 2026-10-16T12:24:48.389183Z,
  payload 972f339283e6a66962f3dd8f4dbb1c4a5014c5b16352234e425abfed988df413), the signed-state observer replacing the
  seq-29 signed observer, the five walk-census pins moved by SEQ29-D1, the E30 pricing strict-xfail lift, the mouth
