objective: >-
  rulepack-prod-030.signed.json ties byte for byte to rulepack-prod-030.source.json, verifies under the pinned prod
  key, and once on main the highest signed pack on disk reads seq-30 for review_hold_inventory, PricingService and the
  evaluate path; activation (two-login ceremony from Pro) runs right after merge and deploy.
