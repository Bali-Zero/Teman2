diff:
  net_lines: |
    About 896 net beyond fixtures and evidence: W0d-2's ~768, which its gate accepted as one
    concern, plus the cure's ~128:
      - census script +62 -19;
      - tests +72 -8;
      - contract +38 -17.
    Fixtures are data, regenerated by the cured census: the main census dump, the 24-walk pin
    and the four mutant walks. The #8161 search dump is byte-identical. No apps/mouth/src file.
  behaviour_change: >-
    Resolver A never paints the dev server's indicator. A fixed or sticky element outside the
    roots that paints anything, a faint layer or a filter included, occludes the points under
    it, and a run with any such point is read again in the middle of the viewport. A walk whose
    opener throws or leaves 0 roots loads the page and opens it once more; a forced theme that
    hydration replaced is forced again, at rest and opened, or the walk fails naming it. R falls
    from 2 to 0, G from 449 to 438, K from 143 to 140, M from 685 to 680.
