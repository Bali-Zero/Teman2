dissent:
  - seat: claude-opus-5-5
    objection: "W0d-2 attributed R = 2 to the page texture (body::after) over the footer and to a pictograph chip. The #8202 gate showed both runs were read at the viewport's bottom-left, under the dev indicator and a floating button's blurred glow; read in the middle, both agree."
    status: CONFIRMED
    resolution: "Cure points 1 and 2: the indicator is hidden in the capture style, and a fixed or sticky overlay occludes so the run is read again in the middle. R is 0 on origin/main; contract 8.4 names the true cause and states R 0 is reachable for W2'''."
  - seat: claude-opus-5-5
    objection: "Occluding only the points under the overlay's box is not enough: a 6px blur reaches past the box, so the points left beside it still read the glow (I-badge-edge, narrowed until it did)."
    status: CONFIRMED
    resolution: "A run with even one point under a fixed overlay waits to be read in the middle of the viewport; the mutation that measures it from its remaining points fails I-badge-edge."
  - seat: claude-opus-5-5
    objection: "Retrying the opener on the same page does not cure a click that landed before hydration on a link: the sector card is an anchor, and on the first full census of this lot the sector drawer's desktop/light walk failed with the opener timing out."
    status: CONFIRMED
    resolution: "The retry loads the page again and opens it once more, for an opener that throws as for one that leaves 0 roots (I-opener-twice, I-opener-throws, each guarded by a mutation)."
  - seat: claude-opus-5-5
    objection: "On /v2 the default theme is editorial, whose drawer is navy: a forced-light walk that the ThemeProvider re-sets after hydration reads the navy drawer as the light one (the gate's D 12 on /v2/news)."
    status: CONFIRMED
    resolution: "The forced theme is checked before the page is read, forced again once if hydration replaced it, and the walk fails as theme: … if the page keeps its own (unit test and I-theme-hydrated)."
