  after GATE: BLOCK). W0d-2' is W0d-2's content, carried from a fresh origin/main, plus the five
  cure points the gate and the imperator ordered:
    1. resolver A never paints the dev server's indicator (nextjs-portal{display:none!important}
       in the capture style);
    2. a sample point under any fixed or sticky element outside the roots is occluded, faint
       layers and filters included, so the run is read again in the middle of the viewport; a
       guilt row and an innocence row put a fixed glowing badge at the bottom-left over a run;
    3. the shared walk survives a loaded runner: an opener that throws or leaves 0 roots gets
       the page loaded and opened once more, and a forced theme that hydration replaced is
       forced again before the page is read, or the walk fails naming it;
    4. the pins regenerated, and shared-component-drift 0 proven in the CI job on two runs;
    5. contract section 8.4's R attribution corrected and the numbers re-measured, with R 0
       reachable by construction for W2'''.
  No line changes under apps/mouth/src.
