dissent:
  - seat: kimi-code/k3 (DEFECT 1)
    objection: >-
      infra/launchagents/wrappers/mini-fly-cost-guard.sh:154, :48 and :78-80, kimi: "The OLD workflow killed a hung run at
      timeout-minutes: 10 and the always() Telegram step turned the hang RED. The new wrapper calls the guard (154) and the gateway
      (:48) with no bound. A hung flyctl keeps the wrapper alive -> every future weekly tick takes the still-alive branch and writes
      a fresh warning heartbeat — the 8-day silence window never trips, no p0 ever fires ... exactly the cicatrix #2 shape the
      migration was supposed to kill."
    status: CONFIRMED
    disposition: >-
      OPEN, not cured: this session may not edit code. R8 reproduces the missing bound. Mitigation today: the heartbeat reads warning,
      not ok, so a bridge that escalates repeated warnings sees it; whether the bridge does was not read here. Cure for the shipping
      session: bound the guard call (macOS has no timeout(1); a background run with a wait loop) and page after N consecutive skips.
  - seat: kimi-code/k3 (DEFECT 2)
    objection: >-
      The lock machine (mkdir, pid plus start time, the 120 s young-lock rule, stale takeover, trap release), the wrong-node guard,
      the kill switch and the heartbeat-failure paths have no test; the 14 assertions come from three cases.
    status: CONFIRMED
    disposition: >-
      OPEN, not cured (R8). The logic reads correct to both seats; the gap is regression cover. Fast-follow test additions.
  - seat: kimi-code/k3 (NOTE, notify unredacted) and agy-gemini-3.1-pro (DEFECT)
    objection: >-
      wrapper :48-50, agy: "notify() redirects tg_notify.py output directly to $LOG, bypassing redact(). If the script exits
      prematurely, tg_notify.py runs with FLY_API_TOKEN in its environment. A crash traceback from the gateway would write the
      token in plaintext." Kimi: the Telegram bot token is sourced with set -a and is not in SENSITIVE_VALUES.
    status: PLAUSIBLE
    disposition: >-
      OPEN, residual. Both seats agree the notify output is unredacted; the leak needs the gateway to print a credential, which a
      traceback does not do on its own (it does not print the environment), and run.log is mode 600 (umask 077). The cure is one
      line: pipe the gateway output through redact and add the Telegram token to SENSITIVE_VALUES. Agy rated it DEFECT, kimi NOTE.
  - seat: kimi-code/k3 (DEFECT-lite)
    objection: >-
      The executor path filters omit scripts/lib/fly_credential.sh and scripts/tg_notify.py, so a library-only PR never runs the
      organ's corpus although the test copies and exercises the real library.
    status: CONFIRMED
    disposition: >-
      OPEN, residual: two lines in fly-cost-guard-tests.yml for the shipping session or a fast-follow.
  - seat: agy-gemini-3.1-pro (NOTE, EXPECTED_APPS)
    objection: test_fly_cost_guard.py:29 hardcodes EXPECTED_APPS while the numeric ceilings are read from the wrapper.
    status: PLAUSIBLE
    disposition: >-
      Kimi notes the wrapper shell test asserts the exported EXPECTED_APPS literally (test_mini_fly_cost_guard_wrapper.sh:85-87), so
      the drift is caught. Left as is.
