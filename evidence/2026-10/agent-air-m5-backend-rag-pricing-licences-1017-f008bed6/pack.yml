decisions:
  - id: D-category
    text: >-
      The rows go in company_services: the catalog has no business-licence category and a new
      one would need mouth types, category lists and pricelist sections; company_services
      already renders a quote price verbatim (Akta Perubahan).
  - id: D-quote-string
    text: >-
      SLHS, Halal and PIRT reuse the catalog's existing quote price "Depend (Contact for
      quote)" so every consumer that already handles Akta Perubahan handles them.
  - id: D-icons
    text: >-
      Existing icons only (the pricelist PDF needs a PNG per icon_id): other-domicile (house
      with a document) for the alcohol rows, other-skck (shield with a check) for the
      certificates. No company-* id, because the mirror's legacy company_services map is keyed
      by icon_id.
  - id: D-no-regulatory-names
    text: >-
      Row names say "Alcohol License — Golongan ..." and descriptions state only the Golongan
      alcohol bands; they do not name SKPL, NPBBKC or NPPBKC, which the repo spells
      inconsistently.
