  Zero 2026-10-17, in reply to the list of services the 2026 catalog does not price:
  "MERP venduto da solo, ACC Mutation e ACC Boarding Pass da far sparire dal sistema;
  licenza alcolici: solo golongan A 4 jt, solo B+C 10jt, A+B+C 12jt; il resto rimandiamo a
  contattarci" (the rest = SLHS, Halal, PIRT).
mission: >-
  The pricing SSOT carries the alcohol licence prices and the three price-on-consultation
  licence rows, so PricingTool, /api/pricing, the mouth pricing table and (after the ADD-ONLY
  Qdrant create) Zantara's vector retrieval answer with them instead of unrelated rows; no
  standalone MERP or ACC item survives in code. Client articles that still quote the old
  figures are a separate PR (mouth content).
