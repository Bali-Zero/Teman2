  - "The concept note still carries the 'KITAP E28A requires Rp 15 billion (Pasal 176(2)(c))' section: a KITAP rule not on the E28 pages, not in the audit's cure list for the concept note (F40 LOW)."
  - "Seed E28A name 'Investor Visa' and E28F name differ from the live names; a seed re-run would rename them (pre-existing, not widened)."
