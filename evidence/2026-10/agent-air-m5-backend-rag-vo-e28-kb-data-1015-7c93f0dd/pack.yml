  head: "9da04589ff (tests commit; the evidence commit follows it)"
  saved_pages: "research/visa/2026-10-15-e28-pages/text/ (E28A df3ba889, E28B 4ba3c1a3, E28C 2cdb5b81, E28D dd5e2a06, E28E 5b9dd676 (no content), E28F 74e25e50), copied byte-identical from the audit worktree"
  truth_table: "scratchpad e28-truth-table.md (signed pack seq-29 + pages)"
  prod_before:
    E28A: "cost_visa '17.000.000 - 19.000.000 IDR'; requirements carry 'Passport photo 4x6 red background' and 'Return/onward ticket'; allowed_activities carry document lines; processing '7-10 days'"
    E28B: "name 'E28B - Investor KITAS (Golden Visa 5Y)'; allowed 'Investasi minimal Rp 2.5 miliar'; restrictions 'Wajib maintain investasi'"
    E28C: "restrictions 'Dilarang bekerja'; allowed 'Tidak perlu mendirikan PT PMA', USD 350.000 only"
    E28G: "name 'E28G - Investor KITAS (Golden Visa 10Y)'; allowed 'Golden Visa 10 tahun', 'Investasi Rp 5 miliar+'"
    qdrant: "E28A stay_extension_days 730 + 'KITAP threshold INCREASED to Rp 15 billion'; E28B 'Direct KITAP-INV after 5y ... prior Indonesia entry'; E28D 'Branch/Representative Office'; E28F 'Real Estate ... Rp 5 billion+'; E28G point 225aed53 'Golden 10Y Real Estate'; concept b50440ec 'E28B/E28G Golden Visa' and 'Exemption: Golden Visa investors (E28B, E28G)'"
  retire_mechanism: "none: knowledge_visa.py runs SELECT * FROM visa_types with no status/hidden/active filter and the MCP tools call it verbatim; E28G is rewritten as 'not a current visa (see E28B or E28C)' with no threshold"
  cost_visa_choice: "E28A 'IDR 17.000.000 (offshore) / IDR 19.000.000 (onshore), all-inclusive': two labelled prices for the two catalogue products, not a 17-19 range; offshore-only would under-quote an onshore client"
  field_placement: "the API exposes requirements/restrictions/allowed_activities, not description; thresholds and the page's special requirements sit once in requirements (the page's own 'Persyaratan khusus'), allowed_activities holds only what the page allows"
  workflow_auto_run: "fly-deploy.yml run-python-migrations runs named apply_migration_NNN.py files only; migration_128 does not run on merge, the orchestrator runs it by hand"

