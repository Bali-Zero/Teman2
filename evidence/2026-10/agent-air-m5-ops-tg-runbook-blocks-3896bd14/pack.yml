pii_scan: clean
pii_scan_note: A runbook, a shell test and a workflow step; fake tokens built by concatenation; no client data, no secrets file read.
what_changed: |
  docs/runbooks/telegram-token-rotation.md: a Conventions paragraph that specifies the paste surface (interactive
  zsh with interactivecomments off or bash 3.2, bracketed or raw paste: no `#` in a block, no `exit`, multi-line
  steps as one { ...; } compound, tokens read with `IFS= read -rs`, never on argv); every block rewritten to it.
  Step 6 is byte-identical to gate-7990's verified cure. Step 3 is `cd ~/nuzantara` on every host (on Pro the
  Desktop path is a symlink to it). Step 8.2 is split so the dry run is read before the send. Inline comments
  moved to prose; Fly process groups api, rag and drive named.
  scripts/ops/test_runbook_blocks.sh (new): extracts every bash fence, applies the static rules, and runs each
  block in zsh and bash, as one -c string ("whole") and line by line on stdin ("raw", where zsh -i really reads
  `#` as a word and an early `read` swallows the next line), with a fake HOME and recording shims; asserts the
  fly import, the absence of the token from output and argv, TG unset, the block's own status, that Python
  heredocs compile, and that raw logs equal whole logs.
  .github/workflows/tg-gateway.yml: path filter gains the runbook and both shell tests; the gateway job ends with
  one step that installs zsh when absent and runs this test and scripts/ops/test_rotate_telegram_token.sh.
proof: |
  See receipts. The runbook on origin/main fails the test (55 failures, including step 6's garbage import in a
  raw paste); the head passes in both shells and both modes; seven mutants of the head runbook each fail it; a
  pty paste simulation of all nine head blocks (36 runs) is clean.
bites:
  consumer: >-
    The gateway (anti-regrowth lint) job of tg-gateway.yml: its path filter selects this pull request, and its last
    step runs scripts/ops/test_runbook_blocks.sh and scripts/ops/test_rotate_telegram_token.sh.
  observation: >-
    Before push, on M5, the step's exact command: rc 0, "PASS: 9 shell blocks under zsh and bash, whole and raw
    paste, token and empty input", rotation test 27 ok ALL PASS; the same test on origin/main's runbook: rc 1,
    55 failure(s). The hosted run on this pull request is quoted in its body.
