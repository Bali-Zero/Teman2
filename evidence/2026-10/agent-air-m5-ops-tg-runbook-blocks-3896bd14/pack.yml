dissent:
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER: replacing `read -rs TG` with `read -r TG` in step 6 survives the test; a real terminal would echo the token."
    status: CONFIRMED
    resolution: "Static rule: a `read` in a block without -s fails the test (mutant m5 red)."
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER: step 4's loader passes the token to launchctl setenv on argv, against the stated 'never reach argv'."
    status: CONFIRMED
    resolution: "Wording, not code: the loader is existing code with a declared caveat; the Conventions now name it as the one exception. Replacing the loader's mechanism is out of scope (owed)."
  - seat: codex-gpt-6.1-sol
    objection: "MEDIUM: the final TG probe supplies the shell's status, so a failing block passes; Python heredocs are recorded, never compiled."
    status: CONFIRMED
    resolution: "The probe now also requires the block's own status 0 (mutant m7 red) and every recorded `python3 -` heredoc must compile (mutant m6 red)."
  - seat: codex-gpt-6.1-sol
    objection: "LOW: CI's /bin/bash is bash 5, not 3.2; zsh is not pinned."
    status: CONFIRMED
    resolution: "Declared limit: bash 3.2 is proven on M5 (local test and pty); CI proves zsh and bash 5."
  - seat: codex-gpt-6.1-sol
    objection: "Refutation FALSIFIED: the silent-read rule judged lines, so a decoy `: 'read -rs'; IFS= read -r TG` passed."
    status: CONFIRMED
    resolution: "The rule now judges every `read` occurrence with its flags; the decoy is mutant m8, red."
  - seat: codex-gpt-6.1-sol
    objection: "Refutation FALSIFIED: step 6 ends `fi; unset TG; }`, so a failed fly import returns 0, and a fly shim exiting 1 leaves the test green."
    status: CONFIRMED
    resolution: "Confirmed as a fact, not cured: step 6 stays byte-identical to the form gate-7990 verified on a pty (C1-C8); a status-preserving variant would be a new, unverified block. fly's own error reaches the owner's terminal (stderr is not redirected). Declared in the PR body as a limit."
  - seat: codex-gpt-6.1-sol
    objection: "Refutation SURVIVES with caveats: a heredoc that compiles but raises at run time passes; raw token runs only where the whole run consumed the token, so 'every block both ways' overstated it."
    status: CONFIRMED
    resolution: "Heredoc run-time errors declared as a limit (executing them needs a stubbed tg_notify). The Conventions now say the test pastes every block whole and line by line (the raw empty run covers every block)."
  - seat: claude-opus-5-5
    objection: "BLOCK, final gate gate-8013 on 701ceb370d: the required antidotes check is red (test_lint_tcc_desktop_paths): the new test carried two dead ~/Desktop/nuzantara paths (fake-home mkdir and the shim loop), dead since step 3 became cd ~/nuzantara. Notice N1: a token piped into an unshimmed external (xargs echo) passed the test."
    status: CONFIRMED
    resolution: 'Both Desktop paths removed (lint_tcc_desktop_paths.py rc 0, its tests 15 passed); a static rule now fails any block that pipes "$TG" into something other than fly or gh (xargs echo mutant m9 red). Head still PASS 9 blocks, origin/main still 55 failure(s).'
owed:
