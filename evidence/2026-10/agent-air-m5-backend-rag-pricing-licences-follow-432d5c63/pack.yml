decisions:
  - id: D-no-generic-keyword
    text: >-
      Keywords must not contain a word that is generic across services ("izin"): the search
      matches any word, so one generic keyword widens every query; a test guards against any
      alcohol keyword starting with "izin ".
  - id: D-legacy-prefix
    text: >-
      The legacy map keeps only company-* icons, the convention its readers rely on; a
      duplicate company-* icon is an error.
