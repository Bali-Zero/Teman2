      OTHER_FINDING (verbatim from seat-build-kimi-20261005T064854Z-4482.log; the core claim was HOLDS): The guarantee is conditional on slot 2 being set, exactly as claimed: if `CLAUDE_CODE_OAUTH_TOKEN` carried the retired value while `CLAUDE_CODE_OAUTH_TOKEN_2` were *unset*, `RETIRED_TOKENS` would be empty and the legacy value would be attempted (wr2-ig-metrics-analyst-run.sh:625-640; same in the cascade) — the value is only knowable via the numbered var. Within the claim's premise this is fine.
    status: CONFIRMED
    disposition: >-
      CONFIRMED by reading claude-cascade.sh:1081-1085: the pre-seed loop adds the retired value to SEEN_OAUTH_TOKENS only when CLAUDE_CODE_OAUTH_TOKEN_2 is non-empty, so with slot 2 unset and the legacy name carrying the retired value, oauth_token_seen is false at :1154 and the legacy token IS attempted. The registry stores slot numbers, not values, so the value is unknowable without the variable. Notice only, not fixed here (wrapper blobs frozen); the operator removing the _2 line AND the retired value from the legacy name is the cure.
