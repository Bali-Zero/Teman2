decisions:
  - id: D-no-c-structure
    decision: >-
      C1/C2/C6 sentences state only the rule's bound ("a planned total stay of 180 days or less"); no first-stay
      and extension structure, because no saved snapshot of those pages exists. B1 states 30 + one extension
      to 60 from the recorded B1 page. No fee or PNBP wording.
dissent:
  - seat: "codex gpt-5.6-sol, rollout 01a132e0-6d12-71c1-af1a-a6244856978b (red team, HIGH)"
    objection: >-
      "a stay of 180 days or less" can be read as an initial 180-day permit; 180 is the engine's total-stay
      bound and no snapshot describes C1/C2/C6 stay structure.
    status: CONFIRMED
    disposition: "CURED. C1/C2/C6 now read 'planned total stay' / 'rencana total masa tinggal'."
  - seat: "codex gpt-5.6-sol (red team, MEDIUM)"
    objection: "The test forbade any mention of 60 days on C1/C2/C6, blocking a future correct 60-initial sentence."
    status: CONFIRMED
    disposition: "CURED. The test now forbids only '60 days or less' / '60 hari atau kurang' and requires the new wording."
  - seat: "codex gpt-5.6-sol (red team, LOW)"
    objection: "'masa tinggal pertama' reads as a translation."
    status: CONFIRMED
    disposition: "CURED. 'masa tinggal awal' (EN 'initial stay')."
  - seat: "codex gpt-5.6-sol (red team, LOW)"
    objection: "'penjamin terkonfirmasi' is rigid; 'Anda telah mengonfirmasi adanya penjamin' is closer to the user-declared fact."
    status: PLAUSIBLE
    disposition: "REJECTED for this PR: the mandate keeps 'confirmed sponsor' on C2/C6 and the phrase pre-dates the change."
