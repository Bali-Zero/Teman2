    nb: apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/engine-adapter.ts
    query_hash: "1c8885cee446750b29ce86b9423a1dd53b05e4c4f1d3edfef07f44faa70366c8" # pragma: allowlist secret
    note: query_hash = sha256 of engine-adapter.ts at origin/main 9918e0517a (before the change).
