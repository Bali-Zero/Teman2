decisions:
  - id: D-global-filters-out
    decision: "Global-filter walks (nationality ID, calling visa, overstay, minor, criminal) are not added: they wait for backend PR 8496."
  - id: D-walks-measured
    decision: "Every pin is the replay on each source pack seq-20..29; seq-20..27 share one reason table, seq-28..29 another, the stay-361 explorer differs on seq-20."
  - id: D-other-unpaid
    decision: "The other_purpose and other-stay walks answer other_paid_activity = no: its first option (yes) turns the walk into EMPLOYMENT, where the purpose and the OTHER stay bound are not what the walk exercises."
  - id: D-c6-funnel-held
    decision: "The six non-transit other_purpose walks, the C6 stay 180/181 walks and the training/other business walks raise ACTIVITY_BOUNDARY: engine-supported, funnel-held. C6 remains never shown to the applicant; the witness pin now lists all its engine walks."
dissent:
  - seat: "codex gpt-5.6-sol, rollout rollout-2026-10-14T18-34-36-01a139fa-6e8f-79f1-92d6-dea370f2f8c0 (red team, HIGH)"
    objection: "Reason codes were checked only for seq-27..29; seq-20..26 skipped silently, and the seq-20 stay-361 explorer names two E28A causes, not the generic sentence."
    status: CONFIRMED
    disposition: "CURED in the cure commit: reasons asserted on every sequence (seq-20..27 share the seq-27 table), the seq-20 explorer pinned to the two E28A codes."
  - seat: "codex gpt-5.6-sol, same rollout (red team, HIGH)"
    objection: "Per-option coverage of business_activity and other_purpose is not verified: options are context questions, the fixtures differ by label only."
    status: CONFIRMED
    disposition: "CURED: walk-corpus-determinism.test.ts binds the corpus to the option list of the real tree (every key is some walk's answer). The label-only twins stay by design."
  - seat: "codex gpt-5.6-sol, same rollout (red team, MED)"
    objection: "No pin checks the exact stay values of the named bounds; a regenerated witness moved off its bound keeps every outcome green."
    status: CONFIRMED
    disposition: "CURED: test_the_t06_boundary_walks_sit_on_the_bound_they_are_named_for pins stay_days, nationality and entry pattern per walk."
