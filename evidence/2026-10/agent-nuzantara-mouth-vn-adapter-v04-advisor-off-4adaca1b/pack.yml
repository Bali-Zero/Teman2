  53190abacc; this change was re-verified on origin/main 12200510b2 (every promise string still present).
mission: >-
  The Visa Oracle offers a Bali Zero advisor and never promises one, in English and Bahasa Indonesia.
lanes:
  - lane: v04-advisor-offered
    role: build
    seat: Claude Sonnet 5.5 implementer, worktree mouth-vn-adapter-v04-advisor-offered on the visa night run.
  - lane: v04-ground-truth
    role: ground_truth
    seat: >-
      The change asserts no rule of its own. Ground truth is the signed pack and the official imigrasi.go.id
      pages already cited by the adapter's existing sentences; every rewritten sentence keeps the claim it
      had and changes only who acts (an advisor CAN, instead of "we do"). Price rows are untouched: the
      unpriced fallback names no figure.
    nb: apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/engine-adapter.ts
    query_hash: "344b13d8fe80347efe2fd3cf4b5b1e406bf37ace6c27e436d6155dffd4befc28" # pragma: allowlist secret
    note: query_hash = sha256 of engine-adapter.ts at origin/main 12200510b2 (before the change).
pii_scan: clean
bites: >-
  Consumer: the public Visa Oracle result page (OutcomeSheet reading engine-adapter.ts nextStepsFor,
  REVIEW_REASON_COPY, REVIEW_REASON_ELEMENTS, NOTICE_CONDITION_COPY and the price fallback), and the
  advisor-offer.test.ts scan that runs in the mouth suite on every PR. Observation, after promote: a
  headless walk of tourism shows the step "an advisor can go over the documents, the timing and the price
  with you"; an unpriced path (E23U) shows "Price on consultation" with the offer; the minor-without-guardian
  walk shows "A Bali Zero consultant can pick this up with you once an adult is present"; each with its
  Bahasa Indonesia twin, and none of "we confirm", "reviews your case", "continues from here", "comes back
  to you". Pre-merge, the same phrases are asserted absent by advisor-offer.test.ts.
