gear: 2
brief_ref: evidence/brief.yml
plan_ref: >-
  visa-night family "visit" plan V04 (/Users/nuzantara/visa-night/visit/audit.json, findings F029, F065,
  F081, F114, F115 engine-adapter/outcome-fallbacks part) merged with family "work" plan PR-03
