decisions:
  - id: D-e33-left
    decision: >-
      The E33-family advisor checks (E33G, E33B, E33E, E33F, E33 property, and the E33A-C government
      sentences) keep their wording: they belong to the Second Home lane and the scan test exempts the E33
      code prefix by name, states that exemption in its own describe title and comment, and claims
      only "every non-E33 code".
  - id: D-i18n-follow-up
    decision: >-
      Promise strings that live in i18n.ts are NOT touched here (tree lane): the timeline lines where "your
      advisor confirms the calendar", the CLIENT_GUARD title and body "A person will review this" / "Akan
      ditinjau oleh seseorang" (also allow-listed in client-copy.test.ts), and the disclosure paragraph that
      says an advisor "reviews your case". Listed in the PR body for the tree lane.
dissent:
  - seat: "this session (self-review, no external seat in a prepare lane)"
    objection: "The scan regexes are phrase lists, so a differently worded promise would pass."
    status: PLAUSIBLE
    disposition: "Accepted: the list is a floor, not a proof; it is guilty on every replaced sentence and innocent on the rewritten tables. New promise shapes are added when found."
  - seat: "codex gpt-5.6-sol, rollout 01a12dd5-9d11-7da1-9657-4b8b4666773e (red team, HIGH)"
    objection: >-
      engine-adapter.ts blacklist notice said an active ban stops any application from being FILED and
      that an advisor can verify the status with Ditjen Imigrasi. UU 6/2011 Pasal 42 says the visa
      application is REJECTED for someone on the penangkalan list, and neither the rule pack nor
      imigrasi.go.id supports the advisor lookup: it overstates the advisor.
    status: CONFIRMED
    disposition: >-
      CURED. The notice now names the disclosure and offers to go over it and say what to prepare; it
      states no legal effect and no Ditjen lookup. advisor-offer.test.ts pins the absence of both.
  - seat: "codex gpt-5.6-sol, rollout 01a12dd5-9d11-7da1-9657-4b8b4666773e (red team, HIGH)"
    objection: >-
      CONTACT_REQUIRED price copy always said "no fixed price is published", but the backend returns
      CONTACT_REQUIRED for PRICING_ROW_MISSING and PRICING_ROW_NOT_EXACT_AMOUNT as well; the reason
      code was ignored and the test never used a real code.
    status: CONFIRMED
    disposition: >-
      CURED. One neutral sentence for all three codes ("Price on consultation. You can ask a Bali Zero
      advisor." / "Harga melalui konsultasi. ..."), no claim about publication. engine-adapter.test.ts
      runs it.each over the three real backend reason codes.
  - seat: "codex gpt-5.6-sol, rollout 01a12dd5-9d11-7da1-9657-4b8b4666773e (red team, MEDIUM)"
    objection: >-
      advisor-offer.test.ts claimed coverage "across every visa code" while dropping every E33* key;
      six promise-style E33 sentences remain.
    status: CONFIRMED
    disposition: >-
      CURED by narrowing, not by scope creep: E33 copy is Track C's. The exemption is now stated in a
      comment and in the describe title, and the PR body claims "every non-E33 code". The brief
      gear_reason is narrowed the same way.
  - seat: "codex gpt-5.6-sol, rollout 01a12dd5-9d11-7da1-9657-4b8b4666773e (red team, MEDIUM)"
    objection: >-
      The promise was reworded as an obligation ("a Bali Zero advisor needs to confirm it" / "konsultan
      perlu memastikannya"), which is not an offer; the guard regex did not recognise "needs to" and the
      exact-string test froze the defective sentence.
    status: CONFIRMED
    disposition: >-
      CURED across the whole class, not only line 1333: the activity-boundary, conflicting-status,
      uncertainty and six disclosed-review sentences, the six decisive/safety-critical source sentences
      and the multi-purpose sentence now read "no path can be confirmed yet. A Bali Zero advisor can go
      over it with you" (EN and ID). The guard gains obligation patterns (needs to, perlu, memerlukan
      ... oleh konsultan) with a guilt test, and the pinned string moved.
