plan_ref: >-
  Mandate LOCALCI-SOVEREIGN phase B (ruling docs/rules/RULINGS.md, RULED 2026-10-07), handed by the team lead of
  Zero's session on 2026-10-07; this pack is PR-B1 (services + Backend Tests + Harness floor). Design anchor:
  docs/specs/localci-sovereign-2026-10-07.md §2 phase B. Rebased on origin/main after A2 merged as 9cd42fdc00:
  services are admitted only in a matrix context keyed `expressions: true` (plan_services judges them there);
  `container:` stays BLOCKED, as A2 ruled.
