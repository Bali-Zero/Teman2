dissent:
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER (round 1): job.status is never set, so `if: job.status == 'success'` skips a step hosted runs (reproduced: NOT_APPLICABLE with status success)."
    status: CONFIRMED
    resolution: "The driver sets job.status to the live job status before each step; any other job.* path is refused at plan (d2d4abeeb6). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): a step without `if:` still runs after a red, where hosted's implicit success() skips it (reproduced)."
    status: CONFIRMED
    resolution: "A step with no `if:` is success(); after a red only always()/failure() steps run (d2d4abeeb6). Corpus row."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): a step killed by a signal, or one that cannot start, leaves the job status success (reproduced)."
    status: CONFIRMED
    resolution: "Both turn the job status to failure; under continue-on-error the job goes on as hosted, and the step itself stays ERROR/BLOCKED (d2d4abeeb6, 52e0999a2b). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (rounds 1-2): number coercion differs from ExpressionUtility.ParseNumber ('   ', 0x, 0o, 1_0; then signed radix, Int32 overflow, Infinity)."
    status: CONFIRMED
    resolution: "ParseNumber reproduced: trim, '' 0, invariant decimal, unsigned 0x/0o read as an Int32 (0xffffffff -1, past 32 bits NaN), Infinity (d2d4abeeb6, 52e0999a2b). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): property lookup is case-sensitive, string equality folds ß to SS, objects compare by contents (reproduced)."
    status: CONFIRMED
    resolution: "Property names match ignoring case, strings compare per character (OrdinalIgnoreCase, no expansion), objects by identity (d2d4abeeb6). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): modelled roots accept properties the run does not hold (github.run_id, runner.tool_cache, strategy.*), read as null."
    status: CONFIRMED
    resolution: "runner.unmodelled_path refuses at plan any github/runner property, merge_group payload field, job.* other than status, strategy.*, or upstream output the run does not carry (d2d4abeeb6). The four real jobs read none of them (checked). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (rounds 1-2): GITHUB_OUTPUT parsing accepts malformed files and alters values (\\r, BOM)."
    status: CONFIRMED
    resolution: "FileCommandManager on Linux reproduced: \\n-only split, \\r kept, BOM dropped, exact delimiter, a malformed file fails its step (d2d4abeeb6, 52e0999a2b). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: 'BLOCKER (round 1): `demo==1.0; python_version >= "3" --no-binary=:all:` passes REQ_PIN and pip reads the option, lifting --only-binary in the networked download (sdist build as root with network).'
    status: CONFIRMED
    resolution: "A requirement line reaches the networked stage only as name[extras]==version with a PEP 508 marker grammar, and never with a space-led dash anywhere (d2d4abeeb6, 52e0999a2b). All 243 lock pins and both CI-tool pins still kept. Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): a service whose `docker run` times out is never removed; one failed removal stops the others (reproduced with mocks)."
    status: CONFIRMED
    resolution: "The name is handed back before docker is asked and removed in finally; each removal is isolated (d2d4abeeb6). Corpus row."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): _run_egress accepts a junit that disagrees with its exit code (rc=1 with a PASS case becomes rc 0)."
    status: CONFIRMED
    resolution: "Exactly one case, named as the step, and (rc, status) in {(0, PASS), (1, FAIL)}, else no verdict (d2d4abeeb6). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): pip-audit --no-deps --disable-pip audits only the listed pins; hosted resolves the locks and also audits what they leave unpinned (the cuda subtree, or a dependency a lock omits) — a FALSE_GREEN shape."
    status: CONFIRMED
    resolution: "Not cured: resolving here would install wheels (and run their code) with network. Declared in the matrix parity_gaps with the exact shape, and owed."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 1): trusted_env keeps AWS_*/DOCKER_CONFIG, which reach the docker build/run processes."
    status: RETRACTED
    resolution: "Disputed with evidence: they reach the host's own docker CLI process, never a container: service env is BASE's literal `--env=K=V` map, the sandbox env is the runner's fixed map, and no `--env NAME` passthrough form exists (grep). trusted_env is A1's filter, unchanged here."
  - seat: codex-gpt-6.1-sol
    objection: "MINOR (round 1): a continue-on-error failure is summarised as `N step(s) rc=0`."
    status: CONFIRMED
    resolution: "The context reason now names each continue-on-error step that failed without failing its job (d2d4abeeb6)."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER (round 1): side-step config (egress/host) is zipped to BASE steps by position; a reordered matrix applies it to the wrong step."
    status: CONFIRMED
    resolution: "Side steps bind by name, and a matrix that lists a job's steps out of BASE order is BLOCKED (outputs and status flow in order) (d2d4abeeb6). Corpus row."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR (round 1): a job timeout-minutes given as an expression silently becomes 360."
    status: CONFIRMED
    resolution: "BLOCKED naming it (d2d4abeeb6). Corpus row."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER (round 2): github.event.action is refused, which breaks pull_request workflows."
    status: CONFIRMED
    resolution: "The refusal was real, the premise was not: the run emulates the merge_group event only, where action is checks_requested; it is now modelled (52e0999a2b), and every other payload field a merge_group carries is still refused."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR (round 2): the continue-on-error prefix was dropped from system-out, so the summary never sees it."
    status: RETRACTED
    resolution: "parse_expr_junit adds the prefix; test_the_driver_decides_conditions… asserts the exact reason `continue-on-error: rc=3`."
  - seat: agy-gemini-3.1-pro
    objection: "MINOR (round 2): marker values containing a dash are dropped."
    status: CONFIRMED
    resolution: "Quoted values may hold a dash; only a space-led dash anywhere on the line is refused (52e0999a2b). Corpus row."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR (round 2): refusing timeout-minutes expressions over-blocks legitimate workflows."
    status: PLAUSIBLE
    resolution: "Not acted on: BLOCKED is the honest answer for a value the run does not evaluate; it never reports a verdict. The real jobs use numbers."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 3, on 3c1af47487): the hex substitution is partial — the runner evaluates artifact names/paths, a host reader's argv and an egress step itself, where github.sha is still the placeholder `localci` (reproduced in memory)."
    status: CONFIRMED
    resolution: "Any such text that reads a rebuilt id, or an object holding one, is BLOCKED at plan (120ec673fd). No executed context reads them there (checked on the matrix). Corpus rows."
  - seat: codex-gpt-6.1-sol
    objection: "MAJOR (round 3): the rebuilt ids are not hosted's ids; a step comparing github.sha with a hosted value would diverge (FALSE_GREEN if it guards an exit 1)."
    status: PLAUSIBLE
    resolution: "A limit of any rebuilt-commit run, older than this commit (the ids were `main`/`localci` before). Every read of them in the executed jobs is a git operation on the rebuilt tree (checked: Backend Tests partitioner, Harness floor diff/bites steps); the sandbox has no network for an API call. Declared, not cured."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER (round 3): a job-level env or an emulated step's if: reads github.sha past the refusal."
    status: RETRACTED
    resolution: "resolve_steps merges workflow and job env into every step's env, which the refusal reads; an emulated or side step's if: is decided by the driver, which holds the hex ids."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER (round 3): reading the holder object (github.event.merge_group) bypasses a leaf-only check."
    status: CONFIRMED
    resolution: "Any path that holds a rebuilt id is refused (120ec673fd). Corpus row."
  - seat: agy-gemini-3.1-pro
    objection: "MAJOR (round 3): plain text such as 'github.sha' outside an expression is refused."
    status: RETRACTED
    resolution: "paths() reads only inside ${{ }}; a corpus row asserts plain text passes."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER (round 3): the driver raises KeyError on a non-merge_group event."
    status: RETRACTED
    resolution: "github_ctx always builds the merge_group event; the runner emulates no other."
residuals:
  - "pip-audit runs with --no-deps --disable-pip in the egress sandbox: it audits the pins the locks list, while hosted resolves them first and also audits what they leave unpinned — a FALSE_GREEN shape, declared in the matrix parity_gaps and owed (resolving here would install wheels, and run their code, with network)."
  - "Two infrastructure failures read as FALSE_RED in this PR's own measurements: GitHub HTTP 500 to the Harness gate reader at plan (481b42dd9e), and a pypi.org timeout to pip-audit during the outage. Neither is a green. PR-B2 (stacked) makes both no verdict, BLOCKED and re-run: the reader through the matrix's `no_verdict_when: CANNOT-VERIFY`, and the egress step when its log shows a network error and no finding."
  - "A step-level timeout-minutes in a PLAIN (non-expression) context is neither emulated nor BLOCKED here, as before this PR; PR-B2 adds the one-line BLOCK (team-lead notice). No plain executed context carries one (checked)."
  - "github.sha and the merge_group ids are the sandbox's rebuilt commits, not hosted's ids: a step comparing them with a hosted value could diverge. Every read in the executed jobs is a git operation on the rebuilt tree."
  - "The candidate and deps images build FROM tags (python:3.11.17-slim-bookworm, python:3.12.15-slim-bookworm, ubuntu:24.04, node:24-bookworm-slim), not digests: what is trusted is the built image's ID — the plan pins it and every sandbox and service runs by that ID, and the candidate image's ID is in the env fingerprint, so a rebuild that changes it stales every contained verdict."
  - "Service contexts run on linux/arm64 (Colima on Pro) against the docker.io arm64 twins of the ghcr mirror's postgres:15 and redis:7; hosted is ubuntu-latest x64 — declared in parity_gaps with the wheel-architecture gap."
  - "Contained verdicts stay candidate-produced (junit written inside the sandbox), as A1 and A2 stated: a deliberately malicious candidate can forge its own contained green, as it can make its own hosted job exit 0."
  - "PR size: +1580/-60 against the merge base (runner +635/-19, gh_expr +217 new, steps_driver +135, matrix +148/-38, tests +408/-2, README +37/-1), about 1520 net — well above the ~400 guide. The mandate's split is B1/B2; inside B1 the expression evaluator, the expression-mode driver and the service planner have one consumer, the two contexts, and none ships alone without a planner no context uses. Owed in the report, not hidden."
  - "Journal lines name the commits as they were when each seat reviewed them; across two rebases (A2's squash 9cd42fdc00, then #8027) 5c6a768f58/66b67f468d/7d44772980 are 03af72dc6f (re-resolved against A2's services rule)/d2d4abeeb6/52e0999a2b, and 28649e809f/0bbcda2916 are 3c1af47487/120ec673fd."
