pii_scan_note: Runner code, a contexts matrix, tests, CI logs of the repository's own suites and GitHub check metadata only; no client data was read or written.
what_changed: |
  scripts/localci/runner.py (v0.6.0, service contexts, kind contained_jobs): a matrix context keyed
  `expressions: true` is planned from the BASE job chain (`needs:`), every step accounted for, matrix legs
  expanded as hosted does. Services (Postgres, Redis) take BASE's spec and literal env, run from operator-pinned
  stand-ins pinned by image id, in a loopback-only network namespace, health-checked within BASE's budget, torn
  down in finally. A deps image (wheels only, strict pins, sha256-pinned fetches, node from the official image) is
  built at plan; the install steps re-run offline against it. pip-audit runs in an egress sandbox on BASE's tool
  pins; the Harness Gear>=2 reader runs at plan on the host, BASE copy under python -I. Expressions the run cannot
  hold (secrets, github.token, unmodelled github/job/strategy paths, rebuilt commit ids outside the driver) BLOCK.
  scripts/localci/gh_expr.py (new): the actions/runner expression subset (ParseNumber, OrdinalIgnoreCase, identity).
  scripts/localci/steps_driver.py: expression mode — job.status, implicit success(), continue-on-error, step
  timeout-minutes, GITHUB_OUTPUT as FileCommandManager parses it, emulated artifacts, merge_group ids as hex.
  scripts/localci/contexts_matrix.yaml: Backend Tests and Harness floor executed (9 executed, 5 blocked), parity_gaps.
  scripts/localci/README.md (service contexts, capacity on Pro), tests/test_service_contexts.py (new).
proof: |
  See receipts. Nothing in this change posts a status, edits branch protection, touches a workflow or arms the
  adapter. Before it: Backend Tests and Harness floor LOCAL_BLIND on every commit (7/14 with A2). After it, on Pro
  from the final head: both AGREE on three merged hosted-green main commits (9/14, FALSE_GREEN 0); an unpushed
  failing backend test turns only Backend Tests RED, an unpushed hot-zone touch without a brief only Harness
  floor RED, and hosted_compare says HOSTED_PENDING for both, never AGREE.
