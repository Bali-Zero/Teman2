decisions:
  - id: D-e33b-override-scope
    decision: >-
      The E33B collaboration sentence replaces the E33A sponsor sentence only when sponsor_category is NONE and
      sponsor_government_collaboration is no; a GOVERNMENT or any other sponsor keeps the E33A sentence (pinned by a test).
  - id: D-no-price-figure
    decision: >-
      E33A, E33B and E33C say the route is handled with a Bali Zero advisor; the price keeps the existing
      advisor-confirmed line and no figure is added.
