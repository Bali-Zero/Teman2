what_changed: |
  Round 0 (2a5575d645): O3 rostered per host. Schema providers.openai is oneOf two closed shapes;
  air-m5.v1.json carries O1/O2/O3 with O3 quota_independence "unverified"; Pro/Mini stay two-seat and
  gain auto_rotation_order; registry O3 moves from unrostered_seats to slots, bound on Air-M5 only.
  Merge a3f436fcaf: origin/main after #7898 (beb6991b30). FLEET_TOPOLOGY.json conflict in pending_arms
  resolved keeping both sides: #7898's operator entry and SLOT-2 READERS entry, #7910's OpenAI roster
  entry. Against each parent the merged file differs only by the other side's lines.
  Cure round 1 (Naga P2-O3-runtime-routing-overclaim): the O3 lane sentence, the seat-map README and
  the codex_seat.sh header comment now say what the runtime does — O3 is LAST in codex_seat.sh's
  directory enumeration, codex_seat_pick rotates a start offset, auto_rotation_order is declarative
  only, excluding O3 is a CODEX_SEAT_DIRS change on the host. The runtime consumer is recorded as OWED
  in FLEET_TOPOLOGY.json pending_arms, not built. Three tests pin the sentences: offset 2 opens on O3,
  CODEX_SEAT_DIRS without acct2 enumerates no O3, and no non-test non-comment line reads the field.
  The brief now declares gear 2 (round 0 declared 1 and the floor job was red).

