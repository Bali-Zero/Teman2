what_changed: |
  infra/launchagents/wrappers/pro-healer.sh: REG_BROKEN is set in the wrapper's own registry-receptor-broken branch.
  After receptor A is judged, the wrapper removes the previous tick's registry-last.json (and crash debris .tmp.*) from
  $HEALER_STATE_DIR, then, only when A printed something, was not judged broken and exited 0 or 1, writes A's JSON through
  an exclusive mktemp (0600) and mv. Receptor B gets --registry-file only when that write succeeded this tick; otherwise
  B runs exactly as before. A write failure only logs. Nothing else in the wrapper moved.
  scripts/healer_run_checks.py: proprioception-summary accepts --registry-file PATH. The file is read once; missing,
  unreadable or invalid is rc 3 (the wrapper's proprioception-receptor-broken); valid -> summarize_proprioception's
  registry path (PR 8079) drops organs_heartbeat from the session-curable count and stderr says
  "organs_heartbeat judged by receptor A". Without the flag the output is byte-identical to base.
  infra/healer/HEALER-PRO-MANDATE.md: one sentence names the .husky/_ symlink row as the only exception to "Niente
  worktree" and to "Il repo" / "hook/guardrail" (FUORI PERIMETRO), with the same bounds.
  Tests: test_healer_run_checks.py (flag present / absent / missing / malformed / unreadable, notice absent on failure,
  other subcommands reject the flag); test_pro_healer_receptors.py (hand-off, broken A in 4 shapes, stale snapshot and
  debris, write failure with an undeletable stale file, rc 3 on the hand-off branch, two organs innocence rows).
