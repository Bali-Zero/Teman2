dissent: []
residuals:
  - "No adversarial round: the lint's gear-2 floor comes from its size term alone and asks for none; the independent gate is the lead's."
  - "The shadow rehearses the merge as a plain two-parent merge-tree of the head onto main; the real phase F merge is --no-ff with a message, so the tree is the same but the commit is not rehearsed."
  - "A SIGALRM tick watchdog that fires inside the shadow is raised as MergerError and caught by the shadow's own handler, journalled as an error line; the alarm is single-shot, so the tick ends normally."
  - "ok does not include armed_env: the line says in armed_env what the real merge would still wait for. The enqueue criterion's first_enqueue and not_in_queue terms are enqueue-specific and are reused as ruled."
  - "head_unchanged in the ok conjunction is carried by the criterion (it is one of its terms); a separate term would be a mutant-equivalent."
  - "Pro's git (2.50) was not exercised; merge-tree --write-tree --name-only -z is available since 2.38."
