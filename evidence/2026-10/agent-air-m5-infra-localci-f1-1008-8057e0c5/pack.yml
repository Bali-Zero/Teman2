  - claim: "One real would_merge line produced by the committed code on a fixture (test_merger.Mirror, invented repos under tmp): kind would_merge, ok true, clean true, base_current true (before the fix round, when base_current compared to the mirror's main), merge_tree a 40-hex sha (172ffec740aa...), conflicts [], bites true, refs of the mirror identical before and after (asserted in the script)."
    cmd: PYTHONPATH=. python3 line.py (Mirror(tmp).enq(clean head) through merger.merge_shadow_step, then for-each-ref compared)
    exit: 0
    ts: "2026-10-08T18:42:01Z"
