brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-SOVEREIGN phase F, step F1, from the lead's build message of 2026-10-08 (spec Phase F paragraph: "until then
  phase F's merge path stays shadow: would_merge lines, no merge in the mirror, no push"), to the Dux implementer, from origin/main
  86b151beec, 60-minute budget. Build only; a separate session gates and ships.
lanes:
  - lane: localci-f1-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux implementer, M5; Pro not touched)"
pii_scan: clean
pii_scan_note: Merger code, tests on synthetic git repos under tmp, a README paragraph and a spec status line. No client data was read or written; the journal line never carries the PR body's text.
what_changed: |
  scripts/localci/merger.py: merge_shadow_step, called by decide right after enqueue_step, journals one {"kind":"would_merge"} line
  per decision that reaches the enqueue step (CONFLICT, ERROR and skipped decisions carry none) (pr, head_sha, base_sha, mirror_main, remote_main, base_current, head_unchanged, merge_tree, clean, conflicts, the enqueue
  criterion reused from the enqueue line, armed_env, bites, ok, lease_id; code_sha and ts from journal()). The rehearsal is
  `git merge-tree --write-tree --name-only -z <mirror main> <head>`: plumbing that writes objects, never a ref. ok is the
  criterion conjunction and base_current and clean (head_unchanged is one of the criterion's own terms). Every failure is caught
  and journalled as a redacted error with ok false. PR_QUERY now reads the PR body and pr_side keeps only a bites flag
  (a Bites line anywhere at the start of a line, bold or quoted forms included), never the text. The report prints
  "phase F shadow: would_merge=N (ok=M, conflicted=K, base_moved=J, errors=E)" and carries window.would_merge and phase_f "shadow".
  README: the Phase F shadow paragraph with the line's shape and one illustrative example. Spec: one status sentence at the end
  of Phase F, dated 2026-10-09.
  Tests: 25 new cases in test_merger.py (a fake bare mirror: clean, conflict, base moved, every sub-criterion false, no/empty
  criterion, merge-tree raising, head missing, base ref missing, a whole tick, bites forms) and 2 in test_merger_report.py;
  eight existing assertions on the exact journal sequence of a tick gained the would_merge line. 23 mutant rules in their own
  block right after the C3a-2 enqueue rules.
  Fix round after the independent gate (b82c6885c0, 8fbc895bdd): base_current asks GitHub through a read-only `git ls-remote
  origin refs/heads/<base>` (30 s bound, no ref or object written) journalled as remote_main, because the tick fetches the mirror
  once and a gate run outlasts merges; an unreadable remote gives remote_main null, base_current false, error, ok false. The report
  counts a git error only under errors (a conflict needs a tree and no error, a moved base needs a readable remote_main). A failed
  journal write in the shadow is printed to stderr and never raised, so no second ERROR decision line. Tests and mutant rules
  for each.
proof: |
  Every behaviour is produced by the committed code on fixtures under tmp (real git repos, GitHub and the runner faked); nothing
  ran on Pro and nothing was pushed. The shadow reaches Pro when the lead's gate merges and the launchd tick next extracts merger.py.
bites:
  consumer: >-
    The launchd tick com.balizero.localci-merger on Pro, reading the mirror ~/.nuzantara-pilots/local-ci/merger/repo.git and
    writing decisions.jsonl.
  observation: >-
    Owed after merge and the tick's next extraction of merger.py (this lane does not ship): on Pro, the first decision that
    reaches the enqueue step is followed by a {"kind":"would_merge"} line in decisions.jsonl carrying code_sha, a merge_tree
    that is a 40-hex sha, clean true and no error, `git -C repo.git for-each-ref` unchanged by it, and `merger.py report`
    printing phase F shadow: would_merge=N with N at least 1.
ground:
  ts: "2026-10-08T18:10:00Z"
  siblings: >-
    Worktree from origin/main 86b151beec (PR-B7 merged). B8 appends its own mutant rules at the end of merger_mutants.py in another
    worktree; the F1 rules sit right after the C3a-2 enqueue rules to avoid a conflict.
spend:
  adversarial_rounds: 0
  wall_clock_hours: 1
