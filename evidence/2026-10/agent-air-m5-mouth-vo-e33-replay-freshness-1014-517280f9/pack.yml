gear: 1
brief_ref: evidence/brief.yml
ruling: >-
  Fresh gate of #8456, condition C4 - nothing fails when a new signed pack lands and no-path-doors.replay.json
  stays recorded on an older one, which is how the fixture went stale before.
mission: >-
  The no-door replay fixture can no longer go stale silently when a new signed pack lands.
lanes:
  - lane: e33-replay-freshness
    role: build
    seat: claude-sonnet-5 (Claude Code workflow subagent), worktree mouth-vo-e33-replay-freshness-1014 on M5; evidence by Claude Sonnet 5.5.
  - lane: e33-replay-freshness-ground-truth
    role: ground_truth
    seat: >-
      the highest signed rulepack in apps/backend-rag/backend/services/visa_engine/contracts/packs/ (rulepack-prod-029,
      sequence 29); the test only reads the directory listing and the fixture, it asserts no rule of its own.
    nb: apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-029.signed.json
    query_hash: "8daa66acd3ba3f6adc9a78304e35d719667fa3e735b32492757ee085ea6bee0e" # pragma: allowlist secret
    note: query_hash = sha256 of rulepack-prod-029.signed.json at origin/main.
pii_scan: clean
bites:
  consumer: >-
    the required mouth CI leg on every future signed-pack PR (the Vitest tree under (visa-oracle)).
  where: ci
  observe: python3 scripts/ci/observe_visa_oracle_no_door_replay_freshness.py
  expect: "contains:no-door replay is fresh"
receipts:
