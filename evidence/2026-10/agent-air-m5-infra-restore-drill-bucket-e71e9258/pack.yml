decisions:
  - id: D-scoped-names
    decision: >-
      Every drill knob (bucket, endpoint, port, user, password, db) reads a RESTORE_DRILL_* name with the
      retired workflow's defaults; the wrapper keeps sourcing the whole secrets env because it needs the
      AWS_* credentials and the Telegram gateway's variables.
  - id: D-aws-credentials-generic
    decision: >-
      AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY stay generic: they are the Tigris credentials the daily backup
      producer uses, and they read the backups bucket (receipt 1). Renaming them would need a secrets-file
      edit on Mini for no isolation gain.
  - id: D-legacy-drill-removed
    decision: >-
      scripts/pg-restore-drill.sh had no caller, named a deleted workflow and still read TIGRIS_BUCKET; it is
      removed with its tg-gateway grandfathered entry rather than patched.
dissent:
  - seat: "codex gpt-5.6-sol (round 1, 57c2eddbb9)"
    objection: "MEDIUM: the sourced env is not isolated; generic AWS_* (session token, profile, region, CA bundle, config file), DOCKER_HOST/CONTEXT and DRILL_* still reach the drill."
    status: PLAUSIBLE
    disposition: >-
      CURED where real: DRILL_* now read RESTORE_DRILL_* names. Measured on Mini, none of the AWS/Docker knobs
      is set except AWS_ENDPOINT_URL_S3, which the explicit --endpoint-url overrides; AWS credentials stay
      generic by decision D-aws-credentials-generic. Round 2 judged this disposition acceptable.
  - seat: "codex gpt-5.6-sol (round 1)"
    objection: "LOW: RESTORE_DRILL_TIGRIS_ENDPOINT is never shown to apply."
    status: CONFIRMED
    disposition: "CURED: test_the_drill_scoped_endpoint_override_still_applies pins the argv."
  - seat: "codex gpt-5.6-sol (round 1)"
    objection: "LOW: the parent kills the watchdog subshell's PID, not its group; its sleep outlives the run."
    status: CONFIRMED
    disposition: "CURED: both exit paths kill -- -WATCHDOG_PID (own group under set -m, verified by round 2 on bash 3.2)."
  - seat: "codex gpt-5.6-sol (round 1)"
    objection: "LOW: scripts/pg-restore-drill.sh is a stale executable that still reads TIGRIS_BUCKET."
    status: CONFIRMED
    disposition: "CURED: removed with its grandfathered entry (decision D-legacy-drill-removed); round 2 found no consumer."
  - seat: "codex gpt-5.6-sol (round 2, a40d444e6a)"
    objection: "LOW: the watchdog test ignored pgrep's return code, so a failed process-table read passed it."
    status: CONFIRMED
    disposition: >-
      CURED in 52c31da236: the test reads pipe lifetime (TimeoutExpired if the sleep survives), red on
      57c2eddbb9. Not re-reviewed by a third round (test-only change, guilt-checked).
residuals:
