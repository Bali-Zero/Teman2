gear: 1
brief_ref: evidence/2026-10/agent-air-m5-infra-restore-drill-bucket-e71e9258/brief.yml
ruling: >-
  Installing mini.restore_drill (#8308) on Mini on 2026-10-12 showed the first scheduled run could never
  reach a verdict: the wrapper sources ~/.nuzantara-secrets.env with `set -a`, that file exports a generic
  TIGRIS_BUCKET naming the app's media bucket (no postgres/ prefix), and run_drill.sh read the generic name.
  The retired workflow pinned TIGRIS_BUCKET=nuzantara-backups literally (e1b328af52^:.github/workflows/restore-drill.yml:70),
  so the bug only exists on Mini.
  The same AWS_* credentials list nuzantara-backups/postgres/ from Mini (measured this session; latest dump
  2026-10-12 03:05, 458 MB). Separately, Homebrew awscli on Mini was broken (missing libaws-c-s3 dylib behind
  a python@3.14 pin) and was repaired on the host, outside this diff.
mission: >-
  The first scheduled mini.restore_drill run (2026-11-01 12:00 WITA) lists the backups bucket, not the media
  bucket the Mini secrets env names TIGRIS_BUCKET, so the organ installed from #8308 can reach a verdict.
