    seat: this session
  - claim: "Of the generic AWS/Docker/DRILL knobs a sourced env could set, only AWS_ENDPOINT_URL_S3 is present on Mini, and every aws call passes --endpoint-url."
    cmd: "ssh mini: presence probe ${VAR:+SET} over AWS_SESSION_TOKEN..DOCKER_TLS_VERIFY, DRILL_*, TIGRIS_ENDPOINT"
    result: "AWS_ENDPOINT_URL_S3 SET; all others unset"
