decisions:
  - id: D-gov-fees-kept
    text: >-
      Tariffs the article itself labels as governmental (SIHALAL registration free, BPJPH
      government fee up to IDR 500,000) and the LPH audit range stay; Bali Zero service prices
      and unattributed ranges a client would read as a quote become price on request.
  - id: D-bundles-kept
    text: >-
      KITAP + MERP bundles (45M / 55M / 33M) and single ERP/EPO prices stay; the generic
      "re-entry permit" budget lines in e25b and e31e (not named MERP) stay.
  - id: D-stamps
    text: >-
      Edited locales that were fresh are re-stamped to the new EN body hash; locales already
      stale or unstamped keep their state, so the translator's view of their other drift is
      not hidden.
  - id: D-llms-targeted
    text: >-
      The exports are patched on the changed lines only (209+/189-), as #8305 did, instead of
      a full regeneration that would rewrite ~346k lines of unrelated content.
  - id: D-pii-override
    text: >-
      The llms commit runs with PII_GATE_ENFORCEMENT=false: the gate scans the whole staged
      file and llms-full.txt already carries the published NPWP format example
      01.234.567.8-901.000 from the tax articles; the added lines match no PII pattern.
