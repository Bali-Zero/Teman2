bites:
  consumer: >-
    The proprioception probe push_witness (P1, cure pr) on every host, through scripts/push_witness_reconcile.py, and the trusted
    pre-push hook of every push, including this PR's own push from its worktree.
  observation: >-
    This PR's push wrote the first marker of M5's journal (~/.organism/push-witness/journal.jsonl, local_sha = the head SHA in the
    PR body). From the worktree after the push, the reconciler counts that tip witnessed with 0 findings; after merge, on M5,
    `python3 scripts/proprioception.py --probes push_witness --json --no-report` reports RECONCILED with 0 findings.
decisions:
  - >-
    The marker is written last, after every blocking check, by the hook file itself; the trusted bundle copies that file, so worktree
    pushes (husky runs `sh -e .husky/pre-push`) and unattended pushes (bundle wrapper `exec /bin/sh <tree>/.husky/pre-push`) run the
    same code. A journal that cannot be written warns and never blocks a push.
  - >-
    Witness = an exact marker for the tip SHA, its remote ref and the origin push URL (userinfo dropped on both sides). No host match:
    the journal is per host and $HOME. Valid roots first: FOREIGN-ROOT only when no marker names the checkout, a linked worktree or
    the bundle layout.
  - >-
    Cold start and transition: epoch = oldest marker; a tip's time = max(committer date, the reflog's move of
    refs/remotes/origin/<branch> to it). An unmarked tip before the epoch, or whose own tree lacks the witness code within 7 days
    of the epoch, is "uncovered" (counted, not judged). After the grace a stale hook is judged. No journal = checked 0 + note.
dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      Refutation of cure A: when the tracking ref has no reflog the fallback is the pusher-controlled committer date again, and
      the code reads the reflog's last line, not a "first sight".
    status: CONFIRMED
    resolution: >-
      Partly cured: an "unobserved" counter makes the missing reflog visible (test + mutant M21); the spec now says "the moment the
      reflog moved to it". M5 measured: core.logAllRefUpdates=true, 259 reflogs for 257 agent refs. Remainder declared.
  - seat: kimi-code/k3
    objection: >-
      Refutation: the tree-coverage exemption is pusher-controlled (base a branch on a pre-witness commit or revert the hook hunk,
      push with --no-verify, read "uncovered"), a permanent false-clean lane.
    status: CONFIRMED
    resolution: >-
      Cured by bounding it: the tree rule holds only within 7 days of the epoch, then a tip whose own hook lacks the witness is
      judged (test_after_the_grace_..., mutant M20). Kimi's "epoch only" would accuse every pre-merge worktree on day one.
  - seat: kimi-code/k3
    objection: >-
      hook_sha256 is recorded but never verified, and NUZ_PREPUSH_TRUST_ROOT plus an unanchored bundle regex let a pusher name a
      bundle-shaped directory with gutted helpers.
    status: PLAUSIBLE
    resolution: >-
      Declared, not cured: the spec says trust_root is a declared root classified by its path, not an attestation of the bundle's
      content, and that hook_sha256 is kept for audit. Building such a directory is a deliberate act by the host owner, the
      boundary the spec already names.
  - seat: kimi-code/k3
    objection: >-
      Drop the <checkout>/.worktrees/<lane> shortcut; trust only registered worktrees.
    status: PLAUSIBLE
    resolution: >-
      Refused: lanes are pruned after merge, and their pushes inside the window would turn into FOREIGN-ROOT (over-accuse).
      Planting a directory there needs host-owner write access. Declared in the spec.
  - seat: kimi-code/k3
    objection: >-
      $0 can be husky's trampoline, so hook_sha256 hashes the wrapper.
    status: PLAUSIBLE
    resolution: >-
      Refuted by measurement, not withdrawn by the seat: husky's .husky/_/h runs `sh -e .husky/pre-push` and the bundle wrapper
      runs `exec /bin/sh <tree>/.husky/pre-push`; scratch pushes under /bin/sh, /bin/bash 3.2 and a real bundle recorded the
      worktree hook's own sha256 (R3).
  - seat: kimi-code/k3
    objection: Replace the substring coverage test by an exact hash set of known witness hooks.
    status: PLAUSIBLE
    resolution: >-
      Refused on direction: keeping the string but removing the call is "covered", writes no marker and reads NO-WITNESS (a
      finding); a hash set would make every branch that edits the hook "uncovered".
  - seat: codex-gpt-5.6-sol
    objection: >-
      Stale tracking refs hide a bypassed push; STALE-WITNESS and journal failures read as "hook skipped".
    status: PLAUSIBLE
    resolution: >-
      The proprioception runner fetches before probes (--no-fetch is the escape hatch). The fix_hint now names the journal-failure
      cause; the spec declares STALE and journal failures as "a finding to read, not proof that the hook was skipped".
