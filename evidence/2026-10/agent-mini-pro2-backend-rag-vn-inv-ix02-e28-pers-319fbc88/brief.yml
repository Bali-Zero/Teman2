  - apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/personas/E28B.json
  - apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/personas/E28C.json
  - apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/personas/E28D.json
  - apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/personas/E28F.json
  - apps/backend-rag/backend/tests/services/visa_engine/test_seq19_pack.py
  - apps/backend-rag/backend/tests/services/visa_engine/test_seq20_pack.py
