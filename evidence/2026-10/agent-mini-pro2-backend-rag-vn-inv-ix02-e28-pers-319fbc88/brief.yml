gear: 2
gear_reason: >-
  Size and surface floor: five new gold-coverage persona fixtures plus count/exclusion wiring in two
  pack-pinned test files under apps/backend-rag (a backend-rag merge is a deploy). Test-only, no engine
  code, no rule data, no pricing, no migration.
mission: >-
  The gold-coverage floor gate replays E28A, E28B, E28C, E28D and E28F on the newest signed pack, so a rule
  change that unsupports any of the five turns the gate red.
objective: >-
  Add personas E28A (committed PT PMA investment, shareholder-director), E28B (company establishment past the
  published threshold), E28C (capital-market only), E28D (foreign branch or subsidiary) and E28F (IKN
  subsidiary), each SUPPORTED_CANDIDATES for its own product on the newest signed pack; keep the seq-19 and
  seq-20 pack tests honest about the corpus growing 23 to 28 by excluding E28B, E28C, E28D and E28F by name
  where those packs carry no eligibility support rule for them.
scope:
