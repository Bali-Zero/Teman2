decisions:
  - id: D-exclusion-by-name
    decision: >-
      E28B, E28C, E28D and E28F are excluded by name from the seq-19 and seq-20 coverage replays, the shape already
      used for E33G, D2__121D, E23U and E23V: those packs carry only review.e28b.usd-threshold-manual,
      review.e28c.usd-threshold-manual, review.e28d.usd-threshold-turnover-manual and
      review.e28f.ikn-threshold-manual, and the eligibility support rules el.e28b.company-establishment,
      el.e28c.capital-market, el.e28d.branch-or-subsidiary and el.e28f.ikn-subsidiary first appear in
      rulepack-prod-021. E28A replays green on both and stays in.
  - id: D-counts
    decision: >-
      seq-19 replays 20 of the 28 personas (test_corpus_has_twenty_personas) and seq-20 replays 22
      (test_corpus_has_twenty_two_personas); the seq-27 floor replays all 28.
  - id: D-synthetic
    decision: >-
      The personas are synthetic (generic label, nationality, role, age); no real-person data.
dissent:
  - seat: "claude-opus (red team)"
    objection: "LOW 1: the comment in both seq-19 and seq-20 tests says el.e28a.investment exists since seq-15 (seq-19: folded into seq-19); in fact it is already in rulepack-prod-001."
    status: RETRACTED
    disposition: "Cured: both comments now say it has existed since the first signed pack, seq-001."
  - seat: "claude-opus (red team)"
    objection: "LOW 2: the pattern review.e28b/c/d/f.*-threshold-manual does not match E28D's real review rule review.e28d.usd-threshold-turnover-manual."
    status: RETRACTED
    disposition: "Cured: both comments now name the four review rule ids exactly."
  - seat: "claude-opus (red team)"
    objection: "LOW 3: the section header at test_seq19_pack.py:854 still says Gold-coverage replay (19 of 23 personas)."
    status: RETRACTED
    disposition: "Cured: the header now reads 20 of 28 personas."
  - seat: "claude-opus (red team)"
    objection: "LOW 4: E28F.json label says Korean renewables group director (47), but birth_date 1979-12-08 makes the applicant 46 at both the entry date and the pack signed_at."
    status: RETRACTED
    disposition: "Cured: the label now says (46)."
  - seat: "claude-opus (red team)"
    objection: "INFO: E28A facts pair pt_pma_committed=true with establishes_indonesian_company=false, and its override keys are not alphabetical; a future seq-29 rule linking E28A to company establishment could turn the persona red for a reason the label hides."
    status: PLAUSIBLE
    disposition: "Kept as built: the plan's routes-off instruction asked for exactly this, it keeps E28B out of E28A's candidates today, and no rule reads the pair as a conjunct. If seq-29 adds such a conjunct, the persona goes red on that rule change, which is the gate working. Key order is cosmetic and not changed."
  - seat: "claude-opus (red team)"
    objection: "INFO: E28A read 'offshore IT' as a software founder with nationality DE; the plan may have meant Italian nationality. No location fact is set on any E28 persona."
    status: PLAUSIBLE
    disposition: "Accepted: no rule reads nationality for E28A, and the E23 reference persona sets no location fact either."
  - seat: "claude-opus (red team)"
    objection: "Suite note: 2 failures and 31 errors in the visa_engine tree (test_evaluate_endpoint.py, test_visa_engine_retention_fk_registry.py), identical on Mini main at the same HEAD."
    status: RETRACTED
    disposition: "Baselined here: the identical 2 failed and 31 errors reproduce on the main checkout at 12200510b2 with this branch absent; neither file touches gold coverage or personas. Local test-database schema state."
