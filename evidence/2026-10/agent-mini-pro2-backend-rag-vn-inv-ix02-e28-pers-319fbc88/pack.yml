  - lane: ix02-package
    role: build
    seat: claude-sonnet-5 (packager; cured four LOW wording findings, ran the suite, wrote this pack).
  - lane: ix02-redteam
    role: review
    seat: claude-opus (read-only red team; replayed seq-27, ran guilt mutations on all five, replayed seq-19/seq-20, ran the suite).
