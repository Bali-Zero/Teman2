ruling: >-
  Visa night plan (I-X02, investor lane): the E28 family (E28A, E28B, E28C, E28D, E28F) had no gold-coverage
  persona, so the floor gate could not notice a rule change that unsupported any of the five investor products.
mission: >-
  The gold-coverage floor gate replays E28A, E28B, E28C, E28D and E28F on the newest signed pack, so a rule
  change that unsupports any of the five turns the gate red.
