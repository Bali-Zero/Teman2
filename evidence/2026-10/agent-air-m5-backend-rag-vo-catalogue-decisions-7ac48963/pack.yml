dissent:
  - seat: claude-opus-5-5 red team
    objection: >-
      MEDIUM: the claim "only the card title changes" is false; the /book/services fifth Visa card takes
      title, tagline, features and the WhatsApp prefill from the E33F snapshot row.
    status: CONFIRMED
    resolution: >-
      No code to cure; the PR body states the five real changes (heading, tagline = E33F description_en,
      features validity plus notes, USD 3,000/month shown twice, WhatsApp prefill). Price unchanged at 14.000.000.
  - seat: claude-opus-5-5 red team
    objection: >-
      MEDIUM: the edited e2e spec apps/mouth/e2e/book-pricing.spec.ts was never executed; CI runs only
      titles matching "page Page|@offline".
    status: CONFIRMED
    resolution: >-
      Open, not cured by code. Playwright never runs on M5; the spec must run on Pro (chromium and Mobile
      Chrome 320px) and /book/services be checked on the iQOO after vercel promote. Recorded here as an
      arming precondition, not claimed done.
  - seat: claude-opus-5-5 red team
    objection: >-
      MEDIUM: scripts/pricelist_2026/generate.py ignored the internal flag, so the price list and its PDF
      still published the generic rows.
    status: CONFIRMED
    resolution: >-
      Cured by the Gemini fix in e4cb4683d8: both loops in _build_sections skip internal rows, test
      test_generate_markdown_skips_internal_rows.
  - seat: claude-opus-5-5 red team
    objection: >-
      MEDIUM: the client brochure still publishes Retirement (Offshore) (PRICE_RET_OFF and brochure_en.html).
    status: CONFIRMED
    resolution: >-
      Cured in e4cb4683d8: PRICE_RET_OFF points to the E33F Offshore row (same 14.000.000 IDR) and the
      template row is relabelled. Residual: the committed brochure PDF is not regenerated and carries a stale E33E price.
  - seat: codex gpt-5.6-sol
    objection: >-
      HIGH: the anonymous /api/pricing/service still returned the internal Retirement rows; the flag was
      honoured only by the mirror generator.
    status: CONFIRMED
    resolution: >-
      Cured in e4cb4683d8 and 9fb3f2208c: the route returns 404 for internal rows through a helper in
      dynamic_pricing.py; PricingService.get_service_by_key is unchanged. Three 404 tests plus a
      backend-innocence test in test_public_pricing_lookup.py; the docstring note was moved out of the route
      docstring to hold the OpenAPI pin.
  - seat: claude-opus-5-5 red team
    objection: >-
      LOW: the commit title overclaims "leave public surfaces"; PricingService.search_service,
      format_for_llm_context, legacy recommend_visas, the Qdrant pricing collection and /api/pricing/all
      (which exposes the internal marker) still serve the generic rows.
    status: CONFIRMED
    resolution: >-
      Claim narrowed in the PR body; those are backend and conversational paths the ruling keeps. Whether
      search_service and format_for_llm_context should skip internal rows is a question for Zero, a separate PR.
  - seat: claude-opus-5-5 red team
    objection: "LOW: the price-list note was too technical and exposed catalogue mechanics."
