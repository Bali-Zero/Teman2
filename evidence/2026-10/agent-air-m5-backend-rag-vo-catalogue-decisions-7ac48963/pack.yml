    decision: >-
      The three generic Retirement rows and their keys stay in the backend catalogue at unchanged prices;
      signed packs seq-009..027 resolve "Retirement (Offshore)" and renewal_rules.py uses "Retirement (Extend)".
  - id: D-price-parity
    decision: >-
      E33F Offshore 14.000.000 equals Retirement (Offshore) 14.000.000; E33F Altus 16.000.000 equals
      Retirement (Altus/Onshore) 16.000.000; E33F Extend 10.000.000 equals Retirement (Extend) 10.000.000.
      No price changes.
