dissent:
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER: the report rebuilds every comparison from GitHub's present, so a FALSE_GREEN seen at tick time disappears after a green re-run or when the context stops being required."
    status: CONFIRMED
    resolution: "The FALSE_GREEN count each decision line recorded at tick time (hosted_compare.counts) is summed and printed apart, and any of it exits 1. Test: a recorded false green with GitHub now green exits 1; mutant killed."
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER: 50 merged PRs whose merges happened at another head, or whose gate had no usable contexts file, satisfy the printed merges counter."
    status: CONFIRMED
    resolution: "The window separates merged_prs from compared_merges (merged at a decided head with contexts_status ok); the phase E line prints only compared_merges. Test and mutant."
  - seat: codex-gpt-6.1-sol
    objection: "The report can compare another repository: the state dir's repo binding and the decisions' repo are not checked."
    status: CONFIRMED
    resolution: "A state dir bound to another repo or a decision of another repo in the window is exit 2. Two parametrised cases; mutants killed."
  - seat: codex-gpt-6.1-sol
    objection: "A torn decision line is dropped by the tolerant reader and the report counts the rest as clean; a PermissionError escapes."
    status: CONFIRMED
    resolution: "The report reads with its own strict reader inside the error handling: an unreadable line or a record without a timestamp is exit 2. Test and mutant."
  - seat: codex-gpt-6.1-sol
    objection: "The wrapper's clone and fetch still inherit GIT_COMMON_DIR, GIT_TEMPLATE_DIR and GIT_OBJECT_DIRECTORY before Python strips them."
    status: CONFIRMED
    resolution: "The wrapper unsets every inherited GIT_* variable before its first git call. The wrapper test runs it with GIT_DIR and GIT_CONFIG_PARAMETERS planted; mutant killed."
  - seat: codex-gpt-6.1-sol
    objection: "Mirror-local config and host attributes sit outside the isolation: a core.fsmonitor runs despite hooksPath; a global attributes file rewrites checkouts."
    status: CONFIRMED
    resolution: "core.fsmonitor=false, core.attributesFile=/dev/null and GIT_ATTR_NOSYSTEM=1 in the merger's git and the runner env. Guilt tests plant a mirror-local fsmonitor and an XDG attributes file (each first proven to fire); both override mutants killed. The system attributes file is not testable without root."
  - seat: codex-gpt-6.1-sol
    objection: "The wrapper extracts the two files from a moving ref: a concurrent fetch can pair merger.py from A with hosted_compare.py from B."
    status: CONFIRMED
    resolution: "The wrapper resolves refs/merger/base to one commit sha and extracts both files from it; the log names that sha. Mutant (HEAD instead of the sha) killed. Two first-ever bootstraps racing on one host stay possible; launchd never overlaps a job with itself."
  - seat: codex-gpt-6.1-sol
    objection: "A merged PR at the decided head with no merge_commit_sha silently falls back to the head."
    status: CONFIRMED
    resolution: "Exit 2. Parametrised case; mutant killed."
  - seat: codex-gpt-6.1-sol
    objection: "Wrapper failures before Python write no journal line though the README implies every failure is journalled; the install copies into directories it does not create."
    status: CONFIRMED
    resolution: "A failed fetch no longer stops the tick (it journals its own fetch error). The README states that a failure before Python lands only in the err log and shows as longest_silence in the report, and the install starts with mkdir -p."
  - seat: codex-gpt-6.1-sol
    objection: "13.99 days prints as 14.0; --since 2026-10-07Z is accepted and silently drops the day."
    status: CONFIRMED
    resolution: "days is floored to the thousandth; --since must be YYYY-MM-DD or a full UTC timestamp, else exit 2. Tests and mutants."
  - seat: codex-gpt-6.1-sol
    objection: "Mutants survive: context FALSE_RED accumulation replaced by 0, days forced to 0."
    status: CONFIRMED
    resolution: "Exact context counts asserted in the class fixture; floored-days test. Both mutants killed."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: every decision of a PR is compared on the final merge commit whatever base it was decided on, hiding an old false green."
    status: CONFIRMED
    resolution: "The merge commit judges a decision only when its sole parent is the decision's base_sha; any other decision is compared on its head, and tick-time false greens are kept. Test and two mutants."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: merge_commit_sha only carries post-merge push runs; contexts that run on merge_group become HOSTED_PENDING and mask false greens."
    status: RETRACTED
    resolution: "Measured: #8012's merge_commit_sha 56c6f70d86d3 carries 18 merge_group runs (plus 9 push, 13 workflow_run). The commit the queue pushes IS the merge-group commit. A context left pending is counted as hosted_pending, never as agreement."
  - seat: agy-gemini-3.1-pro
    objection: "A flaky push-only check on the merge commit fabricates a FALSE_GREEN and blocks the phase E flip."
    status: PLAUSIBLE
    resolution: "Kept on purpose and stated in the README: a push run of a same-named check counts, red-dominant, so it can only ADD a false green — the fail-safe direction for a criterion that must reach zero. The row names the hosted sha so an operator can see it."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: with set -e a failed fetch aborts the wrapper before Python; 14 silent days satisfy the criterion."
    status: CONFIRMED
    resolution: "A failed fetch is not fatal (the tick journals its own fetch error); the report prints longest_silence, the widest gap between journal lines, so a silent merger does not age the window unseen."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: merger.py is not on main, so the wrapper's git show fails."
    status: RETRACTED
    resolution: "merger.py is on main since #8017 (619fee6cef); the launchd tick ran it from 147893328732."
  - seat: agy-gemini-3.1-pro
    objection: "Isolating global config disables the credential helper, so fetching a private repo fails."
    status: RETRACTED
    resolution: "Bali-Zero/Teman2 is public (gh api repos/Bali-Zero/Teman2 --jq .private → false); the isolated fetch succeeded in every Pro tick, the launchd one included."
  - seat: agy-gemini-3.1-pro
    objection: "An OSError in decide() escapes to an error line and the same PR is retried forever."
    status: CONFIRMED
    resolution: "decide() turns OSError into an ERROR decision for that key, like MergerError. Test with a PermissionError from the worktree step; mutant killed."
owed:
  - "PR-C3 (phase E rehearsal, named here, not built): a `merge --armed` path gated on an environment flag AND the label `localci:merge-shadow-ok`, exercised once on a sandbox repository or a docs-only PR with GitHub's own required checks still required. Until C3, `merge` refuses with exit 2."
  - "The runner plans review.independent and leaves it QUEUED, so overall is never PASS in shadow: the PR-level FALSE_GREEN stays vacuous until the merger imports a review; the context level (now + recorded at tick time) is the live instrument."
  - "The launchd job runs on Pro from a wrapper copied from this branch; after merge the copy is re-taken from main (cmp -s against origin/main, superscar #1)."
  - "GIT_ATTR_NOSYSTEM has no guilt test (planting a system attributes file needs root)."
  - "A kill -9 of a tick leaves its runner child running to the runner's own deadline; a second host (Mini) needs the Postgres lease of spec §3 before it may tick (both carried from C1)."
