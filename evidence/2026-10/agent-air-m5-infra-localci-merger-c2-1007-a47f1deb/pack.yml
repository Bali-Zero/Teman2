brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-SOVEREIGN phase C/D (the merger, SHADOW only), handed by the team lead of the 2026-10-07 mission to
  this BLUE Dux; plan docs/specs/localci-sovereign-2026-10-07.md §2 (phases C-D), ruling docs/rules/RULINGS.md RULED
  2026-10-07. Split agreed in the mandate: PR-C1 (#8017, merged 619fee6cef) = tick, lease, merge stub; PR-C2 (this
  pack) = report, launchd schedule and the eight notices of C1's gate.
lanes:
  - lane: localci-merger-c2-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux, M5 worktree infra-localci-merger-c2-1007; code, tests, Pro install and proof, this pack)"
  - lane: localci-merger-c2-redteam
    role: review
    seat: "codex-gpt-6.1-sol (codex-companion via the codex:codex-rescue subagent, read-only, effort high)"
  - lane: localci-merger-c2-refuter
    role: review
    seat: "agy-gemini-3.1-pro (agy --sandbox --model gemini-3.1-pro-high, prompt-only, files inlined)"
council_run: council-journal.jsonl
seat_override: >-
  Two external families reviewed the candidate (OpenAI Codex and Google Gemini 3.1 Pro), but only the Gemini line counts
  for R9: the Codex runtime printed gpt-6.1-sol while the roster still names codex-gpt-5.6-sol, so the Codex line is
  journalled under its true name and does not qualify. The seat was not renamed to fit the roster.
seat_fallback_reason: >-
  The reserve agy-gemini-3.1-pro stood in because the remaining titular seats were dead at dispatch (arsenal_probe
  2026-10-07T10:19:10Z on M5): kimi QUOTA_DEAD (membership quota), tp1-qwen3.8-max and tp1-glm-5.2 QUOTA_DEAD (HTTP 429,
  monthly plan quota). agy was LIVE.
pii_scan: clean
pii_scan_note: >-
  Code, tests and GitHub metadata only (PR numbers, shas, check names). The journal and the report carry no PR title,
  author or body; no client data was read or written.
what_changed: |
  scripts/localci/merger.py: `report` — every kind=decision line since --since beside what GitHub did with that head
  (GETs only: pulls/N, the merge commit's parents, the live required contexts). Per decision AGREE / FALSE_GREEN /
  FALSE_RED / BLIND / PENDING; as the phase-D instrument, hosted_compare's per-context classes summed (compared on
  merge_commit_sha when the queue merged the decided head on the decided base, else on the head) plus every FALSE_GREEN
  the decision lines recorded at tick time. Window with compared_merges (not every merged PR), floored days and the
  longest silence between journal lines; exit 1 on any FALSE_GREEN, 2 on an unusable input. Hardening (C1 gate notices
  N1-N4 and the reviews): git() drops every inherited GIT_* variable and isolates config, attributes, hooks and fsmonitor,
  also in the runner env; an OSError is an error line in the tick and an ERROR decision once a PR is picked.
  scripts/localci/merger_tick.sh (new) + infra/launchagents/com.balizero.localci-merger.plist (new): launchd tick every
  600 s, no KeepAlive, PATH explicit; runs merger.py and hosted_compare.py as committed at one resolved origin/main sha
  read from the merger's own mirror; a failed fetch is not fatal (the tick journals its own).
  scripts/localci/tests/test_merger_report.py (new, 25 cases) and test_merger.py from 33 to 41 cases.
  scripts/localci/README.md: "Report (phase D's instrument)" and "Schedule (launchd, Pro)" under the Merger section.
  Net size 587 added, 16 deleted (merger.py 147, tests 320, wrapper/plist 65, README 55): one concern — the report and the
  schedule that feeds it; the tests are most of it and splitting them from the code they guard would ship it unguarded.
proof: |
  See receipts. The report's only GitHub calls are GETs through hosted_compare.gh_get; the tick is unchanged in kind
  (GETs and git fetch). runner.py, contexts_matrix.yaml and hosted_compare.py are untouched.
bites:
  consumer: >-
    The Pro launchd job com.balizero.localci-merger (user nuzantara), which runs the tick every 600 s and appends to
    ~/.nuzantara-pilots/local-ci/merger/decisions.jsonl; the operator's phase E decision reads `merger.py report`.
  observation: >-
    Pro, launchd run 1 of com.balizero.localci-merger (bootstrapped 2026-10-07T10:56:15Z, RunAtLoad): wrapper code=147893328732
    (origin/main, read from the mirror), decision line 2026-10-07T10:59:12Z for armed PR #7961 (head c664152d40d8) —
    BLOCKED, candidate 6627597f4028 on base 147893328732, seal 154e41b57edd, hosted agreement 4/14, 171.9 s, last exit
    code 0; then `merger.py report` on the live journal at bf70d95bda: 6 decisions, context-level agree=8 false_green=0
    false_red=0 local_blind=76, compared_merges=0, rc 0. launchd run 2 (StartInterval, no hand) journalled #7962 at
    2026-10-07T11:11:34Z, exit 0.
ground:
  ts: "2026-10-07T10:11:00Z"
  siblings: >-
    PR-C1 (#8017) merged as 619fee6cef at 10:07:43Z; this branch starts there (agent_start, fresh origin/main). The sibling
    phase-A lane owns runner.py, contexts_matrix.yaml and README lines 1-80; this change touches none of those and only the
    README's Merger section. origin/main moved to 1478933287 during the session with no change under scripts/localci or
    infra/launchagents (git merge-tree clean).
spend:
  adversarial_rounds: 1
  wall_clock_hours: 1.2
