dissent:
  - seat: codex-gpt-5.6-sol
    objection: "r1 C2 / r2 R1: secrets shorter than 8 (now 6) chars, and DSN passwords under 2, still pass."
    status: PLAUSIBLE
    resolution: "Lowered 8 -> 6 (quoted) and 3 -> 2 (DSN); shorter is a declared limit: a 1-5 char value is not distinguishable from code at acceptable cost."
  - seat: codex-gpt-5.6-sol
    objection: "r1 C8: a phone wrapped over a newline is two fragments."
    status: PLAUSIBLE
    resolution: "Declared limit; joining across lines would merge numeric columns everywhere."
  - seat: codex-gpt-5.6-sol
    objection: "r1 C11: TOCTOU between the symlink checks and read_bytes()."
    status: PLAUSIBLE
    resolution: "Declared limit: needs a concurrent local writer during a hand-run build on the owner's laptop."
  - seat: codex-gpt-5.6-sol
    objection: "r2 N2: a credential containing xxxx/example is excused."
    status: PLAUSIBLE
    resolution: "Declared limit: for a random token the odds are below 1e-5; families are excused only by xxxx/example/<."
