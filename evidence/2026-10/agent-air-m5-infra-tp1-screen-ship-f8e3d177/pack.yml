pii_scan: clean
pii_scan_note: >-
  Code and invented fixtures only. Every phone, e-mail and credential-shaped value in
  scripts/tp1max/test_build_queues.py is assembled at runtime by concatenation; detect-secrets
  reports 0 hits on scripts/tp1max/ and this directory. The real-tree measurements were taken
  by path and reason only; phone windows were printed with every digit masked, e-mails by TLD.
  The council answers in journal.jsonl carry the seats' own example shapes; on the lines the
  screen itself flags, the backtick spans were replaced by "<example redacted>" (16 lines);
  the sha256 of each raw answer is recorded and the raw text stays in the verifier's scratch.
council_run: journal.jsonl
