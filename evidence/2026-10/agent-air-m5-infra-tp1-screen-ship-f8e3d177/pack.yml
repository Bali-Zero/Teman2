what_changed: |
  Commits 1bd6123449, a29ba11f58, ae8589555e, 5815a04fa1, a56b2e5723, fe16a70557 and the
  gate-#7971 cure commit on origin/main f9635d4835.
  - scripts/tp1max/build_code_queue.py: the queue builder with a fail-closed screen. Reasons:
    unsafe_path, excluded_path, symlink (file or linked directory), not_regular (a FIFO, device
    or directory where a tracked file was), unreadable (vanished or unreadable), oversized,
    empty, binary, short, secret, phone, email, screen_error. Phones: separator-normalised digit runs, group-aligned windows, Indonesian
    mobile/landline and international shapes. Secrets — explicit families, PEM header, URL
    credentials, key-like names assigned a literal. E-mail: role mailbox at own domains or any
    address at a documentation domain. The path is screened with the text.
  - scripts/tp1max/build_verify_queue.py: from #7927; stage-A findings are re-screened and
    the skips counted (skipped_unclean_findings).
  - scripts/tp1max/test_build_queues.py: guilt per shape, innocence corpus, exact per-reason
    counts on a fixture repo, fail-closed exception, verify re-screen.
  - .github/workflows/tp1-screen-tests.yml (py3.9 + py3.11) and its entry in
    main-push-failure-watch.yml.
  Against the Codex build: the optional detect-secrets plugin layer was removed (verdict
  differed between CI and M5); compound names, JSON keys, shell NAME=value, PEM with escaped
  newlines, DSN, merged/identifier/NBSP/unicode-dash/00-prefix phones, person addresses at
  own domains, excluded paths counted, two quadratic regexes bounded.
  Gate #7971 cure (one commit, gate BLOCK B1): context rules judged as literals for
  Authorization Basic/Bearer/Token headers, curl -u/--user (with a space, glued, "=" or a
  quoted credential), --password/--passwd and netrc login/password lines; private_key among
  the key-like names; families hf_, Discord webhook URLs and Azure AccountKey=. Every
  detector runs on four views: the text, its unescaped form (URL %XX, \uXXXX, HTML entities),
  and the printable runs of 6+ characters inside its base64 runs (and inside the unescaped
  form's). A phone glued to letters is found. The JWT alternatives start only at a token
  start, so they are linear without a length cap; KEYWORD has one [ \t]* per gap, "=" may
  cross one newline (also after "(" or a backslash) and ":" may not; quoted values have no
  upper cap. The read is os.open with O_NONBLOCK and O_NOFOLLOW, then fstat and S_ISREG.
proof: |
  Deterministic floor 3, source path (a new workflow), measured with --print-floor.
  Verifier fixture tree (invented): Codex build 17 of 93 guilt files queued, #7927's 49;
  this head 0 of 95, every reason count exact; 20 innocence files, 20 queued.
  Gate #7971's own fixture tree (its fixture_attack.py, read-only): fe16a70557 queued 16 of
  92 guilt files; this head 0 of 92, all 20 special files under the expected reason; 6 of 28
  innocence files skipped (f-string DSN template, shell lowercase var, $(cmd), token_type
  bearer, an unsigned max, a +date), against 7 at fe16a70557.
  Real tree at origin/main f9635d4835, same tree each time: #7927's screen 5297 jobs,
  fe16a70557 5205, this head 5192 (08:20:21Z). Against fe16a70557, 13 files leave and none is
  sensitive: 6 dates after a label or identifier, 2 SVG paths and 1 list of years (phone, the
  cost of finding a phone glued to letters); 2 type annotations naming Ed25519PrivateKey after
  private_key, and 3 tuples of quoted words under a key-like name (secret). 7 enter: 5 class
  names followed by a docstring (the old newline-crossing KEYWORD) and 2 date lists.
  Red first: the suite at fe16a70557 hung on the FIFO and refused the netrc line first
  (05:44Z); the current tests against the first cure and against Kimi's third-pass code are
  red (07:22:54Z, 07:40:55Z).
  Mutations on scratch copies, this round: 40 distinct mutants aimed at the cure, all red. Four
  that first timed out under a load average above 300 were re-run red with a longer timeout;
  the blocking-open mutant hangs the suite by design. One over-flagging survivor was killed
  with a new innocence line. The 61 earlier mutants were re-run: 47 red, and 14 no longer
  apply verbatim, each covered by a re-pointed mutant or, for the phone lookbehind changed on
  purpose, by letter-glued-phone-off.
  CPU cost at 512 KiB for 18 pathological inputs, the gate's 13 included: at most 1.87 s
  (fe16a70557: 64 KiB of eyJ took 10.46 s; now 0.14 s, and 1.16 s at 512 KiB). The suite
  holds a linearity test on process_time: four times the input may cost at most eight times.
  Suite: 5 passed on 3.11.15 and 3.9.6.
