  council quorum (R9) and reviewer independence cannot be met by the lint's listed seats today. The
  builder is Codex O3, so the three Codex O2 rows are the builder's family and are not counted as
  independent. Kimi K3 answered round 1 (NO-GO, every item dispositioned in review_disposition), then
  timed out in round 2 (1200 s) and stopped on its 5-hour quota (403) during the final review. The
  TP1 seats (qwen3.8-max, deepseek, glm) are out of monthly quota (429) until 2026-10-11T16:00Z;
  agy-gemini is busy in the owner's windows. Fallbacks tried on the imperator's order: the Qwen CLI
  has no broker seat (unknown seat qwen); Ollama qwen3.5:9b on Mini, local and unlisted, answered on the
  retry (NO-GO, 10 items: 1 confirmed and cured in a56b2e5723, 8 not defects by probe, 1 declared limit).
