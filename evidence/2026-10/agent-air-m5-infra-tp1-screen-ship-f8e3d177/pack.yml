what_changed: |
  Commits 1bd6123449, a29ba11f58, ae8589555e, 5815a04fa1, a56b2e5723 on origin/main f9635d4835.
  - scripts/tp1max/build_code_queue.py: the queue builder with a fail-closed screen. Reasons:
    unsafe_path, excluded_path, symlink (file or linked directory), unreadable (vanished,
    unreadable, a directory), oversized, empty, binary, short, secret, phone, email,
    screen_error. Phones: separator-normalised digit runs, group-aligned windows, Indonesian
    mobile/landline and international shapes. Secrets — explicit families, PEM header, URL
    credentials, key-like names assigned a literal. E-mail: role mailbox at own domains or any
    address at a documentation domain. The path is screened with the text.
  - scripts/tp1max/build_verify_queue.py: from #7927; stage-A findings are re-screened and
    the skips counted (skipped_unclean_findings).
  - scripts/tp1max/test_build_queues.py: guilt per shape, innocence corpus, exact per-reason
    counts on a fixture repo, fail-closed exception, verify re-screen.
  - .github/workflows/tp1-screen-tests.yml (py3.9 + py3.11) and its entry in
    main-push-failure-watch.yml.
  Against the Codex build: the optional detect-secrets plugin layer was removed (verdict
  differed between CI and M5); compound names, JSON keys, shell NAME=value, PEM with escaped
  newlines, DSN, merged/identifier/NBSP/unicode-dash/00-prefix phones, person addresses at
  own domains, excluded paths counted, two quadratic regexes bounded.
proof: |
  Deterministic floor 3, source path (a new workflow), measured with --print-floor.
  Verifier fixture tree (invented): Codex build 17 of 93 guilt files queued, #7927's 49;
  this head 0 of 95, every reason count exact; 20 innocence files, 20 queued.
  Real tree at origin/main f9635d4835, same tree for both: #7927's screen 5297 jobs, this one
  5205 (consumer command on 3.9.6 at a56b2e5723, 04:45:10Z). 96 files leave the queue
  (mostly secret — key-like names with literal values, DSN passwords); 10 enter, each read: 7 role mailboxes and 3 *.invalid, an image
  id, a regex naming xoxb-, a key whose value spells FAKE.
  Mutations on scratch copies: 39 + 15 + 3 targeted, all red after tests were added for the
  two survivors. Suite: 4 passed on 3.11.15 and 3.9.6; 512 KiB adversarial inputs under 0.3 s.
seat_note: >-
  Codex answered as gpt-6.1-sol; the round-1 session file is under ~/.codex-o2/sessions, so
  the O2 account answered (the builder was O3: same family, so Codex sat on the council only,
  never as the grader). Kimi K3 round 2 timed out at 1200 s with no answer (ok:false); its
  final cross-family review stopped on the seat's 5-hour quota (403) with no verdict, so the
  final diff was re-reviewed by Codex O2 (same family as the builder; disclosed as such). TP1
