decisions:
  - id: D-notice-never-blocks
    decision: >-
      Continue is the only tree option and fail-open: the notice informs, the signed pack still decides, so the
      enumerator walk count and memo are unchanged. Second Home and Change my answers are secondaryActions rendered
      by OracleShell, outside the tree.
  - id: D-age-mirrors-engine
    decision: >-
      ageYearsAt mirrors derived.age_years (UTC, birthday-inclusive, leap-day births on 1 March); an unusable or
      future birth date shows no notice. RETIREMENT_MIN_AGE is exported and pinned by a test to the newest signed pack.
  - id: D-known-items-not-fixed
    decision: >-
      Not fixed here, by design: the no-path-doors replay evidence is still at seq 23 (fingerprint re-pinned only), and
      "Second Home has no age condition" was deliberately omitted from the copy (not test-pinned elsewhere).
