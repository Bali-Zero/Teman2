gear: 2
brief_ref: evidence/brief.yml
ruling: >-
  Zero, 2026-10-11 ("Avviso più Continua") on the E33/retirement program — before this, the visitor answered the
  whole retirement branch only to learn at the end that the retirement routes start at 55; the notice comes right
  after the tile choice and never blocks.
mission: >-
  A retirement visitor under 55 learns it right after choosing the tile, not after answering the whole branch.
lanes:
  - lane: vo-r2-agegate
    role: build
    seat: Claude Sonnet 5 implementer (subagent), worktree mouth-vo-r2-agegate-1011 on M5; rebase and evidence by Claude Opus 5.5 (ship session).
  - lane: vo-r2-ground-truth
    role: ground_truth
    seat: >-
      the newest signed production rule pack (rulepack-prod-027), whose hf.e33e / hf.e33f age-below-55 rules
      the 55 threshold mirrors; the change asserts no rule of its own and a Vitest pins RETIREMENT_MIN_AGE to it.
    nb: apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-027.signed.json
    query_hash: "662c824712cb3ffa495a05748312f46b0358515cbed0c6841e06b636482f2aa9" # pragma: allowlist secret
    note: query_hash = sha256 of rulepack-prod-027.signed.json at origin/main.
pii_scan: clean
bites:
  consumer: >-
    the public Visa Oracle interview at balizero.com/visa-oracle: the retirement_age_notice screen shown to a
    retirement visitor under 55 (OracleShell, QuestionScreen).
  where: ci
  observe: python3 scripts/ci/observe_visa_oracle_retirement_age_notice.py
  expect: "contains:retirement age notice holds"
