gear: 2
brief_ref: evidence/brief.yml
ruling: >-
  Zero, 2026-10-11 ("Avviso più Continua") on the E33/retirement program — before this, the visitor answered the
  whole retirement branch only to learn at the end that the retirement routes start at 55; the notice comes right
  after the tile choice and never blocks.
mission: >-
  A retirement visitor under 55 learns it right after choosing the tile, not after answering the whole branch.
