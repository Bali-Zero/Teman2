decisions:
  - id: D-notice-never-blocks
    decision: >-
      Continue is the only tree option and fail-open: the notice informs, the signed pack still decides, so the
      enumerator walk count and memo are unchanged. Second Home and Change my answers are secondaryActions rendered
      by OracleShell, outside the tree.
  - id: D-age-mirrors-engine
    decision: >-
      ageYearsAt mirrors derived.age_years (UTC, birthday-inclusive, leap-day births on 1 March); an unusable or
      future birth date shows no notice. RETIREMENT_MIN_AGE is exported and pinned by a test to the newest signed pack.
  - id: D-known-items-not-fixed
    decision: >-
      Not fixed here, by design: the no-path-doors replay evidence is still at seq 23 (fingerprint re-pinned only), and
      "Second Home has no age condition" was deliberately omitted from the copy (not test-pinned elsewhere).
dissent:
  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-11T09-20-16-01a1288b-db59-7421-b7a4-4e52e21d49d7.jsonl, model verified in the rollout file)"
    objection: "MEDIUM - the bites observer claims EN and ID plus a real Second Home branch, but the shell test is English only and stops at the generic trip_scope after Look at Second Home."
    status: RETRACTED
    disposition: "Cured in the follow-up commit: a Bahasa Indonesia UI case (heading, date, three actions, group name) and the Second Home case now answers trip_scope and waits for q.secondhome_basis; MIN_TESTS raised to 6 and its pytest re-pinned."
  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-11T09-20-16-01a1288b-db59-7421-b7a4-4e52e21d49d7.jsonl, model verified in the rollout file)"
    objection: "LOW - the main notice compares a date of birth with an age, and 'the retirement visas' sounds broader than the two routes anchored in the pack."
    status: RETRACTED
    disposition: "Cured in the follow-up commit: EN and ID copy reworded to 'routes checked here require applicants to be at least 55 ... you are under 55'."
  - seat: "codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-11T09-20-16-01a1288b-db59-7421-b7a4-4e52e21d49d7.jsonl, model verified in the rollout file)"
    objection: "LOW - secondary actions have no visual hierarchy and their role=group has no accessible name."
    status: RETRACTED
    disposition: "Cured in the follow-up commit: an oracle-option-card--secondary style and a localized group label (q.retirement_age_notice.other_routes) passed through a new QuestionScreen prop; asserted in the ID test."
