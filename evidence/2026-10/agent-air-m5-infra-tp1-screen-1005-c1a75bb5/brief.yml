task_id: tp1-screen-1005
gear: 2
l_level: L1
gate_class: opus
objective: >-
  Follow-up of PR #7889 (TP1 batch runner), mission TP1OPS2-20261005. (1) Move the
  input screen that decides what leaves the machine for the Alibaba Token Plan into
  the repo, tested: scripts/tp1max/build_code_queue.py and build_verify_queue.py,
  fail-closed (unreadable, secret/PII including +62/62- separator phone shapes,
  binary, oversized, symlink -> skipped and counted, never queued). (2) Cure the
  AllocationQuota over-stop: the runner classified error bodies AFTER scrub() had
  redacted every 24+ char run, so a 429 "Throttling.AllocationQuota: quota exceeded"
  stopped the run (exit 5) and "insufficient_account_balance" was rejected row by
  row instead of stopping. (3) Negative usage counts rejected; an all-failing run
  exits 4 instead of 0 "drained"; a reply without usage is charged to
  --token-budget. (4) A workflow that actually runs these tests (none did).
acceptance:
  - text: >-
      The 7 tests appended to scripts/test_tp1_batch_runner.py fail on origin/main's
      runner and pass on this one; the two classification tests go through
      tp1_call_once over a faked transport, not classify() on raw text.
    probe: python3 -m pytest -q scripts/test_tp1_batch_runner.py
  - text: >-
      The screen queues only the clean file of a fixture repo holding a symlink, a
      NUL file, a non-UTF-8 file, an oversized file, a tracked-but-missing file, a
      directory where a file was, and six leak shapes; skip counts per reason are
      exact and no leak literal appears in the queue.
    probe: python3 -m pytest -q scripts/tp1max/test_build_queues.py
  - text: >-
      Both suites pass on 3.9 (the live interpreter, /usr/bin/python3) and 3.11, in CI.
    probe: .github/workflows/tp1-runner-tests.yml run on this PR head
  - text: >-
      AFTER merge, the live jobs run this code: re-pin by git archive of the merge
      commit into ~/.local/share/nuzantara/tp1max/src-<sha12>/ (blobs checked with
      git hash-object), loops repointed, jobs restarted; heartbeats show the new pid,
      skipped_done equal to the rows on disk, and ok rising between two reads.
    probe: >-
      cat ~/.local/share/nuzantara/tp1max/runs/{code-a,verify-ds,verify-glm}/heartbeat.json
assumptions:
  - text: >-
      scrub() redacts the Alibaba error codes the classifier needs.
    status: verified
    probe: >-
      scrub('Throttling.AllocationQuota: quota exceeded') -> '<REDACTED>: quota exceeded',
      classify(429, scrubbed) = quota vs classify(429, raw) = rate (2026-10-05)
  - text: >-
      No workflow ran scripts/test_tp1_batch_runner.py before this PR.
    status: verified
    probe: grep -rn 'tp1_batch_runner' .github/ (no match on origin/main 2026-10-05)
