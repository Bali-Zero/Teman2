secrets_guard_note: >-
  The pre-commit ban-predicates guard (P3, detect-secrets diff-scoped) fired on
  journal.jsonl lines 1 and 3. Located with the guard's own plugin set from
  .secrets.baseline, span never printed: HexHighEntropyString, line 1 columns
  144-153 and line 3 columns 182-191, both the 10-char value of the
  reviewed_head key (entropy 3.12 bits/char). Both resolve to commit objects of
  this branch (its first and second commit); neither appears in the process
  environment. A false positive of git-short-sha shape, not a credential. Lines
  2 and 4 carry the same two values (detect-secrets reports one location per
  distinct value per file). Cure: the four reviewed_head values are written as
  "commit <sha10>" so no quoted string is pure hex; no allow-list pragma, no
  hook bypass. The two pushed commits scan clean with the same plugin set
  (0 hits on 7 and 5 changed files), so nothing pushed needs rotation.
