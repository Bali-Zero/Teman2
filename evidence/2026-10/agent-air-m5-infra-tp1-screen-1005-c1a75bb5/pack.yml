what_changed: |
  4f5c661307 + 3eb01cb495 + fa088c5c66 on origin/main beb6991b30.
  - scripts/tp1_batch_runner.py: classify the RAW error body (door called with
    raw_errors=True), keep only the scrubbed copy; a 200 carrying a gateway
    error is classified on that error (auth/quota/rate); AUTH_RE stops the run
    on a failed credential (fa088c5c66: no longer on the bare word
    "authentication", which named the service in a 429); usage counts clamp
    at 0; a usage-less reply stops a budgeted run; exit 4 "stopped:all-failed"
    when every sent job failed or was rejected; a crashed call's exception
    text is scrubbed.
