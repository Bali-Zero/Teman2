pii_scan: clean
pii_scan_note: >-
  Source-only review and synthetic fixtures. Live probes return aggregate counts
  and permission flags only. No client identity, contact data or credentials are
  included in artifacts; the supervisor setting is resolved in memory.
cloud_ok: >-
  Builder Contract 4 permits code-only review with synthetic fixtures. No client
  PII or OSINT is transmitted to any model or included in review artifacts.
what_changed: >-
  A personal read view derives passport and stale-process duties from existing
  assigned CRM records. Source updates resolve the view. A narrow supervisor
  setting enables a team overview. The existing compliance register is preserved.
meta_pattern: >-
  Existing source records already own both the work and its completion state.
  Deriving duties avoids a second task state that could disagree with them.
operator_only: >-
  No operator-only action is needed for this release. The authorized supervisor
  grant was staged by the BLUE release owner before PR 8656 without exposing its
  value; the successor retains it and must not stage it again.
dissent:
  - seat: ci-production-build
    objection: >-
      PR 8656 failed its E2E webserver startup because the new register route
      was statically prerendered outside the accepted security baseline.
    status: CONFIRMED
    resolution: >-
      The successor adds a server layout with force-dynamic for this route.
      The existing proxy and accepted prerender baseline remain unchanged.
      A full production build and both bundle assertions are required before
      the new final gate; source permission and query logic are unchanged.
  - seat: kimi-code/k3
    objection: >-
      Existing case-sensitive client-owner and creator predicates can hide a
      process link when stored ownership differs in case from the token email.
    status: CONFIRMED
    resolution: >-
      Accepted existing fail-closed behavior; the new link flag deliberately
      matches the unchanged columns and normalization of the detail endpoint.
  - seat: kimi-code/k3
    objection: >-
      Verify client detail access and whether practices have a deleted_at column.
    status: RETRACTED
    resolution: >-
      verify_client_access already allows staff reads with allow_assigned=True;
      this grant does not change that rule. Read-only metadata inspection of the
      real test schema confirms practices has no deleted_at column.
  - seat: claude-opus-5-5
    objection: >-
      The relocated register test triggers token lint under default rename
      detection because an obligation ID resembles a hex color.
    status: CONFIRMED
    resolution: >-
      Annotated the existing ID as non-color test content. Rechecked the full
      committed base-relative diff under default git settings and register tests.
  - seat: claude-opus-5-5
    objection: Separate reads can briefly disagree during concurrent source edits.
    status: CONFIRMED
    resolution: Accepted for the read view; refresh reconciles the source data.
  - seat: claude-opus-5-5
    objection: >-
      Existing created_at timestamps omit timezone, so the age boundary follows
      the database session timezone.
    status: CONFIRMED
    resolution: >-
      Uses the existing database convention and a strict fourteen-day boundary.
      No migration or automatic failure transition is added.
