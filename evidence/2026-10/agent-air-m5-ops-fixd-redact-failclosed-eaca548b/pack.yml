    Production code and workflow come from the builder, plus two lines by the Dux; the tests come
    from the red commit 4afe49773b. Totals are not declared: the pack is part of the diff it would
    count, and most of the net lines are tests and this pack.
  behaviour_change: >-
    bash_call_log.sh writes `<REDACTION-FAILED reason=<missing|rc=N|empty> len=N>` instead of the
    raw command, and bounds the redactor at BASH_CALL_LOG_REDACT_TIMEOUT_S (default 2, capped at 10)
    through SIGALRM inside the same python3 process. redact_secrets.redact() returns "<REDACTED>"
    on an internal error. _redact_pii pass4 uses stripped names with edge-aware boundaries.
    _redact_dsn masks through the last "@". memory_index_build redacts the title, the type and the
    filename. guard-conformance.yml now RUNS test_bash_call_log.sh, which the registry already
    listed but no workflow executed (W81).

