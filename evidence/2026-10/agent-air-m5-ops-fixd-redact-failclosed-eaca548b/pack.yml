review_findings:
  - seat: tp1-deepseek-v4-pro
    verbatim: >-
      Concrete input that breaks an innocence promise: DSN `sqlite:///tmp/test.db` — `_redact_dsn()`
      returns "<dsn>" because there is no `@` after the `://`. [...] Other defect: LOW –
      infra/claude-hooks/redact_secrets.py:86-89: when any regex engine exception occurs [...] the
      whole command text becomes "<REDACTED>" instead of being returned unchanged.
    disposition: >-
      Both REJECTED. (1) origin/main already returns "<dsn>" for any DSN without "@"
      (`if "://" not in dsn or "@" not in dsn`), so the output is byte-identical to before. The
      export only ever builds Postgres DSNs. (2) This is the fail-closed trade the council ruled on:
      a whole cut beats echoing the input. No input was found that still gets raw text out.

