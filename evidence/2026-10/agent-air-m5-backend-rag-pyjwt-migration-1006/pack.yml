decisions:
  - >-
    One shared decoder, backend/app/utils/jwt_decode.py::decode_jwt, for all 11 decode sites: algorithms pinned
    per call (["HS256"] or [settings.jwt_algorithm], default HS256), options mirror python-jose 3.5.0 (exp
    mandatory with python-jose's whole-second boundary, future iat accepted, malformed iat / falsy aud / at_hash
    rejected). Every caller catches jwt.PyJWTError. 36/36 token shapes match python-jose side by side.
  - >-
    The helper lives in backend/app/utils, not backend/app/auth: the auth package's __init__ imports config,
    whose Settings() needs JWT_SECRET_KEY at import time; importing backend.app.dependencies must stay
    secret-free (test_import_chain_without_secrets, and the pre-commit import-chain hook refused the commit).
  - >-
    Three token shapes change class, all in the safe direction: exp null, iat null and iat as a list escaped
    python-jose as a bare TypeError (HTTP 500 at most call sites); they are now a PyJWTError (401).
  - >-
    PyJWT[crypto]==2.15.1 pinned in both requirement sources (it was already a direct dependency at 2.15.1 in
    both locks). Both locks are byte-identical to a fresh run of the uv pip compile command in their headers.
