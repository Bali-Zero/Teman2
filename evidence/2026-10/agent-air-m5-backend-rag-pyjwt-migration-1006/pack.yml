    objection: >-
      Expiry boundary: python-jose rejects when int(exp) < floor(now), PyJWT when int(exp) <= now (float), so a
      token expires up to one second earlier; the final-diff review ended VERDICT BLOCK on it (severity LOW).
    status: CONFIRMED
    resolution: >-
      Commit 8d69cd4899: PyJWT's exp check disabled (exp still required), python-jose's comparison applied in the
      helper; test_exp_boundary_matches_python_jose pins both boundary seconds (red on MUT3/MUT4).
  - seat: codex-gpt-5.6-sol (sealed council)
    objection: "Malformed iat accepted once verify_iat is off; at_hash no longer verified; falsy aud accepted by PyJWT."
    status: CONFIRMED
