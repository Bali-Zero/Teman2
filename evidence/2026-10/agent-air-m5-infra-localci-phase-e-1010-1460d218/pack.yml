dissent:
  - seat: codex-gpt-5.6 (read-only, xhigh) at afd5b11035
    objection:
      "BLOCKER: W1 excludes the first write — a state changed between the plan's read and the first PUT (e.g. during
      save_state) is overwritten; the rollback likewise."
    status: CONFIRMED
    resolution:
      "RULED 2026-10-10 by the lead (README 'Write discipline — RULED'): Q quiescence declared with --quiescent,
      W1 a fresh read before every write, the first included ('changed since plan', no write), W5 a read-back after every
      write. Tests: test_a_change_between_the_plan_and_the_first_write_writes_nothing (3 cases), test_a_rollback_whose_state_changes_before_its_first_write_writes_nothing."
  - seat: codex-gpt-5.6 (read-only, xhigh) at afd5b11035
    objection:
      "BLOCKER: the guard is trusted from its ruleset document; its deletion and non_fast_forward rules are not required
      in rules/branches (the update rule is)."
    status: CONFIRMED
    resolution:
      "Fixed: a guard counts only when rules/branches shows its deletion and non_fast_forward. Test test_a_guard_that_github_does_not_apply_to_the_branch_is_no_guard;
      mutant pe-guard-not-proven-by-github."
  - seat: codex-gpt-5.6 (read-only, xhigh) at afd5b11035
    objection: "MEDIUM: the rulesets list may omit `target` (GitHub's example does); filter on the details, not the list."
    status: CONFIRMED
    resolution:
      "Fixed: details are read for every repository ruleset and filtered on the detail. Test test_a_rulesets_list_without_target_is_read_through_the_details;
      mutant pe-list-target-trusted."
  - seat: codex-gpt-5.6 (read-only, xhigh) at afd5b11035
    objection:
      "MEDIUM: tests build the expected ruleset body with the code's own ruleset_body; a body missing a required merge_queue
      parameter passes. Build expectations independently and validate bodies in the fake."
    status: CONFIRMED
    resolution:
      "Fixed: MQ_PARAMS carries the seven live merge_queue parameters; the fake validates every PUT body as GitHub
      does (required fields and parameters, DeployKey actor shape, classic fields, no contexts beside checks); test_the_rollback_ruleset_body_is_the_live_one_field_for_field
      writes the expected body out."
  - seat: codex-gpt-5.6 (read-only, xhigh) at afd5b11035
    objection: "MEDIUM: the rollback's second PUT answer is not judged, only the final read."
    status: CONFIRMED
    resolution:
      "Fixed: took[2] compares the answer with the saved ruleset. Test test_a_rollback_that_does_not_take_exits_3;
