  - seat: codex-gpt-5.6 (read-only, xhigh) at afd5b11035
    objection: "MEDIUM: a report without `since` reads as since null; require the key."
    status: CONFIRMED
    resolution: "Fixed: a missing since key is refused. Test test_a_report_without_a_since_key_is_refused; mutant pe-w3-since-key-optional."
