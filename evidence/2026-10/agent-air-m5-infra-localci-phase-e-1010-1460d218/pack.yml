    objection: "LOW: an integer like 10**400 makes math.isfinite raise OverflowError."
    status: CONFIRMED
    resolution: "Fixed: an int window is compared as an int, a float must be finite. Test test_a_huge_integer_window_is_read_without_a_crash."
residuals:
  - "Accepted by the ruling: GitHub's REST API has no compare-and-swap for rulesets or branch protection; a sub-second window
    remains between W1's read and its write. Quiescence (--quiescent, operator-declared) takes concurrent writers out of scope;
    W5 detects a lost race."
  - "Two GitHub shapes are assumed, verified only against the fake: the ruleset GET echoes update_allows_fetch_and_merge false,
    and rules/branches lists rules regardless of the caller's bypass. Wrong either way, the failure is a deterministic W5 stop
    at the first --apply (main frozen-safe), recovered by --rollback."
  - "No post-flip watcher: a write key added later is covered by the DeployKey bypass; the read-only plan run on a schedule
    ('already flipped, but') is a possible follow-up."
  - "Size: about 1900 lines (mostly tests) against the ~400 guideline; one concern."
