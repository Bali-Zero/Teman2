gear: 2
gear_reason: >-
  Size and surface floor: three new gold-coverage persona fixtures plus count/exclusion wiring in two
  pack-pinned test files under apps/backend-rag (a backend-rag merge is a deploy). Test-only, no engine
  code, no rule data, no pricing, no migration.
mission: >-
  The gold-coverage floor gate replays E23, E23U and E23V on the newest signed pack, so a rule change
  that unsupports any of the three turns the gate red.
objective: >-
  Add personas E23 (EMPLOYMENT, Indonesian employer, work sponsor confirmed), E23U (INDIVIDUAL,
  diplomatic household, employer false) and E23V (GOVERNMENT, trade office, employer false), each
  SUPPORTED_CANDIDATES for its own product on seq-27; keep the seq-19 and seq-20 pack tests honest
  about the corpus growing 20 to 23 by excluding E23U and E23V by name where those packs carry no
  eligibility support rule for them.
scope:
  - apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/personas/E23.json
  - apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/personas/E23U.json
  - apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/personas/E23V.json
  - apps/backend-rag/backend/tests/services/visa_engine/test_seq19_pack.py
  - apps/backend-rag/backend/tests/services/visa_engine/test_seq20_pack.py
appetite:
  wall_clock_hours: 2
  adversarial_rounds: 1
