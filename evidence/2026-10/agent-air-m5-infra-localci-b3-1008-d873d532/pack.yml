dissent: []
residuals:
  - "No adversarial round: the independent gate is the orchestrator's (generator is never grader). The three rules are guilt- and innocence-tested and mutant-swept, nothing more."
  - "Deploying this today blocks every service leg on Pro: 3.58 GB free against the 12 GB default. Freeing space (33 GB of reclaimable images, 8.8 GB of build cache) or setting LOCALCI_MIN_FREE_GB in the tick's environment is an operator decision; until then no merge counts as compared."
  - "Decisions journalled before B3 carry no coverage and count none of their contexts as full, so compared_merges restarts at B3's deployment. Before #8056 no partial context executed, so the dropped evidence was in fact full; an operator-supplied matrix for old lines was not built."
  - "The floor's reading is cached per run: a leg started late in a 45-minute run is judged on the first reading. The disk-full rule catches what the floor misses mid-run."
  - "The disk-full patterns read candidate output: a candidate can print a disk-full line to turn its own red into no verdict (ERROR). That still refuses the merge and never reads green; it only removes the context from the comparison. A real CPython OSError raised by a test fixture with errno 28 is indistinguishable from the host's and reads host_disk_full."
  - "Postgres server logs of the service containers are not captured; recovery mode is read from the client's output only."
  - "The enqueue criterion still refuses a context the host could not judge (assumption in the brief): spec §2 C3a-2 lets a BLOCKED pass only when its mapping is blocked or not_implemented."
  - "Size: +739/-37 against origin/main over four commits (216, 29, 255, 202 net), 702 net in the PR, above the ~400 guide; each commit is under it. Of the 702, 502 net are tests and the mutant table; code 155, README and matrix 45."
appetite_exceeded: >-
  Size only: 702 net lines in the PR against the ~400 guide (each commit under 400); the rules are three, and their
  guilt, innocence and mutant rows are most of it. Wall clock within the 3-hour budget.
