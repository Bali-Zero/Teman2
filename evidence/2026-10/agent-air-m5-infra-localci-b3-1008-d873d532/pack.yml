brief_ref: evidence/2026-10/agent-air-m5-infra-localci-b3-1008-d873d532/brief.yml
plan_ref: >-
  Mandate LOCALCI-SOVEREIGN phase B, step B3 (ruling docs/rules/RULINGS.md, RULED 2026-10-07), handed by the
  orchestrator ("LocalCI-gate: CI vincolante in locale") to Dux B3 on 2026-10-08 06:14Z with a 3-hour budget. It folds
  three items the B2 gates left owed: coverage travels with the verdict (B2 dissent, Codex round 2 BLOCKER), a full disk
  is no verdict, and a free-space floor before a sandbox starts (B2 residuals). Design anchor:
  docs/specs/localci-sovereign-2026-10-07.md §2 phases B-D and the C3a-2 criterion.
lanes:
  - lane: localci-b3-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux B3 of LOCALCI-SOVEREIGN, M5; measurements on Pro over ssh, read-only)"
pii_scan: clean
pii_scan_note: Runner, comparator and merger code, a contexts matrix, tests and docker disk figures only; no client data was read or written.
what_changed: |
  scripts/localci/contexts_matrix.yaml: `coverage` documented (full by default, partial with a `coverage_note`); E2E Tests
  (Playwright) partial, its note naming the six empty repository secrets and the deps-image browser.
  scripts/localci/runner.py: load_contexts freezes coverage (an unreadable value is partial); every status.json context
  result carries it. A disk-full error line in a service leg's log, its egress log or a contained check's log makes the
  context ERROR `host_disk_full: <leg>: <line>` (never FAIL, never OK; the chain stops); patterns match error-line shapes,
  never a substring anywhere; a postgres recovery-mode line counts only after one. Before the first container of a
  service leg, `df -Pk /` in a throwaway no-network, no-capability, uid 65534 container reads the host's free space once
  per run; under LOCALCI_MIN_FREE_GB (default 12) the leg is BLOCKED `host_disk_below_floor <free>GB<floor>GB:`
  (`host_disk_unmeasured`, `host_disk_floor_invalid` beside it; 0 turns it off). evaluate_contexts names these as
  `no_verdict` only for an ERROR/BLOCKED whose reason the runner wrote that way.
  scripts/localci/hosted_compare.py: rows carry coverage and coverage_note, a COVERAGE column is printed,
  agreement_full and coverage.compared_full/partial/unrecorded are counted apart; a host no-verdict is named in the
  row's detail and stays LOCAL_BLIND.
  scripts/localci/merger.py: the tick journals coverage and host_no_verdict per decision; report counts a context
  toward the >= 12 only when full and prints compared_partial / compared_unrecorded (window line) and the partial
  contexts (phase E line); the enqueue criterion names partial contexts on executed_required and counts a host
  no-verdict as not executed, apart from a FAIL, still refusing; LOCALCI_MIN_FREE_GB joins the runner env allowlist.
  scripts/localci/tests/mutants/merger_mutants.py reaches hosted_compare.py and runner.py (39 new rules).
  README: one section on coverage, disk-full and the floor. Tests: test_host_disk.py (new) and rows in five suites.
proof: |
  See receipts. Suite on M5 at the final head; the mutant sweep over every rule; the disk-full patterns measured
  against every tracked file; the probe's argv run on Pro's docker; the exact status lines and hosted_compare row
  produced by the committed code. No live end-to-end run on Pro: the floor would have refused it (3.58 GB free).
bites:
  consumer: >-
    scripts/localci/hosted_compare.py and `merger.py report` on Pro (the phase D instrument), and the runner's status
    line in every shadow-merger tick.
  observation: >-
    Owed after merge (this lane does not ship): on Pro, the first tick on a base carrying bd04d84296 journals
    `coverage` per context and, while the VM has under 12 GB free, its service contexts read BLOCKED
    host_disk_below_floor (no FALSE_RED); its hosted_compare.json row for E2E Tests (Playwright) carries
    "coverage": "partial". Measured before merge on M5 with the committed code (receipts below); the free space that
    decides what Pro will show was measured on Pro at 07:31Z.
