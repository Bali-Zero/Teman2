brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-EXECUTOR phase A, handed by the team lead of Zero's session on 2026-10-07 ("make the local CI
  fully operational, no excuses"); this pack is PR-A2 (container additions + organ + guard + antidotes), built on
  PR-A1 (#8015, squash feb9e84337: planning + R1 + actionlint + Merah Putih + catE) and cherry-picked onto
  origin/main after it merged. Design anchors: docs/specs/localci-gate-2026-10-06.md §4 sequence step 3, and the
  end state RULED 2026-10-07 (docs/rules/RULINGS.md; docs/specs/localci-sovereign-2026-10-07.md) — the local gate
  on Pro decides merges once proven; phase A is the common foundation of that plan.
