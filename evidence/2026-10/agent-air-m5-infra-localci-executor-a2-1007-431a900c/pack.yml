pii_scan: clean
pii_scan_note: Runner code, a Dockerfile, a contexts matrix, tests and GitHub check metadata only; no client data was read or written.
what_changed: |
  scripts/localci/contexts_matrix.yaml: organ-conformance (11 steps), guard guilt+innocence (29) and antidotes (66)
  mapped as executed container contexts — every BASE step verbatim except guard's tmux step (argv, minus its two
  `sudo apt-get` lines) and guard's expression-bearing sentinel (not_applicable); organ/antidotes sentinels run
  with the merge_group answer; trusted_from_steps takes every script a step names from BASE (sentinels marked
  trusted_scan: false). executed 4 -> 7; never_claim_parity_for = the other seven (suite-checked).
  scripts/localci/candidate.Dockerfile: ubuntu 24.04 base (hosted tool versions), python 3.12.15 default and at
  /usr/bin/python3, 3.11.17 at /opt/py311, an offline wheelhouse of every package the jobs pip-install, the
  sandbox user named runner with HOME /home/runner and login shell bash, crontab answering "no crontab".
  scripts/localci/runner.py (v0.5.0): select_python (one pin, a minor at least, full versions); history_delta
  (BASE blobs of the changed paths; gitlink or newline path -> BLOCKED); named_scripts; judges compared by tree
  entry (mode + object); the BASE job's timeout-minutes is the context budget; docker --init; tar mtime = now;
  empty trusted blobs accepted; HOME/SHELL/PIP_FIND_LINKS in the step env.
  scripts/localci/steps_driver.py: rebuilds BASE inside the sandbox (main, origin/main, origin = itself), packs
  objects, runs the steps in a bare venv of the selected interpreter.
  scripts/localci/README.md, tests/test_contexts_exec.py (+13 tests), tests/test_runner.py (version).
  Folded from the PR-A1 final gate (be7fc440c2, refuted and cured in 9a57dba337 and 02faa27294): not_applicable needs a string reason; env merges workflow -> job ->
  step -> matrix; a job with container:/services: or a runs-on other than ubuntu-latest/24.04 is BLOCKED; README
  fixes (GitHub's real shell templates, the .gitattributes and tree-entry halves of the BLOCKED-green rule, the
  coordinator venv, the 2026-10-07 ruling); catE's #40c note points at parity_gaps.
proof: |
  See receipts. Nothing in this change posts a status, edits branch protection, touches a workflow or arms the
  adapter. Before it (PR-A1, merged as #8015): agreement=4/14 on hosted-green main commits. After it, measured on
  Pro at the final HEAD 02faa27294: 7/14 AGREE with 0 FALSE_GREEN on the newest hosted-green main commit
  1478933287, organ RED on a deliberate violation while the other six executed contexts stay green, suite 448
  passed. Earlier code measured the same on 481b42dd9e, 0e6d48a4e9, 01d1241330 (f8f6bdb80d) and on 1478933287 and
  feb9e84337 (be7fc440c2), with guard and antidotes each RED on their own violation.
