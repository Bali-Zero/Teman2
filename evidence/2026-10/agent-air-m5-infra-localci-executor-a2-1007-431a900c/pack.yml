  - lane: localci-executor-a2-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux of LOCALCI-EXECUTOR, M5; heavy execution on Pro over ssh)"
  - lane: localci-executor-a2-redteam
    role: review
    seat: "codex-gpt-6.1-sol (codex:codex-rescue runtime, read-only, default-to-defective)"
  - lane: localci-executor-a2-refuter
