dissent:
  - seat: codex-gpt-6.1-sol
    objection: "FALSE_GREEN: a trusted judge turned into a symlink (or given +x) with the same bytes is not a rewritten judge — judge_modified compared bytes only, the overlay recreates a plain file."
    status: CONFIRMED
    resolution: "Judges and the workflow are compared by tree entry (mode, type, object) via ls-tree --literal-pathspecs. Corpus row: same bytes, mode 100755 -> judge_modified, BLOCKED."
  - seat: codex-gpt-6.1-sol
    objection: "FALSE_GREEN: the image pre-installs asyncpg/fastapi/httpx/ruff for every context; organ installs only pytest and pyyaml, so candidate code importing asyncpg passes locally and fails hosted."
    status: CONFIRMED
    resolution: "Steps run in a bare venv of the pinned interpreter; packages exist only once a step pip-installs them, offline from /opt/wheels (PIP_FIND_LINKS, PIP_NO_INDEX). Corpus row: `import yaml` fails until the step installs it."
  - seat: codex-gpt-6.1-sol
    objection: "FALSE_GREEN: organ/guard/antidotes jobs have timeout-minutes 10; the local budgets (900/1200/1800 s) let a 610 s green stand."
    status: CONFIRMED
    resolution: "The matrix timeout_s is gone; the BASE job's timeout-minutes is the context budget, else the run-wide default. Corpus row: a 3 s hosted budget makes a slow step ERROR. Gemini found the same."
  - seat: codex-gpt-6.1-sol
    objection: "OTHER: a changed path holding a newline breaks hash-object --stdin-paths / update-index --index-info (driver error, ERROR)."
    status: CONFIRMED
    resolution: "history_delta refuses such a path at plan (BLOCKED, named); update-index runs with -z. Corpus row. Gemini found the same twice."
  - seat: codex-gpt-6.1-sol
    objection: "WRONG_BLOCKED: python-version 3.11.17 is BLOCKED although the image carries 3.11.17 (LOCALCI_PYTHONS declared only 3.11)."
    status: CONFIRMED
    resolution: "LOCALCI_PYTHONS carries the full version, checked at image build; a pin matches as a prefix of it. Corpus rows (3.11.17 selected, 3.11.5 BLOCKED)."
  - seat: codex-gpt-6.1-sol
    objection: "FALSE_GREEN: a job with two setup-python steps is planned on the first pin only."
    status: CONFIRMED
    resolution: "More than one setup-python step plans BLOCKED (an interpreter switch mid-job is not emulated); a pin without a minor (3, 3.x: hosted takes the newest) is BLOCKED too. Corpus rows. Gemini found the same."
  - seat: agy-gemini-3.1-pro
    objection: "FALSE_GREEN: a submodule pointer change is skipped by history_delta, so origin/main inside the sandbox does not show it."
    status: CONFIRMED
    resolution: "The sandbox tree carries no gitlinks at all; a changed submodule pointer now refuses the BASE rebuild (BLOCKED, named). The repo has no gitlink today (ls-tree count 0). Corpus row."
  - seat: agy-gemini-3.1-pro
    objection: "FALSE_RED: hosted runs as user runner; the sandbox user was nobody (`no crontab for nobody`, getuser())."
    status: CONFIRMED
    resolution: "usermod -l runner: uid 65534 is named runner, HOME /home/runner, shell bash. Corpus row (`id -un` = runner)."
  - seat: agy-gemini-3.1-pro
    objection: "WRONG_BLOCKED: named_scripts takes any path-shaped token, an `echo docs/x.sh` included, so a later legitimate edit of that file blocks a green."
    status: PLAUSIBLE
    resolution: "Over-capture only turns a green into BLOCKED, never into PASS; path sentinels (the bulk of such tokens) are excluded with trusted_scan: false. Kept as a heuristic, recorded as a residual."
  - seat: agy-gemini-3.1-pro
    objection: "The empty-pin row of the select_python test asserts BLOCKED while the name promises a default."
    status: PLAUSIBLE
    resolution: "The name says 'or blocks'; an absent pin is BLOCKED by design (see the next row). Left as is."
  - seat: agy-gemini-3.1-pro
    objection: "WRONG_BLOCKED: an empty python-version should fall back to the default interpreter."
    status: RETRACTED
    resolution: "Hosted setup-python then reads python-version-file / .python-version, which the runner does not evaluate: BLOCKED is the honest answer, not a default guess."
  - seat: agy-gemini-3.1-pro
    objection: "FALSE_RED: LEDGER_BASE_SHA is passed as the literal string $BASE_SHA."
    status: RETRACTED
    resolution: 'resolve_steps substitutes $BASE_SHA in matrix env values with the base it is given, "main" for container contexts; the real plan of 481b42dd9e reads LEDGER_BASE_SHA=main, LEDGER_HEAD_SHA=HEAD.'
  - seat: agy-gemini-3.1-pro
    objection: "FALSE_GREEN: a candidate conftest.py (not a named script) can bypass the BASE test file's assertions."
    status: RETRACTED
    resolution: "Hosted runs the same candidate conftest.py (pull_request runs the PR's code), so hosted is green too: AGREE, not FALSE_GREEN. A candidate forging its own green is the residual PR-A1 already records."
residuals:
  - "Contained verdicts stay candidate-produced (junit written inside the sandbox), as in PR-A1: a deliberately malicious candidate can forge its own contained green, exactly as it can make its own hosted job exit 0."
  - "Steps' `if:` are recorded, not evaluated: every step runs locally (assumption in the brief, carried from PR-A1)."
  - "/usr/bin/python3 in the image is the 3.12 interpreter with pytest and PyYAML (kept for the older pytest kinds); ubuntu-latest's /usr/bin/python3 is the system python with apt packages. A wrapper that calls /usr/bin/python3 by path can import those two where hosted might not."
  - "named_scripts is a token heuristic: over-capture can turn a green into BLOCKED (never into PASS); under-capture leaves a helper to the candidate exactly as hosted does."
  - "A PR that changes a BASE judge AND what it judges can be RED here and green hosted (FALSE_RED); listed in the matrix's parity_gaps."
  - "The wheelhouse is frozen at image build: an unpinned `pip install fastapi` resolves to the wheel built in, where hosted takes the newest release that day."
  - "antidotes runs in 329-407 s on Pro against its job's 600 s budget (the slowest under concurrent load): a busier host can turn it ERROR (timeout) where hosted is green — never green."
  - "Pro's docker VM is shared: a sibling session ran its own localci containers during these measurements, and one run saw four sandboxes fail to start (ERROR, not PASS). A concurrent localci user on the same VM is a contention source the runner does not arbitrate."
  - "The coordinator python must not track a moving checkout: Pro's backend venv embeds the main checkout's HEAD in pip freeze, so a run that uses it goes STALE whenever main moves mid-run. Measurements here use a dedicated venv; nothing in the runner changed for it."
  - "Stacked on PR-A1: this branch carries A1's three commits until A1 merges, then it is rebased onto origin/main before it opens."
