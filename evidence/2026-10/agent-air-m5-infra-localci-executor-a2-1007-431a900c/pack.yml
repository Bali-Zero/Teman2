  - claim: The localci suite is green on Pro with docker and the fixed image — 396 passed, 1 skipped (hypothesis absent from the coordinator venv; the hosted job installs it); the contained tests executed, among them test_contexts_exec.py::test_the_sandbox_looks_like_a_fresh_hosted_checkout_of_the_pinned_job, and the host rows test_contexts_exec.py::test_the_real_matrix_accounts_for_every_step_of_every_executed_context_and_names_the_rest, test_contexts_exec.py::test_the_sandbox_rebuilds_base_under_the_candidate_so_main_and_origin_main_name_it, test_contexts_exec.py::test_the_hosted_jobs_timeout_bounds_the_context_so_no_green_outlasts_it, test_contexts_exec.py::test_a_judge_whose_mode_changes_is_a_rewritten_judge.
    cmd: LOCALCI_ISOLATION_IMAGE=localci-candidate:a2b <venv>/bin/python -m pytest scripts/localci/tests -q -p no:cacheprovider (Pro, a tree of d961f053b4 with scripts/localci of f8f6bdb)
