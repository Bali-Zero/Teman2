residuals:
  - "Contained verdicts stay candidate-produced (junit written inside the sandbox), as in PR-A1: a deliberately malicious candidate can forge its own contained green, exactly as it can make its own hosted job exit 0."
  - "Steps' `if:` are recorded, not evaluated: every step runs locally (assumption in the brief, carried from PR-A1)."
  - "/usr/bin/python3 in the image is the 3.12 interpreter with pytest and PyYAML (kept for the older pytest kinds); ubuntu-latest's /usr/bin/python3 is the system python with apt packages. A wrapper that calls /usr/bin/python3 by path can import those two where hosted might not."
  - "named_scripts is a token heuristic: over-capture can turn a green into BLOCKED (never into PASS); under-capture leaves a helper to the candidate exactly as hosted does."
  - "A PR that changes a BASE judge AND what it judges can be RED here and green hosted (FALSE_RED); listed in the matrix's parity_gaps."
  - "The wheelhouse is frozen at image build: an unpinned `pip install fastapi` resolves to the wheel built in, where hosted takes the newest release that day."
  - "antidotes runs in 329-407 s on Pro against its job's 600 s budget (the slowest under concurrent load): a busier host can turn it ERROR (timeout) where hosted is green — never green."
  - "Pro's docker VM is shared: a sibling session ran its own localci containers during these measurements, and one run saw four sandboxes fail to start (ERROR, not PASS). A concurrent localci user on the same VM is a contention source the runner does not arbitrate."
  - "The coordinator python must not track a moving checkout: Pro's backend venv embeds the main checkout's HEAD in pip freeze, so a run that uses it goes STALE whenever main moves mid-run. Measurements here use a dedicated venv (README, Coordinator interpreter); the runner reports the drift as STALE, it does not prevent it."
  - "PR-A1 final-gate notices 1, 2, 5 and 6 are folded here (be7fc440c2 and this pack); 8 was the gate's own staging. Carried unchanged: (3) a setup-python pin is matched against the versions the image declares (PYTHON_VERSION, LOCALCI_PYTHONS), not against an interpreter run per plan — the image build asserts them and the contained probe runs 3.11 inside, but the image is trusted by ID; (4) the host actionlint's sha256 is measured by the runner and re-checked, never compared with a known-good hash (BASE pins the linux_amd64 tarball); (7) contained verdicts are candidate-produced junit (first residual above); (9) on M5 the docker/Pysa/hypothesis tests skip — the contained paths are proven on Pro only."
