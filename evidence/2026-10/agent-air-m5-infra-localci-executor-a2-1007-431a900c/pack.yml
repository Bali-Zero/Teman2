    cmd: docker build -q -t localci-candidate:1 - < scripts/localci/candidate.Dockerfile ; docker run --rm -u 65534:65534 localci-candidate:1 sh -c 'id -un; echo $LOCALCI_PYTHONS; ls /opt/wheels | wc -l'
    exit: 0
    ts: "2026-10-07T09:14:00Z"
