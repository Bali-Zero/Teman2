brief_ref: evidence/brief.yml
plan_ref: >-
  Mandate LOCALCI-EXECUTOR phase A, handed by the team lead of Zero's session on 2026-10-07 ("make the local CI
  fully operational, no excuses"); this pack is PR-A2 (container additions + organ + guard + antidotes), stacked on
  PR-A1 (planning + R1 + actionlint + Merah Putih + catE). Design anchor: docs/specs/localci-gate-2026-10-06.md §4
  sequence step 3.
lanes:
  - lane: localci-executor-a2-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux of LOCALCI-EXECUTOR, M5; heavy execution on Pro over ssh)"
  - lane: localci-executor-a2-redteam
    role: review
    seat: "codex-gpt-6.1-sol (codex:codex-rescue runtime, read-only, default-to-defective)"
  - lane: localci-executor-a2-refuter
    role: review
    seat: "agy-gemini-3.1-pro (agy --sandbox --model gemini-3.1-pro-high, prompt-only, diff inlined)"
  - lane: localci-executor-a2-final-gate
    role: review
    seat: "claude-opus-5-5 (fresh session outside the chain, commissioned by the team lead on the committed sha)"
council_run: council-journal.jsonl
seat_override: >-
  Two external families reviewed the candidate (OpenAI Codex, Google Gemini 3.1 Pro), but only one line counts for
  R9: the Codex seat reported its model as gpt-6.1-sol while the roster names codex-gpt-5.6-sol, so the Codex line
  is journalled under its true name and does not qualify — the position PR #7991 and PR-A1 took. The seat was not
  renamed to fit the roster.
seat_fallback_reason: >-
  The reserve agy-gemini-3.1-pro stood in because both remaining titular seats were dead at dispatch
  (scripts/arsenal_probe.py --seats kimi,tp1-qwen3.8-max, 2026-10-07T08:20:37Z on M5): kimi QUOTA_DEAD
  (membership quota), tp1-qwen3.8-max QUOTA_DEAD (HTTP 429, monthly plan quota, reset 2026-10-11 16:00 UTC).
pii_scan: clean
pii_scan_note: Runner code, a Dockerfile, a contexts matrix, tests and GitHub check metadata only; no client data was read or written.
what_changed: |
  scripts/localci/contexts_matrix.yaml: organ-conformance (11 steps), guard guilt+innocence (29) and antidotes (66)
  mapped as executed container contexts — every BASE step verbatim except guard's tmux step (argv, minus its two
  `sudo apt-get` lines) and guard's expression-bearing sentinel (not_applicable); organ/antidotes sentinels run
  with the merge_group answer; trusted_from_steps takes every script a step names from BASE (sentinels marked
  trusted_scan: false). executed 4 -> 7; never_claim_parity_for = the other seven (suite-checked).
  scripts/localci/candidate.Dockerfile: ubuntu 24.04 base (hosted tool versions), python 3.12.15 default and at
  /usr/bin/python3, 3.11.17 at /opt/py311, an offline wheelhouse of every package the jobs pip-install, the
  sandbox user named runner with HOME /home/runner and login shell bash, crontab answering "no crontab".
  scripts/localci/runner.py (v0.5.0): select_python (one pin, a minor at least, full versions); history_delta
  (BASE blobs of the changed paths; gitlink or newline path -> BLOCKED); named_scripts; judges compared by tree
  entry (mode + object); the BASE job's timeout-minutes is the context budget; docker --init; tar mtime = now;
  empty trusted blobs accepted; HOME/SHELL/PIP_FIND_LINKS in the step env.
  scripts/localci/steps_driver.py: rebuilds BASE inside the sandbox (main, origin/main, origin = itself), packs
  objects, runs the steps in a bare venv of the selected interpreter.
  scripts/localci/README.md, tests/test_contexts_exec.py (+7 tests), tests/test_runner.py (version).
proof: |
  See receipts. Nothing in this change posts a status, edits branch protection, touches a workflow or arms the
  adapter. Before it (PR-A1): agreement=4/14 on hosted-green main commits. After it, measured on Pro with the
  committed code: 7/14 AGREE with 0 FALSE_GREEN on three hosted-green main commits, and organ, guard and antidotes
  each RED on a deliberate violation while the other six executed contexts stay green.
bites:
  consumer: >-
    scripts/localci/hosted_compare.py run on Pro over a local run of a hosted-green main commit (the comparator
    that spec §4 makes the only place a local claim is stated).
  observation: >-
    Pro, 2026-10-07 09:20Z, runner at f8f6bdb80d (sha256 f79cb9e2…), image sha256:2c9b1d54104d…, on 481b42dd9e
    (base 0e6d48a4e9), live GETs: AGREE for R1 gate, actionlint, Merah Putih, catE, organ, guard and antidotes;
    agreement=7/14 false_green=0 false_red=0 local_blind=7 hosted_pending=0, exit 0. Same on 0e6d48a4e9 and
    01d1241330.
ground:
  ts: "2026-10-07T08:32:45Z"
  siblings: >-
    `gh pr list --state open --json number,files`: no open PR touches scripts/localci. The Pro broker worktree of
    PR-A1 is reused as the candidate checkout (detached per measured sha, restored after); Pro's main checkout was
    not written. The image tag localci-candidate:1 on Pro has no other consumer (no launchd job or crontab names it).
spend:
  adversarial_rounds: 1
  wall_clock_hours: 4
