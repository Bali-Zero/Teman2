decisions:
  - id: D-prepare-once
    text: >-
      Everything about a query that does not depend on the row (deduped terms, noise-stripped
      tokens, alias expansions, hyphen phrases, keyword credit) is computed once per search in
      _PreparedQuery; a per-search _Vocabulary answers the word rule over the distinct row words.
  - id: D-content-keyed-caches
    text: >-
      Row tokenisation and keyword phrases are cached by row CONTENT (lru_cache, 4,096 entries),
      so a reloaded or edited catalogue row is never served stale and no invalidation hook is
      needed; these keys come from the catalogue, never from client text.
  - id: D-noise-frozenset
    text: >-
      _is_noise is a membership test in a precomputed frozenset of every noise form (noise words
      plus noise words of 4+ characters with each light suffix): the same predicate as before,
      with no cache over client tokens (codex round 1).
  - id: D-no-wall-clock-test
    text: >-
      The speed shape is guarded by call counts (row tokeniser once per row, _is_noise bounded per
      query token), not by a wall-clock assertion, which would be flaky on shared runners.
