    cmd: cd apps/mouth && npx vitest run 'src/app/(visa-oracle)'
    result: "Test Files 55 passed (55); Tests 1431 passed (1431)"
    exit: 0
    ts: "2026-10-12T07:10:00Z"
    seat: this session
  - claim: "apps/mouth typechecks."
    cmd: cd apps/mouth && npx tsc --noEmit -p .
    result: "no output"
    exit: 0
    ts: "2026-10-12T07:10:30Z"
    seat: this session
  - claim: "The new test was red before the helper existed and is green after."
    cmd: cd apps/mouth && npx vitest run 'src/app/(visa-oracle)/visa-oracle/_components/OutcomeSheet.display-name.test.tsx'
    result: "before: 5 failed | 1 passed (6); after: 6 passed (6)"
    exit: 0
    ts: "2026-10-12T07:09:31Z"
    seat: this session
decisions:
  - id: D-keep-separator
    decision: >-
      The existing em-dash separator of the share line is kept ("E23 - Name: price"), because
      OutcomeSheet.duration.test.tsx pins it; only the duplicate trailing code is removed.
  - id: D-scope-mouth-only
    decision: >-
      The pack names are not edited (seq-27 is signed and out of scope); the reason sentences in
      engine-adapter.ts that quote "(E23U)" are a separate surface and are not touched here.
