gear: 2
brief_ref: evidence/brief.yml
ruling: >-
  Visa night family "work", plan PR-04 (audit findings F13 and F31, group G18): the product code is printed
  twice on the card and in the share line because 37 of 38 pack names end in "(CODE)".
mission: >-
  A visitor sharing a Visa Oracle result sees each product code once, on the card and in the share line,
  in English and Bahasa Indonesia.
lanes:
  - lane: pr04-code-once
    role: build
    seat: Claude Sonnet 5.5 implementer (subagent), worktree mouth-vn-work-pr04-code-once.
  - lane: pr04-ground-truth
    role: ground_truth
    seat: >-
      Audit dossiers E23, E23U, E23V (names en/id end in "(CODE)", eyebrow repeats the code, finding E-1);
      re-verified on origin/main dfb6e2b74a: OutcomeSheet.tsx printed candidate.code then the full name in the
      share line and in the card eyebrow plus title.
    nb: apps/mouth/src/app/(visa-oracle)/visa-oracle/_components/OutcomeSheet.tsx
    query_hash: "14df5a8016f3100ff04919d228de901544a0b517fafc0dc4fb6aa54c88d714b2" # pragma: allowlist secret
    note: query_hash = sha256 of OutcomeSheet.tsx at origin/main (before the change).
pii_scan: clean
bites:
  consumer: >-
    visitors sharing a result on the public Visa Oracle: the card title and the Copy summary text produced by
    OutcomeSheet; live after promote, a headless walk on https://balizero.com/visa-oracle to an E23-family
    result shows the code once in the card and in the copied share text, EN and ID.
  where: ci
  observe: cd apps/mouth && npx vitest run 'src/app/(visa-oracle)/visa-oracle/_components/OutcomeSheet.display-name.test.tsx'
  expect: "contains:6 passed"
receipts:
