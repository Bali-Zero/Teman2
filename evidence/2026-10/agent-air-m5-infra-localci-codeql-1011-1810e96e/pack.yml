what_changed: |
  runner.py: deps recipe key codeql {version, url, sha256} (FROM scratch stage with ADD --checksum, extracted through a bind mount,
  codeql version asserted, digest covers the pin); local.classifier runs BASE security_gate_flags.py at plan time and seals
  needs.changes (fail-open on a classifier error); local.skip_is_pass makes an all-if-skipped leg PASS (a matrix-declared N/A stays
  ERROR); local.trusted_overlay lays BASE trusted_files over the sandbox tree with frozen hashes; the version sentinel
  codeql_version_read.py runs through run_host_reader at plan time (any non-zero is BLOCKED). codeql_leg.sh: the probe's init /
  trace-command / finalize / run-queries / interpret-results lines, signal re-raised so an OOM is no verdict, a results line for the
  receipt. contexts_matrix.yaml: both contexts executed, coverage full, trusted_base_required; summary.blocked 0,
  never_claim_parity_for []; parity_gaps for version, flags, architecture and shape; the stale 4 CPU / 8 GiB line fixed. Tests:
  test_codeql_contexts.py (63); 24 cq-* mutants; README section.
proof: |
