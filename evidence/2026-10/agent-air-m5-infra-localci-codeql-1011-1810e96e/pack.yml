      invisible to the compare). LOWs: the run_all fail-open and the javascript sentinel had no test (mutants G1, G3 survived); hosted
      fails open on a red BASE test_security_gate_flags.py, which the runner never ran; a weakened assertion in test_runner.py; the
      leg's codeql version probe outside step; the version reader did not filter tool.name.
    status: CONFIRMED
    resolution: >-
      2377d77e13 and d5536aeac0: git diff --no-renames for the changed list; the corpus check now also runs BASE
      test_security_gate_flags.py (a red corpus is a local FAIL, stricter than hosted's run-both); the probe stepped; the reader keeps
      tool.name CodeQL only; tests for run_all and per-language sentinels; the exact BLOCKED assertion; six new cq-* rules, 30/30 killed.
  - seat: codex-gpt-5.6-sol council (round 1) and the Opus re-gate, adjudicated by the lead
    objection: >-
      B1 coverage full unjustified; B2 the MERGEOS_RING_GATING_DISABLED override ignored; M1 a SARIF the action throws on exits 0; M2 the sentinel stays
      green after a failed hosted upgrade; M3 with_pin pins inputs, not the action ref; N1 the version-probe test's fake fails `database init` too; N2 the
      workflow path filter misses security.yml and codeql-config.yml.
    status: CONFIRMED
    resolution: >-
      B1: coverage stays full by reproducing every failure class the code determines (the CLI commands, the action's SARIF post-processing, the upload
      limits: codeql_sarif_check.py) and naming the environment classes as parity_gaps. B2: read live at plan, judged by BASE's ring_gating_override.sh,
      sealed as ring_gating_override. M1: exit 1 on an unparseable SARIF, no runs, a run without results. M2: the sentinel also needs the analysis within 7
      days and the newest completed security.yml run on main green on the leg. M3: uses_pin on the three steps. N1: the exact probe string, `database
      init` asserted absent, mutant cq-version-probe-swallowed killed. N2: both files, and the override script, in both path lists; test_hosted_workflow
      requires every real file the CodeQL suite reads.
  - seat: kimi-code/k3 council (round 1), the BLOCKER
    objection: >-
      BLOCKER the BASE-trusted leg script takes CODEQL_BIN, CODEQL_SOURCE_ROOT, CODEQL_BASE_CONFIG (and the work dir) from the env, so a stub CLI, an
      empty source root or weaker queries would give a false PASS.
    status: PLAUSIBLE
    resolution: >-
      Not reachable as stated: the step env is composed by the runner from BASE's workflow, job and step env plus the matrix step env (plan_service_context:
      resolve_steps); runner.py refuses a step whose body writes GITHUB_ENV/PATH/STATE (the "writes GITHUB_ENV/PATH/STATE" refusal in
      plan_service_context); and the codeql job's only earlier step is `Checkout code`, which is emulated, so no candidate code runs before the leg.
      Hardened anyway, since the seam costs nothing: the plan BLOCKS when the composed env of a step running codeql_leg.sh carries one of the four seams
      (cq-leg-seam-open).
  - seat: kimi-code/k3 council (round 1), the rest
    objection: >-
      HIGH the local CLI version is never asserted equal to the pin; the sentinel has no recency floor. MEDIUM skip_is_pass lets one `if:` false plus
      another skip pass. LOW the config rewriter on an inline queries or a column-0 comment in the block; REPO_RE accepts `.` and `..`.
    status: CONFIRMED
    resolution: >-
      HIGH: the leg compares `codeql version` with CODEQL_PIN (the matrix's one literal; the image build already asserts the pin, runner.py DEPS_CODEQL)
      and gives no verdict on a difference (cq-local-version-unchecked); freshness added (cq-sentinel-stale-ok). MEDIUM: skipped_by_own_if
      (cq-skip-mixed-passes). LOW: the rewriter is no verdict on both shapes (cq-config-*), REPO_RE refuses `.`/`..` (cq-reader-repo-dots).
  - seat: codex-gpt-5.6-sol council (round 2, HEAD f310aa8254)
    objection: >-
      BLOCKER the gzip limit is checked on the pre-fingerprint document (accepts 10346188 B where the action's transformed payload is
      10694087 B > 10485760): a deterministic FALSE_GREEN. BLOCKER a repository-variable 404 is read as the override off, but
      vars.MERGEOS_RING_GATING_DISABLED can be an organization variable, so hosted runs both scanners where local skip-PASSes. MEDIUM
      head_branch == main does not identify the repository's main (a fork's PR branch named main, no event or repository check).
    status: CONFIRMED
    resolution: >-
      The gzip limit is the compact JSON at level 6 plus a bound of what the action adds, against 10,000,000 (cq-sarif-gzip-no-bound,
      cq-sarif-gzip-mib). The override is resolved from the repository then the organization variables lists, paginated, with a
      total_count check and a fail-open on any failed read or a BASE environment: (cq-override-org-ignored, cq-override-404-unset,
      cq-override-org-beats-repo, cq-override-environment-ignored, cq-override-total-unchecked). The sentinel takes only the repository's
      own main on schedule or workflow_dispatch (cq-sentinel-fork-main, cq-sentinel-any-event).
  - seat: kimi-code/k3 council (round 2, HEAD f310aa8254), confirmed findings
    objection: >-
      MEDIUM skipped_by_own_if keys planned by the bare step name across jobs, so a same-named step collides and a skip is forgiven. MEDIUM the
      gzip limit uses the larger 10 MiB reading. LOW the SARIF checker's uncaught RecursionError/UnicodeEncodeError exits 1 without a marker.
      LOW an organization-level or environment-level variable is invisible, and a 404 may be an unauthenticated read. Requested a test of the exit-code map.
    status: CONFIRMED
    resolution: >-
      skipped_by_own_if keys (job, step) (cq-skip-name-collision). 10,000,000, the smaller reading (cq-sarif-gzip-mib). The checker's own crash
      is exit 70, no verdict, turned into the leg's kill signal (cq-sarif-crash-rejects, cq-sarif-crash-swallowed-by-leg). The override read covers
      organization variables, fails open on a 404 and on a BASE environment:. test_the_leg_turns_a_checker_crash_into_a_killed_leg_and_the_driver_reads_it_as_error
      proves, through the driver, that the pin mismatch and the checker crash both end as ERROR, never FAIL and never PASS.
  - seat: kimi-code/k3 council (round 2, HEAD f310aa8254), rebutted findings
    objection: >-
      MEDIUM the result and rule maxima are truncation limits, so failing on them is a FALSE_BLOCKED. BLOCKER-claimed exit 75 of no_verdict is dead
      code because kill -s KILL $$ ends the script as 137. LOW gh is resolved through PATH in codeql_version_read.py.
    status: PLAUSIBLE
    resolution: >-
      Rebutted, no code change. (1) The GitHub docs say "If any of these objects exceeds its maximum value the SARIF file is rejected"; the display
      truncation ("only the top 5,000 ...") applies BELOW the maximum, so the checker keeps failing on the maxima and says so in its docstring. (2)
      kill -s KILL $$ is intended: it is the no-verdict channel (the comment in codeql_leg.sh), so the driver reads a killed step as ERROR and not as
      an exit code; exit 75 is only the fallback if the kill is somehow ignored. (3) Every plan-time gh read resolves a bare gh from the operator's
      PATH (hosted_compare.gh_argv and gh_get, phase_e_flip, the runner's override read): the same trust as the rest of the plan's reads.
  - seat: claude-opus-5-5 fresh final gate (BLOCKED at f310aa8254), F1-F3 and LOWs
    objection: >-
      F1 the gzip limit is measured on a document the action then transforms (the bound), F2 the override read ignores organization variables, F3 the
      sentinel's newest completed run is not filtered to the repository's own main. LOWs: pack.yml and the spec overstate "never a false green" for
      the tests.yml override residual; the Alert Limit 1,000,000 and a failed hosted self-test step are unnamed in the not-reproduced list; the
      what_changed and proof counts are stale; the Bites line misses the override observation; the round-2 council-journal lines are uncommitted.
    status: CONFIRMED
    resolution: >-
      F1-F3 as for Codex's round-2 findings above (the gate measured that the CLI SARIF carries primaryLocationLineHash on every result and
      automationDetails.id on every run, so the bound is 0 on a real document). The residual wording is "partial; a hosted red is journalled
      FALSE_GREEN (hosted_compare.classify), never counted as a full AGREE"; both unreproduced items are named in the spec and the matrix, with the
      upload-never precision; the counts, the Bites line and the journal are updated in this round.
residuals:
  - "The runner's changed list is base..candidate two-dot (an explicit base the merger passes), hosted's is merge-base..HEAD; for the merger's candidates (a merge of the PR onto the base) the two lists are the same."
  - "A red BASE gate-flags corpus is a local FAIL of policy.trusted_classifier_corpus, while hosted runs both legs: stricter locally, never greener."
  - "No SARIF upload locally: the hosted workflows still upload while they exist; a local upload is for the day they go. What the upload can fail on and the code determines is reproduced (codeql_sarif_check.py); GitHub-side processing errors, API errors, the status-poll timeout and runner loss are parity_gaps."
  - "tests.yml's changes job honours vars.MERGEOS_RING_GATING_DISABLED and the local change map does not: with it active a docs-only diff skips tests.yml contexts here that hosted runs. Partial; a hosted red is journalled FALSE_GREEN (hosted_compare.classify), never counted as a full AGREE. Fixing it needs a live gh read on every plan and a change to every existing plan test; reported to the lead to ledger."
  - "Not reproduced, and named in the spec and the matrix: the docs table's Alert Limit 1,000,000 (repository state), and a failed hosted 'Self-test ring-gating override' step (security.yml, pip install pyyaml from the network), which makes changes.result non-success so hosted runs both languages. With upload never a run without results does not throw on hosted (countResultsInSarif runs only in uploadPostProcessedFiles); local judges as the PR lane does, so it is stricter than the merge_group twin."
  - "Every plan-time gh read (codeql_version_read.py, the runner's override read, hosted_compare.gh_argv and gh_get, phase_e_flip) resolves a bare gh from the operator's PATH: the same trust as the rest of the plan's reads, one line and no change."
  - "The CLI version is chosen per hosted run by feature flag; the sentinel reads the newest analysis, and the flag can move between that read and the queue run."
  - "The local SARIF leaves with the container: the runner's receipts carry the counts per language, and the per-result identity was proven once, by the parity probe (0 differences); a per-result diff per run would need the leg to export its SARIF."
  - "Each executed candidate spends about 7 more minutes (python ~200-315 s, javascript ~100-120 s); the python wall varied 203 s -> 314 s between two runs on the same tree, unexplained."
