  ERROR); local.trusted_overlay lays BASE trusted_files over the sandbox tree with frozen hashes; the version sentinel
  codeql_version_read.py runs through run_host_reader at plan time (any non-zero is BLOCKED). codeql_leg.sh: the probe's init /
  trace-command / finalize / run-queries / interpret-results lines, signal re-raised so an OOM is no verdict, a results line for the
  receipt. contexts_matrix.yaml: both contexts executed, coverage full, trusted_base_required; summary.blocked 0,
  never_claim_parity_for []; parity_gaps for version, flags, architecture and shape; the stale 4 CPU / 8 GiB line fixed. Tests:
  test_codeql_contexts.py (244); 57 cq-* mutants; README section.
  Fix round 3 (the last correction round): the SARIF gzip limit is the compact JSON at level 6 plus a bound of what the analyze action adds
  (32 B per result it would fingerprint, 256 B per run without automationDetails), against 10,000,000; the checker's own crash is exit 70,
  no verdict, which the leg turns into its kill signal (the driver reads ERROR); the ring-gating override is resolved from the repository
  then the organization variables lists (paginated, total_count checked, a BASE job naming an environment: or any failed read fails open);
