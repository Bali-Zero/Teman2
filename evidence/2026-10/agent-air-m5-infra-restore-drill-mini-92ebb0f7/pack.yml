      first failure would write the tracked shared/escalations_pro.jsonl from Mini.
    status: CONFIRMED
    disposition: >-
      OPEN, reported to the coordinator, not cured here: the workflow is pinned by scripts/tests/test_restore_drill_workflow_wiring.py
      and deleted with Teman2 (schedule already removed); the escalation host mapping is a shared-library decision (add a
      mini board, or write the escalation elsewhere).
