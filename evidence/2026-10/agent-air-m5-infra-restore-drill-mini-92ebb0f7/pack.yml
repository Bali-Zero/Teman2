bites: >-
  Prose form on purpose: the consumer is the launchd job com.nuzantara.restore-drill on Mini (organ mini.restore_drill),
  which a CI runner cannot observe without a remote shell, Tigris credentials and a throwaway Postgres. Observation, to
  be made by the shipping session after the wrapper and plist are installed on Mini (declared pairs): a manual
  launchctl kickstart of com.nuzantara.restore-drill the same day, ending in a Level-5 PASS verdict in
  ~/logs/mini-restore_drill/run.log, ~/.organism/last_seen/mini.restore_drill.json reading ok, and a digest in Telegram.
  Not yet made: this pack records the pre-merge state at final code head e2f2c8a627, and the narrow codex confirmation still lists one open defect.
decisions:
  - id: D-derive-roles-from-the-dump
    decision: >-
      Roles are derived from the dump by an SQL-aware tokenizer (strings, E'' escapes, dollar bodies, nested comments
      blanked; COPY data skipped), created NOLOGIN with every name quoted; pg_* and pseudo-roles are excluded, postgres is
      created (the drill superuser is "drill"). ON_ERROR_STOP=1 stays.
  - id: D-age-from-lastmodified
    decision: >-
      Dump age comes from the object store's LastModified (UTC), not from the file name, which the producer writes in
      local time (measured: name 20261011-0300, LastModified 2026-10-10T19:04Z); a future-dated or older-than-72h dump
      is CANNOT-VERIFY.
  - id: D-recovery-human-only
    decision: >-
      mini.restore_drill recovery_action is human_only: kickstart -k would terminate a restore in progress, and the
      sentinel's heartbeat_silent rule does not even carry the status it matches on.
  - id: D-no-start-heartbeat
    decision: >-
      The sidecar only ever holds a verdict: no start heartbeat (running reads dead, ok would paint over the last verdict).
