    objection: >-
      ALTER DEFAULT PRIVILEGES ... REVOKE FROM another role; a quoted role named like a membership keyword; a stale comment in
      the workflow; a foreign-owned lock directory would make every run skip silently.
    status: PLAUSIBLE
