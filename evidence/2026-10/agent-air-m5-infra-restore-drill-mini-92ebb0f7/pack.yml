dissent:
  - seat: kimi-code/k3 (round 1) and codex-gpt-5.6-sol (round 1)
    objection: >-
      The role scan misses REVOKE FROM, GRANTED BY, CREATE POLICY TO, SET ROLE, ALTER ROLE and memberships, mis-splits
      quoted object names containing " to ", has no literal or dollar-body awareness, rejects valid quoted roles, excludes
      postgres and would create pg_* roles.
    status: CONFIRMED
    disposition: >-
      Cured in 3214921f98 (SQL tokenizer) and tightened in 9299e8e546 and acfd03a66c; kimi round 2 ran 45+ adversarial
      inputs and found only advisory notes; real-dump smoke R2.
  - seat: kimi-code/k3 (round 1) and codex-gpt-5.6-sol (round 1)
    objection: >-
      No concurrency lock (pidfile check-then-create, recycled-PID skip writing an ok sidecar), a launchctl_kickstart
      recovery that would kill a run, signals that can exit 0, a watchdog that leaves the detached container, a stale or
      wrong dump that can PASS, dangling image layers.
    status: CONFIRMED
    disposition: >-
      Cured in 3214921f98, 9299e8e546, acfd03a66c and 2e995c2e78: atomic mkdir lock with PID+start-time+command owner,
      human_only recovery, exit 143/130, docker rm -f in the watchdog and cleanup, LastModified-based age, image removal.
  - seat: codex-gpt-5.6-sol (round 2)
    objection: >-
      Dump age read the producer's local-time name as UTC (a 79 h dump read 71 h); a verifier exiting 0 with unreadable
      JSON returned 0; running heartbeat is classed dead by sentinel-aggregate; quoted "Drill" folded into the excluded user.
    status: CONFIRMED
    disposition: >-
      Cured in 9299e8e546 (verified: name 20261011-0300 vs LastModified 2026-10-10T19:04Z on Mini).
  - seat: codex-gpt-5.6-sol (rounds 3-4)
    objection: >-
      The start heartbeat painted ok over the last verdict; membership lists leaked a comma role; the worker group survived a
      timeout; the sidecar write was neither atomic nor fail-closed; gunzip SIGPIPE with psql 0 was accepted.
    status: CONFIRMED
    disposition: Cured in acfd03a66c and 2e995c2e78.
  - seat: codex-gpt-5.6-sol (round 5)
    objection: >-
      restore-drill.yml keeps workflow_dispatch and still prints tail -25 of the restore log, which can quote a production
      row (CONTEXT of a COPY error) into GitHub logs; the workflow keeps a gunzip-141-is-a-warning branch; the wrapper's
