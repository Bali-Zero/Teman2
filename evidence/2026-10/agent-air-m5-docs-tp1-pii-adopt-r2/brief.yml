      The corpus asserts the adopted rows and their innocence rows (ISBN, Luhn-failing card, bad-checksum IBAN, contiguous timestamp, placeholder birth date, technical address labels); the test computes Luhn, issuer prefix and mod-97 from every PAN/IBAN row, pins the decision line and grammar sentences, and pins 371 rows and 23 limits.
    probe: >-
      python3 -m pytest -q scripts/tp1max/test_screen_corpus.py, plus mutants: a PAN guilt row made Luhn-invalid, the innocence card made valid, a wrong IBAN checksum, the ISBN row deleted or given a Visa prefix, the decision line deleted, an adopted row or a remainder re-marked, a remainder's table line deleted — each red.
