      The spec adopts both scopes fail-closed for every shape a declared grammar recognises (items 6 and 7), records the decision line (item 8), gives PAN and IBAN one entity grammar in National IDs with a closed label list and its remainder, and makes personal data no grammar recognises a declared limit (lim_01, rem_pii_other_label) with a named mitigation.
