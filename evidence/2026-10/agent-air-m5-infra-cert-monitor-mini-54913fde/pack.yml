      findings and fires daily P0 alerts for an already known, unresolved issue. This creates severe alert fatigue and defeats
      the purpose of the dedup contract. They must be removed from both the python HOSTS array and the bash inline expected set
      until fixed, or explicitly muted."
    status: PLAUSIBLE
    disposition: >-
      NOT adopted; the call belongs to Zero and the coordinator. Kimi reaches the opposite verdict on the same text ("Removing
      or muting would be exactly the green-masking-dead shape this change exists to kill ... the acceptable tool is a time-boxed
      ack/snooze, never removal"). The premise "daily" is weaker than agy states: tg_notify.py lowers the repeat rate on a ladder
