what_changed: |
  scripts/localci/runner.py: step_judges (named_scripts' token reading, over any file list) names the trusted files each
  planned step reads (`trusted` on the step). steps_verdict turns a FAIL or ERROR step whose own judges include a rewritten
  file into BLOCKED `judge_rewritten: <step> read red with the BASE judge while the candidate rewrites <files>; hosted judges
  with the candidate's copy, which this run did not execute — no verdict (never FAIL, never OK)`; a genuine red decides and is
  the only one named; a rewritten file no step names (the workflow, a .gitattributes) and every step of a service context's
  jobs are judged at context scope, said in the reason. evaluate_contexts names `no_verdict: judge_rewritten` and carries
  `skipped: change_map` from the plan's change_map record onto the context result.
  scripts/localci/hosted_compare.py: skip_reading writes `skip` and `local_detail` per the spec's three cases (agreed full,
  hosted_ran partial and named, hosted_skipped full); coverage.compared_skip_agreed; the coverage line prints it.
  scripts/localci/merger.py: the tick journals `skipped`; the report reads it back, prints compared_skip_agreed on the window
  line and, on the phase-E line, how many full contexts of the compared merges were skip agreements; constants untouched.
  Spec paragraph inserted after C3a-2 (prettier rewrote its two `*...*` markers to `_..._`); README rows; 21 mutant rules.
  Tests: test_judge_rewritten.py and test_skip_compare.py (new), rows in test_merger_report, test_merger, and the judge-swap
  assertion of test_contexts_exec changed by the ruling (FAIL -> BLOCKED judge_rewritten).
