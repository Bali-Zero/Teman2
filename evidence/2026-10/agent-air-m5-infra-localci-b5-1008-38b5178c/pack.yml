dissent: []
residuals:
  - "The candidate's judge is not run: a rewritten judge is the reviewer's (review_independent). Running both judges and reporting the pair is a later step if phase D shows judge rewrites are frequent."
  - "The skip agreement compares the classifier's decision, not an execution: both sides skipping on the same wrong classification is an agreement here and a green on GitHub."
  - "A judge swapped for one that always passes, beside a real violation, was FAIL and read FALSE_RED against hosted's green; it is now BLOCKED judge_rewritten and LOCAL_BLIND. It is still refused and never green, but phase D no longer counts it as a disagreement."
  - "The scope is the step as the plan reads it: a step's red stays FAIL when it reads a rewritten file only another step names (a test importing a sibling's helper). Files no step names, the workflow and a .gitattributes are judged at context scope."
  - "A skip agreement is counted full whatever the matrix's coverage of an execution (E2E's partial is about its empty secrets): the spec's 'a full comparison of the decision'."
  - "Decisions journalled before B5 record no skip: their skips read as executions, and a skip here beside a hosted run was counted full then and still is on those lines."
  - "No adversarial round: the independent gate is the orchestrator's (generator is never grader)."
appetite_exceeded: >-
