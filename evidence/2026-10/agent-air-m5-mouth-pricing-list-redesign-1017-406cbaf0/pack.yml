council_run: council-journal.jsonl
dissent:
  - seat: agy-gemini-4-argon
    objection: >-
      role="table" owned a heading child and, below md, lost its column headers and had uneven cell counts
      (hidden header row and hidden empty cells).
    severity: major
    status: CONFIRMED
    resolution: >-
      Matrices no longer claim table semantics: each family is a labelled section, the column labels are
      decorative on desktop and every priced cell carries its own column label (visible on mobile,
      sr-only on desktop).
  - seat: agy-gemini-4-argon
    objection: >-
      79 DialogTrigger instances inside one Dialog broadcast aria-expanded to every button and overwrite
      Radix's trigger ref.
    severity: major
    status: CONFIRMED
    resolution: >-
      Ledger buttons are plain buttons with aria-haspopup="dialog"; ServicePricing opens its controlled
      Dialog in onPick and keeps restoring focus to the clicked button itself.
  - seat: agy-gemini-4-argon
    objection: >-
      rowValidity stamped the first cell's duration under rows whose columns are themselves durations
      (D1 Tourism "1 year", C22 Internship "60 days", E30A "1 year", passports "5 years").
    severity: major
    status: CONFIRMED
    resolution: The sub-line renders only when every priced cell of the row agrees on one duration.
  - seat: agy-gemini-4-argon
    objection: >-
      The scroll-spy only looked at the entries whose state changed, so a chapter already inside the band
      could be skipped; a tall viewport could never activate a short chapter.
    severity: minor
    status: CONFIRMED
    resolution: >-
      The observer keeps a set of intersecting chapters and activates the first in document order; the
      band is -20% / -55%.
  - seat: agy-gemini-4-argon
    objection: Unused third grid track in list rows on sm+ added a trailing gap.
    severity: minor
    status: CONFIRMED
    resolution: List rows are a two-track grid at every width.
  - seat: agy-gemini-4-argon
    objection: 79 identical aria-label="More Details" masked the row identity for screen readers.
    severity: minor
    status: CONFIRMED
    resolution: >-
      Accessible name is "More Details: <row name>"; the unit tests match the prefix, Playwright's
      substring match is unchanged.
  - seat: agy-gemini-4-argon
    objection: >-
      buildVisaLedger does not guard duplicate spec keys; unplaced rows without livePriceKey collide on
      key={undefined}.
    severity: nit
    status: CONFIRMED
    resolution: >-
      Duplicate spec keys are pinned by the "never references a key twice" test; list keys fall back to
      the package name.
  - seat: kimi-code/k3
    objection: >-
      Inline style border/colour beat every Tailwind hover: class on the details buttons and chapter
      links, so no hover state ever showed.
    severity: minor
    status: CONFIRMED
    resolution: Border, colour, active background and inset rule moved to classes; hover now applies.
  - seat: kimi-code/k3
    objection: >-
      Identical "More Details" names, a duration caption under multi-duration rows, keyless packages
      colliding on key=undefined and redundant list grid classes (reviewed on the pre-cure diff).
    severity: minor
    status: CONFIRMED
    resolution: All four were cured in the Gemini round of the same council (see the entries above).
  - seat: kimi-code/k3
    objection: >-
      The mobile sticky chip row assumes a 24px parent padding; the price-fidelity test matches by
      substring; the builder places without its own duplicate-key check.
    severity: nit
    status: PLAUSIBLE
    resolution: >-
      The section wrapper is px-6 on mobile (measured overflow 0 at 390px); the exact-figure format
      makes a substring collision implausible and the e2e reads the same way; duplicate spec keys are
      pinned by the "never references a key twice" test.
decisions:
  - id: D-presentation-only
    decision: >-
      The ledger is a presentation layer over SERVICES_DATA.visa.packages: ServicePricing keeps the
      one PricingTool resolver (usePackagePrice) and the one details dialog; VisaPriceLedger receives
      a renderPrice callback and never reads the snapshot itself.
  - id: D-explicit-spec-not-regex
    decision: >-
      Chapters, families and matrix cells are an explicit, reviewable table (visa-price-ledger.ts),
      not a regex over catalogue names: the placement is derivable from the table and tested in
      both drift directions (dangling spec keys, unplaced catalogue rows).
  - id: D-nothing-hidden
    decision: >-
      A catalogue row the spec does not place still renders, in a trailing "More services" chapter;
      the unit test asserts that chapter is empty for the live catalogue so every new row forces a
      conscious placement.
  - id: D-serialized-behind-retire
    decision: >-
      Opened after the 2026-10-17 retire PR merges and rebased on it: the ledger spec places the
      79 surviving rows and the empty-trailing-chapter test is red on origin/main until then.
  - id: D-card-contract-kept
    decision: >-
      Every priced cell keeps data-testid=public-service-price-card, data-pricing-category/key, the
      exact figure in its text and a "More Details" trigger, so book-pricing.spec.ts and
      ServicePricing.test.tsx read the new surface unchanged.
spend:
  wall_clock_hours: 2
  adversarial_rounds: 1
