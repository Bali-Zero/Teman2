resolver_v5:
  - One in-memory TypeScript Program and checker is built per scanned file with noLib, noResolve and no external declarations.
  - "Termination: ONE pass and the memo. Scanner.run visits the file once with one Evaluator; every (operation, node, name) key is computed at most once, so the work is polynomial in the file. There is no previous memo, no growth check, no pass loop, no pass cap or option, no intern table and no context chain (a ContextualString is again { synthetic, node, text }, created once per template span and source because sources(template) is memoized)."
  - "A cycle is not judged, it is red. A re-entered key (a cut) returns the empty set, records the cut node and the use being evaluated, and after the pass the file gets ONE finding `cycle: a value depends on itself (cut at line N)` at the line of the first use in tree order that took a cut, N being the cut node's line. Literal findings are a LOWER BOUND under a cut: values memoized while a cut was open can hide a literal at a later use (the function and member cycle rows report only the cycle finding). The file is red either way. Every row whose run records a cut asserts its exact finding list."
  - "The cost of the ruling: an innocent recursive helper reached from an R19 position is red and must be rewritten or exempted; a named callback applied to its own output (`once = rows.map(toRow); twice = once.map(toRow)`) is a cycle by design (the by-name binding is context-insensitive). Reporting is per file, not per use."
  - "Work bound: one per-file counter of contextual strings created plus string sources judged at positions; past MAX_GUARD_WORK = 20000 contextual strings stop being created, judging stops and ONE finding `too much work to judge (>20000)` is added at the current use line. Red, never a hang. The 2-span template nest 16 and 20 deep and the 2-span depth-10 shapes with 500 and 2000 class uses and 500 style uses all end in that finding in under 1 s."
  - "P1 descends each nested array container once per use through a per-use visited set (like P2's per-root set). Before, `function items(n) { return [n.cls, n.next && items(n.next)]; }` and a()/b() mutually nesting arrays threw RangeError from emitSource's recursion; both shapes now report exactly their literals and never throw."
  - There is no hop limit. Nested evaluation beyond 256 frames reports `resolution deeper than 256` at the use line and never throws.
  - "A function passed by name as argument 0 of map/forEach/filter/find/findLast/some/every/flatMap binds its first parameter to the elements of the receiver exactly as an inline callback does; call sites are indexed once per file."
  - P2 ObjectLiteral descent owns a visited set per style root, so an object is judged once per root even through cyclic or repeated spreads (the f()/g() spread pair is not a cut and keeps its literal).
  - Resolved template spans are judged in their full template context; other spans are replaced by var(--r19-x).
  - Finding.line is the literal line; Finding.use is present only when the resolved use is on another line.
  - "Order of work, stated plainly: the resolver was changed first and the rows second (not red-first). Under the new resolver the table's existing rows went red where their expectation changed (17 failed of 775) and were then pinned to exact finding lists; the new mutants, each killed, are the proof that the new rows bite. The pass loop, previous memo, intern table, chain fields, CONTEXT_CHAIN_MAX and the options parameter are deleted."
named_follow_ups:
  - "a recursive helper or a named callback applied to its own output on an R19 page is red by design (v5 ruling); 0 such files in mouth"
  - imports
  - this.x from a constructor (gate-7705b F05)
  - JSX spread props
  - let reassignment
  - enum members
  - "Object.entries(M).map(([k, v]) => ...) positional callback binding (18 current mouth sites)"
  - 'other calls, including an argument that does not reach a parameter when the call''s result is stored in a variable (gate-7720 MK09 `const v = id("#fff")` and MK10 `const s = shadow("#000")`)'
  - "gate-7720 RI06 Object.entries(M).map(([k, v]) => ...) stays the positional follow-up above; gate-7720 FP07 expected G but the guard's I is right (the literal never reaches the position), so the probe's expectation was wrong, not the guard"
