module_mutants:
  script: evidence/2026-09/mouth-r19-guard-v4b-0930/mutate_module.py
  total: 124
  killed: 122
  broken: 0
  survived: 0
  equivalent: 2
  v4b_scope: "18 mutants added for v4.2 (17 run, 1 equivalent below): intern key ignores the template, the span index or the source identity; a template re-contextualizes its own chain; the context chain has no length cap or does not accumulate; the pass cap is ignored, its option is ignored, the default cap is one, its finding names a fixed number; a cut does not record its use; Windows paths are not normalised; named callbacks are not bound, bind only the first call site, bind any parameter, accept any method. Every one is killed by a table row (verdicts or exact findings), none by the time bound."
  equivalent_argued: "contextual strings are not interned (spec 14 named it a must-kill; it cannot be killed by a verdict or a time row and is argued equivalent instead, see the script's EQUIVALENT list). A ContextualString is created only inside sources(template), which the memo evaluates once per pass, and each wrap lengthens `chain` (capped, never repeating a template), so the number of wrap generations is bounded by the chain cap with or without object identity. Measured with the intern lookup removed: identical verdicts and identical pass counts on every table row and on 10 cyclic shapes (fp16 4 passes, three- and four-template mutual recursion 5-6, 5/6/7/9/11 fully cross-recursive templates 6-7), time 1.07x at 5 templates, 1.26x at 7, 1.36x at 11 (11 templates cost ~1.2 s per scan with the intern, polynomial). The intern still earns its place as the stable identity the spec's key is defined on; it is not what terminates the loop."
  time_bound_kills: "The two time-bound kills, memo is removed and P2 per-root visited guard is removed, were rerun alone against the v4b code with a 130 s bound, each in its own process group: both TIMEOUT at 130 s (2026-09-30T09:54:28Z to 09:58:48Z), the unmutated table runs in 1.8 s. No new v4b mutant is killed by the time bound."
  spec_ruling: "Spec v4.2 amendment 18 (spec owner, 2026-09-30): the unintern mutant may be argued equivalent because amendment 12 (chain rule, whose mutants die) is what terminates the passes; a gate that finds an input where it differs overrules the ruling."
  equivalent_separator: "the memo key separator is the text backslash-u0000 (spec 16 asks for the real NUL): the key only has to keep operation and name apart, neither contains either separator, so the partition is identical; argued equivalent in the script."
  v4b_final_run: "2026-09-30T10:02:37Z to 10:05:55Z, full run on the final script: 124 mutants, 122 killed, 0 broken, 0 survived, 2 equivalent (argued, not run). An earlier full run (09:58:53Z to 10:01:58Z, before the Windows-path mutant existed) gave 121 killed, 0 broken, 0 survived, 1 equivalent."
  history: "First v4b run: 122 mutants, 120 killed, 2 survived (contextual strings are not interned; named callbacks accept any method). The second was a weak row (the reduce row never put a position inside the callback); the row now uses a JSX position inside the callback and the mutant is killed. The first is the equivalent above. The v4 history stands: first v4 run 97 killed, 3 broken, 7 survived, fixed before the 106-killed run."
  v4_run: "2026-09-30T04:14:22Z, full run on the v4 script: 106 killed, 0 broken, 0 survived; the two time-bound kills were rerun alone with a 180 s bound and both were still running when stopped."
  script_fix: "The script runs vitest in its own process group and kills the group on the 12 s bound. Before, the bound killed only npx and left the vitest child spinning under every later mutant."
