resolver_v4:
  - One in-memory TypeScript Program and checker is built per scanned file with noLib, noResolve and no external declarations.
  - Every sources/member/allMembers/elements key is memoized; cycle re-entry reads the previous global pass and the file is re-evaluated until a cut pass has no growth.
  - There is no hop limit. Nested evaluation beyond 256 frames reports an unresolved finding at the use line and never throws.
  - 'Termination is: a finite interned value domain (spec 11-12) plus a pass cap (13). The v4.1 claim that a cycle only adds references and never literals was false once a template span was judged in its context: every pass built new contextual strings whose text nested the previous pass''s text, so a template reached through a cycle (`function cls(d) { return d > 0 ? `pl-4 ${cls(d - 1)}` : ""; }`) grew forever (gate-7720 FP16 and REC1-REC4).'
  - "Contextual strings carry {template, index, chain} and are created only through an intern table owned by the Scanner (it lives across passes), keyed (template, span index, source identity). A span source whose chain already holds the current template, or already has CONTEXT_CHAIN_MAX = 4 templates, is not wrapped again. So the domain is bounded by templates x spans x literal nodes x chains of at most 4 distinct templates."
  - "The pass loop is capped at MAX_FIXED_POINT_PASSES = 128 (forbiddenSourceColour(path, source, { maxPasses }) lowers it for tests only; the per-page guards keep the two-argument call). At the cap the last pass's findings are returned with ONE unresolved finding `fixed point not reached in N passes` at the first use that took a cut in the last pass (line 1 if none): red, never a hang, never a throw. Later uses of the same memoized truncated value are not re-reported; the file is red either way."
  - "A function passed by name as argument 0 of map/forEach/filter/find/findLast/some/every/flatMap binds its first parameter to the elements of the receiver exactly as an inline callback does; call sites are indexed once per file."
  - "The 1-pass row: the member cycle with { maxPasses: 1 } yields the unresolved finding; with the default cap it converges (measured 2 passes) and reports none. All 1754 mouth files converge in 1 pass; the recursive shapes in the table need 4-7."
  - P2 ObjectLiteral descent owns a visited set per style root, so an object is judged once per root even through cyclic or repeated spreads.
  - Resolved template spans are judged in their full template context; other spans are replaced by var(--r19-x).
  - Finding.line is the literal line; Finding.use is present only when the resolved use is on another line.
  - The initial v4 evaluator test run was red (11 failed, 13 passed); production code was then replaced and the final table is green.
  - "v4b (this rework): the new rows were written first; run under a 90 s group-killed bound the termination rows hung (TIMEOUT, process group killed), then production code was changed and all 775 tests pass in 1.8 s."
