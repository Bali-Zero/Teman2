what_changed: |
  - docs/specs/tp1-input-screen.md: new section "Closed vocabularies and their remainders" (18 vocabularies,
    each with one declared remainder that has a limit row); stems match in any name segment unless a closed list of
    property words follows the last stem; subscript carriers on any expression and pair-taking calls; all-digit Tier P
    literals of 6 or more digits; redis-cli -a and the --pass/--auth flags; empty URI user; numeric .pgpass password;
    phone labels telepon/telephone/cell by segment, labels followed by a property word are not labels, amount
    exemption off for labelled values; ID labels document/dokumen/nomor/national and space-grouped NIK; type-shaped
    identifiers as the annotation rule (fixes innocent_30); shell values are literals; PAN and IBAN declared out of
    scope pending the owner's decision; acceptance 6 restated as rule-or-remainder.
  - scripts/tp1max/screen_corpus.yaml: 36 rows with source gate-7988-r2 (18 rule rows, 3 innocence, 15 remainder
    limits); rule phrases on lim_03, g7971n_05 and g7988_08. 343 rows in total.
  - scripts/tp1max/test_screen_corpus.py: optional `rule:` field checked verbatim (whitespace-normalised) against the
    spec; every gate-7988-r2 limit row must carry one; remainder rows are pinned by their rule, not by the claim regexes;
    tskey claim requires the real <id>CNTRL-<secret> shape; claim regexes widened for the new labels and flags.
  - .github/workflows/tp1-runner-tests.yml: the corpus test as a step of the TP1 runner workflow (unchanged from #7988).
proof: |
  Floor 3, source path (--print-floor / --print-floor-source on the staged change list against the branch base).
  663 passed on 3.11.15 and on 3.9.6. Mutation battery: 12 of 13 red, among them the gate's three survivors (Tier K
  hex text, any-expression subscript text, dash-free tskey row); the survivor drops one of three copies of the
  owner-pending sentence, which the other two copies still pin.
seat_note: >-
  Codex rows came from ~/.codex-o2 (sessions 01a1152d and 01a11534). Codex round 2's final message was rewritten by its
  Stop hook into one meta line; the journal carries its first answer from the stderr trace.
dissent:
