  team-lead mandate to dux-tp1spec-cure (2026-10-07): #7988 suspended after gate-7988-r2 BLOCKED e435a60b3d on
  the same cause as round 1 (closed lists with no declared remainder); re-cut as a new PR whose change is the
  method. Receipts ~/.agent/campaign-20261005/work/gate-7988b/receipt.txt and gate-7988-r2/receipt.txt.
