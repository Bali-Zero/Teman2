    objection: "r2 #14: a rule phrase proves the text exists, not the behaviour."
    status: PLAUSIBLE
    resolution: "Behaviour is acceptance 1 of the implementation (PR-C); the phrase pins the text so a rule cannot vanish silently."
  - seat: ollama-mini/qwen3.5:9b
    objection: "r1 #4/#11: raise the all-digit threshold to 8."
    status: PLAUSIBLE
    resolution: "Not adopted: six digits is the mandate's floor; shorter values are the declared remainder rem_short_digits."
