diff:
  behaviour_change: >-
    The scrim exemption is a hit-test fact read at p, the run's own point, on every path. On the reach path
    within() decides only that an overlay reaches, at its nearest point; the scrim test then takes pointB's own
    stack and run index, so a scrim under the run or absent at p never exempts. nearStack and the branch that
    exempted on a missing run layer are removed. Rows R-A, R-C, R-D are guilt, R-E and R-E2 innocence, R-B
    declared as the accepted over-count of within(). No verdict line moves on the tree (0 reacher instances lie
    inside a scrim): G 577, O 18, K 188, M 741, state 51, drift 0.
