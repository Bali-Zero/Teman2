acceptance:
  - text: scripts/disk_janitor.sh SHALL never invoke uv and its receipt SHALL carry no uv_cache_prune step, while restic and brew still run.
    probe: "bash scripts/test_disk_janitor.sh"
  - text: The pro.janitor plist SHALL carry PRO_JANITOR_APPLY=true.
    probe: "python3 -m pytest scripts/tests/test_pro_janitor.py -q -p no:cacheprovider"
  - text: A tool rule SHALL NOT run when any symlink within three levels of its cache resolves outside the cache (npm's gc and tmp rimraf, uv's prune delete inside it); a link that stays inside (uv's own layout) SHALL NOT stop it.
    probe: "python3 -m pytest scripts/tests/test_pro_janitor.py -q -p no:cacheprovider"
  - text: uv-prune SHALL wait while a uv process is alive or the probe cannot rule one out (the guard disk_janitor's removed step carried).
    probe: "python3 -m pytest scripts/tests/test_pro_janitor.py -q -p no:cacheprovider"
  - text: A missing or unspawnable tool SHALL cool down instead of erroring every tick; a failed lsof probe stays uncooled by design.
    probe: "python3 -m pytest scripts/tests/test_pro_janitor.py -q -p no:cacheprovider"
