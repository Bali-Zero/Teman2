residuals:
  - "The link scan is a point-in-time check: a link created between the scan and the tool's run is not seen. The janitor runs as the same user that owns the caches, so the threat is a misconfiguration, which the scan catches, not an adversary, who could delete those files directly."
  - "The scan stops at three levels (pinned by test_the_link_scan_reaches_depth_three_and_no_further): a link deeper inside npm's content tree is not seen. npm's own content paths are hash-addressed files, not links."
  - "uv-prune can starve: pgrep -x uv also matches long-lived `uv run` processes (on Pro at 2026-10-12T01:26Z an agy session's `uv run -m advanced_seo_mcp.server`), and every skip retries in 10 min. uv's own cache lock would stall the prune the same way; the skip turns a 300 s timeout into a clean line. The uv cache is 1.4 GB, npm and Playwright are unaffected."
  - "A failed lsof probe (error:lsof-*) is not cooled down by design and pages every tick until it reads."
  - "A stale __dirlock parks playwright-old (skipped:install-in-progress, noted stale_dirlock after 1 h) until removed by hand."
  - "Pre-existing doc drift: exit code 12 is missing from the module docstring; next_tier's docstring says one band at a time while the loop can descend several."
  - "Carried from rollout step 2 (pack agent-air-m5-infra-pro-janitor-1010-b9ad7512#residuals): L1 mid-walk exception journals 0 bytes, L2 the unreadable link-registry early return has no test, I1 the keepalive TypeError path."
