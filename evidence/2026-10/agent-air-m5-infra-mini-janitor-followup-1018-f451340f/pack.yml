decisions:
  - id: D-find-exec-entries
    text: >-
      /tmp entries are handled by find itself through -exec sh -c with the paths as arguments, so a
      name is never re-split or evaluated; each is renamed to a same-parent trash sibling and removed.
  - id: D-reserved-trash-namespace
    text: >-
      Top-level .janitor-trash-* entries under /home/runner/.cache and /tmp in the runner container are
      a namespace reserved for this janitor and are deleted on sight; nothing else in the fleet writes
      that prefix. This bounds the leftover sweep, which has no other provenance check.
