what_changed:
  Two predicates exclude non-finite passport expiry and process creation dates
  before deadline arithmetic. Four PostgreSQL regressions cover both infinity signs, personal/team
  views, owner filtering, and pagination.
meta_pattern: Deadline arithmetic requires calendar dates at the shared query boundary.
operator_only: No new consent, setting, migration, or operator action is required.
dissent:
  - seat: production-read-only-probe
    objection:
      Team overview returned HTTP 500 while personal scope returned 200. A read-only
      query reproduced DatetimeFieldOverflowError, SQLSTATE 22008.
    status: CONFIRMED
    resolution:
      One active passport expiry was negative infinity. On unmodified code, synthetic
      negative-infinity passport and process cases failed with HTTP 500; two positive-infinity
      controls passed (2 failed, 2 passed). The fixed full suite includes all four passing regression
      cases. A candidate evaluated only in a separate read-only console process produced valid
      team DTOs and consistent totals and owner counts.
