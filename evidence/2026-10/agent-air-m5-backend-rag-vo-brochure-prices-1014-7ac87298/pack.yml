dissent:
  - seat: claude-opus-5-5
    severity: MEDIUM
    objection: "Guard never ties a printed label or qualifier cell to its placeholder: swapping {{PRICE_E33G_OFF}}/{{PRICE_E33G_ALT}} and {{PRICE_VOA}}/{{PRICE_C1_EXT}} left all 7 tests green."
    status: CONFIRMED
    resolution: "Cured in dbe79a1f7c: EXPECTED_ROWS pins label, qualifier cells, price column and canonical row for all 50 placeholders; guilt tests swap VOA/C1_EXT, swap E33G Offshore/Onshore, mutate the E33E label cell and a freelance qualifier cell, each must fail. Re-observed this turn: the VOA/C1_EXT swap on the real template gives 3 failed."
  - seat: claude-opus-5-5
    severity: MEDIUM
    objection: "The guard would not have caught the incident: the template and JSON were right and only the committed PDF was stale; verify() compares a set of numbers and missed E33E 14M -> 45M because 45.000.000 also prints in the KITAP row."
    status: CONFIRMED
    resolution: "Cured in dbe79a1f7c with the 'alternative' form: test_committed_pdf_anchored_rows_match_canonical_prices reads the committed PDF text and checks each row as an anchored sequence (label, qualifier, price), plus guilt tests that fail when the canonical E33E price is set to 14M and when the PDF prints 14M for E33E. No sidecar file was added. Residual: this runs in backend-tests CI, which the change map routes for JSON, template and generator changes; it does not run if only the PDF is hand-swapped without those paths, accepted."
  - seat: claude-opus-5-5
    severity: LOW
    objection: "Hard-coded IDR scan covered only table cells with a case-sensitive pattern; a prose price 'Rp14.000.000' stayed green."
    status: CONFIRMED
    resolution: "Cured in dbe79a1f7c: the scan covers every text node, case-insensitive Rp/IDR and money shapes, with named exemptions; guilt case test_guilt_g_hardcoded_idr_in_paragraph_is_flagged."
  - seat: claude-opus-5-5
    severity: LOW
    objection: "Bites line claimed the served PDF already prints 45M, but both hosts still served the old PDF (sha256 950fcecfa593693b)."
    status: CONFIRMED
    resolution: "Not a code change. The PR body states the Bites as a post-deploy observation: after merge and vercel promote, curl kita.balizero.com first (the welcome-email consumer) and balizero.com, sha256 starts 88896ff89797595c, pdftotext shows E33E at Rp 45.000.000. Recorded in brief.yml acceptance."
  - seat: claude-opus-5-5
    severity: LOW
    objection: "Neither base commit is on origin/main; the PR would carry the 21-file catalogue-decisions change."
    status: RETRACTED
    resolution: "REFUTED BY EVENTS. The base landed as PR 8501 (f91af7a8f7); git merge-base --is-ancestor f91af7a8f7 origin/main exit 0 this turn, and git diff --name-only origin/main...HEAD lists only this lane's three files. Main did not touch the brochure inputs since."
  - seat: claude-opus-5-5
    severity: LOW
    objection: "_load_generator and _iter_service_entries lacked return annotations."
    status: CONFIRMED
    resolution: "Cured in dbe79a1f7c: def _load_generator() -> types.ModuleType and a fully annotated _iter_service_entries (grep of the module this turn)."
  - seat: claude-opus-5-5
    severity: LOW
    objection: "Cosmetic: the three monthly-tax ranges wrap as 'Rp 1.800.000 - Rp' / '2.000.000' (pre-existing, outside the diff)."
    status: CONFIRMED
    resolution: "DEFERRED. Out of scope for this lane (the old PDF wrapped the same way, values correct). Follow-up: non-breaking space between Rp and the figure in fmt_entry, with the test oracle changed in step."
  - seat: gpt-5.6-sol via codex
    severity: HIGH
    objection: "The guard does not verify the canonical (label, price) pair: label was collected but never asserted, so replacing only the E33E label with 'WRONG PRODUCT LABEL' still passed; the brochure prints non-canonical labels ('Retirement 55+ (Second Home senior, E33F)', 'E33E Second Home Senior, 5 years') against canonical names 'E33F Second Home Senior (1 Year, Offshore)' and 'E33E Second Home Senior (5 Years)'."
    status: CONFIRMED
    resolution: "PARTIALLY CURED. Guard half cured in dbe79a1f7c (same EXPECTED_ROWS table as the first MEDIUM; test_guilt_c_mutated_e33e_label_cell_fails_parity changes only the label and must fail). Relabel half NOT done: the lane spec says change no wording beyond row labels that must follow canonical names, and the printed short labels are bound one-to-one to their canonical rows by the table, so no price can sit under a wrong label. Whether to print the long canonical names is an owner wording call, flagged to Zero in brief.yml assumptions."

