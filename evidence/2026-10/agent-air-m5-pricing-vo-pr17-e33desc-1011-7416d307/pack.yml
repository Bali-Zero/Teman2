  - seat: codex-gpt-5.6-sol (read-only red team, rollout rollout-2026-10-11T15-05-25-01a129c7-d6bb-7132-8ab0-8d1f6a968494.jsonl, model verified in the rollout file)
    objection: "LOW 3: E33F untouched is not really verified (two rows, two fragments)."
    status: RETRACTED
