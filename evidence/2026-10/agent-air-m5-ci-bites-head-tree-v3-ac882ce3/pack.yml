# Gear-3 evidence pack — successor of PR #7526: the Bites step resolves an in-PR observer in the PR head tree.
# Written by the Dux of this mandate (Claude Opus 5.5, M5, mission colour BLUE). Every receipt is a command this
# writer executed on 2026-10-02 between 10:17Z and 10:45Z; outputs are quoted from those runs. Scratch logs live in
# the session scratchpad and are not committed. The `ts` of R1-R3 and R7 were printed by the runs themselves; those
# of R4-R6, R8 and R9 are minute-level readings of the session clock, not stamps.
gear: 3
brief_ref: evidence/brief.yml
ruling: >-
  SAETTA amendment 7 (docs/rules/RULINGS.md, ruled 2026-09-12): a red whose cause is the harness is fixed in a
  separate PR. Mandate from the team lead, 2026-10-02 ~18:15 WITA: land #7526's content on a fresh origin/main as a
  successor PR, leave #7526 and #7504 untouched.
mission: >-
  PR #7504 (gate PASS on 9a1413999f) is red only in the "Bites contract" step, because the step's base parser
  looks for the PR's NEW observer in the base checkout. #7526 cured that and then froze: armed, conflicting with
  main in one hunk, no owning session. This PR is #7526 on fresh main plus the probe that lets the PR which
  introduces `--tree` be judged at all.
lanes:
  - lane: bites-head-tree-successor
    role: build
    seat: Claude Opus 5.5 (Dux, M5)
pii_scan: clean
bites:
  consumer: >-
    the Harness floor job's "Bites contract — parse this PR's evidence pack" step, on every Gear>=2 PR whose
    evidence pack names an `observe:` script; first named consumer PR #7504, whose observer
    scripts/ci/observe_visa_seq24_signed.py exists only in its own head tree.
  observation: >-
    After this merges and #7504's branch is updated, #7504's "Harness floor recompute" run logs the Bites step's
    EXECUTABLE notice (no `does not exist in tree` error, no probe notice) and the check concludes success; the
    run URL is the proof. Locally reproduced now (receipt R4): the same pack with this parser is executable
    against 9a1413999f and malformed against origin/main.
decisions:
  - id: D-content
    decision: >-
      Parser and tests are taken from #7526's head 2bb05c5b9d by content, not by cherry-pick: #7526's five commits
      interleave code with its own evidence directory, which belongs to a branch slug this PR does not have. Main
      has not touched scripts/ci/bites_parse.py or scripts/tests/test_bites_parse.py since #7526's merge-base
      a6fcae5afe (`git log a6fcae5afe..origin/main -- <both>` is empty), so a per-file take is the whole of
      #7526's change to them. bites_parse.py is blob-identical to 2bb05c5b9d (212170bdb9); the test file is
      #7526's plus one test (D-probe).
  - id: D-hunk
    decision: >-
      The one conflicting hunk of harness-floor.yml: main's side is #7536 (`RC=0`, `|| RC=$?`, and a comment
      explaining why), #7526's side is the same capture with a different comment plus `--tree "${HEAD_SHA}"`.
      Kept main's #7536 comment and capture verbatim, added #7526's `--tree` comment paragraph and argument. Edited
      by hand on that hunk only; every other hunk of the file is origin/main's (receipt R2: one hunk, +18/-1).
  - id: D-probe
    decision: >-
      Added beyond #7526: the step passes `--tree` only when `bites_parse.py --help` advertises it. The job checks
      out BASE (`ref: merge_group.base_sha || pull_request.base.sha`) but runs the PR's workflow, so in the PR that
      introduces the flag, and in its merge-group run, the parser is origin/main's, which rejects `--tree`
      (argparse exit 2, empty stdout); the step then dies at the `CLASSIFICATION=$(...)` capture under `bash -e`
      with exit 1 and no `::error` (receipt R6). #7526 never met this only because its gate verdict was never
      posted: run 36294191323 stopped at `harness_gate_read: PENDING`, before the Bites step. The probe mirrors
      the missing-FLAG-degrades split the same workflow already uses for `--numstat-file`. It also closes #7526's
      own first dissent (a PR whose base predates the parser). Reported to the team lead before building it.
  - id: D-self-judgement
    decision: >-
      This PR changes the step that judges it. Its own Harness floor runs (pull_request and merge_group) execute
      the NEW workflow text over the OLD parser, so the probe fails, the step prints the `::notice` and judges
      this pack by the old checkout lookup. That is a judgement of this pack's bites block by the pre-change
      rule, not a test of `--tree` in CI: the `--tree` path first runs in CI on the first PR whose base contains
      this merge (#7504 after its branch update is the named one). This pack's bites block is prose, classified
      `legacy` by both parsers, so the old judge can neither fail nor pass it wrongly.
