dissent:
  - seat: kimi-code/k3 (round 1, on 46a2e3d6f5)
    objection: >-
      LOW: argparse's own exit 2 carries no JSON; claimed to degrade to the step's `*)` branch with a readable
      message. Disposition: the consequence is right (no false green) but the path is wrong — measured in R6, the
      step dies at the CLASSIFICATION capture without a message. That is the out-of-scope line named in the brief;
      D-probe removes the one route by which CI itself would hand the parser an unknown flag. CONFIRMED is
      the no-false-green half; the readable-message half is corrected by R6.
    status: CONFIRMED
  - seat: kimi-code/k3 (round 1, on 46a2e3d6f5)
    objection: >-
      LOW: tree-mode containment is lexical (posixpath.normpath); nothing is executed and the bites-observable
      marker stays the gate. Disposition: accepted as #7526's D-tree-lookup design, not changed here.
    status: PLAUSIBLE
  - seat: self-review (the Dux, not an independent refuter)
    objection: >-
      No CI run has exercised `--tree` yet and this PR's own runs cannot (D-self-judgement). The first proof in CI is
      #7504 after this merges — acceptance A4, owned by the team lead, not claimed here.
    status: CONFIRMED
  - seat: self-review (the Dux, not an independent refuter)
    objection: >-
      R7's mutations edited the workflow file in the worktree for under two seconds each while the round-2 review
      seats were reading the same worktree; a seat reading at that instant would have seen a mutant. Both seats
      were told to verify by commit (git rev-parse / git show), and the file is byte-identical to b54e27ebff after.
    status: PLAUSIBLE
  - seat: codex-gpt-5.6-sol (round 1, on b54e27ebff)
    objection: >-
      LOW: the checkout is `filter: blob:none`, so `git cat-file -s` on an observer blob that is not local may
      lazy-fetch the whole object before the 256 KiB cap refuses it. Bandwidth and time only: no false green, and
      the bytes never reach Python. Inherited from #7526's reader, not changed here.
    status: PLAUSIBLE
