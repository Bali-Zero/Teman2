  - "R8 NOTE (kimi): the test file trips the scanner's keyword detector on a JSON key and is neutralised by the tests/** auto-triage path rule; narrowing that rule would turn the file red on unrelated PRs."
  - "R8 NOTE (kimi): disk headroom is fine today (two transient worktrees of about 1.4 GB each against about 14 GiB free on a 97% full volume) and worth watching."
  - "Accepted window (agy round 1): sub-millisecond signal window between the background fork and CHILD_PID=$!; the launchd group stop reaches the helper directly (row L3)."
  - "docs/AUTOMATIONS_REFERENCE.md still lists the retired scheduled detect-secrets run until the generated file refreshes from live Pro and Mini state."
  - "detect-secrets is not installed on Mini and tg_notify.py is stubbed in the corpus, so the venv, the gateway under Python 3.9 and the real scan duration are unproven until the post-merge observation (A6)."
  - "Rounds 1 and 2 were REWORK from agy and are recorded as given; the final head was judged PASS by agy (round 3, from reading) and the previous head PASS by kimi (round 2, with the suite run); kimi did not re-run round 3 because the round-3 change was a bound on the page text covered by agy's confirmation and the 19/19 suite."
