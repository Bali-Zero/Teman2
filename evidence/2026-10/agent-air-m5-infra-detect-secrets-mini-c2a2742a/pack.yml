decisions:
  - id: D-report-only
    decision: >-
      The scan runs auto-triage in a throwaway worktree and discards the mutated baseline; nothing is committed. A finding is a
      warning heartbeat (the monitor is healthy) plus one p0 through tg_notify.py with routing off and an empty relay.
  - id: D-detached-worktree-of-main
    decision: >-
      The scan reads refs/heads/main of Mini's checkout in a throwaway detached worktree, never the canonical checkout; freshness of that
      main is owned by the zero-sync organ (residual: no staleness alarm, the heartbeat carries the sha).
  - id: D-pinned-venv-never-installs
    decision: >-
      A dedicated venv whose detect-secrets version must equal the baseline's validated "version"; the wrapper never installs and names
      the install command when the tool is wrong. Installing on Mini is a post-merge step.
  - id: D-security-yml-schedule-exclusion
    decision: >-
      Only the detect-secrets-scan job excludes schedule; both crons stay so the Snyk jobs' scheduled behaviour (owner decision pending)
      is untouched. PR, push and workflow_dispatch are unchanged and the alert composer serves workflow_dispatch.
  - id: D-daily-0317-weekly-collapsed
    decision: >-
      One daily run at 03:17 WITA replaces the daily and weekly workflow runs; the 129600 s window is 36 h, one missed slot plus margin.
  - id: D-reuse-proven-lifecycle
    decision: >-
      The process lifecycle reuses the docs-inventory spec rows L1-L6 verbatim (group kill on ALRM/TERM/INT/HUP, background wait with
      signal forwarding, bound validation, stale sweep under the lock), so no new lifecycle is invented in a fix-of-a-fix.
