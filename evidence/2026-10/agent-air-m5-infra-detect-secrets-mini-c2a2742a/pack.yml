dissent:
  - seat: agy-gemini-3.1-pro (round 1 DEFECT 3)
    objection: >-
      git worktree add and git worktree prune are not concurrency-safe; if the 03:00 docs-inventory organ overlaps the 03:17 scan, a
      concurrent prune could delete the metadata of a mid-creation worktree and corrupt the repository.
    status: RETRACTED
    disposition: >-
      REJECTED on evidence. Kimi disproved it empirically in round 1 and again in round 2 (20 rounds x 3 concurrent same-basename adds
      plus a concurrent prune: zero errors, no admin-dir leftovers, clean fsck; same-basename adds auto-suffix; the two organs use
      disjoint temp bases and the schedules are 17 minutes apart). Agy itself ACCEPTED the disproof in round 2.
  - seat: agy-gemini-3.1-pro (round 1 DEFECT 1)
    objection: >-
      line_number is part of the dedup hash, so unrelated code inserted above a finding shifts the line, changes the hash and re-pages
      an old finding.
    status: PLAUSIBLE
    disposition: >-
      REJECTED as a defect, kept as a design choice. A re-page on a shifted finding is the safe direction for a security organ, and
      dropping the line would collapse distinct same-type findings in one file into a single row and mask a new one. Both seats ACCEPTED
      this in round 2.
  - seat: agy-gemini-3.1-pro (round 1 DEFECT 2)
    objection: >-
      A signal landing between the background fork and CHILD_PID=$! runs the trap with an empty CHILD_PID, so the child tree could
      outlive the wrapper and be scanned under a removed worktree.
    status: PLAUSIBLE
    disposition: >-
      ACCEPTED as a residual, the same window the docs-inventory organ accepted after its round 3. A launchd stop group-signals, so the
      helper receives the TERM directly (lifecycle row L3, now pinned by a test); the next run's stale sweep reclaims any residue. Both
      seats ACCEPTED in round 2.
  - seat: kimi-code/k3 (round 1 NOTE)
    objection: >-
      The findings summary is unbounded and tg_notify has no 4096 cap; a mass finding event makes Telegram reject the p0 after the
      gateway has recorded the dedup key, so it never re-sends in real time.
    status: CONFIRMED
    disposition: >-
      CURED in 1628849991 (30-path cap plus "... and N more file(s)"), then re-cured in 3a69d6a5bb after agy round 2 showed the cap
      bounded the count and not the characters: each path at most 160 characters, the list at most 30 paths and 3000 characters. The
      digest still covers every finding. Pinned by the many and deep cases (the deep page was 9298 characters on 1628849991); agy
      round 3 PASS.
  - seat: kimi-code/k3 (round 1 NOTE)
    objection: >-
      The baseline's "version" string flows unvalidated into the heartbeat JSON and the p0 on the tool-error path; a quote or newline
      there would corrupt the sidecar.
    status: CONFIRMED
    disposition: >-
      CURED in 1628849991: the version must be digits and dots before any use (guard placed before the install hint is built). Pinned by
      the bad-version case, red on 7d735bae9a (R5).
  - seat: kimi-code/k3 (round 1 NOTE)
    objection: >-
      The suite pins the lifecycle's main-only TERM but not the group-signalled stop (row L3) that the sibling suite covers.
    status: CONFIRMED
    disposition: >-
      CURED in 1628849991: a group-signalled stop case was added. Kimi notes in round 2 that it also passes on the previous wrapper, so
      it is a regression pin and not a guilt pair; recorded so the dossier does not overclaim.
  - seat: kimi-code/k3 (round 1 NOTE)
    objection: The plist install note pins a static detect-secrets version that can go stale.
    status: CONFIRMED
    disposition: >-
      CURED in 1628849991: the note names the "version" field of .secrets.baseline on main.
