pii_scan: clean
pii_scan_note: >-
  Code, tests, the spec and GitHub metadata only (PR numbers, shas, check names, a GraphQL schema). The journal lines carry
  the label actor's GitHub login, an operator account and not client data. No PR title, author or body, and no client data
  was read or written.
what_changed: |
  Commit 29b15719fe (N2, the gate notice carried from C3a-1): in `merger.py report`, compared_merge now also needs the row's
  GitHub side to be other than PENDING. Per context, hosted_compare already left a HOSTED_PENDING context uncounted, but a
  merge with twelve contexts agreeing and one more required context still in progress counted as a compared merge and
  inflated compared_merges toward READY. Proves: the guilt case (pending -> 0, it was 1) and the innocence cases (SUCCESS
  or FAILURE -> still compared), with mutant compared-merge-hosted-pending killed.
  Commit 439ca2002e (the GitHub-reading helpers, split out because the enqueue commit exceeded ~400 net lines):
  - gh_graphql (`gh api graphql`; strings raw with -f, integers typed with -F; a non-zero exit, an errors list or no data
    raises GraphQLError with GitHub's message, redacted);
  - hosted_side (branch protection's required contexts, read live, GREEN on the PR head, red-dominant through
    hosted_compare);
  - label_arm (localci:merge-shadow-ok, applied LAST by a User whose collaborator role_name is admin or maintain);
  - pr_side (one GraphQL read: state, draft, cross-repository, base, head oid, isInMergeQueue / mergeQueueEntry, labels and
    the labeled/unlabeled timeline; one enqueue per (pr, head) from the journal).
  Proves: the transport's argv shape and its four error shapes.
  Commit 95531dd5ef (the criterion and the one write). After every decision with a verdict, enqueue_step journals one
  line:
  - `enqueued`: both halves of the arm present and every sub-criterion true. One enqueuePullRequest(pullRequestId,
    expectedHeadOid = the decided head) is sent, and the line carries entry_id, position and entry_state.
  - `would_enqueue`: the flag is off or the label half is false.
  - `enqueue_refused`: armed, but a sub-criterion is false.
  - `enqueue_error`: the mutation failed or returned no entry. The message is redacted and the call is not retried in the
    tick.
  The sub-criteria are local_checks_clean, review_independent, executed_contexts_ok, hosted_required_green,
  head_unchanged, same_repo, not_draft, base_main, open, not_in_queue, first_enqueue and label_privileged. The env flag
  (armed_env) is reported apart. The decision line gains executed_required and non_executed. triage takes a PR that
  carries only the arm label. `report` counts enqueued, would_enqueue (every sub-criterion true), enqueue_refused and
  enqueue_error, and prints them at the end of the phase E line. The spec gains the C3a-2 paragraph in phase C. Mutant
  table: fourteen new rules.
  Not touched: runner.py, contexts_matrix.yaml, hosted_compare.py, the launchd wrapper, the plist and .github. The flag
  stays OFF.
proof: |
  See receipts. merge-tree of HEAD against origin/main b8cf9e56dc is clean (03:19Z).
  Journal line shapes, produced from HEAD's enqueue_step with GitHub faked, keys sorted:
  - would_enqueue = {armed_env:false, base_sha, candidate_sha, code_sha, criterion:{base_main, executed_contexts_ok,
    first_enqueue, head_unchanged, hosted_required_green, label_privileged, local_checks_clean, not_draft, not_in_queue,
    open, review_independent, same_repo}, executed_required:"N/M", expected_head_oid, head_sha, host, kind:"would_enqueue",
    label_actor, lease_id, live_head_oid, non_executed:{context: mapping}, ok, pr, pull_request_id, refused:[...,
    "armed_env"], repo, ts, why:{sub-criterion: reason}}.
  - enqueued = the same keys with armed_env:true, refused:[], why:{}, plus entry_id, entry_state and position.
  - The proof that arming waits for is would_enqueue with ok:true and refused == ["armed_env"].
  - The phase E line keeps its text and ends with "; enqueued=N would_enqueue=M enqueue_refused=R enqueue_error=E".
bites:
  consumer: >-
    The Pro launchd job com.balizero.localci-merger, which runs merger.py from origin/main at each tick. Then the
    orchestrator's docs-only proof PR, not armed with --auto, whose would_enqueue line arming waits for. Then the
    operator's read of `merger.py report`.
  observation: >-
    Before merge, on M5 only: the corpus and the sweep below, and the two line shapes in proof printed by HEAD's
    enqueue_step. Owed after merge on Pro: the first launchd tick on main's merger journals a decision followed by a
    would_enqueue line with armed_env false and no mutation; the report's phase E line ends with the four enqueue counts;
    and the proof PR's would_enqueue line shows every sub-criterion true with only armed_env refused, quoted on the PR.
