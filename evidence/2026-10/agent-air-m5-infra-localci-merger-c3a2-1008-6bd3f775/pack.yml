dissent:
  - seat: final gate on 95531dd5ef (orchestrator-commissioned)
    objection: "LOW: a check whose status is NOT_APPLICABLE without a reason passes local_checks_clean. The runner treats that shape as BLOCKED in overall(), and the merger's CHECK_OK does not."
    status: CONFIRMED
    resolution: "Acknowledged and not blocking: the gate's verdict is GO. It is owed as a follow-up and listed in the PR body by the orchestrator. Nothing in this PR arms the merger, so no enqueue can follow from it before the fix."
  - seat: final gate on 95531dd5ef (orchestrator-commissioned)
    objection: "LOW: if the journal write raises OSError after a mutation was sent, decide's own except journals a second decision line for the same (pr, head, base)."
    status: CONFIRMED
    resolution: "Acknowledged and not blocking (GO). It is owed as a follow-up in the PR body. The next tick reads isInMergeQueue and refuses a second enqueue, so the cost is one extra decision line, not a second mutation."
  - seat: final gate on 95531dd5ef (orchestrator-commissioned)
    objection: "LOW: the rule that only a User actor can arm the label half is unpinned by a test. The Bot guilt case also refuses through the role read (the fake answers role 'write' for an unknown login), so removing the User condition would stay green."
    status: CONFIRMED
    resolution: 'Acknowledged and not blocking (GO). It is owed as a follow-up in the PR body: a Bot case whose login the fake grants admin, plus a mutant on the `actor.get("__typename") == "User"` condition.'
owed:
  - "The gate's three LOW findings above, listed by the orchestrator in the PR body as follow-ups."
  - "Pen residual: the enqueue runs under the ambient gh token on Pro until Zero installs the merger's own credential (spec §4.1)."
  - "The arm label survives later pushes to the PR, as GitHub auto-merge does. Each new head is still judged by both gates."
  - "Not built: following the queue entry after the enqueue (from issue events or mergeQueueEntry), named in the C3a-1 pack's owed line. It was not in this brief."
  - "The mutation's schema is verified by read-only introspection only. The first real enqueue is the proof PR after arming, run from main's code."
  - "After merge on Pro: the first launchd tick's decision + would_enqueue pair, then the proof PR's would_enqueue line with every sub-criterion true and only armed_env refused."
