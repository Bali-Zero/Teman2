  docs/specs/localci-sovereign-2026-10-07.md §2 (ruling docs/rules/RULINGS.md RULED 2026-10-07: local decides, GitHub is
  storage), commissioned by the orchestrator session "LocalCI-gate: CI vincolante in locale" to this BLUE builder. It is
  serialized after C3a-1 (#8036, merged 224d353e89) because both touch merger.py. The builder builds and stops. The
  orchestrator gates, pushes, opens and ships.
