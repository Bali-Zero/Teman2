gear: 2
brief_ref: evidence/brief.yml
pii_scan: clean
ruling: >-
  Owner, 2026-10-08, relayed by the team lead as PR-C2: since seq-26 the engine prices E31 by
  stay-permit duration, and the public page must show which permit was priced and the alternative.
lanes:
  - lane: duration-c2-build
    role: build
    seat: Claude Opus 5.5 implementer (worktree mouth-visa-oracle-duration-c2).
  - lane: duration-c2-ground-truth
    role: ground_truth
    seat: >-
      the committed official price catalogue and the seq-26 engine answer verified live by the
      team lead on 2026-10-08 (E31A 365 days 11,000,000 IDR, 730 days 15,000,000 IDR); no notebook,
      no memory. The page asserts no figure of its own, it renders the engine's amounts.
    nb: apps/backend-rag/backend/data/bali_zero_official_prices_2026.json
    query_hash: "a9c37a23bdce45f060a160f714a994ed2792dd53585eb11882c7fe440fd38c8c" # pragma: allowlist secret — sha256 of that catalogue file
bites:
  consumer: >-
    the CI harness, which runs this observer after the merge, and every visitor of
    balizero.com/visa-oracle who reaches an E31 result: the observer proves the four duration
    strings exist in both languages and the client copy carries no engine jargon.
  where: ci
  observe: python3 scripts/ci/observe_visa_oracle_client_copy.py
  expect: "contains:OK visa-oracle client copy"
decisions:
  - id: D-shadow-parity
    decision: >-
      The duration is not part of the shadow parity projection, because the gold preview
      baseline cannot carry it. A comment in shadow-parity.ts names this PR.
  - id: D-share-summary
    decision: >-
      The share summary had no price line, so a candidate with a duration gets
      "price · permit label" appended after its name, and one without a duration is unchanged.
  - id: D-label-keys
    decision: >-
      Two short-label keys (duration_label_years, duration_label_days) join the four spec keys,
      because the "Also available" line needs "1 year" and "2 years" without the word permit.
receipts:
  - claim: The visa-oracle test subset is green, including the new _lib/duration.test.ts parser and adapter tests and _components/OutcomeSheet.duration.test.tsx sheet tests (apps/mouth/src/app/(visa-oracle)/visa-oracle/_components/OutcomeSheet.duration.test.tsx, apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/duration.test.ts), the i18n parity, shadow parity, client-copy census and no-path-doors tests.
    cmd: cd apps/mouth && timeout 900 npx vitest run <duration, OutcomeSheet.duration, i18n, client-copy, shadow-parity, OutcomeSheet, no-path-doors, engine-adapter, engine-response tests>
    result: "Test Files  9 passed (9); Tests  392 passed (392)"
    exit: 0
    ts: "2026-10-09T02:48:07Z"
    seat: Claude Opus 5.5
  - claim: The mouth typecheck is clean.
    cmd: cd apps/mouth && npx tsc --noEmit -p tsconfig.json
    result: "no output"
    exit: 0
