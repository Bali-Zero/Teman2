council_run: council-journal.jsonl
council_note: >-
  The Codex seat is registered as codex-gpt-5.6-sol, but the run used the CLI default model of
  ~/.codex/config.toml, gpt-6-astra. The lint admits only roster seat ids, so the id is kept and
  the real model is named here and in the journal.
dissent:
  - seat: codex-gpt-5.6-sol
    severity: HIGH
    objection: The quote was matched by product id only, so a 1-year permit label could sit beside the 2-year price.
    status: CONFIRMED
    note: cured in f55dbca5ad, the quote must match the selected option's pricing key and amount, else the advisor line with no permit label.
  - seat: codex-gpt-5.6-sol
    severity: MEDIUM
    objection: The duration block was not checked as a whole (order, one selected option, extension only with options).
    status: CONFIRMED
    note: cured in f55dbca5ad, an inconsistent block is dropped by the guard and never crashes the page.
  - seat: codex-gpt-5.6-sol
    severity: MEDIUM
    objection: The new no-path-doors assertions never executed because no replay walk carries that code.
    status: CONFIRMED
    note: cured in f55dbca5ad, the assertions moved into the all-causes loop and two fixtures prove they can fail.
  - seat: codex-gpt-5.6-sol
    severity: LOW
    objection: No regression test showed parity ignores the duration but still sees a price change.
    status: CONFIRMED
    note: cured in f55dbca5ad, shadow-parity.test.ts covers both directions.
spend:
