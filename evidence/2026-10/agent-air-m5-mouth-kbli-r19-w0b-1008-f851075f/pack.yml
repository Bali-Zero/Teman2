dissent:
  - seat: codex-gpt-5.6-sol
    objection: "--font-weight-extrabold (.font-extrabold on h1.kbli-flag-title, /kbli, all six states) is read and missing from the contract: PAINT admits font and font-family but not font-weight."
    status: CONFIRMED
    resolution: "Fixed: font-weight is now a type read, because Direction A fixes one weight per face. The re-run found 16 such reads, all now rows. The type scale (size, line-height, letter-spacing) stays declared geometry."
