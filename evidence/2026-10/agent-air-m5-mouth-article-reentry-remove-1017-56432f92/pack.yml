ruling: >-
  Zero 2026-10-17: "Re-entry permit su e25b/e31e: togli. Su e31b c'è anche 'renewal IDR 500,000':
  togli." Bali Zero's re-entry permit is quoted on request; the totals already say "plus
  re-entry permit on request".
mission: >-
  A reader of the E25B, E31E or E31B KITAS guide, in any language, or an LLM reading the llms
  exports, sees no Bali Zero re-entry permit price, only "on request".
