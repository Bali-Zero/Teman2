decisions:
  - id: D-e25b-step-cost
    text: >-
      The E25B step sub-bullet "Cost: ~IDR 500,000-1,000,000" under "Re-entry permit (if
      traveling)" is the same Bali Zero price and was removed in every locale with the cost-list
      line.
  - id: D-stamps
    text: >-
      Re-stamped with the translator's source_digest: E25B id/it/fr/ru, E31E fr/ru, E31B fr/ru
      (edited) and E31B id/it (fresh before, never carried the removed line). E31E id/it stay
      abridged and unstamped.
  - id: D-llms-id-e25b
    text: >-
      The committed llms-id E25B section held an older Bahasa translation with a re-entry amount in
      its totals; it was replaced whole from a fresh regeneration (byte-identical), which is why
      llms-id shows about 550 changed lines for one section.
  - id: D-erp-out-of-scope
    text: >-
      Single-trip ERP fee lines in other articles (multiple-entry-vs-single-entry, emergency-visa,
      exit-reentry) state the government fact and are not Bali Zero prices; untouched and exempt.
  - id: D-pii-override
    text: >-
      The first commit used PII_GATE_ENFORCEMENT=false after confirming the only hit is the
      published NPWP format example 01.234.567.8-901.000, already on main.
dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      Spalla on aaf4d00e8c, VERDICT CONCERNS: reentryViolation has three false negatives (table row
      without the closing pipe, lowercase idr, any line with the unrelated word single) and one
      false positive (Immigration re-entry permit fee).
    status: CONFIRMED
    resolution: >-
      Resolved by b3adb1a424: case-insensitive amounts, open table rows, the ERP exemption scoped
      to the S?ERP acronym, government fee labels exempt; the four cases are fixtures.
  - seat: codex-gpt-5.6-sol
    objection: >-
      DISSENT: the global single exemption could hide an explicit Bali Zero price.
    status: CONFIRMED
    resolution: >-
      Same commit: the global exemption is gone; "- Re-entry permit (single use): IDR 500,000" is a
      guilt fixture.
spend:
  wall_clock_hours: 1
  adversarial_rounds: 1
