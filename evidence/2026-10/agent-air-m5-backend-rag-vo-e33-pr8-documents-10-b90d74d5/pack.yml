decisions:
  - id: D-catalogue-source
    decision: >-
      The seven pages were fetched in this PR (no ledger holds them) and saved with sha256 receipts; the catalogue is
      stamped with fetched_at and content_sha256 and a stale guard fails the test run once any fetched_at is older than
      31536000 s (red on 2027-10-13, by design).
  - id: D-available-only-in-catalogue
    decision: >-
      documentation_for returns AVAILABLE only for catalogue codes; every other product gets the exact old UNKNOWN /
      DOCUMENTATION_CATALOG_NOT_VERIFIED block, so E31B and the rest are unchanged.
  - id: D-e33a-included
    decision: E33A is a pack product because its page lists documents. The post-entry Immigration Guarantee upkeep line is not a document and was removed from E33 and E33E.
  - id: D-secrets-triage-rule
    decision: >-
      A content-keyed rule (42 to 43) in detect_secrets_auto_triage.py lets the pre-commit hook pass the catalogue's
      64-hex sha256 stamps; it is outside the one concern but was needed to commit, and can be split if the gate asks.
  - id: D-receipts-file-name
    decision: >-
      The saved receipts file is named e33-documents.receipts.jsonl so the seq29 ledger discovery (any *-receipts.jsonl) does not
      mistake the directory for the newest ledger.
