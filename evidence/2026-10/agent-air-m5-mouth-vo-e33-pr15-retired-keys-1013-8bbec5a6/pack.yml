decisions:
  - id: D-four-keys
    decision: >-
      Four keys are retired, not the three the audit listed. Emission was derived by walking every reason_code at
      any depth in each signed pack payload: E33G_INCOME_60K_ADVISOR_CHECK and E33E_DEPOSIT_INCOME_BASIS_ADVISOR_CHECK
      were last emitted by signed seq-7 (seq-29 emits E33G_INCOME_BELOW_THRESHOLD), and
      E33B_EXPERTISE_QUALIFICATION_ADVISOR_CHECK and E33F_AGE_UNDER_55_ADVISOR_CHECK are emitted by no signed pack.
      Seq-27, 28 and 29 emit only E33E_AGE_55_59_ADVISOR_CHECK and E33_PROPERTY_QUALIFICATION_ADVISOR_CHECK.
  - id: D-copy-kept
    decision: >-
      The copy stays in SUPPORT_REASON_COPY because signed packs 6 and 7 still replay these codes; no copy text
      changed and nothing was re-pointed at a live rule. The second test makes dropping E33G from the list
      red, which is the proof it is dead.
  - id: D-mutation
    decision: >-
      Mutation check recorded by the build seat: adding the live E33E_AGE_55_59_ADVISOR_CHECK to the retired
      list made both new tests fail (2 failed, 163 passed); the file was restored.
  - id: D-split-retired
    decision: >-
      Review fix 0b39bbe6f1: the retired list is split into REPLAYABLE (E33E_DEPOSIT_INCOME_BASIS, E33G_INCOME_60K,
      emitted by older signed packs, copy kept and asserted) and NEVER_EMITTED (E33B_EXPERTISE_QUALIFICATION,
      E33F_AGE_UNDER_55, emitted by no signed pack ever, copy removed and asserted absent). RETIRED_SUPPORT_REASON_KEYS
      stays as the union. The E33F copy that said discretionary against a live EXCLUDE is gone, so no runtime
      table carries it in either language.
