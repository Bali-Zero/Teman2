what_changed: |
  Provenance, disclosed because it is not a lane of THIS mission: commit
  8b35a7e6a1 is the unpushed Mini healer commit 43f37f4651 (its trailer
  names a Sonnet 5 seat), fetched read-only with format-patch and applied
  with git am; this mission's single build lane judged it, reworded its
  sentence and adopted it. The gate may rule otherwise; if it counts that
  commit as a second build lane, D3 seat-diversity has zero non-Anthropic
  builders and fails.
  4 files, 3 commits on origin/main 370ab29aae (8b35a7e6a1 carried from
  Mini, 74a4af8df6 hard guard, 7284e6730e review fixes).
  - infra/launchagents/wrappers/cron-agent.sh: anti-git sentence appended to
    the agent-tier prompt (commit 1, Mini 43f37f4651 carried via git am),
    reworded to name the checkout; checkout_state() + before/after guard in
    run_agent(), exit 3 on mutation (commit 2); HEAD-reflog check, guard-OFF
    log line, integer check, neutral alert wording (commit 3).
  - scripts/tests/test_cron_agent_no_git_commit_prompt.sh (new, commit 1).
  - scripts/tests/test_cron_agent_checkout_guard.sh (new, commit 2).
  - .github/workflows/immune-enforcement.yml: new step running both corpora
    + both paths in the sentinel list (commit 2).

proof: |
  Deterministic floor 3 (source: path). Red-then-green for both new corpora;
  every pre-existing cron-agent corpus green; trigger-symmetry pin green;
  bash -n and shellcheck (no new warnings). Two cross-family titolare
  reviews (Kimi K3 NO-GO/7, Codex GPT-5.6 NO-GO/3), scrubbed-env dispatch
  (env -i), both on 74a4af8df6; every CONFIRMED finding fixed in
  7284e6730e with its own red-then-green, dispositions below. The final
  HEAD was not re-reviewed by the seats: the gate is commissioned by the
  level above on the final sha.

dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      HIGH: "<branch> <ahead>" misses mutations: commit then push moves
      origin/main with HEAD (both snapshots main 0); amending an already-ahead
      commit leaves the count unchanged; a concurrent fetch can hide a new
      commit behind an old one discovered upstream.
    status: CONFIRMED
    resolution: >-
      Fixed in 7284e6730e: checkout_state() also records HEAD's reflog length
      and any new entry that is not ": Fast-forward" (the sync cron's only
      HEAD move, `git merge --ff-only`, scripts/pro/pro-git-pull.sh L466) is
      a mutation; commit, amend, reset and checkout entries all qualify.
      Guilt cases "commit+push" and "commit+reset away" RED on 74a4af8df6
      (rc 0), GREEN after.
  - seat: codex-gpt-5.6-sol
    objection: >-
      HIGH: the test inherits GIT_DIR/GIT_WORK_TREE (e.g. from a git hook),
      which override `git -C <sandbox>`; fresh_checkout could commit into and
      rewrite refs of the real checkout.
    status: CONFIRMED
    resolution: >-
      Fixed in 7284e6730e: the test unsets GIT_DIR, GIT_WORK_TREE,
      GIT_INDEX_FILE, GIT_OBJECT_DIRECTORY, GIT_COMMON_DIR,
      GIT_ALTERNATE_OBJECT_DIRECTORIES, GIT_NAMESPACE, GIT_PREFIX. Measured
      with GIT_DIR pointing at a decoy repo: unhardened copy took the decoy
      from 1 to 12 commits; hardened test left it at 1.
  - seat: codex-gpt-5.6-sol
    objection: >-
      MED: concurrent human activity during the run is attributed to the
      agent; the snapshots establish a change, not its author.
    status: CONFIRMED
    resolution: >-
      Alert/log wording changed to "H24 checkout mutated during the agent
      run". The exit 3 stays by design: the H24 checkout is read-only for
      every actor except the ff-only sync cron (Agent Worktree Discipline),
      so any other HEAD move in the window is the disease being guarded,
      whoever made it, and must page.
  - seat: kimi-code/k3
    objection: >-
      HIGH x2: commit+push and net-zero mutations (commit+reset, update-ref,
      amend, tag, stash) leave the 2-tuple identical.
    status: CONFIRMED
    resolution: >-
      Same reflog fix as Codex #1 covers commit+push, commit+reset, amend and
      update-ref of HEAD (reflog entry). Tag and stash do not move HEAD and do
      not diverge the checkout from origin/main, which is the failure that
      jammed the sync; out of this guard's scope by design.
  - seat: kimi-code/k3
    objection: >-
      MED: concurrent actors produce a false GIT-MUTATION blaming the agent.
    status: CONFIRMED
    resolution: "Same disposition as the third Codex finding: wording fixed, exit 3 kept by design."
  - seat: kimi-code/k3
    objection: >-
      MED: guard silently inert when the before-snapshot is empty (missing
      checkout, missing origin/main, wrong HOME).
    status: CONFIRMED
    resolution: >-
      Fixed in 7284e6730e: logs "checkout guard OFF for this run: <dir> has no
      measurable HEAD vs origin/main"; pinned by the no-checkout innocence case
      (RED on 74a4af8df6, GREEN after).
  - seat: kimi-code/k3
    objection: >-
      MED: early return/exit paths between the two snapshots would skip the
      verdict.
    status: RETRACTED
    resolution: >-
      Measured: between `checkout_before=` and the verdict block run_agent()
      has no return or exit, only `continue`/`break` inside the seat loop
      (awk over the range: the only matches are comments). An external
      SIGKILL of the wrapper cannot be guarded from inside it.
  - seat: kimi-code/k3
    objection: >-
      LOW: fake claude joins argv with $*; `${override:+...}` unquoted;
      arithmetic on a possibly non-integer count.
    status: PLAUSIBLE
    resolution: >-
      The override expansion was already quoted at review head
      (`${override:+"CRON_AGENT_CHECKOUT_DIR=$override"}`); the $* fake is the
      soft test's argv-content probe, where joining is the intent. Integer
      check `[[ "$ahead" =~ ^[0-9]+$ ]]` added in 7284e6730e.

