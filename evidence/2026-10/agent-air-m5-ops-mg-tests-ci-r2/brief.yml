task: >-
  No GitHub workflow runs apps/mata-garuda/tests/ (about 1150 tests), so a defect in the Mata Garuda cells, its feeders or
  its Mini-hosted KG query API reaches main with no test executed (W108). Add one per-PR workflow that installs the app,
  its undeclared internal dependency packages/cell-core and the test-time deps, and runs the suite with no
  continue-on-error.
lane: ops
machine: m5
date: 2026-10-09
gear: 3
gear_reason: >-
  Measured floor 3, source the .github/workflows/ hot zone (one new workflow file). Gear 3 carries a pack and a sealed
  council.
acceptance:
  A1:
    text: >-
      mata-garuda-tests runs on every PR and main push touching apps/mata-garuda, packages/cell-core, or a repo file the
      suite measurably reads (an audit hook on open events plus a code read for exists-only checks): scripts/pytest_guards,
      scripts/_redact_pii.py, scripts/lib/yaml_strict.py, scripts/lib/codex_seat.py, scripts/mata_garuda_invalidation_sweep.py,
      agent-library/config/redaction-rules.yaml, infra/launchagents/com.matagaruda.*, infra/launchagents/host-pins.json,
      docs/mata-garuda, or the workflow; with no continue-on-error, and it goes red on a failing test.
    probe: this PR's own mata-garuda-tests job log (test counts) and the workflow text.
  A2:
    text: >-
      The install is the minimal set the suite imports: cell-core editable, the app's dev extra, httpx, tenacity, numpy,
      scikit-learn and pyyaml; torch and transformers are not installed (lazily imported and mocked by the tests).
    probe: a scratch py3.11 venv with exactly that install runs the suite with 0 collection errors.
  A3:
    text: >-
      No skip, xfail or deselect hides a failure. The five network tests of tests/test_sprint4.py (TestCurlFetch,
      TestCheckSource, TestScrapeRegulations: real DNS and HTTP to government sites, two of them passing even with curl
      missing) join the suite's own live convention and run only with MATA_GARUDA_LIVE_ENDPOINTS=1, like
      tests/integration/test_feeder_endpoints_live_*. Every other skip is the suite's own (live endpoints, Redis).
    probe: the job log's skip count is the base count plus five.
  A4:
    text: >-
      No test reaches the real nlm CLI: test_idempotent_re_run's fixture stubs nlm_get_title, which three tests left live,
      so a host with nlm installed made 27 real `nlm notebook get uuid-NN --json` calls with fake ids per run of the module (measured).
    probe: the module and the whole suite under a PATH whose nlm appends to a scratch file leave that file empty.
  A5:
    text: >-
      The cron-wrapper tests exec /bin/zsh: the job installs zsh and asserts /bin/zsh before the suite runs.
    probe: this PR's job log.
