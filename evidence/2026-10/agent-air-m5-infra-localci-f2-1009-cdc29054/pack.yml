task_id: localci-f2-1009
mission: LOCALCI-SOVEREIGN (phase F, step F2)
colour: BLUE
gear: 2
gear_reason: >-
  The first code path in the merger that can write a ref and push to GitHub, though disarmed by construction (independent
  conditions, none true on Pro today). Fix round: the launchd wrapper now fetches into its own ref (a wrapper change, installed on Pro in
  ~/.nuzantara-cron/ and to be re-installed after merge by the lead); no hot-zone path, workflow or plist change; the lint floor is 2.
l_level: L2
gate_class: opus
objective: >-
  Phase F replaces GitHub as the executor of the merge. F2 builds that executor DISARMED: it merges and pushes only when
  LOCALCI_MERGER_PHASE_F=1, phase D READY (recomputed in the tick by the report's own function), a 0600 deploy key owned by the
  running user, the C3a-2 criterion, a clean current base with the PR head re-read, and no sticky halt file all hold at the
  moment of merging; each failing one is named on the would_merge line. The push is a plain fast-forward; a refusal halts for good.
  The fetch never rewinds a main phase F pushed.
constraints:
  - No code path merges or pushes when READY is false; the thresholds exist once (report() is the tick's and the report's function).
  - The key is never read, printed or journalled; it reaches only the push subprocess, as GIT_SSH_COMMAND.
  - No force of any kind; GitHub's merge queue and labels are untouched.
acceptance:
  - text: With every condition true the mirror gets a merge commit (first parent the old base, second the head, subject ending (#N)), origin's main and refs/merger/base equal it, and merged + pushed are journalled.
    probe: "test_merger_phase_f.py::test_every_condition_true_makes_the_merge_commit_pushes_it_and_moves_the_mirror"
  - text: Each arming condition false alone (env, READY, key mode/owner/type/missing, criterion, base moved, head moved, halt file) SHALL merge and push nothing and be named in phase_f.why.
    probe: "test_merger_phase_f.py::test_one_false_condition_alone_means_no_merge_no_push_and_the_line_names_it"
  - text: A refused push SHALL journal push_refused, write the sticky halt, leave refs/merger/base alone, and the next tick SHALL merge nothing.
    probe: "test_merger_phase_f.py::test_a_push_origin_rejects_is_push_refused_halts_for_good_and_the_mirror_keeps_its_main"
  - text: The key content SHALL appear in no journal line, stdout, stderr or runner env.
    probe: "test_merger_phase_f.py::test_the_key_never_reaches_the_journal_the_output_the_halt_file_or_anything_the_runner_sees"
  - text: A GitHub main that is not a descendant of the last pushed merge SHALL be storage_diverged and halt, not be taken.
    probe: "test_merger_phase_f.py::test_a_github_main_that_lost_the_last_pushed_merge_is_storage_diverged_and_halts_instead_of_being_taken"
consumer_map:
  - scripts/localci/merger.py tick (the launchd tick com.balizero.localci-merger on Pro) — the phase_f field of every would_merge line in decisions.jsonl.
pii_scan: clean
pii_scan_note: Merger code, tests on temporary git repos with a sentinel string standing in for a key, mutant rules and documentation. No client data was read or written.
lanes:
  - lane: localci-f2-1009
    role: build
    seat: claude-opus-5-5 (Dux implementer on M5)
what_changed: |
  scripts/localci/merger.py: report() factored out of cmd_report (emit=False returns (rc, out) with no file and no line — the tick's READY
  reads out["phase_e_ready"] from it, so the thresholds exist once); phase_f_arming (every condition, named in why), key_problem (lstat
  only), phase_f_merge (commit-tree, merged, plain push with GIT_SSH_COMMAND in that one subprocess, push_refused + sticky halt, pushed),
  fetch_base (storage_diverged guard), push_url_of; merge_shadow_step journals phase_f on the would_merge line; PR_QUERY gains title.
  test_merger_phase_f.py: 46 tests on real git repos with a bare origin. merger_mutants.py: 35 f2-* rules, two f1 rules re-anchored.
  README phase F executor section; spec status line and arming checklist.
  Fix round (the gate's findings M1-M3, L1-L7): localci_merger_tick.sh fetches into refs/merger/wrapper and reads its code and sha from
  it (refs/merger/base is fetch_base's alone; a pre-F2 mirror falls back to base read-only). phase_f_arming evaluates the local
  conditions first and READY (precheck then report) only when LOCALCI_MERGER_PHASE_F=1 and all of them hold, else "READY not
  evaluated"; the precheck window gets READY_SPAN_SLACK_DAYS = 1; the enqueue step must be would_enqueue; the PR re-read also requires
  not in queue, not draft, base == the tick's base, ARM_LABEL present; judged_tree: F1's merge tree must equal the judged candidate's;
  push_ssh_command adds -F /dev/null, IdentityAgent=none, a pinned UserKnownHostsFile and StrictHostKeyChecking=yes; halt before the
  push_refused journal, and a Stopped or other interrupted push halts before it propagates; halt_reason catches ValueError and the
  report uses lexists; --push-url refuses any userinfo on a non-ssh scheme. README/spec: ARMED unset in phase F, known_hosts pinning,
  phase_e_flip.py lands in its own PR, the key path (never content) can appear in a refused push's error.
proof: |
  Tests and mutants on M5 against temporary repos; nothing ran on Pro and nothing was pushed. Not armed anywhere.
