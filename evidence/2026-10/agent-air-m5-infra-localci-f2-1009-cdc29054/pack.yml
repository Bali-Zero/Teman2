dissent: []
residuals:
  - "The armed path is proven on fakes only; its live proof is owed to the day READY holds."
  - "READY precheck avoids the full report until day 14 (journal alone, no GitHub read, only ever short-circuits to false); the report's cost after day 14 is ~4 min per tick on Pro, measured 2026-10-09 by the lead."
  - "A push_refused can be a plain race (a commit reaching GitHub's main between ls-remote and the push); it halts by the brief's rule until an operator clears it."
  - "The mirror's push URL defaults to git@github.com:<repo>.git on the default fetch URL."
  - "The wrapper changed in the fix round: the live copy in ~/.nuzantara-cron/ on Pro must be re-installed after merge (the lead does it); until then Pro's wrapper still force-fetches refs/merger/base, harmless while nothing has pushed."
  - "known_hosts must be pinned by the operator before the first armed push; without it the strict ssh refuses and the push halts."
  - "GitHub may close the PR as merged with a merge_commit_sha that is not our merge commit, so B11 would journal that replay unmapped."
