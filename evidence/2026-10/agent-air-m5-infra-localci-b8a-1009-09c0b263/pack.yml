brief_ref: evidence/brief.yml
plan_ref: >-
  Lead's mandate B8a, 2026-10-09 (budget 25 minutes), from origin/main ed5a1b9cb6 (B8 merged). Measured on Pro by the lead
  at 02:49:24Z: B8's first live prune was right (the floor removed localci-deps:1b7ca87ccc31311e, VM 10.1 -> 16.1 GB, met)
  but journalled "4 plan(s) of the last 48 h name it, built -5.3 h ago"; `docker image inspect --format {{.Created}}` on
  Pro prints `2026-10-08T20:00:21.883530525+08:00`, and prune.py:_ts (since B6 a43431d355) dropped the offset.
lanes:
  - lane: localci-b8a-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux B8a of LOCALCI-SOVEREIGN, M5; Pro not touched)"
pii_scan: clean
pii_scan_note: The merger's prune parser, its tests and mutants, and one README sentence; no client data was read or written.
what_changed: |
  scripts/localci/prune.py: _ts full-matches RFC 3339 (date-time, optional fraction, optional trailing Z or ±HH:MM / ±HHMM)
  and returns the UTC instant (the offset subtracted); no offset reads as UTC as before; a bad offset (hour > 23, minute >
  59), trailing text or an impossible date is None, which the prune already treats as undated; nanoseconds kept. Tests: the
  +08:00, -05:30, +0800 and no-offset equivalences, seven malformed strings, nanosecond ordering, a UTC and a local-time
  image ordered by instant, and a floor removal of +08:00 images journalling "built 20.0 h ago" and "built 1.0 h ago".
  Mutants: b8a-offset-ignored, b8a-offset-sign-flipped, b8a-offset-minutes-dropped, b8a-bad-offset-accepted,
  b8a-trailing-text-accepted added; b6-nanoseconds-dropped re-aimed at the new line. README: the sentence on how Created is
  read names the offset. localci_merger_tick.sh unchanged.
proof: |
  See receipts. The floor line is produced by the committed code on the fixture (fake docker, images dated like Pro's).
bites:
  consumer: The shadow merger's launchd tick on Pro (decisions.jsonl).
  observation: >-
    Owed after merge (this lane does not ship): the first prune line after the mirror fetches the merge whose floor removes
    an image journals "built H h ago" with H >= 0 and equal to now minus the image's Created read with its +08:00.
