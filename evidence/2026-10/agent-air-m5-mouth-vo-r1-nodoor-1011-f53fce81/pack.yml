    cmd: cd apps/mouth && npx vitest run 'src/app/(visa-oracle)/visa-oracle/'
    result: "Test Files 50 passed (50), Tests 1328 passed (1328)"
    exit: 0
    ts: "2026-10-11T01:12:00Z"
    seat: this session
  - claim: The observer passes on the branch head.
    cmd: python3 scripts/ci/observe_visa_oracle_no_door_copy.py
    result: "Tests 8 passed (8); no-door copy holds"
    exit: 0
    ts: "2026-10-11T01:18:42Z"
    seat: this session
  - claim: apps/mouth typechecks.
    cmd: cd apps/mouth && npx tsc --noEmit -p .
    result: "no output"
    exit: 0
    ts: "2026-10-11T01:12:00Z"
    seat: this session
decisions:
  - id: D-override-not-state
    decision: >-
      NO_SUPPORTED_PATH_NO_DOOR is a copy override selected from the outcome (state plus empty
      alternatives), exactly like SECOND_HOME_STUDIO; the engine state and the one-door copy are unchanged.
  - id: D-steps-shared
    decision: >-
      The no-door list reuses the generic list's advisor and keep-summary step objects, so the wording of
