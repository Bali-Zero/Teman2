  observation: >-
    Owed after merge (this lane does not ship): the first tick after the mirror fetches the merge whose prune removes no image
    journals a {"kind":"prune"} line with `removed: []`, an `fstrim` object with rc 0 and a `trimmed` tail, and
    host_free_gb.after_fstrim above host_free_gb.after by the GiB the tick's own run left allocated.
