brief_ref: evidence/brief.yml
plan_ref: >-
  Lead's mandate B7, 2026-10-08 (budget 45 minutes, ≤ ~80 net lines), from origin/main eb880bef07 (B6 merged at a43431d355).
  Measured on Pro by the lead: prune #1 at 14:46Z removed 2 images and fstrim returned 15 GB (89.8 -> 104.9); prune #2 at
  15:11Z removed nothing, so no fstrim, host 80.2; df 73 GiB at 15:15Z with the datadisk at 52.9 GiB; `colima ssh -- sudo
  fstrim -av` by hand at 15:16Z with no image removal returned 11.4 GiB in 2 s (host 73 -> 81 GiB, datadisk 52.9 -> 44.8).
lanes:
  - lane: localci-b7-build
    role: build
    seat: "claude-opus-5-5 (BLUE Dux B7 of LOCALCI-SOVEREIGN, M5; Pro not touched)"
pii_scan: clean
pii_scan_note: The merger's prune code, its tests, a spec line and a README row; no client data was read or written.
what_changed: |
  scripts/localci/prune.py: `if fstrim and removed and not dry` becomes `if fstrim and not dry` — every real prune ends with
  the trim, so the line always carries fstrim and host_free_gb.after_fstrim; a lease-skipped prune returns in cmd_prune before
  prune() runs. Spec item 3 of the B6 paragraph rewritten with the lead's text (and the date of the change); README row.
  Tests: the zero-removal guilt, the dry-run and lease-skip innocence. Mutants: b6-fstrim-without-removal retired;
  b7-fstrim-only-after-removal and b7-fstrim-on-dry-run added. localci_merger_tick.sh unchanged.
proof: |
  See receipts. The zero-removal line is produced by the committed code on the fixture (fake docker and colima).
bites:
