  Visa-night family "study", plan E30-X01 (findings F03, F19, F30, F50, F62, F68, F81): no test pinned the E30A/E30B
  price or the unpriced state of E30, E30E and E30F against the real catalogue on the active pack, so an edit of a
  row amount passed CI, and the unreachable 2-year and 4-year rows had no tripwire. Test-only; no owner decision, no
  pack change.
