    objection: "MEDIUM 1 (test_e30_family_pricing.py:213): the catalogue pin checks only the digits of the price string, not the currency, so '11.500.000 USD' would pass and valid 'IDR 11.500.000' would fail; the 2- and 4-year rows have no other real-parser test."
