decisions:
  - id: D-strict-xfail
    decision: >-
      The 730-day (E30A, E30B) and 1460-day (E30B) rows assert the catalogue's 2-year (11,500,000) and 4-year
      (15,000,000) prices as a strict xfail with reason SEQ29-E30-02, instead of pinning today's under-quote, so the
      defect is documented without freezing it and the seq-29 pack that adds duration_options is forced to remove
      the mark.
  - id: D-one-year-only
    decision: >-
      Stays at or below 365 days (and an unstated stay) are pinned to the 1-year row for E30A and E30B, because
      that is the correct row for them under any future option set.
