    disposition: "Cured (cure commit on this branch, finding real). The row pin now calls the production _parse_exact_idr_amount on the price string, and every family row, including the 2- and 4-year ones no pack key reaches, is also resolved through the real PricingService (a product re-aimed at the row) to AVAILABLE / IDR / the typed amount. New twins: '9.000.000 USD', '9.000.000' and 'Rp 9.000.000' are not a quote; 'IDR 9.000.000' and '9.000.000 IDR' both parse to the pinned amount. Mutation: E30B (4 Years) price written as '15.000.000 USD' now turns 3 tests red (the old digit-only pin stayed green)."
