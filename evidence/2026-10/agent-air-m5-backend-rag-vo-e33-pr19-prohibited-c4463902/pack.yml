decisions:
  - id: D-additive-always-present
    decision: >-
      prohibited_activities is always emitted (empty list when the product has none) and is an optional
      array in the contract and schema.d.ts, so existing clients and the mouth parser ignore it safely.
  - id: D-schema-d-ts-by-hand
    decision: >-
      schema.d.ts was edited by hand in generator key order (after product_version_id) because no npm
      install or generator may run in a worktree; the freshness check compares the generated shape.
