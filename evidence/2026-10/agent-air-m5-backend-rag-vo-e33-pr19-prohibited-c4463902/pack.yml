      backend-rag-vo-e33-pr19-prohibited-1013 on M5; rollout model verified as gpt-5.6-sol.
  - lane: e33-pr19-evidence
    role: review
    seat: Claude Sonnet 5.5 subagent, same worktree (rebase, whole-tree runs, observer, this pack); not a gate.
