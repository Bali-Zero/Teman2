ruling: >-
  Zero, 2026-10-11 (E33/retirement audit plan, PR-19) - the signed pack already states each product's
  prohibited activities but /evaluate does not carry them, so the public result cannot say what the permit
  does not allow; PR-20 renders it.
mission: >-
  The Visa Oracle result can say what each permit does not allow, starting with the signed prohibited
  activities of E33 carried on the /evaluate display block.
