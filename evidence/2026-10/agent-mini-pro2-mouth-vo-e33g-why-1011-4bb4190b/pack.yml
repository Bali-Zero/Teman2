gear: 1
brief_ref: evidence/brief.yml
ruling: >-
  Zero, 2026-10-11 (decisions on the E33 program and the retirement program) - the E33G income question ships
  before seq-28 activates; its why-copy must not promise an effect the engine does not yet have, and must not
  anchor the visitor on a figure. Follow-up promised on PR 8280 (D-why-window).
mission: >-
  The E33G income question tells the visitor only what is true both before and after seq-28 activates, and names no figure.
lanes:
  - lane: e33g-why-copy
    role: build
    seat: Claude Sonnet 5 implementer (subagent), commit e9f248b296 on Mini, worktree mouth-vo-e33g-why-1011.
  - lane: e33g-ground-truth
    role: ground_truth
    seat: >-
      The visa-oracle i18n copy file is the surface that states the E33G rule to the visitor; the change asserts
      no rule of its own and names no figure, it only states that a yearly income requirement exists and that the
      amount is used as entered.
    nb: "apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/i18n.ts"
    query_hash: "ce852aea8317bf93697a26f9c51930fd2d44dfa70a5724a0b4ae204e395a1d47" # pragma: allowlist secret
    note: query_hash = sha256 of i18n.ts at origin/main (before the change).
pii_scan: clean
