    the Why we ask text of the yearly-income question on the public Visa Oracle Remote worker path (i18n.ts, EN and ID).
  where: ci
  observe: python3 scripts/ci/observe_visa_oracle_remote_income_question.py
  expect: "contains:remote income question holds"
