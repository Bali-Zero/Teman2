decisions:
  - id: D-true-both-states
    decision: >-
      The why-copy says a yearly income requirement exists and that the amount is used exactly as entered; it
      does not say the amount decides whether the visa fits, which is untrue until seq-28.
  - id: D-no-figure
    decision: >-
      No threshold figure appears in either language (anti-anchoring); the guard regex now also catches 60000,
      60,000, 60.000, 60 000, 60k, sixty and enam puluh, with guilt and innocence cases.
