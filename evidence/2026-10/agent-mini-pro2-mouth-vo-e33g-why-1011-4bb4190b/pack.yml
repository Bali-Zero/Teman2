    role: ground_truth
    seat: >-
      The Visa Oracle live-state log records the ruling and the seq-27/seq-28 plan for the E33G income gate (the
      question ships before the engine acts on it); the copy asserts no rule or figure of its own. The pre-change
      i18n.ts is deliberately NOT the source (red team finding 1: circular).
