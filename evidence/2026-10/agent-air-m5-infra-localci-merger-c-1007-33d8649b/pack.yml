dissent:
  - seat: codex-gpt-6.1-sol
    objection: "BLOCKER: hooks, signer and rerere were off but host git config was not — a filter or merge driver configured globally runs on candidate paths outside any container (reproduced with a configured filter via git hash-object)."
    status: CONFIRMED
    resolution: "Every merger git call and the runner it starts run with GIT_CONFIG_GLOBAL=/dev/null and GIT_CONFIG_NOSYSTEM=1; a guilt test plants a filter and a merge driver in a global config and a candidate .gitattributes naming them, and asserts the marker never appears."
  - seat: codex-gpt-6.1-sol
    objection: "A short os.write is acknowledged; a torn tail with no newline swallows the next full decision (reproduced: zero decisions recovered)."
    status: CONFIRMED
    resolution: "The journal writes until done and fsyncs; a tail without a newline gets one first, so a torn line stays its own unreadable line. Test with a planted torn tail."
  - seat: codex-gpt-6.1-sol
    objection: "A failure after the gate (hosted_summary raising OSError) loses the decision and re-runs the gate at the same key."
    status: CONFIRMED
    resolution: "The hosted comparison catches every exception and records it beside the gate's verdict. A crash between the gate and the journal still re-runs that key — stated, not cured (no reservation record)."
  - seat: codex-gpt-6.1-sol
    objection: "head_in_base is journalled as skipped, triage only treats decisions as terminal: one PR starves the queue. (Also raised by agy-gemini-3.1-pro.)"
    status: CONFIRMED
    resolution: "head_in_base is terminal for its key; test asserts one line over two ticks."
  - seat: codex-gpt-6.1-sol
    objection: "A status is adopted without a seal, after `status` failed, or bound to another candidate (reproduced: PASS with candidate WRONG, status_rc 1, seal None)."
    status: CONFIRMED
    resolution: "Adopted only when `run` printed a seal, `status --seal` exited 0 and status.json carries this candidate, base and seal; otherwise ERROR with no per-context verdict. Four parametrised guilt cases."
  - seat: codex-gpt-6.1-sol
    objection: "Lease and journal are not scoped to the repository: two state dirs hold two locks; a journal reused for another repo answers with that repo's keys."
    status: PARTIAL
    resolution: "A state dir is now bound to one repo (`repo` file; a mismatch exits 2) and decision lines carry `repo`. Two state dirs for the same repo on one host remain two locks — one plist, one state dir is the operator contract; the cross-dir and cross-host fence is the Postgres lease of spec §3."
  - seat: codex-gpt-6.1-sol
    objection: "Replacing lease.lock in the acquisition window lets two holders proceed."
    status: PARTIAL
    resolution: "After flock the locked inode is compared with the path's; a replaced file is refused. A replacement after that check by the same OS user stays possible: the flock is single-host mutual exclusion, not a fence (same statement as the runner's lock section)."
  - seat: codex-gpt-6.1-sol
    objection: "Unsanitised git/gh stderr reaches the journal and the output; truncation does not redact a token."
    status: CONFIRMED
    resolution: "Every error is passed through redact() (GitHub token shapes, URL userinfo, bearer/token words) before it is journalled or printed; a --remote-url with credentials is refused. Test on a planted string."
  - seat: codex-gpt-6.1-sol
    objection: "A relative --state-dir builds worktrees under repo.git/ and hands relative paths to a runner running in another cwd."
    status: CONFIRMED
    resolution: "The state dir is resolved to absolute first. Test with chdir and a relative path."
  - seat: codex-gpt-6.1-sol
    objection: "Mutants survive: pid_alive always true, GIT_SAFE removed, run/status failures ignored, journal permissions."
    status: CONFIRMED
    resolution: "Recycled-pid, host-config, status-failure and 0600 tests added; the 28-mutant sweep kills all."
  - seat: agy-gemini-3.1-pro
    objection: "BLOCKER: a candidate can echo a fake `seal=` on stdout and force a PASS."
    status: REJECTED
    resolution: "status --seal can only downgrade (a mismatch is BLOCKED; a match is the real seal), and the first seal line is printed before any candidate code runs. Hardened anyway: the first seal is used and status.json must carry it; a test forges a later seal line and asserts the first one is passed on."
  - seat: agy-gemini-3.1-pro
    objection: "Unrelated histories fail the merge with no conflicted path, raise, and loop forever."
    status: CONFIRMED
    resolution: "A failure after a PR is picked is an ERROR decision for that key, retried only at the next base. Test with an orphan history."
  - seat: agy-gemini-3.1-pro
    objection: "The merger always builds a two-parent merge; the queue may squash."
    status: CONFIRMED
    resolution: "Measured: the live queue's merge_method is SQUASH. The candidate is now one squash commit on origin/main (deviation from the mandate's literal --no-ff, toward its intent: 'exactly as the queue does'). Stacking of up to 5 queue entries is not reproduced — stated."
  - seat: agy-gemini-3.1-pro
    objection: "A lease naming another host can never be reclaimed: failover deadlocks."
    status: PARTIAL
    resolution: "By design (superscar #10): the merger never reclaims another host's lease; the README now says removing it is an operator act. The state dir is host-local today."
  - seat: agy-gemini-3.1-pro
    objection: "A credential in --remote-url lands in repo.git/config, which the candidate container can read."
    status: PARTIAL
    resolution: "Premise false: the runner streams the tree from the object store, no bind mount, the container never sees repo.git. Hardened anyway: a --remote-url carrying userinfo is refused."
  - seat: agy-gemini-3.1-pro
    objection: "A transient runner crash becomes a permanent ERROR decision."
    status: PARTIAL
    resolution: "Kept as a decision on purpose — a retry-forever key lets one PR hold the queue; the key changes with every merge to main, so the PR is re-decided at the next base. ERROR reads as blind, never as a verdict; MergerError's docstring now says so."
owed:
  - "PR-C2: `merger.py report` (phase D's instrument: decisions joined with GitHub's outcome per head — AGREE / FALSE_GREEN / FALSE_RED / BLIND / PENDING, plus per-context hosted_compare totals) and a launchd plist (StartInterval, no KeepAlive) installed on Pro with its own prove-live. Until C2 ships, ticks run only by hand."
  - "The runner plans review.independent and leaves it QUEUED, so overall is never PASS in shadow: the PR-level FALSE_GREEN count stays vacuous until the merger imports a review; the per-context comparison is the live instrument."
  - "Runner v0.3.1 on main executes no required context: every decision so far is local_blind 14/14. Phase A (sibling lane) changes that without any change here."
  - "A kill -9 of a tick leaves its runner child running to the runner's own deadline (stated in the README)."
  - "Second host (Mini) needs the Postgres lease of spec §3 before it may tick."
