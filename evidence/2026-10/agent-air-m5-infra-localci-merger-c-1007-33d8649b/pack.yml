  Mandate LOCALCI-SOVEREIGN phase C (the merger, SHADOW only), handed by the team lead of the 2026-10-07 mission to
  this BLUE Dux; plan docs/specs/localci-sovereign-2026-10-07.md §2 (phase C), ruling docs/rules/RULINGS.md RULED
