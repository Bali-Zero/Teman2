  2026-10-07T07:43:32Z on M5): kimi QUOTA_DEAD (membership quota), tp1-qwen3.8-max and tp1-glm-5.2 QUOTA_DEAD (HTTP 429,
  monthly plan quota, reset 2026-10-11T16:00Z). agy and codex were LIVE.
pii_scan: clean
pii_scan_note: >-
  Code, tests and GitHub metadata only (PR numbers, shas, check names). The journal carries no PR title, author or body;
  no client data was read or written.
what_changed: |
  scripts/localci/merger.py (new): the shadow merger. `tick --node H` pins the host, takes an flock + lease.json lease
  (dead holder reclaimed and journalled, live or foreign holder respected), lists open same-repo PRs that are armed or
  labelled localci:merge with GETs through hosted_compare.gh_get (forks journalled `refused: fork`, never fetched),
  picks one not decided at (head, origin/main), builds the candidate in its own bare clone as origin/main plus the head
  squashed into one commit (the live queue's merge_method is SQUASH), runs plan → run → status --seal of the BASE runner
  with the BASE contexts matrix and an allowlisted, config-isolated environment, adopts the status only when it is bound
  to this candidate, base and seal, compares with the hosted verdict of the PR head, and journals one line per decision.
  `merge` refuses with exit 2; `--selftest` runs triage and lease guilt/innocence offline.
  scripts/localci/tests/test_merger.py (new): 33 cases on real temporary git repos with a local origin, GitHub and the
  runner faked.
  scripts/localci/README.md: section "Merger (phase C, shadow)" — tick steps, failure semantics, state-dir layout,
  journal schema, limits.
proof: |
  See receipts. Nothing in this change merges, posts, labels, comments or touches branch protection: the merger's only
  GitHub API calls are GETs through hosted_compare.gh_get (a test fails any `gh` subprocess that bypasses it) and its
  only other traffic is `git fetch`. runner.py, contexts_matrix.yaml and hosted_compare.py are untouched.
