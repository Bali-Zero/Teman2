objective: >-
  REWORK of PR-2 (spec_T3_split_v2.md) after the fresh-Opus gate's REWORK-DESIGN verdict on
  3adc6c0e89 — builds the spec addendum (A1-A8) verbatim, which overrides
  spec_T3_split_v2.md's PR-2 section where they differ.
  A1 (the HIGH): removes the persisted id watermark entirely — it permanently missed a row that
  commits out of id order, or whose body/message_text is filled in LATER than its own commit
  (apps/wa-mirror/bridge/message_capture.ts upserts on baileys_message_id, same id). Every tick
  now reads `hi = max(id)` of the eligible window ONCE at tick start and rescans the FULL 30-day
  window from 0 to that `hi`, so a late/out-of-order row is inside SOME future tick's range by
  construction, and `hi` fixed at tick start still makes the tick terminate against a
  live-growing table.
  A2: a message whose body CHANGES after its first scan now revises its `unjudged` candidate row
  in place (`ON CONFLICT ... DO UPDATE`, guarded to unjudged rows whose clause_hash actually
  changed — a judged/quarantined row is never rewritten), counting inserted vs revised
  separately via `RETURNING (xmax = 0) AS inserted`.
  A3: adds whole-word `and|dan|serta|e` to the clause splitter (case-insensitive, never splitting
  inside `candidate`/`Android`/`che`/`sede`), landed before the scanner's first activation.
  A4: the digest line is now `promises: candidates today N (revised R), unjudged U`, computed
  fresh from Postgres at send time (a new `revised_at` column on `team_promise_candidates`,
  alongside `created_at`, both filtered `>= local midnight Asia/Makassar`) instead of carried
  over from a single tick's own counters, and its `tg_notify` dedup key is now
  `wa-team-promises:<YYYY-MM-DD>` instead of a constant key whose mute window grows from 6h to
  168h.
  A5: count, metrics write and digest enqueue all now happen BEFORE the scan lock is released.
  A6: the digest gateway's failure path routes through `_fail_line` instead of printing
  `str(exc)` directly.
  A7: the fake-SQL batch/cursor/insert tests are replaced by a new opt-in real-Postgres file
  (`test_wa_team_promises_scan_real_pg.py`, same `WA_TEAM_PROMISES_REAL_PG=1` gate and
  throwaway-cluster pattern as PR #7366) covering out-of-order commit, late body fill, revision
  (unjudged updated, judged untouched), two-tick idempotency, mid-batch rollback + next-tick
  recovery, and lock-held-through-digest; the poisoned-exception-text test needs no DB and stays
  in the unit file.
  A8: drops the unrelated `scripts/ci/change_map.py` regen from this PR (pre-existing drift, its
  own PR if still needed — confirmed advisory-only via `scripts/quickcheck.sh`) and recomputes
  this brief's size/floor against the reworked diff: floor stays 2 (measured `+1149/-65` across 6
  files via `scripts/evidence_pack_lint.py --print-floor`, below `SIZE_GEAR3_THRESHOLD`, no
  hot-zone path). Fresh Pro dry-run of THIS head (4baedd6866), READ-ONLY, from a `git archive`
  scratch copy in `/tmp` (never the live checkout, removed after):
  `~/nuzantara/apps/backend-rag/.venv/bin/python scripts/wa_team_promises.py --scan --dry-run` ->
  `wa_team_promises: scan OK scanned=10162 clauses=359 candidates_new=359 candidates_revised=0`.
  Confirmed after: `select count(*) from team_promise_candidates` on Pro stayed **0**, and
  `~/.cell-bridge-state/` gained no `wa_team_promises_scan_*` file — `--dry-run` wrote nothing,
  same contract as the original PR-2 head.
