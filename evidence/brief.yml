objective: >-
  Ledger row `kbli-explorer-copy-line-shares-a-dead-code-as-a-live-listing`
  (PENDING-ARMS, opened 2026-09-19 by the post-#6847 sweep). The explorer's
  copy-to-clipboard string is built from `kbliApi.inspect(code)` — the very
  endpoint `_tombstone_result` tombstones — and it is the one artifact on this
  surface designed to travel OUT of it, into an email or a chat where none of
  the surrounding disclosure travels along. MEASURED, not deduced: the
  production inspect payload for 74100 (read 2026-09-20) carries
  `licensing_status: NOT_IN_KBLI_2025`, `title: "KBLI 74100 [KBLI 2020 — tidak
  ada dalam KBLI 2025]"`, `risk_profile: "Not applicable — code absent from
  KBLI 2025"`, `pma_status: NOT_VERIFIED`, `licenses: []`; run through the
  pre-cure expression it produces `KBLI 74100 — KBLI 74100 [KBLI 2020 — tidak
  ada dalam KBLI 2025] | PMA: PMA Not Verified | Risk: Not applicable — code
  absent from KBLI 2025 | Licenses: Not listed in our data | Sector: N/A`.
  ONE CORRECTION TO THE ROW: it says the line "asserts a PMA verdict and a risk
  tier beside it". It does not — both segments decline, which is why this is
  ledgered as a comprehension defect and not a false statement. What IS wrong:
  the code is printed twice, the tombstone suffix lands mid-sentence in
  Indonesian, and "Not listed in our data" reads as a gap in OUR records rather
  than as a code that cannot be registered at all. Four segments that each
  decline to answer are a worse artifact to paste into a client's inbox than
  one sentence that says the code is retired.
scope:
  - >-
    `apps/mouth/src/lib/kbli-licence-summary.ts` — exports
    `STATUS_RETIRED_KBLI_2020` ("NOT_IN_KBLI_2025") beside the two status
    tokens this module already owns, so the verdict is read as an ENTITY from a
    structured field and never as a substring of the title (cicatrix #3).
  - >-
    `apps/mouth/src/app/kbli-explorer/components/KBLIInspector.tsx` — new pure
    `buildInspectorCopyLine(data)` beside the badge helpers it needs: one
    sentence for a retired code, the existing five-segment line otherwise.
  - >-
    `apps/mouth/src/app/kbli-explorer/page.tsx` — `handleCopy` calls the
    builder; the inline template, and the two imports it alone needed, are
    gone.
  - >-
    Tests — guilt/innocence on the two REAL production payloads (74100 retired,
    56101 live), including the impostor case that a substring guard fails.
constraints:
  - >-
    The RISK half of this row was blocked on the risk doctrine until #6868
    ruled it (one derivation, `Verify at OSS` as the floor). That cure decided
    the doctrine, and this PR applies its consequence on the travelling
    artifact: for a code that cannot be registered there is no risk segment to
    qualify, so the segment goes rather than gets hedged.
  - >-
    The inspector's rendered PANELS are not touched. They sit inside our
    surface, where the tombstone description is on screen next to them; this
    row is about the string that leaves it.
  - >-
    Mouth is Vercel: merging does NOT make this live. The git deploy lands
    STAGED and must be promoted, so the `Bites:` observation is taken on the
    promoted production URL.
acceptance:
  - text: >-
      GUILT: WHEN the inspect payload carries `licensing_status:
      NOT_IN_KBLI_2025`, the copied line SHALL contain no `PMA:`, `Risk:`,
      `Licenses:` or `Sector:` segment, no `[KBLI 2020` fragment, and the code
      exactly once — and SHALL say the code is retired and cannot be registered
      on OSS.
    probe: >-
      npx vitest run
      src/app/kbli-explorer/components/KBLIInspector.copy-line.test.ts -t
      "drops every segment"
  - text: >-
      THE VERDICT IS AN ENTITY, NOT A SPELLING: WHERE a LIVE record's title
      merely quotes the tombstone suffix, the line SHALL stay the normal
      five-segment one. A `title.includes("[KBLI 2020")` guard passes the guilt
      half and fails this one.
    probe: >-
      npx vitest run
      src/app/kbli-explorer/components/KBLIInspector.copy-line.test.ts -t
      "structured status"
  - text: >-
      INNOCENCE: WHERE the code is live (56101), the line SHALL be byte-identical
      to the expression this cure replaced — same five segments, same order.
    probe: >-
      npx vitest run
      src/app/kbli-explorer/components/KBLIInspector.copy-line.test.ts -t
      "byte-identical"
  - text: >-
      BOTH MUTATIONS BITE: neutralising the burial branch SHALL red the first
      test only; replacing the entity check with a title substring SHALL red the
      second only; innocence SHALL stay green through both.
    probe: >-
      manual mutation, run 2026-09-20 — 1 failed / 2 passed each time, file
      restored from a `cp` backup and confirmed byte-identical with `cmp -s`
  - text: NO REGRESSION ON THE EXPLORER OR THE SHARED LIBS.
    probe: npx vitest run src/app/kbli-explorer src/lib
pii: none
local_evidence: >-
  Two reads of the public KBLI inspect endpoint through the PII-free
  nuzantara-knowledge MCP (codes 74100 and 56101 — a public government
