objective: >-
  Remove the pre-#7209 News Room converter's invented TL;DR/Next-Steps
  filler from apps/mouth article content. A deterministic script
  (scripts/content/strip_legacy_tldr_filler.py, 13 unit tests) removes
  ONLY an exact-shape "Quick Summary" InfoCard and an exact-string
  Checklist filler item ("Review the article for specific actions") —
  anything that deviates in label, order, or value is left byte-identical
  and reported, never guessed at. Floor is 3 on SIZE alone (580 content
  files, ~11.4k lines of churn, almost entirely mechanical single-block
  deletions produced by one script run) — not a hot-zone path hit and not
  an architectural/security-sensitive change. No application code, no
  route, no schema, no auth path touched; only MDX content bodies and one
  new, fully-tested content-lint script.
scope:
