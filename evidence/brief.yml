objective: >-
  CRM-18: soft-delete affordance on the client detail desk. The button is
  offered only to admin/founder or the assigned-to viewer; the backend's
  verify_client_access(..., write=True) (crm_utils.py:169-232) is the real
  fence — the desk predicate is intentionally NARROWER (narrower = no 403 for
  the offered button, not a bypass). Soft-delete sets status=inactive +
  deleted_at; nothing is erased. Gate session reviewed the full diff:
  guilt+innocence corpus present, source assertions pin the predicate wiring
  rather than constant-folding it, no isAdmin() leakage, backend fence is
  unchanged.
scope:
  - >-
    apps/mouth/src/app/(workspace)/clients/client-row-model.ts — new
    viewerCanDeleteClient(client, email, role) predicate. DELETE_ADMIN_ROLES
    = {admin, founder}, narrower than api.isAdmin().
  - >-
    apps/mouth/src/app/(workspace)/clients/[id]/ClientDetailClient.tsx —
    reads currentUserRole from profile, computes canDeleteClient, implements
    confirmDeleteClient (toast confirmation, router.push on success, error
    toast on failure).
  - >-
    apps/mouth/src/app/(workspace)/clients/[id]/components/OverviewTab.tsx —
    Trash2 button rendered only when canDeleteClient=true, disabled during
    flight, aria-label="Delete client".
  - >-
    tests: delete-client-permission.guard.test.ts pins the predicate rule;
    OverviewTab.test.tsx guilt/innocence/in-flight; ClientDetailClient.test.tsx
    source assertion (never a literal, never isAdmin).
