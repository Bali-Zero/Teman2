    scripts/content/strip_legacy_tldr_filler.py — new script: exact-match
    InfoCard/Checklist removal, byte-exact elsewhere, deviating cards
    reported not guessed at.
  - >-
    scripts/content/test_strip_legacy_tldr_filler.py — 13 unit tests,
    guilt (exact shapes removed) + innocence (hand-edited/unrelated/real
    content untouched, frontmatter byte-identical).
  - >-
    apps/mouth/src/content/articles/**/*.mdx (580 files) — the script's
    --write output. Verified: all 580 changed files compile clean under
    @mdx-js/mdx; apps/mouth's content-integrity vitest suite passes
    (frontmatter-title-integrity, description-fields-integrity,
    kbli-prose-pins, kbli-reserved-codes-articles, llms-article-exports,
    secondhome-article-claims, blog articles/body-excerpt); frontmatter
    byte-identical on all 580 files (scripted diff check).
