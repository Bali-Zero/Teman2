objective: |
  Research OS v1.0.0, Packet 04 (canonical contracts), Wave D1. This PR ships four of the
  frozen CONTRACTS.md object kinds that make up the "evidence spine" the Intel Lake (P05) and
  NAGA claim ledger (P06) build against: IntelEvent (§4), Evidence (§5), Claim (§6) and
  StoryCluster (§11). Each is a pydantic v2 FrozenCoreModel (extra="forbid", frozen=True,
  model_validator(mode="after") recomputing and comparing object_hash, validate_extensions(),
  PydanticCustomError reason codes) matching the foundation idiom already on `origin/main`
  (successor_edge, revocation_receipt) — no new primitive regex, no change to
  primitives.py/hashing.py. EventRef is defined once (in intel_event.py) and reused by three
  of the four kinds. Ships: 4 model modules, 4 generated Draft 2020-12 JSON Schema artifacts,
  41 fixtures (13 valid / 28 invalid, above the >=3/>=3-per-kind contract), registration in
  research_os/cli.py + models/__init__.py + schemas/__init__.py, and the corresponding unit
  tests. Landed across three commits on this branch (4908da40a feat, 4da3c6cb1 fix answering a
  Kimi K3 cross-family adversarial review, 59cdb8b81 docs/fixture correction), then merged with
  origin/main in this session to pick up three sibling P04-D1 PRs (#4586 foundation, #4613/#4625
  decision-authority-execution chain, #4635 governance receipts) that landed while this PR sat
  CONFLICTING.
