objective: |
  PR #4653 (branch `agent/nuzantara/backend-rag/ros-v1-p04-d1-outcome-event`, DRAFT). Ships the
  canonical `OutcomeEvent` contract from the frozen CONTRACTS.md section 16 as part of Research OS
  Packet 04 / D1 (governance receipts + canonical objects). This is one of four kinds in the D1
  family (OutcomeEvent here; WorkflowRun/VerificationReceipt/ConductorHandoff landed separately,
  MetricProfile/MetricResult landed as #4637) — the split exists to keep each PR review-sized, per
  the commit message on the sibling WorkflowRun/VerificationReceipt/ConductorHandoff work
  ("The fourth kind, OutcomeEvent, ships separately... because splitting keeps this PR under
  review-sized bounds").

  Adds, verified from `git diff c4242cd44..HEAD` (merge-base = #4637, MetricProfile/MetricResult),
  across the three commits this branch now carries (the original contract commits, the evidence-
  pack truthfulness fix `ffe3e9aa5`, and the adversarial-review-fix commit `ce82bb93e` below):
  - `research_os/models/outcome_event.py`: a Pydantic v2 `FrozenCoreModel` with 12 nested
    sub-models (`SubjectRefs`, `OutcomeWindow`, `OutcomeQuality`, `OutcomeCohort`,
    `OutcomeClassification`, `OutcomeEventLineage`, plus 8 typed ref models), an
    `object_hash` round-trip validator, a `window.ended_at > window.started_at` ordering check, a
    joint-presence validator on `metric_profile_ref`/`metric_result_ref` (both or neither) — those
    two fields bind to the `MetricProfileRef`/`MetricResultRef` kinds that landed on main in #4637
    — and, as of `ce82bb93e`, a `model_config = ConfigDict(json_schema_extra=...)` mirroring that
    same joint-presence rule into the generated JSON Schema as a bidirectional `if`/`then` (see
    "ADVERSARIAL-REVIEW FIXES" below).
  - `research_os/schemas/outcome_event.schema.json`: the generated Draft 2020-12 JSON Schema for
    the model above, regenerated via the real `schema_bytes()` generator after the model change.
  - 13 fixture files under `fixtures/outcome_event/` (3 valid, 5 invalid pairs — each invalid
    fixture paired with an `.expect.json` naming its exact rejection reason code).
    `valid_with_supersedes_and_extension.json`'s `recorded_at` was corrected in `ce82bb93e` (was
    byte-identical to its predecessor's, which the real graph resolver quarantines — see below).
  - `apps/backend-rag/backend/tests/unit/research_os/test_outcome_event.py` (13 test functions as
    of `ce82bb93e`, was 11): fixture round-trip, exact-reason-code rejection, unknown-field
    rejection, object_hash-mismatch-cannot-bypass, frozen-immutability, the joint-presence
    invariant, plus the two adversarial-review-fix tests below.
  - Registration of `OutcomeEvent` in `cli.py::CONTRACT_MODELS`, `models/__init__.py::__all__`,
    and `schemas/__init__.py::SCHEMA_MODELS` (2-line additions each, alongside existing entries —
    the 13 other already-registered kinds, including `workflow_run`/`verification_receipt`, were
    NOT touched by this diff; confirmed byte-identical between merge-base and HEAD, see receipts).

  ADVERSARIAL-REVIEW FIXES (2026-08-23, commit `ce82bb93e`), from an independent review that
  returned DEFECTIVE with cross-family corroboration, re-verified on disk by the requesting session
  before dispatch and independently re-verified again by this session before each fix:
  1. `valid_with_supersedes_and_extension.json` supersedes `valid_minimal.json` but both carried
     the byte-identical `recorded_at: "2026-04-15T00:05:01Z"` — `graph.py`'s `select_current_member`
     quarantines exactly this (`successor.recorded_at <= predecessor.recorded_at` ->
     `successor_recorded_at_not_later`; CONTRACTS.md:863 requires a strictly later `recorded_at` for
     a correction). The one fixture demonstrating a working supersedes chain was rejected by the
     resolver it exists to exercise. Fixed: `recorded_at` -> `"2026-04-15T00:05:02Z"`, `object_hash`
     recomputed via the real `object_hash()`. New test drives the REAL resolver
     (`GraphMember`/`ObjectSuccessorEdge`/`select_current_member`, not a re-implementation) and
     proves BOTH arms: fixed fixture -> `Current`; reproduced tied-timestamp shape -> exactly
     `Quarantined(('successor_recorded_at_not_later',))`.
  2. The checked-in schema had zero `if`/`then`/`allOf`/`oneOf`/`dependentRequired` — the
     `metric_profile_ref`/`metric_result_ref` joint-presence rule lived only in Python
     (`validate_event()`). A consumer validating against the published schema alone would accept a
     document the model rejects. Fixed by mirroring `metric_result.py`'s precedent: a bidirectional
     `if`/`then` (A implies B and B implies A) inside `model_config`'s `json_schema_extra`, each
     `if` testing BOTH `required: [field]` AND `properties: {field: {not: {type: null}}}` — value,
     not just key presence, because this contract's presence-preserving null semantics
     (`hashing.py`) mean a bare `dependentRequired` would accept a document with both keys present
     but one explicitly `null`, which the model still rejects. Verified by enumerating all 9
     combinations of {absent, explicit null, present-with-value} across both fields and asserting
     schema verdict == model verdict == an independently-derived expected verdict on every one (not
     schema==model alone, which would be an identity check, not a guard). `ConfigDict` merge
     confirmed (twice — this session directly, and an independently dispatched subagent) to keep
     `FrozenCoreModel`'s `extra="forbid"`/`frozen=True` alongside the new `json_schema_extra`.
  3. `test_outcome_event.py`'s two fixture-glob loops had no assertion the glob matched anything —
     a renamed/emptied fixtures directory would have passed having validated zero fixtures. Added
     non-empty assertions, pattern-matched to `test_decision_chain.py`'s convention. Only this PR's
     own test file touched; the same hole in sibling test files is ledgered separately.

  Explicitly NOT fixed, per the Agent PR Contract's depth-1 fix-of-a-fix limit and an already-ledgered
  PENDING-ARMS finding: `V1_RESERVED_EXTENSION_FIELD_NAMES` in `primitives.py` omits ~16 of
  OutcomeEvent's own field names, so an extension payload can smuggle them. Real, repo-wide
  (`subject_refs` is missing too, affecting already-shipped kinds), and the obvious cure (adding the
  nested names) is already documented as wrong in the ledger (jails ~23 bare common words —
  cicatrix-superscar #3, over-match). `primitives.py` is untouched by this branch.

  The model's own module docstring flags SEVEN open interpretive judgment calls against the frozen
  spec prose (no invented `revocation_receipt_ref` field on `subject_refs`; `value` typed as `Any`
  with no shape hint in the spec; `classification.aggregation_level` as an unconstrained
  non-empty string; `quality.completeness` as an unconstrained float, not clamped 0..1;
  `source_system` as a local closed `Literal` with no matching section-3 registry row;
  `window` ordering enforced by analogy, not verbatim-stated; the "suppress cohorts <10" and
  "side-effect binding" invariants deliberately NOT enforced as single-object validators) —
  flagged for Packet 04 to rule on, not silently resolved here. This brief does not re-litigate
  those calls; it reports that they exist and are already on record in the source file a future
  reader will open.

  SCOPE HISTORY OF THIS EVIDENCE PACK, so a future reader isn't confused by 4 revisions on one
  file: `evidence/brief.yml`/`evidence/pack.yml` are fixed root-relative paths every Gear>=2 PR in
  this repo rewrites (cicatrix-superscar family #9, state-schema mutation drift — a fixed-path
  collision class actively observed fleet-wide as of this timestamp). REVISION 1 (`ffe3e9aa5`,
  evidence files only): found both files still describing foreign work — PR #4592
  (`ops-visaoracle-wrapper-header-0823`), inherited unchanged from `origin/main` at this branch's
  merge-base — and rewrote them to truthfully describe PR #4653, adding the `lanes:` block. NO
  functional code changed in that commit. REVISION 2 is not a pack edit at all: `ce82bb93e` fixed 2
  real defects (+ 1 test hardening) found by an independent adversarial review, touching 4
  functional files (fixture, model, schema, test) — see the "ADVERSARIAL-REVIEW FIXES" block below
  for exactly what changed. REVISION 3 (evidence files only again) refreshed this pack's
  narrative and receipts to match `ce82bb93e` — net_lines, file count, and test counts had drifted
  stale after revision 2 landed. REVISION 4 (this one, merge commit `8f98e5de3`): `origin/main`
  moved to `14332eb3e` (landing PR #4635's `risk_reclassification_receipt`/`sanitization_receipt`
  kinds concurrently) after revision 3 landed, and the same fixed-path collision hit both evidence
  files a second time — resolved identically (`--ours`), plus a formal non-zero-hit-count
  loss-check on the 3 shared registration files (`cli.py`, `models/__init__.py`,
  `schemas/__init__.py`) proving nothing origin/main added was dropped by the merge. Verified
  against `origin/main`'s current lint at each revision.
