task_id: infra-dynamic-workflow-3b
gear: 2
l_level: L2
gate_class: opus
# Floor for this diff is 2, reached via the SIZE term alone (418 added / 0 deleted across 4
# files) — no hot-zone path (no .github/workflows/, no migration, no apps/backend-rag/), no new
# dependency. Measured WITH this brief staged.
objective: >-
  PR3b of the dynamic-workflow mandate (docs/dynamic-workflow kit, owner ruling Zero
  2026-09-18). The draft .claude/skills/dynamic-workflow/SKILL.md and BRIEF.md kit predate
  scripts/dynamic_workflow.py (PR2, already shipped) and had drifted from what it actually
  ships — most visibly, the draft implied a single "judge" step covered both mechanical
  disqualification and jury tabulation, where the real CLI splits them into two separate
  subcommands (judge, jury). This PR rewrites SKILL.md against the shipped --help surface and
  turns BRIEF.md into brief.template.md with a grep-found source pointer (or an explicit
  unverified mark) on every one of its 15 scouting-report facts, per the mandate's own
  anti-hallucination discipline.
constraints:
  - >-
    No Anthropic per-token door, no new dependency, no migration, no workflow file — CI wiring
    for .github/workflows/dynamic-workflow-selftest.yml is PR3c's job, explicitly out of scope
    here and named as such in SKILL.md's own Selftest section.
  - >-
    brief.template.md must reproduce BRIEF.md's F1-F15 text verbatim — this PR sources
    citations for the existing facts, it does not re-derive or correct the facts themselves.
  - >-
    Every F-line source pointer is either a real grep-found path/line or the mandate's exact
    literal "(source: session 2026-09-18, unverified)" — never an invented citation.
acceptance:
  - text: >-
      Every dynamic_workflow.py <subcommand> named in SKILL.md is a real subcommand of the
      shipped CLI's --help output, and judge is documented strictly before jury.
    probe: "python3 -m pytest scripts/tests/test_dynamic_workflow_skill.py -k 'subcommand_is_real or judge_and_jury' -q"
  - text: >-
      Every F1-F15 line in brief.template.md carries a "(source: ...)" pointer, and every
      unverified mark uses the mandate's exact literal rather than a paraphrase.
    probe: "python3 -m pytest scripts/tests/test_dynamic_workflow_skill.py -k 'source_pointer or unverified' -q"
  - text: Registering dynamic-workflow in KNOWN_CLAUDE_ONLY_NAMES does not break skill-canonicity.
    probe: "python3 -m pytest scripts/tests/test_skills_canonical.py -q"
  - text: The pre-existing 79-case offline selftest mirror is unaffected by this PR.
    probe: "python3 -m pytest scripts/tests/test_dynamic_workflow.py -q"
assumptions:
  - text: >-
      "Register it wherever skill-catalog expects" (original PR3 spec) maps to two concrete,
      low-risk actions rather than one uniquely-correct one: adding dynamic-workflow to
      KNOWN_CLAUDE_ONLY_NAMES (in-repo, testable — this is a Tier-B, .claude-only skill, same
      class as modus/workflow) and an `mem save pattern "SKILL-CATALOG: dynamic-workflow —
      ..."` MOS entry (global, per skill-catalog/SKILL.md's own documented convention for
      catalogued skills). Both done; neither confirmed as the singularly intended one.
    status: verified
    probe: "mem save pattern ... exit 0 (ran this session, importance 6); scripts/tests/test_skills_canonical.py 11 passed"
  - text: >-
      scripts/lint_model_cards.py, named in the ORIGINAL (pre-split) PR3 spec, was not seen
      assigned to PR3a/3b/3c/3d anywhere in the addendum read so far — left out of this PR
      rather than guessed into scope; flagged to the team-lead as an open question, not
      silently dropped.
    status: verified
    probe: "grep -rn lint_model_cards ~/BATTAGLIA-20260911/DYNAMIC-WORKFLOW-20260918/ — only the original PR3 section names it"
  - text: >-
      evidence/brief.yml at repo root is a rolling per-PR slot, not a fixed artifact of a prior
      PR: git log shows it was last written by #6645 (an unrelated WA human-handoff PR) and the
      trigger-symmetry evidence pack's own brief_ref comment documents CI's harness-floor.yml
      copying THIS PR's brief to that canonical relative path for linting. Overwritten here with
      this PR's own content rather than left as inherited cruft from another lane.
    status: verified
    probe: "git log --oneline -3 -- evidence/brief.yml; git ls-files evidence/brief.yml"
