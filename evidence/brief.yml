task_id: garuda-voa-nationality-dataset-0823
gear: 2
l_level: L2
gate_class: opus
objective: >-
  `apps/backend-rag/backend/services/garuda_flow/intake.py` set
  `nationality_entry_eligible=True` unconditionally for every VOA intake
  request, and its own docstring said why: "no nationality-eligibility
  dataset yet". Ship the dataset (decree-sourced, independently verified
  ISO-3 country list) and wire `intake._build_eligibility_input` to derive
  the field from `request.nationality` instead of hardcoding it — so a
  nationality that is genuinely not eligible for a Visa on Arrival (e.g.
  `AFG`) now DECLINEs instead of silently ACCEPTing.
why_now: >-
  Verified this session: a case with nationality `AFG` (Afghanistan, not
  VOA-eligible) returned ACCEPT from `build_verdict` before this change. The
  gate (`eligibility.py:147`) and the input field
  (`intake.py:103`, validated `^[A-Za-z]{3}$` at `internal_preview_cli.py:61`)
  both already existed — only the dataset was missing, so the gap was live
  on every request, not theoretical.
constraints:
  - "One PR, one concern: only `services/garuda_flow/nationality_eligibility.py` (new), `services/garuda_flow/intake.py` (wire + docstring correction), and their tests. Do not touch `safe_clock.py`, `operating_calendar.py`, `pricing.py`, the mouth app, or the admin dashboard."
  - "The dataset's country list must be independently re-retrieved from the official source (not shipped on a research lead's authority alone) and diffed row-by-row against the lead; any disagreement must be resolved against a third source or left out and declared, never silently picked."
  - "No new third-party dependency (e.g. pycountry) — the repo has none installed anywhere (confirmed by search) and the existing house style (`operating_calendar.py`) hand-maintains its own decree-sourced data with an explicit provenance docstring; this module matches that pattern."
  - "Fail-closed, never-guess house style for the unknown-code case, matching `operating_calendar.py`'s `ARRIVAL_DATE_UNCONFIRMED` pattern in SPIRIT — but the module docstring explains explicitly why this dataset lands on a different concrete answer (a closed positive enumeration has no genuine data-gap state, unlike the operating calendar's real COVERAGE_END boundary)."
  - "Existing tests must not regress: known-good baseline for `backend/tests/services/garuda_flow/` was 125 tests before this change (162 across garuda_flow/ + the two app/routers/test_garuda_voa* files) — both numbers must still be green after, with new tests additive, not replacing old ones."
acceptance:
  - "The dataset module's docstring states its decree, source URL, retrieval date, and count — matching `operating_calendar.py`'s provenance style, including how it states its own coverage boundary."
  - "`AFG` (and a second non-listed nationality, `PRK`) DECLINE via `build_verdict` with `NATIONALITY_NOT_ELIGIBLE` in `decline_codes` — shown RED against the pre-fix code and GREEN against the fix, in the same PR."
  - "A representative innocence sample (`USA`, `ITA`, `RUS`, `AUS`, plus special entities `HKG` Hong Kong and `TWN` Taiwan, both present in the verified list) still ACCEPT."
  - "A non-vacuity test pins the dataset's verified count (97) so a future edit that silently empties or truncates it fails loudly."
  - "Case-insensitivity (`usa` == `USA`) is tested at both the pure-function level and end-to-end through `build_verdict`."
  - "`backend/tests/services/garuda_flow/` plus the two `app/routers/test_garuda_voa*.py` files are green: 162 -> 183 tests (21 net new: 4 in `test_intake.py`, 17 in the new `test_nationality_eligibility.py`), 0 regressions."
