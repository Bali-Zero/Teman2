task_id: ci-backend-test-sharding-0823
gear: 3
l_level: L2
gate_class: opus
objective: |
  Shard `Backend Tests (Python)` three ways. It is the single largest fixed cost in every
  merge-queue transit and every code PR pays it TWICE (PR lane + merge-group lane). Measured
  on this workflow, not estimated: merge_group run 32626973483 spent 797s of a 1068s job in
  "Run unit tests" (74.6%); schedule run 32624568684 spent 726s of 975s (74.5%). Every other
  required gate on the same PR finishes in under 2 minutes.

  Intra-job parallelism is already saturated — `-n auto --dist loadfile` was re-added
  2026-08-21 with per-xdist-worker Postgres isolation and a 2-core `ubuntu-latest` runner has
  nothing left to give. The only remaining lever is CROSS-JOB sharding: 3 x 2 cores instead of
  1 x 2.

  Gear 3 is the DETERMINISTIC FLOOR here, not a choice: the diff touches
  `.github/workflows/`, which floors at 3 regardless of size (fleet-order-spec.md §4).

  THE ONE THING THIS PR IS REALLY ABOUT, and the reason the evidence below is sized the way it
  is: `Backend Tests (Python)` is one of the 27 REQUIRED status contexts in classic branch
  protection on main. A `strategy.matrix` renames its check runs to "... (1)", "... (2)" — the
  bare required context then never reports again, every merge-queue entry waits out
  `checkResponseTimeout` (5400s) and fails with nothing red to fix. That is cicatrix-superscar
  #2 / W69 (required checks silently disarmed), and it would be self-inflicted by a change whose
  whole purpose is to make the queue faster. The cure is structural: a fan-in job keeps the exact
  name and the shards get new, non-required names.

  The second failure mode this design has to defeat is worse because it is INVISIBLE: if the
  three chunks stop tiling the corpus, tests silently stop running and the required context stays
  green. A sharded suite that under-runs looks exactly like a healthy one. Four independent
  refusals in the fan-in close it (upstream results, partition guard against the shards' OWN
  uploaded chunk lists, junit proof-of-work, coverage combine before threshold).
constraints:
  - "The `name:` of the fan-in job must remain the byte-exact string `Backend Tests (Python)`,
    and its job id must remain `backend-tests` — `test-summary` consumes
    `needs.backend-tests.result`, and branch protection consumes the name."
  - "Do NOT change the merge_group scoping semantic: the PR lane runs impact-scoped selection,
    merge_group DELIBERATELY runs unscoped (impact_map.py docstring, 'SCOPE, DECLARED'). The
    partitioner reads the same IMPACT_* env with the same fail-open convention and never narrows
    the corpus on its own initiative."
  - "Do NOT touch the workflow-level `concurrency:` block. It is scar tissue encoding three
    asymmetries (merge_group / schedule / push-to-main) that look like bugs at a glance; the new
    jobs inherit it unchanged."
  - "No new dependencies. pytest-split was considered and deliberately deferred to v2, gated on a
    MEASURED shard imbalance > ~2x — which this PR instruments rather than assumes."
  - "Larger paid runners: rejected (cost). Self-hosted runners: rejected outright — this is a
    public repository, so that means arbitrary PR code executing on our machines."
acceptance:
  - "`Backend Tests (Python)` still reports on every event type it reported on before
    (pull_request, merge_group, push, schedule, workflow_dispatch) and never hangs unreported."
  - "All 27 required contexts report on the probe head SHA."
  - "Wall-clock for the required context on a full unscoped (merge-group) transit is <= 8 min."
  - "GUILT: a failing test makes the fan-in RED. GUILT: a corrupted chunk list makes the
    partition guard RED. INNOCENCE: a clean transit is green."
  - "Coverage `--fail-under=55` is still enforced on the lane that collects it (merge_group /
    push / schedule / dispatch — NOT pull_request), over the COMBINED shard data."
  - "PR-lane scoped selection is unchanged: the same modules are selected, only distributed."
