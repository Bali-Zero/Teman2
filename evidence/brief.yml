task_id: secondo-livello-second-army-runner
gear: 2
l_level: L2
gate_class: opus
# Floor for this diff, measured WITH this brief already staged — the mistake that sank PR #6602
# was measuring on the code-only commit and letting the brief's own churn cross the threshold
# afterwards. No hot-zone path here; the CI wiring that would add one ships separately.
objective: >-
  The standalone runner for infra/workflows/ scripts, split out of PR #6602 so each piece lands at
  its own honest size. run-second-army.mjs compiles and executes a workflow script OUTSIDE the
  Workflow tool — shell, cron or CI — by injecting the same args/agent/log/phase/parallel/pipeline
  bindings the harness supplies. It is also the enforcement point for the Builder Contract's
  "every agent() call pins model:" rule, and this PR makes that enforcement MEASURABLE: a --script
  flag lets the behavioural suite point the runner at two fixtures that differ only in the pin.
constraints:
  - >-
    No Anthropic per-token door in any form. The single door the runner opens is the `claude` CLI,
    which carries its own OAuth. No credential is placed on argv, read from the environment, or
    printed; the only env var read is a numeric per-lane timeout.
  - >-
    No new dependency: node: builtins only, Node >= 18. The behavioural tests spawn the runner as
    a child process and run everything through --dry-run, so no claude/codex/agy binary is ever
    reached and there is no network call.
  - >-
    Nothing outside infra/workflows/ is touched. second-army.js, shipped in #6603, is NOT modified
    by this PR — the runner reaches it through a default path, and --script overrides that default
    without changing it.
acceptance:
  - text: >-
      A1: WHEN the behavioural suite runs SHALL pass 5/5 — a fixture lane that pins model: runs and
      its return value reaches stdout; a fixture lane that omits it is refused with a non-zero exit
      and a reason on stderr; an unsupported model alias is refused and named; a missing
      --args-file is a usage error; stdout carries the JSON return value alone.
    probe: node infra/workflows/tests/test-run-second-army.mjs
  - text: >-
      A2 THE POINT OF THIS PR: WHEN both call sites of assertModelPinned() are removed in a scratch
      copy SHALL go RED — 4/5, failing test_unpinned_fixture_is_refused. The test this replaces was
      a regex over the runner's source, and an independent gate proved it passed with the guard
      commented out. A guard is a behaviour and has to be measured as one.
    probe: "copy the runner+suite to a scratch dir, replace both `assertModelPinned(opts);` call sites with a comment, rerun the suite"
  - text: >-
      A3 THE MIRROR OF A2: WHEN the guard is rewritten as `if (!opts?.model)` in a scratch copy —
      identical behaviour, different spelling — the suite SHALL stay 5/5. The replaced regex test
      went red on exactly this rewrite. The two mutations together show the new test tracks
      behaviour and not spelling.
    probe: "copy the runner+suite to a scratch dir, rewrite the guard condition as optional chaining, rerun the suite"
  - text: >-
      A4: WHEN the pre-existing contract suite for second-army.js runs SHALL still pass 12/12 —
      this PR must not disturb what #6603 shipped.
    probe: node infra/workflows/tests/test-second-army-contract.mjs
assumptions:
  - text: >-
      --script is load-bearing, not decoration. Without it the runner can only ever execute
      second-army.js, and a guard that refuses a malformed lane cannot be measured, because
      second-army.js never presents one. The fixtures are the malformed lane.
    status: verified
    probe: "test_unpinned_fixture_is_refused passes only because --script can reach fixtures/fixture-model-missing.js"
  - text: >-
      Importing the runner in-process is not a viable test form: it is a CLI entrypoint that
      executes main() at import and exports nothing selectively. The suite therefore spawns it as a
      child process and asserts on exit code and stderr.
    status: verified
    probe: "run-second-army.mjs ends with a bare main() call and has no export statement"
  - text: >-
      Nothing in .github/workflows/ runs infra/workflows/tests/ today, so this suite — like the
      contract suite beside it — is run by hand until the CI wiring ships as its own PR. The README
      says so rather than implying a consumer that does not exist.
    status: verified
    probe: "grep -rl 'infra/workflows' .github/workflows/ returns nothing"
