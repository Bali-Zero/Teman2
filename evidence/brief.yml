risks:
  - "The seven spec-interpretation judgment calls flagged in outcome_event.py's own docstring are
    real and unresolved — they are Packet 04's to rule on, not a defect of this PR, but a future
    reader should not mistake the model's current shape (e.g. `source_system` as a local Literal
    with no section-3 registry row) for a settled decision."
  - "mypy --strict on test_outcome_event.py (not the model file) reports 1 issue in this
    environment: `# type: ignore[misc]` — now at line 73 (was line 62 before the fix-3 glob
    assertions shifted it down; unchanged in substance) — is flagged as an unused ignore. Root
    cause (verified): this repo's actual mypy invocations (CI's `apps/backend-rag` job, and this
    package's own pyproject.toml) never load the pydantic mypy plugin, so the frozen-field
    reassignment diagnostic that `[misc]` was written for never fires under any known real
    invocation of this package — while sibling files (e.g. test_workflow_run.py:62) use
    `[assignment]` on the analogous line because THEIR field is a `Literal`, so a plain
    vanilla-mypy literal-mismatch error fires there with no plugin needed. This is a genuine,
    verified, pre-existing-pattern discrepancy in the test file; it is NOT CI-blocking (CI's
    mypy job strictly checks only `backend/core` and `backend/app/models`, never
    `packages/research-os-core` — confirmed via `.github/workflows/tests.yml:635`). Left unfixed
    deliberately across both the evidence-rewrite AND the adversarial-review-fix commits — not in
    scope for either — reported here rather than silently swept."
  - "This evidence pack was reconstructed to describe a PR whose real substance (the OutcomeEvent
    model, schema, fixtures, and test module) was authored earlier in this branch's history, not in
    the evidence-rewrite turn. All receipts below were re-run fresh against the code as it actually
