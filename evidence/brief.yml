task_id: kbli-science-audit-verification
gear: 2
l_level: L2
gate_class: opus
# Floor for this diff: `python3 scripts/evidence_pack_lint.py --print-floor --print-floor-source`
# over origin/main...HEAD returns 2, source `size`. Docs-only research capture: 12 new files
# under research/operations/2026-09-11-kbli-science-audit-verification/, ~1,650 churn lines,
# over SIZE_GEAR2_THRESHOLD (400) and under SIZE_GEAR3_THRESHOLD (1,828). No hot-zone path.
# The first push carried the full Science bundle (6,868 lines, floor 3); the six scripts
# and per-lane JSON summaries were removed from the PR and their sha256 recorded in
# the README so the bundle stays verifiable without a Gear-3 pack for a research artifact.
objective: >-
  Land the row-by-row verification of the Claude Science KBLI 2025 data-chain audit
  (snapshot 64df83d10b, 342 findings) as a research capture: the Science CSVs and method
  notes, a 342-row verification ledger (CONFIRMED / REFUTED / NEEDS-RUNTIME / NEEDS-SOURCE
  with method and evidence per row), and a README that records what moved since the
  June 19 baseline, the two snapshot-scope refutations, the corpus-side defects found and
  the three codex adversarial rounds.
constraints:
  - >-
    Research artifacts only: no file outside research/operations/ and this brief; no code
    path, no data file, no skill touched. Cures for the defects found (corpus metadata.source
    label, 49213 per_skala scope text, stale "1,563" literals) are listed, not shipped.
  - >-
    No client PII: the audit covers public KBLI classification data and repository code;
    validate_outputs.py's personal-data heuristics ran with 0 violations.
  - >-
    The R1 gate applies to every .md under research/: the README names codex as reviewer with
    a filled "Adversarial review" section; the four Science .md files carry an explicit
    exempt- value naming the README as their grader.
acceptance:
  - text: >-
      A1: WHEN `python3 scripts/check_adversarial_review.py --files <README>` runs SHALL print
      "PASS — 1 research file(s) carry a valid adversarial review".
    probe: python3 scripts/check_adversarial_review.py --files research/operations/2026-09-11-kbli-science-audit-verification/README.md
  - text: >-
      A2: WHEN verification_ledger.csv is parsed SHALL contain exactly 342 rows whose
      finding_id set equals the union of the three Science CSVs, with verdict counts
      CONFIRMED 324 / REFUTED 2 / NEEDS-RUNTIME 15 / NEEDS-SOURCE 1.
    probe: python3 -c "import csv,collections;r=list(csv.DictReader(open('research/operations/2026-09-11-kbli-science-audit-verification/verification_ledger.csv')));print(len(r),collections.Counter(x['verdict'] for x in r))"
  - text: >-
      A3 Bites: WHEN a cure PR for C-CLAIM-014, A-PSK-0001 or C-CLAIM-001…010 opens SHALL cite
      the finding_id from this ledger; the ledger is the consumer contract those PRs read.
    probe: grep -c "C-CLAIM-014\|A-PSK-0001" research/operations/2026-09-11-kbli-science-audit-verification/README.md
assumptions:
  - text: >-
      The Science scripts are deterministic: re-running them unchanged on origin/main
      0b56e22f56 reproduces the delivered CSVs byte-for-byte except the ledger-consumer row.
    status: verified
    probe: cmp of the three CSVs and chain_alignment.json before/after the re-run in the worktree (1 differing row, B-LEDG-002)
  - text: >-
      apps/kbli-navigator is not a production surface, so Lane C findings carry internal weight.
    status: verified
    probe: apps/kbli-navigator/README.md line 3; curl knowledge.balizero.com/kbli/56101 -> 302 to kita login; kbli-navigator-rebuild.vercel.app -> DEPLOYMENT_NOT_FOUND
  - text: >-
      The 21 SECTION_META titles match BPS Perka 7/2025 (C-HARD-001).
    status: unverified
    probe: compare against the BPS publication; no section records exist in the OSS ground truth or the corpus
