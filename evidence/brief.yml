    Nothing outside infra/workflows/ is touched, and no existing workflow script, test or README
    section is modified — the four files are additive except the appended README section.
  - >-
    No PII in scope: the script carries mission/task text supplied by its caller and routes any
    PII-bearing lane to local Ollama by doctrine; no client data appears in this diff.
