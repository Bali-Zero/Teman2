objective: >-
  PR-2 of the #7316 re-spec (spec_T3_split_v2.md): the scanner that turns
  whatsapp_message_context outbound rows into unjudged team_promise_candidates
  rows. PR-1 (#7342) shipped schema + connection guard only; this PR adds
  `--scan [--dry-run] [--batch-size N]` to scripts/wa_team_promises.py,
  reusing PR-1's guard/kwargs/_fail_line unchanged. Floor is 2 on SIZE alone
  (704 net lines across 4 files) — the diff's first draft also touched
  infra/launchagents/wrappers/ (hot-zone by path, floor 3, needing a full
  council-reviewed Evidence Pack — PR #7315 hit the same trap), fixed by
  moving the cron wrapper to scripts/wa_team_promises_scan_cron.sh, following
  scripts/queue_stall_notify_cron.sh's precedent (a plain cron-runner.sh
  payload with no LaunchAgent plist, crontab line documented in its own
  header comment, never installed by the PR).
  Reads whatsapp_message_context (Pro's live Node-runtime mirror, never
  ALTERed, never written to) filtered to direction='outbound' with text,
  created_at within the last 30 days on EVERY query including the seed (the
  v1 predecessor only floored the seed, then paged the rest with a bare
  OFFSET/LIMIT with no date filter at all — an empty recent window turned
  into an unbounded archive scan). Clause splitter on ./!/?/;/newline plus an
  EN/ID/IT conjunction boundary; every clause is matched independently
  against the unchanged v1 regex catalog (backend.services.wa_copilot.
  team_promises._PROMISE_PATTERNS_RE/_TEMPORAL_CUES) — no dedup, no
  past-tense discard at this stage (PR-3's judge owns both). Id-cursor
  batching (id > $1 ORDER BY id LIMIT $2, never OFFSET — the predecessor's
  OFFSET pager against a live-growing table is how it refetched the same 200
  rows for 81 minutes), watermark persisted after EVERY batch rather than
  once at tick end, with a regression test pinning the cursor-advance
  behavior down. Inserts unjudged team_promise_candidates rows, ON CONFLICT
  (message_id, clause_idx) DO NOTHING — the only table this file writes to,
  plus local lock/watermark/metrics files under ~/.cell-bridge-state/ (same
  convention as scripts/wa_mirror_intake_sweeper.py). --dry-run computes
  counts only: no insert, no watermark read/write, no digest — verified
  read-only against Pro's live nuzantara_dev from a git-archive scratch copy
  in /tmp (never the live checkout): scanned=10303 clauses=361
  candidates_new=361, in line with the T37 draft spec's 2026-09-25 dry-run
  measurement (10,719 outbound-with-text, 372 matched over 30 days);
  confirmed after that team_promise_candidates count stayed 0 on Pro and no
  watermark file was created. Digest via scripts/tg_notify.py --tier digest:
  `promises: candidates new N, unjudged N`, counts only — enforced, not just
  by convention: `_digest_line` raises TypeError on a non-int argument, and a
  structural test asserts every ScanMetrics dataclass field stays a bare
  int, so a clause/name/phone/client id has no code path into the message.
scope:
  - >-
    scripts/wa_team_promises.py — adds `--scan`/`--dry-run`/`--batch-size`;
    `_split_clauses`, `_match_clause`, `_hash_clause`, `ScanMetrics`,
    `run_scan_batch`, `run_scan`, `_count_unjudged`, `_digest_line`,
    `_send_scan_digest`, lock/watermark/metrics helpers. `--init-schema`
    (PR-1) is unchanged; its 20 existing tests pass unmodified.
  - >-
    scripts/tests/test_wa_team_promises_scan.py — new file, 24 tests: clause
    splitter (punctuation/`;`/newline/conjunction), matcher (past-tense IS
    proposed, cue is always catalog vocabulary — never a name/phone/client
    id), the OFFSET-elimination regression (cursor strictly advances,
    persisted per batch), ON CONFLICT idempotency, the exclusive/releasable
    lock, and the digest's int-only enforcement (structural + runtime).
    Does not touch test_wa_team_promises.py, test_wa_team_promises_real_pg.py
    or team_promises.sql — left for the parallel builder working those
    files on the same branch family.
  - >-
    scripts/wa_team_promises_scan_cron.sh — new tracked cron-runner.sh
    payload (crontab line `*/15` in its own header comment); not installed.
  - >-
    scripts/ci/change_map.py — mechanical `scripts_coupling_census.py
    --write` regen (pre-existing drift unrelated to this feature, bundled
    because the pre-push quickcheck refuses a stale census on any push).
