task_id: ops-corollary-rerun-truth
gear: 3
l_level: L3
gate_class: opus
objective: |
  `.github/workflows/harness-floor.yml`'s OPERATIONAL COROLLARY told the gate session to re-trigger
  the required job with `gh workflow run --ref` and forbade `gh run rerun` outright. That is wrong
  for the ordinary case, and it deadlocked the first real Gear-3 PR to follow it.

  Measured on #4543 (2026-08-21): a `workflow_dispatch` run creates its check-run in a DIFFERENT
  CHECK SUITE from the `pull_request` event's, and that check-run does not enter the PR's
  statusCheckRollup AT ALL — it is an ABSENT entry, not a superseded one. #4543's rollup holds
  exactly ONE `Harness floor recompute` entry and it points at the pull_request run; the dispatch
  run appears nowhere in it. So the dispatch went green (suite 88072653107, 14:01:20Z) while the PR
  kept the old failure (suite 88070314010, 13:51:47Z) and stayed BLOCKED. The escapes from there
  are all expensive — a new commit means a new head SHA and the verdict is bound to the old one;
  close+reopen fires a fresh `pull_request` run on the unchanged SHA but costs the PR's state.
  `gh run rerun` on the original pull_request run — same SHA, same suite, verdict now posted —
  took it to CLEAN, and is the cheap one.

  This diff rewrites the corollary to name both cases and their conditions, and scopes the W111
  prohibition to what it actually protects (a stale merge-queue ref) instead of banning the
  instrument that works.
constraints:
  - "Comment text only. No behaviour change: the job, its steps, triggers and permissions must
    remain byte-identical to origin/main."
  - "The W111 prohibition must NOT be repealed, only scoped. `gh run rerun` on a `merge_group` run
    stays forbidden, and the rewritten note must say so explicitly rather than leaving it implied."
acceptance:
  - "The corollary names CASE A (pull_request run exists on this head SHA -> gh run rerun) and
    CASE B (no such run -> gh workflow run --ref), each with its condition."
  - "It states the mechanism (different check suites; the dispatch run does not enter the PR's
    rollup at all) with the measured suite ids and run ids, so a reader can verify rather than
    trust."
  - "It records the diagnostic trap ACCURATELY: pagination is what hides the row (check-runs
    returns 30 by default against ~55-63 on a PR head, so per_page=100 is mandatory and filter=all
    alone does NOT surface the red row); filter=all separately re-adds attempts superseded within
    their own suite; then compare check_suite.id."
  - "actionlint exit 0; the workflow's non-comment body byte-identical to origin/main."
consumer_map:
  - "`.github/workflows/harness-floor.yml` header — read by every session that has to unblock a
    Gear-3 PR after publishing a verdict. This note IS the recovery procedure; no other artifact
    carries it."
  - "No runtime surface: the job's behaviour is unchanged, so merged == live here."
risks:
  - "The suite ids quoted are from one measured incident. They are evidence of the mechanism, not a
    constant; the note presents them as the #4543 measurement, not as values to expect again."
  - "If GitHub ever makes a dispatch check-run enter the PR's rollup, CASE A stops being necessary
    and this note becomes conservative rather than wrong. Acceptable failure direction."
grader: independent-review-session (fresh context, not the author)
budget: ~1 subagent, no council
pii: none
