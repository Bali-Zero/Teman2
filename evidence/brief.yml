task_id: frontend-job-cap-0904
gear: 3
l_level: L2
gate_class: opus
objective:
  "Stop the merge queue from being blocked by a timeout cap that sits one minute above the

  frontend job's own healthy runtime.


  `Frontend Tests (Next.js)` in `.github/workflows/tests.yml` ran under `timeout-minutes: 10`

  while its healthy path measured 9m13s (run 33825884926, 2026-09-04 01:30Z). From 01:43Z the

  `npm ci` step took 4m20s instead of 1m07s on the SAME commit — registry/cache degradation, not

  code — so every run reported the job `cancelled` at the cap and `Test Summary` went red:

  PR runs (#5626, #5627) and merge_group runs (queue entries for #5569, #5614, #5626) alike.

  Main did not move in that window (`git log origin/main --since=2026-09-04T00:00Z` is empty).


  The diff is one value: `timeout-minutes: 10` → `16`, plus a comment carrying the measurement.

  No change to the matrix, the required contexts, the `!cancelled()` gate or concurrency.


  Gear 3 by PATH, deterministically: `.github/workflows/**` is a hot-zone path in

  `scripts/evidence_pack_lint.py::compute_floor` regardless of diff size.

  "
gear_reason: hot-zone path `.github/workflows/tests.yml` (floor 3 by path, not by size).
constraints:
  - One concern, one value. The npm cache/registry regression that made the cap bite is a separate cure
    with a separate owner; this PR does not touch caching, `npm ci`, or the suite.
  - The required context `Frontend Tests (Next.js) (mouth, true)` (infra/required.d/contexts.json) must
    still materialize identically — job name, matrix, event coverage unchanged.
  - "Never `gh run rerun` a queue run against this cap: the cap is the cause, a rerun replays it."
acceptance:
  - "WHEN the next merge_group run executes 'Frontend Tests (Next.js) (mouth, true)' with an install step
    over four minutes, the job SHALL conclude success and Test Summary SHALL report Frontend matrix success.
    probe: gh run view <merge_group run id> --json jobs → conclusion success on that job"
  - "WHEN a genuine hang occurs, the job SHALL still be bounded at 16 minutes, not unbounded. probe: grep
    -n 'timeout-minutes: 16' .github/workflows/tests.yml → exactly one hit, on the frontend job"
consumer_map:
  - The merge queue on `main` (ruleset 19779175) — every queue entry runs this job.
  - Every `pull_request` run of `tests.yml` — the `Test Summary` fan-in reads this job's conclusion.
  - "`infra/required.d/contexts.json` — unchanged; the context name is not touched."
risks:
  - A real hang is now detected six minutes later. Bounded, and cheaper than a blocked queue.
  - "Headroom against the degraded path is ~3.5 minutes; if the registry degrades further the cap bites
    again. Both council seats named the same follow-up: measure the `actions/cache` hit rate on 'Cache
    dependencies' and the `npm ci` registry path — a separate PR."
grader:
  "Opus-class final on-disk gate per CLAUDE.md §5 (2026-08-20 ruling). Generator is this session

  (M5, worktree infra-frontend-job-cap); council reviews by codex-gpt-5.6-sol and kimi-code/k3

  on the full diff, journal in the pack directory.

  "
