task_id: wr3-spend-gate-enforce-0823
gear: 3
l_level: L1
gate_class: opus
objective: |
  Close the last named-by-nothing gap in the WR3 zero-spend guilt+innocence corpus. The runtime
  spend-authority gate — `assert_spend_authorized()` in `scripts/wr3_spend_authority.py` — already
  refuses a real Veo spend without a valid, logged `WR3_SPEND_DECISION` token. It runs FIRST in
  both charging call sites (`_generate_start_image` and `_generate_video` in
  `scripts/wr3_flowkit_client.py`, PR #4606), before any socket opens, and the existing tests in
  `scripts/tests/test_wr3_zero_spend.py` already proved this locally against the two PRIVATE
  helper functions. `.github/workflows/wr3-spend-gate-tests.yml` (armed by PR #4649, same session,
  same afternoon) already runs that corpus on pull requests — this PR does not create that arming,
  it widens what the armed corpus actually proves.

  The gap: nothing in the existing corpus exercised the PUBLIC entrypoint `wr3-clip-renderer`
  itself calls — `submit_clip()` — so a regression that broke the wiring between `submit_clip` and
  `_generate_start_image`/`_generate_video` (as opposed to a regression inside those two functions)
  could ship green. This PR adds ONE new test,
  `test_submit_clip_real_mode_blocked_without_decision_no_http`, that drives `submit_clip` with no
  `WR3_ZERO_SPEND`/`WR3_SPEND_DECISION` set, fakes scene creation to succeed so the assertion is
  isolated to the charging call site, and asserts `SpendNotAuthorizedError` before any HTTP call —
  proving the whole real-mode spend-submission path is unreachable end-to-end through the same call
  chain `scripts/wr3_render_episode.py` drives, not merely through internal helpers reached by a
  direct unit call.

  Gear 3 by PATH, not by blast radius: the diff is 2 files, +73/-3
  (`.github/workflows/wr3-spend-gate-tests.yml` is hot-zone — floor is a deterministic lower bound,
  never the author's choice). The evidence below is sized to the change.
constraints:
  - "No change to `wr3_spend_authority.py` itself or to either charging call site — the runtime
    gate is pre-existing, unmodified production code. This PR only widens the workflow's `paths:`
    filter/pytest command to cover the two modules the new test exercises
    (`wr3_flowkit_client.py`, `wr3_render_episode.py`) and adds `pytest-asyncio`+`Pillow` to the
    install line (both are already required by the widened set — omitting either turns a real
    `ImportError` into a false red, verified empirically on a bare venv, not assumed)."
  - "Not a branch-protection change. `wr3-spend-gate-tests.yml` stays in its existing advisory
    (non-required) status — promoting it to required is a separate, `operator[control-plane]`-gated
    action tracked elsewhere, and out of scope here."
  - "Do not weaken any existing check. The one red this PR drew (`Harness floor recompute`, no
    brief+pack in the diff) is answered by supplying this pack, never by touching the gate."
