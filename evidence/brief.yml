  - "No change to primitives.py, hashing.py, or the two name validators cured by #4596 (P04 D1
    rule 8 depth-2 discipline — do not reopen a closed cure)."
  - "PR stays DRAFT. This session does not arm, enqueue, un-draft, or merge — fleet-wide HOLD
