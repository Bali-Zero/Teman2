task_id: s12-c3-queue-unstick
gear: 2
l_level: L1
gate_class: opus
objective: |
  Kill the DIRTY/BEHIND stall. Measured on 2026-08-23: 5+ episodes of PRs
  sitting BEHIND or DIRTY for 40-90 minutes each, every one of them waiting
  for a gesture a cron could make in ten.

  `scripts/queue_unstick.py` + a 10-minute cron. It does exactly two things
  and refuses to do a third:
    - `BEHIND` -> `gh pr update-branch`, hard-capped at 5 per tick.
    - `DIRTY` (a true conflict) -> NEVER touches the branch. It signals ONCE
      per PR+head-SHA to the fleet mailbox, naming the PR and the ACTUAL
      conflicting files, so a conductor acts in minutes instead of finding
      out on a round.

  The DIRTY asymmetry is the whole design. Updating a branch that has a real
  conflict is a second-writer race against whoever owns it (superscar #5,
  scar 2026-08-21); the value of this organ is that it tells a human quickly,
  not that it acts bravely.
constraints:
  - "NEVER update a PR that is in the merge queue — updating a queued PR
    EVICTS it. This is the single most destructive action available to this
    script, so the exclusion is checked before any action, in a pure function
    the tests exercise directly."
  - "NEVER touch a DIRTY branch. Signal only, deduped by PR + head SHA so a
    PR dirty for six hours produces one message, not thirty-six."
  - "Never invent a conflicting filename. When the local merge simulation
    cannot answer, the message says the literal string 'unobtainable via
    API'."
  - "Every tick writes a receipt, including a tick that did nothing (W108: a
    mute cron is a dead cron)."
  - "A failed `gh` query is CANNOT-VERIFY, never 'nothing to do' — an empty
    PR list from a broken query must not read as a quiet, healthy repo."
acceptance:
  - "Live dry-run against the real open PRs classifies correctly and mutates
    nothing."
  - "A queued PR is never selected. A draft, a hold-labelled PR, and a PR
    whose last commit is under 5 minutes old are never selected."
  - "A DIRTY PR is never updated, produces exactly one signal, and the signal
    names the real conflicting files."
  - "The 6th BEHIND PR in a tick is not updated (anti-storm cap)."
consumer_map:
  - "`scripts/cron-runner.sh` — the existing runner and receipt mechanism.
    Used, not reinvented."
  - "`scripts/fleet_mail.sh pro broadcast` — where the DIRTY signal lands."
  - "`gh pr update-branch` — the only mutation this script performs, and
    only on BEHIND."
  - "`.github/workflows/auto-merge-whitelist.yml` — NOT edited, but a
    consumer of this script's side effect: it runs on `synchronize`, so the
    update-branch push RE-ARMS auto-merge on a non-draft PR. Documented at
    the top of the script rather than guessed around (cicatrix W123)."
risks:
  - "update-branch is a push, and a push re-arms auto-merge on any non-draft
    PR. A PR deliberately disarmed WITHOUT a hold label would be re-armed by
    this organ. Not silently accepted: it is documented in the script header
    with the W123 reference, and the durable way to hold a PR is draft, which
    this script already excludes. No heuristic was invented to guess
    'disarmed on purpose' — there is no reliable signal for it, and inventing
    one would be worse than naming the gap."
  - "`mergeStateStatus` UNKNOWN (GitHub still computing) is skipped rather
    than guessed at. A PR that stays UNKNOWN is never helped; that is the
    safe direction and it is visible in the receipt's skip_reasons."
grader: |
  Independent verification by the S12 conductor (Opus 5), not the implementer
  that wrote it: the diff was read, the 20 tests re-run, the live dry-run
  executed against the real open PRs, and `get_conflicting_files()` exercised
  directly against a real DIRTY PR — the one path the dry-run does not reach.
budget: 1 implementer lane + conductor gate; no council (a scoped cron organ)
pii: none
