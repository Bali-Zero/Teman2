task: >-
  PR3a of the /dynamic-workflow coach-protocol build (MANDATE-builder.md, owner ruling Zero
  2026-09-18), following PR1a (#6753), PR1b (#6756), PR2a (#6757), PR2c (#6762) and PR2d
  (#6766). Team-lead's 2026-09-18 addendum split the original PR3 scope three ways: this PR
  (3a) ships the two lints only — `scripts/lint_workflow_script.py` (RULE 1 model pin, RULE 2
  no self-styled `gate` label, RULE 3 bounded rounds, two documented exemptions for a
  provenance-wrapper call and a bounded for-of/for-in loop) and `scripts/lint_model_cards.py`
  (5 rules: tagged claim bullets, checkable MEASURED: paths, freshness, roles_allowed subset,
  seat resolves via dynamic_workflow.py's own FAMILY_MAP/_SEAT_ALIASES, imported read-only).
  Per this repo's own convention (test_lint_asyncpg_except_completeness.py's
  test_main_exit_0_on_clean) a new lint must leave the live repo GREEN, not just pin known
  violations — running lint_workflow_script.py against the live infra/workflows/*.js
  surfaced two real findings in saetta.js, both fixed here: a self-styled `gate:${task.key}`
  label renamed to `signoff:` (7 matching occurrences in its own test mock,
  infra/workflows/tests/test-saetta.mjs, updated alongside it), and an uncapped Run-phase
  scheduler while-loop, now bounded by ROUNDS_CAP plus a zero-progress guard. Also adds the
  first real example card (docs/arsenal/cards/kimi-code__kimi-for-coding-highspeed.md),
  guilt+innocence fixtures under scripts/tests/fixtures/{lint_workflow_script,lint_model_cards}/
  (one violation per file, following the docs_audit/ fixture convention — standalone
  scripts/lint_*.py scripts are not registered in infra/guard-conformance/), and pytest
  wrappers that run each lint against its own fixtures AND the live repo paths. Does not touch
  scripts/dynamic_workflow.py or its own tests (read-only import only, per this mandate's
  explicit constraint).
lane: infra/dynamic-workflow-3a
machine: M5
date: 2026-09-18

gear: 2
gear_reason: >-
  Deterministic floor 2, source `size`: `python3 scripts/evidence_pack_lint.py --print-floor`
  with CI's own three inputs (changed-files, numstat, workflow-patch over
  origin/main...HEAD) returns 2. Churn (963 added / 8 deleted across 20 files) sits above
  SIZE_GEAR2_THRESHOLD (400) and well below SIZE_GEAR3_THRESHOLD (1828). No hot-zone path: the
  diff touches only scripts/, infra/workflows/, docs/arsenal/cards/ and
  scripts/tests/fixtures/ — no .github/workflows/ file and no HOTZONE_PATTERNS match. Most of
  the size is the requested deliverable itself (two full lints with docstrings + two full
  fixture trees + two pytest wrappers, all explicitly asked for in one PR); the only
  unplanned growth is the saetta.js rename + round-cap (~34 net lines), forced by this repo's
  own "a new lint leaves the live repo green" convention.

appetite:
  wall_clock_hours: 2.5
  adversarial_rounds: 1

acceptance:
  A1: >-
    `lint_workflow_script.py` flags each of its 3 rules in isolation (missing `model:`,
    self-styled `gate` label, uncapped while/for in a phase() span) against a dedicated
    fixture, and stays clean on a fixture satisfying all three PLUS a regression-guard
    fixture for both documented exemptions (provenance-wrapper indirection, bounded
    for-of/for-in) — the two false positives found against the live repo (kbli-batch-a-lot.js,
    second-army.js) on 2026-09-18.
    probe: python3 -m pytest scripts/tests/test_lint_workflow_script.py -k "no_model or gate_label or uncapped_loop or clean_fixture or exemptions_fixture" -q
  A2: >-
    `lint_workflow_script.py` is green against the live infra/workflows/*.js tree, post-fix
    (saetta.js's `signoff:` rename and ROUNDS_CAP guard).
    probe: python3 scripts/lint_workflow_script.py
  A3: >-
    `lint_model_cards.py` flags each of its 5 rules in isolation (untagged bullet, unverifiable
    MEASURED: path, expired date, out-of-set roles_allowed, unresolvable seat), including the
    exact 30-vs-31-day freshness boundary computed against real wall-clock "today" (not a
    pinned calendar date), and stays clean on a fixture satisfying all five.
    probe: python3 -m pytest scripts/tests/test_lint_model_cards.py -k "untagged_bullet or measured_bad_path or expired or bad_roles or bad_seat or clean_fixture or freshness" -q
  A4: >-
    `lint_model_cards.py` is green against the live docs/arsenal/cards/*.md tree (the new
    kimi-code example card).
    probe: python3 scripts/lint_model_cards.py
  A5: >-
    infra/workflows/tests/test-saetta.mjs's real execution path (its own AsyncFunction-wrapping
    harness over saetta.js's actual source) stays green through both fixes: 50 pass, 0 fail,
    1 skip.
    probe: node --test infra/workflows/tests/test-saetta.mjs

out_of_scope: >-
  SKILL.md rewrite and brief.template.md (PR3b, independent of this PR's two lints, buildable
  in parallel now that PR2d is merged) and the CI wiring that makes both lints a required
  check (PR3c, blocked on PR3a AND PR3b both merged) — per team-lead's 2026-09-18 addendum
  splitting the original PR3 scope three ways. This PR's own Bites line names PR3c as the CI
  consumer explicitly.

assumptions:
  - text: >-
      This repo's established convention is that a new lint must leave the live repo GREEN,
      not merely pin a list of known violations — confirmed by direct precedent inspection of
      test_lint_asyncpg_except_completeness.py's test_main_exit_0_on_clean, which asserts
      rc == 0 against the live codebase. Both new lints and their pytest wrappers follow this:
      real findings in saetta.js are fixed, not just documented.
    status: verified
    probe: sed -n '122,129p' scripts/tests/test_lint_asyncpg_except_completeness.py
  - text: >-
      Standalone scripts/lint_*.py scripts are not registered in infra/guard-conformance/ —
      that directory's own convention is for guards wired into a different call path. The
      correct fixture convention for this shape of lint is scripts/tests/fixtures/<name>/ with
      a repo/ mirror subtree and a README.md documenting one triggered rule per file, matching
      scripts/tests/fixtures/docs_audit/.
    status: verified
    probe: cat scripts/tests/fixtures/docs_audit/README.md
  - text: >-
      saetta.js's `gate:${task.key}` label is NOT dead/unread code — a prior-turn claim to the
      contrary was wrong and was caught by re-verification this session.
      infra/workflows/tests/test-saetta.mjs pattern-matches this exact label prefix in its own
      mock (options.label.startsWith("gate:"), options.label === "gate:upstream"), and actually
      EXECUTES saetta.js's real source via an AsyncFunction wrapper — so the rename required
      updating both files together, confirmed green via node --test before and after.
    status: verified
    probe: grep -n '"gate:\|signoff:' infra/workflows/tests/test-saetta.mjs
