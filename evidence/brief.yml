task_id: garuda-magic-link-consume-0828
gear: 3
l_level: L2
gate_class: opus
objective: |
  Make the GARUDA VOA passwordless account reachable. `POST /api/visa/voa/auth/sessions` —
  the exchange that mints the `garuda_session` account cookie — had ZERO callers anywhere in
  `apps/mouth`, while `upload/api-client.ts` and `orders/api-client.ts` both assume that
  cookie already exists. The entire authenticated half of the funnel (document upload, order,
  tracker — steps 3-6 of the VOA mandate) was therefore gated behind a cookie no code path
  could produce.

  The emailed link was worse than merely absent. `GARUDA_MAGIC_LINK_BASE_URL` is set nowhere
  on Fly, so the placeholder default applied and every link ever sent delivered its recipient
  to `/visa/voa` — the funnel's FIRST page, which reads neither `result_id` nor `magic_token`
  — with an unread single-use credential trailing in the URL.

  Gear 3 by PATH, deterministically: `.github/workflows/**` is hot-zone, so the floor is 3
  regardless of the diff's size. Recomputed from the actual changed-file list — receipt in
  the pack. The workflow file is in scope and cannot be split out to dodge the floor: it
  hardcoded the same placeholder base URL, so correcting only the code default would have
  been a no-op the arming workflow overwrites.
constraints:
  - "The token is SINGLE-USE and the replay path returns 204 with NO second `Set-Cookie`
    (`garuda_portal_auth.py:381-450`). Nothing may redeem it on a GET: mail clients and link
    scanners issue unsolicited GETs on emailed links, and a scanner that redeems first leaves
    the customer with an invalid link."
  - "The token must not reach any third party. This is a URL-shaped exposure, not a
    per-vendor one: it must be answered structurally, not by patching the vendors this
    session happens to think of."
  - "Route handlers do NOT run layouts, so `visa/voa/layout.tsx`'s `notFound()` dark-launch
    gate does not cover them. Every new route handler re-checks `GARUDA_PUBLIC_ENABLED`
    itself or it is the one VOA surface alive in production while the funnel is dark."
  - "The account cookie's attributes are the backend's runtime choice
    (`get_cookie_domain()` / `get_samesite_policy()`). Forward the upstream `Set-Cookie`
    verbatim; never reconstruct it, which is a copy that silently goes stale."
  - "Fix the FAMILY: the base URL lives in the code default AND in `garuda-arm.yml`. One
    without the other is a no-op."
  - "Do not weaken any check. The reds this PR drew are answered by supplying evidence and by
    declaring the new routes to the sitemap guard, never by touching a gate."
acceptance:
  - "A human clicking the emailed link ends up authenticated on `/visa/voa/upload/{resultId}`
    with a `garuda_session` cookie the backend minted."
  - "No rendered document ever has the token in its URL or its markup — so neither Google
    Analytics nor the client Sentry SDK can observe it."
  - "A GET on the emailed link redeems nothing; only a POST from a human gesture does."
  - "A 204 without an account cookie NEVER results in a redirect to an authenticated page."
  - "With `GARUDA_PUBLIC_ENABLED` unset or 'false', every new surface 404s — including the
    two route handlers, which no layout protects."
  - "The pending-token cookie is expired on every path out of the exchange."
consumer_map:
  - "`apps/mouth/src/app/visa/voa/upload/api-client.ts` and `orders/api-client.ts` — the two
    surfaces that ASSUME `garuda_session` exists. They are the reason this PR exists; neither
    is modified."
  - "`apps/mouth/src/app/api/[...path]/route.ts` — the same-origin proxy the exchange is
    called through. Measured (receipt) to forward upstream `Set-Cookie` verbatim for every
    path except `/api/auth/login`."
  - "`apps/mouth/src/app/layout.tsx:289` + `components/analytics/RouteChangeTracker.tsx:33` —
    the GA surfaces that made a PAGE at the token URL a leak. NOT modified: the fix removes
    the page rather than special-casing the vendor."
  - "`apps/backend-rag/backend/services/garuda_portal/magic_link_store.py` — builds the
    emailed link; its default base now names the redeeming route."
  - "`.github/workflows/garuda-arm.yml` — writes `GARUDA_MAGIC_LINK_BASE_URL` to Fly. Same
    correction, or the code default is overwritten at arming time."
  - "`apps/mouth/src/app/sitemap.test.ts` — enumerates static `/visa/**` routes from the tree
    and demands each be listed or named. Three new routes declared unlisted."
  - "`apps/backend-rag/backend/app/routers/garuda_portal_auth.py` — the contract consumed.
    NOT modified."
risks:
  - "This PR does NOT make the product live. `GARUDA_PUBLIC_ENABLED` is off on Vercel, so the
    whole `/visa/voa` subtree still 404s to visitors by design. What lands is a correct
    surface, not a flipped launch."
  - "Residual and deliberately NOT claimed closed: the token is in the URL of one first-party
    GET, so it can appear in Vercel's access log and in a server-side Sentry transaction.
    Inherent to any emailed link. `sentry.server.config.ts` was NOT audited for query
    scrubbing — declared, not silently assumed clean."
  - "A `.github/workflows/` diff is CODEOWNERS-TIER1 and auto-merge-OFF class. Merged by the
    session after gates are green and the Gear-3 verdict is posted, never armed with --auto."
  - "The end-to-end journey has NOT been walked in a browser, because the funnel is dark on
    Vercel and this session cannot flip that flag. Every claim here is a unit/mutation proof
    or a live API probe, never a rendered-page proof."
grader: |
  Independent verification by this session against production endpoints and against the repo's
  own linters, plus one adversarial subagent (spalla-review) dispatched to BREAK the diff. That
  refuter found the Google Analytics leak in the design this session had already committed and
  called safe, and a second real defect (a cookie-presence check where a cookie-NAME check was
  required). Both are fixed in commit 2 of this PR; both are recorded in dissent. Generator !=
  grader: the session that wrote the diff does not post the Gear-3 verdict.
