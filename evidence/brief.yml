objective: >-
  PR #7342 round-2 FIX-FIRST correction (review_7342_r2_out.txt, head
  cce93510cd) for T3's schema+guard PR-1 — last correction round per an
  exact spec addendum. Floor is 2 on SIZE alone, unchanged from round 1 —
  no hot-zone path hit, no new auth/route/schema-on-Fly surface. Round 1's
  four findings were confirmed cured; round 1's own column-check was itself
  incomplete: _REQUIRED_COLUMNS covered only the four ALTER-added columns,
  and information_schema.data_type reads a DOMAIN over text as "text" (its
  base type), so a core column with the wrong type, a missing core column,
  or a domain swapped in for a declared type all passed --init-schema
  silently. Fix per the addendum: _REQUIRED_COLUMNS is now the single
  source of truth for EVERY column of both tables (name, Postgres type,
  NOT NULL) as declared in team_promises.sql, cross-checked by a new unit
  test that parses the SQL file and asserts every declared column appears
  in the constant (and vice versa). verify_required_columns() now queries
  pg_attribute directly (attrelid = to_regclass(...)::oid, attnum > 0, NOT
  attisdropped) and compares atttypid = '<type>'::regtype — which fails for
  a domain, since its atttypid is the domain's OWN oid, never the base
  type's (verified against a live Homebrew Postgres 17 cluster before
  writing the fix). information_schema is no longer used anywhere in this
  script. A mismatch raises SchemaMismatchError('<table>.<column>'),
  allowlist-validated, inside the same transaction as the DDL and both
  index checks — rollback on any gap, never OK on an incomplete/mistyped
  schema. Both round-2 findings red-proved against cce93510cd in an
  isolated scratch copy (never `git checkout --`): old code's ALTER-only
  contract never even had "message_id" as a key, so a wrong-type or
  missing CORE column could never be caught; and a domain-over-text column
  reads as plain "text" via information_schema, so old code's string
  comparison ('text' == 'text') accepted it. The opt-in real-Postgres
  companion now exercises a genuine domain-over-text mismatch AND an
  index-only mismatch (columns untouched) against a real cluster —
  verified passing on M5 (Homebrew postgresql@17) before this push.
scope:
