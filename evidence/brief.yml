task_id: ops-spalla-hook-secret-leak
gear: 3
l_level: L3
gate_class: opus
objective: |
  `.claude/hooks/codex-spalla-trigger.sh` logs `tool_input.command` — the full Bash command string,
  truncated to 200 chars — to `~/logs/codex-spalla-trigger.jsonl`, and never chmods it. A Bash tool
  call can carry a credential in argv, so that log is secret-bearing BY CONSTRUCTION.

  Found live while hunting a different leak. Mode 0644 (world-readable), 83 MB, still being appended
  to. Magnitude, measured by RUN LENGTH rather than line count: 14 lines match the literal
  `sk-ant-oat`, and the histogram of runs is 8x10, 5x13, 1x46, 1x87, 1x108 — so 13 are the bare
  literal with no secret material and 3 runs carry any. Of those 3, magnitude by END POSITION inside
  the 200-char logged field is 1 whole token + 2 truncation-clipped partials, not "2 whole tokens":
  the 108-char run ends at char 151, well short of the field's end (a complete token); the 87-char
  and 46-char runs both end EXACTLY at char 200, the truncation boundary itself — that is what a
  token cut off mid-value by truncation looks like, not proof of two more full-length secrets.
  Counted, never printed.

  The first draft of this brief said "11 real values, 108 chars each" — a line count restated as a
  value count, and the maximum restated as "each". A later draft said "2 whole tokens" — a
  truncation artifact restated as two more complete secrets. The Gear-3 gate caught both. Recorded
  rather than quietly corrected, because the brief claims run-length discipline as its own method
  and then did not apply it fully, and because the rotation decision hangs on this number.

  Fix: two independent defenses plus a guilt/innocence proof, and registration so the proof
  actually runs.
constraints:
  - "The live file was chmod-ed 0600 immediately, outside this diff. That is containment, not the
    fix — a future rotation or copy recreates the exposure."
  - "Redaction must happen BEFORE truncation: a 200-char window can slice a token and leave a
    usable prefix."
  - "The redactor must treat the keyword as a SEGMENT on BOTH sides — delimited by `_`/`-`/string
    start-or-end, not a bare substring match. `TOKEN=` alone catches CLAUDE_CODE_OAUTH_TOKEN= and
    MISSES CLAUDE_CODE_OAUTH_TOKEN_1= (missing wildcard AFTER); a first fix that required >=1 char
    BEFORE the keyword caught CLAUDE_CODE_OAUTH_TOKEN_1= and missed a bare TOKEN= (missing wildcard
    BEFORE) — that exact off-by-one, in both directions, is how a probe printed four tokens while
    believing it redacted. The segment must ALSO be closed on the right so `keyfile=`/`KEYSPACE=`/
    `monkey=patch` do NOT match — a keyword substring is not the same as a keyword segment, and a
    matcher wide enough to catch every guilt shape above must not also eat innocent command text
    (cicatrix #3, guard-over-match) — the previous version of this hook did exactly that, redacting
    8 of 20 ordinary commands (0.56%) in a 333k-line log corpus. `Authorization: Bearer <value>` is a
    separate shape entirely — no keyword in a variable NAME at all — and needs its own rule."
  - "No behaviour change to the hook's trigger logic: same rules, same stderr nudge, same fail-open
    posture. Only the log's mode and the logged value change."
acceptance:
  - "11 guilt cases (OAuth token, SUFFIXED variable name, GitHub PAT, PREFIX-form/lowercase/flag-form
    variants, header form, Bearer/Authorization) leave no secret in the log."
  - "9 innocence cases — an ordinary command, plus 8 forms that contain a TOKEN/KEY/SECRET/etc
    substring without it being a delimited segment (camelCase, no-delimiter compounds, dot-attribute
    access, a bare `KEYS` command name) — are logged intact with no spurious REDACTED marker."
  - "A freshly created log is mode 0600, not 0644."
  - "A targeted mutation removing ONLY the suffix wildcard makes exactly the suffixed-var case fail
    — the test is specific, not noisy."
  - "The test is actually EXECUTED by a workflow, not merely referenced."
consumer_map:
  - "`.claude/hooks/codex-spalla-trigger.sh` — runs on every PostToolUse event in this repo, via
    `${CLAUDE_PROJECT_DIR}/.claude/hooks/` in settings.json. No HOME fork exists (checked)."
  - "`~/logs/codex-spalla-trigger.jsonl` — the leak surface; already contained at 0600."
  - "`.codex/hooks/codex-spalla-trigger.sh` — an identical UNTRACKED copy exists in the main
    checkout only. Not in this diff because git does not track it; flagged in residual_risks."
risks:
  - "The already-leaked material is NOT invalidated by this diff: 1 whole-token-length run (108
    chars) plus 2 truncation-clipped partials (87 and 46 chars, each ending exactly at the 200-char
    boundary). Rotation is a credential action only the owner can perform; containment (0600)
    is done, rotation is not."
  - "hook-innocence-gate.yml's path filter does not cover `.claude/hooks/` at all. Widening it is a
    behaviour change with its own blast radius and is deliberately NOT done here."
  - "OVER-MATCH (cicatrix #3): the segment-anchored keyword match has no notion of whether a value is
    actually secret — a legitimately-named non-secret value using a `_KEY=`/`_TOKEN=`-suffixed
    identifier redacts just as hard as a real credential. The guilt/innocence corpus proves only the
    named forms; it does not prove no such legitimately-named value anywhere can still trip it."
grader: independent-review-session (fresh context, not the author) + a targeted mutation re-run by the orchestrator
budget: ~2 subagents, no council
pii: none
