objective: |
  PR #4653 (branch `agent/nuzantara/backend-rag/ros-v1-p04-d1-outcome-event`, DRAFT). Ships the
  canonical `OutcomeEvent` contract from the frozen CONTRACTS.md section 16 as part of Research OS
  Packet 04 / D1 (governance receipts + canonical objects). This is one of four kinds in the D1
  family (OutcomeEvent here; WorkflowRun/VerificationReceipt/ConductorHandoff landed separately,
  MetricProfile/MetricResult landed as #4637) — the split exists to keep each PR review-sized, per
  the commit message on the sibling WorkflowRun/VerificationReceipt/ConductorHandoff work
  ("The fourth kind, OutcomeEvent, ships separately... because splitting keeps this PR under
  review-sized bounds").

  Adds, verified from `git diff c4242cd44..HEAD` (merge-base = #4637, MetricProfile/MetricResult):
  - `research_os/models/outcome_event.py` (256 lines): a Pydantic v2 `FrozenCoreModel` with 12
    nested sub-models (`SubjectRefs`, `OutcomeWindow`, `OutcomeQuality`, `OutcomeCohort`,
    `OutcomeClassification`, `OutcomeEventLineage`, plus 8 typed ref models), an
    `object_hash` round-trip validator, a `window.ended_at > window.started_at` ordering check, and
    a joint-presence validator on `metric_profile_ref`/`metric_result_ref` (both or neither) — those
    two fields bind to the `MetricProfileRef`/`MetricResultRef` kinds that landed on main in #4637.
  - `research_os/schemas/outcome_event.schema.json` (816 lines): the generated Draft 2020-12 JSON
    Schema for the model above.
  - 13 fixture files under `fixtures/outcome_event/` (3 valid, 5 invalid pairs — each invalid
    fixture paired with an `.expect.json` naming its exact rejection reason code).
  - `apps/backend-rag/backend/tests/unit/research_os/test_outcome_event.py` (130 lines, 11 test
    functions): fixture round-trip, exact-reason-code rejection, unknown-field rejection,
    object_hash-mismatch-cannot-bypass, frozen-immutability, and the joint-presence invariant.
  - Registration of `OutcomeEvent` in `cli.py::CONTRACT_MODELS`, `models/__init__.py::__all__`,
    and `schemas/__init__.py::SCHEMA_MODELS` (2-line additions each, alongside existing entries —
    the 13 other already-registered kinds, including `workflow_run`/`verification_receipt`, were
    NOT touched by this diff; confirmed byte-identical between merge-base and HEAD, see receipts).

  The model's own module docstring flags SEVEN open interpretive judgment calls against the frozen
  spec prose (no invented `revocation_receipt_ref` field on `subject_refs`; `value` typed as `Any`
  with no shape hint in the spec; `classification.aggregation_level` as an unconstrained
  non-empty string; `quality.completeness` as an unconstrained float, not clamped 0..1;
  `source_system` as a local closed `Literal` with no matching section-3 registry row;
  `window` ordering enforced by analogy, not verbatim-stated; the "suppress cohorts <10" and
  "side-effect binding" invariants deliberately NOT enforced as single-object validators) —
  flagged for Packet 04 to rule on, not silently resolved here. This brief does not re-litigate
  those calls; it reports that they exist and are already on record in the source file a future
  reader will open.

  SCOPE OF THIS SPECIFIC REWRITE (2026-08-23): `evidence/brief.yml` and `evidence/pack.yml` are
  fixed root-relative paths that every Gear>=2 PR in this repo rewrites (cicatrix-superscar family
  #9, state-schema mutation drift — a fixed-path collision class actively being observed fleet-wide
  today). On this branch, both files were found to still describe foreign work — PR #4592
  (`ops-visaoracle-wrapper-header-0823`, a 2-line LaunchAgent wrapper comment fix), inherited
  unchanged from whatever content was on `origin/main` at this branch's merge-base and never
  overwritten by either commit in this branch's own history. This rewrite replaces that inherited
  content with a truthful description of PR #4653 and adds the `lanes:` block (D3 lane-declaration
  rule, `scripts/evidence_pack_lint.py::check_lanes_build_seat_diversity`), verified against
  `origin/main`'s current lint. No functional code changes accompany this rewrite — evidence files
  only.
