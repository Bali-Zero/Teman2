task_id: ops-spalla-hook-secret-leak
gear: 3
l_level: L3
gate_class: opus
objective: |
  `.claude/hooks/codex-spalla-trigger.sh` logs `tool_input.command` — the full Bash command string,
  truncated to 200 chars — to `~/logs/codex-spalla-trigger.jsonl`, and never chmods it. A Bash tool
  call can carry a credential in argv, so that log is secret-bearing BY CONSTRUCTION.

  Found live while hunting a different leak: 11 real `sk-ant-oat...` values, 108 chars each, mode
  0644 (world-readable), 83 MB, still being appended to. Measured by counting and by run-length,
  never by printing; the run-length check is what separated the real leak from a harmless 30-char
  test fixture that also matched.

  Fix: two independent defenses plus a guilt/innocence proof, and registration so the proof
  actually runs.
constraints:
  - "The live file was chmod-ed 0600 immediately, outside this diff. That is containment, not the
    fix — a future rotation or copy recreates the exposure."
  - "Redaction must happen BEFORE truncation: a 200-char window can slice a token and leave a
    usable prefix."
  - "The redactor must match a wildcard AFTER the keyword. `TOKEN=` catches
    CLAUDE_CODE_OAUTH_TOKEN= and MISSES CLAUDE_CODE_OAUTH_TOKEN_1= — that exact off-by-one is how a
    probe printed four tokens while believing it redacted."
  - "No behaviour change to the hook's trigger logic: same rules, same stderr nudge, same fail-open
    posture. Only the log's mode and the logged value change."
acceptance:
  - "Three guilt cases (OAuth token, SUFFIXED variable name, GitHub PAT) leave no secret in the log."
  - "Innocence: an ordinary command is logged intact with no spurious REDACTED marker."
  - "A freshly created log is mode 0600, not 0644."
  - "A targeted mutation removing ONLY the suffix wildcard makes exactly the suffixed-var case fail
    — the test is specific, not noisy."
  - "The test is actually EXECUTED by a workflow, not merely referenced."
consumer_map:
  - "`.claude/hooks/codex-spalla-trigger.sh` — runs on every PostToolUse event in this repo, via
    `${CLAUDE_PROJECT_DIR}/.claude/hooks/` in settings.json. No HOME fork exists (checked)."
  - "`~/logs/codex-spalla-trigger.jsonl` — the leak surface; already contained at 0600."
  - "`.codex/hooks/codex-spalla-trigger.sh` — an identical UNTRACKED copy exists in the main
    checkout only. Not in this diff because git does not track it; flagged in residual_risks."
risks:
  - "The 11 already-leaked tokens are NOT invalidated by this diff. Rotation is a credential action
    only the owner can perform; containment (0600) is done, rotation is not."
  - "hook-innocence-gate.yml's path filter does not cover `.claude/hooks/` at all. Widening it is a
    behaviour change with its own blast radius and is deliberately NOT done here."
grader: independent-review-session (fresh context, not the author) + a targeted mutation re-run by the orchestrator
budget: ~2 subagents, no council
pii: none
