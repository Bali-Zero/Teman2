task_id: s12-c1-merge-gate-integrity-watch
gear: 3
l_level: L1
gate_class: opus
objective: |
  Silence an alarm that has been crying since the day it was armed — without
  silencing the thing it exists to hear.

  `merge-gate-integrity-watch` has failed on EVERY push to main. Twelve runs
  sampled on 2026-08-23: twelve reds, 100%. The mandate that sent me here
  named ONE cause (squash merges producing a SHA with no pre-merge check runs
  of its own). Reading the script and reproducing it locally found that cause
  to be WRONG and three others to be real. This is the honest version: the
  hypothesis I was handed did not survive contact with the code, and the fix
  is not the fix that was ordered.

  DEFECT 1 — the exit code was never captured (superscar #2 / W101). The step
  ran `python3 ... > /tmp/verdict.json` then `rc=$?`. The runner's default
  shell is `bash --noprofile --norc -e -o pipefail`, and `set -uo pipefail`
  cannot cancel that `-e`: the probe exiting non-zero aborted the step BEFORE
  `rc=$?`, so $GITHUB_OUTPUT never received `rc`, the classify step read
  rc="" and fell through to its `*)` arm. This is worse than noise. A REAL
  branch-protection violation (rc=1, tier p0, a Telegram page) was
  indistinguishable from a broken probe (rc=3, tier digest). The alarm was
  not merely crying — it was crying in the wrong key, and had the gate ever
  actually failed, the finding would have arrived as routine digest traffic.
  The `cat /tmp/verdict.json` never ran either, which is exactly why 26 red
  runs carried no diagnosis anyone could read.

  DEFECT 2 — the required-context list is unreadable in CI. The probe reads
  `branches/main/protection`, which requires repo-ADMIN scope; `administration`
  is not among the permissions a workflow GITHUB_TOKEN can be granted at all.
  That call raised on every run, and every raise maps to CANNOT-VERIFY. The
  repo ALREADY checks the same list in at infra/required.d/contexts.json.

  DEFECT 3 — and this one is why fixing 1 and 2 alone would have made things
  WORSE. "skipped" was treated as a violation. Path-filtered jobs conclude
  skipped and branch protection accepts them. With 1 and 2 fixed and 3 left
  alone, 26 ignorable digest reds/day become 26 p0 Telegram pages/day, one
  per docs-only merge. The alarm would have gotten louder and more wrong.
constraints:
  - "Do not weaken the detector. Every guilt case it could catch before, it
    must still catch: absent job, failed/cancelled/timed_out/action_required
    conclusion, zero-duration phantom, completion after the merge decision,
    zero merge_group runs at all, unresolvable SHA."
  - "Widen the passing set by EXACTLY what was measured, and no further.
    `neutral` is widely said to satisfy required checks too; it was NOT
    measured on this repo and therefore stays a finding (superscar #3 — every
    scar in that family is a guard widened past its evidence)."
  - "The snapshot is a FALLBACK, never a replacement: the live API is tried
    first so a privileged caller keeps ground truth, and the verdict records
    which source answered."
  - "Never let an empty required-context list count as clean. An empty list
    makes every commit vacuously green — a fail-OPEN detector, which is the
    W84 'green but dead' shape this probe exists to catch elsewhere."
  - "The workflow stays a SIGNALER: not required, never blocking, never
    auto-acting. Unchanged by this PR."
acceptance:
  - "On the 10 most recent first-parent pushes to main, the probe returns
    CLEAN or VIOLATION — zero CANNOT-VERIFY. (Was: 100% CANNOT-VERIFY.)"
  - "Guilt preserved: a fabricated SHA still returns CANNOT-VERIFY; the
    #3227 guilt fixture still returns VIOLATION."
  - "The `|| rc=$?` idiom captures rc=3 under the runner's REAL shell
    (`bash -e -o pipefail`), where the previous idiom captured nothing."
  - "Tests both directions: skipped passes AND nothing else was widened."
consumer_map:
  - "`.github/workflows/merge-gate-integrity-watch.yml` — the only caller of
    the probe in CI; both its permissions block and its probe step change."
  - "`infra/required.d/contexts.json` — becomes load-bearing in CI for the
    first time (it was written by scripts/ci/snapshot_required_contexts.py
    for scripts/ci/check_required_workflow_conformance.py). Verified
    content-identical to live branch protection on 2026-08-23: 27 contexts,
    no diff either direction. Its staleness risk is a declared residual, in
    risks below — it is a real cost, not a hand-wave."
  - "`scripts/tg_notify.py` — receives the tier. This PR changes WHICH tier a
    given outcome maps to (that is the point of defect 1), not the gateway."
  - "The checkout step in the workflow — previously decorative for the probe
    step, now load-bearing, because the snapshot is read from the working
    tree. Named here so a future 'this checkout looks unused' cleanup cannot
    remove it silently."
risks:
  - "SNAPSHOT DRIFT, declared and NOT closed by this PR. If someone adds a
    required context in GitHub Settings and nobody regenerates
    infra/required.d/contexts.json, the probe verifies 27 of 28 and reports
    CLEAN on a commit it has not fully checked. This is a genuine narrowing
    of coverage — but measured against the status quo it is a strict
    improvement, because the status quo verified ZERO contexts and reported
    CANNOT-VERIFY 26 times a day. The honest framing: this trades a total
    blind spot that screams for a partial blind spot that is quiet. Closing
    it properly needs a scheduled snapshot-freshness check, which is a
    separate concern and is going to PENDING-ARMS rather than being smuggled
    into this diff."
  - "A required check that SHOULD have run but was skipped by an over-broad
    `paths:` filter now passes the probe. Mitigated, not eliminated: skipped
    contexts are reported in the verdict JSON under `skipped_contexts` and in
    the prose output, so they remain visible in the run log. Detecting an
    over-broad path filter is a different detector's job and is not claimed
    here."
  - "This PR touches `.github/workflows/`, so a mistake in the probe step's
    shell could break the workflow silently. Countered by proving the idiom
    under the runner's actual shell rather than reasoning about it."
grader: |
  Independent adversarial refuter on fresh context, NON-Anthropic seat
  (Kimi K3), explicitly tasked to refute rather than review, and pointed at
  the four surfaces most likely to be wrong (skipped-hole, snapshot
  fail-open, the rc idiom under signals, tests-passing-for-wrong-reasons).
  Seat diversity is DEGRADED and declared: Codex was live-probed this session
  and is AUTH_DEAD ("refresh token was revoked"), GLM CRED_UNAVAILABLE, agy
  TIMEOUT — one non-Anthropic family available, not two.
budget: 1 refuter seat, no council (a three-defect CI fix does not warrant one)
pii: none
