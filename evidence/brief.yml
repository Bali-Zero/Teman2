task_id: organism-session-declarations
gear: 2
l_level: L2
gate_class: opus
objective: |
  Build the REAL detector for "an autonomous run started, died, and every gauge stayed green"
  (superscar #2), replacing the prose-parsing verdict that PR #4646 was forced to ship as
  informational-only.

  WHY THE PREVIOUS ONE FAILED, because it constrains this design. That detector read a
  session's own prose and asked "did it run as long as it declared?". Against the live fleet it
  returned ten rows and all ten were HEALTHY healer ticks: "loop 4h" in a mandate's TITLE is the
  cron cadence (com.nuzantara.healer.4h.plist carries StartInterval 14400), not the session's
  runtime, and no regex separates "this document declares its own runtime" from "this document's
  title names a schedule" — three narrowing passes each traded one error direction for the other.

  THE SECOND TRAP, found while designing this one and worth recording because it is the obvious
  design: measuring real duration against the wrapper's own number would have rebuilt the same
  false positive. MAX_WALL_S=3300 is a CAP, not an expectation. A tick that finishes its work in
  11 minutes against a 55-minute cap is CORRECT.

  So this measures neither prose nor duration. It measures whether the runner came BACK: a
  two-phase commit. open() before the work (pid + process start-time, the wrapper's own cap, and
  the cron cadence in a SEPARATE field so the two numbers can never again collapse into one),
  close() stamped on the way out. A declaration still OPEN past its own cap whose recorded
  process is gone from the OS process table means the runner never returned — an OBSERVATION,
  not an inference, which is precisely why the healer is permitted to alarm on this and was not
  permitted to alarm on its predecessor. It cannot fire on a healthy short tick, because a
  healthy tick closes its own declaration.

scope:
  in:
    - "scripts/session_declaration.py — the protocol (open/close/scan/prune) + selftest"
    - "scripts/tests/test_session_declaration.py — 33 hermetic guilt+innocence tests"
    - "infra/healer/healer-run.sh — first producer (open before spawn, stamp after wait) and first consumer (receptor 7 + a HUNG check at the anti-overlap lock)"
    - "infra/healer/HEALER-MANDATE.md — receptor 7 documented for the spawned session"
  out:
    - "Retiring DECLARED-SPAN-UNMET from scripts/fleet_sessions.py — 18 sites in the module and 26 references in its tests. Its own concern, its own PR. Harmless meanwhile: it is already informational-only and no organ routes on it."
    - "Escalating the healer watchdog from SIGTERM to SIGKILL. The adversarial review surfaced it as a real gap while analysing hangs; it changes the healer's kill semantics and is a separate concern. This PR DETECTS the hang instead."
    - "Passing --session-id to join a declaration to a transcript. Measured: claude-cascade.sh collects EXTRA_ARGS after `--` and replays them on every seat attempt, so a caller-supplied session id would collide across retries. session_id stays an optional, non-load-bearing field."
    - "Wiring the other ~20 spawners in the fleet. One producer proves the protocol; a sweep is a migration."

risks:
  - "The detector alarms, unlike its predecessor. A false positive here costs a paid LLM session every 4h, so the innocence half of the suite is pinned with the real measured numbers written out literally rather than read back from the module — a test that derives its expectation from its subject agrees by construction."
  - "The store is per-host and unreplicated. A machine whose declarations nobody scans is not covered; this PR wires the Mini healer only."
  - "prune() deletes records. It never touches OPEN ones at any age (that is the finding itself), only CLOSED past 7d and abandoned past 30d, and it runs at open() rather than on the read path."
