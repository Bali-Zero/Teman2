# Floor recomputed WITH this brief staged (scripts/contract_verify.py --head
# HEAD --json): 2, "brief present" PASS — the brief's own presence is what
# moves the floor from 1 to 2 (a test-only diff with no brief floors at 1),
# so gear is declared at the computed floor.
objective: >-
  MANDATE-vo.md, Slice A2-G ("the negation families are GENERATED, and an
  omission is impossible by construction"), opened after PR-R (#6919,
  MERGED) shipped the render. Three gates went red on ONE cause — a
  hand-written regex alternation that omitted a token, three times, each
  time a different one: "does not change" -> "do not change" -> "don't
  change" (GATE-A2C-REPORT-6859.md OBS-A2c-1). The diagnosis is the
  CONSTRUCTION, not the token: three independent hand-written families each
  re-enumerated the same auxiliary/negation/verb tokens, so a fix to one
  never propagated to the others. This PR replaces the three EN negation
  families in the notices guard (engine-adapter.test.ts) with
  buildNegationPatterns(), built from one AUXILIARIES/NEGATIONS/EFFECT_VERBS
  list each plus an IRREGULAR_CONTRACTIONS map — a token now lives in
  exactly one place — and mirrors the same construction for ID
  (["tidak","tak"], closing OBS-A2c-8). TEST-ONLY: no production file
  changes, nothing reaches a visitor, not on the release path.
scope:
  - >-
    `apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/engine-adapter.test.ts`
    — AUXILIARIES (11), NEGATIONS (4), EFFECT_VERBS (6),
    IRREGULAR_CONTRACTIONS (3 keys / 4 forms), ID_NEGATORS (2), ID_VERBS (6);
    `buildNegationPatterns()` and `buildIdNegationPattern()` replace the
    three hand-written EN families and the one ID family; a cardinality pin
    test (G1); two property tests enumerating the full EN 11x4x6 (276
    synthesised forms) and ID 2x2x6 (24 forms) products against the real
    scan; three new literal GUILT_FIXTURES rows (won't/matter/tak
    berpengaruh) tied to the four guilt mutations in the PR body. Every
    other family, both allowlist entries, all 16 historical fixtures, the
    innocence test and the iteration pin are unchanged.
  - >-
    `evidence/brief.yml` — this file, PR-G's own (PR-R's own already merged
    on #6919).
constraints:
  - >-
    No production consequence: only the test file and this brief move. R4
    (#6919/PR-R) already proved the 16 fixtures RED and 28 GREEN; this PR
    adds 3 fixtures (total 19 RED, 28 GREEN) and must not move either axis —
    a PR that generates new families and drops one historical fixture has
    moved the axis again (MANDATE-vo.md G7).
  - >-
    G1: a token (auxiliary, negation, verb) appears in exactly one list; the
    cardinalities are pinned by LITERAL (`toHaveLength`), not derived from
    the lists, because the generator and the property test read the SAME
    lists and a mutation would otherwise shrink both sides symmetrically and
    stay green — the exact shape that produced the three reds this slice
    exists to close.
  - >-
    G4: over-generation is allowed (e.g. "does never affect" is not English;
    generating it is harmless); the only fence on breadth is the innocence
    test — all 28 shipped strings stay GREEN.
  - >-
    GATE-A2D-REPORT-6919.md "Input for PR-G": 13 out-of-history evasions,
    disposed of row by row in the PR body — caught (widened apostrophe
    class, `tak` negator) or declared as a limit, never widened past what
    G1/G3/G5 specify, to keep this PR to the one test file.
