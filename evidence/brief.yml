task_id: bites-b-cut-0904
gear: 1
l_level: L2
gate_class: opus
# Measured, not guessed: `evidence_pack_lint.py --print-floor` over this PR's actual
# changed-file list (the 5 bites surfaces only) returns 1. An earlier draft of this
# PR also touched two .github/workflows/*.yml files to close an unrelated wiring gap
# (guard-conformance.yml/immune-enforcement.yml never watched the two bites YAML
# files) and that alone raises the floor to 3 - which would need a second council
# seat this lane does not have (codex is banned on this lane; no tp1-qwen3.8-max
# available). Split out: the workflow-wiring fix is deferred to a follow-up PR,
# named in this PR's body instead of silently dropped. See dissent/receipts below.
objective: >-
  Answer the line-count question PR #5673 left open. That PR cut bites_parse.py from
  1,462 to 1,127 lines and reported "target not met — 1,127 is not a few hundred",
  naming the only lever left: admit fewer binaries or carry fewer guards. RULED
  2026-09-04 b (Zero, Legge 5, relayed on #5673) answered: option b, fewer binaries,
  NEVER fewer guards. `observe:` now admits exactly TWO shapes — `python3
  scripts/<path>.py [literal args]` (in-tree, no `..`, no symlink escape, marked
  `bites-observable` in its own source) and `fly <read-only subcommand> [args]`
  (`status`, `releases`, `image show`, `machine list` only, `-a`/`--app` the only
  flag). `gh`, `curl`, `git` and `python3 -m pytest` are gone entirely — every escape
  found on this surface so far lived in one of the three binaries, and `python3 -m
  pytest` imports whatever `conftest.py` an unmerged branch happens to carry.

  This PR supersedes #5673 (kept open until this PR is proven, then closed): same
  module, same corpus, same test file, cut down to the ruled surface rather than
  merged as a wider one.
appetite:
  wall_clock_hours: 3
constraints:
  - >-
    Fixtures for the removed binaries FLIP from innocence to guilt, never deleted —
    the corpus is the record of what used to be allowed and now is not.
  - >-
    Keep the lossless discipline PR #5673 established: a differential over the
    ORIGINAL corpus entries (re-classified by the cut module) must show ONLY
    removed-binary/narrowed-fly-subcommand entries flipping to malformed — nothing
    else may change verdict for the same input text.
  - >-
    Never fewer guards on the two surviving shapes. Cutting a binary must not
    quietly cut a guard's OWN mutation-proof if that proof's fixture happened to use
    the removed binary as an incidental example — re-isolate it on an allowed head
    instead of accepting the loss.
  - Keep the `_StrictLoader` and its closed top-level key set exactly as is.
  - No new required context on main; no paid API; no LLM in the executor at all.
acceptance:
  - >-
    A1: `python3 scripts/ci/bites_parse.py --selftest` exits 0 over the full corpus;
    the count is reported honestly (see receipts), not padded and not pinned to a
    number future fixtures would turn into a ratchet.
  - >-
    A2: `python3 infra/guard-conformance/check_guard_conformance.py` reports the
    bites-parse surface with 0 violations.
  - >-
    A3: a mutation check (patch each `_guard_*` to a no-op, one at a time, and ask
    whether ANY corpus fixture's actual classification then disagrees with its
    declared one) shows every one of the nine guards still provably necessary
    against the corpus alone.
  - >-
    A4: the differential over the ORIGINAL 121 corpus entries shows only
    removed-binary/narrowed-fly flips to malformed, zero unintended verdict changes,
    zero deleted labels.
  - >-
    A5: a cross-family refuter dispatched on the cut, two-shape module either finds
    nothing after checking the flag lists, the path resolution and the fly
    subcommand table, or its finding is reproduced against the real guard functions
    before being applied.
dissent_process: >-
  One refuter seat this time (kimi-code/k3), not the three-plus of #5673 — the
  surface is narrower by construction (two shapes, nine guards, most of them
  unchanged). Its pass raised four findings, not one: brace-expansion defeating
  the observable-marker check, a subcommand-table match that ignored a third
  leading word, a positional argument hiding after a flag's own value, and the
  marker check accepting any file (not just a `.py` one) whose bytes happened to
  carry the marker string. Each was reproduced against the real guard functions
  before being applied — none taken on the seat's word; see journal.jsonl.
