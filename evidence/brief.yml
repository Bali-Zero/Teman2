task_id: ci-fastgate-off-critical-path-0823
gear: 3
l_level: L2
gate_class: opus
objective: >-
  The `Run core tests (fast gate)` step is written once but lives inside the
  `backend-shard` matrix job, so S11 (#4647) silently multiplied it by three.
  Move it to `backend-static` so it runs once and off the critical path,
  WITHOUT weakening the chain that makes a red core test redden the one
  required context, `Backend Tests (Python)`.
why_now: >-
  Measured on merge_group run 32632670541: 7s / 8s / 8s per shard, i.e. ~16s of
  duplicated runner time and ~8s on the critical path (critical path = slowest
  shard + fan-in). The same run missed the mandate's <=8 min per-run target by
  12-40s, so this single step is 20-65% of that miss. Ledgered in #4668.
constraints:
  - "The required context name `Backend Tests (Python)` must stay byte-exact — it is one of 27 required contexts in classic branch protection. Renaming it strands every queue entry (superscar #2 / W69)."
  - "The guilt chain must survive: `backend-static` is NOT a required context. If the fan-in's assert did not read `needs.backend-static.result`, moving the gate there would make a broken core test invisible — reproducing the exact defect S11 was built to avoid."
  - "Do not touch the concurrency block (scar tissue) and do not change the merge_group unscoped-selection semantic."
  - "No new dependencies, no paid runners, no self-hosted runners (public repo)."
  - "One PR, one concern: this moves a step. It does not delete the gate, and it does not attempt the separate open question of why merge_group shards run ~35% slower than PR-lane shards."
acceptance:
  - "actionlint clean on tests.yml, and the file still parses as YAML with all 11 jobs present."
  - "`scripts/tests/test_test_deps_declared.py` still passes — the guard S11 re-anchored across all three backend jobs must not be narrowed again by this move."
  - "`scripts/ci/test_shard_tests.py` (31 cases) still passes — the partitioner is untouched and must stay so."
  - "The fast gate runs green in a job with NO postgres/redis services and with DATABASE_URL/REDIS_URL unset, proven by execution rather than by reading the code."
  - "No orphan reference remains to the old receipt path `shard-receipts/test-results-core-<n>.xml`, and the core junit still reaches an artifact rather than vanishing."
  - "A live run shows the fast gate executing exactly ONCE, inside `Backend Static (Python)`, and the measured critical path (slowest shard + fan-in) is ~8s lower than the 381+111 baseline."
