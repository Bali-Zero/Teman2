task_id: queue-slim-0827
gear: 3
l_level: L1
gate_class: opus
objective: |
  Zero's direct order 2026-08-27 ("fallo andare in prod come primo, così la
  coda diventa velocissima"): stop advisory workflows from running on
  merge_group so each merge-queue entry spawns only the workflows that back
  the 11 required contexts. 24 workflows lose their merge_group trigger; the
  8 that emit the 11 required contexts keep it. Measured motivation: during
  the 2026-08-26 Actions outage recovery, ~50 runs per queue entry saturated
  runner capacity (500+ queued runs, 5-13 in progress) and entries died on
  the 90-minute check_response_timeout (#5052 ejected checks_timed_out at
  19:34Z) while the queue only ever waits on the 11 required.

  Gear 3 by PATH: `.github/workflows/*` is hot-zone (`HOTZONE_PATTERNS` in
  scripts/evidence_pack_lint.py) — deterministic floor, not author's choice.
  This pack was added in a follow-up commit after "Harness floor recompute"
  correctly failed the original head (hot-zone diff, no evidence/brief.yml).
constraints:
  - "DEADLOCK INVARIANT: every one of the 11 required contexts must still
    report on merge_group — a required context that never reports deadlocks
    the queue at the 90-minute timeout. KEEP set provably complete."
  - "No job logic changed anywhere — trigger-block edits only."
  - "Queue-mechanics watchers (merge-queue-watch, merge-gate-integrity-watch,
    main-push-failure-watch, main-red-breaker) untouched — none trigger on
    merge_group today."
acceptance:
  - "All 8 KEEP workflows still contain merge_group in on: at this head."
  - "None of the 24 slimmed workflows emits any of the 11 required contexts."
  - "check_required_workflow_conformance.py: 11 checked, 0 violations."
  - "scripts/tests/test_advisory_workflows_no_merge_group.py green (deadlock
    tripwire: parses YAML, asserts the 8 required-context workflows keep
    merge_group)."
