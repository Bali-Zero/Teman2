objective: >-
  Ledger row `kbli-page-prints-unverified-licensing-values-at-full-weight`
  (PENDING-ARMS, opened 2026-09-19 from the Gemini 3.1 Pro UX audit). The
  key-fact grid printed risk, licence and processing in `text-sm font-semibold`
  for a code whose licensing provenance the dataset does NOT verify, qualifying
  it with one `text-[11px]` line BELOW the grid — while the Foreign Ownership
  cell in the same grid REPLACED its value. MEASURED ON THE LIVE PAGES on
  2026-09-20, not deduced from the diff: `/kbli/93114` renders "Risk Level
  Medium-Low / License Type NIB dan Sertifikat Standar / Foreign Ownership Not
  verified — confirm in OSS / Processing Instant" plus the 11px footnote, and
  `/kbli/49213` renders the same shape with NO footnote at all — on a page
  whose own Regulatory Divergence panel states the licensing "was removed
  because its source could not be verified as applying to this activity". The
  same census corrected the row's premise in two ways. FIRST, the grid the row
  names (`app/kbli/[code]/page.tsx`) is NOT the surface a reader reaches: it is
  gated on non-gold AND on `intel.whatItMeans` being absent, and all three
  unverified-with-rows codes are gold, so they render through
  `LicensingSection`'s `KeyFacts` — the row named the dead twin. SECOND, the
  predicate the row proposed (`isLicensingVerificationPending`) covers only 1
  of the 3 reachable codes: 93114 reads `pending_crosswalk`, while 49213 and
  93191 read `detached` (rows served anyway) and were printing full-weight
  values with no qualifier of any kind.
scope:
  - >-
    `apps/mouth/src/components/kbli/LicensingSection.tsx` — `KeyFacts` takes
    the POSITIVE gate `isLicensingVerifiedForBareClaim` as a required
    `rowsVerified` prop (no default: an absent provenance block must withhold,
    and a `true` default is the fail-open shape this cure removes). The risk,
    licence and processing cells carry the declared gap instead of the value
    when it does not hold; the line below the grid now says WHERE the values
    went, in the two shapes the dataset distinguishes.
  - >-
    `apps/mouth/src/components/kbli/LicensingQuickFacts.tsx` (new) — the
    non-gold twin of that grid, extracted verbatim from `page.tsx` (78 lines
    out) so it can be RENDERED in a test, with the same cure applied. It was a
    copy of `KeyFacts` down to the comment and no test rendered it.
  - >-
    `apps/mouth/src/lib/kbli-provenance.ts` — one exported constant,
    `UNVERIFIED_LICENSING_FACT`, so the two surfaces and the PMA cell cannot
    drift into three dialects of the same sentence.
  - >-
    Tests — guilt/innocence render suites for both surfaces on the three REAL
    records (93114 pending, 49213 detached, 56101 oss_native), plus the rowless
    null-render case; and a stale census comment in `kbli-faq.test.ts`
    corrected (it said 93114 reads detached; it reads `pending_crosswalk`).
constraints:
  - >-
    This REVERSES a decision a prior gate round made ("one grid-level qualifier
    instead of per-cell noise", Codex gate round 5), and says so in the code
    comment and the PR body rather than flipping it silently. The reversal is
    argued on the honesty rule plus the census: the gate fires on 3 of the 1,342
    codes that serve rows, so there is no per-cell noise to avoid.
  - >-
    No licensing value is HIDDEN from the client. The withheld values stay in
    the PP28/2025 block on the same page, which states its own provenance; what
    changes is that the skim-level grid no longer states them as fact.
  - >-
    The risk badge inside the PP28 block keeps its existing inline "· pending
    verification" marker. It qualifies rather than asserts, so it is not part of
    this cure.
  - >-
    Independent of the R19 ruling — this is comprehension, not style. No token,
    spacing or layout family changes.
  - >-
    Mouth is Vercel: merging does NOT make this live. The git deploy lands
    STAGED and must be promoted, so the `Bites:` observation is taken on the
    promoted production URL, never inferred from the merge.
