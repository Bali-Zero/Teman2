task_id: ops-arm-section-guard
gear: 3
l_level: L2
gate_class: opus
objective: |
  #4562 shipped `scripts/tests/test_runbook_section_numbers_are_unique.py` — a guard written
  because #4557 gave a new runbook section a number (`6quater`) the Dependabot section had held
  since #3381, so every citation pointing at "§6quater" silently resolved to the wrong text.

  The guard shipped GREEN AND UNARMED. Measured: `git grep -c test_runbook_section_numbers_are_unique
  origin/main -- .github/workflows/` exits 1 (zero matches). A test under `scripts/tests/` runs in
  CI only if a workflow names it; the repo-wide `scripts-tests-sweep.yml` is
  `continue-on-error: true` and gates nothing. So the guard written to stop a defect from shipping
  green had itself shipped green and unarmed — superscar #2 (esiste != armato), one level up: the
  sentinel of a defect class was itself inside that class.

  This diff arms it: a new workflow that RUNS the guard on `pull_request`, `merge_group` and
  `push: main`, plus its registration in `main-push-failure-watch.yml`. It does NOT yet BLOCK —
  measured 2026-08-22, live branch protection carries 27 required contexts and none is this one.
  Reporting-only is the honest state; the promotion to required is carried by a PENDING-ARMS row,
  not by an adjective in this brief.

  The workflow also carries a PROOF-OF-BITE step, because a uniqueness check passes trivially on a
  file with no duplicates: a green run proves nothing on its own. The step reintroduces the exact
  historical `6quater` collision, requires the guard to FAIL, restores the file, asserts the
  restore is byte-identical by sha256, and requires green again — and errors out if the mutation
  was a NO-OP, so an anchor that drifts turns the proof loud rather than vacuous.
constraints:
  - "No `paths:` filter. This context is intended to become REQUIRED, and
    scripts/ci/check_required_workflow_conformance.py encodes the trap: a required context whose
    workflow carries a top-level pull_request.paths: filter never starts a run on an innocent PR,
    so GitHub shows 'Expected — waiting' forever and the PR can never merge (what docs-sync.yml
    and migration-lint.yml shipped). Same rule is why `merge_group:` is present."
  - "timeout-minutes >= 10 (scripts/lint_workflow_timeout_floor.py). The floor is the CHECKOUT, not
    the pytest: actions/checkout on this repo intermittently takes ~2 minutes, and a job that runs
    out reports `cancelled`, not `failure` — a cancelled required check never turns green by itself
    and shows nothing red to fix. An earlier revision of this PR shipped `timeout-minutes: 5` and
    the repo's own linter caught it."
  - "`push: main` obliges registration in main-push-failure-watch.yml, mid-list per that file's own
    comment, not appended. An earlier revision of this PR omitted it and left a main-push failure
    unwatched; check_watcher_coverage.py caught it."
  - "The guard's own logic is NOT touched here. #4562 shipped it with a guilt/innocence fixture and
    an anti-vacuity test; this PR only executes it."
acceptance:
  - "`git grep -c test_runbook_section_numbers_are_unique origin/main -- .github/workflows/` goes
    from exit 1 (no matches) to a matching workflow on main."
  - "actionlint exit 0 on both changed workflows."
  - "scripts/lint_workflow_timeout_floor.py exit 0; scripts/check_watcher_coverage.py exit 0 with
    the new context listed."
  - "scripts/ci/check_required_workflow_conformance.py exit 0 — the workflow is shaped so it CAN
    be promoted to required without the 'Expected — waiting' deadlock."
  - "The proof-of-bite step, run locally against the same anchor, mutates (sha256 changes), the
    guard FAILS on the mutation, the restore is byte-identical, and the guard is green again."
consumer_map:
  - "GitHub Actions on this repo — the only consumer. Merging IS arming: the workflow starts
    running on the next pull_request/merge_group/push event with no deploy step, so merged == live
    for this artifact."
  - "`infra/required.d/contexts.json` (27 contexts today, this one absent) — NOT touched by this
    PR. Promotion to a REQUIRED context is a deliberate second step after this lands, done by
    regenerating that file with scripts/ci/snapshot_required_contexts.py, never hand-edited. Until
    then the workflow runs and reports but does not block. That remainder is carried by a REAL
    row appended to `.claude/skills/modus/PENDING-ARMS.md` in this same diff — an earlier revision
    of this brief SAID it was recorded there while no such row existed, which the Gear-3 gate
    falsified with one grep. A missing row means no alarm from scripts/pending_arms_report.py,
    which is 'green and unarmed' one level up — the exact defect this PR exists to cure."
  - "`main-push-failure-watch.yml` — CORRECTED after the Gear-3 gate: it matches on the WORKFLOW's
    `name:` field, not the job name (the same field GitHub uses for `workflow_run.workflows:`,
    verified empirically against this repo's live workflows API on 2026-07-26 per
    scripts/check_watcher_coverage.py's own header). So a JOB rename breaks nothing, and a
    WORKFLOW rename is caught loudly — that script's rule 2 exits 1 on a stale entry. Both names
    happen to be the same string here, which is why the earlier wrong description did no harm."
risks:
  - "The proof-of-bite step's sed anchor is a literal heading line in
    docs/runbooks/merge-queue-discipline.md. If that heading is reworded, the mutation becomes a
    NO-OP — handled: the step asserts the sha256 CHANGED and errors with `::error::mutation was a
    NO-OP` rather than passing vacuously. Failure direction is loud, not silent."
  - "The proof-of-bite step mutates a tracked file inside the runner's checkout. It restores from a
    /tmp copy and asserts byte-identity, and the checkout is discarded at job end, so it cannot
    leak into an artifact. It would, however, leave the file mutated if the job were killed
    mid-step — harmless on an ephemeral runner, and never run outside one."
  - "Running on every PR rather than behind a paths filter costs a five-second pytest plus a
    checkout per PR. Deliberate: the class of outage a paths filter buys on a required context is
    strictly worse than that cost."
grader: independent-review-session (fresh context, not the author)
budget: ~1 subagent, no council
pii: none
