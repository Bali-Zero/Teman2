task_id: price-review-0831
gear: 3
l_level: L2
gate_class: opus
objective: |
  Give Bali Zero's own price sheet an automatic re-check, so that "are the prices still current?"
  stops being a question nobody is scheduled to ask.

  Ordered by Zero on 2026-08-31 as one half of a two-part mandate — "crea un trigger automatico che
  fa partire una richiesta a NB-2 che fa anche una research live per confermare che ci sono o non
  ci sono aggiornamenti a riguardo gli index e i prezzi" — and immediately scoped by the amendment
  "per il prtezzo che si controlli solo il nostro pricing tool". That amendment is load-bearing and
  is why this sentinel makes no external call at all: government PNBP is a different question with
  a different owner, and conflating the two produces an alert nobody can act on. The 90-day review
  interval was ratified separately by Zero ("va bene 90 giorni").

  The obvious implementation — compare `metadata.last_updated` against today — would have shipped a
  lie. Measured on disk at 2026-08-31: the field says 2026-05-06, while the file was last committed
  2026-08-26 and carries entries stamped `verified_on: 2026-08-25`. The field is not a review date;
  it is a literal somebody wrote once and nobody bumps. Its one honest use is asymmetric: it can
  prove the sheet is OVERDUE, and it can never prove the sheet is FRESH.

  So OK requires a conjunction — inside the interval AND no independent trace of the file having
  moved since. Two traces, both lower bounds: the last git commit touching the file, and the newest
  per-entry `verified_on`. A newer trace yields ATTESTATION_UNMAINTAINED, a distinct loud state
  meaning the freshness question cannot be answered in either direction. That is the live verdict
  today, and it is the correct one.

  Gear 3 by PATH, deterministically: the diff adds a LaunchAgent wrapper and plist, which the
  harness floors at 3 regardless of size (`--print-floor-source` returns `path`). 855 net lines
  across 7 files at this commit.

constraints:
  - "Absence must never read as freshness. 111 of 113 priced entries carry no `verified_on` at all;
    they are UNKNOWN, not current, and the count travels in the alert body rather than being
    silently dropped."
  - "The sentinel must watch what the LIVE service loads. The filename is imported from
    `pricing_service._PRICING_FILENAME`, never restated — a rename to a 2027 edition must not leave
    this organ watching a dead file and reporting green (the proxy failure, superscar #9)."
  - "A sentinel that errs must err toward noise. A reformat-only commit will trip
    ATTESTATION_UNMAINTAINED; that false positive is accepted deliberately, because the opposite
    error is a quiet false OK on a price sheet."
  - "No external call, no NB-2, no web, no government fee schedule — Zero's amendment fixes the
    scope to our own pricing tool."
  - "WHEN the sentinel runs it SHALL emit only dates, counts and outcome names — probe:
    `pytest scripts/tests/test_price_review_sentinel.py -k alert`. No client PII anywhere in
    output, logs or alerts. The sheet carries only Bali Zero's own
    published business contact block, which is already public on balizero.com."
  - "Telegram only through the `scripts/tg_notify.py` gateway, never a direct bot call, and a
    gateway failure must never crash the sentinel (house contract)."
  - "Built is not armed. The organ ships unarmed and says so in PENDING-ARMS rather than letting the
    repo read as if the price sheet were already being watched (superscar #2)."

acceptance:
  - "WHEN a review date sits inside the interval but a commit lands after it, classify() SHALL NOT return OK — probe: `pytest scripts/tests/test_price_review_sentinel.py::test_guilt_a_recent_review_date_contradicted_by_a_change_is_still_not_ok`. Full statement: `classify()` returns OK only when the review date is inside the interval AND no trace shows the
    file changed after it — verified by a guilt test where the date is INSIDE the interval but a
    commit lands after it, which must still not be OK."
  - "WHEN run against the real sheet on 2026-08-31 the sentinel SHALL exit 1 — probe: `python3 scripts/price_review_sentinel.py --dry-run --json --now 2026-08-31`. It yields ATTESTATION_UNMAINTAINED with
    exit 1, naming 2026-08-26 as the contradicting trace."
  - "WHERE the classifier returns an outcome, that outcome SHALL have a mapped exit code — probe: `pytest scripts/tests/test_price_review_sentinel.py::test_every_outcome_the_classifier_actually_returns_has_an_exit_code`. None falls through to CANNOT_VERIFY."
  - "IF the real sheet were empty the suite SHALL fail rather than pass vacuously — probe: `pytest scripts/tests/test_price_review_sentinel.py::test_the_real_sheet_is_classifiable_and_not_empty`. The real sheet parses and carries >= 100 priced entries before any
    assertion is made about it."
  - "WHEN any guard in the classifier is removed the suite SHALL go red — probe: the six single-anchor mutations recorded in the pack. Three of them: disabling the contradiction check,
    widening the grace day, and moving the interval."
  - "WHEN the organ is born the conformance check SHALL stay clean — probe: `python3 infra/organ-conformance/check_organ_conformance.py`. Result: clean, and `validate_organs_registry` valid after the birth."

consumer_map:
  - "`scripts/price_review_sentinel.py` — the organ itself; runs under plain /usr/bin/python3, no
    venv, because that is what the launchd wrapper uses."
  - "`apps/backend-rag/backend/services/pricing/pricing_service.py` — read-only, for
    `_PRICING_FILENAME` alone. Nothing in the service changes."
  - "`apps/backend-rag/backend/data/bali_zero_official_prices_2026.json` — observed, never written."
  - "`infra/launchagents/wrappers/pro-price-review-sentinel.sh` + `com.nuzantara.price-review-sentinel.plist`
    — the trigger, node=pro, StartInterval 86400. NOT yet installed on Pro."
  - "`apps/organism/organism/organs_registry.yaml` + `infra/home-fork/declared-pairs.json` — so the
    organ has a repo trace and the home-fork lint can see its live pair (superscar #1)."
  - "`scripts/tg_notify.py` — the only alert door; tier p0 for findings, digest for APPROACHING."
  - "`.claude/skills/modus/PENDING-ARMS.md` — two rows: the unarmed organ, and the inherited
    organ_birth.py YAML-quoting bug."

risks:
  - "The organ is BUILT and NOT ARMED. Until the plist is bootstrapped on Pro and a first heartbeat
    is read back, nothing is being watched — and the repo now looks as though something is. This is
    superscar #2 by construction, which is why it is a PENDING-ARMS row and not a claim of done."
  - "The contradiction check depends on git being available in the cron environment. When git cannot
    answer, the sentinel loses one of its two traces; it degrades toward silence on that trace, never
    toward a pass, but the coverage is genuinely weaker in that state."
  - "ATTESTATION_GRACE_DAYS = 1 is a judgment call covering the UTC-vs-WITA offset. A real edit made
    within a day of a genuine review would be absorbed by it."
  - "The sentinel answers a narrower question than the mandate's word 'prices' might suggest: it
    detects that OUR SHEET is overdue for review, not that the underlying prices have changed. That
    narrowing is Zero's own amendment, stated here so nobody later reads the green as market truth."
  - "The sheet is not the only price store. `practice_types.base_price` in Postgres is independent —
    populated only by one-shot migrations, last price-bearing one 2026-06-09 — and
    `crm_practices.py:491` uses it as the default `quoted_price`. Measured against the live DB
    today: 74 of 112 rows match a sheet entry by normalized name and all 74 are IDENTICAL, so the
    store has not broadly drifted; the one live divergence is `B1 - VOA` at 750.000 against the
    sheet''s 790.000. This sentinel does NOT watch that store, and a green verdict from it says
    nothing about what a client is quoted through the CRM. Recorded in PENDING-ARMS rather than
    folded in here: the two stores do not share a naming scheme, so reconciling them is its own
    mandate, not a widening of this one."

grader:
  "Opus 5 at xhigh — the final on-disk gate (CLAUDE.md §5, 2026-08-20 ruling). Generator is
  this session's build lane; the grader never grades its own diff, and the council seats
  (codex-gpt-5.6-sol, kimi-code/k3) are dispatched on the diff, not on a summary of it."
