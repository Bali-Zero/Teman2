task_id: visa-seq19-fold
gear: 3
l_level: L2
gate_class: opus
# Floor computed this run: `python3 scripts/evidence_pack_lint.py --print-floor-source`
# returns `size` — the fold script + test file are ~1,500 lines together, plus the
# 9,152-line generated `rulepack-prod-019.source.json` data file (not hand-authored;
# every line is copied verbatim from seq-18 or transplanted verbatim from seq-15). Size
# alone floors this at Gear 3 regardless of the change's actual authored-logic footprint.
objective: >-
  Fold RulePack seq-19 from the SIGNED seq-18 payload (the pack the engine actually
  serves today) and TRANSPLANT — never re-author — seq-15's three E31 fail-open
  repairs onto it. Ground: `research/operations/2026-09-05-consuls-ground-
  visaoracle-engine.md` (Q3) and its independently re-run refutation established
  that seq-15's repair (authored 2026-08-29, never itself signed, closing a BLOCK-DEFECT gold
  divergence) never reached production — seq-16 re-parented onto seq-13, bypassing
  the unsigned 14->15 candidate line, and seq-17/seq-18 chain from seq-16. The
  fail-open E31B/E31D predicate the 2026-08-15 disposition flagged is therefore
  measurably still live in the pack production serves. This fold re-lands it,
  chained forward from the current anchor instead of re-parenting again.
appetite:
  wall_clock_hours: 3
constraints:
  - >-
    DO NOT SIGN, DO NOT touch any `*.signed.json`, DO NOT activate. The consul runs
    `sign_pack.py` after the gate; activation is Zero's separate act. Every witness
    that needs a compiled 019 pack goes through `compile_pack.wrap_as_unsigned_pack`
    (a placeholder envelope, never a trust claim) instead.
  - >-
    Transplant, never hand-author: every repaired `when`/`required_facts` byte on
    the ten touched rules must be copied verbatim from `rulepack-prod-015.source.json`,
    not re-derived from today's catalog (that was seq-15's own method; this fold's
    job is only to move seq-15's bytes forward, not to re-run seq-15's reasoning).
  - >-
    Chain anchor is seq-18 (the live pack), not seq-13 (seq-15's own anchor) and not
    a hand-picked digest constant — verified by Ed25519 signature against the real
    production trust store, exactly as `fold_pack_seq18.py` verifies its own seq-17
    anchor.
  - >-
    Every byte of seq-18's payload not named by the four retirements or the ten
    transplants must stay identical — enforced by a fail-closed guard on both what
    changed and what the changed fields' VALUES must equal (the seq-18 review's own
    lesson: a guard that only names what MAY move is silent on whether it moved to
    the right thing).
acceptance:
  - >-
    A1: `compile_pack.py` on `rulepack-prod-019.source.json` reports 0 compilation
    errors.
  - >-
    A2: the rule-set diff 019-vs-018 is EXACTLY the four declared retirements and
    the ten declared transplants (nine sponsor-terminal rules + the stepchild rule)
    and nothing else — asserted by rule_id set and by full-payload key diff.
  - >-
    A3: the fold is byte-invariant across two runs (`canonicalize_json` equality)
    and its output on disk matches a fresh in-process `fold()` call exactly.
  - >-
    A4: evaluator witnesses through the REAL evaluator on a `CompiledRulePack`
    built from 019 — guilt (sponsor `NONE` no longer yields E31B, FAMILY intent
    alone no longer yields E31D, unknown stepchild evidence never supports) and
    innocence (real-ITAS spouse keeps E31B, evidenced stepchild keeps E31D, gold
    persona #7 keeps E31A).
  - >-
    A5: all 18 gold-coverage corpus personas remain SUPPORTED against 019 (same
    evaluate path `gold_coverage_eval._evaluate` uses, minus the repository
    signature-selection step neither script lets a caller override for an
    unsigned candidate pack).
  - >-
    A6: the 20-canonical-persona offline comparison (018's real signed pack vs
    019's placeholder-enveloped compile) is reported honestly: persona #7's
    manufactured E31B/E31D candidates are gone; persona #6's divergence — found
    by this fold's own verification to be UNRELATED to the fail-open bug
    (`MINOR_GUARDIAN_PRIVACY_REVIEW`, not sponsor-status) — is byte-identical
    before and after, proving the transplant did not touch it; the overall
    match SET and COUNT are unchanged end to end (5/20, personas #3/#4/#12/#15/#18).
dissent_process: >-
  The task mandate restricts this session to prepare-only (the consul gates and
  ships) but does not forbid dispatching a review seat, and the size-floored Gear-3
  posture (R9) requires two distinct review seats marked ok:true — so two were
  dispatched: kimi-code/k3 (agentic, direct file access) and tp1-qwen3.8-max
  (text-only, fed the full fold script), independently, fresh context each,
  codex-gpt-5.6-sol attempted first and failed on a CLI version mismatch
  (`codex-cli 0.153.2` rejects `--full-auto` in the wrapper's invocation shape —
  tooling drift, not content). Both converged independently on the same two core
  defects — the fold never verified its own stated byte-identity precondition
  (seq-13 vs seq-18 on the ten edited rule ids), and the `required_facts` guard
  exclusion was too broad — which is exactly why those two were cured rather than
  argued. tp1 additionally found the seq-15 donor was authenticated only by a
  self-declared `sequence: 15` field (no digest pin, no signature) and a
  non-suffix-anchored path derivation; both cured. Prompted by kimi's review, this
  session added its own product-catalog drift guard, whose first draft would have
  wrongly refused the transplant on an unrelated field — caught before commit by
  running it against the real packs. Full verbatim notes: pack.yml `dissent` +
  `council-journal.jsonl`. Self-adversarial review during authoring separately
  surfaced two more findings, also cured (see pack.yml `dissent`): the ground-truth
  report's framing of gold persona #6 as "an E31 fail-open persona" is imprecise
  (its actual divergence reason is an unrelated minor-guardian privacy gate); and
  the value-guard's `after_rules_by_id[rule_id]` lookup raised an unhandled
  `KeyError` instead of a clean fail when handed an incompletely-edited pack.
