objective: |
  `scripts/wr3_reflexion_synthesis.py::_collect_claude_seats()` — the seat enumerator
  for the weekly reflexion cron (`com.balizero.wr3.reflexion.weekly.plist`, LOADED and
  live) — carried the same pre-remap assumption already fixed once in
  `cli_runtime.py` (PR #4640) and again in `claude-cascade.sh` /
  `wr3_dispatch_v2.py` (PR #4644): `range(1, 6)` (stops at slot 5, never reaches 6)
  and `label = "slot5-team" if slot == 5`. Until the 2026-08-23 fleet re-map that was
  correct — slot 5 WAS the Team seat. After the re-map, slot 5 became
  kaiser198719871987@gmail.com (a plain MAX seat) and the Team seat moved to slot 6.
  Since then this specific cron has been logging "slot5-team" against a MAX seat's
  own token and has never once reached the real Team seat, which sits one slot past
  where this loop stops looking.

  This is the third and, per the diagnosis handed to this session, LAST consumer
  carrying the stale map — deliberately fixed as its own small PR rather than folded
  into #4644, per the "one PR, one concern" rule (CLAUDE.md Agent PR Contract #1).

  Fix: `range(1, 6)` -> `range(1, 7)`; `"slot5-team" if slot == 5` ->
  `"slot6-team" if slot == 6`. Slot order is preserved exactly (5 MAX seats first,
  Team last, appended never inserted) — same invariant #4640/#4644 already
  established, extended here to the third consumer.

  ADDITIONAL FINDING (this session's own independent verification, not in the
  diagnosis handed down): the SAME 2 tests in
  `scripts/tests/test_claude_cascade_shell.py` that PR #4644 already fixed once
  (per that PR's own evidence pack, commit cd01a1ffc) were RED AGAIN on this
  branch — confirmed independently against this PR's own live CI run (the
  "antidotes" required check, job "Codex seat corpus"), not merely inferred from
  #4644's history. `agent/nuzantara/ops/seat6-reflexion` branches from
  `agent/nuzantara/ops/seat6-cascade`'s commit `4d8050f45` — the fix commit
  itself, NOT the later evidence-pack commit `6b405786f` that a separate session
  pushed to that sibling branch afterward. Because a stacked branch inherits its
  parent's history at the commit it forked from, not whatever the parent branch
  grows into later, `test_claude_cascade_shell.py`'s fix (`cd01a1ffc`, pushed to
  `agent/nuzantara/ops/seat6-cascade` AFTER `4d8050f45`) was never an ancestor of
  this branch and its own diff against origin/main reintroduced the same 2
  failures. This is not a new regression from this PR's own 2-file change (verified:
  reverting only `scripts/wr3_reflexion_synthesis.py` in a scratch copy does not
  touch these 2 tests at all) — it is a branch-topology gap between two sibling
  PRs sharing one physical worktree, the same class of hazard
  cicatrix-superscar.md family #5 names. Fixed in a separate commit (`b9e5bddb7`)
  before this evidence commit, re-deriving the exact same fix #4644 already made
  (insert the slot-6 "team-wrapper" step into the expected label chain; correct
  the stale "claude-token-5-team-wrapper" stderr string to
  "claude-token-6-team-wrapper"), verified against this PR's own CI failure log
  byte-for-byte rather than copied blind.
