task_id: garuda-maxstay-shared-engine
gear: 2
l_level: L2
gate_class: sonnet
objective: |
  Promote the B1 max-total-stay boundary guard into the shared GARUDA engine
  (`services.garuda_flow.intake.build_verdict`), not just the owner-local
  preview CLI.

  PR #4685 added `constants.b1_max_total_stay_exceeded(day_difference,
  max_total_stay_days)` — the inclusive (`>=`) day-counting guard that
  rejects a B1 extension whose printed expiry is one day past the legal
  60-day maximum (B1 counts the arrival day AS day 1, so a 60-day
  *difference* is already 61 inclusive days). Verified by grep this session:
  that guard was wired into exactly ONE caller —
  `internal_preview_cli.py:27` (import) / `:136` (the only call site).
  `grep -rn "max_total_stay" apps/backend-rag/backend/services/garuda_flow/`
  returned nothing in `intake.py` or `eligibility.py` — the shared engine
  had no notion of a maximum total stay at all.

  Today the CLI-only guard has no production impact (the live Fly router
  never calls that path). But a future public-VOA-funnel restore built on
  `build_verdict()` would silently reintroduce the exact 61-day ACCEPT bug
  #4685 just fixed — on the client-facing surface, where it actually
  matters. Design requirement: the CLI raises `PreviewInputError` (correct
  for a local operator tool); the shared engine must instead surface this
  as a DECLINE with a new neutral `DeclineCode`, matching how every other
  SOP criterion already declines in `eligibility.py` — a public surface
  must never bare-error on a legitimately-shaped submission, and this
  product's SOP always routes a DECLINE to WhatsApp, never a bare no.

scope:
  in:
    - "backend/services/garuda_flow/eligibility.py — new DeclineCode.EXTENSION_EXCEEDS_MAX_STAY member (neutral, prose-free, unique)"
    - "backend/services/garuda_flow/intake.py — build_verdict() layers the guard on top of screen() (same pattern as EXTENSION_ALREADY_USED / the issuance submission-window gate), reusing constants.b1_max_total_stay_exceeded() and StayWindow.max_total_days (no re-derivation, no hardcoded 60)"
    - "backend/tests/services/garuda_flow/test_intake.py — TestB1MaxTotalStayBoundary (guilt @ ==60, innocence @ ==59, issuance no-op) + one pre-existing fixture (test_extension_past_coverage_end_entry_date_is_still_unaffected) corrected: its 2020-01-01 entry_date implied a >2000-day stay that the new (correct) guard now also catches, masking what that test actually checks"
    - "backend/tests/app/routers/test_garuda_voa_no_internal_leak.py — TestMaxTotalStayDeclineIsCleanOnTheWire, symmetric with the existing EXTENSION_ALREADY_USED wire-safety proof"
  out:
    - "internal_preview_cli.py itself — unchanged. It already raises PreviewInputError before ever reaching build_verdict(), so the new engine-level branch is unreachable for it; the CLI's behaviour is untouched by construction, not by a compatibility shim."
    - "apps/mouth/, apps/admin-dashboard-local/, safe_clock.py, the passport 6-month rule — not touched, out of scope per the mandate."
    - "Wiring the new DeclineCode into a public router — garuda_voa.py's only route is the owner-only historical archive GET; there is no live POST/public path today for this decline to reach (S14/garuda-voa's declared subtree owns any future funnel rebuild)."

risks:
  - "None of this is reachable in production today (verified: the CLI's own PreviewInputError fires first, and the public VOA funnel is retired per PR #4344). The change is behaviour-affecting on a path the live Fly router does not currently reach — stated explicitly per the mandate, not left implicit."
  - "Reordering compute_stay() earlier in build_verdict() (to reuse stay_window.max_total_days instead of re-deriving VISA_META arithmetic) is safe because compute_stay is a pure function of (entry_date, visa_type, printed_expiry) with no dependency on decision/codes — verified by reading safe_clock.py before moving the call."

receipts_summary: "RED captured on unmodified source (guilt test failed as expected: ACCEPT instead of DECLINE), then GREEN after the fix. Baseline 164 -> 168 passed (4 new tests: 3 guilt/innocence/no-op + 1 wire-safety), 0 failed, on the full required suite (garuda_flow/ + test_garuda_voa.py + test_garuda_voa_no_internal_leak.py). Broader sweep (routers/ + visa_engine/) also green: 2152 passed, 2 skipped (pre-existing unrelated asyncio-mark warnings)."
