objective: >-
  Second REWORK round on PR #7367 (T3 PR-2), spec addendum v2 (B1-B4), after the fresh gate's
  narrow REWORK-DESIGN verdict on 90c4326fde. Keeps A1, A2, A3 (amended by B3), A5, A6, A7, A8 of
  the first addendum; B2 REPLACES A4. This is the LAST round on this PR (a third REWORK suspends
  the lane).
  B1 (merge-tree red): the branch predated #7366 (merged into origin/main as c1ee9cb0b9); on the
  merged tree, two of #7366's opt-in real-PG tests went red because of this PR's own
  `team_promise_candidates.revised_at` column: `test_c1_real_pg_catalog_matches_required_columns_
  exactly`'s pin (26 -> 27) and `test_mutation_proof_verify_outside_transaction_lets_the_ddl_
  survive`'s `_import_mutated` (needed to register the scratch module in `sys.modules` BEFORE
  `exec_module`, or `@dataclass(slots=True) ScanMetrics` can't resolve its own module while
  building the slotted class). Rebased onto current `origin/main` (59cabcbd25, which contains
  #7366; #7395/C5 is still open, unrelated) via a plain `git rebase origin/main` (one commit
  dropped as already-upstream) and fixed both tests in `test_wa_team_promises_gate_conditions_
  real_pg.py`. The whole T3 suite is green on the rebased tree.
  B2 (replaces A4 — the digest design was actually broken): A4's premise was false — `tg_notify`
  dedups BEFORE spooling, so a per-day key on a live-growing "today" count only let the first
  tick or two of the day through, each showing a stale near-zero total (gate simulation: 6
  records over 3 days, all "today 0", against a true ~120/day). B2 reports YESTERDAY's completed
  (fixed) total instead — `promises: yesterday N (revised R), unjudged U` — but the per-day key
  alone still isn't exactly-once: `tg_notify`'s ladder opens a SECOND opportunity ~6h after the
  first hit, same key, same day (proven empirically against the real module before the fix
  landed: 2 sends/day, both correct-content but a duplicate). The actual fix is
  `_is_first_digest_opportunity_of_the_day`: the digest is only ATTEMPTED during the midnight WITA
  hour (00:00-00:59) — `tg_notify`'s own dedup then only needs to collapse however many ticks land
  in that ONE hour, removing the ladder's later-in-the-day opportunity entirely instead of hoping
  it gets absorbed. No local state file: a missed 00:00 tick is covered by 00:15/00:30/00:45.
  Proven with a fake-clock simulation against the REAL `scripts/tg_notify.py` (own sys.modules
  entry, scratch spool dir), same methodology as the gate's own `a4_cadence_sim.py`: 3 simulated
  days of `*/15` ticks with business-hours (08:00-18:00 WITA) activity reach the spool exactly
  ONCE per day, with the true previous-day total (0, then 120, then 120).
  B3 (conjunction split, pre-activation): the right boundary is `(?=\s)` (an actual whitespace
  char), not `\b` — a bare word boundary also fires between a word char and adjacent punctuation,
  so "e-mail" and "e' pronto" used to split and lose the due hint that followed. The plain
  sentence-punctuation period is narrowed the same way, plus a small NAMED exception for "e.g."
  specifically (the one abbreviation the addendum's guilt case names) via a fixed-width negative
  lookbehind — not general abbreviation detection. Re-verified read-only on Pro (this head,
  89e5612f25, `git archive` scratch copy in `/tmp`, removed after): `--scan --dry-run` ->
  `scanned=10143 clauses=359 candidates_new=359 candidates_revised=0`; a separate in-memory,
  read-only probe (import the scratch copy's own `_split_clauses`/`_match_clause`, one SELECT, no
  writes) confirms `candidates=359 due_hints=35` — matching the gate's own `pro_split_probe.log`
  (359 = 359, 35 = 35) exactly: the fix changes WHICH clauses split for some messages, not how
  many candidates or due hints end up proposed.
  B4 (low, all landed this round): the real-PG guilt docstring's TypeError claim was wrong (both
  heads share `run_scan`'s signature; the real guilt is `assert 0 == 1`) — corrected. `--dry-run`
  help text no longer mentions a watermark. The 30-day floor is `created_at >=` (was `>`) —
  pinned with a static SQL-text assertion (true instant-equality against a moving `now()` isn't
  testable in a live system). The A5 lock/commit-order test now checks commit visibility from an
  INDEPENDENT connection, opened INSIDE both callbacks (own thread + its own `asyncio.run`, since
  the callbacks are sync and called from inside cli_main's running loop) — not inferred after
  `cli_main` returns. PR body top sections and this brief's sizes are rewritten for the rebased,
  reworked diff.
  Carried to PR-3 as a condition (NOT built here, per the gate's own routing): Codex's positional-
  revision HIGH (a shrinking/growing body can leave an orphan unjudged row, or place new text at
  an already-judged index) — rare on Pro (<=23 of 10,152 rows re-upserted in 30 days), owned by
  the PR-3 spec author, due before PR-3 merges.
