objective: >-
  Ledger row `kbli-chat-asserts-licensing-facts-with-no-government-source`
  (PENDING-ARMS, opened 2026-09-19 from the 3-seat KBLI audit). Five places in
  `kbli_notebook_chat.py` produced `risk_category` for the same code and
  disagreed even about what ignorance is called: the `kbli_documents` branch
  hardcoded `"Verify at OSS"` and stopped looking, the `kg_nodes` branch
  defaulted to it, the Qdrant payload builder and the ILIKE fallback defaulted
  to `"Unknown"`, and a hand-written answer table served tiers nobody sourced.
  Which answer a client got depended on which store held the code, not on the
  law. MEASURED READ-ONLY INSIDE THE RUNNING IMAGE on 2026-09-20, not recalled:
  `kbli_documents` carries no `kategori_risiko` key on ANY of its 1,563 rows,
  while `kg_nodes` carries a value on 1,383 of its 1,562 `kbli:` nodes — so the
  branch that wins for almost every code was the one structurally incapable of
  answering, and it declined to ask the store that could. The same probe killed
  the hand-written table's premise: its own comment declared 47901 "absent by
  construction from PostgreSQL and Qdrant — this dict was its ONLY possible
  answer", and all nine of its codes are present in BOTH stores. The typed-code
  path never reached it; its one live route was the activity-keyword map, which
  bypassed the stores entirely. That measurement also dissolves the product
  question the row put to the codeowner ("may the channel answer at all when
  the canonical has no PMA verdict?"): there is no code here the stores cannot
  answer, so deleting the table costs zero coverage.
scope:
  - >-
    apps/backend-rag/backend/app/routers/kbli_notebook_chat.py — new
    `_resolve_code_from_stores(pool, code)` carrying the ONE derivation with its
    precedence written down (`kbli_documents` -> `kg_nodes` -> Qdrant), used by
    both the typed-code path and the activity-keyword route; new
    `_channel_risk(*candidates)` giving this channel one word for not knowing;
    the hand-written `KNOWN_KBLI_CODES` table deleted; `_bury_if_phantom` moved
    BELOW the keyword route, which until now ran past it unburied; the deleted
    table's e-commerce fork moved into the master prompt as accuracy rule 6.
  - >-
    Tests — new guilt/innocence suite for the derivation; the structural
    fallback guard re-aimed from the deleted table onto the two hand-written
    copies that survive it (the keyword map and the prompt); the burial-order
    test re-pinned on the two paths that now exist.
constraints:
  - >-
    `_result_from_payload` is NOT touched. It floors at `"Unknown"` and is
    shared with the public `search_kbli` surface; this channel normalises its
    output instead of changing a function two consumers read. Aligning
    `search_kbli` is its own lane, declared rather than swept in.
  - >-
    The floor stays `"Verify at OSS"`, not the inspect side's `"Not
    classified"`. The master prompt carries an accuracy rule keyed on that
    exact string; changing the word would silently break the rule that handles
    it.
  - >-
    No editorial knowledge is deleted silently. The table's 47901 fork was
    pinned by an existing test, so it moves to the prompt WITH its guard rather
    than disappearing.
  - >-
    Merging this deploys it (apps/backend-rag/**). The live observation in
    `Bites:` is taken after the deploy, never inferred from the merge.
acceptance:
  - text: >-
      GUILT, the whole reason for the change: WHEN `kbli_documents` answers for
      a code AND `kg_nodes` carries a tier for it, the match SHALL carry that
      tier. The replaced code hardcoded `"Verify at OSS"` and `break`ed.
    probe: >-
      pytest backend/tests/unit/routers/test_kbli_chat_risk_has_one_derivation.py::test_documents_row_no_longer_hardcodes_ignorance_over_a_known_tier
  - text: >-
      GUILT: WHEN the Qdrant path answers with the shared builder's
      `"Unknown"`, this channel SHALL report `"Verify at OSS"` — one dialect of
      ignorance, not two.
    probe: >-
      pytest backend/tests/unit/routers/test_kbli_chat_risk_has_one_derivation.py::test_qdrant_unknown_is_folded_into_the_one_dialect
  - text: >-
      INNOCENCE: WHERE no store carries the code, or the pool is dead, or the
      query raises, or the store holds the code but not the tier, the channel
      SHALL abstain rather than invent — no match, or the floor.
    probe: >-
      pytest backend/tests/unit/routers/test_kbli_chat_risk_has_one_derivation.py -k "no_store_carries or dead_pool or raising_query or not_the_tier or empty_tier"
  - text: >-
      ASYMMETRY PINNED: WHILE a partial PMA tuple SHALL be withheld by
      `_PMADisclosure`, an unsourced risk string SHALL pass through it verbatim
      — which is why the risk derivation is made single at the source.
    probe: >-
      pytest backend/tests/unit/routers/test_kbli_chat_risk_has_one_derivation.py::test_a_partial_pma_tuple_is_withheld_while_the_risk_tier_is_not
  - text: >-
      THE TABLE IS GONE AND STAYS GONE: `grep -c KNOWN_KBLI_CODES` on the chat
      router SHALL return 0, WHILE the keyword map SHALL still route and resolve
      through the stores.
    probe: >-
      pytest backend/tests/unit/routers/test_kbli_hardcoded_fallback_matches_catalogue.py::test_the_router_carries_no_hand_written_answer_table backend/tests/unit/routers/test_kbli_notebook_chat.py::test_the_keyword_map_routes_without_asserting_facts
  - text: >-
      DEGRADATION IS NOT A REGRESSION: WHEN there is no database pool, the
      typed-code path SHALL still ask Qdrant. `get_optional_database_pool` is
      optional by design and Qdrant was the branch NOT gated on it; an early
      return here would cut the whole path the moment Postgres blinks.
    probe: >-
      pytest backend/tests/unit/routers/test_kbli_chat_risk_has_one_derivation.py -k dead_pool
  - text: >-
      BURIAL ORDER: the tombstone call SHALL sit after BOTH paths that set
      `direct_kbli_match`. It used to sit between them, so a keyword-injected
      match skipped the tombstone entirely.
    probe: >-
      pytest backend/tests/unit/routers/test_kbli_chat_buries_phantom_codes.py::test_the_endpoint_actually_calls_the_burial
  - text: >-
      THE SURVIVING HAND-WRITTEN COPIES STAY HONEST: no keyword target and no
      prompt line SHALL name a code the catalogue lacks, and no prompt line
      SHALL promise foreign openness on a code the catalogue caps below 100%.
    probe: >-
      pytest backend/tests/unit/routers/test_kbli_hardcoded_fallback_matches_catalogue.py
  - text: >-
      NO REGRESSION ACROSS THE KBLI SURFACE.
    probe: pytest backend/tests -k kbli
