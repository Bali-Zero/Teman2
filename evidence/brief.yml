task_id: secondo-livello-second-army-script
gear: 2
l_level: L2
gate_class: opus
# Floor for this diff, measured WITH this brief in the diff (the mistake that sank the first cut
# of this work, PR #6602: the floor was measured on the code-only commit and the brief's own churn
# then crossed the 1828 threshold by one line). No hot-zone path. Gear 2 declared to match the
# floor exactly; no pack below Gear 3. The standalone runner and the CI wiring are deliberately
# NOT here: the runner is its own concern, and .github/workflows/ is a hot-zone path that would
# force this diff to floor 3.
objective: >-
  D3+D4 of mission SECONDO-LIVELLO-20260915: make army-map.md §1ter runnable.
  infra/workflows/second-army.js executes a Gear <= 2 mission under the direction Zero RULED on
  2026-09-15 — the INFERIOR seats BUILD, the Dux SPAWNS them and VERIFIES on disk, a weaker seat
  never grades a stronger one. infra/workflows/tests/test-second-army-contract.mjs is its
  contract and ships with it, asserting the ruled direction rather than the syntax.
constraints:
  - >-
    No Anthropic per-token door in any form. Lanes are native agent() calls; every external seat
    is reached FROM a lane via Bash (the .claude/skills/workflow/SKILL.md §2 pattern). No key, no
    token, no env value read or printed anywhere in the diff.
  - >-
    Nothing outside infra/workflows/ is touched. No existing workflow script, test or README
    section is modified — the two new files are additive and the README change is a pure append.
  - >-
    No PII in scope: the script carries mission/task text supplied by its caller and routes any
    PII-bearing lane to local Ollama by doctrine; no client data appears in this diff.
acceptance:
  - text: >-
      A1: WHEN the contract suite runs SHALL pass 12/12, including the assertions that encode the
      ruled direction — no builder shares the Dux's family except the grunt seat and that seat is
      last in the roster; the Dux never appears in its own builder roster; verify lanes are
      model:"sonnet" and build lanes model:"haiku"; a simulated dead builder lands in deadTiers
      and the next live builder is used; every cross-family door dead falls back to the grunt
      seat; the verify prompt never contains the builder's claim sentinel; the refuter lane runs
      at floor 2 only and exactly once; floor 3 launches no build, verify or refute lane.
    probe: node infra/workflows/tests/test-second-army-contract.mjs
  - text: >-
      A2: WHEN the suite is mutation-tested in a scratch copy SHALL be falsifiable, not
      tautological — reverting the direction (builder sonnet, verifiers luna/spark/flash) fails
      5 tests, swapping the verify lane's model fails 1, putting the Dux in its own builder roster
      fails 3, leaking the builder's claim into the verify prompt fails 1, and running the refuter
      at every floor fails 1. Measured by the independent gate on the first cut of this suite
      (receipt GATE-6602.md, 2026-09-15T16:21:19Z), whose 12 surviving tests are unchanged here.
    probe: node infra/workflows/tests/test-second-army-contract.mjs
  - text: >-
      A3: WHEN the script's source is read SHALL contain no trace of the reversed direction the
      first draft carried — no const VERIFIER_TABLE, and no builder roster naming the Dux's own
      seat. grep must return 0 for both.
    probe: grep -c "VERIFIER_TABLE" infra/workflows/second-army.js || true
assumptions:
  - text: >-
      Codex on M5 cannot authenticate today ("refresh token was already used"), so luna, spark and
      terra are dead doors on this machine right now. The script must therefore DECLARE them in
      deadTiers and fall through, never skip silently — which is what the dead-builder test proves
      with a SIMULATED probe failure, so the suite does not depend on today's quota weather.
    status: verified
    probe: "codex exec on M5 2026-09-15 returns the refresh-token error; `codex login` is a human credential action pending with Zero"
  - text: >-
      The live Gemini Flash slug is gemini-3.8-flash-low, not the gemini-3.5-flash spelling the
      rest of the repo carries in 22 places; the flash door pins the live one.
    status: verified
    probe: "`agy models` on M5 2026-09-15 listed gemini-3.8-flash-{high,medium,low} and the 3.7/3.6 families; gemini-3.5-flash was absent"
  - text: >-
      Date.now()/new Date()/Math.random() throw inside a Workflow script and the script has no
      filesystem access, so every timestamp arrives through args.stamp and the run report is
      written by a Write-capable agent() lane rather than by the script.
    status: verified
    probe: 'the report path is built from args.stamp and written only via the model:"haiku" report lane; the contract suite drives the script with a stub agent and records every lane'
  - text: >-
      Nothing in .github/workflows/ runs infra/workflows/tests/ today — not this suite, not the
      pre-existing test-kbli-certification-contract.mjs. The suite is run by hand until the CI
      wiring ships as its own PR, and the README says exactly that rather than claiming a
      consumer that does not exist (cicatrix #2, exists != armed).
    status: verified
    probe: "grep -rl 'infra/workflows' .github/workflows/ returns nothing"
