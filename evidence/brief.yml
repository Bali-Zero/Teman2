      vintage"
  - text: >-
      GUILT, three independent mutations. On the ARTIFACT: rolling the vintage
      back to March 2026 reds the twin's forbidden-pattern case and the month
      assertion; removing the dataset version from the header reds the version
      assertion. On the GENERATOR, which is the one that matters: putting the
      literal month back in `corpusHeader` reds the committed-artifact pin AND
      the header assertion.
    probe: >-
      manual mutation, run 2026-09-20 — artifact: 2 failed / 24 passed, then
