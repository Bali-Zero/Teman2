objective: >-
  Ledger row `llms-kbli-txt-headlines-a-march-2026-vintage-against-a-september-dataset`
  (PENDING-ARMS, opened earlier today when closing the sibling row about the
  1,563 code count). `apps/mouth/public/llms-kbli.txt` told a crawler it was a
  "March 2026 Update" — twice, counting the AI-citation instruction on line 1 —
  while the dataset it dumps is `v11.0-L2-oss-risk-20260911`. MEASURED, and the
  measurement found the real shape of the defect: the guard that already exists
  for this exact entity, `march-2026-citation-instruction` in
  `llms-public-file-guard.test.ts`, CONVICTS `llms-kbli.txt` today — it was
  simply never pointed at that file. `findForbidden(llms-kbli.txt)` returns
  `["march-2026-citation-instruction"]` while `llms.txt` is clean. So this is
  not a missing guard, it is a guard that reached one twin of two (cicatrix #3
  / W132), which is the same shape as the grid twin this lane hit twice today.
scope:
  - >-
    `apps/mouth/public/llms-kbli.txt` — the AI-citation instruction and the
    header now say September 2026, and the header additionally names the
    dataset version it dumps (`v11.0-L2-oss-risk-20260911`).
  - >-
    `apps/mouth/src/lib/llms-public-file-guard.test.ts` — the existing
    `findForbidden` innocence case now runs on the TWIN as well as on
    llms.txt; plus a new describe that derives the expected vintage from
    `metadata.version` of `KBLI_2025_FINAL_CLEAN.json` and asserts the file
    advertises that month and names that version.
constraints:
  - >-
    The vintage assertions are SCOPED to the two places the file advertises a
    vintage (`mention the <Month Year> regulatory updates`, `Master Data
    (<Month Year> Update`), never to every month name in 1,583 lines. llms.txt
    legitimately says "old March 2026 portal behavior" in prose; a guard that
    convicted on any month would have to be deleted the first time someone
    wrote a sentence about the past. Innocence test pins exactly that.
  - >-
    Only `llms-kbli.txt` is tied to the KBLI dataset's version. llms.txt's own
    "September 2026" refers to general regulatory news (SPP-TDLN and others),
    not to this dataset, and coupling it to `metadata.version` would be a
    wrong dependency dressed as a guard.
  - >-
    The month is derived from the date INSIDE the version string, and a version
    that stops carrying one fails a test of its own rather than comparing
    against undefined.
