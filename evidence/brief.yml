objective: |
  Execute Zero's 2026-08-27 GO order for Merge-OS v3 build order step 2
  (research/operations/2026-08-14-merge-os-v3-research-council.md §6): remove the
  "third payment" — a `push: main` trigger on `tests.yml`/`security.yml` that
  re-runs the heavy suite on a commit `merge_group` already tested seconds earlier.

  GROUND-TRUTH FINDING THAT CHANGED THE SHAPE OF THIS WORK: the literal removal
  already happened, 11-12 days before this GO order. `tests.yml`'s entire `push:`
  block was dropped in #4210 (2026-08-15); `security.yml`'s `on.push.branches`
  was narrowed from `[main, develop]` to `[develop]` in #4218 (2026-08-16), each
  gated on its own schedule producing a first green run first, exactly per the
  council's ordering. Both preconditions the mandate asked to re-verify (ruleset:
  no bypass actors, direct pushes blocked; tests.yml 2-hourly schedule green;
  security.yml daily 19:17Z schedule green since before 2026-08-14) are STILL
  true today — re-verified live, receipts below — but they were already
  satisfied when #4210/#4218 shipped; there was nothing left to remove.

  What was actually still wrong, and is what this PR ships: the `on:` block
  comments in BOTH files, and one PENDING-ARMS.md ledger row, kept narrating
  the removal as *future* work ("Prerequisite for a later PR to remove this
  workflow's `push: main` trigger") for 11-12 days after it landed. A second
  PENDING-ARMS row (opened 2026-08-23, an adversarial refuter finding on #4647)
  named the tests.yml half of this exact drift and left it open, owner "session
  (any lane touching tests.yml triggers)" — this session is that lane. A stale
  comment describing already-completed work as pending is indistinguishable,
  to the next reader, from work that is genuinely still open — which is the
  most credible root cause for why Zero re-issued a GO order for a step already
  shipped (cicatrix-superscar.md #9 / W106: "a cure anchored to a frozen
  measurement of the world is wrong by construction"). This PR: (1) corrects
  both comments to state what actually happened and when, (2) removes the two
  now-provably-stale PENDING-ARMS rows (live proof of arming below, not
  assumed), (3) adds a regression tripwire so the underlying fact — no
  push:main on either file — is machine-checked going forward, not only
  narrated in prose that can go stale again silently.

  Gear 3 by PATH, not by blast radius: `.github/workflows/*` is
  `HOTZONE_PATTERNS` in `scripts/evidence_pack_lint.py` — the floor is a
  deterministic lower bound on two comment-only workflow edits, never the
  author's choice. No trigger, schedule, or concurrency semantics change.
