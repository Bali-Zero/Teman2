    scripts/wa_team_promises.py — _REQUIRED_COLUMNS rebuilt as {table:
    [(column, pg_type, not_null), ...]} covering every column of both
    tables; _ALLOWED_SCHEMA_IDENTIFIERS derived from it
    (f"{table}.{column}" for every entry, plus the two index names);
    verify_required_columns() rewritten against pg_attribute/atttypid/
    regtype, information_schema removed entirely.
  - >-
    scripts/sql/pro_local/team_promises.sql — unchanged this round (the
    round-1 CREATE TABLE / ALTER ADD COLUMN split already matches the new
    Python contract 1:1, confirmed by the new cross-check test).
  - >-
    scripts/tests/test_wa_team_promises.py — 20 tests (was 16):
    parametrized column-mismatch guilt cases (core wrong-type, core
    missing, core NOT NULL mismatch, ALTER-column missing) plus the SQL-
    file/constant cross-check test; SQL-text assertions updated to
    pg_attribute/atttypid/regtype present, information_schema absent. All
    pass; ruff clean.
  - >-
    scripts/tests/test_wa_team_promises_real_pg.py — extended: after the
    complete-schema+idempotent baseline, mutates one column to a real
    Postgres DOMAIN over text and asserts the mismatch is caught by
