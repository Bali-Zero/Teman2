      The 6 C2 guilt-case DDL fixtures and the C3 migration-200 extraction
      were each run once against a live throwaway Homebrew postgresql@17
      cluster on M5 before this brief was written (not merely composed by
      inspection) — see the PR body's reported pass counts for the exact
      commands and output.
    status: verified
    probe: >-
      WA_TEAM_PROMISES_REAL_PG=1 apps/backend-rag/.venv/bin/python -m pytest
      scripts/tests/test_wa_team_promises_gate_conditions_real_pg.py -v
