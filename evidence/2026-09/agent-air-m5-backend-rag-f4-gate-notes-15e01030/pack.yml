  Zero, 2026-09-23 ("ok" to the follow-up PR for the 8 LOW notes of the
  fresh gate on #7136): close D1-D8 from a fresh origin/main, each with a
  guilt test. The notes are listed in the gate report and in the
  PENDING-ARMS row kbli-oss-refresh-proposals-have-no-applier.

