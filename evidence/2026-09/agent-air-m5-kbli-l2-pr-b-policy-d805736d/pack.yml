dissent:
  - seat: claude-sonnet-5 (guard-classifier, read-only)
    objection:
      "The first NO_BESAR port (spec §6 ruling 2, backend mapping) re-wrote 55201's l4_bali.reason
      with the withdrawn 'no Usaha Besar row → reserved for UMKM' inference; that sentence is
      published to Qdrant as bali_reason and read aloud by the chat channel, and the repo's
      test_withdrawn_umkm_inference_absent.py forbids it. The closure of those codes belongs to the
      Perpres Lampiran II layer."
    status: CONFIRMED
    resolution:
      "Ruling 2 superseded (spec §7): a NO_BESAR verdict never rewrites l4_bali; neither copy's
      mapping is ported. Guarded by test_no_besar_never_rewrites_l4 and the canonical check."
  - seat: claude-sonnet-5 (guard-classifier-2, read-only)
    objection:
      "119 codes carry per_skala_disputed_* markers (PP28 collision / false-friend quarantine).
      20111 and 49213 are among them: spec §6 ruling 4 ('resync 49213, 20111 gains 12 rows') would
      overwrite a per-ancestor restore pinned verbatim in cure_specs/restore_49213.json."
    status: CONFIRMED
    resolution:
      "Ruling 4 superseded (spec §7): quarantined per_skala is skipped (119 codes, including six of
      the nine new-only 93xxx codes). A-PSK-0001 stays open on the quarantine lane."
  - seat: claude-sonnet-5 (guard-classifier-2, read-only)
    objection:
      "data/kbli-filiera/pma-editorial-certifications.json.sourceDatasetSha256 is a fail-closed,
      human-owned publication gate; 21022's regenerated PMA prose is not in rewrite_pma_prose's
      repair table. Neither can be mechanically re-hashed."
    status: CONFIRMED
    resolution:
      "Measured 2026-09-12 by the successor window: this is not only the resync — two tests in
      backend/tests/scripts/test_kbli_qdrant_pma_sync.py are RED on the v11.0 bytes and sit in the
      required 'Backend Tests (Python)' check (the change map runs every job for this diff), so the
      PR cannot land until (a) the editorial owner re-certifies the registry against v11.0
      (sourceDatasetSha256 + reviewedAt; the 66 certified fingerprints still match — the gate is
      the dataset hash, by design human-owned) and (b) a backend PR (its merge deploys) lets
      _truncated_section_matches_reviewed_prefix accept a cap that falls after the whole
      certified block (21022). Both are Zero's call; the PR is opened with auto-merge armed and
      says so in its body. Vercel would serve v11.0 while the RAG serves the June L2 until the
      resync runs."
  - seat: codex GPT-5.6 (refuter, read-only sandbox)
    objection:
      "No HIGH. MED: merge key on scope_index carried curated fields across a scope split; setdefault
      kept one donor for duplicate keys; any non-200 became an absence with a probe date; a 200 kept
      stale absent_probes. LOW: --snapshot-codes-changed alone wrote no l2_snapshot; the canonical
      NO_BESAR test accepted OK_or_HIGHER_RISK."
    status: CONFIRMED
    resolution:
      "All six folded in commit 'fix(kbli): merge by scope identity…' with a test per finding; the
      data was regenerated under the corrected policy (rule 4 still changed_codes=0; rule 5 set
      unchanged; rows_carried_tier=997 now carries only tier-level facts across splits)."
  - seat: session (declared limit, unresolved)
    objection:
      "Innocence pins of historic lots in scripts/tests/ (46100 row count 15→12, 56101/56102 record
      hashes, 10419, and the 'diff vs origin/main is exactly …' tripwires) go red on the nightly
      report-only sweep after this merge. They are advisory and not required checks, and the
      sanctioned extension (a cure_specs manifest registering the L2 footprint) is its own PR."
    status: PLAUSIBLE
    resolution: "Ledgered in PENDING-ARMS with the sanctioned path; not silently re-pinned here."
  - seat: session (successor window 2026-09-12, declared limit)
    objection:
      "The first window's receipts covered the sidecar test only; the whole apps/mouth suite — a
      required check — had 17 reds on this branch (published aggregates 518→519, population pins
      448→449/447→448, 46100 dispute tiers 4→2, the crosswalk-pending FAQ subject gone, a stale
