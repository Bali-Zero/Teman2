runtime_proof: >-
  This PR ships no code into any deployed artifact — the proof is in CI's own runtime behavior on
  the next merge_group entries after this lands, named as the Bites observation in the PR body.
  The load-bearing PROOF FOR THIS PACK, though, is the reasoning trail itself: item 2 was not
  shipped specifically because a runtime proof for its central claim (tree identity) could not be
  constructed within budget, and the honest response to that gap was to remove the mechanism, not
  to assert it anyway.
dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      BLOCKER (round 1). The CodeQL merge_group carry-over's premise — that a merge_group's
      analyzed tree is byte-identical to what the PR's own pull_request run analyzed — is false.
      pull_request checks out refs/pull/N/merge (a moving-target test-merge against the base at
      THAT run's trigger time); merge_group checks out base-tip + earlier-queued-ahead batchmates
      + this PR. carry_over=true could report success without having scanned the merge_group
      commit.
    status: CONFIRMED
    disposition: >-
      CURED by full removal: the carry-over script, its two test files, and the wiring in
      security.yml's codeql job were all deleted/reverted before push. security.yml's codeql job
      is now byte-identical to origin/main's version. Independently corroborated by
      tp1-qwen3.8-max in the same round (see below) before the revert was applied.
  - seat: tp1-qwen3.8-max
    objection: >-
      CONFIRM (round 1, answering two targeted technical questions rather than a full review). (a)
      Confirmed the byte-identical-tree premise is false, with the same mechanistic detail as
      codex-gpt-5.6-sol (refs/pull/N/merge as a moving target; base-tip-plus-batchmates for
      merge_group). (b) Confirmed a GitHub Actions step-level timeout-minutes reports outcome ==
      'failure', not 'cancelled' — the same value a real, non-hang failure produces — flagging high
      but not absolute confidence given no live empirical test was run this session.
    status: CONFIRMED
    disposition: >-
      Both points acted on: the carry-over was fully reverted (see above); the Visa Oracle retry
      logic was reworked to detect hangs via the POSIX `timeout` utility's own exit code 124,
      captured explicitly in the step's own run: block, never via GitHub Actions' step outcome —
      a signal fully under this PR's own control rather than dependent on runner internals two
      independent seats agreed on but neither empirically re-tested live this session (see
      residual_risks).
  - seat: codex-gpt-5.6-sol
    objection: >-
      BLOCKER (round 2, on the corrected diff). CodeQL's revert and the retry rework were both
      confirmed correct, but the SAME false byte-identical-tree premise was still present,
      unchanged, in the merge_group-skip comments on snyk-python/snyk-node/snyk-docker/
      detect-secrets from item 1 — and for snyk-docker specifically, a real, pre-existing,
      documented incident in the file itself (run 30302472020: a merge_group run caught a broken
      Docker build the PR-head run had missed) is direct historical proof the premise fails for
      that job. Recommended reverting all four.
    status: CONFIRMED
    disposition: >-
      PARTIALLY cured, not fully accepted as stated. snyk-docker: fully reverted (the cited
      incident is direct, first-party evidence, verified by this pack's own author reading the
      file — see receipts). snyk-python, snyk-node, detect-secrets: comments rewritten to drop the
      false byte-identical claim and state the real, narrower argument (advisory-only status;
      any external change is caught by ITS OWN origin PR's scan) instead of reverting — judged a
      structurally different risk class (compositional Docker-build interaction vs. per-item
      CVE/pattern lookup) than snyk-docker, and NOT accepted as-recommended without independent
      arbitration (see next entry) given the "generator is never grader" standard applies to
      review seats' recommendations too, not only to the build lane's own work.
  - seat: tp1-qwen3.8-max
    objection: >-
      AGREE (round 2, arbitrating the partial-vs-full-revert judgment call from the entry above).
      Asked directly whether the partial revert (snyk-docker only) was defensible against
      codex-gpt-5.6-sol's "all four" recommendation, or whether a concrete, realistic (not
      contrived) failure scenario existed for snyk-python/snyk-node/detect-secrets specifically.
    status: CONFIRMED
    disposition: >-
      Verdict AGREE with the partial revert: the compositional-build-vs-per-item-lookup line is
      the correct one, and no realistic counter-scenario survived scrutiny for the three surviving
      skips (dependency-resolution interaction, overrides/resolutions abuse, baseline-suppression
      removal, cross-file secret construction were all tried and found contrived or already
      inapplicable given each job's diff-scoped/advisory-only design). One non-blocking polish
      suggested and applied: an explicit "if this job is ever made required, remove the skip"
      comment on the three surviving jobs, making the advisory-only dependency greppable for a
      future reviewer.
residual_risks:
  - "Item 2 (CodeQL carry-over) is deliberately NOT shipped as an optimization — see brief.yml's
    risks section for what a correct future attempt would need (closed-loop tree verification, not
    Checks-API-status-only)."
  - "The step-timeout-produces-outcome=='failure' fact this PR's retry design now avoids depending
    on was confirmed by TWO independent, cross-family, consistently-reasoned seats, but was NOT
    independently re-verified via a live empirical test in this session (unlike the prior PR's
    continue-on-error dissent, which specifically needed a tie-break because the two seats
    DISAGREED with each other — here they agreed, a materially different epistemic situation).
    The retry design's own correctness does not actually depend on this fact either way (it uses
    the POSIX `timeout` exit code, not GitHub Actions' outcome, as its detection signal), so this
    residual risk is about a doc-comment's accuracy, not the mechanism's correctness."
  - "timeout --kill-after=10 does not eliminate hang risk entirely (a SIGKILL-immune process would
    still exceed budget) — the outer GH Actions step-level timeout-minutes remains the final
    backstop, at the cost of that narrow case not being retried. Flagged by review, accepted as a
    reasonable residual given how rare a SIGKILL-immune hang is in practice."
  - "${PIPESTATUS[0]} in the smoke step does not check tee's own exit status — an extremely
    low-probability write failure to the GitHub-Actions-guaranteed-writable $RUNNER_TEMP path
    could in principle be masked. Flagged by review, not fixed: judged not worth the added
    complexity within this PR's budget."
  - "Item 1's three surviving skips depend on their advisory-only (non-required) status remaining
    true — each comment now says explicitly to remove the skip if that status ever changes, but
    this is not machine-enforced."
