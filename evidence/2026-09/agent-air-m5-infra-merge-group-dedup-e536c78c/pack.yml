    the total): security.yml carries most of its insertions in the reverted-with-explanation
    snyk-docker/CodeQL sections and the honesty-corrected snyk-python/snyk-node/detect-secrets
    comments, with a handful of deletions where the original merge_group-skip lines were removed
    on revert; tests.yml carries the bulk of the insertions, split roughly in half between the
