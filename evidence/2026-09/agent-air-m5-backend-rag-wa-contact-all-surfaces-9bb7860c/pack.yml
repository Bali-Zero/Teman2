brief_ref: evidence/brief.yml
brief_ref_note: >-
  The literal path is required: harness-floor.yml stages the brief to
  /tmp/evidence-check/evidence/brief.yml and lints with --repo-root /tmp/evidence-check, so a
  per-task path here does not resolve in CI. A LOCAL lint therefore judges the stale root brief,
  not this task's -- the real one is the sibling file in this directory.
plan_ref: >-
