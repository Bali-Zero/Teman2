    origin/main)`, never two-dot (W102). The figures are deliberately not restated here: this pack is
    itself one of the files, so any number written into it is stale the moment it is written -- run
    the command. Shape rather than size: fourteen one-literal-to-one-attribute edits across ten
    modules; one helper renamed with its five call sites; one hand-typed constant made derived; two
    comments corrected; two new guards in the tripwire file; one doc banner amended; one ledger row
    closed by append. Zero migrations, zero workflows, zero frontend, zero endpoint or schema change.
  behaviour_change: >-
    Every client-facing WhatsApp emission in apps/backend-rag/backend now names the client-contact
    line (+62 821 3454 721) instead of the bot's Meta inbound line (+62 821 3465 159): the invoice
    email, five CRM lifecycle emails, the shared notification footer, the balizero.com website-widget
    prompt, and three pricing fallbacks (two fallback_contact blocks and the LLM pricing context's
    Contact: line). settings.SUPPORT_WHATSAPP is untouched and every inbound webhook path is
    unchanged. Two of the edited surfaces are dormant and are declared as such below.
