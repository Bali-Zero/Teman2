council_run: journal.jsonl
cloud_ok: >-
  SYMBIOSIS Law 2 output boundary, CLAUDE.md section 14. The pii_local rule fires on the PATH
  (backend/services/crm/**, the WhatsApp channel), not on the CONTENT, and it is right to: those are
  PII-bearing modules. What travelled to the non-local seats is not. Each cross-family and subagent
  dispatch carried the DIFF and the two Bali Zero business phone numbers, both of which the company
  publishes itself on its price list, its website and its brochures. No client identifier, no message
  body, no CRM row, no OSINT record appears in any prompt, any receipt, or this pack -- and none
  could, because the diff changes email TEMPLATE text and never touches the data interpolated into
  it. The paid-endpoint boundary is likewise untouched: codex-gpt-5.6-sol runs on the ChatGPT Pro
  flat subscription in a read-only sandbox, and every Anthropic seat is a CLI session on the MAX/Team
  OAuth path. No paid per-token key, Anthropic or otherwise, was used or installed.
pii_scan: clean
pii_scan_note: >-
  No client data anywhere in the diff, brief or pack. The two numbers handled throughout are Bali
  Zero's OWN business lines -- one the company's Meta-verified inbound WhatsApp Business number, the
  other the staff line the company already publishes on its price list, its website and its
  brochures. Neither is a client's number, and no client identifier, message body or OSINT record
  appears in any receipt.
dissent:
  - seat: codex-gpt-5.6-sol xhigh (cross-family)
    objection: >-
      pricing_service.py::_support_contacts returns (SUPPORT_EMAIL, SUPPORT_WHATSAPP) and three call
      sites ship the second element to a client. The diff claims to have swept the backend and has
      not.
    status: CONFIRMED
    resolution: >-
      The most valuable finding in either review, and the one that justifies keeping a cross-family
      seat on a diff this mechanical. It was invisible to my sweep, my grep AND my own first guard
      for the same reason: the file contains no digits: it reads the setting by name. Helper renamed
      _client_facing_contacts, returns CLIENT_CONTACT_WHATSAPP, five call sites updated, zero
      references to the old name left. The twin guard exists because of this finding and is
      guilt-proved by reverting exactly it.
  - seat: codex-gpt-5.6-sol xhigh (cross-family)
    objection: >-
      getattr(settings, "SUPPORT_WHATSAPP") and os.getenv("SUPPORT_WHATSAPP") walk through BOTH
      guards -- no attribute node for one to see, no digits for the other.
    status: CONFIRMED
    resolution: >-
      Accepted in full. The reader guard now treats the NAME as a string too: any constant equal to
      "SUPPORT_WHATSAPP" counts as a read, wherever it appears. That over-matches slightly -- a module
      merely mentioning the name in a string fails -- which is the right direction, because the
      escape is one budget row with a reason while the miss it replaces is a client silently handed
      the wrong number. Both forms probed RED.
  - seat: codex-gpt-5.6-sol xhigh (cross-family)
    objection: >-
      The allowlist is a path fence, not a content fence. Five files, 5,132 lines, entirely
      unexamined. If whatsapp_chat.py grows a literal CTA, nothing intercepts it.
    status: CONFIRMED
    resolution: >-
      Accepted, and the fix went further than the finding. The allowlist is now a per-file occurrence
      BUDGET that fails in both directions: one more occurrence is red, and so is a budget nobody
      spends (an unused budget is a standing exemption for whatever lands in that file next).
      Re-measuring the five files with the live guard's own logic then showed TWO of them at zero --
      whatsapp_chat.py and _memory_identity.py name the number only in `#` comments, which an AST walk
      never sees, so they had been exempted for nothing. Both dropped from the budget and now fully
      guarded; the reviewer's exact scenario probes RED.
  - seat: codex-gpt-5.6-sol xhigh (cross-family)
    objection: >-
      config.py:36 and scripts/pricelist_2026/schema.py:23 still say eleven client-facing surfaces
      emit SUPPORT_WHATSAPP. The next maintainer follows the authoritative comment and puts the bot's
      number back.
    status: CONFIRMED
    resolution: >-
      The sharpest framing in the review. This is exactly the mechanism that produced the defect being
      finished here: #5418 chose the wrong number because a TEST said so, and a comment carries the
      same authority. Both amended, with the retired sentence quoted and dated rather than deleted,
      and both now name the two guards that enforce the corrected statement.
  - seat: codex-gpt-5.6-sol xhigh (cross-family)
    objection: >-
      The digit guard false-flags innocent strings -- "IDR 628.213.465.159", a UUID beginning
      62821346-5159, "migration_628213465159", a base64 blob containing the run.
    status: RETRACTED
    resolution: >-
      RETRACTED on measurement, not on my say-so, and the status field is the honest one: the
      objection describes a real property of the guard but not a real defect in this repo. I
      answered it by measuring the corpus instead of arguing about it. Every "innocent" it offers was CONSTRUCTED to contain the bot's twelve digits
      in order. Across 19,822 files there are 82 occurrences of those digits and all 82 are the real
      number; the longest digit run of any real IDR price in the tree is 8, and the only 10-11 digit
      runs anywhere are the statutory PT PMA minimum capital. The only 12-digit non-phone string in
      the whole repo is the reviewer's own example, quoted inside the guard's docstring as the
      hypothesis it answers. Narrowing the guard (refusing to collapse dots, demanding a phone-like
      prefix) would buy that contrived case back by reintroducing a spelling this same reviewer had
      already broken the guard with -- a trade, not a fix. Recorded as a declared over-match with an
      escape hatch, not as a cure.
  - seat: codex-gpt-5.6-sol xhigh (cross-family)
    objection: >-
      Runtime assembly still evades the digit guard: "a" + "b", "".join([...]), and values bound to
      separate names then interpolated.
    status: CONFIRMED
    resolution: >-
      Two of the four are folded and now probe RED -- BinOp Add chains of constants, and SEP.join over
      a constant list. The other two need real constant propagation, which is a larger and more
      fragile instrument inside a tripwire than the defect warrants, so they are a NAMED RESIDUAL
      LIMIT written into the guard's own docstring rather than left for a reader to discover. What
      makes that acceptable is that the realistic version of the same hole -- reaching the value with
      no digits at all -- is now closed completely.
  - seat: claude-sonnet-5 (adversarial spalla)
    objection: >-
      The guard misses a non-breaking hyphen (U+2011) and a literal wrapped across two lines by a
      formatter, and it FALSE-FLAGS a comment narrating the number's history -- the exact prose style
      this PR itself writes.
    status: CONFIRMED
    resolution: >-
      All three accepted and the guard REPLACED rather than patched: it now walks the AST instead of
      the text. Python concatenates adjacent literals at parse time so the wrapped case arrives as one
      constant; comments are not in the tree at all; and the separator class is defined by Unicode
      category (Pd, Zs, Cf) rather than by a list of characters somebody remembered. All three probes
      replayed against the rewrite.
  - seat: claude-sonnet-5 (adversarial spalla)
    objection: >-
      welcome_email_service.py:334 hard-codes the client digits as _BZ_WHATSAPP = "628213454721",
      feeding the welcome email's CTA button and footer. Correct today, unpinned, and it will drift
      silently.
    status: CONFIRMED
    resolution: >-
      Accepted. It is the most instructive finding of the two reviews because the value was ALREADY
      RIGHT -- which is precisely why no guard looking for the wrong number could ever see it. Now
      derived from the setting and pinned as a sixth copy; re-typing the digits by hand probes RED.
  - seat: claude-sonnet-5 (adversarial spalla)
    objection: >-
      The test exclusion is directory-shaped (backend/tests/ only), so a legitimate test dropped in
      backend/agents/ or backend/scripts/ would trip the guard.
    status: CONFIRMED
    resolution: >-
      Accepted. The exclusion now judges the FILE (a basename starting test_ or ending _test.py) as
      well as the tree. Probed with a file under backend/scripts/.
