    census: EXPECTED_OUTCOME, EXPECTED_DISCLOSED_REVIEW_FLAGS, the derived
    EXPECTED_CONDITION_REASON_FOR_FLAG, the new allowlist + keystone test)
    + test_seq21_pack.py's one pinned assertion (mechanical, corpus-count
    coupled — NOT in the original four-file list, declared as a deviation
    below). enumerate-interview-space.ts, tree.ts, fact-mapper.ts, i18n.ts,
    OutcomeSheet.tsx, engine-adapter.ts and every evaluate_path.py map are
    UNTOUCHED — measured, git diff --stat names none of them.
  - >-
    No production walk, no POST to /api/visa-oracle/evaluate, no browser
    walk. The fixtures replay offline against the signed pack; this slice
    changes no visitor-facing surface.
  - >-
    PR ships UNARMED, never merged/armed/deployed by the builder.
