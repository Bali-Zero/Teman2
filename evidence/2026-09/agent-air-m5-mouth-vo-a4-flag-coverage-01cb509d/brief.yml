objective: >-
  Slice A4 (MANDATE-vo.md, DRAFT-SPEC-A4-1.v2.md): twelve of fourteen
  DisclosedReviewFlag members were raised by no corpus walk, and no test
  could say so — every flag test iterates EXPECTED_DISCLOSED_REVIEW_FLAGS,
  the corpus's own pinned table, never the enum, so A3 added three
  REVIEW_FLAG_MAP entries and broke nothing. A4 extends the CORPUS
  GENERATOR (generate-walk-corpus.ts), not the B2''-c enumerator, with
  three scenarios on the offshore/tourism branch: disclosed_conditions
  (the nine conditioning review_gate items in one walk, alphabetically
  sorted because that is what the browser persists), disclosed_criminal
  (criminal_record ALONE — a HUMAN_REVIEW_REQUIRED fixture by design since
  it HOLDS and would otherwise hide the nine conditioning codes),
  multi_purpose (trip_scope: "multiple", byte-identical to offshore/tourism
  except its own flag). Corpus 112 -> 115 fixtures, raised flags 2 -> 13 of
  14. The new keystone test_every_disclosure_flag_is_raised_by_at_least_one_walk
  iterates DisclosedReviewFlag itself rather than the corpus, with an
  allowlist (NOT_RAISED_BY_ANY_INTERVIEW_WALK) holding exactly
  CONFLICTING_IMMIGRATION_STATUS (impossible from the interview by
  construction: every walk's immigration.overstay_days is KNOWN 0) plus a
  companion pin on the allowlist's own contents (the missing-flag
  assertion alone cannot catch a bogus allowlist entry). test_seq21_pack.py's
  unasked-corpus census globs the same fixture directory and is re-pinned
  mechanically (89 -> 92 SUPPORTED_CANDIDATES, no other row moves) since it
  reads the whole corpus, not just A4's three files.
constraints:
