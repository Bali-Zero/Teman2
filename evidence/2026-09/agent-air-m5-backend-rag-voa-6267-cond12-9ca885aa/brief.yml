acceptance:
  - text: >-
      WHERE a test's NAME and docstring state what it establishes, THE SYSTEM
      SHALL state only what the assertions beside them check — a 307, a whole
      Location equality, and an envelope comparison — and SHALL NOT name a
      middleware, a route, a matcher, a mechanism or a destination operation.
    status: verified
    probe: >-
      grep -rn "past_the_middleware\|Match\.\|operation_id\|matches(scope"
      on the changed test file returns nothing; the test's three assertions are
      status_code == 307, Location equality, and
      contract_401_envelope(path) == contract_401_envelope(path.rstrip("/")).
  - text: >-
      WHEN a trailing-slash variant of a frozen staff operation is requested on
      the app this test builds, THE SYSTEM SHALL answer 307 with Location equal
      to the slash-less path, for three paths across BOTH routers that carry
      frozen staff operations.
    status: verified
    probe: >-
      PYTHONPATH=. pytest
      backend/tests/unit/middleware/test_hybrid_auth_contract_401_envelope.py -k
      trailing_slash_answers_307 (3 cases: two on garuda_staff_router, one on
      garuda_orders_router's late-resolution)
  - text: >-
      IF the redirect target changes, or the two paths stop resolving to the
      same contract envelope, THEN the suite SHALL go red.
    status: verified
    probe: >-
      two guilt mutations, each restored afterwards: a route redirecting the
      trailing-slash path to https://elsewhere.invalid, and
      contract_401_envelope made to return None for a trailing slash so the two
      paths disagree.
  - text: >-
      WHERE the claim is that these paths ARE the frozen contract's operations,
      THE SYSTEM SHALL anchor it to the frozen-vs-live parity suite
      `backend/tests/app/routers/test_garuda_voa_openapi_parity.py` rather than
      to a unit test -- and NOT to the `garuda-contract-parity` workflow, whose
      name says it compares the two and whose job does not.
    status: verified
    probe: >-
      the parity file builds the schema from the deployed `main_api` singleton
      (`_live_operations`) and compares it operation by operation against the
      frozen openapi.yaml; it is enumerated by scripts/ci/shard_tests.py
      (ROOTS includes "backend/tests/", no allowlist, and its only exclusion is
      EXCLUDED_DIRS = ("backend/tests/e2e",), which does not contain this file)
      and therefore runs in the required backend shards on every PR. The FIRST version of this row named
      .github/workflows/garuda-contract-parity.yml instead and its probe only
      checked that the workflow EXISTS: that workflow installs pytest+pyyaml
      only and its suite never imports the app (grep for fastapi / main_api /
      app_factory under products/garuda-voa/contracts/tests/ = 0 hits), so it
      checks the frozen document against itself. Caught by the on-disk gate on
      head 48cf44357a (REWORK-BUILD) -- existence was measured, behaviour was
      not.
anchor_note: >-
  Decision #19 (Imperatore, in force of Zero's 04:30Z autonomous-conduct
  ruling, revocable by Zero) moved the operation-identity claim OUT of the unit
  test after three adversarial rounds established it cannot be held there: a
  test running in the same process as the router it inspects cannot distinguish
  the frozen contract's operation from a counterfeit installed ahead of it
  (refuter defeated, in turn, a path-string comparison, a `route.matches`
  scope without a Host header, and identity by `operation_id`, which is
  reusable). The identity claim now lives with
  `backend/tests/app/routers/test_garuda_voa_openapi_parity.py`, which compares
  the frozen contract against the live `main_api` singleton and has an anchor
  outside the process under test.
