dissent:
  - seat: claude-opus-5
    objection: >-
      The v2 HairlineGrid's own responsive-collapse API does not work, and this page had to work
      around it.
    status: CONFIRMED
    disposition: >-
      Measured, not inferred, and BOTH shapes were tried on a dev server before the workaround was
      written. HairlineGrid sets `--cols` as an INLINE style and then, for `colsCollapsed`, emits a
      stylesheet rule setting the same custom property on the same element. An inline declaration
      beats a non-important stylesheet rule, so `colsCollapsed` + `collapseAt` + `id` is inert, and
      so is any page-side `max-md:[--cols:...]` class. With the template unchanged at 390 the empty
      tracks still claimed their minimums and the row collapsed. This page overrides
      `grid-template-columns` on the rows themselves instead, scoped to its own descendants. The
      defect belongs to the primitive (#6520) and is reported to the seat that owns it; this window
      is forbidden to edit components/workspace/r19.
  - seat: claude-opus-5
    objection: >-
      The `alerted` status is copper by a RULING whose stated derivation does not hold on the page.
    status: CONFIRMED
    disposition: >-
      The ruling was accepted on the ground that copper on `alerted` is "derived from the row
      carrying the viewer's own Approve/Reject". The render shows it is not: only `proposed` rows
      render those controls, and an `alerted` row's action cell carries an alert id and nothing to
      act on. The code is honest about this — ObligationsTable's header says in as many words that
      `alerted` is copper "as a RULING and not as a derivation this row can prove" — and this window
      obeys the ruling rather than quietly overriding it. Flagged for the ruling to be re-examined:
      as it stands, the one copper pill a viewer cannot act on is the one the law would forbid.
  - seat: claude-opus-5
    objection: >-
      /review's own mobile collapse comment, shipped in #6524, describes a mechanism that does not
      work.
    status: CONFIRMED
    disposition: >-
      Same root cause as the first dissent, discovered one PR too late. /review carries
      `className="max-md:[--cols:minmax(0,1fr)_auto]"` and a comment saying that is what relocates
      its dropped columns. On the v2 primitive that class is inert. The PAGE is still correct at 390
      — its `max-md:hidden` cells leave only two visible children, which land in the first two
      tracks, and those two happen to fit — so nothing is broken for a reader today. But it is
      correct by accident, not by the stated mechanism, and the comment is wrong. #6524 was armed and
      then merged before this was known; recorded here rather than silently corrected, and it is
      cured together with the primitive.
