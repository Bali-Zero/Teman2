what_changed: |
  Three files: one new workflow (`.github/workflows/wa-team-promises-tests.yml`), one line added
  to `main-push-failure-watch.yml`'s `workflows:` list, and this evidence pack.

  The workflow triggers on `pull_request` and `push: main`, path-filtered on the T3 promise-gate
  corpus's actual read-set (see the file's own header comment for the file-by-file reasoning,
  including the files added after cross-family review below and after the fresh gate's own R5).
  One job step installs `pytest`, `pytest-asyncio>=1.4.0` and `asyncpg>=0.31.0` (the corpus's
  `@pytest.mark.asyncio` tests need the plugin explicitly, since this repo has no root-level
  pytest.ini/pyproject.toml/setup.cfg to supply it implicitly — this was MISSING in the first
  version of this pack and is the fresh gate's own finding, see the new dissent entry below), then
  runs `scripts/tests/test_wa_team_promises*.py` ONCE and asserts on the number of cases that
  PASSED — not the exit code alone (0 on an all-skip run) and not the collected count (counts
  skips too). The capture is guarded `|| RC=$?` so pytest's own output survives a non-zero exit
  under GitHub's default `bash -e {0}` (scar W101/W107, same shape `queue-doctor-tests.yml`
  documents). FLOOR=122, the corpus's real passing count after #7413 merged to `main`, REAL_PG
  unset (21 skip, the real-PG opt-in cases) — superseding the original 94/16 count from before
  #7413 merged.

  REAL_PG is deliberately excluded — see receipts/proof below. The four opt-in suites spin up
  their own throwaway PG cluster via `pg_ctl`/`initdb` on `PATH`, not a `DATABASE_URL`; this repo
  has no workflow running that shape, only the GHCR-mirror service-container shape (which answers
  on a socket and puts no binaries on `PATH`). Wiring either shape here would be inventing a new
  PG setup, which the coordinator's C-D spec explicitly said not to do.

  ROUND 2 (after cross-family review): both `agy/gemini-3.1-pro` and `kimi-code/k3`, independently
  and without seeing each other's answer, found the SAME real gap — `scripts/tg_gateway_verdict.py`
  is imported at module scope by `scripts/wa_team_promises.py:71` (`extract_gateway_verdict`), so a
  rename/deletion there breaks COLLECTION of the entire corpus while triggering nothing. `kimi`
  additionally flagged `scripts/tg_notify.py`, which one test (`test_wa_team_promises_scan.py`'s B2
  cadence-sim) loads and executes via `importlib.util.spec_from_file_location` — a real module
  load, not a fake. `agy` judged that one omittable (mirroring `queue-doctor-tests.yml`'s deliberate
  non-inclusion of `scripts/mq.sh`); on inspection the analogy does not hold: `mq.sh` has ZERO
  references from the corpus, while `tg_notify.py` is actually loaded and run by a real test. Both
  files were added to both `paths:` lists (pull_request and push, kept symmetric), with the
  disagreement recorded rather than silently resolved in the workflow's own comment.

  ROUND 3 (REWORK-BUILD, fresh final gate on `77f42ba771`): the gate ran this workflow's OWN run
  on PR #7429 (36254345568) and found it RED — every `@pytest.mark.asyncio` test failed with
  "async def functions are not natively supported", because the install step never installed
  `pytest-asyncio`, and the pack's own innocence receipt had been taken on this session's
  interpreter, which already carried the plugin globally, not on the CI-shaped environment. The
  gate also found `FLOOR=94` stale (#7413 had merged, raising the corpus to 122/21) and four
  executed `__init__.py` files missing from the path filter. Codex, dispatched independently by
  the gate with a neutral prompt, found the same `pytest-asyncio` gap on its own. Fixed: the
  install step now installs `pytest-asyncio>=1.4.0`; `FLOOR=122` with the header updated to
  122/21; the four `__init__.py` files added to both `paths:` lists; every receipt below that
  depends on the install step was RE-TAKEN in a clean, throwaway venv built with EXACTLY the
  step's own install line — never this session's own interpreter, which is what let the bug
  through the first time.

proof: |
  The absence, before this diff:
    grep -rln 'test_wa_team_promises' .github/workflows/   -> 0 hits

  The floor, from the real tool rather than by inspection (hot-zone path, `.github/workflows/*`):
    evidence_pack_lint.py --print-floor --numstat-file <numstat> --patch-file <patch>
      --changed-files-file <changed>   -> 3

  actionlint on both changed workflow files: clean.

  scripts/check_watcher_coverage.py: before this diff's `main-push-failure-watch.yml` edit ->
  "1 violation(s): `wa team promises tests` ... is not covered"; after -> "all 124 live
  workflow(s) covered".

  CLEAN-VENV PROVENANCE (round 3, replacing the session-interpreter receipts the gate correctly
  rejected): `python3 -m venv <scratch>` then `<scratch>/bin/pip install --quiet pytest
  "pytest-asyncio>=1.4.0" "asyncpg>=0.31.0"` — the step's own three packages, nothing else,
  installed fresh. `pip list` confirms exactly `pytest 9.1.1`, `pytest-asyncio 1.4.0`, `asyncpg
  0.31.0`. Every receipt below in this block used `<scratch>/bin/python3`, never this session's
  own interpreter.

  INNOCENCE — the exact step command, in the clean venv, against the corpus as it stands on
  `main` after the R2 merge:
    PYTHONDONTWRITEBYTECODE=1 python3 -m pytest scripts/tests/test_wa_team_promises*.py -q
    -> "122 passed, 21 skipped in 0.97s"

  GUILT — real-file mutation, on a throwaway (never pushed) local edit to
  scripts/sql/pro_local/team_promises.sql: `promise_text` renamed to `promise_text_MUTATED`.
  Same command, same clean venv:
    -> "8 failed, 114 passed, 21 skipped" (the SQL/constant cross-checker, the required-columns
       test, and a fifth case that only exists in the post-#7413 corpus —
       `test_guilt_s2_duplicate_column_inside_one_create_body_is_rejected` — all catch it; the
       count of 8 vs. the original pack's 7 is exactly #7413's own S2 addition, not a new defect).
       File restored from a pre-mutation copy immediately after; `git status` on it afterward
       shows no diff, and a re-run in the same venv confirms 122 passed, 21 skipped again.

  INFLATED FLOOR — the verbatim step body (extracted from the YAML), run under `bash -e` (GitHub's
  own default shell) with the clean venv on `PATH`:
    FLOOR=122 -> "wa_team_promises corpus: 122 passing cases (floor 122)", rc 0
    FLOOR=123 -> "::error:: 122 below floor 123", rc 1
  Confirms the `-lt` comparison and the `|| RC=$?` errexit-immunity both survive GitHub's actual
  shell, not just a bare local one.

  Cross-family review, both independent (see dissent below for the full text and adjudication):
    agy/gemini-3.1-pro  -> VERDICT: GO, one completeness note (tg_gateway_verdict.py; tg_notify.py
                           judged omittable)
    kimi-code/k3        -> VERDICT: NO-GO pending a 2-line fix (both files), then GO

  ROUND 3 — the fresh final gate (verdict REWORK-BUILD) plus its own independently-dispatched
  Codex pass both found the `pytest-asyncio` gap; neither council seat above had caught it. See
  the new dissent entry below.

dissent:
  - seat: agy/gemini-3.1-pro
    objection:
      "scripts/tg_gateway_verdict.py is imported at module scope by scripts/wa_team_promises.py
      (line 71, `extract_gateway_verdict`) and is missing from the path filter — a rename/deletion
      there breaks collection of the whole corpus while triggering nothing."
    status: CONFIRMED
    resolution: "Added to both paths: lists."
  - seat: agy/gemini-3.1-pro
    objection:
      "scripts/tg_notify.py is loaded dynamically by test_wa_team_promises_scan.py's B2
      cadence-sim test, but omitting it is reasonable — analogous to queue-doctor-tests.yml's
      deliberate non-inclusion of scripts/mq.sh, since including a shared 114-reference Telegram
      sink would arm this workflow on unrelated edits."
    status: RETRACTED
    resolution:
      "The analogy does not hold on inspection: mq.sh has ZERO references from the queue-doctor
      corpus (queue_doctor.py never calls it), which is WHY queue-doctor-tests.yml could safely
      omit it. tg_notify.py has a real, non-zero reference: the B2 test loads and executes the
      actual file via importlib. Read-set membership, not sharing breadth, is the omission test
      queue-doctor-tests.yml itself states. Added to both paths: lists; see kimi's identical
      finding below, reached independently."
  - seat: kimi-code/k3
    objection:
      "scripts/tg_gateway_verdict.py AND scripts/tg_notify.py are both missing from the path
      filter — the corpus's own measured-completeness claim ('all reach it transitively through
      import scripts.wa_team_promises') is falsified by wa_team_promises.py's own next import
      line. Verdict NO-GO until both are added."
    status: CONFIRMED
    resolution: "Both added to both paths: lists (pull_request and push, kept symmetric)."
  - seat: kimi-code/k3
    objection:
      "pytest is unpinned; the floor parser scrapes pytest's human-readable summary line, which
      is not a stable interface across major pytest versions."
    status: CONFIRMED
    resolution:
      "Left as a documented LOW-severity nit, not fixed in this PR: queue-doctor-tests.yml and
      every sibling in this family (mq-oracle-tests.yml, pajak-monitor-tests.yml, ...) share the
      identical unpinned-pytest + summary-line-scrape shape — fixing it here alone would diverge
      from the copied pattern rather than follow it, and a repo-wide pytest floor-parser pin is a
      separate, cross-cutting PR, not this C-D closure's scope."
  - seat: claude-sonnet-5 (conducting session, on its own council)
    objection:
      "Only two of the three usual cross-family seats answered (codex-gpt-5.6-sol's background
      run explored unrelated repo context and never returned a scoped verdict on this diff within
      a reasonable wall-clock budget) — this pack rests on two outside opinions, not three."
    status: CONFIRMED
    resolution:
      "Said plainly rather than presented as a full council. Both seats that DID answer converged
      independently on the same primary finding (tg_gateway_verdict.py), which is stronger signal
      than a third seat rubber-stamping the same two."
  - seat: "fresh final gate (Opus, PR #7429 @ 77f42ba771)"
    objection:
      "The workflow is red on its own PR (run 36254345568, 15 failed, 107 passed, 21 skipped).
      All 15 failures are 'async def functions are not natively supported' — the install step
      installs pytest and asyncpg but not pytest-asyncio, and no root pytest.ini/pyproject.toml/
      setup.cfg supplies it implicitly. The pack's own claim that asyncpg is 'the only third-party
      import the corpus needs' is false, and the innocence receipt (94 passed, 16 skipped) came
      from an interpreter that already had pytest-asyncio installed globally — not the environment
      CI actually gets. FLOOR=94 is also stale: #7413 merged before this PR's CI ran, raising the
      corpus to 122 passed / 21 skipped, so up to 28 passing cases (including #7413's own S1-S5
      discriminating tests) could vanish silently. Four executed package __init__.py files
      (scripts/tests, apps/backend-rag/backend{,/services,/services/wa_copilot}) are also missing
      from the path filter."
    status: CONFIRMED
    resolution:
      "R1: added pytest-asyncio>=1.4.0 to the install step (apps/backend-rag/requirements.txt:113's
      floor), corrected the comment. R2: merged origin/main (not rebased — the branch was already
      pushed), set FLOOR=122, updated the header/inline comments to 122/21. R3 (this edit): removed
      the false asyncpg-only claim, re-took every install-dependent receipt in a clean venv built
      with exactly the step's own install line, and wrote this entry. R5: added the four
      __init__.py files to both paths: lists. See the CLEAN-VENV PROVENANCE block in proof: above
      for the re-taken receipts, all reproducing the gate's own numbers exactly (122/21 innocence,
      8 failed/114 passed/21 skipped guilt — the count of 8 vs. the gate's earlier count of 7 is
      #7413's own new S2 test, not a regression)."
  - seat: "codex-gpt-5.6-sol (dispatched independently by the fresh final gate, read-only, neutral prompt)"
    objection:
      "VERDICT: NO-GO. pytest-asyncio missing, 15 async items fail with 'not natively supported',
      the asyncpg-only comment is false (BLOCKER). FLOOR=94 is stale against a 143-collected corpus
      (122 runnable + 21 real-PG skips) (MAJOR). The four package __init__.py files are on the
      executed import chain but missing from paths: (LOW). Found independently — the gate's own
      prompt to Codex never named the plugin, so this was not a leading question."
    status: CONFIRMED
    resolution:
      "Same fix as the gate's own finding above (R1-R2, R5). Two independent read-only reviewers
      (the gate session and Codex) converged on the identical root cause without seeing each
      other's answer, which is stronger signal than either alone — recorded as its own entry
      rather than folded silently into the gate's, since it is a genuinely separate seat's
      finding."

