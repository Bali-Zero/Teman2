  PR (closes C-D on #7413)'. Dispatched by the coordinator (team-lead) as the C-D closure task on
  PR #7413's gate comment (`gh api repos/Bali-Zero/Teman2/issues/comments/5846951975`), which
  names the fix explicitly: wire scripts/tests/test_wa_team_promises*.py into a PR-gating job."
