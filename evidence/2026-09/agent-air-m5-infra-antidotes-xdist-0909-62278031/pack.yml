task_id: antidotes-xdist
gear: 3
gate_class: opus
brief_ref: evidence/brief.yml
council_run: council-journal.jsonl
date: 2026-09-09
machine: M5
lanes:
  - lane: one pytest-xdist invocation replacing 68 sequential pytest interpreter invocations in the antidotes "Unit tests" step
    role: build
    seat: claude-sonnet-5 (subagent dispatched by the M5 Fable 5.1 orchestrating session, this worktree)
    note: >-
      Measured the disease: sequential loop 288s, single pytest invocation
      258s, `pytest -n 4` 161s on the measuring machine, same pass/skip set.
      Read scripts/tests/test_immune_enforcement_trigger_symmetry.py before
      editing and found it parses the literal `for t in \ ... ; do` shell
      shape to pair every looped test with a sentinel trigger path
      (`_LOOP_OPEN_RE`/`_LOOP_RE`) — converting the list to a bash array
      would have silently disarmed that pin (zero loop regions found,
      `test_apparatus_loop_set_is_non_empty` and
      `test_this_test_is_itself_both_looped_and_triggered` both depend on
      it). Kept the for-loop shell syntax and the 68-line file list
      byte-identical; changed only the loop body (collect into `tests=()`
      instead of running pytest per file) and moved the single `pytest -q
      -p no:cacheprovider -n 4 "${tests[@]}"` call after the loop.
      pytest-xdist added to the pip install line.
    revision_note: >-
      Round-1 cross-family review (codex-gpt-5.6-sol) named two real nits
      on the first diff: pytest-xdist installed with no pinned version
      (drift risk, inconsistent with the PyYAML==6.0.3 pin on the same
      line), and the workflow comment's file/test-count measurement read
      as stale next to this worktree's own later local run reporting more
      tests (see the "1919 passed" receipt below — the repo grew by a
      couple of test files between the two measurements the same day, not
      a regression). Both cured in a separate commit:
      `pytest-xdist==3.8.0` pinned; comment reworded to state the count is
      a point-in-time measurement expected to drift. codex's round-1 review
      also raised an ABSTRACT concern (xdist could in principle expose
      shared-tmp-path/cwd/port/DB races, scar-W131-shaped) without naming a
      specific file — answered with a concrete grep across all 68 looped
      test files for hardcoded /tmp paths not using tmp_path, socket/bind/
      port usage, sqlite/postgres file paths, os.chdir at runtime, and
      module-level mutable global state. Found: one lockfile default param
      literally named `/tmp/nx-nonexistent.lock` in test_fleet_dispatch.py,
      used ONLY to represent a path that must NOT exist (never written by
      any test; callers needing a real lock pass an explicit
      tmp_path-derived one); chdir usage exclusively via
      `monkeypatch.chdir(tmp_path)` (auto-isolated/restored per test) plus
      one file whose own SUBJECT is the import-time-chdir guard itself.
      Both reviewers re-ran on the cured diff with this grep evidence in
      round 2 and returned VERDICT: OK.
  - lane: cross-family adversarial review of the diff
    role: review
    seat: codex-gpt-5.6-sol (`codex exec -m gpt-5.6-sol --sandbox read-only`, non-Anthropic, fresh context per round)
    note: >-
      Round 1 (loose prompt, no explore budget): produced no verdict — hit
      an internal context-rollover checkpoint after exploring the test
      suite at length. Round 2 (tightened, no-exploration prompt): VERDICT
      BLOCK, naming the unpinned-xdist and stale-comment nits above — both
      cured. Round 3 (re-run on the cured diff with the grep evidence):
      VERDICT OK, confirming no shared-resource risk, `-n 4` correct for a
      4 vCPU runner, loop/array/fail= contract preserved.
    verdict: OK
  - lane: cross-family adversarial review of the diff
    role: review
    seat: kimi-code/k3 (`kimi -m kimi-code/k3 -p`, non-Anthropic, agentic file access, fresh context per round, no shared prompt with the codex lane)
    note: >-
      Round 1 (loose prompt): exceeded the 600s cap, still running at ~15
      minutes, killed rather than awaited further — no verdict. Round 2
      (tightened prompt, run directly against the CURED diff with the grep
      evidence included): VERDICT OK. Independently walked through the
      same xdist hazards (shared tmp/cwd/port/DB, order dependence),
      confirmed the grep findings account for all of them, confirmed `-n
      4` matches ubuntu-latest's 4 vCPU, and confirmed the loop/fail=
      accounting and pass/fail contract are unchanged.
    verdict: OK
  - lane: stopgap review while codex/kimi round 1 had produced no verdict (NOT counted toward council quorum)
    role: review
    seat: agy (Gemini, `agy --sandbox -p`, two independent invocations)
    note: >-
      Run only as a stopgap between round-1 failures (no verdict from
      either intended seat) and round-2 retries. Both returned VERDICT OK
      on the pre-fix diff. Superseded once codex and kimi themselves
      returned real verdicts in round 2/3 above. Recorded for a complete
      chronological trail in council-journal.jsonl; agy is not in
      evidence_pack_lint.py's COUNCIL_REVIEW_SEATS and does not count
      toward R9's quorum.
seat_diversity: satisfied
seat_diversity_note: >-
  Two distinct non-Anthropic review families, codex-gpt-5.6-sol and
  kimi-code/k3, each independently returned VERDICT OK on the same final
  (cured) diff, with no shared prompt state between the two lanes. Getting
  there took extra rounds: both seats failed operationally on their first
  attempt (a context-rollover checkpoint and a >600s hang, neither related
  to the diff's content), and codex's round-2 review on the pre-fix diff
  found two real, trivial defects that are now cured. The agy/Gemini
  stopgap lane used while round 1 was stuck is recorded but does not
  substitute for the required cross-family seats — both of those seats
  ultimately delivered their own real verdicts.
outcome: >-
  The `antidotes` job's "Unit tests (guilt + innocence per tool)" step now
  runs the 68 looped test files under one `pytest -n 4` invocation instead
  of 68 sequential interpreter invocations, with `pytest-xdist==3.8.0`
  pinned. Locally in this worktree the exact new command (extracted from
  the edited step) ran in 113.20s with 1919 passed, 1 skipped, 0 failed —
  identical pass/skip set to a plain sequential run. The `for t in \ ...
  ; do` shell loop shape, the 68-line file list, the `if [ -f "$t" ]` skip
  semantics, the `fail=` accounting and the step's `if:` gate are all
  unchanged. A concrete grep across all 68 files found no shared-tmp-path,
  fixed-port, shared-DB or unsafe-chdir pattern that xdist workers could
  race on.
diff:
  files: 1
  net_lines: "20 insertions, 4 deletions (.github/workflows/immune-enforcement.yml only, across the perf commit and the follow-up fix commit)"
  measured_at: "git diff --numstat $(git merge-base origin/main HEAD) HEAD -- .github/workflows/immune-enforcement.yml"
  shape: >-
    Inside the existing "Unit tests (guilt + innocence per tool)" step: the
    pip install line gains `pytest-xdist==3.8.0`; a `tests=()` array is
    declared before the loop; the loop body's per-file `echo
    "::group::$t" / python -m pytest "$t" -q || fail=1 / echo
    "::endgroup::"` becomes `tests+=("$t")`; after `done`, a new `if [
    ${#tests[@]} -gt 0 ]` block runs `python -m pytest -q -p
    no:cacheprovider -n 4 "${tests[@]}" || fail=1` once. No other step,
    job, or line touched. An explanatory comment above the step covers the
    trigger-symmetry constraint and the measurement provenance.
behaviour_change: >-
  YES, CI-visible: the step now runs one pytest process (with 4 xdist
  worker subprocesses) instead of up to 68 sequential interpreter
  processes. Test selection, skip semantics for absent files, and the
  step's pass/fail contract are unchanged — only the execution model
  changed. Expected wall-time reduction on CI: from a ~116s
  sequential-loop baseline (measured 2026-09-09) to well under that, per
  the -n 4 measurement (161s to 113s across two different machines).
pii_scan: clean
bites:
  consumer: the `antidotes` required check job on THIS PR's own run
  where: ci
  observe: >-
    gh api repos/Bali-Zero/Teman2/actions/jobs/<antidotes job id>
    --jq '.steps[] | "\(((.completed_at|fromdate)-(.started_at|fromdate)))s \(.name)"'
  expect: >-
    "Unit tests (guilt + innocence per tool)" step duration measurably
    below the 116s sequential-loop CI baseline, with the same
    passed/skipped test count reported in the step's log output as before
    this change.
bites_note: >-
  This is a same-PR consumer (not a future job): the step itself is the
  thing that changed, and its own CI run on this PR is the observation
  that closes the loop, recorded once this PR's checks report.
