task_id: guard-ci-wiring
gear: 3
l_level: L2
gate_class: opus
colour: BLUE
objective: |
  Make the two secret_expansion_guard suites actually EXECUTE in CI. They are the
  only enforcement behind a credential-leak guard, and no workflow ran either of
  them.

  #6787 shipped infra/claude-hooks/secret_expansion_guard.py with a 64-row case
  corpus (docs/specs/2026-09-18-secret-expansion-guard-shapes-spec.md §5) and #6792
  shipped infra/claude-hooks/install_qwen_secret_guard.py with 14 refusal-path
  tests. Both merged with their suites unexecuted. Meanwhile
  infra/guard-conformance/check_guard_conformance.py — the checker whose whole
  purpose is to catch exactly this, and whose own rule reads "a test no CI workflow
  runs = FAIL" — reported "every censused guard has guilt+innocence proofs, no
  phantoms, all armed in CI", exit 0, on every run.

  It was telling the truth about its own implementation and a lie about the world.
  is_armed() returns True when the test path OR ANY ANCESTOR DIRECTORY SUFFIX
  appears anywhere in the concatenated text of all .github/workflows/*.yml, and
  `infra/claude-hooks/` appears ~24 times in guard-conformance.yml's own `paths:`
  filter. So every test file in that directory has been "armed" since the filter
  was written, regardless of whether any step executes it.

  Measured, not inferred: `grep -rn test_secret_expansion_guard .github/workflows/`
  returned ZERO execution lines before this change, while `check_guard_conformance.py`
  returned exit 0. That is W81 theater with a green light on it — "esiste != armato",
  the scar this repo already has a checker for.

  The cure makes the claim TRUE rather than making the checker smarter, because the
  checker's own docstring forbids the alternative: "do not 'fix' this by parsing
  YAML into a second execution model". A linter that reimplements CI's execution
  semantics is a second model, and the second model drifts from the first — which is
  scar #3's own wording about a duplicated-not-shared checker.
constraints:
  - "Two code files. Originally scoped as one file / 25 net lines with NO test-code change, and
    the council widened it: arming a suite is only half the job if the suite itself is blind on the
    runner it is armed for, so infra/claude-hooks/test_install_qwen_secret_guard.py is edited too.
    Still no guard code and no registry change — the guard and its 64-row corpus are untouched."
  - "No paid per-token Anthropic endpoint (Builder Contract 3). Built on the Alibaba
    Token-Plan subscription via qwen-code; the adversarial council is TWO seats from two other
    families (codex gpt-5.6-sol, read-only sandbox; kimi-code/k3, in a detached temp worktree
    because its config sets default_permission_mode=yolo and a reviewer must not write into the
    candidate), and the ship gate is the claude-zero-team lane on CLAUDE_CODE_OAUTH_TOKEN."
  - "No PII. The change touches a CI workflow and one hook test file. The guard it arms is itself a
    credential-hygiene control, and neither the guard's registry nor its tests
    contain a real secret (the installer suite asserts that no value from
    ~/.nuzantara-secrets.env appears in its own output)."
  - "The step reuses the job's existing `steps.relevant.outputs.run == 'true'` gate
    and the neighbouring steps' existing `python3 -m pip install --quiet pytest`
    idiom, so it adds no new trigger surface and no new dependency mechanism."
  - "Does NOT modify check_guard_conformance.py. The is_armed() false green remains
    and stays documented as an accepted limit by its own author; this PR removes the
    one live instance of it rather than re-architecting the detector."
acceptance:
  - "WHEN the new step's two lines are executed on the branch, THE SYSTEM SHALL print
    the full corpus result and pass every collected test.
    probe: `python3 infra/claude-hooks/test_secret_expansion_guard.py` -> '64/64
    corpus rows as specified', rc=0; and `python3 -m pytest -q
    infra/claude-hooks/test_secret_expansion_guard.py
    infra/claude-hooks/test_install_qwen_secret_guard.py` -> 28 passed, rc=0.
    28 and not 14 is the point: pytest collects all 14 guard test functions while the
    script form runs only the corpus, so both invocations are required (see the BLOCK
    this cured)."
  - 'WHEN the modified workflow is parsed, THE SYSTEM SHALL yield valid YAML with the
    new step present exactly once.
    probe: `python3 -c "import yaml;d=yaml.safe_load(open(''.github/workflows/guard-conformance.yml''));print(len([s for j in d[''jobs''].values() for s in j[''steps'']]))"`
    -> 28; and the step name ''Secret-expansion guard corpus + Qwen installer refusal
    paths'' occurs once.'
  - "WHEN a path under infra/claude-hooks/ OR the corpus's oracle spec OR the hook's own wiring file
    changes, THE SYSTEM SHALL set the job's relevance gate true so the step runs — on push AND on a
    pull request, because the two filters are independent and a path missing from either one is a
    silent skip.
    probe: extract BOTH filters from the workflow file itself (do not retype them) — the
    push/pull_request `paths:` list via yaml.safe_load and the `relevant` step's grep regex from its
    own source line — then match 7 paths. Positives, each True in BOTH filters:
    docs/specs/2026-09-18-secret-expansion-guard-shapes-spec.md,
    infra/claude-hooks/secret_expansion_guard.py,
    infra/claude-hooks/install_qwen_secret_guard.py, .claude/settings.json. Negatives, each False in
    BOTH: an unrelated docs/specs file, apps/mouth/src/lib/x.ts, and .claude/settings.local.json
    (the near-miss — the regex is unanchored at the tail, so a settings-LOCAL edit must not be
    mistaken for the hook wiring)."
  - 'WHEN the installer''s credential test runs on a machine with no ~/.nuzantara-secrets.env — which
    is every CI runner — THE SYSTEM SHALL still execute its assertion rather than skip it, and SHALL
    fail if the installer prints a value taken from its environment.
    probe: the test injects a fixture secret through `_run(..., env_extra={...})` instead of reading
    the host vault, so there is no early return to take. Prove it bites with a mutant: insert
    `_say(f"  key: {os.environ.get(''BAILIAN_TOKEN_PLAN_API_KEY'', ...)}")` into the installer''s
    success path and run with HOME set to a vault-less directory -> the PRE-CURE shape passes (rc=0,
    the vacuity this criterion exists to remove) and the shipped shape FAILS on `assert not leaked`
    (rc=1). Delete the mutant afterwards.'
  - "WHEN this change is present, THE SYSTEM SHALL NOT turn any existing gate red.
    probe: `python3 infra/guard-conformance/check_guard_conformance.py` -> rc=0,
    0 violations; `python3 scripts/lint_home_fork.py --check` -> rc=0;
    `ruff check` on the two hook Python files -> All checks passed."
  - "WHEN the step is read, THE SYSTEM SHALL NOT duplicate a suite another workflow
    already executes.
    probe: `grep -rn test_hook_innocence .github/workflows/` -> the only execution line
    is hook-innocence-gate.yml:108, not this step; and `grep -c
    'python3 infra/claude-hooks/test_secret_expansion_guard.py' .github/workflows/guard-conformance.yml`
    -> 1 (the script form; the pytest form is a separate line covering the 13 tests
    the script form cannot reach)."
consumer_map:
  - ".github/workflows/guard-conformance.yml -> the 'guard-conformance' required check.
    A future regression in the 64-row corpus or in the installer's refusal paths now
    fails a required check instead of merging green."
  - "infra/guard-conformance/check_guard_conformance.py -> its C4 claim becomes true
    for these two files by execution rather than by substring. The checker is not
    modified and its is_armed() limit is unchanged."
  - ".claude/settings.json -> adding it to both relevance filters means the guard's
    WIRING is now a change CI reacts to. Before, a PR could delete or rename the
    secret_expansion_guard hook block there and every required check would stay green,
    because the only test that asserts the wiring was never executed. This is the
    second half of the same defect class as the false green: a check that passes
    without looking."
  - ".claude/skills/modus/PENDING-ARMS.md -> SATISFIES the `qwen-guard-ci-wiring`
    ledger row (opened 2026-09-19 as the condition of #6792's PASS-WITH-CONDITIONS
    verdict, deadline 2026-09-26). It does NOT close it, and deliberately so: the
    repo's closure convention rewrites the row prefix to `- closed <date> (<proof
    citing the PR and its merge SHA>)`, and a PR cannot cite its own merge SHA.
    Closure belongs to the next ledger reconciliation — which is why PENDING-ARMS.md is
    NOT in this diff even though the row is what the work was for."
risks:
  - "THE FALSE GREEN IS NOT FIXED, ONLY THIS INSTANCE OF IT. A NEW test file added
    under infra/claude-hooks/ that no step executes will still be reported 'armed' by
    is_armed(), because the ancestor-suffix match still hits the paths: filter. This
    PR arms two files; it does not repair the detector. Repairing it is forbidden by
    the checker's own docstring, so the residual is structural and needs an owner
    decision, not a patch."
  - "Added wall time to a REQUIRED check: the corpus spawns one subprocess per row
    (64) and the installer suite spawns more. Measured twice on two machines: the
    builder got 12.82s for the two-file pytest run, the second refuter got 2.94s +
    1.12s. The spread is machine load; the count (28) is what the step asserts. Small
    against a workflow that already runs ~20 suites, but it is on the critical path of
    every PR that touches infra/claude-hooks/ or .claude/settings.json."
  - "`python3 -m pip install --quiet pytest` can fail on a runner without network,
    which would fail the required check for an infra reason. Mitigated only by
    consistency: five neighbouring steps in this same workflow already do it, so if
    it breaks, it breaks them all at once rather than singling this step out."
  - "HOME-FORK DRIFT: checked, and this PR causes none — but the first draft of this risk asserted
    the opposite and was wrong, so the measurement is recorded. infra/home-fork/declared-pairs.json
    declares 192 pairs; ZERO of them name install_qwen_secret_guard.py or its test file, and neither
    has a live twin on this machine. The two files that ARE declared (~/.claude/hooks/
    secret_expansion_guard.py and secret-expansion-registry.json) are NOT touched by this PR and
    their sha256 still matches the repo twin. scripts/lint_home_fork.py --check exits 0. Editing a
    test file with no live twin is drift-free by construction."
  - "Hot-zone floor 3 for a change this size is the rule working as designed, not an
    accident: CI changes are expensive to get wrong. The cost is a full Evidence Pack
    including a real adversarial dissent, which is disproportionate to the diff but
    proportionate to the blast radius — and it paid for itself twice: both council seats
    returned BLOCKING on defects neither the builder nor the checker had seen, one of
    them introduced by the builder mid-flight."
grader: |
  generator != grader. Written by the builder seat (Qwen 3.8 Max on Air-M5, external
  builder), which per Builder Contract 5 prepares and never ships.

  Adversarial dissent was dispatched to TWO seats in two DIFFERENT families, and the
  second was given the first's findings withheld — a council is only worth its cost if
  the seats are independent:
    1. codex gpt-5.6-sol, read-only sandbox, with seven named attack surfaces
       (path-filter coverage, whether the script form propagates its exit code, the pip
       install line, runtime cost, the factual accuracy of the step's own comment block,
       W81 theater, and whether the false green is genuinely cured). Verdict BLOCKING.
       It could not execute the suites itself (a read-only sandbox has no writable temp
       dir) and said so instead of claiming a pass.
    2. kimi-code/k3, in a detached temp worktree so an autonomous reviewer could not
       write into the candidate branch. Verdict BLOCKING, on a different defect than
       codex's: the wiring file was missing from both relevance filters.
  Both verdicts, and every finding from both, are recorded verbatim in pack.yml
  `dissent:` with dispositions; none are paraphrased away. Two findings were cured, two
  were accepted as residuals with the reason stated, one was left in place as PLAUSIBLE
  with the reason stated.

  Ship grading is ASSIGNED, NOT YET PERFORMED at the time of writing: a fresh Claude
  session on Opus 5 xhigh outside this contribution chain, per AGENTS.md §17.1 for an
  undeclared BLUE mission. If that gate writes fixes it must NOT also sign the verdict
  — the #6787 gate did both and thereby joined the chain it was supposed to be outside.
  It is instructed to REPRODUCE the counts in this brief rather than accept them, since
  every execution receipt here is the builder's.
budget: |
  One builder session on the Alibaba Token-Plan subscription (qwen3.8-max via
  qwen-code), plus TWO refuter dispatches (codex gpt-5.6-sol, kimi-code/k3) and one
  pending Claude gate dispatch, all on already-paid subscriptions. No metered Anthropic
