appetite_exceeded: >-
  Not exceeded, but nearly all of it went to the council rather than to the change: TWO refuter
  rounds, both BLOCKING, on a diff whose code half is small. Round 1 (codex gpt-5.6-sol) caught a
  defect the builder had introduced one commit earlier while "de-duplicating" the step; curing it
  needed an AST count, a pytest --collect-only and a re-run of both invocations. Round 2
  (kimi-code/k3) caught a different defect the builder had not seen at all — the guard's own wiring
  file was missing from both relevance filters — and its second finding needed a leaking mutant plus
  a vault-less HOME to turn from PLAUSIBLE into CONFIRMED. Measured from the receipt timestamps
  (04:21:43Z first, 05:22:19Z last) plus dispatch overhead; the ship gate dispatch is still pending
  and is not counted here. Worth it: without the second round this PR would have armed a suite that
  is green and blind on the runner it was armed for.
result: >-
  .github/workflows/guard-conformance.yml gains one step that EXECUTES
  infra/claude-hooks/test_secret_expansion_guard.py (64-row corpus, as a script for per-E-id output)
  and both it and infra/claude-hooks/test_install_qwen_secret_guard.py under pytest (14+14 = 28
  tests), plus THREE paths added to both relevance filters (the corpus's oracle spec, and
  .claude/settings.json). infra/claude-hooks/test_install_qwen_secret_guard.py gains an `env_extra`
  parameter on `_run()` and a rewritten test_never_prints_a_credential_value that injects a fixture
  secret instead of reading the host vault, so it no longer early-returns on a machine that has none.
  Before this, neither suite was run by any workflow while check_guard_conformance.py reported "all
  armed in CI". Commit sequence described by CONTENT, not by count — every evidence commit changes
  the total, so a number written here would be stale by the time it was committed, which is the same
  countable-claims rule `diff.summary` obeys: the step, then the cure of round 1's BLOCKING, then the
  cure of round 2's, then this pack's own conformance pass.
gear_floor_note: >-
  Declared 3 because the deterministic floor IS 3, source `path`: .github/workflows is a hot zone
  and compute_floor returns 3 on a path hit before the size term runs. Re-measured three ways on the
  FINAL diff (05:22:09Z / 05:22:19Z): whole diff -> 3; the same diff with the workflow file excluded
  -> 2; the test file alone -> 1. So the hot zone is the whole reason this needs a pack at all — the
  code churn is small and the evidence YAML is most of the byte count. Not split further: the step,
  the filters and the test cure are one concern (make the suites run, make the right paths trigger
  them, and make the suite actually assert something on a runner).
pii_scan: clean
