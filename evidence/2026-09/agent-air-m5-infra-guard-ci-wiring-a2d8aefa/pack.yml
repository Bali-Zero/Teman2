dissent:
  - seat: "codex-gpt-5.6-sol (refuter) vs tp1-qwen3.8-max (author)"
    status: CONFIRMED
    objection: >-
      BLOCK. "The plain-script invocation executes only E01-E64, leaving 13 additional pytest tests
      in the same file unexecuted, including malformed-input, corrupt-registry, wiring,
      filesystem-walk, and latency checks. The comment's 'same assertions' claim is false. _main()
      iterates only CORPUS; pytest discovers 14 test functions." CONFIRMED by independent
      measurement before acting: AST scan gives test_defs=14 with _main() calling no test function,
      and `pytest --collect-only` collects 14. This is the more embarrassing half — the dropped
      pytest line was removed by the AUTHOR one commit earlier as a "duplication", and the comment
      asserting they were equivalent was also the author's. Cured in 8d2d61d9fb: both invocations
      present, 28 passed, and the comment now states what each covers and names this very commit as
      the counterexample so it is not "simplified" again.
  - seat: "codex-gpt-5.6-sol (refuter) vs tp1-qwen3.8-max (author)"
    status: CONFIRMED
    objection: >-
      LOW. "The specification is absent from both relevance filters. Guard and installer changes set
      run=true, but a change only to docs/specs/2026-09-18-secret-expansion-guard-shapes-spec.md
      skips the suite on PRs and does not trigger this workflow on push." CONFIRMED, and found
      independently by the builder first via a regex probe over the workflow's own filter (spec ->
      False) — two seats, same result, same day. It is worse than a missing trigger: §5 of that spec
      IS the corpus's oracle, so without it the suite can be made to pass by editing the thing it is
      measured against. Cured in 8d2d61d9fb by adding the path to both the push/pull_request `paths:`
      list and the `relevant` grep regex, verified 5/5 with two negative controls.
  - seat: "codex-gpt-5.6-sol (refuter) vs tp1-qwen3.8-max (author)"
    status: CONFIRMED
    objection: >-
      LOW. "This arms only these explicit commands; it does not cure C4's generic false green. A
