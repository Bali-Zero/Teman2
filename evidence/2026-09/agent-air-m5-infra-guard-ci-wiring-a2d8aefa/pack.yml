    infra/guard-conformance/, the corpus's oracle spec, or .claude/settings.json (the file that
    registers the hook — added by round 2's BLOCKING, because without it a PR could unregister the
    guard and every required check would stay green).
  observation: >-
    PRE-MERGE observation only, and stated as such: the step's exact two lines were executed
    locally on the branch — `python3 infra/claude-hooks/test_secret_expansion_guard.py` -> "64/64
    corpus rows as specified" rc=0, and `python3 -m pytest -q` over both files -> "28 passed" rc=0
    (pytest --collect-only confirms 14+14), re-measured AFTER the last cure at 05:10:10Z/05:10:23Z.
    BOTH relevance filters were extracted from the workflow file itself, not retyped, and probed
    against 7 paths: the spec, the guard, the installer and .claude/settings.json match in both; an
    unrelated docs/specs file, apps/mouth/src/lib/x.ts and .claude/settings.local.json do not match
    in either. The credential test's assertion was shown to BITE by a leaking mutant under a
    vault-less HOME (fails on `assert not leaked`, rc=1) where the pre-cure shape passed. The
    POST-MERGE observation — the required check actually running these on a real PR — cannot be made
    before merge and is left to the shipping session; claiming it now would be the exact
    distance-between-merged-and-live this repo keeps paying for.
