residuals:
  - >-
    is_armed()'s ancestor-substring false green is UNFIXED by design (dissent 3). Any new test file
    under infra/claude-hooks/ that no step executes will still be reported "armed". The cure is
    forbidden by the checker's docstring, so this needs an owner ruling on whether to change that
    doctrine or add a positive-list of executed test paths to the registry.
  - >-
    ROUND 1's refuter could not execute the suites: its read-only sandbox provides no writable temp
    directory, so its own direct runs returned rc=1 before collection. It declared this instead of
    claiming a pass. Round 2 (kimi-code/k3) DID execute them, which is why this pack can report an
    independent execution at all — but every execution receipt written into `receipts:` is still the
    builder's own command and output, so the ship gate is instructed to reproduce the counts rather
    than accept them.
  - >-
    Added wall time to a required check: round 1 microbenchmarked 64 guard subprocess spawns at
    2.586s / 3.445s / 2.742s and concluded "several seconds, acceptable inside the existing
    10-minute required job — no separate job is justified"; round 2 measured 2.94s + 1.12s and the
    builder 12.82s. Accepted on those measurements, with the spread attributed to machine load.
  - >-
    THE PACK'S OWN CLAIMS WENT STALE UNDER THE CURES, and one of them was FALSE rather than merely
    out of date. Six statements written before round 2 were invalidated by it: brief constraint 1
    ("one file, 25 net lines, no test code"), the 5-path acceptance probe, the grader naming one
    refuter, pack `result` ("two commits"), `diff.summary` ("no test code") and `spend`. All were
    re-measured and rewritten. Separately, a drafted risk asserted the edited test file "IS a
    declared home-fork pair for m5" — checking declared-pairs.json showed ZERO pairs naming it and no
    live twin, so the claim was deleted rather than shipped. Recorded as a residual because it is the
    same defect class this PR exists to remove: an assertion that is true of the author's
    implementation and false of the world, sitting behind a green light.
  - >-
    The PENDING-ARMS row `qwen-guard-ci-wiring` (deadline 2026-09-26, opened as the condition of
