# `BAILIAN_TOKEN_PLAN_API_KEY=<value>` (the sentence saying there are 0 occurrences of it). Documenting
# a scanner trips the scanner; left as-is rather than reworded to dodge it. A direct substring test of
# the REAL key read from ~/.nuzantara-secrets.env against the diff bytes returns False, and the
# fixture literal in the test file is not the real key. 0 of the 5 changed FILENAMES match
# client|ktp|npwp|paspor|crm|pii.
diff:
  summary: >-
    Two code files: the workflow (.github/workflows/guard-conformance.yml — the new step, its comment
    block, and three paths added to both the push/pull_request `paths:` list and the `relevant` step's
    grep regex) and one hook test file (infra/claude-hooks/test_install_qwen_secret_guard.py — an
    `env_extra` parameter and a credential test that no longer depends on host state). Plus this
    evidence directory (brief.yml, pack.yml, council-journal.jsonl). No guard code and no registry
    change: the guard itself and its 64-row corpus are untouched. Counts are deliberately NOT
    narrated here — the linter derives them from numstat, and an earlier draft that quoted a figure
    was caught stating a number true of the workflow alone and false of the PR once the evidence
    files were staged. That is the countable-claims rule earning its keep, so the narration is
    removed rather than corrected. The ORIGINAL scope was "one workflow file, no test code"; the
    council widened it, and constraint 1 in brief.yml says so explicitly rather than quietly
    restating the old scope.
  commits:
    - "ci(guard-conformance): execute the secret_expansion_guard suites, which no workflow ran"
    - "fix(ci): the corpus file needs BOTH invocations, and the spec must trigger the step"
    - "fix(ci,tests): the wiring file must trigger the step, and the credential test must not be vacuous on a runner"
    - "docs(evidence): acceptance criteria as {text, probe} mappings, and the filter probe is a committed script"
