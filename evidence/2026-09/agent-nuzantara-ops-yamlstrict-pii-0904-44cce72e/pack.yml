    the `antidotes` job in .github/workflows/immune-enforcement.yml, which now runs scripts/tests/test_yaml_strict_policy_loader.py
    and re-triggers on four paths
  where: ci
  observe: python3 -m pytest scripts/tests/test_yaml_strict_policy_loader.py -q
