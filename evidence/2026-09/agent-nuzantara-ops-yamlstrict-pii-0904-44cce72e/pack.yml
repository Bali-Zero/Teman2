dissent:
  - seat: kimi-code/k3
    objection:
      The fix stops one level too high. The strict loader guards YAML KEYS, but Redactor.__init__
      keys its compiled table by each rule's `id` with no collision check, so appending one list item
      to pass1 that reuses a real rule's id shadows it with NO duplicate YAML key anywhere. Separately,
      a placeholder-only pass1 passes the non-emptiness check and compiles to nothing.
    status: CONFIRMED
    resolution:
      "Both reproduced by this session before being accepted — the NPWP leaked in each case
      while redact() returned normally — and both cured in load_config with guilt tests and innocence
      counterparts. The meta-pattern is recorded: 'last one wins in silence' belongs to any keyed
      collection built without a collision check, not to YAML."
  - seat: tp1-qwen3.8-max
    objection:
      A mapping nested past Python's recursion limit raises RecursionError, which is not a
      yaml.YAMLError, so it escapes the loader as a traceback rather than a verdict.
    status: CONFIRMED
    resolution:
      Reproduced at depth 1000/5000/20000, cured, guilt test at 2000. Found by a seat with
      no shell that could not run a line of it, and whose answer truncated before its third axis.
  - seat: session (self, against itself)
    objection:
      An empty pass1 is refused even when the file is unambiguous — beyond the brief, which
      asked only for the duplicate-key cure.
    status: CONFIRMED
    resolution:
      Kept and declared in the PR body rather than slipped in. Strict loading closes the append,
      not an in-place edit, and the failure mode is identical. Trivially revertible.
  - seat: session (self, against itself)
    objection:
      "This PR was first opened with NO evidence pack, on my judgment that a 365-line fix was
      Gear 2. CI refused it: the deterministic floor is 3 because `.github/workflows/*` is a hot-zone
      path."
    status: CONFIRMED
    resolution:
      "Floor measured only AFTER the red, which is the wrong order. Recorded in the receipts
      rather than tidied away. The workflow touch is not removable: every test in this repo is armed
      by an explicit workflow listing, so arming the guard requires it, and shipping it unarmed is superscar
      #2."
