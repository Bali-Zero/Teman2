bites_note:
  "Listing a test in that workflow is NECESSARY but not SUFFICIENT: the loop prints `::notice::skip
  (absent)` and leaves the job green for a test that is not there. So the battery membership is asserted
  by the test file itself (test_this_test_file_is_listed_in_the_immune_enforcement_battery), and deleting
  the workflow line makes that test red. That is the stronger half; the weaker half is that deleting
  the workflow line while ALSO deleting the test file leaves nothing red, which no self-referential
  guard can close."
