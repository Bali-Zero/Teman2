dissent:
  - seat: codex-gpt-5.6-sol (council round 3, unresolved)
    objection: >-
      Where every door is shut — a declared Indonesian nationality, or a stay past
      the tourist bound — the sheet renders no door section at all, so no product
      is named. The reviewer reads that as an UNDER-match against the window's own
      "every dead end names a door" framing.
    status: CONFIRMED
    cure: >-
      Confirmed as behaviour, rejected as a defect — deliberate. Naming a product the pack measurably does not support for those
      facts is the OVER-match this window spent two rounds removing. Both cases
      still read a named cause (APPLICANT_IS_INDONESIAN_CITIZEN got copy in this
      PR precisely because of that counterexample), and an Indonesian citizen has
      no visa to be pointed at. An honest silence beats a false door.
  - seat: codex-gpt-5.6-sol (council rounds 1 and 3, partially unresolved)
    objection: >-
      `reasonMessage` still falls back to `Verified reason: ${code}` for any code
      outside SUPPORT_REASON_COPY, so a future rule can still print a machine
      identifier at a reader.
    status: PLAUSIBLE
    cure: >-
      Not cured here. The fallback is the pre-existing contract of this file and
      its comment states the reasoning (a code we have no copy for is still
      information; blanking it would hide a new rule instead of surfacing it).
      This window closes it for every code the 15 reachable dead ends and the 5
      counterexamples can emit; closing it for ALL codes means an exhaustiveness
      test against the pack's EXCLUDE vocabulary, which is the same shape as the
      existing REVIEW_REASON_COPY exhaustiveness test and belongs to its own PR.
      Recorded as a leftover.
  - seat: Claude Opus 5 (self-refutation, on the proof's reach)
    objection: >-
      The replay proves the doors on the corpus's own synthetic identities (one
      Italian passport, 121 declared days, $1B declared amounts) plus five
      counterexamples I chose. A sixth dimension I did not probe could break a
      rule exactly as the first three were broken.
    status: CONFIRMED
    cure: >-
      Partly cured by narrowing every rule to a precondition and by withdrawing
      the one door whose bound could not live in this file. The structural cure is
      not a better predicate: it is asking the engine itself (a second evaluate
      call with the alternative purpose) and rendering what it answers, which
      needs OracleShell and the evaluation client — outside this window's
      perimeter. Recorded as the first leftover.
  - seat: Claude Opus 5 (self-refutation, on the e2e)
    objection: >-
      The browser spec computes its expectations by calling `buildNoPathDoors`,
      the very function under test, so it cannot fail a wrong door rule — only a
      rendering that disagrees with the rule.
    status: CONFIRMED
    cure: >-
      By design, and stated in the spec's own header: the non-circular half is
      no-path-doors.test.tsx, which holds the rule against the replay fixture the
      engine produced. The browser's job here is to prove the sheet renders what
      the adapter decided, and to walk the interview that reaches it — which is
      how the raw-code defect was found.
leftovers:
  - The honest version of "the door that is open" is an engine round trip — one more POST /api/visa-oracle/evaluate with the same facts and the alternative purpose, rendering the products it returns. That removes every predicate in this file and the whole class of OVER-match the council found. It needs OracleShell.tsx and evaluation-client.ts (idempotency key, retry, telemetry), which this window does not own.
  - The withdrawn age door (E33F "from 55") is still worth having; the fixture keeps its AGE_55 column and the measurement that killed it (zero passive income leaves the route unsupported at 55).
  - "`reasonMessage`'s `Verified reason: ${code}` fallback stays reachable for EXCLUDE codes no reachable walk emits. An exhaustiveness test against the pack's EXCLUDE vocabulary, mirroring the REVIEW_REASON_COPY one, would close it."
  - Playwright cannot import the corpus generator (`import.meta` under its CJS transform), so the browser spec walks three dead ends with a written-out answer table instead of all 17 from `enumerateScenarios`. The 17-row coverage lives in the vitest layer, which renders the real OutcomeSheet in both languages.
  - "The seq-22 pack half of W-VO-G is untouched: OPERATIONAL_NO_PRODUCT_MATCHES_DECLARED_PURPOSES still stands at the source for the three walks whose cause this PR names in the UI instead."
  - "no-path-doors.test.tsx fingerprints the 17 dead-end walk fixtures. W-VO-E owns the corpus and will move them; the cure is one command (the generator's own docstring names it), but it lands on that window's PR."
  - "The shared apps/mouth/node_modules/.bin/tsx shim points into .worktrees/mouth-vo-c-doors (a sibling's pnpm store), so 'npm run build -w apps/mouth' fails from any other worktree. Worked around by invoking the root store's tsx directly; imperator-level cleanup, cicatrix family #5."
