decisions:
  - id: D-gear
    decision: >-
      Gear 2, which is the floor evidence_pack_lint.py --print-floor measures on
      this merge-base diff (8 files, +1057/-25 at the time of the first
      measurement; no hot-zone path, churn far under the 1828-line SIZE term).
      A council was run anyway, because the surface makes a public claim about
      which visa a visitor qualifies for. It is filed under council/ with all
      three rounds; no seat ever returned VERDICT: OK, so no row in the journal
      carries ok:true — the three DEFECT verdicts are what produced the three
      cures below, and none of them is dressed up as approval. The second seat
      did not land: kimi-code/k3 is quota-exhausted this month, and
      tp1-qwen3.8-max returned an empty stdout on the 64KB diff prompt inside
      the 900s ceiling. Both are recorded in the journal as they happened.
  - id: D-proof
    decision: >-
      A door may be named only where a REPLAY of the signed pack returns that
      product for the applicant's own stated facts.
      apps/mouth/scripts/visa-oracle/replay-no-path-doors.py replays every
      non-supported corpus walk against rulepack-prod-020.signed.json with
      exactly ONE declared field changed (intent.purposes, or person.birth_date
      for the age counterfactual) and writes _lib/fixtures/
      no-path-doors.replay.json; no-path-doors.test.tsx holds every rendered
      door against it. Prose is never evidence for a product code.
  - id: D-counterexamples
    decision: >-
      Council round 1 (DEFECT) established that a rule proven on 17 synthetic
      fact sets is not proven for a visitor. Five counterexamples — one changed
      answer each — are now measured by the same generator and asserted by name
      as ABSTENTIONS: Indonesian nationality, a stay past the tourist bound, a
      deposit outside a state bank, a deposit not in the applicant's own name,
      zero passive income. Each is the innocence half of a guilt/innocence pair
      (cicatrix family #3).
  - id: D-age-door-withdrawn
    decision: >-
      Council round 2 (DEFECT) showed the E33F "from 55" door still over-matched:
      at exactly 55 the pack supports that route only above an income bound the
      interview never states. Rather than take a third swing at the same rule (a
      fix of a fix), the door is WITHDRAWN. The fixture keeps its AGE_55 column,
      so the next window reopens it from evidence.
  - id: D-switch-copy
    decision: >-
      Council round 3 (DEFECT, P2) showed both door sentences promised the rules
      would check the other route "with the same answers", while flow.ts's
      SELECT_CATEGORY truncates the interview back to the category question and
      prunes the abandoned branch's facts. The copy now promises exactly what
      the reducer does, in EN and ID.
  - id: D-no-figures
    decision: >-
      No figure is printed by any door sentence. TOURIST_VISIT_MAX_STAY_DAYS
      (180) and the two Second Home thresholds are PREDICATES only — bounds the
      signed pack owns, measured in this session, never restated as copy. The
      only figures the sheet prints are the ones #6404 already shipped on the
      below-threshold path, which name the applicant's own declared value.
  - id: D-perimeter
    decision: >-
      tree.ts / flow.ts / fact-mapper.ts and the walk corpus stay untouched
      (W-VO-E owns them in parallel); oracle.css is untouched, so the door's
      two-line shape is set with inline styles rather than a new class. The
      seq-22 pack half is not in this PR.
