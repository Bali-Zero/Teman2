gear_reason: >-
  Deterministic floor 2, source `size`: `git diff --no-renames --numstat` against `origin/main`
  measures churn 420 (218+23 scripts/dynamic_workflow.py, 167+12 scripts/tests/test_dynamic_workflow.py)
  — above SIZE_GEAR2_THRESHOLD (400) and below SIZE_GEAR3_THRESHOLD (1828). No hot-zone path: only
  `scripts/` is touched, no `.github/workflows/` file and no HOTZONE_PATTERNS match. Confirmed
  locally via `python3 scripts/contract_verify.py --local --json` before this brief existed
  (floor-needs-brief FAIL naming exactly this diff — output: "deterministic floor is 2 but this
  diff carries no evidence/brief.yml"), and this brief is the fix. Per
  `scripts/ci/evidence_paths.py --ref agent/air-m5/infra/dynamic-workflow-2f --json`, the root
  `evidence/brief.yml` path is past its 2026-09-12 deprecation date (today 2026-09-18) and this
  PR's diff does not touch it — this file lives at the tool's own resolved per-task path instead.

appetite:
  wall_clock_hours: 2
  adversarial_rounds: 1

acceptance:
  A1: >-
    `_diff_positions` refuses a length-mismatched pair rather than silently truncating to the
    shorter string via `zip()`: guilt (two differing-length strings) raises/reports the mismatch
    instead of comparing only the shared prefix; innocence (equal-length strings) reports every
    differing index, not just the ones `zip()` would have reached.
    probe: python3 -m pytest scripts/tests/test_dynamic_workflow.py -k "diff_positions" -q
  A2: >-
    `jury/tabulation.md` names no seat id before `reveal` runs (blind), the jury prompt itself
    never names an answered seat id, a mapping.json that already exists and differs refuses rather
    than silently overwriting, and `reveal` refuses before Z-DECISIONI.md exists, then writes a
    seat-annotated `tabulation.revealed.md` without ever rewriting the original blind file.
    probe: python3 -m pytest scripts/tests/test_dynamic_workflow.py -k "jury or reveal or parse_jury_ballot" -q
  A3: >-
    `capture-check --dest` refuses (exit 2, no dest created) a location outside
    `research/operations/<date>-dynamic-workflow-<slug>/` including a `..` escape resolved via
    `.resolve()` equality, and separately refuses (exit 2) a dest that already exists and is
    non-empty, leaving any pre-existing file inside it untouched. Both checks run before
    dest.mkdir() — nothing is created on a trip.
    probe: python3 -m pytest scripts/tests/test_dynamic_workflow.py -k "capture_check_refuses_a_dest or capture_check_refuses_a_dotdot or capture_check_refuses_a_non_empty" -q
  A4: >-
    Guilt fixture per the addendum, verbatim — a fake phone in OUTCOME.md: capture-check refuses
    (exit 3, names OUTCOME.md and a span count, never the phone number itself, on both stdout and
    stderr) and copies nothing. Innocence: an identical kit shape with no PII clears the gate and
    copies OUTCOME.md unchanged.
    probe: python3 -m pytest scripts/tests/test_dynamic_workflow.py -k "capture_check_refuses_a_fake_phone or capture_check_copies_a_clean_outcome" -q
  A5: >-
    Nothing else moved: the full pytest file and the raw `--selftest` CLI sweep both run clean at
    this head, and the repo tree carries zero stray `research/operations/` directories once either
    finishes (every dest-touching test/selftest case cleans up its own kit and dest in a `finally`).
    probe: python3 -m pytest scripts/tests/test_dynamic_workflow.py -q && python3 scripts/dynamic_workflow.py --selftest

out_of_scope: >-
  The SKILL.md rewrite, brief.template.md, and the two lints remain PR3 (PR3b, PR3c), per the
  mandate's own pre-authorized split carried forward unchanged from PR2b's brief.

assumptions:
  - text: >-
      Redactor.load_default().redact()'s `gate.min_remaining_chars` floor (100) judges the
      POST-redaction output length with no way to distinguish "input started short" from "input
      got shortened by redaction" — it fires on any input under the floor regardless of PII
      presence. Padding a short input with a fixed, pattern-inert sentence
      ("The quick brown fox jumps over the lazy dog near the riverbank at dawn. ", repeated past
      the floor) before scanning avoids this without touching _redact_pii.py or reimplementing its
      pattern logic: the pad passes through every rule unchanged, so any reported difference still
      traces to the file's own content.
    status: verified
    probe: >-
      python3 -c "from scripts._redact_pii import Redactor; r = Redactor.load_default();
      pad = ('The quick brown fox jumps over the lazy dog near the riverbank at dawn. ' * 3);
      print('pad unchanged:', r.redact(pad) == pad)"
  - text: >-
      The canonical capture destination is `research/operations/<YYYY-MM-DD>-dynamic-workflow-<slug>/`
      relative to the repo root, matching this repo's existing `research/operations/<date>-<slug>`
      convention — grounded by listing real existing directories under that path, not assumed by
      analogy alone.
    status: verified
    probe: find research/operations -maxdepth 1 -name "*-dynamic-workflow-*" | head -5
  - text: >-
      As of this brief's date (2026-09-18), the root `evidence/brief.yml` path is past its
      `EVIDENCE_ROOT_BRIEF_DEPRECATION_DATE` (2026-09-12) and PR2f's own diff resolves to a
      per-task evidence path instead, via the same tool harness-floor.yml's own Step 2b invokes.
    status: verified
    probe: python3 scripts/ci/evidence_paths.py --ref agent/air-m5/infra/dynamic-workflow-2f --json
