task: >-
  PR2f of the /dynamic-workflow coach-protocol build (MANDATE-builder.md, owner ruling Zero
  2026-09-18), following PR1a (#6753), PR1b (#6756), PR2a (#6757) and PR2b. This PR carries five
  commits, each its own concern. Commit 1: `_diff_positions` (the Z-BLIND identity-strip
  comparator) used bare `zip()` over two strings of possibly-different length, which silently
  truncates to the shorter one instead of reporting a mismatch — replaced with an explicit length
  guard that refuses rather than under-reports. Commit 2: `jury`'s `tabulation.md` is now
  letters-only (no seat id) until `reveal` runs, which prints jury/mapping.json only after
  Z-DECISIONI.md exists and now ALSO writes a seat-annotated `tabulation.revealed.md` sibling,
  leaving the original blind file untouched. Commits 3-4 are the addendum's "capture hardening":
  `capture-check --dest` now (3) refuses a non-empty existing dest and any dest that does not
  resolve to the canonical `research/operations/<date>-dynamic-workflow-<slug>/` under the repo
  root (no `..`, no arbitrary location), and (4) runs a PII gate over every text file about to be
  captured (BRIEF.md, r1/, r2/, judge.md, jury/tabulation.md, Z-DECISIONI.md, OUTCOME.md) via the
  same `Redactor.load_default().redact()` cmd_brief already uses — one changed span or a redactor
  error refuses fail-closed (exit 3, names the FILE and the COUNT, never the text), before
  dest.mkdir() and before any copy. Building commit 4 surfaced a genuine bug in reusing the
  Redactor here: its `gate.min_remaining_chars` floor (100) exists to catch bulk prose
  over-redacted down to near-nothing, and cannot tell "started short" from "got shortened" — it
  always fires on a short, legitimate, PII-free file (Z-DECISIONI.md, ~20 chars, used throughout
  this file's own existing test suite). Fixed by padding any input under the floor with a fixed,
  pattern-inert sentence before scanning and comparing the full padded strings, verified
  empirically against the live Redactor before shipping (see assumptions). Commit 5 is a one-line
  docs touch-up: the module docstring's `capture-check` summary was stale after PR2d and did not
  mention the new dest/PII gates.
lane: infra/dynamic-workflow-2f
