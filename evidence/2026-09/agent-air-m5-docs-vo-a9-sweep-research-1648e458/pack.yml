    seat: "vo-sweep-pack (Sonnet 5)"
  - lane: vo-a9-sweep-research-review-1
    role: review
    seat: "tp1-qwen3.8-max — README's A9-addendum claims checked against two JSON excerpts derived from the committed report JSONs; 2 findings, both about excerpt narrowness (see dissent), no README defect found"
  - lane: vo-a9-sweep-research-review-2
    role: review
    seat: "tp1-deepseek-v4-pro (reserve, substituting for an unavailable titolare — see seat_fallback_reason) — same task file; 1 finding, same excerpt-narrowness root cause, no README defect found"
