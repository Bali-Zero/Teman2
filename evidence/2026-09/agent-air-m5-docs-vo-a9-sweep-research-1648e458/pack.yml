runtime_proof: >-
  None applicable and none claimed — no code ships. Step 8 of the A9 activation ceremony
  (PROVELIVE-A9-ACTIVATION-REPORT.md, not committed here) already ran 8 targeted prove-live
  probes against the live engine; this PR's own artefact is a docs capture of the follow-on
  252-walk sweep, not itself a prove-live action.
dissent:
  - seat: "tp1-qwen3.8-max"
    objection: >-
      The README's payload_sha256 claim (`e5f791b5…72204` on all 252 walks) is not verifiable
      from the JSON excerpt handed to the review task (the excerpt omitted the
      rule_pack.payload_sha256 field to keep the task file small).
    status: RETRACTED
    reason: >-
      Excerpt-narrowness artifact, not a README defect. Verified directly against the FULL
      committed JSON: `set(w["rule_pack"]["payload_sha256"] for w in walks)` ==
      {"e5f791b5232fd1369ef3b94ca7bb5f349f9bb6eb4073895aa9f7deb682e72204"}, len 1, all 252
      walks — matches the README verbatim.
  - seat: "tp1-qwen3.8-max"
    objection: >-
      The README's claim that 4 named reason codes are "new in A9, absent from every walk in
      B4-2b" is not verifiable from the b42b-excerpt (it carries only walk_id/engine_state, no
      reason_codes) — the review task's own instructions asked the seat to assume an empty
      universe if load-bearing, which the seat correctly flagged as an assumption rather than
      silently accepting.
    status: RETRACTED
    reason: >-
      Excerpt-narrowness artifact, not a README defect. Independently recomputed from BOTH FULL
      committed JSONs' reason_codes.review_reasons + reason_codes.no_path_reasons (a proper
      Counter difference, not an assumed-empty universe): the set present in A9 but absent from
      B4-2b is exactly {E33G_LOCAL_COMPANY_NOT_ALLOWED: 7, STUDY_ADMISSION_OR_SPONSOR_NOT_CONFIRMED: 4,
      E33G_LOCAL_MARKET_NOT_ALLOWED: 2, RETIREMENT_INCOME_BELOW_THRESHOLD: 1} — matches the
      README exactly, no extra or missing code.
  - seat: "tp1-deepseek-v4-pro"
    objection: >-
      Same as tp1-qwen3.8-max's second finding — the new-reason-codes claim cannot be validated
      from the b42b-excerpt under the stated assumption, and a wider reading of "load-bearing"
      would make every A9-only code "new", contradicting the README's short 4-code list.
    status: RETRACTED
    reason: >-
      Same disposition as above: the full-data recomputation (not the excerpt, and not an
      assumed-empty B4-2b universe) matches the README's 4-code list and counts exactly. No fix
      made to README.md.
residual_risks:
  - "Both review seats' only findings trace to the review task's excerpt being narrower than the
    full committed JSON (it dropped payload_sha256 and reason_codes from the B4-2b comparison
    file to keep the task file a manageable size for a TP1 call). Every finding was disposed by
    re-deriving the same numbers from the FULL data, not by editing README.md — there was
    nothing in the README itself to fix."
  - "This pack SATISFIES R9's council_run quorum (2 distinct COUNCIL_REVIEW_SEATS, both
    ok:true) rather than declaring seat_override, per the caution in this task's dispatch: a
    prior gate (#7198, 2026-09-24) reworked a PR whose seat_override claimed 'the only live
    seat was X' without having measured the others. Here codex-gpt-5.6-sol and kimi-code/k3
    were directly probed and both TIMEOUT'd (arsenal_probe.py, 15s ceiling) before falling back
    to tp1-deepseek-v4-pro — the substitution is measured, not assumed, and named in
    seat_fallback_reason."
