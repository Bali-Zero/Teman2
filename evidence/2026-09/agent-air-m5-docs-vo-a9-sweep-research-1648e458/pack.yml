tests:
  - "None. This diff adds a README section and a data file and changes no code path. The
    assertions that matter are the receipts above."
static:
  - "PII sweep over prove-live-a9-seq23-full-sweep-report-20260924.json and README.md: clean
    (see receipts). Same shape as the B4-2 precedent's static PII sweep
    (evidence/2026-09/agent-air-m5-ops-vo-b4-2-live-enumeration-3ea372a3/pack.yml)."
runtime_proof: >-
  None applicable and none claimed — no code ships. Step 8 of the A9 activation ceremony
  (PROVELIVE-A9-ACTIVATION-REPORT.md, not committed here) already ran 8 targeted prove-live
  probes against the live engine; this PR's own artefact is a docs capture of the follow-on
  252-walk sweep, not itself a prove-live action.
dissent:
  - seat: "tp1-qwen3.8-max"
    objection: >-
      The README's payload_sha256 claim (`e5f791b5…72204` on all 252 walks) is not verifiable
      from the JSON excerpt handed to the review task (the excerpt omitted the
      rule_pack.payload_sha256 field to keep the task file small).
    status: RETRACTED
    reason: >-
      Excerpt-narrowness artifact, not a README defect. Verified directly against the FULL
      committed JSON: `set(w["rule_pack"]["payload_sha256"] for w in walks)` ==
      {"e5f791b5232fd1369ef3b94ca7bb5f349f9bb6eb4073895aa9f7deb682e72204"}, len 1, all 252
      walks — matches the README verbatim.
  - seat: "tp1-qwen3.8-max"
    objection: >-
      The README's claim that 4 named reason codes are "new in A9, absent from every walk in
      B4-2b" is not verifiable from the b42b-excerpt (it carries only walk_id/engine_state, no
      reason_codes) — the review task's own instructions asked the seat to assume an empty
      universe if load-bearing, which the seat correctly flagged as an assumption rather than
      silently accepting.
    status: RETRACTED
    reason: >-
      Excerpt-narrowness artifact, not a README defect. Independently recomputed from BOTH FULL
      committed JSONs' reason_codes.review_reasons + reason_codes.no_path_reasons (a proper
      Counter difference, not an assumed-empty universe): the set present in A9 but absent from
      B4-2b is exactly {E33G_LOCAL_COMPANY_NOT_ALLOWED: 7, STUDY_ADMISSION_OR_SPONSOR_NOT_CONFIRMED: 4,
      E33G_LOCAL_MARKET_NOT_ALLOWED: 2, RETIREMENT_INCOME_BELOW_THRESHOLD: 1} — matches the
      README exactly, no extra or missing code.
  - seat: "tp1-deepseek-v4-pro"
    objection: >-
      Same as tp1-qwen3.8-max's second finding — the new-reason-codes claim cannot be validated
      from the b42b-excerpt under the stated assumption, and a wider reading of "load-bearing"
      would make every A9-only code "new", contradicting the README's short 4-code list.
    status: RETRACTED
    reason: >-
      Same disposition as above: the full-data recomputation (not the excerpt, and not an
      assumed-empty B4-2b universe) matches the README's 4-code list and counts exactly. No fix
      made to README.md.
  - seat: "gate-sweep-7230 (fresh Opus 5.5, REWORK-BUILD, PR comment #issuecomment-5815645718)"
    objection: >-
      M1 (MEDIUM) — the README's A9 addendum said ``git log origin/main --grep "A3'-B"` returns
      no commit`. It returns 2: `d5843d0e93` (A3'-M, #7172) and `01d1f99b60` (#7160), both
      ancestors of the merge-base, so also on main at sweep time. The ceremony report
      (PROVELIVE-A9-ACTIVATION-REPORT.md:138) carries the qualified form ("→ no commit; only
      A3'-0 `01d1f99b60` and A3'-M `d5843d0e93`"); the README dropped the qualifier. The
      conclusion (A3'-B not built) holds; the by-command claim as literally worded did not
      reproduce.
    status: CONFIRMED
    reason: >-
      Fixed in README.md (research/operations/2026-09-22-visa-oracle-live-enumeration/README.md,
      the `HUMAN_REVIEW_REQUIRED = 28` breakdown paragraph): now states the command returns 2
      commits by hash/PR, that neither commit's own subject IS A3'-B (a separate `grep -c` over
      commit subjects returns 0), and that both only MENTION A3'-B as future work — matching the
      ceremony report's qualified form. Reproduced live this round:
      `git log origin/main --grep "A3'-B" --format=%h | wc -l` -> `2` (both commits' hashes and
      PR numbers verified: `d5843d0e93` #7172, `01d1f99b60` #7160);
      `git log origin/main --format=%s | grep -c "A3'-B"` -> `0`.
  - seat: "gate-sweep-7230 (fresh Opus 5.5), L1/L4/L6"
    objection: >-
      L1 — PR body said `contract_verify.py` returned "all 4 checks PASS" then listed 5 check
      names; the run returns 5 PASS. L4 — README frontmatter `sources:` omitted the new JSON;
      `adversarial_review: codex` describes only the original B4-2/B4-2b sections, not the A9
      addendum (reviewed by the TP1 council). L6 — the PR body's `Bites:` line named "the NEXT
      re-sweep" as a consumer, which is a future job, not a present one.
    status: CONFIRMED
    reason: >-
      L1 fixed in the PR body (corrected count to 5). L4 fixed in README.md frontmatter (added
      the new JSON to `sources:`) and body (new "### A9 addendum (2026-09-24, TP1 council)"
      subsection under the existing `## Adversarial review` heading, naming both TP1 seats, their
      verdicts, and the 3 findings' disposition — `adversarial_review: codex` is left as-is,
      since it is true of the original sections and the frontmatter schema
      (`check_adversarial_review.py`) accepts exactly one scalar value, not a per-section list).
      L6 fixed in the PR body's `Bites:` line: consumer is now the A3'-B prove-live in this same
      mandate (the conductor diffs the post-A3'-B live walks against THIS JSON; the gate on
      #7234 already reads it), observation is the post-merge sha match plus the README section
      landing on main.
  - seat: "gate-sweep-7230 (fresh Opus 5.5), L2/L3/L5/L7 — no change made"
    objection: >-
      L2 — `refuter-task.txt` (78,510 B) is large; is it needed as evidence? L3 — the review
      task's excerpts (which left out `payload_sha256` and B4-2b `reason_codes`) are why the
      TP1 council could not have caught M1 (non-numeric/text claims were outside its scope by
      construction). L5 — pack-lint NOTICEs (acceptance bullets with no `probe:`, 1 assumption
      `unverified`, no `spend:`). L7 — the codex/kimi TIMEOUTs are recorded only in
      `seat_fallback_reason`, not as `ok:false` rows in council.jsonl (`arsenal_probe.py` keeps
      no log, so they cannot be re-checked after the fact).
    status: PLAUSIBLE
    reason: >-
      L2 — kept: the gate itself called this correct (needed as provenance for why the 3
      RETRACTED dissents above are RETRACTED, not merely asserted). L3 — accurate description of
      this pack's own design, not a defect to cure; noted for anyone reading dissent to
      understand the M1 gap. L5 — cured where cheap: every `acceptance:` bullet in this pack's
      sibling `brief.yml` now carries a `probe:` (see brief.yml). The 1 `unverified` assumption
      and missing `spend:` are left as-is — both are accurate (the sha/activation-id assumption
      genuinely rests on the dispatch message, not a probe this task can run; `spend:` tracking
      is not wired into this task's tooling). L7 — accurate; `arsenal_probe.py` has no
      persistent log to backfill `ok:false` rows from, so this is a real tooling gap in the
      fleet, not something this pack can fix locally.
residual_risks:
  - "Both review seats' only findings trace to the review task's excerpt being narrower than the
    full committed JSON (it dropped payload_sha256 and reason_codes from the B4-2b comparison
    file to keep the task file a manageable size for a TP1 call). Every finding was disposed by
    re-deriving the same numbers from the FULL data, not by editing README.md — there was
    nothing in the README itself to fix."
  - "This pack SATISFIES R9's council_run quorum (2 distinct COUNCIL_REVIEW_SEATS, both
    ok:true) rather than declaring seat_override, per the caution in this task's dispatch: a
    prior gate (#7198, 2026-09-24) reworked a PR whose seat_override claimed 'the only live
    seat was X' without having measured the others. Here codex-gpt-5.6-sol and kimi-code/k3
    were directly probed and both TIMEOUT'd (arsenal_probe.py, 15s ceiling) before falling back
    to tp1-deepseek-v4-pro — the substitution is measured, not assumed, and named in
    seat_fallback_reason."
