# CI stages every per-PR pair under /tmp/evidence-check/evidence/{brief,pack}.yml.
# evidence_paths.py and harness-floor.yml therefore require this canonical staging reference.
brief_ref: evidence/brief.yml
council_run: council.jsonl
seat_fallback_reason: >-
  Titolare quorum for R9 is codex-gpt-5.6-sol / kimi-code/k3 / tp1-qwen3.8-max. tp1-qwen3.8-max
  answered live (arsenal_probe.py --seats tp1-qwen3.8-max: LIVE, 1847ms) and is counted as-is —
  no substitution needed for it. The other two titolari, codex-gpt-5.6-sol and kimi-code/k3,
  were probed directly this task (arsenal_probe.py --seats codex,kimi, 2026-09-24T13:12:24Z) and
  both TIMEOUT'd at the probe's flat 15s ceiling with no answer, so tp1-deepseek-v4-pro (reserve
  bench) substitutes for one of them, counted toward quorum alongside the live titolare
  tp1-qwen3.8-max. Quorum (2 distinct COUNCIL_REVIEW_SEATS, both ok:true) is met without
  invoking `seat_override` — R9 is SATISFIED, not waived.
seat_diversity: satisfied
seat_diversity_note: >-
  One build lane (docs-only data-capture PR, same shape as the B4-2 precedent
  evidence/2026-09/agent-air-m5-ops-vo-b4-2-live-enumeration-3ea372a3/). The review side is
  TWO cross-family TP1 seats (tp1-qwen3.8-max, tp1-deepseek-v4-pro), each run independently
  against the same task file — the README's A9-addendum claims checked against two JSON
  excerpts (252-walk census/state/reason-code fields) derived by script from the two committed
  report JSONs. Both seats' full output is journaled in council.jsonl.
plan_ref: >-
  team-lead dispatch (this session, 2026-09-24), task vo-a9-sweep-research — curing PR #7230's
  red floor (Harness floor recompute run 35994943337: Gear-3 pack authored brief.yml without
  pack.yml, plus the deprecated ROOT evidence/brief.yml write target). This pack + brief.yml
  land under the canonical per-PR path (scripts/ci/evidence_paths.py --ref
  agent/air-m5/docs/vo-a9-sweep-research); the ROOT evidence/brief.yml is restored to
  origin/main's content in the same commit.
lanes:
  - lane: vo-a9-sweep-research-build
    role: build
    seat: "vo-sweep-pack (Sonnet 5)"
  - lane: vo-a9-sweep-research-review-1
    role: review
    seat: "tp1-qwen3.8-max — README's A9-addendum claims checked against two JSON excerpts derived from the committed report JSONs; 2 findings, both about excerpt narrowness (see dissent), no README defect found"
  - lane: vo-a9-sweep-research-review-2
    role: review
    seat: "tp1-deepseek-v4-pro (reserve, substituting for an unavailable titolare — see seat_fallback_reason) — same task file; 1 finding, same excerpt-narrowness root cause, no README defect found"
diff:
  files: 8
  net_lines: >-
    8 files, +16113/-0 (computed from `git diff $(git merge-base origin/main HEAD) --numstat`
    against the working tree, on this PR's final head — using the merge-base, not a raw
    `origin/main` diff, since origin/main has since advanced with ~50 unrelated files from other
    merged PRs that a raw diff would wrongly pull in): research/operations/2026-09-22-visa-oracle-live-enumeration/README.md
    (+128), research/operations/2026-09-22-visa-oracle-live-enumeration/prove-live-a9-seq23-full-sweep-report-20260924.json
    (+12432, new file), evidence/2026-09/agent-air-m5-docs-vo-a9-sweep-research-1648e458/brief.yml
    (+39), evidence/2026-09/agent-air-m5-docs-vo-a9-sweep-research-1648e458/pack.yml (+240),
    evidence/2026-09/agent-air-m5-docs-vo-a9-sweep-research-1648e458/council.jsonl (+3),
    evidence/2026-09/agent-air-m5-docs-vo-a9-sweep-research-1648e458/refuter-runs/{refuter-task.txt
    (+3245), refuter-qwen.txt (+18), refuter-deepseek.txt (+8)}. The ROOT evidence/brief.yml is
    RESTORED to origin/main's content since the first commit of this PR, so it carries zero net
    diff against origin/main and does not appear in this numstat.
  behaviour_change: >-
    None. This diff adds a README section and one evidence JSON file under research/, plus the
    per-PR evidence pack/brief and a council journal, and restores the root evidence/brief.yml
    to origin/main's content. No code changes, ships into no deployed artifact.
