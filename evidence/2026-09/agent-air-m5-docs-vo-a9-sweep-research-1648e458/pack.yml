    result: "(3, size)"
    ts: "2026-09-24 (builder, M5)"
    seat: "vo-sweep-pack (Sonnet 5)"
    exit: 0
  - claim: >-
      gate-sweep-7230's M1 finding reproduces: `git log origin/main --grep "A3'-B"` returns 2
      commits, neither of which is A3'-B's own commit (both only mention it as future work).
    cmd: >-
      git log origin/main --grep "A3'-B" --format=%h | wc -l ;
      git log origin/main --format=%s | grep -c "A3'-B"
    result: "2 (d5843d0e93 A3'-M #7172, 01d1f99b60 #7160); 0 (no commit's own subject is A3'-B)"
    ts: "2026-09-24 (builder, M5, this rework round)"
