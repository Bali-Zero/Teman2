dissent:
  - seat: "claude-opus-5 (Dux) vs codex gpt-5.6-sol"
    status: PLAUSIBLE
    objection: >-
      Codex requires "request-level evidence that the successful window stayed
      within 40 provider attempts" before moving from BLOCK to ACCEPT. The Dux
      cannot produce it and will not pretend to: this window has no access to
      the provider's usage dashboard. What CAN be shown is structural rather
      than testimonial - the product's client is replaced, after construction,
      with one built at max_retries=0 (observed as client.max_retries == 0 in a
      pre-flight that made no call), so the SDK retries nothing and one call to
      generate_query_embedding is exactly one provider attempt; the harness
      counts every attempt itself and stops at the ceiling; both receipts here
      account for every attempt (0 + 23); and the cured budget check makes a
      future run subtract what prior receipts already spent. Residual risk,
      stated plainly: if the SDK made a transport-level attempt this code
      cannot observe, no receipt here would show it. A limit of the instrument,
      recorded rather than papered over. CLOSED AS PLAUSIBLE rather than left
      OPEN (the pack contract admits only CONFIRMED/PLAUSIBLE/RETRACTED): the
      objection is well-founded — the evidence Codex asked for genuinely does
      not exist — and it is not CONFIRMED because nothing observed contradicts
      the structural account above, nor RETRACTED because Codex never withdrew
      it. Residual risk stands as written.
  - seat: "claude-opus-5 (Dux) vs gemini-3.1-pro"
    status: CONFIRMED
    objection: >-
      Gemini called the hostname written into the receipt a PII leak. Rejected:
      the owner's own machine name is not client data, the boundary this repo
      enforces is about client and OSINT data, and every evidence pack in this
      tree records its host. Recorded rather than silently dropped.
