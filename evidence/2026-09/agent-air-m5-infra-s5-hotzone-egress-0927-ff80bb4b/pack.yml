brief_ref: evidence/brief.yml
plan_ref: >-
  PR (agent/air-m5/infra/s5-hotzone-egress-0927) — team-lead mandate
  2026-09-27, S5 of docs/specs/2026-09-27-evidence-pack-fixed-point.md.
lanes:
  - lane: s5-hotzone-egress-build
    role: build
    seat: "session (M5, Sonnet 5 conducting)"
seat_override: >-
  Gear-3 diff edits the hot-zone gate list that itself decides when an
  external seat (codex/kimi/agy/gemini/qwen) may be dispatched on a diff —
  dispatching one of those same seats to review this exact diff would make
  generator and grader the same entity on the surface most in need of
  separation (this PR exists precisely because #7466 skipped independent
  review). No council or external seat was run. The fresh `harness/fable-
  gate` gate session, required at gear 3 by this very enforcement, is the
  second opinion in place of a council quorum.
diff:
  net_lines: >-
    Content diff at the graded sha: four new HOTZONE_PATTERNS entries
    (scripts/evidence_pack_lint.py), the same four entries added to the
    mirrored bash case block (.github/workflows/hot-zone-pr-gate.yml), one
    new spec section S5 (docs/specs/2026-09-27-evidence-pack-fixed-point.md),
    and one new sync test (scripts/tests/test_hotzone_lists_sync.py, 91
    lines, 3 test cases). No production code path touched, no consumer's
    runtime behavior changed except the floor computation those two lists
    feed. Exact line counts are not narrated here on purpose (S1 of this
    same spec): the pack's own bytes are not excluded from the size term
    yet, so any figure written here drifts with every pack edit — the
    gate's own receipt records the `git diff --numstat` it observed.
  behaviour_change: >-
    Before this PR, `.claude/scripts/codex-spalla.sh`, `scripts/lib/
    spalla_redact.sh`, `.claude/hooks/codex-spalla-trigger.sh` and any
    future `.codex/hooks/*` file floored at gear 1 (no hot-zone match) —
    exactly the gap PR #7466 fell through. After this PR, a changed-file
    set containing any of those four paths floors at gear 3 on both the
    Python-side `compute_floor()` (consumed by harness-floor.yml) and the
    bash-side case block (consumed by hot-zone-pr-gate.yml), and a new
    pytest module fails CI the moment the two lists diverge again.
receipts:
  - claim: >-
      Deterministic gear floor recomputed from THIS PR's actual changed-file
      list is 3 (path term — .github/workflows/hot-zone-pr-gate.yml is
      itself hot-zone via the existing `.github/workflows/*` entry).
    cmd: >-
      MERGE_BASE=$(git merge-base origin/main HEAD); git diff --name-only
      $MERGE_BASE HEAD > /tmp/s5-changed-files.txt; git diff --no-renames
      --numstat $MERGE_BASE HEAD > /tmp/s5-numstat.txt; python3
      scripts/evidence_pack_lint.py --print-floor --changed-files-file
      /tmp/s5-changed-files.txt --numstat-file /tmp/s5-numstat.txt
    result: "3"
    exit: 0
    ts: "2026-09-27T07:35:00Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: "Floor source for this diff is the PATH term, not the SIZE term."
    cmd: >-
      python3 scripts/evidence_pack_lint.py --print-floor-source
      --changed-files-file /tmp/s5-changed-files.txt --numstat-file
      /tmp/s5-numstat.txt
    result: "path"
    exit: 0
    ts: "2026-09-27T07:35:05Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: >-
      GUILT — each of the four newly-added paths floors at 3 in isolation
      (a one-line synthetic changed-files list per path).
    cmd: >-
      for f in .claude/scripts/codex-spalla.sh scripts/lib/spalla_redact.sh
      .claude/hooks/codex-spalla-trigger.sh .codex/hooks/some_new_hook.sh;
      do printf '%s\n' "$f" > /tmp/probe.txt; python3
      scripts/evidence_pack_lint.py --print-floor --changed-files-file
      /tmp/probe.txt; done
    result: "3\n3\n3\n3"
    exit: 0
    ts: "2026-09-27T07:36:00Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: "INNOCENCE — an unrelated ordinary path still floors at 1."
    cmd: >-
      printf 'some/other/unrelated_file.py\n' > /tmp/probe5.txt; python3
      scripts/evidence_pack_lint.py --print-floor --changed-files-file
      /tmp/probe5.txt
    result: "1"
    exit: 0
    ts: "2026-09-27T07:36:05Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: >-
      The mirrored bash `case` block in hot-zone-pr-gate.yml matches a new
      file under the freshly-added `.codex/hooks/*` glob, proving the two
      lists were kept in the same shape (glob, not a literal-only match).
    cmd: >-
      bash -c 'f=".codex/hooks/some_new_hook.sh"; case "$f" in
      .claude/scripts/codex-spalla.sh|scripts/lib/spalla_redact.sh|.claude/hooks/codex-spalla-trigger.sh|.codex/hooks/*)
      echo "HIT: $f" ;; *) echo "MISS: $f" ;; esac'
    result: "HIT: .codex/hooks/some_new_hook.sh"
    exit: 0
    ts: "2026-09-27T07:36:20Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: "The new sync test module passes in full (3/3)."
    cmd: python3 -m pytest scripts/tests/test_hotzone_lists_sync.py -v
    result: "3 passed"
    exit: 0
    ts: "2026-09-27T07:33:00Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: >-
      No regression to the existing HOTZONE_PATTERNS guilt+innocence corpus
      or any other rule's selftest.
    cmd: python3 scripts/evidence_pack_lint.py --selftest
    result: "SELFTEST PASS"
    exit: 0
    ts: "2026-09-27T07:32:00Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: "The full evidence_pack_lint pytest suite (770 cases) stays green."
