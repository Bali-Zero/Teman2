bites:
  consumer: >-
    the harness floor on every future PR touching
    .claude/scripts/codex-spalla.sh, scripts/lib/spalla_redact.sh,
    .claude/hooks/codex-spalla-trigger.sh or .codex/hooks/*
  where: ci
  observe: python3 scripts/evidence_pack_lint.py --print-floor --changed-files-file scripts/tests/fixtures/s5_hotzone_probe_changed_files.txt
  expect: "contains:3"
dissent:
  - seat: "session (M5, Sonnet 5 conducting) — self-review, no external seat dispatched (see seat_override)"
    objection: >-
      [P1, self-raised] The repo-wide grep for diff-forwarding wrappers
      (git grep -ln "git diff" -- '*.sh' | xargs grep -l -iE
      "codex|kimi|agy|gemini|qwen") also matched
      scripts/codex/codex-daily-research-actor.sh and
      scripts/codex/codex-nightly-coverage-improver.sh. Both invoke `codex
      exec` as an autonomous agent that reads source files through its own
      sandboxed tool access — which still transmits that file content to
      OpenAI's backend, structurally the same egress risk as
      codex-spalla.sh piping a diff, just via a different verb. Excluding
      them leaves a real, not-fully-closed instance of this gap's own
      pattern.
    status: CONFIRMED
    resolution: >-
      Verified directly: codex-nightly-coverage-improver.sh's `git diff`
      calls (lines 300, 342, 355) are all `--name-only`/`--shortstat` used
      for the script's own PR bookkeeping (file lists, LOC counts), never
      piped into CODEX_PROMPT; the prompt (lines 239-260) only names
      `${TARGET_FILE}` by path and instructs Codex to read it itself.
      codex-daily-research-actor.sh's two `git diff --name-only` calls
      (lines 344, 363) are the same bookkeeping pattern. Neither script
      redacts-then-forwards diff/file content the way codex-spalla.sh does
      — there is no redaction step to gate at all in this shape, because
      the wrapper itself never holds the content; Codex's own file-read
      tool does, under its own pre-existing sandboxed-write operating mode
      used repo-wide (scripts/codex/*, scripts/agy_*.py, scripts/kimi_
      client.py and dozens of other dispatch scripts share this same
      "agent reads the repo itself" shape).
    disposition: >-
      Left out of this PR's hot-zone list on purpose. The objection is
      real but out of scope: gating every `codex exec`/`kimi`/`gemini`/
      `qwen` invocation in the repo — dozens of scripts, none sharing
      codex-spalla.sh's specific redact-then-pipe-a-diff shape — is a
      separate, much larger spec (which paths, which redaction contract,
      which of those scripts are even live automation vs archived) that
      does not fit this PR's ~120-line budget or its narrow gap (S5 closes
      exactly the #7466 shape: a wrapper whose OWN code redacts/refuses
      before forwarding). Documented explicitly in brief.yml's
      `constraints` and in the spec's S5 Enforcement paragraph so the scope
      cut is visible, not silent.
