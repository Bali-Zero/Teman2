    cmd: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/hot-zone-pr-gate.yml'))"
    result: "no exception raised"
    exit: 0
    ts: "2026-09-27T07:31:00Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: >-
      spalla_redact.sh and codex-spalla-trigger.sh are live, wired
