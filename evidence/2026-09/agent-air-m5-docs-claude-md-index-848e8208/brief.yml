    found verbatim (whitespace-normalized) in the new root or a destination file. Verified
    independently by the gate: 263 lines, 1 lost and it is the bare '# Part B' heading separator."
  - "CANON builder-contract block byte-identical across CLAUDE.md/AGENTS.md/GEMINI.md/QWEN.md and
    vs origin/main (door_canon_parity) — hash-verified before and after, unchanged."
