  per-session overhead, ~52k of it memory files; the SOTA research (PR #5628) named the
  over-specified CLAUDE.md as the one anti-SOTA surface.

  Floor 2 by SIZE (net +564/-247 across 8 files; measured with evidence_pack_lint --print-floor).
  Built by a Sonnet 5 implementer in its own worktree; gated by the conducting session.
constraints:
