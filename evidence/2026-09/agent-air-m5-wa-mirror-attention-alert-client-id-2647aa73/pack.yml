pii_scan_note:
  "The diff touches no client data at runtime — it removes a client-data field from a SQL
  SELECT and hardens tests around that removal. The one PII item in this whole round was the
  real phone number found embedded in test/docstring FIXTURES (not live client data), which
  this delta scrubs. The council prompts sent to codex and kimi carried the spec, the gate's
  own prose findings, and the delta diff — with that real number's digits (and its masked
  form) replaced by literal placeholder tokens BEFORE the prompt left the machine, since the
  reviewed range (0904a9b1e4..HEAD) includes the scrub commit itself and its raw diff would
  otherwise show the real digits on removed lines. No repo dump, no client identifiers, no
  secrets, no PII reached either external seat."

