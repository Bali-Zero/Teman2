  - "/visa/clock loses its only internal inbound link (it was visa/page.tsx:104). It keeps its sitemap entry, its canonical and its direct URL, but nothing on the site links to it any more. Re-homing it needs a surface this window may not touch."
  - "apps/mouth/src/proxy.ts:331-338 still maps visa.balizero.com / -> /visa and /quiz|/result|/chat -> /visa/match, so those become two-hop chains (302 then 308). Correct, just not minimal; collapsing them is a one-line change in a file with 25 middleware tests, outside this perimeter."
  - "/visa/match/[hash] inherits alternates.canonical https://balizero.com/visa/match from visa/match/layout.tsx, which now redirects to a noindex page. Left exactly as found because the window override says robots stay untouched; it belongs with Zero's A4 ratification."
  - "Internal links still pointing at the retired doors, each now taking one 308 hop: v2/_components/PersonaDoors.tsx:78, (blog)/NewsPageClient.tsx:21, (blog)/contact/page.tsx:260, (blog)/services/page.tsx:50, visa/voa/[hash]/page.tsx:207 and components/blog/ArticleToolEmbed.tsx:9 (the last one iframes /visa/match, and no article currently uses it — grep over src/content returns nothing)."
  - "packages/core's AppBranchSelector now has no consumer in apps/mouth. It keeps its own unit tests in packages/core; deleting it would widen this PR into a shared package."
  - "src/app/visa/voa/*.test.tsx fail in the .worktrees/mouth-vo-c-doors-2 checkout on clean origin/main with a null React dispatcher inside packages/core — a shared-node_modules resolution fault (family #5), not a main-branch red. CI is the authority on those files."
  - "If Zero wants the literal 301 rather than 308, and wants it at the edge, it is a `statusCode: 301` pair in next.config.ts — a separate window, which the grounding report floors at gear 3."
  - "A4 (lifting noindex on /visa-oracle) is untouched and carried to the close line under needs input."
