dissent:
  - seat: Claude Opus 5 (self-refutation, on the first attempt)
    objection: >-
      #6401 was reported as complete work, armed for auto-merge, with a pack
      whose receipts were all green — and it shipped a 200. The only reason it
      did not land is that its author kept measuring after arming. Every gate in
      this repo would have passed it: typecheck, vitest 448/448, eslint,
      prettier, the Vercel preview deploy, "Visa Oracle fullstack smoke",
      "Frontend Tests (mouth)", "E2E Tests (Playwright)". "apps/mouth compiles"
      is only `tsc --noEmit` and never builds; the e2e redirect assertions this
      window wrote are not collected by the PR gate, which runs
      `--grep "page Page|@offline"`. Nothing in CI probes an HTTP status.
    status: CONFIRMED
    cure: >-
      Cured for this window by asserting the status code in a unit test that runs
      in the required "Frontend Tests (mouth, true)" check, so the property is
      now guarded on every future PR touching these routes. NOT cured for the
      repo: the general hole — no CI check anywhere probes a response status —
      is recorded as a leftover for the imperator. It is a harness question, not
      a visa one.
  - seat: Claude Opus 5 (self-refutation, on what the retirement takes with it)
    objection: >-
      /visa was not only the quiz door: it was the branch selector, and it held
      the ONLY internal link to /visa/clock (the visa-expiry timeline tool).
      Measured — `grep -rn "/visa/clock" apps/mouth/src` returned the sitemap,
      the clock's own files, and visa/page.tsx line 104. Nothing else. Retiring
      /visa leaves /visa/clock reachable only from search and from a saved URL:
      exactly the shape of the trauma sitemap.test.ts was written for ("live and
      unreachable").
    status: CONFIRMED
    cure: >-
      Not cured inside this window, and named rather than left to be discovered.
      /visa/clock KEEPS its sitemap entry and its canonical, so it is still
      indexed and still resolves — what it loses is its internal inbound link.
      Re-homing it touches surfaces this window is forbidden from: the Oracle
      route group is fenced by ruling, the homepage doors are another window's
      perimeter. Recorded as the first leftover.
  - seat: Claude Opus 5 (self-refutation, on the cost of the mechanism)
    objection: >-
      A `force-dynamic` route handler costs a server invocation on every hit to
      a URL whose only job is to redirect, where a next.config entry would answer
      at the edge for free. On an indexed door this is not nothing.
    status: PLAUSIBLE
    cure: >-
      Not cured, deliberately, and the trade is stated rather than hidden: the
      next.config table is shared by every funnel on the domain and a mistake in
      it is site-wide, while this costs one invocation on two URLs whose traffic
      decays as search re-indexes. If the invocation count ever matters, moving
      these two entries into next.config is a two-line change — recorded as a
      leftover with its own gear consequence (the report floors that at 3).
  - seat: Claude Opus 5 (self-refutation, on the proof that is still missing)
    objection: >-
      Every acceptance that matters is a LIVE property, and nothing in this diff
      proves a live property. A merged redirect is not a served redirect.
    status: CONFIRMED
    cure: >-
      The pack is filed with the BEFORE measurement taken live this session
      (receipts 2 and 3) and with a local `next build` + `next start` probe of
      the actual mechanism (receipts 4 and 5), which is as close to live as a
      pre-merge session can get. The AFTER measurement — curl with redirects
      disabled on /visa, /visa/match, /visa/match/<synthetic-hash>, /visa-oracle
      and the sitemap on the promoted build — is taken after the merge and
      reported in the window's close line. Nothing in this pack claims a
      post-merge fact.
leftovers:
