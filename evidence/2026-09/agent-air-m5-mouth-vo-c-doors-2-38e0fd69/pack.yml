decisions:
  - id: D-gear
    decision: >-
      Gear 2 declared, and 2 is also the deterministic floor from
      evidence_pack_lint.py compute_floor(): "size" term, 9 files +235/-671 =
      906 churn on the merge-base diff, under the 1828 that floors at 3, and no
      hot-zone path. The report's escalation condition ("gear 3 if the redirect
      touches shared next.config") does not fire, because D1 keeps out of it. No
      council: council is a Gear-3 demand.
  - id: D0
    decision: >-
      THIS IS THE SECOND ATTEMPT. PR #6401 shipped the same intent with
      `permanentRedirect("/visa-oracle")` in a page component, and it answered
      200. Measured after arming, on its own head fb7847e: `next build --webpack`
      emitted `.next/server/app/visa.html` at 41135 bytes, prerender-manifest
      recorded `/visa` as `{"routeType":"page","compute":"static","response":
      "complete"}`, and `next start` + `curl -sS -D - /visa` returned
      `HTTP/1.1 200 OK` with `x-nextjs-cache: HIT`, `x-nextjs-prerender: 1` and
      NO `location:` header. The redirect existed only in the client bundle,
      after hydration. Arming had frozen that branch, so #6401 was commented,
      un-armed and CLOSED, and this work restarted from a fresh origin/main
      (bf783e8d) rather than being pushed on top — the freeze is a rule, not a
      preference. The correction stops at depth 1: one wrong mechanism, one
      measured replacement, no third variant.
  - id: D1
    decision: >-
      The redirect is a ROUTE HANDLER (`route.ts` returning
      `NextResponse.redirect(new URL("/visa-oracle", request.url), 308)` with
      `export const dynamic = "force-dynamic"`), not a page and not an entry in
      apps/mouth/next.config.ts. A route handler cannot be prerendered into an
      HTML document — it returns a Response — which is precisely the property
      D0 shows a page does not have; the build now marks both routes `ƒ`
      (dynamic) where the page version was `○` (static). next.config.ts stays
      untouched because its redirects() table is shared by every funnel on the
      domain (60+ ordering-sensitive entries for blog, kbli, tax, property,
      immigration and second-home, including `:slug*` catch-alls): a mistake
      there is site-wide, while here the blast radius is one URL. Keeping a file
      at each path also keeps sitemap.test.ts's walk enumerating /visa and
      /visa/match — that walk counts `route.ts` as well as `page.tsx` — so their
      absence from the sitemap stays a written decision instead of a silent
      disappearance. Cost: 308, not a literal 301. Both are permanent redirects
      with identical link-equity semantics, 308 additionally preserves the
      method, and the window brief accepts "301/308".
  - id: D2
    decision: >-
      Robots are not touched anywhere in this diff — not on /visa-oracle, and
      not on the retired doors either. Acceptance A4 says a robots change without
      a quoted ruling is a fail, and the window override says "leave robots
      exactly as they are". That override is read literally, including for
      /visa/match/[hash], whose inherited canonical now points at a URL that
      redirects (see leftovers) — fixing that is a robots/canonical decision and
      belongs with Zero's A4 ratification, not smuggled in beside a redirect.
  - id: D3
    decision: >-
      /visa/match/[hash] and its API are untouched, and `visa/match/layout.tsx`
      stays because that child still needs it (a layout never wraps a route
      handler, so the new route.ts beside it is unaffected). The window retires
      an ENTRY POINT, not a data path: a result link a visitor already saved must
      still open. The e2e suite asserts this with a non-existent synthetic hash —
      200 plus the page's own "could not find this recommendation" state — which
      is the strongest form of the claim, because it passes without depending on
      any stored record.
  - id: D4
    decision: >-
      apps/mouth/src/proxy.ts is NOT edited, although it is the real front door:
      visa.balizero.com/ 302s to /visa (proxy.ts:331-338) and is what the
      homepage PersonaDoors, FunnelCTAs, FunnelFeature and funnel-nav all link
      to. After this change that path becomes 302 -> 308 -> /visa-oracle: two
      hops, no lost visitor, and the homepage door labelled "Visa Oracle" finally
      lands on the Oracle. proxy.ts is outside the window perimeter and carries
      25 middleware tests; collapsing the chain is a separate one-line window.
  - id: D5
    decision: >-
      The W0b telemetry antibody that lived in visa/match/page.test.tsx is not
      lost with the wizard it guarded. formSubmitFailed(endpoint, status) — the
      event whose absence made the v1 funnel die silently for three months — is
      still pinned on the two wizards that remain, visa/clock/page.test.tsx and
      lib/funnel-app-events.test.ts (both green in receipt 7).
  - id: D6
    decision: >-
      The GARUDA dark-ship guard in sitemap.test.ts MOVED rather than
      disappeared. It read the /visa landing page and asserted it carried no
      `href="/visa/voa"`; that page is now deleted, so the test would have died
      with its target. Its INTENT was never "the landing page does not link
      GARUDA", it was "nothing a visitor can reach links GARUDA while it ships
      dark". It now walks the whole app tree, minus GARUDA's own subtree (its
      result page links back to itself behind a one-time hash) and minus the test
      file itself, with a positive control so the walk cannot pass vacuously.
      Measured before writing it: exactly one non-test occurrence of
      `href="/visa/voa"` exists in apps/mouth/src, inside voa/[hash]/page.tsx.
  - id: D7
    decision: >-
      The new guard asserts the STATUS CODE (308) and the Location header by
      calling the handlers directly, plus a second case proving the redirect
      follows the visitor's own origin rather than a hard-coded host. That shape
      is chosen because of D0: a DOM assertion, or any assertion that follows
      redirects, passes just as happily on a 200 that redirects after hydration.
