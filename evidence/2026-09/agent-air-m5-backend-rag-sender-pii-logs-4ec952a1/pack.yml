cloud_ok: >-
  CLAUDE.md Builder Contract 4 / SYMBIOSIS Law 2: every cloud seat in this pack, both rounds (this
  session, Codex FIX-FIRST, the on-disk gate) worked only on repository diffs, docstrings and
  synthetic test fixtures — `leak.probe@example.com` and similarly obviously-fake addresses, never
  a real Bali Zero client row, name, address or document. This attests the actual no-PII scope of
  this fix (a logging-only change to code paths that touch CRM data at runtime, not a change
  exercised against runtime CRM data itself), not an exception allowing cloud processing of real
  client data.
dissent:
  - seat: "codex FIX-FIRST (read-only), against commit 9666233cff"
    objection: >-
      Round 0's recipient redaction improved, but the Zoho send path still logged provider errors
      in the clear. `_request` (blocking, confirmed with a synthetic probe on the extracted
      method) logged the full decoded error body; `_log_activity`, `get_email`'s mark-read,
      `get_unread_count` interpolated `e` directly; `upload_attachment` logged the complete
      provider response at one site and `e` with `exc_info=True` at another; `send_email` still
      logged the subject, letting an address inside it through in the clear.
      `birthday_notifier_service.py`'s outer run-failure handler interpolated `e` too. Behavior for
      valid input, payload, audit and Telegram was otherwise unchanged, which meant
      `email_audit.py`'s alert still carried the raw error text. The redaction helper itself is not
      infallible: an email-shaped string with a lone Unicode surrogate raises `UnicodeEncodeError`
      inside it, and `to=None` in `send_email` now fails one line earlier than origin/main
      (inside the new redaction comprehension, before the `try:`), changing the invalid-input
      failure site. New round-0 tests mocked `_request` itself, which hid the blocking leak rather
      than exercising it.
    status: CONFIRMED
    disposition: >-
      All five leak sites and the helper's crash bug fixed this round, one fix per finding (see
      `objective:`/`acceptance:` in brief.yml). `to=None` was restored to origin/main's exact
      failure site via a None-safe redaction comprehension rather than an earlier fail-fast. The
      one item explicitly NOT changed per the review's own instruction:
      `birthday_notifier_service.py`'s `JSONDecodeError` `str(exc)[:80]` at custom_fields parsing —
      its message is position-only (no field content), so redacting it further would remove
      diagnostic value without closing a leak.
  - seat: "on-disk gate (opus), against round 1 head e4c69946eb"
    objection: >-
      REWORK-BUILD, 6 findings (`spec_7385_r2.md`). M1: `app/routers/newsletter.py:89` passed
      `log_context=f"newsletter-double-optin email={email}"` — a raw address, live on the double
      opt-in path — and this pack's own round-1 text had wrongly asserted every `log_context=`
      caller was fixed-tag-only. M2: round 1's own guilt test
      (`test_no_traceback_is_emitted_on_failure`) lost its `assert exc_info is None` — it slid into
      the next test function, leaving the real one vacuous (would pass even if `exc_info=True` were
      reintroduced). M3: round 1's new `upload_attachment` extension field
      (`filename.rsplit(".",1)[-1]`) was itself unbounded — `First.Lastname` or `scan.a@b` as an
      "extension" reaches the log verbatim. M6: `upload_attachment`'s four pre-validation log sites
      (request-received, file-too-large, filename-too-long, filename-sanitized) plus the
      already-touched success log still logged the raw filename — round 1 fixed only the two
      POST-failure sites the review had named. M4: the Telegram alert's scrub ran AFTER truncation,
      so a cut landing right after `@` left the local part in the sent text. M5: the scrub's token
      class (`[^\s@<>"'`]+`) consumed Markdown delimiters (`*`/`_`) adjacent to the match, so a
      subject like `*Delivery to a@b*` lost its closing `*` — an unbalanced Telegram Markdown send
      is rejected (400), dropping the alert entirely, which the review called worse than the leak
      it was closing.
    status: CONFIRMED
    disposition: >-
      All six findings fixed this round, one fix per finding (see the M1-M6 acceptance criteria in
      brief.yml), each guilt-tested against `e4c69946eb` (M2 by mutation, since its defect had no
      separable pre-fix file — see the M2 receipt in this file). Every `log_context=` caller in the
      repo re-grepped post-fix and confirmed fixed-tag/bare-identifier shaped (11 sites). Explicitly
      OUT of scope per the spec's own framing, left for a follow-up PR:
      `app/modules/notifications/router.py:555-556,562,594`;
      `waiting_documents_service.py`/`completed_process_service.py`'s "Email sent to %s via Zoho
      fallback"; `email_audit.py:117,163,199` (DB exception text, not the Telegram alert path this
      PR closes). NITs noted, not fixed: quoted local parts / `%40` / fullwidth `＠` not scrubbed by
      the email-token regex; one-shot iterators in to/cc/bcc would be consumed by the log
      comprehension before the real send (every current caller passes a list, not an iterator, so
      this is latent, not live). A single `_` in a subject already broke the alert's Markdown on
      `main` before this PR — pre-existing, out of scope, noted per the spec's own instruction.
