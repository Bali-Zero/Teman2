grader: |
  Round 1: Cross-family review, Codex FIX-FIRST (read-only) against commit 9666233cff, given the
  round-0 diff and told to find residual leaks. Found the five sites round 1 fixed plus the
  helper's surrogate-input bug.

  Round 2: on-disk gate against round 1's head (`e4c69946eb`) returned REWORK-BUILD with six more
  findings (M1-M6, `spec_7385_r2.md`), including a live leak this pack's own round-1 text had
  wrongly cleared (M1) and a regression the round-1 fix itself introduced in both the product code
  (M3's unbounded extension field) and its own guilt test (M2's slid assertion) — see `dissent:` in
  pack.yml for both rounds' full findings and dispositions. Each fix, both rounds, carries its own
  guilt test (fails on the pre-fix head, passes on the cure) rather than an after-the-fact review
  claim; verified locally by re-running each new test against a `cp`-restored copy of the pre-fix
  file (`git stash` forbidden per this session's own instructions), one file at a time, then
  restoring the cure. M2's regression, having no separable pre-fix FILE version (it is a one-line
  slide inside a test file this session itself wrote), was instead proven by mutation: inject
  `exc_info=True` at the guarded product-code log site, confirm the restored assertion catches it,
  revert the mutation.
