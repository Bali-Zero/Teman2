    apps/backend-rag/backend/app/auth/public_endpoints.py (docstring of
    path_matches_template only — this is the `app/auth/**` HOT ZONE touch that
    raises the deterministic floor to 3; behaviour unchanged on purpose)
  - apps/backend-rag/backend/tests/unit/middleware/test_hybrid_auth_contract_401_envelope.py
  - apps/backend-rag/backend/tests/unit/middleware/test_public_endpoints_registry.py
constraints:
  - products/garuda-voa/contracts/openapi.yaml is NOT modified by this PR.
  - No served behaviour changes — no router, middleware, service or migration file.
  - No fly.toml, no .env*, no zantara_core.py.
  - No PII anywhere in code, tests, or this pack.
  - No seed in prod.
acceptance:
  - text: >-
      IF garuda_staff_router._privacy_headers adds a header the middleware's
      contract-401 envelope does not serve, THEN the privacy-header test SHALL
      fail (and symmetrically for a header only the middleware serves).
    status: verified
    probe: >-
      guilt mutations on _privacy_headers, each rerunning
      test_privacy_headers_match_the_staff_router_they_stand_in_for: fourth
      header, deleted content-length, duplicated Cache-Control pair — all
      FAIL; unmutated tree PASS.
  - text: >-
      WHEN path_matches_template receives a leading/trailing-slash variant of a
      template, THE SYSTEM SHALL match it, and an inner double slash, an extra
      or missing segment, or an empty {param} SHALL NOT match — exactly as the
      rewritten docstring states.
    status: verified
    probe: >-
      PYTHONPATH=. pytest
      backend/tests/unit/middleware/test_public_endpoints_registry.py -k
      test_path_matches_template_trailing_and_inner_slashes (10 cases)
  - text: >-
      WHEN an unauthenticated request reaches a real staff operation with a
      trailing slash, THE SYSTEM SHALL answer with the same contract
      SESSION_REQUIRED envelope as the slash-less operation.
    status: verified
    probe: >-
      the two trailing-slash entries added to _STAFF_PATHS in
      test_hybrid_auth_contract_401_envelope.py pass; post-merge on the promoted
      commit: curl -s https://nuzantara-rag.fly.dev/api/visa/voa/staff/practices
      | grep -c SESSION_REQUIRED == 1 (unchanged from #6235)
risks:
