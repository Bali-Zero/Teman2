objective: >-
  GARUDA VOA W3C follow-up to #6235 (residual 1 of 4, already merged and proven
  live at 3313c26e5a). Window colour BLUE, Dux = Claude Opus 5 xhigh. Cures two
  FALSE CLAIMS that shipped in #6235's own prose, one concern: text attributing
  to the code a property the code does not have. (A)
  test_privacy_headers_match_the_staff_router_they_stand_in_for claimed to
  compare router and middleware privacy headers "in BOTH directions", but
  filtered the router side down to names the middleware already had, so a
  fourth header added to garuda_staff_router._privacy_headers passed silently
  (gate condition 2 on #6235, ledgered by #6244). (B) the docstring of
  public_endpoints.path_matches_template claimed "/a/b/" fails against "/a/b";
  it MATCHES, because strip("/") removes leading and trailing slashes before
  splitting (found by Kimi K3 executing the function, second reader on #6235).
scope:
