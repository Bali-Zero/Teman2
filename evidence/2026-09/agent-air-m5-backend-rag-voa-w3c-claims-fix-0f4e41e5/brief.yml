    (a) The trailing-slash MATCH is now pinned by a test rather than merely
    undocumented. Changing it later remains allowed, but it becomes a decision
    that turns a test red, not an accident — that is the point.
  - >-
    (b) The refuter took three rounds on this PR, and every defect it found
    after round 1 was PROSE in a test docstring claiming more than its
    assertion checked. Closed by Zero's ruling B (2026-09-11 14:08Z, relayed
    by the GARUDA VOA Imperatore): every touched test docstring is one line
    stating exactly what its assertion checks, no Sol O4, and a fresh gate
    verifies prose <= assertion line by line.
