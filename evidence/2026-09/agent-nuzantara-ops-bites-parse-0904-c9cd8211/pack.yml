brief_ref_note: >-
  The literal path is required: harness-floor.yml stages the brief to
  /tmp/evidence-check/evidence/brief.yml and lints with --repo-root /tmp/evidence-check, so a
  per-task path here does not resolve in CI. The real brief for this task is the sibling
