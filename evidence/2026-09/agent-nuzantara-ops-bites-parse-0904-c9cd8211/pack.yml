plan_ref: >-
  docs/plans/2026-09-03-relaunch-lanes/LANE-H-bites-reconciler.md, PR-1 of four. Zero's
  mandate of 2026-09-04. The brief is committed by the sibling PR #5658.
lanes:
  - lane: bites-parse-build
    role: build
    seat: >-
      claude-opus-5 xhigh (conducting session, Pro) — measured the finding, designed the
      format, wrote the parser, its corpus, its tests, the registry surface, the lint step
      and the docs section, and disposed every refuter finding by re-verifying it on disk.
      ONE lane, TWO rounds: after the verdict gate returned REWORK-BUILD on c7c83ee the
      same seat applied all four of its findings on the same branch. Recorded as one lane
      because it is one seat continuing one build, not a second builder — the rework is
      visible in the journal (role:build, lane:rework), in the fourth, fifth and sixth
      dissent blocks, and in the round-4 receipts.
  - lane: bites-parse-refute-1
    role: review
    seat: >-
      codex-gpt-5.6-sol, read-only sandbox, xhigh (cross-family) — dispatched on the threat
      model, not on a conclusion to confirm: "find a PR body that makes the runner do
      something other than observe". Its first dispatch was REFUSED by the vendor's cyber
      filter and produced nothing; that run is journaled as not-run rather than counted.
      The second, framed as maintainer-side validation review, returned the finding that
      changed the design.
  - lane: bites-parse-refute-2
    role: review
    seat: >-
      kimi-code/k3 (cross-family) — dispatched on the ALREADY-HARDENED file, deliberately,
      so it could not re-find what the first round had already cured. It found six things
      nobody else did, one of them production-critical.
  - lane: bites-parse-verdict
    role: review
    seat: >-
      claude-opus-5, Gear-3 harness verdict gate, independent of the build and given the
      pack's receipts as CLAIMS to re-run rather than as evidence. Returned REWORK-BUILD
      on c7c83ee, which was published as a failure status and the PR disarmed before any
      fix was written. Its findings are the fourth dissent block below and they are the
      reason this pack has a second build lane.
  - lane: bites-parse-refute-3
    role: review
    seat: >-
      gemini-3.1-pro via agy (width) — dispatched on the same three questions. Not a
      COUNCIL_REVIEW_SEATS member and not counted toward quorum; recorded because its
      finding was the most structural of the three.
seat_diversity: satisfied
seat_diversity_note: >-
  Three distinct non-Anthropic families reviewed a diff authored by an Anthropic seat, and
  the author gated nothing of its own: every finding was re-verified against the file
  before being applied or declined. Two of the three (codex, kimi-code/k3) are
  COUNCIL_REVIEW_SEATS; the Alibaba seat was dispatched and did not run, and is journaled
  as such — a seat that did not run is not a seat that agreed.
council_run: journal.jsonl
diff: >-
  Measured from the merge-base, never two-dot (W102):
  `git diff --cached --numstat $(git merge-base HEAD origin/main)`. Run it rather than
  trusting a figure written into a file that is itself part of the diff.

  SHAPE. One new module (scripts/ci/bites_parse.py: seven guards, a two-stage parse layer,
  a 51-entry guilt+innocence corpus, a --selftest that needs no network and no token), one
  new test file (66 tests), one registry surface with every guard's proofs named, four
  small edits to the conformance checker's dispatch, and two additions to
  immune-enforcement.yml (a lint step, and the test in both the unit-test loop AND the
  sentinel path list). Plus one section in docs/rules/operations.md.

  SIZE, stated rather than hidden: ~1,500 added lines against the contract's ~400. It is
  one concern — the format and the boundary that makes it safe — and the bulk is proofs:
  splitting the guards from their guilt+innocence corpus would have landed a validator
  with no evidence that it validates. The ceiling rule is not engaged (the floor is 3 by
  path, from the workflow edit), so this is a disclosure, not an override.
