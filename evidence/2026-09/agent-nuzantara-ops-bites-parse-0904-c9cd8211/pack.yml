cloud_ok: >-
  SYMBIOSIS Law 2 output boundary. Nothing client-bearing exists anywhere near this lane:
  the subject is a markdown parser and a CI lint. Every cross-family dispatch carried the
  parser's own rules and, in one case, the file itself — no client identifier, no message
  body, no CRM row, no OSINT record, no credential. The one credential-adjacent fact
  discussed (that actions/checkout persists a token into .git/config) is upstream public
  documentation, and it appears here as the REASON `curl -b` is refused, never as a value.
pii_scan: clean
pii_scan_note: >-
  No path in this diff is PII-bearing and no prompt carried client data. The `${VAR:+SET}`
  discipline was not needed because no secret was read at any point.
dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      "`python3 scripts/...` is not a capability boundary. It admits every script in the
      tree, including scripts/usage/cswap.py, whose `run` subcommand reaches os.execvpe,
      and scripts/ci/restore_drill_verify.py --psql-bin and
      scripts/ci/stage_council_journal.py --git-bin, each of which executes a binary its
      argument names."
    status: CONFIRMED
    resolution: >-
      Applied, and it replaced a rule rather than patching one. `_guard_observable_script`
      makes reachability a property a script declares in its own SOURCE (the marker
      `bites-observable`), fail-closed on a missing marker, a missing file, an unreadable
      file or a path that escapes the checkout. Content-keyed, never location-keyed (W109).
      Verified on disk: scripts/usage/cswap.py exists and is refused
      (test_observable_script_guilt_a_real_execvpe_script_is_rejected asserts BOTH, so the
      day the file moves the test says so rather than passing vacuously).
  - seat: kimi-code/k3
    objection: >-
      "FLY_READONLY_SUBCOMMANDS lists first WORDS and the guard reads rest[0] only, so
      `fly machine run <image>` passes — arbitrary container execution on production."
    status: CONFIRMED
    resolution: >-
      Applied. Fly is now checked as PAIRS, like gh already was: `machine list` and
      `machine status` are permitted, `machine run`/`destroy`/`update` are not. This is the
      SECOND instance of superscar #3's under-match inside this one file — the first was
      the guard that inspects only argv[0] — which is why the registry note for
      _guard_no_remote_shell now records the pattern rather than the instance.
      Five further findings from the same seat were applied with it: `git tag`/`git branch`
      create refs and left the read-only list; `git diff --output=<relative>` writes a file
      the path guard permits and joined GIT_FORBIDDEN_FLAGS; `curl -b .git/config` reads
      the file actions/checkout leaves credentials in; `curl evil.test/x` carries no `://`
      so the https check never fired; `gh --repo=other/repo` retargets the observation.
  - seat: gemini-3.1-pro
    objection: >-
      "extract_region can pick a different block than the one a human sees rendered: a
      `## Bites` inside an HTML comment is invisible on GitHub and parsed identically to a
      visible one; a fenced example parses as a contract; two blocks are silently
      first-wins; zero-width characters make the heading and the keys parse differently
      from how they render."
    status: CONFIRMED
    resolution: >-
      Applied, and it is the finding that mattered most because it defeats every guard at
      once — a reviewer approving what they can see would have been approving something
      else. blind_hidden_regions() blanks fenced blocks and HTML comments before scanning
      (preserving line positions so the two extractions stay comparable); two visible
      blocks are `malformed` rather than first-wins; a block needing normalisation is
      refused rather than guessed. The narrowness is proven too: a zero-width character
      ELSEWHERE in the body is not penalised
      (test_a_zero_width_character_elsewhere_in_the_body_is_not_penalised), because a guard
      that fails a whole class to catch one case is the over-match twin of the same scar.
  - seat: claude-opus-5 (Gear-3 verdict gate)
    objection: >-
      "blind_hidden_regions takes the closed-pair branch on a line carrying BOTH `<!--`
      and `-->` and leaves in_comment False, so `<!-- note --> <!--` followed by a hostile
      block parses as executable — acceptance A4 fails for an input one character away
      from the one tested. And _FENCE_RE toggles on any fence marker, so a block opened
      with four backticks and closed with three (which CommonMark leaves OPEN) makes a
      rendered code EXAMPLE the live contract — the inverse of the test that claims to
      prove otherwise."
    status: CONFIRMED
    resolution: >-
      Applied, and it is the most important finding in the pack because it falsified an
      acceptance criterion this pack had already asserted as met. Comments are now
      consumed by a SCANNER that carries its state out of each line, so a closed pair and
      an opener on one line leave the comment open exactly as GitHub renders it; fences
      track the opening character and run length and close only on the same character at
      least as long. Both of the gate's literal break inputs now classify as `absent`, and
      both are in the corpus (guilt-comment-closed-and-reopened-on-one-line,
      guilt-four-backtick-fence-not-closed-by-three) so the regression cannot return
      silently. The lesson generalises past this file: three adversarial rounds had each
      confirmed the blinding worked, and all three were testing the tested input.
  - seat: claude-opus-5 (Gear-3 verdict gate)
    objection: >-
      "Three novel allow-list holes: `git grep -O<cmd>` runs a pager command through a
      permitted subcommand, and `-Oevil` never matches an entry compared with
      split('=')[0]; `pytest --override-ini=addopts=-pevil` reinstates every flag the
      plugin ban removes; `curl --netrc-file=<path>` reads a local credentials file, a
      sibling of the already-cured `-b .git/config`."
    status: CONFIRMED
    resolution: >-
      All three applied, plus the matcher defect underneath the first: `_flag_is` now
      recognises `--flag`, `--flag=value`, a glued short value (`-Oevil`) and a family
      prefix (`--expand-`). Curing the git one introduced an OVER-match that had to be
      caught in the same breath — a flat forbidden list refuses `git grep -c`, which is
      grep's innocent count flag, because git's dangerous `-c` is a GLOBAL option. Options
      are therefore checked BY POSITION now, and
      test_command_allowlist_innocence_git_grep_count_flag_passes is registered as
      innocence so that collapsing the two lists back into one goes red.
  - seat: claude-opus-5 (Gear-3 verdict gate)
    objection: >-
      "The lint fails OPEN through its trigger: `on: pull_request` with no `types:`
      defaults to opened/synchronize/reopened, so a body EDITED after the last push is
      never re-linted — clean body, green check, edit to malformed, merges green. And
      PR-1's own Bites observation (`bites_parse.py --selftest`) passes identically with
      the lint step, the registry entry and the immune wiring all deleted: it proves the
      corpus, not the consumer it names."
    status: CONFIRMED
    resolution: >-
      Both applied, and the second is the one worth recording. `types: [opened,
      synchronize, reopened, edited]` closes the trigger gap at negligible cost, because
      the heavy battery in this job stays gated on a path check that a body-edit run
      computes as false. For the observation: it is now
      `python3 -m pytest scripts/tests/test_bites_parse.py`, and a new test asserts the
      lint step, the `env:` mapping and the `edited` trigger are all present in the
      workflow — delete any of the three and the observation goes red. A Bites line whose
      observation cannot fail when its consumer is deleted is precisely the disease this
      whole PR exists to cure, and the first draft of it had the disease.
  - seat: kimi-code/k3
    objection: >-
      "A pull request can add scripts/evil.py carrying the `bites-observable` marker in the
      same diff. The marker is only as strong as the review of the diff that adds it."
    status: CONFIRMED
    resolution: >-
      Confirmed as a real limit, and DECLINED as a code change because it is not fixable in
      the parser: any marker a diff can add, a diff can add. It is
      answered by a CONSTRAINT ON THE EXECUTOR instead, written into the module's docstring
      and into docs/rules/operations.md so PR-2 inherits it in writing: observations run
      POST-MERGE ONLY, when the marked script is reviewed, merged code. The same argument
      covers `python3 -m pytest`, which imports whatever conftest.py a branch carries.
      Recorded rather than quietly noted, because a constraint that lives only in a
      reviewer's head is the class of promise this whole lane exists to abolish.
