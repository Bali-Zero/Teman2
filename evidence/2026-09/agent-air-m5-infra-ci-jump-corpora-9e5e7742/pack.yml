what_changed: |
  ONE existing workflow, .github/workflows/guard-conformance.yml: push.paths
  gains five surfaces (scripts/wa_army_watcher.sh and the four corpora
  test_wa_army_watcher_shell.py, test_window_jump_shell.py,
  test_tmux_jump_shell.py, test_nz_jump_model_alias.py); the relevant-paths
  sentinel regex gains the same five, so a PR touching any of them runs the
  job instead of ending green as a sentinel; the existing "Context-window
  guard + window jump corpora" step gains a pytest line over the three jump
  corpora plus infra/claude-hooks/test_probe_log_cap.py; a NEW step installs
  tmux with apt, refuses to continue if the binary is still missing
  (command -v tmux under set -euo pipefail, then tmux -V so the version lands
  in the log) and runs scripts/tests/test_wa_army_watcher_shell.py against a
  real tmux on a private socket. Council folds: tmux -V in the step (kimi
  P2/P3) and a 10 s timeout on the corpus teardown's kill-server (codex P3).
  infra/claude-hooks/test_probe_log_cap.py's docstring stops claiming that no
  workflow runs it. Plus this evidence pack. No new workflow file, so the
  watcher-conformance list is untouched.

proof: |
  See receipts. Deterministic floor 3 / path. Every one of the five new
  surfaces is matched by the sentinel regex (guilt+innocence receipt: the
  regex extracted from the workflow file itself, each path tested). The four
  portable corpora plus the watcher corpus pass locally, 36 tests, none
  skipped (-rs). With tmux removed from PATH the step body exits 1 at
  command -v before pytest is reached, so the corpus cannot skip green in
  CI. actionlint under CI's own flags, the timeout-floor linter and the
  errexit-decap linter are clean after the folds. Two cross-family seats
  reviewed the diff, both GO-WITH-NITS; every finding is folded or recorded
  as dissent below. The live proof is the check itself: the workflow lists
  itself in the sentinel regex, so this PR's own guard-conformance run
  executes both steps, and its log is read before the work is reported done.

dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      "test_wa_army_watcher_shell.py:98 the teardown kill-server call has no timeout, so a
      wedged tmux server could consume the remainder of the 10-minute job despite the bounded
      test waits."
    status: CONFIRMED
    resolution:
      "timeout=10 on the kill-server call, subprocess.TimeoutExpired tolerated; the corpus
      re-run after the fold passes 3/3 (receipt)."
  - seat: kimi-code/k3
    objection:
      "The pipe-pane -o toggle the corpus pins was measured on tmux 3.7b (macOS) while apt on
      ubuntu-latest yields an older tmux, so a version-semantics failure would be opaque; add a
      tmux -V assertion or pin the version."
    status: PLAUSIBLE
    resolution:
      "No pin: #{pane_pipe} and the -o toggle predate tmux 3.x and the watcher only pipes panes
      reporting pane_pipe 0. The step now prints tmux -V right after command -v so any version
      drift is readable in the log next to the corpus result."
  - seat: kimi-code/k3
    objection:
      "apt-get update -qq >/dev/null hides the diagnostic you would want when the install
      itself breaks."
    status: PLAUSIBLE
    resolution:
      "Only stdout is redirected; apt's errors go to stderr and set -e stops the step on them.
      The tmux -V line covers the 'what got installed' half of the request."
  - seat: kimi-code/k3
    objection:
      "Q2 asserted that tmux is preinstalled on the ubuntu-latest runner image, which would make
      the install a no-op."
    status: PLAUSIBLE
    resolution:
      "Refuted on the manifest: actions/runner-images Ubuntu2404-Readme.md (333 lines, fetched
      2026-09-18T17:31Z) lists no tmux. The install step stays load-bearing; the brief's first
      assumption stands."

