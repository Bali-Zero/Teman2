rework:
  - 'BENCH DEFECT fixed: scripts/bench/cc_headless_shape_bench.sh''s hardcoded default list now
    calls `--setting-sources ""` (a real empty argv element, not the 2-char string) — proof:
    re-ran the bench, setting_sources_empty now returns rc=0, result=''PONG'', TOTAL_IN=26973 (was
    rc=1, NOJSON, ''Invalid setting source: ""''). Also replaced the SHAPES-override path''s
    `eval run "$label" $flags` (word-splitting eats an empty flag value the same way) with a
    ''|''-separated flag list parsed via `read -ra` behind a sentinel-token trick (bash''s `read`
    silently drops a TRAILING empty field on plain split — appending then slicing off a sentinel
    keeps it); verified in isolation for the no-flags / one-flag / two-flag / trailing-empty-flag
    cases before wiring it in.'
  - 'FALSE CLAIM corrected: the lint docstring no longer says `--setting-sources ""` is
    ''rejected outright by newer CLI builds'' — it now states the measured truth (26,973 tokens,
    answered, on CLI 2.1.274) and explains the rejection artefact was the bench''s own quoting
    bug, not a CLI limitation. Checked agent_job.py/claude_vision.py comments and the prior
    brief''s A5 for the same claim — neither cure comment mentioned --setting-sources at all, so
    only the lint docstring and this brief needed the correction.'
  - "HONEST DOC: grandfathered.json's `_doc` (regenerated via --freeze after the docstring edit,
    same 20 files) and the lint's freeze() payload text no longer say a new offender 'fails CI'
    — both now say ADVISORY until backlog row C1d lands, naming scripts/quickcheck.sh as the
    actual (advisory) reporter and explaining why the CI step is a separate Gear-3 PR. Same
    sentence added to the lint's module docstring, right after the GRANDFATHER LIST paragraph."
  - "BITES corrected: consumer (b) now says 18 guilt/innocence checks in --selftest (counted via
    `--selftest 2>&1 | grep -cE '^\\s+(ok|FAIL)\\s'` = 18, not the prior brief's 14 — the count
    grew across #6708/#6714/#6715's fixes without the number being re-verified). Consumer (c)
    split in two: cc_hook_latency_bench.py IS cited by path in the BACKLOG's H10 row (verified:
    `grep -n cc_hook_latency_bench.py research/agent-craft/cc-meta-loop/BACKLOG.md` hits line
    236's H10 section); cc_headless_shape_bench.sh is NOT cited by name anywhere in the C4 row
    or section (verified: grep for the filename in BACKLOG.md returns zero hits) — its real
    consumers are the lint docstring and the two cure comments, stated as such instead of a
    false BACKLOG citation."
