task: >-
  C1 of the cc-meta-loop backlog: every headless `claude -p`/`--print` invocation in the repo
  carries a context-diet flag (`--restricted`, `--safe-mode`, `--setting-sources`) or an
  explicit `# context-diet: exempt — <reason>` pragma. A new lint
  (`scripts/lint/lint_claude_headless_context_diet.py`, reusing the anchor/window engine of
  lint_claude_headless_limits.py, file-level grandfather list that only shrinks, --selftest,
  monotone check vs origin/main) wired into the LOCAL pre-push consumer scripts/quickcheck.sh
  (ADVISORY until backlog row C1d lands — a CI workflow step is a hot-zone-path edit and needs
  its own Gear-3 PR); plus three cures in the same PR: agent_job.py session bootstrap (2
  text-only calls → --restricted --strict-mcp-config), claude_vision.py (needs Read →
  --safe-mode, proven live with a one-boolean json-schema against an on-disk PNG), and the
  exempt pragma on the deliberate Canva-MCP exception. Ships two re-measure scripts so the
  frozen numbers cited by the BACKLOG never have to be trusted cold:
  scripts/bench/cc_headless_shape_bench.sh (the lint docstring's/cure comments' token numbers —
  not itself cited by name in the BACKLOG's C4 row, which only describes the methodology
  inline) and scripts/bench/cc_hook_latency_bench.py (cited BY PATH in the BACKLOG's H10 row).
lane: infra/cc-context-diet-lint
machine: Air-M5
