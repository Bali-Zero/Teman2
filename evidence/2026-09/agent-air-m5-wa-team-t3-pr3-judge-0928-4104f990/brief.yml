acceptance:
  A1: >-
    `--judge [--dry-run] [--judge-limit N]` selects `status='unjudged' AND
    attempts<5 ORDER BY created_at, id LIMIT N` (default 20, hard cap 50),
    re-splits the CURRENT whatsapp_message_context body with
    `_split_clauses` and verifies `clause_hash` — a mismatch or an
    out-of-range `clause_idx` goes `superseded` with NO Ollama call; every
    status UPDATE (superseded/judged_false/judged_true/attempt-increment) is
    guarded by `status='unjudged' AND clause_hash=$judged`, so a scanner
    revision mid-tick makes the guard fail (0 rows) and counts `raced`
    rather than silently overwriting.
    probe: >-
      apps/backend-rag/.venv/bin/python -m pytest
      scripts/tests/test_wa_team_promises_judge.py -v
  A2: >-
    Strict verdict validation: only a JSON object with EXACTLY
    `{"future_commitment_by_sender": <bool>}` counts — "false", ["false"],
    0, 1, a missing/extra key, non-JSON or empty content all count as an
    INVALID attempt (attempts+=1, stays unjudged; the 5th -> quarantined),
    never auto-true, never silently dropped. A prompt-injection clause
    reaches the model ONLY inside the user message's own JSON string, never
    the system prompt, and the request always carries `format`=the closed
    schema. A transport failure (connection refused/timeout/non-200/
    malformed envelope) is NOT an attempt — it raises OllamaTransportError,
    which stops the tick (stage=ollama in the sanitized FAIL line) rather
    than quarantining the backlog on an Ollama outage.
    probe: >-
      apps/backend-rag/.venv/bin/python -m pytest
      scripts/tests/test_wa_team_promises_judge.py -k "parse_verdict or
      call_ollama or ollama_transport" -v
  A3: >-
    judged_true is ONE transaction: the guarded UPDATE, then INSERT INTO
    team_promises (message_id, promise_text, promise_type, due_at,
    extractor_version) ON CONFLICT (message_id, promise_type) DO NOTHING —
    two candidates on the same message_id+promise_type land exactly ONE
    team_promises row. due_at = candidate's due_at_hint resolved via
    _TEMPORAL_CUES when present, else message created_at + 48h (D6). Proven
    against REAL Postgres (guarded UPDATE actually blocking a simulated
    concurrent scanner revision, real ON CONFLICT dedup), not a Python
    re-implementation of the guard.
    probe: >-
      WA_TEAM_PROMISES_REAL_PG=1 apps/backend-rag/.venv/bin/python -m
      pytest scripts/tests/test_wa_team_promises_judge_real_pg.py -v
  A4: >-
    team_promise_candidates.status's CHECK constraint upgrades from the
    PR-1/PR-2 4-value shape (with existing rows) to the 5-value shape
    (adds `superseded`) idempotently — DROP CONSTRAINT IF EXISTS + ADD
    CONSTRAINT by the SAME auto-generated name, verified via
    pg_get_constraintdef inside --init-schema's own transaction; rerunning
    is a genuine no-op; a pre-existing row with a status value outside
    BOTH the old and new value sets makes the ADD CONSTRAINT itself fail
    (asyncpg.CheckViolationError), rolling back the whole init-schema
    transaction rather than silently accepting corrupt data.
    probe: >-
      WA_TEAM_PROMISES_REAL_PG=1 apps/backend-rag/.venv/bin/python -m
      pytest scripts/tests/test_wa_team_promises_judge_real_pg.py -k
      "status_check or bad_preexisting" -v
  A5: >-
    No clause, message body, model output, message-id list, phone or name
    ever reaches stdout/stderr/logs on any path (dry-run, transport
    failure, gateway failure) — the judge's own OK line is ints only
    (`selected/true/false/invalid/quarantined/superseded/raced/wall_ms`).
    The full unit+real-PG corpus (218 unit passed / REAL_PG unset, 260
    passed with WA_TEAM_PROMISES_REAL_PG=1) is green; ruff and shellcheck
    clean on every touched file.
    probe: >-
      apps/backend-rag/.venv/bin/python -m pytest
      scripts/tests/test_wa_team_promises*.py -q

