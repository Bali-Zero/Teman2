task: >-
  T3 PR-3 (the Pro-local Ollama judge over team_promise_candidates), spec at
  scripts/tests/ scratchpad spec_T3_PR3_judge.md, parent spec_T3_split_v2.md
  §PR-3. Adds `--judge` to scripts/wa_team_promises.py: reads `unjudged`
  candidates, re-verifies each against the CURRENT whatsapp_message_context
  body (a body that shrank/changed goes `superseded`, never Ollama-judged —
  discharges PENDING-ARMS PWC-CONDITIONS C2 for PR #7367), asks the
  Pro-local qwen3.5:9b whether the clause is a future commitment BY THE
  SENDER via a no-proxy opener + a closed JSON schema, and on `true` inserts
  the deduped row into team_promises (ON CONFLICT DO NOTHING). due_at
  resolves from the candidate's due_at_hint, or +48h when no hint resolves
  (owner ruling D6, 2026-09-28, closed mid-build). Every status transition
  is guarded by `status='unjudged' AND clause_hash=$judged` so a concurrent
  scan-tick revision loses the race cleanly (`raced`, no partial write).
  Also hardens C3 (tick_start_wita frozen once, before the scan runs, used
  for both the midnight-hour check and the yesterday window) and replaces
  team_promise_candidates.status's 4-value CHECK with a 5-value one
  (`superseded` added) idempotently, verified via pg_get_constraintdef
  inside --init-schema's own transaction. Ships the cron wrapper
  (scripts/wa_team_promises_judge_cron.sh, installed by the conductor after
  merge, not by this PR) and its own lock file, separate from the scanner's.
