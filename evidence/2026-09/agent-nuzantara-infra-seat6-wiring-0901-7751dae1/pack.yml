brief_ref: evidence/brief.yml
council_run: journal.jsonl
plan_ref: >-
  Consolidation of three stale PRs (#4640 seat6-consumers, #4644 seat6-cascade, #4645
  seat6-reflexion), opened 2026-08-23 and stuck 9 days. Zero's ruling 2026-09-01: close the three
  and cut ONE PR from current main carrying their content plus the test fix they never made.

lanes:
  - lane: seat6-ground
    role: read
    seat: >-
      claude-opus-5 (conducting session, Pro). Established by measurement, not by reading the PRs'
      claims: the three branches' seat6 content is IDENTICAL to seat6-reflexion on the wrapper,
      the wr3 scripts and the slot-6 coverage test (blob-SHA equality), and their remaining
      differences against this branch are main's own advancement, not content they hold and this
      branch lacks — the W102 shape, seen from the other side.
  - lane: seat6-build
    role: build
    seat: >-
      claude-opus-5 (conducting session, Pro). Carries the wiring authored in the seat6-* lanes
      onto a fresh base, and adds the two things those lanes never had: a behavioural test of the
      NUMBERED slot-6 branch, and the removal of a test_seat_state.sh check that could only ever
      compare against a sibling PR's tip.
  - lane: seat6-refute-codex
    role: review
    seat: >-
      codex gpt-5.6-sol, --sandbox read-only, cross-family. REFUTED the first draft — returned
      BLOCK with three findings, of which two were upheld and drove this PR's content (the missing
      behavioural test; the -z/.strip() divergence). Its most serious finding (the Team token still
      sitting in slot 5) was checked and NOT realised — slot5 and slot6 hashes differ.
  - lane: seat6-grade
    role: review
    seat: >-
      claude-sonnet-5 subagent (spalla-review), grading a diff it did not author, told to build a
      control tree and RUN the new tests rather than read their docstrings. Returned BLOCK with
      two blockers, both reproduced independently before being accepted, both CURED in this PR.

seat_diversity: satisfied
seat_diversity_note: >-
  One build lane, so D3's non-Anthropic BUILD-seat requirement does not apply by its own terms
  (">= 2 build lanes"); no second build lane was invented to satisfy a rule that does not bind.
  Cross-family adversarial pressure is present where it is load-bearing — on REVIEW: codex
  gpt-5.6-sol refuted the draft and its findings are the reason this PR contains a behavioural
  test at all. A kimi-code/k3 refuter was attempted first and is NOT counted: it exited 0 while
  carrying a 403 weekly-limit error in its output, which is a non-judgement, not a clean one.

diff:
  files: 25
  net_lines: 645
  measured_at: >-
    counted with `git diff --numstat <merge-base>...HEAD` (three-dot: two-dot on this branch
    accuses it of deleting main's later additions, W102) immediately before this commit. Above the
    ~400 net-line guideline by 25 lines and deliberately so: the alternative is three PRs that have
    been mutually blocked for nine days, which is the cost the guideline exists to avoid.

residual_risks:
  - >-
    test_team_slot_is_not_spent_when_an_earlier_max_seat_succeeds passes VACUOUSLY against a
    wrapper that has no slot 6 at all — measured, not suspected. It is kept because it pins a
    future regression that the other test cannot see (a slot-6 branch spliced in at the wrong
    point in the loop is CALLED, just too early), and its docstring says plainly that its
    anti-vacuity control is the sibling test in the same file. The pair is the guard.
  - >-
    The shell reads a token with `[ -n "$token" ]` while the two Python consumers read it with
    `.strip()`, so a token carrying a trailing newline is USED by Python (normalised) and FAILS
    auth under the shell (passed through raw) — the same slot, two verdicts, family #9. Measured
    NOT live today (0 of 6 slots carry leading/trailing whitespace), and it predates slot 6 for
    slots 1-5, so it is specced rather than cured here: curing it inside this PR would change
    behaviour on five slots this PR does not otherwise touch.
  - >-
    This branch's base is behind origin/main. A guard merged to main after that base stays INERT
    on this PR until the branch is synced, so `gh pr update-branch` is part of opening it, not a
    follow-up.

pii_scan: clean

dissent:
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: >-
      "The Team token is still sitting in slot 5, so the remap never took effect." Checked by
      hashing both slots' values and comparing the hashes, never the values: they differ. The
      objection is not realised and no change was made for it.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      "The shell tests the token with `[ -n "$token" ]` while the two Python consumers read it
      with `.strip()`, so the same slot gets two verdicts." Confirmed as a real defect: a token
      carrying a trailing newline is normalised and USED by Python, and passed through raw and
      FAILED by the shell. Deliberately NOT cured in this PR — it predates slot 6 on slots 1-5
      and was measured not-live (0 of 6 slots carry leading or trailing whitespace), so curing it
      here would change behaviour on five slots this PR does not otherwise touch. The
      disagreement with the refuter is about SCOPE, not about the defect; carried in
      residual_risks.
  - seat: claude-sonnet-5 (independent grader)
    status: CONFIRMED
    objection: >-
      "test_claude_oauth_slot6_coverage.py is named by ZERO pull_request-triggered workflows, so
      the 259-line proof that all 16 consumers reach slot 6 has no standing CI enforcement."
      Reproduced: `grep -rln` across .github/workflows/ returned NOTHING — not even the sweep,
      which would not have counted anyway (schedule-triggered, continue-on-error). The PR that
      exists to close an enforcement gap had reproduced it for its own artifact. CURED.
  - seat: claude-sonnet-5 (independent grader)
    status: CONFIRMED
    objection: >-
      "test_vision_circuit_breaker.py breaks when CLAUDE_CODE_OAUTH_TOKEN_6 is set, which it is on
      every fleet machine." Reproduced exactly: 2 failed / 5 passed with the slot present, 7
      passed after the fix. Green on a clean runner, red on the machines that actually run it.
      CURED.
  - seat: claude-opus-5 (session, own hypothesis)
    status: RETRACTED
    objection: >-
      While checking the grader's second finding the session suspected the SAME ambient leak in
      test_wr3_dispatch_v2_oauth_fleet.py, on the strength of three `range(1, 6)` occurrences.
      Not realised: run WITH and WITHOUT the slot in the environment, 8 passed both ways. The grep
      had matched fixture ranges, not the isolation helper — the instrument answered a
      neighbouring question, and the positive control is what caught it.
  - seat: claude-opus-5 (session, self-refutation)
    status: CONFIRMED
    objection: >-
      One of the two tests this PR adds passes VACUOUSLY against a wrapper with no slot 6 —
      measured in a control tree, not suspected. Kept deliberately, because it pins a regression
      its sibling cannot see (a slot-6 branch spliced in at the wrong point is called, just too
      early), and its own docstring records the vacuity so no later reader mistakes it for proof.

