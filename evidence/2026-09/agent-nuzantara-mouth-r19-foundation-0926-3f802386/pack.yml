dissent:
  - seat: kimi-code/k3
    verdict: INERT
    objection: >-
      Nits only. The default NavShell class string gains a trailing space, and four @font-face rules in files
      nothing imports declare new family names (R19 Fraunces, R19 Manrope, R19 Home Fraunces, R19 Home Manrope).
    status: CONFIRMED
    disposition: >-
      Both are real and neither changes rendering: the new family names collide with no existing family
      (the portal declares the unprefixed Fraunces and Manrope), and the unimported files never reach a bundle.
      Accepted, ships as is.
  - seat: tp1-qwen3.8-max
    verdict: INERT
    objection: >-
      NavShell.tsx imports NavShell.module.css unconditionally and packages/core/index.ts re-exports NavShell,
      so the dead .paper rules ship in the CSS of every page that loads NavShell: bytes go up, rendering does not.
    status: CONFIRMED
    disposition: >-
      Measured on the build output: one 2569-byte chunk carries about 1632 bytes of paper rules uncompressed.
      Accepted as the cost of a scoped CSS module; the alternative is inline style objects, which is a larger
      change to a shared component.
  - seat: tp1-glm-5.2
    verdict: INCONCLUSIVE
    objection: >-
      A page-local --r19-paper (login-upgraded, value f7f4ee) could cascade into a RUMAH_VARS consumer rendered
      inside that scope and flip --surface-base from f7f6f2.
    status: RETRACTED
    disposition: >-
      Falsified by command. RUMAH_VARS, merahPutihDay and NavShell appear nowhere under apps/mouth/src/app/portal
      and not in app/layout.tsx or app/portal/layout.tsx, so --surface-base is never declared inside that scope.
  - seat: tp1-glm-5.2
    verdict: INCONCLUSIVE
    objection: >-
      The data-nav-* attributes are added unconditionally, so a pre-existing global selector on those names
      would now match.
    status: RETRACTED
    disposition: >-
      Falsified by command. grep for data-nav in css, ts and tsx under apps/mouth/src, packages and
      apps/mouth/e2e finds nothing outside NavShell.tsx, NavShell.module.css and the NavShell unit test.
  - seat: tp1-glm-5.2
    verdict: INCONCLUSIVE
    objection: >-
      One R19Presentation test is it.skip, so the activation PR inherits a known-skipped test and a MobileNav
      defect.
    status: CONFIRMED
    disposition: >-
      The skip is real and is documented in the test and in the brief. It is not a defect: MobileNav's
      non-R19 behaviour is the current product, and the drawer theming it would assert belongs to the activation
      unit, which un-skips it.
  - seat: codex-gpt-5.6-sol
    verdict: NONE
    objection: >-
      No review was produced: the workspace is out of credits. The Gear-3 council therefore has two titolari
      plus one reserve rather than the three titolari.
    status: PLAUSIBLE
    disposition: >-
      Recorded rather than hidden; see seat_fallback_reason. Nothing in the diff was left unread by a seat that
      answered.
residual_risks:
  - >-
    next build was run once, by the conducting session, on the tree before the rebase and before the NavShell
    test commit. CI runs it again on the real merge candidate.
  - >-
    Tailwind v4 scans every source file automatically, so the new r19 files are new inputs to utility
    generation. No review seat and no local run measured a change in the global CSS output; the CI build is the
    first place it would show.
  - >-
    D3 seat diversity is not demonstrated (see lanes_note); the external builder seat is unidentified.
