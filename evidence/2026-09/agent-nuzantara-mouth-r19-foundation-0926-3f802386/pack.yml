lanes_note: >-
  D3 (seat diversity among build lanes) is NOT satisfied by naming a non-Anthropic builder, and this pack
  does not pretend otherwise. The r19 code is a byte-copy of a snapshot authored by an external
  prepare-only builder whose seat identity is not recorded anywhere in the snapshot's own evidence (its
  brief.yml, pack.yml, preserved pack.json and brief.md, and the plan documents say only "external
  builder, prepare-only"). That seat is therefore not declared as a lane; the Claude work on this branch
  (integration, one guard cure, one added test, verification) is declared as a single build lane. If the
  external seat is identified, add it as a second build lane.
snapshot_provenance: >-
  apps/mouth/src/components/r19/**, the four R19 font subsets, the R19 image assets, NavShell.module.css,
  the NavShell variant change and the rumahVars aliases are copied byte-for-byte from the read-only snapshot
  worktree .worktrees/mouth-r19-cutover-audit-20260924. Deltas from the snapshot, all inside new files:
  Footer.tsx and destinations.ts import GOOGLE_MAPS_URL from lib/trust-figures instead of redeclaring it
  (the existing trust-figures guard bans a second copy); one R19Presentation test is it.skip because it
  asserts the MobileNav drawer change that belongs to the activation unit; 22 ts and tsx files are
  prettier-formatted for the pre-commit gate.
