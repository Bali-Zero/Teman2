task: >-
  Second unit of the R19 public-site cutover (plan: Pro worktree mouth-r19-cutover-audit-20260924,
  docs/plans/r19-cutover-20260924/PLAN.md §5 step 2 "Dormant foundation"). Land, inert, the R19
  presentation layer prepared by an external prepare-only seat: apps/mouth/src/components/r19/**
  (scoped presentation wrapper, route policy, home sections, journal adapter, tests), the Latin
  Fraunces/Manrope subsets and R19 image assets under public/, an opt-in variant="paper" on
  packages/core NavShell, and var(--r19-*, <old literal>) aliases in rumahVars. Nothing imports
  components/r19 yet, NavShell's default is unchanged, and every alias falls back to the literal
  it replaces, so production renders the same. The visible switch is a later single unit.
