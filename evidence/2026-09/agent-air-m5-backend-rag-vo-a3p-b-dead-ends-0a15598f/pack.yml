  non-empty. This is REFUTED, not cured: backend/services/visa_engine/
  models.py:1550 and :1562 already forbid non-empty review_reasons on
  SUPPORTED_CANDIDATES and NEEDS_INPUT respectively — a Decision CANNOT
  be constructed in either state with a non-empty review_reasons tuple,
  so every decision this branch receives already has review_reasons ==
  () before the branch runs, by the type system''s own construction, not
  by an assumption this function makes. Verified live at this head:
  evaluate() on the 02_business_c2 persona returns SUPPORTED_CANDIDATES
  with review_reasons=(); the same payload with review_reasons forced
  non-empty raises pydantic ValidationError naming exactly
  ''state=SUPPORTED_CANDIDATES forbids missing_facts/review_reasons/
  no_path_reasons''. The same invariant is independently exercised by
  this PR''s own B2 and B3 GUILT runs (see receipts below): mutating the
  branch to keep candidates, or to also fire on HUMAN_REVIEW_REQUIRED
  (a state whose review_reasons is NOT guaranteed empty), both produced
  a pydantic ValidationError — the model itself is the safety net a
  future author cannot silently bypass. No code change made in response
  to either refuter; the code already relies on, and is protected by,
  the invariant they correctly reasoned MIGHT be missing but is in fact
  present one layer down.'
