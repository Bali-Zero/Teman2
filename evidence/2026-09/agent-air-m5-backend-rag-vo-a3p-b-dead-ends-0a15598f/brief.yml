objective: |
  Slice A3'-B of MANDATE-vo.md: ACTIVITY_BOUNDARY leaves the human-review
  hold and becomes a named dead end, DISCLOSED_ACTIVITY_BOUNDARY_NO_PATH,
  instead of forcing HUMAN_REVIEW_REQUIRED. `DEAD_END_DISCLOSED_FLAGS`
  (evaluate_path.py) carves it out of `HOLDING_DISCLOSED_FLAGS` (now
  {CRIMINAL_RECORD} only). On a pack base that reached SUPPORTED_CANDIDATES
  or NEEDS_INPUT, `_apply_disclosed_review_flags` now rewrites the decision
  to NO_SUPPORTED_PATH with only the dead-end reason(s) — there is no pack
  verdict to abstain from once the signed pack cannot decide the applicant's
  activity at all. On a base already at NO_SUPPORTED_PATH the dead-end
  reason is appended after the pack's own. Every other pack state (already
  HUMAN_REVIEW_REQUIRED, TEMPORARILY_UNAVAILABLE), or no dead-end flag at
  all, keeps today's path unchanged. A holding flag (CRIMINAL_RECORD, or
  ACTIVITY_BOUNDARY explicitly restored via the VISA_ORACLE_HOLDING_FLAGS
  kill switch) always wins over the dead-end branch, on any pack state.
  Dead-end decision_id/public_id are reseeded with a "no-path:" prefix so
  they can never collide with the kill-switch hold's id for the same flag.
  `review_hold_inventory.py`'s `split_disclosed_review_codes` becomes a
  3-way partition (holding, dead_end, conditioning). The census
  (test_interview_walk_census.py) derives the FUNNEL state from both sets.
  The mouth's engine-adapter.test.ts gains the one coupled test named in
  the mandate (B8): reads evaluate_path.py's own
  `_DISCLOSED_NO_PATH_REASON_CODES` and proves every value is in both
  `SOURCELESS_NO_PATH_CODES` and `SUPPORT_REASON_COPY` — the mouth's copy
  for this exact code shipped already in A3'-M (#7172), unmoved by this PR
  (verified: replay-no-path-doors.py regenerates a diff only from the
  seq-22->seq-23 pack move, unrelated to activity-boundary/dead-end code;
  restored via `git show HEAD:<path>`, never committed).
