      THE REPAIRED CROSS-CHECK: every file this guard scans is scanned by the
      claims guard too, compared as resolved paths, with the parse proven
      non-vacuous.
    status: verified
    probe: >-
      cd apps/mouth && ../../node_modules/.bin/vitest run
      src/app/visa/voa/voa-i18n.parity.guard.test.tsx -t "scanned by the claims
      guard"
    probe_result: "Tests  1 passed | 36 skipped (37)"
  - text: >-
      GUILT, the exact mutation that exposed round 1: deleting the verdict
      screen from the claims guard's SCREEN_FILES SHALL report exactly
      [hash]/page.tsx - and the control asserts the mutation bit first.
    status: verified
    probe: >-
      cd apps/mouth && ../../node_modules/.bin/vitest run
      src/app/visa/voa/voa-i18n.parity.guard.test.tsx -t "dropping the verdict
      screen"
    probe_result: "Tests  1 passed | 36 skipped (37)"
  - text: >-
      GUILT, the other direction: repointing the DECLINE hop at another
      filename SHALL report exactly the decline entry, so the out-of-tree case
      is convicted too and not merely tolerated.
    status: verified
    probe: >-
      cd apps/mouth && ../../node_modules/.bin/vitest run
      src/app/visa/voa/voa-i18n.parity.guard.test.tsx -t "dropping the DECLINE
      table"
    probe_result: "Tests  1 passed | 36 skipped (37)"
  - text: >-
      THE SAME MUTATION ON DISK, not only synthetically: with "[hash]/page.tsx"
      really deleted from voa-copy.guard.test.ts, the cross-check FAILS.
    status: verified
    probe: >-
      remove the line from the real file, run the cross-check, restore from a
      cp backup (never git checkout - it would wipe the uncommitted cure)
    probe_result: >-
      "AssertionError: expected [ '[hash]/page.tsx' ] to deeply equal []" ·
      Tests 1 failed | 36 skipped (37) · file restored, git status clean
  - text: >-
      WHEN the verdict screen renders a DECLINE under ?lang=id, THEN the
      education SHALL be Indonesian and the English sentence SHALL be absent.
    status: verified
    probe: >-
      cd apps/mouth && ../../node_modules/.bin/vitest run
      src/app/visa/voa/voa-i18n.parity.guard.test.tsx -t "DECLINE education
      reaches the screen"
    probe_result: "Tests  1 passed | 36 skipped (37)"
  - text: NO REGRESSION across the funnel, the decline table and the site i18n layer.
    status: verified
    probe: >-
      cd apps/mouth && ../../node_modules/.bin/vitest run src/app/visa/voa/
      src/components/garuda/ src/i18n/
    probe_result: "Test Files 34 passed (34) · Tests 604 passed | 2 skipped (606)"
  - text: >-
      A REASON CODE WITHOUT COPY IS A BUILD ERROR, the property the deleted
      switch carried.
    status: verified
    probe: cd apps/mouth && npx tsc --noEmit
    probe_result: "exit 0 (also re-run green by the pre-commit typecheck hook)"
  - text: >-
      PROOF-OF-LIVE, owed after the merge: a DECLINE verdict read at ?lang=id on
      production SHALL show the Indonesian education. Observed after
      vercel promote <dpl>, never before.
    status: pending
    probe: >-
      vercel promote <dpl> && a synthetic DECLINE check (purpose=transit) read
      at /visa/voa/<id>?lang=id shows "Visa on Arrival tidak mencakup tujuan
      perjalanan tersebut."
pii: none
local_evidence: >-
  No production read, no client data, no credential touched. Every probe is
  unit-level under jsdom; the DECLINE render stubs global fetch with an invented
  payload and a synthetic hash. The reason codes are the contract's own closed
  enum, not a customer's case.
self_report:
  note: >-
    Every probe was run against this PR's own head in this session with its
    selected-test count pasted next to it. This is a SUCCESSOR, not a retry in
    place: #6969 was armed and therefore frozen, so it was closed and the work
    cherry-picked onto fresh origin/main with the repair on top. Round 1's gate
    verdict is reproduced in the constraints above rather than summarised away.
    The Indonesian wording is this session's translation, checked mechanically
    against both guards' regexes but not native-reviewed - named here rather
    than left implied.
