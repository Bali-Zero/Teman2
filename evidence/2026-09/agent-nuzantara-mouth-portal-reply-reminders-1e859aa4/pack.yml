dissent:
  - seat: claude-opus-5-5 xhigh
    objection:
      Automatic inbound profile events created reply obligations; expired leases
      could exceed the provider-attempt budget; ambiguous acceptance was recorded failed.
    status: CONFIRMED
    resolution:
      Explicit source marker and verified legacy sentinel exclusion; three-attempt
      limit plus lease fencing; distinct rejected versus uncertain outcomes, with regression
      tests.
  - seat: claude-opus-5-5 xhigh
    objection:
      Suggested returning an unread-only successful payload after a pending-query
      failure.
    status: PLAUSIBLE
    resolution:
      "Rejected after a concrete counterexample: zero unread would erase a
      cached unanswered reminder. The spec now requires the failed poll to retain cached
      pending data and visible retry; backend failure and frontend cached-error tests
      verify this."
  - seat: codex-gpt-5.6-sol
    objection:
      Rolling deployment can retain old automatic writers; stale never-attempted
      jobs and non-sticky uncertainty need explicit operational limits.
    status: CONFIRMED
    resolution:
      "Spec bounds historical and rolling provenance; release waits for all
      producer replacement and checks queue age. Follow-up issue #7304 covers operational
      delivery limits. No P0/P1."
  - seat: kimi-code/k3
    objection:
      Initial static diff-only review requested rework on historical provenance
      and speculative UI/writer details.
    status: PLAUSIBLE
    resolution:
      Preserved original report and supplied full source, frozen contract
      and actual preflight facts. Actual follow-up withdrew blocking objections and
      found no P1/P2 against the bounded contract. Remaining P3 observations concern
      smooth scrolling, thread badge lag and telemetry; no new runtime edits.
