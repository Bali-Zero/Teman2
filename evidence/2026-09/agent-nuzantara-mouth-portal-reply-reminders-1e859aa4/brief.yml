objective:
  Keep a team reminder until a manual reply is saved, and durably queue one
  generic client email per manual team message.
acceptance:
  - Reading never discharges a reply obligation.
  - Automatic profile and other notices do not open or close reply obligations.
  - A successful manual reply clears earlier client messages; a subsequent client message
    reopens the reminder.
  - Assigned-client access remains unchanged; failed polls preserve cached pending alerts.
  - Manual message and unique email outbox row commit atomically.
  - Provider I/O is bounded to three attempts; ambiguity remains uncertain, never falsely
    sent.
  - Client unread banner remains; subtle pulse respects reduced motion.
consumer_map:
  - Workspace header and client conversation reply form
  - Dedicated portal email consumer through the existing internal Brevo adapter
constraints:
  - No real client data or test emails
  - External builder prepares; independent fresh BLUE gate; Claude release owner only
  - Preserve existing unread API fields and assignment policy
  - No historical source guessing
