dissent:
  - seat: gpt-5.6-sol
    objection: >-
      (O2, PARTIAL) F6 — after the confirming read, a supersession
      committing between that read and the return still lets the previous
      row's bytes be emitted; the loop is bounded but two deliberately
      timed supersessions produce a 404 while a live row exists.
    status: CONFIRMED
    disposition: >-
      Imperator decision #20 (2026-09-12), strada (a). NOT cured, and the
      docstring says so rather than implying closure: a non-blocking read
      can promise the bytes were the live row at an instant inside the
      request, never that they still are on arrival — a lock held across
      the object-store fetch would only move the window to its release.
      What the confirming read buys is that bytes KNOWN to be retired are
      never emitted. Serializing reads against corrections was declined
      because it holds a database transaction open during network I/O and
      lets one slow download block every correction on the same practice.
      Ledgered as a PENDING-ARMS row: the cure is observability (the
      customer GET naming the digest it served), which is a response header
      and therefore belongs to the contract PR at rebase. NOTE: F6 lives in
      `services/garuda_artifacts/service.py`, which is NOT in this PR — it
      ships in S5. Recorded here because the review round that raised it
      also judged this migration.
  - seat: gpt-5.6-sol
    objection: >-
      (O3) The PASS verdict on the NEW1/NEW2 delta is static analysis: the
      seat states it could not run pytest under its read-only sandbox.
    status: CONFIRMED
    disposition: >-
      Correct and expected for a read-only refuter, and not restated as an
      executed proof. The executed evidence for this PR is the build seat's
      own runs recorded under `receipts` and `guilt_mutations`, not Sol's
      verdict.
  - seat: gpt-5.6-sol
    objection: >-
      (O4, MAJOR) Migration 313's SECURITY DEFINER binder
      `public.bind_garuda_practice_artifact_retention_policy()` is absent
      from operational_preflight's RETENTION_BINDING_TRIGGER_FUNCTIONS and
      from the test file's independent CANONICAL_SENSITIVE_FUNCTIONS. The
      class-level catalog census checks only ownership; the named checks
      that would catch an improper EXECUTE grant, or the function being
      absent entirely, are list-driven and this list was never told the
      function exists.
    status: CONFIRMED
    disposition: >-
      CURED in this PR — acceptance A8, receipt A8, guilt mutation
      measured. Verified independently before curing: the list really did
      omit it, and the comment sitting directly above the entries says
      "leaving it out is how this blind spot reopens", naming migration
      285's weeks of 500s as the cost. Registering 313's binder is one line
      in each of the two inventories and the fake derives its owner map
      from the module list, so nothing else moved.
  - seat: gpt-5.6-sol
    objection: >-
      (O4, MAJOR) `restore_garuda_voa_retention_fk` re-applies every
      registered entry it finds ABSENT, and `unwind` returns only an
      aggregate bool — so on a database where 264 and the earlier
      dependents are applied but 313 is not, the unwind/restore pair hands
      back a database carrying 313 though it was never live going in. The
      existing regression test proves "do not re-apply an entry still
      present", not "do not introduce an entry that was absent".
    status: CONFIRMED
    disposition: >-
      NOT cured here, and the objection is correct on both counts —
      verified by reading the pair: `restore`'s own docstring claims it
      "puts back exactly what unwind actually took away, no more, no less",
      and an absence probe cannot distinguish "absent because unwind
      removed it" from "absent because it was never there", so the
      docstring overstates the property the code has. This is a PRE-EXISTING
      defect of the 2026-08-25 mechanism, identical for all five registered
      entries; this PR's one-line registration exposes it on a sixth, it
      does not introduce it. Curing it means changing `unwind`'s return
      contract to name which entries it took — a change to another
      product's fixture machinery, outside this PR's concern, and a
      fix-of-a-fix on a mechanism already corrected once. Ledgered as a
      PENDING-ARMS row with the reproduction Sol supplied. On the shape this
      PR is measured against, `apply-all` applies every migration, so the
      skewed starting state does not arise there — which is exactly why no
      test catches it.
  - seat: claude-opus-5
    objection: >-
      (gate-6287c, BLOCK, on head 39f2e1d9cb) This file's fixture closed the
      TEST/GARUDA_DOCUMENT policy at teardown but could not delete it
      (append-only guard, 264), so 15 rows survived the file; every
      visa_engine file that then called unwind_garuda_voa_retention_fk on
      the same database ran 304's rollback, which re-narrows the
      policy_scope CHECK, and Postgres refused it. CI was green only because
      xdist --dist loadfile put this file and those on different clones.
    status: CONFIRMED
    disposition: >-
      CURED (A9): the policy is now seeded INSIDE a transaction the fixture
      rolls back, with the seed's lower bound on transaction_timestamp() so
      the binder's `effective_period @> created_at` still resolves under a
      frozen clock; a tripwire compares the row count at exit to the count at
      entry; a reproduction test runs the fixture lifecycle and then the
      real unwind/restore on the same connection. DELETE was tried first and
      refused by the guard — that refusal is why the earlier shape closed
      instead, and the comment now says so.
  - seat: gpt-5.6-sol
    objection: >-
      (O5, MAJOR) The reproduction test is not state-preserving on a shared
      worker database: unwind rolls the whole 281..313 chain back, 281's
      rollback DROPS policy_scope, restore re-adds it with its default, so
      closed GARUDA_ORDER / GARUDA_MAGIC_LINK rows other fixtures left
      behind come back as VISA_DECISION. And restore was not in a
      `finally`, so a failed assertion would leave the next file without
      281..313. The docstring's "leaves this test as it entered" was false.
    status: CONFIRMED
    disposition: >-
      CURED where it is this test's: restore now runs in a `finally`
      (mutation measured — forced failure inside the try, canary after it
      still finds 281 live), and the docstring states what "back" means
      and what it does not. DECLARED where it is the mechanism's: the
      scope-erasing side effect of 281's rollback + restore is a property
