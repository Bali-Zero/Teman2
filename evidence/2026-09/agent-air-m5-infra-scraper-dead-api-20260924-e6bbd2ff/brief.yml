task: >-
  Delete `apps/bali-intel-scraper/api/` (`main.py`, `requirements.txt`): a dead, un-COPYed
  Docker entrypoint — the Dockerfile never copies `api/`, the app actually runs as
  `backend.app.main` (Pro nightly cron `com.balizero.intel.nightly`, `.venv`), and
  `api/main.py` imports a module (`orchestrator`) that exists nowhere in the repo. Also
  delete `apps/bali-intel-scraper/tests/test_api.py` (every test in it targets `api.main`,
  the whole file is `pytest.importorskip("orchestrator", ...)`-skipped and self-documents
  as "Skipped until api/main.py is updated"). A re-verification grep against origin/main
  found one REAL consumer, escalated to the conductor mid-task and ruled on (option a,
  widen scope): `apps/backend-rag/backend/tests/unit/routers/test_intel_path_injection_guards.py`
  carried a class, `TestScraperApiArticleIdRoutes`, that read `api/main.py` from disk and
  AST-walked its 5 routes to pin the path-injection guards CodeQL alert #370 (on
  `api/main.py:680`) is about. That class (and its `scraper_api_source` fixture, and the
  `ast`/`re` imports it alone used) is removed in the same diff — deleting the file removes
  the attack surface the pin protected, so the pin has nothing left to protect. The two
  OTHER sinks this test file guards (`intel.upload_cover_image`, `intel_scraper._publish_staging_item`)
  are untouched, still pinned by `TestCoverUploadRoute`/`TestPublishStagingItem` in the
  same file. `docs/operations/LOCAL_TESTING_GUIDE.md` is corrected in the same diff — it
  told a reader to `uvicorn api.main:app`; that instruction is replaced with how the app
  actually runs, minimal edit, rest of the doc's pre-existing staleness left alone
  (out of scope).
