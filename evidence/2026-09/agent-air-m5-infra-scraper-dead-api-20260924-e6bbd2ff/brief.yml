acceptance:
  A1: >-
    No real consumer of `apps/bali-intel-scraper/api/` remains outside this diff. A
    re-verification grep against origin/main after the escalation found exactly one real
    consumer (the AST-pin test class) and it is removed in this same diff; every other hit
    is ledger prose, archived docs, or frozen historical evidence/CodeQL-snapshot artifacts
    that reference the old path without executing it.
    probe: >-
      git grep -nE "bali-intel-scraper/api|from api\.|import api\b|api\.main|api/main"
      origin/main -- . ':!apps/bali-intel-scraper/api/**'
  A2: >-
    `apps/bali-intel-scraper`'s own pytest suite is unchanged before/after except the
    skip count dropping by exactly 1 (the deleted, already-skipped test_api.py module);
    the 4 pre-existing cell_core collection errors are untouched.
    probe: >-
      cd apps/bali-intel-scraper && <throwaway venv>/bin/python -m pytest -q
      --continue-on-collection-errors
  A3: >-
    `apps/backend-rag/backend/tests/unit/routers/test_intel_path_injection_guards.py`
    still collects and passes after `TestScraperApiArticleIdRoutes` is removed; test
    count drops from 18 to 11 (exactly the 7 removed: 5 parametrized route tests + 2
    regex/length-bound tests), zero failures, zero new errors. The two sinks the
    docstring claims stay pinned (`TestCoverUploadRoute` line ~149,
    `TestPublishStagingItem` line ~230) are untouched by this diff and their tests are
    part of the 11 that still pass.
    probe: >-
      cd apps/backend-rag && ./.venv/bin/python -m pytest
      backend/tests/unit/routers/test_intel_path_injection_guards.py
  A4: >-
    docs/operations/LOCAL_TESTING_GUIDE.md no longer instructs a reader to run the
    deleted `api.main:app`; Terminal 2 now runs `backend.app.main` with a note on how
    the app actually runs in prod.
    probe: >-
      grep -n "api.main" docs/operations/LOCAL_TESTING_GUIDE.md
      # expect: no match (only "backend.app.main" remains)

