  `seat_fallback_reason` below.
  .
  Recorded plainly because it is the lesson of this pack: the reserve seat
  reviewed the same eleven rules and returned "no blocking finding", having
  checked that the exclusion fires only on an explicit false — without asking
  whether, for these two products, that false is the NORMAL answer rather
