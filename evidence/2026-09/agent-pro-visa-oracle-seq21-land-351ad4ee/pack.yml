dissent:
  - seat: codex-gpt-5.6-sol (titolare, second narrowed pass)
    status: CONFIRMED
    objection: >-
      A SECOND product carries the same defect as E23V, and it was found only
      because the titolare seat was re-dispatched after its first pass rolled
      over. hf.employment-without-indonesian-sponsor names three products —
      E23, E23V and E33B. E33B is the government-collaboration product whose
      catalogue sponsor_types is ["NONE"]: a genuine applicant has no
      Indonesian employer sponsoring them, which is precisely the condition
      the filter excludes on. Verbatim verdict: "E33B — YES; genuine
      sponsor.type=NONE collaboration with employer=false is excluded by
      hf.employment-without-indonesian-sponsor." So of the nine products this
      pack newly supports, TWO are cancelled by its own new hard filter on the
      answer their real applicant would give, and seven are clean. This is
      recorded as CONFIRMED on the reviewer's reasoning; unlike E23V it has
      NOT yet been reproduced by a direct engine measurement in this session,
      and the seq-22 cure treats it as requiring that measurement before the
      product is dropped from the filter — the same standard E23V was held to,
      not a weaker one. It does not change the merge decision (the bundle is
      inert until activation) and it does reinforce the withheld activation.
  - seat: cross-session measurement, this worktree lineage (origin lead from codex-gpt-5.6-sol's first-pass checkpoint)
    status: CONFIRMED
    objection: >-
      seq-21 adds el.e23v.trade-office (SUPPORT: EMPLOYMENT +
      sponsor.type==GOVERNMENT + sponsor.trade_office==true) to make E23V
      answerable, and in the SAME pack adds
      hf.employment-without-indonesian-sponsor (EXCLUDE on E23/E23V/E33B:
      EMPLOYMENT + work.employer_is_indonesian_entity==false). E23V is the
      visa for someone employed by a FOREIGN trade office, whose employer
      is BY DEFINITION not an Indonesian entity — so the honest answer on
      that branch excludes the applicant from the very product the new
      rule was added to enable. Measured against the signed pack: employer
      UNKNOWN -> SUPPORTED_CANDIDATES [E23V]; employer FALSE -> E23V
      EXCLUDED (reason PAID_ACTIVITY_WITHOUT_INDONESIAN_SPONSOR, rule
      hf.employment-without-indonesian-sponsor); employer TRUE ->
      SUPPORTED_CANDIDATES [E23V]. REACHABLE: flow.ts:1070-1073 and 634-647
      put work_payer (tree.ts:607-623, mapped to
      work.employer_is_indonesian_entity) on the work branch after
      sponsor_category=GOVERNMENT -> sponsor_trade_office. The walk corpus
      covers that path (offshore/work/sponsor_government/trade_office_only.json)
      but pins employer=true, so no existing test sees the defect.
      WHY MERGING IS STILL CORRECT: the engine loads its ACTIVE pack from
      the visa_ruleset_activations DB table (repository.py:185-228,
      load_active_rule_pack), NOT from the filesystem — merging this
      bundle does NOT change what any production visitor sees. Activation
      is a separate ceremony and is deliberately NOT performed here.
      seq-21's activation stays withheld until E23V is cured in seq-22
      (planned fix: fold_pack_seq21.py:337
      EMPLOYMENT_SPONSOR_PRODUCT_CODES drops 'E23V', the same deliberate
      exclusion already documented for E23U in
      test_e23u_is_deliberately_outside_the_employment_exclusion, plus the
      missing corpus walk that answers "no").
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      This pack's council_run quorum rests on ONE seat completing with
      ok:true — agy-gemini-3.1-pro, a RESERVE — because codex-gpt-5.6-sol
      (the TITOLARE seat convened for this review) hit a context rollover
      before delivering a formal report on its first pass, recorded here
      honestly as ok:false. That seat's own pre-rollover checkpoint is what
      first named the E23V risk the direct measurement above then
      CONFIRMED, so the finding is real even though the formal review that
      produced the lead is incomplete. A second, narrower codex pass was
      reported in flight; its result is not reproduced in this pack because
      it was not available when this pack was written, and recording a
      verdict for a run this session never saw would be exactly the
      hallucination this repo's own anti-hallucination discipline forbids.
      The quorum shortfall is stated for both the linter (seat_override
      above) and a human reader (here) rather than papered over.
  - seat: claude-sonnet-5 (this worktree session), self-caught
    status: PLAUSIBLE
    objection: >-
      This pack declares one build lane and no independent `role: review`
      lane in `lanes:` (the council's two review attempts live in
      journal.jsonl instead, per R9's own contract). The diff this pack
      describes has therefore been read by its builder (claude-opus-5),
      one reserve council seat that completed (agy-gemini-3.1-pro), and one
      titolare council seat whose review did not complete
      (codex-gpt-5.6-sol) — a real, stated limit on independent coverage,
      not a claim of a fuller review than actually happened.
