  PR used for its own R8 override. A fresh NB/ground-truth lane here would
  re-litigate #6466/#6479's own reviewed content, not measure this diff.
  .
  R9 council_run: quorum IS met — two DISTINCT seats completed with
  `ok:true`, and this override is kept only because ONE of them is a reserve.
  codex-gpt-5.6-sol (TITOLARE) rolled over on its first pass without a formal
  verdict; it was re-dispatched with a narrowed scope and completed normally
