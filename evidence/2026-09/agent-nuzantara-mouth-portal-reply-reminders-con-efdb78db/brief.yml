  - Manual message and unique email outbox row commit atomically.
  - Provider I/O is bounded to three attempts; ambiguity remains uncertain, never falsely sent.
  - Client unread banner remains; subtle pulse respects reduced motion.
  - A fresh CI database bootstraps the canonical legacy portal_messages table before migrations_v2/321; full apply-all and repeated bootstrap succeed without weakening production migration checks.
  - Canonical OpenAPI generation updates schema.d.ts and its drift pin; the previously failing pin test, Visa Oracle contract validation and mouth typecheck pass without changing runtime code or weakening the guard.
