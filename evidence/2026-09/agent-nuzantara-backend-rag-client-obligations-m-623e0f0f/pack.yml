dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      (MEDIUM) Rollback prose named only the future PR A2 bridge as a
      pre-condition for reverting the table, omitting that
      obligations_repository.py (this table's actual, already-merged
      consumer, PR #6122) is itself live and would start raising
      UndefinedTableError the moment the table is dropped out from under it.
    status: CONFIRMED
    disposition: >-
      Fixed. Rollback section rewritten to name obligations_repository.py
      explicitly as the pre-condition to undeploy/disable first, keeping the
      PR A2 condition as a second, later-arriving one.
  - seat: codex-gpt-5.6-sol
    objection: >-
      (LOW) The column-coverage test's regex counted declarations inside
      /* ... */ SQL block comments, so a column commented out that way would
      still count as "declared".
    status: CONFIRMED
    disposition: >-
      Fixed. The test now strips /* ... */ block comments from the CREATE
      TABLE statement text before running the column-presence regex.
      (The actual migration file uses only `--` line comments, so this was
      latent, not live — fixed anyway since it is cheap and the finding is
      correct about the test's own logic.)
  - seat: codex-gpt-5.6-sol
    objection: >-
      (LOW) Both migration tests skip outright when 309_client_obligations.sql
      is absent, so an accidental deletion of the file would silently return
      to the pre-existing skip state rather than failing loudly.
    status: CONFIRMED
    disposition: >-
      No code change. This is the repo-wide `skipif(not MIGRATION.exists())`
      convention already used for every deferred-migration test in this
      codebase (this file's own two tests were already shaped this way
      before this PR); changing it here would be inconsistent with every
      sibling and is out of scope for a single migration PR.
  - seat: kimi-code/k3
    objection: >-
      (MEDIUM) The column-coverage test validated column NAMES only — a
      `status TEXT NOT NULL` with no `DEFAULT 'proposed'` (breaking the
      upsert, which never writes status) or a `due_date TEXT` (breaking the
      `$4::date[]` unnest binding) would still pass it.
    status: CONFIRMED
    disposition: >-
      Fixed. Added two literal assertions to
      test_migration_309_shape_and_rollback pinning
      `status TEXT NOT NULL DEFAULT 'proposed'` and `due_date DATE NOT NULL`
      verbatim, closing exactly the two failure modes named.
  - seat: kimi-code/k3
    objection: >-
      (LOW) The migration header's claim that the DB "enforces [the
      transition] as an atomic compare-and-swap" could be read as claiming
      DB-level enforcement of the full proposed->approved->alerted->done
      lifecycle, when set_status() only reaches approved/rejected (0 rows
      returned once past 'proposed'; alerted/done are written by the future
      PR A2 bridge with its own SQL, outside this repository class).
    status: PLAUSIBLE
    disposition: >-
      No code change. Re-read the actual header sentence: it scopes the
      enforcement claim explicitly to "the proposed -> approved|rejected
      transition guard", never claims to cover alerted/done. Verified
      precisely scoped as written; the ambiguity the seat flagged is not
      present in the actual text.
  - seat: kimi-code/k3
    objection: >-
      (LOW) No index on alert_id; a future alert-id lookup would seq-scan.
    status: PLAUSIBLE
    disposition: >-
      No code change — the seat itself flagged this as speculative. No
      query in obligations_repository.py or the PR #6122 body looks up by
      alert_id; PR A2 (not yet written) is the first plausible caller, and
      can add the index then if it needs it.
  - seat: kimi-code/k3
    objection: >-
      (LOW) The rollback prose lists removing the index, then the table,
      though dropping the table removes both — mildly redundant.
    status: CONFIRMED
    disposition: >-
      No code change. This phrasing matches 259_e33_case_lifecycle.sql's
      literal DROP INDEX-then-DROP TABLE ordering and
      270_wa_broker_jobs.sql's identical prose pattern verbatim — kept for
      consistency with both precedents rather than being the one migration
      that describes the inverse differently.

bites:
  consumer: >-
    services/compliance/obligations_repository.py (ObligationsRepository),
    already merged (PR #6122) and importing this table's schema at every
    call; the future reviewer-queue API and compliance_alerts bridge (PR A2)
    are the next consumers.
  where: >-
    production — Fly Postgres primary, once merging this PR triggers
    fly-deploy.yml's release_command migration (this migration ships no
    seed data and no caller is wired to the register/repository yet, so
    there is no traffic to observe pre-A2; the correct proof is schema
    presence, not read/write volume).
  observe: >-
    `fly ssh console -a nuzantara-postgres -C "psql -U postgres -h
    /run/postgresql -p 5433 -d nuzantara_rag -Atc \"SELECT to_regclass('public.client_obligations')\""`
  expect: >-
    Returns `client_obligations` (not NULL) immediately after the release
    step, proving the table exists before any A2 traffic depends on it.
