dissent:
  - seat: "kimi-code/k3 (refuter) vs claude-opus-5 (author)"
    status: CONFIRMED
    objection: >-
      The widened anchor's tail `(?:\s*—\s*NOTE:[\s\S]*)?` accepted ANY "— NOTE:" suffix, so a
      note that carried a real cause after the phrase would have been withheld. Harmless on the
      shipped data (98 NOTE records, two boilerplate openings, the only blocked+located one is
      60311) but a latent over-match. CONFIRMED; folded in 49aabee2ae — the tail is admitted
      only under the two generator openings, with a guilt test for the second opening and an
      innocence test for a NOTE naming a statute; old and new regex match the same 999 records.
  - seat: "kimi-code/k3 (refuter) vs claude-opus-5 (author)"
    status: CONFIRMED
    objection: >-
      Comment count drift: "on 50 pages" where 51 records carry the two new shapes (50 "(verify
      per address)" + 60311). CONFIRMED, folded in the same commit. The pre-existing "68
      TERTUTUP" census at kbli-bali-block.ts:93 (live count 72) is a dated census of an earlier
      catalogue and is left as archaeology — not this PR's concern.
  - seat: "kimi-code/k3 (refuter) vs claude-opus-5 (author)"
    status: PLAUSIBLE
    objection: >-
      Compiler defense-in-depth, three LOWs: (1) the spec's per-item `judul` is documentation
      only — never compared to the record's title (the population bisection catches a wrong
      CODE, not a wrong judul on a right code); (2) the idempotent re-run validates only
      pma_official_basis on already-located records, not kondisi/vintage/cap_verified; (3) the
      dry-run `already` counter subtracts population refusals and can go negative. None can
      write a wrong basis today. Accepted as residual: declared follow-ups for the compiler's
      next spec (the residual Pasal 3(1)(d) lots), not folded into a data PR under council.
  - seat: "kimi-code/k3 (refuter) vs claude-opus-5 (author)"
    status: PLAUSIBLE
    objection: >-
      Legal substance, not a defect: the Pasal 2(1)(b)/2(3) attribution for the 21 title-leg
      codes (86101/86104 government hospitals, 91211 museums, 59111 film production …) is a
      reading — Pasal 2(3)'s enumeration is narrower than "anything the state runs". The basis
      strings say "title-derived: no instrument maps the 5-digit code" and the spec's
      what_this_rests_on_and_does_not_prove says it is a reading. Kept PLAUSIBLE so the owner
      sees the reading stands behind all 54, not only the prefix-84 block; verdicts on these
      codes were TERTUTUP/0 before this PR and are unchanged by it.
  - seat: "codex-gpt-5.6-sol (refuter, round 2) vs claude-opus-5 (author)"
    status: CONFIRMED
    objection: >-
      BLOCKER: "government_activity promotes a title deduction to a whole-code statutory
      certification without proving applicability — Pasal 2(1)(b)/2(3) concerns activities
      exclusive to the central government; the compiler checks prefix/title only; 'title-derived'
      honestly declares the missing mapping but does not justify cap_verified=true; 86101 moves
      publicly from unverified to closed/0/verified. The finding is about certification, not a
      claim that these codes are open." CONFIRMED as a description of what the diff does — and
      that is exactly the Legge 5 question put to the owner before the build (2026-09-18: "per
      1b e classe 2 (57 codici) propongo `located` con basis che dichiara esplicitamente la
      derivazione per titolo … l'alternativa è continuare a dire al cliente che un ospedale
      pubblico è «not yet verified» … Dimmi «located» o «solo 1a»"), answered «located». The
      remedy Codex proposes ("keep the uncertainty in the disclosure") is the «solo 1a» option
      the owner declined. Business decisions stay with the human (Builder Contract §5); the
      diff implements the ruling with the derivation disclosed in every basis string, verdicts
      TERTUTUP/0 unchanged, and the three TERBUKA "Pemerintah" codes excluded. Disposition:
      not folded, not silently dropped — recorded here and in the PR body; tp1-qwen3.8-max,
      asked to adjudicate the same objection independently, called it a product-ruling
      disagreement and not a diff defect. Codex's other two round-2 items (50113 resolution
      correct; 49aabee2ae no regression on 999/999) concur with the author's measurements.
  - seat: "tp1-qwen3.8-max (refuter) vs claude-opus-5 (author)"
    status: PLAUSIBLE
    objection: >-
      Five LOWs, none blocking: (1) the government basis template says "activities of the
      Pemerintah Pusat" while the mechanical leg proves only the title token — the same string
      carries the "title-derived" caveat, so it is never shown without it; (2) pma_kondisi on
      the title-derived classes carries no caveat — checked: the mouth renders `pma.condition`
      only in the TERBATAS answer (conditionClause) and on Perpres slice rows, neither of which
      a TERTUTUP code reaches; (3) the NOTE tail is open-ended after the two openings — by
      design, the openings are the generator's fingerprint; (4) the seam decides on rawReason
      before humanizeInternalEnums — the anchor carries no enum token, declared; (5)
      idempotence checks basis only — same as Kimi's (2), follow-up. Accepted as residual.
  - seat: "codex-gpt-5.6-sol (refuter, round 1) vs claude-opus-5 (author)"
