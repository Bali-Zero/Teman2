dissent:
  - seat: codex-gpt-5.6-sol (LOW, pre-existing, recorded not fixed)
    objection: >-
      "`tr '-' '_'` and sanitize_key are not equivalent: uppercase, dots, spaces, doubled or leading
      hyphens, and `-n` (swallowed by echo) all diverge."
    status: CONFIRMED
    resolution: >-
      "True and pre-existing. Harmless for this defect because key and witness now come from ONE string,
      whatever it is; no live caller produces a divergent name (all 8 are lowercase-hyphen). Switching
      the file side to sanitize_key would rename state files for exactly those inputs — a change with no
      current beneficiary, so not made here."
  - seat: codex-gpt-5.6-sol (LOW, pre-existing, recorded not fixed)
    objection: >-
      "The wrapper's fixed /tmp/cron-locks and pid-liveness check make the corpus's isolation
      probabilistic under SIGKILL plus pid reuse."
    status: CONFIRMED
    resolution: >-
      "Inherited from the wrapper. The corpus suffixes every job name with its own pid, so ordinary
      concurrent runs cannot collide; a stale lock would produce a SKIP, which fails the corpus loudly
      rather than passing it."
  - seat: session (declared limit)
    objection: >-
      "kb-ingest, one of the 8 entries, has not started since 2026-09-10: its path is a symlink to a
      renamed directory. This PR does not touch it."
    status: CONFIRMED
    resolution: >-
      "Out of this scope and surfaced to the owner separately — repointing a live crontab entry is a
      production change with its own proof. This PR's fix reaches kb-ingest automatically the day its
      entry points at the checkout."
