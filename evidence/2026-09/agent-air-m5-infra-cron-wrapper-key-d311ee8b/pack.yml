brief_ref: evidence/brief.yml
plan_ref: >-
  docs/specs/seat-board-drain-v1.md §9 step 2 (merged as #7016). The spec placed this step third; it is
  amended here to run first, because it moves the KEY and no state file (S4.4), so it routes nothing
  new and deletes the mapping table the consumer would otherwise carry.
lanes:
  - lane: cron-wrapper-key
    role: build
    seat: >-
      claude-opus-5 (conducting session — measured the 8 crontab entries and the fly_pg_backup witness on
      Pro, wrote the fix, the corpus, the workflow registration and the spec amendment)
  - lane: cron-wrapper-key-review-sol
    role: review
    seat: >-
      codex-gpt-5.6-sol (read-only sandbox, told to attack; seven findings, three accepted and fixed,
      two pre-existing recorded, two sound)
  - lane: cron-wrapper-key-review-k3
    role: review
    seat: >-
      kimi-code/k3 (told to attack; built four broken wrappers of its own and ran the corpus against
      each; its defects were all in the spec amendment and are fixed)
pii_scan: clean
seat_diversity: satisfied
seat_diversity_note: >-
  Two non-Anthropic review families on the finished diff, neither of which wrote a line of it. Both
  found real defects: codex a test cleanup that could `rm -rf /run` on an mktemp failure and a stub that
  accepted a flag the real gateway rejects; both found the spec amendment contradicting itself.
diff:
  net_lines: >-
    7 files changed, 446 insertions(+), 46 deletions(-) measured by
    `git diff --shortstat $(git merge-base origin/main HEAD)..HEAD`. The production change is one line
    of scripts/cron-wrapper.sh plus its comment; the rest is the corpus, its workflow registration, the
    spec amendment and this evidence.
  behaviour_change: >-
    cron-wrapper.sh alerts under `cron-fail:<name with hyphens replaced by underscores>` instead of the
    raw name. No state file moves. Each of the 7 running jobs restarts its gateway repeat ladder once.
