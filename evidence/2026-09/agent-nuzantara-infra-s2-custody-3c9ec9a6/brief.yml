    status: verified
    probe: python os.listdir classification 15:1xZ — 7 total, 7 regular, 0 symlinks, 0 subdirs, 0 env-shaped
  - text: Every live default-roots finding on Pro before the change is a false positive.
    status: verified
    probe: >-
