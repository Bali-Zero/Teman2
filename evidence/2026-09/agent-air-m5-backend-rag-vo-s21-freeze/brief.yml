  - text: "A2 IF the qualifying conjunct is stripped, the corpus replay SHALL move walks, and sponsor.type NONE alone SHALL never gain E33B"
    probe: "pytest test_seq21_pack.py::TestSponsorTypeAloneIsNotEvidence"
  - text: "A3 WHEN a gold fixture carries a product's qualifying fact the engine SHALL name that product, and IF the fact is unknown it SHALL return NEEDS_INPUT"
    probe: "pytest test_seq21_pack.py::TestTheNineProductsAreReachable"
  - text: "A4 WHEN the 84 walks are replayed at 2026-09-15T12:00Z the three dead ends SHALL carry named causes, states SHALL stay 67/15/2 and no walk SHALL ask intent.requested_product_code"
    probe: "pytest test_seq21_pack.py::TestCensusReplay"
