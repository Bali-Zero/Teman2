  - The nine review.* rules are never flipped to NO_EFFECT (fail-open).
  - No figure invented - the E28 rules turn on a declared boolean and cite the source record.
  - No client PII; no credential value anywhere; never sign or activate; never edit PENDING-ARMS.md.
