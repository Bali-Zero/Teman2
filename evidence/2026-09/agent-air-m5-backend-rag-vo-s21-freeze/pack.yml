  - id: D-gear
    decision: >-
      Gear 3. Floor measured with evidence_pack_lint.py --print-floor --print-floor-source on the
      merge-base diff: 3, source "size" (16,127 added / 49 deleted lines at 960af4acbb, dominated by the
      folded pack and the regenerated fixtures). Judgement agrees (a production pack Zero signs).
  - id: D-review-rules
    decision: >-
      The nine dormant review.* rules are DELETED (retired), none flipped to NO_EFFECT: each was gated on
      intent.requested_product_code, which the mapper hard-codes UNKNOWN(NOT_ASKED), and each one's
      qualification is re-established by the SUPPORT rule that replaced it (fold-time dormancy census +
      guilt test).
  - id: D-e28
    decision: >-
      No source record in the pack states the E28 Golden Visa USD minimums, so E28B/C/D/F depend on a
      declared investment.meets_published_threshold conjoined with a route boolean and cite the catalogue
      record; investment.investment_amount_usd is not compared to any figure.
  - id: D-valid-period
    decision: >-
      The brief asked for valid_period.from = 2026-09-15T00:00:00Z on the pack. Measured against
      migrations_v2/253 (visa_activate_rule_pack step 4, lines 415-431) and activate_pack.py:131-143: the
      activation's legal_period IS the payload valid_period, and an activation whose legal period overlaps a
      still-open prior one without covering it is refused. seq-20's open activation starts 2026-07-25, so the
      ceremony would have inserted the immutable pack row and then failed at --yes, burning sequence 21. The
      brief's purpose (no rule in force before the signature, replays pinned inside validity) is kept at the
      RULE level: the pack valid_period stays seq-20's (as every fold since seq-13), the eleven new rules carry
      valid_period.from 2026-09-15T00:00:00Z (seq-20's fold used the same rule-level pattern). Guilt test
      restates the step-4 predicate.
  - id: D-sponsor-premise
    decision: >-
      el.e33b and el.e33c first mirrored seq-20's hard filters (GOVERNMENT or NONE). A hard filter excludes; a
      SUPPORT rule recommends, so its sponsor premise must be a subset of the product's catalogue sponsor_types
      (statutorily verbatim for E33A/B/C per enums.FactPath sponsor.type): E33B = NONE, E33C = GOVERNMENT,
      asserted at fold time with a guilt test. Cost: an applicant who answers GOVERNMENT and a collaboration is
      not offered E33B; recorded as dissent.
  - id: D-mouth-perimeter
    decision: >-
      The brief allows only the i18n copy edit in mouth. Also touched, each forced by a contract test and kept
      to the minimum: fact-mapper.ts and applicant-fact-paths.ts emit the ten keys as UNKNOWN(NOT_ASKED)
      (fact-mapper.test.ts compares the key set with models.py), schema.d.ts + its openapi sha are regenerated,
      the no-path-doors replay fixture carries the new walk-corpus fingerprint, and engine-adapter.test.ts's
      review guard now reads the union of the highest source and highest signed pack. No tree.ts / flow.ts
      change; no question added.
  - id: D-redact
    decision: >-
      The CI Detect Secrets gate, simulated locally on the changed files (scan with the baseline, auto-triage,
      check_unaudited; baseline restored byte-identical), flagged hex digests (content/payload sha256 of public
      pack records) quoted in the four codex transcripts and the SEQ20_PAYLOAD_SHA256 constant in the fold.
      64 transcript lines had the digest replaced by "[redacted hex digest]" (nothing else changed; verdict
      lines intact); the fold constant carries "# pragma: allowlist secret" (comment only, after the council
      OK on 4bea118cdc; test_seq21_pack.py re-run, 51 passed). Re-simulation: zero unaudited findings.
  - id: D-6362
    decision: >-
      PR #6362 is never rebased: once this PR is open it gets a comment linking the successor and is closed.
