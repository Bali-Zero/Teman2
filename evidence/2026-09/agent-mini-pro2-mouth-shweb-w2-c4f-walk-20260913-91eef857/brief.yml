lesson:
  what: >-
    The PR that exists to stop a rule living in one caller instead of in the walk dropped exactly
    such a rule while moving the walk: the guard's root-route special case did not survive the
    extraction, and a refuter found it.
  why_it_matters: >-
    An extraction is not a move, it is a re-derivation — and re-derivation is the thing that has
    been failing all through this mandate. The cure that worked was not more care: it was the
    refuter asking what the new function could not see, and then probing the shape rather than
    reading the code. Every finding in this round that survived contact with a measurement was of
    that kind, and every one that did not — the "report nothing rather than crash" comment that was
    never in the file — came from reasoning about a plausible shape instead of the one present.
