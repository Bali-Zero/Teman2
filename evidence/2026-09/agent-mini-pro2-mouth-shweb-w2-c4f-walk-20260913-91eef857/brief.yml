  - id: rescope-2
    what: guard, baseline and test all import it — no third copy
    done: >-
      The guard imports walkAppRoutes; the baseline imports urlRoute (it had its own copy); the
      coverage test imports walkAppRoutes. A DESIGN CONSTRAINT had to be respected or the shared
      module would have been a third copy with extra steps: the two consumers need different
