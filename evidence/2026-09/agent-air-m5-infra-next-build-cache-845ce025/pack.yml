    note: >-
      OK. Confirmed stale-restore safety via webpack/SWC content-hash
      invalidation. Named the css/json glob gap and the fetch-cache
      sub-directory as a theoretical (not actual, in this repo) masking
      vector; suggested dropping the OS-only restore-key. The glob gap was
