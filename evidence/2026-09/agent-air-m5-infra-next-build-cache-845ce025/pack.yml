    seat: kimi-code/k3 (`kimi -m kimi-code/k3 -p`, non-Anthropic, agentic file access, fresh context, no shared prompt with the codex lane)
    note: >-
      OK. Independently verified in-repo that the theoretical fetch-cache
      masking vector codex named does not apply here — the only build-time
      fetches (apps/mouth/src/lib/blog/articles.ts) use revalidate:60, so a
      restored entry is always expired before the next CI run. Flagged the
