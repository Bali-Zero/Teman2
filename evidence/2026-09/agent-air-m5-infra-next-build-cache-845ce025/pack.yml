seat_diversity: satisfied
seat_diversity_note: >-
  One build lane (Claude) and two review lanes, both non-Anthropic and
  cross-family from each other, same diff, no sight of each other's answer.
  Both converged OK and on the identical glob-gap nit; kimi went further and
  closed codex's one open theoretical concern (fetch-cache staleness) with an
  in-repo check codex's read-only sandbox pass didn't perform, which is
  exactly why two seats with different tool access run.
outcome: >-
  The e2e-tests job now restores apps/mouth/.next/cache before `next build`
  runs (via playwright.config.ts's webServer), keyed on package-lock.json
  plus a hash of every apps/mouth source file next build compiles from
  (js/jsx/ts/tsx/mjs/cjs/css/json), with a two-level restore-keys fallback.
  No other job in tests.yml runs `next build` for apps/mouth, so no second
  cache step was added. Correctness is unaffected in every case: next build
  still runs to completion regardless of cache hit/miss/stale-hit.
diff:
  files: 1
  net_lines: "35 insertions, 0 deletions (.github/workflows/tests.yml only)"
  measured_at: "git diff --numstat origin/main..HEAD in this worktree"
  shape: >-
    One new named step (comment block + actions/cache@v6 block) inserted
    between the existing "Install Node dependencies" and "E2E specs must
    collect with no credentials present" steps of the e2e-tests job. No
    other step, job, or line touched.
behaviour_change: >-
  YES, CI-visible: the e2e-tests job now performs an extra cache
  restore/save round-trip against apps/mouth/.next/cache. On a cache miss
  (first run after merge) behaviour is identical to before this PR except
  for the added restore/save I/O. On a hit or restore-keys hit, `next build`
  reuses validated webpack/SWC module entries instead of recompiling from
  scratch, cutting wall time; build correctness and output are unaffected in
  every case, per both review lanes. No other job's behaviour changes.
pii_scan: clean
bites:
  consumer: >-
    The `E2E Tests (Playwright)` job on the FIRST PR after this one merges
    to main (this PR's own run necessarily seeds the cache from empty, so
    its own "Run E2E tests" step is not the observation that closes the
    loop — see bites_note).
  where: ci
  observe: >-
    gh api repos/{owner}/{repo}/actions/jobs/<e2e-tests job id of that PR>
    --jq '.steps[] | "\(((.completed_at|fromdate)-(.started_at|fromdate)))s \(.name)"'
  expect: >-
    The new "Cache Next.js build cache (mouth)" step reports a hit (restore
    log shows "Cache restored from key"), and "Run E2E tests" duration is
    measurably below the pre-cure 244s baseline (run 34350109029 job
    102461489711).
bites_note: >-
  Pre-merge observation on THIS PR: the acceptance probes (A1-A4) all pass
  locally, and this PR's own e2e-tests run is expected to show "Cache not
  found for input keys" followed by a post-job "Cache saved with key" (first
  run seeds the cache — that is the correct shape for a seed run, not a
  defect). That seed-run observation is recorded in receipts below once the
  PR's checks report. The live warm-cache-hit observation on the NEXT PR
  after merge is what closes the Bites loop and is not claimed here.
