task: Stop the News Room converter from dropping draft "##" sections and inventing Next Steps content that was never in the draft.
lane: backend-rag/newsroom-fidelity-r3
machine: M5
date: 2026-09-25
mission_id: newsroom-converter-fidelity
mission_colour: BLUE
role: Dux session (Opus 5.5) — builds, arms, deploys; the final gate is a fresh read-only session outside this chain
gear: 2
gear_reason: >-
  Supersedes #7285, which went DIRTY after #7301 and #7264 landed on main and
  is frozen (armed). Rebuilt on fresh origin/main (50d4f4bf2c) by
  cherry-picking #7285's fix commit unchanged; the only conflict was the
  derived pin schema.d.ts.openapi-sha256. Pin AND schema.d.ts regenerated on
  this tree with the repo's own generators (scripts.generate_openapi +
  openapi-typescript + prettier) instead of carried over — the regeneration
  also corrects #7285's hand-approximated schema.d.ts hunks (it declared
  `@default []` on default_factory lists, which pydantic never emits; the
  generated types are optional, and no mouth code consumes them). Churn ~450
  lines, no hot-zone path: Gear 2 by the size term.
acceptance:
  A1: Every draft "##" section the converter does not map to a dedicated field (e.g. "In Practice", "Sources") is preserved verbatim, in draft order, anchored to the mapped section it followed — never silently dropped.
  A2: A Next Steps body with no "For Expats"/"For Investors" subsections renders as one neutral group; it is never split 50/50 between expat and investor.
  A3: An empty Next Steps group is omitted; the filler "Review the article for specific actions" is never emitted; the whole Next Steps section is omitted when there are no steps at all.
  A4: A draft with real For Expats/For Investors subsections renders exactly as before this change (innocence).
  A5: schema.d.ts and its OpenAPI drift pin are regenerated from this tree by the repo's generators; test_generate_openapi_schema_pin passes.
out_of_scope: Legacy-article cleanup (#7282, separate lane), LLM-composer prompt changes, unrelated router changes.
