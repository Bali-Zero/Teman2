acceptance:
  - from a worktree, a real dispatch re-execs into apps/backend-rag/.venv and the receipt reads interpreter=venv, repo_redactor=true, redactor_yaml=6.0.3
  - no usable pinned interpreter, ENOEXEC after checks, or a 0777 candidate -> single receipt skip=no_pinned_interpreter, exit 0, no stdout, no vendor call
  - the git common-dir fallback resolves the main checkout venv from a worktree that has no symlink, with stdin surviving the exec
  - JEV_DISPATCH_GATE_REEXEC=1 never re-execs twice; the CI seam counts only with JEV_DISPATCH_GATE_FAKE_ANSWERS set
  - a hung git or exec attempt is bounded by a 3 s alarm cancelled before execve; vendor-import failure yields jev_status=vendor_import_failed with no vendor call
  - after merge and fleet ff, M5/Pro/Mini synthetic dispatches read interpreter=venv, repo_redactor=true, redactor_yaml=6.0.3, jev_status=ok
