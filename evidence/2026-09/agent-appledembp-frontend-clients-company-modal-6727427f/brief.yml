      The modals are only ever mounted client-side after an operator click (both files are
      `"use client"` and conditionally rendered from `CompanyTab` state), so
      `document.body` is defined whenever `createPortal` runs. Read on this head:
      `CompanyTab.tsx` mounts them only under `{isAddingCompany && ...}` (lines 367, 717) and
      `{isEditingCompany && co?.company_id && ...}` (line 704); no SSR path renders either.
    status: verified
    probe: >-
      grep -n "AddCompanyModal\|EditCompanyModal" "apps/mouth/src/app/(workspace)/clients/[id]/components/CompanyTab.tsx"
  - text: >-
