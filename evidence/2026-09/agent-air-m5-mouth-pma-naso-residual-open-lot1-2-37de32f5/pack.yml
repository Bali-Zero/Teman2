dissent:
  - seat: "codex-gpt-5.6-sol (refuter) vs claude-opus-5 (author)"
    status: CONFIRMED
    objection: >-
      BLOCKER: "the lot includes 64121, conventional commercial banking, and 61 codes across
      prefixes 64-66. Pasal 11(2) expressly refers finance and banking to their sector
      legislation. Neither the four-digit sibling heuristic nor the 19 exclusions establishes
      coverage of this category. A client receives pma_cap_verified=true and «max foreign 100%»
      without the applicable ownership regime being established." CONFIRMED and FOLDED, with a
      wider remedy than the one proposed: `sector_referral()` now withholds by INSTRUMENT, not
      by hand — leg 1 routes divisions 64/65/66 out under Pasal 11(2) (61 codes), leg 2 withholds
      eight divisions whose own statutes this lane never read (09 35 49 50 51 52 53 61, 68
      codes), and the spec must carry a reason string per leg or check() refuses. The lot went
      from 459 items to 330 and 64121 is declared_gap on the shipped canonical. The measurable
      proof the second leg is not theoretical: 23 codes in divisions 50/51/53 are ALREADY located
      at TERBATAS/49% under Lampiran III.
  - seat: "codex-gpt-5.6-sol (refuter) vs claude-opus-5 (author)"
    status: CONFIRMED
    objection: >-
      Three HIGHs against the compiler, each reproduced by the reviewer in isolated execution,
      each CONFIRMED and FOLDED: (2) the "already applied" branch was a one-way door — a record
      already located under this basis was never re-judged, so a newly capped sibling, a flipped
      verdict, a Bali block or new legacy prose could not un-publish it; `still_qualifies()` now
      re-judges every shipped record on every leg AND against the full expected patch, refusing
      on drift. (3) a failed consumer propagation could not be retried, because the canonical was
      written first and the rerun found nothing to relabel and exited 0; `propagation_verdict()`
      makes the no-op rerun re-check and re-propagate. (4) the spec could disable the safeguards
      it supposedly cannot override; `REQUIRED_RULE` pins every load-bearing predicate in the
      compiler and check() refuses any spec whose rule diverges, so widening the class is a code
      change under review and not a JSON edit. None of these mechanisms existed in the reviewed
      patch.
  - seat: "kimi-code/k3 (refuter) vs claude-opus-5 (author)"
    status: CONFIRMED
    objection: >-
      BLOCK: "BPR shares legally 0% foreign (UU 10/1998), domestic sea transport 49% (UU
      17/2008), scheduled aviation 49% (UU 1/2009), insurance brokers 80% (PP 14/2018 jo PP
      3/2020), pension funds Indonesian-only (UU 11/1992) — the page/RAG will now answer
      «verified, 100% foreign OK» for these"; and HIGH #2, the insurance chain half-excluded
      (65131/65132 hand-excluded and 65203/65204 sibling-withheld on PP 14/2018 grounds, while
      66212-66291 and the 653xx/663xx pension codes shipped under the same regime). Both
      CONFIRMED and closed by the same `sector_referral()` rework: every code Kimi named is now
      withheld, and by an instrument-level rule rather than by a longer hand list.
  - seat: "kimi-code/k3 (refuter) vs claude-opus-5 (author)"
    status: CONFIRMED
    objection: >-
      HIGH #3: "Perpres 10/2021 Pasal 2(2) closes by category, with no codes named, not only
      alcohol and CITES but also (e) «industri senjata kimia» and (f) «industri bahan kimia
      industri dan bahan perusak ozon». The lot ships the 201xx/202xx chemical-manufacturing
      block with no exclusion and no adjudication. This is exactly the 11030 failure shape the
      PR itself cites as proof the danger is real, and the 4-digit sibling rule cannot see it."
      CONFIRMED and folded in 66321c62b0 — as an ENFORCED probe, not a hand exclusion, because
      excluding codes the rule never reaches is a stale exclusion this compiler already refuses.
      `category_closure_probe` reads the state's OWN per-code marker for the category (the PP
      28/2025 «Surat Pernyataan tidak memproduksi senjata kimia … Bahan Perusak Ozon/BPO»
      licensing requirement), and it lands on exactly four codes, all in division 20: 20115,
      20116, 20119, 20121. Not one is in the lot, and not because this spec excluded them — the
      Perpres partition already owns all four (20115 named-in-annex; 20116/20119/20121
      priority-lampiran-i), so the residual rule cannot reach them. check() refuses if the
      catalogue's marked set ever drifts from the spec's pinned census, and the probe is blind
      to the four fields this compiler writes (PROBE_BLIND_FIELDS) with a guard that refuses if
      patch_for() ever writes a field the probe still reads — measured, not feared: the first run
      after the basis was extended withheld all 330 by matching its own prose. The basis string
      now states how the four Pasal 2(2) activity-closures were tested, and states what the test
      does NOT prove: the marker is a licensing condition, not a statutory enumeration, so a code
      without it could still host the closed activity.
  - seat: "kimi-code/k3 (refuter) vs claude-opus-5 (author)"
    status: RETRACTED
    objection: >-
      Four findings that did not survive measurement, recorded so nobody "fixes" them. HIGH #4:
      the provenance test title (638/921) contradicted its body (590/969), with the dangerous
      second reading that deriveProvenance promotes the 48 withheld codes to located — at HEAD
      the title and the assertions both read 461/1,098, and the reviewer had read a draft whose
      title had been advanced by the rule's reach instead of the shipped count. LOW #5: the
      '12001-12009' range in the tobacco exclusion text — the seven listed codes are the seven
      that exist and are reached; text corrected. LOW #6: '217 unobserved-scale codes' against a
      158-code pin — the 217 is Zero's ruling on the whole unobserved class, the 158 is the
      subset this lot's rule would otherwise have reached; text corrected. LOW #7: the sample
      record lacked pma_source_vintage — 330/330 shipped records carry it, and no record in the
      catalogue has the `pma_vintage` key the sample showed. LOW #8: `already` could go negative
      — it is a sum() over records (line 637), not a subtraction.
