objective: "Relabel the RESIDUAL-open codes from pma_verification_status declared_gap to located and give them a locator: Perpres 10/2021 Pasal 3(1)(d) + 3(2) as amended by Perpres 49/2021 — «Bidang Usaha yang tidak termasuk dalam huruf a, huruf b, dan huruf c» «dapat diusahakan oleh semua Penanam Modal». Lot 1 is the 330 codes where the relabel changes ONE client-facing thing and nothing else: bucket residual-besar-observed, published TERBUKA/100/declared_gap, Bali overlay OK_or_HIGHER_RISK and not blocked, no legacy PMA prose, no adjudicated 4-digit sibling, no hand-excluded body-stated category, no Pasal 11(2) sector referral and no unswept-sector-statute division. Verdicts are untouched: TERBUKA/100 before and after — only the provenance moves. Census 1,428 gaps / 131 located becomes 1,098 / 461."
constraints:
  - "The population is RE-DERIVED from the instrument on every run by perpres_body_default_relation.report(), never read from the spec: the spec may choose WHICH codes it lists, never the predicates that decide eligibility. REQUIRED_RULE pins every load-bearing predicate in the compiler, so widening the class is a code change under review and not a JSON edit. check() refuses in BOTH directions — a listed code the rule does not reach, and a reached code the spec omits."
  - "A closure the annexes cannot see is withheld, never published open by absence. Three legs: Pasal 11(2) routes the WHOLE finance/banking sector out of the Perpres (divisions 64/65/66, 61 codes withheld); eight divisions carry sector statutes this lane never read (09 35 49 50 51 52 53 61, 68 codes withheld); Pasal 2(2) closes four items by ACTIVITY and names no code, tested by the state's own per-code marker (category_closure_probe)."
  - "Legge 5: no verdict, no cap and no Bali status is flipped anywhere in this PR. The declared follow-ups stay out — 87101/88101/88901/11030 flips, Lampiran III 0% on 58130/60102/60202, sector-law closures on 58120/60101/60201/69104, 79110, 20119."
  - "Deferred in lots, each with its own reason in the spec and NOT silently shipped: 272 ATTENZIONE_FASCIA_BALI, 31 BLOCCATO_DIPENDE_SCOPE, 22 CHIUSO_BALI, 6 other Bali, 36 legacy-prose records, 29 adjudicated-sibling, 19 body-stated categories, 61 Pasal 11(2) finance, 68 unswept-statute, 12 residual-besar-absent, 158 residual-besar-unobserved (Zero: «il residuo non ha i 217»)."
