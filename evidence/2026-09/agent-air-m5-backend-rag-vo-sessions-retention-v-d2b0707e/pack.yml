decisions:
  - id: D-gear
    decision: >-
      Gear 3. Measured this turn with `apps/backend-rag/.venv/bin/python
      scripts/evidence_pack_lint.py --print-floor --changed-files-file <changed> --numstat-file
      <numstat>` on the merge-base diff (c1db269aa9601914ec77250f7748f0ac2352cf55 # pragma: allowlist secret
      ...a76050925ca29ec1bf3b4c4882be913986a03b5d # pragma: allowlist secret
      ): floor 3. `--print-floor-source` (run separately — the script returns early on
      `--print-floor` before reaching the source branch, confirmed by reading main() this turn,
      evidence_pack_lint.py:4612-4644) reports source "path": the migrations_v2/*.sql path alone
      triggers HOTZONE_PATTERNS regardless of this PR's small size (net churn +263, well under
      SIZE_GEAR3_THRESHOLD 1,828).
  - id: D-numbering
    decision: >-
      317 is KEPT, not renumbered. Re-measured this turn: `git ls-tree -r --name-only origin/main
      -- apps/backend-rag/backend/db/migrations_v2/` shows highest present is 318
      (318_wa_outbox_inbound_binding_and_terminal_reasons.sql), with 315 present and 316/317 BOTH
      free — no file on origin/main claims either number. `gh pr list --state open --limit 500
      --json number,headRefName,files | grep migrations_v2` finds exactly two open-PR hits in
      that gap: #6478 (agent/air-m5/db/vo-sessions-retention-317) claims 317 with the IDENTICAL
      filename this PR uses — the fossil this PR supersedes, not a competing author, since #6478
      is armed/frozen and expected to be closed by the Dux, never merged alongside this successor;
      and #6474 (agent/air-m5/db/vo-consultant-split) claims 315 (DIFFERENT filename,
      315_visa_oracle_consultant_requests.sql, colliding with origin/main's own 315 under a
      different name) and 316 (316_visa_oracle_consultant_requests_retention_policy.sql,
      colliding with nothing on main) — neither is 317 and neither is this PR's collision to fix.
  - id: D-order-safety
    decision: >-
      Applying 317 on a database where 318 is already applied is safe and requires no
      renumbering. Read `backend/db/migration_manager.py::_apply_all_pending_locked` this turn
      (L559-655): `pending = [m for m in discovered if m["number"] not in applied_numbers]` —
      pending status is set-membership in `_schema_versions`, never a comparison against the max
      applied number, and `discover_migrations` only rejects DUPLICATE prefixes
      (`_assert_unique_migration_numbers`), never out-of-order gaps. A DB that already ran 318
      will pick up 317 on its next `apply-all` and run it after 318 chronologically; this
      migration's SQL (idempotent CREATE TABLE/INDEX IF NOT EXISTS + idempotent ALTER ... SET
      DEFAULT) has no dependency on 318's content, a disjoint table (wa_outbox).
  - id: D-router
    decision: >-
      No router change needed. Read `_persist_session_create`
      (apps/backend-rag/backend/app/routers/visa_oracle.py:634-656) this turn: its INSERT names
      only (session_id, quiz_answers, recommended_visas, ip_hash) — expires_at is never set
      explicitly, so the column DEFAULT this migration changes is the only source of the value on
      every new row. This confirms the mandate's own framing (migration alone suffices) rather
      than the alternative branch (router also needs a change).
  - id: D-existing-rows
    decision: >-
      The migration's own DDL still touches no existing row's expires_at VALUE (no UPDATE/DELETE
      in the .sql file — unchanged from the first measurement). What changed this turn: the first
      purge run after deploy DOES delete rows already past their own expires_at — PROD count
      today is 17 of 20 (measured read-only by the Dux, oldest created 2026-04-13); the exact
      number at deploy time is measured by the Dux then, not assumed here. Handoff rows are NEVER
      deleted, at any age — see D-handoff-safety.
  - id: D-handoff-safety
    decision: >-
      The purge DELETE is `WHERE expires_at < NOW() AND NOT COALESCE(handoff_triggered, false)`.
      Grepped this turn for every table/code reference to visa_oracle_sessions: `grep -rn
      "REFERENCES.*visa_oracle_sessions" backend/db/migrations_v2/*.sql` — zero hits (no FK
      anywhere references this table); `grep -rln "visa_oracle_sessions"
      backend/**/*.py` (excluding tests/.venv) — only visa_oracle.py itself, the legacy
      migration_080a/migration_109 files (comments only, no join), and migration_base.py's
      legacy-rollback whitelist entry. CORRECTED (council round 1, finding F7, Codex — PROVEN):
      an earlier version of this decision said `_fetch_session_snapshot` was "keyed on"
      `handoff_triggered`; that is false — `_fetch_session_snapshot`'s SELECT names only
      `quiz_answers, recommended_visas` (visa_oracle.py:817), never `handoff_triggered`, and it is
      called synchronously AT handoff time, on a session that is still live (not yet expired), to
      build the handoff pricing response — not as a read gated by the marker. The REAL safety
      argument: a handed-off session is excluded from the purge purely by its own marker
      (`handoff_triggered`, set by `_persist_session_handoff`, visa_oracle.py:700-761); the purge
      itself is the ONLY reader of that marker. `handoff_triggered` is the single durable signal
      that a row still matters (no FK/table anywhere else references visa_oracle_sessions), and
      the purge excludes it unconditionally, regardless of age.
  - id: D-scheduler
    decision: >-
      SUPERSEDED (this turn) by the Dux's review of the previous decision. Original reasoning,
      kept for the record: `lead_capture.repository.LeadCaptureRepository.purge_expired`
      (backend/services/lead_capture/repository.py:155) has ZERO callers anywhere in the repo;
      the closest same-domain precedent, `backend/scripts/visa_engine/retention_worker.py`, is
      gated by a Zero-approved retention-POLICY table this session had no authority to add a row
      to, so a lighter-weight structural mirror (one-shot worker + wrapper + plist) was built
      instead. The Dux's review named the actual defect in THAT choice, independent of its
      weight: `com.nuzantara.visa-oracle-retention.15min.plist.example`'s own sibling job is
      installed on Mini under a dedicated role (`VISA_ENGINE_RETENTION_DATABASE_URL`) — the new
      plist this session built had no such installed counterpart anywhere, and its wrapper wanted
      a `DATABASE_URL` with DELETE on PROD on an H24 host, a credential only the operator can
      provision. Built, never armed — cicatrix scar #2 exactly, regardless of how light the
      worker itself was.

      REPLACEMENT (this turn): run the purge inside the Fly process that already holds the pool
      and already serves the traffic it protects. `router_manifest.py:424` registers
      `visa_oracle` as `process_groups=_API` — `main_api.py` is the process, not `main_rag.py` or
      the monolithic `main_cloud.py`. Read `main_api.py`'s existing GARUDA-outbox scheduler
      (`_run_garuda_outbox_scheduler`, ~line 260) and its own docstring first: that loop exists
      for the identical reason — `outbox_consumer.py` and its handlers existed and were fully
      tested with ZERO non-test callers in the whole tree, "Built is not armed" in its own words —
      and its DLQ-retry-loop sibling in `service_initializer.py::initialize_services_light`
      carries a comment explaining it was moved from `rag` to `api` specifically because `rag`
      autostops and starved it for a week (2026-06-21 incident). Both are exactly this problem
      solved once already in this same file; `_run_visa_oracle_sessions_purge_scheduler`
      (main_api.py:615) reuses their SHAPE: task stored on `app.state`, spawned in
      `_background_light_init` guarded on `db_pool` + its own kill switch
      (`VISA_ORACLE_SESSIONS_PURGE_ENABLED`), cancelled in `lifespan_light`'s shutdown before the
      pool closes. Multiple `api` machines each running the loop is fine — the DELETE is
      idempotent, the same bet `_run_garuda_outbox_scheduler`'s own docstring already makes for
      its queue (scar #10 considered, not merely asserted away).
  - id: D-review
    decision: >-
      Reviewed the migration against this directory's own conventions (315, 318 read as recent
      examples this turn) — idempotent DDL (CREATE TABLE/INDEX IF NOT EXISTS, matches both
      siblings), `-- === ROLLBACK ===` marker present and restores 90 days (matches convention),
      lock footprint is metadata-only (ALTER ... SET DEFAULT takes no table-rewrite lock; the
      CREATE statements are no-ops on PROD since the table/indexes already exist — added an
      explicit LOCKS note to the file's header this turn, matching 318's own LOCKS section
      convention, since the original file had none). No other defect found — the file's own
      "Scope, stated so it cannot be over-read" section already matched every convention checked.
