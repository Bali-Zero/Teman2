dissent:
  - seat: this session (M5, self-refutation)
    objection: >-
      Keeping migration number 317 (rather than renumbering) risks a REAL on-disk collision if PR
      #6478 is ever merged instead of closed: both branches add a file with the byte-identical
      path apps/backend-rag/backend/db/migrations_v2/317_visa_oracle_sessions_retention_30d.sql,
      and merging both would be a genuine duplicate the uniqueness guard could not have caught in
      either PR alone (each is clean on its OWN branch).
    status: CONFIRMED
    cure: >-
      Not fully curable by this session — recorded so it is not lost. #6478 is armed AND frozen
      (Builder Contract §1: an armed branch is read-only) and carries no Gear-3 evidence pack, so
      per the mandate's own framing it "can never pass" as-is — it is expected to be closed, not
      merged, once this successor is ready. This session cannot close #6478 itself (PR
      open/close/merge is reserved to the Dux by this task's own constraints); recorded here, and
      again in leftovers below, so the Dux closes #6478 before or at the same time as arming this
      PR rather than discovering the collision at merge time.
