# Gear-3 evidence pack — visa_oracle_sessions 30-day retention, successor of PR #6478
# (mandate SAETTA R2, Dux = parent session, M5). Written by the same session that built the
# migration and the test, in this worktree (sole writer, per the task's own worktree-discipline
# constraint) — there is no separate evidence-pack-writer lane on this small a change. Every
# receipt below is a command this session actually executed in this authoring turn
# (anti-hallucination discipline); nothing is narrated from memory or from #6478's own history
# without a fresh command backing it this turn.
#
# EXTENDED same-slice (2026-09-17, second authoring turn) by a Dux finding measured read-only on
# PROD: visa_oracle_sessions had 20 rows, 17 already past expires_at, oldest created 2026-04-13 —
# nothing deleted them, so the DEFAULT change alone enforced no retention. This turn adds the
# scheduled, handoff-safe purge that actually enforces it. Every receipt in the newly-added block
# below is likewise a command this session executed in THIS turn.
#
# EXTENDED AGAIN (2026-09-17, third authoring turn) by a Dux REVIEW of the second turn's
# scheduling mechanism: a launchd `.plist.example` + wrapper that no one installs, wanting its
# own DATABASE_URL with DELETE on PROD, is superscar #2 ("exists != armed") — the purge would
# never actually run. This turn replaces that mechanism with an in-process asyncio loop inside
# the `api` Fly process (the one that already holds the pool and already serves
# /api/visa-oracle), removes the now-superseded plist/wrapper/one-shot-worker/ops-test, and
# re-measures the floor and lint on the new diff. The receipts from the second turn describing
# the superseded artifacts are LEFT IN PLACE below as a true record of commands this session
# actually ran at the time — not deleted, since they were not false when written — but the
# CURRENT acceptance C probe and consumer_map now point at the replacement.
