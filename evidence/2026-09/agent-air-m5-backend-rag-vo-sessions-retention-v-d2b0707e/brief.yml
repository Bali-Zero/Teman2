  Floor measured with scripts/evidence_pack_lint.py --print-floor / --print-floor-source on the
  merge-base diff (git diff --name-only / --numstat, merge-base c1db269aa9601914ec77250f7748f0ac2352cf55 # pragma: allowlist secret
  ...HEAD 67d00e0b8c992cdde800b381c156950937d3194d # pragma: allowlist secret
  , re-measured after the purge extension): floor 3, source "path" — the changed set still
  touches apps/backend-rag/backend/db/migrations_v2/317_visa_oracle_sessions_retention_30d.sql,
  which matches this repo's HOTZONE_PATTERNS for the migration hot-zone regardless of size (net
  churn is now +995 across 12 files, still under SIZE_GEAR3_THRESHOLD on its own — "path" stayed
