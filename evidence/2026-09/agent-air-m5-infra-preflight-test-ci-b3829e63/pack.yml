what_changed: |
  ONE workflow file, .github/workflows/preflight-pack-tests.yml (+ this
  evidence pack). Triggers: pull_request and push:main, paths-filtered on
  the measured closure the suite binds (contract_verify, preflight_pack,
  contract_checks.yml, evidence_paths, stage_council_journal, bites_parse,
  evidence_pack_lint, conductor/review_eligibility,
  check_adversarial_review, lint_retracted_claims, the merged mailbox-
  janitor evidence pack the innocence arms read, the suite itself, and the
  workflow under pull_request). Job: pinned checkout v7 with fetch-depth 0,
  pinned setup-python v7 (3.12), pip install pyyaml inline, bash -n on
  preflight_pack.sh and the suite, then the suite under pipefail | tee with
  three assertions read in the SAME step: no "span arm skipped" line, no
  "journal arms skipped" line, at least 13 arms passed. Not added to
  required contexts (repo-settings, operator-gated, sibling posture).

proof: |
  See receipts. Deterministic floor 3 / path. actionlint under CI's own
  flags clean; bash -n clean on both scripts; the assertion step extracted
  verbatim from the workflow and run locally against the real suite exits
  0 with "13 passed, 0 failed"; the same step fails on a log carrying the
  skip line (guilt); the janitor squash the span arm replays is an ancestor
  of origin/main so fetch-depth 0 makes the arm execute. Two cross-family
  council seats reviewed the diff; every finding is fixed or recorded as
  dissent below. The live proof is the check itself on this PR: the
  workflow lists itself under pull_request.paths, so it runs on this diff
  and its log is read before the work is reported done.

dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      "scripts/conductor/__init__.py is missing from both path filters: evidence_pack_lint.py
      imports conductor.review_eligibility, which executes the package initializer, so a change
      there can break the suite without starting this workflow (kimi-code/k3 raised the same,
      naming it green-by-never-starting)."
    status: CONFIRMED
    resolution:
      scripts/conductor/__init__.py added to both pull_request.paths and push.paths
      (16 entries each, identical).
  - seat: codex-gpt-5.6-sol
    objection:
      "The fixture glob evidence/.../mailbox-janitor-ad139989/** is broader than the
      bound surface: today it matches the three consumed files, but any future unrelated file
      in that directory creates trigger noise."
    status: CONFIRMED
    resolution:
      brief.yml, journal.jsonl and pack.yml of the janitor pack are listed explicitly
      in both filters; the glob is gone.
  - seat: kimi-code/k3
    objection:
      "The push paths list omitted .github/workflows/preflight-pack-tests.yml itself
      while the pull_request list included it: merging this very PR would fire no push-to-main
      run, so the workflow's first main execution would wait for an unrelated matching diff."
    status: CONFIRMED
    resolution:
      "The workflow file is now in the push list too; the two lists are byte-identical
      (receipt: symmetric difference empty)."
  - seat: kimi-code/k3
    objection:
      'summary="$(grep ... | tail -1)" runs under the runner''s bash -e with pipefail:
      when the summary line is absent grep exits 1, the assignment fails and the step aborts BEFORE
      the custom ::error line prints. The job still reds, but the diagnostic is lost.'
    status: CONFIRMED
    resolution:
      "|| true inside the substitution; guilt+innocence receipt shows the old shape
      losing the diagnostic and the folded shape printing it before exit 1. Same defect family
      as the janitor wrapper's SUMMARY substitution (pack ad139989, dissent 1)."
  - seat: kimi-code/k3
    objection:
      "The header comment's chain description slightly oversells .husky/pre-push: the
      suite sources preflight_pack.sh with PREFLIGHT_PACK_LIB=1 and never executes the hook, so
      listing the hook in paths would be noise (correctly omitted)."
    status: PLAUSIBLE
    resolution:
      "No change: the header names the hook as the production caller of the same library,
      not as an executed path; the omission from paths is by design and the seat agrees with the
      omission."

