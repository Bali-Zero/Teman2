plan_ref: >-
  PR (agent/air-m5/wa-team/t3-pr3-judge-c2-matrix-0929, base main) - gate condition C2 on the
  merged PR #7646: the status-half G1 matrix, the G7 leading-fragment assertions and the
  G-LOW-1 subprocess variant as permanent tests, plus stale-count refresh. No production change.
lanes:
  - lane: wa-team-t3-pr3-judge-c2-build
    role: build
    seat: "claude-sonnet-5 (wrote the tests, ran both council rounds, applied findings by hand)"
  - lane: wa-team-t3-pr3-judge-c2-council-codex
    role: review
    seat: "codex-gpt-5.6-sol (round 1 REWORK on 3 MEDIUM; delta REWORK on 6 findings, see dissent)"
  - lane: wa-team-t3-pr3-judge-c2-council-kimi
    role: review
    seat: "kimi-code/k3 (round 1 first attempt timed out, retry GO-WITH-NITS on 3 MEDIUM + 3 LOW; delta GO-WITH-NITS on 6 findings, see dissent)"

what_changed: |
  Three commits on one branch, tests and the workflow only.

  1. G1 rewritten as a 16-cell matrix (4 guarded writes x 4 terminal statuses, matching
     clause_hash, attempts=0), each cell asserting the guard lost and the row untouched.
  2. G7: unique non-PII leading markers on the invalid and superseded bodies; asserts the
     markers, the 5-character marker prefixes, the 20-character body/clause prefixes and the
     superseded-path clause are absent from every record, with extra fields, exc_info and
     stack info folded into the searched text.
  3. G-LOW-1 variant (a unit test, +1 to the CI count): a fresh interpreter replaces
     os.environ / os.environb with a MutableMapping recorder before importing the module,
     poisons eight env names, and asserts no import-time read by the module other than
     HOME (Path.home()) and the literal URL.
  4. The header of the real-PG test file and the workflow header no longer state counts
     (nothing re-measures a comment); the FLOOR line is 249.

  Council: round 1 findings were applied in the second commit, round 2 findings in the third.
  The third commit is NOT re-reviewed by the seats (two rounds is the appetite); its effect was
  re-proven by the full mutation table below.

proof: |
  Unit (REAL_PG unset): 249 passed, 56 skipped.
  WA_TEAM_PROMISES_REAL_PG=1 (throwaway PG17 clusters the suites spin up): 305 passed.
  CI step verbatim under bash -e: FLOOR=249 -> exit 0; FLOOR=250 -> exit 1 (249 < 250).
  Production file scripts/wa_team_promises.py: byte-identical to origin/main.

  Mutation table (each: cp backup, apply, run the corpus with REAL_PG=1, restore, sha256 check).
  Pre-existing corpus survives every one of these (gate log); each is now killed by:
    MSUP, MATT, M07, M07b, M07c, M07d, M08, M08b -> test_g1_guarded_writes_also_require_status_unjudged_not_just_the_hash
    M40, M40t, M40x(extra field), M40e(exc_info), M41b, M41c, M41t -> test_g7_no_clause_text_in_log_records_on_invalid_and_superseded_paths
    M26c, M26d(built env name), M26e(getenv, unlisted name), M26f(dict(os.environ)) -> test_g_low1_subprocess_import_ignores_a_poisoned_environment
    M26, M26b -> both G-LOW-1 tests

dissent:
  - seat: codex-gpt-5.6-sol
    objection: "Round 1: G7 does not check the clause actually extracted on the superseded path; body[:20] is not necessarily clause[:20]."
    status: CONFIRMED
    resolution: "clause_superseded is derived with the runtime helper and asserted absent in full and by 20-char prefix."
  - seat: codex-gpt-5.6-sol
    objection: "Round 1: record.getMessage() ignores structured fields (extra=...), so a leak via extra passes."
    status: CONFIRMED
    resolution: "Every non-standard record attribute, exc_info, exc_text and stack_info are folded into the searched text. Mutation-verified with M40x and M40e."
  - seat: codex-gpt-5.6-sol
    objection: "Round 1: the subprocess probe poisons only seven enumerated names; an unlisted or runtime-built name passes."
    status: CONFIRMED
    resolution: "Replaced by a name-agnostic recorder of environment accesses by the module itself (plus poisoned names). Mutation-verified with M26d, M26e, M26f."
  - seat: kimi-code/k3
    objection: "Round 1 (retry): same env-name gap as codex; leads are 10 chars so a shorter cut than the marker passes; no superseded-clause assertion."
    status: CONFIRMED
    resolution: "Same fixes; 5-character marker prefixes asserted absent."
  - seat: kimi-code/k3
    objection: "Round 1: workflow header claims 'the skips are exactly the real-PG opt-in cases', the same class of unverifiable claim it removed."
    status: CONFIRMED
    resolution: "Reworded to a plain statement without 'exactly'."
  - seat: kimi-code/k3
    objection: "Round 1: G1 ATTEMPT cell might be vacuous if _apply_attempt returned None on success."
    status: RETRACTED
    resolution: "Checked on disk: _apply_attempt returns row['status'] on success and None only when the guard fails; the attempts == 0 and status assertions back the cell anyway."
  - seat: codex-gpt-5.6-sol
    objection: "Delta: os.environb is unobserved; dict(os.environ) and other C-level paths bypass a dict-subclass recorder (also kimi)."
    status: CONFIRMED
    resolution: "Recorder is now a MutableMapping (not a dict subclass) and os.environb is wrapped too. Mutation-verified with M26f."
  - seat: kimi-code/k3
    objection: "Delta: the recorder's frame walk stops at any helper module."
    status: CONFIRMED
    resolution: "The skip set now covers os, collections.abc, posixpath, genericpath, pathlib. A reproducing run showed the first version's skip name for collections.abc was wrong (M26e survived); fixed and re-proven."
  - seat: codex-gpt-5.6-sol
    objection: "Delta: the probe rejects every import-time environment read, broader than the URL contract."
    status: CONFIRMED
    resolution: "The module legitimately reads HOME through Path.home(); an explicit allow-list of that one read replaces the blanket rule."
  - seat: codex-gpt-5.6-sol
    objection: "Delta: exc_info is excluded as a standard attribute, so an exception message carrying clause text escapes; getMessage() can itself raise."
    status: CONFIRMED
    resolution: "exc_info is folded in and rendering is defensive. Mutation-verified with M40e."
  - seat: codex-gpt-5.6-sol
    objection: "Delta: only import time is exercised; a deferred read inside a function body evades the recorder (also kimi)."
    status: ACCEPTED-OPEN
    resolution: "Stated in the test comment. The static source scan test still covers the literal shape; a runtime-deferred, dynamically named read is a residual LOW."
  - seat: codex-gpt-5.6-sol
    objection: "Delta: leaks cutting 1-4 leading characters or a middle slice are not detected; caplog.at_level cannot justify 'ANY record' (non-propagating loggers)."
    status: ACCEPTED-OPEN
    resolution: "A 1-4 character cut has no unique signal to assert on; comments narrowed to 'logging record' captured by caplog and to the 5-character prefix. Non-logging channels are pinned by the cli_main output tests elsewhere in the file."
  - seat: kimi-code/k3
    objection: "Delta: the workflow comment says the step 're-measures' the floor, but the floor is static."
    status: CONFIRMED
    resolution: "Reworded: the step re-runs the corpus and compares the passed count to FLOOR."
  - seat: claude-sonnet-5
    objection: "Own note: the kimi round-1 first attempt timed out at 300s and is journaled as ok:false; only the retry counts."
    status: DISCLOSED
    resolution: "Recorded in council-journal.jsonl. Journal timestamps are the result-file times of the dispatches; council_journal.py was not used at dispatch."

