dissent:
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · PortalChallengeWidget.tsx · a Round 2 team total of 0 (points
      cancelling between positive and negative entries) triggered the
      alphabetical zero-state fallback in RankingList, hiding real rank
      differences. CURED in fd8ff31a47: `isZeroState` now requires EVERY
      entry to have 0 points AND no `last_event_at`, not just an aggregate
      team_total_points of 0 — verified this session by reading
      PortalChallengeWidget.tsx's isZeroState computation directly.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · ChampionArena.tsx · an untouched member (0 points, no events)
      could occupy the top-3 podium slice and render a numeric "#N" rank it
      had not earned; `isRanked` existed but was not applied to the podium's
      `leaders` array. CURED in 42b6be7196: `leaders` is now
      `entries.filter((entry) => isRanked(entry, round2)).slice(0, 3)` —
      verified this session by reading ChampionArena.tsx directly.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · PortalChallengeWidget.tsx (3 new labels) · new Round 2 text
      used 10px, below the R19 11px minimum this file's own sibling PRs
      (#7624/#7625) guard. CURED in fd8ff31a47 (labelled "Three new 10px
      labels raised to the 11px minimum"): `grep -c "text-\[10px\]"` inside
      this branch's own diff for PortalChallengeWidget.tsx returns 0 this
      session; every new label in the diff is text-[11px].
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.tsx:780 · the ranking row's document-
      bonus chip showed the raw bonus COUNT ("+2 dok") instead of its point
      contribution (3 per bonus = 6), inconsistent with the registration/
      penalty chips which were already points. CURED in fd8ff31a47: the
      chip now renders `3 * (entry.document_bonuses ?? 0)` — verified this
      session by reading the current line directly.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.tsx:596 · Misi Asya's progressbar had
      no accessible name. CURED in fd8ff31a47:
      `aria-label={`Progres misi ${mission.display_name}`}` is present on
      the role="progressbar" element — verified this session by reading
      the current line directly.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.test.tsx · the empty-tiers test only
      asserted the render did not throw, which cannot detect a stray
      zero-argument Math.max call (it returns -Infinity without throwing).
      CURED in 8ea81055b5: a dedicated
      "PositionScale guards Math.max on an empty tiers array with a sane
      0-width bar" test now asserts aria-valuenow="0" and a 0% bar width —
      verified this session by reading the current test body.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.test.tsx · the rank-prize test checked
      only rows 1 and 5 and one holder, missing intermediate rows/amounts
      and tie handling. CURED in 8ea81055b5: the rewritten
      "renders all five prizes in order, holder points, a tie, and never a
      0-point winner" test now asserts all five prize amounts, the rank-1
      holder's points, a tied rank-2 pair sharing one prize, empty ranks
      3/4, and a 0-point rank-5 candidate showing "Belum ada" — verified
      this session by reading the current test body.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.test.tsx:1015 · OPEN, not cured. The
      "shows the Asya mission card with progress and breakdown" test
      asserts the display name, "13/60", the target-points sentence, and
      the +15/-2 breakdown chips, but still does not assert the prize
      amount (Rp 1.000.000), the `reached` boundary state, or a clamped
      progress value below 0 / above target — exactly the gap the review
      named. Not touched by 8ea81055b5 (its diff only rewrites the
      rank-prize and Math.max tests). Verified this session by reading the
      current test body; no fix commit exists on this branch for it.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.test.tsx:1026 · OPEN, not cured. The
      "shows the frozen September results with the choice label" test only
      checks the rendered (collapsed section's) textContent for a name and
      the "Ambil hadiah" string; it never toggles the `<details>`
      disclosure open, and never asserts full ranking order, prize amounts,
      or the "Bawa poin ke Oktober" (carry) choice label. Not touched by
      8ea81055b5. Verified this session by reading the current test body;
      no fix commit exists on this branch for it.
