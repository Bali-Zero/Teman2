dissent:
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · PortalChallengeWidget.tsx · a Round 2 team total of 0 (points
      cancelling between positive and negative entries) triggered the
      alphabetical zero-state fallback in RankingList, hiding real rank
      differences. CURED in fd8ff31a47: `isZeroState` now requires EVERY
      entry to have 0 points AND no `last_event_at`, not just an aggregate
      team_total_points of 0 — verified this session by reading
      PortalChallengeWidget.tsx's isZeroState computation directly.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · ChampionArena.tsx · an untouched member (0 points, no events)
      could occupy the top-3 podium slice and render a numeric "#N" rank it
      had not earned; `isRanked` existed but was not applied to the podium's
      `leaders` array. CURED in 42b6be7196: `leaders` is now
      `entries.filter((entry) => isRanked(entry, round2)).slice(0, 3)` —
      verified this session by reading ChampionArena.tsx directly.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · PortalChallengeWidget.tsx (3 new labels) · new Round 2 text
      used 10px, below the R19 11px minimum this file's own sibling PRs
      (#7624/#7625) guard. CURED in fd8ff31a47 (labelled "Three new 10px
      labels raised to the 11px minimum"): `grep -c "text-\[10px\]"` inside
      this branch's own diff for PortalChallengeWidget.tsx returns 0 this
      session; every new label in the diff is text-[11px].
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.tsx:780 · the ranking row's document-
      bonus chip showed the raw bonus COUNT ("+2 dok") instead of its point
      contribution (3 per bonus = 6), inconsistent with the registration/
      penalty chips which were already points. CURED in fd8ff31a47: the
      chip now renders `3 * (entry.document_bonuses ?? 0)` — verified this
      session by reading the current line directly.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.tsx:596 · Misi Asya's progressbar had
      no accessible name. CURED in fd8ff31a47:
      `aria-label={`Progres misi ${mission.display_name}`}` is present on
      the role="progressbar" element — verified this session by reading
      the current line directly.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.test.tsx · the empty-tiers test only
      asserted the render did not throw, which cannot detect a stray
      zero-argument Math.max call (it returns -Infinity without throwing).
      CURED in 8ea81055b5: a dedicated
      "PositionScale guards Math.max on an empty tiers array with a sane
      0-width bar" test now asserts aria-valuenow="0" and a 0% bar width —
      verified this session by reading the current test body.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.test.tsx · the rank-prize test checked
      only rows 1 and 5 and one holder, missing intermediate rows/amounts
      and tie handling. CURED in 8ea81055b5: the rewritten
      "renders all five prizes in order, holder points, a tie, and never a
      0-point winner" test now asserts all five prize amounts, the rank-1
      holder's points, a tied rank-2 pair sharing one prize, empty ranks
      3/4, and a 0-point rank-5 candidate showing "Belum ada" — verified
      this session by reading the current test body.
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.test.tsx:1015 · the "shows the Asya
      mission card with progress and breakdown" test did not assert the
      prize amount, the `reached` boundary state, or a clamped progress
      value below 0 / above target. CURED in 87f6133335 ("test(kita): close
      the Misi Asya and Hasil September evidence gaps"): the renamed test
      now asserts the prize line ("Target 60 poin — hadiah Rp 1.000.000"),
      plus three new dedicated cases — "Misi Asya is not reached at 59/60",
      "is reached at 60/60, progress bar at exactly 100%", and "progress
      bar stays capped at 100% when points exceed the target" — verified
      this session by reading the current test bodies and by the full
      vitest run (104 passed).
  - seat: codex-fe-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · PortalChallengeWidget.test.tsx:1026 · the "shows the frozen
      September results with the choice label" test only checked the
      collapsed section's textContent for a name and "Ambil hadiah",
      never toggling the disclosure or asserting ranking order, prize
      amounts, or the "Bawa poin ke Oktober" (carry) label. CURED in
      87f6133335: the renamed test "Hasil September discloses the frozen
      ranking, prize per row, and both choice labels" now clicks the
      `<details>` summary and asserts `details.open` flips true, the
      #1/#2/#3 name order, all three prize amounts, and both choice labels
      appearing (2× "Ambil hadiah", 1× "Bawa poin ke Oktober") — verified
      this session by reading the current test body and by the full
      vitest run (104 passed).
  - seat: claude-opus-5-5 xhigh (fresh final on-disk gate, outside the chain)
    status: PLAUSIBLE
    objection: >-
      N1, non-blocking · the PositionScale empty-tiers test cannot actually
      fail: `Math.max(...[])` already yields `-Infinity` on unpatched code,
      and the component's own clamping already turns that into a 0-width
      bar on main — the test asserts a true fact but cannot distinguish the
      guarded code from the unguarded one.
  - seat: claude-opus-5-5 xhigh (fresh final on-disk gate, outside the chain)
    status: PLAUSIBLE
    objection: >-
      N2, non-blocking · Misi Asya's progress-below-zero case is clamped in
      code (Math.min(100, Math.max(0, ...))) but has no dedicated test at
      the lower bound (only the upper-bound 100%-cap case is tested); the
      progressbar's aria-label is present in the markup but no test asserts
      it.
  - seat: claude-opus-5-5 xhigh (fresh final on-disk gate, outside the chain)
    status: PLAUSIBLE
    objection: >-
      N3, non-blocking · MyPositionCard/RankingRow hardcode the document-
      bonus (3), unanswered-request (-2) and unreviewed-document (-1)
      point multipliers as literals, while RulesDrawer reads the same
      values from `data.scoring.*` with fallback defaults — a future
      scoring-constant change server-side would silently desync the two
      surfaces. Verified this session: `3 * (me.document_bonuses ?? 0)` /
      `3 * (entry.document_bonuses ?? 0)` are literal at
      PortalChallengeWidget.tsx:385/786, vs. `scoring?.first_document ?? 3`
      etc. at lines 1041-1079.
