  - claim: "Cross-family refuter (qwen3.8-max, fresh context) on the raw diff — verbatim verdict"
    cmd: "python3 scripts/tp1_call.py --model qwen3.8-max --task-file review_task_2.txt --effort medium --max-tokens 3000 --no-stream"
    result: |
      NO_DEFECTS

      **What I checked:**

      1. **`if`→`elif` refactor preserves the original branch structure.** The old `if [ -x "$CASCADE_BIN" ]` becomes `elif [ -x "$CASCADE_BIN" ]` under the new gate test. The `else` arm (visible as context) is still reached only when the gate did *not* fire SKIP/DEGRADE **and** `CASCADE_BIN` is absent — identical to the pre-patch condition. The CASCADE_BIN invocation line and `EXIT=$?` are untouched context. No branch is lost or reordered.

      2. **Fail-open contract is honoured.** `QUOTA_GATE_RC` is initialised to `0`. It is overwritten only when the gate is both enabled *and* executable. Any unexpected rc (1, 2, 127, 128+signal, etc.) fails the `-eq 3 / -eq 4` test and falls through to the `elif`, running CASCADE_BIN normally. Gate binary missing, kill-switch set, or gate crashing all result in rc 0 → GO path. No fail-closed path exists.

      3. **Kill-switch semantics.** `[ "${REGWATCH_QUOTA_GATE:-1}" != "0" ]` defaults to enabled when unset, disables only on the literal string `0`. Correct.

      4. **zsh compatibility.** `$?` capture, `[ … -eq … ]` numeric tests, `$( … )` command substitution, `>>`/`>` redirections, `&&`/`||` inside `$()` — all valid in zsh without `-e`. No bashisms that would misbehave.

      5. **`$TMPOUT` write in the skip arm** uses `>` (truncate), matching the CASCADE_BIN invocation's `>"$TMPOUT"`. Downstream consumers see a short placeholder instead of cascade output, consistent with a tier-1 failure producing error text in the same file.

      6. **`EXIT=75` and cascade continuation.** The wrapper deliberately omits `-e`; execution falls through to tier 2 regardless of EXIT's value. The comment's claim ("exactly as an ordinary tier-1 failure") holds under the sequential-cascade model described in the context. Without seeing tier-2 guards I cannot prove 75 is mishandled, and nothing in the visible diff contradicts the stated intent.

      7. **Path / TOCTOU.** `$HOME/.tokenaudit/ingest/quota_gate.sh` follows the same pattern as the existing `CASCADE_BIN` (comment confirms "same shape"). The `[ -x … ]`-then-execute window is the same race that already existed for CASCADE_BIN; no new exposure.

      8. **Log redirection.** Gate stdout+stderr → `>>"$LOG" 2>&1` keeps the gate's diagnostic output in the log without polluting `$TMPOUT`. Correct separation.

      No wrong shell semantics, no broken exit-code contract, no fail-closed where fail-open was promised, no contradictory value.
    exit: 0
    ts: "2026-09-01T20:47:00Z"
    seat: tp1-qwen3.8-max (DashScope/TP1)
