dissent:
  - seat: codex-gpt-5.6-sol at effort xhigh, cross-family, fresh context
    status: CONFIRMED
    objection: >-
      Convened 2026-09-02 and converged, with no shared context, on the same
      defeating input the TP1 seat found on the same day: a gate that exits 0
      but prints (for example `echo GO; exit 0`) still appends to $LOG through
      the redirection on the gate call, so this block's own comment claiming a
      GO gate is "byte-identical to before" was FALSE. The label was wrong, not
      the code — the Claude tier-1 call still proceeds exactly as before. CURED
      in this push by rewriting that sentence to say the cascade behaves as
      before while the gate's own line is appended to the log. Two independent
      seats naming the identical mechanism is why this was cured rather than
      argued.
  - seat: tp1-qwen3.8-max (DashScope/TP1), cross-family, fresh context
    status: RETRACTED
    objection: >-
      Attacked eight surfaces (if->elif branch preservation, fail-open on every
      non-{3,4} rc, kill-switch semantics, zsh compatibility, TMPOUT truncate
      semantics, EXIT=75 cascade continuation, -x/execute TOCTOU vs the
      pre-existing CASCADE_BIN pattern, log redirection) and found none —
      NO_DEFECTS, verbatim in receipts. Reported as a retraction, not consent.
  - seat: session (Pro), self-caught
    status: PLAUSIBLE
    objection: >-
      A SKIP/DEGRADE verdict routes the run to tier 2 (agy), which on this
      machine hangs past its own --print-timeout when called directly
      (tokenaudit D-016, measured 2026-09-02): the gate can therefore turn
      "one wasted Claude call" into "up to a hung job" on a high-quota day.
      Same path the wrapper already takes on a real tier-1 quota failure, so
      not new exposure — but the gate makes it MORE likely to be taken.
      NOT CURED HERE: removing/bounding agy in the shared cascade is a
      library change awaiting Zero (Q13).
  - seat: session (Pro), self-caught
    status: PLAUSIBLE
    objection: >-
      The gate's SKIP threshold reads the BEST seat's weekly percentage, while
      claude-cascade.sh --claude-only walks the seats in its own fixed order:
      a GO from the gate does not guarantee the first seat tried has margin,
      only that some seat does. The gate prevents the all-seats-exhausted
      case, not per-seat ordering waste. Declared limit of the design, not a
      defect of this diff.
