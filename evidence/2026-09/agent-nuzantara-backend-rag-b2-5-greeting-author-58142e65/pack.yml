vulnerabilities:
  - id: V1-private-planner-import
    severity: declared
    what: "wa_package_builder reads query_planner._DOMAIN_COLLECTIONS to build GENERAL's collections."
    disposition: "A rename in query_planner breaks the import loudly at import time (not silently); a public accessor is a follow-up outside B2.5."
  - id: V2-planner-greeting-with-content-builds-general-only
    severity: named-and-open
    what: >-
      gate-6498 C5 (record-only): a planner-GREETING text that carries content
      (e.g. 'Selamat pagi, saya mau buka PT') now builds GENERAL, i.e.
      legal_unified_hybrid + training_conversations_hybrid only, without the
      kbli/visa collections a keyword-classified question would reach.
    disposition: >-
      Before this PR the same text fell off unbuildable through five attempts;
      now it reaches the support-judged path with a narrower collection set and
      ends in a supported answer or a terminal stub. Widening GENERAL for these
      rows is a retrieval decision outside B2.5.
  - id: V3-one-ordinal-only
    severity: declared
    what: "Only ONE leading list ordinal is stripped; '11.  11.  Halo' builds as GENERAL instead of getting the scripted greeting."
    disposition: "By design (the regex is anchored and count=1); the GENERAL build still ends in an answer or a terminal stub, never a retry loop."
  - id: V4-router-comment-overstates-general-prefetch
    severity: record-only
    what: >-
      gate-6498: the wa_package.py comment and the router test name speak of
      prefetching curated QA for a 'general' domain, but curated_qa_grounding_block
      returns '' for 'general' without any I/O.
    disposition: "Wording only; not changed here because the successor must stay blob-identical to the gated head."
