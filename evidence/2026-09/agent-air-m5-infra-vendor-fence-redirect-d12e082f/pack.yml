unresolved:
  - "paths is a SHAPE requirement on the entry, not a per-request perimeter: nothing threads a target file path into authorized() to check it against the entry's globs. Named as MEDIUM/HIGH by all three review seats. Deliberately out of scope for this PR per the owning session's mandate (the registry stays empty), and the docstrings in this diff were corrected to say so explicitly rather than imply enforcement that does not exist. The next entry added to the registry is the first place this needs to be wired."
  - "ruling and use are ledger fields read by no code — a dict entry naming only {endpoint, paths} authorizes exactly as much as one that also carries a real ruling. Corrected in prose (this PR no longer claims otherwise), not mechanically enforced. Tying an entry to a real RULINGS.md citation is a further step this PR does not take, same open item PR #6989's own pack recorded."
  - "One client, one list, still true: a second vendor client added elsewhere inherits nothing from this fence unless it reads the same file."
  - "The pre-#6989 baseline for whether catE-sovereignty-lint's new steps are REQUIRED checks (not just running) was never established in that PR's own gate and is not re-verified here — orthogonal to this PR's scope."
