diff:
  behaviour_change: |
    typesafe_client.ask() now opens its request through a module-local OpenerDirector
    that refuses every redirect, closing the GATING condition: authorizing an endpoint
    used to bind the first hop only, and a 302 response would carry the bearer token to
    whatever host the Location header named, even over plain HTTP. authorized() now
    requires a matching dict entry to carry a non-empty list of non-empty string `paths`
    — an entry with no perimeter no longer authorizes, closing the fail-open the
    successor spec identified one level below the file. A bare string entry is skipped
    outright rather than entity-matched and refused, since it can never carry `paths`.
    Four top-level JSON shapes ([], true, 42, null) that raised TypeError out of
    authorized()'s parsing step are now covered. A new test proves ask() returns a real
    parsed answers map when authorized, killing the "return None unconditionally"
    mutant. test_service_silence_is_not_a_pass now actually reaches ask() instead of
    being skipped at the availability gate. The registry ships EMPTY; no vendor is
    authorized by this PR.
  surface: |
    Two edited scripts (typesafe_client.py, test_lint_paid_llm_entity.py), one edited
    test module (test_vendor_authorization_fence.py, 34 tests total — see receipt below),
    one edited JSON doc-string (authorized_endpoints.json, no data change — endpoints
    stays []). No backend, no frontend, no migration, no credential, no workflow file.
