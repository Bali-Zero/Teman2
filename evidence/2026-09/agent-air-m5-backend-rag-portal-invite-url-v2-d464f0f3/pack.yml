      "https://my.balizero.com/portal/register?token=x"; do printf "%s -> " "$U"; curl -s -o /dev/null
      -w "%{http_code}\n" "$U"; done
    result: |-
      https://nuzantara-mouth.vercel.app/ -> 404
      https://nuzantara-mouth.vercel.app/portal/register -> 404
      https://my.balizero.com/portal/register?token=x -> 200
    exit: 0
    ts: "2026-09-10T10:53Z"
    seat: session (M5)
  - claim: >-
      Production is cured ahead of this diff: the machine that serves the invite endpoint sets
      FRONTEND_PORTAL_URL, so its LIVE value can no longer tell this PR apart from its absence
    cmd: >-
      fly ssh console -a nuzantara-rag -C env | grep -E "^(FRONTEND_PORTAL_URL|BACKEND_URL)="
    result: "FRONTEND_PORTAL_URL=https://my.balizero.com  (BACKEND_URL is not set, hence one line)"
    exit: 0
