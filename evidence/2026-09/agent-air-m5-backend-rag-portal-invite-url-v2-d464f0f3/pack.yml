brief_ref: evidence/brief.yml
council_run: journal.jsonl
plan_ref: >-
  No ledger row: this diff was opened from a live measurement taken while preparing the
  Subhi/Krisna/Ari portal pilot — the invitation link's base URL named a host that answers
  404. One concern, one setting and the two halves that compose the link. This branch is a
  RE-LAND: PR #6088 carried the same product code and was suspended under the three-reds
  rule, every red about this pack rather than the code.

lanes:
  - lane: portal-url-ground
    role: read
    seat: >-
      claude-opus-5 (conducting session, M5). Read FRONTEND_PORTAL_URL on the live machine,
      confirmed fly.toml and fly secrets carry no such name, measured both hosts with curl on
      the FULL registration path, read the mouth project's domain list, and counted the
      invitation table in production (242 minted, 7 used, none since 2026-07-10).
  - lane: portal-url-build
    role: build
    seat: >-
      claude-opus-5 (conducting session, M5). Three rounds on #6088. Round 1 changed the
      default and pinned it with 4 cases. Round 2, on the cross-family findings, extracted the
      service's path into INVITE_PATH_TEMPLATE and added a consumer-level test that runs the
      real router with the real default. Round 3, on the gate's findings, moved the
      trailing-slash normalisation off the router and onto the setting as a field_validator,
      deleted the router's local rstrip and the duplicate fake it had needed, and aligned the
      shared fixture with the service's own path template. This branch carries that code
      unchanged, squashed into a single product commit with the pack landing separately.
  - lane: portal-url-refute-crossfamily-1
    role: review
    seat: >-
      codex-gpt-5.6-sol, sandbox read-only, foreground. Read the diff and the repository.
      4 findings, no blocker; 2 cured in the code, 1 declared, 1 named out of scope.
      Verdict in journal.jsonl.
  - lane: portal-url-refute-crossfamily-2
    role: review
    seat: >-
      kimi-code/k3, single-shot prompt, read the repo itself rather than the diff text.
      6 findings, no blocker; 1 cured (trailing slash), 3 declared, 1 out of scope, 1
      refuted with the measurement it doubted. Verdict in journal.jsonl.
  - lane: portal-url-gate-independent
    role: review
    seat: >-
      claude-opus-5, independent Gear-3 gate, fresh dispatch in its own worktree, never reads
      the build lane's reasoning. Four rounds on #6088; the fourth returned BLOCK under the
      three-reds rule and directed the code onto a fresh branch. It re-gates this one.

seat_diversity: satisfied
seat_diversity_note: >-
  One build lane, so D3's non-Anthropic BUILD-seat requirement does not bind by its own
  terms (">= 2 build lanes"). Both named non-Anthropic review seats delivered substantive,
  non-overlapping judgements: codex found the test-design gap (the suite could stay green
  while the real composition rotted) and kimi found the trailing-slash defect neither the
  author nor codex saw. Two of their findings were cured in the code rather than argued with,
  and one of kimi's was refuted with the measurement it questioned.

diff:
  files: 8
  net_lines: 567
  measured_at: >-
    `git diff --numstat $(git merge-base origin/main HEAD)..HEAD` at merge-base ed07dda54c,
    re-run immediately before the commit that lands this value — which replaces one line with
    one line, so it does not move the total it reports. Most of the count is this evidence
    pack; the product half is the same command with `-- apps/`, and the commit that carries
    it states its own numstat in the log.

residual_risks:
  - >-
    The production hostname is now the default in EVERY environment — named independently by
    both review seats. NOT cured here: an environment-aware default would have to read
    `settings.environment` from inside a field default, which pydantic does not do without a
    validator, and adding one widens a one-setting diff into a config-machinery change. The
    exposure is bounded: production sets FRONTEND_PORTAL_URL explicitly, and a dev machine that
    mails a production link is a dev machine whose mail endpoint is deliberately dead.
  - >-
    Two sibling endpoints still report success without mailing anything:
    `portal_invite.resend_invitation` returns "Invitation resent successfully" after minting a
    NEW token (which expires the previous one) and never calls the mailer, and
    `crm_portal_integration.send_portal_invite` returns "Invitation sent to <email>" while only
    minting. Found by codex, verified on disk. Out of scope for a base-URL change, and neither
    is reachable from the workspace panel — its "Send again" button calls
    /api/portal/invite/send, which does mail. Recorded so the next reader does not discover it
    the way this session did.
  - >-
    The tests assert a string, not liveness: if my.balizero.com itself ever stops serving
    /portal/register, this suite stays green. A composed-link liveness probe belongs in the
    deploy QA, not in a unit test, and is a separate change.
  - >-
    The dead `nuzantara-mouth.vercel.app` alias still appears in cors_config.py,
    hybrid_auth.py and apps/mouth/src/lib/api/openapi.yaml. Harmless — an allowed origin that
    resolves nowhere grants nothing — and removing it is a different concern.
  - >-
    The GARUDA outbox consumer has no consumer-level test of its own here. It no longer needs
    one for the trailing slash — that normalisation moved onto the setting, so GARUDA inherits
    it by construction rather than by remembering to repeat it — but nothing in this diff
    exercises `outbox_handlers.py` end to end. Named by kimi, narrowed by the gate; declared.

pii_scan: clean

receipts_note: >-
  Every receipt below was executed as written, in this window, on this branch at 80c1790989,
  and its `result` is what that one command printed — nothing folded in from another
  invocation. This is the discipline whose absence suspended #6088: its first receipt named a
  `fly ssh` command that, re-executed, raised NameError and exited 1 while the receipt claimed
  exit 0, and asserted UNSET for a variable that is now SET. The two `fly` receipts here
  replace it, and the historical "it was unset when the defect was found" is recorded in the
  journal as history, not as a receipt — a past observation is not re-executable and must not
  be dressed as one.

