dissent:
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      The config cases reconstruct the expected URL by hand instead of invoking a consumer, and
      the existing router tests assert a `/portal/invite?token=` link the service has not
      produced for a long time — so the whole suite could pass while the real composition was
      broken. CURED: the path is now a constant on the service (INVITE_PATH_TEMPLATE), and a
      consumer-level case runs the real router with the real default, no monkeypatch.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      The Pydantic field description embedded dated production observations and incident
      history, which will go stale in place. CURED: the description is contractual now and the
      evidence lives in this pack.
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: >-
      Sibling endpoints (resend_invitation, crm_portal_integration.send_portal_invite) claim
      success without mailing. Verified true on disk, but a different defect from a base-URL
      change and unreachable from the panel. Recorded in residual_risks.
  - seat: kimi-code/k3
    status: CONFIRMED
    objection: >-
      No trailing-slash normalisation: the router concatenates base and path raw, so a base
      ending in "/" would mail `//portal/register?token=...`, and every existing case used a
      clean base. CURED — first at the composition point, then, on the gate's finding, on the
      setting itself.
  - seat: kimi-code/k3
    status: RETRACTED
    objection: >-
      "200 on the root proves nothing about /portal/register?token=". The measurement was taken
      on the full path, not the root, and is receipt 1 of this pack.
  - seat: kimi-code/k3
    status: RETRACTED
    objection: >-
      The dead alias lingers in cors_config.py, hybrid_auth.py and openapi.yaml. True and
      harmless — an allowed origin that resolves nowhere grants nothing. Different concern.
  - seat: claude-opus-5 (independent Gear-3 gate, round 1)
    status: CONFIRMED
    objection: >-
      The trailing-slash cure sat inside the invite router, but `garuda_orders/outbox_handlers.py`
      passes the same setting as `portal_base_url` and would still have mailed `//portal/...`.
      CURED at the source: a `field_validator` on `frontend_portal_url`; the router's local
      `rstrip` removed as redundant; the case moved into the settings suite, where it binds both
      consumers. Also in the same round: the declared prove-live observation read
      `settings.frontend_portal_url` on a machine that already sets the env var, so it would have
      been green with or without the diff — CURED, the observation now pops the variable and
      constructs Settings (receipt 3); and the shared FakeInviteService fixture still minted the
      stale path — CURED, it reads INVITE_PATH_TEMPLATE.
  - seat: claude-opus-5 (independent Gear-3 gate, rounds 2 and 3)
    status: CONFIRMED
    objection: >-
      Nine findings across two rounds, every one about the pack rather than the code: an
      acceptance probe naming a deleted test, a build lane narrating only the first round,
      receipts carrying counts measured before the test existed, receipts written as prose where
      a command belongs, an innocence result folding three invocations into one line, an
      assumption contradicting its own risk entry, and a stale net_lines. Cured round by round
      on #6088 and carried into this pack.
  - seat: claude-opus-5 (independent Gear-3 gate, round 4 — BLOCK)
    status: CONFIRMED
    objection: >-
      "Receipt 1 untouched: NameError/exit 1 vs exit:0, result UNSET but both vars SET. 3rd red
      same cause — suspend, re-land code on a fresh branch." Right on all three counts: that
      receipt's `fly ssh` command omitted `import os` and could never have exited 0, and the
      variable it reported as UNSET had since been set. Three rounds of doc-only reds is the
      signal the rule names. CURED by this branch: #6088 closed as superseded, the product code
      re-landed unchanged in one commit, the broken receipt replaced by two that were executed
      as written here (receipts 2 and 3), and every remaining receipt re-executed on this branch
      rather than copied forward.
