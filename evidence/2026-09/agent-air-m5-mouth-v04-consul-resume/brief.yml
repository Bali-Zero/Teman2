task_id: v04-consul-resume
gear: 2
l_level: L2
gate_class: opus
objective:
  Keep consultant contact available after session hydration, default open at actual verdict and collapsed
  at interview entry. Require fresh scoped consent and known-minor guardian authority without sending interview
  answers.
constraints:
  - Eight existing frontend source/test/style files plus lane evidence.
  - No engine, eligibility, pricing, regulatory claims or client data.
  - Fresh branch from main after PR5762 merged; original prepared branch remains untouched.
  - Prepare draft PR only; Fable owns independent Anthropic gate and shipping.
acceptance:
  - text:
      WHEN hydration completes, the user SHALL have consultant contact available in each interview phase without
      losing interview state or triggering evaluation.
    probe: apps/mouth/src/app/(visa-oracle)/visa-oracle/_components/OracleShell.test.tsx
  - text:
      WHEN contact scope changes between consultation and a displayed assessment, previous consent SHALL NOT authorize
      the new scope; a known minor SHALL require guardian authority.
    probe: apps/mouth/src/app/(visa-oracle)/visa-oracle/_components/ConsentHandoff.test.tsx
  - text:
      The consultant disclosure SHALL support keyboard focus return, contain one handoff instance, fit mobile
      viewports in both languages and remain hidden in print.
    probe: apps/mouth/src/app/(visa-oracle)/visa-oracle/_components/OracleShell.test.tsx
  - text:
      WHEN a verdict is displayed, the consultant disclosure SHALL already be open without an opening gesture;
      guardian, link and QR assertions SHALL retain their prior behavior.
    probe: apps/mouth/e2e/visa-oracle-v2.spec.ts
  - text:
      Before session hydration completes there SHALL be no consultant checkbox; at a displayed verdict the disclosure
      SHALL start open, and after Edit it SHALL start collapsed with fresh consent.
    probe: apps/mouth/src/app/(visa-oracle)/visa-oracle/_components/OracleShell.test.tsx
consumer_map:
  - Visa Oracle visitors use the persistent consultant disclosure in every interview phase.
risks:
  - Current browser evidence covers four targeted desktop/mobile cases on the Pro development runtime. Historical
    responsive and CI results predate this correction; fresh full CI follows the commit.
  - Independent Fable gate and production shipping remain pending.
grader: Kimi K3 PASS13:30:01Z on corrective source; independent Fable re-gate pending.
budget: Existing subscriptions and installed tooling only; no paid API calls.
pii: none
