    No Claude model through a paid per-token Anthropic endpoint, by any alias, wrapper, Bedrock or
    Vertex route. No client PII or OSINT in cleartext: this window read prod only through
    information_schema.tables — table NAMES, never a row.
  - >-
    No credential in a plist. Measured instead of assumed: scripts/pg.sh reads its credential from
    a 0600 file in $HOME (~/.nuzantara-pg-readonly.env, overridable by NUZANTARA_PG_RO_CRED_FILE),
    NOT from an env var, and it runs to exit 0 under `env -i` with HOME and PATH only. So a
    launchd job with HOME set reaches the credential and the plist stays clean — S3's
    "stop if the probe needs a credential launchd lacks" condition resolves in the NEGATIVE.
