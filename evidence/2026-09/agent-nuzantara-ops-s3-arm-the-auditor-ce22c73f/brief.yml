withheld_artifact:
  path: infra/launchagents/com.nuzantara.proprioception.plist
  state: >-
    BUILT, LINTED, MEASURED — and deliberately NOT shipped. It is in the worktree and in no PR.
    Recorded here so the next window does not rebuild it from scratch, and does not ship it
    without re-reading S3-F1 first.
  measured_anyway:
    - "a full 16-probe run is 18.4 s wall on Pro — 1% of the 1800 s interval it declares, so the rollback trigger 'runs longer than its own interval' has two orders of magnitude of margin"
    - "under `env -i` with HOME and PATH only (the launchd shape), the 16 per-probe verdicts are IDENTICAL to an interactive shell's — diff empty, exit 0. No probe degrades to UNPROBEABLE for want of environment"
    - "no strict flag: it exits 1 exactly when a P1 has DIVERGED, i.e. when the organ is doing its job, which would make every healthy run read `last exit code = 1`"
  scar_paid_building_it: >-
    An XML comment may not contain a double hyphen. `plutil -lint` ACCEPTS one anyway and prints
    OK; expat — which scripts/lint_plist_keepalive.py uses — refuses the whole file and reports
    the plist as unreadable/unparseable (ExpatError, exit 4). A green plutil is NOT evidence that
    a plist parses for the repo's own linters. CLI flags are now spelled in words in that comment.
residuals_recorded_not_built:
  - text: >-
      The healer runs proprioception with --no-fetch, so git_alignment is judged against a local
      ref rather than a fetched origin/main. A real fidelity gap, small, and NOT S3's to fix:
      pro-healer.sh is outside S3's section-2 perimeter.
    owner: the healer organ's owner, via the staff room
  - text: >-
      Scheduling is coupled to the healer's own liveness: if the healer dies, the auditor stops
      with it and the 48 h receptor is the only thing that says so.
    owner: the healer organ's owner, via the staff room
  - text: >-
      pro-healer.sh does not export PROPRIOCEPTION_INVOKED_BY, so any invoked_by field added later
      reads UNSET on the healer's path while reading `launchd` on a dedicated agent's path. An
      invocation field that only knows one of the two live invokers is not complete.
    owner: whoever ships invoked_by (S3's probe PR, or #6054)
