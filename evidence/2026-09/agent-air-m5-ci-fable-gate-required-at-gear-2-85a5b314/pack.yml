    one line of the modus skill. Floor is `path` (hot-zone
    `.github/workflows/*`), never size — the code half sits far under the
    Gear-2 size threshold, not near it.
  shape: >-
    Two `if:` expressions changed, one step renamed on each side, three
    comment blocks rewritten (the file header's opening paragraph plus a
    dated WIDENED note, Step 7a's block, Step 7c's block), one error-message
    string in Step 5c, one appended test section of six static pins, one
    dated ruling block, one bullet in the modus gate-rule list. No step
    added or removed, no script touched, no permission changed.
behaviour_change: >-
  YES, CI-visible and deliberate: every PR whose brief declares gear 2 now
  fails the required `Harness floor recompute` check until a fresh gate
  session posts `harness/fable-gate` success on its head sha. Gear 1 and
  floor-1/no-brief PRs are unaffected. THIS PR is itself floor 3, so it is
  the first PR gated by the rule it ships.
