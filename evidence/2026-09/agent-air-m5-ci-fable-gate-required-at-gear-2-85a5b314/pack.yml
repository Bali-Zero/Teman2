dissent:
  - seat: kimi-code/k3 (cross-family)
    status: CONFIRMED
    objection: >-
      OK, no BLOCK. It raised and then resolved one candidate defect — that
      the "Gate commission depth" reference added by the 7c comment and by
      the RULINGS block might be dangling — and found the section at
      SKILL.md:298, so it is not. Its one standing observation is an
      accepted consequence rather than a defect: posting a commit status
      does not retrigger a workflow, so a Gear-2 PR that ran red at PR-open
      needs a rerun of its own `pull_request` run before the rollup clears.
      The merge_group run re-reads the verdict fresh at queue time, so the
      queue path self-heals, and both SKILL.md and RULINGS.md document that
      operating order explicitly. CONFIRMED because the check it ran (the
      guilt mutation) produced a real, independently reproduced result, and
      because its Step-6 finding strengthened the partition argument.
  - seat: codex-gpt-5.6-sol (cross-family)
    status: CONFIRMED
    objection: >-
      OK, no BLOCK, no residual finding. Recorded as CONFIRMED for what it
      DECLINED to claim: it could not run the test corpus (read-only
      sandbox, no writable tmpdir) and said so instead of asserting a run it
      never made — the anti-hallucination boundary working in a reviewer
      rather than in a builder. Its independent yaml.safe_load of the live
      workflow is the reason its OK is worth more than a reading of the
      diff text would have been.
  - seat: claude-opus-5 (this worktree session — the builder's own standing objection)
    status: PLAUSIBLE
    objection: >-
      The way this change could be wrong, stated plainly: it raises the
      severity of a gap the file header already discloses. Nothing verifies
      WHO posted a `harness/fable-gate` verdict — any credential with
      `statuses: write` can post success on any sha — and this PR grows the
      set of merges that depend on that unauthenticated status from the
      Gear-3 tail to every mid-size diff in the fleet. It is tracked as
      design gap (b) of the 2026-08-10 PENDING-ARMS entry and is explicitly
      out of this PR's scope; the header note is updated to say the severity
      went up again rather than leaving the old wording to understate it.
      The second, smaller risk is throughput: every Gear-2 PR now needs a
      fresh gate session, which is a real cost the ruling accepted
      knowingly.
