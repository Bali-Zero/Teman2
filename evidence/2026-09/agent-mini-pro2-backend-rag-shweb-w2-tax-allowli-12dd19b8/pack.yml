pii_scan_note:
  "Every address in the diff, the tests, this pack and the PR body is an internal @balizero.com
  staff mailbox — no client name, company, phone, passport, NPWP, NIB or client_id appears
  anywhere. The live database proof ran against a throwaway local database (nuz_r5_mig319,
  dropped-and-recreated at the start of the run) seeded with synthetic rows named 'Synthetic
  Alpha/Bravo/Charlie/Delta Ltd'; production data was never read, copied or transcribed. The row
  counts quoted (2 clients, 12 LKPM reports) are counts, not rows."
dissent:
  - seat: claude-opus-5 (conducting, against its own candidate)
    objection:
      "Deploy ordering leaves a real window. `release_command` applies 319 BEFORE the new code
      serves traffic, so for the duration of the rolling deploy the OLD code is live against the
      NEW constraint: a tax member assigning in that window submits a retired alias, the old
      validator accepts it, and Postgres refuses the write with a CheckViolationError."
    status: accepted-with-mitigation
    resolution:
      "Not curable inside one PR — removing the window needs two deploys (normalize first, then
      the constraint), which costs a day for a failure mode that lasts minutes. Measured
      mitigation instead: this deploy lands at ~02:30 WITA, when no tax consultant is working,
      and the failed gesture is retryable with no data loss. Stated as the rollback trigger in
      the PR body rather than left for someone to discover from a 500."
  - seat: claude-opus-5 (conducting)
    objection:
      "The rollback cannot distinguish a row that legitimately started using tax@balizero.com
      AFTER the migration from a pre-migration row still on the ghost, and will revert both."
    status: accepted
    resolution:
      "Kept, stated in the migration header under 'HONESTY ABOUT WHAT THIS CANNOT RESTORE'. The
      alternative — a column recording which rows 319 touched — is more schema than the defect
      is worth, and the rollback is an emergency path, not a routine one."
  - seat: claude-opus-5 (conducting)
    objection:
      "The kita dropdown still sends the retired addresses, so after this merges a client saved
      through it comes back from the API on the REAL address, which that dropdown has no option
      for: the select will render as '— not assigned —' even though the client IS assigned."
    status: accepted-open
    resolution:
      "Real, and it is why this window does not stop at the backend: the mouth-side alignment
      ships as a separate PR right after this one (mandate order: PR-3a backend before PR-3b
      mouth). Until it lands the DATA is correct and the WRITE works — only the rendering of the
      current value is wrong."
  - seat: claude-opus-5 (conducting)
    objection:
      "The 'five real addresses' census was measured live against production by the PREDECESSOR
      session, not by this one. Re-verification from this host is blocked: scripts/pg.sh finds no
      Keychain password for target=prod on Mini."
    status: accepted-with-independent-corroboration
    resolution:
      "Not left on a single inherited measurement: two independent registers on disk agree with
      it — apps/mouth/src/data/team-roster.ts carries faysha.tax@balizero.com, and
      team-public-listing.ts documents the slug/email disagreement explicitly ('the roster slug
      is faisha, the email prefix is faysha.tax'). Declared as inherited rather than restated as
      if this session had run the query."
