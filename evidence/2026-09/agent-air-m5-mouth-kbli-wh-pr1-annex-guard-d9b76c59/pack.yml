decisions:
  - id: D1
    what: >-
      Read the entity's "basis" from a record's `pma_kondisi` + `pma_nota` + `pma_source`
      + `pma_official_basis` fields only — never `l4_bali`.
    why: >-
      Measured: the four already-certified Lampiran II codes (95291, 96100, 96210, 96220)
      carry a legacy `l4_bali.rule` of literally "per-scala-Besar (OSS risk at scale
      Besar; PMA is Besar by law)" and `l4_bali.verdict: NO_BESAR" — stale internal labels
      predating the 2026-08-03 withdrawal that the client-facing `l4_bali.reason` (guarded
      separately by `test_withdrawn_umkm_inference_absent.py`) already overrides. Scanning
      `l4_bali` here would convict the codes this gate exists to protect.
    alternatives_rejected: >-
      Scanning `l4_bali.reason` too (belt-and-suspenders): rejected because it is already
      the exact scope of the existing antidote, and merging scopes would duplicate a
      passing gate rather than close a gap.
  - id: D2
    what: >-
      Accept a bare `pma_source` citation of "Perpres 10/2021" (no per-code Lampiran
      locator) as sufficient basis ONLY when `pma_status == TERTUTUP` and
      `pma_official_basis` is empty.
    why: >-
      Measured: all 60 TERTUTUP/declared_gap records on origin/main express their basis
      this way (absolute Pasal 2 closures — narcotics cultivation, gambling, government
      monopolies — cite the base instrument bare, never a numbered annex row). Requiring a
      Lampiran citation uniformly would fail all 60 today.
    alternatives_rejected: >-
      A broader "any Perpres 10/2021 mention" bypass regardless of status: rejected
      because the #6488 guilty fixture's `pma_source` ALSO mentions "Perpres 10/2021" (as
      part of "Perpres 10/2021 Pasal 7(1)") — gating the bypass on `pma_status ==
      TERTUTUP` keeps it from accidentally covering the guilty TERBATAS fixture.
  - id: D3
    what: >-
      Exclude a bare `per_skala` substring from the scale-absence trigger regex.
    why: >-
      Measured: 3 of 52 cure_spec files mention `per_skala` in passing (describing OSS
      scale rows or a sibling code's data quality) with no 0%-verdict reasoning nearby
      (`l4_withdrawn_umkm_prose.json`, `editorial_body_national_scope.json`,
      `gold_86101_government_hospital_2026_08_07.json`); a bare match would have been
      family #3 over-match. The actual #6488 fixture text never uses the field name
      `per_skala` — it argues in natural language ("no Usaha Besar scale") — so dropping
      the bare trigger loses no real guilt-catching power.
  - id: D4
    what: >-
      Scope the cure_specs sweep to the `items[].locator` schema (13 live entries across
      2 files) rather than every file mentioning `pma_max_asing` (21 files) or every file
      containing the literal `pma_max_asing: 0` (9 files).
    why: >-
      Measured: every `pma_max_asing: 0` occurrence in the 9-file set sits under an
      `expect` key — a precondition the spec asserts before editing an unrelated prose
      field (`whoThisIsFor`, `whatChanged`), never a value the spec itself writes. The
      `items[].locator` schema is the one `apply_umkm_reservations.py` (named in
      WH-COMMON.md's reuse-first list) actually reads to WRITE a fresh 0% cap. A
      whole-file-text sweep over the 21/9-file sets produces false guilt: several
      editorial specs quote the withdrawn sentence verbatim in an `old` field as the text
      being REMOVED (evidence of the cure, not the claim).
    alternatives_rejected: >-
      Whole-file text sweep (simpler, but measured to false-positive on
      `l4_withdrawn_umkm_prose.json` and `l4bali_gap_disclosure_2026_07_25.json`, both of
      which quote the withdrawn wording as history, not as a live basis).
  - id: D5
    what: >-
      Finding 1 (UNDER-match): gate the TERTUTUP bare-citation bypass on an ADDITIONAL
      condition — no mention of "scale"/"skala" anywhere in `pma_kondisi`+`pma_nota`.
    why: >-
      Codex review reproduced a record with `pma_status=TERTUTUP`, empty
      `pma_official_basis`, bare `pma_source="Perpres 10/2021, 49/2021"`, and a `pma_nota`
      arguing OSS licenses only Mikro/Kecil scale — the old bypass accepted it
      unconditionally. Measured before curing: none of the 60 real TERTUTUP records on
      origin/main mention scale/skala, so the tightened bypass costs nothing today.
  - id: D6
    what: >-
      Finding 2 (UNDER-match): widen `SCALE_ABSENCE_BASIS` with the trilingual row/slot-
      absence pattern already proven in
      `apps/mouth/src/lib/kbli-withdrawn-umkm-inference.test.ts`, plus an "only Mikro/
      Kecil scale" alternative (EN/ID).
    why: >-
      The original regex matched only the exact #6488 wording ("no Usaha Besar scale");
      "no large-scale row", "skala Besar tidak tersedia" and "only at Mikro/Kecil scale"
      argued the identical claim and slipped through, including when an unrelated
      Lampiran token sat in the same text. Reused the sibling antidote's regex rather
      than re-deriving one, since it is already battle-tested against the real historical
      wordings. Measured: no false positive on the 79 current 0% records or the 13 (now
      19) live spec entries.
  - id: D7
    what: >-
      Finding 3 (inconsistency): accept an explicit "Pasal 2 ... tertutup" / "daftar
      bidang usaha tertutup" citation directly in `ANNEX_LOCATOR`, instead of only via the
      narrower bare-citation bypass.
    why: >-
      A record with a POPULATED `pma_official_basis` naming Pasal 2 explicitly was being
      rejected (the bypass requires an EMPTY `pma_official_basis`), while a vaguer record
      with no `pma_official_basis` at all was accepted — a more specific, better-evidenced
      locator was scoring worse than a vaguer one. The new alternative is gated by the
      unconditional `SCALE_ABSENCE_BASIS` check running first, so a stray Pasal 2 mention
      next to a real scale-absence argument still fails (test:
      `test_finding3_guilt_a_stray_pasal2_mention_does_not_launder_scale_absence`).
  - id: D8
    what: >-
      Finding 4 (OVER-match): drop the bare "PMA is Besar by law" trigger from
      `SCALE_ABSENCE_BASIS`.
    why: >-
      That sentence states the TRUE premise P1 of the withdrawn #6488 argument (a PMA
      must be Usaha Besar under BKPM 5/2025 Pasal 26(1)) and is legitimate anywhere,
      including beside a real Lampiran II locator. Only the FALSE step P2 — the ABSENCE
      of a scale row, or an "only Mikro/Kecil" OSS offering, used AS the reason for 0% —
      is guilt, and D6's row/only-small-scale alternatives already catch that
      independently. Verified the actual #6488 guilt fixture (`test_guilt_the_6488_patch_
      is_refused`) is still refused without this trigger (it matches "no Usaha Besar
      scale" regardless).
  - id: D9
    what: >-
      Finding 5: rewrote the cure_specs sweep as a generic tree-walker over every dict
      carrying `pma_max_asing` or `locator` directly, skipping any subtree rooted at a
      precondition/snapshot key (`expect`, `was`, `old`, `excluded`, `withdrawn_items`,
      `withdrawn`) — replacing the narrower `items[].locator`-only sweep.
    why: >-
      The original sweep would silently miss a resurrected `to_patch`-shaped spec (#6488's
      own schema: `{code: {pma_status, pma_max_asing, ...}}`), since that shape carries no
      `locator` field. The generic walker recognises `to_patch`/`set`/`patch` (dict-of-
      code) and `items`/`patches` (list-of-{code,...}) without hardcoding those names,
      correctly finds 19 live write entries on origin/main today (up from the 13 the
      narrower sweep saw — the extra 6 are an 80%-cap sector-law spec, correctly judged
      trivially innocent since it never claims 0%), and a dedicated guilt test proves a
      synthetic to_patch entry is caught.
alternatives_rejected: >-
  D5 alternative (a committed allow-list of the 60 known-good TERTUTUP codes, entity by
  code): rejected in favour of the scale-mention gate — an allow-list would need updating
  by every future PR that adds a genuine new TERTUTUP closure, while the scale-mention
  gate self-maintains and is measured to cost nothing against the current 60.
