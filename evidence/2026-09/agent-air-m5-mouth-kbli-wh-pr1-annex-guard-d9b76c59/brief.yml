  Usaha Besar scale row, therefore reserved for UMKM" inference — this time against the
  path `test_withdrawn_umkm_inference_absent.py` does not cover: the NATIONAL `pma_*`
  verdict tuple (`pma_max_asing`, `pma_kondisi`, `pma_nota`, `pma_source`,
