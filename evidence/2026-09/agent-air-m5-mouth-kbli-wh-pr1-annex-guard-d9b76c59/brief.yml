  found the rule not proven and BKPM 5/2025 Pasal 8(6) saying the opposite; a 0%
  foreign-ownership verdict may rest only on a Perpres 10/2021 (as amended by 49/2021)
  annex/closed-list locator (Lampiran II `dialokasikan`, Lampiran III, or the Pasal 2
  closed list). Two new files: `scripts/kbli_filiera/tests/test_pma_zero_cap_basis.py`
  (canonical + cure_specs sweep) and its mouth-copy twin
  `apps/mouth/src/lib/kbli-pma-zero-cap-basis.test.ts`. No existing file touched, no data
  changed.
