what_changed: |
  4 files (unchanged from the PR's own diff, plus this ceremony's 2 follow-up
  fixes on 2 of those 4 files):

  1. .github/workflows/organ-conformance.yml -- adds the 2 new guard test
     files to on.push.paths and the in-job pathspec, and a new step "A
     self-reporting cron cannot beat faster than its own plist" gated on
     steps.relevant.outputs.hit, requiring >=9 pytest passes via an anchored
     last-summary-line parse (fixes the sibling guard's known multi-match
     bug class). Untouched by this ceremony -- see dissent[] finding 5 for
     why a further fix here was in scope for the review but not for this
     ceremony's edits.

  2. apps/organism/organism/organs_registry.yaml -- raises 28 self-reporting
     cron organs' expected_hb_seconds to a severity-tiered multiple (1.5x
     critical/error, 2.0x else) of each organ's OWN plist StartInterval, one
     comment per organ stating the arithmetic; checksum recomputed
     (88ee800c...). This ceremony additionally corrected 8 of those 28
     comments (m5.auth_sentinel, pro.dlq_autopilot,
     pro.wa_mirror_freshness_liveness, mini.voa_deadman,
     pro.wa_bot_throughput_sentinel, mini.journey_sentinel,
     pro.queue_shepherd, pro.price_review_sentinel) that falsely claimed
     "the old value gave zero margin" when the old ratio was actually
     1.042x-1.5x -- comment-only, checksum unaffected (verified before and
     after via organism.tools.validate_organs_registry).

  3. scripts/tests/test_self_reporting_cron_own_plist_margin.py (new,
     367 lines) -- the arithmetic guard: reads each organ's own plist
     StartInterval (repo-wide git-ls-files scan, plistlib), the registry's
     type:cron organ set minus the bridge's organ_id set (disjoint from
     #5431/#5440's population by construction), and fails on any organ
     below its severity-tiered floor. Never skips. 6 unit tests
     (1 registry-wide scan + guilt/innocence on the predicate itself,
     independent of the registry's current contents).

  4. scripts/tests/test_self_reporting_cron_workflow_wiring.py (new,
     originally 192 lines) -- 3 tests proving organ-conformance.yml's
     push.paths, in-job pathspec, and an actual pytest-invoking step all
     cover the arithmetic guard. This ceremony strengthened
     test_a_step_actually_executes_the_guard_file (codex-gpt-5.6-sol
     finding 2) to also require ITS OWN filename in the matching run text,
     not just its sibling's -- closing a blind spot where this file's own
     removal from the step's invocation would leave its own proof-of-wiring
     test silently green.

