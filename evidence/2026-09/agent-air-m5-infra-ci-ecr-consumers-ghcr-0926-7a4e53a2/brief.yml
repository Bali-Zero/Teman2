acceptance:
  - text: >-
      WHEN Tests & Coverage runs on this PR, its service containers SHALL be
      pulled from ghcr.io/bali-zero/ci-mirror/ after a docker login, and the
      run log SHALL contain no public.ecr.aws line.
    probe: gh run view <tests run> --log | grep -c public.ecr.aws (0) and grep "Pulling from bali-zero/ci-mirror"
  - text: IF any workflow service image names public.ecr.aws or drops the credentials block, THEN the pin test SHALL fail.
    probe: python3 -m pytest scripts/tests/test_ci_service_images_use_mirror.py plus the two cp-backed mutations
