dissent:
  - seat: codex-gpt-5.6-sol
    objection: The ECR guilt test read raw image lines, so a YAML alias resolving to ECR evaded it.
    status: CONFIRMED
    resolution: the test also checks resolved services and job container images (mutations A1, A2).
  - seat: kimi-code/k3
    objection: The PROD pre-deploy gate now depends on an authenticated GHCR pull, a new single point of failure.
    status: PLAUSIBLE
    resolution: accepted. GHCR shares the availability domain of the Actions runner that already gates the deploy, while the ECR anonymous quota is failing today.
  - seat: kimi-code/k3
    objection: Pulls depend on the repo default token permission; a future permissions block without packages breaks them silently.
    status: RETRACTED
    resolution: PR-1's pin already fails any job whose effective permissions omit packages (_token_can_read_packages, mutation M5 in PR 7390).
  - seat: kimi-code/k3
    objection: Private packages break CI runs inside forks and local repro.
    status: PLAUSIBLE
    resolution: the repo has 0 forks; flipping the packages public (operator, GitHub UI) removes it.
  - seat: kimi-code/k3
    objection: Dropping ECR from the sanctioned prefixes removes the emergency escape hatch during a GHCR outage.
    status: PLAUSIBLE
    resolution: kept. A deliberate revert edits the one-line prefix tuple in the same PR.
  - seat: kimi-code/k3
    objection: Private package storage on the Free plan is capped at 500 MB.
    status: PLAUSIBLE
    resolution: the PR-1 prune job keeps at most two superseded versions; the public flip removes the cap.
  - seat: kimi-code/k3
    objection: ECR_PREFIX is now a dead constant.
    status: RETRACTED
    resolution: still used by the path-typo test.
