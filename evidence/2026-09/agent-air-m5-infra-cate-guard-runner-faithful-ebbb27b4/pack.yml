rework_history:
  - pr: 7069
    verdict: REWORK-BUILD
    gate_comment: pull/7069#issuecomment-5759798160
    cause: >-
      catE-sovereignty-lint was red on #7069's own PR run (35592205982): the
      harness sets HOME to an isolated tmp_path per test, and on the GitHub
      runner (unlike M5's mise-managed interpreter) `python3 -m pip install`
      in the "ban-predicates" step puts pytest in the USER site, rooted at
      HOME/.local — so the next step's `python3 -m pytest` found no pytest
      ("No module named pytest"), and every guard step after it was
      silently skipped. Two more, non-blocking defects: the Not-covered
      list omitted the self-reference gap (this file is armed only by the
      workflow it guards) and several runner facts (unset GITHUB_REF_NAME/
      GITHUB_JOB, real HOME, checkout content/history, BASH_ENV); and this
      pack's own dissent rows mislabelled two "declared out of scope, not
      cured" objections as RETRACTED.
    cure: >-
      PYTHONUSERBASE pinned to this process's own `site.getuserbase()` in
      every step's env, independent of the isolated HOME — carries no
      secret, since it is the same filesystem path `pip install --user`
      already wrote under in this very run. Not-covered list extended with
      the self-reference gap and the missing runner facts. Dissent rows
      corrected to CONFIRMED.
