vulnerabilities:
  - id: V5-invisible-letter-and-symbol-fillers
    severity: named-and-open
    what: >-
      A message made only of Hangul filler (U+3164, U+115F, U+1160, U+FFA0) or
      U+2800 braille blank passes has_visible_character on both the leg and the
      daemon parser, so it is offered and judged on context alone.
    why_bounded: >-
      The fail-closed gate is intact: nothing is released without an
      authenticated SUPPORTED verdict, a NOT_SUPPORTED/UNKNOWN serves the stub,
      and the daemon parser accepts the package so no support_judge_unavailable
      folds into the breaker. The worst case is an answer to a message that
      carries no question.
    spec: >-
      Follow-up owns one rule, not an enumeration by review round: a character
      is visible iff its category is L/N/P/S AND it is not
      Default_Ignorable_Code_Point AND not in a short named filler set
      (U+115F, U+1160, U+3164, U+FFA0, U+2800), with one test per excluded
      code point and innocence cases for Korean, Indonesian and emoji questions.
