dissent:
  - status: RETRACTED
    seat: codex-gpt-5.6-sol and kimi-code/k3 (cross-family, independently, no shared context)
    objection:
      'The round-1 `cd "$NUZ_ROOT"` was a safe way to make the repo definition the one the harness
      loads. — Codex named the sharp end — `git add`/`git commit` against the main checkout start succeeding
      inside a job whose prompt carries no no-git prohibition, a failure this repo''s ledger already closed
      three times. Kimi named the rest: SessionStart hooks injecting into a 3-minute-capped print run, a
      fail-closed data-plane guard never exercised under launchd''s environment, and a builder contract
      in system context telling the model reports belong in a worktree while its prompt says write into
      the main checkout. The design was withdrawn, not patched: round 2 changes no cwd at all.'
  - status: RETRACTED
    seat: kimi-code/k3 (cross-family) — corroborated by codex-gpt-5.6-sol's BLOCKER
    objection:
      The round-1 fallback was the safe direction — WARN and continue. — It WARNed and continued
      while the prompt still named the repo path, so the fallback run went spec-less. For nb-curator that
      is the PRIMARY brain (agy), which does no `--agent` resolution and whose ONLY spec source is that
      read instruction. Round 2 resolves one SPEC_PATH, falls back to the machine-local copy, and logs the
      chosen path every run.
  - status: RETRACTED
    seat: kimi-code/k3 (cross-family), against its own leading hypothesis
    objection:
      "The agent-worktree hooks would newly block the report write once the cron cd'd into the
      repo. — It read `worktree_file_write_check.py` and reported the attack as FAILED: the hook keys on
      the Write tool's target path with REPO_ROOT hard-falling-back to `~/nuzantara`, so the block is cwd-independent
      and fires today at cwd=/ equally. Recorded because a refuter that retracts its own best attack is
      the evidence that the rest of its findings were not pattern-matched."
  - status: RETRACTED
    seat: claude-opus-5 (conducting session), on measurement before writing code
    objection:
      "The mandate's three live agents are competitor-monitor, nb-curator and yield-optimizer.
      — `yield-optimizer`'s plist is retired and its successor uses no `--agent`. Its now-dead repo wrapper
      is left in place rather than deleted here: removing dead code is a different concern from vendoring
      live specs."
