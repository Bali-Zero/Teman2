brief_ref: evidence/brief.yml
council_run: council-journal.jsonl
plan_ref:
  'Handoff mandate from Zero, 2026-09-04: "bonifica completa" of the subagent inventory. PR-1
  (#5625, merged fcc1d9aedc) armed the guard over `.claude/agents/` and deliberately changed no definition.
  This is PR-2: the two definitions a LIVE cron actually consumes stop being untracked machine-local files.
  One concern. The archive of the 12 `wr3-*` and 10 dormant HOME-only defs, and the de-stale pass, remain
  separate PRs.'
diff:
  files: 7
  net_lines: 504
  note:
    "475 of the 504 net lines are the two vendored agent definitions themselves — content that moves
    into tracking as an atomic unit and cannot be split without vendoring half a spec. The behavioural
    surface is 29 lines across three files: two wrapper blocks and two `.gitignore` allowlist entries."
lanes:
  - lane: pr2-ground
    role: read
    seat:
      'claude-opus-5 (conducting session, M5). Refused the mandate''s own numbers and re-measured every
      one on `origin/main` and on the live machines. Three of the handoff''s premises did not survive: the
      "3 live agents" are TWO (`yield-optimizer`''s plist sits in `~/Library/LaunchAgents/_retired/…retired-20260820`
      and its successor `s7-yield-run.sh` uses no `--agent`); the "26 HOME-only defs" are 25 and the "11
      orphans" are 10; and `competitor-monitor` runs from `~/scripts/`, a HOME-fork wrapper, not from the
      repo copy the handoff pointed at. Also measured the root cause the handoff never named: `.gitignore:549`
      ignores `.claude/agents/*` behind an explicit allowlist, which is WHY these files were never tracked
      — `git add -A` had been skipping them in silence.'
  - lane: pr2-build
    role: build
    seat:
      claude-opus-5 (conducting session, M5). Vendored both defs, added the two allowlist lines, wrote
      the SPEC_PATH block, and cured the two defects the vendoring itself introduces or makes canonical
      (4 dead `~/Desktop/nuzantara` references; the hardcoded Telegram `chat_id 1125336968`, a mailbox belonging
      to an account this org no longer controls). Verified Prettier changed only formatting via a whitespace-and-rule-normalised
      hash on both files — the first, cruder token-set probe returned a FALSE "unchanged" on two EMPTY files
      because `set -- $p` does not word-split under zsh, and was rerun explicitly.
  - lane: pr2-refute-codex
    role: review
    seat:
      codex-gpt-5.6-sol, `codex exec --sandbox read-only -c model_reasoning_effort=xhigh`, cross-family,
      fresh context, given the round-1 diff and instructed to construct defeating inputs. Returned 12 findings
      (1 BLOCKER, 6 HIGH) and 4 named failed attacks.
  - lane: pr2-refute-kimi
    role: review
    seat:
      kimi-code/k3, cross-family, same round-1 diff, independently. Returned 6 findings (2 HIGH) and
      7 named failed attacks, including one it explicitly reported as a failed attack against its own leading
      hypothesis after reading the hook source.
seat_diversity: satisfied
seat_diversity_note:
  'ONE build lane, so the ">= 2 build lanes" non-Anthropic BUILD-seat rule does not
  bind by its own terms; no second build lane was invented to satisfy a rule that does not apply. The
  cross-family pressure sits on REVIEW, and it earned its place here: the two seats CONVERGED from different
  directions on the same two defects, and their convergence is what killed the round-1 design rather than
  patching it.'
residual_risks:
  - THE HARNESS DEFINITION IS STILL THE HOME COPY. `--agent <name>` resolves frontmatter and system prompt
    from `~/.claude/agents/`; only the OPERATIVE SPEC — the file the prompt tells the model to read and
    follow — moves into the repo. Making the harness load the repo copy requires cwd=repo, which is exactly
    what round 2 removed. Left to its own PR.
  - AFTER MERGE THE COMPETITOR WRAPPER IS NOT YET LIVE. launchd on Pro runs `~/scripts/competitor-monitor-run.sh`,
    a DECLARED home-fork pair byte-identical to the repo copy today. Merging makes it DIVERGE; the edit
    takes effect only when the HOME copy is resynced. `~/scripts/` is outside `~/.claude/`, so `host_boundary`
    does not block it and the session does this itself — PROVE-LIVE step, not an operator hand-off.
  - "`nb-curator.daily` IS ALREADY RED AND THIS PR NEITHER CAUSES NOR CURES IT. Baselined on Pro BEFORE
    the change: last exit 2, `ARTIFACT GATE FAILED (rc=3) despite brain exit=0`, because the agent-worktree-isolation
    hook refused its report write into the main checkout. Both review seats independently confirmed that
    hook keys on the TARGET PATH with REPO_ROOT hard-falling-back to `~/nuzantara`, i.e. cwd-independent
    — kimi recorded this as a FAILED attack against its own leading hypothesis."
  - "EIGHT INHERITED DEFECTS SHIP UNCURED, DELIBERATELY (regola 8). The review seats found them INSIDE the
    vendored bodies: a vision pre-filter that never attaches an image, two `nlm` command forms that exit
    2 against the installed CLI, a Mode A path that hard-fails on M5, three conflicting schedules in one
    file, stale model names, a 3-post sample behind a '30-day scan', a self-contradictory mandatory-vision
    rule, and price examples primed as current facts to an agent with no PricingTool. The same bytes ran
    yesterday untracked; curing them in the PR that moves them would make the diff unreviewable. Ledgered
    with a proof-of-armed each."
  - A SECOND nb-curator ENTRY POINT IS NOT REPOINTED. `run-nb-curator-mode-c.sh` invokes `claude -p` with
    no `--agent` and no spec path in its prompt, relying on HOME autoload. Its fix is a different shape
    from the one-line repoint and is ledgered separately.
  - THE 7 SHADOW PAIRS UNDER `~/.claude/agents/` STAY STALE. `host_boundary.py` refuses every write under
    `~/.claude/` and `agents/` is not in its carve-out, so no session can resync them. Chronic ledger row,
    owner `operator[control-plane]`. This PR does not widen a security guard to close it.
pii_scan: clean
