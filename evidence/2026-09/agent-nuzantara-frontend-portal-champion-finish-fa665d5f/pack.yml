dissent:
  - seat: claude-opus-5-5 (V2 verifier)
    status: PLAUSIBLE
    objection: >-
      Non-blocking: EventSource cannot tell 401 from 503, so an expired
      session retries about every 60 s until reload; a goal whose first
      successful reconnect lands more than ~90 s after activation is not
      replayed (by design); reduced motion keeps the opacity fade and drops
      rings and spring.
  - seat: codex-gpt-5.6-sol (council, CLI and parent-native runs)
    status: CONFIRMED
    objection: >-
      Replay after a subscriber-queue overflow read one XRANGE page of 100,
      losing any larger backlog behind the live reader. FIXED in 38f597922a:
      replay pages until drained; test_reconnect_replays_every_page_of_a_backlog
      (250 events, 3 pages) times out on the previous code and passes now.
  - seat: codex-gpt-5.6-sol (parent-native run)
    status: CONFIRMED
    objection: >-
      Replay and the live reader both started exclusively after `now_ms-0`,
      so a goal XADDed in the same millisecond as TIME reached neither.
      FIXED in 38f597922a (both start one millisecond earlier);
      test_fresh_subscriber_gets_a_goal_added_in_the_same_millisecond is red
      on the previous code and green now.
  - seat: codex-gpt-5.6-sol (council, CLI and parent-native runs)
    status: CONFIRMED
    objection: >-
      Queued goals were age-checked only on receipt and visibility change,
      so a burst could show one minutes late; with reduced motion the
      backdrop still faded. FIXED in 675ac54139 (dismiss drops queued goals
      older than 90 s; no backdrop fade under reduced motion); new vitest
      case red on the previous component, green now.
  - seat: codex-gpt-5.6-sol (council, CLI and parent-native runs)
    status: CONFIRMED
    objection: >-
      complete_registration logged the client email (pre-existing since
      2025-12-31, same pattern in invite_service and in the invite-sent
      line). FIXED in 38f597922a: those three lines log client_id only; a
      caplog assertion guards the router line.
  - seat: kimi-code/k3 (council)
    status: RETRACTED
    objection: >-
      B1 streamed SSE would die on the proxy client's read timeout between
      15 s keepalives. Not the case: get_proxy_client sets
      httpx.Timeout(300.0, connect=10.0); idle-stream survival through both
      proxies re-proven locally with the production middleware stack.
  - seat: claude-opus-5-5 xhigh (fresh final gate, round 1)
    status: CONFIRMED
    objection: >-
      Every open Kita tab pinned one connection of the single 50-connection
      API-to-RAG pool that also carries CRM, dashboard and chat; with 50
      open streams a heavy GET timed out (gate pool probe). FIXED in
      85a9783cf1 (the events path gets its own client with a fail-fast pool
      timeout, closed on shutdown; a Redis preflight returns 503 before
      streaming) and 4a7dada708 (a hidden tab closes its stream and resumes
      from its cursor when visible). The same probe with 100 and with 200
      open streams returns the heavy GET 200 in at most 0.01 s.
