brief_ref: evidence/brief.yml
plan_ref:
  "F4 'root and upkeep' — `.agents/skills/kbli-navigator/SKILL.md` §5.5, the 2026-08-02
  read-only measurement. House shape for a KG cure spec:
  `docs/specs/2026-09-02-kbli-kg-licensing-class-cure-spec.md` §5-§7."
lanes:
  - lane: kg-root-census
    role: build
    seat:
      claude-opus-5 (conducting session, headless on Pro — ran every PROD probe, wrote the
      census organ and its suite, authored the spec and this pack)
seat_diversity: not_applicable
seat_diversity_note:
  "Single-seat by design and declared rather than left to read as satisfied. Every
  load-bearing claim in this PR is settled by a query against the live store or by a test's
  exit code, not by judgement — the arbiter is the probe. The one place a second seat would
  add something is §6's four owner decisions, and those are not decided here: they are
  priced two ways each and handed to the owner, which is the correct disposition for a
  question a second model could not settle either."
diff:
  net_lines:
    "6 files, +1615/-0 measured by `git diff --numstat origin/main`. One new spec under
    docs/specs/ (496 lines), one new read-only script (~370), one new test file (~200), one
    JSON fixture, plus this pack and its brief under the per-task evidence path. Zero
    production code, zero migration, zero workflow. This exceeds the ~400-net-line guidance and the
    contract's own qualifier is why: the deliverable IS a spec and the census that makes its
    numbers reproducible, and splitting them would ship a document whose numbers nobody can
    re-derive — which is the exact failure this PR exists to correct."

  behaviour_change:
    NONE in any running system. Nothing in this diff is imported by the backend, scheduled
    by a cron, or wired into a router. The census script is a manual read-only command; the
    spec is a document. `kg_nodes` and `kg_edges` were read and never written.
