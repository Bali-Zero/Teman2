pii_scan: clean
pii_scan_note:
  Nothing in this diff, brief or pack transcribes client data. `kg_nodes`/`kg_edges` hold
  KBLI classification codes, regulation identifiers and permit types — no person, no client
  record, no contact. Every receipt quotes counts, id shapes, collection names and dates.
  The test fixture is invented (`kbli:47721`, `kbli_kbli_99999`, `kategori_r`), not a
  PROD extract. No credential was echoed, printed or committed.
dissent:
  - seat: session (the fixture, refuting its own author)
    objection:
      "Four of the first-draft test expectations were wrong, and the fixture said so:
      phantom_count asserted 1 where the correct answer is 2, five_digit_tokens 3 where it is
      4, fanout {1:2,4:1} where it is {1:3,4:1}, and the kbli_kbli inbound histogram omitted
      an APPLIES_TO 4 it must carry."
    status: CONFIRMED
    resolution:
      "Every one corrected TO the measured value, never the reverse. The phantom_count error
      is the instructive one: the draft had silently excluded the `kg_seed` shape — the
      canonical id with no data — from the phantom definition, which is the same blind spot
      the whole spec is about, reproduced inside the test that was meant to catch it."
  - seat: session (hand-written SQL, refuted by the census)
    objection:
      "Two ad-hoc SQL probes written in this lane disagreed with the census: 2,869 repointable
      nodes against 2,859, and 13,683 total nodes against 13,694."
    status: CONFIRMED
    resolution:
      "The census was right both times. The hand SQL used `entity_type='kbli'` (losing the
      ten `kbli_code` rows) and treated any `kbli:` node as a valid repoint destination
      (including the six that carry no data). The paper's own thesis, met while writing it —
      which is why the census widens the WHERE and a test pins that widening."
  - seat: session (self-review, on a signed measurement)
    objection:
      "The 2026-08-02 probe states that `entity_id` predicts emptiness PERFECTLY — 'every
      `kbli:<code>` row is rich (1,558/1,558)'. That is no longer true."
    status: CONFIRMED
    resolution:
      "Six `kbli:` nodes carry no `kode`. Recorded as a correction in §2.4 with the
      measurement that moved it, not silently fixed — and the six turn out to be the
      detector's six standing failures, so the exception is the most load-bearing row in the
      census rather than a rounding error."
  - seat: session (declared limit, not fixed here)
    objection:
      "§4(a) promotes 1,895 `REQUIRES` edges onto the nodes the client-facing licence list
      reads. That is the point of the cure and also its blast radius — the 2026-02 'PT PMA is
      a permit to obtain' failure is exactly this shape at smaller scale."
    status: CONFIRMED
    resolution:
      "Not fixed here because nothing is applied here. Written into §4(a) as a sequencing
      constraint on the cure: lot (a) may not ship before `kg_stray_admission` reads 0 on
      the repointed set. Stated in the spec rather than left for the cure session to
      rediscover."
