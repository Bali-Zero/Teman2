dissent:
  - seat: self-review (the builder, not an independent refuter)
    objection: >-
      A PR whose event payload `pull_request.base.sha` predates this merge, while its merged workflow
      file already carries `--tree`, would run an older base parser that does not know the flag: argparse
      exits 2 with an empty stdout and the step reports "classified this pack as '<nothing>'". Transient
      and closed by the next synchronize of such a PR; not coded around, and not observed.
    status: PLAUSIBLE
  - seat: self-review (the builder, not an independent refuter)
    objection: >-
      The strength of the marker check did not increase. With `--tree` it judges a PR-authored script
      carrying a PR-authored marker, exactly as strong as the review of the diff that adds the observer
      (the parser's POST-MERGE ONLY paragraph). Nothing from the head tree is executed by this step, but
      the lint can now green an observer that nobody but the author has read.
    status: PLAUSIBLE
  - seat: self-review (the builder, not an independent refuter)
    objection: >-
      Two neighbours of the fixed line are the same defect class and are left standing: the
      `CLASSIFICATION=$(python3 -c ...)` capture in the same step (a failed import ends the step before its
      own `*)` branch prints), and the lint that should have caught the original, which matches only
      `VAR=$(...)` and not a bare call followed by `RC=$?`.
    status: CONFIRMED
  - seat: self-review (the builder, not an independent refuter)
    objection: >-
      No GitHub run of the patched step exists yet. The receipts reproduce the parser on the real pack of
      PR 7504 and pin the workflow text, but the live observation is the re-run of PR 7504 after this
      merges (acceptance A4 of the brief), which is why it is written down as an acceptance and not claimed.
    status: CONFIRMED
