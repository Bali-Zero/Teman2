# Gear-3 evidence pack — harness fix: the Bites step resolves an in-PR observer in the PR head tree.
# Written by the harness-fix builder (Claude Sonnet 5, a teammate of the session that owns this mandate).
# Every receipt below is a command this writer executed in this turn (2026-09-27, 03:22Z-04:10Z, in three rounds: the fix, the council cure and the hostile matrix); the
# outputs are quoted from those runs, not narrated from memory. The one exception is stated as such:
# the run log of PR 7504 was downloaded and read this turn, but the run itself is CI's, not the writer's.
#
# WHAT THIS PACK DOES NOT CARRY, ON PURPOSE: council-journal.jsonl content and independent dissent. The
# review seats are the owning session's lane (generator != grader) — the builder did not dispatch,
# simulate or narrate any council round, and no reviewer verdict is asserted here. The owning session
# appends the reviewer lanes and journal lines before arming. The `dissent` block below is the builder's
# OWN residual-risk notes, labelled as such (seat: self-review, not an independent refuter) so the block
# is honest rather than empty. `council_run` names a journal file that is deliberately EMPTY at the time
# of writing, so R9 is expected to fail on quorum until the council has run.
gear: 3
brief_ref: evidence/brief.yml
ruling: >-
  SAETTA amendment 7 (docs/rules/RULINGS.md, ruled 2026-09-12): a red whose cause is the harness
  produces no supersession, and the harness is fixed in a separate PR. Mandate from the owning session,
  2026-09-27: cure the defect the gate diagnosed on PR 7504 (run 36289447854), in its own PR.
mission: >-
  The `Bites contract` step of harness-floor.yml judged an observer script that is NEW in the PR as
  missing, and died silently on it. Cure: bites_parse.py `--tree <sha>`, the step passing the head sha,
  and the step capturing the parser's exit code.
lanes:
  - lane: bites-tree-parser
    role: build
    seat: Claude Sonnet 5 (harness-fix builder teammate)
pii_scan: clean
decisions:
  - id: D-gear
    decision: >-
      Gear 3 by path: `evidence_pack_lint.py --print-floor --print-floor-source` over the numstat prints
      3 with source `path`, because .github/workflows/harness-floor.yml is a hot-zone path. The workflow
      hunk is a handful of lines; the floor, not the size, sets the gear.
  - id: D-tree-lookup
    decision: >-
      The parser asks the head tree with `git ls-tree` (path, mode) and `git cat-file blob <oid>` (bytes)
      rather than the `git cat-file -e` / `git show <sha>:<path>` pair first suggested. ls-tree is what the
      same step already uses for the pack question (trees are always local under `filter: blob:none`, and
      it separates "git failed" from "not in the tree"), it reports the mode so a symlink can be refused
      the way `resolve()` refuses a link out of the checkout, and reading by object id leaves no path
      syntax and no textconv filter between the id and the bytes. No shell, no `shell=True`, the head
      copy is read and never run.
  - id: D-hex-only
    decision: >-
      `--tree` accepts a FULL lowercase hex id, exactly 40 digits (sha-1) or 64 (sha-256), checked in
      `main()` and again inside the guard that calls git, so a value such as `--output=x` never reaches a
      git argv. A ref name is a moving target and the step already holds the resolved sha; an abbreviated,
      upper-case or over-long spelling is read as git pleases (41-63 digits are truncated), so the tree
      that got judged could be another one than the one named. Tightened from 7-64 of either case in the
      council-cure round below.
  - id: D-default-unchanged
    decision: >-
      Without `--tree` every code path is the one that was there. The existing corpus still passes
      unchanged (receipt R2), and a test pins the old behaviour: from a checkout that lacks the file the
      same pack is still `does not exist in the checkout`.
  - id: D-exit-capture
    decision: >-
      The step now runs `RC=0` then `python3 ... || RC=$?`. The comment above the old call claimed errexit
      was off in this job's steps; the real run of PR 7504 shows `shell: /usr/bin/bash -e {0}` on this very
      step and `Process completed with exit code 2.` with no `::error` line before it (receipt R0), so the
      comment was corrected in the same hunk rather than left contradicting the code beside it.
  - id: D-scope
    decision: >-
      Left out on purpose and named in the brief: the `CLASSIFICATION=$(python3 -c ...)` line lower in the
      same step has the same bash -e shape, and scripts/lint_workflow_errexit_decap.py matches only the
      `VAR=$(...)` form, not a bare call followed by `RC=$?`. Each is a separate concern for its own PR.
  - id: D-council-cure-1
    decision: >-
      Council round 1, as relayed by the owning session (this builder did not run or see the council):
      Kimi OK, with the note that a `--tree` of 41-63 digits is truncated by git and resolves another
      tree; Codex Sol BLOCK on the head-tree read, because `_tree_source` decoded the observer blob with
      `errors="replace"`, so a non-UTF-8 blob carrying the marker passed, and the `cat-file` read was
      unbounded (an 8 MiB mock passed). Cure, one fix commit on top, nothing else touched: (1) the blob
      is decoded strictly and a UnicodeDecodeError makes the observer malformed with an explicit
      message; (2) `git cat-file -s <oid>` is asked first and a blob over 256 KiB is refused UNREAD (a
      test asserts `cat-file blob` is never run), and a gitlink or anything but a regular file was already
      refused by the mode check, now pinned by its own test; (3) the id must be exactly 40 or 64 lowercase
      hex digits (see D-hex-only). Ten tests added: non-UTF-8 blob with the marker, oversize blob, a
      UTF-8 observer with non-ASCII text exactly at the cap (the over-match twin), a gitlink, and six id
      shapes (41, 63, 7 and 39 digits, and two upper-case) each refused by the CLI and by the guard. The
      checkout-mode read keeps its `errors="replace"` (unchanged, outside `--tree`). The receipts below
      are all re-measured on the tree with the cure.
  - id: D-hostile-matrix
    decision: >-
      SPEC of what the `--tree` reader must do, written by the imperator after council round 2 (Codex: the
      runtime was verified fail-closed live by the seat, the BLOCK was on the completeness of the tests and
      on the CLI output), and the last change on this PR (depth limit). BLOB TEXT: invalid UTF-8 is refused
      with and without the marker, as are overlong sequences (2- and 3-byte), surrogates (high and low), a
      truncated sequence at end of file and a lone continuation byte; a UTF-8 BOM is ACCEPTED, decided
      here: it is valid UTF-8, the marker is still found after it, and refusing it would over-match a
      harmless editor habit. SIZE: cap 256 KiB, INCLUSIVE, so cap-1 and cap are accepted and cap+1 is
      refused unread; a `git cat-file -s` that exits non-zero, prints nothing, prints a non-number, a
      negative, two numbers, an exponent or a non-ASCII digit is refused as a failed question and the
      bytes are never pulled. MODES: 160000 (gitlink), 040000 (directory) and 120000 (symlink) are
      refused; 100644 and 100755 are accepted. IDS: exactly 40 or 64 lowercase hex digits are accepted
      (the 64-digit case is exercised against a real sha256 repository); 7, 39, 41 and 63 digits,
      upper case, an option-shaped value, an inner, leading or trailing space, a trailing newline, an
      empty value and ref names (`main`, `HEAD`, `refs/heads/main`) are refused. CLI: an invalid
      `--tree` now prints the verdict `{"malformed": true, "errors": ["--tree: ..."]}` on stdout as well
      as the message on stderr, exit 2, so harness-floor's `json.load` never sees an empty stdout; the
      value itself is not echoed. Every line of this spec is a test; the reader itself was not changed
      beyond that CLI output.
