dissent:
  - seat: "codex-gpt-5.6-sol (round 1) vs dw-builder-2, kimi-code/k3 (round 1, finding 4) vs dw-builder-2"
    status: PLAUSIBLE
    objection: >-
      MEDIUM/LOW: the `paths:` filter carries a 9th/10th entry beyond the mandate's literal list
      — `.github/workflows/dynamic-workflow-selftest.yml` names itself. Both titolari independently
      flagged this in round 1, reviewing a staged diff that had ALREADY dropped the entry
      (briefed from a stale 8-item sentence in brief.yml at review time). CONDUCTOR RULING R2
      (2026-09-19 08:10Z addendum): mandate line 513 (the "PR3c: answers to the builder's two
      questions" addendum, Q2) explicitly directs adding this path — an edit to the workflow
      alone must re-run it, or that edit is scar #2 (Esiste≠Armato) one level up. The finding's
      factual premise (the entry deviates from the earlier literal-8 reading) is accurate; the
      ruling overrides it rather than curing toward the objection's ask. Restored in this cure
      commit; brief.yml's constraint sentence corrected from "8 entries" to "10 entries" in the
      same commit.
  - seat: "codex-gpt-5.6-sol (round 1) vs dw-builder-2"
    status: CONFIRMED
    objection: >-
      MEDIUM: `test_workflow_yaml_lint_steps_use_default_sweep_via_cli` (as reviewed) checked
      stripped TEXT LINES for the lint `run:` commands rather than parsing the workflow YAML — a
      decoy job or a reflowed block-scalar carrying the same string would satisfy the assertion
      without a real step ever running the command. CONFIRMED and cured before this builder took
      over (present on HEAD): the test now `yaml.safe_load`s the workflow, walks
      `doc["jobs"]["dynamic-workflow-selftest"]["steps"]`, and asserts the exact `run:` values —
      scoped to the named job so a decoy elsewhere in the file cannot satisfy it.
  - seat: "codex-gpt-5.6-sol (round 1, finding 3) vs kimi-code/k3 (round 1, finding 1) vs dw-builder-2"
    status: CONFIRMED
    objection: >-
      MEDIUM: the new model-card innocence tests pointed `lint_model_cards.main()` straight at
      `clean.md`, whose frontmatter `date:` is a static fixture value (`2026-09-18`); `main()`
      takes no `today=` override, so the test would start failing on wall-clock 2026-10-19 when
      `FRESHNESS_DAYS = 30` expires the fixture — a lint-arming PR shipping a CI job that goes
      stale-red in 30 days. Both seats demonstrated the mechanism independently. CONFIRMED and
      cured before this builder took over (present on HEAD): both innocence tests
      (`test_innocence_one_clean_in_scope_file_is_enough`,
      `test_innocence_explicit_dir_with_one_clean_file_exits_0`) now write a tmp-path copy of
      `clean.md` with `date: {date.today().isoformat()}` interpolated, same cure pattern the
      file's own pre-existing `find_violations`-level tests already used.
  - seat: "codex-gpt-5.6-sol (round 1, finding 4) vs kimi-code/k3 (round 1, finding 5) vs dw-builder-2"
    status: PLAUSIBLE
    objection: >-
      MEDIUM/LOW: the blind-scan closure retains an exception for an explicit EXISTING FILE of
      the wrong suffix (`.txt` for the JS lint, non-`.md` for the model-card lint) — it still
      exits 0 with "no violations (0 file(s) scanned)" rather than refusing under the quoted
      universal rule "ANY invocation that scans zero files exits 2". Accurate as read. NOT cured:
      this is pre-existing, tested behaviour
      (`test_innocence_explicit_non_js_file_is_still_green` /
      `test_innocence_explicit_non_md_file_is_still_green`, both predating this PR), the new
      docstring in each lint script's `main()` states the carve-out explicitly, and it is an
      informed, deliberate scope decision — a file of the wrong suffix was never in scope to
      begin with, unlike a directory that yields zero IN-SCOPE files. Declined; stated here
      rather than left for the gate to discover.
  - seat: "kimi-code/k3 (round 1, finding 2) vs dw-builder-2"
    status: CONFIRMED
    objection: >-
      MEDIUM: the original blind-scan guard was gated on a GLOBAL `scanned == 0` across all
      explicit targets in one invocation, so a productive sibling target could mask a blind one
      in the same call (`lint empty_dir real.js` went green, silently ignoring `empty_dir`) —
      cicatrix #2 one level deeper than the single-target case the mandate named. Demonstrated by
      the seat directly. CONFIRMED and cured before this builder took over (present on HEAD):
      both lint scripts now track `dir_contributions` per raw target and judge each explicit
      target (missing path or zero-yield directory) independently of whether siblings scanned
      cleanly; guilt test
      `test_guilt_mixed_targets_empty_dir_not_masked_by_productive_sibling` in both wrapper test
      files.
  - seat: "kimi-code/k3 (round 1, finding 3) vs dw-builder-2"
    status: CONFIRMED
    objection: >-
      MEDIUM: the `paths:` filter (as reviewed) matched all 27 `scripts/tests/test_lint_*.py`
      files on disk, but the pytest step ran only 2 of them by name — a PR touching any of the
      other 25 would trigger this check, which would go green without ever running the changed
      file. CONFIRMED and cured in this commit (R1, mandate Q1): the wildcard is replaced with
      the two explicit entries `scripts/tests/test_lint_workflow_script.py` and
      `scripts/tests/test_lint_model_cards.py` — the filter now names exactly what the pytest
      step runs.
  - seat: "kimi-code/k3 (round 1, finding 6) vs dw-builder-2"
    status: CONFIRMED
    objection: >-
      LOW: `timeout-minutes: 10` (as reviewed) passed the repo's own timeout-floor lint
      (`scripts/lint_workflow_timeout_floor.py`, `FLOOR_MINUTES = 10`) by exactly zero margin,
      and that lint's own header records a worst-observed checkout of 599s — essentially the
      entire budget for one step. CONFIRMED and cured before this builder took over (present on
      HEAD): `timeout-minutes: 15` — conductor ruling R3 (2026-09-19 08:10Z addendum) accepts 15
      as superseding the mandate's earlier stated "10", citing the same lint as evidence.
  - seat: "kimi-code/k3 (round 1, finding 7) vs dw-builder-2"
    status: PLAUSIBLE
    objection: >-
      LOW: `raw.glob(DEFAULT_GLOB_PATTERN)` is non-recursive, so an explicit directory whose
      in-scope files live only in subdirectories would blind-scan (report zero, now correctly
      refusing per the finding-2 cure, but arguably a false blind-scan rather than a real one).
      Accurate as read; the seat itself called it "a documentation nit at most". NOT cured: the
      armed CI usage is the DEFAULT sweep (no positional target) which is flat by convention and
      by this mandate's own text, matches the two lint scripts' existing established convention,
      and is not a behaviour this mandate asked to change. Declined.
