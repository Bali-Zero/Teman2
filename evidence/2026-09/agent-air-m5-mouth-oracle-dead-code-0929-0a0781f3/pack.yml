    projections, tree.ts's BEHAVIORAL_CATEGORIES) that PR #7561's atlas
    redesign stopped mounting from OracleShell.tsx but left on disk. No
    behaviour change for a real visitor — OracleShell.tsx already mounted
    none of these files before this diff; the kept `QUESTIONS` re-export
    chain and the evaluation/idempotency/SHADOW fail-closed/consent/
    resume/telemetry contracts are all untouched.
  surface: >-
