    deletion-heavy churn (exact file/line counts are in this pack's own
    receipts above, recomputed from `git diff --numstat`, never narrated by
    hand here — see the countable-claims rule): components LivingTree plus
    its test, ProcessRail plus its test, and PathsCounter fully deleted;
    the _lib module/test pairs e4-tier-fence, mock-engine,
    parity-lane-tiers, shadow-client fully deleted; flow.ts, flow.test.ts,
    tree.ts, oracle.css, fact-mapper.test.ts each edited in place to drop
    only the named dead sections while leaving every other export/test
    untouched.
