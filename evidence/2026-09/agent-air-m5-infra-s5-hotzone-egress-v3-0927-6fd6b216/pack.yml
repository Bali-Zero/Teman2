bites:
  consumer: >-
    the harness floor on every future PR touching any of the seven S5
    egress/redaction paths, and guard-conformance.yml's PR-triggered
    conformance job for the sync test itself
  observation: >-
    Legacy (prose) form on purpose, not the executable
    consumer/where/observe/expect shape: `scripts/ci/bites_parse.py`'s
    allow-list refuses `python3 scripts/evidence_pack_lint.py
    --print-floor --changed-files-file
    scripts/tests/fixtures/s5_hotzone_probe_changed_files.txt` — NOT
    because `scripts/evidence_pack_lint.py` lacks the `bites-observable`
    marker (this exact diff already carries it, at the top of the
    HOTZONE_PATTERNS section, scoped to the read-only flags this
    observation uses), but because `_guard_observable_script` reads the
    marker from the BASE checkout by design (module docstring:
    "POST-MERGE ONLY... against an unmerged PR checkout there is no
    boundary here at all") — a PR that adds the marker in the same diff
    it wants to observe with can never pass this check pre-merge, only a
    LATER PR can. This is not a gap to cure in a follow-up PR; it is the
    module working as documented. Once this PR merges, the very next PR
    touching any of these seven paths CAN write an executable Bites
    against `scripts/evidence_pack_lint.py --print-floor`. Until then,
    the rule is proven here by two commands anyone can run against this
    PR's own diff, both already exercised in this pack's receipts:
    `python3 -c "import sys;
    sys.path.insert(0,'scripts'); from evidence_pack_lint import
    compute_floor; print([compute_floor([p]) for p in
    ['.claude/scripts/codex-spalla.sh','scripts/lib/spalla_redact.sh','.claude/hooks/codex-spalla-trigger.sh','scripts/codex_tri_llm_review.py','scripts/review_gate_run.sh','scripts/_redact_pii.py','infra/workflows/second-army.js']])"`
    prints `[3, 3, 3, 3, 3, 3, 3]` (all seven S5 paths floor at 3), and
    `python3 -m pytest scripts/tests/test_hotzone_lists_sync.py -q`
    (wired into guard-conformance.yml) passes, asserting the same seven
    paths sit on both `HOTZONE_PATTERNS` and
    `.github/workflows/hot-zone-pr-gate.yml`'s case block and that an
    unrelated path floors at 1.
dissent:
  - seat: "session (M5, Sonnet 5 conducting) — self-review, no external seat dispatched (see seat_override)"
    objection: >-
      [P1, self-raised] `infra/workflows/second-army.js` was found only
      because the gate on #7476 extended the sweep to `*.js`/`*.cjs`/`*.ts`.
      This is now the THIRD time (v1: scripts/codex_tri_llm_review.py
      missed by a `*.sh`-only sweep; v2: this file missed by a
      `*.sh`/`*.py`-only sweep) that a file-extension-limited sweep let a
      real egress wrapper through. The pattern strongly suggests the sweep
      method itself — grep over hand-picked extensions — is the wrong
      shape for a completeness guarantee, not just under-scoped each time.
    status: CONFIRMED
    resolution: >-
      Correct as stated. A sweep bounded by an enumerated extension list can
      never prove completeness, only shrink the miss surface one extension
      at a time — exactly what happened three times in a row. The only
      sweep shape that COULD prove completeness is one keyed on behavior
      (does this process spawn `codex`/`kimi`/`agy`/`qwen`/`gemini` as a
      subprocess and pass diff-shaped content as an argument, regardless of
      the caller's own file extension), which needs either a language-level
      call-graph analysis or a runtime audit (e.g. instrumenting subprocess
      spawns fleet-wide for one release cycle) — both real projects, neither
      of which fits inside an evidence-pack PR that is itself supposed to be
      the enforcement layer, not the completeness proof.
    disposition: >-
      Not fixed in this PR — flagged honestly instead of claimed fixed. This
      spec's sweep remains extension-bounded (`*.sh`/`*.py`/`*.js`/`*.cjs`/
      `*.ts` as of this PR) and should be read as "everything found so far
      under an incomplete method", not "everything that exists". A
      behavior-keyed completeness audit is a separate, larger piece of work
      worth its own mandate — noted here so the next gate or the next sweep
      does not have to rediscover this limitation from scratch.
  - seat: "session (M5, Sonnet 5 conducting) — self-review, no external seat dispatched (see seat_override)"
    objection: >-
      [P2, self-raised] `scripts/_redact_pii.py`'s widening cost (11 other
      callers now floor at 3) was carried forward from v2 with only the
      label corrected (egress_proxy.py and dynamic_workflow.py ARE
      egress-adjacent, contra v2's claim). The underlying question the
      gate's own minor raised — whether the KEEP-IN conclusion actually
      rests on the right precedent — deserves restating precisely now that
      the wrong precedent (#7466) is removed from the argument.
    status: CONFIRMED
    resolution: >-
      The KEEP-IN argument now rests correctly on the spalla cure lane
      itself (#7470, then #7475, now #7483) editing `scripts/_redact_pii.py`
      directly — verified via `gh pr view 7483 --json files`, which lists it
      (and also `scripts/codex_tri_llm_review.py`, one more S5 path than
      #7475 touched). That is a live, present-tense example of exactly the
      risk S5's Gap names (a change to the redaction engine, not just the
      wrapper, going through at a gear that requires no gate verdict),
      stronger evidence than the #7466 precedent it replaces because it is
      not hypothetical.
    disposition: >-
      Kept IN, same as v2, now on a corrected and stronger basis. See the
      spec's Enforcement section for the reworded cost statement.
