objective: >-
  REWORK of the second S5 PR (#7476, REWORK-BUILD, gate report
  scratchpad/reports/gate-7476.md): built fresh from origin/main per the
  fixed-point method (an armed PR is frozen, never edited in place). Closes
  three blockers: (1) the required Harness floor recompute check was RED on
  #7476 for a REAL pack violation, not the pending verdict — pack.yml's
  diff.net_lines prose said "v1's 3 commits" while the branch (squashed) had
  1, and the countable-claims rule caught the mismatch against the real PR
  event payload. Fixed by describing the history without a false countable
  claim ("a single commit", a word compute_floor's countable-claims scanner
  does not recognize as a number) and by re-measuring every count on this
  final commit rather than carrying one forward. (2) The sweep was again
  file-type-limited (*.sh/*.py only, the same miss class as v1's missing
  scripts/codex_tri_llm_review.py): extending it to *.js/*.cjs/*.ts found
  infra/workflows/second-army.js, whose Refute lane forwards a frozen
  `git diff` verbatim to a cross-family external seat door (codex/agy/qwen)
  with zero redaction, live via two recorded runs — now added to both
  lists, the sync test, and classified in S5 alongside its non-egress
  runner (run-second-army.mjs, OUT). (3) In-flight cross-PR state had gone
  stale again, twice over: #7470 (named everywhere in v2) closed unmerged
  and was superseded by #7475 before v2 even opened; #7475 itself closed
  unmerged before this v3 rework began, superseded by PR #7483. Every
  artefact now names the spalla cure LANE with an as_of timestamp
  (`2026-09-27T02:09:06Z`) and the current PR number (#7483: OPEN,
  auto-merge not armed), rather than a bare number that goes stale within
  the hour — and the "two S5 paths" claim about that lane, already
  corrected once to three, is corrected again to FOUR: #7483 also edits
  `scripts/codex_tri_llm_review.py`, not just codex-spalla.sh/_redact_pii.py/
  spalla_redact.sh. The Migration section now states the landing-order
  consequence by PR number: if this PR lands first, #7483's floor
  recomputes to 3 and its declared `gear: 2` fails closed. Two further
  factual errors the
  gate found are also corrected: the pack's dissent disposition wrongly
  blamed #7466 for touching only "the redactor's caller-facing contract"
  (false — #7466's files are codex-spalla.sh, spalla_redact.sh, a scar doc
  and a test; the real KEEP-IN argument is the spalla cure lane editing
