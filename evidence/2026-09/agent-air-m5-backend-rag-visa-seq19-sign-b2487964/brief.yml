task_id: visa-seq19-sign
gear: 3
l_level: L2
gate_class: opus
# Floor computed this run: `python3 scripts/evidence_pack_lint.py --print-floor
# --numstat-file ... --changed-files-file ...` returns `size` — the SIGNED
# bundle (rulepack-prod-019.signed.json) is 10,355 lines (pretty-printed,
# never hand-authored; the operator's sign_pack.py wrote it byte-for-byte
# from rulepack-prod-019.source.json). Size alone floors this at Gear 3
# regardless of the change's actual authored-logic footprint (one new ~300
# line test file + a ~30 line secrets-triage rule).
objective: >-
  Land the operator's just-signed seq-19 production RulePack bundle
  (rulepack-prod-019.signed.json, kid=prod-2026-07-1, sequence=19,
  environment=PRODUCTION) and independently VERIFY it with the repo's own
  Ed25519 verification code — never trusting the signer's self-reported
  digest/kid/sequence. seq-19's unsigned source
  (rulepack-prod-019.source.json) was folded and gated in the prior PR
  (#5784, visa-seq19-fold); this task's only job is the signed artifact plus
  the gate that proves the signature is real, chains from seq-18, and
  matches the source bytes exactly.
constraints:
  - >-
    DO NOT modify, re-sign, or regenerate rulepack-prod-019.signed.json —
    the operator's Ed25519 private key ceremony happened offline on M5,
    outside this session, and this PR only lands and verifies its output.
  - >-
    NEVER read or print the private signing key, and never touch
    ~/.config/nuzantara/visa-signing — this repo's FIREBREAK (bundle.py's
    own module docstring) is that no code path here ever holds key
    material; verification is Ed25519 PUBLIC-key-only, via
    StaticTrustStore.from_env().
  - >-
    ACTIVATION IS OUT OF SCOPE. activate_pack.py needs a live Postgres DSN
    even in its own default dry-run mode (asyncpg.create_pool calls before
    the dry-run branch) — this task never invokes it. Promoting this bundle
    into the active production sequence is a separate, Zero-only ceremony.
  - >-
    Verification must be independent of the signer's print output: recompute
    payload_sha256 via bundle.canonicalize_json from the SOURCE file on disk
    and cross-check it against verify_rule_pack's own return value, not
    against a value copied from a terminal transcript.
acceptance:
  - text: >-
      A1: WHEN rulepack-prod-019.signed.json is loaded and passed through
      bundle.verify_rule_pack against the pinned production trust store
      (kid=prod-2026-07-1), SHALL verify without raising
      RulePackVerificationError, and SHALL report unsigned_dev=False.
    probe: >-
      backend/tests/services/visa_engine/test_seq19_signed_bundle.py
  - text: >-
      A2: WHEN the payload_sha256 is recomputed via
      hashlib.sha256(canonicalize_json(payload)).hexdigest() from BOTH the
      signed envelope's own payload and the standalone source.json file, SHALL
      equal bac5da8e4727e7f639c947c50211e6f95e15c1403cf6aef0dd57a92014d6e6ea
      on both, and SHALL equal the envelope's own declared payload_sha256
      field.
    probe: >-
      backend/tests/services/visa_engine/test_seq19_signed_bundle.py
  - text: >-
      A3: WHEN the verified payload's previous_payload_sha256 is compared
      against seq-18's own re-derived payload digest, SHALL be equal
      (5a24472d187f85c54628f23d6e37b2a4b814e54762478c099472f0437d255849) —
      the chain anchor is correct.
    probe: >-
      backend/tests/services/visa_engine/test_seq19_signed_bundle.py
  - text: >-
      A4: WHERE the signed payload's rules list is inspected, SHALL contain
      exactly 109 rules including both review.e23u.requested-product and
      review.e23v.requested-product.
    probe: >-
      backend/tests/services/visa_engine/test_seq19_signed_bundle.py
  - text: >-
      A5: IF one byte of the signature or the payload is flipped on an
      in-memory copy, THEN verify_rule_pack SHALL raise
      RulePackVerificationError — guilt half of the guard (superscar #3).
    probe: >-
      backend/tests/services/visa_engine/test_seq19_signed_bundle.py
  - text: >-
      A6: WHEN scripts/detect_secrets_check_unaudited.py runs after
      detect-secrets scans the new/changed files and
      detect_secrets_auto_triage.py --apply runs, SHALL report zero residue —
      the new CONTENT_KEYED_RULES entry auto-approves this test file's three
      trust-anchor literals (public key, seq-18 chain digest, seq-19 payload
      digest), never anything else.
    probe: scripts/detect_secrets_check_unaudited.py
appetite:
  wall_clock_hours: 1.5
