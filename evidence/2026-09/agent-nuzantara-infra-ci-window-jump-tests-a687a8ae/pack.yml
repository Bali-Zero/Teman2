    status: CONFIRMED
    disposition: "Cured in 84ea3c16d0: the two pytest-style corpora run under python3 -m pytest (pip install pytest, the pattern the evidence-pack-lint corpus already uses in this job). Proven locally (35 passed) and in CI run 34376379320 on ubuntu-latest (35 passed in 2.40s). The step comment now records the finding."
  - seat: kimi-code/k3
    objection: "Same defect, found independently: two of the three python invocations execute zero tests and can never fail — W81 theater one layer down from the one the step denounces."
    status: CONFIRMED
    disposition: "Same cure, 84ea3c16d0; both seats converged on the first cut's only real flaw."
  - seat: kimi-code/k3
    objection: "The registry edit is asymmetric: context_jump_resume.py sits under exempt, whose free-text reason names test_context_jump_resume.py, but the checker never existence- or arm-checks a test named inside an exempt string, so C4 can never see that corpus; if the step line is later deleted nothing goes red."
    status: CONFIRMED
    disposition: "Cured in 618faa754b: context_jump_resume.py is a registered entry with the corpus as its tests: ref (24 entries, 0 violations). The seat's consequence was overstated and is corrected in the entry's own note: measured by mutation, deleting the step line still leaves the census green because C4 matches the infra/claude-hooks/ ancestor-dir substring — the documented census limit. The corpus is now censused (must exist, is named, is C4-checked); the one-deleted-line regression stays a known limit of the census, not of this PR."
  - seat: kimi-code/k3
    objection: "The window_jump.sh registry note contradicts itself once the gesture corpus runs on ubuntu: 'cannot run on a CI runner' two sentences before 'runs anywhere'."
    status: CONFIRMED
    disposition: "Reworded in 618faa754b: the HOOK cannot run on a runner, its corpus can and does, executed by guard-conformance.yml since this PR."
  - seat: kimi-code/k3
    objection: "Gesture case [1] has ~1s of slack on a loaded runner (4th shimmed window-names answer must land within JUMP_POLL_MAX_S=2 at 0.3s polls)."
