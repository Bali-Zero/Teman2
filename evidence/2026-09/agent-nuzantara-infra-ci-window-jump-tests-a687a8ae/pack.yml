    disposition: "Accepted as a declared risk, not cured here: the corpus file is out of this PR's scope (adding a step, not editing corpora) and the first CI run passed with margin (30/30). If it flakes, the cure is JUMP_POLL_MAX_S in the test's own env line, in its own PR."
