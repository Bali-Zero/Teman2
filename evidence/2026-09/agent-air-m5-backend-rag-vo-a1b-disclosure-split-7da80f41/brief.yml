objective: >-
  Slice A1' of VISA-ORACLE-DW-20260919/PLAN.md, curing PR #6839 (slice A1,
  closed) after gate vo-gate-a1 returned REWORK-BUILD with two HIGH findings
  on a change that deploys to a live public surface on merge. The gate
  verified A1's core semantics correct field-by-field and told this slice
  to re-use, not re-derive, them — this PR does exactly that: the disclosure
  split itself (evaluate_path.py's _apply_disclosed_review_flags, the ten
  vs. one partition, decision_id/public_id re-seeding on hold only, the
  co-disclosure naming) is unchanged from #6839.
  Two fixes: (1) OBS-1 HIGH — ACTIVITY_BOUNDARY is the flag `fact-mapper.ts`
  raises for what the signed pack CANNOT decide at all (the seven
  undecidable other_purpose values and diaspora_connection=dual); PLAN's
  own OD-2/OD-3 defaults name a dead end for that case, not a condition, so
  releasing it to SUPPORTED_CANDIDATES ahead of the UI that would render
  the condition (slice A2, dark today) was a legal-exposure regression.
  HOLDING_DISCLOSED_FLAGS now holds {CRIMINAL_RECORD, ACTIVITY_BOUNDARY};
  A1' releases NINE flags, not ten. (2) OBS-2 HIGH — the kill switch
  (_resolve_holding_flags, VISA_ORACLE_HOLDING_FLAGS) failed OPEN whenever
  every token in the env value was unrecognized after normalisation
  (lower-case, `*`, `ALL`, wrong separator, quotes, JSON-ish, oversized) —
  it silently resolved to just the floor instead of failing closed. Tokens
  are now `.strip().upper()`-normalised (so `health_concern` DOES resolve),
  and every malformed shape — zero tokens recognized, any unrecognized
  token mixed with a recognized one, or a value over 512 chars (capped
  BEFORE parsing) — now fails CLOSED to all eleven flags. Also closes two
  LOW findings from the same gate: OBS-3 (review_hold_inventory.py now
  derives holding vs conditioning from HOLDING_DISCLOSED_FLAGS itself via
  a new split_disclosed_review_codes(), instead of counting all 11
  disclosed codes as live hold producers), OBS-5 (conditioning flags sorted
  into DisclosedReviewFlag's declaration order before their notices are
  built, so two requests differing only in flag order yield identical
  notices), and OBS-6 (decision_integrity nulled defensively on the
  released path, closing the latent seal trap if the adapter ordering
  upstream of seal_decision is ever changed). OBS-4/OBS-7 (LOW/INFO, body
  hygiene) are addressed in this PR's own body, not in code.
  Re-measured on signed seq-22 (111-walk W-VO-Q corpus): FUNNEL moves from
  ENGINE's 94/14/1/3 to 88/14/1/9 — the six ACTIVITY_BOUNDARY walks return
  to HUMAN_REVIEW_REQUIRED (94-6=88 SUPPORTED_CANDIDATES, 3+6=9
  HUMAN_REVIEW_REQUIRED), while NOT_CERTAIN's two walks still condition.
  Per conductor ruling R-SEQ (2026-09-19): A2 (the mouth's notices render)
  must merge and be promoted BEFORE this PR opens, so this slice is BUILT
  and HELD, not pushed — the release of nine flags with an invisible
  condition would repeat the exact exposure gate vo-gate-a1 flagged, just
  with a smaller set.
