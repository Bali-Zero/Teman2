objective: >-
  Slice A1 of VISA-ORACLE-DW-20260919/PLAN.md: split the disclosure adapter.
  _apply_disclosed_review_flags (evaluate_path.py) previously rewrote the
  decision to HUMAN_REVIEW_REQUIRED for ANY of the 11 DisclosedReviewFlag
  members, unconditionally. After this PR: CRIMINAL_RECORD alone keeps the
  hold (HOLDING_DISCLOSED_FLAGS); the other ten emit a named
  *_CONDITION Reason into decision.notices and leave state/candidates/
  missing_facts/no_path_reasons/quotes exactly as the signed pack decided —
  per Zero's 2026-09-13 ruling (memory
  decision-oracle-human-review-only-for-criminal-matters-ceremony-roles-
  authorized-2026-09-13). Adds a fail-closed kill switch,
  VISA_ORACLE_HOLDING_FLAGS (env, read fresh per evaluation via
  _resolve_holding_flags — never memoised at import time), that can widen
  the holding set fleet-wide with `fly secrets set` + restart, no redeploy;
  an unparseable value (malformed comma list) holds all eleven flags, an
  unknown flag name holds the recognized subset, and CRIMINAL_RECORD is
  unioned into every return path so no env value can ever release it.
  This PR ALSO re-pins test_interview_walk_census.py: the census is this
  change's own consumer (PLAN's own instruction), and its prior derivation
  ("_apply_disclosed_review_flags is... unconditional... ANY flag ends
  HUMAN_REVIEW_REQUIRED") is exactly the premise A1 overturns. Measured
  delta on signed seq-22 (111-walk W-VO-Q corpus): FUNNEL 11 -> 3
  HUMAN_REVIEW_REQUIRED, now identical to ENGINE (94/14/1/3) because this
  corpus raises only ACTIVITY_BOUNDARY (6 walks) and NOT_CERTAIN (2 walks),
  neither holding — exactly the plan's own predicted 11 -> 3, confirmed by
  measurement, not assumed. One reachability-guard test
  (test_the_products_the_applicant_is_never_shown_are_pinned_by_cause) and
  one production-facts scenario
  (test_offshore_positive_overstay_conflict_forces_human_review, renamed
  ..._names_a_condition) also needed re-pinning for the same reason. OD-2
  and OD-3 (undecidable other_purpose sub-values; dual-citizenship status)
  do NOT land in this slice: A1's engine adapter sees only the
  DisclosedReviewFlag enum member, never which frontend answer raised it,
  so distinguishing "undecidable ACTIVITY_BOUNDARY" from any other
  ACTIVITY_BOUNDARY raise, or giving dual-citizenship its own flag instead
  of falling through NOT_CERTAIN/AMBIGUOUS_SPONSOR, needs a fact-mapper.ts
  change on the mouth side — PLAN's own A3 slice ("map the three orphan
  REVIEW_GATE_ITEMS... or a new flag"). A1 ships exactly PLAN §4's literal
  spec: ACTIVITY_BOUNDARY -> DISCLOSED_ACTIVITY_BOUNDARY_CONDITION for
  every raise, with no sub-classification. Bites:
  test_interview_walk_census.py's FUNNEL column (measured, re-pinned, green
  in this PR) plus 31 new/updated unit tests in test_evaluate_endpoint.py
  (guilt+innocence per non-criminal flag, the criminal hold, the co-
  disclosure case, the kill switch's 5 branches) — both suites run green in
  this PR's own CI job.
