brief_ref: evidence/brief.yml
council_run: "council-journal.jsonl"
plan_ref: >-
  PR (agent/air-m5/wa-team/t3-p2-link-0929, base main) - T3 P2 linker: fill client_id and
  team_member_email on team_promises from the mirror message row, fill-NULL-only.
lanes:
  - lane: wa-team-t3-p2-link-build
    role: build
    seat: "claude-sonnet-5-5 (continued a dead builder's uncommitted diff, reviewed it, ran the council, applied findings by hand)"
  - lane: wa-team-t3-p2-link-council-codex
    role: review
    seat: "codex-gpt-5.6-sol (round 1 REWORK on 3 MEDIUM + 1 LOW)"
  - lane: wa-team-t3-p2-link-council-kimi
    role: review
    seat: "kimi-code/k3 (round 1 GO-WITH-NITS, no HIGH)"

what_changed: |
  1. `--link` mode: two guarded UPDATEs (client_id, team_member_email), each `target IS NULL AND
     source IS NOT NULL`; the email is normalised by one shared expression (trim, lower, blank -> NULL).
  2. `--link --dry-run` prints a counts-only audit (total, *_null, linkable_*, *_not_in_*, conflicts).
  3. The judge INSERT is INSERT ... SELECT from whatsapp_message_context so new promises are linked
     at insert. `_apply_true` re-reads the message FOR SHARE in the same transaction, so the SELECT
     cannot be empty there; a missing row is answered "superseded" first.
  4. Tests: 9 unit + 9 real-PG (synthetic ids and example.invalid addresses). Floors 249 -> 258 and
     56 -> 65.
  Round-1 changes: the audit now normalises the promise's own email in `conflicts` and the roster
  lookup, and counts *_not_in_* over the effective value (own if set, else the one the linker would
  write); a `--link --init-schema` exclusivity case and a case/whitespace-equivalent audit fixture.

proof: |
  Unit corpus: 258 passed, 65 skipped. Real-PG mode (pg_ctl/initdb on PATH): 65 passed, 0 skipped.
  The observation that matters is the Pro `--link --dry-run` before and after `--link`.

dissent:
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM: ON CONFLICT DO NOTHING can yield INSERT 0 0 with no rowcount check, so the judge may report true without inserting."
    status: PLAUSIBLE
    resolution: "OPEN, accepted: the conflict path is pre-existing behaviour (the VALUES form had the same clause) and means the promise already exists; the missing-row path is closed by the FOR SHARE pre-check and pinned by a test. Not changed here."
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM: audit email normalisation asymmetric (raw promise email vs normalised source; roster trimmed on one side only)."
    status: CONFIRMED
    resolution: "Both sides normalised with the same expression; a case/whitespace fixture added."
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM: *_not_in_* only inspect NULL-target rows, undercounting invalid links already present."
    status: CONFIRMED
    resolution: "Counted over the effective value."
  - seat: kimi-code/k3
    objection: "MEDIUM: a legacy '' in team_promises.team_member_email is never repaired and counted non-null."
    status: PLAUSIBLE
    resolution: "OPEN, accepted: fill-NULL-only is the mandate; documented in the SQL comment. Measured on Pro: no blank values were reported by the lead."
  - seat: kimi-code/k3
    objection: "LOW: run_link(dry_run=True) is unreachable from the CLI (which prints the audit instead)."
    status: CONFIRMED
    resolution: "Kept: it is the count-what-would-be-filled API exercised by a real-PG test; the CLI dry-run prints the richer audit."
  - seat: kimi-code/k3
    objection: "LOW: --link --init-schema exclusivity untested."
    status: CONFIRMED
    resolution: "Added to the mutual-exclusion test."

