dissent:
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      The config cases reconstruct the expected URL by hand instead of invoking a consumer, and
      the existing router tests assert a `/portal/invite?token=` link the service has not
      produced for a long time — so the whole suite could pass while the real composition was
      broken. CURED: the path is now a constant on the service (INVITE_PATH_TEMPLATE), and a
      consumer-level case runs the real router with the real default, no monkeypatch.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      The Pydantic field description embedded dated production observations and incident
      history, which will go stale in place. CURED: the description is contractual now and the
      evidence lives in this pack.
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: >-
      Sibling endpoints (resend_invitation, crm_portal_integration.send_portal_invite) claim
      success without mailing. Verified true on disk, but a different defect from a base-URL
      change and unreachable from the panel. Recorded in residual_risks.
  - seat: kimi-code/k3
    status: CONFIRMED
    objection: >-
      No trailing-slash normalisation: the router concatenates base and path raw, so a base
      ending in "/" would mail `//portal/register?token=...`, and every existing case used a
      clean base. CURED at the composition point with a dedicated, guilt-proven case.
  - seat: kimi-code/k3
    status: RETRACTED
    objection: >-
      "200 on the root proves nothing about /portal/register?token=". The measurement was taken
      on the full path, not the root: `curl 'https://my.balizero.com/portal/register?token=x'`
      -> 200, and the same call against the old default's full path -> 404. Recorded in the
      ground journal line and in the receipts above.
  - seat: kimi-code/k3
    status: RETRACTED
    objection: >-
      The dead alias lingers in cors_config.py, hybrid_auth.py and openapi.yaml. True and
      harmless — an allowed origin that resolves nowhere grants nothing. Different concern.
  - seat: claude-opus-5 (independent Gear-3 gate, first pass)
    status: CONFIRMED
    objection: >-
      The trailing-slash cure was applied inside the invite router, but
      `garuda_orders/outbox_handlers.py` passes the same setting as `portal_base_url` and would
      still have mailed `//portal/...`. A normalisation each consumer must repeat is one the next
      consumer forgets. CURED at the source: a `field_validator` on `frontend_portal_url`; the
      router's local `rstrip` removed as redundant; the case moved from the router suite to the
      settings suite, where it binds both consumers. Guilt re-proven: neutralising the validator
      fails 3 of the 4 new cases.
  - seat: claude-opus-5 (independent Gear-3 gate, first pass)
    status: CONFIRMED
    objection: >-
      The declared prove-live observation proved nothing. It read
      `settings.frontend_portal_url` on the deployed machine — which already answers the live
      domain because FRONTEND_PORTAL_URL was set ahead of this PR to cure production — so it would
      have been green with or without this diff. CURED: the observation now pops the env var out of
      the process environment and constructs `Settings`, isolating the DEFAULT. Measured that way on
      the live machine BEFORE the merge, it prints `https://nuzantara-mouth.vercel.app`; after the
      merge it must print `https://my.balizero.com`.
  - seat: claude-opus-5 (independent Gear-3 gate, first pass)
    status: CONFIRMED
    objection: >-
      The PR body still described only the first commit. CURED: rewritten against head.
  - seat: claude-opus-5 (independent Gear-3 gate, first pass)
    status: CONFIRMED
    objection: >-
      The shared `FakeInviteService` fixture still minted `/portal/invite?token=`. The previous
      round added one case that read `INVITE_PATH_TEMPLATE` and left the stale shape asserted by
      every other case in the file — curing the symptom in one place while the fixture kept
      teaching the wrong link. CURED: the fixture reads the template, the assertions that consume
      it expect `/portal/register`, and the duplicate fake the previous round introduced was
      deleted, since a correct fixture made it redundant.
