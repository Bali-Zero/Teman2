pii_scan_note:
  "No client data of any kind is in this diff, this pack, or either council prompt. The organ
  itself processes Pro/Fly client-adjacent data (practices) under the Symbiosis Law 2 lane its
  own env-guard enforces, but every count its output/logs/PR body/this pack carries is an int,
  a column name, a practice-type CODE (a shared service-catalog key, not client data), or a
  synthetic fixture uuid/string (`client-uuid-a`, `11111111-...`, `not-a-real-date`,
  `2147483648`) -- never a real client id, name, uuid, phone, date, or note. The council
  prompts sent to codex/kimi carried only the diff + spec_P4_practices_replica.md -- no repo
  dump, no session environment, no client identifiers, no secrets. The one production-adjacent
  fact this pack states (Pro's live crontab/LaunchAgents/OpenClaw config contents) is
  infrastructure metadata, not client data, and carries no client identifier either."

