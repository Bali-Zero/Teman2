what_changed: |
  Four commits on top of origin/main: the organ itself (`scripts/wa_practices_replica.py`,
  544 lines) + its cron wrapper + two test files (unit fakes + opt-in real-PG) + one CI
  workflow (c07197368c); this evidence pack's `brief.yml` (0a5f065d69); and two Gear-3
  council fix commits (adc96ce34d, c1611763d9) closing three independently-confirmed defects.

  BEFORE opening the PR: the mandatory stop-gate census (reader table + downstream-effect
  analysis) and the FK census (every foreign key on Pro `practices`, `practice_types`
  replicated first in the same transaction as a Fly-owned dependency) -- both cleared by the
  coordinator's own rulings, documented in the PR body and the module docstring.

  AFTER opening the PR (this pack): a two-round Gear-3 council on the diff, dispatched to two
  independent, cross-family seats fed ONLY the diff + spec_P4_practices_replica.md (no client
  data, no session env, no repo dump).

  Round 1 (full diff, both seats dispatched independently, neither saw the other's output):
  codex-gpt-5.6-sol found practice_type_id excluded from the copied columns entirely -- NULL
  on insert, stale on an update that changed practice_type_code, contradicting the
  "intersecting columns" contract. kimi-code/k3 found _coerce_param's own type conversions ran
  outside any per-row fail-closed net -- one malformed Fly value (a bad date, an out-of-range
  int, an unrecognized boolean string) would abort the WHOLE transaction, forever, on an
  unattended hourly cron, since the source Fly data doesn't change on its own. kimi also named
  scripts/expiry_alerter.py as an uncensused Pro-side reader with real outbound effects
  (team-member email + owner Telegram) -- investigated directly (not via a seat, since this is
  a factual repo/infra question, not a code-review judgment call): confirmed via `ssh pro` it
  is ABSENT from crontab, LaunchAgents and the OpenClaw config despite docs/AUTOMATIONS.md
  claiming a daily cron, and its own code defaults to querying Fly directly (not Pro's local
  copy) even if it were run manually. Resolved as informational, not merge-blocking, added to
  the PR's reader census.

  Fix commit 1 (adc96ce34d): practice_type_id re-keyed through a Pro-side code->id map (same
  shape as client_id's existing re-key through clients.uuid), built right after the
  practice_types upsert, in the same transaction. Parameter construction for BOTH loops moved
  inside their own per-row nested transaction, catching ValueError as a new skipped_invalid
  metric distinct from skipped_fk. Boolean branch hardened to raise on anything other than the
  two strings a real boolean::text cast can produce.

  Delta round (delta diff only): codex-gpt-5.6-sol confirmed finding A (practice_type_id)
  closed cleanly, but found fix commit 1's closure of finding B incomplete: Python's int() has
  no int4 ceiling, so an out-of-range value (`_coerce_param("2147483648", "integer")`) returned
  cleanly and asyncpg raised a REAL DataError -- not a ValueError -- past both per-row except
  clauses, reopening the exact failure mode the fix existed to close. Also flagged the
  ValueError catch as scoped too broadly (wrapping fetchrow itself), risking a genuine
  driver/UPSERT error being silently misclassified as "invalid Fly data".

  Fix commit 2 (c1611763d9): _coerce_param's integer branch now validates PostgreSQL's actual
  int4 range (-2147483648..2147483647) explicitly, raising ValueError itself before any DB
  call. Parameter construction for both loops now runs in its OWN try/except, strictly BEFORE
  the nested transaction opens (not inside it) -- a rejected row never even opens a savepoint,
  and skipped_invalid can only ever originate from _coerce_param, never from fetchrow. The
  finding was mutation-verified as real BEFORE the fix was accepted: reverting the range check
  on a live Postgres cluster reproduced codex's exact predicted error,
  `asyncpg.exceptions.DataError: invalid input for query argument $6: 2147483648 (value out of
  int32 range)`, uncaught, aborting the run -- then the fix was restored and the full suite
  (79 cases) plus a fresh real Fly+Pro dry-run were re-run clean.

  kimi's delta-round pass could not be obtained: two dispatch attempts both failed on a kimi
  CLI OAuth token-refresh error (network/infra, not a content response), matching this
  session's own independently-observed arsenal probe showing kimi as down. Recorded
  UNREACHABLE per the two-strikes rule -- no verdict invented. kimi's own round-1 finding
  (skipped_invalid's per-row net) is not left unverified: it is the SAME finding class codex's
  delta round re-examined and confirmed closed (after the second fix), from an independent
  seat, on the same code.

  FRESH GATE (2026-09-29, verdict REWORK-BUILD @3213ea24a9): a fresh Opus session outside this
  PR's contribution chain confirmed the round-1 and delta fixes above are CORRECT -- not a
  fix-of-a-fix -- but found merging that head as-is would turn main red, plus independent test
  and census gaps. Six conditions (R1-R6), closed in one further build round:

  R1: `wa practices replica tests` registered in `main-push-failure-watch.yml`'s `workflows:`
  list -- `watcher-coverage.yml`'s self-conformance check was deterministically red otherwise
  (a watcher that isn't itself watched is the exact defect class it exists to catch).

  R2: 8 literal-oracle tests closing every mutant the gate's OWN 32-mutant mutation round left
  surviving in BOTH suites (21 killed, 8 survived) -- each asserts against a LITERAL value,
  never the module's own constant compared to itself: the Fly READ ONLY transaction text and
  `PG_TARGET=prod`, captured off the faked `subprocess.run` call; a guilt case using a
  non-`FLY_APP_NAME` `FLY_*` var; `_PG_ENV_VARS_TO_CLEAR` and `PRO_LOCAL_CONNECT_KWARGS`
  asserted as their literal tuples/dict; the Fly SELECT's client join asserted by substring;
  `user_profile_id`'s absence asserted by substring; and two fetchrow-level discriminating
  tests (a real `ValueError` and a real `asyncpg.exceptions.DataError` raised BY fetchrow
  itself, not by `_coerce_param`) replacing the prior `RuntimeError`-based test, which could
  not discriminate the scope-narrowing fix at all -- verified empirically: the new `ValueError`
  test is RED against commit `adc96ce34d` (the first fix, before the catch was narrowed);
  the `DataError` test was found NOT to discriminate either (asyncpg's `DataError` never
  inherited from `ValueError`, so it was always caught correctly) and its docstring corrected
  to say so honestly rather than claim a false discrimination.

  R3 (gate finding F2): a Fly `practices`/`practice_types` row with a NULL `uuid`/`code` is now
  skipped+counted (`skipped_invalid`) before it ever reaches `fly_uuids` or the UPSERT.
  Reproduced against a REAL cluster before the fix, in both schema variants the gate's own
  finding named: on the real NOT-NULL schema, an uncaught `NotNullViolationError` aborted the
  whole run on the first attempt; on a relaxed (nullable) schema -- the gate's own literal
  repro condition -- a fresh duplicate row landed every run (3 runs, 3 duplicates) and
  `pro_only_kept` was poisoned to 0 regardless of a genuine Pro-only row, via SQL's own
  NULL-comparison semantics on `uuid <> ALL($1::uuid[])`. Both variants re-verified clean after
  the fix, same methodology (3 repeated runs, real cluster).

  R4 (gate finding F3): `cli_main` now returns `rc=3` (distinct from `1`=exception-aborted and
  `2`=guard/argparse-refused) when `skipped_fk>0` or `skipped_invalid>0` AFTER a real commit --
  every good row still lands, but a cron-runner receipt no longer reads clean when Fly data
  could not be fully placed. Documented in the module docstring and the cron wrapper's header
  (superscar #2 -- "esiste != armato" applies to exit codes too: a receipt that reads green
  whatever the skip counts are is the same disease as a cron nobody watches).

  R5: this pack and the PR body refreshed -- corrected test counts/floor, the `practice_type_id`
  FK-table row (re-keyed, not excluded), and the reader census extended with every spec-listed
  reader the gate's own F4 finding named: `apps/wa-mirror/bridge/pg.ts`'s
  `findOpenPracticeForClient` (Pro-local write, stamping `whatsapp_message_context.practice_id`
  for the newly-visible rows, no outbound effect found), `scripts/crm_merge_duplicates.py`
  (manual, dry-run by default), `apps/wa-dashboard-m1` (0 references, confirmed by grep), and
  the classifier's Ollama path (`scripts/wa-mirror-attention-classifier.py:163-164,297-298`:
  `has_active_practice` enters the Ollama prompt for rule-ambiguous rows, `USE_OLLAMA` defaults
  to true, and HIGH from that path means a realtime owner Telegram alert -- DISCLOSED, not
  ruled on: the coordinator's re-confirmation of ruling (a) with this disclosed is C1, owned by
  the coordinator, not decided here). Pro `practices` triggers were listed at R5-time as
  UNCONFIRMED (C2, owned by the conductor) -- see R7 immediately below for what that census
  actually found once run.

  R6: CI floor raised to the new passed count (64 -> 80 unit, 15 -> 17 real-PG).

  Re-ran the real Fly+Pro dry-run after the R1-R4/R6 commit (staged temp layout on Pro, never
  the runtime checkout, deleted after use): clean, identical insert/update/pro_only/types
  counts to every prior run, `skipped_fk=0 skipped_invalid=0` -- no NULL-keyed or malformed
  rows exist in real Fly data today, so this round's guards were unexercised by production data
  but are proven against a real cluster via the R2/R3 test additions above.

  R7 (2026-09-29, found closing C2 -- same round, not a new gate cycle): the coordinator measured
  Pro's `practices`/`practice_types` triggers directly (DDL, not a migration-file inference) and
  found the ONLY non-internal ones are `update_practices_updated_at` /
  `update_practice_types_updated_at`, both `BEFORE UPDATE` -> `update_updated_at_column()`
  (`NEW.updated_at = NOW()`) -- `trg_practice_changed`/`trg_practice_status_log` are Fly-only
  (Pro's migration ledger stops at 246, those never ran there). That measurement surfaced a real
  bug this pack's own build lane had shipped: `updated_at` sat inside `_DATA_COLUMNS` /
  `_PRACTICE_TYPES_DATA_COLUMNS`, so it was part of both `_build_upsert_sql`'s `SET` clause and
  its `WHERE (...) IS DISTINCT FROM (...)` comparison on BOTH tables. Because Pro's trigger
  overwrites `NEW.updated_at` unconditionally on every real `UPDATE` -- independent of whatever
  the `SET` clause assigns -- the FIRST genuine data change on any row makes Pro's `updated_at`
  diverge permanently from Fly's stable value; every run after that would see the row as
  "distinct" purely on that divergence, re-fire the `UPDATE`, and the trigger would re-stamp
  `NOW()` again -- idempotency broken from a row's second real change onward, forever, silently
  (`updated` would never settle at 0 for a touched row).

  Fixed: `_build_upsert_sql` gained a `trigger_maintained` parameter: those columns stay in the
  `INSERT` (a first-time row still keeps Fly's original timestamp -- `INSERT` never fires a
  `BEFORE UPDATE` trigger) but are dropped from both the `SET` clause and the comparison. Both
  UPSERT builders now pass `trigger_maintained=("updated_at",)`. MUTATION-VERIFIED before
  accepting the fix as real, same discipline as the delta round's int4-range fix: reverted the
  `trigger_maintained` call-site arguments (via a `cp` backup, `ast.parse` confirmed the revert's
  own syntax, then restored byte-identical afterward), added the EXACT Pro trigger DDL to the
  real-PG fixture's schema (previously absent -- every prior run of this suite passed
  idempotency with no way to ever have caught this), ran the two new R7 tests against the
  reverted code and watched them fail exactly as predicted
  (`test_real_pg_updated_at_trigger_does_not_reopen_idempotency_on_practices`: run 3
  `(inserted, updated, unchanged) == (0, 1, 0)`, expected `(0, 0, 1)`;
  `..._on_practice_types`: run 3 `(types_inserted, types_updated) == (0, 1)`, expected `(0, 0)`),
  then restored the fix and re-ran clean. Re-ran the real Fly+Pro dry-run after this fix too
  (staged temp layout, deleted after use): identical counts to every prior run -- this is Pro's
  FIRST real sync (no prior committed run for the bug to have bitten yet), so R7 is preventive
  for the hourly cron's second-and-later runs, not a correction of a number already observed.

