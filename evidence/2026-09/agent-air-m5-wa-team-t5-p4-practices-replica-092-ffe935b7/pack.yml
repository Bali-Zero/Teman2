      row inserts a fresh duplicate every run and poisons pro_only_kept to 0 via SQL's own
      NULL-comparison semantics on `uuid <> ALL(...)`. Also flagged codex-cli's independent
      second opinion (REWORK) adopting and reproducing the same finding."
    status: CONFIRMED
    resolution:
      "Fixed (R3): a NULL uuid/code is skipped+counted (skipped_invalid) before it ever reaches
      fly_uuids or the UPSERT. Reproduced BOTH variants the finding implies before fixing them
      (the real NOT-NULL schema's uncaught NotNullViolationError, and a relaxed-schema's
      duplicate-insert + pro_only poisoning, 3 repeated runs each on a real cluster) -- then
      re-verified both variants clean after the fix, same methodology. See what_changed's R3
      paragraph for the full mechanism."
