      space is not a realistic exhaustion risk on any relevant horizon). Not built -- no
      REWORK-BUILD condition required it, and it is not a defect of this diff's behavior, only
      an accurate observation about how PostgreSQL sequences work under any UPSERT. The
      DateStyle/encoding hardening is a legitimate follow-up on scripts/pg.sh (out of this
      diff's scope -- pg.sh is a shared sibling script, not owned by this PR)."
  - seat: coordinator
    objection:
      "R7 (NOT one of the gate's own F-findings -- a separate finding from the C2 condition's
      own closure, 2026-09-29): measured Pro's practices/practice_types trigger DDL directly.
      The ONLY non-internal triggers are BEFORE UPDATE -> update_updated_at_column() on both
      tables, stamping NEW.updated_at = NOW() unconditionally. Because updated_at was part of
      this UPSERT's SET clause and its IS DISTINCT FROM comparison, the first real UPDATE on
      any row would make Pro's updated_at diverge from Fly's permanently, and the hourly cron
      would re-fire an UPDATE on that row on every subsequent run forever, re-stamping NOW()
      each time -- idempotency broken from a row's second real change onward, silently."
    status: CONFIRMED
    resolution:
      "Fixed: _build_upsert_sql gained a trigger_maintained parameter: updated_at stays in the
      INSERT column list (a first-time row still keeps Fly's original timestamp) but is
      excluded from both the SET clause and the IS DISTINCT FROM comparison on BOTH
      practices and practice_types. Mutation-verified before accepting the fix as real: reverted
      the trigger_maintained call-site arguments, installed the EXACT Pro trigger DDL in the
      real-PG fixture's schema (previously absent from that fixture entirely -- every prior run
      of this suite passed idempotency with no way to ever have caught this), ran the two new
      R7 real-PG tests against the reverted code and watched both fail exactly as predicted,
      then restored the fix (byte-identical cp) and re-ran clean. See receipts below."

