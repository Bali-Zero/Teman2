  Wall-clock ran to 3 hours (vs. a 2-hour reference in the closest precedent lane), because the
  delta round surfaced a SECOND, deeper defect (the int4-range gap) requiring its own
  mutation-verification against a real cluster before being accepted as real -- not skipped,
  since the delta round exists precisely to catch an incomplete first fix. codex's delta round
  was not re-dispatched a THIRD time to review fix commit 2, per the Builder Contract's "a
  fix-of-a-fix stops at depth 1" -- the harder proof (reproducing the EXACT predicted failure
  against a live cluster, then confirming the fix closes it, both empirically) was already
  obtained without a third LLM round. kimi's delta round could not be obtained at all (2 failed
  attempts, network/infra) -- recorded unreachable rather than retried a third time or invented,
  consistent with the two-strikes rule and with not letting an unrelated infra outage inflate
  the round count further.

