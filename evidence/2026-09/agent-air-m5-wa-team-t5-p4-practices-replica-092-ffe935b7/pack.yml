    file alone is over the ~400-line guideline -- accepted rather than split, because a one-way
    cross-database replica with a discovered FK dependency (practice_types) and its own
    fail-closed nets cannot be usefully halved without leaving one half unable to run
    standalone; the FK-census ruling itself required replicating the dependency in the SAME
    transaction as the dependent table, which is a single-file, one concern change even though
    it is not a small one.
