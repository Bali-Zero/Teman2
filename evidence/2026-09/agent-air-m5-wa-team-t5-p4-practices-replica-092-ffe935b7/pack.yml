    objection:
      "F7 (LOW, informational): every attempted UPSERT burns one nextval on practices_id_seq,
      unchanged rows included -- ~1.1k/hour reproduced. Dry-run 'nothing persisted' is
      therefore not literally true for sequences. From codex's second opinion, as hardening:
      pin DateStyle=ISO / PGCLIENTENCODING=UTF8 on the Fly read."
    status: PLAUSIBLE
    resolution:
