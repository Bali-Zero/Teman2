      own docstring, but cli_main's exit code is 0 regardless of their value -- a Fly type
      drift that turned 100% of rows into skipped_invalid would still exit clean to a
      cron-runner receipt."
    status: CONFIRMED
    resolution:
      "Fixed (R4): cli_main now returns rc=3 (distinct from 1/2) when skipped_fk>0 or
      skipped_invalid>0 after a real commit. Documented in the module docstring and the cron
      wrapper's header, with unit guilt+innocence tests exercising cli_main's rc mapping
      directly (a fake run_sync controls the metrics, isolating the rc logic from the sync
      logic already covered elsewhere)."
  - seat: fresh-gate-opus
    objection:
