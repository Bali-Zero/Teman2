brief_ref: evidence/brief.yml
council_run: "council-journal.jsonl"
plan_ref:
  "PR #7598 (agent/air-m5/wa-team/t5-p4-practices-replica-0928, base main) -- T5 P4, a
  one-way Fly -> Pro replica of `practices` + its `practice_types` dependency. Dispatched by
  the coordinator (team-lead) after two prior rulings (D3: proceed past the stop-gate census;
  FK-census ruling: replicate `practice_types` as a Fly-owned dependency, not degrade the row).
  This pack covers the Gear-3 council the coordinator required before the on-disk gate, since
  the brief declares gear 3 (a real cross-database migration with FK/side-effect risk)."
lanes:
  - lane: wa-team-t5-p4-practices-replica-build
    role: build
    seat:
      claude-sonnet-5 (conducting session -- built the replica, ran the stop-gate census, the
      FK census, this Gear-3 council round, applied every CONFIRMED finding by hand across two
      fix commits, wrote this pack; no reviewing seat has write access to this tree)
  - lane: wa-team-t5-p4-practices-replica-council-codex
    role: review
    seat: "codex-gpt-5.6-sol (round 1 verdict REWORK; delta round verdict REWORK on a second, deeper finding; not re-run after the second fix -- see appetite_exceeded)"
  - lane: wa-team-t5-p4-practices-replica-council-kimi
    role: review
    seat: "kimi-code/k3 (round 1 verdict GO-with-conditions; delta round UNREACHABLE -- OAuth token-refresh failure, two attempts, network/infra, not content)"

what_changed: |
  Four commits on top of origin/main: the organ itself (`scripts/wa_practices_replica.py`,
  544 lines) + its cron wrapper + two test files (unit fakes + opt-in real-PG) + one CI
  workflow (c07197368c); this evidence pack's `brief.yml` (0a5f065d69); and two Gear-3
  council fix commits (adc96ce34d, c1611763d9) closing three independently-confirmed defects.

  BEFORE opening the PR: the mandatory stop-gate census (reader table + downstream-effect
  analysis) and the FK census (every foreign key on Pro `practices`, `practice_types`
  replicated first in the same transaction as a Fly-owned dependency) -- both cleared by the
  coordinator's own rulings, documented in the PR body and the module docstring.

  AFTER opening the PR (this pack): a two-round Gear-3 council on the diff, dispatched to two
  independent, cross-family seats fed ONLY the diff + spec_P4_practices_replica.md (no client
  data, no session env, no repo dump).

  Round 1 (full diff, both seats dispatched independently, neither saw the other's output):
  codex-gpt-5.6-sol found practice_type_id excluded from the copied columns entirely -- NULL
  on insert, stale on an update that changed practice_type_code, contradicting the
  "intersecting columns" contract. kimi-code/k3 found _coerce_param's own type conversions ran
  outside any per-row fail-closed net -- one malformed Fly value (a bad date, an out-of-range
  int, an unrecognized boolean string) would abort the WHOLE transaction, forever, on an
  unattended hourly cron, since the source Fly data doesn't change on its own. kimi also named
  scripts/expiry_alerter.py as an uncensused Pro-side reader with real outbound effects
  (team-member email + owner Telegram) -- investigated directly (not via a seat, since this is
  a factual repo/infra question, not a code-review judgment call): confirmed via `ssh pro` it
  is ABSENT from crontab, LaunchAgents and the OpenClaw config despite docs/AUTOMATIONS.md
  claiming a daily cron, and its own code defaults to querying Fly directly (not Pro's local
  copy) even if it were run manually. Resolved as informational, not merge-blocking, added to
  the PR's reader census.

  Fix commit 1 (adc96ce34d): practice_type_id re-keyed through a Pro-side code->id map (same
  shape as client_id's existing re-key through clients.uuid), built right after the
  practice_types upsert, in the same transaction. Parameter construction for BOTH loops moved
  inside their own per-row nested transaction, catching ValueError as a new skipped_invalid
  metric distinct from skipped_fk. Boolean branch hardened to raise on anything other than the
  two strings a real boolean::text cast can produce.

  Delta round (delta diff only): codex-gpt-5.6-sol confirmed finding A (practice_type_id)
  closed cleanly, but found fix commit 1's closure of finding B incomplete: Python's int() has
  no int4 ceiling, so an out-of-range value (`_coerce_param("2147483648", "integer")`) returned
  cleanly and asyncpg raised a REAL DataError -- not a ValueError -- past both per-row except
  clauses, reopening the exact failure mode the fix existed to close. Also flagged the
  ValueError catch as scoped too broadly (wrapping fetchrow itself), risking a genuine
  driver/UPSERT error being silently misclassified as "invalid Fly data".

  Fix commit 2 (c1611763d9): _coerce_param's integer branch now validates PostgreSQL's actual
  int4 range (-2147483648..2147483647) explicitly, raising ValueError itself before any DB
  call. Parameter construction for both loops now runs in its OWN try/except, strictly BEFORE
  the nested transaction opens (not inside it) -- a rejected row never even opens a savepoint,
  and skipped_invalid can only ever originate from _coerce_param, never from fetchrow. The
  finding was mutation-verified as real BEFORE the fix was accepted: reverting the range check
  on a live Postgres cluster reproduced codex's exact predicted error,
  `asyncpg.exceptions.DataError: invalid input for query argument $6: 2147483648 (value out of
  int32 range)`, uncaught, aborting the run -- then the fix was restored and the full suite
  (79 cases) plus a fresh real Fly+Pro dry-run were re-run clean.

  kimi's delta-round pass could not be obtained: two dispatch attempts both failed on a kimi
  CLI OAuth token-refresh error (network/infra, not a content response), matching this
  session's own independently-observed arsenal probe showing kimi as down. Recorded
  UNREACHABLE per the two-strikes rule -- no verdict invented. kimi's own round-1 finding
  (skipped_invalid's per-row net) is not left unverified: it is the SAME finding class codex's
  delta round re-examined and confirmed closed (after the second fix), from an independent
  seat, on the same code.

