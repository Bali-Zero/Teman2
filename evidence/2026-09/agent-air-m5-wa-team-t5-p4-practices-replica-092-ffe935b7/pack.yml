    wa-practices-replica-tests.yml's own FLOOR (unit-only, REAL_PG unset)  -> 64

  Real Fly+Pro dry-run, run THREE times across this PR's build+council lifecycle (staged temp
  layout on Pro each time -- never the runtime checkout, deleted after use), all three clean
  and mutually consistent modulo live production drift between runs:
    pre-council:  fly=1097 inserted=691 updated=133 pro_only_kept=8 types_inserted=66 types_updated=54
    post-fix-1:   fly=1099 inserted=691 updated=133 pro_only_kept=8 types_inserted=66 types_updated=54 skipped_invalid=0 skipped_fk=0
    post-fix-2:   fly=1099 inserted=691 updated=133 pro_only_kept=8 types_inserted=66 types_updated=54 skipped_invalid=0 skipped_fk=0
    (fly/skipped_no_client drift 1097->1099/273->275 between the pre-council and post-fix runs
    is live Fly data changing over real wall-clock time, not a code effect -- inserted/updated/
    pro_only_kept/types_inserted/types_updated are byte-identical across all three runs)

  MUTATION VERIFICATION (the delta-round finding, confirmed real before the fix was accepted):
    reverted `_coerce_param`'s int4-range check on a live throwaway Postgres cluster (isolated
    on a `cp` backup, restored byte-identical afterward, `python3 -c ast.parse(...)` confirmed)
    -> `test_real_pg_integer_out_of_int4_range_is_skipped_not_a_crash` failed with
    `asyncpg.exceptions.DataError: invalid input for query argument $6: 2147483648 (value out
    of int32 range)`, uncaught -- exactly codex's predicted failure, reproduced against a REAL
    cluster, not asserted from the finding's prose alone.

  Cross-family council, both independently dispatched with a scrubbed/isolated environment
  (codex: `env -i` HOME/PATH-only, `--sandbox read-only`, `-C <empty tmp dir>`,
  `--skip-git-repo-check`, `--ephemeral`; kimi: `kimi_client.run()`, no-tools agent-file,
  credential-scrubbed env, empty cwd), fed only the diff + spec_P4_practices_replica.md:
    codex-gpt-5.6-sol  -> round 1: REWORK (practice_type_id HIGH; 2 non-blocking MEDIUMs);
                          delta: REWORK (int4-range gap in the first fix; not re-run after fix 2)
    kimi-code/k3       -> round 1: GO-with-conditions (skipped_invalid MEDIUM; expiry_alerter.py
                          MEDIUM merge-condition; 2 non-blocking findings); delta: UNREACHABLE

dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      "Round 1, HIGH: practice_type_id is excluded from the copied columns entirely --
      NULL on insert, and STALE on an update that changes practice_type_code to a different
      catalog entry, contradicting the diff's own 'intersecting columns' contract. Repro:
      give code X and Y different numeric ids on Pro; insert a practice with code X (its
      practice_type_id is NULL); change that same practice's code to Y (its practice_type_id
      still points at nothing, or at X's old id if ever backfilled by hand)."
    status: CONFIRMED
    resolution:
      "Fixed in adc96ce34d: practice_type_id is now re-keyed through a Pro-side code->id map,
      built right after the practice_types upsert in the SAME transaction (identical shape to
      client_id's existing re-key through clients.uuid) -- never copied verbatim from Fly's own
      numeric id, which is a different serial space. Delta round independently confirmed this
      GO, no new regression, against a real cluster."
  - seat: codex-gpt-5.6-sol
    objection:
      "Round 1, MEDIUM: no runtime schema-drift census -- the two static column tuples ARE the
      schema contract, but a new column added to BOTH Fly and Pro's real schemas (not just the
      diff's tuples) would silently never replicate, with no signal."
    status: PLAUSIBLE
    resolution:
      "Real and worth tracking, but out of this PR's one concern (satisfying the FK census and
      the two council-round bugs, not building a general schema-drift detector). Recorded as a
      risk in evidence/brief.yml's risks section rather than built here -- the existing
      column-set-mismatch guilt test already proves the diff's OWN column list fails closed
      (PostgreSQL itself errors on a missing referenced column), which is the failure mode this
      PR's spec actually required; a proactive census of columns NEITHER side's tuple mentions
      is a genuinely different, larger feature."
  - seat: codex-gpt-5.6-sol
    objection:
      "Round 1, MEDIUM: the real-PG suite (the only suite exercising real asyncpg codecs,
      savepoints, and FK recovery) never runs in CI -- FLOOR is unit-only, so it stays green
      even if the script crashes on row 1 against real PG."
    status: PLAUSIBLE
    resolution:
      "Accurate, and already an explicit, named, non-hidden limitation this PR's own CI
      workflow comments document -- the identical posture `wa-team-promises-tests.yml` (this
      repo's own precedent, merged and in production) has carried since before this PR existed.
      `ubuntu-latest` has no `pg_ctl`/`initdb` on PATH by default; adding the postgresql server
      package to the runner is a repo-wide CI change, not a one-organ fix, and both this
      workflow and its sibling already name it as the follow-up. Not fixed here; fixing it here
      would be scope creep onto a pre-existing, already-documented, repo-wide gap."
  - seat: kimi-code/k3
    objection:
      "Round 1, MEDIUM: _coerce_param's own conversions (date.fromisoformat,
      datetime.fromisoformat, int(...)) ran OUTSIDE the per-row savepoint. One malformed Fly
      value raises ValueError straight through the row loop, aborting the WHOLE transaction --
      and, on an unattended hourly cron, repeats that same total failure forever since the
      source Fly data doesn't change on its own."
    status: CONFIRMED
    resolution:
      "Fixed across two commits (see what_changed): adc96ce34d gave parameter construction its
      own per-row net (skipped_invalid); the delta round (codex, independently) found that fix
      incomplete for int4 overflow specifically, closed in c1611763d9. Both fixes
      mutation-verified against a real cluster. kimi's own delta pass on this could not be
      obtained (UNREACHABLE, see below), but the identical finding class was independently
      re-examined and confirmed closed by the OTHER seat's delta round on the same final code."
  - seat: kimi-code/k3
    objection:
      "Round 1, MEDIUM (merge condition): scripts/expiry_alerter.py reads practices.expiry_date
      -shaped data and is about to see ~950 new rows with real dates -- if it (or a trigger, or
      the attention classifier) turns new visibility into outbound WA/email/Telegram, this PR
      arms a client-messaging cannon. The diff cannot prove a negative; attach the stop-gate
      census's per-reader verdict to the PR."
    status: RETRACTED
    resolution:
      "Investigated directly (a factual infra question, not a code-review judgment call --
      handled by the build seat, not re-dispatched to a review seat): `ssh pro` confirms
      expiry_alerter.py is ABSENT from `crontab -l`, `~/Library/LaunchAgents`, and
      `docs/OPENCLAW_CONFIG_PRO.json` -- despite docs/AUTOMATIONS.md row 14 claiming a daily
      08:00 WITA cron, it is not currently armed anywhere found (matches this repo's own
      documented 'Esiste≠Armato' pattern: docs claiming armed schedules that drifted from
      the live state). Its own code (`_run_prod_python`/`_local_database_url`) also defaults to
      querying Fly's OWN practices directly via `fly ssh console --app nuzantara-rag`, not
      Pro's local replica, unless an explicit EXPIRY_ALERTER_DATABASE_URL/DATABASE_URL_LOCAL
      override is set -- no evidence of one was found. Not merge-blocking; added to the PR's
      reader census as a named, investigated, dormant reader rather than an open question."
  - seat: kimi-code/k3
    objection:
      "Round 1, MEDIUM: CI green (FLOOR-only, unit suite) proves almost nothing about the real
      asyncpg/Postgres code paths -- identical substance to codex's third finding above."
    status: PLAUSIBLE
    resolution: "Same resolution as codex's identical finding above -- see that entry."
  - seat: kimi-code/k3
    objection:
      "Round 1, LOW: _clear_pg_env() clears PGHOST/PGHOSTADDR/PGPORT/PGDATABASE/PGSERVICE but
      NOT PGUSER/PGPASSWORD, an asymmetry worth a one-line confirmation."
    status: RETRACTED
    resolution:
      "Verified byte-for-byte identical to `scripts/wa_team_promises.py`'s own
      `_PG_ENV_VARS_TO_CLEAR` tuple (`grep -n` on both files, same five variables, same order)
      -- this is exact parity with an existing, merged, in-production reference implementation,
      not a regression this diff introduced. A cross-file hardening of both is a legitimate
      follow-up but is not this PR's one concern."
  - seat: kimi-code/k3
    objection:
      "Round 1, LOW: _coerce_param's boolean branch silently coerces any non-'true' string
      (e.g. 't', 'TRUE', '1') to False with no signal -- unreachable today since the Fly SELECT
      always casts server-side, but not defensible."
    status: CONFIRMED
    resolution:
      "Fixed in the same commit as the skipped_invalid net (adc96ce34d): the boolean branch now
      raises ValueError on anything other than the two strings a real boolean::text cast can
      produce, converting the silent miscoercion into a loud, per-row-skippable failure --
      pinned by both a unit guilt test and a real-PG guilt test using an actual invalid boolean
      string against a live cluster."
  - seat: codex-gpt-5.6-sol
    objection:
      "Delta round, REWORK: `_coerce_param('2147483648', 'integer')` returns cleanly -- Python's
      int() has no int4 ceiling. PostgreSQL's actual int4 rejection happens later, inside
      asyncpg, as DataError, which neither the ForeignKeyViolationError nor the (then-present)
      ValueError except clause catches -- a row with an int4 overflow can still abort the
      entire transaction, exactly the failure mode fix commit 1 was meant to eliminate. Also:
      the ValueError catch wrapped fetchrow() itself, risking silently misclassifying a
      ValueError genuinely raised by the driver or the UPSERT as 'invalid Fly data' -- the
      catch should surround only parameter construction."
    status: CONFIRMED
    resolution:
      "Fixed in c1611763d9: _coerce_param's integer branch now validates PostgreSQL's int4
      range explicitly, raising ValueError itself before any DB call; parameter construction
      for both loops runs in its own try/except, strictly BEFORE the nested transaction opens,
      so skipped_invalid can only ever originate from _coerce_param -- never from fetchrow.
      Mutation-verified: reverting the range check reproduced the EXACT predicted DataError
      against a real cluster before the fix was accepted as closing anything. Not re-dispatched
      to codex for a second delta pass on this same finding (see appetite_exceeded) -- the
      mutation-verification against a real cluster is the harder proof of the two."

