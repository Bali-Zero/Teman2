    wa-practices-replica-tests.yml's own FLOOR (unit-only, REAL_PG unset)  -> 80 (unchanged --
      R7 only added real-PG cases, the unit corpus stayed at 80)

  Real Fly+Pro dry-run, run FIVE times across this PR's build+council+gate+R7 lifecycle (staged
  temp layout on Pro each time -- never the runtime checkout, deleted after use), all five
  clean and mutually consistent modulo live production drift between runs:
    pre-council:      fly=1097 inserted=691 updated=133 pro_only_kept=8 types_inserted=66 types_updated=54
    post-fix-1:        fly=1099 inserted=691 updated=133 pro_only_kept=8 types_inserted=66 types_updated=54 skipped_invalid=0 skipped_fk=0
    post-fix-2:        fly=1099 inserted=691 updated=133 pro_only_kept=8 types_inserted=66 types_updated=54 skipped_invalid=0 skipped_fk=0
    post-gate-R1-R4-R6: fly=1099 inserted=691 updated=133 pro_only_kept=8 types_inserted=66 types_updated=54 skipped_invalid=0 skipped_fk=0
    post-R7:            fly=1099 inserted=691 updated=133 pro_only_kept=8 types_inserted=66 types_updated=54 skipped_invalid=0 skipped_fk=0
    (fly/skipped_no_client drift 1097->1099/273->275 between the pre-council and later runs is
