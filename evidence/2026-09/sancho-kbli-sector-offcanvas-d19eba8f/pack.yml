decisions:
  - id: D1
    what: >-
      Cure the finding the final gate posted on 93f2ad3 ("Close after a section-strip hop
      lands on the previous sector URL with the panel open, not on /kbli") on the PR's own
      branch, at depth 1, rather than re-opening the feature as a successor PR. The branch
      is not armed, so it is not frozen; the diff stays one concern.
    why: >-
      The red is a real defect, named verbatim by the gate and reproduced here. A successor
      PR would have re-landed ~1200 unchanged lines to carry a 63-line correction.
  - id: D2
    what: >-
      The pop depth travels with the history entries (a marker per entry carrying
      {depth, href}), plus a module-scope hand-off written by the click that starts a hop.
    why: >-
      Two facts were measured in a browser before choosing, and each kills a shorter fix.
      (a) The panel REMOUNTS on a section hop — a module-scope mount counter read 2 before
      the hop and 4 after — so the instance ref the gate suggested cannot carry the count.
      (b) The entry a <Link> pushes arrives with NO custom history state, so the count
      cannot be inherited from the entry we came from either. Measurement transcript:
      the PROBE lines quoted in receipts R2.
  - id: D3
    what: >-
      The marker is read back on Back/Forward instead of only being incremented.
    why: >-
      A counter that only grows over-pops after a browser Back and drops the visitor out of
      /kbli entirely — the failure the existing guard in close() was written against. The
      third new e2e assertion is exactly that case.
  - id: D4
    what: >-
      A click on the strip letter of the section already open (aria-current="page") is taken
      over: on the grid it does nothing, from a drill-down it is one history step back to that
      section's grid (the same step as the in-panel back control).
    why: >-
      Found by this session before pushing the D1-D3 cure, by probing the one strip link D2's
      marker did not account for. Measured on 8f7f0e6, both red: hop B, click B, hop C, Back,
      Escape landed on /kbli/sectors/A with the panel open (the router replaces a same-URL
      entry and drops custom history state — preserveCustomHistoryState is false for a
      navigate in next's segment-cache/navigation.js); drill, click the active letter, Escape
      landed on /kbli/sectors/A with no panel (an uncounted push). Same defect class the gate
      blocked, so it is cured in the same depth-1 correction, not left for a second round.
  - id: D5
    what: >-
      "Open full page for <code>" in the drill-down becomes a plain <a>, like "open as full
      page" in the panel header already was.
    why: >-
      Measured on 8f7f0e6: the <Link> landed on /kbli/01111 with the panel still visible,
      because a client navigation keeps the @panel slot's last state. A hard anchor is the
      pattern the same PR already chose, deliberately, for the header link.
