dissent:
  - seat: Claude Opus 5 (self-refutation, on the mechanism)
    objection: >-
      The depth count now depends on how the router treats custom history state, which is
      framework-internal (a same-URL navigate drops it, a traverse keeps it). A future
      next upgrade, or a new in-panel <Link> added without reading this, can re-open the
      same class silently.
    status: CONFIRMED
    cure: >-
      Partly cured: every exit measured this round is pinned by an e2e assertion that was
      red on the parent (six assertions across D1-D5), so a regression of a known path goes
      red in CI. An unknown new link is not covered by construction; the component comment
      names the rule (a click to where the visitor already stands is not a hop).
  - seat: Claude Opus 5 (self-refutation, on scope)
    objection: >-
      D5 ("open full page" becomes a plain <a>) was not the gate's finding; it widens the
      correction beyond the one defect the gate named.
    status: CONFIRMED
    cure: >-
      Kept, because it is the same concern (an exit from the panel that leaves the visitor
      under a panel) in the same PR's own new code, it is a 3-line change mirroring the
      header link's deliberate choice, and shipping it known-broken would cost a second gate
      round. Recorded here so the gate can reject it separately.

