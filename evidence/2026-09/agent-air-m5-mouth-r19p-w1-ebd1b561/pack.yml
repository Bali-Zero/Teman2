decisions:
  - id: D1
    decision: >-
      The brief asked for --tx-tertiary: #A8ACA9 (R19 line-strong). Measured, that colour
      is 2.09:1 on paper #F7F4EE — it fails AA for text by a wide margin, and the portal
      reads --tx-tertiary on six text sites. Neither --tx-tertiary nor --bz-text-3 is
      redeclared in the light block: both are already `var(--tx-secondary)` aliases in the
      operative-light root, so they follow the R19 muted #58626B (5.67:1) automatically and
      the tier count is unchanged from today. #A8ACA9 is used where it belongs, as
      --bz-border-hover (a line, not a text colour).
  - id: D2
    decision: >-
      Primary buttons in the portal do NOT read --bz-accent; they fill with
      var(--bz-copper-text) (apps/mouth/src/app/portal/{login-upgraded,magic,magic-link}/page.tsx).
      Per the window contract that mapping is left to a later window, so --bz-accent is set to
      copper #A44B36 (its consumers — PracticeBaton's "demands attention" foreground,
      the process-page progress fill, PortalNewsRail — are accent marks, not buttons) rather
      than forest. Consequence recorded in leftovers: until the button mapping moves, R19's
      "copper is never a button fill" is violated on the auth screens.
  - id: D3
    decision: >-
      --bz-product-heading-font is NOT redeclared. The pre-existing [data-product="my"] block
      already defines it as `var(--font-serif), Georgia, serif`, and custom-property
      substitution resolves it on the same <html> element against the winning --font-serif —
      verified in the browser as "Fraunces, ui-serif, Georgia, serif, Georgia, serif".
      Two declarations saved, one source of truth kept.
  - id: D4
    decision: >-
      The brief says to set "the sans variable the body reads". Grounded: the body rule in
      globals.css pins the literal string "Inter", -apple-system, ... — it reads no variable,
      so the token alone could never reach it. The blocks therefore carry ONE nested
      `body { font-family: var(--font-sans); }` rule each. It is the only non-custom-property
      declaration in either block and it stays behind the [data-product="my"] qualifier, so
      A6 holds. Verified in the browser — computed body font-family is
      "Manrope, ui-sans-serif, system-ui, sans-serif" on /portal/login.
  - id: D5
    decision: >-
      Dark-theme values that R19 does not name are derived from R19 hexes rather than invented:
      "done/healthy", "waiting" and "info" lift through color-mix(in srgb, <R19 hex> 40-45%, #F7F4EE)
      so they stay legible on the #121016 ground, and translucent paper (rgba(247,244,238,α))
      carries the muted text and hairline tiers. No hex outside the R19 set appears in either block.
  - id: D6
    decision: >-
      The brief's A4 prescribed a Playwright addInitScript to stamp data-product="my" because
      "the login page does not set data-product today". Measured, that premise is false: the
      pre-paint themeInitScript in apps/mouth/src/app/layout.tsx already assigns
      product = 'my' for any path starting /portal/. The screenshots were taken with NO
      injection, and the probe read product="my", theme="operative-light" off the live document.
