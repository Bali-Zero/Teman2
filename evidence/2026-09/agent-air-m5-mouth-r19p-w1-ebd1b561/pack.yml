dissent:
  - seat: Claude Opus 5 (self-adversarial, on the window brief itself)
    objection: >-
      The brief prescribes --tx-tertiary: #A8ACA9. Shipping it would push six portal text sites
      to 2.09:1 on paper — an accessibility regression dressed as a design token, in a file whose
      own comments record AA work on every prior pass.
    status: CONFIRMED
    cure: "D1 — the alias is left in place so tertiary follows R19 muted #58626B at 5.67:1; #A8ACA9 ships as the hairline-hover colour it actually is."
  - seat: Claude Opus 5 (self-adversarial)
    objection: >-
      The brief's mandate says "the token seam alone does it", but the body font-family is a
      literal "Inter" string in globals.css. A pure-token block would have left every portal
      body text in Inter and the claim "renders in R19 type" would have been false.
    status: CONFIRMED
    cure: "D4 — one nested body rule per block, behind the my qualifier; verified as computed Manrope in the browser."
  - seat: Claude Opus 5 (self-adversarial)
    objection: >-
      A4 asked for Fraunces glyphs on /portal/login. The login screen pins its serif with a
      next/font className (cormorant), which no custom property can outrank, so the headline
      there is still Cormorant after this window.
    status: PLAUSIBLE
    cure: >-
      Not cured — the fix is a .tsx edit outside this window's perimeter. What IS proved instead:
      the face loads (document.fonts.check true), --font-serif computes to Fraunces on <html>,
      and a node written exactly as the authenticated portal headings are written
      (style={{fontFamily:"var(--font-serif)"}}) computes to Fraunces. Every authenticated
      portal headline — dashboard, chat, messages, family, settings, settings/notifications —
      is written that way and therefore turns Fraunces with this merge.
    status_note: recorded as a leftover for the window that owns the auth screens
  - seat: Claude Opus 5 (self-adversarial)
    objection: >-
      Setting --bz-copper-text to copper keeps the auth screens' primary buttons filled with
      copper, and R19 says copper is never a button fill.
    status: PLAUSIBLE
    cure: >-
      Not cured by design — the window contract assigns the button mapping to a later window
      (D2). The measurement is in the pack so the next window does not have to rediscover it:
      the fill comes from var(--bz-copper-text), not from --bz-accent.
leftovers:
  - The auth screens (login-upgraded, magic, magic-link) fill their primary button with var(--bz-copper-text); under R19 that button should read forest #253E33. The button mapping belongs to the window that owns those screens.
  - /portal/login-upgraded pins its display serif with a next/font className (cormorant), so its headline does not follow --font-serif. Only a .tsx edit can move it to Fraunces.
  - /portal/login renders blank in headless Chrome (its own entrance treatment); the DOM measures R19 correctly. A page-level proof for that screen needs the window that owns it.
  - PortalNotifications.tsx hardcodes color "#0c0c0e" on a var(--bz-accent-warm) fill; with accent-warm now copper that pairing is 4.2:1 and should move to --bz-on-warm.
  - The dark [data-product="my"] block ships unrendered — no /portal route was screenshotted under operative-dark in this window's time box.
  - The mocks' 48px control / 52px input / 0.25rem-0.5rem radius geometry and the single next-move-card shadow are component-level and belong to the later windows; only --bz-shadow-card was retuned here.
