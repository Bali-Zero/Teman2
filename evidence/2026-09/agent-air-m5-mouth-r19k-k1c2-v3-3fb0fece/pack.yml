dissent:
  - seat: claude-opus-5
    objection: >-
      The copper-ground detector cannot see a label. It infers one from a foreground colour declared
      beside a copper background.
    status: CONFIRMED
    disposition: >-
      Accepted, and stated in the source as the guard's limit. "Copper is never the ground behind a
      label" is a rule about what a person sees; source text cannot see it. The pairing is the shape
      that always produces one, and the alternative — rendering every shell surface and sampling
      pixels — is a browser job, which this repo cannot run in a worktree at all.
  - seat: claude-opus-5
    objection: >-
      The slip has no consumer yet: no row calls `slip()` in this PR.
    status: CONFIRMED
    disposition: >-
      Named rather than hidden. The window's assignment is the shell's vocabulary; the rows that take
      an action back belong to K3 and K4, which own the list pages. The variant ships with its guard
      and its exported window so those seats wire it rather than invent a second one. The Bites line
      names the test as the consumer that proves the variant is in force TODAY, which is what a
      vocabulary PR can honestly claim.
notes:
  - >-
    CARRIED FROM K1d (#6508), noted at the gate seat's request: `firstPartyRedirect(raw, origin)`
    takes `origin` as a REQUIRED parameter where the written spec showed it with a default. The
    required form is what shipped and is the safer of the two — a default origin would let a caller
    on an unexpected host judge a redirect against the wrong yardstick — but the spec and the code
    disagree on their face, and this is the record of which one is true.
  - >-
    HARNESS-LANE LEFTOVER (carried from the #6499 gate, still open): `scripts/token_lint.py` scopes
    exactly two prefixes — apps/mouth/src/app/(workspace)/ and apps/mouth/src/app/portal/ — so
    apps/mouth/src/components/workspace/** is invisible to it. shell-guard.test.ts is the local cure
    for five files, not a widening of the linter. Widening the scope is a harness-lane change and is
    still unowned.
  - >-
    FOR `k1-prims`: shell-guard.test.ts now scans AppSidebar.tsx under four rules. K1c-bis edits that
    file. A raw hex, a --bz-red read, a --state-danger read, or a copper background declared in the
    same style object or class string as a foreground colour will turn that suite red. The copper
    RULE and copper WORD idioms are explicitly cleared by innocence cases, so the K1c frame's
    border-l-2 copper rule is safe.
  - >-
    FOR `k3-dux`: the eight DESK_* symbols are exported from @balizero/core. DESK_PILL_ON reads
    var(--bz-selected-fill, var(--state-info)) and var(--bz-on-selected, var(--bz-base)) as
    fallbacks, so when K1c-bis declares that pair in globals.css the selection changes colour with no
    component edit.
  - >-
    `npx next build` remains impossible in a worktree (TurbopackInternalError: the apps/mouth
    node_modules symlink points out of the filesystem root), so every browser claim here is measured
    under `next dev --webpack`. One dev server, started for the capture and killed after it.
  - >-
    No adversarial seat ran. Codex is unreachable from this host and the Gemini seat timed out on the
    previous diff. The independent read is the commissioned final gate.
  - >-
    GEAR 3, and WHY it is declared: the deterministic floor for this diff is 3, reproduced locally
    before pushing — churn +1740/-208 = 1948 against the 1828 threshold, floor_source "size", not a
    hot-zone path. #6517 declared gear 2 and the harness recompute was right to refuse it. Nothing
    about the code changed between that PR and this one; the brief under-declared, and this is the
    correction.
  - >-
    SAID PLAINLY RATHER THAN LEFT TO THE LINTER: R9 asks a Gear-3 pack for a council journal with two
    distinct review seats. There is none. The rule resolves to a NOTICE here only because this pack
    carries a `seat_override`, which it carried for an unrelated reason (R8 applicability) before
    gear 3 was ever in play. A reviewer should read that as "the council requirement is unmet and
    absorbed by an override", not as "the council ran".
