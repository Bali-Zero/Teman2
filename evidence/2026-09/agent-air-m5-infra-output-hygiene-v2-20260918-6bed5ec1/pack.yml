  Single build lane (Anthropic, claude-sonnet-5) reviewed by the shipping session (claude-fable);
  D3's cross-family floor is exempt below two build lanes. The independent grader is the fresh
  Opus 5 on-disk gate that signs harness/fable-gate after this pack is finalised; this pack does
