brief_ref: evidence/brief.yml
plan_ref: >-
  One concern: output_hygiene_guard.py v2, the PreToolUse Bash hook re-implemented against
  docs/specs/2026-09-18-output-hygiene-guard-shapes-spec.md after the first implementation
  (PR #6724) was suspended at three on-disk gate rounds. The hook denies (never rewrites) the
  spec's eight flood shapes S1-S8 unless an own-bound (§3) or a downstream bound in the same
  statement (§4) applies; quotes and heredoc bodies are blanked length-preserving before
  scanning; ssh/scp/rsync statements are allowed whole; unresolvable `$VAR` paths fail open.
  Every test case carries its spec C-ID and the suite asserts the whole corpus is present. The
  one spec edit resolves an internal contradiction (S5 row vs C29) in favour of the row's prose:
  C29 becomes a glob pattern, C61 pins the literal-name allow.

  Consumer: `~/.claude/hooks/output_hygiene_guard.py`, installed in the PreToolUse Bash matcher
  of `~/.claude/settings.json` on M5 and Pro by the shipping session after this PR merges — this
  diff prepares the guard and its tests, it does not itself arm the live hook. Observation once
  armed: `ls ~/.nuzantara-mailbox` from a session is refused with the entry count named in the
  denial; `ls ~/.nuzantara-mailbox | head -5` passes unchanged.

lanes:
  - lane: output-hygiene-guard-v2
    role: build
    seat: >-
      claude-sonnet-5 implementer subagent dispatched by the shipping session (air-m5), working
      only from the merged spec with the suspended first implementation as reference material.
      Wrote infra/claude-hooks/output_hygiene_guard.py (no subprocess calls, fails open on any
      exception, kill switch NUZ_OUTPUT_HYGIENE_OFF) and infra/claude-hooks/test_output_hygiene_guard.py
      (every case labelled by spec C-ID, corpus-completeness assertion, latency print), added the
      guard-conformance registry entry, the vaccine fixtures in test_hook_innocence.py and the
      home-fork declared pair. A second round, on the shipping session's review, implemented the
      S5 literal-name own-bound as the spec row states it, amended the case table accordingly
      and cleared three static-analysis nits.

