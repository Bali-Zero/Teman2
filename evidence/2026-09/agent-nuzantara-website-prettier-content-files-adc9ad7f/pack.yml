dissent:
  - seat: sonnet-5
    objection: >
      The literal receipt method specified by the lane's team-lead for proving "no semantic
      change" (ts.createSourceFile both sides, ts.createPrinter({removeComments:false}).printFile,
      assert equal strings) is unreliable on this repo's Prettier config: it FAILS on 13 of the 14
      files even though the transform is formatting-only.
    status: CONFIRMED
    repro: >
      Reproduced deterministically (node check.mjs, receipt above) -- 13/14 mismatches, every one
      traced by manual per-file diff to one of three specific, individually well-understood,
      zero-semantic Prettier transforms: quoteProps "as-needed" removing quotes from
      identifier-safe object keys (the printer emits a PropertyName node's raw source text rather
      than a normalized form, so a StringLiteral-to-Identifier key-kind change still prints
      differently even though `{"key":v}` and `{key:v}` are the same property); trailing-comma
      insertion on multiline literals (the printer preserves the parsed
      NodeArray.hasTrailingComma flag from the ORIGINAL source rather than applying a fixed rule,
      so this alone diffs with zero AST content change); and JSX/expression
      ParenthesizedExpression wrap/unwrap around return statements (parens are transparent to
      evaluation). Mitigated, not worked around silently: built a stricter receipt still on the TS
      compiler API (ts.transpileModule to plain JS, then a structural kind-by-kind walk with
      property keys compared by resolved text and parens unwrapped) that gives 14/14 identical
      (receipt above) -- accepted by the team-lead (SendMessage ack, 2026-09-11) as the valid
      proof, with the printer-diff explicitly named as "a known artefact of preserved trivia
      (quoted keys, trailing-comma flag, parens)".
  - seat: kimi-code/k3
    objection: >
      Even a fully AST-equal diff could hide a behavior change through five specific edge cases a
      naive AST-equality check would not catch on its own if implemented carelessly: quote-key
      removal colliding with an existing bare key in the same object (duplicate-key shadowing),
      trailing-comma insertion changing an array/tuple's element count or call-site arity, JSX
      paren-unwrap flipping an arrow function's implicit-return semantics, object-key/JSX-child
      reordering (order can matter for enumeration or last-write-wins duplicate props), and
      quote-character changes reinterpreting an escape sequence in a string literal.
    status: RETRACTED
    repro: >
      Independently investigated by the seat against the real diff (not asked to trust the
      receipt above) -- built its own AST-equal + key-normalization + JSX-whitespace-canon
      comparison across all 14 files and reported all five cases CLEAR: no duplicate keys in any
      object literal after quote-prop normalization; AST-equal element/argument counts prove no
      array or call arity changed; no ArrowFunction body.type changed between Expression and
      BlockStatement anywhere; zero non-whitespace diffs (order-sensitive AST comparison) so no
      key/child reordering; StringLiteral cooked values and template quasis compared exactly with
      no diffs, including the one genuinely nontrivial case (the "Continue on WhatsApp " trailing
      space), verified round-tripping unchanged. The run was killed by a local 400s CLI timeout
      mid-way through a sixth, self-initiated, unrequested check (moved lint/type-suppression
      directive comments); that specific residual was closed directly and separately (receipt
      above, grep for ts-expect-error/ts-ignore/eslint-disable across the diff, 0 hits) rather than
      left open.

