plan_ref: >-
  PR (agent/air-m5/wa-team/t3-pr3-judge-g1g7-0929, base main) — gate condition C1 on the
  merged PR #7597: land the fresh-Opus gate's G1-G7 mutation-guard probes (plus two optional
  LOW ones, G-LOW-1/G-LOW-2) as PERMANENT tests, no production code change. Per this lane's own
  precedent on #7597 (team-lead: "Next step is YOURS ... generator != grader is kept because
  the fresh Opus gate comes after, separately"), the same builder session that wrote the tests
  convened a REAL Gear-3 council on this PR's own diff before opening it — the council reviews
  the ARTIFACT the builder produced, which is a materially different activity from the builder
  re-grading its own claim of correctness.
lanes:
  - lane: wa-team-t3-pr3-judge-g1g7-build
    role: build
    seat:
      claude-sonnet-5 (conducting session — wrote the 9 permanent tests, ran the Gear-3
      council on the full diff before opening the PR, applied every CONFIRMED finding across
      two rounds by hand, wrote this pack; no reviewing seat has write access to this tree)
  - lane: wa-team-t3-pr3-judge-g1g7-council-codex
    role: review
    seat: "codex-gpt-5.6-sol (round 1 verdict REWORK on 1 HIGH + 4 MEDIUM/LOW findings; delta round verdict REWORK on 1 MEDIUM + 3 LOW findings — see dissent)"
  - lane: wa-team-t3-pr3-judge-g1g7-council-kimi
    role: review
    seat: "kimi-code/k3 (round 1 verdict GO-WITH-NITS on 8 findings, none blocking; delta round verdict REWORK on 1 HIGH + 4 LOW findings — see dissent)"

what_changed: |
  Two review rounds on this PR's OWN diff (env-scrubbed, diff-only, no session-env leakage to
  either seat), both seats dispatched independently each round.

  ROUND 1 (full G1-G7 test diff as first authored): codex returned REWORK (1 HIGH + 4
  MEDIUM/LOW); kimi returned GO-WITH-NITS (8 findings, all LOW/MEDIUM, none blocking) — both
  seats converged strongly on the same 5 real gaps despite different verdict labels. Fixed in
  the same commit (b54ba8cccc):
  - G6 (HIGH both): the lock-file test monkeypatched BOTH _SCAN_LOCK_FILE/_JUDGE_LOCK_FILE to
    distinct paths unconditionally, silently repairing a mutant that rebinds one constant to
    the other's value at MODULE level (the monkeypatch overwrites both regardless of the
    mutant). Added an inequality assertion on the UNPATCHED module attributes before any
    monkeypatch runs.
  - G4 (HIGH/MEDIUM both): the only invalid-verdict dry-run candidate had attempts=4 (the
    quarantine boundary), so the ordinary non-quarantining invalid path was never exercised — a
    mutant narrowing the dry-run guard to only the quarantine branch would still pass. Added a
    fifth candidate at attempts=0 and pinned metrics.invalid in the asserted tuple.
  - G3 (MEDIUM both): a fixed `asyncio.sleep(0.3)` guessed when _apply_true's stalled query
    would become active before launching the competing writer — a loaded CI runner could make
    this a false RED on correct code. Replaced with a poll of pg_stat_activity for the stall
    marker (this fix itself turned out to be broken — see delta round below).
  - G-LOW-1 (MEDIUM both, independently, near-identical): the source-inspection regex only
    matched the FIRST assignment line, missing a mutant that keeps that line and appends a
    second `_OLLAMA_URL = os.environ.get("OLLAMA_URL", _OLLAMA_URL)` statement (reduces to the
    same literal whenever the env var is unset). Now counts ALL matching assignment lines,
    requires exactly one, and separately bans environ/getenv tokens from any other line
    mentioning the name.
  - G1 (LOW codex): only 2 of the CHECK constraint's 4 non-unjudged terminal statuses
    (judged_false, judged_true) were tested against the guard — a mutant relaxing
    `status = 'unjudged'` to `status IN ('unjudged', 'superseded')` would still pass. Added a
    third sub-case (status='superseded').
  Findings NOT fixed, with reasoning (both seats agreed or the finding described future-code
  risk, not a gap in code that exists today):
  - G7 (LOW kimi): caplog only inspects record.getMessage(), not record.exc_text, and doesn't
    verify logger propagation. Verified by reading _judge_one: neither the invalid-verdict nor
    superseded path calls ANY logger method today, and the module logger never sets
    propagate=False. Accepted as a residual for future logging additions, not a current gap.
  - Kimi's LOW #8 (G3's SQL-text surgery couples to the exact literal "RETURNING id"; a
    cosmetic SQL reflow would make the .replace() a no-op): kimi's own assessment was
    "safe-by-loudness" — the existing `assert slow_mark_true != wtp._JUDGE_MARK_TRUE_SQL`
    already turns a no-op replace into a loud failure, not a silent pass. No further guard
    added.
  - Kimi's LOW brittleness note on G5 (an unrelated future datetime.now() call earlier in the
    --scan branch would shift the clock-read count): a fragility note about hypothetical future
    code, not a current gap. Not fixed.
  - Header bookkeeping (kimi LOW): the "59 vs 57 mutant count" self-contradiction and the
    M26/M41-vs-M41b staleness in the corpus header comment (the header claimed mutants this
    same diff actually ships tests for). Fixed by rewriting the header to describe the claim
    generically rather than repeating specific counts that had drifted.

  DELTA ROUND (the fix diff from round 1, both seats told what round 1 found and what the delta
  claims to fix, asked to verify and re-break): codex returned REWORK again (1 MEDIUM + 3 LOW);
  kimi returned REWORK (1 HIGH + 4 LOW) — both seats independently found the SAME critical bug
  in the round-1 G3 fix itself. Fixed in the same commit (b54ba8cccc):
  - G3 self-matching poll (HIGH kimi / MEDIUM codex, independently, essentially identical): the
    pg_stat_activity poll query's OWN text contained the literal substring "_stall" (inside its
    own `query ILIKE '%_stall%'` pattern), so the poll matched ITSELF on the very first
    iteration regardless of whether _apply_true's stalled query was actually active —
    reintroducing the exact false-RED race the fix existed to remove, now on a FAST runner
    instead of a slow one. Kimi additionally caught that `_` is itself a single-character ILIKE
    wildcard, so the pattern would also match any query merely containing "install". Fixed:
    added `pid <> pg_backend_pid()` and replaced the ILIKE wildcard pattern with
    `position('_stall' in query) > 0`. Re-verified: this test now correctly turns RED when FOR
    SHARE is genuinely removed from production code (see receipts), which round-1's broken poll
    would NOT have caught (it exited the wait loop immediately regardless).
  - G1 fourth status (LOW both): a fourth terminal status (quarantined) was still untested
    against the guard. Added a fourth sub-case.
  - G-LOW-1 indented reassignment (LOW both, near-identical): the regex anchored at column 0
    (`^_OLLAMA_URL`), missing an INDENTED reassignment inside a conditional block (e.g. inside
    `if os.environ.get("OLLAMA_URL"): _OLLAMA_URL = ...`). Now allows leading whitespace in the
    regex and strips before comparing, so any reassignment shape is counted regardless of
    indentation.
  - G3 task cleanup (LOW codex): the `finally` block only cancelled+awaited tasks still
    `.done() is False`, so a task that already finished EXCEPTIONALLY before the block ran could
    be left uncollected. Switched to cancel-then-`asyncio.gather(*tasks,
    return_exceptions=True)`.
  - get_running_loop() (LOW kimi): `asyncio.get_event_loop()` inside a coroutine works today but
    is the wrong API; switched to `asyncio.get_running_loop()`.
  No dissent remained unresolved after the delta round: every finding either seat raised was
  independently found or endorsed by the other, and every CONFIRMED finding was fixed and
  re-verified.

