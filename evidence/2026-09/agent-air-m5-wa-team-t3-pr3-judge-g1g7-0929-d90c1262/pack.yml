  MUTATION VERIFICATION, each isolated on a `cp` backup and restored byte-identical afterward
  (`diff -q` confirmed after every restore; the production file
  scripts/wa_team_promises.py is untouched by this PR — every mutation below was applied,
  tested, then reverted):
    1. M43 (G6): _JUDGE_LOCK_FILE rebound to _SCAN_LOCK_FILE's value at module level ->
       test_g6_judge_and_scan_locks_are_independent_files turns RED on the new unpatched-
       constant assertion (it passed silently before the round-1 fix).
    2. M23/M46/M47 (G4): _apply_attempt's dry-run guard narrowed from unconditional
       `if dry_run: return ...` to `if dry_run and attempts + 1 >= _JUDGE_MAX_ATTEMPTS: return
       ...` -> test_g4_dry_run_writes_nothing_on_any_path turns RED on the DB-snapshot equality
       check (it passed silently before the round-1 fix, since only the quarantine-boundary
       candidate was seeded).
    3. FOR SHARE removed from _JUDGE_MESSAGE_FOR_SHARE_SQL ->
       test_g3_apply_true_holds_the_message_lock_through_its_own_commit turns RED (the
       "assert not update_task.done()" check correctly fires) — verified with the DELTA-ROUND
       fix in place; round-1's broken self-matching poll would NOT have caught this (it always
       exited its wait loop on iteration 1 regardless of the mutation).
    4. Round-1 G-LOW-1 mutant (append a second `_OLLAMA_URL = os.environ.get(...)` line) ->
       test_g_low1_ollama_url_is_a_bare_literal_not_an_environment_read turns RED.
    5. Round-1 G1 mutant (_JUDGE_MARK_FALSE_SQL relaxed to `status IN ('unjudged',
       'superseded')`) -> test_g1_guarded_writes_also_require_status_unjudged_not_just_the_hash
       turns RED on the new superseded sub-case.
    6. Delta-round G1 mutant (`status IN ('unjudged', 'quarantined')`) -> same test turns RED
       on the new quarantined sub-case.
    7. Delta-round G-LOW-1 mutant (indented `_OLLAMA_URL = _env` inside an `if` block) -> the
       same G-LOW-1 test turns RED on the whitespace-tolerant assignment count.

  ruff clean on both touched test files; scripts/ci/scripts_coupling_census.py --check up to
  date.

