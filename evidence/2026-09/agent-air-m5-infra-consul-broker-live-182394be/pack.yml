dissent:
  - seat: codex runtime-evidence (local fixture reproduction)
    status: CONFIRMED
    objection:
      A delayed authorization reply could arrive after local cancellation began, and a wrong canary marker
      was accepted by the original consumer fixture. The conductor implemented targeted client/canary corrections;
      their tests are recorded separately. This delegated finding is not the formal Fable verdict.
  - seat: codex runtime-evidence (actual isolated subprocess diagnosis)
    status: CONFIRMED
    objection:
      Darwin group probes transiently returned EPERM during shutdown. The correction treats permission denial
      as unconfirmed group absence, polls within bounds, and permits local_stopped only after leader exit and group
      absence; persistent denial remains false.
  - seat: codex lifecycle-ground (isolated PostgreSQL verification)
    status: CONFIRMED
    objection:
      Historical database proof precedes later native selected-counter parity and a final codec test-fixture
      adjustment. Separate delta receipts preserve those boundaries rather than replacing historical source hashes.
  - seat: codex protected-helper-package (actual Pro preparation)
    status: CONFIRMED
    objection:
      Unprivileged bundle import and negative-protocol success do not prove installed root ownership or a
      separate service execution. Current service UID and active binding are absent; privileged Pro installation and
      DBA setup remain separate.
  - seat: claude-fable-5-1 (independent native first review)
    status: CONFIRMED
    objection:
      "REWORK: package byte digests did not cover unsafe installed modes; the prior lease was shorter than
      cumulative canary bounds; unprefixed consul names were accepted; replay could report a failed result as recorded;
      unknown native counters were silently discarded. The corrected source adds mode rejection/normalization, a shared
      200-second lease budget, exact namespaced identities, outcome-preserving replay and bounded names-only unknown-counter
      markers. The genuine second native review closed all five findings and returned source PASS; both review receipts
      remain retained."
