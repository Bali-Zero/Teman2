constraints:
  - >-
    The gate's code half is NOT in this PR and cannot be. The app repo has no
    remote and lives on another host; a cross-machine Swift commit that no PR can
    review is not shippable from a headless Pro lane. The spec is written to be
    executed by the lane that owns the app.
  - >-
    The corpus is untouched (sha256 487bc9509d01… unchanged) — the brief forbids
    it and a scorer lane must never move the thing it scores.
  - >-
    No serving re-run. The answers come from the app repo's `Tests/benchrunner`,
    which runs the production path; re-implementing a serve step here would
    measure the harness instead of the product.
  - >-
    The judge rides the ChatGPT seat through the `codex` CLI (OAuth). No paid
    per-token endpoint of any vendor; no `ANTHROPIC_API_KEY`; the sanitized
    CODEX_HOME copies the credential file without reading, printing or logging
    it, and never writes to the user's `~/.codex`.
  - >-
    Nothing in this PR writes to a runtime store, and nothing here is armed,
    merged or deployed by this session.
