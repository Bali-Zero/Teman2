  not designed and then justified — it was FOUND by the instrument: the first live
  judging of Q13 against the current dataset returned `wrong` with the reason
  "falsely labels KBLI 77400 BALI_BLOCKED; its record shows blocked false", and the
  answer was right (on `c69a260d`, the dataset that run was served from, 77400 IS
