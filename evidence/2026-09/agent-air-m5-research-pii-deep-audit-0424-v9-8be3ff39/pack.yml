seat_override: >-
  R9 council quorum (2 distinct COUNCIL_REVIEW_SEATS in a journal.jsonl) not convened, and NO
  external cross-family review (codex-spalla.sh or any other seat) is dispatched against this diff
  at all. Reason: the #7453 review via codex-spalla.sh embedded a raw `git diff HEAD | head -1000`
  into its prompt (script bug at .claude/scripts/codex-spalla.sh:277) and sent 969 client
  full_name records in cleartext to a cloud LLM (OpenAI) — a Builder Contract §4 output-boundary
  breach. Re-running the same tool against this diff (which still deletes the same plan.jsonl
  content, now alongside a WhatsApp eval-set carrying client message bodies) would repeat the
  exposure. The cross-family review for this PR is WITHDRAWN rather than dispatched; the
  independent adversarial pass instead comes from the fresh Gear-3 gate sessions that reviewed
  #7453, #7462, #7468, #7470 and #7472 (a genuinely independent seat — Opus 5.5, different
  sessions, no contribution to the build) and returned REWORK-BUILD with, respectively, three
  concrete findings on #7453, two on #7462 (an evidence-only de-anonymisation key and a
  phone-count undercount), one on #7468 (G1: residual client PII in scripts/wa_corpus/ outside
  every prior diff), one surfaced via #7470's parallel gate run (a docstring in
  scripts/crm_guardian_phase15_pilot.py), four on #7472/#7474 (G2: a test-fixture string that
  was 3 of 5 tokens of a real client's name; G3: the evidence itself linking a residual collision
  to a specific file:line, re-identifying a client; H1 and H2: raised by that same fresh gate but
  never logged as `dissent:` entries in v6/v7, backfilled here), and four on #7481 itself (K1/H2
  restated: a false live cloud-LLM-egress claim; K2: five false/undercounted claims; K3/H1
  restated: file-path residual disclosures re-identifying via the same hint pattern G3 closed
  elsewhere; K4: `Bites:` regressed to a pre-merge self-consistency check), recorded below as
  `dissent:`. Two more rounds followed the same pattern after #7481: gate-7491.md's K2 (still
  partly wrong in v8) and K3 (a new de-anonymisation regression in v8), and gate-7516.md's B1-B4
  (count drift, a false pre-check paste, a locator that isolated one file, a missing
  redaction-branch probe) — recorded below as their own dissent entries, addressed across this
  commit and the corresponding v3-v9 commits. A separate lane is fixing codex-spalla.sh itself;
  it is out of scope here.

