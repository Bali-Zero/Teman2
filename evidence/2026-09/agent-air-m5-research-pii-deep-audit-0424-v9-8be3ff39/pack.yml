    research/compliance/deep_audit_2026-04-24/, 3 xlsx at research/compliance/ root) plus
    research/wa-copilot/2026-05-25-eval-set-v1.jsonl (client_full_name + client WhatsApp message
    bodies, added by commit 9ee0ca260f). Redacts four client first names and four client-associated
    phone numbers (in prose, not structured columns) from
    research/operations/2026-06-04-wa-corpus-miner-session-report.md, keeping its three distinct
    team-line phone numbers (2 E.164 + 1 without a leading '+' embedded in a Doc title) and two
    numeric client_ids intact, with `adversarial_review: exempt-redaction-edit`
    frontmatter added. Leaves research/operations/2026-08-15-adr-wa-runtime-openai-provider.md
    untouched (its phone-shaped tokens verified as synthetic regex-test examples, not client data).
    No code behaviour changes: the consumer scripts referencing the deep-audit paths
    (scripts/crm_guardian_apply.py, scripts/crm_guardian_deep_audit.py) are untouched, unchanged
    from #7453's disclosed deviation. Extends .gitignore with a pattern for the wa-copilot
    eval-set shape alongside the two patterns from #7453.

    NEW this pack (G1 cure): replaces 3 client first names, 1 client phone and 3 client company
    names with synthetic fixtures (`Client Alpha/Beta/Gamma`, `PT Contoh Alpha/Beta/Gamma`,
    `+6281234567890`-style ascending numbers) across `scripts/wa_corpus/query_lab.py`,
    `prompt_master.py`, `prompt_variants.py`, `tests/wa_corpus/test_doc_title.py` and
    `test_reconcile.py`. `query_lab.py`'s real `GROUND_TRUTH` (needed to score against real
    indexed NLM sources) moves to a NEW untracked, gitignored `scripts/wa_corpus/_ground_truth_local.py`
    (0600 on disk, never staged), loaded at runtime with an `ImportError` fallback to the
    synthetic fixtures — a behaviour change to `query_lab.py`'s import surface, none to any other
    script. `tests/wa_corpus` (42 passed, 1 skipped) stays green. Also redacts one further residual the G1
    sweep surfaced inside the corpus-miner md itself (not previously flagged): [CLIENT-A]'s real
    company name in clear at line 156, replaced with a new `[CLIENT-A-CO]` placeholder — same
    `adversarial_review: exempt-redaction-edit` convention, R1 gate re-verified.

    NEW this pack: redacts scripts/crm_guardian_phase15_pilot.py's docstring, replacing 6
    client_id-adjacent real full names (7 people) with synthetic `Client P1..P7` labels; ids and
    case-annotation comments unchanged. The script needed no untracked-local-file relocation,
    unlike query_lab.py — but the ids are NOT safely de-identifying on their own: 11 other
    pre-existing files (not previously counted correctly, see receipts/out_of_scope) still carry
    1+ of these names in clear, and 5 of the 6 ids sit within 300 characters of the same real
    full name elsewhere in the tracked tree.

    NEW this pack (G2/G3 cure): replaces `tests/wa_corpus/test_doc_title.py`'s sanitization-test
    input string (3 of 5 tokens of a real client's name) with a synthetic `"Client / Alpha: Test"`
    string that exercises the same `/`/`:` sanitization; `tests/wa_corpus` stays green. Removes
    every file:line link and every "shares a name with" hint from the evidence's own disclosure
    prose (a residual-collision location, combined with the corpus-miner md's own
    [CLIENT-A..D]-to-`client_id` pairing, was itself a re-identification key) — the disclosure is
    now counts-only. DELETES the one source that made this concrete:
    `docs/archive/2026-07-orphans/superpowers/specs/2026-04-01-gemini-profil-perseroan-prompts.md`
    (an archived spec with real client names — this lane's own exact-string detector, run against
    the file before its deletion, counted 30 raw occurrences / 25 unique names; #7472's gate,
    using a broader case-insensitive pattern over the same then-live file, counted 36 — a wider
    detector scope, not a discrepancy in this lane's own count — unrelated to wa_corpus,
    quarantined on Pro first —
    0700/0600, `git hash-object` verified against the pre-deletion blob `b94e450357...`).
  surface: >-
    research/compliance/, research/wa-copilot/, research/operations/ (redaction only),
    scripts/wa_corpus/ (query_lab.py, prompt_master.py, prompt_variants.py, plus a new
    untracked/gitignored local file), tests/wa_corpus/ (test_doc_title.py, test_reconcile.py),
    scripts/crm_guardian_phase15_pilot.py (docstring only), one file deleted from
    docs/archive/2026-07-orphans/ + .gitignore + this evidence pack. No backend service, no
    frontend, no migration, no credential. Supersedes PR #7474 (v6 of this lane, gate verdict
    REWORK-BUILD on two findings from the fresh gate on #7472, whose findings carry over to #7474
    because the shared blobs are identical: G2, a test-fixture string carrying 3 of 5 tokens of a
    real client's name; G3, the evidence's own disclosure re-identifying a client by linking a
    residual collision to a specific file). #7474 (v6) superseded #7472 (v5 of this lane, gate
    verdict REWORK-BUILD on a new finding surfaced by #7470's parallel gate run: residual client
    PII in scripts/crm_guardian_phase15_pilot.py's docstring, outside every prior diff in this
    chain). #7472 (v5) superseded #7468 (v4 of this lane, gate verdict REWORK-BUILD on a new
    finding, G1: residual client PII in scripts/wa_corpus/ tracked since 2026-06-17, outside every
    prior diff in this chain). #7468 (v4) superseded #7462 (v3, gate verdict REWORK-BUILD on the
    evidence only: F1 brief.yml de-anonymisation key of the four redacted client names, F2
    undercounted team-line phone numbers). #7462 itself superseded #7453 (gate verdict
    REWORK-BUILD: residual PII outside original scope, an undisclosed PII cloud-egress during
    review, and a false countable claim in the prior pack).

