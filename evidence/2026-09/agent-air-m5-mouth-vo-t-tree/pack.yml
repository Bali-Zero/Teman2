dissent:
  - seat: Claude Opus 5 (self-refutation, on the count in the progress line)
    objection: >-
      The line first read "Step 12 of 13". codex-gpt-5.6-sol (round 2) showed it
      was an answer COUNT dressed as an ordinal: on the fourth question it said
      "Step 3", and at a follow-up it said "Step N of N+1" while the open
      question was N+1. A progress line that miscounts is worse than no
      progress line, because it is believed.
    status: CONFIRMED
    cure: >-
      The copy is now "{{current}} of {{total}} answered" in EN and ID, and the
      unit test asserts the exact sentence rather than a regex that would have
      swallowed either reading.
  - seat: Claude Opus 5 (self-refutation, on what "never sent to the engine" meant)
    objection: >-
      The HUMAN_CONTEXT sentence promised the answer is never sent to the
      engine. tree.ts's own doc says HUMAN_CONTEXT values must never be mapped
      into a FactPath, so the copy read as true — but codex round 3 produced a
      reachable counter-example: holds_stay_permit = "no" resolves
      immigration.current_status_code to NO_STAY_PERMIT through fact-mapper,
      and fact-mapper.test.ts pins it. The rail was making a promise about a
      layer it does not own.
    status: CONFIRMED
    cure: >-
      The copy now says what is verifiable: no engine fact is attached to this
      question, it steers what comes next, and it can still feed a fact derived
      from the answers together. A test asserts the refuted sentence is gone.
  - seat: Claude Opus 5 (self-refutation, on the dual panel)
    objection: >-
      codex round 4 is right that a visitor with the mobile sheet open has two
      live copies of every jump target, and that resizing past 1024px leaves
      both visible.
    status: PLAUSIBLE
    cure: >-
      NOT cured, and deliberately: `git show origin/main:…/LivingTree.tsx`
      shows the same two TreePanel render sites, so the duplication is the
      component's pre-existing structure, not something this window
      introduced. Mounting one panel per breakpoint means reading the viewport
      in JS, which is a hydration decision for the whole route, not a rail
      change. Recorded as a leftover.
  - seat: Claude Opus 5 (self-refutation, on the council's own standing)
    objection: >-
      Four rounds each found something, which is evidence the rail's claims are
      easy to overstate — and the record ends on DEFECT with no seat signing
      the shipped state, because two of the three seats are out of quota.
    status: CONFIRMED
    cure: >-
      Not hidden and not claimed away. The gear is the measured floor (3), so
      a council IS required and its quorum rule will fail — see
      D-council-quorum-unreachable. What stands in its place is not a promise:
      every cure carries a test proven red under mutation, and the last round
      re-read the shipped state. A fresh gate should weigh that, and should
      not read the red council_run as an unnamed failure.
leftovers:
  - No mid-interview candidate set exists to show. The engine has exactly one endpoint and one caller, at the verdict; a "candidates so far" response (or a NEEDS_INPUT-style partial evaluation exposed to the client) is the endpoint this rail would consume the day it exists. Until then the rail says no product is named yet — which is also the honest statement of the product's own design.
  - engine-adapter.ts::questionForFact still returns undefined when more than one question collects a fact path (immigration.current_status_code, work.indonesia_source_compensation, investment.pt_pma_committed — the three paths §D of the coverage report names). It is NOT a UI dedup: the adapter is forbidden from guessing which of two asked questions the engine meant, and engine-adapter.ts belongs to W-VO-G's perimeter. Untouched here.
  - The mobile sheet and the desktop column mount the same TreePanel at the same time (pre-existing on origin/main); after a resize past 1024px with the sheet open, both are visible and every jump target exists twice. A breakpoint-aware mount is a route-level hydration decision.
  - formatFactDisplay renders a number answer as "1 days" (the unit i18n key carries no plural marker). Visible in the step-12 render's "Length of stay · 1 days"; it is ConfirmationCard's formatter, shared with the print recap, and pre-dates this window.
  - The rail names engine fact paths verbatim (person.nationalities, immigration.violation_history). That is deliberate honesty for a decision-support tool, but it has never been put to Zero as a copy decision; a plain-language gloss per path would need ~50 new EN+ID strings.
  - The screenshot cases wait 600ms for the mobile sheet's height animation before capturing. A deterministic hook (animation-complete promise) would be better than a timeout.
