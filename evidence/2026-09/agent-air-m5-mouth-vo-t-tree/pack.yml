  - seat: Claude Opus 5 (self-refutation, on the first instance's council record)
    objection: >-
      The pack the first instance left behind said codex-gpt-5.6-sol signed
      the shipped state at round 9. The transcript header says gpt-6-astra,
      and the written timestamps were later than the files. A quorum claim
      built on a mislabelled seat is a fabricated seat line, whatever the
      intent.
    status: CONFIRMED
    cure: >-
      Re-labelled and uncounted in the journal (D-seat-mislabel); the council
      re-run with -m gpt-5.6-sol and --model gemini-3.1-pro-high; the re-run
      found five more real defects in the "signed" state, all cured.
  - seat: codex-gpt-5.6-sol (round 10, on the dual panel)
    objection: >-
      The mobile sheet and the desktop column mount the same TreePanel, so
      every jump target exists twice and a resize past 1024px shows both.
    status: PLAUSIBLE
    cure: >-
      NOT cured: `git show origin/main:.../LivingTree.tsx` has the two
      `<TreePanel` mounts (lines 150 and 162) with the same edit buttons; this
      window added a data attribute to buttons that were already duplicated.
      A breakpoint-aware mount is a route-level hydration decision. Leftover.
  - seat: agy-gemini-3.1-pro (round 10, on visitedVerdict)
    objection: >-
      history.some(verdict) stays true after jumping back, so an off-spine
      question could be called the engine's follow-up.
    status: RETRACTED
    cure: >-
      Refuted, not cured: BACK slices history and EDIT / REVIEW_ANSWERS / SELECT_CATEGORY truncate
      it, so a jump back before the verdict removes the node; a reducer replay
      test (verdict -> EDIT -> SKIP) pins it.
leftovers:
  - No mid-interview candidate set exists to show. The engine has one endpoint, called at the verdict; a "candidates so far" response is the endpoint this rail would consume the day it exists.
  - engine-adapter.ts::questionForFact still returns undefined for the three fact paths collected by two questions each (immigration.current_status_code, work.indonesia_source_compensation, investment.pt_pma_committed). Not a UI dedup — the adapter may not guess which question the engine meant — and engine-adapter.ts is W-VO-G's perimeter. Untouched.
  - The mobile sheet and the desktop column mount the same TreePanel at once (pre-existing on origin/main); after a resize past 1024px with the sheet open both are visible.
  - getTreeSteps is clock-dependent (shouldAskRenewalPaid reads today). The rail now drops unasked steps behind the frontier, but the pre-existing trunk semantics are unchanged and belong to the branching owner.
  - formatFactDisplay renders a number answer as "1 days" (visible in the step-12 render); ConfirmationCard's formatter, pre-dates this window.
  - The rail names engine fact paths verbatim (person.nationalities, immigration.violation_history); a plain-language gloss per path (~50 EN+ID strings) has never been put to Zero.
  - The mobile screenshot cases wait 600ms for the sheet's height animation; an animation-complete hook would be deterministic.
  - Running visa-oracle-v2.spec.ts rewrites two committed audit PNGs (docs/audits/screenshots/visa-oracle-v2/visa-oracle-privacy-v1-{desktop,mobile-320}.png); left uncommitted in the worktree.
  - The codex context bridge ends long read-only reviews before a verdict (rounds 11, 12) or hands them to a continuation (round 14); a council dispatcher that follows the continuation chain would stop wasting rounds.
