decisions:
  - id: D-gear
    decision: >-
      Gear 3 = the measured floor. evidence_pack_lint.py --print-floor on the
      merge-base diff answers 3 and --print-floor-source answers "size": the
      apps/ churn alone is 2486 lines (2426 added, 60 deleted), past the 1828
      threshold, before any evidence file is counted. No hot-zone path is
      touched. Getting under the threshold would mean deleting the regression
      tests the council rounds produced.
  - id: D-seat-mislabel
    decision: >-
      On resume the journal claimed codex-gpt-5.6-sol signed round 9. It did
      not: the headers of codex-round6..9.txt read `model: gpt-6-astra` — the
      first instance had dispatched `codex exec` without `-m gpt-5.6-sol` and
      the CLI default answered. Those four lines are re-labelled
      codex-gpt-6-astra, ok:false, with their ts taken from the UUIDv7 session
      id (their written ts were later than the files themselves); their
      findings stay on record because they were real and cured. The agy
      round-7/9 OKs carry no model header and are likewise not counted. The
      council was then re-run from scratch on the titolare model, with the
      model pinned on both seats.
  - id: D-council-quorum
    decision: >-
      Quorum is two distinct seats OK on the SAME head, cd79c56739, the last
      source commit: codex-gpt-5.6-sol (round 14) and agy-gemini-3.1-pro
      (round 14, reserve). It took five more rounds in the resuming session;
      every DEFECT was either cured at depth 1 with a test proven red under
      mutation, or refuted with a command and pinned by a test. Codex rounds
      11 and 12 were cut by the codex context-bridge Stop hook before any
      verdict and count for nothing; round 14 rolled over twice through the
      same bridge (01a09c4b -> 01a09c4e -> 01a09c54, all gpt-5.6-sol, one
      checkpointed review) and its verdict line is the last continuation's.
      Evidence-only commits after cd79c56739 do not touch apps/.
  - id: D-no-partial-candidates
    decision: >-
      The window asked for the candidate set "from the engine's partial
      evaluation". There is none: the only engine endpoint is
      POST /api/visa-oracle/evaluate, called from OracleShell's evaluation
      effect at the verdict (and again for a follow-up). Rather than compute
      eligibility client-side — forbidden — the rail says no product is named
      yet and names product codes only from an ENGINE outcome already on
      screen. The endpoint need is a leftover.
  - id: D-css-inline
    decision: >-
      oracle.css is READ-ONLY by ruling and no stylesheet was added: the rail
      is styled inline from the existing --oracle-* / --space-* / --text-*
      scale and reuses existing oracle classes. Closed branches are a
      line-through plus a dashed edge, not dimmed opacity, because dimming
      failed axe color-contrast (first instance, measured and cured).
  - id: D-outcome-in-place
    decision: >-
      The outcome is the terminal node of the rail — the verdict step, the
      engine's own product codes and a sentence saying this is that node.
      OutcomeSheet.tsx is NOT touched: W-VO-G (#6441, merged before this
      branch's merge-base) owns its copy maps.
  - id: D-existing-spec-locator
    decision: >-
      e2e/visa-oracle-v2.spec.ts (outside the brief's file list) is edited in
      the same PR: the rail also names "Visit Visa C1", so five unscoped
      getByText assertions matched two elements under Playwright strict mode.
      They are scoped to .oracle-main__content through one helper.
  - id: D-render-dir
    decision: >-
      The process spec wrote its renders to an absolute home-directory path,
      so its beforeAll could not run on another machine. It now defaults to
      the git-ignored test-results/ and VO_T_RENDER_DIR redirects it; the
      twelve window renders were produced with VO_T_RENDER_DIR set, and one
      run without it wrote test-results/vo-t-renders/ (measured).
  - id: D-audit-screenshots-not-committed
    decision: >-
      Running visa-oracle-v2.spec.ts rewrites two committed audit PNGs under
      docs/audits/screenshots/visa-oracle-v2/ (pre-existing behaviour of that
      spec). The byte churn is a side effect of running the suite, not part of
      this window, so they are left uncommitted in the worktree.
  - id: D-secrets-pragma
    decision: >-
      The required Detect Secrets check flagged 15 Hex High Entropy strings on
      the first push: 14 on two JSON lines of council/codex-round3.txt (tool
      verification-receipt fingerprints the first instance kept in the
      transcript) and the ground-truth query_hash in this pack. None is a
      credential. Each flagged line carries `# pragma: allowlist secret` with
      the reason, the repo's convention for public hashes in evidence packs;
      `detect-secrets scan` on this directory then reports 0 findings. The
      content is otherwise unchanged. This is the one extra commit after the
      first push, made before any gate verdict was posted.
