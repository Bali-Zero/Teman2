decisions:
  - id: D-gear
    decision: >-
      Gear 3 = the measured floor, not a judgement. compute_floor on the
      merge-base diff answers 3 and compute_floor_source answers "size": churn
      over non-excluded files is 3378 (apps 2286, evidence 1092), past
      SIZE_GEAR3_THRESHOLD = 1828. No hot-zone path is touched, so the path
      term is 1 — the size term alone sets the floor. Declaring gear 2 would
      declare BELOW the floor, which Step 6 of harness-floor.yml fails by
      design; getting under 1828 would mean deleting real tests to dodge a
      threshold. So the gear is 3 and its consequence is stated plainly in
      D-council-quorum-unreachable rather than engineered away.
  - id: D-council-not-clean
    decision: >-
      The council was run for real, six rounds, and every finding it raised
      was cured at depth 1 and pinned by a test that goes red under mutation.
      What holds the cures is the tests, not a seat line — that is the claim
      this pack makes, and it is checkable by mutating the files.
  - id: D-council-quorum-unreachable
    decision: >-
      R9 (check_council_run_gear3) wants >=2 DISTINCT seats from
      (codex-gpt-5.6-sol, kimi-code/k3, tp1-qwen3.8-max) posting ok:true. Only
      one of the three is reachable this week, and that is measured, not
      assumed: kimi answers 403 "monthly usage limit" and qwen answers "token-
      plan 1-week quota has been exhausted ... resets 09-18 08:39 UTC", both
      re-probed in this session (receipts below). The linter's escape hatch,
      seat_override, is banned for this mission by COMMON-R3 — "never fabricate
      a seat line, never seat_override" — and inventing the second line is the
      one thing an evidence pack may not do. So "Harness floor recompute" goes
      RED on exactly one rule, council_run, and the cause is named here BEFORE
      the push instead of being discovered by a rerun. No other pack-lint rule
      is red: ground_truth now carries a real lane, backed by a real query.
  - id: D-no-partial-candidates
    decision: >-
      The window asked for the candidate set "from the engine's partial
      evaluation". There is none: the only engine endpoint is
      POST /api/visa-oracle/evaluate (evaluation-client.ts), called from
      exactly one place (OracleShell's evaluation effect) at the verdict.
      Rather than compute eligibility client-side — forbidden — the rail
      states plainly that no product is named yet and names product codes
      only from an outcome already on screen. A mid-interview "candidates so
      far" endpoint is recorded as a leftover, not faked.
  - id: D-css-inline
    decision: >-
      oracle.css is READ-ONLY by ruling and no second stylesheet was added:
      the rail is styled with inline properties drawn from the existing
      --oracle-* / --space-* / --text-* scale, and reuses .oracle-tree__leaf,
      .oracle-tree__step, .oracle-tabular-nums and .oracle-sr-only. The one
      colour decision — closed branches — is a line-through plus a dashed
      edge, NOT a dimmed opacity: dimming took the chips under 4.5:1 and axe
      named all ten (measured, then fixed, then re-measured clean).
  - id: D-outcome-in-place
    decision: >-
      "The outcome is the last node of the same tree" is rendered as the
      terminal node of the rail — the verdict step, the engine's own product
      codes, and a sentence saying this is that node. OutcomeSheet.tsx is
      NOT touched: W-VO-G owns its copy maps in parallel, and the framing
      needed no edit there.
  - id: D-existing-spec-locator
    decision: >-
      e2e/visa-oracle-v2.spec.ts (outside the brief's file list) is edited in
      the same PR: the rail now also names "Visit Visa C1", so five unscoped
      page.getByText("Visit Visa C1") assertions resolved to two elements and
      tripped Playwright strict mode. They are scoped to
      .oracle-main__content through one named helper, which is what each of
      them was written to check. A consumer of my change, fixed with it.
  - id: D-skipped-lane-refuted
    decision: >-
      Council round 1 finding #2 (the onshore urgent permit lane skips the
      purpose question, so the fan claims eleven open branches) is REFUTED,
      not cured: it quotes a STALE comment inside getTreeSteps.
      computeNextNode's permit_expiry case routes onshore to
      holds_stay_permit today, reproduced by a reducer-driven test in
      ProcessRail.test.tsx. The fan rule was still tightened — it shows only
      while the purpose question is on screen or already answered.
