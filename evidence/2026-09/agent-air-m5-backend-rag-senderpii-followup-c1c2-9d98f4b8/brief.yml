grader: |
  Every C1/C3/C6 cure carries a guilt test verified locally by dynamically loading
  `b491d10138`'s copy of the touched source file (`importlib.util.spec_from_file_location`,
  since the new private symbols `_strip_trailing_partial_token`/`_safe_filename_len` don't
  exist on that commit and would fail full-module pytest collection against it) and calling
  the same scenario the shipped test exercises directly: all four fail on `b491d10138`
  (`first_`/`a*`/`_domain` fragments leak; `_bounded_scrub("abcde fghij", 5)` returns `""`
  instead of `"abcde"`; `_safe_filename_ext(None)` raises `TypeError`) and all four pass on
  this PR's head via the full pytest suite. C2 has no such counterpart (see constraints/risks).
