dissent:
  - seat: "claude-opus-5 (refuter) vs claude-fable-5-1 (author)"
    status: CONFIRMED
    objection: >-
      The PR's one behaviour change armed an irreversible Google OAuth revocation
      (POST /api/integrations/google-drive/disconnect -> token revoke + DELETE grant)
      behind a status the backend hardcodes: /api/drive/status is the Team-Drive
      service-account router and returns "connected" as a literal whenever the SA is
      configured (team_drive.py:328), so every user would have been shown Disconnect
      and the Connect branch was unreachable. CONFIRMED on read of team_drive.py and
      google_drive_service.py:306-327. Cured in the cure commit: the card now reads the
      per-user grant from /api/integrations/google-drive/status, offers Connect only,
      and no longer calls disconnect(); DriveApi.disconnect() is removed (no caller).
  - seat: "claude-opus-5 (refuter) vs claude-fable-5-1 (author)"
    status: CONFIRMED
    objection: >-
      bulkReassign() was deleted as "a helper only the dead page called", but
      POST /api/partners/bulk-reassign is a live backend route (partners.py:695);
      the deletion removed a capability, not dead code, and the commit message did
      not say so. CONFIRMED; the helper is restored with a comment naming the live
      route and where a bulk action would attach (/partners ?orphaned= filter).
      Residual, stated: the helper has no UI caller until that action is built.
  - seat: "claude-opus-5 (refuter) vs claude-fable-5-1 (author)"
    status: CONFIRMED
    objection: >-
      Dropping the "/team" routeTitles entry regressed the header of the live
      /team/analytics page from "Team" to "Workspace" (prefix matcher in
      layout.tsx:37-41). CONFIRMED by the refuter's measurement on both sides;
      cured with an explicit "/team/analytics" entry.
  - seat: "claude-opus-5 (refuter) vs claude-fable-5-1 (author)"
    status: PLAUSIBLE
    objection: >-
      Commit 7's phrase "had no backend" is imprecise: /api/team/status and
      /api/auth/revoke-all exist. The refuter agreed neither is a regression (the
      deleted security page never called revoke-all; the live wiring is in the
      portal's SecuritySettings; /api/team/status is already rendered by /admin) and
      the deletion is defensible. Kept as PLAUSIBLE: the commit message is not
      rewritten (branch already under review); the pack and PR body carry the
      correction instead.
  - seat: "claude-opus-5 (refuter) vs claude-fable-5-1 (author)"
    status: RETRACTED
    objection: >-
      "git diff origin/main HEAD shows PENDING-ARMS.md losing a ledger row." The
      refuter itself retracted it as a two-dot artifact of a moved base: the
      merge-base three-dot diff does not touch the file. Recorded so nobody
      "fixes" it.
