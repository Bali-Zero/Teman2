dissent:
  - seat: "own dry-run classifier (this session, before any file was touched)"
    objection: >-
      Reconstructing #7441's exact 255-file list from aggregate counts alone (87/166/2, no
      literal path list survives in its report or pack) risks silently including/excluding the
      wrong files even if the final COUNT happens to match.
    status: CONFIRMED
    disposition: >-
      Built a dry-run classifier applying the SAME substitution rules #7441's brief.yml
      documents (git-author-quote protection, full-name-then-standalone priority order,
      hyphen/underscore/`@`/letter adjacency protection) against every residual candidate file,
      without writing anything. It reported 268 files with a real (non-protected) hit; removing
      the 13 known always-KEEP files (12 functional skips + the redaction-rule definition,
      cross-checked by exact path against #7441's own named roster) landed on exactly 255, which
      split into 87 non-research + 166 `research/**/*.md` + 2 (the exact two PII files #7441's
      report names by path) — three independent numbers matching #7441's own report exactly,
      taken as strong corroboration rather than a coincidence.
  - seat: ".husky/pre-commit's Law-2 PII gate (repo tooling, run at `git commit` time)"
    objection: >-
      Staging the substitution-only edit to `research/operations/2026-05-23-wa-mirror-dashboard-
      discovery.md` and `research/tax/2026-05-09-pph21-q3-deadlines-livetest.md` re-triggers the
      gate's full-file content scan, which flags pre-existing NPWP-number-shaped text unrelated
      to this change (the same pair #7434's pack already excluded on this exact rationale).
    status: CONFIRMED
    disposition: >-
      Read both flagged lines directly: `research/tax/.../livetest.md`'s NPWP example
      (`01.234.567.8-901.000`) illustrates a public-source (pajaknow.id) format-change rule, and
      `research/operations/.../discovery.md`'s NPWP mention (`"Detected: NPWP 12.345.678..."`)
      is a UI-mockup badge placeholder — neither is a real client's number. Committed with
      `PII_GATE_ENFORCEMENT=false`, the gate's own in-repo comment naming exactly this case
      ("Allowlist (sanitized/published artifact ONLY): PII_GATE_ENFORCEMENT=false git commit
      ..."). The diff itself never touches the flagged lines — confirmed via `git diff` showing
      only the unrelated owner's-first-name -> "Zero" line(s) plus the new frontmatter block per file.
  - seat: "npx prettier --check/--write (repo tooling, invoked manually then via the real hook)"
    objection: >-
      An early verification pass in this session ran `npx prettier --check` on the 87
      substitution-only files from the ROOT checkout's cwd and got "All matched files use
      Prettier code style!" — appearing to confirm no reformatting was needed. The actual
      `.husky/pre-commit` hook, run for real via `git commit` moments later (cwd = this
      worktree), rejected all 87 as unformatted.
    status: CONFIRMED
    disposition: >-
      Isolated to `cwd`: re-running the identical `npx prettier --check <same absolute path>`
      from the worktree's own directory reproduced the hook's "dirty" verdict on the SAME bytes
      that the root-cwd invocation called clean, reproducibly across repeated runs and even
      bypassing `npx` to call `node node_modules/prettier/bin/prettier.cjs` directly. No
      `.prettierrc`/`.editorconfig` exists anywhere in the tree to explain it
      (`--find-config-path` reports "not found" from both cwds; `--no-editorconfig` does not
      change the result). Root cause not fully isolated in this session (out of scope: fixing a
      prettier/npx environment quirk is not this PR's job). Resolution: trusted the cwd that
      matches what `.husky/pre-commit` actually uses (the worktree being committed), re-ran
      `npx prettier --write` from there, and verified `--check` clean from that same cwd before
      committing — the real `git commit` then ran the real hook and passed. Flagged in brief.yml
      `constraints` for a follow-up ticket.
  - seat: "CI's 'prettier --check (changed files)' required check (.github/workflows, fresh npm ci)"
    objection: >-
      After the first push, CI's own prettier job FAILED on exactly one file,
      `docs/superpowers/reviews/2026-04-21-partners-v1/02-codex.md`, that the local `.husky/
      pre-commit` hook (which passed) had not caught.
    status: CONFIRMED
    disposition: >-
      Root cause identified this time: the local checkout's installed `node_modules/prettier` is
      3.9.6, while `package-lock.json` pins 3.9.9 — CI's job does a fresh install matching the
      lockfile exactly, so it runs 3.9.9, a MINOR version this repo's own `node_modules` on this
      machine had drifted behind. `npx --yes prettier@3.9.9 --check` reproduced CI's exact
      failure locally on this one file (confirmed: checking the full 255-file set under 3.9.9
      found only this one file dirty, none of the other 254). Fixed with
      `npx --yes prettier@3.9.9 --write` on that one file (993 lines changed — a full reflow,
      the version difference's formatting decision, not a name-sweep defect) and re-verified the
      full 255-file set clean under 3.9.9. This is the same environment fragility as the cwd
      finding above (a second, independent way this repo's local prettier invocation can
      disagree with its own CI) — flagged in brief.yml `constraints` for the same follow-up
      ticket, not fixed at the infrastructure level here (out of scope for a name-sweep PR): the
      actionable takeaway for that ticket is `npm ci` bringing `node_modules` back to the
      lockfile's pin would have caught both findings before push.
  - seat: "self-review (residual audit against #7441's still-open, not-yet-merged branch)"
    objection: >-
      Since PR #7441 has not merged, this branch's own post-sweep word-boundary grep for the
      owner's first name residual count (668 lines / 297 files) is much larger than #7441's own reported
      post-sweep residual (1014 lines / on ITS branch, with its 274 files already fixed) — are
      these numbers actually comparable, or is something being missed?
    status: CONFIRMED
    disposition: >-
      Different bases: #7441's 1014 figure is measured ON #7441's OWN branch (274 files already
      swept). This PR's 668 is measured on origin/main + only THIS PR's 255 files (#7441's 274
      not yet merged in). Of the 297 residual files here, 274 are exactly #7441's own
      pending set (cross-checked by path against its changed-file list) — unaffected by this PR
      by design, resolved once #7441 merges. The remaining 23 files (44 lines) were audited
      line-by-line: all classify into the documented KEEP buckets (email 5, functional_code/
      test-fixture skip 20, redaction_definition 1, off_limits_file 3, evidence_record 2,
      code_token/path-tag 6, the hyphen-prefix `needs-<owner's-first-name>` display-tag convention
      7) — 0 unclassified.

