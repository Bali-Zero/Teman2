objective: >-
  Finishes PR #7441 (agent/air-m5/docs/owner-name-zero-v3, open, not yet merged): that PR's own
  report and evidence pack (evidence/2026-09/agent-air-m5-docs-owner-name-zero-v3-b1fdcd14/)
  document that it deliberately reverted 255 files to origin/main byte-identical because
  committing/pushing the owner-name substitution on them tripped a repo gate unrelated to the
  substitution's own correctness: 87 files tripped `.husky/pre-commit`'s prettier-formatting
  check, 166 `research/**/*.md` files tripped `.husky/pre-push`'s R1 adversarial-review
  frontmatter gate (`scripts/check_adversarial_review.py`), and 2 files tripped
  `.husky/pre-commit`'s Law-2 PII gate on pre-existing, unrelated NPWP-shaped example text. This
  PR reconstructs the exact 255-file set (recomputed independently: every file with a
  capitalised/lowercase word-boundary hit on the owner's first name on origin/main that #7441's own branch does
  NOT change, minus the 12 functional-code full-file skips, the redaction-rule definition, other
  PRs' evidence packs, and files whose only hits are protected patterns — 268 real-hit candidates
  minus those exclusions lands on exactly 255, matching #7441's own reported split of 87+166+2),
  applies the SAME line-scoped byte-preserving substitution #7441 used, then cures each of the
  three gates the way the gate itself documents rather than bypassing it: prettier via
  `prettier --write` (bounded to these 87 pre-identified files, not a blanket run — the class of
  churn PR #7430 was closed for), R1 via the gate's own `adversarial_review: exempt-<reason>`
  escape hatch (no claim in these files changed, only a display-name rename — a truthful reason),
  and the PII gate via its own documented `PII_GATE_ENFORCEMENT=false` override for a verified
  false positive (both flagged lines are pre-existing illustrative NPWP-format examples, not real
  client data — the same pair PR #7434's pack already excluded on this exact rationale).
constraints:
  - >-
    KEEP rules unchanged from #7441 (see that PR's own brief.yml `constraints` for the full
    rationale): any token containing `@` (emails); handles/hostnames where the name is
    immediately followed by another word character; snake_case/kebab-case/camelCase compounds
    where `_` or a hyphen immediately precedes the name, or a letter immediately follows it;
    filesystem paths/URLs naming an actual repo file; the git-author-quote shape
    (the owner's full name immediately followed by an email in angle brackets); the 12 full-file functional-code/test skips (NER fixtures,
    known-names lists, the CREATOR-persona identity check, the whatsapp-corpus name-detector and
    its test, `tests/wa_corpus/test_db_names.py`); `agent-library/config/redaction-rules.yaml`
    (redaction rule DEFINITION); `apps/backend-rag/backend/prompts/zantara_core.py` (repo-wide
    off-limits); `migrations_v2/**`, `.github/**`; other PRs' `evidence/**` packs. Verified this
    session by a line-by-line residual audit (see `pack.yml` receipts) — every remaining
    hit on the owner's first name (either case) in a file this PR touched classifies into one of these buckets,
    0 unclassified.
  - >-
    A NEW finding this session, absent from #7441's pack: `npx prettier --check`/`--write` gives
    a DIFFERENT verdict for byte-identical file content depending on the invoking shell's `cwd`
    (a checkout at an older commit vs this worktree at HEAD) even with no `.prettierrc` or
    `.editorconfig` present anywhere in the tree to explain it (`--find-config-path` returns "not
    found" in both cases, `--no-editorconfig` does not change the result). `.husky/pre-commit`
    runs `npx prettier --check` with `cwd` = the repo actually being committed (this worktree),
    so that invocation — not a check from an unrelated checkout — is the one that matters and is
    the one this pack trusts. Root-cause not fully isolated (candidates considered and not
    confirmed: npx's package-manager-version resolution, a stale/behind root checkout at a
    different commit than origin/main used for an earlier sanity check in this same session);
    flagged here as an environment fragility for a follow-up ticket, not fixed in this PR (out of
    scope: this PR's job is the name sweep, not a prettier/npx environment audit).
  - >-
    No client PII anywhere in the diff or this pack (the 2 PII-gate-adjacent lines were read,
    confirmed to be pre-existing NPWP-*format*-illustration text with no real person's number,
    and left byte-identical — only the unrelated owner's-first-name line elsewhere in each file was
    substituted). No secrets echoed. No edit outside the dedicated worktree
    (`agent/air-m5/docs/owner-name-zero-v4`).
