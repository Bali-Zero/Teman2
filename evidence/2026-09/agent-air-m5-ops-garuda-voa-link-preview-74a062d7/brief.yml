objective: |
  PR #5559 (`agent/air-m5/ops/garuda-voa-link-preview`) added `POST /api/visa/voa/auth/magic-links
  /preview` — a non-consuming lookup so the GARUDA VOA continue page can show whose masked account a
  magic link opens BEFORE the customer spends it, closing a login-CSRF residual (an attacker mails a
  victim the attacker's own link; the victim's Continue click would otherwise plant the attacker's
  session in the victim's browser). Two required CI checks went red on that PR and this dispatch's
  mandate was to diagnose and fix both properly, without arming or opening a new PR.

  GATE 1 (`test_mutating_routes_are_gated.py::test_every_public_mutating_route_is_accounted_for`):
  the new route is a POST, registered in `PUBLIC_ENDPOINTS` (needs zero credential) but was NOT yet
  registered in `INTENTIONALLY_PUBLIC_MUTATIONS` — the second registry this gate also requires for
  every zero-credential mutating route. Verified from the handler and store source, not asserted:
  `PostgresMagicLinkStore.peek()` is a single `SELECT`, no UPDATE/INSERT/DELETE, no advisory lock, no
  counter of its own — genuinely non-mutating, classified MUTATING only by HTTP verb. Added a full
  reviewed entry to the registry matching the depth of its two frozen siblings (request/exchange).

  GATE 2 (`Harness floor recompute`): this diff's deterministic floor is 3 — `apps/backend-rag/
  backend/app/auth/*` is a HOTZONE_PATTERNS entry and this PR edits `public_endpoints.py`, which sits
  under it — but the PR carried no `evidence/brief.yml`/`pack.yml` of its own (the root-level pair on
  this branch was inherited from a prior unrelated Gear-3 merge, #5400, and CI's own `tracked_file_
  present_in_diff.sh` correctly refuses to credit an inherited file). This pack + this brief are the
  fix, authored together per-PR at `evidence/2026-09/agent-air-m5-ops-garuda-voa-link-preview-
  74a062d7/` (the slug `scripts/ci/evidence_paths.py --ref` computes for this branch). Gear 3 also
  requires (R9, enforcement date 2026-09-02, today) a `council_run` journal with >=2 distinct
  cross-family COUNCIL_REVIEW_SEATS review lines — `kimi-code/k3` answered HTTP 403 (weekly Moonshot
  quota exhausted, verified live, not assumed), so the two seats convened are `codex-gpt-5.6-sol` and
  `tp1-qwen3.8-max` (Alibaba TP1/DashScope gateway, flat token plan) — both distinct from Anthropic
  and from each other, satisfying the quorum without either being the seat that wrote this diff.

  COUNCIL FINDING THAT CHANGED THE DIFF. `codex-gpt-5.6-sol`'s independent adversarial review (dissent
  below) found the preview handler's own docstring, and this dispatch's first draft of the
  registry entry copying it, overclaimed non-enumeration: "an absent, malformed, expired, already-
  consumed, or foreign token all answer the identical 401" is FALSE for absent/malformed — those fail
  `MagicLinkExchange`'s `min_length=32` Pydantic constraint before `store.peek` ever runs and answer
  422 `INVALID_REQUEST` instead (verified independently by reading `_ContractErrorRoute` and the
  Pydantic field, not taken on the reviewer's word). Corrected both the router docstring and the
  registry entry to scope the claim the same way `exchange_magic_link`'s own docstring already scopes
  itself (well-formed-but-invalid tokens only) — a documentation-accuracy fix, not a behavior change:
  the 422-vs-401 split was already the router's real behavior before and after this correction.

  COUNCIL FINDING NOT FIXED, REPORTED INSTEAD. The same review surfaced a real, unresolved weakness in
  the feature this endpoint belongs to: `masking.py` reveals only the local part's first 2 characters
  (`local[:2]` when `len(local) > 2`, else nothing), a fixed-width mask an attacker can craft a
  collision against — `jo-attacker@gmail.com` and `john@gmail.com` both mask to `jo***@gmail.com`.
  Verified directly against `mask_email()`'s source, not taken on the reviewer's claim alone. This
  does not change GATE 1's verdict (the route is still genuinely non-mutating and needs zero
  credential regardless of masking strength) but it does mean the masked preview can be spoofed by an
  attacker who can guess or choose an email colliding on the first two characters + domain — a real
  gap in how effectively this PR's own stated purpose (defeating the login-CSRF spoof) is achieved.
  NOT fixed here: redesigning the masking reveal width is a security/UX tradeoff for the feature
  owner, outside this dispatch's scoped mandate (fix the two named CI gates) and the "smallest correct
  fix" instruction it carried. Reported to the dispatching session instead, per the same standard that
  instruction applied to a mutating/broad-registry finding ("say so and STOP, I want to hear it before
  anything is registered").

  A second reviewer finding (`peek()` not filtering by the `environment` column) was checked and
  refuted: `exchange()`'s own atomic UPDATE has the identical `WHERE token_hash = $1` shape with no
  `environment` predicate, so this is a pre-existing property of the whole store `peek()` correctly
  mirrors (its own docstring says so), not a new defect this PR introduces.
