dissent:
  - seat: codex-gpt-5.6-sol (cross-family council reviewer)
    objection: >-
      FAIL -- the non-enumeration claim in the preview handler's docstring (and this dispatch's first
      draft of the registry entry, copied from it) is false for absent/malformed tokens: those fail
      Pydantic's min_length=32 constraint on MagicLinkExchange.token before store.peek ever runs, and
      answer 422 INVALID_REQUEST via _ContractErrorRoute, not the claimed 401 MAGIC_LINK_INVALID.
    status: CONFIRMED
    note: >-
      Verified independently before acting: read _ContractErrorRoute.get_route_handler and the
      MagicLinkExchange field definition directly (receipt above). FIXED in both the router docstring
      and the registry entry -- both now scope the non-enumeration claim to well-formed-but-invalid
      tokens only, matching how exchange_magic_link's own docstring already scopes itself. This was a
      documentation-accuracy defect, not a behavior change: the 422-vs-401 split was already the real
      runtime behavior before this correction.

  - seat: codex-gpt-5.6-sol (cross-family council reviewer)
    objection: >-
      FAIL (blocking) -- the login-CSRF mitigation this endpoint exists to provide is spoofable:
      mask_email() reveals only the local part's first 2 characters with a fixed "***" mask, so an
      attacker who mints their own magic link under a self-chosen email colliding on those 2
      characters + domain (e.g. "jo-attacker@gmail.com" vs victim "john@gmail.com", both masking to
      "jo***@gmail.com") produces a preview the victim cannot distinguish from their own account,
      defeating the whole point of showing the preview before Continue.
    status: CONFIRMED
    note: >-
      Verified independently by tracing mask_email() against both example emails directly (receipt
      above) -- the collision is real, not hypothetical. NOT FIXED in this dispatch: redesigning
      masking.py's reveal width is a security/UX tradeoff for the feature owner (how much of a
      customer's own email is safe to show back to an anonymous caller holding any plausible-looking
      link), and this dispatch's mandate was scoped to the two named CI gates plus the smallest
      correct fix -- not a unilateral redesign of the shipped mitigation. Reported prominently to the
      dispatching session in this pack's brief.risks and in the final report, per the same "say so and
      STOP, I want to hear it before anything is registered" standard the dispatching brief applied to
      a related class of registry finding.

  - seat: codex-gpt-5.6-sol (cross-family council reviewer)
    objection: >-
      The rate-limit posture claimed in the registry entry and docstring (generic per-IP 120 req/min
      bucket) may not hold for THIS specific route, because the actual caller is a Next.js Server
      Component making a server-to-server call -- the backend would see the hosting platform's egress
      IP, not the end visitor's IP, for every caller alike.
    status: PLAUSIBLE
    note: >-
      Not independently verified this session -- would require tracing exactly which IP
      RateLimitMiddleware extracts (raw socket vs a forwarded-for header) and whether the two frozen
      sibling routes (request/exchange) are called the same server-to-server way or directly from the
      browser. If true, this is a PRE-EXISTING property of the whole GARUDA VOA auth flow (this PR's
      registry entry states the same posture "its two frozen siblings already share," not a stronger
      claim specific to this route), not a new gap this PR introduces -- but it was not re-derived
      from the middleware source before this pack was written, unlike the two CONFIRMED findings
      above, so it is recorded as PLAUSIBLE rather than either confirmed or refuted.

  - seat: codex-gpt-5.6-sol (cross-family council reviewer)
    objection: >-
      peek()'s SELECT does not filter by the `environment` column the table carries, so a token
      minted in one environment could validate in another.
    status: RETRACTED
    note: >-
      Refuted by reading exchange()'s own atomic UPDATE (receipt above): it has the IDENTICAL
      no-environment-predicate WHERE clause. peek()'s own docstring says it deliberately mirrors
      exchange()'s WHERE clause exactly, so this is a pre-existing property of the whole store that
      predates this PR, not a new hole introduced by the preview endpoint -- and token_hash is already
      a globally-unique 256-bit primary key across the whole table regardless of environment, so
      environment appears to be descriptive/audit metadata rather than a security boundary this store
      relies on.

  - seat: tp1-qwen3.8-max (cross-family council reviewer, second seat)
    objection: >-
      OK (no defect found) -- reviewed the identical diff and five-question prompt given to
      codex-gpt-5.6-sol and concluded all five questions "check out against the actual code," finding
      no overclaim in the registry entry and no other defect.
    status: RETRACTED
    note: >-
      This verdict MISSED both of codex-gpt-5.6-sol's CONFIRMED findings above (it explicitly asserted
      "Masking: ... No PII escape" and "Registry justification is honest ... No overclaim," both now
      known false) when given the same code to look at. Kept in this journal rather than dropped,
      because a clean verdict that missed real defects is itself useful evidence about this reviewer's
      blind spots on this diff shape -- not treated as a second confirming opinion that outweighs the
      seat that looked closer, per the repo's own "never blind agreement" convention (cicatrix-
      superscar.md family #6, W100).

