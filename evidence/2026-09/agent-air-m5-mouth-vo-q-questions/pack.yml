decisions:
  - id: D-gear
    decision: >-
      Gear 3. The deterministic floor from evidence_pack_lint.py --print-floor
      on the merge-base diff is 3 (50 files, +5528/-270 — the churn term is
      dominated by the regenerated walk corpus). The window brief declares 3.
      gear = max(3, 3) = 3, so a council is owed and was convened.
  - id: D-ask-do-not-widen
    decision: >-
      The nine unreachable products are cured by ASKING, never by loosening the
      guard. `getCategoryQuestionIds` (flow.ts) gained the ten questions on the
      branches where their rule's premises can hold — the employment sponsor
      questions keyed to `sponsor_category` (GOVERNMENT -> invitation + trade
      office, INDIVIDUAL -> diplomatic household, NONE -> collaboration), and
      the investment route questions on the INVESTMENT vehicles. Not one
      assertion in the reachability guard was relaxed: the candidate-pack guard
      still demands that EVERY support-bearing code of the catalogue be named
      by some walk, and its guilt twin still goes red when a product loses its
      walks.
  - id: D-known-false-not-unknown
    decision: >-
      A "no" answer is KNOWN(false) on the wire, never UNKNOWN. These ten rules
      carry `on_unknown: NEEDS_INPUT`, so an UNKNOWN would make the engine ask
      the question the applicant had just answered — the dead end the mandate
      forbids. A branch that never asks a question leaves it
      UNKNOWN(NOT_ASKED), and every such rule is already DEFINITELY FALSE on
      its purpose or sponsor premise for that walk, so the unknown can never be
      the fact that blocks.
  - id: D-ikn-entailment
    decision: >-
      `investment.ikn_subsidiary` is sent KNOWN(false) when
      `investment_establishes_company = "no"`, and the question is not shown.
      This is an entailment, not a second fact smuggled into one question: the
      IKN question asks "will THE COMPANY YOU ARE ESTABLISHING be a subsidiary
      located in IKN", and the company question's own hint says "a subsidiary
      set up in Indonesia, including one of a company abroad, counts as a
      company". No company established therefore means no IKN subsidiary, and
      `el.e28f.ikn-subsidiary` cannot be hidden from anyone it could have
      served. Attacked as a BLOCK in council round 5 and WITHDRAWN in round 6
      on exactly this ground.
  - id: D-explorer-investment-alone
    decision: >-
      The business explorer (brief item 7, owner ruling 2026-09-14) declares
      purpose INVESTMENT ALONE, not INVESTMENT + BUSINESS_MEETINGS. The pack's
      `hit_policy.eligibility` is COVER_ALL_DECLARED_PURPOSES and D12's
      catalogue coverage is INVESTMENT/TOURISM/FAMILY, so the pair would name
      no D12 at all — measured on seq-20 and seq-21, it names C2 or nothing.
      `exploring` is also added to ACTIVITY_BOUNDARY_DECIDABLE_ANSWERS, because
      the pack decides the explorer's facts on its own and holding him would
      delete an answer it had already proven.
  - id: D-d12-stay-bound
    decision: >-
      The explorer sequence asks the investor facts only when the walk can no
      longer be answered by D12 — a declared onshore conversion, or a stay
      beyond D12's own bound. That bound is a number the PACK owns, so
      `D12_MAX_STAY_DAYS` is a declared copy pinned by a test, and after
      council round 6 the test pins it against the highest SIGNED pack and the
      highest SOURCE pack SEPARATELY, with both lanes asserted present so an
      empty one cannot pass vacuously.
  - id: D-one-copy-row
    decision: >-
      ONE row is added to SUPPORT_REASON_COPY in _lib/engine-adapter.ts
      (`D12_NOT_CONVERTIBLE`, EN + ID, no figure). Declared rather than taken
      silently: the window's forbidden list names OutcomeSheet.tsx copy maps,
      and this map is one layer below in the same output path. It is not
      optional — the guard already on the base branch,
      test_seq21_pack.py::TestCensusReplay::
      test_every_no_path_code_seq21_emits_on_the_corpus_has_visitor_copy, fails
      with `assert ['D12_NOT_CONVERTIBLE'] == []` when the row is removed, and
      the visitor on the explorer dead-end walk would be shown a raw engine
      code. Council round 6 WITHDREW its own BLOCK on this and asked for
      exactly this declaration. W-VO-D (#6472, still OPEN) edits the same map:
      the collision is named in the PR body, and the two additions are to
      different keys.
  - id: D-per-sequence-pins
    decision: >-
      The census pins its expectations PER SIGNED SEQUENCE
      (EXPECTED_OUTCOME_BY_SEQUENCE, WALK_DEAD_END_ALLOWLIST_BY_SEQUENCE,
      EXPECTED_DEAD_END_FACT_CENSUS_BY_SEQUENCE), selected by the sequence of
      the highest signed pack actually on disk, and a new test pins which
      sequence that is. This is what lets ONE file be green both on today's
      main (seq-20 signed) and the moment the seq-21 bundle lands, without a
      branch of the test ever going unmeasured: whichever sequence is absent is
      not silently skipped, it is simply not the one in force, and the tests
      that only make sense against an unsigned candidate above the signed pack
      skip with a stated reason.
  - id: D-guilt-reanchors
    decision: >-
      Two guilt tests were re-anchored, both because the tree change made their
      old premise FALSE, and both re-anchored to a walk where the premise is
      true again — never by weakening the assertion.
      test_guilt_a_stale_allowlist_row_is_caught moved from
      `offshore/invest/pt_pma` to `offshore/invest/pt_pma/no_route`: the first
      walk no longer pins bare C2 once the route questions are asked, so the
      old anchor could no longer express the stale row it exists to catch.
      test_seq21_pack.py's `unasked_walks` fixture excludes the four
      `offshore/business/exploring*` walks: that branch did not exist before
      this PR, so "what this walk decided BEFORE the answers" has no meaning
      for it.
  - id: D-no-figures
    decision: >-
      No figure appears in any new visitor-facing string. The threshold
      question names the threshold and never a number ("every published
      financial minimum for the route you chose"), because no source record in
      the seq-21 pack states those minimums (FACTS-FOR-THE-TREE.md, fact 10)
      and this repo forbids a figure in copy without a source_record_id. The
      D12 dead-end copy names the product exactly as the pack's `names.en` /
      `names.id` do.
  - id: D-council-citation
    decision: >-
      No vendor or model name is written into code or comments. Findings are
      cited as `council round N (council/journal.jsonl)`. Five PRE-EXISTING
      seat names in the census docstrings (inherited from #6442 and later PRs
      on that file) were rewritten to the same form rather than left as a
      mixed convention in a file this PR rewrites heavily; the change is
      comment-only.
