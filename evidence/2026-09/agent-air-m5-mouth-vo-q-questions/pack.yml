dissent:
  - seat: codex-gpt-5.6-sol (council round 6, UPHELD MEDIUM; round 7 accepted the disposition)
    objection: >-
      "Unknown is not does-not-meet." q.investment_meets_threshold tells a
      visitor who does not know the published minimum for their route to answer
      NO, which reaches the engine as KNOWN(false) — a false-negative
      eligibility fact that withholds every threshold-dependent route
      (E28B/E28C/E28D/E28F). The cure it asked for was a third "I don't know"
      answer terminating in human review.
    status: CONFIRMED
    cure: >-
      NOT cured in this PR, and the reason is a measurement rather than a
      preference. An "unsure" answer raises NOT_CERTAIN
      (mapDisclosedReviewFlags), and _apply_disclosed_review_flags is monotone
      over the WHOLE decision — models.py forbids a non-empty candidate list in
      any state but SUPPORTED_CANDIDATES — so the hold cannot be per-candidate.
      Measured on offshore/invest/pt_pma with the seq-21 bundle: "no" leaves
      the visitor SUPPORTED_CANDIDATES ['C2']; "not sure" leaves him
      HUMAN_REVIEW_REQUIRED with NO candidates. The third answer would delete a
      product the signed pack had already proven for that same person, which is
      the exact defect ACTIVITY_BOUNDARY_DECIDABLE_ANSWERS and the NARROW-2
      ruling ("a hold is the exception, a deterministic pack answer is not")
      exist to prevent. What ships instead is disclosure: the hint states the
      rule in both languages, the visitor can edit the answer, and the durable
      cure — a per-candidate hold — is an engine change recorded in leftovers.
      Round 7 accepted this.
  - seat: agy-gemini-3.1-pro (council round 6, BLOCK)
    objection: >-
      The capital_market vehicle asks "Is the PT PMA commitment already
      concrete?", which contradicts a branch the applicant chose precisely
      because it involves no company; infer `investment.pt_pma = false` from
      the vehicle instead.
    status: PLAUSIBLE
    cure: >-
      Not applied, and the AUTHOR REJECTS this finding — not RETRACTED, because
      the seat itself never withdrew it: re-probed in round 8
      (council/agy-gemini-3.1-pro-round8.txt) with this exact rebuttal put to
      it directly, and that run produced no output (a tool-permission
      auto-denial in headless mode, the same failure class as round 1's first
      attempt). Round 9 (council/agy-gemini-3.1-pro-round9.txt), run with no
      tools and the same rebuttal pasted in, calls finding (d) "a
      well-argued rejection" and ends VERDICT: PASS. The seat accepts the
      author's rejection without formally withdrawing the finding, so the
      status stays PLAUSIBLE, not RETRACTED. The refutation is in the copy the seat did not
      read. The vehicle option says "Capital-market investments only, such as
      listed shares or bonds" — it describes the BASIS of the investment. The
      seq-21 fact that means "without establishing a company" is a DIFFERENT
      question, q.investment_capital_market_only, asked separately on the same
      branch. Inferring pt_pma=false from the vehicle would deny E28A to an
      applicant who holds listed shares AND has a concrete PT PMA commitment —
      the same false-negative class the seat itself flags elsewhere. Asking
      costs one question and a "no" closes E28A with no figure requested,
      which is why the question is there at all.
  - seat: Claude Opus 5 (self-refutation, on the perimeter)
    objection: >-
      One row is added to a copy map (_lib/engine-adapter.ts's
      SUPPORT_REASON_COPY) in a window whose forbidden list names the outcome
      layer, while W-VO-D (#6472) is open on the same file. Someone could call
      that a silent widening.
    status: CONFIRMED
    cure: >-
      Declared, never silent: D-one-copy-row above, the PR body, and a
      measurement that the guard on the base branch fails without it. The two
      PRs add DIFFERENT keys to the same map, so the collision is textual and
      not semantic; #6472 rebases onto this, and its own review reads the map
      it is editing.
  - seat: Claude Opus 5 (self-refutation, on size)
    objection: >-
      50 files and +5528/-270 is far past the "~400 net lines" of the PR
      contract.
    status: PLAUSIBLE
    cure: >-
      Not split. 3 245 of the 5 528 added lines are the REGENERATED walk corpus
      — data, not prose, and a tree change that does not regenerate the corpus
      in the same PR leaves the census measuring a funnel that no longer exists
      (that rule is written into walk-corpus-determinism.test.ts). Of the
      remaining +2 283/-158, the two largest files are the census test (+708)
      and flow.test.ts (+535), i.e. the tests that pin the change. The
      customer-visible concern is single: the interview asks what the catalogue
