dissent:
  - seat: claude-opus-5 (independent gate reader, xhigh, separate session)
    status: CONFIRMED
    objection: >-
      BLOCK on head d63a1bc895, three mechanical conditions, all three correct and all three
      closed here. (1) SHAPE: rulepack-prod-020.source.json was not prettier-formatted while
      rulepack-prod-018/019.source.json on main are — a house-workflow gap the fold's
      docstring never named, so the next fold would have repeated it. CURED: prettier --write
      run, the JCS payload digest recomputed before and after and proven identical, the
      constant pinned in a committed test, and the fold-then-prettier ceremony written into
      the fold's docstring so the next sequence inherits it. (2) EVIDENCE: no Gear-3
      evidence pack, though the pack JSON's own line count floors the PR at Gear 3. CURED:
      this pack. (3) SUPPORT_REASON_COPY: the new EXCLUDE code
      BUSINESS_LOCAL_COMPENSATION_NOT_ALLOWED had no entry in the frontend reason-copy map,
      so the first real reader to declare Indonesian-source compensation would have been
      shown "Verified reason: BUSINESS_LOCAL_COMPENSATION_NOT_ALLOWED" on the no-path sheet.
      CURED, and the gate's own instinct to say "verify WHICH map" was right: engine-adapter.ts
      carries two maps and the review one is the wrong door for an EXCLUDE code —
      NO_SUPPORTED_PATH maps no_path_reasons through reason() -> reasonMessage() ->
      SUPPORT_REASON_COPY, confirmed by reading the branch before editing and again by both
      cross-family review seats.
  - seat: gemini-3.1-pro (via agy, cross-family, adversarial review of the SPEC)
    status: RETRACTED
    objection: >-
      Status note first, because the vocabulary here is narrow: the seat did not itself
      withdraw this finding — it was a one-shot review with no second round. RETRACTED is
      recorded because the seat named the exact experiment that would settle it, the
      experiment was run, and it came back against the finding. Read it as "settled by the
      evidence the objector asked for", not as "the objector changed its mind".
      Finding 3, MAJOR: "the fix is tautological — requiring intent.requested_product_code to
      be `known` does not neutralize the hazard, because a user who asks for C1 satisfies both
      `known` and `neq BRIDGING`, so the rule will still falsely grant BRIDGING support."
      DISPOSITION: rejected on semantics, with the evidence gemini itself asked for produced
      and recorded above. `neq BRIDGING` is not a guard against granting bridging — it is the
      DESTINATION check: the BRIDGING product IS the onshore status-conversion route, and the
      rule fires when the applicant is onshore, purposes include OTHER, and the destination
      product they want to convert TO is something other than bridging itself. A stated C1 is
      a valid destination, so SUPPORTED [BRIDGING] is the intended answer, not a fail-open;
      bridging-to-bridging is what `neq BRIDGING` refuses, and the measured matrix confirms it
      (requested="BRIDGING" -> not a candidate). The `known` conjunct fixes a different,
      real defect: without it el.bridging.destination-stated blocked on a fact the interview
      never supplies, which is one of the 36 dead ends this whole fold exists to remove.
      Where gemini WAS right and was acted on: finding 5 (document-sibling caps) drove the
      fold-time stay-day census that makes el.a1.tourism's exemption explicit rather than
      accidental, and finding 6 (NO_EFFECT fail-open) was checked and is fail-CLOSED — the
      eight rules are SUPPORT, not EXCLUDE, so NO_EFFECT keeps E31B/E31E/E31H/E31J out of the
      candidate set, with the 18/18 gold coverage replay as the floor that would catch it if
      that reading were wrong.
  - seat: tp1-qwen3.8-max (cross-family, on the rework diff)
    status: CONFIRMED
    objection: >-
      Two MINOR findings on the new docstring paragraph, both cured before this pack was
      written. (a) "safe by construction" overstated the guarantee: the digest invariant is
      contingent on prettier's JSON printer being semantics-preserving, not mathematical —
      a printer that rounded a number token beyond 2^53 would move it. Reworded to say
      exactly that, and the docstring now points at the two committed tests that CHECK the
      invariant rather than trusting it. (b) the ceremony said "run npx prettier --write"
      without pinning the working directory, so a contributor running from an unrelated cwd
      could get different config resolution. Reworded to "FROM THE REPO ROOT".
  - seat: tp1-qwen3.8-max (cross-family, on the rework diff)
    status: PLAUSIBLE
    objection: >-
      Third MINOR finding, NOT cured: excludeReasonCodeOfRule returns the FIRST rule whose
      rule_id matches, so a pack containing duplicate rule_ids would silently use the first
      one instead of failing loudly. Left as-is deliberately — the fold already refuses to
      emit a pack with duplicate rule ids and test_seq20_pack.py's rule-set delta check
      compares rule-id SETS, so a duplicate cannot reach this test without failing several
      louder gates first. Recorded rather than fixed because adding a second enumeration
      here would put the duplicate-id contract in a TypeScript test in a different app from
      the Python that owns it, which is the wrong home for it.
  - seat: claude-opus-5 (this worktree session), self-caught
    status: PLAUSIBLE
    objection: >-
      The frontend now has copy for exactly TWO of the pack's 24 EXCLUDE reason codes
      (REQ_PARENTS_MARRIAGE_REGISTERED and this revision's new one); the other 22 still fall
      through to "Verified reason: <CODE>" on the no-path sheet. The SUPPORT exhaustiveness
      tripwire in engine-adapter.test.ts walks `effect.type === "SUPPORT"` only, so nothing
      fails when an EXCLUDE code has no copy — which is exactly why the gate had to catch
      this one by reading rather than by a red check. Deliberately NOT fixed here: writing
      22 legal sentences and extending the tripwire to EXCLUDE codes is a copy-deck task
      with its own review surface, not a line item inside a pack fold, and folding it in
      would break the one-PR-one-concern contract. Stated plainly so it is a known gap on
      the record and not a silence.
