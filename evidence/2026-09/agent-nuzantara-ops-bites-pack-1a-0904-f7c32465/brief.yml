task_id: bites-pack-1a-0904
gear: 3
l_level: L2
gate_class: opus
objective: >-
  Make the `Bites:` contract executable, and put it where a machine can read it without
  guessing.

  Rule 2 of the Builder Contract says every PR body carries a `Bites:` line naming the
  CONSUMER and the observation that proves the change is in force. Measured on 2026-09-04
  over the 177 PRs merged since 2026-09-01: 110 carry one (62%), and NOTHING reads any of
  them -- `grep -rlE Bites .github/workflows scripts/*.py scripts/ci/*.py
  infra/claude-hooks` returns zero files. Every verification contract in this repository
  is prose honoured by an LLM while the machine verifies only the diff.

  This is PR-1a of LANE H (docs/plans/2026-09-03-relaunch-lanes/LANE-H-bites-reconciler.md,
  Zero's mandate of 2026-09-04): the FORMAT, the PARSER and its security boundary. The
  lint that consumes it is 1b; the executor that runs the observation is PR-2 and is
  deliberately not here -- the boundary has to be reviewable with no runner near it.

  RULED 2026-09-04 (Zero, Legge 5): the contract moved OUT of the PR body and INTO the
  diff, as a top-level `bites:` mapping in the evidence pack's pack.yml. The body form
  required deciding which Markdown region a human SAW; three adversarial rounds closed
  five spellings of that one defect and the verdict gate found a sixth. A real YAML parser
  dissolves the class instead of guarding it.

  Gear 3 by PATH, deterministically: --print-floor returns 3 on this changed-file list
  (.github/workflows/immune-enforcement.yml).
appetite:
  wall_clock_hours: 3
  adversarial_rounds: 3 # exceeded: 6 rounds ran; see appetite_exceeded in pack.yml
constraints:
  - >-
    Every pack already on main stays green. A pack with no `bites:` key is `absent` and a
    prose one is `legacy`; both exit 0. Only a block that reached for the executable form
    and got it wrong is malformed. Making the executable form mandatory is Zero's decision
    (Legge 5), not a parser's.
  - >-
    The parser executes nothing. Trust -- author_association, fork-ness -- is the
    EXECUTOR's question, not the parser's, and keeping the split is what lets every guard
    be unit-tested with no network, no token and no runner.
  - >-
    Every allow-list entry is a full pair. `fly machine run`, `fly machine destroy` and
    `fly version upgrade` each hid behind a one-word check; NO_SUBCOMMAND and
    ANY_POSITIONAL name the two things a bare `None` was conflating.
  - >-
    No new required context on main, and this PR ships no workflow step that reads a PR
    body. The test joins the existing required `antidotes` battery; nothing about branch
    protection changes.
  - No paid API, no LLM in the reconciler at all. It needs none.
acceptance:
  - >-
    A1: `python3 scripts/ci/bites_parse.py --selftest` exits 0 over 118 guilt+innocence
    fixtures; a pack whose observe pipes to a shell exits 2; a pack with no `bites:` key
    returns {"absent": true}; this PR's own pack returns the four fields.
  - >-
    A2: `python3 infra/guard-conformance/check_guard_conformance.py` reports the new
    surface with 0 violations -- every guard censused in the module has a guilt AND an
    innocence proof resolvable by name in the test file.
  - >-
    A3: `test_immune_enforcement_trigger_symmetry` passes -- the new test is reachable by
    a sentinel path, not merely listed in a loop that skips absent files.
  - >-
    A4: two `bites:` blocks in one pack, a YAML alias, and a merge key are each malformed
    rather than last-wins -- the file form of "the reader saw one thing, the parser got
    another".
