cloud_ok: >-
  SYMBIOSIS Law 2 output boundary. Nothing client-bearing exists anywhere near this lane:
  the subject is a YAML parser and a CI battery. Every cross-family dispatch carried the
  parser's own rules and the file itself — no client identifier, no message body, no CRM
  row, no OSINT record, no credential. The credential-adjacent facts discussed (that
  actions/checkout persists a token into .git/config, that curl reads ~/.curlrc) are
  upstream public documentation, and they appear here as the REASON a shape is refused,
  never as a value.

pii_scan: clean
pii_scan_note: >-
  No path in this diff is PII-bearing and no prompt carried client data. The `${VAR:+SET}`
  discipline was not needed because no secret was read at any point.

dissent:
  - seat: claude-opus-5 (spalla-review, round 1)
    objection: >-
      "Three curl options the deny-list never named: `--json=@<path>` is documented as a
      shortcut for `--data` and takes the same `@filename` file-read syntax, so
      `--json=@.git/config` posts the checkout's persisted token to any https host;
      `--libcurl=<path>` writes a generated C file; `--etag-save=<path>` writes a file whose
      content the remote controls. And `~` is not a path escape: `git diff --no-index
      <checkout-file> ~/.netrc` prints a credentials file as diff lines."
    status: CONFIRMED
    resolution: >-
      All four verified by running the parser before fixing anything, and the fix is not
      four entries. curl's deny-list had already lost `-b`, `-w@`, `--netrc-file` and
      `--variable`; losing three more in one pass is Rule 8's under-specified surface, so
      curl's options became an ALLOW-LIST and git's sub-options with them. `~` joined `/`
      and `..` in _escapes_checkout, because every metacharacter this module refuses is
      inert unless the executor uses a shell — so the safe reading of the module's own
      design is that it does.
  - seat: kimi-code/k3
    objection: >-
      "`pytest --junitxml=<relative path>` writes an XML report anywhere in the checkout,
      including over a source file. `expect: regex:^(a+)+$` compiles fine and burns runner
      CPU exponentially. And 500 nested YAML sequences raise RecursionError, which is not a
      yaml.YAMLError: traceback, exit 1, no JSON."
    status: CONFIRMED
    resolution: >-
      All three applied. The pytest list banned what IMPORTS (`-p`, `-o`, `--override-ini`)
      and never asked what WRITES — the third list inverted for the same reason as the
      first two. The ReDoS cure is structural rather than a spelling: walk the compiled
      pattern and refuse a repeat containing a repeat OR an alternation, after measuring
      both (0.376s and 0.703s at 24 characters, quadrupling every two). The RecursionError
      one matters beyond its input: a parser whose failure mode is outside its own
      taxonomy hands every caller a fourth case to get wrong, and "the step failed" was
      fail-closed only by accident of how GitHub Actions reads an exit code.
  - seat: codex-gpt-5.6-sol
    objection: >-
      "Seventeen accepted forms that are not read-only. `gh --cache` writes a cache and
      `--web` opens a browser; `fly --config=<path>` reads the file it names; git's GLOBAL
      options are still a deny-list, so `--paginate` starts $PAGER and `--help` starts man;
      a `%G` format runs gpg.program; `pytest` with no target walks the tree, `-k tests`
      is read as a target, `@args.txt` expands into arguments, `-W` imports a module, and a
      symlinked directory satisfies a check for the literal segment `tests`. Plus three
      YAML fail-open classes: an invisible character in a KEY makes the whole block absent,
      a misspelled key makes it legacy, and `bites: []` is legacy too."
    status: CONFIRMED
    resolution: >-
      The largest single contribution here, and it settled the shape of the cure. Every
      option list is now an allow-list, git's GLOBAL list being EMPTY because an observation
      has never needed one; value-taking options must be written `--flag=value`, since a
      separate value is indistinguishable from a positional; no argument may open its value
      with `@`; every path is RESOLVED before it is judged, which closes the symlink and
      the non-existent target together; and `legacy` is now defined structurally — a block
      using NONE of where/observe/expect — so a misspelled key is a broken contract rather
      than prose. Two of the seventeen were declined as not fixable in a parser and written
      into the module as constraints PR-2 inherits: a sanitised git environment (external
      diff, textconv, core.fsmonitor, lazy-fetch and gpg.program all arrive through CONFIG,
      which no allow-list over argv can see) and `curl -q` (curl reads ~/.curlrc every
      invocation).
  - seat: claude-opus-5 (spalla-review, round 4, on the already-hardened file)
    objection: >-
      "Two escapes remain: `~otheruser/...` is a tilde form the guard does not see, and a
      `..` component glued after a colon survives a split on `/` — `git log -L 1,1:../secret`
      splits to ['1,1:..', 'secret'] and neither piece equals `..`. And inverting three
      option lists in one sitting broke real use: `--diff-filter=` (8 files in this repo),
      `--no-renames` (11), `--` as a pathspec separator, `-U<n>`, `-z`, `curl -m 5` (5
      files) and `-w '%{http_code}'` (the standard health check here) are all refused, and
      a URL whose query string contains `=@` is refused as a file read."
    status: CONFIRMED
    resolution: >-
      Applied in both directions, which is the point of having asked for the second one.
      The escapes: every tilde form is refused, and `..` is looked for after splitting on
      `[/:]` rather than `/`. The over-match: the seven refused idioms are allow-listed
      (each verified read-only against `git <sub> --help`), curl's value-taking options are
      consumed BY ARITY so `-m 5` and `-w '%{http_code}'` no longer count as a second URL,
      and the `@` rule skips anything containing `://`. `-w@<path>` stays refused, by the
      guard that judges the VALUE, so re-admitting the option did not reopen the hole it
      was removed for. A reviewer will not volunteer the over-match half unless asked for
      it by name, and three of the seven idioms were already broken when this round began.
  - seat: claude sonnet (independent receipt verifier, round 5)
    objection: >-
      "Four receipts are stated more strongly than their commands produce. Receipt 4's
      literal cmd has a one-character typo (`gear 3`, not a YAML mapping) and therefore
      produces the OPPOSITE classification from the one claimed. Receipt 10's cmd reaches
      52 of the 78 passes it claims; the other 26 arrive through prose. Receipt 1 claims a
      string no flag emits. Receipt 11 says 154 where the number is 157. And three numbers
      in the `diff:` prose (96-entry corpus, 110 tests, ~2,000 lines) contradict the
      pack's own receipts or nothing at all — the real figures are 104, 114 and 3,049."
    status: CONFIRMED
    resolution: >-
      Every one reproduced on this machine and fixed here, and the round is recorded
      because of what it is: a pack whose subject is the distance between a claim and an
      observation had four claims that did not survive being re-run. Receipt 4 is the one
      that matters — a typo turned a receipt into its own contradiction, and it read as
      evidence because nobody had re-executed the string as written.

      ONE OF THE FIVE WAS NOT MINE, and finding that out cost the same discipline. The
      verifier reported that a pre-existing registry line had been deleted, and so did
      `git diff origin/main` on my own machine. Measured from the MERGE-BASE, as this
      pack's own `diff:` field says to do, the registry edit is 157/0 and touches nothing:
      the line belongs to a commit that landed on main while this branch was open. Both of
      us had measured against a ref that moved (W102), and the correct answer was written
      three lines above the mistake. I re-added the line before checking, and
      guard-conformance immediately failed with "exempted file no longer exists" — the
      checker caught my correction, which is the second time in this PR that a gate has
      caught the author repairing something that was not broken.
  - seat: the test suite of this PR, applied to itself
    objection: >-
      An innocence test written in this very PR asserted that a zero-width character
      elsewhere in the pack was not penalised. That assertion WAS the hole: `bites<ZWSP>:`
      renders as `bites:` and parses as a different key, so the reviewer reads a contract
      and the parser reports `absent`, fail-open and silent.
    status: CONFIRMED
    resolution: >-
      The test is inverted and says so in its own docstring. Recorded because of what it
      shows about narrowness: guarding the four VALUES and proving the guard does not
      over-match elsewhere looked like the disciplined thing to do, and the proof of
      narrowness was itself the vulnerability. The rule is now the whole FILE, with a real
      innocence proof beside it (ordinary non-ASCII — an em-dash, an accent — is not
      penalised), because the rule to state is "invisible characters", not "non-ASCII".
  - seat: kimi-code/k3
    objection: >-
      "A pull request can add a script carrying the `bites-observable` marker in the same
      diff. The marker is only as strong as the review of the diff that adds it."
    status: CONFIRMED
    resolution: >-
      Confirmed as a real limit and DECLINED as a code change, because it is not fixable in
      a parser: any marker a diff can add, a diff can add. It is answered by a CONSTRAINT
      ON THE EXECUTOR, written into the module's docstring so PR-2 inherits it in writing:
      observations run POST-MERGE ONLY, when the marked script is reviewed, merged code.
      The same argument covers `python3 -m pytest`, which imports whatever conftest.py the
      branch carries. Recorded rather than quietly noted, because a constraint that lives
      only in a reviewer's head is the class of promise this lane exists to abolish.
