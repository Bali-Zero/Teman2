    cmd: python3 -m pytest scripts/tests/test_immune_enforcement_trigger_symmetry.py scripts/tests/test_lint_trigger_symmetry.py -q
    result: "26 passed"
    exit: 0
    ts: "2026-09-04T20:55+08:00"
    seat: session (Pro)
  - claim: >-
