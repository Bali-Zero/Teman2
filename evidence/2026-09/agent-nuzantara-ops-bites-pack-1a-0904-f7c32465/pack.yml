brief_ref: evidence/brief.yml
brief_ref_note: >-
  The literal path is required: harness-floor.yml stages the brief to
  /tmp/evidence-check/evidence/brief.yml and lints with --repo-root /tmp/evidence-check, so a
  per-task path here does not resolve in CI. The real brief for this task is the sibling
  brief.yml in this directory.
plan_ref: >-
  docs/plans/2026-09-03-relaunch-lanes/LANE-H-bites-reconciler.md, PR-1a of the lane's four.
  Zero's mandate of 2026-09-04, and his RULED decision of the same day that moved the
  contract out of the PR body and into this file.

bites:
  consumer: >-
    the required `antidotes` job in .github/workflows/immune-enforcement.yml, which now runs
    scripts/tests/test_bites_parse.py, plus infra/guard-conformance, which censuses this
    module's guards by AST and fails on any without both proofs
  where: ci
  observe: python3 scripts/ci/bites_parse.py --selftest
  expect: regex:[0-9]{3}/[0-9]{3} pass

bites_note: >-
  THE FIRST ONE. This is the format's own first instance, and it is deliberately the
  weaker half of the observation: --selftest proves the corpus, and the test file plus
  the registry entry prove the consumer. `regex:[0-9]{3}/[0-9]{3} pass` rather than `exit0` so that
  silently emptying the corpus fails the observation instead of passing it. Three digits
  rather than the literal count on purpose: pinning `104/104` would make every fixture
  added afterwards a red observation, which is a ratchet, while the shape still goes red
  if the corpus ever drops back below a hundred — an
  observation that cannot fail when its subject is deleted is the disease this lane
  exists to cure, and PR-1's first draft had it.

lanes:
  - lane: bites-pack-build
    role: build
    seat: >-
      claude-opus-5 xhigh (conducting session, Pro) — carried the seven guards, the corpus
      and the tests over from the suspended #5661, deleted the Markdown-visibility layer
      (~275 lines), wrote the YAML layer and its strict loader, and disposed every refuter
      finding by re-running it on disk before applying it. ONE lane, THREE review rounds
      folded in on the same branch; each round is a journal entry and a dissent block.
  - lane: bites-pack-refute-1
    role: review
    seat: >-
      claude-opus-5 via spalla-review (same family, dispatched on the threat model rather
      than on a conclusion). Not counted toward council quorum — same family as the author
      — and recorded because three of its four findings were real and verified.
  - lane: bites-pack-refute-2
    role: review
    seat: >-
      kimi-code/k3 (cross-family) — dispatched on the file as it stood, and found the
      class the first round had not: the pytest option list banned what IMPORTS and never
      considered what WRITES, and `expect: regex:` compiled a pattern without asking what
      it costs to run.
  - lane: bites-pack-refute-3
    role: review
    seat: >-
      codex-gpt-5.6-sol, read-only sandbox, xhigh (cross-family) — its first dispatch was
      REFUSED by the vendor's cyber filter and produced nothing; that run is journaled as
      not-run rather than counted as agreement (it is a journal line and not a dissent
      block, because a seat that never ran raised no objection to confirm — the refusal
      arrived as an ERROR line after a completed tool loop and exit 0, which is exactly
      the shape that reads as a clean review if nobody opens the body). Reframed as a completeness review of a
      validator, it returned seventeen accepted-but-not-read-only forms and the three
      YAML fail-open classes, which is the largest single contribution in this pack.

seat_diversity: satisfied
