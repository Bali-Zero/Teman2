    cmd: git diff --name-only $(git merge-base HEAD origin/main) > /tmp/cf.txt && python3 scripts/evidence_pack_lint.py --print-floor --changed-files-file /tmp/cf.txt && python3 scripts/evidence_pack_lint.py --print-floor-source --changed-files-file /tmp/cf.txt
    result: "3 then path (two separate print() calls, two flags — no single flag emits both)"
    exit: 0
    ts: "2026-09-04T20:40+08:00"
    seat: session (Pro)
  - claim: >-
      A1. The guilt+innocence corpus passes, and it is the observation this pack's own
      `bites:` block names.
    cmd: python3 scripts/ci/bites_parse.py --selftest
    result: "bites_parse selftest: 104/104 pass (guilt + innocence)"
    exit: 0
    ts: "2026-09-04T20:52+08:00"
    seat: session (Pro)
  - claim: A1. The full battery for this surface.
    cmd: python3 -m pytest scripts/tests/test_bites_parse.py -q
    result: "114 passed"
    exit: 0
    ts: "2026-09-04T20:52+08:00"
    seat: session (Pro)
  - claim: >-
      A1. A pack with no `bites:` key is `absent` and exits 0; a pack whose observe pipes
      to a shell exits 2. The asymmetry the migration depends on is real, not asserted.
    cmd: >-
      printf 'gear: 3\n' | python3 scripts/ci/bites_parse.py --pack - ; then the
      pipe-to-shell fixture through the same CLI
    result: '{"absent": true} at exit 0, and {"malformed": true} at exit 2 for the pipe'
    exit: 0
    ts: "2026-09-04T20:20+08:00"
    seat: session (Pro)
  - claim: >-
      A2. Every censused guard has a guilt AND an innocence proof resolvable by name, with
      no phantom references. The checker earned its place here: it caught a phantom
