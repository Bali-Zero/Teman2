    seat: session (Pro)
  - claim: >-
      ROUND 3. The seventeen accepted-but-not-read-only forms codex named are refused, and
      the six shapes a real observation needs still pass. Both directions, measured.
    cmd: python3 -c "<_COMMAND_GUARDS over the 17 guilt and 6 innocence commands>"
