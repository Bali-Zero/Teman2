council_run: journal.jsonl

diff: >-
  Measured from the merge-base, never two-dot (W102):
  `git diff --numstat $(git merge-base HEAD origin/main)`. Run it rather than trusting a
  figure written into a file that is itself part of the diff.

  SHAPE. One new module (scripts/ci/bites_parse.py: nine guards, a YAML layer with a strict
  loader, a 104-entry guilt+innocence corpus, a --selftest that needs no network and no
  token), one new test file (114 tests), one registry surface naming every guard's proofs,
  four small edits to the conformance checker's dispatch, three lines added to
  immune-enforcement.yml, and one corrected block in the lane brief.

  SIZE, stated rather than hidden: 3,049 added lines from the merge-base, of which 2,677
  outside this evidence directory, against the contract's ~400. It is one
  concern — the format and the boundary that makes it safe to execute — and the bulk is
  proofs: 104 corpus fixtures and 114 tests for nine guards. Splitting the guards from their
  evidence would land a validator with nothing showing that it validates. The ceiling rule
  is not engaged (the floor is 3 by path, from the workflow edit), so this is a disclosure,
  not an override.

receipts:
