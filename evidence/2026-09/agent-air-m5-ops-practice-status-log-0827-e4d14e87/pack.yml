dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      BLOCKER — the trigger aborts the caller's UPDATE. `new_status` was declared NOT NULL while
      PROD's `practices.status` is nullable, so `UPDATE practices SET status = NULL` entered the
      trigger, violated the constraint, and rolled back the whole transaction — including migration
      075's trigger effects. This contradicted the migration's own comment, three lines above, that
      "history must never be able to block the transition it records".
    status: CONFIRMED
    resolution: >-
      Reproduced before accepting, on a prod-shaped throwaway database: after `UPDATE ... SET
      status = NULL`, the row still read `status=inquiry` — the transition was vetoed. `new_status`
      is now nullable, a convergence ALTER carries that to databases holding an earlier shape, and
      the live test drives BOTH NULL directions and asserts the UPDATE commits.
  - seat: codex-gpt-5.6-sol
    objection: >-
      BLOCKER — the ROLLBACK section is a no-op the runner reports as success. All three DROP
      statements were commented out, so the runner executes a comments-only string, deletes the
      version row, and leaves table, function and trigger installed. The accompanying assertion
      `assert rollback is not None` passes on that string, so the suite could never catch it.
    status: CONFIRMED
    resolution: >-
      Verified via the repo's own `split_migration_sql`: the section returned 165 characters and
      ZERO executable lines. Statements uncommented; the test now asserts executable statements and
      names DROP TRIGGER / DROP FUNCTION / DROP TABLE specifically.
  - seat: codex-gpt-5.6-sol
    objection: >-
      SHOULD-FIX — `DEFAULT NOW()` is TRANSACTION-START time while the reader does
      `ORDER BY changed_at ASC` and treats the last row as current. Two concurrent transitions on
      one practice can therefore be recorded in the reverse of their commit order, showing the
      timeline out of sequence and marking the wrong step current.
    status: CONFIRMED
    resolution: "Changed to clock_timestamp() in both the CREATE and a convergence ALTER."
  - seat: codex-gpt-5.6-sol
    objection: >-
      SHOULD-FIX — the NULL test does not constrain what it names. On a database where the column
      is NOT NULL it always took the `pytest.raises` arm and returned, so the trigger was never
      driven with `OLD.status IS NULL`; replacing IS DISTINCT FROM with `<>` would leave it green.
    status: CONFIRMED
    resolution: >-
      Confirmed by mutation, not by agreement. The test now makes the database prod-shaped inside
      its own transaction (`ALTER TABLE ... DROP NOT NULL`, transactional in Postgres, undone by the
      rollback) instead of branching, and the `<>` mutation is now KILLED by that test.
  - seat: codex-gpt-5.6-sol
    objection: >-
      SHOULD-FIX — the test named "..._is_logged_not_swallowed" asserts `len(steps) == 1`, i.e. it
      asserts the swallowing. `asyncpg.PostgresError` also covers QueryCanceledError and
      UndefinedColumnError, so a timeout or a schema drift still renders as a synthetic one-step 200.
    status: CONFIRMED
    resolution: >-
      The name overclaimed and is corrected to `..._still_degrades_but_is_no_longer_SILENT`. The
      degradation is deliberate and unchanged — a client asking about their own practice should not
      get a 500 because history is unavailable — and the docstring now names the classes that share
      that path. Surfacing any of them to the client is a product decision, not made here.
  - seat: session (self, on its own mutation battery)
    objection: >-
      The mutation battery had a BLIND SPOT the refuter's findings exposed: `CREATE TABLE IF NOT
      EXISTS` is a no-op against a database that already holds the table, so mutating the CREATE
      clause changes the FILE without changing the SCHEMA and every executing test stays green.
      Restoring the NOT NULL blocker and removing the convergence ALTER left the live suite at
      7 passed — a real defect, invisible to execution.
    status: CONFIRMED
    resolution: >-
      Closed with a deliberately weaker instrument that names its own weakness:
      `test_the_migration_declares_the_shape_its_execution_cannot_prove` pins both properties in the
      SQL TEXT. M5 and M6 are now killed by it. Disclosed rather than presented as full coverage —
      only a fresh database proves these by execution, and the suite does not control that.
  - seat: codex-gpt-5.6-sol (round 2, fresh context, on the fixed SHA)
    objection: >-
      BLOCKER — making the NULL transition RECORDABLE made it REACHABLE, and the reader crashes on
      it. `STATUS_LABELS.get(status, status.replace("_", " ").title())` evaluates the dict.get
      DEFAULT eagerly, so a NULL status raises AttributeError before the lookup ever happens.
    status: CONFIRMED
    resolution: >-
      Confirmed AND RESCOPED by measurement: the FALLBACK path crashes on the same input, and that
      is the path production takes TODAY — so this is a LIVE 500 on the client tracker for any
      practice with a NULL status, not a defect 310 introduced. 310 only makes a second path reach
      it. Fixed here anyway, because shipping 310 without it would widen a live crash: a NULL-safe
      `_status_label` helper, with tests proving BOTH paths raised before the fix.
  - seat: codex-gpt-5.6-sol (round 2)
    objection: >-
      SHOULD-FIX — the source-level convergence guard is satisfied by COMMENTED-OUT ALTERs. Both
      assertions are bare substring checks, so prefixing the statements with `--` leaves them green,
      which is exactly the no-op-rollback defect the guard was written to prevent.
    status: CONFIRMED
    resolution: >-
      Correct, and it is this repo's scar family #3 committed by the very guard written to close a
      neighbouring blind spot. The guard now strips comment lines from the forward SQL before
      asserting, and BOTH directions are proven: commenting the ALTERs turns it RED (rc=1), the
      unmutated file passes with 398 green.
  - seat: codex-gpt-5.6-sol (round 2)
    objection: >-
      SHOULD-FIX — the history path renders a TERMINAL status as active: after `on_process ->
      completed` the last step carries `completed=False, is_current=True`, so the client shows a
      spinning loader on finished work. The fallback path, ten lines below, gets the same practice
      right — the two paths disagree about the same practice.
    status: CONFIRMED
    resolution: >-
      Fixed — a terminal status is never current, and the two paths now agree. Reachable only
      because 310 makes the history path run at all, so it belongs to this diff. Guilt AND innocence
      tested: a non-terminal last step is still current.
  - seat: codex-gpt-5.6-sol (round 2)
    objection: >-
      SHOULD-FIX — the fixture applies 310 PERMANENTLY, outside any transaction, and the db-test
      configuration permits pointing TEST_DATABASE_URL at a tunnel. A mistyped DSN is the whole
      distance between a test run and unreviewed DDL on a real database.
    status: CONFIRMED
    resolution: >-
      Fixture now refuses when the database name matches nuzantara_rag/prod/production. Guilt
      proven: with TEST_DATABASE_URL pointed at nuzantara_rag the suite fails with "refusing to
      apply migration DDL to database 'nuzantara_rag'"; innocence proven on the normal DSN.
  - seat: codex-gpt-5.6-sol (round 2)
    objection: >-
      BLOCKER — rollback followed by reapply silently leaves the migration ABSENT while both ledgers
      report it applied. The runner's rollback deletes from `_schema_versions`
      (migration_manager.py:257) but `_is_applied` reads `schema_migrations`
      (migration_base.py:365), so a reapply finds the surviving canonical row, skips the SQL, and
      recreates only the secondary entry.
    status: CONFIRMED
    resolution: >-
      SUPERSEDED 2026-09-11: this resolution said "the two cited lines were re-read this turn and
      say exactly what the objection claims". They no longer do — `rollback_migration`
      (migration_manager.py:318-404) deletes from BOTH ledgers and `_is_applied` sits at
      migration_base.py:644-648, not :365. The runner defect was FIXED on main, so 310's rollback
      needs no hand-patch. The objection was true when raised and is now moot. Curing it inside a migration file would be the wrong
      layer and a far larger blast radius than this PR's concern. Reported as a separate finding;
      310's own rollback statements are executable and correctly ordered. An independent seat was
      asked to establish the precise CONDITION under which the two ledgers actually meet (both
      paths reachable from the same runner) rather than to agree with the claim.
  - seat: codex-gpt-5.6-sol (round 2)
    objection: >-
      BLOCKER — the convergence ALTERs converge only two attributes. A pre-existing table with the
      right column names but no sequence/default on `id`, or missing the PK or the FK, survives
      migration 310 unchanged, and the trigger's INSERT then aborts caller transactions — the very
      failure mode round 1 closed.
    status: PLAUSIBLE
    resolution: >-
      The mechanism is real and the counterexample is sound. NOT FIXED, and the reason is scope
      rather than disagreement: 310 has never shipped, so no database can hold a partial earlier
      shape except one a developer hand-built. Full catalog convergence (or a fail-loud shape
      assertion) is the right long-term answer and is out of scope for the PR that creates the
      table. DISCLOSED here rather than closed, so the next person meets it as a known limit and not
      as a surprise.
  - seat: codex-gpt-5.6-sol (round 3, fresh context, xhigh, on the round-2 fixes)
    objection: >-
      BLOCKER — the round-2 NULL fix is at the WRONG LAYER. `ProcessStepState` in
      apps/mouth/src/lib/schemas/process.ts is a CLOSED `z.enum`, and both `ProcessStep.status` and
      `ProcessTimelineData.current_status` are non-nullable members of it. A NULL (or any
      out-of-enum) status makes Zod reject the ENTIRE response, so the portal shows "Unable to load
      the timeline". Making `_status_label` NULL-safe only moves the failure from a 500 to a schema
      rejection; the user sees the same broken screen.
    status: CONFIRMED
    resolution: >-
      Verified by reading the schema this turn, not by agreeing: `ProcessStepState` is a `z.enum`
      of 12 members and neither field is `.nullable()`. The round-2 correction is therefore
      insufficient rather than wrong. This is the finding that triggers Agent PR Contract rule 8 —
      a fix-of-a-fix that is itself incomplete means the surface is under-specified. PR SUSPENDED;
      spec written at docs/specs/practice-timeline-semantics-v1.md, Q1.
  - seat: codex-gpt-5.6-sol (round 3)
    objection: >-
      BLOCKER — no baseline. The trigger is `AFTER UPDATE OF status` only, so a practice's FIRST
      status is never recorded; after the first transition the timeline shows only the destination
      and the starting point is gone. The reader SELECTs `old_status` and then ignores it.
    status: CONFIRMED
    resolution: >-
      Verified: `grep -n old_status` on the router returns exactly ONE line (:119, the SELECT) — the
      column is written, fetched, and discarded. Also correct that the SQL comment at
      310_practice_status_log.sql:75 is false as written: for a pre-existing practice the trigger
      records OLD.status, not NULL. Not fixed — whether the timeline should show where a practice
      STARTED is a modelling decision. Spec Q3.
  - seat: codex-gpt-5.6-sol (round 3)
    objection: >-
      SHOULD-FIX — a REGRESSION the narrowing itself introduced: `asyncpg.InterfaceError` does not
      descend from `PostgresError`, so a connection dropped between `fetchrow()` and `fetch()`
      escapes both handlers and reaches the client as a 500, where the bare `except Exception` this
      replaced degraded to a 200.
    status: CONFIRMED
    resolution: >-
      Measured, not assumed — `issubclass(asyncpg.InterfaceError, asyncpg.PostgresError)` is False
      and its MRO is InterfaceError -> InterfaceMessage -> Exception. This one is FIXED here even
      though the PR is suspended, because it needs no product decision: it restores behaviour the
      diff had removed. Guilt proven (dropping InterfaceError from the handler tuple turns exactly
      the new test RED, the neighbouring PostgresError test stays green); innocence proven
      (415 collected, 400 passed, 15 skipped, rc=0).
  - seat: codex-gpt-5.6-sol (round 3)
    objection: >-
      SHOULD-FIX ×3 — (a) `ORDER BY changed_at ASC` alone is non-deterministic on ties, needs
      `, id`; (b) the current status and the history are read in two separate statements with no
      shared snapshot, so a concurrent commit yields a payload whose current_status matches no step;
      (c) `cancelled` renders `completed=true` on the history path and `completed=false` on the
      fallback — the same practice, two answers, depending only on whether the table exists.
    status: CONFIRMED
    resolution: >-
      All three confirmed by reading both paths. (c) is the one that touches real rows: production
      holds 124 cancelled practices out of 893, so applying 310 would silently flip 124
      client-visible practices from a grey circle to a green checkmark. Which of the two is CORRECT
      is not a bug question — a cancelled practice is finished but not achieved, and the step model
      has only two booleans. Spec Q2 and Q4.
  - seat: session (m5), REFUTING a round-3 finding rather than accepting it
    objection: >-
      The reviewer graded SHOULD-FIX that `VARCHAR(64)` on the audit columns can still abort the
      observed UPDATE — the R1 mechanism surviving via a second domain mismatch — citing
      scripts/qa/portal_qa_schema.sql:102, which permits 100 characters.
    status: RETRACTED
    resolution: >-
      REFUTED against production. `information_schema.columns` reports `practices.status` as
      `character varying(50)` — NARROWER than the audit columns' 64 — so any value that fits the
      source always fits the audit and the trigger cannot abort on width. The reviewer had measured
      a QA FIXTURE, not the live schema, and said plainly that it could not reach production; the
      honest disclosure is what made the gap cheap to close. Residual, non-blocking: the audit width
      is wider by coincidence rather than derived from the source width. Recorded in the spec under
      "What is NOT wrong" so it is not re-litigated in round 4.
  - seat: session (m5), correcting its OWN earlier report to the owner
    objection: >-
      This session told the owner "the crash is already live in production today" about the NULL
      status path. That claim was never measured.
    status: RETRACTED
    resolution: >-
      FALSE, and corrected in the same turn it was checked. Production holds 893 practices and
      `count(*) FILTER (WHERE status IS NULL)` is ZERO; the six statuses actually present
      (completed 669, cancelled 124, on_process 68, sending_invoice 17, inquiry 8,
      waiting_documents 7) are all inside the frontend enum. The NULL path is REACHABLE — the column
      is nullable with no CHECK — but nothing exercises it. It is latent, not live, which moves it
      from incident to hygiene. Recorded rather than quietly dropped because the owner acted on the
      stronger claim.
  - seat: kimi-code/k3 (round 2026-09-11, council re-run)
    objection: >-
      BLOCKER — the two paths STILL disagree, for `cancelled`. The history path answers
      `completed=True` (a filled tick) and the fallback path `completed=False` (a grey circle) for
      the same practice, so applying 310 changes how 124 of 893 real rows render with no frontend
      change and no test going red. The previous round fixed the disagreement for
      `completed`/`approved` only, and `TestATerminalStatusIsNeverRenderedAsInProgress` covers
      neither `cancelled` nor the fallback path.
    status: CONFIRMED
    resolution: >-
      Confirmed on disk before accepting, and it required an OWNER decision, not a code choice:
      what a client should see for a cancelled case is Q2 of the spec this diff ships, assigned to
      `operator[business]`. RULED 2026-09-11 (Zero, asked with both renderings side by side): a
      cancelled practice is CLOSED but did not SUCCEED — `completed=True, is_current=False`, told
      apart from a success by its STATUS, which `stateColors.ts` already maps to `danger`. Both
      branches now call one `_step_flags()` helper. Guilt proven: reverting it fails the new parity
      test on `cancelled` ONLY, printing both renderings; 19 passed with the cure.
  - seat: codex-gpt-5.6-sol (round 2026-09-11, council re-run)
    objection: >-
      BLOCKER — the db-test fixture's guard judges a SUBSTRING of the DSN, not the database. A
      `/nuzantara%5Frag` tail carries no `nuzantara_rag` substring and passes, while asyncpg
      percent-decodes it and connects to exactly that database; the fixture then applies migration
      DDL there permanently, outside any transaction.
    status: CONFIRMED
    resolution: >-
      This repo's scar family #3 (guard-over-match) in its pure form, on a guard added in an earlier
      round of this same PR. The fixture now asks the SERVER — `SELECT current_database()` on the
      established connection — before any DDL runs; the text check is kept only because it can
      refuse before a socket is opened. The second seat independently reproduced both halves: the
      encoded tail evades the text check and is caught by the server-reported name.
  - seat: codex-gpt-5.6-sol (round 2026-09-11, round 2 of the re-run)
    objection: >-
      BLOCKER — the new parity test admits a SHARED error: it compares the two branches without
      asserting what the answer should BE, so a helper returning a constant `(True, False)` passes
      every case. Reproduced: removing `approved` from TERMINAL_STATUSES left the file at 19 passed
      while `approved` rendered as still in progress. Separately, `[ \t]+` normalisation leaves
      NEWLINES intact, so `new_status VARCHAR(64)\nNOT NULL` evades the shape guard while a correct
      ALTER merely wrapped onto two lines is rejected — over-match and under-match at once.
    status: CONFIRMED
    resolution: >-
      Both correct and both cured, each verified with the seat's OWN mutation. The parity test now
      carries the expected pair per status and asserts it against EACH branch separately: the
      `approved` mutation fails with "history path answers (False, True) for 'approved', expected
      (True, False)". The guard uses `\s+`: the newline-split defect fails with "new_status must be
      NULLABLE", and a correctly wrapped ALTER passes. Round 3 verdict from the same seat: OK.
