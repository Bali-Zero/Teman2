    New table + trigger, APPLIED TO PRODUCTION BY THE MERGE — `fly.toml:15` runs `migrate apply-all`
    as the release_command, so there is no operator step in between. Reader changes: a non-Postgres
    exception now PROPAGATES where it was swallowed; both degraded paths log; and `cancelled` becomes
