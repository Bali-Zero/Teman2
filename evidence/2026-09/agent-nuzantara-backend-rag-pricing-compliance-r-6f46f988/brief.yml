task_id: pricing-compliance-retainers
gear: 1
l_level: L2
gate_class: opus
objective: >-
  Add a `compliance_retainers` category to the official price sheet
  (apps/backend-rag/backend/data/bali_zero_official_prices_2026.json) with five exact-key rows:
  compliance_takeover, compliance_core_retainer_monthly, compliance_employer_retainer_monthly,
  pse_registration_fixed, pmse_vat_assessment. Amounts are the roundtable's TEST prices in IDR,
  transcribed from the lane design, pending owner confirmation. The unlisted compliance page
  (W1 PR 2) renders them through GET /api/pricing/service?key=<key> or the mouth snapshot, never
  as literals. Gear 1 is the computed floor: compute_floor() = 1, compute_floor_source() = none
  (no hot-zone path; the test lives under backend/tests, not backend/services/pricing; far below
  the size threshold). The imperator may raise it; this brief does not lower anything.
constraints:
  - Existing entry schema only (name, price, tier_range, duration, validity, notes, description_en,
    icon_id). The schema has no published/test flag, so none is invented; the test-price marker and
    the USD reference travel in `notes`.
  - Price literals only in the SSOT sheet, the rendered MD price list and the generated mouth
    snapshot (regenerated by scripts/sync_frontend_prices.py, never hand-edited). Tests compare the
    route against the sheet file and type no amount.
  - No service or router code change; the flat catalogue walk already resolves a new category.
  - icon_id values reuse existing assets in docs/pricing/assets/2026/icons, so no new asset is needed.
  - No PII, no fly.toml, no .env, no lockfile, no paid endpoint.
acceptance:
  - text: >-
      WHEN GET /api/pricing/service is called with each of the five keys it SHALL return 200 with
      category compliance_retainers and the sheet's exact price string, in the EXACT_IDR_PRICE shape
      the mouth snapshot helper renders; the two monthly rows SHALL carry validity monthly and every
      row SHALL carry the USD reference and the test-price marker in notes.
    probe: pytest backend/tests -k pricing (from apps/backend-rag; 501 passed, 1 skipped, exit 0)
  - text: The sheet SHALL stay valid JSON and pass the price-list schema validator.
    probe: >-
      python3 -c "import json;json.load(open('backend/data/bali_zero_official_prices_2026.json'))"
      (exit 0); pytest scripts/pricelist_2026/tests/test_schema.py (12 passed)
  - text: The generated mouth snapshot SHALL be in parity with the sheet (118 exact rows).
    probe: >-
      python3 scripts/sync_frontend_prices.py --check (exit 0); npx vitest run
      src/lib/pricing-snapshot.test.ts src/lib/bali-zero-prices.test.ts (15 passed)
  - text: >-
      The five new keys SHALL be unique across the catalogue, leaving the four known tax_accounting
      collisions as the only ambiguous keys (unambiguous count 105 -> 110).
    probe: backend/tests/services/pricing/test_pricing_service_key_collision.py
  - text: Other tests that read the sheet SHALL stay green.
    probe: >-
      pytest test_data_invariant_tripwires, test_whatsapp_context_builder, test_zantara_tools,
      test_revenue_estimator, test_renewal_rules, test_seq11_pack, test_e33_forbidden_claims,
      test_abstain_bypass_policy, test_whatsapp_persona_no_hardcoded_pricing (400 passed)
consumer_map:
  - "W1 PR 2: the unlisted compliance page in apps/mouth renders the five prices from
    /api/pricing/service?key=<key> or getExactSnapshotPrice('compliance_retainers', <key>)."
  - "The founder's sales call reads the same rows through the public route after deploy."
  - "docs/pricing/Bali_Zero_Price_List_2026.md gains section X, Compliance Retainers."
  - "Not a consumer, checked: apps/mouth services_data.ts only lists the six visa categories, so no
    public service card picks up the new category."
risks:
  - "The rows are live on the public exact-key route and on the authenticated /api/pricing/search
    and bot search path as soon as this deploys, marked only by the notes text. A client asking the
    bot about compliance could be quoted a test price along with its 'test price' note."
  - "scripts/pricelist_2026/generate.py SECTION_META has no compliance_retainers entry, so the
    printed PDF leaves the section out (acceptable while prices are unconfirmed), and a future MD
    regeneration would drop section X until SECTION_META gains it."
  - "metadata.last_updated is deliberately not bumped: GARUDA's catalogue freshness reads it and
    no existing row was re-verified."
  - "pytest -q is refused by the repo's verbosity guard (pytest.ini already sets -q); the suite ran
    without the extra flag. test_generate.py needs qrcode, which the Pro venv lacks (existing
    environment gap, not caused by this diff)."
  - "ruff format reports three existing hunks in test_public_pricing_lookup.py (same on
    origin/main); the added lines are clean and nothing else was reformatted."
grader: >-
  The final on-disk gate is a fresh Opus 5 session commissioned by the imperator; the Dux does
  not post harness/fable-gate.
budget: Existing subscription only; no paid API calls.
pii: none
