task_id: vo-c1e-browser-state-fence
gear: 2
base_sha: a787b7d5e3
objective: >-
  Slice C1e (MANDATE-vo.md, R-SUSPEND-C1b option 1): replace the parser-based
  Visa Oracle outcome-state colour fence — suspended after three gate reds
  (#6833, #6845, #6855; #6820 PASSED and stays in force, untouched) — with a
  Playwright spec that appends the product's own
  `.oracle-verdict-chip[data-state]` markup into a live, unmodified
  `.oracle-root` and lets a real Chromium resolve the cascade via
  `getComputedStyle`, across the six real rendering contexts the product
  supports (light/dark hydrated, dark system-preference, two pre-hydration
  cascade states, defensive prefers-contrast), plus a floor guard, the S1-S16
  permanent regression matrix pinning each historical leak, and a rendered
  weld (V9) proving the injection technique matches the product's own render.
  Cured after vo-gate-c1e's REWORK-BUILD on #6924
  (kit/CURE-SPEC-c1e-OBS-1.md): distinctness/the floor now compare a
  PAINTED `[r,g,b,a]` canvas byte tuple instead of the engine's serialised
  colour string, closing OBS-1 (HIGH — CSS Color 4's `color()`/`oklch()`/
  `color-mix()` preserve their own space instead of canonicalising to
  `rgb()`), OBS-2/OBS-3 (the floor's alpha regex both missed and
  false-fired; foreground axis unchecked) and OBS-4 (no guilt case ever
  collided a non-adjacent STATES pair).

constraints:
  - "One new file only: apps/mouth/e2e/visa-oracle-state-colours.spec.ts. oracle.css untouched; the merged C1 fence oracle-state-tokens.test.ts (#6820) untouched and not deleted; no workflow change, no package.json/lockfile change, no new dependency, no new Playwright config."
  - "Ships as ONE file per conductor ruling R-SIZE-C1e (MANDATE-vo.md, 2026-09-20 06:22Z): the S1-S16 guilt matrix is the instrument's guilt side, not a separable concern — splitting it would leave a fence with no in-suite proof it can go red, the exact failure class R-SIZE-C1e names."
  - "No file mutation for the guilt cases: every hostile CSS mutation is a string passed to page.addStyleTag inside the suite itself, permanent and CI-enforced — never a copy/restore of oracle.css."
  - "V9's weld reaches the verdict surface only through the pattern e2e/visa-oracle-process.spec.ts:25,102 already uses (flowReducer replay + addInitScript resume seed + route-mocked evaluate) copied inline into the new file; never readFileSync+regex, never an import from another *.spec.ts, no new scaffolding exported out of visa-oracle-v2.spec.ts."

appetite: { wall_clock_hours: 1 }

