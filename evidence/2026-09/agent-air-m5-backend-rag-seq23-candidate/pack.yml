dissent:
  - seat: kimi-code/k3
    objection: >-
      BRIDGING adverse-history: 8 of the 10 review-gate/* held walks now resolve to
      SUPPORTED_CANDIDATES because hf.bridging.adverse-history is PRODUCTS-scoped (BRIDGING
      only, copied verbatim from the donor, never GLOBAL) while the retired REQUIRE_REVIEW
      stage's precedence outranked SUPPORTED unconditionally regardless of scope. Post-fold, a
      DEPORTATION/BLACKLIST-history applicant with non-BRIDGING candidates gets those candidates
      with no human ever seeing the disclosed history — the pack never gated other products on
      it, but the practical effect in seq-22 was that a human always saw it via the walk-level
      hold. Not a code defect (the fold implements the disposition table faithfully and the
      donor was already PRODUCTS-scoped), but a real behavioral delta with policy weight.
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: >-
      The census-test rewrite (D-census-test-debt) drops the equality form's ability to catch a
      TENTH product becoming engine-reachable in the candidate beyond the nine seq-21 named.
      Argued non-blocking because this fold inserts only EXCLUDE-effect rules, which cannot
      create new reachability, and assert_only_expected_changes already pins the entire ruleset
      — but the coverage loss is real for a FUTURE fold that adds a SUPPORT rule, and a tighter
      form (`set(candidate_engine_named) == set(engine_named)` for a fold that adds nothing) was
      not adopted here.
    status: PLAUSIBLE
  - seat: kimi-code/k3
    objection: >-
      Applicant-facing copy for the 11 new reason codes / explain.* keys is not part of this
      PR and is downstream mouth-layer work (Slice A8-2) — flagged so activation (A9) does not
      proceed assuming copy already exists.
    status: CONFIRMED
