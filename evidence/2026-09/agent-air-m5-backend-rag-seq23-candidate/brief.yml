objective: >-
  Fold seq-23 DIRECTLY from the signed seq-22 anchor (previous_payload_sha256
  3d7555afcc9496b451bc86235624b4a88d35aabb9df354778dcf9b0b3b276e37, verified via the public
  production trust store's assert_anchor_is_a_verified_signed_artifact, never taken on the
  digest constant alone). Retires 8 REQUIRE_REVIEW rules (calling-visa, citizenship-conflict,
  active-overstay, minor-without-guardian, bridging.adverse-history, e33.work-rangkap-kegiatan,
  e33g.local-market, e33g.local-company-ownership) and replaces each with an hf.* HARD_FILTER/
  EXCLUDE rule that names the same fact pattern as a dead end (on_unknown NEEDS_INPUT). Inserts
  3 further hf.* rules with no review.* predecessor (hf.study.admission-or-sponsor-unconfirmed,
  hf.e33e/f.retirement-income-below-minimum), each the negation of the SUPPORT rule it
  shadows, on_unknown NO_EFFECT so an unknown fact stays with the donor SUPPORT rule's own
  NEEDS_INPUT. Modifies 4 existing HARD_FILTER rules' on_unknown only (HUMAN_REVIEW ->
  NEEDS_INPUT): hf.bridging.{offshore,from-visit-itk,to-bridging}, hf.b1.not-voa-nationality.
  Brings review.e33.below-threshold-studio (D23 "OPTION B-STUDIO") forward byte-identical — it
  stays the one HUMAN_REVIEW-stage rule in the candidate pack (A8.4's derived inventory:
  pack_review_rules == 1, pack_unknown_escalations == 0). UNSIGNED, UNACTIVATED throughout —
  the runtime keeps serving the DB-active pack (evaluate_path.py:1919-1945); this PR never
  signs, activates or arms.
