gate_class: opus
objective: Arm catE step #40c — drop `--advisory` from the step "Paid-endpoint ban judged as an entity" in .github/workflows/catE-sovereignty-lint.yml so a finding from scripts/lint_paid_llm_entity.py exits 1 and reddens the workflow — on the owner's order (Zero, 2026-09-21, verbatim "togliu tu e rendi Jev operativo"), and record that order as RULED 2026-09-21-ter in docs/rules/RULINGS.md, the dated line RULED 2026-09-21-bis said this gesture would need.
constraints:
  - "One behaviour change only: the exit code of the lint in that step. No change to scripts/lint_paid_llm_entity.py, scripts/typesafe_client.py, the fence logic or the tests."
  - "OR composition stays the safety argument: the model can only ADD a finding; it never clears a grep hit; silence (no key, unauthorized, network, 429 after retries, malformed body) is 'no opinion' and the lint degrades to the transcribed grep — it never reds a build for a missing credential."
  - 'The authorization the step speaks under is the -bis entry in infra/vendor-authorizations/authorized_endpoints.json (endpoint https://api.typesafe.ai/v1/systemone, paths ["**"]); this PR adds no entry and widens nothing.'
  - "Never print, log or commit the key; probes as ${VAR:+SET} only. The GitHub repository secret was placed by the owner, not by this session."
  - "Prose must not drift from disk: every remaining 'advisory' mention in the step must be historical (what it WAS), never a present-tense claim."
acceptance:
  - text: WHEN the lint reports at least one violation and is invoked WITHOUT --advisory, main() SHALL return 1; WITH --advisory it SHALL return 0 — the flag's removal is the whole of the arming.
    probe: 'python3 -c ''import lint_paid_llm_entity as L; L.judge_file = <violation stub>; L.main([f]) -> 1; L.main(["--advisory", f]) -> 0'' on an in-scope scratch file (receipt in pack.yml, 2026-09-21T04:24:22Z)'
  - text: The step's run line SHALL NOT carry --advisory.
    probe: "grep -c -- 'lint_paid_llm_entity.py --advisory' .github/workflows/catE-sovereignty-lint.yml == 0"
  - text: The workflow SHALL remain schema-valid and the five guard suites SHALL stay green.
    probe: "actionlint .github/workflows/catE-sovereignty-lint.yml (rc 0); pytest -q on scripts/test_lint_paid_llm_entity.py scripts/tests/test_lint_ban_prose.py scripts/tests/test_vendor_authorization_fence.py scripts/tests/test_typesafe_client_pin.py scripts/tests/test_cate_trigger_parity.py -> 220 passed"
  - text: The -bis fence entry SHALL still be justified by a ruling naming its endpoint after the `use` text edit.
    probe: test_every_shipped_entry_cites_a_ruling_that_names_its_endpoint (in the 220 above)
  - text: WHEN this PR's own catE run executes step #40c, the log SHALL show files judged (the key is configured) and the step SHALL exit 0 on this diff, which reaches no paid endpoint.
    probe: "the catE-sovereignty-lint run on this PR's head — read after push, before merge (Bites in pack.yml)"
assumptions:
  - text: The workflow's own arming precondition — the bench re-run by someone other than the lane that wrote it — was met on 2026-09-21 (jev-1.13.0, isolated copy, guilt 16/19, grep-miss recall 15/17, false alarms 0/20 at thresholds 0.5–0.8).
    status: inherited from the recorded re-run (MOS memory 17863, session nuzantara-05), not re-executed in this session
  - text: The corpus is still self-authored (scripts/tests/fixtures/paid_llm_entity/bench_cases.json _doc says so); re-running it measures reproducibility, not adversarial robustness.
    status: verified
    probe: the fixture's own _doc, read this session
  - text: With the key configured and the endpoint authorized, a network or vendor failure in CI cannot red the step on a grep-clean diff, because ask() returns None and judge_file treats None as no opinion.
    status: verified
    probe: scripts/lint_paid_llm_entity.py judge_file / main read this session; council seats asked to falsify it (council.jsonl)
consumer_map:
  - .github/workflows/catE-sovereignty-lint.yml — step "Paid-endpoint ban judged as an entity", the only consumer of the removed flag; runs on every PR that touches the hot zone.
  - scripts/lint_paid_llm_entity.py — unchanged; its non-advisory exit path (return 1 on violations) becomes live.
  - infra/vendor-authorizations/authorized_endpoints.json — `use` text only; read by no code (authorized() reads endpoint and paths).
risks:
  - "A false red on a real PR when the model scores a clean file >= FIRE_THRESHOLD (0.80): by design the failure mode of arming. Handled like any red — read WHY before rerunning; three for the same cause and the arming, not the PR, is what gets re-examined (stated in RULED 2026-09-21-ter)."
  - "The corpus is self-authored: a refuter adding cases meant to fool the judge is the honest next lane and is not in this PR."
  - "Whether catE-sovereignty-lint is a REQUIRED status check on main is not changed here; if it is not required, a red step reddens the PR's rollup without blocking the merge queue by itself."
