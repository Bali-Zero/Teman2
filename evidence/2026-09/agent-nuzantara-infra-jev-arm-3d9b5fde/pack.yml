unresolved:
  - "catE-sovereignty-lint is not a REQUIRED status check on main: a red step reddens the PR's rollup but does not by itself hold the merge queue. Making it required is a branch-protection change AND needs the workflow to report on every PR (today it triggers on hot-zone paths only) — a separate lane, the owner's call."
  - "No pardon mechanism for a probabilistic false red (unlike #40d's grandfathered.json): the human reading the red is the only valve. Recorded in RULED 2026-09-21-ter; the first false red that lands is the lane that writes it."
  - "Route-by-process guilt (shell/raw HTTP with no SDK) scores below FIRE_THRESHOLD 0.80: httpx_async_raw 0.60, shell_curl 0.44, shell_wget_process 0.39, workflow_step_curl 0.78. The greps miss this class too, so arming loses nothing there, but it is the corpus's declared blind spot and stays open."
