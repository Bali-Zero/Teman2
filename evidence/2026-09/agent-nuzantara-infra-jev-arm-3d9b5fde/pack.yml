diff:
  behaviour_change: |
    One behaviour changes: catE step #40c "Paid-endpoint ban judged as an entity" no longer
    passes --advisory to scripts/lint_paid_llm_entity.py, so a violation makes main() return 1
    and the workflow goes red. Nothing else moves: the lint, the client, the fence logic and the
    OR composition are untouched; silence (no key, unauthorized, network, 429 after retries,
    malformed body) is still "no opinion" and degrades to the transcribed grep with exit 0.
    docs/rules/RULINGS.md gains RULED 2026-09-21-ter (supersedes the two "stays advisory"
    sentences of -bis; records the live 55-case bench run and the known limits). The -bis fence
    entry's `use` text stops saying the step stays advisory. One test is added: the CLI-level
    exit-code flip (exit 1 armed, exit 0 advisory) that nothing in the suite asserted before.
  surface: |
    One workflow file (the run line and its comment block), one rules document, one JSON ledger
    field read by no code, one test module (+1 test). No backend, no frontend, no migration, no
    credential; the client and the lint are not edited.
