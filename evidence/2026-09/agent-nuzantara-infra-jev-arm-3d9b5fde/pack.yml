dissent:
  - seat: codex-gpt-5.6-sol
    objection: "DISSENT (verbatim): Do not arm a probabilistic external judge until malformed responses are fail-closed and the outbound repository-content PII boundary is enforceable. — First half ACCEPTED and FIXED here: noul() returned float(True) == 1.0 for a malformed {noul: true} and would have red a PR on garbage; it now returns None unless the value is a non-bool finite number in [0, 1], with guilt and innocence tests. Second half REJECTED as new: RULED 2026-09-21-bis settled the boundary — the repository is itself bound by §4, a PII-carrying file is a violation before any vendor sees it, and non-repository material is not covered; this PR sends nothing -bis did not already authorize."
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection: "HIGH — no pardon list: a finding reaches `return 1` directly and the ruling defers the mechanism to a future lane. ACCEPTED as risk, same as agy's finding below; the owner's decision to arm stands and the first false red is the lane that writes it."
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM — -ter asserted the key was on every machine and in the repository secret with no tracked evidence, while -bis records the secret was NOT configured. ADDRESSED: a names-only receipt (gh secret list, updated 2026-09-21T03:41:00Z) and the Pro/Mini presence probes are in this pack."
    status: CONFIRMED
  - seat: agy-gemini-3.1-pro
    objection: "HIGH — the 16 refuter cases in bench_cases.json (9 innocence) were never run against jev-1.13.0, while the ruling and the workflow comment cited only the 39-case numbers: an unmeasured false-alarm surface under a blocking gate. CLOSED BY MEASUREMENT in this pack: the full 55-case bench was run live before pushing (false alarms 0/29 at every threshold 0.5-0.9) and -ter plus the workflow comment now carry the measured numbers."
    status: CONFIRMED
  - seat: agy-gemini-3.1-pro
    objection: "MEDIUM — no in-repo pardon/baseline/noqa mechanism for a probabilistic false red, unlike #40d and #40; a false positive hard-blocks a PR with no remedy short of editing CI. ACCEPTED as risk, not fixed here: recorded in RULED 2026-09-21-ter and in `unresolved` — the first false red is the lane that writes the pardon mechanism."
    status: CONFIRMED
  - seat: agy-gemini-3.1-pro
    objection: "LOW — -ter called a refuter 'the honest next lane' while refuter cases already existed in-tree (added 2026-09-21, unmeasured). FIXED in wording: -ter now states the 39+16 provenance and the live measurement."
    status: CONFIRMED
  - seat: claude-sonnet-5 (spalla-review subagent — a Claude-family seat, not counted toward R9 quorum)
    objection: "Arming a step on an external model citing bench numbers from few-line fixtures, without ever having run that step, from the real CLI entrypoint, on ITS OWN diff — the workflow file being the most adversarial file in the repo by 'Anthropic/api_key' vocabulary density — and without a single test proving that dropping --advisory changes the exit code. CLOSED: the armed lint was run live on the workflow file and on the lint itself (asked=True, violation=False, max probability 0.13, exit 0), and test_a_violation_exits_one_unless_advisory now pins the flip."
    status: CONFIRMED
  - seat: claude-sonnet-5 (spalla-review subagent)
    objection: "-bis still says 'the step keeps --advisory' / 'The step stays advisory' two lines above -ter, and the file quotes the step's former '(advisory)' name; -ter did not use the word SUPERSEDES. FIXED: -ter now names the superseded sentences explicitly; the older lines stay as history by the file's append-only convention."
    status: CONFIRMED
bites:
  consumer: |
    catE step #40c "Paid-endpoint ban judged as an entity" (.github/workflows/catE-sovereignty-lint.yml),
    which runs scripts/lint_paid_llm_entity.py WITHOUT --advisory on every hot-zone PR, this one
    included. Legacy form on purpose: the executable `observe:` needs the observed script to declare
    itself `bites-observable`, and this PR leaves scripts/lint_paid_llm_entity.py untouched. The
    observation, made before this pack was written (receipts above) and to be re-read on this PR's
    own catE run: with the key configured and the -bis authorization on disk, the armed lint run on
    .github/workflows/catE-sovereignty-lint.yml and on scripts/lint_paid_llm_entity.py reports
    asked=True, violation=False (max route probability 0.13) and exits 0; with a violation stubbed
    in, main() exits 1 without --advisory and 0 with it (test_a_violation_exits_one_unless_advisory).
    On this PR's head the step must show files judged > 0 and exit 0 — a red here on a diff that
    reaches no paid endpoint would be the first false red the ruling describes, read and not rerun.
