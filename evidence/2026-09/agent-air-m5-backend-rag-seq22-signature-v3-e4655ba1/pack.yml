dissent:
  - seat: claude-fable-5-1 (signing seat, this worktree session), self-caught
    status: CONFIRMED
    objection: >-
      engine-adapter.test.ts's own doc-comment (above `reviewReasonCodesInPack`) says that
      "the day the signed bundle lands, the eight retired keys stop being in the union and
      the stale-key test names them, which is the moment their copy is allowed to go" — i.e.
      the test author's stated intent for THIS PR was to DELETE the eight REVIEW_REASON_COPY
      entries. This seat did not do that, and R2's handoff ("38→30 + 8 REVIEW_REASON_COPY
      keys may be involved") pointed the same way. Reason: the premise "the highest signed
      pack is the upper bound of what production can emit today" is false here — signing
      and activation are separate ceremonies (D24; seq-21 was signed and never activated),
      production evaluates on seq-20, and seq-20 emits all eight codes (measured against
      rulepack-prod-020.signed.json). Deleting the copy now would put a raw machine code on
      a live applicant's verdict for the whole pre-activation window. The copy therefore
      stays, matched BY NAME in REVIEW_REASON_COPY_KEYS_LIVE_ON_SEQ20_ONLY with an honesty
      test, and its deletion is owed in the D24 activation PR. The measured floor is 31,
      not R2's estimated 30 (13 pack + 18 pack-independent).
  - seat: claude-fable-5-1 (signing seat), self-caught
    status: CONFIRMED
    objection: >-
      The first attempt (#6670) was armed without an evidence pack and went red on
      "Harness floor recompute" (floor 3 by size, deterministic). The staff room initially
      read that red as the PENDING-verdict shape and a gate was started on 8b297409c1; this
      seat corrected it in the mailbox (02:04 WITA), the gate was killed, and this successor
      carries the pack. Cost: one close/reopen cycle, no content change (blob parity proven).
  - seat: claude-opus-5 (R2 release owner, v3 packager), self-caught
    status: CONFIRMED
    objection: >-
      #6673 (v2) passed its gate (PASS on 9b30782aae) but "Harness floor recompute" stayed
      red on the rerun, in the "Bites contract" step, with a silent exit 2 (the step runs
      under bash -e). Reproduced with main's parser on a main tree: {"malformed": true,
      "errors": ["observe: `scripts/ci/observe_visa_seq22_signed.py` does not exist in the
      checkout"]}. The job checks out pull_request.base.sha, and the parser deliberately
      executes only an observer that is already on the base, never the head copy. A PR
      that ships its own observer therefore cannot declare it executable. The red is
      deterministic, so a rerun would not change it. v3 keeps the observer (it is on main
      after the merge and a later pack can call it) and states the bites contract in prose.
      This is depth 2 (#6670 -> #6673 -> v3). The staff room ruled that any further
      deterministic red suspends the lane rather than opening a v4.
