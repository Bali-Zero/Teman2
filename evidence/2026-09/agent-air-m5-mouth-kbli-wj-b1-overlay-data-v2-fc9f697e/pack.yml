decisions:
  - id: D1
    what: >-
      Discard-and-redo (`git reset --hard` to the fresh #6596-merged
      origin/main tip, then replay the full pipeline) instead of rebasing the
      first v2 attempt's 9 commits through #6596's 1-commit-ahead diff.
    why: >-
      Same "ONE rebuild, not a rebase" philosophy the original W-J correction
      established for the pre-#6596 v1->v2 move — a JSON-merge-conflict-free,
      deterministic redo beats fighting a rebase commit-by-commit through a
      canonical-dataset PR. #6596 was confirmed already MERGED via a single
      `gh pr view 6596 --json state,mergedAt` call before any poll-wait was
      needed.
  - id: D2
    what: >-
      Re-verified the compiler's output population on the new base rather
      than assuming it matched the first v2 attempt's numbers. It did NOT: #6596
      itself moved main's own raw pre-cure population 519->518 (lifting
      43110's block), so the applied-closure compiler's post-cure count moved
      132->131, and every downstream pin (article prose, kbli-prose-pins.test.ts,
      kbli-bali-block.test.ts, kbli-meta.test.ts, KBLIProvenancePanel.test.ts,
      pr2b_source_rows_93114_43110's per-field hash pins) had to be re-derived
      a SECOND time, not copied from the first attempt.
    why: >-
      The whole mission's thesis is verify-don't-presume; assuming an upstream
      merge that touches the same canonical left the downstream numbers
      unchanged would repeat the exact mistake the honest-map article itself
      exists to correct.
  - id: D3
    what: >-
      A per-field (not whole-record) hash pin in W-H's own
      pr2b_source_rows_93114_43110 cure spec (l4_bali field only, for codes
      93114/43110) drifted because this branch's OWN moratorium-text rewrite
      (rule 5, touches l4_bali.moratorium on all 1,559 records) touched those
      two records' l4_bali field too — an unrelated-sibling-cure collision,
      not a defect in either cure. Re-pinned via the same restore-and-
      reproduce proof methodology as the 4 whole-record cure specs (adapted
      to `H.judge_patch`'s per-field hashing signature): restored each
      record's PRE-cure l4_bali from the commit before this branch's
      applied-closure write, proved it reproduces the spec's EXISTING
      new_sha256 pin exactly, then rewrote to the live post-cure hash.
    why: >-
      Never overwrite a stale pin blind — the hardened cure-IO layer's own
      `CureError` on a hash mismatch exists precisely to force this proof
      step instead of a trust-me rewrite.
  - id: D4
    what: >-
      real-estate-68111-on-the-chopping-block (EN/IT/ID) rewritten in full,
      not just re-pinned — 68111 moved CHIUSO_BALI_PROPOSTO (proposed) ->
      CHIUSO_BALI (applied) under this branch's own compiler, making the
      article's entire prior thesis ("68111 is proposed, not yet closed...
      race the clock before it shuts") factually wrong, not merely
      stale-numbered. No test guards this article's prose (confirmed via
      search across apps/mouth/src/lib and apps/mouth/src/content), so this
      is a content-accuracy fix with no CI pin riding on it — done anyway,
      because a wrong live claim about a code this exact migration decided is
      squarely in scope for the migration that decided it.
    why: >-
      "Never loosen to vacuous" cuts both ways — an unguarded claim left
      wrong because nothing forces a fix is the same failure mode as a
      loosened assertion, just without a red test to announce it.
  - id: D5
    what: >-
      Ran an independent adversarial review (agy CLI, agy-gemini-3.1-pro) a
      SECOND time against this redo's own diff, rather than treating the
      first v2 attempt's PASS verdict (on a since-discarded branch) as still
      valid. Applied both findings (see dissent above).
    why: >-
      A review of a discarded 9-commit branch says nothing about a fresh
      9-commit replay on a different base — the whole point of "generator is
      never grader" is that an independent check runs against what actually
      ships, not against an ancestor of it.

