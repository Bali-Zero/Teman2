dissent:
  - seat: tp1-qwen3.8-max
    objection: >-
      Round-1 MAJOR — commit order. The two-commit split (guard commit, then
      regeneration commit) leaves the GUARD commit red when checked out
      alone: at that commit `schema.d.ts` is still the pre-regeneration
      blob, so the corrected `PublicLeadSource` assertion fails against it.
      Reversing the order only moves the redness to the other commit.
    status: CONFIRMED
    note: >-
      Cured by squashing guard + regeneration into the single commit
      `150c8d36e4`. `gemini-3.1-pro` converged on this same finding
      independently, without either seat being primed with the other's
      result. The coordinator verified empirically before accepting:
      checked out the prior round's guard-only commit (`9eaeb53dab`) alone
      and measured `sitemap.test.ts` at 1 failed | 16 passed (17); at
      `150c8d36e4` (guard + regen together), 18/18.

  - seat: gemini-3.1-pro
    objection: >-
      Round-1 MAJOR — the drift guard shipped as a named PENDING-ARMS debt
      row instead of real, working code, leaving the 20-day-drift failure
      mode this PR exists to fix structurally unguarded in CI.
    status: CONFIRMED
    note: >-
      Cured by `apps/backend-rag/backend/tests/unit/scripts/
      test_generate_openapi_schema_pin.py` + `generate_openapi.py`'s
      `compute_schema_sha256`/pin-writer, built inside a 30-minute
      time-box. Determinism proved (two fresh-process regenerations,
      identical hash both times) and guilt proved (a corrupted pin turned
      the test RED with the exact intended message; restoring it turned it
      GREEN) before this was committed. The PENDING-ARMS row from the prior
      round was removed as superseded.

  - seat: tp1-qwen3.8-max + gemini-3.1-pro
    objection: >-
      Round-1 MINOR — brittle `PublicLeadSource` extraction regex
      (`/PublicLeadSource:[\s\S]*?;\n\s+\/\*\*/`) assumed the next schema
      declaration always opens with a JSDoc comment; a parse miss would
      silently return `undefined`, reading as a contract violation instead
      of a broken extractor. Both seats raised this independently.
    status: CONFIRMED
    note: >-
      Cured: `extractPublicLeadSourceBlock()` now matches
      `/PublicLeadSource:[\s\S]*?;/` (no TS union member can contain a
      semicolon, so the first one is unambiguously the terminator,
      independent of whatever follows) and throws
      `"PublicLeadSource block not found in schema.d.ts"` on a miss. A
      dedicated test proves the throw.

  - seat: tp1-qwen3.8-max + gemini-3.1-pro
    objection: >-
      Round-1 MINOR — tautological guilt fixture
      (`` `export interface components {}\n${marker}\n` ``) only proved
      `filter`+`includes` finds a string that was just concatenated, not
      that the check survives a realistic schema shape.
    status: CONFIRMED
    note: >-
      Cured: the fixture is now a realistic schema fragment (a `paths`
      entry referencing `operations[...]` by the retired operationIds, an
      `operations`-shaped block, two component schema names) modelled on
      the generator's real output, plus per-marker redaction proving
      precision. The near-miss scope (`/api/visa/voa-v2` is NOT caught) is
      stated plainly in both the code comment and the commit body.

  - seat: tp1-qwen3.8-max
    objection: >-
      Round-2 MINOR — the drift pin guards one layer upstream of what its
      name implies: it covers OpenAPI JSON ↔ backend, not `schema.d.ts` ↔
      OpenAPI JSON, because the `openapi-typescript` rendering step is
      never hashed or re-run. A tool version bump or output-format change
      could diverge `schema.d.ts` from a fresh render while the pin stays
      green. (The coordinator reached the same conclusion independently,
      reading the docstring before the seat raised it.)
    status: CONFIRMED
    note: >-
      Cured by stating the scope honestly rather than closing the gap with
      a decorative fix: both `generate_openapi.py`'s module docstring and
      `test_generate_openapi_schema_pin.py`'s docstring now say precisely
      what the pin catches (the backend moving ahead of a regeneration —
      the exact 20-day failure) and what it does not (a `schema.d.ts` that
      is wrong for any other reason). A second pin over `schema.d.ts`'s own
      bytes was considered and deliberately NOT added: nothing in this
      backend-only Python CI job can re-derive `schema.d.ts` via a fresh
      `openapi-typescript` render to check it against — that needs Node in
      a job that currently has none — so an unchecked second pin would be
      exactly cicatrix family #2 (esiste≠armato), a file nothing arms.
      Closing that gap for real is named as a follow-up, not hidden.

  - seat: tp1-qwen3.8-max
    objection: >-
      Round-2 MINOR — `Path(__file__).resolve().parents[6]` is a magic
      depth constant; a future file move/restructure would break the pin
      path with an opaque `FileNotFoundError` deep inside the test body.
    status: CONFIRMED
    note: >-
      Cured: a one-line sanity assert now checks
      `(_REPO_ROOT / "apps" / "mouth" / "package.json").is_file()`
      immediately after computing `_REPO_ROOT`, with a message naming
      exactly what moved and which constant to fix.

  - seat: tp1-qwen3.8-max
    objection: >-
      Round-2 MINOR — `create_app()` is constructed inside the test
      function with no fixture; if construction acquires a DB handle or a
      socket, this repo's real CI parallelism
      (`-n auto --dist loadfile`, `.github/workflows/tests.yml`) could
      make the test flaky. Needs verification, not assumption.
    status: PLAUSIBLE
    note: >-
      Verified, not assumed: `create_app()` → `register_middleware()` →
      importing `backend.middleware.rate_limiter` instantiates the
      module-level singleton `rate_limiter = RateLimiter()`, whose
      constructor calls `RedisManager.get_instance().get_sync_client()` —
      but `RedisManager.__init__` is a no-op (attributes only); the actual
      blocking `redis.from_url(...).ping()` call lives in the SEPARATE
      `RedisManager.initialize()` method, invoked only from the app's
      `lifespan` startup handler, which `create_app()` + `.openapi()` never
      triggers. `get_sync_client()` therefore returns `None` immediately —
      confirmed by the "no Redis available" log line appearing instantly on
      every run in this PR (never a 5-second stall) and by the consistent
      ~1-2s total runtime across every regeneration in the determinism
      proof. `PricingService`'s eager load is a local JSON file read, not
      network I/O. `create_app()` is already called this same way, no
      fixture, by 5 other files in this suite
      (`test_app_factory.py`, `test_endpoints_reachable.py`,
      `test_evaluate_endpoint.py`, `test_intake_review.py`,
      `test_garuda_voa_openapi_parity.py`), already running under this
      exact parallel regime with no recorded flake for this pattern.
      Status left PLAUSIBLE rather than CONFIRMED per the coordinator's own
      instruction ("let the evidence decide, not the tidiness") — no
      gating fixture was needed, so this is a verified-harmless finding,
      not a cured defect.

