spec: |
  PART A — the first ruling, after attempt 1's stop-and-report on
  `sitemap.test.ts` going RED under a faithful regeneration. Each fact
  independently re-verified in this session (git show, git log -S, direct
  reads) before being built on:

  (i) ENTITY-BASED GUARD. Six of eight forbidden markers are real RETIRED
  wire-surface identifiers from #4344 (2026-08-21) — verified at zero
  occurrences in the regenerated schema. The other two were TYPE names
  (`CaseType`, `backend__services__garuda_flow__intake__Purpose`) that
  legitimately reappear: verified import at
  `apps/backend-rag/backend/app/routers/garuda_voa_public.py:54`
  (`from backend.services.garuda_flow.intake import CaseType, Purpose`),
  verified that router live via its own docstring ("Wired into the running
  app as of 2026-08-25... a RouterEntry in router_manifest.py plus a bare
  include_router in BOTH include_routers() and include_light_routers()")
  and via `main_api.py:741`'s import from the same module. RULING: keep the
  six, drop the two, guilt+innocence both directions.

  (ii) `garuda_voa` REAPPEARING IS NOT A NEW EXPOSURE DECISION. Traced via
  `git log -S'GARUDA_VOA = "garuda_voa"'`/`git show` on
  `apps/backend-rag/backend/services/lead_capture/source.py`: #4344
  (2026-08-21, `665bfd40d7`) created `PublicLeadSource` excluding it,
  correct then. #4960 (2026-08-25, `f95d7bd730`, "train 4/4 — the public
  funnel UI, dark by flag") relaunched the funnel under owner decision 5
  (`product.yaml` id 5, `ratified: Concept A — "The Stamp"`), capturing
  leads under exactly `garuda_voa`. #5173 (2026-08-28, `018b55c9cc`)
  re-admitted it on the backend and inverted its own sibling test,
  `test_public_capture_accepts_garuda_but_never_resurrects_its_url`
  (`apps/backend-rag/backend/tests/services/lead_capture/
  test_whatsapp_deeplink.py`). CORRECTION FOUND IN THIS SESSION, not taken
  on faith: the coordinator's citation of "#4959 (2026-08-26)" for the
  source.py change is off — the real commit is #5173 (2026-08-28); #4959
  ("train 2/4 — the whole backend, dark by flag") is real and adjacent but
  never touches that file, and the 2026-08-25 relaunch date matches #4960,
  not #4959. Recorded here, not silently corrected; substance of the ruling
  unaffected. RULING: invert the assertion.

  (iii) ONE PR, TWO COMMITS, IN ORDER — this half of the FIRST ruling was
  WRONG. Superseded by Part C cure 1 below.

  PART B — FIRST COUNCIL ROUND (journal: `council-journal.jsonl`, both
  entries `role: review`, `ok: false`, `verdict: REWORK` — neither counts
  toward this repo's council quorum check, which is correct: round 1 did
  not approve anything). Two independent seats — `tp1-qwen3.8-max` and
  `gemini-3.1-pro` (the latter outside this repo's canonical
  COUNCIL_REVIEW_SEATS tuple, recorded anyway for the historical record) —
  converged on the SAME MAJOR without either being primed with the other's
  finding: a two-commit split (guard commit, then regeneration commit)
  leaves the GUARD commit red when checked out ALONE, because at that
  commit `schema.d.ts` is still pre-regeneration and the corrected
  `PublicLeadSource` assertion fails against it. Reversing the order only
  moves the redness to the other commit — the guard and the regenerated
  bytes describe the same fact and must change together.

  The coordinator verified this EMPIRICALLY before accepting the finding,
  not on the council's word alone: checked out the guard-only commit
  (`9eaeb53dab` from the prior round) alone and ran `sitemap.test.ts` ->
  measured 1 failed | 16 passed (17); at HEAD (both changes together), 17/17.
  Both seats also independently flagged the same two MINORs: the
  `PublicLeadSource` extraction regex assumed the next token is a JSDoc
  comment, and the guilt fixture was a tautological string concatenation.

  Two things the council explicitly CONFIRMED and this pack does NOT
  re-litigate: dropping the two type-name markers loses no real protection;
  inverting the `PublicLeadSource` assertion is correct ("dark" means
  hidden behind a UI flag, not erased from the network contract, and a
  generated schema mechanically reflects the live spec).

  PART C — FIVE CURES, ruled by the coordinator, all landed in this pack's
  single code commit `150c8d36e4`:

  1. MAJOR, cured: squashed the guard rewrite and the regeneration into ONE
     commit. This evidence-pack commit stays separate (it is green on its
     own — nothing in it is executable code the suite runs).

  2. The drift guard replaces the PENDING-ARMS debt row from the previous
     round entirely, built inside a strict 30-minute time-box (met, not
     exceeded): a backend pytest
     (`apps/backend-rag/backend/tests/unit/scripts/
     test_generate_openapi_schema_pin.py`) regenerates the OpenAPI schema
     via `scripts.generate_openapi.create_app` + `.openapi()` — the SAME
     code path `npm run contract:visa-oracle`'s `generate:openapi` step
     already uses — hashes it with that module's own new
     `compute_schema_sha256` (one implementation, imported not
     reimplemented into the test, so the writer and the checker cannot
     drift apart from each other the way the schema and the backend did),
     and compares against `apps/mouth/src/lib/api/
     schema.d.ts.openapi-sha256`, written by `generate_openapi.py`'s
     `main()` as a side effect of every future regeneration.

     DETERMINISM PROVED, not assumed, before this was committed: two
     separate `python -m scripts.generate_openapi` invocations, each a
     FRESH interpreter process (not the same long-lived process, which
     could hide non-determinism), produced byte-identical `openapi.json`
     (`diff` exit 0) and an identical SHA-256 hash
     (`9cfd9d0b60f2e1e2207f86aebe2488ab4cfb6e642e4c608d64e1ba7c9dea2084`)
     both times.

     GUILT PROVED too: the pin file was corrupted to a dummy 64-hex-char
     string and the test went RED with the exact intended message
     ("openapi changed: run npm run contract:visa-oracle in apps/mouth and
     commit schema.d.ts + pin"); restoring the real pin turned it GREEN
     again.

     Noted per the ruling: this PR now touches `apps/backend-rag` for a
     TEST file only — zero runtime code changed (the pin-writing addition
     to `generate_openapi.py` runs only inside that offline generation
     script, never inside the deployed FastAPI app) — so merging this is a
     Fly deploy of behaviorally identical runtime code.

  3. MINOR (brittle regex), cured: the old
     `/PublicLeadSource:[\s\S]*?;\n\s+\/\*\*/` assumed the NEXT schema
     declaration always opens with a JSDoc comment. Replaced with
     `extractPublicLeadSourceBlock()`, matching
     `/PublicLeadSource:[\s\S]*?;/` — no member of a TypeScript union type
     can itself contain a semicolon, so the FIRST one after the key is
     unambiguously the union's own terminator, independent of whatever
     follows. Throws `"PublicLeadSource block not found in schema.d.ts"`
     on a miss instead of returning `undefined` silently — a parse miss
     must never read as a contract violation. A dedicated test
     (`"the PublicLeadSource extractor fails loudly, not silently, when
     the block is missing"`) proves the throw.

  4. MINOR (tautological guilt), cured: the fixture is now a REALISTIC
     schema fragment — a `paths` entry referencing `operations[...]` by
     the two retired operationIds, an `operations`-block-shaped
     declaration, and two component schema names — modelled on the shape
     openapi-typescript still emits today for the live
     `/api/visa/voa/eligibility-checks` entry, not a bare string
     concatenation. The guilt test asserts the check catches all six
     markers embedded together AND, per marker, that redacting exactly one
     drops only that one from the findings (precision, not just "something
     matched").

     THE NEAR-MISS QUESTION, answered plainly (in the code comment above
     `RETIRED_GARUDA_MARKERS` and in the commit body, not promised beyond
     what the markers deliver): these six markers are EXACT substrings,
     not prefixes. A re-mount under `/api/visa/voa-v2` would be quoted as
     `"/api/visa/voa-v2"` in a regenerated schema, which does NOT contain
     the substring `"/api/visa/voa"` (the character immediately after
     "voa" is `-`, not the closing quote that the marker requires); its
     operationId would also be a fresh, FastAPI-derived name, unrelated to
     `submit_voa_api_visa_voa_post`. So a near-miss path is NOT covered —
     this guard catches literal resurrection of these six retired
     identifiers only, never an analogous new one under a similar name.

  5. This evidence pack itself — carries the round-1 journal
     (`council-journal.jsonl`, this pack's `council_run:` pointer) and
     leaves `dissent: []`. The second council round (qwen on the cured
     diff) and the final verdict are the orchestrator's to run and record,
     outside this session's contribution chain.

