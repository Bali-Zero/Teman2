    number is restated here: this pack's own YAML bulk is part of the same
    commit's `git diff --numstat`, so any hardcoded figure goes stale the
    moment this pack itself is edited to satisfy lint. Exact current stat:
    `git diff --numstat origin/main...HEAD`.
  behaviour_change: >-
    Tier 1's agent spec (Step 5) writes to /tmp/<date>-delta.json instead of
