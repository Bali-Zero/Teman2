seat_override: >-
  Single-build-lane ops bugfix, still 3 files (no literal line count restated
  here on purpose — it grew across three REWORK-BUILD rounds fixing genuine
  security findings, and any number pinned in this pack's own prose goes
  stale the moment it is next edited; exact current stat: `git diff --stat
  origin/main...HEAD`). Floor-3 classification is purely path-based
  (infra/launchagents/* is a literal HOTZONE_PATTERNS entry) rather than a
  signal of architectural ambiguity or blast radius warranting cross-family
  adjudication. Every
  claim in this pack is independently receipted, including two live
  RED-then-GREEN `codex exec` runs on the production machine itself (Pro) —
  not narrated from documentation. Convening a 2-seat cross-family council
  (codex-gpt-5.6-sol/kimi/tp1-*/agy) for a fix already reproduced end-to-end
  on the machine it targets would spend real seat quota without adding
  verification the receipts don't already carry. Flagged explicitly to the
  dispatching team-lead in the PR body so they can request a real council
  pass before merge if they judge otherwise — this override is reported, not
  hidden (generator != grader still holds: a fresh Gear-3 on-disk gate reads
  this pack and can still object).
