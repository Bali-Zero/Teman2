dissent:
  - seat: "independent Gear-3 on-disk gate (REWORK-BUILD, head 7753eac1)"
    objection: >-
      recover_delta() promoted the tier-1 scratch file with a plain `cp` —
      no symlink check, no ownership check, no content validation — and
      delta_is_partial() treated unparsable JSON as "not partial", so
      ensure_full_delta() returned 0 and promote_delta_via_pr() committed/
      pushed/auto-merged whatever was at the scratch path into the PUBLIC
      repo. Proved live with this head's own functions: a markdown file,
      `{"hello":"world"}`, and a symlink to a canary secrets file were all
      promoted (rc=0, canary content copied); only partial:true was
      rejected. The guilt test added in this PR even locked the flaw in
      (its payload had no `deltas` key and would now be correctly
      rejected).
    status: CONFIRMED
    note: >-
      Genuine, correctly-proven finding — not disputed. Fixed on the same
      branch, new commit (never --amend): the scratch directory moved from
      world-writable `/tmp` to a private 0700 dir under `$HOME`; the
      function now refuses a symlink or a file it does not own BEFORE
      reading anything, and promotes ONLY through
      `extract_delta_from_output()`'s schema check + re-serialization
      (never a byte-for-byte copy); `delta_is_partial()` is now a 3-way
      exit code (0=partial, 1=confirmed valid, 2=invalid/unparsable) so
      "unparsable" can never again be silently treated as "not partial" —
      every caller of `delta_is_partial` (`ensure_full_delta()` for tiers
      1-3, and tier 4's own ollama block, which had the identical
      collapsing-if-then bug independently) now branches on the exact rc.
      4 new GUILT tests (non-JSON, symlink, schema-invalid, partial:true)
      plus the corrected INNOCENCE test — receipts above.
  - seat: "session, self-check on the scratch-path fix's actual load-bearing layer"
    objection: >-
      Is the real fix the wrapper's recover_delta() change, or does it
      require ALSO editing PROMPT_CLAUDE (the inline print-mode prompt)? If
      the agent spec (.claude/agents/regulatory-watcher.md, read via "Read
      ... for full spec") is authoritative, editing only PROMPT_CLAUDE would
      have been cosmetic and left tier 1 broken.
    status: CONFIRMED
    note: >-
      Checked directly: PROMPT_CLAUDE says "Emit JSON to today's file" with
      no hard path, deferring entirely to the agent spec's Step 5, which DID
      say "Write to `~/nuzantara/research/regulatory/<today>-delta.json`" —
      the tracked path. Editing only the wrapper's prompt string would have
      been the cosmetic fix this objection worried about. Both the agent
      spec's Step 5 AND PROMPT_CLAUDE (defense in depth) were edited in this
      diff to name the scratch path.
  - seat: "session, self-check on /tmp as a shared, world-writable location"
    objection: >-
      Does writing the delta to /tmp introduce a race (two concurrent runs
      overwriting each other) or an exposure risk (world-readable /tmp) that
      the tracked-checkout write didn't have?
    status: RETRACTED
    note: >-
      Checked, not assumed safe: the wrapper already holds a single-instance
      lock (REGWATCH_LOCKDIR, mkdir-based) before any tier runs, so two
      concurrent cron instances cannot both reach tier 1 — no new race.
      Content is public regulatory citations (Indonesian government
      publications), never client PII (Builder Contract 4 does not apply);
      the scratch file is deleted by recover_delta() on successful promotion,
      and a failed cp leaves it in place for manual recovery with a log line
      naming it, same posture the worktree-glob recovery paths already have
      for their own artifacts.
  - seat: "session, self-check on the codex network fix's precision"
    objection: >-
      `-c sandbox_workspace_write.network_access=true` and `-c features.
      network_proxy=false` are not documented in `codex exec --help` (grepped,
      zero hits for "network"/"allowlist"/"domain") — is this actually the
      config schema, or a guess that happened to work once?
    status: PLAUSIBLE
    note: >-
      Not fully retracted on purpose: both flags were proven live against
      this exact installed version (codex-cli 0.156.1) with a RED run (network
      _access alone still blocked, exact allowlist error message captured)
      followed by a GREEN run (both flags, HTTP:200, twice — once against a
      neutral domain and once against an actual regulatory-watcher source) —
      not inferred from documentation, which is silent on both keys. The
      residual risk (a future codex-cli upgrade renaming/removing either key)
      is named explicitly in the brief's risks section: a rejected key
      surfaces as a normal non-zero exit from this tier, cascading to tier 4
      exactly as an existing quota/auth failure already does, never a silent
      no-op — so the failure mode of this risk materializing is bounded and
      already handled by the existing cascade contract.
  - seat: "session, self-check on scope: should this PR also fix agy's OAuth or Telegram's 401?"
    objection: >-
      The team-lead's dispatch named the whole cascade as broken — should
      this PR also resolve tier 2's OAuth timeout or the Telegram bot's
      401, since they are part of the same dark-cron symptom?
    status: RETRACTED
    note: >-
      Investigated rather than assumed out of scope: both are credential
      problems requiring the owner's action (an interactive Google login for
      agy; a token rotation for Telegram), not a code defect a PR can fix —
      confirmed by reading agy's own error ("Authentication required...
      Waiting for authentication... Error: authentication timed out") and by
      the wrapper's existing code already NOT failing the run on a Telegram
      401 (unchanged, verified by reading the surrounding code, not touched
      by this diff). One PR, one concern (CLAUDE.md Agent PR Contract #1) —
      both are named as explicit Left items in the brief and the task report
      instead of silently folded in or silently dropped.
