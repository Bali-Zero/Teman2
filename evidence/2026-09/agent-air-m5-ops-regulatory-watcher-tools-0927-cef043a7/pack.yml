    infra/launchagents/wrappers/regulatory-watcher-run.sh,
    scripts/tests/test_regulatory_watcher_recover_delta.py) — small, focused
    edits plus one new guilt/innocence pytest pair. No literal diffstat
    number is restated here: this pack's own YAML bulk is part of the same
    commit's `git diff --numstat`, so any hardcoded figure goes stale the
    moment this pack itself is edited to satisfy lint. Exact current stat:
    `git diff --numstat origin/main...HEAD`.
  behaviour_change: >-
    Tier 1's agent spec (Step 5) writes to a private 0700 scratch dir under
    $HOME instead of directly into the tracked checkout; the wrapper's
    recover_delta() checks that scratch path first, refuses a symlink or a
    file it does not own, promotes ONLY through schema-validated
