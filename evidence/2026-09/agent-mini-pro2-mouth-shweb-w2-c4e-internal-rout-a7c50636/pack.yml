lesson:
  what: >-
    I fixed a shallow directory walk and a route-group blind spot in the chunk guard, and then wrote
    both bugs again, from scratch, in a new test, about an hour later. A refuter found them in the
    new file; the council seat named the cause: there is no shared route-walking utility, so each
    consumer re-derives the App Router's directory grammar from memory.
  why_it_matters: >-
    The fix that lands here is correct and probed, but it is the second copy of a correction, and the
    seat's prediction is that a third consumer will repeat it. That is the argument for extracting
    the walk rather than for being more careful next time — carefulness already failed, measurably,
    within the hour. It belongs with the other framing failures of this mandate: what the frame
    leaves out never appears in the result, and a walk is a frame.
