dissent:
  - seat: gemini-3.1-pro
    objection: >-
      HIGH — the class test's walk reads ONE directory level and only where that level has a page
      file, so a section with subpages but no index (settings/security with no settings/page.tsx) is
      never censused and the public domain keeps serving it. MEDIUM — route groups are SKIPPED
      rather than descended into, so (workspace)/(portal)/tickets, served at /tickets, is invisible.
    status: CONFIRMED
    disposition: >-
      Both true, both fixed with a recursive walk that descends into groups and drops them from the
      URL. Probed: a section with only a subpage is caught by its first segment, and a page inside a
      group is caught under the URL it is actually served at.
      What matters more than the fix: these are the SAME TWO MISTAKES the chunk guard had been
      corrected for one hour earlier, in a different file, by me. Not a coincidence and not bad
      luck — see the council seat's diagnosis below, which names the cause better than I did.
  - seat: gemini-3.1-pro
    objection: >-
      MEDIUM — process.cwd() makes the test depend on the directory the runner was started from and
      throws ENOENT from the repo root. LOW — the INTERNAL_ROUTES regex matches only double quotes,
      so a formatter switching to single quotes would return an empty list and the coverage test
      would pass while checking nothing.
    status: CONFIRMED
    disposition: >-
      Paths now resolve from import.meta.url. The quote problem is gone by deletion rather than by
      patching: see the council finding below — the array is imported, so there is no regex left.
  - seat: tp1-qwen3.8-max
    objection: >-
      MEDIUM (condition for GO) — parsing the proxy's SOURCE is the weaker half of a test whose whole
      value is being derived. A type annotation would break the outer regex; a quoted token inside a
      comment ("don't ship \"/billing\" yet") would be read as a covered route. MEDIUM (condition) —
      the walk treats any parenthesised directory as a route group, but (..)photos and @modal are
      intercepting-route markers and parallel-route slots, neither of which is a group; each would
      produce a phantom route.
    status: CONFIRMED
    disposition: >-
      Both conditions met. INTERNAL_ROUTES is now EXPORTED from proxy.ts and imported by the test —
      the regex is deleted, not hardened, which removes the whole class of parsing failure the seat
      described. And the walk refuses @slot and (..)/(...)-style directories with an error that
      explains the convention it does not model, rather than silently inventing a route; probed,
      both fire with that message.
  - seat: tp1-qwen3.8-max
    objection: >-
      LOW — PAGE_FILES omits page.mjs/page.cjs; a symlinked directory reports isDirectory() false so
      pages behind it vanish silently; the "> 10" sentinel is a magic number that will rot. And the
      probe coverage is thin: nothing exercises a directory with BOTH its own page and children, nor
      nested groups, nor a page at the group level.
    status: CONFIRMED
    disposition: >-
      All taken. The extension list covers .mjs/.cjs, symlinked directories are followed after a
      stat, and the sentinel is a named constant. The three missing probes were run: a section with
      both its own page and a child is caught; nested groups (ga)/(gb) resolve to the right segment;
      and a page AT the group level is correctly skipped rather than crashing, which was the one
      behaviour the guard depended on and nothing had checked.
  - seat: tp1-qwen3.8-max
    objection: >-
      STRUCTURAL — the same two walk bugs appearing in a sibling guard and in this test within an
      hour is not a slip. There is no shared, tested walkAppRoutes() utility, so every consumer
      re-derives the App Router's directory grammar from memory and gets the same edges wrong. A
      third consumer will repeat it.
    status: CONFIRMED
    disposition: >-
      Accepted as the correct diagnosis, and NOT fixed here: extracting a shared route-walking module
      is its own concern and this PR is scoped to proxy.ts and its test. Recorded as the follow-up
      with the seat's reasoning intact, because the prediction is specific and testable — the next
      person to write a route walker will get route groups or nesting wrong unless the walk lives in
      one place with its own fixtures. I am the evidence: I wrote it wrong twice in one hour.

