  Refuter: codex gpt-5.6-sol at xhigh, fresh context, read-only, handed the dump and the recompute
  scripts (non-Anthropic family; none of the r4 text is its own). It EXHAUSTED ITS TURN BUDGET
  before writing its findings table, so this is a partial gate: the two findings it did name were
  reproduced on this machine and folded (01122's proof demanded licences from a gesture that writes
  none; the six S3 codes made kg_status_function's manifest unreachable), and §4's derivation rule,
