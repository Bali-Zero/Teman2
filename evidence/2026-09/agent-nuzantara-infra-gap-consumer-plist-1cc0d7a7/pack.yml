dissent:
  - seat: kimi-code/k3
    objection: >-
      PATH prepends ~/.local/bin instead of appending it; on this host that
      shadows /opt/homebrew/bin/codex (0.156.1) with ~/.local/bin/codex
      (0.155.1) and exposes the user-local claude; append would fix the agy
      FileNotFoundError with zero shadowing.
    status: CONFIRMED
    resolution: >-
      The shadowing is real (confirmed on the host) but inert for this
      consumer, measured: after the diff no env value routes
      to codex or claude (GAP_AGENT and REFLECTION are ollama, REGULATION and
      CLAUDE_FALLBACK are agy), ProgramArguments use an absolute venv python,
      and claude lives ONLY in ~/.local/bin so append would expose it
      identically. agy also lives only in ~/.local/bin, so append would work
      too; prepend is kept because it is the mandate's specified shape and
      matches the resolution order #7258 already gives agy at runtime. Flagged
      to the parent session in the report; switching to append is a one-token
      change if the parent prefers it.
  - seat: kimi-code/k3
    objection: >-
      The tests read the repo plist, not the installed
      ~/Library/LaunchAgents copy launchd actually loads, and the diff has no
      install step.
    status: CONFIRMED
    resolution: >-
      True and by design: this seat must not touch ~/Library/LaunchAgents;
      the parent session re-installs the plist after merge, and the live
      proof is observational (the Bites line — the retired-model WARNING
      stops in ~/logs/matagaruda-gap-consumer.log and the Regulation Watcher
      logs "Success via agy"). The tests guard the source of truth against
      regressions; live/repo drift is scar #1 territory and is covered by the
      launchd liveness probes, not by this unit test.

