    ts: "2026-09-14T10:26:07Z"
    seat: claude-opus-5
dissent:
  - seat: codex-gpt-5.6
    objection: >-
      The modal is not semantically a modal — no role="dialog", no aria-modal, no focus trap, no
      Escape handling — and several inputs in the create-client form have a sibling span rather than
      an associated label.
    status: CONFIRMED
    disposition: >-
      Both are real and both are PRE-EXISTING: the modal and the create-client form are not what this
      window restyles, and nothing in this diff made either worse. Curing them is a behaviour change
      to a claim-and-approve flow with a server-side lease, which is a different concern from putting
      the queue on the ledger and does not belong in the same PR. Recorded here as the next thing
      /review needs rather than folded in silently.
  - seat: codex-gpt-5.6
    objection: >-
      The new grid loses the old list's semantics — HairlineGrid emits plain divs, only the header
      carries role="row", and there is no table/grid, columnheader or cell relationship.
    status: CONFIRMED
    disposition: >-
      True, and it belongs to the primitive, not to this page: HairlineGrid lives under
      components/workspace/r19, which this window is forbidden to edit while the K1 seat owns it.
      Carried to that seat as the first thing the grid still owes. What this window could do inside
      its own perimeter it did: every row control now has an accessible name that includes the
      document it opens, so two rows are distinguishable.
  - seat: claude-opus-5
    objection: >-
      The desk strip still clips its own filters, and the page works around it.
    status: CONFIRMED
    disposition: >-
      Re-checked AFTER the rebase onto the v2 primitives: DeskStrip.tsx still gives its filter group
      `overflow-hidden` and its `right` slot `shrink-0`, so at 390 the third filter is still outside
      the box. The page-local scroller is therefore still load-bearing, not a leftover from v1. The
      strip should wrap or scroll its own filters; until it does, this page swipes.
