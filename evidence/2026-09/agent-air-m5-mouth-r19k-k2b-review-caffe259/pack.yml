seat_override: >-
  R8 applicability: presentation of the intake review queue plus one client-side ownership
  predicate. No immigration rule, eligibility, claim or price is authored; no NotebookLM query is
  claimed. Every fixture identity added by this window is synthetic (member@example.test,
  other@example.test, Client 0412). The pre-existing fixtures in page.test.tsx that this window did
  not author (a staff address and a fictional holder name) are left as found rather than widened
  into scope; they are named here so they are not mistaken for something this diff introduced.
receipts:
  - claim: >-
      Copper on /review is now derived from the VIEWER and the RECORD together, and the page proves
      it in the browser, not only in jsdom.
    cmd: >-
      Read apps/backend-rag/backend/app/routers/intake_review.py GET /queue, then render /review on
      `next dev --webpack -p 3191` with the queue fixture carrying one row received by the signed-in
      viewer and one received by a different operator.
    result: >-
      The endpoint's own docstring reads "Admins see the entire queue. A non-admin sees ONLY rows
      from their own chats (intake_queue.received_by == caller) ... NULL-received_by docs are
      admin-only." So the queue an admin loads is GLOBAL and a NO_MATCH row belonging to someone
      else was being painted copper from its status alone. After the cure the render shows the
      viewer's own NO_MATCH row copper "NEEDS YOU" and the identical AMBIGUOUS row received by
      other@example.test muted "ANOTHER OPERATOR", side by side in the same ledger.
    exit: 0
    ts: "2026-09-14T10:25:00Z"
    seat: claude-opus-5
  - claim: The masthead sentence obeys the same law one typographic level up.
    cmd: Render /review with 3 rows of which 2 are the viewer's; read the subtitle.
    result: >-
      It reads "2 of 3 documents are waiting for your decision." Before the cure it read "3
      documents are waiting for your decision." directly above a row the page itself marked
      "Another operator" — a masthead contradicting its own ledger. Pinned by an exact-string
      assertion inside the ownership test, so the sentence cannot drift back.
    exit: 0
    ts: "2026-09-14T10:25:00Z"
    seat: claude-opus-5
  - claim: >-
      The browser found six defects the green suite did not, and all six are cured; the final render
      is clean at both widths in both themes.
    cmd: >-
      Chromium via playwright against `next dev --webpack -p 3191` on this branch. /review with
      every /api/** route fulfilled from synthetic fixtures, full-page capture plus a
      scrollWidth/clientWidth probe at 1440x900 and 390x844 in operative-light and operative-dark,
      plus a per-element bounding-box probe when a width did not resolve.
      Probe: chromium via playwright against next dev --webpack, full-page capture plus a
      scrollWidth probe
    result: >-
      (1) scrollWidth 742 vs clientWidth 390 — five fixed columns summed past the viewport; cured by
      moving Operator and Received onto the row's secondary line below md. (2) Every operator address
      truncated to "member@exam..." at 1440 while the document column sat half empty; cured by
