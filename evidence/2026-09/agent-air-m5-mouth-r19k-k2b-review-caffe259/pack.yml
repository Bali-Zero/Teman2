      scrollWidth to 396; the control now moves onto the row's own line below md, always visible and
      independent of hover. (6) The row reason truncated to "No client matched — needs a d..."; the
      call to act moved to the pill, which is where the colour law wants the WORD anyway.
      Final: CONSOLE_ERRORS=0, scrollWidth == clientWidth at 1440/1440 and 390/390 in both themes.
    exit: 0
    ts: "2026-09-14T10:25:01Z"
    seat: claude-opus-5
  - claim: The no-red guard now catches the class of defect that slipped past it, judged as an entity.
    cmd: npx vitest --run "src/app/(workspace)/__tests__"
    result: >-
      The adversarial seat found a copper FILL surviving on the create-client button
      (`background: var(--bz-accent)`, and --bz-accent is copper on kita) while the guard reported
      /review conformant. The guard gains a copper-fill rule that requires the token to sit INSIDE
