task_id: tg-token-log-hygiene-0927
gear: 2
l_level: L1
gate_class: opus
objective: >-
  Stop Pro's Telegram-sending crons from putting the bot token in cleartext in their own
  logs. The lead measured the token in FOUR log files after redacting them in place:
  daily-briefing.error.log (2 lines), reg-alert.error.log (39), organism.stderr.log (35),
  matagaruda-wr-topic.error.log (1). Traced each job's plist to its script to its actual
  sender rather than trusting a prior repo-wide grep's classification (which had wrongly
  dismissed regulation_alert_agent.py as urllib-based without opening the file).

  Two distinct root causes, both real:
  (1) `daily_briefing_agent.py` and `regulation_alert_agent.py` each built curl's argv as
  `["curl", ..., f"https://tg-bot-api.example/bot{token}/sendMessage", ...]` and caught
  failures with a broad `except Exception as e: logger.error(f"...: {e}")`. A
  `subprocess.TimeoutExpired`'s own `str()` embeds the full argv it was constructed with,
  so a slow curl — no HTTP round-trip needed — put the token in the log. wr_topic_agent.py
  imports and calls daily_briefing_agent's function directly, so fixing that one function
  also closes the fourth leaking log.
  (2) `apps/cell`'s `TelegramAlerter.send()` posts via a shared `httpx.AsyncClient`, and
  httpx logs every request's full URL (Telegram puts the bot token in the URL PATH) at INFO
  via its own `httpx`/`httpcore.*` loggers. `cell/main.py` runs
  `logging.basicConfig(level=logging.INFO)`, so every alert — success or failure — logged
  the token. This is the exact mechanism `apps/backend-rag/backend/core/
  secret_log_redaction.py` already exists to fix, just never applied to apps/cell.

  REWORK (fresh gate on the first head, e5618bb7, returned REWORK-BUILD): the gate's own
  Pro trace confirmed reg-alert and organism were still unfixed at that head (both were
  already fixed by the time the gate's report landed, in commits 2-3 of this branch — the
  gate reviewed a stale head), AND found the identical subprocess+curl+broad-except shape,
  not yet observed leaking but present, in four more mata-garuda/eventbus call sites:
  `sentinel_actor.py`, `run_ai_digest.py`, `infra/eventbus/meta_dispatcher.py`,
  `infra/eventbus/research_sentinel.py` — plus two more with the token in argv but a
  narrower (log-safe) exception path: `tg_tools.py`, `tg_public_tools.py`, and one in a
  third app, `apps/evaluator/nlm_deep_research/db_to_nlm_sync.py`. All seven migrated to a
  curl_send helper (mata-garuda's own, or a duplicate for eventbus, or inline for the
  evaluator single-call-site) in this rework, closing the argv exposure (`ps`/`/proc`)
  everywhere it was found, not only where a leak had already been observed. The gate also
  caught a real over-broad claim in this brief's first draft ("urllib/requests don't embed
  the URL") — corrected: `requests`/`httpx`'s `raise_for_status()` DOES embed the full URL;
  the files actually left alone use stdlib `urllib.request`, whose `HTTPError.__str__()`
  does not, verified per-file rather than asserted as a library-wide rule this time.

  REWORK 2 (re-gate on 784ea015 = REWORK-BUILD, third red on the same cause — sender
  placement vs `scripts/lint_tg_direct_senders.py`): all leaks were already cured and the
  inventory was already true at that head, but the round-2 fix reached green by adding two
  new standalone files (`mata_garuda/tg_curl.py`, `infra/eventbus/_tg_curl.py`) to
  `GATEWAY_ALLOWLIST` — the gate ruled that a policy breach (an allowlisted file becomes a
  permanent invisible local gateway, defeating the register's whole "list only shrinks"
  design). Cure, with zero discretion: `curl_send` moved INTO the two hosts already
  grandfathered before this PR ever touched anything — `mata_garuda/tools/tg_tools.py` and
  `infra/eventbus/meta_dispatcher.py` — and both standalone files were deleted outright, so
  every migrated call site now imports `curl_send` from an existing, already-tracked sender
  instead of a newly-invented one. `python3 scripts/lint_tg_direct_senders.py --prune`
  confirmed exactly the expected 6 files (from this PR's own migrations) as clean under the
  new import path; `--prune` only reports, so `infra/tg-gateway/grandfathered.json` was hand
  -edited to remove precisely those 6 entries (144 → 138) and re-verified against
  `origin/main` as a pure shrink — `GATEWAY_ALLOWLIST` itself is untouched, byte-identical to
  origin/main. The eventbus `curl_send` also gained a one-line failure log (curl exit code or
  generic exception, no token, no body) in place of its previous silent `return False` —
  covered by two new guilt tests asserting the log record never contains the token. Both
  retargeted test files were renamed to match their new host (`test_tg_curl.py` →
  `test_tg_tools_curl_send.py` for mata-garuda, `test_tg_curl.py` →
  `test_meta_dispatcher_curl_send.py` for eventbus) since the module they exercise no longer
  exists standalone.
constraints:
  - >-
    No cross-app imports: apps/mata-garuda, apps/cell, infra/eventbus and apps/evaluator are
    independently deployed and mata-garuda explicitly forbids importing from any other app
    or from apps/backend-rag (its own CLAUDE.md: "MAI importare da apps.mouth,
    apps.backend_rag, apps.*"). The apps/cell redaction filter and eventbus's `curl_send`
    (now living in infra/eventbus/meta_dispatcher.py) are duplicates, not shared imports,
    matching the convention scripts/tg_notify.py documents for itself ("stdlib only, no repo
    imports").
  - >-
    Did not attempt to migrate the repo's other ~230+ direct Telegram senders tracked by
    scripts/lint_tg_direct_senders.py + infra/tg-gateway/grandfathered.json — a separate,
    already-tracked, deliberately incremental cohort migration ("can only shrink"). Touched
    only the four leaking call sites the lead measured plus the identical-shape and
    argv-exposed sites the rework gate additionally traced.
  - >-
    The token is currently dead (401, Telegram rejects it); no rotation performed here —
    operator[secret] action, out of a session's reach per this repo's secrets rule.
acceptance:
  - >-
    WHEN curl_send() raises the exact TimeoutExpired shape the original bug produced (an
    argv literal carrying the token), THEN neither its return value nor anything logged by a
    caller contains the token substring. probe: test_timeout_exception_reason_never_contains_the_token,
    test_real_argv_never_contains_the_token (apps/mata-garuda/tests/test_tg_tools_curl_send.py)
  - >-
    WHEN Telegram returns 401/403, THEN curl_send() reports "credential_rejected (<code>)" by
    status code, never Telegram's free-text body. probe: test_401_reason_never_contains_the_token
  - >-
    WHEN httpx logs an INFO request line carrying `bot<digits>:<secret>`, or CELL's own
    alerter logs an exception whose message embeds the same shape, THEN the redaction filter
    rewrites the record before it reaches a handler. probe: test_httpx_info_line_with_token_is_redacted,
    test_alerter_style_exception_message_is_redacted_via_root_handler
    (apps/cell/tests/test_telegram_redaction.py)
  - >-
    WHEN a message carries no token-shaped substring, THEN it passes through byte-identical
    (no over-match). probe: test_message_without_a_token_passes_through_unchanged,
    test_passthrough_when_absent
  - >-
    WHEN any of the seven newly-migrated call sites (sentinel_actor, run_ai_digest, tg_tools,
    tg_public_tools, meta_dispatcher, research_sentinel, db_to_nlm_sync) sends via its local
    curl_send/curl_send-equivalent, THEN the token is never a member of curl's argv. probe:
    apps/mata-garuda/tests/test_send_telegram_wrappers.py (TgToolsSendTgAlert,
    TgPublicToolsSendPost, RunAiDigestSendTelegram), infra/eventbus/test_meta_dispatcher_curl_send.py,
    apps/evaluator/nlm_deep_research/tests/test_db_to_nlm_sync_telegram_token_not_in_argv.py
  - >-
    WHEN `scripts/lint_tg_direct_senders.py` runs against this diff's tree, THEN it exits 0
    (the CI gateway anti-regrowth check) with NO edit to GATEWAY_ALLOWLIST (byte-identical to
    origin/main). `curl_send` lives in the two hosts already grandfathered before this PR —
    `mata_garuda/tools/tg_tools.py`, `infra/eventbus/meta_dispatcher.py` — the two standalone
    `tg_curl.py`/`_tg_curl.py` files are deleted, and `infra/tg-gateway/grandfathered.json`
    shrank by exactly the 6 files `--prune` named as clean under the new import path (144 →
    138), verified as a pure shrink against origin/main.
  - >-
    WHEN eventbus's curl_send fails (non-zero curl exit or any exception), THEN it logs
    exactly one warning line and that line never contains the token. probe:
    test_timeout_exception_failure_log_never_contains_the_token,
    test_nonzero_exit_failure_log_never_contains_the_token
    (infra/eventbus/test_meta_dispatcher_curl_send.py) — replaces the previous silent
    `return False`.
pii_scan: clean
