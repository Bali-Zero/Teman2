objective: >-
  Slice B5-2 (MANDATE-vo.md): apps/mouth/package.json has no "type":
  "module" (only the monorepo root does), so Playwright's CJS transform
  throws SyntaxError: Cannot use 'import.meta' outside a module the moment
  a spec imports either enumerator script at the top level — a top-level
  import killed --list for the WHOLE e2e suite. Slice B3 v3 needs a plain
  import of these scripts, so the four import.meta sites (HERE,
  DEFAULT_OUT_PATH/DEFAULT_OUT_DIR, main(), the import.meta.url CLI guard)
  move out of enumerate-interview-space.ts and generate-walk-corpus.ts into
  two new files, enumerate-interview-space.cli.ts and
  generate-walk-corpus.cli.ts. The libraries import nothing from their
  CLIs, only the reverse. package.json's two visa-oracle:* script lines
  re-point at the .cli.ts entry points. This is a MOVE, not a rewrite: no
  tsconfig edit, no dependency, no lockfile change, and the re-emitted
  manifest / regenerated corpus change no output byte. B5-2 also gains
  clause Y11 (Y2 ADJUDICATED, GATE-B5-1-REPORT-7068.md,
  2026-09-21T13:18:40Z): a test that for every covering walk labelled
  edge/<id>=<value>, walk.facts[id] === value (and review_gate=<item> for
  review-gate/<item> walks) — the one edge (application_channel=OFFSHORE)
  on which the per-edge witness and the per-question witness disagree.

constraints:
  - "No production source file besides the two named scripts, their two new .cli.ts siblings, package.json (visa-oracle:walk-corpus / visa-oracle:enumerate script lines only, lines 33-34), the DEFAULT_OUT_DIR import specifier in walk-corpus-determinism.test.ts and no-path-doors.test.tsx, the Y11 test added to enumerate-interview-space.test.ts (required by the Y2 ADJUDICATED amendment to this slice, not in the base file list), and this brief.yml. No tsconfig edit, no dependency, no lockfile change (verified: package-lock.json / apps/mouth/package-lock.json untouched by this commit)."
  - "No apps/backend-rag/** file touched — this is a mouth-only PR, confirmed by the commit's own file list."
  - "channelConflictsWithOnshoreIntent import (Slice B5-1) is untouched; this PR only relocates import.meta-bearing CLI code, it does not change any enumeration/coverage/witness logic besides adding the Y11 test."

