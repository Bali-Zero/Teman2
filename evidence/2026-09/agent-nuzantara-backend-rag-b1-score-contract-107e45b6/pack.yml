  - seat: "claude-opus-5 (Dux) vs the staff room's literal ruling"
    status: CONFIRMED
    objection: >-
      The ruling read "the four dense sites declare DENSE_FORMATTED". Implemented
      literally it is DEFECTIVE at one of the four: search()'s single formatter
      call is fed by three branches including hybrid success, so a blanket DENSE
      would have cured a mislabel by minting a new one. The Dux declined the
      literal instruction, declared the departure at checkpoint 8 before the
      reviewer saw the code, and wrote test 13c specifically to fail the literal
      version. The staff room then confirmed the per-branch reading was what the
      ruling meant.
  - seat: "codex (round 2), self-declared limit"
    status: CONFIRMED
    objection: >-
      The reviewer could not run pytest under its read-only sandbox (tiktoken
      needs a writable temp dir) and refused to claim a suite pass. Its SHIP rests
      on isolated execution of the real functions plus the Dux's own suite run —
      recorded as a limit of the review, not papered over.
  - seat: "claude-opus-5 (Dux) vs codex round 1, on one point"
    status: PLAUSIBLE
    objection: >-
      Round 1 called the cache's in-place UNKNOWN stamp a non-defect because
      UNKNOWN means "nothing declared". Accepted for this PR, but it remains an
      in-place mutation of a shared LRU object visible to later readers; if it is
      ever made to write a DECLARED kind it becomes a real defect. Recorded for B2
      rather than silently agreed.

bites:
  consumer: >-
    `calculate_evidence_score` (reasoning_utils.py:610/:662) reached through the
    ORDINARY dense search path — SearchService.search() -> format_search_results
    -> VectorSearchTool -> the reasoning loop. That consumer ships in this PR; it
    is not a future job. Second consumer, same PR: the sealed WA package, whose
    own bytes now carry the provenance (wa_package_builder wire_text).
  observation: >-
    AFTER merge (which is the deploy for apps/backend-rag), run ONE read-only
    in-container probe on the deployed image: perform a search on an existing
    collection and print ONLY the `score_kind` labels of the returned results —
    no document text, no metadata, no ids. Pre-deploy the labels are `unknown` on
    that path; post-deploy they must read `dense_formatted` (or
    `hybrid_rrf_formatted` where the hybrid branch served it). Labels only: the
    observation is a set of vocabulary constants and carries no client data.
  why_not_an_http_probe: >-
    Deliberately not a curl assertion, and NOT because the field is absent from
    the schema — `AgenticQueryResponse.sources` is `list[Any]`
    (app/routers/agentic_rag.py:475), a passthrough that would serve any key it
    is handed. The reason no served byte changes is a key ALLOWLIST downstream:
    `_normalize_citations` (services/rag/agentic/pipeline.py:274-282) rebuilds
    every citation on a fixed set — title/url/collection/score/snippet/metadata —
    so score_kind/score_raw are dropped there, and reasoning.py:1114-1115 /
    :1707-1708 replace state.sources with that projection BEFORE the response
    (agentic_rag.py:712) and before the SSE `sources` event (reasoning.py:1724).
    The grep over app/routers/ and app/schemas/ returns zero hits and is true,
    but it is NOT the load-bearing fact; the allowlist is. This correction is the
    fresh gate's (NOTICE 2) — the Dux's original wording gave a true conclusion
    for a false reason, which is the kind of evidence that teaches the next reader
    the wrong lesson.
  degraded_path_residual: >-
    DECLARED, not assumed. The allowlist is bypassed where `self.response_pipeline`
    is falsy or the pipeline raises (reasoning.py:1697 guard, :1709 except
    ValueError/RuntimeError/KeyError): there state.sources stays the raw tool
    projection from tools.py:280-291 and the two keys DO reach the wire,
    additively. Payload is BOUNDED: score_kind is one of the 7 closed-vocabulary
    literals (stamp raises ValueError on anything else,
    core/score_provenance.py:133-136) and score_raw is a float or null
    (raw_of, :118-122), sitting beside the `score` that path already served
    pre-PR, alongside title/url/doc_id/collection/snippet (tools.py:293). Knowledge
    corpus — visa/legal/KBLI — not client records: no PII and no new information
    class crosses the output boundary. UNVERIFIABLE and not guessed: how often
    response_pipeline is absent or raises in production was NOT measured (the gate
    is read-only and read no logs).
  second_observation_deferred: >-
    The sealed-package half cannot be observed without real traffic: wa_outbox
    holds only terminal rows, newest 2026-09-01, pending 0. When the next real
    package is built, its stored bytes contain score_kind. Declared as deferred
    rather than asserted now.

evidence_extraction:
  why: >-
    The committed artifacts were the RAW CLI traces — 1.28 MB of 1.29 MB, ~20161
    of the PR's 21860 insertions, mostly exec echoes and repeated
    "git: warning: confstr() failed" noise around ~200 lines of actual judgement.
    The Dux raised this against its own commit before pushing; the staff room
    ruled that "preserve it" meant durability, not a megabyte of CLI noise in git
    history forever. The fresh gate independently measured the same thing
    (NOTICE 1) and made the replacement a pre-push condition.
  command: >-
    awk '/^Riferimenti relativi a|^Revisione dei due diff/{s=NR} {l[NR]=$0}
    END{for(i=s;i<=NR;i++) print l[i]}' <full-trace> > <extract>
  mechanical_not_editorial: >-
    Marker-anchored, last-occurrence to EOF. Nothing is hand-picked and nothing
    the reviewer said is dropped from the report body — including the 12 lines
    where round 2 re-checks `git status` to show it changed nothing, which stay
    because removing them would be curation.
  reproducible: >-
    Re-run the command on the full trace at full_trace_path and the result must
    hash to artifact_sha256. Both digests are recorded above, so the extract can
    be checked against the trace and the trace against what the reviewer emitted.
  kg_entity_note: >-
    NOTICE 4 from the gate: core/score_provenance.py:70's KG_ENTITY is vocabulary
    with no writer yet. That is deliberate scoping, not an oversight — the
    inventory declares the KG fast path as `unknown` rather than claiming it is
    covered, and the constant is reserved for B2.

gear_floor_correction:
  what: >-
    The brief and pack declared gear 2. CI's "Harness floor recompute" computed
    the deterministic floor as 3 and went RED. Corrected to gear 3 — which is the
    ACCURATE declaration, not a number picked to green a gate: what was actually
    done here is Gear-3 shaped (two independent adversarial rounds, a REWORK with
    a confirmed BLOCKER, mutation-proof on every new assertion, a fresh Opus 5
    gate outside the chain), and Gear 3's effort requirement is xhigh, which is
    what this mandate has run at from the open. Declaring 2 understated the work.
  floor_source: >-
    "size", NOT a hot-zone path — 1883 net lines (1863 + 20). Reproduced locally
    in CI's exact shape before believing the message: `--print-floor` WITHOUT
    `--numstat-file` prints floor 1 source "none"; WITH it, floor 3 source "size".
  gate_effort_deviation: >-
    DECLARED, not hidden. The fresh Opus 5 gate signed PASS on fbcb10fd3c running
    at the SUBAGENT DEFAULT effort — this session dispatched it with the model
    pinned to Opus 5 and did NOT set an effort override, so "max" cannot be
    claimed and is not. Gear 3 normally binds the final gate to max effort; here
    the floor was raised to 3 by SIZE *after* the gate had signed, not by
    hot-zone risk, and the staff room accepted the deviation on that basis. No
    re-run: the gate's own receipts (seven pytest runs incl. random order, the
    base-sha literals re-derived independently, four self-chosen mutations, two
    null runs declared) are what the signature rests on, and the code they
    covered is byte-identical to what ships.
  fleet_finding_two_traps: >-
    Both cost this session time and will bite the next lane. (1) `evidence/brief.yml`
    still exists at repo ROOT, tracked on main from #6082 and belonging to a
    DIFFERENT lane; `evidence_pack_lint.py` run bare reads THAT file, so it kept
    reporting "declared 2" after this PR's own brief had been changed to 3. CI is
    unaffected — `scripts/ci/evidence_paths.py --resolve brief
    --changed-files-file` resolves the per-PR brief — but a human or agent
    debugging locally is measuring another lane's declaration. (2) The lint reads
    the COMMITTED brief, not the working tree: an uncommitted correction is
    invisible to it, which reads exactly like "my fix did nothing".
