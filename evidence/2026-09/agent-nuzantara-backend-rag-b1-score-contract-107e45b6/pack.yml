result: >-
  Every score that can reach `calculate_evidence_score` now declares what it IS
  (`score_kind`) and what its writer consumed to produce it (`score_raw`), on
  every path, with no number moved and no served behaviour changed. The sealed
  package carries that provenance inside its own bytes, so the scorer provably
  receives the provenance that was sealed.

measured:
  fusion:
    server: "qdrant 1.16.3 (prod), read-only probe, one existing point's own stored vectors"
    formula: "sum over contributing lists of 1/(2 + rank0)"
    exact_rows: 10
    k60_one_based_refuted_rows: 10
    prefetch_limit: 30
    hybrid_formatted_band: [0.5082, 1.0] # AT prefetch_limit=30, not universally
    dense_formatted_band: [0.5, 1.0]
    artifact: measured-fusion-table.md
    band_is_conditional: >-
      CORRECTION (Codex round 1, finding 8's tail): the 1/31 fusion floor is NOT
      general. search_service.py:1272 calls hybrid_search with limit*3 and
      hybrid_search itself sets prefetch_limit=limit*3, so the reranking path
      overfetches 9x and P exceeds 30 whenever limit > 3. The measured band above
      holds AT prefetch_limit=30; a deeper prefetch lowers the raw floor.
    f_b1_1a_survives_any_prefetch: >-
      The finding does not depend on the band: formatted = 1/(2 - s) with fusion
      s > 0 is strictly above 0.5 for every prefetch depth, so
      reasoning_utils.py:665's `0 < top_source_cosine < 0.5` guard is unreachable
      on every hybrid path regardless of P.
  finding_F_B1_1a: >-
    `reasoning_utils.py:665`'s guard `0 < top_source_cosine < 0.5 and
    final_score > 0.15` cannot be entered from any live path, because every
    live producer lands at or above 0.5 after the formatter. The
    semantic-alignment penalty is dead code in production. Measured, not read.
    Not touched by this PR (the file is read-only here); recorded for B2.
  outbox_in_flight:
    failed: 241
    done: 179
    pending: 0
    generating: 0
    newest: "2026-09-01T09:27:53Z"
    conclusion: "no package in flight; the §4(d) digest STOP is not triggered"

