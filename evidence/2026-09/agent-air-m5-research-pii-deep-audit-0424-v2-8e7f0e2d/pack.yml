diff:
  behaviour_change: >-
    Deletes six client-PII data files from research/compliance/ on a public repo (3 jsonl under
    deep_audit_2026-04-24/, 3 xlsx at the directory root), all six added by the same commit
    bdc62bbf59 (PR #258, 2026-04-25). No code behaviour changes: the two consumer scripts that
    reference these exact paths (scripts/crm_guardian_apply.py's PLAN_FILE,
    scripts/crm_guardian_deep_audit.py's PARTIAL_FILE/SKIPPED_FILE) are untouched — both already
    degrade gracefully on a missing file, verified below. Extends .gitignore with three patterns
    covering the two producers' output shapes (research/compliance/deep_audit_*/*.jsonl,
    research/compliance/deep_audit_*/run.log, research/compliance/*.xlsx) so neither can be
    re-promoted by a future run.
  surface: >-
    research/compliance/ data files + .gitignore + this evidence pack. No backend, no frontend,
    no migration, no credential. Supersedes PR #7447 (gate verdict REWORK-BUILD: left the three
    xlsx on main, and declared gear 2 against a measured floor of 3).

