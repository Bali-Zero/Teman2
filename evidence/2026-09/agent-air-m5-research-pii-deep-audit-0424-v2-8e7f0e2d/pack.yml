seat_override: >-
  R9 council quorum (2 distinct COUNCIL_REVIEW_SEATS in a journal.jsonl) not convened. Per
  modus SKILL.md's anti-sperpero rule, council is not automatic at Gear 3 — only when divergent
  priors can change the answer AND error costs exceed 15x tokens AND the work has genuine
  parallel breadth. This PR is a mechanical, well-specified data removal (delete 6 already-
  identified PII files, extend one .gitignore pattern) reaching Gear 3 purely on the CI size
  floor (net churn 1871 lines, almost all jsonl deletions), not on architectural ambiguity. One
  independent cross-family reviewer (Codex CLI, role: review below) ran its own read-only
  verification against the actual staged diff and returned LGTM with three LOW findings,
  recorded under `dissent:`, matching the Gear-2 "1 red-team spalla" convention instead of a
  full council.

