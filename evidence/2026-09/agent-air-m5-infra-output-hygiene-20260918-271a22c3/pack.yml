brief_ref: evidence/brief.yml
plan_ref: >-
  One concern: output_hygiene_guard.py, a new PreToolUse Bash hook that denies (never rewrites)
  8 unbounded output shapes (ls/eza over a large directory, cat/bat of a large file, git log
  without -n/--max-count, git diff/show without a --stat-family flag, find without -maxdepth,
  grep -r/rg without -l/-c/-m, a verbose test-runner call, tail -f/-F) unless a downstream
  bounding stage (head/tail/cut/wc/grep -c/sort|uniq -c/awk/sed -n/jq/python3 -c) or a redirect
  to a file is already present, with quote/heredoc stripping so a guilty shape sitting inside a
  quoted string or heredoc body is judged as text, not a live command, and an ssh/scp/rsync
  first-stage exemption for remote dispatch. Fixes the 2026-09-18 incident (Zero, "una follia"):
  two accidental full-context dumps in one session, `ls ~/.nuzantara-mailbox` (700+ entries) and
  a bare read of `evidence/2026-09` (300+ entries), each re-read by every later turn once in
  context.

  Consumer: `~/.claude/hooks/output_hygiene_guard.py`, to be installed in the PreToolUse Bash
  matcher of `~/.claude/settings.json` on M5 and Pro by the shipping session after this PR
  merges — this diff prepares the guard and its tests, it does not itself arm the live hook.
  Observation once armed: `ls ~/.nuzantara-mailbox` from a session is refused with the entry
  count named in the denial message; `ls ~/.nuzantara-mailbox | head -5` passes unchanged.

lanes:
  - lane: output-hygiene-guard
    role: build
    seat: >-
      claude-sonnet-5 (this session, air-m5). Wrote infra/claude-hooks/output_hygiene_guard.py
      (a new PreToolUse Bash guard, no subprocess calls, fails open on any exception, kill switch
      NUZ_OUTPUT_HYGIENE_OFF=1) plus its own guilt+innocence test file
      (infra/claude-hooks/test_output_hygiene_guard.py) and a guard-conformance registry.json
      entry naming both. Also registered the same fixture set inside the shared vaccine
      (infra/claude-hooks/test_hook_innocence.py) for cross-hook regression coverage, and added a
      home-fork declared-pair entry (infra/home-fork/declared-pairs.json) for the new hook's
      live-vs-repo drift lint. On team-lead's instruction, a separate follow-up commit
      (33cd519e6a) removed this branch's own edit to
      .github/workflows/hook-innocence-gate.yml (which had added
      infra/claude-hooks/test_output_hygiene_guard.py to that workflow's explicit standalone
      test list) for a later PR, after confirming the new guard's fixtures are already exercised
      by the vaccine run without that workflow edit (the fixtures live inside
      test_hook_innocence.py itself, not gated by the workflow's file list).

