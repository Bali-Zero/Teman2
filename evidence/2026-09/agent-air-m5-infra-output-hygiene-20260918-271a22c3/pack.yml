residual_risks:
  - >-
    THE FIRST ON-DISK GATE (Opus 5, 2026-09-18, head bd0a9a131a) RETURNED REWORK-BUILD with six
    concrete findings, all cured in the follow-up commit and now pinned as guilt/innocence cases
    in both suites: over-match on `ls` at a 69-entry repo root (threshold raised 60 -> 150), on a
    range-bounded `git log --oneline origin/main..HEAD` (a `..` range is now an own-bound), and on
    `rg pat <one-file>` (named existing files are not a flood); under-match on `ls X 2>/dev/null`
    (a stderr redirect was read as a bound; only a stdout redirect counts now), on `ls -R apps`
    (recursive listing is now denied regardless of the top-level count), and on
    `python3 -m pytest <dir>` (the python -m form now matches the test-runner shape). The
    threshold of 150 is a judgement: a repo root or a hooks directory sits at 69-76 entries, the
    two incidents that motivated the guard sat at 300+ and 957. GATE ROUND 2 (head abae8f514b)
    confirmed the six cures hold and returned REWORK-BUILD again on two over-matches OUTSIDE the
    round-1 surface (`git show -s`/`--no-patch`, `git diff --quiet`/`--exit-code`/`--check`:
    flags that print no patch are now own-bounds) and one under-match (`npx vitest`/`npx jest`:
    a package-runner prefix now matches the test-runner shape). Both are pinned in both suites.
    Depth rule: this is the last cure round — a further over-match on an everyday command means
    the shape list is under-specified and gets a written spec, not a third patch.
  - >-
    NO INDEPENDENT ADVERSARIAL REVIEW ROUND is claimed in this pack. This is a single-build-lane,
    Gear-2 change with the four proof commands team-lead specified run and quoted verbatim below
    — the productive attack surface team-lead should still weigh before treating this as shipped:
    does quote/heredoc stripping actually run before pattern matching (over/under-match,
    cicatrix #3), and is the ssh/scp/rsync exemption scoped narrowly enough that it cannot
    launder a local unbounded dump through a no-op remote wrapper.
  - >-
    THE LIVE HOOK IS NOT ARMED BY THIS PR. `~/.claude/hooks/output_hygiene_guard.py` and its
    registration in `~/.claude/settings.json`'s PreToolUse Bash matcher on M5 and Pro are
    installed by the shipping session after merge (per `infra/claude-hooks/install_mailbox_hook.sh`'s
    own pattern for a prior hook) — everything in this pack is local test/script evidence, not a
    live-session observation of a real denial yet.
  - >-
    Latency (14.3ms allow-case, 13.5ms deny-case, this pack's own measured run below) is a
    single-machine (M5), single-run, no-concurrent-load figure — not an independently repeated
    benchmark and not measured on Pro.
  - >-
    The workflow-wiring half of this change (naming
    infra/claude-hooks/test_output_hygiene_guard.py inside
    .github/workflows/hook-innocence-gate.yml's own explicit test list) was deliberately dropped
    from this branch for a later PR, per team-lead's instruction — confirmed non-blocking because
    the new guard's fixtures are already registered directly inside test_hook_innocence.py and
    the 145-case vaccine run below already exercises them without that workflow edit.

