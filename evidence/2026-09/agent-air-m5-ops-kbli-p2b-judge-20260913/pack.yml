dissent:
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: >-
      Round 4, finding (2) — carried as CONFIRMED AND UNFIXED for one round, CURED in round 5.
      `record_slice` supplied the CANONICAL `per_skala` rows (first six) for every code in
      `package_codes`, but `package_codes` records code identity only, not how much of each record
      the app actually served — a code included as a session anchor can be served with
      `per_skala.rows = []`. An answer inventing a requirement from an UNSERVED row therefore read
      as supported, and floor (ii) was over-permissive by exactly that much.
    retraction_evidence: >-
      The cure is the one this entry itself named: the RUNNER declares what it served, and the
      scorer consumes that declaration instead of assuming a slice.
      APP (kbli-navigator-app, commit 29805ec): `KBLIContextPackageBuilder.FieldMap` is an
      optional, additive out-parameter filled from the builder's own reduction
      (`Result.rowsIncluded` / `rowsTotal`); `Tests/benchrunner` emits `package_fields` beside
      `package_codes`. MONOREPO: `record_slice(rec, per_skala_rows)` trims to the declared extent,
      and `cmd_prompts` trims a code ONLY when every run that saw it declared a count — otherwise
      the extent is unknown and `PER_SKALA_EXTENT_NOTE` says so to the judge instead of crediting
      canonical rows silently. No second implementation of the byte budget exists in Python.
      Proved end to end in this session, producer to consumer, not by construction:
      `packagetest` measured the REAL builder declaring 01140 at 8 of 8 rows and cross-checked
      that count against the rows the built prompt actually carries; a row in that exact shape fed
      to `cmd_prompts` supplied the judge 8 rows for 01140 instead of the canonical 6.
      Tests: `test_council_r5_an_unserved_per_skala_row_is_not_ground_truth` (guilt, 0 rows
      served -> `per_skala == []`) and `test_council_r5_innocence_the_rows_actually_served_are_supplied`
      (innocence, 3 rows -> 3 rows; one silent run -> extent unknown, canonical slice, gap
      declared). Both were RED before the fix and are green after.
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: >-
      Round 4, findings (5) and (6): the free-text moratorium guard rejected an en dash in
      "Medium–Low", and its forbidden-total check missed 518 expressed as "activities" instead of
      "KBLI". Round 4 answered them by withdrawing the guard's AUTHORITY (report-only) rather than
      patching a regex a fourth time, on the ground that three rounds of the same cause is the
      suspension condition. That was right about the AUTHORITY and wrong about the residue: the
      artifact the mandatory hand-check reads kept saying `decidable_pass: false` about a correct
      answer, and `quotes_a_moratorium_total: []` about a forbidden one.
    retraction_evidence: >-
      Cured in round 5, and NOT by re-entering the semantic swamp. Both residues are token-level,
      which is the half the guard kept: a dash is a codepoint and a noun is a word. `DASH_FOLD`
      folds every dash-shaped codepoint to `-` ONCE during normalisation, so no criterion carries
      its own dash alternation; `COUNTED_NOUN` widens the noun beside a forbidden total to
      activities / kegiatan / bidang usaha / sektor. Neither touches permanence or universality —
      those stay deferred to the judge exactly as round 4 left them.
      Reproduced before fixing: `moratorium_scope_check` on "Low and Medium–Low" returned
      `names_medium_low_risk_class: False`; on "... Total affected activities: 518." it returned
      `decidable_pass: True`. Tests: `test_council_r5_a_unicode_dash_inside_medium_low_is_still_the_class`
      (5 dash codepoints), `test_council_r5_a_forbidden_total_counts_whatever_noun_it_wears`
      (4 phrasings), each with its own INNOCENCE twin — naming only the Low class still fails, and
      an unrelated 518 or 48 is still not a total. 11 of these assertions were RED first.
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: >-
      Round 4, findings (1), (3) and (4): `KBLIVerdict.riskVerdict` takes the FIRST Besar row;
      `score_p2b.py` infers `n_runs` from the largest observed row count, so a uniformly missing
      run reads complete; and `gate` ignores `run_integrity`.
    refutation_evidence: >-
      All three were real when the seat measured them and all three were already cured BEFORE
      round 5 opened — the seat reviewed `d602355522` (12:15) and the cures landed at 18:01. They
      are refuted against THIS head, not against the seat.
      (1) app commit 26659ec: `riskVerdict` takes the highest-ranked Besar row across OSS scopes.
      Verified by running the suite in this session against the run-anchored dataset (3dafab17):
      `Tests/verdicttest` printed "the HIGHEST Besar row wins across scopes, never the first",
      its INNOCENCE twin "Besar still governs — the rule is 'highest BESAR', not 'highest row'",
      "01140 on this dataset reads risk Tinggi", and ALL VERDICT TESTS PASSED.
      (3) and (4) monorepo commit 1f97f5bbf1: `n_runs` is read from
      `corpus.meta.runs_per_question` or `DESIGN_RUNS_PER_QUESTION` and never inferred, and
      `gate = all(floors) and integrity["complete"]`. Tests already in the suite and green:
      `test_council_r4_a_uniformly_missing_run_is_not_complete`,
      `test_council_r4_a_synthesized_row_fails_the_gate`.
      One dead branch the round-4 cure left behind — a duplicated `elif jv:` in `cmd_score` — was
      removed in round 5. It changed no outcome; it is recorded because it was there.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    needs_input: true
    objection: >-
      Round 5, finding (1) — A COUNT DOES NOT NAME A SET. Verbatim: "`FieldMap` dichiara soltanto
      il numero di righe, ma il builder riordina `per_skala` mettendo prima quelle corrispondenti
      alla domanda; lo scorer assume invece che siano le prime N righe canoniche. Input concreto:
      KBLI `46710`, domanda `bahan bakar gas cair`, count `4`. Il builder seleziona prima le righe
      canoniche 5-8, rischio `Tinggi`; lo scorer espone 1-4, scope 'Minyak Pelumas', rischio
      `Rendah`. Può quindi accreditare una fabbricazione su righe mai servite e dichiarare
      fabricated un fatto realmente servito."
      ACCEPTED AS REAL. `selectPerSkalaRows` orders question-matched rows first, so a count is not
      an index range. Round 5 did NOT cure it: it narrowed the trim to the two counts that settle
      the set regardless of order (0 and all), so the 46710 case is no longer acted on at all —
      it falls into the declared-unknown path. The cure the finding asks for is for the runner to
      declare row IDENTITY, not row count, and that is a NEW contract on both sides. Depth 1 is
      spent; this is the imperator's call.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    needs_input: true
    objection: >-
      Round 5, finding (2) — THE REDUCTION GOES ONE LAYER DEEPER THAN THE ROW. Verbatim: "anche
      l'identità corretta della riga non basta, perché il builder limita `persyaratan`/`kewajiban`
      ai primi sei elementi, mentre lo scorer consegna al giudice la riga raw completa. Input
      concreto: `01140`, una riga dichiarata servita, risposta che inventa `Melakukan pencatatan
      data benih yang diproduksi dan diedarkan`, elemento 14 della prima riga. Il modello non lo ha
      visto, ma il giudice sì e può accreditarlo."
      ACCEPTED AS REAL and it is INDEPENDENT of finding (1): `KBLIRecordReduction.reduceRow` caps
      those two lists at `perRowListItemCap = 6` and clips a long item, so even a fully served row
      is not fully shown. Round 5 did not cure it and does not claim to; `PER_SKALA_EXTENT_NOTE`
      now DECLARES it to the judge in as many words. It is a sibling of the original finding (2),
      not a regression of round 5, and it was over-permissive before round 5 too.
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: >-
      Round 5, finding (4) — THE WIDENED NOUN SET OVER-MATCHES. Verbatim: "`COUNTED_NOUN` non
      richiede alcun indicatore di totale; qualunque `518` o `48` entro 40 caratteri da un noun
      viene vietato. Riprodotti come falsi positivi: `Foreign ownership is allowed in 48% of
      sectors.`, `See page 518 for affected activities.`, e `Form 48 applies to these
      activities.`"
      ACCEPTED, and answered by withdrawal rather than by a second patch: the widening is gone and
      `COUNTED_NOUN` is back to `(kbli|kode|codes?)`. All three counter-examples now pass, and they
      are pinned as INNOCENCE cases in
      `test_council_r5_innocence_a_number_near_a_noun_is_not_a_total`. The round-4 under-match
      returns with it, and is pinned too — as a DECLARED GAP, by
      `test_council_r5_the_forbidden_total_under_match_is_DECLARED_not_cured`. This surface has
      now produced five different free-text defects in five rounds; what it needs is a written
      definition of "quoting a total", not a sixth alternation.
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: >-
      Round 5, finding (3) — the unknown-extent declaration was one-directional: it warned that a
      supplied row might not have been served, but not that a served row might be missing from
      the canonical slice, so a fact the model really saw could be judged fabricated.
    retraction_evidence: >-
      Corrected in the same round, in the note only and not in behaviour:
      `PER_SKALA_EXTENT_NOTE` now says the canonical list "is not the served set in either
      direction: it may contain rows the model never saw, and it may omit rows it did see, because
      the product orders question-matched rows first", and tells the judge to treat it as context
      rather than proof. Pinned by
      `test_council_r5_a_partial_count_is_never_trimmed_because_it_names_no_set`.
  - seat: tp1-qwen3.8-max
    status: RETRACTED
    objection: >-
      Round 5, finding (2): `PER_SKALA_EXTENT_NOTE` over-claimed ignorance. The record is shared
      by all runs and is adjusted to the WIDEST extent any run declared, so with run 1 at 8/8 and
      run 2 at 3/8 the judge receives all eight rows while the note asserts the extent is unknown.
    retraction_evidence: >-
      Accepted and corrected in the note, behaviour unchanged: it now opens with "THE RECORD IS
      SHARED BY ALL RUNS AND THE MAP IS PER RUN", says the record is adjusted to the widest known
      extent, and says a given run is bounded by its OWN `served_per_skala_rows` and never by the
      record. Pinned by an assertion inside
      `test_council_r5_innocence_the_rows_actually_served_are_supplied`.
  - seat: tp1-qwen3.8-max
    status: RETRACTED
    objection: >-
      Round 5, finding (1): `run_integrity`'s `isinstance(k[1], int)` is False for a JSON float,
      so an answers file re-serialised with `"run": 1.0` marks every row synthesized and the gate
      goes unconditionally red on "a legitimate complete run".
    refutation_evidence: >-
      The premise fails twice. There is no producer: the only writer of these rows is the app's
      `Tests/benchrunner`, whose `BenchLine.run` is a Swift `Int` and encodes as a JSON integer —
      read in this session at `Tests/benchrunner/main.swift`, `let run: Int`. And a float run
      number is not a legitimate row: the row contract says the run index is an integer in
      1..expected_runs, so rejecting it is the guard doing its job. The check is also round-3
      surface (council round 3, codex-gpt-5.6-sol: a run number outside the range is synthesized),
      untouched by round 5.
  - seat: tp1-qwen3.8-max
    status: CONFIRMED
    objection: >-
      Round 4 returned OK at `--effort medium` after `--effort high` exhausted the 880-second
