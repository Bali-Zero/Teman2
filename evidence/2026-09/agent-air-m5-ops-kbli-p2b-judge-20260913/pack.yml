appetite_exceeded: >-
  Budget was 8 active hours for the whole window (app + monorepo), spent ~9 through round 4 and
  ~1 more in round 5. Cause: five adversarial council rounds instead of one, and a full re-judge
  of BOTH 87-row runs after the layer-3 hand-check found the judge-harness defect that was
  inverting three questions. Declared, not hidden.
open_findings_for_the_imperator: >-
  Round 5 was the depth-1 final round and it did not close. Two findings from codex-gpt-5.6-sol
  are REAL and OPEN, both on the same seam and neither fixable inside depth 1:
  (1) the runner must declare row IDENTITY, not row count, because the builder puts
  question-matched `per_skala` rows first and a count therefore names no set (46710 /
  "bahan bakar gas cair" / count 4 => canonical rows 5-8, not 1-4);
  (2) `reduceRow` caps `persyaratan` and `kewajiban` at the first six items, so even a fully
  served row is not fully shown, and the judge holds the whole list.
  Both are now DECLARED to the judge in `PER_SKALA_EXTENT_NOTE` rather than silently credited,
  which makes the harness honest about the gap without pretending to have closed it. Deciding
  whether to open a window for the identity contract is the imperator's call, not this seat's.
