  - seat: claude-opus-5 (self, generator declaring against its own work)
    status: CONFIRMED
    objection: >-
      This PR's own consumer measured a REGRESSION it did not cause and a floor it did not move.
      Floor (i) went 0/87 -> 1/87 and Q23 went correct x3 -> wrong x3 on an identical package;
      floor (iv) is 19/21 in both runs and did not move at all. The scorer is more honest and the
