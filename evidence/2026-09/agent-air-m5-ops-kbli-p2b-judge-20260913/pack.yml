    seat: claude-opus-5 (Dux of SAETTA-KBLI window W-alpha, M5 worktree)
    note: >-
      Two defects of METHOD in the P2b harness, both measured on the 2026-08-20 run and neither of
      them in the product. (1) The judge was fed `expected.codes` while the model had answered from
      `package_codes`, so a true statement about a code the model was actually served read as
      invented. Ground truth is now expected.codes UNION the codes served in THAT run, with a
      `ground_truth_provenance` block naming the rule and a `DERIVED_FIELDS_NOTE` telling the judge
      which fields of the served package the product DERIVED rather than read. (2) Q23 passed for a
      reason unrelated to what it measures: the corpus gives it no expected codes and its
      acceptance was left to the judge's discretion. Its class rule is now written down — the
      Gubernur letter B.27.000/642/PM/DPMPTSP, the effective date 2026-05-13, both risk classes,
      and the forbidden quotation of a code total — as four token-decidable criteria that REPORT
      and never overwrite a verdict. Plus: the four floors emit numerator/denominator/threshold,
      the runs-per-question is DECLARED (3) and never inferred, and a row is classified into
      answered / empty_answer / timeout / parse_failed / transport_error / model_refusal /
      package_not_built instead of collapsing into one "error" string.
