dissent:
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      Round 4, finding (2), ACCEPTED AND NOT FIXED — confirmed as a real defect and left open. `record_slice` supplies the CANONICAL
      `per_skala` rows (first six) for every code in `package_codes`, but `package_codes` records
      code identity only, not which reduced fields the app actually served — it can serve a record
      with `per_skala.rows = []`, e.g. a session anchor. An answer inventing a requirement from an
      UNSERVED field can therefore read as supported, which makes floor (i) potentially
      OVER-permissive. Not fixed here because the only honest cure is for the RUNNER to emit a
      field map beside `package_codes`; re-deriving the app's field reduction a second time in
      Python would be the very "two implementations of one rule" defect the product half of this
      window exists to abolish. Its blast radius on this run is not even measurable from the
      artifacts — the answer rows carry `package_codes` and `package_bytes` and no field map,
      confirmed by reading a row's keys in this session.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      Round 4, findings (5) and (6): the free-text moratorium guard rejected an en dash in
      "Medium–Low", and its forbidden-total check missed 518 expressed as "activities" instead of
      "KBLI". These were the FOURTH round of the same cause — a regex adjudicating a semantic
      claim (round 1: a negated temporariness phrase; round 2: polarity leaking across a
      conjunction; round 3: `sementara` as the Indonesian conjunction "while"). Three reds for the
      same cause suspends, and a fix-of-a-fix stops at depth 1, so the guard was not patched a
      fourth time: its AUTHORITY was withdrawn. It now emits four token-decidable criteria plus
      `deferred_to_judge` and a `deferral_reason`, and never overwrites a verdict. The semantic
      criteria go to the judge verbatim and the gap is declared in the output.
  - seat: tp1-qwen3.8-max
    status: CONFIRMED
    objection: >-
      Round 4 returned OK at `--effort medium` after `--effort high` exhausted the 880-second
      budget with the seat still generating. The OK is real and the transcript is beside this
      file, but it was produced at a lower effort than rounds 1-3 and this pack does not pretend
      otherwise.
  - seat: claude-opus-5 (self, generator declaring against its own work)
    status: CONFIRMED
    objection: >-
      This PR's own consumer measured a REGRESSION it did not cause and a floor it did not move.
      Floor (i) went 0/87 -> 1/87 and Q23 went correct x3 -> wrong x3 on an identical package;
      floor (iv) is 19/21 in both runs and did not move at all. The scorer is more honest and the
      product is not yet better on three of four floors. Nothing here was widened to make a number
      green, and the pack states the red instead of the direction of travel.
