result: >-
  Every wa_outbox row is bound to the one inbound message it answers (migration 318), the
  webhook writes that binding at enqueue time inside the transaction that creates the inbound
  and the stub, coalescing is removed, and a thread's rows are served one at a time oldest
  first via a partial index the claim SELECT reads. Two council rounds on two families produced
  five real cures; the most important came from the constructive seat and is a regression this
  change itself introduces — with bursts no longer coalesced, a fully failed burst would have
  sent the client one apology per row.

