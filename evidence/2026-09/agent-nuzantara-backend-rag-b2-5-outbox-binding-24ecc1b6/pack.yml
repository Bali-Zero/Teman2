dissent:
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: "BLOCKER: nothing in the diff writes inbound_message_id, so every row falls back to the legacy heuristic and the retry-to-latest-message defect stays alive."
    resolution: >-
      False. whatsapp_chat.py:1321-1330 passes it explicitly in the enqueue INSERT. The lane that
      raised it did not carry that file — the false positive is an artifact of how I SPLIT THE
      DIFF for review, a defect in my instrument rather than in the change: I separated the
      producer from the consumer and then asked whether the consumer had a producer. Recorded so
      the next reviewer is not handed the same broken frame.
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: "BLOCKER: the legacy-row derive can pick a NEWER inbound than the row's real cause, because concurrent webhooks can interleave their ids."
    resolution: >-
      Not for the same thread. whatsapp_chat.py's `INSERT INTO meta_inbox_threads ... ON CONFLICT
      (counterpart_phone) DO UPDATE ... RETURNING` takes a row-level lock held until COMMIT, so
      concurrent webhooks for one phone serialize and ids come out inbound1 < stub1 < inbound2 <
      stub2; the derive filters on thread_id. Measured blast radius: 0 pending rows in prod. The
      guarantee was real but UNDECLARED, which is the part worth keeping — it is now named in a
      comment at the derive and pinned by a test that AST-reads whatsapp_chat.py's real source,
      proven non-vacuous by mutation.
  - seat: codex-gpt-5.6-sol
    status: RETRACTED
    objection: "MAJOR: one transaction holding ACCESS EXCLUSIVE through VALIDATE and a non-concurrent index build can turn this into an application outage."
    resolution: >-
      wa_outbox is 446 rows in production, measured. VALIDATE plus a non-concurrent index build
      on 446 rows is milliseconds, and single-transaction is this runner's convention for every
      file in migrations_v2 — not a choice made here.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: "BLOCKER: the CHECK permits a failed row to carry a NULL reason; add CHECK (status <> 'failed' OR reason IS NOT NULL)."
    resolution: >-
      A genuine improvement that would make the ledger invariant structural rather than
      conventional, and it is NOT shippable here: production holds 233 failed rows with a NULL
      reason, so the constraint would fail the migration outright. It needs a deliberate backfill
      — its own concern, its own PR. PENDING-ARMS row at mission close.
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "MAJOR: with coalescing removed, a burst whose rows all exhaust their retries sends the client one apology PER ROW, and an earlier apology can precede a later row's working answer."
    resolution: >-
      Correct, and it is a regression this PR introduces rather than a pre-existing one — the
      apology is live by default (WA_OUTBOX_TERMINAL_APOLOGY_ENABLED defaults ON). CURED:
      _maybe_send_apology now suppresses the CLIENT send when a newer row of the same thread is
      still live, so only the last row of a failing burst apologises. The human Telegram alert is
      deliberately left unsuppressed and fires first — a colleague must hear about every terminal
      row. Three tests including an innocence case, so this cannot silently become "the bot
      stopped apologising".
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "MAJOR: the new FK has no index on the referencing side, so every DELETE on meta_inbox_messages seq-scans wa_outbox."
    resolution: "CURED: wa_outbox_inbound_message_id_idx added to the UPGRADE and dropped in the ROLLBACK; migration re-verified down/up."
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "MINOR: the aborted_human_takeover_pre_send branch ignores whether its UPDATE matched, so execution falls through to the 24h window check and the row may still be sent."
    resolution: >-
      The asymmetry is real and is CURED (RETURNING plus a loud log on zero matches), but the
      stated mechanism is wrong and is corrected here so nobody rebuilds on it: there IS a
      `return "aborted_human"` immediately after, so nothing is mis-sent. The real cost was
      narrower and squarely inside this PR's concern — a stolen lease meant the row reached a
      terminal state with nothing recording why.
  - seat: agy-gemini-3.1-pro
    status: RETRACTED
    objection: "MAJOR: generate_bot_reply still calls the legacy unbound _load_thread_context, so any worker or fallback using it keeps the original defect."
    resolution: >-
      generate_bot_reply is reachable only as `bot_generate_fn`, which the worker's own docstring
      declares twice is "accepted for signature/back-compat only — NEVER invoked" since the
      2026-08-27 Gemini cut; generation runs exclusively through the codex leg. The seat read a
      dead parameter as a live path. Worth recording rather than dismissing: dead code shaped
      like a live path is exactly the trap the same seat was asked to hunt for, and it fell into
      it — the next reader can too.
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "MINOR: `FOR UPDATE SKIP LOCKED` without `OF w` on an aliased table with a correlated subquery may cause planner locking ambiguity."
    resolution: >-
      Not changed. The subquery is a plain EXISTS over the same table and Postgres locks only the
      outer scan's rows here; changing the lock clause on the claim SELECT is a concurrency edit
      that would need its own proof, and this PR's concurrency surface is already the thing under
      review. Declared rather than absorbed.
  - seat: dux-claude-opus-5
    status: CONFIRMED
    objection: "Head-of-line blocking: if the first message of a burst keeps failing, the next ones wait behind its retry ladder (MAX_ATTEMPTS 5, backoff 30/60/120/240/480 ~= 15.5 min)."
    resolution: >-
      Found independently by the Dux and by the Gemini seat. Accepted, not cured: curing it means
      serving out of order, which is the exact property this PR exists to guarantee. The apology
      cure above removes its worst client-visible symptom. Stated in the PR body rather than left
      for someone to discover in production.

