oversize_reason: >-
  This commit is a RECOVERY, not a fresh authoring: it is cherry-pick of
  8c4d310b16, a commit that was built and tested in a previous window and never
  pushed. Splitting it now would mean re-deriving a diff that is already proven
  green, and would land migration 318 (the column + the partial index) apart from
