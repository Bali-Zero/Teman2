  - "migration 318 applies AND rolls back on a database that does not already carry the column"
  - "every fall-off reason value the Python can write is admitted by the CHECK constraint, proven against the migration file rather than against a local database"
  - "PROVE-LIVE: a burst of 3 messages to the sandbox number produces 3 wa_outbox rows with 3 DISTINCT inbound_message_id"
