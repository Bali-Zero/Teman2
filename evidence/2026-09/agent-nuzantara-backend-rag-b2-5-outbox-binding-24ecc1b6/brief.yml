objective: >-
  "One message, one answer" (B2.5 PR-1). Today a burst of client messages is
  merged by `_coalesce_thread_bursts` into a single generation, so a client who
  sends three messages in a row can receive one answer bound to none of them in
  particular, and a retried row is answered against whatever the thread looks
  like at retry time rather than against the message that created it. This PR
  binds every `wa_outbox` row to its own inbound message through a new
  `wa_outbox.inbound_message_id` column (migration 318), removes the coalescing
  path entirely, serves a thread's rows strictly FIFO via a partial index the
  claim SELECT reads, derives an anchor for pre-migration rows (always the OLDER
  inbound, never a newer one), and closes the ledger gap where a failed row could
  carry a NULL reason by adding the terminal fall-off reasons and pinning the
  code-vs-CHECK vocabulary with a test that parses the migration itself.
acceptance:
