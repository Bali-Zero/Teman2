council_run: council-journal.jsonl
plan_ref: >-
  Handoff mandate from Zero, 2026-09-04: "bonifica completa" of the subagent inventory, opened by
  the question whether subagents are still coherent in this system after `/agents` reported its
  wizard removed. The audit's worst finding was not any of the visible ones (HOME-fork shadows,
  stale DeepSeek routing, 26 HOME-only defs): it was that CI did not look at `.claude/agents/` at
  all. This PR is the FIRST of three and deliberately the safe half — it arms the guard and
  changes no agent definition. One concern.

lanes:
  - lane: agents-ground
    role: read
    seat: >-
      claude-opus-5 (conducting session, M5). Established both premises by measurement on
      `origin/main` rather than from the mandate text: `git grep -l test_agent_defs_model_pins
      .github/workflows/` returned nothing, and the sentinel path list carried no
      `.claude/agents/` entry. Also measured the frontmatter field census across the 20 defs
      (11 `maxTurns`, 6 `disallowedTools`, 9 `memory`) — the number that decided what the floor
      is allowed to require.
  - lane: agents-build
    role: build
    seat: >-
      claude-opus-5 (conducting session, M5). Wrote the two workflow entries and the fleet-wide
      floor. Mutation-tested every assert in `_assert_agent_def_floor` by replacing it with
      `assert True` one at a time; found TWO survivors in the first draft and resolved both
      rather than leaving them (see dissent, self-caught). Restored from a `cp` backup each time,
      never `git checkout --`, which would have wiped the uncommitted cure.
  - lane: agents-refute-codex
    role: review
    seat: >-
      codex-gpt-5.6-sol, `codex exec --sandbox read-only -c model_reasoning_effort=xhigh`,
      cross-family, on fresh context, instructed to CONSTRUCT defeating inputs rather than read
      and agree. Verdict recorded in journal.jsonl; a timeout or an exit-0 carrying an error is
      logged as NON-JUDGEMENT and does not count as a review seat.
  - lane: agents-refute-qwen
    role: review
    seat: >-
      tp1-qwen3.8-max at effort xhigh, cross-family, read-only (cannot execute — asked to reason
      from the diff text and name a defeating input, a file:line and a consequence). Verdict in
      journal.jsonl under the same NON-JUDGEMENT rule.
  - lane: agents-refute-kimi
    role: review
    seat: >-
      kimi-code/k3, cross-family, dispatched against the POST-cure text (the other two seats read
      the pre-cure diff) so at least one seat grades the bytes that actually ship.

seat_diversity: satisfied
seat_diversity_note: >-
  ONE build lane, so the non-Anthropic BUILD-seat requirement does not bind by its own terms
  (">= 2 build lanes"); no second build lane was invented to satisfy a rule that does not apply.
  The cross-family pressure is placed on REVIEW, where it is load-bearing for this change: this
  PR arms a GUARD, and a guard's failure mode is passing vacuously — which is exactly what a
  same-family reviewer, sharing the author's idea of what to assert, is worst at catching.
  Three review seats from three different families were dispatched for that reason.

diff:
  files: 5
  net_lines: 278
  measured_at: >-
    `git diff --numstat $(git merge-base origin/main HEAD)` in the worktree immediately before the
    commit — merge-base form, because a two-dot diff would accuse this branch of deleting main's
    later additions (W102). 3 added / 0 deleted in
    `.github/workflows/immune-enforcement.yml`; 279 added / 4 deleted in
    `scripts/tests/test_agent_defs_model_pins.py`. The three evidence files are counted in
    `files` and carry no code. The test file grew from 144 to 279 added lines across three
    adversarial rounds — every added line after the first round is a cure or its guilt twin, and
    each one is named in `dissent` below with the seat that forced it.

residual_risks:
  - >-
    THE HEADLINE FINDING OF THIS PR IS ABOUT THE CORPUS, NOT THE GUARD, AND IT IS NOT CURED HERE.
    7 of the 20 agent definitions — every one of the grunt defs added by PR #5042 — are NOT valid
    YAML: their description carries a second unquoted colon (`description: GRUNT (Haiku): reads a
    bounded ...`) and `yaml.safe_load` rejects the whole frontmatter with a ScannerError. They are
    nonetheless loaded and dispatchable, descriptions rendered intact, which is what proves the
    harness's reader is line-based rather than a strict YAML parser. Two consequences, both
    load-bearing for anyone who touches this directory next: (a) a guard that demanded
    YAML-parseability would be STRICTER THAN THE CONSUMER and would redden 7 working files, so
    this floor deliberately does not; (b) any future tool that DOES parse these defs as YAML —
    a doc generator, a registry, a migration script — will silently see 13 defs where there are
    20. Recorded as a corpus defect for the PR that edits agent defs; forcing it from a test that
    is not allowed to edit them would be a guard blocking its own cure.
  - >-
    THE `\s*`-CROSSES-NEWLINE NARROWING IS PARTLY UNTESTED, and the measurement says so. Every
    frontmatter regex in the file was narrowed from `\s*` to `[ \t]*` (W119). `_scalar`'s own gap
    IS covered — reverting it to `\s*` reddens the empty-`tools:` guilt test. `TOOLS_LINE_RE`'s
    and `ANY_MODEL_PIN_RE`'s narrowing is NOT: reverting `TOOLS_LINE_RE` alone leaves all 21 tests
    green, because the floor no longer reads through it and the grunt helper that does is reached
    only after the floor has already rejected an empty `tools:`. The narrowing is kept as
    defence-in-depth on a latent trap and is explicitly NOT claimed as covered.
  - >-
    THE FLOOR IS DELIBERATELY WEAKER THAN THE DOCTRINE IT GUARDS. It does not check that `model:`
    names a model on the canonical roster, that a def's toolset matches its declared tier, or
    that `disallowedTools` is present where a def's own description implies it should be. Every
    one of those fails TODAY on real defs — so shipping them would be a guard that blocks the
    normalization instead of guarding it (the 2026-09-01 "a guard pinned to the current value
    forbids the change it should check" shape). This is a scope limit stated as one, not a thing
    the PR solves. The consequence if it is never followed up: the directory has a floor and no
    ceiling, and a def pinned to a model that no longer exists still passes.
  - >-
    THE TWO SURFACES THIS PR ARMS DISAGREE ABOUT NESTING, and BOTH cross-family seats named it
    independently. The sentinel is a shell `case` pattern and shell case globs match ACROSS `/`:
    `.claude/agents/sub/x.md` evaluates RELEVANT=true (verified by running the workflow's own
    extracted case block on that exact string). The test's `AGENTS_DIR.glob("*.md")` does not
    recurse. The kimi seat proposed curing it by recursing the test glob; MEASURED, that is
    exactly wrong — `.claude/agents/wr2-design-architect-resources/` really exists and holds 4
    `.md` RESOURCE files (`find .claude/agents -mindepth 2 -name '*.md'`), which are not agent
    definitions and would redden immediately under `rglob`. The two globs answer different
    questions on purpose: the sentinel asks "did anything under this directory move" (broad is the
    safe direction) and the floor asks "is every DEF well-formed". The residual is a future def
    placed in a subdirectory, which the harness — reading the directory flat, as its own agent
    listing shows — would not dispatch either. Left uncured with the measurement attached, rather
    than cured in the direction that breaks 4 real files.
  - >-
    `assert paths` in `test_every_agent_def_meets_the_floor` is a MUTATION SURVIVOR: removing it
    reddens nothing, because the real directory is non-empty. It is retained as a guard against a
    future state where the directory moves or empties, and is explicitly NOT claimed as tested.
    Recorded rather than deleted because the empty-glob-passes-vacuously shape is the specific way
    this kind of test dies, and recorded rather than claimed because a survivor presented as
    coverage is worse than no line at all.
  - >-
    THE DANGEROUS HALF OF THE MANDATE IS NOT IN THIS PR. Three agent definitions that exist ONLY
    in `~/.claude/agents/` are LIVE and are read BY PATH — `competitor-monitor` from
    `infra/launchagents/wrappers/competitor-monitor-run.sh:24`, `yield-optimizer` from
    `infra/launchagents/wrappers/yield-optimizer-run.sh:26`, `nb-curator` from
    `scripts/nb-curator-daily.sh:209`. Promoting them into `.claude/agents/` and deleting the HOME
    copy breaks the cron; promoting without deleting leaves the cron on the stale copy — scar
    family #1 exactly. Wrapper and promotion must move in the SAME commit. That is PR-2 and this
    PR neither performs nor guards against it.
  - >-
    Two of the three review seats graded the PRE-CURE diff, because they were dispatched before
    the author's own mutation pass found the over-match. Their findings are recorded as they came;
    where a finding was already cured by the time it arrived, that is stated rather than presented
    as a clean bill. Only the kimi seat read the bytes that ship.

  - >-
    THE WIRING THIS PR ADDS CAN BE UNDONE BY DELETING THE TEST FILE, AND CI STAYS GREEN. Both
    cross-family seats found this independently. The step's loop is
    `if [ -f "$t" ]; then pytest ...; else echo "::notice::skip (absent) $t"; fi` and `fail` stays
    0 — so a PR that deletes or renames `test_agent_defs_model_pins.py` trips the sentinel, runs
    the step, skips the missing file and passes. It is INHERITED, not introduced: the same skip
    covers all ~60 tests in that list and is deliberate ("expected only in the window before its
    lane's PR merges"). Curing it for one entry means special-casing; curing it for all 60 means
    breaking the documented merge-window behaviour, which is a different concern and a different
    PR. Named here and carried as a PENDING-ARMS line rather than smuggled into this diff.
  - >-
    THE FLOOR PINS SHAPE, NOT INVENTORY — `git rm .claude/agents/wr2-*.md` passes. `assert paths`
    only guards the fully-empty case (and is itself a mutation survivor). Both seats raised it;
    it is a deliberate scope limit, because the alternative — enumerating the 13 non-grunt defs by
    name, or pinning a count — is a guard pinned to the current value, which forbids the
    legitimate deletion it cannot distinguish from the illegitimate one. The 7 grunt defs ARE
    enumerated by name, by the pre-existing tests, because their names are load-bearing on
    `model_routing_gate.py`. Deleting a def is a visible diff; malforming one was not, and that
    is the gap this PR closes.
  - >-
    `_frontmatter()` IS LAX AND IS NOT TOUCHED HERE. It does `text.split("---", 2)` rather than
    matching line-anchored delimiters, so (a) a def whose frontmatter value contains a literal
    `---` truncates mid-frontmatter and reddens a legal file, and (b) a file with no closing
    delimiter whose BODY contains `---` passes the length check, letting a column-0 `model:` line
    in the body satisfy the pin. Inherited: the helper predates this PR and the pre-existing grunt
    tests read through it too. Named, not cured — changing the shared parser is a wider blast
    radius than this PR's one concern.

