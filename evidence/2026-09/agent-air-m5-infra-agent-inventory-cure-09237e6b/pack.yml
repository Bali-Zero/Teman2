dissent:
  - seat: codex-gpt-5.6-sol (cross-family, read-only sandbox, xhigh)
    status: CONFIRMED
    objection: >-
      "`\s*` attraversa il newline": given `tools:` followed by `model: sonnet`, the pre-existing
      `^tools\s*:\s*(.+)$` consumed the newline and captured 'model: sonnet' as the TOOLS value —
      so a def with an empty toolset key, which inherits the entire harness toolset, landed green
      on the exact assert written to prevent that. Reproduced verbatim before curing. Same seat,
      same class: `tools: # no tools` satisfied every presence regex while supplying nothing.
      CURED — every gap narrowed to `[ \t]*`, comment-only values read as absent, with a guilt
      test for each. This is cicatrix W119, family #3, found by a seat that had never seen the
      scar file.
  - seat: codex-gpt-5.6-sol (cross-family, read-only sandbox, xhigh)
    status: RETRACTED
    objection: >-
      Its HIGH #2: name/tools/model buried inside a multi-line quoted `description` pass every
      regex while YAML sees a single key, "so the real loader may reject the definition or apply
      the defaults the guard should prevent". The DIVERGENCE is real and reproduced. The
      CONSEQUENCE is not: measured the same turn, 7 of the 20 defs are not valid YAML at all and
      are loaded and dispatchable anyway, which means the consumer is line-based and sees exactly
      what the regexes see. Retracted on the evidence, and the evidence is recorded in the source
      as the reason this file does NOT switch to `yaml.safe_load` — a future reader will have the
      same idea and deserves the measurement rather than the conclusion.
  - seat: kimi-code/k3 (cross-family, on the post-first-cure text)
    status: CONFIRMED
    objection: >-
      Three holes the same-family author and the first cross-family seat both missed. (1) NULLISH
      values: `model: ~`, `model: null`, `model: ""` and `model: ''` all satisfy `\S`, so the pin
      assert passed on a def carrying no pin — and `tools: ~` likewise, which is the broadest
      possible surface. (2) DUPLICATED KEY: a line scanner takes the FIRST `name:` and a YAML
      parser the LAST, so `name: on-disk-name` … `name: something-else` matched the filename and
      would load as the other identifier — precisely the failure the floor claims to catch. (3)
      TRAILING COMMENT: `name: my-agent # dispatcher name` was read as the whole six-word string
      and reddened a legal file — the over-match twin of the quoted-name cure, one YAML feature
      further out. All three cured with guilt or innocence tests; the duplicate key is REFUSED
      rather than resolved, because this guard has no standing to decide which occurrence the
      harness meant.
  - seat: kimi-code/k3 (cross-family)
    status: RETRACTED
    objection: >-
      Proposed cure for the sentinel/test nesting asymmetry: "recurse the test glob to match the
      sentinel's reach". Measured and rejected — `.claude/agents/wr2-design-architect-resources/`
      holds 4 real `.md` RESOURCE files that are not agent definitions, so `rglob` would apply the
      def floor to them and redden four working files. The asymmetry is kept, with the measurement
      recorded, because the two globs are answering different questions. Same seat's def count
      (19) is also wrong: 20 top-level non-README defs, counted.
  - seat: session (M5), self-caught during BUILD
    status: CONFIRMED
    objection: >-
      The first draft asserted `name:` PRESENCE on a line of its own, above the `name`/filename
      equality assert. Mutation proved it dead: deleting it reddened nothing, because
      `assert declared and declared.group(1) == stem` already fails on a nameless def. A
      decorative assert is not harmless — it reads to the next maintainer as a covered property,
      so a later refactor that removes the equality check looks safe. Resolved by DELETING the
      presence line and folding its case into the equality assert's message ("a missing `name:`
      line reads as None here"), then adding
      `test_guilt_a_def_with_no_name_line_at_all_fails_the_floor` so the merged behaviour has its
      own guilt twin.
  - seat: session (M5), self-caught during BUILD
    status: CONFIRMED
    objection: >-
      The `description:` assert was the second mutation survivor: every one of the 20 real defs
      carries a description, so removing the assert reddened nothing and no guilt test reached it.
      Cured with a guilt fixture rather than by deleting the assert, because the property is real
      — the dispatcher matches a mandate against the description, so a def without one is
      invisible to routing rather than merely untidy.
  - seat: session (M5), on the shape of the check
    status: CONFIRMED
    objection: >-
      `name: "foo"` is legal YAML naming `foo`, and the draft's `(\S+)` capture compared '"foo"'
      against 'foo' and REJECTED it — a false BLOCK on a shape a future def is entitled to use
      (cicatrix-superscar #3, guard-over-match). Cured by capturing the whole value and stripping
      one layer of matching quotes, with an innocence test over all three spellings. Deliberately
      only ONE layer and only matching quotes: a looser strip would start accepting values that
      are not the name.
  - seat: session (M5), on scope
    status: RETRACTED
    objection: >-
      The obvious stronger floor is to require `maxTurns`, `disallowedTools` and `memory` on every
      def — which is what the fleet's routing doctrine actually wants. Rejected after measuring
      the census: 11, 6 and 9 of 20 carry them. Requiring them lands the PR red on files it does
      not touch and, worse, makes the guard an obstacle to the very normalization it exists to
      protect. The safe direction here is a floor that only a REGRESSION can trip, with the
      ceiling left to a follow-up that also does the normalizing.
