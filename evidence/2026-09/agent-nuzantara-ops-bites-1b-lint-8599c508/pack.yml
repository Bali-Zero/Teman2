bites:
  consumer: >-
    the required status check "Harness floor recompute"
    (.github/workflows/harness-floor.yml), which from this PR forward parses every PR's
    own evidence pack through scripts/ci/bites_parse.py — the parser #5693 landed and
    nothing called
  where: ci
  observe: python3 scripts/ci/bites_parse.py --selftest
  expect: regex:[0-9]{3}/[0-9]{3} pass

bites_note: >-
  The observation this PR can honestly make in `ci` scope is that the parser it ARMS is
  itself sound — the same shape #5693 used, deliberately unchanged so the two rows are
  comparable in the ledger PR-2 will build. What this PR adds cannot be observed by a
  command on a runner at all: "the step ran on a PR" is a property of a workflow run, not
  of the checkout. That is precisely the gap PR-2 (the post-merge reconciler) exists to
  close, and the honest prove-live for THIS PR is the one in `receipts` below: read the
  step's own annotations in the Harness floor recompute run on this very PR.

diff: >-
  6 files, +840/-1, measured merge-base anchored from
  e84a92b692 — the WHOLE diff, evidence included, because that is what the countable-claims
  rule counts and the first draft of this pack narrated the code-only figure and went red on
  its own CI for it. The code half is entirely under `.github/workflows/`: harness-floor.yml
  carries one new step plus its comment blocks, guard-conformance.yml four path entries and
  one widened alternation, immune-enforcement.yml two case-pattern entries. The remainder is
  this pack, its brief and its journal — and the per-file split is in per_component below
  rather than restated here as a second set of totals, because the countable-claims rule
  reads any such restatement as a claim about the WHOLE diff, and it is right to. No script
  changes, no new script, no new required context.

  GEAR 3 BY PATH, not by size: `.github/workflows/` is a hot zone, so
  `python3 scripts/evidence_pack_lint.py --print-floor` returns 3 for a one-line change to
  any file here. #5693 measured the same thing on its own draft of this diff and deferred
  it rather than satisfy a 2-seat council it could not reach that night. It is reachable
  now; the council is in journal.jsonl and the findings are in `dissent`.

