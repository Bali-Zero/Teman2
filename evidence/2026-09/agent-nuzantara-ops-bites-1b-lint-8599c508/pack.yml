  note: >-
    The comment blocks are 92 of the 214 lines added to harness-floor.yml, and 6 of the 8
    paragraphs are answers to a council finding rather than narration: why the head object is
    asserted before anything is inferred from its absence, why the path questions use ls-tree
    rather than cat-file under `filter: blob:none`, why the stale-base branch USES origin/main's
    parser instead of skipping, why a diff touching the parser downgrades a malformed verdict to
    a notice, and why the classification asks classify() instead of grepping bytes. This file's
    own convention is that a guard whose reasoning is not written down gets re-litigated by the
    next session — and the first cut of this step was wrong in three of those five places.

cloud_ok: >-
  SYMBIOSIS Law 2, output boundary. The subject is a CI step and two path filters. No
  client data, no OSINT, no credential is anywhere in this lane. The two council seats were
  handed the step's own text and the parser's documented contract — nothing from the
  repository beyond that, no secret, no client identifier.

