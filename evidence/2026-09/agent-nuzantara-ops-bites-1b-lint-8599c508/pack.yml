        before: 0,
        after: 115,
        delta: 115,
      }
    - {
        component: "guard-conformance.yml — push paths",
        before: 0,
        after: 4,
        delta: 4,
      }
    - {
        component: "guard-conformance.yml — in-job relevance regex",
        before: 1,
        after: 1,
        delta: 0,
      }
    - {
        component: "immune-enforcement.yml — case patterns",
        before: 0,
        after: 2,
        delta: 2,
