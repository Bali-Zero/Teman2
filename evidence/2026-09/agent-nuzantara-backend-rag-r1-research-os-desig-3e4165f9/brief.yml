acceptance:
  - text: >-
      NEGATIVE / innocence. WHILE this branch is in force, the frozen contract
      surface SHALL be byte-identical to origin/main and the core fixture corpus
      SHALL still validate: `fixtures --check` reports checked 218, failures [],
      and `git diff --stat origin/main -- packages/research-os-core` is EMPTY.
    probe: >-
      PYTHONPATH=packages/research-os-core apps/backend-rag/.venv/bin/python -m
      research_os.cli fixtures --check; git diff --stat origin/main -- packages/research-os-core
  - text: >-
      NEGATIVE / innocence. Consul's persistence consumer — the one existing
      executable INSERT into research_os_objects — SHALL still pass its unit
      tests, because R1 must not move the ground under it.
    probe: >-
      cd apps/backend-rag/backend && PYTHONPATH=../../../packages/research-os-core
      ../../../../nuzantara/apps/backend-rag/.venv/bin/python -m pytest tests/unit/services/autonomous_lab
  - text: >-
      TEMPORAL. Every case in the mandate's temporal list SHALL be an EXECUTED
      test over canonical fixtures — both interval boundaries, zero and non-zero
      microseconds, unknown bounds, a correction recorded before AND after
      discovery, a scheduled change known in advance, an existing finite expiry,
      a no-answer result, and a quarantined fork — with no skip and no xfail.
    probe: >-
      cd apps/backend-rag/backend && pytest tests/unit/research_os -p no:randomly
      --collect-only | grep -c temporal ; pytest tests/unit/research_os -rs
  - text: >-
      TEMPORAL / shape. bitemporal/03 SHALL answer as TWO families under one
      subject_key, each with a unique current member and no successor edge
      between them; supersession/01 SHALL be one atomic correction with ONE
      exact predecessor hash; a fork SHALL return quarantine and a gap SHALL
      return abstention, both as explicit return values, never as None.
    probe: pytest tests/unit/research_os -k "bitemporal or supersession or quarantine or abstain"
  - text: >-
      TEMPORAL / extension. The subject_key extension SHALL be defined once, in
      a namespaced extension, and SHALL validate against the exported Claim
      schema without any contract change.
    probe: pytest tests/unit/research_os -k subject_key
  - text: >-
      ADMISSION. The D4 predicate SHALL be executable: a legacy-shaped record
      with a URL hash is EXCLUDED with reason content_hash_is_url; one without a
      span -> exact_span_missing; one with a fabricated triple ->
      statement_not_from_source; a fully-sourced seed fixture is ADMITTED; and
      on the mixed set the three counts (documented_mapping_coverage,
      available_source_information, admissible_records) SHALL differ from each
      other.
    probe: pytest tests/unit/research_os -k admission
  - text: >-
      MAPPING. test_naga_evidence_mapping_preconditions.py SHALL no longer
      assert `len(absent) == 15` nor `named < absent`; the 15 SHALL be gone, and
      in its place an EXECUTED mapping over a canonical fixture that validates
      against evidence.schema.json, with §2 documenting 32 of 32 required paths.
    probe: >-
      grep -c "absent) == 15" apps/backend-rag/backend/tests/unit/research_os/test_naga_evidence_mapping_preconditions.py;
      pytest tests/unit/research_os/test_naga_evidence_mapping_preconditions.py
  - text: >-
      CONTROL ROOM. README.md:7 SHALL read the real program state and name the
      mandate file; SESSION-BOARD.md SHALL carry a §13 with the 2026-09-11
      measurement; §5's head line SHALL read the max+1 rule with the MEASURED
      head.
    probe: >-
      sed -n '7p' research/operations/execution/research-os-v1.0.0/README.md;
      grep -n "^## 13" research/operations/execution/research-os-v1.0.0/SESSION-BOARD.md
  - text: >-
      BITES. The consumer is R2's persistence tests, which import these
      fixtures. R2 does not exist yet, so the observation made BEFORE reporting
      done is the schema validation of EVERY fixture in the P06 bundle, run in
      CI on this branch — not a promise that a future job will run it.
    probe: pytest tests/unit/research_os -k fixture_bundle

