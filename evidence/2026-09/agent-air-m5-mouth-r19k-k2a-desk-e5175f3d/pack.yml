dissent:
  - seat: codex-gpt-5.6
    objection: >-
      desk.tsx creates a second primitives module; the shared README requires a missing shape to be
      added under components/workspace/r19, not beside the page.
    status: RETRACTED
    disposition: >-
      The K2 window brief forbids this seat from editing components/workspace/r19/** while another
      seat upgrades it to v2, and instructs exactly this fallback: a page-local wrapper that imports
      the primitive, never a copy of its class strings. desk.tsx imports SERIF, SERIF_SECTION,
      TABULAR and EYEBROW from the shared module and copies nothing. When v2 lands these become
      one-line adapters over Numeral size="kpi|ordinal", OrdinalMargin and LedgerSection.
  - seat: codex-gpt-5.6
    objection: >-
      The no-red guard is falsely green: it does not follow imports, and SystemPulse and
      ComplianceRadar read --state-danger.
    status: CONFIRMED
    disposition: >-
      Both reads are real (packages/core/components/SystemPulse.tsx:28, ComplianceRadar.tsx:61).
      Neither paints red on kita, where --state-danger resolves to copper, and neither is in this
      window's writable perimeter. Widening the scan to the whole render tree would judge code these
      pages never touched — the guard-over-match failure this file is written to avoid. The
      limitation and the two file:line reads are now written INTO the guard, so its green is never
      read as more than it measures.
  - seat: codex-gpt-5.6
    objection: >-
      The masthead eyebrow paints a DATE copper, and Fraunces touches the A-J row marks.
    status: RETRACTED
    disposition: >-
      The frozen render declares `.masthead .eyebrow { color: var(--copper) }` and renders "DESK ·
      MONDAY 14 SEPTEMBER" in it; the eyebrow is the masthead's structural mark, in the same family
      as the copper rule, not a claim about a record. DISPOSITION-fusion F3 and F10 concern copper on
      DATA dates — a passport cell, a countdown pill — and this diff obeys both. The A-J marks are
      ledger ordinals, which concept §4 grants Fraunces by name.
  - seat: claude-opus-5
    objection: >-
      The practice half of the action margin is inert in production.
    status: CONFIRMED
    disposition: >-
      /api/dashboard/summary calls list_practices(status="in_progress", ...), an exact `p.status = $n`
      match, so its array cannot contain a waiting_documents row. The predicate is written against the
      real status vocabulary — both the CRM spelling and the summary's own short code — so the margin
      fills the day that filter widens, with no change here. Substituting in_progress instead would
      have flooded the margin with everything moving and made copper mean "in progress", which is the
      law this window exists to enforce. Named in the source, the PR body and the checkpoint rather
      than hidden; widening the endpoint is outside K2's perimeter.
