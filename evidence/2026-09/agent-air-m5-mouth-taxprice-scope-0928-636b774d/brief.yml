task: >-
  Fix-forward of #7582's gate findings: /services/tax package cards must
  never show a catalogue price for a scope the SKU does not cover.
  LKPM Report, SPT Annual Company (Zero), BPJS Kesehatan and BPJS
  Ketenagakerjaan go back to Contact; NPWPD Corporate keeps its price and
  now says "Per location"; Monthly Tax Report and SPT Annual Company
  (Operational) show "from <catalogue tier-set minimum>" computed at
  runtime, never a hardcoded literal.
lane: mouth/taxprice-scope
machine: air-m5
date: 2026-09-28
gear: 2
gear_reason: Floor 2, source size — 527 insertions / 170 deletions (net 357)
  across 9 files, driven mainly by the regenerated bali-zero-prices.json
  (248/118) once tier_range was added to the sync path; no hot-zone path
  hit.
acceptance:
  A1: >-
    services_data.tax-pricing.test.ts pins per-package SKU identity
    (key/category, or tier-set for the 2 "from" packages) for every
    /services/tax package; proven red on origin/main's services_data.ts
    (7/12 failing — the 2 tier-floor assertions and 4/4
    stays-on-placeholder assertions plus the NPWPD "per location" nit) and
    green on HEAD (12/12). pricing-snapshot.test.ts, ServicePricing.test.tsx
    and bali-zero-prices.test.ts stay green. tsc --noEmit exit 0. eslint
    clean (0 errors). prettier --check clean after --write.
  A2: >-
    live /services/tax page (npx next dev --webpack -p 3141) renders
    exactly: NPWP Personal + Coretax 1.000.000 IDR, NPWPD Corporate
    2.500.000 IDR (with "Per location" feature), SPT Annual Personal
    1.000.000 IDR, SPT Annual Company (Zero) Contact for quote, SPT Annual
    Company (Operational) "from 6.000.000 IDR", Monthly Tax Report "from
    1.800.000 IDR", BPJS Health Insurance / BPJS Employment Insurance /
    LKPM Report all Contact for quote. Verified via curl+grep on the SSR
    HTML for card text and via a headless Playwright fetch (already vendored
    at repo-root node_modules, no install) for the hydrated JSON-LD: the 2
    "from" packages emit priceSpecification.minPrice (6000000 / 1800000),
    never a plain price; the 5 priced packages keep a plain price; the 4
    Contact packages emit no Offer at all.
  A3: >-
    no hardcoded monetary figure introduced in services_data.ts. The 2
    "from" prices resolve through a new getTierSetFloorPrice() in
    pricing-snapshot.ts, reached via the same read path
    (bali-zero-prices.json) visa/exact tax packages already use — never a
    new data source. python3 scripts/sync_frontend_prices.py --check
    passes (the JSON was regenerated, not hand-edited).
owner_findings: >-
  The owner's memory quote for Monthly Tax Report ("from 1.8M") matches the
  catalogue exactly: tax_accounting.monthly_tax_basic's cheapest tier
  (Tier 0-50, "without LKPM & Annual", matching this card's scope) carries
  no exact `price` but a `tier_range` of ["1.800.000 IDR", "2.000.000 IDR"]
  in the PricingTool canonical — that field existed in the canonical file
  for all 118 rows already but the sync script never propagated it to the
  frontend snapshot, so it was previously unreachable from
  services_data.ts. The owner's quote for SPT Annual Company (Operational)
  ("from 4M") does NOT match: the catalogue's Annual Basic Package A-D
  ladder floors at Package A = 6.000.000 IDR (Annual Company ZERO's 3M is a
  different product line — the Zero card — excluded from this tier set).
  Used the catalogue's 6.000.000 IDR per the ruling ("if the catalogue
  minimum differs from the owner's number, use the catalogue").
out_of_scope: >-
  BPJS Kesehatan/Ketenagakerjaan scope confirmation (what the 2.5M actually
  covers) — a business decision left to Zero, per the ruling. The guard's
  "per-package SKU identity" pin does not yet cover the visa packages (only
  /services/tax was in scope); pricing-snapshot.test.ts's existing full-row
  parity check (118 rows) already covers the regenerated JSON's tier_range
  field content, so no new drift can ship silently.
