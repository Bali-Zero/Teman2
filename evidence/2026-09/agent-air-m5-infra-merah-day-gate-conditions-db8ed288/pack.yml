diff:
  files: 7 files, +2165/-11, 6 commits
  net_lines: >-
    Measured with `git diff --no-renames --numstat` against the merge-base 60d0c4e856, over the
    WHOLE branch and not a lone commit's diff, and INCLUDING this pack file — CI recomputes same
    numbers at lint time from the same merge-base, so a count that quietly omits itself is a count
    that fails. The shape matters more than the total: the two raw council transcripts are 1525 of
    those added lines, pure evidence that changes no behaviour, and only two of the seven files
    are code — the workflow and its test corpus. The history is the original pair of conditions
    (6434bfa6a4), the innocence-fixture correction (bfb31e9e5d), the three council cures
    (2fca39e821), the correction of condition 1's stated reason (b1c1c776ac), this pack
    (54c3a51e97), and the commit that made these very numbers count themselves.
  behaviour_change: >-
    `.github/workflows/merah-putih-day-contrast.yml`: `cancel-in-progress` becomes conditional on
    the event instead of an unconditional true; the sentinel step gains a SHELL-level fail-closed
    branch that probes base reachability and guards the diff before either can kill the step;
    the sentinel's existence probe for the base copy of this workflow moves from `cat-file -e
    <sha>:<path>` to `ls-tree`, so a promisor fetch failure under `filter: blob:none` is no longer
    read as "the file is absent"; and the verdict word is validated against exactly {true,false}
    before it reaches $GITHUB_OUTPUT. `scripts/tests/test_merah_putih_day_contrast.py` gains the two
    condition tests and three more that execute the SHELL STEP rather than the Python snippet
    it invokes; the receipts below report what the whole corpus then counts. No branch-protection entry is added here and no other workflow, job or required
    context is touched — the promotion itself is the next PR, after a real merge_group run is
    observed. Ships no code into any deployed artifact.
receipts_ts_precision: >-
  Every `ts` below is a real `date -u +%Y-%m-%dT%H:%M:%SZ` printed by the same shell invocation
  that then ran the command on the line it annotates, so it is the command's START to the second,
  not its completion and not a time written by hand. Where one invocation ran two commands, both
  receipts carry that invocation's single timestamp; they are not separately clocked and are not
  presented as if they were.
