      cannot turn a red into a green. Both carried as MERAH-4.
open_findings:
  - id: MERAH-2
    title: "The innocence half of the shell test does not execute where the shell mangles the step"
    detail: >-
      test_the_step_still_declares_a_no_op_when_the_base_is_readable skips wherever the shell
      cannot run the shape the step ships — now decided by a probe that performs the operation,
      not by `bash --version` (which reads whatever PATH resolves first) and not by `bash -n`
      (which exits 0 on the real step). On /bin/bash 3.2, macOS's, the probe fails and the test
      skips; on the ubuntu runner it passes and the test executes, which is where the workflow
      actually runs. An M5 session therefore sees 63 passed / 1 skipped and must not read that as
      full local coverage — the CI run of this workflow's own job is the one to read.
  - id: MERAH-4
    title: "Two round-3 findings are confirmed and deliberately not cured"
    detail: >-
      codex-gpt-5.6-sol returned BLOCK a third time, and both remaining findings are real: the
      executed `case` fragment proves the gate's logic but not that the step REACHES it (wrap the
      real gate in `if false; then ... fi` and the harness stays green), and five parameterised
      garbage values do not prove that exactly two values are accepted. Neither is answered with a
      fourth cure, on purpose. The builder contract stops a fix-of-a-fix at depth 1 and this is
      round three, the second consecutive one whose findings are about the strength of the proofs
      rather than the behaviour of the code — the shape the contract calls an under-specified
      surface. What both want is the same thing: the whole step driven end to end with a stubbed
      `python3`, which needs the shell capability MERAH-2 records this machine as lacking. That is
      the spec for the next attempt, written here rather than attempted at midnight.
  - id: MERAH-3
    title: "The blob:none premise is argued, not pinned"
    detail: >-
      The ls-tree cure rests on a claim about partial clones: that a failed promisor fetch
      surfaces on `cat-file -e <sha>:<path>` and not on `ls-tree`, because a blob:none clone
      already holds the trees. The three ROUTING outcomes are driven by tests; the premise itself
      is not, and the attempt to pin it is why this is recorded rather than claimed: a local
      `git clone --filter=blob:none file://...` answers "filtering not recognized by server,
      ignoring" and copies every blob, so the fixture cannot be built without a filter-honouring
      server. Raised by codex-gpt-5.6-sol, round 2, MEDIUM.
