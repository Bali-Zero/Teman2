    resolution: >-
      CONFIRMED and NOT CURED — stated plainly rather than answered with a fourth cure. It is
      true: lifting the fragment out proves the fragment's logic, not that the step reaches it.
      Closing it properly means driving the whole step through a stubbed `python3` on PATH, which
