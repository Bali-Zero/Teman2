    resolution: >-
      CONFIRMED and NOT CURED, for the same reason and with the same honesty as the entry above.
      Proving "exactly two" needs the accepted set enumerated from the parsed case arms rather
      than sampled, which is a different test and a different design conversation. The BASH_ENV
