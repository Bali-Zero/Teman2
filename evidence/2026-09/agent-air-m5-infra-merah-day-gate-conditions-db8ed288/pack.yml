dissent:
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    verdict: BLOCK
    objection: >-
      The fail-closed branch was unreachable. The step runs `set -euo pipefail` and then
      `git diff --name-only "$BASE_SHA"...HEAD` BEFORE invoking the Python snippet, so a genuinely
      unreachable base killed the step at that line and `_run_everything()` — the branch written
      for exactly that input — never ran. The tests could not see it because every one of them
      executed the snippet, never the step.
    resolution: >-
      Cured in 2fca39e821, at the layer that touches the base first: the reachability probe and a
      guarded diff now sit in the shell, ahead of everything, and the snippet keeps its own copy
      because the tests still execute it directly. Proven by
      test_the_step_itself_runs_the_guard_when_the_base_ref_is_unreachable, which fails against
      main's copy (receipt at 14:46:34Z) and passes here.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    verdict: BLOCK
    objection: >-
      `git cat-file -e <sha>:<path>` reaches for the blob, and this checkout is
      `filter: blob:none` — so a failed promisor fetch and a genuinely absent path both return
      non-zero, and the second reading takes the head-only branch the block exists to refuse.
    resolution: >-
      Cured in 2fca39e821: existence is asked of the tree with `git ls-tree --name-only`, which a
      blob:none clone already holds. Empty stdout means absent (innocent, head-only is correct);
      non-zero means the base tree could not be listed at all (fails closed).
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    verdict: BLOCK
    objection: >-
      No validation of the sentinel's verdict word: an exit-0 with empty stdout would write the
      literal line `run=` to $GITHUB_OUTPUT, and both downstream steps compare it against 'true'
      and skip — a disarmed guard with no red anywhere.
    resolution: >-
      Cured in 2fca39e821: a `case "$RUN"` accepting exactly {true,false} and failing closed on
      anything else, placed BETWEEN the snippet and the write. Pinned structurally by
      test_the_step_refuses_a_verdict_that_is_not_a_verdict_word, which also asserts the write
      does not precede the validation; it fails against main's copy.
  - seat: kimi-code/k3
    status: CONFIRMED
    verdict: PASS-WITH-CONDITIONS
    objection: >-
      Condition (a): the innocence test fabricated its base with `git hash-object -t tree
      /dev/null` (no -w) plus `git commit-tree`, which errors at setup on a runner with no
      committer identity — removing the only guard against fail-closed over-matching — and built
      the commit in a repo the sentinel did not run in.
    resolution: >-
      Already cured in bfb31e9e5d, which predates the review's arrival: the test now uses a REAL
      commit from this repo's history (the parent of the commit that introduced the workflow),
      asserts that base really lacks the file before relying on it, and runs the sentinel in the
      repo where that commit exists. Green in every corpus receipt above.
  - seat: kimi-code/k3
    status: CONFIRMED
    verdict: PASS-WITH-CONDITIONS
    objection: >-
      Condition (b): the comment and the test docstring for condition 1 asserted a queue collision
      that does not exist — they claimed a merge_group `cancel-in-progress: true` lets the next
      entry cancel the one ahead. Prose that states a false mechanism is worse than no prose: the
      next reader inherits it.
    resolution: >-
      Cured in b1c1c776ac. Both now state the measurement (queue refs are
      `gh-readonly-queue/main/pr-<N>-<sha>`, one per entry, so with `github.ref` in the group key
      no two entries share a group), name the two seats that confirmed it and the 2026-07-27
      comment in security.yml that reached it first, and say what the line actually buys: defence
      in depth against a future key that loses `github.ref`, not a live bug fix. This is the same
      finding the brief carries as open_finding MERAH-1, now closed in the file rather than only
      recorded.
open_findings:
  - id: MERAH-2
    title: "The innocence half of the shell test does not execute on a developer Mac"
    detail: >-
      test_the_step_still_declares_a_no_op_when_the_base_is_readable skips below bash 4, because
      /bin/bash on macOS is 3.2 and cannot parse the heredoc-inside-$( ) shape the step ships. It
      runs on ubuntu-latest, which is where the workflow actually runs, so the guarantee is
      asserted where it matters — but an M5 session gets 54 passed / 1 skipped and must not read
      that as full local coverage. Recorded rather than hidden behind a green count.
