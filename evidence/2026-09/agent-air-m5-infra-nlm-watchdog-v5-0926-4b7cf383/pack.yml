dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      The strongest objection is that this monitoring organ can itself
      fail, return launchd success, and preserve a stale healthy
      heartbeat — the exact silent-failure class it claims to eliminate.
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: >-
      Even ignoring the PII line, this PR registers a living organ that
      does not live — nothing is installed, launchd execution of the
      exact ssh command shape is unproven, and the registry now asserts
      a heartbeat no process will ever write.
    status: CONFIRMED
  - seat: tp1-qwen3.8-max
    objection: >-
      Even if the import is made resilient, the entire design rests on
      _run from auth_sentinel behaving as a total function (never
      raising). If _run can throw OSError on a missing ssh binary or
      FileNotFoundError, the same no-heartbeat gap reappears through a
      different door — the dependency on an external module's internal
      contract, not just its import surface, is the real fragility.
    status: RETRACTED
  - seat: codex-gpt-5.6-sol
    objection: >-
      The strongest objection is the still-bypassable PII guard. Full
      pytest was environment-blocked because the read-only sandbox
      exposes no writable temporary directory; 27 direct tests plus AST,
      shell, plist, registry, and conformance checks passed.
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: >-
