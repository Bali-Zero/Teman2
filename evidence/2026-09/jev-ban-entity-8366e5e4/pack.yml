dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      "HIGH — in_scope() collapsed catE's two different exclusion lists into one, so vendor/ and
      examples/ were dropped before composition while the constructor grep still scans them. A file
      there failed catE and passed here: the composed verdict was WEAKER than the regex alone, the one
      outcome Rule 3 exists to forbid."
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "HIGH — every redaction rule required at least one character before KEY/TOKEN/SECRET, so a
      variable named exactly TOKEN was not redacted and its value left the machine verbatim."
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "MEDIUM — the prefilter anchored on requests.post, missing axios, aiohttp, http.client and
      Session().post; a file pulling url, credential and model from config was judged by nobody."
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection: "LOW — --json printed a diagnostic line before the object, so json.loads() on the output raised."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "The test-directory exclusion used tests?/ and so also excluded a singular test/ directory, which
      catE does not exclude — same class as the vendor/ finding, found independently."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      'A quoted JSON or dict key puts a quote between the name and the colon, so neither assignment rule
      fired on {"api_key": "opaque-value"} and the value left verbatim. AKIA AWS ids were also absent
      from the literal shapes.'
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "The transcribed assignment predicate requires a non-quote after the equals sign, so a quoted
      export escapes it."
    status: PLAUSIBLE
  - seat: claude-sonnet-5
    objection:
      "All 17 grep-missed guilt cases name their vendor in plain text, so a case-insensitive keyword
      search scores 17 of 17 on the same set. The lane's headline recall therefore demonstrates far less
      than it appears to, and 9 of the 20 innocence cases share no vocabulary with the guilt set, which
      bounds what the zero-false-alarm figure means."
    status: CONFIRMED
  - seat: claude-sonnet-5
    objection:
      "The corpus contains no case that defeats keyword search (obfuscated import, bare constructor with
      no credential kwarg, cross-file registry indirection, a non-Python SDK, a third-party CI action),
      and no hard innocence case such as a TYPE_CHECKING-only import or a mocked client."
    status: CONFIRMED
  - seat: claude-opus-5
    objection:
      "Stronger redaction cost recall: the same bench fell from 16 of 17 to 15 of 17 after the seats'
      redaction fixes landed. Sending less signal is correct under the output boundary, but the trade is
      real and is recorded here rather than absorbed silently."
    status: CONFIRMED
  - seat: claude-sonnet-5 (refute-prose-lint)
    objection:
      "The blocking prose step exits 0 on every push to main before it computes anything, because
      its base sha comes from a pull_request context that a push does not have. The workflow's own
      header justifies the dual trigger as defence against autonomous direct-push - for this step
      that was exactly the case where it did nothing."
    status: CONFIRMED
  - seat: claude-sonnet-5 (refute-prose-lint)
    objection:
      "A changed set of one clean .py and one out-of-scope file printed '1 file(s) scanned, clean'
      while never reading the file carrying the shape - the same 'scanned nothing, reported clean'
      lie the lint's own header says it exists to prevent."
    status: CONFIRMED
  - seat: claude-sonnet-5 (refute-prose-lint)
    objection:
      "Four ordinary engineering comments red on a BLOCKING step - a bare mention inside parentheses,
      a null in a schema, a null in a bug report, a cross-reference to an SDK signature. A false red
      on a blocking gate teaches people to route around it."
    status: CONFIRMED
  - seat: claude-sonnet-5 (refute-prose-lint)
    objection:
      "The vendor name written INSIDE the placeholder hole evades the check the comment claims to
      make, because only the owner was inspected and never the value."
    status: CONFIRMED

unresolved:
  - "The corpus is not extended with the seats' hard cases in this PR. They are written out verbatim in
    the council transcripts and are the first work of the follow-up; arming the step should wait for
    them, which is why this ships advisory."
  - "Cross-file indirection remains outside the lane's reach by construction."
  - "A homoglyph defeats every prose predicate and is pinned as a documented limit by a test that
    asserts it still slips. The guard is built against honest description, not against an author
    smuggling a credential past themselves."
  - "Markdown is out of scope. Read as prose it produced 335 findings across 47 documents, and read
    as narrative only - fences and indented blocks excluded - still 60 across 12. Documents are a
    second concern and a second PR."
