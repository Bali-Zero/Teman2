diff:
  behaviour_change:
    Two steps are added to the CI lint that already owns the paid-endpoint ban. The first composes the
    two incumbent greps with a System One model's per-route judgment using OR, so it can only ADD a
    finding and never clear one, and it is advisory — it always exits zero. The second is blocking and
    carries no model at all - it reads comments and docstrings in the changed files and fails when one
    spells a shape the repo bans. No existing check changes its verdict; the workflow's path filter
    widens to the suffixes the new steps inspect.
  surface:
    Four new scripts, two new test modules, one new fixture corpus, one frozen pardon list, one workflow
    edit. No backend, no frontend, no migration, no data, no credential.
