unresolved:
  - "THE CROSS-FAMILY REFUTATION IS MISSING. Two refuting seats were dispatched; the Claude one
    delivered and every one of its findings is in dissent above. The codex-gpt-5.6 seat was still
    running when this PR was committed and was asked to report what it had rather than be waited
    out. Recorded as an absence rather than omitted: half this artifact's refutation is a seat that
    did not return, and the gate should weigh it as such rather than read six confirmed findings as
    a thorough review. If it reports later, its findings belong in a follow-up, not in this pack."
  - "The fence makes arming a vendor require a merge; it does not make it require a ruling. A PR could
    add an entry with no ruling behind it. test_the_shipped_list_authorizes_nothing_today makes that
    addition loud rather than impossible, and tying the entry to a RULINGS.md citation mechanically is
    a further step this PR does not take."
  - "One client, one list. A second vendor client added elsewhere inherits nothing unless it reads the
    same file, and nothing yet enforces that it does."
  - "Conditions 1 and 2 of the #6968 ledger row (the trigger narrower than the scanner, and the 16-vs-11
    prose drift) are untouched here and stay open on that row."
seat_fallback_reason: |
  agy-gemini-3.1-pro is a RESERVE seat and played in place of tp1-qwen3.8-max, which
  arsenal_probe.py --read-last reports QUOTA_DEAD (read this turn; it is the last recorded probe,
  roughly four hours old at the time of writing, not a fresh dial — stated because a stale probe
  read as live is its own defect). tp1-glm-5.2 and tp1-deepseek-v4-pro are QUOTA_DEAD in the same
  record, so the TP1 bench was unavailable in full.

  codex-gpt-5.6-sol, the other titolare, was dispatched TWICE and returned nothing within the
  window: once as a subagent (still running ~45 minutes after dispatch, asked to report what it
  had and did not) and once directly through the codex CLI (still running when this pack was
  written). Its absence is recorded in `unresolved` rather than counted, and the reserve does not
  stand in for it — the quorum here is kimi-code/k3 (titolare) plus one reserve, which is why this
  field exists at all.
dissent:
  - seat: agy-gemini-3.1-pro
    objection: "HIGH — test_model_saying_no_cannot_clear_the_grep, the anti-AND test that exists to prove a model false negative cannot open the gate, was vacuous: without the fixture the fence made the client unavailable, the model was never asked, and the test passed on the grep alone. The most important test in the file, and the FIFTH vacuous one in this lane."
    status: CONFIRMED
  - seat: agy-gemini-3.1-pro
    objection: "LOW — AUTHORIZATION.read_text() used the locale default encoding while the shipped file carries non-ASCII in its _doc, so under LC_ALL=C a VALID authorization would decode-fail into a refusal. Fail-closed, but wrong for the wrong reason."
    status: CONFIRMED
  - seat: agy-gemini-3.1-pro
    objection: "MEDIUM — claimed scripts/tests/test_vendor_authorization_fence.py is outside the workflow paths:, so the gating tests could be weakened without starting the gate."
    status: RETRACTED
  - seat: kimi-code/k3
    objection: "MEDIUM — nothing TESTED the rejection of a case variant, a whitespace-padded entry or a trailing slash: `==` rejects them today by accident of the operator rather than by a pinned decision, so a normalising mutant would pass the corpus. Three cases added."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: "MEDIUM — Path(__file__).resolve().parents[1] anchors wherever the file lives, so a COPY of the client outside the repo reads a different authorization file, or none. Raised independently by the gemini seat in the same round."
    status: PLAUSIBLE
  - seat: kimi-code/k3
    objection: "LOW — 'starts the gate' is proven only as 'the workflow runs'. Whether catE is a REQUIRED check is asserted nowhere in the diff; the branch-protection API was not readable from this session, so the blocking half stays unverified."
    status: CONFIRMED
  - seat: devils-advocate (claude-opus, dispatched WITHOUT the fix list and told to break the fence by executing)
    objection: "HIGH — infra/vendor-authorizations/** is in neither paths: block of catE-sovereignty-lint.yml, so the ONE file a PR must touch to arm a vendor is the one file that does not start the gate. The fence would have shipped with the disease it cures."
    status: CONFIRMED
  - seat: devils-advocate (same run)
    objection: "HIGH — the same hole exists on infra/ban-prose/grandfathered.json, which shipped in #6968: a PR touching only the pardon list never starts the workflow, so --base-ref never runs on the diff it exists to judge. Independently re-measured by the author of #6968, who reported it against their own lane."
    status: CONFIRMED
  - seat: devils-advocate (mutation run)
    objection: "MEDIUM — two mutants survived all corpus cases: an entry that CONTAINS the endpoint as a substring (a prefix case does not cover it, since a prefix does not contain what it prefixes), and the dict branch with its endpoint comparison removed (the only dict in the corpus carried the right endpoint)."
    status: CONFIRMED
  - seat: devils-advocate (same run)
    objection: "MEDIUM — test_ask_returns_none_on_a_non_utf8_body asserted nothing once the fence existed: ask() returned None at the fence and never reached the body the test is named for. It had been vacuous for exactly as long as nobody checked."
    status: CONFIRMED
  - seat: devils-advocate (same run)
    objection: "LOW — RecursionError escapes authorized()'s except tuple, so deeply nested JSON raises out of a step whose contract is that it never fails a build. Same class as the UnicodeDecodeError that once escaped ask()."
    status: CONFIRMED
  - seat: nuzantara-fa (the session that wrote this PR — recorded as self-criticism, not as a refutation)
    objection: "Every finding above was re-executed by the author before being accepted: the paths gap with fnmatch against the declared globs, the two mutants in an isolated copy of the tree, the vacuous test by breaking ask()'s except clause and confirming the test now goes red. A refuting seat's report is a claim until the receiving session runs it."
    status: CONFIRMED
