diff:
  behaviour_change: |
    The System One client refuses to speak unless its endpoint is listed in a new on-disk
    authorization file, which ships empty. A configured secret is no longer sufficient to open an
    outbound path — the authorization has to pass a merge. The refusal happens before the request
    payload is built, so source text is never serialised for an unauthorized endpoint. The degrade
    path is otherwise unchanged — no key or no authorization both mean "no opinion", the entity step
    stays advisory and still exits zero. The lint's degrade message now names WHICH silence it is in.
    Separately, three test corpora that no gating workflow executed are now run by catE.
  surface: |
    One new authorization file (empty), one new test module, two edited scripts, one edited test
    module, one workflow step. No backend, no frontend, no migration, no data, no credential.
