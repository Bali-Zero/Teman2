decisions:
  - id: D1
    decision: >-
      Ownership = `assigned_to` equals the signed-in viewer AND the status is
      one the row model knows is still moving (`viewerIsNext`). The mission
      prompt said `received_by`, which is the review record's field (K2b); a
      Client has no such field.
    reference: fusion/concept.md §1 "Copper appears only when the signed-in viewer is the next actor"
  - id: D2
    decision: >-
      Sweep the WHOLE route, not the WIP's nine files. The review seats found
      copper through `--bz-accent` (which resolves to copper on kita),
      `--state-danger` (re-aliased to copper), raw rgba copper and shadcn's
      default Button fill on tabs and modals the WIP had not touched; leaving
      them would ship a page whose copper still means hover, error or
      "primary" on six of nine tabs.
    reference: fusion/concept.md §3 needs-you row "never a fill"; FROZEN-v2 ruling 4
  - id: D3
    decision: >-
      Guards walk the directory (every non-test .ts/.tsx/.css under [id]/**)
      and ban shapes rather than parse hue: no raw colour literal in any
      syntax or case, no red/rose/orange/amber palette utility on any prefix,
      no template-built var name, no Button without a static
      outline|ghost|secondary|link variant, copper aliases only at the owned
      Stamp. Simpler than a hue parser and it cannot be argued with.
  - id: D4
    decision: >-
      Selection is ink (active tab, open Log toggle); primary actions are
      forest; destructive icon-only controls are neutral with an aria-label
      and title naming the action. Urgency reads --state-warning with a word.
    reference: fusion/concept.md §10 FORTE "ink selection"; mission rule "forest = done, primary button"
  - id: D5
    decision: >-
      Sticky tab bar at var(--bz-header-height, 48px) with an opaque base; the
      status column stays first in DOM and moves right at >=1100px by flex
      order only.
    reference: fusion/concept.md §6 sticky failure mode; K3 brief "where it stands column first on mobile"
  - id: D6
    decision: >-
      Viewer identity: synchronous cache first, then one unmount-guarded
      api.getProfile(); failure leaves the viewer unknown and paints no
      copper (fail closed).

