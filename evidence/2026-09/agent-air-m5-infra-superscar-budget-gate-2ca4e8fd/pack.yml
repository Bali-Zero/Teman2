      for every other guard in this file, not unique to this diff. Recorded as residual risk, not
      cured -- widening rename-detection for the whole sentinel is its own PR.
  - seat: codex-gpt-5.6-sol (cross-family refuter, foreground, sandbox read-only)
    status: RETRACTED
    objection: >-
      The `.prettierignore` coverage assertion inside `test_superscar_budget.py` (unchanged by
