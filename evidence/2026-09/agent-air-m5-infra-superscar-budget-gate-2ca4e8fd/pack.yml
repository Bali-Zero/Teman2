  (">= 2 build lanes"). Cross-family review pressure was placed correctly but the two named
  non-Anthropic seats (kimi-code/k3, tp1-qwen3.8-max) both failed to deliver a judgement this
  session -- one on quota (kimi), one on repeated timeout under this specific reasoning load
  (tp1, 4/4, while independently proven live for a trivial call). codex-gpt-5.6-sol delivered a
  substantive, non-trivial FAIL with 2 real in-scope findings (cured) and 2 named-and-declared
  out-of-scope findings. The independent Gear-3 gate (a separate Opus-5 dispatch, never reading
  the build lane's own reasoning, reproducing every claim from scratch in its own worktree) is an
  additional adversarial pass, same-family but methodologically independent (generator != grader,
  fresh context, its own attacks). See seat_override below for the R9 council-quorum rule.

