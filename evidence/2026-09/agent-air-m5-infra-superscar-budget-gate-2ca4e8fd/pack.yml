dissent:
  - seat: codex-gpt-5.6-sol (cross-family refuter, foreground, sandbox read-only)
    status: CONFIRMED
    objection: >-
      `.prettierignore` was not in the sentinel's path-detect list even though one of the test's
      three assertions reads it directly -- a PR that only edited .prettierignore (e.g. removing
      the cicatrix entries) would sail through the required check with the regression undetected.
      CURED in this PR: `.prettierignore` added to the case-block, verified to flip `relevant=true`.
  - seat: codex-gpt-5.6-sol (cross-family refuter, foreground, sandbox read-only)
    status: CONFIRMED
    objection: >-
      `scripts/tests/test_superscar_budget.py` itself was not in the trigger list, so a PR that
      weakened the guard's own test (raised the byte budget, deleted an assertion, gutted the
      completeness check) would not have exercised the new blocking step -- exactly the pattern
      every sibling guard in this same case-block already avoids by listing its own test file
      alongside its subject. CURED: entry added, verified to flip `relevant=true`.
  - seat: codex-gpt-5.6-sol (cross-family refuter, foreground, sandbox read-only)
    status: RETRACTED
    objection: >-
      `git diff --name-only` collapses a pure rename to its destination path, so renaming
      `cicatrix-superscar.md` out of `.claude/rules/` before padding it would skip the whole
