residual_risks:
  - >-
    The rename-away bypass codex-gpt-5.6-sol named (git diff --name-only collapses a pure rename
    to its destination path, so renaming cicatrix-superscar.md out of .claude/rules/ before
    padding it would skip the whole sentinel, not just this new step) is REAL and NOT fixed here.
    It is a property of the shared path-detect case-block used by ~150 other entries in the same
    job, not something this diff introduces -- fixing rename-detection repo-wide is a separate,
    much larger PR. Declared, not silently inherited.
  - >-
    The .prettierignore assertion inside test_superscar_budget.py itself (unchanged by this PR) is
    a substring check, so a commented-out (`# path`) or negated (`!path`) entry would still satisfy
    it. Pre-existing in the test file this PR does not touch; recorded as a residual risk, not
    cured -- fixing test logic is out of scope for an "arm the existing test" PR.
  - >-
    This PR promotes the SAME test into a second executor (immune-enforcement.yml) alongside the
    pre-existing nightly sweep (scripts-tests-sweep.yml), deliberately -- same pattern already used
    for test_prepush_failclosed.sh / test_prepush_tip_drift.sh in this file ("a single executor is
    a single point of silence"). Not a risk, stated so a future reader does not read the
    duplication as drift.
  - >-
    The second-headroom problem on cicatrix-superscar.md itself (PENDING-ARMS, opened 2026-08-25:
    the file is near its byte cap and a session was forced to trim a neighbour's entry to fit a
    new one) is untouched by this PR. This PR only arms the EXISTING budget test at PR time; it
    does not raise the cap, move content out, or otherwise change what counts against the budget.

