  seats from (codex-gpt-5.6-sol, kimi-code/k3, tp1-qwen3.8-max) marked ok:true in journal.jsonl.
  This pack has exactly 1 (codex-gpt-5.6-sol). The other two were both attempted and both failed
  to deliver, for measured, non-authorial reasons: kimi-code/k3 returned provider.auth_error 403
