plan_ref: >-
  PR #6461 (agent/air-m5/research/k2-pma-study) — PT PMA foreign-ownership adjudication for KBLI
  2025 residual codes; governing mandate: Zero 2026-09-13 (interactive), "si deve studiare dalle
  fonti governative per la certezza". Review round ran under workflow wf_28d1924f-b8d,
  2026-09-13/14.
lanes:
  - lane: k2-pma-study
    role: build
    seat: >-
      claude-sonnet-5 (session task-id k2-pma-study) — authored the study (sections 1-6, 30-code
      sample) and, after the review round below, amended it with section 7 "Contested points"
      and this pack's required "Adversarial review" section, resolving each of codex's
      objections against the primary sources fetched 2026-09-14.
  - lane: verify-codex
    role: review
    seat: >-
      codex (codex-gpt-5.6-sol, Codex CLI, sandboxed read-only, web search enabled by default via
      this machine's ~/.codex/config.toml). 18 independent queries, one per legal-chain class
      (1-8) and one per 10 of the 30 sample rows; 16/18 returned a substantive sourced answer.
      This is the R1 generator-not-equal-grader seat (adversarial_review: codex in the file's
      frontmatter).
  - lane: verify-skeptic
    role: review
    seat: >-
      claude-sonnet-5 (fresh instance, blind re-derivation of Pasal 3(1)(d) before opening the
      study, then a claim-by-claim cross-check). Same family as the author lane, so it does NOT
      count toward R1 generator-not-equal-grader; recorded here only as corroboration
      (contested nothing).
seat_diversity: exempt
seat_diversity_note: >-
  Only 1 build lane (k2-pma-study, claude-sonnet-5) — D3's seat-diversity floor binds only packs
  declaring 2 or more build lanes, so it does not apply here. The R1 generator-not-equal-grader
  requirement is satisfied independently, by the verify-codex review lane (a non-Anthropic seat)
  and the file's own adversarial_review: codex key plus its "Adversarial review" section.
diff:
