    3 files changed by `git diff --numstat origin/main...HEAD`, all insertions, no deletions: the
    research file (579 net lines at PR-open, now 621 after adding the adversarial_review
    frontmatter key and the "Adversarial review" section) plus this pack's own brief.yml and
    pack.yml. The exact byte total is not restated here, deliberately — editing this pack file
    changes its own line count, so a hardcoded number here would drift out of sync with itself on
    the very next edit; run `evidence_pack_lint.py --print-measured` for the live figure. No
    hot-zone path touched.
  behaviour_change: >-
    None. One research/docs markdown file plus this evidence pack. No code, workflow or
    hot-zone path touched.
