dissent:
  - seat: "codex (codex-gpt-5.6-sol, cross-family review)"
    objection: >-
      Row 17 (KBLI 2025 52291 Angkutan Multimoda) — the "67% often cited" cap belongs to a
      different activity (Jasa Pengurusan Transportasi) that shared the same 2020 code number,
      capped under the now-revoked Perpres 44/2016. Citing it for 2025-52291 is a code-identity
      error, not a defensible inference.
    status: CONFIRMED
    disposition: >-
      accepted — section 7.4 struck the 67% hint; row 17 stays PENDING with the corrected
      reasoning (no current Lampiran III row names the activity).
  - seat: "codex (codex-gpt-5.6-sol, cross-family review)"
    objection: >-
      Class 5 (UMKM-reserved) — the study's citation chain attributes the "every foreign
      investor is an Usaha Besar" rule to Pasal 7(1) alone, but the express PMA-equals-Usaha-Besar
      classification is stated in Permen BKPM 5/2025 Pasal 26(1).
    status: CONFIRMED
    disposition: >-
      accepted — section 7.1 corrected the citation chain to add Permen BKPM 5/2025 Pasal 26(1);
      the practical conclusion (UMKM-allocated field unavailable to a new PT PMA) is unchanged.
  - seat: "codex (codex-gpt-5.6-sol, cross-family review)"
    objection: >-
      Class 2 (central-government-only fields) — "not an investment field at all" overstates
      Pasal 2(3), which still names the category a Bidang Usaha, just one reserved exclusively
      to the Central Government.
    status: CONFIRMED
    disposition: >-
      accepted — section 7.2 corrected the wording to "activity reservation, not a stated 0%
      equity cap"; the practical result (0% for every private party) is unchanged.
  - seat: "codex (codex-gpt-5.6-sol, cross-family review)"
    objection: >-
      Class 3 (non-commercial illustration) — a "Pemerintah-titled / division-84" rule of thumb
      is unsafe: OSS's own description of KBLI 59131 (government film distribution) states the
      activity is commercial ("atas dasar balas jasa"), and KBLI 86101 (government hospital)
      carries a full commercial licensing scope.
    status: CONFIRMED
    disposition: >-
      accepted — section 7.3 withdrew the illustrative parenthetical; commercial/non-commercial
      status is now stated as decided per-activity/scope, never inferred from a title word or
      division number.
  - seat: "codex (codex-gpt-5.6-sol, cross-family review)"
    objection: >-
      Row 7 (KBLI 42101 road construction, 67%/70% BUJK PMA foreign-ownership cap) — codex could
      not complete an independent verdict; its CLI entered a compact/restart loop and was killed
      twice after roughly 24 minutes each.
    status: PLAUSIBLE
    disposition: >-
      survives, unresolved — self-reviewed instead from this session's own B-oss.md (not
      independent); section 7.5 found a government annex row (Lampiran II row 26) allocating the
      simple/intermediate-technology scope of 42101 to UMKM, but the percentage claim for the
      remaining scope is still unverified against a primary source and stays flagged as such.
  - seat: "codex (codex-gpt-5.6-sol, cross-family review)"
    objection: >-
      Row 30 (KBLI 93199, whether the 51106 air-transport BPS-concordance ancestor pulls in a
      49% foreign-ownership cap) — codex produced no substantive answer within the session.
    status: PLAUSIBLE
    disposition: >-
      survives, unresolved — section 7.6 found no Lampiran III row names 51106 (string search
      only, not a full row-by-row read), so no Perpres 49/2021 cap is shown to reach 93199
      through that ancestry on the text read so far; the row stays PENDING pending a full
      Lampiran I/II read and aviation sector law (UU 1/2009).
