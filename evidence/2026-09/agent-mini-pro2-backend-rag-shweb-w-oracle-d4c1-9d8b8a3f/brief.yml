objective: >-
  Contract-only PR: add exactly one new wire fact, `investment.investment_amount_usd`, to the
  closed FactPath vocabulary, so a later PR (D4c-2) can ask an investment applicant for an
  amount in USD. `fact-mapper.ts` builds a typed literal against apps/mouth's generated OpenAPI
  types, and `ApplicantFactsData` is `frozen=True, extra="forbid"` — a closed object that
  rejects an undeclared key at request time — so the key must exist on the wire before D4c-2 can
  send it. No question, no mapper change, no corpus walk, no rule: this PR adds vocabulary only.
  The transitional default (`UnknownFact(status="UNKNOWN", reason="NOT_ASKED")`, following
  `_RENEWAL_PAID_ROLLOUT_DEFAULT` verbatim) is what makes the Fly/Vercel deploy-order split not
  matter, exactly as it did for `immigration.renewal_paid` (2026-08-24) and the three
  2026-08-23 facts before it.
