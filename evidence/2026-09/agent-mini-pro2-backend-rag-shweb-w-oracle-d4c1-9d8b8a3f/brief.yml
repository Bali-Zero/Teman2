self_report:
  note: >-
    Two premises in the dispatch brief turned out wrong, both discovered by running the actual
    commands rather than trusting the brief's framing — reported rather than silently worked
    around, per this mandate's own stop-and-report rule.

    (1) "Both are tracked" (of openapi.json/schema.d.ts) is false for openapi.json:
    `git check-ignore -v apps/backend-rag/openapi.json` shows it is `.gitignore`d
    (`.gitignore:780`, untracked since commit 7070c5ea3f, "untrack 124 runtime artifacts"). It
    was still regenerated (needed as `generate:api`'s input) and verified to contain the new key
    at the right path, but there was never anything to commit for it.

    (2) schema.d.ts itself is real and tracked, but was last regenerated 2026-08-24
    (`git log -1 -- apps/mouth/src/lib/api/schema.d.ts` = 6ee7f50d1e) — 20 days stale against
    the live backend surface at HEAD. `create_app()` unconditionally uses `include_routers()`
    (the full monolithic union, confirmed by reading app_factory.py), so a faithful
    `npm run contract:visa-oracle` regen is correct but pulls in ~15 unrelated endpoint groups
    added to main since then (compliance/obligations, crm/garuda/assignment-targets,
    visa/voa/*, workspace-marketing/*) — verified this is pre-existing drift on origin/main
    itself, not a fork-point artifact (`git diff HEAD origin/main -- apps/mouth/src/lib/api/
    schema.d.ts` is empty; the two newer origin/main commits are unrelated). Measured:
    raw regen diff before prettier, 109048 lines (formatting-only, tool default 4-space vs.
    repo's prettier 2-space); after `npx prettier --write` (the repo's own pre-commit gate would
    otherwise reject it), 2923 lines (2876 insertions, 47 deletions) — still far past
    evidence_pack_lint.py's SIZE_GEAR2_THRESHOLD (400) and SIZE_GEAR3_THRESHOLD (1828, churn),
    which would force this contract-only PR's floor to Gear 3 on size alone. Committing it would
    also bundle ~15 endpoint groups nobody asked this PR to touch into a diff framed everywhere
    else (dispatch, this brief, the commit message) as "exactly one wire key."

    Decision taken: commit the backend-rag Python-side vocabulary change in full (floor
    verified at Gear 1); do NOT commit the schema.d.ts regeneration. apps/mouth is therefore
    untouched by this commit — the one respect in which this session's diff is narrower than
    the dispatch brief asked for. The regenerated openapi.json/schema.d.ts were produced locally
    (openapi.json still present on disk, gitignored either way; schema.d.ts was reverted to
    HEAD with `git checkout --`) to prove the mechanism works and the new key appears correctly
    in both, but neither is staged. Recommendation, not a decision made on Zero's behalf: either
    accept the full schema.d.ts catch-up in a follow-up commit/PR with Gear-3 evidence (a
    reviewer would then see the ~15 unrelated groups named, as here), or run a separate,
    dedicated "resync schema.d.ts to current backend" PR first (its own concern, no code
    change), after which D4c-2's own contract regen — which needs this anyway for
    `fact-mapper.ts` — would produce a small, easily-reviewed diff limited to whatever is new by
    then.
