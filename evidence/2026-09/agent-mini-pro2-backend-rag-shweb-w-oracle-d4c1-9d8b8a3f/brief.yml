gear_reason: >-
  Measured with the inputs CI uses — `git diff --name-only origin/main...HEAD > /tmp/f.txt &&
  git diff --numstat origin/main...HEAD > /tmp/n.txt && python3 scripts/evidence_pack_lint.py
  --print-floor --changed-files-file /tmp/f.txt --numstat-file /tmp/n.txt`, re-run after the
  LAST commit to this brief so it is self-inclusive of THIS file's own final size. The paired
  `--print-floor-source` invocation (same two input files) names WHY: the "size" term (total
  churn against SIZE_GEAR2_THRESHOLD (400) and SIZE_GEAR3_THRESHOLD (1828)) or the "path" term
  (a changed path matching a hot-zone pattern), independently of each other — a caller who wants
  the actual gear number or its source runs these two commands, which is also how the `gear:`
  field above was set. No bare floor or churn figure is written into this prose on purpose: this
  file is part of the diff it measures, so any number typed into this sentence goes stale the
  moment a LATER commit changes this sentence's own length, and this mandate has already paid
  for that lesson twice — once here (an earlier cut of this field quoted a specific returned
  number that drifted the moment a follow-up commit changed this file's line count, fixed by a
  correction commit rather than a permanently-correct number, because no number typed in prose
  can stay one) and once on PR-D4d's brief, the identical failure in a different PR. Dropping
  `--numstat-file` changes the size term's answer (it needs the raw per-file rows, not a
  pre-summed total) while leaving the path term unaffected — run both files together, not
  interchangeably, to reproduce the value in `gear:` above.
