dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      Round 1, REJECT: attaching DEVELOPER_EMAILS to verify_debug_access grants
      arbitrary read-only SQL over the production client book through
      POST /api/debug/postgres/query, plus trace deletion and profiling —
      strictly more authority than the CRM admin role the design claimed to
      avoid.
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: >-
      Round 1, REJECT: same architectural defect found independently, with the
      cure that was adopted — "split the dependency, e.g. a read-only gate for
      /api/admin/logs/*". Also: the containment claim in the docs and tests was
      false as written.
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection: >-
      Round 2, REJECT: the bare `except HTTPException: pass` swallowed the
      production 403 kill-switch, so a listed developer could pass a
      precondition meant to close the routes for everyone.
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection: >-
      Round 2, REJECT: the developer branch checked only signature, type and
      email — a revoked or logged-out session kept log access until the token
      expired on its own.
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: >-
      Round 2: test_developer_perimeter_does_not_make_a_crm_admin is vacuous —
      is_crm_admin never reads developer_emails, so it passed under the REJECTED
      round-1 implementation too, while reading as containment proof.
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: >-
      Round 2: the exp / require_exp axis rested on python-jose's semantics
      rather than on a red test, unlike every other axis.
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: >-
      Round 2: "runtime observability" undersells the surface —
      /api/admin/logs/interactions returns client_email, client_name, subject
      and message_preview, so the grant is an owner decision about client data,
      not only about logs.
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: >-
      Round 2: if the issuer omitted the `type` claim, the stricter check would
      make the feature silently dead in production.
    status: RETRACTED
  - seat: codex-gpt-5.6-sol
    objection: >-
      Round 2: the delegation performs one JWT decode for admins and two on the
      developer path, a timing distinction.
    status: PLAUSIBLE
  - seat: claude-opus-5
    objection: >-
      Self-dissent, unresolved by design: the grant is per-address but not
      per-endpoint-set. If a future PR adds a mutating route to admin_logs.py,
      it inherits the developer grant silently. No test pins the CURRENT five
      endpoints as the whole set.
    status: PLAUSIBLE
