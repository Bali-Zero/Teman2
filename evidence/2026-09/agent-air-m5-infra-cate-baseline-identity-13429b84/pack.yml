dissent:
  - seat: kimi-code/k3
    objection:
      "HIGH — a `+++` header git had quoted was not recognised, so the quoted file's added lines
      were recorded under the PREVIOUS file in the diff. Stage a paid call site in a non-ASCII
      filename behind an excluded neighbour and the gate judged it not at all."
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "HIGH — same defect, found independently and reproduced with a two-file synthetic diff:
      the call line came back attributed to tests/a.py and the predicates then found nothing."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "HIGH — text=True decodes strictly, so one Latin-1 byte in a staged file made git diff
      undecodable and the traceback left the hook as a hard block on an innocent commit."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "HIGH — the exclusion was applied to the path, while the incumbent applies it to the whole
      path:lineno:content output line. The local copy therefore refused lines CI allows, which
      is the direction that gets a gate switched off."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "MEDIUM — the scanner half read the working tree, so after git add -p it judged content the
      commit does not carry, contradicting the script's own scope paragraph."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "LOW — --baseline on detect_secrets_check_unaudited.py was dead: the gate re-implemented the
      residue rule rather than calling it, leaving two definitions of unaudited."
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "MEDIUM — unsetenv ends in setenv, so the assignment predicate fired on a defensive strip
      the workflow's own comment calls allowed. Latent in CI, immediate for a pre-commit gate."
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "MEDIUM — the budget corpus ran the extracted CI block under sh. On an Ubuntu runner that is
      dash, which has no pipefail, so the corpus was exercising a shell the workflow never uses."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "The grep halves inherit the incumbent exclusions verbatim, so any path or line carrying the
      test prefix as a substring is dropped by both. CARRIED, not fixed: parity in both directions
      is the design, and narrowing only the local copy would make it disagree with the gate it
      mirrors."
    status: CONFIRMED
  - seat: claude-opus-5
    objection:
      "A scanner ERROR, unlike a missing binary, still fails open. It says ERROR rather than
      skipped, but the commit proceeds. CARRIED: CI is the net, and failing closed would block
      every commit on any scanner crash — the worse failure for a pre-commit gate."
    status: CONFIRMED
