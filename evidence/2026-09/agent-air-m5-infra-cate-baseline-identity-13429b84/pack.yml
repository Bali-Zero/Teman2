diff:
  behaviour_change:
    The paid-constructor step keeps its shape and loses its slack. The committed budget goes
    from 3 to 0, so any hit is red; the budget is counted by awk and range-checked, because at
    zero the old arithmetic disarmed the comparison instead of tightening it. The assignment
    alternative gains a word boundary, which stops it flagging a strip its own comment calls
    allowed. Two docstrings stop spelling the pattern they describe. A new pre-commit step runs
    the same predicates over the staged diff before the commit exists. No existing check loses
    a verdict.
  surface:
    Two workflow steps added, one workflow step tightened, one budget file drained, one hook
    step added, two docstrings rewritten, two scripts given a --baseline flag and unknown-flag
    rejection, one new script, two new corpora. No backend, no frontend, no migration, no data,
    no credential.
