dissent:
  - seat: codex-gpt-5.6-sol and kimi-code/k3 (MEDIUM, converging — accepted)
    objection: >-
      "The pin covers the two knobs C2 named. TG_REPEAT_LADDER_H and TG_DEATH_FLOOR_H are parsed with a
      bare float() at import; garbage in either kills the gateway before it writes a row and turns the
      corpus 6/7 for a reason unrelated to the wrapper."
    status: CONFIRMED
    resolution: >-
      "Fixed in the second commit by removal: run_case drops every exported TG_* in a subshell and sets only
      its pins, so a knob added to the gateway later cannot reach the corpus either. The gateway's own
      unguarded float() is a separate defect of the gateway — every production alert dies on a garbage
      value there — and is not touched by this PR."
  - seat: codex-gpt-5.6-sol (LOW, pre-existing — accepted)
    objection: >-
      "The corpus never reads origin_tier: a wrapper mutated to --tier act keeps every field it asserts."
    status: CONFIRMED
    resolution: "Fixed: the GUILT case asserts origin_tier == p0; the mutant now fails exactly that check."
  - seat: kimi-code/k3 (LOW — accepted)
    objection: >-
      "The corpus pins the gateway's env but not its own switches: an exported GATEWAY_MODE=stub turns every
      real-gateway case into a stub case."
    status: CONFIRMED
    resolution: "Fixed: GATEWAY_MODE and STUB_RC are unset at the top; per-case assignments still apply."
  - seat: session (declared limit)
    objection: >-
      "C3 — the first real cron-fail row on Pro's board carrying an underscore key and an existing witness —
      is not closed by this PR."
    status: CONFIRMED
    resolution: >-
      "It cannot be: it waits on a real cron-wrapper failure after #7033's merge. It stays open on the
      PWC-7033 row, with the proof the row names."
