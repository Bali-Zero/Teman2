      from the gate's report alone.
    cmd: >-
      loaded origin/main's LORI_59 table via ast.literal_eval, counted
      password occurrences, and computed sha1(pwd)[:8] for the one with
      count==3
    result: "length=9, count=3, sha1[:8]=0470deac — matches the gate's report"
    exit: 0
    ts: "2026-09-27T01:07:14Z"
    seat: session
