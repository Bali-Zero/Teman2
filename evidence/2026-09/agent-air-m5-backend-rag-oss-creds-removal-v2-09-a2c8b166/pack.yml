seat_override: >-
  Gear-3 council_run quorum not met: secret-bearing diff (this PR's deleted
  lines ARE the leaked credentials) — no external seat may see it. The fresh
  gate session grading this PR is the second opinion in its place.
pii_scan: clean
pii_scan_note: >-
  This diff's `+` lines introduce zero new PII: the credential removal
  DELETES 57 username/password pairs and REPLACES one leaked username plus
  an example password-shaped string with `[REDACTED]` in the archived
  training doc. The rewritten script's `+` lines retain the 59 PT-company
  names and numeric company_id values already present in the pre-fix file
  since 2026-04-07 (business identifiers, carried forward unchanged in
  content, not introduced by this PR). Neither this pack, brief.yml, nor
  the PR body quotes any company name, any credential value, or any
  synthetic look-alike — verified by the hash/substring receipts above,
  which is the discipline the PREVIOUS pack (PR 7477) failed to apply to
  its own dissent prose.
dissent:
  - seat: fresh gate (external review of PR 7477, not this lane)
    objection: >-
      PR 7477's evidence pack (evidence/2026-09/agent-air-m5-backend-rag-oss-creds-removal-0927-0e381f65/pack.yml,
      a dissent entry describing a "near-miss") re-committed one REAL
      removed OSS password in cleartext — a 9-character value shared by 3
      rows of the merge-base table, sha1[:8] 0470deac. The pack had called
      it "an example value, not a leaked real credential" and attributed it
      to the archived doc; both claims were false — it was one of the 48
      real distinct passwords, verified independently by this PR's own
      hash-comparison receipt above.
    status: CONFIRMED
    resolution: >-
      PR 7477 closed, superseded by this PR. This PR was built on a FRESH
      origin/main worktree, cherry-picking only the code/gitignore/lint/doc
      commits from the old branch (never the tainted evidence directory),
      and this pack/brief are authored from scratch with the near-miss
      described by hash and count only (one 9-char token, hash 0470deac,
      removed) — never the value. Before pushing, this PR's entire diff was
      checked for exact-substring containment against all 105 removed
      username/password values (receipt above): 0 hits.
  - seat: catE-sovereignty-lint (CI, PR 7477)
    objection: >-
      scripts/lint_no_inline_credential_tables.py:2,8 spelled the banned
      `assigned-value` shape (a credential-named variable given `=` and a
      value) inside its own INCIDENT docstring, while explaining what
      detect-secrets missed.
    status: CONFIRMED
    resolution: >-
      Reworded to name the shape without writing it, per lint_ban_prose.py's
      own suggested cure. Re-verified clean against that lint, and the
      guard's own guilt/innocence corpus and repo-wide scan both still pass
      unaffected (receipts above).
  - seat: session (self-review, mid-task on PR 7477's build)
    objection: >-
      Two structural verification commands while grounding PR 7477 printed
      content that diff's own constraints forbade: a redaction-preview
      regex that only handled double-quoted strings let 5 already-public
      company names print in cleartext (the real table used single-quoted
      output); reading the script's docstring for context printed 7 more
      already-public company names.
    status: CONFIRMED
    resolution: >-
      Flagged inline in the same turn on PR 7477, not repeated since. Not
      correctable after the fact (values already in that session's
      transcript) — carried here as a disclosed limitation of the prior
      build, not reproduced in this pack.
