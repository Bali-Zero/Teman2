      chunk 9807-96d60b31ba444894.js carrying the same names. The cause is on base: SocialProof.tsx
      is "use client" at line 1 and imports rosterBySlug at line 5 of HEAD — this window added
      neither. The cure (resolve the roster server-side, pass props) edits /v2/page.tsx, outside
