council_run: journal.jsonl

dissent:
  - seat: gemini-3.1-pro (refuter, PRE on the built candidate and POST on the frozen head)
    objection:
      'BLOCKER — "the roster reaches the public client JS bundle, so the two excluded people are
      fetchable on every public route; the exclusion is defeated for anyone who opens the bundle."
      And, in the POST round: "an unknown slug is allowed through, so { slug: ''faysha'' } misses the
      roster, falls back to printing the SLUG as the display name, and bypasses the filter entirely."'
    status: CONFIRMED
    resolution:
      "Two findings, both true, handled differently and deliberately. The BUNDLE one is real and
      MEASURED — every public route ships a chunk carrying both names — but it is PRE-EXISTING:
      SocialProof.tsx is 'use client' at line 1 and imports rosterBySlug at line 5 OF THE BASE
      COMMIT, and production today already ships chunk 9807-96d60b31ba444894.js with the same names.
      This window neither caused it nor worsens it, and the cure edits /v2/page.tsx, outside the five
      declared consumers. Declared as a partial exclusion under FINAL §2.18, ruled by the SHWEB
      imperator, with the follow-up PR's perimeter granted in advance. The UNKNOWN-SLUG one was a
      genuine hole and is FIXED: two consumers resolve `rosterBySlug(slug)?.name ?? slug`, so an
      unknown slug is allowed but is NOT anonymous — isPublicSlug now rejects a slug matching an
      excluded name or alias, with a test and a red mutant. Three further claims were REFUTED with
      evidence rather than accepted: that the names reach the rendered HTML (measured 0 on all six
      routes); that `initials` is an undefined type hole (TeamMember declares it at line 33 and
      resolve() computes it at line 56, and tsc is clean); and that contract-lock.json is a disguised
      second lockfile (it is this pack's freeze record, in evidence/, read by no package manager)."
  - seat: kimi-code/k3 (second reader, PRE on the plan and POST on the frozen head)
    objection:
      'F1/BLOCKER in the PRE round — "the guilt-mutant acceptance is undetectable for two of the four
      consumers, whose spec lists contain neither excluded person, so deleting the filter changes zero
      rendered output and the acceptance fails its own proof." Then, in the POST round: "the e2e leak
      check can snapshot the HTML before the team section exists — a probe that cannot distinguish
      ''section absent'' from ''section clean'' is vacuous"; "the name guard misses the alternate
      spelling the module itself documents (faysha)"; "the photo probe hardcodes guessed paths"; and
      "the focus predicate is trivially satisfied by links that always carry a border-bottom."'
    status: CONFIRMED
    resolution:
      "Every one accepted and fixed, and the last three were defects in the probes this window wrote
      — the review caught the proof, not the product. (1) Each consumer probe now INJECTS an excluded
      slug into a roster that consumer really renders, so 'delete the filter' goes red on a person
      that consumer actually publishes; mutant-verified. (2) The sweep now waits for a per-route
      presence marker — somebody who must be visible — before it reads the document, so it cannot
      pass by measuring an empty page. (3) 'faysha' — the owner's own spelling and the roster email
      prefix — is now in a separate alias list folded into the NAME set (it cannot go in the slug
      list, which is pinned to real roster slugs), with a test. (4) The portrait paths are now DERIVED
      from the roster and matched against the DECODED document: measured on the served page, a
      portrait reaches the HTML 15 times URL-ENCODED through next/image against 1 literal time, so
      the old literal-string assertion was very nearly vacuous. The same defect was then found in the
      'portraits decoded' filter, which matched nothing on a built page; fixed, and it immediately
      caught real lazy-loading behaviour, so the probe now walks the page before asserting. (5) Focus
      is proven by a computed-style DELTA focused vs blurred, which the old predicate could not do.
      One finding REFUTED with its source: #e3e1da is not a Direction-A tone, it is the live value of
      --border-default and --rp-card-border in rumahVars.ts:37,38,44."
  - seat: tp1-qwen3.8-max (council, the filter module and every consumer call site)
    objection:
      'MAJOR — "`if (e.slug) return isPublicSlug(e.slug);` short-circuits on the slug, so an entry like
      { slug: "kadek", nameOverride: "Faisha" } carries an allowed slug, never has its name inspected,
      and republishes the excluded person under the override the consumer renders." MINOR — "EXCLUDED.has
      is case-sensitive, so isPublicSlug(''Faisha'') misses the set, falls through to a roster lookup
      that returns undefined, and returns true."'
    status: CONFIRMED
    resolution:
      "Both true, both fixed, and the first is the most instructive finding of the round: it was a hole
      created BY the fix for Gemini's slug-less finding — one seat's correction became the next seat's
      defect, which is the argument for a second family rather than a second opinion. publicEntries
      now checks nameOverride FIRST, with or without a slug; and every comparison in the module goes
      through one norm() (NFKC, then Cf-stripping, then trim and lowercase) applied to BOTH sides, so
      the guard no longer depends on the caller being careful. Zero-width characters are stripped too
      — they survive NFKC and are invisible on the page, so 'Fai<ZWSP>sha' would have read as the
      excluded person to a visitor and as a different string to a Set. Tests for each, each
      mutant-verified red. One claim REFUTED: the home does not bypass the filter — its entire change
      is one line, <SocialProof /> -> <SocialProof variant='founder-band' />, and it never imports the
      roster; the seat inferred the gap from an input that deliberately showed it only the four files
      that DO call the filter."
  - seat: self (the conducting session, reviewing the build it inherited)
    objection:
      "The trust-pill stars had been changed from #d4a017, the colour on base, to #b8860b — a colour
      change under a decision (D-B) whose whole content is that colours stay as they are."
    status: CONFIRMED
    resolution:
      "Reverted to #d4a017. No probe had demanded it: the contrast test samples the section nav, the
      group heading, the group description, a role label and the Studio link, and never the stars. The
      pre-existing contrast of the star glyphs against paper is left exactly as found and named in
      debt_out_of_scope rather than silently 'improved' under cover of a redesign."
  - seat: codex-gpt-5.6-sol (POST, frozen head, run from M5 by the imperator)
    objection: >-
      Seven findings, NO-GO. The two that were neither already-known nor already-fixed: a
      `photoOverride` and an email-shaped field on an entry with a PERFECTLY ALLOWED slug both
      stayed KEPT, publishing an excluded person's face and address under a clean slug; and
      isPublicSlug normalised the excluded SET but called rosterBySlug with the RAW string, so a
      padded or fullwidth spelling missed the roster, resolved to undefined, and took the
      "unknown slug is allowed" branch — the branch that would publish a publicListed:false member.
    status: CONFIRMED
    resolution: >-
      Both cured. The filter now judges EVERY string an entry carries against EXCLUDED_MARKERS —
      slug, name, alias, portrait path and email, every one derived from the roster record rather
      than hand-listed — because a name is not the only way to publish somebody. Mutant (revert to
      the name-only check) turns the new test red. The roster lookup now receives the normalised key
      as well. That second cure is DEFENSIVE and its limit is stated in the test rather than dressed
      up: no mutant can turn it red today, because no roster member carries publicListed:false —
      the very fact this module exists to work around. Of the remaining five: the client bundle is
      the already-declared partial exclusion; the missing pack.yml was true of the head it read and
      is authored in this push; the e2e hydration and focus-delta defects are the same two Kimi
      raised; and the directly-addressable portrait files are pre-existing and recorded as debt.
      This seat is ok:false in the journal because it is DEAD ON MINI — acct1 answers "workspace out
      of credits" with exit 0, acct2 times out in the tool router — not because the review is absent.

