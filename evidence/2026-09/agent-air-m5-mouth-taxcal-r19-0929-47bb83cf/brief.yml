task: >-
  Move the tax calendar tool (/tax-calendar, served on tax.balizero.com) onto the site's R19
  design, exactly like the Property Check tool was moved (PR #7596). Skin only: copy, dates,
  links, iCal link, obligations, order and behaviour are frozen.
lane: mouth/taxcal-r19
machine: air-m5
date: 2026-09-29
gear: 1
gear_reason: >-
  Floor 1 (evidence_pack_lint.py --print-floor over `git diff --name-only`/`--numstat`
  origin/main...HEAD): 5 files, skin-only restyle of layout.tsx/page.tsx/TaxCalendarBody.tsx
  plus a route-scoped CSS module and a guard test; no schema/infra/secrets/auth touched.
acceptance:
  A1: >-
    TaxCalendarBody.r19-guard.test.tsx fails 1/3 on a temporary origin/main copy of all three
    source files (proved with cp, restored with cp, verified with cmp) and passes 3/3 on HEAD.
    20 mutants (the 15 of the first gate, which left 4 alive — WebkitBackdropFilter,
    bg-slate-900/80, !text-white, "1px solid white" — plus text-white!, bg-blue-600, inline
    "#fff", text-[#2E6FD4] and inline "black") each turn the guard red when introduced into
    HEAD's TaxCalendarBody.tsx or layout.tsx, then are reverted and confirmed clean via cmp;
    0 survivors after the rework. Full scoped suite
    (funnel/, (tax-calendar)/, r19/, api/tax-calendar/) is 15 files / 154 tests green; tsc
    --noEmit exit 0; eslint 0 errors on changed files (2 benign "file ignored" warnings for the
    .css and .test.tsx, which fall outside the eslint glob); prettier --check clean;
    `grep -rn "tax-calendar" apps/mouth/e2e` returns no hits, so no e2e spec needed updating.
  A2: >-
    Copy frozen: extracted JSX text and string literals (title/description/h1/body copy/tab
    labels/CTA text/footnote, excluding className/style) are identical between origin/main and
    HEAD for layout.tsx, page.tsx and TaxCalendarBody.tsx. Metadata (title/description) is
    unchanged; the R19 layout adds no openGraph override, so the "keep every root key" rule
    does not apply here.
  A3: >-
    Local next dev (--webpack, :3164) vs https://tax.balizero.com/ at 1440x900 and 390x844: one
    [data-presentation="r19"] root on HEAD (0 on origin/main, pre-R19 dark theme), nav
    background rgb(247,244,238) (light paper, was rgba(14,26,48,.94)), h1 in "R19 Fraunces"
    weight 500 at rgb(29,44,59) ink (was Cormorant at rgb(236,236,236)), TrustBand labels
    rgb(67,84,100) and values rgb(29,44,59) (not rgba(255,255,255,.68)), h1 top offset 112px desktop / 96px mobile (clear
    of the 88px paper nav), scrollHeight 1423->1469 (1440) and 3019->2999 (390), iCal href
    unchanged at /api/tax-calendar/ical on both.
  A4: >-
    No horizontal overflow at 390x844 after the rework: the badge wrapper's padding goes to 0,
    so documentElement.scrollWidth is 390 locally with no element past the viewport (the first
    gate measured 6.3px of overflow at 5874231966; production is 391 today).
