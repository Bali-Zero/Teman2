dissent:
  - seat: kimi-code/k3
    objection: >-
      (F1, P2, not blocking) No proof the planner actually adopts the three
      expression indexes — the PR asserts "BitmapOr of three index probes"
      but ships no EXPLAIN output; on a 12k-row table the planner could in
      principle still pick a seq scan and nobody would know, since the
      parity test only pins text, not the plan.
    status: PLAUSIBLE
    disposition: >-
      No code change. Verified via `gh pr view 6048`: the PR body's own
      `Bites:` section already commits exactly this observation post-deploy
      — `SELECT idx_scan FROM pg_stat_user_indexes WHERE indexrelname LIKE
      'idx_clients_phone_core_%'` expected >0 and growing while `seq_scan`
      on `clients` plateaus, plus `fly_instance_cpu_balance` recovery within
      24h. The council prompt did not include the PR body, so the seat could
      not see this; the gap it names is real in isolation but already
      covered by an existing, committed artifact.
  - seat: kimi-code/k3
    objection: >-
      (F2, P3) The parity test pins only UPSERT_MATCH_SQL. Two other hot
      queries in client_repository.py — DUP_OWNER_SQL (create-dedup
      pre-check) and CORE_OWNER_IDS_SQL (upload-ownership re-proof) —
      express the identical phone-core logic through a `WITH norm AS (...)`
      CTE with aliases (dn/dr/dw) and `= ANY($1::text[])`, textually
      different from the pinned query, so the tripwire cannot and does not
      cover them; a future rewrite that defeats CTE inlining could silently
      lose any incidental index service to these two.
    status: CONFIRMED
    disposition: >-
      No code change — declared OUT-OF-SCOPE RESIDUAL. Verified against
      `apps/backend-rag/backend/db/repositories/client_repository.py`
      lines 19-72: the CTE-aliased shape is real and textually distinct, so
      the parity test structurally cannot pin it (by design — its docstring
      names only "the query", singular). This PR's mandate (brief.yml,
      PR body) is the MEASURED wa-mirror-driven UPSERT_MATCH_SQL hot path
      (0.6 upserts/s sustained, 2.54M seq scans measured) specifically;
      DUP_OWNER_SQL/CORE_OWNER_IDS_SQL run on lower-frequency create/upload
      paths that were not part of the measured incident. The new indexes
      may incidentally serve them once Postgres inlines the single-use,
      non-MATERIALIZED CTE (pulling the subquery's WHERE up so the CASE
      expressions dereference the raw columns) — unverified, not claimed by
      this PR, and left here as a residual for a future PR if those paths
      are ever themselves measured hot.
  - seat: kimi-code/k3
    objection: >-
      (F3, P3) The migration comment's "canonical phone_core" framing is
      overstated: the SQL CASE has no minimum-length guard, while
      `backend.phone_lock.phone_core` returns None below 6 digits.
    status: PLAUSIBLE
    disposition: >-
      No code change. Verified against `backend/phone_lock.py:27-42`:
      `phone_core()` does enforce `len(digits) >= 6 else None`; the inline
      SQL CASE (in UPSERT_MATCH_SQL, unchanged by this PR) has no such
      guard. Harmless for index correctness — $1 is always produced by
      Python's `phone_core()` before the query runs, so a sub-6-digit value
      never reaches the placeholder. The migration comment's phrase points
      at the concept/module the SQL mirrors, not a literal-equivalence
      claim; not worth a comment edit for a pre-existing, unchanged query.
  - seat: kimi-code/k3
    objection: >-
      (F4, P2, not blocking) Non-CONCURRENTLY CREATE INDEX takes a SHARE
      lock on `clients`, conflicting with ROW EXCLUSIVE (every upsert/
      create/update transaction) and SHARE UPDATE EXCLUSIVE (autovacuum);
      `lock_timeout=5s` makes the deploy fail-closed on contention, and
      while the SHARE request queues, new writers queue behind it too (up
      to a ~5s stall on POST /api/crm/clients/* during deploy).
    status: CONFIRMED
    disposition: >-
      No code change. Matches this build seat's own reading of
      `migration_base.py`'s `apply()` (single asyncpg transaction, whole
      file as one exec, non-CONCURRENTLY is the only option this runner
      permits since CONCURRENTLY cannot run in a transaction block at all)
      and matches brief.yml's own stated constraint verbatim. Failure mode
      is fail-closed and retryable: transaction aborts, `apply_all_pending`
      records the failure, `cmd_apply` exits 1, `release_command` fails,
      Fly release aborts, old machines keep serving, DB state untouched.
      Accepted, declared risk — not a defect.
  - seat: kimi-code/k3
    objection: >-
      (F5, P3) Two runner footnotes: `IF NOT EXISTS` is keyed on index
      NAME not expression (a same-named, differently-defined stale index
      would silently survive a re-run after a manual ledger clear); and
      `BaseMigration.apply()` opens its own connection without the pool's
      60s `command_timeout`.
    status: CONFIRMED
    disposition: >-
      No code change. Both verified against `migration_base.py` and are
      pre-existing properties of the runner, not introduced by this
      migration; `lock_timeout=5s` already bounds the only wait relevant
      here (index build on a 50MB table).
  - seat: kimi-code/k3
    objection: >-
      (F6, P3) Index bloat / write amplification from three new expression
      indexes on a table with frequent upserts.
    status: CONFIRMED
    disposition: >-
      No code change. Verified by arithmetic: ~12k rows x ~30-40 bytes/entry
      < 1MB per index vs. a 50MB table; phone columns change rarely (a
      trigger only recomputes `phone_normalized` on `UPDATE OF phone`), so
      most upserts leave these expression indexes untouched and HOT updates
      mostly preserved. Non-issue at this scale.
  - seat: kimi-code/k3
    objection: >-
      (F7, P3) The parity test proves whitespace-normalised TEXT equality
      between the migration's indexed expressions and UPSERT_MATCH_SQL's
      CASE expressions — sufficient but not necessary for the planner's
      actual structural (AST) match requirement; not W81 theater, but it
      doesn't prove planner adoption and doesn't cover DUP_OWNER_SQL/
      CORE_OWNER_IDS_SQL (F2).
    status: CONFIRMED
    disposition: >-
      No code change. Matches this build seat's own independent analysis:
      Postgres expression-index matching is structural/AST equality after
      parse analysis, and identical text parses to identical trees given
      identical catalog resolution — which the migration's own `SET LOCAL
      search_path = public, pg_catalog;` line defends (no `public`-schema
      shadowing of `regexp_replace`/`substr` was found in migrations_v2/).
      The residual gaps this finding names are F1 and F2, already
      dispositioned above.

