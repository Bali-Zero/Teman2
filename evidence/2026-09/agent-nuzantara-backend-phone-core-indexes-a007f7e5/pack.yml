gate_verdict:
  verdict: PASS-WITH-CONDITIONS
  seat: claude-opus-5
  graded_sha: 3f7906cc06 # pragma: allowlist secret — a git sha, short on purpose; detect-secrets still reads this one as hex entropy
  conditions:
    - >-
      C1 — commit `council-journal.jsonl` into the pack directory before the
      merge. The pack declares `council_run: council-journal.jsonl`, but
      `scripts/ci/stage_council_journal.py --staged-pack ... --head-sha
      747d24f62c...` printed "is not a regular file at HEAD — staging
      nothing": the four journaled attempts that SUBSTANTIATE the
      seat_override never reach main, so the override is unauditable there.
      Owner: the conducting session docs-fly-cost-review-44 (Fable on Pro).
      Deadline: 2026-09-09T22:00:00Z, and in any case before the merge.
    - >-
      C2 — A4 prove-live, first promote cycle. Within 30 minutes of the
      release step, on the primary: all three `idx_clients_phone_core_%`
      show `idx_scan > 0` and `clients.seq_scan` stops growing from its
      2 540 720 baseline (2026-09-09T16:17Z). If `idx_scan` stays 0 the
      planner did NOT adopt the indexes and this PR bought nothing —
      report it, do not let it pass silently.
      Owner: the conducting session docs-fly-cost-review-44 (Fable on Pro).
      Deadline: 2026-09-09T23:00:00Z.
    - >-
      C3 — A4 prove-live, 24h horizon:
      `fly_instance_cpu_balance{instance="0801696b541568"}` climbs off 234
      and `fly checks list -a nuzantara-postgres` shows the primary `vm`
      check back to passing.
      Owner: the conducting session docs-fly-cost-review-44 (Fable on Pro).
      Deadline: 2026-09-10T18:00:00Z.
    - >-
      C4 — if the release step aborts on the 5 s lock wait, RE-RUN the
      deploy; do not "fix" it by switching to CREATE INDEX CONCURRENTLY,
      which `BaseMigration.apply()` cannot run (one transaction per file).
      After two consecutive lock-timeout aborts, stop and escalate to the
      owner rather than taking a third round.
      Owner: the conducting session docs-fly-cost-review-44 (Fable on Pro).
      Deadline: 2026-09-10T06:00:00Z.
  reasons:
    - >-
      Graded surface is exactly the code sha: `git diff --numstat 3f7906cc06
      747d24f62c -- ':!evidence'` returns 0 lines; `git diff --stat
      origin/main...3f7906cc06` is 2 files, +134/-0 (migration 56, parity
      test 78). Nothing but evidence rides on the head commit.
    - >-
      A1 re-run by this seat: `cd apps/backend-rag && PYTHONPATH=.:../crm-cell
      .venv/bin/python -m pytest
      backend/tests/migrations/test_migration_308_phone_core_index_parity.py
      -p no:cacheprovider` -> "4 passed, 1 warning in 1.52s". (An extra `-q`
      is refused by scripts/pytest_guards/pytest_verbosity_guard.py — the
      pack's recorded cmd, without it, is the runnable one.)
    - >-
      A2 re-run by this seat, exit 0: "180 post-cutoff migrations, all have
      ROLLBACK marker" / "185 files, all unique prefixes" / ruff check "All
      checks passed!" / ruff format "1 file already formatted".
    - >-
      Slot 308 is still free on FRESH origin/main: `git fetch -q origin main
      && git ls-tree --name-only origin/main
      apps/backend-rag/backend/db/migrations_v2/ | grep -E "/308_"` prints
      nothing, exit 1.
    - >-
      Planner match holds on the semantics, not only the text: the three
      indexed CASE expressions are, whitespace-normalised, the same
      characters as the WHERE-clause CASEs at crm_clients.py:94-108 (same
      COALESCE '' defaults, same '[^0-9]' pattern and 'g' flag, same
      62%-then-0%-then-ELSE branch order), and regexp_replace/substr/
      COALESCE/LIKE on text are IMMUTABLE — so identical text parse-analyses
      to identical expression trees, which is what expression-index matching
      compares. Residual NAMED, not blocking: the migration's `SET LOCAL
      search_path = public, pg_catalog` places public BEFORE pg_catalog, so a
      future `public.regexp_replace`/`public.substr` would bind at CREATE
      INDEX time to a different OID than the app resolves under its default
      search_path and the match would fail SILENTLY; `grep -rniE "CREATE (OR
      REPLACE )?FUNCTION (public\.)?(regexp_replace|substr|coalesce)"
      apps/backend-rag/backend/db/` returns zero today.
    - >-
      Deploy-time lock is fail-closed and retryable — read from the runner,
      not assumed. `BaseMigration.apply()` opens one connection and executes
      the whole forward file inside a single `async with conn.transaction()`,
      so `SET LOCAL lock_timeout = '5s'` is in scope; a lock-wait abort
      raises MigrationError -> `_apply_all_pending_locked` puts it in
      `failed` -> `cmd_apply` returns False -> migrate.py `sys.exit(1)` ->
      fly.toml `release_command` fails -> the fly-deploy.yml retry loop
      matches only lease/depot strings and falls through to `exit "$status"`.
      Deploy aborts, old machines keep serving, and the DB is untouched
      because the `_schema_versions`/`schema_migrations` INSERT is inside the
      same aborted transaction. The re-run is therefore idempotent by
      transaction rollback, with `IF NOT EXISTS` only as belt-and-braces.
    - >-
      "Sub-second build" is a fair claim at this size (one btree entry per
      row over 12 218 rows / 50 MB, per index), but the build is not the
      exposure: the exposure is the up-to-5 s SHARE-lock queue in front of
      ROW EXCLUSIVE writers on POST /api/crm/clients/upsert-by-phone during
      the release step. That cost is declared verbatim in brief.yml and in
      dissent F4 rather than hidden — which is why it is accepted, not
      excused.
    - >-
      The migration is auto-discovered, so it will actually run:
      `MigrationManager.discover_migrations()` globs `migrations_v2/*.sql`
      and parses the numeric prefix — no registration list to forget.
    - >-
      seat_override states the truth. `git log -1 --format=%b 3f7906cc06 |
      tail -1` is `Co-Authored-By: Claude Fable 5.1
      <noreply@anthropic.com>` — an agent build, so the superseded pack's
      "owner-is-builder" exception was false (it leaned on the git author
      string `Antonello Siano`, which is only this machine's identity).
      council-journal.jsonl records exactly four attempts: kimi-code/k3
      ok:true, codex-gpt-5.6-sol ok:false twice (600 s timeout, 17:46:11Z and
      17:59:51Z), tp1-qwen3.8-max ok:false (HTTP 403, 17:46:35Z). One
      judging seat, not two — declared, not invented.
    - >-
      No receipt is backdated: pack receipts run 17:19:20Z-17:33:12Z, the
      journal 17:46:11Z-17:59:51Z, all strictly earlier than `date -u
      +%Y-%m-%dT%H:%M:%SZ` = 2026-09-09T18:05:52Z read at the start of this
      gate.
    - >-
      Evidence-pack lint, staged the way CI stages it, last line
      `evidence_pack_lint: clean`, exit 0, with exactly the two expected
      NOTICEs (seat_override; A4 + the --print-floor probe unrecorded
      because both are non-reproducible here). `python3
      scripts/council_journal.py check --pack-dir <D>` exits 0, reporting
      R9 as overridden rather than failing it.
    - >-
      PII boundary held by this gate too: no row of `clients` and no phone,
