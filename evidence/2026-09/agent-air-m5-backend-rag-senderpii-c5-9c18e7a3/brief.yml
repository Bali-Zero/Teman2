objective: |
  Closes C2 and C3 of the fresh gate on PR #7438
  (pull/7438#issuecomment-5848706894), due 2026-10-03:

  C2 — the fresh gate found C4 (#7385's gate) was only PARTIALLY closed by #7438: the
  `router.py`/`email_audit.py` groups were fixed, but the third named group — the CRM
  services' own copy of the same "Email sent to %s via Zoho fallback" pattern — was
  untouched. `grep -n 'logger\.[a-z]*(.*to_email' services/crm/{waiting_documents,
  completed_process}_service.py` on `d59690c8f2` (post-#7438 main) showed 8 raw `to_email`
  sites: `waiting_documents_service.py` 302/312/321/334, `completed_process_service.py`
  412/421/431/444. `completed_process_service.py`'s `except Exception as brevo_error:`
  block had an EXTRA defect its sibling did not: it logged the raw exception OBJECT
  (`%s` on `brevo_error`, i.e. `str()`) BEFORE `format_send_error` even ran, so nothing
  had been formatted yet, let alone scrubbed.

  A broader grep of `apps/backend-rag/backend` for `to_email`/`recipient`/`request\.to`/
  `email=` inside a `logger.*(` call found many more hits outside these two files —
  listed and triaged in the PR body's "Other raw-address log sites found" section.
  Only `services/crm/process_automation_service.py` (285/288) and
  `services/crm/automation.py` (172/175/178-179) are the SAME class (a third and fourth
  copy of this exact Brevo→Zoho fallback idiom, evidently forked from the same
  original); left OUT of this PR and named explicitly, both to keep this PR's diff
  reviewable and because they were never named by C2/C4 — flagged for a follow-up.
  Everything else found (staff/security/other-notification-family logs) is a different
  risk class and is also named and left out — see the PR body.

  C3 — the gate's own mutation table found "router success log, raw `request.subject`"
  SURVIVED (all 104 tests still passed with the scrub removed): no existing test put an
  address in a SUCCESSFUL send's subject. Separately, CodeQL opened 3 new
  `py/log-injection` alerts on #7438's new call sites:
    - 9217 (real regression): `router.py`'s success log used to interpolate
      `{request.subject!r}` on `main`, whose `repr()` escapes `\n`. #7438's rewrite to
      %-style logging dropped that escaping, so a subject with an embedded newline
      landed in the log raw — a forged log line one `\n` away (mitigated in prod by the
      JSON `StructuredFormatter`, live in dev/non-JSON handlers).
    - 9216 and 9218: both fire on `redact_identifier_for_log(...)` call sites. The value
      logged there is ALWAYS one of an HMAC digest (`id:<12 hex>`), the literal
      `"anonymous"`, or `MISSING_IDENTIFIER_MARKER` (see
      `backend/security/pii_log_identifier.py::redact_identifier_for_log`'s own
      docstring) — none of those three shapes can carry attacker-controlled newlines or
      log-forging content, so both are false positives in substance. This PR does not
      dismiss them (the mandate reserves that action); it records the justification in
      the PR body for the mandate-owning session to act on.
constraints:
  - "C2 fixes exactly the 8 named sites in the two named files, applying the SAME
    redact_identifier_for_log/_bounded_scrub treatment #7438 already established for
    router.py/email_audit.py — no new regex, no new redaction primitive."
  - "The free-text diagnostic values (`brevo_err_msg`, `combined_err`, and the raw
    exception at completed_process_service.py's Brevo `except` block) are scrubbed with
    `_bounded_scrub` at every log call site touched, not just the one line the gate
    named (completed_process_service.py's raw `brevo_error`) — for consistency with the
    established C4 treatment of provider-supplied free text. The underlying
    (unscrubbed) variables are untouched everywhere they feed `record_email_result`'s
    `error_message` column (a DB write, not a log) or `notify_email_failure_critical`
    (which already scrubs internally) — those are correctly NOT double-scrubbed."
  - "C3's fix order is scrub-then-escape: `repr(_bounded_scrub(request.subject, 120))`,
    not the reverse — scrubbing first keeps every caller's contract (bound the input),
    escaping second restores exactly what `main` had before #7438's rewrite."
  - "No client PII in this PR's own artifacts — every example/test address is a
    synthetic `*.example.com`-shape address."
