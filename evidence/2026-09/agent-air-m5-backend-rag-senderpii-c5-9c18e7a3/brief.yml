  13 passed across the two new PII-log test files; 38 passed in
  test_send_email_chain.py (36 pre-existing + 2 new C3 tests); 1565 passed across the
  wider notifications/security/newsletter/mail_loop/crm/integrations set; 91 passed in
  the 3 core RAG suites. `ruff check` on all 6 touched/new files: clean.

  Mutation verification (cp-backed, never `git checkout --`): backed up all 3 cured
  source files, replaced each with `d59690c8f2`'s version (this branch's base, #7438's
  merge commit) in turn, re-ran the affected tests, restored from the cp backup.
  - `router.py` reverted to base: the new C3 newline-escaping guilt test went RED
    (raw `\n` visible in the log record); the new C3 subject-address test stayed GREEN
    (that half was already fixed by #7438 — confirms this PR closes exactly the gap the
    gate named, not a re-fix of something already working). 37 other tests unaffected.
    Restored — 38/38 green again.
  - `waiting_documents_service.py` + `completed_process_service.py` reverted to base
    together: all 6 guilt tests (3 per file) went RED with the raw address visible; the
    2 innocence tests stayed GREEN. Restored — both new test files' 13 tests green
    again, plus the pre-existing `test_completed_process_service.py` unaffected (13
    total across the 3 files).
  `diff -q` against the cp backups after each restore reported no difference.
