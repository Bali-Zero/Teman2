brief_ref: evidence/brief.yml
plan_ref: >-
  One concern: two new doors of infra/claude-hooks/output_hygiene_guard.py, built against the
  spec revision committed first in this branch (rows S9/S10, cases C67-C80). The hook now
  answers three PreToolUse matchers — Bash (unchanged, S1-S8), Read (S9: deny a slice over
  24 KiB of raw bytes, exempt image/PDF/notebook suffixes, fail open on missing path,
  directory or non-integer bound) and Skill (S10: deny the enumerated name set, today exactly
  `claude-api`, never by size). Every new case carries its spec C-ID and the suite asserts the
  whole corpus C01..C80 is present.

  Consumer: `~/.claude/hooks/output_hygiene_guard.py` registered under the PreToolUse `Read`
  and `Skill` matchers of `~/.claude/settings.json` on M5 and Pro by the shipping session after
  this PR merges — this diff prepares the doors and their tests, it does not itself arm them.
  Observation once armed: from a live session, `Read MODEL_ROSTER.md` (42 KB) is refused with
  the slice's KiB and line span named; the same Read with `limit=120` passes; `Skill claude-api`
  is refused naming the skill.

