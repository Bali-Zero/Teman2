residual_risks:
  - >-
    THE SPEC, NOT THE GUARD, IS THE GRADER'S TABLE. The Read corpus is finite (C67-C75) and an
    everyday Read outside it can still be bitten — the ceiling is the same 24 KiB as S2, so the
    files it refuses are exactly the ones `cat` already refuses; a session that needs a section
    of a big file greps the heading and passes offset/limit, which the denial message says.
  - >-
    S10 binds only the model's own `Skill` tool calls: a user who types `/claude-api` goes
    through UserPromptExpansion, not PreToolUse. The listing-line cost of that skill is removed
    by `skillOverrides` (PR #6744), a separate mechanism this pack does not measure.
  - >-
    THE LIVE HOOK IS NOT RE-ARMED BY THIS PR. The Read and Skill matcher entries in
    `~/.claude/settings.json` on M5 and Pro are added by the shipping session after merge —
    everything in this pack is local test evidence, not a live-session observation of a real
    S9/S10 denial yet.
  - >-
    Latency figures (28.2 ms allow / 30.1 ms deny per subprocess; 0.11 s for a 50 MB Read
    probe) are single-machine (M5), single-run, no-concurrent-load — not repeated and not
    measured on Pro.

