dissent:
  - seat: claude-sonnet-5 (this build lane), self-caught
    status: CONFIRMED
    objection: >-
      The first draft of the migration's own provenance comment quoted the literal marker
      string `-- === ROLLBACK ===` inside prose explaining how migration_base.py splits the
      file at that marker. The existing static test file's `_sections()` helper does
      `sql.split("-- === ROLLBACK ===", maxsplit=1)` — a plain string split, not marker-line
      matching — so it silently split on the FIRST occurrence, which was inside my own
      comment, not the real marker further down. This moved the entire new forward-side DO
      block into what the test treated as the "rollback" half, and the forward-side
      assertions (test_forward_sets_the_default_to_30_days,
      test_forward_alter_is_wrapped_in_a_retry_loop) failed with the ALTER text simply
      absent from what the test now called "forward". Caught by running the extended pytest
      suite (not by reading the diff), not by a reviewer. Cured by rewording the comment to
      describe the marker without repeating it verbatim, then re-running the full pytest
      suite and a fresh end-to-end apply-all to confirm the fix changed nothing behavioral.
  - seat: claude-sonnet-5 (this build lane), self-caught
    status: CONFIRMED
    objection: >-
      Cross-machine fleet-mailbox traffic during this task (Air-M5 staff-room/IMP,
      2026-09-16 21:0x-21:1xZ WITA) reported the actual PROD root cause more precisely than
      this pack's own brief: not an isolated slow query but a multi-hour, whole-database
      pg_dump backup (broken since 2026-09-14, running ~3 hours/night instead of ~4 minutes,
      holding AccessShareLock on ~687 tables) that will outlast this migration's ~38.5s
      retry budget on nights the deploy lands squarely inside that window. That traffic also
      reported a same-night manual deploy re-run inside a lock-free window, meaning PROD may
      already carry 317 applied from the file's ORIGINAL (uncured) SQL before this PR ships.
      This does not change the correctness of the cure as specified (short retries, name the
      blocker, never skip) — it changes what the cure can promise operationally: it makes
      317 apply reliably in a lock-free window and fail LOUDLY with a named cause in a
      lock-held one, but it cannot itself force a lock-free window to exist. That is an
      operator/backup-job problem outside this lane's file scope, and is called out
      explicitly in the PR body under "Already-applied case" and as its own item below.
  - seat: claude-sonnet-5 (this build lane), self-caught
    status: CONFIRMED
    objection: >-
      Already-applied case: if PROD applied 317 from the ORIGINAL SQL (via the same-night
      re-run reported over the fleet mailbox) before this PR merges, this PR's cured SQL
      text differs byte-for-byte from what is recorded, which changes the migration file's
      checksum. Read migration_base.py/migration_manager.py this session for what a
      checksum mismatch does to an ALREADY-applied migration: `_is_applied()`
      (migration_base.py) keys strictly on `migration_name` (a string derived from the
      migration NUMBER and filename stem), never on checksum, so a re-run of `apply-all`
      short-circuits at the "already applied" branch and never re-executes the SQL — the
      checksum column is written once at first apply and is descriptive metadata, not a
      gate `apply()`/`apply_all_pending()` reads back to decide anything. No code path in
      either file compares a freshly-computed checksum against the stored one during a
      normal `apply-all`; `schema_audit`-style drift detection (if any exists elsewhere in
      the repo) was not located under `backend/db/` or `backend/services/` in the time
      available and is not this lane's file scope to build. This matches the two
      pre-existing non-fatal checksum WARNINGs the IMP reported on migrations 207 and 217 —
      a stored-checksum mismatch on an already-applied migration is a silent, non-blocking
      audit fact in this codebase today, not an error the runner surfaces or acts on.
  - seat: codex (gpt-6-astra, xhigh), second-round adversarial review of commit 37134ce469
    status: CONFIRMED — disposed FIX-FIRST by the coordinating session (nuzantara-8d)
    objection: >-
      F1 (OK, no change) — `migration_base.py::apply()` runs the whole forward SQL in one
      `conn.execute()` inside one transaction; each `EXCEPTION` block only rolls back the
      implicit sub-transaction Postgres opens around it, so a failed attempt does not poison
      later attempts, and `SET LOCAL lock_timeout` reverts to the surrounding value (5s) on
      failure but stays at the per-attempt value for the rest of the transaction on success.
      Codex verified this against PostgreSQL's own SET LOCAL semantics and found no defect —
      the subtransaction boundary this loop relies on is preserved by construction. Cure:
      none for this structure.
  - seat: codex (gpt-6-astra, xhigh), second-round adversarial review of commit 37134ce469
    status: CONFIRMED — disposed FIX-FIRST, CURED
    objection: >-
      F2 (BLOCKING) — a lock_timeout expiry raises SQLSTATE 55P03 (`lock_not_available`)
      specifically; 57014 (`query_canceled`) is the SAME code a `statement_timeout` OR an
      operator's `pg_cancel_backend` raise. Catching 57014 alongside 55P03 here meant an
      operator's explicit attempt to cancel this DDL mid-attempt would be silently absorbed
      and retried instead of propagating — not a "fallback", a correctness bug. Cured: only
      `lock_not_available` is caught now, in both directions; comments and tests corrected
      to match (this pack's own dissent entry below shows the FIRST round's test file still
      asserted 57014's presence, which the cure removed along with the code).
  - seat: codex (gpt-6-astra, xhigh), second-round adversarial review of commit 37134ce469
    status: CONFIRMED — disposed FIX-FIRST, CURED (refined — see note)
    objection: >-
      F3 (SHOULD-FIX) — the first round's budget comment stated "~38.5s worst case" without
      showing the arithmetic, and conflated the file's own 60s `statement_timeout` with the
      Fly deploy's unrelated 5-minute default release-command timeout (no override was found
      in fly.toml). Cure: the budget is now computed exactly in the file's own comment (15
      attempts * 0.5s lock wait = 7.5s, backoff sum across 14 sleeps = 34.5s, total 42.0s)
      and the two ceilings are named separately so neither is mistaken for the other. Note:
      Codex's own suggested cure text ("propagate 57014") is superseded by F2's disposition
      above (removing 57014 entirely, not propagating it) — the coordinating session's FIX-
      FIRST for F2 takes precedence where the two findings' suggested cures would otherwise
      conflict; F3's core ask (show the exact math, separate the two timeouts) is honored.
  - seat: codex (gpt-6-astra, xhigh), second-round adversarial review of commit 37134ce469
    status: CONFIRMED — disposed FIX-FIRST, CURED
    objection: >-
      F4 (SHOULD-FIX) — pid/usename/application_name are readable by any role without
      `pg_read_all_stats` and the diagnostic SELECT takes no lock on the application table,
      but it lacked a `datname` filter (could misname a backend in a DIFFERENT database
      sharing a recycled pid) and a `granted` filter (could name a WAITING backend as a
      holder), and a failure inside the diagnostic itself would have replaced the real
      lock-exhaustion error. Cured: added `AND l.granted` and
      `AND a.datname = current_database()`, and wrapped the SELECT in its own
      `BEGIN ... EXCEPTION WHEN OTHERS` so a diagnostic failure falls back to a "lookup
      unavailable" message instead of masking the RAISE that reports the real cause.
  - seat: codex (gpt-6-astra, xhigh), second-round adversarial review of commit 37134ce469
    status: CONFIRMED — disposed FIX-FIRST, CURED
    objection: >-
      F5 (BLOCKING) — the two `CREATE INDEX IF NOT EXISTS` statements ahead of the retry
      loop take a ShareLock on the table for the length of the WHOLE transaction even in the
      no-op case (index already exists), and that lock is held OUTSIDE the loop's own
      sub-transactions — so for as long as the ALTER's retry loop ran (then ~38s, now ~42s
      worst case), every ordinary writer was queued continuously, not just during the brief
      per-attempt ACCESS EXCLUSIVE waits. Codex's suggested cure was "avoid CREATE INDEX
      when indexes exist, try 100-250ms timeouts"; the coordinating session's disposition
      went further — guard each index behind a `pg_indexes` existence check so the no-op
      case never issues CREATE INDEX at all (zero lock of consequence on the table, not
      merely a shorter one), and separately shrink the ALTER's own `lock_timeout` to 500ms
      per F3's budget recompute. Measured live this round: a concurrent INSERT completed in
      0.025s while the cured migration's retry loop ran in the background for the full ~42s
      window naming the blocker on exhaustion — the write-starvation Codex identified is
      gone, not merely shortened.
  - seat: codex (gpt-6-astra, xhigh), second-round adversarial review of commit 37134ce469
    status: CONFIRMED — disposed FIX-FIRST, NO CHANGE (already correct)
    objection: >-
      F6 (OK, no change) — exactly one `-- === ROLLBACK ===` marker exists, matched
