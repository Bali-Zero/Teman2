  deepseek/glm/gemini) was not dispatched for this narrowly-scoped fix; this is a stated
  human call, not silence on the requirement.

outcome: >-
  Migration 317's forward and rollback ALTER statements now retry under a short
  lock_timeout with capped backoff instead of losing a single multi-second wait, and name
  the blocking backend (pid/usename/application_name) when every attempt is exhausted
  rather than skipping silently. Proven against a throwaway PostgreSQL cluster that mirrors
  the CI apply-all path: full corpus apply succeeds end to end; the original (uncured) SQL
  reproduces the exact PROD incident text under a long-held competing lock; the cured SQL
  fails only after exhausting its retry budget and names the blocker; a lock released within
  budget lets the cure through; the rollback path is symmetric. The static test file gained
  assertions pinning the retry-loop shape, the caught SQLSTATEs, and the blocker-naming
  RAISE. No change to migration 318, the migration runner, or any off-limits file.

  SECOND ROUND (2026-09-17, same day, this pack updated in place, not superseded): a Codex
  gpt-6-astra adversarial review (xhigh) of the commit above found two BLOCKING and three
  SHOULD-FIX issues (F2-F5, F7 below; F1/F6/F8/F9 were OK, no change). Disposed FIX-FIRST by
  the coordinating session. Cured in commit 70e6771122: (a) F2 — the loop caught
  `query_canceled` (57014) alongside `lock_not_available` (55P03); 57014 is also what a
  `statement_timeout` or an operator's `pg_cancel_backend` raise, so catching it here could
  let the DDL proceed after an operator explicitly tried to cancel it — now catches only
  `lock_not_available`, in both directions. (b) F5 — a bare `CREATE INDEX IF NOT EXISTS`
  takes a ShareLock on the table for the WHOLE enclosing transaction even when the index
  already exists, blocking every writer continuously for as long as the retry loop ran (not
  just during the brief ACCESS EXCLUSIVE attempts); both indexes are now guarded behind a
  `pg_indexes` existence check (ACCESS SHARE on the catalog only) instead of the bare form —
  measured empirically this round: a concurrent INSERT took 0.025s while the migration's own
  retry loop ran in the background for ~42s naming the blocker, versus the earlier round's
  measurement that the SAME concurrent-write question was never actually tested against a
  held lock (only reasoned about in the SQL's own comment). (c) F4 — the blocker-diagnostic
  SELECT now runs inside its own `BEGIN ... EXCEPTION WHEN OTHERS` (a failing lookup can no
  longer mask the real lock-exhaustion RAISE) and filters to `l.granted` locks in
  `a.datname = current_database()` (a waiting backend, or one in another database, can no
  longer be misnamed as a holder). (d) F3 — the nominal retry budget is recomputed exactly
  (lock-wait 15 * 0.5s = 7.5s + backoff sum 34.5s = 42.0s) rather than approximated, and
  distinguished explicitly from the external Fly deploy timeout (5 minutes, unrelated
  ceiling) versus this file's own `statement_timeout = '60s'` (the ceiling that actually
  binds a single `DO $$ ... $$` block). (e) F7 — tests now use the canonical
  `split_migration_sql` (not a literal marker-string split, which round 1's OWN self-caught
  dissent below shows is exactly the kind of drift Codex's finding predicted), assert both
  directions separately with mutation-sensitive exact-value checks scoped to executable
  (non-comment) SQL, and add two live-Postgres concurrency tests
  (`test_live_concurrent_reader_beyond_budget_fails_naming_it` /
  `..._released_within_budget_succeeds`) gated on `TEST_DATABASE_URL`, mirroring
  `test_migration_310_practice_status_log_trigger.py`'s convention including its
  forbidden-database-substring safety guard. (f) F9 — `ci_bootstrap_schema.py` then
  `apply-all` re-run end to end against a fresh throwaway PostgreSQL 17.10 database after
  the cure: both exit 0, 317 applies in 12ms, lands in `_schema_versions`, default reads 30
  days. Full finding-by-finding detail in `dissent` below (the raw review transcript is a
  machine-local artifact under the gitignored docs/codex-reviews/, not part of this
  commit — see the header comment).
