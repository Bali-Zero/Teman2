    note: >-
      Round 1: wrapped the forward and rollback ALTER COLUMN ... SET DEFAULT statements in a
      DO $$ ... $$ retry loop (short lock_timeout per attempt, capped backoff, RAISE naming
      the blocker on exhaustion), reproduced the PROD incident against a throwaway
      PostgreSQL 17.10 cluster on both the original and cured SQL, proved the rollback path
