seat_override: >-
  R9 council_run: this pack declares no `council_run` journal with two distinct seats from
  the COUNCIL_REVIEW_SEATS roster. The diff is a narrowly-scoped operational fix (lock-retry
  mechanics on an already-reviewed migration default; see brief.yml's third assumption — it
