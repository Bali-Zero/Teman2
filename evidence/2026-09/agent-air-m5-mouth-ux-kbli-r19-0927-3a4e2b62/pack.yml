brief_ref: evidence/brief.yml
plan_ref: >-
  Ship order recorded by the conducting session (main): rebase each of the four dormant mouth UX
  waves (kbli/oracle/studio/voa, all local branches on M5, builders died before pushing) onto
  post-#7448 origin/main one at a time -> PR + fresh gate + browser QA. This pack covers the FIRST
  lane, ux-kbli. The other three still carry the shared foundation commit and ship after this one
  lands.
council_run: council-journal.jsonl
council_note: >-
  Two distinct seats reviewed the diff and both returned HOLDS — quorum met, no override needed
  for R9. Round 1 (pre-rework): kimi-code/k3 (prompt-in/prompt-out via scripts/kimi_client.py, no
  repo access; routePolicy.ts + the CTAHandoff.tsx diff + kbli/layout.tsx diff + full diffstat),
  VERDICT HOLDS on all three questions asked, two caveats independently re-verified and found
  non-blocking (see dissent). Round 2 (rework, gate B1/B2 cure): tp1-qwen3.8-max (prompt-in/
  prompt-out via scripts/tp1_call.py, no repo access; main's presentation.ts + the full new
  r19Vars.ts + the MobileNav.tsx diff + the kbli-theme.css diff), VERDICT HOLDS on all five
  questions asked (residual R19_VARS divergence, dangling var() aliases, MobileNav fallback
  parity for non-kbli consumers, nav-icon contrast >=3:1, other red flags) — independently
  computed the same 13.9:1 contrast r19Vars.ts's own docstring claims, and raised two further
  non-blocking observations (see dissent). A third seat, codex-gpt-5.6-sol, was dispatched during
  round 1 via .claude/scripts/codex-spalla.sh (base origin/main, read-only) but the conducting
  session ruled mid-review that the spalla egress guard on main is known-defective and the lane is
  suspended; its dispatch was left to finish unattended (bash PID 21477) and its output was never
  read into this pack. The 34 files it received are listed in the shipping report for the egress
  gate to judge. Round 3 (this revision, gate B3 + B2-residual cure) did not dispatch a new
  council seat: the conducting session's round-3 instructions named four concrete asks (restore
  --foreground, add a coverage test, convert 6 literals, re-verify) with no request for a third
  review pass, and quorum was already met in round 2. This round's diff (2 files, +153/-7,
  test-file grammar/coverage extensions plus the two-line r19Vars.ts fix) is materially smaller
  and lower-risk than either prior round's.
seat_override: >-
  R8 (ground_truth) only, per _seat_rule_verdict: apps/mouth/src/app/kbli/* is a
  GROUND_TRUTH_PATH_PATTERNS hit, but this diff changes no KBLI classification, risk level, PMA
  status or pricing value — verified by reading every line this diff adds to
  RiskBadge.tsx/PMABadge.tsx/BaliStatusBadge.tsx (see receipts): the additions are UI meta-labels
  ("needs review", "N% conf.", "pending verification") rendered from fields the pre-existing data
  model already carries, not new classification data. Manufacturing an `nb:`/`query_hash:` for a
  NotebookLM query that never happened would be the phantom-citation failure R8 exists to prevent,
  pointed the other way. R9 (council_run quorum) is NOT overridden in this revision — the fresh
  gate's rework ask ("add one such seat and drop the R9 half of the override") is done: two
  distinct titolar seats now hold, see council-journal.jsonl.
