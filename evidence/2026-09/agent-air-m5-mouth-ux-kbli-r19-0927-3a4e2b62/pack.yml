  rounds are kimi (round 1) and tp1 (round 2); round 3's gate cycle did not add a third review
  dispatch. Three GATE cycles total on this branch (fresh-gate REWORK-BUILD twice: B1/B2 on the
  first head, B3 + B2-residual on the second) — the gate doing its job on a design-token
  unification that is genuinely easy to get subtly wrong twice, not scope creep. Per the Builder
  Contract's "three reds for the SAME cause suspends" rule: round 1 and round 3 are DIFFERENT
  causes (a values-diverge bug, then a values-dropped bug the values-unify fix itself introduced),
  so this is a depth-1 fix-of-a-fix on round 1's cure, not a third round on the same cause —
  within the Contract's bound, not past it.
