dissent:
  - seat: kimi-code/k3
    objection: >-
      CTAHandoff's primary pill border/color depends on var(--accent-funnel) with a fallback chain
      that only guards var(--accent-funnel-text) being undefined — if a consuming funnel defines
      neither variable, the border declaration is invalid at computed-value time and the pill
      silently loses its border and inherits text color.
    status: RETRACTED
    resolution: >-
      packages/core/tokens/semantic.css:21 defines --accent-funnel at :root, so every current
      consumer (kbli, tax-calendar, property/eligibility, prime/proposal) resolves a real value even
      with no local override — verified by grep across apps/mouth/src and packages/core (see
      receipts). No consumer is left with an undefined --accent-funnel.
  - seat: kimi-code/k3
    objection: >-
      Restyling packages/core/components/CTAHandoff.tsx is an unannounced visual change to every
      funnel that renders it (tax-calendar, property/eligibility, prime/proposal via
      FunnelFrame.tsx), not scoped to /kbli despite the commit message framing it as a kbli fix.
    status: CONFIRMED
    resolution: >-
      True and deliberate, not a defect: the original commit (55ecb0b5a0/468da08a2d) fixed a
      full-width-slab bug the author judged universal to the shared component, and added
      CTAHandoff.test.tsx to pin the new behavior. Called out explicitly in this PR's body as an
      intentional cross-funnel side effect rather than shipped silently.
  - seat: fresh Opus 5.5 gate (sign-only, first head c7b1088309)
    objection: >-
      The PR puts TWO independently-derived R19 Direction A systems on main: this branch's
      lib/theme/r19Vars.ts and main's components/r19/presentation.ts R19_VARS, diverging on
      --text-secondary (#58626B vs #435464), --border-strong (#A8ACA9 vs #a7a69f) and
      --text-on-accent/--cta-primary-fg (#FFFCF7 vs #FFFFFF); the PR body's "cosmetic naming
      collision" premise is false, since a rename would not remove the divergence.
    status: CONFIRMED
    resolution: >-
      Cured in the rework commit (f14500c8d1): r19Vars.ts now spreads R19_VARS first and only adds
      tokens main lacks, with every alias to a shared meaning expressed as var(--that-key) rather
      than a copied literal (r19Vars.test.ts's new "restates no R19_VARS key at a different value"
      check makes a future re-divergence a failing test). The duplicate, heavier Fraunces/Manrope
      font pair (next/font, 125+24 KB) is deleted; both systems now load the same 17+13 KB
      @font-face pair via the new shared styles/r19-fonts.css. Not a rename — a real unification.
  - seat: fresh Opus 5.5 gate (sign-only, first head c7b1088309)
    objection: >-
      The mobile menu toggle on /kbli and /kbli/<code> is white on the paper nav (1.10:1 contrast
      vs 14.94:1 on production), because MobileNav.tsx hardcodes a white icon for any
      non-isR19Route path and /kbli's nav is opaque paper, not the dark shell every other non-R19
      funnel has.
    status: CONFIRMED
    resolution: >-
      Cured in the rework commit (f14500c8d1): MobileNav's non-R19 branch now reads
      --nav-icon-color/--nav-icon-bg/--nav-icon-border with the exact prior literal as each var()'s
      fallback (every other consumer renders identically), and r19Vars.ts sets the triplet to
      kbli's ink-on-paper (#1D2C3B on #FFFCF7, 13.9:1, independently recomputed by both council
      seats). r19Vars.test.ts pins the new pair at >=3:1.
  - seat: tp1-qwen3.8-max
    objection: >-
      --r19-focus hardcodes #A44B36 instead of var(--accent-funnel); if --accent-funnel were ever
      re-tinted in R19_VARS this literal would lag behind it.
    status: PLAUSIBLE
    resolution: >-
      Accepted as-is: both systems already agree on copper (#A44B36) at this token, the SHADOW
      value grammar r19Vars.test.ts enforces does not accept a var() inside a multi-part shadow
      literal, and re-tinting copper site-wide is not a live plan. Left literal; noted for a future
      editor of R19_VARS's own accent-funnel value.
  - seat: tp1-qwen3.8-max
    objection: >-
      kbli-theme.css's [data-funnel="kbli"] override now writes --text-on-accent as lowercase
      #ffffff while R19_VARS writes uppercase #FFFFFF.
    status: RETRACTED
    resolution: CSS hex literals are case-insensitive; no functional or rendered difference.
  - seat: fresh Opus 5.5 gate (sign-only, second head 0e1f773419)
    objection: >-
      Round 1's unification (f14500c8d1) dropped --foreground entirely (R19_VARS never defines it)
      instead of restating it, so /kbli/<code> falls back to globals.css's dark-theme default
      (#ececec on paper): 30 text elements measured at 1.08-1.15:1, down from 12.96:1 on the first
      head. Also, six tokens (--surface-base-solid, --surface-sunken, --surface-deep,
      --bz-elevated, --r19-structure, --r19-focus) still copy main's values under another name as
      a literal instead of a var() reference — a residual form of B2.
    status: CONFIRMED
    resolution: >-
      Cured in this round's commit (93187d6f2d): --foreground is restored as a LITERAL synced to
      --text-primary at import time (R19_VARS["--text-primary"]), NOT a var() alias — kbli-theme.css's
      own .kbli-paper block (BRIEF-v2 R-1 Section 3.4) documents this exact indirection as "the
      r19Vars.ts alias trap": a :root-declared alias re-resolving to the dark default instead of
      the paper override the block was written to guarantee. .kbli-paper avoids the trap by
      restating every --kbli-* token as its own literal; this file now does the same for
      --foreground specifically. The six residual literals are converted to var() references
      (--surface-base-solid -> var(--surface-base), --surface-sunken -> var(--r19-wash),
      --surface-deep -> var(--surface-sunken), --bz-elevated -> var(--surface-raised),
      --r19-structure -> var(--r19-slate), --r19-focus -> "0 0 0 3px var(--accent-funnel)"), and
      r19Vars.test.ts's alias-grammar guard is extended to cover all six plus a dedicated
      composite-shadow check for --r19-focus. A new coverage test walks the real kbli surface tree
      (apps/mouth/src/app/kbli/**, apps/mouth/src/components/kbli/**) plus MobileNav.tsx and fails
      if any non-external var(--x) it reads is undefined in the effective R19_DIRECTION_A_VARS set
      — the general form of this exact regression class. Live re-verification on the fresh Vercel
      preview (mouth-git-agent-air-m5mouthux-kbli-r19-0927-nuzantara-2026.vercel.app) was NOT
      performed: the preview sits behind Vercel's deployment-protection SSO wall
      (vercel.com/sso-api redirect confirmed via curl) and this session does not hold the
      automation-bypass secret the gate's own Playwright check used. Static verification (tsc,
      the 4-new-test vitest suite, full apps/mouth suite, production build) is the substitute
      evidence for this round; a live contrast re-check is left to whichever session next has
      preview access.
