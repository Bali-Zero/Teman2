brief_ref: evidence/brief.yml
plan_ref: >-
  Ship order recorded by the conducting session (main): rebase each of the four dormant mouth UX
  waves (kbli/oracle/studio/voa, all local branches on M5, builders died before pushing) onto
  post-#7448 origin/main one at a time -> PR + fresh gate + browser QA. This pack covers the FIRST
  lane, ux-kbli. The other three still carry the shared foundation commit and ship after this one
  lands.
council_run: council-journal.jsonl
council_note: >-
  One seat reviewed the diff and returned: kimi-code/k3 (prompt-in/prompt-out via
  scripts/kimi_client.py, no repo access; routePolicy.ts + the CTAHandoff.tsx diff +
  kbli/layout.tsx diff + full diffstat, no PII, no company-identifying data in the material sent),
  VERDICT HOLDS on all three questions asked. A second seat, codex-gpt-5.6-sol, was dispatched via
  .claude/scripts/codex-spalla.sh (base origin/main, read-only) but the conducting session (main)
  ruled mid-review that the spalla egress guard on main is known-defective and the lane is
  suspended — do not wait on it, do not launch any further external-seat review from this lane.
  The dispatch is left to finish on its own in the background (bash PID 21477, unattended) and its
  output was not read into this pack; the 34 files it received (identical to this pack's own diff,
  since it was dispatched from a clean worktree with base=origin/main and no other uncommitted
  changes) are listed in the shipping report for the egress gate to judge. Quorum is therefore NOT
  met — one seat, not two. Kimi's two caveats (accent-funnel fallback chain; CTAHandoff restyle
  scope) were independently re-verified by the author against the real tree (see receipts) and
  found non-blocking.
seat_override: >-
  Two rules are suppressed by this one field, same as the precedent in
  evidence/2026-08/agent-air-m5-backend-rag-voa-price-750-0831-94ec3467/pack.yml — `seat_override`
  is pack-level (shared by _seat_rule_verdict/_r9_r11_verdict), so it covers R9 as well as R8
  whether or not that was intended. (1) GROUND TRUTH (R8): apps/mouth/src/app/kbli/* is a
  GROUND_TRUTH_PATH_PATTERNS hit, but this diff changes no KBLI classification, risk level, PMA
  status or pricing value — verified by reading every line this diff adds to
  RiskBadge.tsx/PMABadge.tsx/BaliStatusBadge.tsx (see receipts): the additions are UI meta-labels
  ("needs review", "N% conf.", "pending verification") rendered from fields the pre-existing data
  model already carries, not new classification data. Manufacturing an `nb:`/`query_hash:` for a
  NotebookLM query that never happened would be the phantom-citation failure R8 exists to prevent,
  pointed the other way. (2) QUORUM (R9): genuinely NOT met, and this override is not a claim that
  it is. One seat ran and returned HOLDS (kimi-code/k3, see council-journal.jsonl); the second
  (codex-gpt-5.6-sol) was abandoned mid-flight per the conducting session's ruling that its egress
  guard is defective on main — not a quota/timeout death, a deliberate stop-order. If the reviewer
  of this PR wants a second live seat before merge, the honest answer is that one was in flight and
  was pulled by policy, not by failure.
lanes:
  - lane: ux-kbli-rebase
    role: build
    seat: >-
      claude-sonnet-5 (this session, in .worktrees/mouth-ux-kbli-r19-0927, which added this
      pack's own commit on top). The cherry-picked range (foundation plus 12 follow-on changes)
      was authored by an earlier claude-sonnet-5 continuation session on M5, 2026-09-24/26, in
      .worktrees/mouth-ux-kbli-0926 (left untouched by this unit — another process is backing it
      up); with this pack's commit the branch carries 14 commits total ahead of origin/main. Both
      authorship sessions are the same Anthropic seat, so this is recorded as one build lane, not
      two, per D3's build-lane count
  - lane: kimi-review
    role: review
    seat: kimi-code/k3
dissent:
  - seat: kimi-code/k3
    objection: >-
      CTAHandoff's primary pill border/color depends on var(--accent-funnel) with a fallback chain
      that only guards var(--accent-funnel-text) being undefined — if a consuming funnel defines
      neither variable, the border declaration is invalid at computed-value time and the pill
      silently loses its border and inherits text color.
    status: RETRACTED
    resolution: >-
      packages/core/tokens/semantic.css:21 defines --accent-funnel at :root, so every current
      consumer (kbli, tax-calendar, property/eligibility, prime/proposal) resolves a real value even
      with no local override — verified by grep across apps/mouth/src and packages/core (see
      receipts). No consumer is left with an undefined --accent-funnel.
  - seat: kimi-code/k3
    objection: >-
      Restyling packages/core/components/CTAHandoff.tsx is an unannounced visual change to every
      funnel that renders it (tax-calendar, property/eligibility, prime/proposal via
      FunnelFrame.tsx), not scoped to /kbli despite the commit message framing it as a kbli fix.
    status: CONFIRMED
    resolution: >-
      True and deliberate, not a defect: the original commit (55ecb0b5a0/468da08a2d) fixed a
      full-width-slab bug the author judged universal to the shared component, and added
      CTAHandoff.test.tsx to pin the new behavior. Called out explicitly in this PR's body as an
      intentional cross-funnel side effect rather than shipped silently.
pii_scan: clean
pii_scan_note: >-
  Diff touches no client data, no CRM, no WhatsApp transcripts, no research/crm-exports paths.
  Material sent to kimi (external prompt-in/prompt-out seat) was routePolicy.ts, the CTAHandoff.tsx
  diff, kbli/layout.tsx diff and a diffstat — no company contact value, no client-identifying string.
