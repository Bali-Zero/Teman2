dissent:
  - seat: codex-gpt-5.6-spalla
    objection: >-
      BLOCKER: a pin path that exists but is neither a symlink nor a
      regular file (directory, /dev/null, FIFO) reached the wrapper's
      legacy `else` branch (exit 0, daemon env's WA_CODEX_BIN used)
      instead of failing closed, because the original check was only
      `[ -L ]` then `[ -f ]` then `else`, with nothing testing existence
      independently of regularity.
    status: CONFIRMED
    disposition: >-
      Fixed: `[ -e "$CODEX_PIN_FILE" ]` is now checked before `[ -f ]`,
      and a present-but-not-regular path exits 78 with "pin file is not a
      regular file". Covered by test_guilt_present_but_invalid_pin_refuses
      [directory,dev_null,fifo] — verified rc=78 on all three, exit 0
      reproduced on the pre-fix copy.
  - seat: codex-gpt-5.6-spalla
    objection: >-
      BLOCKER: the resolved pin version/binary path lived in ordinary
      named shell variables (PIN_VER/PIN_BIN); `set -a; . "$ENV_FILE"`
      exports whatever the daemon env assigns by the same name, so a
      plain `PIN_VER=`/`PIN_BIN=/opt/homebrew/bin/codex` line in that file
      — DATA, no alias or function — silently overrode the validated
      values after the fact.
    status: CONFIRMED
    disposition: >-
      Fixed: the resolved pin now travels as positional parameters ($1/
      $2), set via `set -- "$_wcbw_pin_ver" "$_wcbw_pin_bin"` immediately
      before the env source. A `KEY=value` env-file line cannot touch $1/
      $2 at all. Covered by
      test_guilt_daemon_env_cannot_clobber_the_resolved_pin, which tries
      the collision on both the retired names and the current private
      ones and confirms the pinned values still reach the daemon.
  - seat: codex-gpt-5.6-spalla
    objection: >-
      MEDIUM: a shell variable cannot represent an embedded NUL byte, so
      `WA_CODEX_CLI_VERSION_PIN=9.9.9\n\0JUNK\n` is read as a single valid
      line ("9.9.9") by `read -r`, silently discarding whatever followed
      the NUL instead of rejecting the file.
    status: CONFIRMED
    disposition: >-
      Fixed: a dedicated NUL probe (`IFS= read -r -d '' _pin_nul_probe <
      "$CODEX_PIN_FILE"`, builtin `-d` — a bash/dash extension available
      on macOS's own /bin/sh and on macos-latest CI, the only two shells
      this wrapper ever actually runs under) returns 0 only when it found
      a NUL delimiter before EOF, which a clean file never does.
      CORRECTED (gate 2026-09-26 REWORK-BUILD, C1): the pre-existing
      `embedded_nul` case put the NUL on its OWN line, which the
      exactly-one-line check alone already rejected regardless of the NUL
      probe — it never isolated the guard it claimed to cover, so
      deleting the NUL probe left the suite green. The real covering case
      is the new `nul_same_line_planted` fixture (NUL genuinely mid-line,
      single trailing newline, binary planted so the fault resolves
      instead of being masked by a later guard) — mutation-verified:
      removing the NUL probe now turns exactly that case red.
  - seat: codex-gpt-5.6-sol (gate-convened, delta rounds)
    objection: >-
      REWORK-BUILD (gate 2026-09-26, PR #7420 @ 08a5d93537): the 5-guard
      mutants stayed green against the then-current 17-test file (NUL
      probe, one-line check, `_is_semver`, derived-binary check all
      non-discriminating), the derived binary check accepted a 0755
      directory at bin/codex, an EACCES pin path fell through to legacy
      instead of failing closed, and this pack's `seat_override` masked
      the R9 council-quorum requirement.
    status: CONFIRMED
    disposition: >-
      Fixed in this rework: C1 (4 new discriminating fixtures, all 5
      guards mutation-verified — mutant-table.md), C2 (`[ -f ] && [ -x ]`
      + dedicated bin_is_directory test), C3 (EACCES on the pin's
      directory now exits 78 "pin invalid" before legacy, with a
      dedicated test), C4 (`seat_override` dropped, `council_run` wired
      to this journal). Delta re-review by the gate's own
      codex-gpt-5.6-sol seat: round 1 REWORK (C2 fixture missing, C3
      fixture not isolating), round 2 REWORK (C2/C3/N4 confirmed fixed;
      one remaining gap in N1's regression, see next entry). No round-3
      accept was obtained within the coordinator's time-box — the fresh
      re-gate decides whether the council (kimi ACCEPT-WITH-NOTES + this
      seat's round-2 REWORK, with the round-2 gap fixed but unconfirmed)
      is sufficient.
  - seat: codex-gpt-5.6-sol (delta round 2)
    objection: >-
      N1's regression (test_guilt_env_cannot_clobber_post_source_literals)
      clobbered only 3 of the 6 protected wrapper-private literals
      (RUNTIME_DIR/VENV_PY/TAG, not HOME_DIR/ORGAN_ID/SIDECAR_DIR) and
      never checked the heartbeat file at all; proven by the seat's own
      live mutation (removing just the HOME_DIR/ORGAN_ID/SIDECAR_DIR
      re-asserts left the test green).
    status: CONFIRMED
    disposition: >-
      Fixed: the test now sets hostile values for all 6 names and asserts
      the heartbeat JSON (`$SIDECAR_DIR/$ORGAN_ID.json`) lands at the
      wrapper's OWN (test-patched) HOME_DIR/ORGAN_ID path with
      `"status":"starting"`/`"note":"exec daemon"`, never the hostile
      destination. Mutation-verified: removing the HOME_DIR/ORGAN_ID/
      SIDECAR_DIR re-asserts from the wrapper's N1 block now turns this
      test red. NOT re-reviewed by codex-gpt-5.6-sol (round 3 not
      obtained within the coordinator's time-box) — see
      council-journal.jsonl line 4.
