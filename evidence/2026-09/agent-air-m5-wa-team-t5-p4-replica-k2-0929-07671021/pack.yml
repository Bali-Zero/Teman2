what_changed: |
  ONE commit, tests + CI floor only, on top of a fresh `origin/main` (which already carries
  #7598, squash-merged as `9ae496a420`). Closes condition K2 of #7598's delta re-gate (fresh
  Opus, PASS-WITH-CONDITIONS @`13cd517b77`) -- see the full report:
  https://github.com/Bali-Zero/Teman2/pull/7598#issuecomment-5885738310

  The delta gate's own 47-mutant round (32 prior + 15 new) found 6 mutants surviving in the
  UNIT suite for `scripts/wa_practices_replica.py` -- killed only by the opt-in real-PG suite
  (which CI does not run by default), or not killed anywhere:

  N01/N02 (R7's `trigger_maintained=("updated_at",)` reverted on the practices/practice_types
  UPSERT call sites) and N03 (the exclusion reverted from the `IS DISTINCT FROM` comparison
  specifically): two new tests assert `updated_at` appears EXACTLY ONCE in each UPSERT SQL
  constant -- in the INSERT column list -- and nowhere in the `SET`/comparison clauses that
  follow.

  N05 (the INSERT binds `datetime.now()` instead of Fly's own `updated_at`): one new test pins
  the actual bound parameter value, captured via the existing fake connection's `fetchrow`
  storage, to a literal Fly timestamp (`2020-01-01`) far from wall-clock time -- a mutant
  substituting "now" cannot pass by coincidence.

  N15 (`cli_main` returns `rc=3` before the counts line is ever written to stdout -- the same
  silent-green class gate finding F3 exists to close): the two existing rc=3 tests now also
  assert `capsys.readouterr().out == wpr._success_line(metrics)`, not just the return code.

  N07 (a NULL Fly `uuid` reaches the `pro_only_kept` query's `fly_uuids` parameter before the
  skip-check, poisoning it on real Postgres -- gate finding F2's own failure mode): the fake
  connection's `fetchval` now records the raw `fly_uuids` param, and the existing NULL-uuid
  test asserts `None` is never in it. This was the one genuinely subtle case: the PRE-EXISTING
  `m.pro_only_kept == 1` assertion on that same test does NOT catch this mutant, because the
  fake's plain Python `in` check does not reproduce real Postgres's `uuid <> ALL(ARRAY[...,
  NULL])` NULL-poisoning semantics -- confirmed empirically during mutation-verification (see
  receipts).

  Every one of the six was mutation-verified before being accepted: the corresponding
  production code was temporarily reverted to the EXACT mutant shape (via `cp` backup,
  `ast.parse` syntax check), the relevant test(s) run in isolation and observed failing with
  the predicted symptom, then the code restored byte-identical (`diff` against the backup
  confirmed) and the full suite re-run clean. See receipts below for each mutant's repro.

  NO PRODUCTION CODE CHANGED. `scripts/wa_practices_replica.py` is untouched by this diff --
  confirmed via `diff` against a pre-change backup taken before any mutation-verification work
  began. Per the coordinator's explicit instruction for this round, if a new test had exposed a
  real production bug instead of a unit-suite gap, this build lane was to stop and report
  rather than fix it here; none did.

  pack.yml's F4 (stale "Four commits ... 544 lines" / "80/17/80" text inside #7598's OWN
  merged evidence pack) is deliberately NOT touched by this PR -- editing that pack as part of
  THIS diff would put it in THIS diff, and its `diff:` block correctly describes #7598's own
  frozen historical numstat at merge; editing the text now would break
  `evidence_pack_lint.py`'s countable-claims rule against THIS branch's own numstat. Verified
  empirically before deciding not to touch it: running the lint with this branch's numstat
  against that pack produced 5 countable-claims violations (9 vs 2 files measured, 3526 vs 139
  insertions, etc.) -- exactly the scenario the delta gate's own K2 condition anticipated
  ("if the merged evidence dir can't be edited in this PR's scope, put the corrections in the
  PR body"). The F4 corrections are carried in this PR's body instead, for the coordinator to
  fold into the ledger.

  RE-GATE (2026-09-29, verdict REWORK-BUILD @95fc4b3ebb): a fresh Opus session gated this PR
  itself and confirmed N01-N03/N07/N15, floor mechanics, CI wiring and the F4 carry are all
  correctly closed -- explicitly instructed NOT to touch any of that. It found the ORIGINAL
  N05 test (`test_run_sync_insert_stores_flys_updated_at_verbatim_not_now`) mutation-verified
  against a Python-param-level mutant (special-casing `updated_at` to `datetime.now()` inside
  `run_sync`'s param-construction loop) that is ALREADY killed by a pre-existing test,
  `test_run_sync_insert_then_idempotent_second_run_is_all_unchanged` -- confirmed empirically
  by this build lane before making any change: the SAME mutant makes that existing test's
  second-run `unchanged` assertion fail too (two `run_sync` calls a moment apart each mint a
  DIFFERENT `datetime.now()`, so the fake's row-equality check never matches). So "EXACT
  mutant shape" was a true-but-misleading claim: the test was real and RED on ITS mutant, but
  that mutant was not the gate's actual named N05. The gate's real N05 lives one layer down,
  inside `_build_upsert_sql`'s SQL-TEXT construction: a mutant wraps a trigger-maintained
  column's VALUES expression in `COALESCE(NOW(), ...)` -- since `NOW()` is never NULL, this
  silently discards ANY bound Fly parameter at the SQL level, invisible to any run_sync-level
  test (the fake never interprets SQL text, only the Python params handed to it).

  R1 (the real N05 closure): two new unit tests locate `updated_at`'s exact position in the
  VALUES list (from the same column lists `_build_upsert_sql` itself consumes) and assert the
  expression there is BYTE-FOR-BYTE `$<i+1>::timestamptz` -- not merely that the substring
  appears (a `COALESCE(NOW(), $20::timestamptz)` mutant would still CONTAIN the literal
  substring `$20::timestamptz`, so a plain containment check could not discriminate it; exact
  positional equality via a depth-aware VALUES-list splitter is required). A second, fully
  independent net asserts `NOW(` is absent from the whole SQL, case-insensitively. Both tests
  verified RED on the gate's exact mutant (`COALESCE(NOW(), ...)` wrap) AND on a simpler bare
  `NOW()` substitution, then restored and re-verified GREEN.

  R2: the original N05 test's docstring corrected to state plainly that it is a real, useful,
  INDEPENDENT regression guard on the Python-param layer -- but NOT what closes the gate's own
  named N05 finding -- and to point at the two new tests that do. The workflow's growth-history
  comment and this pack corrected identically; the PR body's mutant table row updated to name
  R1 as N05's real closure.

