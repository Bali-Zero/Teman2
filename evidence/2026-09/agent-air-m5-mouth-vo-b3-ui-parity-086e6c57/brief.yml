objective: >-
  MANDATE-vo.md "Slice B3" (PLAN §3 row B3, criterion G2-c): a Playwright UI-parity runner
  that drives the Visa Oracle verdict surface for a stratified, deterministic sample of the
  B4 sweep's 253 recorded walks (32 outcome classes), intercepts the engine route, and
  compares the RENDERED DOM against the verdict the live engine recorded -- spending no
  engine call. Opt-in via VISA_ORACLE_LIVE_PARITY=1, gated so the default CI job's `--list`
  (which imports every spec) registers ZERO tests from this file and its title matches
  neither of the default job's own `--grep "page Page|@offline"` tokens.

  TWO STRUCTURAL REDS WERE MET DURING THIS BUILD AND ARE REPORTED HERE, NOT CURED (both are
  out of this PR's touch-no-source-file / no-tsconfig scope):

  (a) `apps/mouth/scripts/visa-oracle/enumerate-interview-space.ts` (the module U1 requires
  this slice to reuse -- `countExactWalks`, `buildCoveringSubset`, `CoveringWalk`) contains a
  CLI-entrypoint guard using `import.meta.url`. A top-level `import` of its value exports
  crashed Playwright's OWN `--list` for the ENTIRE e2e suite ("Total: 0 tests in 0 files"),
  because `apps/mouth/package.json`, unlike the monorepo root, does not declare `"type":
  "module"`, so Playwright's transform emits CJS for that file and CJS cannot contain
  `import.meta`. Moving the import to a dynamic `await import()` confined to `beforeAll`
  fixes the DEFAULT job completely (proven: full suite collects 1444 tests cleanly with no
  env vars, and 0 tests select from this file under the default `--grep`) -- but the
  IDENTICAL `SyntaxError: Cannot use 'import.meta' outside a module` still fires the moment
  `beforeAll` actually awaits that import during THIS PR's OWN gated run, before any
  render/assertion logic executes for any of the 32 samples.

  (b) Independently of (a), verified via an out-of-band `vitest` harness (not part of this
  PR, run then deleted) that CAN import the enumerator: replaying 32/32 sampled walks'
  recorded facts through the production `flowReducer`, exactly as U4 specifies, throws on 30
  of them -- not only the 10 `review-gate/<item>` classes the design named as a risk. Root
  cause: `generate-walk-corpus.ts`'s `answerFor()` (used by `runWalk`, which drives
  `computeNextNode` directly and never dispatches a real `flowReducer` ANSWER action) assigns
  `wants_onshore_conversion="yes"` and `application_channel="OFFSHORE"` as literal first-option
  defaults without regard to `flow.ts`'s `channelConflictsWithOnshoreIntent` guard, which
  `flowReducer`'s ANSWER case DOES enforce and correctly refuses as incoherent -- the same
  refusal a real browser user would hit. This affects `baseline/all-default` itself and 19 of
  the 21 `edge/*` classes, in addition to the 10 anticipated `review-gate/*` ones. Only
  `edge/application_channel=unsure` and `edge/in_indonesia=unsure` replay cleanly to a
  terminal node (verified via the same out-of-band harness).

  Given both reds, THIS PR's own gated `VISA_ORACLE_LIVE_PARITY=1` run fails at `beforeAll`
  for every one of its 32 samples (blocker (a) alone is sufficient; blocker (b) would still
  block 30/32 even if (a) were resolved). None of the five required guilt-proof mutations
  (U2, U3, U5, U6, U7) could be captured via the actual Playwright command, because all of
  them execute after the point where `beforeAll` now fails. What IS proven and captured: (1)
  the spec compiles clean (`tsc --noEmit`); (2) the file is fully import-safe for the shared
  suite (the two `--list` proofs in the PR body); (3) the file's own U2/U3 DATA logic
  (32-class grouping, derived-label-set equality) and the U6 fact-derivation path
  (`buildEngineOutcome` on the `edge/work_payer=no` sample) are each independently correct,
  verified via the out-of-band vitest harness described above.

  Per the mandate's own explicit provision for exactly this class of risk ("if the TS
  resolution fails at your first --list, REPORT it; never edit a tsconfig" / "a throw ... is
  REPORTED, never adjusted"), this PR opens UNARMED with both reds documented in the spec's
  own header comment and here, for the conductor and a fresh gate to adjudicate -- most
  likely as a REWORK-BUILD once the spec design accounts for (a) and (b), since neither is
  fixable from inside this PR's allowed scope.

