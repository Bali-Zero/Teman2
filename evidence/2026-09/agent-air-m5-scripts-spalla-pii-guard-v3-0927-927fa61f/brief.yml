task_id: spalla-pii-guard-v3-0927
gear: 2
l_level: L2
gate_class: opus
objective: >-
  Close the hole in .claude/scripts/codex-spalla.sh that sent a PII-removal PR's own 959
  deleted client full_name lines to the Codex CLI (OpenAI cloud) in cleartext (cicatrix
  W140). Third round: an independent gate on #7470 (v2) found blockers 1/3/4/5 of the
  original v1 gate cured, blocker 2 only partly cured, plus four NEW defects introduced by
  v2 itself: (1) a fake-CRM-name test fixture reused eight times across both test files was
  a probable REAL client name, paired with a client_id in scripts/crm_guardian_phase15_pilot.py
  on origin/main; (2) the space-bearing-path fix in strip_data_file_deletes was false on real
  git output (git appends a trailing TAB after such a path on the diff's "--- "/"+++ " header
  lines, which the hand-typed test fixture omitted so the bug shipped a passing test); (3) the
  dynamic half of the PII-path list (scripts/async_review_supervisor.py's PII_PATH_FRAGMENTS)
  failed OPEN, silently, when that module could not be read or parsed; (4) several claims in
  the PR's own artefacts (brief.yml, scar) were false at the time they were written. This PR
  fixes all four, finishes blocker 2 (the .gitignore half of the static PII-path list had no
  drift detection), and ports the one gate-relevant defect-3 guilt test into pytest so a CI
  run actually executes it (the .sh unit-test file is not collected by any workflow today).
constraints:
  - Only .claude/scripts/codex-spalla.sh, scripts/lib/spalla_redact.sh, scripts/tests/test_codex_spalla.py,
    scripts/tests/test_codex_spalla_diff_redaction.sh and docs/scars/cicatrix-scars.md (W140)
    changed relative to the merged v1 (#7466); scripts/_redact_pii.py's one CLI flag from v1
    is unchanged in this round.
  - >-
    No real client name/phone/email anywhere in this diff, its tests, its commit or the scar —
    every fixture is the single invented name "Jane Placeholder" (already an established safe
    fixture in scripts/tests/test_nb_title_redaction.py) or an RFC 2606 test-fixture email or
    phone shape. scripts/test_redact_pii.py's own fixture list is NEVER a safe source to copy
    from — gate 7470 found one of its names sitting next to a real client_id on origin/main,
    which is exactly how the previous round's near-miss happened — this file's own name
    fixture was chosen for the same, now-corrected, reason and independently re-verified
    absent from the final diff (grep, this round, for every name test_redact_pii.py declares).
  - Neither test file invokes the real codex CLI or a real Postgres connection; both use a
    fake `codex`/`psql` on PATH, never the real network.
acceptance:
  - text: >-
      WHEN a diff touches a path matched by the union of the static PII_PATH_PATTERNS list,
      the .gitignore-derived drift check, and the live PII_PATH_FRAGMENTS tuple in
      scripts/async_review_supervisor.py (parsed from either an annotated or a plain
      assignment), on EITHER side of a rename, the wrapper SHALL exit 7 before invoking
      `codex exec`, UNLESS --allow-pii-paths is passed (itself logged to telemetry).
    probe: >-
      scripts/tests/test_codex_spalla.py::test_pii_classed_path_refused_before_dispatch,
      test_rename_out_of_pii_path_is_still_refused, test_allow_pii_paths_override_permits_dispatch;
      scripts/tests/test_codex_spalla_diff_redaction.sh's static/dynamic/gitignore-drift blocks
  - text: >-
      WHEN the PII_PATH_FRAGMENTS source cannot be read or parsed at all, pii_path_hit SHALL
      fail CLOSED (treat every path as PII-classed) rather than silently proceeding as if the
      dynamic list were empty, and the wrapper SHALL exit 7 before invoking `codex exec`.
    probe: >-
      scripts/tests/test_codex_spalla.py::test_unreadable_pii_fragment_source_fails_closed_before_dispatch
      (CI-executed copy); scripts/tests/test_codex_spalla_diff_redaction.sh's matching guilt
      case (local-only, not run by any workflow today — see risks)
  - text: >-
      WHEN a diff deletes a line of a `.jsonl`/`.csv`/`.xlsx` file at a path containing a
      space, strip_data_file_deletes SHALL still suppress that line — proven against a
      fixture generated from a REAL `git diff` invocation, not hand-typed, so the test cannot
      again omit a real git output detail (the trailing TAB after such a path).
    probe: >-
      scripts/tests/test_codex_spalla_diff_redaction.sh's SPACE_DIFF block (built via a
      throwaway git repo inside the test)
  - text: >-
      WHEN scripts/_redact_pii.py cannot load a non-empty PROD CRM name list, the wrapper
      SHALL refuse (exit 8) before invoking `codex exec`; WHEN a reachable list contains a
      fixture name present in the diff, that name SHALL reach the prompt only as
      [CLIENT-NAME-REDACTED]. (Unchanged from v1/v2; re-verified passing this round.)
    probe: >-
      scripts/tests/test_codex_spalla.py::test_missing_crm_names_fails_closed_before_dispatch,
      test_crm_name_in_diff_is_redacted_before_dispatch
  - text: >-
      Every `.gitignore` line matching a PII keyword (crm/hr/client/passport/dossier/
      compliance/dq_clients/dq_orphan/yield-opportunities/wa-corpus, scripts and one
      unrelated screenshot-folder name excluded) SHALL be classified PII by pii_path_hit —
      derived from .gitignore's actual current content at test time, not a second hand-typed
      list, so a future .gitignore addition the wrapper doesn't yet cover fails this test
      instead of shipping silently uncovered.
    probe: >-
      scripts/tests/test_codex_spalla_diff_redaction.sh's ".gitignore drift guard" block
      (found and closed one real gap this round: compliance_report_*.pdf)
  - text:
      The pre-existing guilt/innocence tests for codex-cli argv/exit-code/verdict behavior,
      artefact permissions (0600/0700), and the PII/redaction guards from v1/v2 SHALL still
      pass unchanged.
    probe: "pytest scripts/tests/test_codex_spalla.py (18/18)"
consumer_map:
  - Every codex-spalla.sh dispatch (any future council/codex-second-opinion invocation)
    consumes scripts/lib/spalla_redact.sh's three guards directly.
risks:
  - scripts/codex_tri_llm_review.py has the same raw-diff-forwarding defect against
    Codex+Kimi and does not use these guards; confirmed not wired live via any M5/Mini cron
    or LaunchAgent as of this writing (Pro unreachable, unverified). Tracked in the W140
    scar, not closed by this PR — separate fix, separate PR.
  - >-
    scripts/tests/test_codex_spalla_diff_redaction.sh is NOT executed by any CI workflow:
    scripts-tests-sweep.yml's nightly report-only sweep runs `pytest scripts/tests/`, which
    never collects a `.sh` file. This was mis-stated in the v2 brief as a
    guard-conformance-registry gap; the actual gap is narrower and this PR's cure for it is
    narrower too — the one gate-load-bearing guilt case (defect 3, dynamic-fragment
    fail-closed) is now ALSO a pytest test
    (test_unreadable_pii_fragment_source_fails_closed_before_dispatch) that IS collected by
    the nightly sweep, so that specific guarantee is CI-checked even though the .sh file
    overall still is not. Registering scripts/tests/test_codex_spalla*.sh in
    infra/guard-conformance/registry.json and wiring the .sh suite into a PR-blocking
    workflow remain deferred — a structural CI change bigger than a three-round bugfix's
    mandate.
  - The operator-typed FOCUS brief and the untracked-file PATH list are not passed through
    the redactor (documented in the wrapper's own header as a known, lower-risk gap;
    unchanged from v1/v2).
  - Every redact_for_external call now shells out to psql up to twice; a wrapper run can
    make up to 6 PG round-trips (3 embedded bodies x 2 queries) — a latency/DB-load cost
    accepted, not optimized (unchanged from v1/v2).
grader: >-
  Independent gate review (REWORK-BUILD verdict on the PR that carried v2, reworked here);
  a fresh gate on this head SHA is expected per the coordinating session.
budget: >-
  Existing subscription only; no paid API calls; no external-seat dispatch used for this
  PR's own review.
pii: >-
  none in the final diff — re-verified this round by name: the fixture that was flagged as a
  probable real client name in the previous round has been replaced everywhere (grep, this
  round, confirms zero remaining occurrences in the diff against origin/main), and every
  other name in scripts/test_redact_pii.py's own fixture list (the file where the flagged
  name came from) was independently checked absent too. The pre-existing, unrelated
  occurrence of the same flagged name in a scripts/_redact_pii.py code comment (illustrating
  sort-longest-first ordering) predates this branch, is unchanged by this diff, and is a
  separate, already-known cleanup left for a dedicated PR (same class as the
  crm_guardian_phase15_pilot.py finding — a pushed leak cannot be unpublished by this PR
  touching an unrelated line).
