  Measured with the inputs CI uses — `git diff --name-only origin/main...HEAD > /tmp/f.txt &&
  git diff --numstat origin/main...HEAD > /tmp/n.txt && python3 scripts/evidence_pack_lint.py
  --print-floor --changed-files-file /tmp/f.txt --numstat-file /tmp/n.txt`, re-run after the
  LAST commit (f2f2a9d97b). Result: 1. The paired `--print-floor-source` invocation (same two
  input files) names why: "none" — neither the size term (total churn against
  SIZE_GEAR2_THRESHOLD/SIZE_GEAR3_THRESHOLD) nor the path term (a hot-zone pattern) fires on this
  diff. No bare churn figure is written into this prose on purpose, per this mandate's own scar
  on that exact mistake (PR-D4c-1's brief, and again on PR-D4d's) — a number typed into a sentence
  goes stale the moment a later commit changes that sentence's own length; the command above is
  the only thing that stays true.
