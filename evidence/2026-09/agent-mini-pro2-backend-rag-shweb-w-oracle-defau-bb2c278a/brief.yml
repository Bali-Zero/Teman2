objective: >-
  Discharge condition C2 of the #6396 gate row (`.claude/skills/modus/PENDING-ARMS.md`, PR-D4c-1's
  transitional-default addition): "remove the transitional `default=` from `investment_amount_usd`
  and drop the sixth name from the rollout test's expected set ... a PR of its own after D4c-2
  ships on Vercel; the rollout test going red on that field is the receipt." PR-D4c-2 (#6419,
  merged into main at this branch's fork point 8452f0a6a8) shipped the interview question that
  fills this fact on the merit/family/undecided branches, closing the deploy-order window
  PR-D4c-1's transitional default existed to bridge. This PR discharges that follow-up: the fact
  becomes required like every other, per the repo's own invariant that every fact is required so
  an unasked question is UNKNOWN by declaration, never by omission.
scope:
  - apps/backend-rag/backend/services/visa_engine/models.py — drop the field's `default=`, the
    now-discharged `_INVESTMENT_AMOUNT_USD_ROLLOUT_DEFAULT` constant and its comments (including
    the `FOLLOW-UP (remove the default):` note), and the class docstring's transitional-field
    count (six -> five).
  - apps/backend-rag/backend/tests/services/visa_engine/test_sponsor_type_rollout.py — drop
    `investment_amount_usd` from the pinned optional-field set; delete
    `TestFactVocabularyExtensionRolloutDefaultD4c1` (it pinned only the now-retired
    transitional-default mechanism for this one field); correct the "widened ... to six"
    narrative to record the same-day narrowing back to five.
  - apps/backend-rag/backend/tests/services/visa_engine/_gold_fixtures.py — `_BASELINE_FACTS`
    was missing `investment.investment_amount_usd` (tolerated only while the field was optional);
    added as UNKNOWN/NOT_ASKED, the same "no rule references this path yet" treatment as
    `sponsor.type`.
  - apps/mouth/src/lib/api/schema.d.ts + schema.d.ts.openapi-sha256 — regenerated via
    `npm run contract:visa-oracle` (both files are generated, never hand-edited; the raw
    openapi-typescript 7.13.0 output was reformatted with `prettier --write` to match the repo's
    2-space style before being diffed or committed, exactly as PR-RISYNC's own precedent did).
  - this brief.
constraints:
  - No rule-pack edit of any kind; `sign_pack.py`/`activate_pack.py` never run;
    `VISA_ENGINE_EVALUATE_MODE` never touched.
  - Never hand-edit a generated file — `schema.d.ts`/its pin came only from
    `npm run contract:visa-oracle` + `prettier --write`.
  - No push, no PR, no arming, no merge — commit locally, report; the orchestrator ships.
  - Zero PII in any artifact touched.
