self_report:
  note: >-
    Everything the dispatch asked for was done as specified; nothing was skipped or worked
    around. Two things worth naming plainly rather than leaving implicit:

    (1) `TestFactVocabularyExtensionRolloutDefaultD4c1` was deleted in full, not just trimmed.
    The dispatch's "What to change" section named only "remove investment_amount_usd from the
    pinned optional-field set" for the test file. Running the suite empirically after the
    `models.py` change (A2 above) showed this class could not survive as-is: two of its six
    methods hard-fail (one on the now-required field rejecting omission, one on the deleted
    `_INVESTMENT_AMOUNT_USD_ROLLOUT_DEFAULT` constant it references directly), and the other four
    exist only to exercise the now-retired transitional-default mechanism for this one field —
    the same fate the file's own docstring already prescribes for `TestSponsorTypeRolloutDefault`'s
    tracking tests once the LAST field's window closes, applied here to the one class whose
    window closed. This returns `investment_amount_usd` to the same test footprint as its two
    sibling required `MoneyFact` fields (`investment_investment_capital_idr`,
    `investment_paid_up_capital_idr`), neither of which has a dedicated test file entry either.

    (2) The pin hash mismatch against the dispatch brief's own prediction (A6 above) was
    investigated, not waved past: the "before" pin matches the dispatch's measurement exactly,
    the raw regen diff was inspected before prettier (confirmed 4-space/2-space formatting only,
    zero path-set difference) and after (confirmed 17-line delta touching only this field), and
    the raw `openapi.json` was read directly to confirm `required` membership — so the differing
    "after" hash is attributed to this session's own docstring wording for the six->five count,
    not to unrelated schema drift.
