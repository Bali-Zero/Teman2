task_id: ops-seat6-cascade
gear: 3
l_level: L2
gate_class: opus
objective: |
  `infra/launchagents/wrappers/claude-cascade.sh` is THE cascade entry point every
  autonomous cron job on this repo shells out to (pro-healer.sh, nb-curator-daily.sh,
  regulatory-watcher-run.sh, competitor-monitor-run.sh, wr2-ig-metrics-analyst-run.sh,
  run-nb-curator-mode-c.sh — via `try_claude` tier 1). Before this PR it coupled each
  numbered slot to a config directory, and after the 2026-08-23 fleet remap two of
  those couplings were stale: slot 4's config_dir still pointed at `~/.claude-acct4`
  (a pre-remap name) and slot 5 was labelled `claude-token-5-team-env` with
  `config_dir=~/.claude-zero-team` — but slot 5 is actually
  kaiser198719871987@gmail.com, a plain MAX seat, not the Team.

  The load-bearing consequence: the Team seat had become UNREACHABLE from this
  cascade. It was only reachable through the compatibility branch gated on
  `[ -z "$CLAUDE_CODE_OAUTH_TOKEN_5" ]` — and after the remap filled slot 5 with a
  MAX token, that branch never opens. This PR moves the Team seat to slot 6 (last
  position, per Zero's ruling that it is a last-resort-only fallback since it is
  weekly-capped and the 5 MAX seats are not), repoints slot 4/5's config dirs to
  their correct accounts (`~/.claude-antozero`, `~/.claude-kaiser`), and re-gates the
  compat branch on `CLAUDE_CODE_OAUTH_TOKEN_6` instead of `_5`.

  Companion change in `scripts/wr3_dispatch_v2.py::_collect_claude_seats()`: it had
  `range(1, 6)` (stops at slot 5, never reaches 6) and `label = "slot5-team" if slot
  == 5` — the same stale assumption, in the WR3 dispatcher's own independent seat
  collector.

  ADDITIONAL FIX FOLDED IN (found during this session's own verification, not in the
  original diagnosis): `scripts/tests/test_claude_cascade_shell.py` — the hermetic
  shell-integration test suite for claude-cascade.sh — still modelled only 5 numbered
  slots. Two of its 62 tests were RED against this PR's own diff before this fix
  (confirmed via CI's already-running "antidotes" required check, job "Codex seat
  corpus", independent of harness-floor): the full-chain-to-legacy test never
  exercised a slot-6 attempt, and the compat-wrapper test popped
  `CLAUDE_CODE_OAUTH_TOKEN_5` (no longer the gating variable) and asserted the
  now-superseded `claude-token-5-team-wrapper` label. Fixed by adding a `token6`
  fixture entry end-to-end and updating both tests' expectations — a Gear-3 Evidence
  Pack claiming "tests: green" is only truthful if the tests this diff's own file
  is covered by are actually green, so this was verified, not assumed.
constraints:
  - "Slot 6 stays LAST in every enumeration this PR touches — never promoted ahead of
    a MAX seat. Same invariant as PR #4640 (seat6-consumers), extended here to the
    cascade wrapper and the WR3 dispatcher."
  - "zsh syntax must stay clean on claude-cascade.sh (it IS a zsh script, run via
    /bin/zsh — the test corpus skips on machines without zsh rather than silently
    claiming coverage it cannot exercise)."
  - "The compatibility Team wrapper (~/.local/bin/claude-zero-team) is a
    fallback-of-last-resort ONLY when no explicit token_6 is set — it must never be
    tried ahead of the explicit numbered chain."
  - "The test-fixture fix (token6 end-to-end) must not change behaviour for any of
    the other 60 pre-existing tests in test_claude_cascade_shell.py — verified by
    running the full file, not just the 2 tests that were red."
