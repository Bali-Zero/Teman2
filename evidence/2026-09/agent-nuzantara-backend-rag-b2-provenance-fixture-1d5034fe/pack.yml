pack_lint:
  how_ci_actually_runs_it: >-
    harness-floor.yml's pack-validation step is guarded by
    `if: steps.gearcheck.outputs.gear == '3'`. This pack declares gear 2 (the
    deterministic floor, source=size), so that step DOES NOT RUN for this PR
    and none of the findings below are a required-check failure. The only
    Gear-2 CI obligation is the step that READS a posted harness/fable-gate
    verdict; it does not validate pack content. Stated so the gate is not told
    a lint is green when it simply never ran.
