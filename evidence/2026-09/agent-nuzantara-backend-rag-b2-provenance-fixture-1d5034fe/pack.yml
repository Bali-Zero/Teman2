ledger_row_is_deliberately_NOT_in_this_pr:
  ruling_it_serves: >-
    RULING I31 requires C1's discharge to be RECORDED in a ledger row, and the
    imperator's B2-ack 20260912T123956Z-44f0 adds the manifest's old->new sha
    with this PR's number. Both are owed and neither is dropped.
  why_separate: >-
    MEASURED, not preferred: .claude/skills/modus/PENDING-ARMS.md carries
    `merge=union`, which GIT honours and GITHUB'S MERGE MACHINERY DOES NOT, so
    a branch that appends to it conflicts permanently once main appends too —
    re-probing never clears it, hand-resolving silently deletes the other
    lane's row, and rebasing duplicates one's own. Three open PRs are stuck in
    exactly that state right now (#6080, #6269, #6321; the fleet watcher's
    20260912T135130Z-5644 states the mechanism). This branch is 11 commits
    behind main already, so adding the row here would very likely hand a pure
    data PR the one conflict class that cannot be cured from inside it.
  what_happens_instead: >-
    A ledger-only PR, cut from FRESH origin/main immediately after this one is
    opened, carrying the row with this PR's number and head: C1 discharged
    (the V1 xfail is a pass, not waived), C2's real ISO instants, F3's 29-vs-29
    correction, and the manifest transition
    9d7ea833b5... -> 240842d97a... It verifies `git diff origin/main -- <file>`
    is +N/-0 before opening, per the watcher's own instruction.
