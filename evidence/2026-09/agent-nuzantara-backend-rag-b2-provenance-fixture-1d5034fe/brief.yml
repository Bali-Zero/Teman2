  two cross-language false abstentions of the same disease in the supplement.
  It is the ONLY PR allowed to touch the frozen mandatory manifest and it
  re-pins the manifest's sha256 everywhere the old value is quoted. It also
  discharges the four conditions and the five findings the #6304 gate
  returned (C1/C2/C4, the mid-band parity fixture, the crossing-test fake's
  default, the 29-vs-29 correction, the council review files, and
  g1_characterize.py's two absolute Pro paths). NO ENGINE FILE IS EDITED —
  if a band, a threshold or an assertion moves, the PR is wrong.
