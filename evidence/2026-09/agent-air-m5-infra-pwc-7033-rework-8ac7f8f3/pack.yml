    6 files changed, 306 insertions(+), 34 deletions(-) measured by `git diff --shortstat $(git merge-base origin/main HEAD)..HEAD`. No
    production line changes: a spec, one workflow path entry, the corpus, and this evidence.
  behaviour_change: >-
    None in production. CI's antidotes job runs the cron-wrapper corpus on a PR touching
    scripts/tg_notify.py, and the corpus reads no TG_* from the environment it is run in.
