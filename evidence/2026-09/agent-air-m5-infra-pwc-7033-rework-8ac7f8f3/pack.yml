brief_ref: evidence/brief.yml
plan_ref: >-
  PWC-7033 in .claude/skills/modus/PENDING-ARMS.md (landed in #7034). Successor of #7039, which the on-disk
  gate signed REWORK-BUILD on C1 alone; #7039 was frozen by its arming, so this branch starts from
  origin/main, carries C2 unchanged and rebuilds C1 on the population the gate measured.
lanes:
  - lane: pwc-7033-rework
    role: build
    seat: >-
      claude-opus-5 (conducting session — verified the gate's finding before acting on it, re-measured every
      §2 row on Pro, rewrote the spec, carried C2)
  - lane: pwc-7033-rework-review-sol
    role: review
    seat: >-
      codex-gpt-5.6-sol (read-only sandbox, told to attack; two rounds — #7039's first commit, then this
      branch's spec rewrite; four findings accepted and fixed)
  - lane: pwc-7033-rework-review-k3
    role: review
    seat: >-
      kimi-code/k3 (told to attack; two rounds, the second with read-only ssh to Pro, where it re-derived
      every §2 row itself; four findings accepted and fixed)
  - lane: gate-7039
    role: ground_truth
    seat: >-
      claude-opus-5 (fresh on-disk gate session on #7039, outside the contribution chain; its REWORK-BUILD
      finding is the defect this branch corrects)
pii_scan: clean
seat_diversity: satisfied
seat_diversity_note: >-
  Two non-Anthropic review families, neither of which wrote a line. Round 2 split usefully: kimi, with
  Pro in reach, confirmed 52 row by row; codex, without Pro, attacked the METHOD and showed the cited
  pipeline could not by itself prove a count of entries — the per-line check now in the spec answers it.
