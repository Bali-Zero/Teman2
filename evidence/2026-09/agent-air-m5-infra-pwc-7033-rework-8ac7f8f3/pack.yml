dissent:
  - seat: gate-7039, claude-opus-5 on-disk gate (REWORK-BUILD on #7039 — accepted)
    objection: >-
      "cron-state's 28 entries also reach the ~/scripts fork; 24 is measured on cron-runner alone and
      attributed to every producer that reaches the fork."
    status: CONFIRMED
    resolution: >-
      "Verified by the session before acting: the crontab's invoked paths, the file symlink, the fork's zero
      ACT_ROUTING_ENABLED, and the real cron-state.sh run through a link. §2, every count and the cure's
      scope are rewritten here."
  - seat: codex-gpt-5.6-sol (MEDIUM, round 2 — accepted)
    objection: >-
      "The cited pipeline counts tokens with no name boundary: a line with two wrappers counts twice, and
      wr2-cron-wrapper.sh counts as cron-wrapper.sh. It cannot by itself prove a count of entries."
    status: CONFIRMED
    resolution: "Bounded by `/`, and the spec states the per-line check: 60 lines, 60 tokens, 0 double lines."
  - seat: codex-gpt-5.6-sol (MEDIUM, round 2 — accepted)
    objection: >-
      "A1 says never resolve through the link's target — which would reject the cure S2.3 prescribes."
    status: CONFIRMED
    resolution: "A1 now starts from the invoked path and applies the resolution of the wrapper version deployed."
  - seat: kimi-code/k3 (LOW ×2, round 2 — accepted)
    objection: >-
      "'52 jobs' where the population is entries (49 distinct jobs); and the cron-wrapper row attaches the
      symlink to scripts/ instead of the directory ~/Desktop/nuzantara."
    status: CONFIRMED
    resolution: "Every such 'jobs' is 'entries', the 49 is stated with its derivation, and the row names the directory link."
  - seat: session (declared limit)
    objection: >-
      "C3, and the ledger's live C2 proof (an antidotes log from a PR touching only scripts/tg_notify.py),
      are not closed by this PR."
    status: CONFIRMED
    resolution: >-
      "The C2 log proof needs this merged first: a draft probe PR from post-merge origin/main, closed unmerged,
      quoted on the PWC-7033 row. C3 waits on a real cron-wrapper failure."
