diff:
  net_lines: >-
    measured by `git diff --numstat origin/main...HEAD` on the final commit
    of this branch — see the bound receipt below for the exact figure. This
    field is written last, after every other commit, specifically to avoid
    the fixed-point trap PR 7477's own pack fell into (evidence/** is not
    yet excluded from the size term the lint measures itself against).
  behaviour_change: >-
    Same functional change as PR 7477/#7484: apps/backend-rag/scripts/import_lkpm_q1_2026.py
    no longer runs without a local, untracked, gitignored credential file,
    and its docstring/error message state the rotation is PENDING rather
    than done. NEW in v3: the per-row log line carries a presence-only
    marker instead of the credential value. Additive otherwise: a new lint
    script, two new test files, three new CI steps. No table is created,
    altered or read differently by any runtime path.
