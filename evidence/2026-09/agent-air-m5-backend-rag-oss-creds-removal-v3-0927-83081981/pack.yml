    role: build
    seat: >-
      claude-sonnet-5 (this session — rebuilt on a clean origin/main by
      cherry-picking #7484's code/lint/doc commits, cured R3+R4 of
      gate-7484.md, added the two missing guilt+innocence test pairs, and
      authored this pack from scratch with no credential literal)
seat_diversity: not_applicable
seat_diversity_note: >-
  Single lane, single Anthropic seat, by explicit constraint: this diff's
  deleted lines ARE the leaked credentials, so no external seat may see it.
  The two fresh gates that reviewed #7477 and #7484 are this PR's second
