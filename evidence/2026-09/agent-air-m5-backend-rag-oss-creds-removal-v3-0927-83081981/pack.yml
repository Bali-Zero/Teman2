seat_override: >-
  Gear-3 council_run quorum not met: secret-bearing diff (this PR's deleted
  lines ARE the leaked credentials) — no external seat may see it. The two
  fresh gates that reviewed #7477 and #7484 are this PR's second opinion in
  its place.
pii_scan: clean
pii_scan_note: >-
  This diff's `+` lines introduce zero new PII: the credential removal
  DELETES 57 username/password pairs and REPLACES one leaked username plus
  an example password-shaped string with `[REDACTED]` in the archived
  training doc. The rewritten script's `+` lines retain the 59 PT-company
  names and numeric company_id values already present in the pre-fix file
  since 2026-04-07 (business identifiers, carried forward unchanged in
  content, not introduced by this PR). Neither this pack, brief.yml, nor
  the PR body quotes any company name, any credential value, or any value
  matching the removed set's shape — verified by the hash/substring
  receipts above, which is the discipline PR 7477's own pack failed to
  apply to its own dissent prose.
dissent:
  - seat: fresh gate (gate-7477.md, R1)
    objection: >-
      PR 7477's evidence pack (evidence/2026-09/agent-air-m5-backend-rag-oss-creds-removal-0927-0e381f65/pack.yml,
      a dissent entry describing a "near-miss") re-committed one REAL
      removed OSS password in cleartext — a 9-character value shared by 3
      rows of the merge-base table, sha1[:8] 0470deac. The pack had called
      it "an example value, not a leaked real credential" and attributed it
      to the archived doc; both claims were false — it was one of the 48
      real distinct passwords, verified independently by this PR's own
      hash-comparison receipt above.
    status: CONFIRMED
    resolution: >-
      PR 7477 closed, superseded by PR 7484, superseded in turn by this PR.
      Every rebuild since (7484, this one) was built on a FRESH origin/main
      worktree, cherry-picking only the code/lint/doc commits (never the
      tainted evidence directory), with the pack/brief authored from
      scratch and the near-miss described by hash and count only (one
      9-char token, hash 0470deac, removed) — never the value. Before
      pushing, this PR's entire staged diff was checked for exact-substring
      containment against all 105 removed username/password values
      (receipt above): 0 hits.
  - seat: catE-sovereignty-lint (CI, gate-7477.md, R2)
    objection: >-
      scripts/lint_no_inline_credential_tables.py:2,8 spelled the banned
      `assigned-value` shape (a credential-named variable given `=` and a
      value) inside its own INCIDENT docstring, while explaining what
      detect-secrets missed.
    status: CONFIRMED
    resolution: >-
      Reworded to name the shape without writing it, per lint_ban_prose.py's
      own suggested cure, in PR 7484. Carried unchanged into this PR;
      re-verified clean against that lint, and the guard's own
      guilt/innocence corpus and repo-wide scan both still pass unaffected
      (receipts above).
  - seat: fresh gate (gate-7477.md R3, recurred uncured at gate-7484.md R3)
    objection: >-
      The docstring (SECRET HANDLING paragraph) and the `SystemExit`
      message in `_load_oss_credentials()` both stated the OSS credential
      rotation had ALREADY happened ("the owner rotated them out-of-band" /
      "has been rotated by the owner"), when the brief and every mandate for
      this incident say rotation is the owner's own pending action, out of
      scope for this PR. PR 7484 did not cure this — gate-7484.md found the
      identical false claim still present at its head, unchanged from
      gate-7477.md's original finding — CONFIRMED twice, both #7477 and
      #7484 shipped it.
    status: CONFIRMED
    resolution: >-
      Both occurrences rewritten in this PR to "must be rotated by the
      owner (pending); exposure window 2026-04-07 -> this removal".
      Verified: the old phrase now has 0 occurrences, the new phrase has 2
      (receipt above), and the new loader test asserts the exact message
      content directly rather than relying on a grep alone.
  - seat: fresh gate (gate-7477.md R4, recurred uncured at gate-7484.md R4)
    objection: >-
      `_process_rows()`'s per-row log line built `OSS={oss_user[:20]}...`
      for every row with credentials — with 49 of 57 real usernames <=20
      characters, most printed whole. gate-7484.md measured this
      empirically with a synthetic 59-pair map fed through an asyncpg-stub
      `_process_rows()` run: 59/59 synthetic usernames landed intact in the
      log. PR 7484 rewrote `_process_rows()`'s signature and call sites but
      left this exact line untouched, and neither #7477's nor #7484's test
      suite ever exercised it (both only tested the unrelated
      inline-credential-table guard) — CONFIRMED twice, both #7477 and
      #7484 shipped it.
    status: CONFIRMED
    resolution: >-
      Line rewritten to a presence-only `OSS=set` marker. A new guilt test
      reproduces the gate's own method (asyncpg stub, fake conn, synthetic
      59-row map) and was itself verified against a regression: run against
      the pre-cure line it correctly fails (59/59 leaked); run against the
      cure it passes (0/59). An innocence test confirms the marker still
      fires once per credentialed row either way (receipts above).
  - seat: session (self-review, this build)
    objection: >-
      This brief's own predecessors (the #7477 and #7484 briefs) carried
      three inaccuracies that a fresh gate flagged as non-blocking but
      real: `appetite.budget` said "unarmed" while the PR was actually
      armed at open both times; the mission text claimed cherry-picking
      "the code/gitignore/lint/doc commits" when neither predecessor PR
      touched `.gitignore` at all (the `*credentials*.json` rule at line
      177 predates this incident); and the "no plausible-looking synthetic
      look-alike" constraint contradicted the guard's own guilt fixture
      (6 well-known public passwords, deliberately look-alike by design).
    status: CONFIRMED
    resolution: >-
      All three corrected directly in this PR's brief.yml rather than
      repeated: budget states the PR is armed at open and why; the
      cherry-pick sentence no longer names `.gitignore` (receipt above
      confirms the file is untouched); the look-alike constraint is
      reworded to distinguish "value from the removed set" (banned
      absolutely) from "value matching the removed set's shape" (banned
      outside disclosed, provenance-stated test fixtures).
  - seat: session (self-review, mid-task on PR 7477's build)
    objection: >-
      Two structural verification commands while grounding PR 7477 printed
      content that diff's own constraints forbade: a redaction-preview
      regex that only handled double-quoted strings let 5 already-public
      company names print in cleartext (the real table used single-quoted
      output); reading the script's docstring for context printed 7 more
      already-public company names.
    status: CONFIRMED
    resolution: >-
      Flagged inline in the same turn on PR 7477, not repeated since. Not
      correctable after the fact (values already in that session's
      transcript) — carried here as a disclosed limitation of the original
      build, not reproduced in this pack or in PR 7484's.
