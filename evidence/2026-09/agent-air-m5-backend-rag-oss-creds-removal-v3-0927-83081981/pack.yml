brief_ref: evidence/brief.yml
plan_ref: >-
  Dispatched by the team-lead session (session-internal task, no tracked
  mandate doc), v3 of the incident fix after a fresh gate on PR 7484
  (gate-7484.md) found two of PR 7477's four original blockers (gate-7477.md)
  still uncured at #7484's head: the rotation-status text (R3) and the
  per-row log line (R4). #7484 itself superseded #7477 after a fresh gate
  found #7477's own evidence pack had re-committed one real removed OSS
  password in cleartext (R1).
lanes:
