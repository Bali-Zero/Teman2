      The five filiera relation probes are green on THIS tree, not on the tree they were last run
      against — the coverage ratchet, the body-default artifact, the slice-disclosure artifact,
      the foreign-cap strict pass and the editorial-record conformance.
    status: verified
    probe: "kbli_coverage_scoreboard.py --check; perpres_body_default_relation.py --check-artifact; perpres_slice_disclosure_relation.py --check-artifact; perpres_foreign_cap_relation.py --strict; editorial_record_conformance.py — all exit 0"
  - text: >-
      The 547 errors and 26 of the 28 failures in the full backend suite on this machine are
      environmental, not caused by this diff: 547 + 25 are `OSError [Errno 61] Connect call failed
      ('::1', 5432)` — no local Postgres — and one is a google-genai version drift. The remaining
      two were this diff's own stale census pins and are now green.
    status: verified
    probe: "bucket every FAILED/ERROR line of the backend log by its cause string; then re-run the two named files -> 32 passed"
  - text: >-
      UU 21/2013 Keantariksaan is UNREAD for 30303, exactly as the sector statutes of divisions
      09 35 49 50 51 52 53 61 are unread for the 67 codes the `unswept_sector_statute` leg
      withholds. 30303 ships anyway because withholding one code on a statute nobody read would be
