pii_scan: clean
pii_scan_note: >-
  Nothing in this diff, brief or pack transcribes client data. The canonical is a public
  classification catalogue: KBLI codes, Indonesian activity titles, ownership caps and the annex
  rows that set them. The receipts quote counts, exit codes, code numbers and instrument citations
  only. No client_id, no OSINT, no credential — and no environment variable value is printed
  anywhere in this lot's scripts.
dissent:
  - seat: on-disk gate session on PR #6783 (fresh, outside the contribution chain)
    objection: >-
      HIGH — 30303 "Industri Wahana Antariksa dan Mesin Terkait" descends from KBLI-2020 30300,
      which Lampiran III entry #7 caps at 49%, and the lot ships it at 100% on the strength of the
      instrument not naming the 2025 number. If the instrument reaches the ancestor, absence at
      the descendant is not evidence of openness.
    status: RETRACTED
    resolution: >-
      Re-read and answered in the NEGATIVE, which is why it is RETRACTED rather than fixed. The
      licence is not absence: it is an explicit hand adjudication already in the tree,
      `perpres_slice_disclosure_relation.ADJACENT_NOT_CONTAINED["30303"]` = "spacecraft; the annex
      restricts military aircraft", against entry #7's own text "Industri pesawat terbang militer"
      — the same reading that licenses 51103 (space transport is not air transport) and
      60103/60203 (on-demand streaming is not penyiaran). The class the question was found inside
      is now declared and measured: 135 shipped codes have an instrument-reached 4-digit sibling,
      3 of those siblings carry a CAP, and 0 are true positives. A test now couples the lot to the
      adjudication, so deleting or rewording it goes red here before the lot silently rests on
      nothing.
  - seat: session (self-refutation mid-build)
    objection: >-
      The build lane excluded 30303 by hand on a mechanism it had NOT measured — "the crosswalk
      handed the Lampiran III entry #7 cap to 30301/30302 and dropped it at 30303" — and committed
      that exclusion before verifying it. The mechanism is false: all three siblings share the
      same 2020 ancestor 30300 with identical `bps_2020_ancestors` (same locator, same parser
      digest). Re-measuring the other two cap-linked siblings with real ancestry instead of a
      4-digit prefix showed 10762's ancestor is 10763 and 30112's is itself — so the class is
      0-for-3, not 1-of-3, and the "fix" was a fabricated cause dressed as caution.
    status: CONFIRMED
    resolution: >-
      Stated to the owner plainly, the two commits reset (unpushed), 30303 put back in the lot,
      and the finding converted into a pinned NEGATIVE result plus a test — the spec's
      `deferred.instrument_reached_sibling` now carries the measurement and the citation, and
      `test_the_sibling_class_is_declared_and_measured_empty` asserts the three ancestries by
      value. The scar is #6 (anti-hallucination blindness): a plausible mechanism was built on
      before a single `ls`/`cat` was run against it.
  - seat: session (declared limit, unresolved)
    objection: >-
      UU 21/2013 Keantariksaan is unread, and it is the statute that would actually settle 30303's
      ownership regime. The lot ships the code anyway.
    status: PLAUSIBLE
    resolution: >-
      Left standing and labelled rather than quietly cured. The boundary this lot declares for the
      `unswept_sector_statute` leg is divisions 09 35 49 50 51 52 53 61, and 30 is not in it;
      withholding one code alone on a statute nobody read would be an unprincipled exception to a
      boundary the spec states in writing. Named in the spec, left to its own lane.
  - seat: session (declared limit)
    objection: >-
      The claim that the backend suite's 547 errors are environmental rests on bucketing their
      cause strings, NOT on a clean-`origin/main` baseline run. A baseline was requested and never
      reported back.
    status: PLAUSIBLE
    resolution: >-
      Left standing and labelled. The bucketing is strong — 547 of 547 errors carry the identical
      "Connect call failed ('::1', 5432)" string and no local Postgres is running — but it is an
      inference from the message, not a differential measurement, and it is recorded as such
      rather than upgraded. It does not touch this diff: the only two failures this PR owned were
      named, fixed and re-run green.
