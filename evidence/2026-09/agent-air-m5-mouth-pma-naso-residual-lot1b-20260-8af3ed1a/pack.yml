seat_diversity: not_applicable
seat_diversity_note: >-
  One build lane, so rule 8's seat-diversity floor does not bind; declared rather than left to
  read as satisfied. The substantive reason it would add nothing here: every load-bearing question
  in this lot is settled by a probe against the Perpres artifacts in-tree or by a linter's exit
  code, not by an opinion. The one question that WAS a judgement — does Lampiran III entry #7's
  cap on military aircraft reach spacecraft — is already adjudicated by hand in the tree and is
  now coupled to the lot by a test; a second seat's paraphrase of the same annex row is not a
  second measurement.
seat_override: >-
  TWO rules read this field, so it answers both.
  (1) R8 asks for a {role: ground_truth, seat, nb, query_hash} lane because this diff touches the
  KBLI dataset. There is no retrieval lane to declare, and inventing an `nb`/`query_hash` to
  satisfy the shape would be exactly the defect the rule exists to catch. The ground truth here is
  PRIMARY and IN-TREE: Perpres 10/2021's own annex artifacts and the BPS 2020->2025 crosswalk, read
  by `perpres_body_default_relation.py` and `perpres_slice_disclosure_relation.py`, whose
  `--check-artifact` probes are receipts in this pack. A retrieval seat would insert a paraphrase
  between the instrument and the claim, not a check.
  (2) The council_run rule asks for a journal with >=2 non-Anthropic review seats marked ok:true.
  Every seat on that list is unreachable from this machine — this session's injected arsenal probe
  (6h old, not re-run here) reports codex-spark MODEL_ERR, kimi TIMEOUT, agy TIMEOUT, ollama
  NOT_INSTALLED and all six tp1-* seats CRED_UNAVAILABLE — so the honest options are to declare the
  absence or to write a
  journal for reviews that never happened. This declares the absence. What stands in its place is
  NOT nothing and is named so the gate can weigh it: an earlier round of this same work WAS graded
  by a fresh out-of-chain on-disk gate, which BLOCKED it, and that blocker is dissent[0] of this
  pack, answered on the instrument. The replacement for a missing council is the on-disk gate this
  PR requests at open — never this session's own sign-off.
