scope_closure: >-
  Two council rounds each found NEW surfaces after the previous ones were closed, which is the
  contract's fix-of-a-fix signal that the surface was unspecified. The scope is therefore written
  down in the test module docstring and closed with a final fold (eb56f26a34), with no third round.
  The fold covers: triggers exactly pull_request/merge_group/push; a bare merge_group;
  permissions == contents: read; uses@ref and with-keys pinned; no GITHUB_/RUNNER_ env keys;
  case-insensitive ==; secrets rendered both empty and present; GITHUB_EVENT_PATH.
  Declared NOT covered: the behaviour of steps that name no repo tool (#40's budget block between
  its markers is exercised verbatim by test_cate_paid_budget.sh; text before the marker is not);
  tool arguments and semantics; action refs beyond the pin. A change that makes the context always
  red fails on the PR that introduces it, so the classes this file judges are false green and
  unreported.

