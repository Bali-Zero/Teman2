  convenient: one real behaviour hole, one dangling reference, one comment that named the wrong
  tests, and one brief whose own claim the gate had measured as false.

the_finding: >-
  C1 was a real hole and not a style note. The coexistence net — the probe that decides whether a
  clause is UNDECIDABLE rather than clear — was built from the same COUNTED_NOUN as the entity that
  CONVICTS. One set used twice is not a set guarded by a wider one: any noun form the entity did
  not recognise could not reach `undecidable` either, so it fell through to `clear`. Measured, four
  ordinary Indonesian forms are real quoted totals and all four were clear, which is a MISSED
  TOTAL, the direction that inflates the benchmark score: `kode2` and `kbli2` (standard shorthand
  for the reduplicated plural), `kodepun` (the -pun clitic written joined), and `kodenyalah`
  (stacked -nya + -lah). The cure gives the net its own, deliberately wider noun —
  `\b(?:kbli|kode|codes?)\w*` — and records the asymmetry in the spec as a rule: what CONVICTS
  stays closed and is a spec change to widen; what DEFERS stays open, because an unrecognised form
  belongs to the judge and never to silence.

