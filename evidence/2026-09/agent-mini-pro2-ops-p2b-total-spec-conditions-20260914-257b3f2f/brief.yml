open_findings_for_the_gate: >-
  (1) The asymmetry is now doctrine, and doctrine has a cost: the net will hand the judge clauses
  that are not totals at all, because `\w*` accepts any tail. `kodenya`, `kodepun` and `kodex`
  are indistinguishable to it. This is deliberate — a judge read is the cheap failure and a missed
  total is the expensive one — but it is a real widening of the judge's bill and the gate should
  weigh it rather than assume it was free. The left boundary still binds both sides, so `barcodes`
  and `mengkode` reach neither outcome.
  (2) C3 is discharged in the only sense this branch can discharge it, and the gate should know the
  limit. The new test bites the SUITE — a criterion added to the deferral list fails it, measured —
  but the suite is not wired to CI at all, so nothing bites a merge. Read strictly, C3 asked for a
  test that bites and what exists is a test that would bite if anything ran it. The cure is written,
  lint-clean and measured at floor 3 by path; it ships as its own PR, because a workflow file is a
  hot-zone concern at a council-quorum class and not a rider on this one. If the gate prefers to
  mark C3 UNDISCHARGED until that lands, that reading is defensible and this brief does not argue
  against it.
  (3) The predecessor's unmet council quorum is still uncured and still on main. This PR does not
  claim to close it, and no ledger row closes it either.
  (4) The author of this diff must NOT sign it. A fresh session outside the contribution chain
  signs, per the generator-is-never-grader rule.

lesson:
  what: >-
    The gate found a hole that seven adversarial council rounds, a spec, and its own author had all
    walked past: the guard and the thing that excuses the guard were reading the same set.
  why_it_matters: >-
    Deriving the safety net from the entity it is supposed to catch means the net inherits every
    blind spot the entity has, and inherits it invisibly — the tests still pass, because the
    fixtures were written from the same understanding as the code. A net must be wider than what it
    catches, and "wider" has to be written down as a rule, or the next edit will quietly re-narrow
    it. Criterion 7 exists so that re-narrowing is a red test and not a judgement call.
