lesson:
  what: >-
    Every existing test in llms-article-exports.test.ts drives the generator against a temp
    fixture, so all of them were green while the file that actually ships said something false for
    weeks. The artifact was never asserted against.
  why_it_matters: >-
    A generator test proves what the generator would write. It cannot notice that nobody ran it.
    The committed output needed its own assertion, and that is the test this PR adds — the same
    shape as the chunk guard added earlier in this mandate, which checks the built artifact rather
    than the import graph that produces it.
