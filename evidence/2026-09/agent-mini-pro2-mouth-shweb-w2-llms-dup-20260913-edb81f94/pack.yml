pii_scan_note: No personal data. Article titles, public URLs and dates that are already published.

the_cause:
  what_was_reported: >-
    Two articles listed twice — PP 20/2026 (2026-07-25) and CoreTax (2026-07-22) — with the
    generator suspected of emitting an article once as "published" and once as "updated".
  what_was_measured: >-
    Different, and it matters for the cure. Measured on Mini-Pro2 against origin/main 3c1f85c46e:
    the block held 5 lines and 3 distinct URLs. Running the CURRENT generator unchanged removes
    the duplication on its own and rewrites the block with 5 genuinely newer articles (all
    2026-09-11, 5 distinct URLs). So the committed file was STALE — produced by an older generator
    and never regenerated — not the output of a generator that duplicates today. There is no
    "published + updated" pair in the source: each of the two slugs has exactly one canonical
    `.mdx` plus `.it`/`.id` translations, and only the `.mdx` is `isCanonical`.
  the_live_risk_that_remains: >-
    `isCanonical` drops translations; it does NOT give one entry per URL. Measured: THIRTEEN
    content folders collapse to SIX public segments — `tax/` and `tax-legal/` both publish under
    `/taxes/`, as do three folders under `/living/` and three under `/business/`. Two canonical
    files sharing a slug across two collapsing folders emit the SAME url twice, both canonical,
    both kept. That is reachable today, and it is the most plausible way the stale file got its
    duplicates in the first place. So the de-duplication is a rule worth having even though it
    changes no output on today's tree.

scope:
  - apps/mouth/public/llms.txt # regenerated: the two duplicate lines are gone
  - apps/mouth/scripts/generate-llms-full.ts # the freshness block de-duplicates by URL, most recent date wins
  - apps/mouth/src/lib/llms-article-exports.test.ts # two tests: the committed artifact, and the rule

constraints:
  - >-
    ONE concern. `llms-full.txt` and `llms-id.txt` are regenerated by the same script and their
    churn is enormous (+135,251/-130,504 and +31,873/-29,066 measured on Mini-Pro2). They are
    RESTORED and absent from this diff: whether they are also stale is a separate question and a
    separate PR.
  - NO reconciliation with the fact-registry. Declared residual, untouched, per instruction.
  - No other path is touched; package.json and package-lock.json unchanged.

acceptance:
