objective: >-
  apps/mouth/public/llms.txt — the file crawlers read — listed two articles TWICE in its
  "Recently Published & Updated (Freshness Signal)" block. Remove the duplication, and make a
  repeat of it fail a test instead of shipping.

brief_ref: evidence/brief.yml
