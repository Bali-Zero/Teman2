council_run: journal.jsonl

dissent:
  - seat: gemini-3.1-pro
    objection: >-
      HIGH — `Map.set` on an existing key updates the value in place and does NOT move it, so a
      de-duplication that keeps a LATER-arriving entry leaves it at the earlier position and
      `slice(0, 5)` can drop the newest article in the file. And if the array IS sorted descending,
      the date comparison never fires and is dead code. The fixture missed it because it had a
      single distinct URL.
    status: CONFIRMED
    disposition: >-
      Both halves right. Measured: `enArticles.sort(byFreshnessThenUrl)` runs eighty lines earlier,
      so the first sighting of a URL is already its freshest entry and my `>` comparison could never
      fire — it read like the guarantee while the sort provided it. Changed to first-wins with the
      dependency written down.
      The seat's proposed cure — sort again after de-duplication — was implemented, PROBED, and then
      REMOVED. The probe is the reason: with first-wins over a sorted array the case cannot arise,
      and deleting the re-sort left every test green. It was code no test could redden, which is the
      shape this lane has spent a week removing. What survives is the coupling stated in a comment,
      plus a fixture that now carries a third, newer article and asserts the block is ordered by
      date — and that assertion DOES bite: deleting the upstream sort turns it red.
  - seat: gemini-3.1-pro
    objection: >-
      HIGH — `execFileSync(require.resolve("tsx/cli"), ...)` runs the resolved .mjs as the
      executable; on a clean checkout it has no exec bit and fails EACCES (ENOEXEC on Windows).
    status: CONFIRMED
    disposition: >-
      Taken. The new test uses `process.execPath` with the resolved file as an argument — the form
      the first test in this same file already uses. Worth stating plainly: two OTHER call sites in
      this file (lines 210 and 280, pre-existing) still take the risk. They are not touched here,
      because this PR is one concern and they are not it; the finding is recorded so it is not
      rediscovered as new.

