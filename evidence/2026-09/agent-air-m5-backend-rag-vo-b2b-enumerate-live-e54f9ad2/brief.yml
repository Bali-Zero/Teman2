objective: >-
  Cure of gate REWORK-BUILD on #6861 (GATE-B2-REPORT-6861.md) for the B2' live runner: an
  immediate stop on HTTP 401/403 (one request spent, OBS-2), a stop after N consecutive
  harness reds of any other kind with an engine verdict resetting the counter (OBS-2), an
  exclusive one-runner-per-report lock with a per-process atomic write (OBS-7), a harness red
  re-attemptable on resume instead of terminal (OBS-3), and requests_used_total tracked across
  resumes on top of the existing per-run count (OBS-8).

acceptance:
  - "WHEN --max-requests is omitted THEN exit 2, no network call. probe: test_missing_max_requests_refuses_without_network_call"
  - "WHEN --rate-per-minute >= the router's 30/min bucket THEN validate_budget raises. probe: test_rate_per_minute_at_ceiling_refuses"
  - "WHEN --max-consecutive-harness-reds < 1 THEN validate_budget raises. probe: test_max_consecutive_harness_reds_must_be_at_least_one"
  - "WHEN --max-consecutive-harness-reds > --max-requests THEN validate_budget raises. probe: test_max_consecutive_harness_reds_cannot_exceed_max_requests"
  - "WHEN --dry-run THEN the plan prints (incl. health probes outside budget), no network call. probe: test_dry_run_validates_and_prints_plan_without_network_call"
  - "WHEN evaluate returns 200+decision THEN report records engine_verdict, no request facts. probe: test_successful_walk_is_recorded_as_engine_verdict"
  - "WHEN evaluate returns 401 THEN the run stops after exactly ONE request, names the token FILE never the value. probe: test_401_circuit_breaker_stops_after_exactly_one_request"
  - "WHEN evaluate returns 403 THEN the same one-request breaker fires. probe: test_403_circuit_breaker_also_stops_after_one_request"
  - "WHEN N consecutive non-auth harness reds occur THEN the run stops at exactly N. probe: test_consecutive_harness_reds_trip_the_breaker"
  - "WHEN an engine verdict lands between harness reds THEN the consecutive-red counter resets. probe: test_engine_verdict_resets_the_consecutive_counter"
  - "WHEN 429 exhausts retries THEN it is a harness_red, never engine_verdict, and stops the run on its own rule. probe: test_429_is_a_harness_red_never_an_engine_verdict_and_stops_the_run"
  - "WHEN a connection error occurs below the retry budget THEN backoff then engine_verdict once recovered. probe: test_connection_error_retries_with_backoff_then_succeeds"
  - "WHEN a walk's latest result is a harness red THEN resume RE-ATTEMPTS it and keeps both attempts in history. probe: test_harness_red_is_reattempted_on_resume_and_history_is_kept"
  - "WHEN an existing report's manifest_sha256 mismatches THEN refuse before any network call. probe: test_manifest_report_hash_mismatch_refuses_to_resume"
  - "WHEN a second runner starts against a live-locked report THEN exit non-zero, one line, no traceback, lock/report untouched. probe: test_second_runner_on_a_live_locked_report_refuses_with_one_line_never_a_traceback"
  - "WHEN a lock names a dead pid THEN refuse unless --break-stale-lock. probe: test_stale_lock_is_refused_without_break_stale_flag"
  - "WHEN --break-stale-lock is passed against a dead-pid lock THEN it is removed and the run proceeds. probe: test_break_stale_lock_removes_it_and_proceeds"
  - "WHEN a run completes THEN its lock releases so a later sequential run can proceed. probe: test_lock_is_released_after_a_run_so_a_second_run_can_proceed"
  - "WHEN --max-requests is exhausted mid-run THEN remaining walks stay unrecorded, stopped_reason names it. probe: test_max_requests_exhausted_leaves_remaining_walks_unrecorded"
  - "WHEN a report is resumed across two runs THEN requests_used_total accumulates while requests_used_this_run is per-run. probe: test_requests_used_total_accumulates_across_resumes_while_this_run_is_per_run"
  - "WHERE the two /health probes are made THEN they are declared outside --max-requests in both the header and never counted in requests_used_this_run. probe: test_health_probes_declared_outside_budget_everywhere"
  - "WHERE the driver token file is read THEN the token never appears in the report or the log. probe: test_driver_token_never_appears_in_report_or_log"
  - "WHEN both an engine verdict and a harness red are recorded THEN the summary keeps two separate tallies, never summed. probe: test_summary_never_adds_engine_verdicts_and_harness_reds_together"

pii_scan: clean
