task_id: oracle-evaluator-purpose-feasibility
gear: 2
l_level: L1
gate_class: opus
objective: >-
  evaluate_product returned BLOCKED_UNKNOWN from an input-tagged hard-filter/review unknown
  BEFORE it ever asked whether the product could cover the applicant's declared purposes.
  evaluate then picks the globally-asked question with min(blocked, key=len(missing_facts)),
  so the cheapest blocked proof wins -- and nine products carry ZERO SUPPORT rules
  (E23U, E23V, E28B, E28C, E28D, E28F, E33A, E33B, E33C), which makes their one-fact proof
  the cheapest one in the pack for everybody. Hoist the purpose-feasibility test above that
  block and delete the now-duplicated copy below it.

  Measured offline through verify -> compile -> evaluate -> apply_public_policy_adapters,
  replaying the 43 real interview walks against the HIGHEST SIGNED PACK ON DISK, which is now
  rulepack-prod-020.signed.json (#5867, ACTIVE in production under ENFORCE): NEEDS_INPUT
  21 -> 11, NO_SUPPORTED_PATH 0 -> 10, SUPPORTED_CANDIDATES 22 -> 22 with the candidate lists
  BYTE-IDENTICAL. The ten cured walks were blocked on process.wants_onshore_conversion (7),
  investment.{investment,paid_up}_capital_idr (2) and sponsor.type (1), every one of them on
  behalf of a product that cannot cover the walk's declared purposes under any fact
  resolution; the eleven that remain are the nine family.sponsor_confirmed walks (C2 is a
  product these applicants really are shopping for -- supplying the fact answers all nine) and
  the two diaspora walks, both PR-3's mandate. The 20 canonical gold personas show ZERO
  DecisionState and ZERO candidate changes; one field moves, persona #13's missing_facts, from
  a zero-support product's sponsor.type to the fact #13's own fixture declares as
  expected_missing.

  Spec: research/visa/2026-09-06-visa-oracle-decisiveness-investigation.md section 4 PR-2,
  cure (a), owner-ruled 2026-09-06.

  Gear 2 by SIZE, deterministically: --print-floor returns 2 and --print-floor-source returns
  "size" on this changed-file list with the numstat supplied (8 files; the line counts are not
  restated here because this brief is itself one of the eight). No hot-zone
  path is touched. The evaluator change itself is small; the size comes from the
  guilt-and-innocence battery and the re-pinned census table, which is the point -- cure (a)
  was chosen over the two alternatives precisely because "it cannot fail open" is checkable,
  and the checks are what make it so.

  GATE FOLLOW-UPS, round 2 (2026-09-06). Four items, all inside this same concern:
  (1) no_path_reasons is scoped to PURPOSE-FEASIBLE products. The reorder made 23 of the 43
  walks render that list for the first time, and it aggregated the exclusion reason of every
  EXCLUDED product -- including products no ELIGIBILITY rule in the pack can ever make cover
  the declared purposes, so a tourist read "your sponsor is not a government body" on behalf
  of E33A. ProductProof gains a structural, fact-independent purpose_feasible computed above
  every early return; evaluate_with_trace filters `excluded` by it. State is untouched: the
  filtered list feeds nothing but the reason text, and Decision's non-empty invariant is still
  met by _fallback_no_path_reason.
  (2) The census's three vacuous guilt assertions are scoped. Grading one mutated walk against
  the whole 36-row allowlist made the helper's trailing "absent from the corpus" loop fire
  unconditionally, so those asserts passed whatever the mutation did.
  (3) The precedence module's skipif no longer disables the hand-built-pack tests, which need
  no pack on disk at all.
  (4) The census is re-pinned to what this reorder measures.

  SEQ-20 REBASE, round 3 (2026-09-07). origin/main moved while this PR sat in draft: #5854
  folded seq-20, #5867 landed the SIGNED seq-20 bundle, and seq-20 is now ACTIVE in production.
  test_interview_walk_census.py reads "the highest signed pack", so its pin was measured against
  a pack the tests no longer read. origin/main is MERGED IN (a merge commit, not a rebase) and
  every number this PR pins is RE-MEASURED against seq-20 with this evaluator change applied.
  The main side of the census conflict was taken as authoritative and then re-derived; this
  branch's two structural contributions to that file -- the _scoped_allowlist/_scoped_expectation
  helpers that cure the PR-0 vacuity finding, and the outcome-pin half of the lost-answer guilt
  test -- are preserved. Three of the four census guilt tests are RE-ANCHORED because seq-20 plus
  this reorder cured their previous subjects: a guilt test that passes vacuously is worse than no
  test, so each now rides a walk that is still a dead end and says why it moved. Nothing is
  loosened: no count became a range, no assertion was deleted, no skip or xfail was added, and
  the allowlist shrank by DELETING cured rows rather than by widening a comparison.

  DUPLICATE NO-PATH REASON, round 4 (2026-09-07). Gate finding on the seq-20 head: a
  NO_SUPPORTED_PATH sheet rendered the same sentence twice. Six walks (the five
  offshore/retirement/* and onshore/retirement) carried no_path_reason_codes
  ['AGE_BELOW_55', 'AGE_BELOW_55'], and engine-adapter.ts maps that list 1:1 through copy keyed
  by CODE ALONE, so a real person read "you must be at least 55" twice on one sheet. In scope
  for THIS PR and not inherited: before the reorder ZERO walks reached NO_SUPPORTED_PATH, so
  the duplicate was unreachable.

  INVESTIGATED BEFORE FIXING, and the investigation changed the fix. The two entries are NOT
  redundant: entry one is hf.e33e.age-below-55 citing one source record, entry two is
  hf.e33f.age-below-55 citing TWO, one of which entry one does not carry. _dedupe_reasons keys
  on the whole (code, rule_ids, source_refs) triple and uses setdefault, so a blind collapse on
  the code would have kept the first-seen entry and SILENTLY DROPPED a citation from a surface
  where citations are load-bearing (engine-adapter.ts's requireDecisiveRefs validates every ref
  on every rendered reason). New _merge_reasons_by_code collapses on the code and UNIONS
  rule_ids and source_refs, first-seen order preserved. Applied at the no_path_reasons site
  only, NOT inside _dedupe_reasons: the two review-reason call sites feed a state this PR does
  not move (the census measures HUMAN_REVIEW_REQUIRED == 0 before and after), so changing their
  collapse semantics would be an unmeasured behaviour change in a surface with no witness here.
constraints:
  - >-
    The reorder must not be able to fail open, and that must be a measurement rather than an
    argument. The hoisted block's only possible return is UNSUPPORTED, so it can neither
    manufacture a candidate nor silence a gate; every EXCLUDED and REVIEW return -- including
    the on_unknown=HUMAN_REVIEW escalation, which is review-tagged and resolved further up --
    already ran above the block it moved past. Four precedence tests pin exactly that, each on
    a product that IS purpose-infeasible so the hoisted return is reachable and only precedence
    keeps it from winning.
  - >-
    on_unknown=NEEDS_INPUT must not degrade into a no-op. Wherever the product COULD cover the
    declared purposes the unknown gate still asks -- including the case where the product's own
    SUPPORT rule is itself UNKNOWN, because naive_potential_coverage is the OPTIMISTIC union and
    a merely-unproven coverage is not an impossible one.
  - >-
    No fact may be invented to remove a blocker. Section 6 R2 refutes a KNOWN sentinel for
    intent.requested_product_code (it manufactures BRIDGING support through four neq-guarded
    SUPPORT rules) and R4 refutes defaulting sponsor.type to NONE. This PR removes both blockers
    without touching either fact, and touches no signed pack content at all.
  - >-
    Guilt AND innocence, both directions (superscar #3). Seven of the new tests fail on the
    unpatched evaluator; ten pass on both. The two seq-9 witnesses whose incidental proof SHAPE
    moved are REVISED, never deleted: each keeps its own stated safety assertion (is not
    EXCLUDED / is not REVIEW) as its first line and gains a "no reason code may be manufactured
    from an UNKNOWN" assertion.
  - >-
    The gold baseline moves 5/20 -> 6/20 and the justification in the diff is a NAMED PERSONA
    with its own fixture quoted, never the new number (generator is never grader). The floor that
    says seq-19 must not regress against seq-18 -- test_match_set_and_count_are_unchanged_end_to_end
    -- is untouched and green.
  - >-
    Two files read a pack, and they must read DIFFERENT ones, deliberately.
    test_evaluator_purpose_feasibility_precedence.py pins rulepack-prod-019 EXPLICITLY, because it
    is a witness on the evaluator's ORDERING and not on any pack's content: seq-20 legitimately
    changes what those personas are eligible for (it raises the visit-visa stay-day caps), so
    following the active pack would let a fold silently rewrite what this file proves.
    test_interview_walk_census.py is the opposite kind of file -- it measures what the LIVE funnel
    answers -- so it reads "the highest signed pack on disk" and must be RE-DERIVED, never
    hand-edited, whenever that pack changes. Both were verified against seq-20 in this round: the
    precedence file's 21 tests run and pass with none skipped, and the census's four tables were
    regenerated from a measurement run.
acceptance:
  - >-
    WHEN a product whose only SUPPORT rule covers STUDY is evaluated for a TOURISM applicant with
    an unknown safety-critical sponsor.type gate, THEN the proof is UNSUPPORTED with
    missing_purposes={TOURISM} and missing_facts empty -- it asks nothing. probe:
    pytest backend/tests/services/visa_engine/test_evaluator_purpose_feasibility_precedence.py -k Mechanism
  - >-
    WHEN the same product is evaluated for a STUDY applicant, THEN it still returns
    BLOCKED_UNKNOWN naming sponsor.type -- on_unknown=NEEDS_INPUT still asks wherever the product
    could be recommended. probe: -k still_blocks_on_its_gate_unknown
  - >-
    WHEN the gate is TRUE, or is a review rule, or carries on_unknown=HUMAN_REVIEW, THEN the proof
    is EXCLUDED / REVIEW / REVIEW respectively even though the product is purpose-infeasible.
    probe: -k SafetyPrecedenceIsUnchanged
  - >-
    WHEN a business applicant (BUSINESS_MEETINGS, 121 days, no sponsor) is evaluated against
    seq-19 with investment capital facts unknown, THEN the decision is NO_SUPPORTED_PATH with no
    missing facts, and supplying both investment facts yields the same state -- proof the retired
    question could never have changed the answer. probe: -k SignedSeq19Witnesses
  - >-
    WHEN the 20 canonical gold personas are replayed against seq-18 and seq-19, THEN no
    DecisionState and no candidate set changes, and persona #13 is NEEDS_INPUT on
    work.serves_indonesian_clients on both packs. probe:
    pytest backend/tests/services/visa_engine/test_seq19_pack.py backend/tests/services/visa_engine/test_evaluator_gold.py
  - >-
    WHEN onshore/invest is evaluated on seq-19 after the reorder, THEN the applicant-facing
    no_path_reasons no longer carries D12_NOT_CONVERTIBLE for a TOURISM walk (D12's SUPPORT
    rules cover INVESTMENT only, so it could never have been that applicant's path), while a
    purpose-feasible exclusion such as E28A_PAID_CAPITAL_BELOW_MIN on an INVESTMENT walk is
    still reported. probe: pytest backend/tests/services/visa_engine/test_evaluator_gold.py
    backend/tests/services/visa_engine/test_evaluator_edge_cases.py
    backend/tests/services/visa_engine/test_evaluator_state_precedence.py
  - >-
    WHEN the `elif missing != allowed` branch is deleted from _dead_end_violations, THEN
    exactly test_guilt_a_cured_dead_end_that_only_moves_the_block_is_caught goes red -- the
    scoped guilt assertion is no longer satisfied by the helper's own "absent from the corpus"
    noise. Measured 2026-09-06 on a scratch copy, restored. probe:
    pytest backend/tests/services/visa_engine/test_interview_walk_census.py
  - >-
    WHEN rulepack-prod-019.source.json is renamed on disk, THEN the hand-built-pack
    precedence tests still RUN (only the seq-19 witnesses skip) -- before this PR the whole
    module skipped silently. Measured 2026-09-06 on a scratch copy, restored. probe:
    pytest backend/tests/services/visa_engine/test_evaluator_purpose_feasibility_precedence.py
  - >-
    WHEN the 43 walks are replayed against rulepack-prod-020.signed.json -- the highest signed
    pack, and the one ACTIVE in production -- THEN the census is 11 NEEDS_INPUT / 10
    NO_SUPPORTED_PATH / 22 SUPPORTED_CANDIDATES, and the 22 SUPPORTED rows are byte-identical to
    what the SAME corpus produces on the SAME pack with this PR's evaluator change reverted
    (21/0/22, the number #5867 pinned on main). Measured both ways 2026-09-07 by swapping in
    origin/main's evaluator.py on a backed-up copy and restoring it, hash-verified. That
    equality is the fail-open floor: the reorder can move a walk DOWN the precedence table and
    nothing else. probe:
    pytest backend/tests/services/visa_engine/test_interview_walk_census.py
  - >-
    WHEN a census guilt test's subject is cured by this PR, THEN it is RE-ANCHORED onto a walk
    that still fails rather than left to pass vacuously, and the docstring names both the old
    anchor and why it died. Three moved this round: the moved-block witness rides
    offshore/invest/pt_pma + family.sponsor_confirmed=false (block moves to
    process.wants_onshore_conversion, measured); the stale-row witness rides the LIVE
    offshore/invest/pt_pma allowlist row through _scoped_allowlist, so PR-3 deleting that row
    turns this test red instead of leaving a fabricated copy alive; the unlisted-fact witness
    rides offshore/work, which answers and therefore carries no row -- the branch under test.
    probe: pytest backend/tests/services/visa_engine/test_interview_walk_census.py
  - >-
    WHEN two products are excluded by two DIFFERENT rules that carry the SAME reason code and
    cite DIFFERENT source records, THEN the applicant-facing list renders that code ONCE, on an
    entry carrying BOTH rule_ids and the UNION of both source_ref sets -- no sentence repeated,
    no citation dropped. And WHEN the two codes differ, both survive in engine order, each
    keeping its own single citation, so the merge cannot be a blanket collapse. Measured on the
    real pack too: no walk in the 43 renders any repeated no_path or review reason code.
    Reverting _merge_reasons_by_code to _dedupe_reasons on a backed-up copy turns EXACTLY three
    tests red -- the two mechanism guilts and the real-pack census guard -- with both innocence
    halves still green (34 passed), then restored hash-verified. probe:
    pytest backend/tests/services/visa_engine/test_evaluator_purpose_feasibility_precedence.py
    backend/tests/services/visa_engine/test_interview_walk_census.py
