dissent:
  - seat: claude-opus-5 (this worktree session), self-caught
    status: CONFIRMED
    objection: >-
      This PR is now TWO concerns, and the gear floor is the machine noticing. The evaluator
      reorder (decision ORDERING) and the reader-reason collapse (public PRESENTATION) are
      separable — the collapse touches a different module, at a different boundary, and its
      defect is reachable-but-independent — and splitting them would put both PRs back under
      the Gear-2 floor and honour "one PR, one concern, <= ~400 net lines" instead of
      declaring 2020 lines of churn. The counter-argument, which is why it ships as one: the
      duplicate is NOT a pre-existing bug this PR inherited, it is a defect this PR's own
      reorder MAKES REACHABLE under ENFORCE — before the reorder zero walks reached
      NO_SUPPORTED_PATH — so shipping the reorder without the collapse would knowingly put a
      sentence-printed-twice in front of a real applicant for the length of one merge cycle.
      The grading session scoped it into this PR on exactly that reasoning. Recorded here
      rather than silently resolved because the split remains a live option for the Consul,
      and because a Gear-3 declaration reached by accretion across five rounds deserves to
      be named as such rather than presented as if it had been planned.
  - seat: claude-opus-5 (this worktree session), self-caught
    status: PLAUSIBLE
    objection: >-
      NOT RESOLVED, carried as a known gap for whoever next touches the public adapter chain.
      The mechanism tests for the collapse call _collapse_reader_reasons DIRECTLY rather than
      going through the whole apply_public_policy_adapters chain, because on a minimal
      hand-built pack the chain never reaches the collapse in NO_SUPPORTED_PATH —
      _apply_decisive_source_authority_hold fires first and rewrites to
      HUMAN_REVIEW_REQUIRED. That is measured and documented in the helper's own docstring,
      and the end-to-end IS pinned through the full chain on the real signed pack. But it
      means no hand-built-pack test would catch a future edit that removed the
      `_collapse_reader_reasons(decision)` call from apply_public_policy_adapters — only the
      real-pack census test would, and only while a corpus walk still produces a duplicate.
      The honest fix is a fixture whose source records satisfy the decisive-authority check,
      which is a source-applicability problem this PR is not about; left OPEN rather than
      bent, and flagged for whoever next touches the public adapter chain.
