task_id: oracle-evaluator-purpose-feasibility
gear: 3
gate_class: opus
brief_ref: evidence/brief.yml
date: 2026-09-07
machine: M5
lanes:
  - lane: >-
      evaluator purpose-feasibility reorder + purpose-scoped no-path reasons + reader-reason
      collapse + seq-20 census re-pin
    role: build
    seat: >-
      claude-opus-5 (builder seat in worktree .worktrees/backend-rag-oracle-evaluator-reorder,
      branch agent/air-m5/backend-rag/oracle-evaluator-purpose-feasibility)
    note: >-
      One concern in three layers, all of it downstream of a single reorder in
      evaluate_product. (a) THE REORDER: purpose-feasibility is tested BEFORE the
      input-tagged gate-unknown block instead of after, so a product whose ELIGIBILITY
      rules can never cover the declared purposes stops winning
      min(blocked, key=len(missing_facts)) and choosing the question every OTHER applicant
      is asked. Its only possible return is UNSUPPORTED, so it can neither manufacture a
      candidate nor silence a gate. (b) THE APPLICANT-FACING CONSEQUENCE: the reorder took
      NO_SUPPORTED_PATH from 0 of the 43 interview walks to 10, which made two latent
      defects in a near-invisible list reachable under ENFORCE — it aggregated the exclusion
      reason of products the applicant was never shopping for (cured by a structural,
      fact-independent ProductProof.purpose_feasible filter) and it rendered the same
      sentence twice when two rules carry one reason code (cured by a code-keyed collapse
      that UNIONS rule_ids and source_refs at the PUBLIC boundary). (c) THE MEASUREMENT:
      the 43-walk census is re-derived against the signed seq-20 pack — 11 NEEDS_INPUT /
      10 NO_SUPPORTED_PATH / 22 SUPPORTED_CANDIDATES — with ten cured allowlist rows DELETED
      and three guilt tests RE-ANCHORED because seq-20 plus this reorder cured their previous
      subjects. NO SIGNED PACK CONTENT IS TOUCHED: no rule, no bound, no reason code is added
      to any rulepack. This seat holds no private key and signed nothing.

seat_diversity: exempt
seat_diversity_note: >-
  One build lane, so D3's seat-diversity requirement does not attach (it binds packs with
  >= 2 build lanes). No review lane is declared because this is a builder handoff under
  CLAUDE.md §5: this seat prepares and never ships — it does not merge, arm or deploy — and
  a separate Consul session reads the diff and grades it. Declaring a review lane here would
  put the grader inside the generator's own pack, which is the boundary that separation
  exists to hold.

seat_override: >-
  R8 ground_truth: this diff hits GROUND_TRUTH_PATH_PATTERNS (`*/visa_engine/*`), but it
  introduces NO regulatory claim of its own — no rule, no bound, no legal threshold, and no
  new reason code in any signed pack. Every legal proposition it moves through was authored,
  ruled and signed BEFORE this PR (seq-19 in its own wave, seq-20 in #5854/#5867). What
  changes is the ORDER in which the evaluator tests two conditions it already computed, and
  which already-authored reason text is shown to which applicant. The census numbers are a
  MEASUREMENT of what those already-ruled rules produce, not a new claim about the law. A
  fresh NB/ground-truth lane would be re-litigating content this PR does not author.
  .
  R9 council_run: no council journal is declared, for the same reason plus one more. This
  PR compiles no claim to adversarially review, and under CLAUDE.md §5 this seat is a
  PREPARER that does not merge, arm or deploy. A separate Consul session reads and grades
  the diff — and has already returned two rounds of findings that are folded in here (the
  purpose-scoping of no_path_reasons, and the duplicate-reason defect with its measured
  investigation). Running council seats from inside the generator's own pack would move the
  adversarial read to the wrong side of the generator-is-never-grader boundary, not add one.

outcome: >-
  The Visa Oracle stops asking questions on behalf of visas the applicant could never have
  had, and says so honestly instead. Measured on the 43 real interview walks against
  rulepack-prod-020.signed.json — the highest signed pack and the one ACTIVE in production
  under ENFORCE — the census moves 21 NEEDS_INPUT / 0 NO_SUPPORTED_PATH / 22 SUPPORTED to
  11 / 10 / 22. The ten cured walks were each blocked on behalf of a purpose-infeasible
  product: seven on process.wants_onshore_conversion, two on
  investment.{investment,paid_up}_capital_idr, one on sponsor.type — and all three of those
  blocking-fact shapes leave the census entirely, so their allowlist rows are DELETED rather
  than left unused. The eleven survivors are real questions about products these applicants
  genuinely are shopping for, and are PR-3's mandate.
  .
  THE FAIL-OPEN FLOOR IS A MEASUREMENT, NOT AN ARGUMENT: the 22 SUPPORTED rows are
  byte-identical, candidates included, to what the SAME corpus produces on the SAME pack
  with this PR's evaluator.py swapped back to origin/main's — verified by doing exactly that
  on a cp-backed-up copy and restoring it hash-verified. The reorder can push a walk DOWN the
  precedence table and do nothing else.
  .
  Two applicant-facing defects that only became reachable BECAUSE of the reorder are cured in
  the same PR rather than left for the reader to hit: exclusion reasons belonging to products
  that never claimed the declared purposes are withheld, and a reason code emitted by two
  different rules now renders ONCE with its rule_ids and citations UNIONED rather than twice.
  The union is the load-bearing half — the two AGE_BELOW_55 proofs do not carry the same
  source records, so a naive dedupe on the code would have silently dropped a citation from a
  surface where requireDecisiveRefs makes citations mandatory.

diff:
  files: 10
  net_lines: >-
    evaluator.py (the reorder, ProductProof.purpose_feasible, and the merge_reasons_by_code
    helper the public boundary calls), evaluate_path.py (_collapse_reader_reasons on the
    public-shaping boundary), test_evaluator_purpose_feasibility_precedence.py (new — the
    mechanism, precedence, decision-level and real-seq-19 witness battery),
    test_interview_walk_census.py (seq-20 re-pin, ten rows deleted, three guilt tests
    re-anchored, two new reader-reason guards), test_seq19_pack.py and
    test_seq9_new_rule_witnesses.py (revised pins, never deleted), test_evaluator_edge_cases.py
    (a degenerate fixture made non-degenerate), engine-adapter.ts (one locale map entry), and
    this evidence pack. No total is narrated here on purpose: the grading rounds add commits
    after any literal is written, so a number in this file is stale the moment the file
    changes. The shape is stable and is what matters — a small evaluator change carrying a
    large guilt-and-innocence battery, which is the whole reason cure (a) was selected over
    the alternatives.
  measured_at: >-
    `git diff --numstat origin/main` and `--name-only` in this worktree, fed to
    scripts/evidence_pack_lint.py --print-floor / --print-floor-source.
  shape: >-
    One evaluator reorder, one public-boundary presentation collapse, and the tests that make
    both falsifiable. NO signed pack content is touched — no rule, no bound, no reason code is
    added to any rulepack, and no pack file appears in the diff at all. The interview tree is
    untouched: curing the eleven surviving dead ends needs new QUESTIONS, which is PR-3.
