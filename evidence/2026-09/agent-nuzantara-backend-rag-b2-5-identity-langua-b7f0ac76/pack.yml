result: >-
  A client asking who this is now gets a scripted presentation from the product's own definition
  instead of the abstain refusal, in five languages, at first contact — the turn that decides
  whether they stay. The guard is consulted as the SECOND authority immediately after the
  greeting, in the same order at all three call sites, so the two detectors and the package
  builder cannot hold three opinions about one message. The presentation deliberately makes NO
  promise about reaching a human: nothing in this repository detects that request yet, and the
  invitation returns in the next slice, in the same PR that makes it true.

measured:
  - "test_wa_identity.py: 118 passed. Whole WhatsApp unit surface: 1179 passed, 6 xfailed (pre-existing, each with a written reason), 0 unexplained skips"
  - "MUTATION-PROVEN guard: disabling the domain veto turns 11 innocence tests red; restored, green"
  - "census BEFORE cures: over-match 0/23, under-match 2/32 — and both misses were the same shape, the 'are you an AI' phrasing, which is plausibly the commonest way a client asks this today"
  - "census AFTER cures: over-match 0/10, under-match 0/16, including Cyrillic and the AI phrasings"
  - "Cyrillic survives the normalizer: _normalize('Кто Ты?') -> 'кто ты', verified empirically before the ru/uk table was written rather than assumed from the regex"
  - "'unbuildable:identity_domain' normalizes to 'package_unbuildable', a value migration 318's CHECK already admits — no migration, no production write can fail"
  - "detect_query_language is correct on 7 of 8 ordinary client sentences; the abstain stub did NOT need the fix the mandate assumed"
  - "diff: about 1,460 net across 15 files — exactly 987 of it code and tests across 10 files, the remainder this Evidence Pack, which moves its own total whenever it is edited; floor 2, source size"

dissent:
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: 'BLOCKER-class: the presentation instructs the client to write a magic phrase to reach a human (''Just write "I want to talk to a human"''), and nothing in this repository detects that phrase. A client who follows the instruction falls through to retrieval, abstains, and reaches nobody.'
    resolution: >-
      Correct, and it was the single most valuable finding of the review. CURED by DELETING the
      invitation in all three languages rather than softening it — "let me know and a consultant
      will take over" is the same untruth in a quieter voice, and it would be harder to make true
      later because it names no trigger. This repo settled the identical question once already:
      PR #3260's refusal copy deliberately does not promise "a colleague will reply here",
      precisely because nothing notifies a human. The invitation comes back in the NEXT slice, in
      the same PR that ships the detector and the email, so the promise and the mechanism land
      together.
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "The Indonesian presentation is a calque from English: 'bicara dengan manusia' reads as human-versus-alien rather than as business Indonesian, and 'orang Bali Zero' is too colloquial for a first contact."
    resolution: >-
      CURED. The offending sentence was removed by the cure above; the remaining calques were
      fixed ('bantu soal' -> 'bantu mengenai', and the grounding sentence rewritten). Worth
      recording as a class: an Indonesian client is the one who reads this string, and it was
      written by seats whose default is English.
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "The Italian narrows a category the other two do not: 'visti turistici' where English says 'visit visas' and Indonesian 'visa kunjungan', which cover business and pre-investment visits."
    resolution: "CURED: 'visti d'ingresso'. The three languages now promise the same scope."
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "wa_greeting scripts ru and uk; wa_identity scripts only id/en/it. A Russian- or Ukrainian-speaking client asking who this is falls through to retrieval and gets the abstain refusal — the exact defect this slice exists to close."
    resolution: >-
      CURED: ru and uk added to both the phrase table and the replies, 33 phrases between them,
      with guilt AND innocence cases. Not a hypothetical locale — that segment has its own team
      corner in this repo. The normalizer's handling of Cyrillic was verified empirically BEFORE
      the table was written, because a table that can never match would have passed every test
      that only asserts "returns None".
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "A compound question under the length brakes — 'who are you and can you help me move next month?' — matches, and the client's practical half is answered by the presentation instead of by retrieval."
    resolution: >-
      Reproduced, and DECLARED rather than cured. The cost is one extra turn, and what the client
      gets today in that same case is the abstain refusal, which is strictly worse. Every cure
      considered (a conjunction list, a phrase-coverage ratio) either re-introduces the substring
      thinking this guard exists to avoid, or breaks the real production case
      'ti ho chiesto chi sei tu' whose matched phrase covers a third of the message. Written into
      the module docstring so the next reader does not rediscover it as a defect.
  - seat: agy-gemini-3.1-pro
    status: CONFIRMED
    objection: "The match is stateless: a second identity question in the same thread returns the same presentation verbatim."
    resolution: "Deliberate and declared in the docstring. The module is a pure function with no thread access by design; giving it one would make it the kind of detector this slice exists to avoid."
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: "(from the trace it left before dying) the source and tests appear to persist verbatim private conversation content."
    resolution: >-
      The instinct is right on this surface and the reading is wrong: the two Italian sentences
      are the OWNER's own probe messages to the sandbox number, naming nobody and carrying no
      identifier. CURED at the level that matters — their provenance is now stated in the module
      docstring, so the next reader, human or machine, does not have to re-derive it. A grep of
      the whole diff for credential and identifier shapes returns zero hits.
  - seat: dux-claude-opus-5
    status: CONFIRMED
    objection: "The ledger cannot distinguish an identity turn: 'unbuildable:identity_domain' falls through to the generic 'package_unbuildable' bucket instead of its own value, which is the exact blindness migration 291's sub-reason map exists to end."
    resolution: >-
      Accepted, not cured. Giving it its own value means extending migration 318's CHECK
      constraint — a whole migration, with its Squawk run and its rollback proof — for a ledger
      label on a code path that is unreachable from the live leg, because wa_codex_leg
      short-circuits before the build is ever called. The fallback is SAFE by construction, which
      was the thing that actually had to be proven and is (see receipts). If that raise ever
      becomes reachable, this is the row to come back to.

