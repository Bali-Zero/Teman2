# the sandbox number; they name nobody and carry no identifier. One reviewing seat flagged them
# as possible verbatim private conversation content, which is exactly the right instinct on this
# surface; their provenance is now stated in the module docstring so the next reader does not
# have to make that judgement again. Verified, not asserted:
# `git diff origin/main | grep -nE "(api[_-]?key|password|@gmail|@balizero|\+62[0-9]{6,})"`
# returns ZERO hits. No client message body, phone number or name is anywhere in this change.
