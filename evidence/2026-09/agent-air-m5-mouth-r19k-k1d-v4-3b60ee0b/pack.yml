    cmd: >-
      npx vitest --run src/app/login ; node -e "for each vector: new URLSearchParams('redirect='+v).get('redirect') then new URL(decoded, origin)"
      Probe: npx vitest --run src/app/login
    result: >-
      Measured before writing the guard. `?redirect=/%09/evil.test` is percent-decoded by
      URLSearchParams into `/`,TAB,`/`,`evil.test`, and `new URL()` resolves that to origin
      https://evil.test — likewise /%0A/ and /%0D/, //evil.test, the backslash forms, the userinfo
      trick and the look-alike host. safeRedirect compares u.origin to location.origin, requires
      http/https, refuses /login and returns pathname+search+hash. 45 tests: the spec's full vector
      table, an assertion that the decode the vectors depend on is real, and one test proving the
      REPLACED prefix guard (startsWith "/" and not "//" and not "/\\") returns true for all three
      whitespace forms while safeRedirect refuses them.
