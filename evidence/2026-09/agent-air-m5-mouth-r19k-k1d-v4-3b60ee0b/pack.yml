dissent:
  - seat: harness gate (fresh Opus, read-only)
    objection: >-
      BLOCK on #6502 — contract.ts returns a path-branch target verbatim after excluding only // and
      /\; browsers strip TAB/LF/CR before parsing and URLSearchParams.get() percent-decodes, so
      ?redirect=/%09/evil.test reaches location.replace as https://evil.test/.
    status: CONFIRMED
    disposition: >-
      True, and it survived two further attempts of mine (#6503, #6505) because both only added
      new URL() to the ABSOLUTE branch. The imperator wrote the contract
      (windows/K1d-REDIRECT-SPEC.md) under the depth-1 rule and it is applied verbatim here, vector
      table included. I had reasoned about the parser and still shipped a prefix test three times;
      what closed it was judging the resolved URL instead of the string.
  - seat: harness gate (fresh Opus, read-only)
    objection: BLOCK notice — the PIN lacks pattern="[0-9]*" and portal/r19-fonts.css is edited.
    status: CONFIRMED
    disposition: >-
      Both taken. The pattern is beside inputMode (iOS Safari reads the pattern for the numeric
      keypad); the portal file is byte-identical and its stale-comment correction moved into the
      login file's own docstring, since that file belongs to another window.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK (on the #6502 diff) — a Next page module may export nothing but the framework's own
      symbols; tsc --noEmit --incremental false fails TS2344 on the exported helpers.
    status: CONFIRMED
    disposition: >-
      Cured before #6502 opened and carried here: LoginStage, safeRedirect and stageForError live in
      ./contract. The strict flag is now an acceptance probe, because the plain run was green on the
      same tree.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — every non-401/403 becomes "service unreachable", but the endpoint returns 400/422 for
      invalid input.
    status: CONFIRMED
    disposition: >-
      Measured in identity/router.py:78-92. 4xx is now "what you sent" except 408 and 429; 5xx and
      network throws are the service; the denied copy says "were not accepted" so it is true of a
      format error too.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — findReds misses #f00, rgb(...) and bg-red-500; findCopperFill misses inline
      backgrounds, which is exactly how this page fills its button; the theatre guard checks a class
      the overlay never used; the panel guard has no planted case.
    status: CONFIRMED
    disposition: >-
      All four widened and carried here. findReds judges the colour in any spelling with four
      unlisted reds as guilt and the whole alphabet as innocence; findCopperFill reads inline styles;
      findTheatre is source-level with the replaced implementation as guilt; panelTracksSuccess is
      planted three ways.
  - seat: claude-opus-5
    objection: >-
      The spec accepts the SAME origin only, which narrows an existing flow: an SSO subdomain that
      bounces a visitor here with its own absolute URL no longer returns them there.
    status: CONFIRMED
    disposition: >-
      Applied as ruled, and recorded rather than quietly widened. The workspace layout's own bounce
      (?redirect=${window.location.href} from kita) is same-origin and still works; a cross-subdomain
      return lands on the role destination instead. If those subdomains must return their visitors,
      that is a contract question for the imperator, not a widening for me to take on a surface that
      has already been reopened three times.
notes:
  - >-
    Three PRs were closed to get here: #6502 (gate BLOCK, the redirect), #6503 and #6505 (the same
    defect, my corrections having touched only the absolute branch). Each was disarmed before being
    closed and none was pushed to after arming.
  - >-
    Also cured along the way, and still true here: the success plate is gone because it was measured
    never to paint (location.replace takes the window before React commits); the 1500ms and 2000ms
    delays are gone; the error boundary lost the shadcn destructive red; the skeleton draws this
    page's silhouette.
  - >-
    A production build cannot be reproduced in a worktree (`next build` dies on the shared
    node_modules symlink), so every browser claim here is measured under `next dev --webpack`. The
    E2E of #6505 passed CI's production build with this same spec file, which is the evidence that
    the technique holds in both.
  - >-
    globals.css is the one file this PR shares with the k1-prims seat (K1c-bis). It carries only the
    two --bz-panel tokens; K1d-bis turns that one value to ink for the frozen fusion.
