gear: 3
gear_reason: >-
  Floor measured on the working-tree diff against merge-base 3b3741d1dd (`evidence_pack_lint.py
  --print-floor` over the numstat, result 3): non-fixture churn dominated by the folded pack
  rulepack-prod-024.source.json (9,267 lines) plus test_seq24_pack.py (~1,030 lines) and
  fold_pack_seq24.py (~610 lines) — well past SIZE_GEAR3_THRESHOLD; the source JSON is NOT
  size-excluded, the same convention #7174 (seq-23 candidate) and #6663 carried it under.
  Judgement agrees independently of the floor: this PR folds a candidate production rule pack
  (unsigned, unactivated) over apps/backend-rag/**, where merging a PR is itself the deploy
  (memory discovery_merging_a_backend_rag_pr_deploys_by_itself_2026_09_01) — the runtime stays
  on the DB-active pack until a separate signing/activation ceremony, but the candidate bytes
  ship live the moment this merges.
ruling: >-
  Zero, 2026-09-27 — E33F: a retiree without a confirmed sponsor becomes an E33F candidate.
  The fold takes seq-24 (a new pack superseding signed seq-23); the rollback, if ever needed, is
  seq-25 (a new pack naming this one), never a rewrite of seq-24. Option A: no new reason code —
  the note that a sponsor may still be needed lives in the mouth, not in the pack.
mission: >-
  Visa Oracle seq-24 (E33F no-sponsor -> candidate) — PR-A, backend-rag, candidate seq-24,
  UNSIGNED, UNACTIVATED. Sibling: PR-M (mouth), a separate PR on a separate seat.
objective: >-
  Fold seq-24 DIRECTLY from the signed seq-23 anchor (previous_payload_sha256
  e5f791b5232fd1369ef3b94ca7bb5f349f9bb6eb4073895aa9f7deb682e72204, verified via the public
  production trust store's assert_anchor_is_a_verified_signed_artifact, never taken on the digest
  constant alone). Exactly ONE semantic change, for ONE product (E33F, product_version_id
  7c1da88f-f7cd-571a-95c2-7da32463d3e6): (1) RETIRE hf.e33f.sponsor-required (HARD_FILTER/EXCLUDE
  SPONSOR_REQUIRED on family.sponsor_confirmed == false — the only emitter of SPONSOR_REQUIRED in
  seq-23); (2) MODIFY IN PLACE el.e33f.retirement — drop the third conjunct
  family.sponsor_confirmed == true from its `all` and drop family.sponsor_confirmed from
  required_facts (valid_period untouched, as seq-23's own in-place edits left theirs). Everything
  else is byte-identical, including hf.e33f.age-below-55, hf.e33f.retirement-income-below-minimum
  and the four other rules that read family.sponsor_confirmed (el.c2.business, el.c6.social,
  el.e31d-stepchild-support, hf.minor-without-confirmed-sponsor). Sequence 24, version 2026.9.27,
  created_at 2026-09-26T21:00:00Z (precedes any future signing instant), rule_pack_id the uuid5
  of sequence 24, rollback_of_payload_sha256 null. Payload digest (H24)
  5a569091f84a858f1957cdf96086ee7212f67d13a8225d64492a7212093cd272. UNSIGNED, UNACTIVATED
  throughout — this PR never signs, activates or arms.
scope:
  - apps/backend-rag/backend/scripts/visa_engine/fold_pack_seq24.py (new)
  - apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-024.source.json (new, GENERATED)
  - apps/backend-rag/backend/tests/services/visa_engine/test_seq24_pack.py (new, dedicated)
  - apps/backend-rag/backend/tests/services/visa_engine/test_interview_walk_census.py (seq-24 candidate rows; the by-sequence state census hoisted to module level so the candidate is graded against it before signing)
  - evidence/2026-09/agent-nuzantara-backend-rag-seq24-fold/**
constraints:
  - Forbidden - evaluate_path.py, every SIGNED pack byte, the mouth (PR-M owns it), every
    apps/mouth/** file — none touched by this diff.
  - No rule may be inserted and no reason code minted (Option A); the fold refuses an insertion.
  - The four other rules that read family.sponsor_confirmed stay, byte for byte; the fold
    asserts the post-fold reader set is EXACTLY those four.
  - SPONSOR_REQUIRED must have exactly one emitter before the fold (the retired rule) and none
    after; a second emitter aborts the fold rather than leave the code reachable.
  - No HARD_FILTER/EXCLUDE rule (at any stage) may read a synthesised Second-Home twin-basis
    fact — antibody re-run on this fold's own output.
  - Exactly one HUMAN_REVIEW-stage rule (review.e33.below-threshold-studio) and zero
    on_unknown HUMAN_REVIEW escalations remain (derived inventory 1 / 0).
  - Output path refuses a `.signed.json` suffix or an input collision.
  - No DB, no production POST, no key file opened, no credential printed, no client PII. The
    only key material used is the PUBLIC trust store documented in
    docs/runbooks/visa-engine-key-ceremony.md.
acceptance:
  - text: "The fold SHALL verify its seq-23 anchor against the public trust store (never a digest constant alone) and SHALL set previous_payload_sha256/rollback_of_payload_sha256/sequence/rule_pack_id to the anchor/null/24/ecea2663-35ed-586d-aa52-9ed1849e0060"
    probe: "pytest backend/tests/services/visa_engine/test_seq24_pack.py::TestFoldIntegrity"
  - text: "The fold SHALL retire exactly hf.e33f.sponsor-required, modify exactly el.e33f.retirement (sponsor conjunct and required fact only), insert nothing, and leave every other rule byte-identical and in order"
    probe: "pytest backend/tests/services/visa_engine/test_seq24_pack.py::TestDispositionTableRows backend/tests/services/visa_engine/test_seq24_pack.py::TestEditPreconditions"
  - text: "A retiree with RETIREMENT + passive income >= 3000 + age >= 55 SHALL be a SUPPORTED E33F candidate for sponsor TRUE, FALSE and UNKNOWN on seq-24 — and SHALL NOT be on signed seq-23 for FALSE/UNKNOWN; income < 3000 and age < 55 SHALL still exclude; no product proof emits SPONSOR_REQUIRED"
    probe: "pytest backend/tests/services/visa_engine/test_seq24_pack.py::TestE33fEngineWitnesses"
  - text: "The twin-basis antibody SHALL pass on the candidate and the derived inventory SHALL be exactly 1 review rule / 0 escalations"
    probe: "pytest backend/tests/services/visa_engine/test_seq24_pack.py::TestAntibodies backend/tests/services/visa_engine/test_seq24_pack.py::TestDerivedInventory"
  - text: "The census SHALL grade the seq-24 candidate against its own per-sequence pins (one walk moves: offshore/retirement/property/age64/sponsor_no NO_SUPPORTED_PATH -> SUPPORTED_CANDIDATES [E33F]; state census 99/13/3/1; the one dead-end walk blocks on secondhome.passive_monthly_income_usd) and leave every _SIGNED_SEQUENCE-keyed literal for sequences 20-23 untouched"
    probe: "pytest backend/tests/services/visa_engine/test_interview_walk_census.py"
  - text: "The whole visa_engine test package SHALL stay green with the candidate on disk"
    probe: "pytest backend/tests/services/visa_engine"
consumer_map:
  - >-
    The candidate census tests (test_interview_walk_census.py::
    test_every_walk_ends_in_its_pinned_outcome_on_the_candidate_pack and its siblings): a
    rulepack-prod-*.source.json above the highest signed pack makes them grade THAT pack against
    EXPECTED_OUTCOME_BY_SEQUENCE[24] — this PR adds those pins and is what makes them measure
    seq-24. The Bites line names the CI shard log that shows them `passed`.
  - >-
    PR-M (mouth, sibling, separate seat): carries the applicant-facing note that an E33F
    candidate without a confirmed sponsor may still need one (Option A). It changes no byte of
    this PR and this PR changes no byte of it.
  - >-
    The seq-24 signing ceremony (a later PR by the operator's conductor): signs and activates
    this candidate. Known follow-up it must carry, named here so it is not rediscovered as a
    red: test_evaluator_gold.py's production-replay expectations for personas 3 and 4 list
    SPONSOR_REQUIRED among their no-path codes and are graded against the HIGHEST SIGNED pack —
    they hold on seq-23 and must be re-derived the moment seq-24 is the highest signed pack; and
    the census's _SIGNED_SEQUENCE-keyed literals (already pinned for 24 by this PR) start
    grading the signed bytes.
