dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      "ROUND 1, on the FIRST design (a required CI check that failed bot-authored lock-only PRs).
      Verbatim: 'filename co-presence is trivially spoofable while legitimate lock-only changes
      on bot-authored PRs are rejected.' Two defects in one sentence: the gate's whole predicate
      was 'did the paired manifest change too', which any unrelated whitespace edit satisfies;
      and its refusal direction hit exactly the legitimate case."
    status: CONFIRMED
    evidence:
      "Both halves were true of the code as written (scripts/ci/dependabot_lock_pairing_gate.py,
      150 lines plus 172 lines of tests, 25 tests, 3 mutants verified red, real receipts refusing
      #5452 and accepting #5453). Nothing in that design distinguished a real recompile from a
      cosmetic manifest touch."
    resolution:
      "Answered by DELETION, not by argument. The design was removed from the branch entirely —
      those files do not exist here — and the branch was rebuilt from a clean origin/main. Both
      halves dissolve in the replacement rather than being mitigated: there is no manifest
      co-presence condition left to spoof, because the control keys on the lock path ALONE; and
      nothing is rejected, because the control withdraws auto-merge eligibility instead of
      failing a check."
  - seat: tp1-qwen3.8-max
    objection:
      "ROUND 1, same first design. Verbatim: 'It blocks legitimate lock-only transitive/grouped
      security updates and can be bypassed by unrelated manifest edits/renames.' Independently
      reached, and it names the worse of the two diseases: a REQUIRED check going red on
      legitimate transitive security updates would be permanently red."
    status: CONFIRMED
    evidence:
      "A transitive or grouped security update legitimately touches only the lock, so the gate
      would have refused it every time. This repo's own scar record (superscar #2) is that a
      permanently red check stops being read — the design would have manufactured the disease it
      was written to prevent."
    resolution:
      "Same deletion. This is the objection that decided discard-over-patch: a control whose
      refusal direction is systematically wrong cannot be tuned into correctness. The replacement
      cannot go red at all, so the failure mode it names is unreachable by construction."
  - seat: codex-gpt-5.6-sol
    objection:
      "ROUND 2, on THIS design, on a ground neither seat raised in round 1. Verbatim: 'il workflow
      nega un nuovo armamento ma non revoca un auto-merge gia esistente quando il diff diventa
      protetto.' On a later synchronize path_check correctly writes match=false, which only skips
      the Enable auto-merge step — an autoMergeRequest armed earlier survives, because GitHub
      auto-disables auto-merge only when the pushing actor lacks write permission."
    status: CONFIRMED
    evidence:
      "Verified independently this session rather than taken on the seat's word: grep -rn for
      '--disable-auto' under .github/ returns NOTHING — no workflow in this repo has ever revoked
      arming (the only callers are scripts/mq.sh, an operator-run local tool, and its test). The
      PROTECTED array dates from 0adc9945dd (2026-05-25, #851) and now holds 31 entries, so the
      gap is a property of the MECHANISM shared identically by .github/workflows/,
      migrations_v2/, services/auth/ and services/pricing/ — the compiled-lock pattern is merely
      the 31st to inherit it, not its cause."
    resolution:
      "ACCEPTED AS TRUE AND DELIBERATELY LEFT OPEN; the grader should weigh this and is free to
      overrule the choice. Rule 8 (cure what the diff INTRODUCES, spec what it INHERITS) puts it
      on the ledger with owner session[ci] and a concrete two-part proof-of-armed, not in this
      PR: a revoke step changes behaviour for 30 pre-existing protected paths, which is a
      different concern with a different blast radius, and shipping it unreviewed as a reflex to
      a graded objection is precisely the fix-of-a-fix shape rule 8 forbids. Two narrowing facts,
      stated so the grader can discount them: (a) the exposure needs a PR ARMED on an earlier push
      that did NOT carry the lock and that GAINS one later, while every pip PR measured here
      carries its full diff from the first event; (b) the out-of-band paths codex also names (a
      write-permission human, gh pr merge --admin) are not closable by any path pattern and are
      outside what this control claims."
  - seat: tp1-qwen3.8-max
    objection:
      "ROUND 2, on THIS design. The seat returned OK — 'it removes the unattended merge path for
      compiled backend-rag locks without creating permanent failures' — but opened by limiting
      its own verdict, verbatim: 'I can judge the regex and control from the excerpt; I cannot
      verify full workflow syntax, test assertions, antidotes wiring, or absence of other
      auto-merge paths.' Recorded as dissent rather than as a clean pass because that limitation
      is a real hole in the evidence, not a formality."
    status: PLAUSIBLE
    evidence:
      "The seat received a deliberately trimmed 3930-byte context (the added regex with five lines
      of array context, the match=true/false bash, and a prose note on the new test file) because
      it returns a non-judgement above roughly 4KB — measured three times in round 1. So its OK is
      an opinion on the regex and the control shape, NOT on the workflow as shipped. It also
      flagged, unprompted and identically to codex, the subdirectory/other-app under-match and the
      residual human/admin merge paths."
    resolution:
      "Not treated as cancelling codex's BLOCKING: an OK from a partial view is weaker evidence
      than a BLOCKING from a full one, and the two are recorded as a genuine disagreement rather
      than averaged into a pass. The specific things tp1 said it could not see — workflow syntax,
      test assertions, antidotes wiring — are each covered by a receipt above (actionlint 32=32,
      12/12 pytest, the immune-enforcement hook points), which is the compensating evidence, not
      a claim that the seat verified them."
residual_risks:
  - risk:
      UNDER-MATCH BY DESIGN — '^apps/backend-rag/[^/]*\.lock\.txt$' deliberately does not reach a
      compiled lock in a subdirectory, in another app, or under any other name.
    why_accepted:
      "Both seats named this independently and both called it acceptable-but-track. The two
      locks that exist today are both root-level under apps/backend-rag and are matched
      (measured, receipt 1); a third root-level one would be matched automatically. Widening to
      '**/*.lock.txt' would also swallow package-lock.json and every npm lock in the monorepo,
      which is a much larger auto-merge policy change than this PR's concern. The test
      test_the_locks_this_guard_protects_actually_exist goes RED if either current lock is moved
      or renamed, so the day the assumption stops holding is a red test, not a silent gap."
  - risk:
      SILENT FAILURE DIRECTION — when the pattern does NOT match, nothing goes red and no line is
      written on the PR; auto-merge simply arms.
    why_accepted:
      "This is inherent to hosting the control in the eligibility workflow rather than in a
      required check, and hosting it there is what makes both round-1 BLOCKING verdicts
      dissolve. The compensating instrument is the test suite: 7 of the 12 tests are the
      over-match half and 4 the guilt half, and the file is named by a REQUIRED job so it
      actually runs (receipt 8) — unlike the sibling suite it borrows from."
  - risk: THE REVOKE GAP — an auto-merge armed before the lock appeared is not disarmed when it does.
    why_accepted:
      "Inherited by all 31 PROTECTED entries since 2026-05-25, verified this session; see the
      round-2 dissent above and the PENDING-ARMS row with owner session[ci]. Named here so it is
      impossible to read this pack as claiming the control is complete."
  - risk:
      THE SIBLING SUITE test_auto_merge_whitelist.py IS ORPHANED AND 26/75 RED ON MAIN, and this
      PR's new file imports its harness.
    why_accepted:
      "The redness is inherited and measured on a clean origin/main tree (receipt 7). Fixing it
      means either widening PROTECTED to cover the Tier-1 CODEOWNERS paths it expects or
      amending the expectation — a decision about the auto-merge PERIMETER, which is a different
      concern from adding one lockfile pattern. On the ledger, owner session[ci], with a
      two-part proof-of-armed: named by a workflow that can go red AND a clean run at 0 failed."
