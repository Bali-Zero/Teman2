objective: |
  Closes C2 and C3 of the fresh gate on PR #7449
  (pull/7449#issuecomment-5849426890), due 2026-10-03:

  C2 — #7449 fixed `_send_with_brevo_fallback`'s own log lines in both
  `waiting_documents_service.py` and `completed_process_service.py`, but the gate found
  each file's CALLER still logs the raw client address independently:
  `waiting_documents_service.py`'s `trigger_on_waiting_documents` logs
  `f"Document request email sent to client {client_data['email']}"` on success and the
  raw exception `e` on failure; `completed_process_service.py` splits the same shape
  across two methods — `_send_completion_email`'s own success log
  (`"Completion email sent to client %s", client_email`) and `trigger_on_completed`'s
  except log (raw `e`). Fixed with the same `redact_identifier_for_log`/`_bounded_scrub`
  helpers already imported into both files by #7449 — no new redaction primitive.

  C3 — `services/notifications/resend_http.py`'s `send_via_resend` (the Resend fallback
  leg of `send_direct_email`, never touched by #7438/#7449 because those PRs only fixed
  `router.py`'s own log lines, not the provider module it calls into) had three raw
  sites: the success log's `to_email` plus a `subject` using `%r` (escapes newlines but
  does not redact an embedded address — the same shape #7438 fixed in `router.py`
  itself), the API-error log's `to_email` and unscrubbed `resp.text[:300]`, and the
  exception log's `to_email` and raw exception text.

  Full backend-wide triage of raw-address logger call sites redone from scratch this
  time (see the PR body's triage table) — the two prior PRs' triage sections were each
  found incomplete by the following gate.
constraints:
  - "C2/C3 fix exactly the sites the gate named, applying the SAME
    redact_identifier_for_log/_bounded_scrub treatment #7438/#7449 already established —
    no new regex, no new redaction primitive."
  - "resend_http.py's subject follows the same scrub-then-escape order #7438 established
    for router.py: `repr(_bounded_scrub(subject, 120))`."
  - "resend_http.py's error-log response body is now scrubbed via `_bounded_scrub(resp.text,
    300)` instead of the previous raw `resp.text[:300]` slice — bounding happens inside
    the scrub helper now, not via a bare slice, so an embedded address in the provider's
    error body is also redacted, not just truncated."
  - "No client PII in this PR's own artifacts — every example/test address is a synthetic
    `*.example.com`-shape address."
acceptance:
  - text: >-
      (C2) `trigger_on_waiting_documents` and `trigger_on_completed`/`_send_completion_email`
      SHALL NOT log the raw client address or raw exception text on their own
      success/except log lines (independent of `_send_with_brevo_fallback`, already
      fixed by #7449); non-PII diagnostic text SHALL survive (innocence).
    probe: "pytest backend/tests/unit/services/crm/test_waiting_documents_service_pii_logs.py backend/tests/unit/services/crm/test_completed_process_service_pii_logs.py"
  - text: >-
      (C3) `send_via_resend`'s three log sites (success, API-error, exception) SHALL NOT
      log the raw recipient address, the raw provider response body, or the raw
      exception text; the subject SHALL be scrubbed-then-repr'd; non-PII diagnostic text
      (status codes, non-address error text) SHALL survive.
    probe: "pytest backend/tests/unit/services/notifications/test_resend_http.py"
  - text: >-
      No regression: the full notifications/crm/integrations/invoicing/security test set
      plus the 3 core RAG suites named in `apps/backend-rag/CLAUDE.md` §11 SHALL still
      pass; `ruff check` on the 7 touched files SHALL be clean.
    probe: "pytest backend/tests/unit/services/notifications backend/tests/unit/services/crm backend/tests/unit/app/modules/notifications backend/tests/unit/security backend/tests/unit/services/integrations backend/tests/unit/services/invoicing backend/tests/services/rag/test_kg_langgraph.py backend/tests/services/rag/test_kg_subgraphs.py backend/tests/services/rag/test_confidence.py; ruff check backend/services/crm/waiting_documents_service.py backend/services/crm/completed_process_service.py backend/services/notifications/resend_http.py backend/tests/unit/app/modules/notifications/test_send_email_chain.py backend/tests/unit/services/crm/test_waiting_documents_service_pii_logs.py backend/tests/unit/services/crm/test_completed_process_service_pii_logs.py backend/tests/unit/services/notifications/test_resend_http.py"
