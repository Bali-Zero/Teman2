dissent:
  - seat: sonnet-5
    objection:
      "council_run (R9) is not satisfied by a real 2-seat journal: only one COUNCIL_REVIEW_SEATS
      entry (kimi-code/k3) is recorded. The second attempted seat, codex-gpt-5.6-sol, is SUSPENDED on main
      (open spec PR 7513, defective PII egress guard) and did not return within this session's time
      budget for it — team-lead direction was explicit: do not block on it, use seat_override with a dissent
      entry stating the lane is suspended, the same shape used by PR 7519 and PR 7515's evidence packs.
      Applied via the pack-level `seat_override:` field above rather than fabricating a second verdict or
      leaving R9 a hard, unresolved violation."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      One step below the fixed line, `CLASSIFICATION=$(python3 -c '...classify(json.load(open("/tmp/bites-parsed.json")))...')`
      is a command-substitution assignment; under bash -e a FAILING assignment also aborts the step, before
      the case statement's own `*)` fail-closed branch can print its message — the same silent-death family
      this PR fixes, one line further down.
    status: CONFIRMED
    resolution:
      Investigated, left OUT of this PR's scope. bites_parse.py's main() always writes a JSON
      dict to stdout whenever it exits 0 or 2 (the only two codes this step's taxonomy accepts before reaching
      this line), and classify() only ever calls .get() on that dict — so the assignment can fail only via
      filesystem corruption between the two steps or a classify() crash on an unexpected-but-valid shape,
      neither reachable through the parser's documented contract. A real, narrower fix (widen `|| RC=$?`
      one line further, or guard the python -c call the same way) is a separate, single-line PR against
      a genuinely different fragility, not a fix-of-a-fix on this one.
