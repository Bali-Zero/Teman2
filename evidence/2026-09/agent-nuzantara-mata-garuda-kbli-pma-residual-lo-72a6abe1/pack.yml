  behaviour_change: >-
    No code path changes beyond the per-lot rule-pin selection (spec["lot"] -> REQUIRED_RULE_BY_LOT).
    260 canonical records move pma_verification_status declared_gap -> located and gain
    pma_official_basis / pma_source_vintage / pma_cap_verified — the SAME BASIS string lot 1
    wrote; no pma_status and no pma_max_asing value changes anywhere. The observable effect is
    the 15/8 fail-closed disclosure gate publishing a located tuple, AND — new to this lot —
    discloseBaliL4 unveiling the Bali row for the first time on these 260 records: "Not on Bali's
    PMA closure list — verify on OSS". 11 reached codes are deliberately NOT published; their
    lines in llms-kbli.txt do not move.
