seat_diversity_note: >-
  One build lane, same reasoning as lot 1: every load-bearing question here is settled by a
  probe against the Perpres artifacts and the canonical in-tree, or by a linter's exit code, not
  by an opinion. The one genuinely new judgement call this lot makes — which 6 mouth tests could
  keep using 01192 as their "unlocated, non-sourced-closure ATTENZIONE_FASCIA_BALI" fixture now
  that lot 2 locates it, and what to swap it for — is answered structurally (62900 carries the
  identical Bali status and is independently withheld by this lot's own legacy_pma_prose leg,
  not a hand pick), not by paraphrase.
seat_override: >-
  Same two rules as lot 1's pack, same answers. (1) R8's ground-truth lane: none to declare — the
  ground truth is the Perpres annex artifacts and the BPS crosswalk in-tree, read by
  `perpres_body_default_relation.py`, whose `--check-artifact` probe is a receipt below.
  (2) council_run's >=2 non-Anthropic seat journal: every seat on that list is unreachable from
  this machine this session (injected arsenal probe: kimi TIMEOUT, codex/codex-spark UNKNOWN_ERR,
  qwen-cloud-code UNKNOWN_ERR, jules CRED_UNAVAILABLE, all seven tp1-* QUOTA_DEAD) — declaring the
  absence rather than writing a journal for reviews that never happened. What stands in its place:
  lot 1's own council round already adjudicated every load-bearing predicate this lot reuses
  unchanged (the sector-referral shapes, the category-closure probe, the annex-title-collision
  probe, the sector-law-closures guard); this lot's only NEW surface is the per-lot pin and the
  Bali-axis population, both re-derived and refused-on-drift by the compiler itself. The
  replacement for a missing council is the on-disk gate this PR requests at open.
