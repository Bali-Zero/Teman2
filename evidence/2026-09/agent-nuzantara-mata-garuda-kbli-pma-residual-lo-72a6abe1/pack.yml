dissent:
  - seat: session (self-correction mid-build)
    objection: >-
      A test I wrote before applying the canonical
      (test_the_lot_2_spec_validates_against_the_real_canonical) asserted the PRE-apply shape
      (todo == all 260 items). Once the canonical was applied and committed in a later commit on
      the SAME branch, that assertion went red against the now-already-shipped canonical — caught
      by a dispatched verification pass, not by a fresh eye.
    status: CONFIRMED
    resolution: >-
      Fixed in the same PR, before push: the assertion now reads ([], []), matching lot 1's own
      `test_rerun_on_the_shipped_canonical_is_a_clean_noop` — the correct post-ship shape, since
      this PR's own second commit already writes the canonical the test suite's third commit
      reads. Re-verified green (74/74) after the fix.
  - seat: session (declared limit, unresolved)
    objection: >-
      batchA-calibration* reports (batchA-calibration.json/.md, -v2, -v3) were not regenerated,
      on the reasoning that no required suite gates their content against the live canonical
      (only batch-a-members.json's sha256 PIN is gated, and that pin IS re-stamped). This
      reasoning was NOT cross-checked against whether some OTHER, non-required consumer reads
      those reports' content directly.
    status: PLAUSIBLE
    resolution: >-
      Left standing and labelled rather than silently regenerated. The explicit fallback in this
      lane's own brief ("Regenerate ... ONLY if Lot 1's pack shows they moved BECAUSE of the
      relabel; otherwise leave them and say so") licenses exactly this choice, and lot 1's own
      pack.yml/brief.yml (read in full before this decision) name no such requirement for these
      reports specifically.
  - seat: session (declared limit)
    objection: >-
      The kbli-navigator lib test (apps/kbli-navigator/lib/__tests__/kbli-data.test.ts) had its
      count pins hand-updated by inspection (mirroring the identical, verified pin update in the
      sibling mouth test), but could not be RUN in this environment — no npm test script is
      registered for that app, and an ad-hoc `node --import tsx --test` invocation failed on
      unrelated module-path resolution, not on the assertion itself.
    status: PLAUSIBLE
    resolution: >-
      Left standing and labelled. Not in this lane's explicit required-checks list (filiera
      pytest + mouth vitest/tsc are); the pin values (839/720) are the same measured numbers
      verified live via the mouth/backend suites and the canonical Counter(), so the edit is
      almost certainly correct, but "almost certainly" is not "verified running" and is recorded
      as such.
