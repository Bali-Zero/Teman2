    status: verified
    probe: "python3 -c: compare the raw Bali-axis match (no no_legacy_pma_prose filter) against R.eligible() with the full lot-2 rule"
  - text: >-
      `data/kbli-filiera/batch-reports/batchA-calibration*` and the MEMBERSHIP (not the pin) of
