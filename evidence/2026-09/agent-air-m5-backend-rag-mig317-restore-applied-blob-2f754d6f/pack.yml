  failure this PR cures.
dissent:
  - seat: claude-sonnet-5 (this build lane)
    status: CONFIRMED
    objection: >-
      council quorum R9 seat_override — no second independent seat (Codex/Kimi/Qwen/GLM/
      Gemini) was dispatched against this hot-zone-floored pack. Rationale: the coordinating
      session named Codex unreliable tonight (arsenal), and the change is a byte-exact
      restore proven mechanically (git hash-object equality against two recorded blob
      SHAs), not a judgment-dependent design choice a second reviewer would meaningfully
      contest. Disposed by the coordinating session (team-lead/nuzantara-8d, GARUDA
      imperator), acting on its own verified root-cause analysis of the v4476 failure.
  - seat: claude-sonnet-5 (this build lane)
    status: CONFIRMED
    objection: >-
      lesson: a migration's text must never change after it has been applied on PROD. The
      317 file's checksum is written once at first apply and is descriptive metadata in
      this codebase's runner (migrate.py's `_is_applied()` keys on migration_name, not
      checksum, so a re-run of apply-all does not re-execute or re-validate the SQL) — but
      `schema_audit` DOES compare the stored checksum against the file on disk, and that
      comparison is what gates the Fly release_command. #6687's lock-retry cure, however
      well-intentioned, rewrote an already-applied migration's SQL instead of extending the
      shared runner — the correct home for retry/backoff mechanics that apply to every
      migration, not just this one. This PR reverts the text; the retry logic belongs in a
      follow-up PR against the runner, not the migration file.
