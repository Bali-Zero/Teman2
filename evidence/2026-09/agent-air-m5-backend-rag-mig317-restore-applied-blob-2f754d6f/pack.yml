    Two files reverted to their e8348e28f1 blobs: the 317 migration SQL and its existing
    static test file. Net diff is negative (removes #6687's added lock-retry/backoff logic
    and its corresponding test assertions), no new file, no new table, no new endpoint.
    This pack itself (evidence/brief.yml, evidence/pack.yml) is a separate, docs-only
    commit on top of the revert.
  measured_at: >-
    git diff --stat / --numstat against origin/main, this session, after the revert commit
    landed (2f754d6f32) — see the floor receipt below for the exact invocation.
