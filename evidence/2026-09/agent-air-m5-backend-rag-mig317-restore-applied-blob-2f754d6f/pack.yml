outcome: >-
  Migration 317's SQL and its static test file are restored byte-exact to the blobs PROD
  already ran (e8348e28f1): git hash-object on both files matches the recorded blob SHAs
  exactly. Against a throwaway PostgreSQL 17.10 cluster bootstrapped and migrated the CI
  way (ci_bootstrap_schema.py then `migrate apply-all`), the ledger carries 317 from the
  restored blob and `schema_audit` exits 0 with no migration_checksum_mismatch. Swapping
  origin/main's post-#6687 text (blob 64acc85e) back into the file and re-running
  schema_audit against the SAME ledger reproduces the v4476 failure exactly — exit 1,
  naming migration 317's checksum mismatch, recomputed vs. stored checksum both printed —
  before the file was restored to the correct blob again. pytest on the test file passes
  (6/6), ruff check is clean, and `git status --short` shows only the two intended files
  changed. The lock-retry fix that motivated #6687 does not ship here; it belongs in the
  shared migration runner, in a separate PR, per the coordinating session's direction — a
  migration's text must never change after it has been applied.
