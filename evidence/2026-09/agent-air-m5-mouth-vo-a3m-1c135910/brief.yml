  an automated verdict", false since A1'/A3-B made most disclosures
  conditions on an automated result rather than a human hold, and
  `why.review_gate` still claimed only the immigration-history items map to
  an engine fact. M1 adds the three REVIEW_FLAG_MAP keys; M2 rewrites the
  two pinned tests that asserted the old "no" to prove BOTH channels (fact +
  disclosure) fire from the same walk; M3 zeroes the backend orphan census
  (test_review_hold_inventory.py); M4 adds the three NOTICE_CONDITION_COPY
  entries the backend already emits (A3-B put them in
  `_DISCLOSED_CONDITION_REASON_CODES`); M4-bis adds a guard that the copy
  table carries no code the backend cannot emit and that the one
  unreachable-by-construction exception (ACTIVITY_BOUNDARY, HOLDING-only)
  is named and justified, not silently absent; M5 extends the
  guard-over-match scan to the two review-gate strings (38 entries, was
  28); M6 rewrites both strings and pins the retired sentence's absence;
  M7 adds the three REVIEW_GATE_CAUSE_ITEM rows for the "edit your answer"
  affordance; M7-bis (routed from a conductor ruling on the builder's own
  finding, R-CONTINUE-A3M 2026-09-20T22:27Z) adds two tests deriving
  coverage of every REVIEW_GATE_CAUSE_ITEM row from REVIEW_GATE_ITEMS and
  evaluate_path.py rather than the 4-example it.each the file's own comment
  overstated — zero production files touched. The gate on that head
  (GATE-A3M-REPORT-6998.md) returned REWORK-BUILD: OBS-A3M-1 (HIGH) found
  all ten of M4/M6's visitor-facing strings diverged from
  DRAFT-SPEC-A3-1.v2-M §2, restored here byte-for-byte, extracted and
  planted by script, never hand-typed; OBS-A3M-2 (MEDIUM) proved false the
  builder's own claim that M7-bis's ADD-direction gap was architecturally
  uncatchable without a production change — M7-ter closes it with a
  TEST-ONLY source-text enumeration of REVIEW_GATE_CAUSE_ITEM's keys
  (conductor ruling R-REWORK-A3M 2026-09-20T23:12Z).
