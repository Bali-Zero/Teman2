dissent:
  - seat: "gate-wrapper (claude-opus-5, independent on-disk gate)"
    objection: >-
      Superseding with a `--search` predicate that includes a
      `type(scope):` conventional-commit prefix matches nothing on GitHub
      — GitHub's PR search ignores punctuation inside `in:title`, so a
      prefixed predicate is a silent no-op inherited from the reference
      wrapper this one was modeled on. Every nightly run would open a new
      promote PR without ever closing the previous one, recreating the
      exact "two authors overwrite each other" defect this PR exists to
      cure, one PR at a time instead of one commit at a time.
    status: CONFIRMED
    resolution: >-
      Cured in commit 1851cb5da0 — the search predicate is now words-only.
      Verified independently in this pack's own receipts: the prefixed
      form returns zero merged PRs against a query the words-only form
      returns five for, on the same live repo.
  - seat: "gate-wrapper (claude-opus-5, independent on-disk gate)"
    objection: >-
      Pro's main checkout keeps a dirty, stale docs/AUTOMATIONS_REFERENCE.md
      that the puller's keep-local allowlist preserves, masking main's real
      copy after the switch to the generator-owned nightly regen — an
      operator looking at Pro's working tree would see a file that no
      longer matches what main actually carries.
    status: CONFIRMED
    note: >-
      Not cured in this diff — it is a Pro-side install-time condition
      (a dirty file already sitting in that checkout), not something this
      PR's own commits can fix from M5. Follow-up at install time: restore
      the file on Pro from origin/main before/when the new plist is
      bootstrapped, and consider retiring the keep-local allowlist entry
      that lets it drift again. Not ledgered as a PENDING-ARMS row by this
      lane, since the fix is an operator action at deploy time rather than
      a future code change; flagged here so the deploying session does not
      skip it.
  - seat: "gate-wrapper (claude-opus-5, independent on-disk gate)"
    objection: >-
      `_check_log_health_pro` will run over 24 more matagaruda jobs after
      the companion PR #6171 lands (the generator's expanded scheduled-
      workflows/plist tables), and may emit new warnings on the first
      night this cron actually fires against the enlarged output.
    status: PLAUSIBLE
    note: >-
      Not verified either way — this pack cannot observe a run that has
      not happened yet. Accepted as a plausible first-night risk rather
      than dismissed; the heartbeat this wrapper emits (`pro.automations_reference`)
      is exactly the mechanism that would surface it if it materializes,
      per cicatrix-superscar #2 (monitor outcome, not exit code).
