task_id: automations-nightly-promote
gear: 3
l_level: L2
gate_class: opus
objective: |
  Give `docs/AUTOMATIONS_REFERENCE.md` a single generator with a nightly
  cron instead of two authors overwriting each other's regen.

  GROUND: PENDING-ARMS (row "two authors", 2026-09-11) recorded that
  `docs/AUTOMATIONS_REFERENCE.md` was being regenerated by more than one
  writer with no ordering between them, so whichever ran last silently won
  and the loser's changes vanished with no conflict ever surfacing. The
  decision this PR ships: the generator (`scripts/generate_automations_reference.py`,
  built in the companion PR #6171) is the SOURCE OF TRUTH, run nightly from
  ONE isolated worktree, and its output promoted as a docs-only PR with
  auto-merge armed — no human, and no second writer, in the loop.

  Deliverables: `scripts/automations-reference-cron-wrapper.sh` (regen in
  an isolated worktree, promote as a docs-only PR, supersede any older
  open promote PR so the queue never accumulates stale duplicates, emit a
  `pro.automations_reference` heartbeat so silence is visible per
  cicatrix-superscar #2 "esiste != armato"); `infra/launchagents/com.nuzantara.automations-reference.plist`
  (repo-canon LaunchAgent, 23:15 daily, no `KeepAlive`/`RunAtLoad` — a
  one-shot regen job, not a long-running daemon, per superscar #7); the
  matching `infra/home-fork/declared-pairs.json` entry (machine: Pro) so
  `lint_home_fork.py` tracks the live plist against this repo copy; and
  the `apps/organism/organism/organs_registry.yaml` repoint + checksum
  recompute so the organism registry names the real organ.

  Gear 3 by PATH: the diff touches `infra/launchagents/` and
  `apps/organism/organism/organs_registry.yaml`, both hot-zone paths.
  Floor is deterministic and CI-recomputed (measured 3, source "path",
  in this pack's receipts and independently by `Harness floor recompute`
  on this PR's own head SHA), not the author's choice.
constraints:
  - "The wrapper never touches the primary checkout at `~/nuzantara` —
    regen runs in an isolated worktree per Agent Worktree Discipline
    (cicatrix-superscar #5 sibling-race), so a concurrent interactive
    session and the nightly cron can never collide on the same tree."
  - "The plist ships as a one-shot: `KeepAlive` and `RunAtLoad` both
    absent/false, `StartCalendarInterval` at 23:15 — a regen job that
    finishes is not a crash (superscar #7 KeepAlive misconfig)."
  - "No hardcoded credential. `gh` invocations rely on the ambient CLI
    auth already present on the runner; nothing in the wrapper or the
    plist carries a token literal."
  - "The promote PR must supersede any PRIOR open promote PR for the same
    doc, or the merge queue accumulates duplicate regens forever — the
    search predicate for 'prior open promote PR' must actually match what
    GitHub indexes (see the acceptance probe below; the first cut of this
    search matched nothing, cured in 1851cb5da0)."
  - "generator != grader: this wrapper posts no verdict of its own; a
    Gear-3 verdict on this diff is for an independent adjudicator, not
    this lane."
acceptance:
  - text: "WHEN the generator produces a diff against the live doc, THE
      wrapper SHALL commit, push, open a PR and arm auto-merge, and emit a
      heartbeat with status ok."
    probe: "scripts/tests/test_automations_reference_cron_wrapper.sh (scenario: changed)"
  - text: "WHEN the generator produces no diff, THE wrapper SHALL release
      the worktree without pushing or opening a PR, and emit a heartbeat
      noting no change."
    probe: "scripts/tests/test_automations_reference_cron_wrapper.sh (scenario: no change)"
  - text: "IF the generator fails, THE wrapper SHALL release the worktree,
      never invoke gh, and emit a heartbeat with status error."
    probe: "scripts/tests/test_automations_reference_cron_wrapper.sh (scenario: generator failure)"
  - text: "IF the push fails, THE wrapper SHALL name the failing return
      code in its log, exit non-zero, and never invoke gh."
    probe: "scripts/tests/test_automations_reference_cron_wrapper.sh (scenario: push failure)"
  - text: "IF `gh pr create` fails after a successful push, THE wrapper
      SHALL leave the pushed branch in place, never attempt `gh pr merge`,
      and emit a heartbeat with status error."
    probe: "scripts/tests/test_automations_reference_cron_wrapper.sh (scenario: gh pr create failure)"
  - text: "IF auto-merge fails to arm after a successful PR create, THE
      wrapper SHALL still exit 0 (the PR exists and is recoverable by a
      human) but emit a heartbeat with status degraded."
    probe: "scripts/tests/test_automations_reference_cron_wrapper.sh (scenario: auto-merge does not arm)"
  - text: "WHEN searching for a prior open promote PR to supersede, THE
      search predicate SHALL be words-only (no `type(scope):` conventional-
      commit prefix), because GitHub's PR search ignores punctuation
      inside `in:title` and a prefixed predicate silently matches zero
      PRs."
    probe: "scripts/tests/test_automations_reference_cron_wrapper.sh (scenario: changed — supersede --search assertion) + gh pr list --search comparison in this pack's receipts"
  - text: "THE plist SHALL lint clean under plutil and carry neither
      KeepAlive=true nor RunAtLoad=true."
    probe: "plutil -lint infra/launchagents/com.nuzantara.automations-reference.plist && python3 scripts/lint_plist_keepalive.py"
  - text: "THE repointed organism entry SHALL validate against the organs
      registry schema with a recomputed checksum."
    probe: "python3 -m organism.tools.validate_organs_registry organism/organs_registry.yaml"
