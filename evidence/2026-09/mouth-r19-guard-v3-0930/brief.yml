module_mutants:
  script: evidence/2026-09/mouth-r19-guard-v3-0930/mutate_module.py
  total: 76
  killed: 76
  history: "first full run 77 patterns, 23 survived and 12 were broken by reformatting; each survivor was a missing row (theme( with no var, ';' inside unquoted url(), non-utility bracket token, template head/tail in class position, false ternary branch, computed string key, comparison operand, ternary condition, left of &&, type nodes, at-rule statement, object keys per mode, template join, css comment inside a block) and each got a row, never a weakened one; the loader-export survivor was a test that matched too loosely (now /no longer exports/)."
  equivalent_mutant_removed: "custom-property key kebab-casing (`--x` is kept by the `--` prefix either way; the judged property is identical), so no table row can tell them apart."
grader: Not asserted by the author — a fresh gate re-runs the tables, the mutants and the innocence scan. Generator is not grader.
