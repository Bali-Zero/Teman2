  the source of those chats and line 256 pairs [CLIENT-B] with numeric id 6087, so 6087 stayed
  re-identifiable after #7468's merge. The same 3 names/1 phone also sat in
  `scripts/wa_corpus/prompt_master.py`, `prompt_variants.py`, `tests/wa_corpus/test_doc_title.py`
  and `tests/wa_corpus/test_reconcile.py`). Cured in this pack: all 5 files' client
