  document's own screenshot evidence) carries `contact_type='client'` in `whatsapp_contacts`, a
  pre-existing data-quality mistag on that one row, not a client-PII exposure introduced here — and
  the two numeric client_ids (5730, 6087) stay per Builder Contract §4's pseudonym allowance.
