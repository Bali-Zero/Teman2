  verified synthetic regex-test examples (a sequential placeholder "+62.812.345.678" demonstrating a
  detector bug, and "KTPnya/KTPpun <token>" NIK-detector test cases) — left unredacted, not client PII.
  (2) A PII output-boundary breach during #7453's review: `.claude/scripts/codex-spalla.sh:277`
  embeds a raw `git diff HEAD | head -1000` into the prompt sent to a cloud LLM (OpenAI), and the
