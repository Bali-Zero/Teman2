  residual inside the diff's own reach: the corpus-miner md itself still named [CLIENT-A]'s real
  company in clear at line 156, adjacent to the very paragraph [CLIENT-A] already redacts — cured
  with a new `[CLIENT-A-CO]` placeholder, same `adversarial_review: exempt-redaction-edit`
  convention, R1 gate re-verified PASS. Everything else the sweep found repository-wide is
  disclosed, not fixed, as out of scope below (dictionary/stoplist noise and one unrelated
  pre-existing file).
  The deletions, .gitignore and the REST of the md redaction are byte-identical to #7468's head.
  #7468 (v4) superseded #7462 (v3 of this lane; gate found F1 blocking — brief.yml listed the
  four redacted client first names in clear, in the same order as the md's [CLIENT-A..D]
  placeholders, a de-anonymisation key — and F2 minor — brief/pack undercounted the md's
  team-line phone numbers as two when it has three — both cured in #7468, unchanged here).
  #7462 itself superseded #7453 (gate verdict REWORK-BUILD, three defects). (1)
  Residual client PII on main
  outside this lane's original scope: research/wa-copilot/2026-05-25-eval-set-v1.jsonl (50
  client_full_name values + 49 client WhatsApp message bodies, added by commit 9ee0ca260f) — now
  quarantined and removed alongside the six files from #7453. Two adjacent research/operations/
  docs were also triaged for client-row CRM phone numbers per the gate's flag:
  2026-06-04-wa-corpus-miner-session-report.md carried four client first names ([CLIENT-A], [CLIENT-B],
  [CLIENT-C], [CLIENT-D]) and four client-associated phone numbers in prose — redacted to placeholders,
