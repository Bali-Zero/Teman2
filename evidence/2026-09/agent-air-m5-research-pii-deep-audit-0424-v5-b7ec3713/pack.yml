  - seat: "opus-5-5-gate (fresh session, M5, PR #7453 independent Gear-3 gate)"
    objection: >-
      Client PII sent in cleartext to a cloud LLM during #7453's review: codex-spalla.sh embeds a
      raw diff into its Codex prompt with no redaction pass, and the #7453 dispatch carried 959
      deleted plan.jsonl lines (969 full_name records) to OpenAI. Undisclosed in that PR's pack.
    status: CONFIRMED
  - seat: "opus-5-5-gate (fresh session, M5, PR #7453 independent Gear-3 gate)"
    objection: >-
      pack.yml's seat_override in #7453 declared net churn 1871, but the CI-equivalent size term
      on the mb-to-head numstat measures 1963 (1871 omitted the pack.yml file's own 92 lines) —
      a false countable claim, though the gear conclusion (3) was unaffected either way.
    status: CONFIRMED
  - seat: "opus-5-5-gate (fresh session, M5, PR #7462 independent Gear-3 gate)"
    objection: >-
      F1 (blocking): #7462's evidence/.../brief.yml listed the four redacted client first names in
      clear, in the same order as the md's [CLIENT-A..D] placeholders — a de-anonymisation key for
      the redaction, even though the pack/body/commit/.gitignore carried 0 names. Cured in this
      pack: the four names replaced with [CLIENT-A..D] placeholders, 0 occurrences verified.
    status: CONFIRMED
  - seat: "opus-5-5-gate (fresh session, M5, PR #7462 independent Gear-3 gate)"
    objection: >-
      F2 (minor): #7462's brief/pack said "two team-line phone numbers" kept in the corpus-miner md;
      the md at head has three distinct team numbers (2 E.164 + 1 without a leading '+' inside a
      Doc title). Cured in this pack: count corrected to three, verified against PROD
      whatsapp_contacts (see receipts).
    status: CONFIRMED
  - seat: "opus-5-5-gate (fresh session, M5, PR #7468 independent Gear-3 gate)"
    objection: >-
      G1 (blocking): scripts/wa_corpus/query_lab.py's GROUND_TRUTH dict — tracked on origin/main
      since 2026-06-17 (#1099), outside every prior diff in this chain — carried 3 client first
      names in clear (matching 3 of the 4 the corpus-miner md redacts as [CLIENT-A/B/C]), 3 E.164
      phones (one matching the md's own redacted [CLIENT-PHONE-C]), 3 company names and case
      details; 2/3 name-phone pairs and 2/3 companies matched real PROD rows. The md's own line
      192 cites query_lab.py as the source of those chats, and line 256 pairs [CLIENT-B] with
