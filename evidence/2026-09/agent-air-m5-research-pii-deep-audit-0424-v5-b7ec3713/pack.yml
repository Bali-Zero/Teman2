      Residual client PII left on origin/main outside #7453's original scope:
      research/wa-copilot/2026-05-25-eval-set-v1.jsonl (50 client_full_name values, 49 client
      WhatsApp message bodies), plus two research/operations/ docs needing triage for client-row
      CRM phone numbers in prose.
