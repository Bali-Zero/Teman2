diff:
  behaviour_change: >-
    Deletes seven client-PII data files from a public repo: the six from #7453 (3 jsonl under
    research/compliance/deep_audit_2026-04-24/, 3 xlsx at research/compliance/ root) plus
    research/wa-copilot/2026-05-25-eval-set-v1.jsonl (client_full_name + client WhatsApp message
    bodies, added by commit 9ee0ca260f). Redacts four client first names and four client-associated
    phone numbers (in prose, not structured columns) from
    research/operations/2026-06-04-wa-corpus-miner-session-report.md, keeping its three distinct
    team-line phone numbers (2 E.164 + 1 without a leading '+' embedded in a Doc title) and two
    numeric client_ids intact, with `adversarial_review: exempt-redaction-edit`
    frontmatter added. Leaves research/operations/2026-08-15-adr-wa-runtime-openai-provider.md
    untouched (its phone-shaped tokens verified as synthetic regex-test examples, not client data).
    No code behaviour changes: the consumer scripts referencing the deep-audit paths
    (scripts/crm_guardian_apply.py, scripts/crm_guardian_deep_audit.py) are untouched, unchanged
    from #7453's disclosed deviation. Extends .gitignore with a pattern for the wa-copilot
    eval-set shape alongside the two patterns from #7453.

    NEW this pack (G1 cure): replaces 3 client first names, 1 client phone and 3 client company
    names with synthetic fixtures (`Client Alpha/Beta/Gamma`, `PT Contoh Alpha/Beta/Gamma`,
    `+6281234567890`-style ascending numbers) across `scripts/wa_corpus/query_lab.py`,
    `prompt_master.py`, `prompt_variants.py`, `tests/wa_corpus/test_doc_title.py` and
    `test_reconcile.py`. `query_lab.py`'s real `GROUND_TRUTH` (needed to score against real
    indexed NLM sources) moves to a NEW untracked, gitignored `scripts/wa_corpus/_ground_truth_local.py`
    (0600 on disk, never staged), loaded at runtime with an `ImportError` fallback to the
    synthetic fixtures — a behaviour change to `query_lab.py`'s import surface, none to any other
    script. `tests/wa_corpus` (42 passed, 1 skipped) stays green. Also redacts one further residual the G1
    sweep surfaced inside the corpus-miner md itself (not previously flagged): [CLIENT-A]'s real
    company name in clear at line 156, replaced with a new `[CLIENT-A-CO]` placeholder — same
    `adversarial_review: exempt-redaction-edit` convention, R1 gate re-verified.
  surface: >-
    research/compliance/, research/wa-copilot/, research/operations/ (redaction only),
    scripts/wa_corpus/ (query_lab.py, prompt_master.py, prompt_variants.py, plus a new
    untracked/gitignored local file), tests/wa_corpus/ (test_doc_title.py, test_reconcile.py) +
    .gitignore + this evidence pack. No backend service, no frontend, no migration, no
    credential. Supersedes PR #7468 (v4 of this lane, gate verdict REWORK-BUILD on a new finding,
    G1: residual client PII in scripts/wa_corpus/ tracked since 2026-06-17, outside every prior
    diff in this chain). #7468 (v4) superseded #7462 (v3, gate verdict REWORK-BUILD on the
    evidence only: F1 brief.yml de-anonymisation key of the four redacted client names, F2
    undercounted team-line phone numbers). #7462 itself superseded #7453 (gate verdict
    REWORK-BUILD: residual PII outside original scope, an undisclosed PII cloud-egress during
    review, and a false countable claim in the prior pack).

