dissent:
  - seat: codex-gpt-6-astra
    objection: "runbook-section-numbers.yml pull_request.paths omitted scripts/tests/conftest.py, which pytest loads for that test: a PR touching only the conftest could deselect the test (reproduced in-memory, exit 5) and the workflow would no longer run pre-merge."
    status: CONFIRMED
    disposition: "Cured in 45be30dce0 and finalised in 48d9a76166: scripts/tests/conftest.py + scripts/tests/__init__.py (the only conftest/package files pytest actually loads, measured with --trace-config) added to the paths of the four path-narrowed workflows whose pytest runs under scripts/tests/ (runbook-section-numbers, docs-guardian, docs-sync, worker-plane-review-tests; token-lint and verify-the-verifiers already listed the conftest); the speculative entries for non-existent conftests added in 45be30dce0 were removed again in 48d9a76166. Accepted limit: for docs-guardian, docs-sync and worker-plane-review-tests the in-job sentinel regex ignores conftest, so a conftest-only PR now starts the job but the sentinel closes it green — identical to main before this PR (pre-existing, not a regression); changing sentinel steps is out of this PR's scope and stops at fix depth 1. Latent, non-blocking: a PR that CREATES a root conftest.py or scripts/conftest.py would be loaded by pytest (rootdir = repo root) without starting runbook-section-numbers or token-lint pre-merge; neither file exists today."
  - seat: kimi-code/k3
    objection: "Header comments still described the old per-push trigger (voa-probe-tests.yml:31-39, asyncpg-lint.yml:5/11, token-lint.yml:22): misinform a human reader, remove no verification."
    status: CONFIRMED
    disposition: "Cured in 48d9a76166 (comments only)."
  - seat: kimi-code/k3
    objection: "worker-plane-review-tests, docs-guardian and docs-sync sentinels use git diff --no-renames (the latter two via hotzone_changed_files.sh) (sees the old path of a rename) while GitHub's paths filter matches both sides of a rename — not expressible in a glob."
    status: PLAUSIBLE
    disposition: "Accepted limit, symmetric to the pre-existing behaviour: a rename touching those paths still matches GitHub's filter on either side, so the job starts; the sentinel then decides as it did before."
