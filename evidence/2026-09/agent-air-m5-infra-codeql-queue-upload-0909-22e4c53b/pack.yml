dissent:
  - seat: kimi-code/k3 (cross-family)
    status: CONFIRMED
    objection: >-
      OK, no BLOCK. One non-blocking nit: shipped comment/docstring said "4
      of the 14" while the brief said "10 of 54" — CURED in this revision
      (security.yml:719-724, test_codeql_queue_upload_never.py:1-9). Also
      raised and self-resolved a Dependabot read-only-token question:
      confirmed the diff makes no behavioural change there since the
      non-merge_group branch equals the action's pre-existing default.
  - seat: codex-gpt-5.6-sol (cross-family)
    status: CONFIRMED
    objection: >-
      Took three attempts to reach a formal verdict (full transcripts in
      council-journal.jsonl). Attempt 1 exhausted its token budget before a
      closing line, surfacing no defect in what it did check. Attempt 2
      correctly BLOCKed on a real, but self-inflicted, problem: the diff
      snapshot pasted into that prompt was captured before the build lane's
      "4 of 14" → "10 of 54" accuracy fix landed, so the reviewer was handed
      internally contradictory evidence and rightly refused to pass it —
      confirming the guard reviewers exist to catch exactly this class of
      staleness, even when the staleness is in the review harness rather
      than the code. Attempt 3, given a diff snapshot regenerated against
      the corrected working tree, delivered VERDICT: OK with the same four
      questions answered as kimi's independent pass. CONFIRMED because a
      real (process) defect was found and cured, not because the PR's code
      itself had one.
  - seat: claude-sonnet-5 (this worktree session — the builder's own standing objection)
    status: PLAUSIBLE
    objection: >-
      The way this cure could be wrong, stated plainly: it assumes every
      merge_group failure with this signature is this exact cause, and that
      no other job in the merge-queue path independently needs the SARIF
      upload from THIS step. Both were checked (10/10 failures matched the
      literal error line; the required-check set is job-conclusion-only,
      confirmed live by kimi), so the residual risk is narrow: a future
      required check added on the code-scanning alert itself (not the job)
      would silently stop being satisfied under merge_group. Nothing in this
      repo does that today, and the guard test would need a companion pin if
      one ever does — out of scope for this PR's budget, noted here so it
      isn't rediscovered the hard way.
