outcome: >-
  Under merge_group, the CodeQL analyze step still runs the full python/
  javascript analysis (a real build/query failure still reds the job and
  blocks the queue) but never attempts the SARIF upload that was racing
  against the deleted queue ref. Every other event (pull_request, push,
  schedule, workflow_dispatch) keeps uploading exactly as before — the
  expression's else-branch (`always`) is the action's own pre-existing
  default, so behaviour there is unchanged by construction, not just by
  intent. The two unrelated Snyk upload-sarif steps in the same workflow
  were checked and are unaffected (already continue-on-error: true).
diff:
  files: 3
  net_lines: >-
    Measured via `git diff --numstat origin/main...HEAD` (merge-base
    a09b4b4ea25b773558166547485e238603ed9796, NOT the two-dot diff against
    origin/main's current tip, which is polluted by unrelated commits that
    landed on main after this branch forked): .github/workflows/
    immune-enforcement.yml +2, .github/workflows/security.yml +9,
    scripts/tests/test_codeql_queue_upload_never.py +71 new file. The
    evidence/ directory this pack lives in is committed separately, after
    this numstat was taken. Floor is `path` (hot-zone
    .github/workflows/**), not size.
  measured_at: >-
    `git diff --numstat $(git merge-base origin/main HEAD)..HEAD` in this
    worktree at commit 0418396463. Note for reviewers: the two-dot
    `git diff origin/main..HEAD` briefly appeared to show far more churn
    because origin/main advanced with an unrelated window_jump.sh rewrite
    after this branch forked — the merge-base (three-dot-equivalent) numstat
    above is the correct measure and is what's reported here.
  shape: >-
    One `with.upload` line + a 6-line comment on the analyze step, one line
    each in immune-enforcement.yml's sentinel-path list and pytest battery,
    one new 71-line test file. No other step's body changes.
behaviour_change: >-
  YES, CI-visible, narrow: under merge_group only, the analyze step's SARIF
  upload sub-step no longer runs (so it can no longer fail on a deleted
  queue ref); the analysis itself, and every other event's upload, are
  unchanged. The `antidotes` required check now also runs on a diff that
  touches only the new guard test (sentinel-path addition).
