decisions:
  - id: D-gear
    decision: >-
      Gear DECLARED 3; the deterministic floor computed by
      evidence_pack_lint.py --print-floor on the merge-base diff is 2, source
      "size" (11 files, +588/-79 on the shipped head; no hot-zone path).
      Declared gear is max(judgement, floor) and the judgement is 3 because
      the window brief declares it: the diff lands under apps/backend-rag/**,
      where merging IS the deploy. A two-seat council (codex-gpt-5.6-sol,
      tp1-qwen3.8-max) was then run for real on the merge-base diff; each
      seat's stdout is filed under council/ and the journal is council_run.
  - id: D-net-lines
    decision: >-
      Net +509, above the contract's "≤ ~400 net lines where the work allows".
      Declared rather than split. The excess is one file's PROSE - the census
      module docstring carries the two measured census tables, the per-flag
      rewrite table and the retired bound, and eight of the thirteen council
      findings were corrections to exactly that prose. Splitting it out would
      mean shipping the numbers in a PR body instead of next to the assertion
      that produces them, which is the failure mode this window exists to end.
      The executable change is small: one emitted field, one keyword-only
      parameter, one pinned frozenset, three pinned tables and eight tests.
  - id: D-kimi-unavailable
    decision: >-
      The third roster seat, kimi-code/k3, is QUOTA-EXHAUSTED for the month
      and was not invoked at all. Quorum is met with the two remaining
      roster seats; no line was written on Kimi's behalf.
  - id: D-omit-when-empty
    decision: >-
      The fixture omits `disclosed_review_flags` when the walk raises none,
      instead of always emitting an empty list. Two reasons, in this order.
      (1) Contract: `api_models.py::VisaOracleEvaluateRequest` gives the field
      a default of `()` precisely so a request without the key stays
      wire-compatible, so an absent key IS the empty tuple on the real
      boundary, not an unknown. (2) Collision: the window brief requires the
      schema field to keep existing fixtures byte-stable or to serialize
      behind W-VO-E, which regenerates the same corpus; `gh pr list --search
      vo-e-reach --state open` showed no W-VO-E PR to base on, so byte
      stability was the available option. It holds - 8 fixtures changed, 76
      byte-identical. The encoding is NOT a silent default: the determinism
      test binds every committed byte to the generator, and
      EXPECTED_DISCLOSED_REVIEW_FLAGS pins the exact flag-carrying SET with a
      both-directions comparison plus a "no fixture carries the field at all"
      assertion that goes red if the generator ever stops emitting it.
  - id: D-runner
    decision: >-
      The flags are threaded through `gold_coverage_eval._evaluate` as a new
      keyword-only parameter defaulting to `()`, re-validated through
      `VisaOracleEvaluateRequest`, rather than passed straight into
      `apply_public_policy_adapters`. Reason - the census must not
      re-implement "evaluate": sharing the one path with the coverage floor
      and the gold replay is what stops those gates drifting on what the word
      means. Re-validating instead of injecting means an unknown flag name in
      a fixture is a loud ValidationError, never an ignored string.
      `gold_coverage_eval.py` is a script under `backend/scripts/**`; nothing
      under `backend/services/**` is touched, so the runtime service that the
      merge deploys is byte-identical.
  - id: D-derived-census
    decision: >-
      `EXPECTED_FLAGGED_STATE_CENSUS` is DERIVED from `EXPECTED_OUTCOME` plus
      the flag table, not pinned as a third hand-maintained number. The
      derivation is the claim under test - a flagged walk ends
      HUMAN_REVIEW_REQUIRED whatever the pack decided, an unflagged walk keeps
      its engine state - so the test goes red on a monotonicity break without
      anyone re-pinning a count, and a wave PR edits one table instead of two.
  - id: D-council-round1
    decision: >-
      Council round 1 (codex-gpt-5.6-sol, VERDICT DEFECT, LOW): the new
      docstring said no corpus walk answers `unsure` to a sponsor question,
      contradicting the two NOT_CERTAIN rows the same diff pins. True claim is
      narrower - neither of the two questions AMBIGUOUS_SPONSOR actually reads
      (`family_sponsor_status_code` / `family_sponsor_confirmed`) is answered
      `unsure`; the two walks answer `work_sponsor_confirmed` and
      `sponsor_category`, which raise the generic NOT_CERTAIN. Fixed at depth
      1, prose only, and the council re-run.
  - id: D-council-round2
    decision: >-
      Council round 2 (codex-gpt-5.6-sol, VERDICT DEFECT, LOW): the round-1
      correction was confirmed accurate, but a SECOND sentence in the same
      docstring - the "chosen sample, not a cover" bound, inherited unchanged
      from origin/main - still said "no walk ever answers `unsure`". That
      stopped being true when PR-D3 and PR-D4d added the two sponsor_unsure
      walks. This is a distinct finding at a distinct location, not a
      correction of the round-1 correction, so it is a depth-1 fix of its own.
      Fixed, prose only; round 3 returned VERDICT OK.
  - id: D-council-later-rounds
    decision: >-
      Thirteen council rounds ran in total (codex 7, qwen 6) because each
      round found something the previous one had not, and every finding after
      the first two came from a seat reading a diff the other seat had already
      passed. The sequence, all recorded in council/journal.jsonl with the head
      each seat judged: qwen-1 found two in-file comments still asserting the
      retired bound, plus "for years" and an absolute "unconditional"; codex-4
      found the unconditionality correction applied at one site and missed at
      three, plus the "still_unsure costs zero holds" overclaim; codex-5 found
      the per-flag table naming HUMAN_REVIEW, a state that does not exist;
      qwen-5 found the real one - the by-hand request rebuild bound to nothing.
      Three of the thirteen were the SAME cause from one seat and are marked
      as such (see D-qwen-artifact). Both seats returned VERDICT OK on the
      shipped head 51b35715d0.
  - id: D-qwen-artifact
    decision: >-
      tp1-qwen3.8-max rounds 2 and 4 both returned DEFECT on a claimed
      IndentationError in the `flagged_outcomes` fixture decorator. REJECTED
      both times, with evidence, not with an opinion: the character it read as
      a leading space is the unified diff's own `+` column; `ast.parse` on the
      file returns without error; the module collects and passes; and
      codex-gpt-5.6-sol executed the tests directly and reported the same
      count. Round 4 re-raised it after being told this, which is the same
      cause twice from one seat - so the INSTRUMENT was corrected rather than
      the code: round 5 was given the real bytes of that file region alongside
      the diff, dropped the finding, and found a genuine defect instead. Round
      6 records the reading withdrawn as a paste artifact. No line was written
      on the seat's behalf and no round was hidden.
  - id: D-derivation-corrected
    decision: >-
      The grounding report (scratchpad/r3/vo-coverage.md SS B4) predicted "2
      corpus walks raise a flag in production", marked derived-not-executed.
      Executed, it is 8. The derivation reasoned only about the generator's
      first-option default and missed the scenario OVERRIDES, which answer
      `investment_vehicle` with merit/family/undecided and `other_purpose`
      with medical - none of them in
      `ACTIVITY_BOUNDARY_DECIDABLE_ANSWERS`. Recorded in the census docstring
      so the next reader inherits the corrected number, not the derivation.
