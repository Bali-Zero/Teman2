dissent:
  - seat: codex-gpt-5.6-sol (council round 1)
    objection: >-
      The added census prose claimed no corpus walk answers `unsure` to a sponsor question,
      while EXPECTED_DISCLOSED_REVIEW_FLAGS in the same diff pins two walks that do exactly
      that (offshore/other/paid/sponsor_unsure, offshore/work/sponsor_unsure).
    status: CONFIRMED
    cure: >-
      The sentence now names the two questions AMBIGUOUS_SPONSOR actually reads
      (family_sponsor_status_code / family_sponsor_confirmed), states that the two walks
      answer work_sponsor_confirmed and sponsor_category instead, and that what they raise
      is the generic NOT_CERTAIN already counted in the table. Prose only; no table,
      fixture or assertion moved. Council re-run on the corrected diff.
  - seat: codex-gpt-5.6-sol (council round 2)
    objection: >-
      A second sentence in the same docstring - the "chosen sample, not a cover" bound,
      inherited verbatim from origin/main - still said "no walk ever answers `unsure`",
      contradicting the same two rows.
    status: CONFIRMED
    cure: >-
      Restated as "first option unless the scenario overrides it, and exactly two of the 84
      walks answer the literal `unsure`", naming the rows. A pre-existing false claim, but
      one this PR's own table refutes, so leaving it would have shipped a visible
      contradiction. Prose only; round 3 returned OK.
  - seat: Claude Opus 5 (self-refutation, on the omit-when-empty encoding)
    objection: >-
      An absent `disclosed_review_flags` key is indistinguishable, read alone, from a
      fixture generated before this field existed - the classic silent-default shape
      (cicatrix #2). A census that reads the default would go green over a corpus that
      quietly lost the layer.
    status: PLAUSIBLE
    cure: >-
      Not cured by always emitting the field - that was traded away deliberately for the
      byte stability the brief asks for (D-omit-when-empty). Cured by three guards
      instead - walk-corpus-determinism.test.ts makes a fixture that disagrees with the
      generator by one byte impossible to commit;
      test_the_corpus_carries_the_disclosure_flag_layer asserts the flag-carrying SET
      equals the pinned table in BOTH directions AND that at least one fixture carries the
      field at all, so a generator that stopped emitting it fails loudly instead of
      silently; and the two guilt tests prove a lost flag and a gained flag are each
      caught. Codex round 3 attacked this claim specifically and did not break it.
  - seat: tp1-qwen3.8-max (council round 5)
    objection: >-
      `_evaluate`'s by-hand rebuild of `VisaOracleEvaluateRequest` names five fields and
      nothing binds that list to the model. A sixth field added later would be dropped
      from every FLAGGED evaluation and stay silent, because
      `_apply_disclosed_review_flags` overwrites candidates, missing facts, no-path
      reasons and quotes anyway - and the innocence test cannot see it either, since
      unflagged walks never enter the rebuild.
    status: CONFIRMED
    cure: >-
      The seat's own proposed remedy, in both places a red could usefully appear: a pinned
      `_REBUILT_REQUEST_FIELDS` frozenset checked at the rebuild site, raising a
      RuntimeError that names both sets, and
      `test_the_flagged_rebuild_names_every_field_of_the_wire_model`, which fails at test
      time without needing a flagged walk to run. Guilt checked by injecting a sixth name
      into the pinned set - `_evaluate` raises on the first flagged walk.
  - seat: tp1-qwen3.8-max (council rounds 2 and 4)
    objection: >-
      "The added `@pytest.fixture(scope=\"module\")` line for `flagged_outcomes` carries a
      stray leading space, an IndentationError that stops the entire census module from
      collecting, so every funnel measurement in this PR fails to run."
    status: RETRACTED
    cure: >-
      REJECTED with evidence, twice, and finally withdrawn by the seat itself in round 6
      as "a paste artifact". The character read as a leading space is the unified diff's
      own `+` column. `ast.parse` on the file returns without error; the module collects
      and passes; codex-gpt-5.6-sol executed the tests directly and reported the same
      count. Because the same seat re-raised it after being told, the INSTRUMENT was
      corrected rather than the code: round 5 received the real bytes of that file region
      alongside the diff, dropped the finding, and found a genuine defect instead.
  - seat: Claude Opus 5 (self-refutation, on what the funnel census proves)
    objection: >-
      The FUNNEL census counts 8 human-review walks and could be read as "8 applicants in
      84 are held in production". It is not that - the corpus is a chosen enumeration that
      answers every question with its first option unless a scenario overrides it. Nine of
      the eleven flags rewrite ZERO walks here, including MULTI_PURPOSE_TRIP, which fires
      on an ordinary answer every real two-purpose visitor gives.
    status: CONFIRMED
    cure: >-
      Stated in the docstring where the numbers are, not in a PR body that no future
