gear: 3
task_id: notify-seat-consumer-3
lane: infra
host: air-m5 (M5)
branch: agent/air-m5/infra/notify-seat-consumer-3
gate_class: opus
l_level: L2
objective: >-
  PR #6973 gave tg_notify a fourth tier: a p0 whose dedup-key is not an
  OWNER_FAMILY stops reaching Telegram and lands on shared/escalations_pro.jsonl
  as `type=gateway_routed, cure_lane.owner=seat, priority=NORMAL`. Measured in
  this turn over `~/.organism/tg_spool/archive-p0.jsonl` on Pro, 30 days to
  2026-09-21: 314 p0, of which 286 take the routed path and 28 still page the
  owner. NOTHING drained the 286 — so #6973 had moved the noise from Telegram
  onto the board every session reads at SessionStart, rather than removing it.
  This PR ships the consumer that closes what it can PROVE is over, plus the
  launchd organ that runs it (a future cron is not a consumer).
scope:
  - >-
    scripts/board_seat_consumer.py — reads the board through
    sentinel_lib.escalations, collapses per job (the board is append-only:
    mark_resolved appends rather than rewrites, so a per-line status filter
    reports a healed job open forever), and applies one cure per dedup-key
    FAMILY, matched as an entity and never as a substring.
  - >-
    Cure `cron-fail:<job>` — closes when the job's own run-state file
    (~/.agent/decisions/state/<job>.last.json, written by the cron runner and
    therefore an independent witness) says status=ok with a ts NEWER than the
    alert. Simulated over the same 30-day archive in this turn: 65 of Pro's 124
    cron-fail rows read that way right now. No action is taken — the row is
    stale, and saying so with its proof is the cure.
  - >-
    Cure `healer-pro|healer-mini:stale-lock` — the healer's pidfile outlived its
    run and its pid was recycled, so every 4h tick since has skipped while
    reporting itself GREEN (superscar #2). The alert text names the cure itself
    (`rm -f /tmp/nuzantara-healer.pid`) and Zero has run it by hand 13 times in
    30 days. Removed here only after THIS process re-probes: pid dead, or alive
    with a command line that is not a healer. Undecidable refuses.
  - >-
    infra/launchagents/{com.nuzantara.board-seat-consumer.plist,
    wrappers/pro-board-seat-consumer.sh} + organs_registry entry + the two
    declared HOME pairs — the organ, born through scripts/organ_birth.py so it
    carries the ten genes the conformance gate checks. Its heartbeat note
    carries closed/left/seen, not just a pulse: an organ reporting "ok" hourly
    while closing nothing is the exact shape this consumer exists to drain.
  - >-
    scripts/tests/test_nlm_alarm_gateway.py — re-tightens the pin #6973
    loosened (see constraints).
constraints:
  - >-
    NO BLIND KICKSTART — and the reason is NOT that nobody could. Checked in
    this turn rather than repeated from the 2026-08-28 research note, which
    says `recovery_action` is "unconsumed by any continuous loop": that is no
    longer true. `apps/cell/cell/main.py` runs with actuators
    (`organism/actuators/fly_machines_start.py`, the restart-agent label
    resolver) and `cell.organism`'s sidecar on Pro reads `pulse_count: 4489,
    status: ok` right now. The registry declares a recovery_action for 181
    organs, 167 of them `launchctl_kickstart`. The reason this consumer does
    not restart is what the RESTART would meet: every healer tick that found a
    `dead` organ root-caused it and refused, correctly — iqoo_radar_relay was
    failing on `Permission denied (publickey)`, which a kickstart reproduces
    identically — and the measured causes behind these routed rows are missing
    credentials, exhausted quota and declared needs-rulings. A restart that
    does not cure is a green run that fixed nothing.
  - >-
    A family with no registered cure stays pending and is COUNTED. Closing a row
    to make the board shorter is the failure mode, not the goal. Measured: the
    largest non-cron families have no seat cure at all — `imigrasi-diff` (28/30d
    on Mini) is a digest travestied as p0, `journey-sentinel` (34) is a declared
    needs-ruling, `sentinel:quota_exhausted` says in its own text that no
    operator action fixes it.
  - >-
    Locality. The board is ONE git-tracked file shared by three checkouts; a row
    whose `machine` is not this host is never cured here (superscar #10).
  - >-
    Nothing in PR #6973's contract is touched: priority stays NORMAL, the six
    gateway verdicts are unchanged, OWNER_FAMILIES and TG_ACT_ROUTING_ENABLED
    are untouched, and the board's fail-OPEN is untouched.
  - >-
    TG_BOARD_PATH is NOT used by the new suite. It overrides the gateway's board
    for a whole process and has already turned 21 unrelated gateway tests red;
    the fixture monkeypatches the library's own file map instead.
  - >-
    Fail-open everywhere: unknown row shapes, an unreadable probe and an
    exception inside the run all exit 0 with the board untouched. A launchd
    organ that dies stops draining and nobody notices.
acceptance:
  - text: >-
      GUILT: WHEN a cron-fail row's job has since reported ok, the row SHALL be
      closed by a resolution carrying the SAME job (no reader collapses the pair
      otherwise) and the proof SHALL name the run-state file.
    probe: >-
      python3 -m pytest scripts/tests/test_board_seat_consumer.py::test_a_cron_that_recovered_is_closed_with_its_proof
  - text: >-
      INNOCENCE, three ways: a job still failing, a job whose last ok PREDATES
      the alert, and a job with no run-state file at all SHALL all stay open.
    probe: >-
      python3 -m pytest scripts/tests/test_board_seat_consumer.py -k "still_failing or predates or no_run_state"
  - text: >-
      ENTITY, NOT SUBSTRING: `cron-failure:` and `xcron-fail:` both contain the
      family name and SHALL match no cure.
    probe: >-
      python3 -m pytest scripts/tests/test_board_seat_consumer.py::test_the_family_is_matched_as_an_entity_not_as_a_substring
  - text: >-
      THE STALE LOCK, both sides: a recycled pid SHALL lose its pidfile; a LIVE
      healer SHALL keep it (removing it lets a second 4h session start beside
      it); an undecidable pid SHALL refuse to cure.
    probe: >-
      python3 -m pytest scripts/tests/test_board_seat_consumer.py -k "recycled or live_healer or undecidable"
  - text: >-
      SCOPE: only gateway_routed rows owned by the seat lane are touched — a
      HIGH owner=session row and a lane-less row SHALL be invisible to it — and
      an already-resolved job SHALL NOT be picked up again.
    probe: >-
      python3 -m pytest scripts/tests/test_board_seat_consumer.py -k "seat_owned or already_resolved"
  - text: >-
      BOUNDARIES: a foreign machine's row SHALL be left alone, --dry-run SHALL
      mutate neither board nor filesystem, the cap SHALL report what it skipped,
      the kill switch SHALL stop the run, and a raising run SHALL still exit 0.
    probe: >-
      python3 -m pytest scripts/tests/test_board_seat_consumer.py -k "another_machine or dry_run or cap or kill_switch or broken_row"
  - text: >-
      THE RE-TIGHTENED PIN: a routed p0 SHALL land on the board and NOT on the
      spool, and an OWNER_FAMILY p0 SHALL still go out and NOT to the board.
    probe: >-
      python3 -m pytest scripts/tests/test_nlm_alarm_gateway.py::test_a_routed_p0_lands_on_the_board_and_NOT_on_the_spool
  - text: >-
      WHERE the pin lives, there SHALL be no regression: the 21 tests that go
      red when TG_BOARD_PATH is exported for a whole run stay green.
    probe: python3 -m pytest scripts/tests/test_nlm_alarm_gateway.py
  - text: >-
      WHEN the organ is born, it SHALL carry its genes and the registry SHALL
      still validate.
    probe: >-
      python3 infra/organ-conformance/check_organ_conformance.py &&
      PYTHONPATH=apps/organism python3 -m organism.tools.validate_organs_registry
      apps/organism/organism/organs_registry.yaml
council_findings: >-
  Eleven accepted, every one pinned by its own case: the cap starved curable rows behind permanently
  uncurable ones; a condition that re-fired between probe and close was silenced; a naive-ISO or
  non-numeric state ts, and an unreadable ALERT ts, both read as recoveries (ts_epoch orders junk as
  0.0, which is smaller than every state ts); a state file whose own job/host named a stranger closed
  the row anyway; a run-state dated in the future closed it forever; the dedup-key's job half was
  interpolated into a path, so `cron-fail:../..` escaped the state dir; the pidfile was not re-read
  between the liveness probe and the unlink; an empty-but-successful `ps` was read as "not a healer";
  a resolution keyed on `job` alone silenced the same job pending on another machine; and each healer
  family needed its OWN lock (healer-run.sh holds /tmp/nuzantara-healer.pid, pro-healer.sh holds
  /tmp/nuzantara-pro-healer.pid — one shared default read "already gone" on the machine that does not
  own that path). Test count went 16 -> 35. The last one arrived after the previous PR was already armed and frozen: the machine field is normalised by the gateway (split on '.') and was not by the consumer, which would have turned every row foreign the first time macOS returned a .local name. That cost PR #6988 rather than being fixed in place, which is the arming contract working as designed.
mutation_evidence: >-
  Run in this turn, not asserted, restored from `cp` backups and never from
  `git checkout --`. (1) Consumer: dropping `state_ts > row_ts` from the
  cron-fail cure AND deleting the locality guard turned the suite to 2 failed /
  14 passed — exactly `predates_the_alert` and `another_machine`, the two
  guards removed, with every innocence test still green. (2) Pin: restoring the
  bare `glob("*.jsonl")` in `_spooled` turned
  `test_a_routed_p0_lands_on_the_board_and_NOT_on_the_spool` red and nothing
  else — the helper had genuinely stopped distinguishing board from spool.
pii: >-
  none. The consumer reads dedup-keys, job names and run-state files; error
  summaries already on the board are not re-emitted anywhere, only counted.
predecessor: >-
  PR #6984, same work, closed rather than fixed in place: auto-merge had been
  armed at open, which freezes the branch, and two deterministic checks were
  red — `expected_hb_seconds=3600` against the organ's own `StartInterval=3600`
  (a self-reporting cron needs 2x for severity=warning), and a gear-3 diff
  carrying `evidence/brief.yml` without `evidence/pack.yml`. Both are fixed
  here; nothing else changed.
local_evidence: >-
  The 314/286/65/124 figures were computed in this turn by reading
  ~/.organism/tg_spool/archive-p0.jsonl and ~/.agent/decisions/state/*.last.json
  over ssh on Pro, and the Mini family counts likewise on Mini — no credential
  read, no client data, no production write. The live board on both H24 machines
  currently holds ZERO gateway_routed rows (`grep -c` in this turn), so the
  first rows this organ drains will be the ones the fleet writes after it lands.
