dissent:
  - seat: session (self-refutation against the mandate's own wording, RESOLVED by measurement)
    objection:
      "The mandate asked for a seat that runs OPERATIVE cures — 'relaunch a cron, clean a disk,
      restart a worker'. Taken literally that is a relauncher, and the measurement says a relauncher
      would cure almost nothing: wa_codex_seat_sentinel and sentry-quota-check fail on missing
      credentials, nextdns-weekly-digest on an unbound variable, the NB pipelines repeatedly, and
      imigrasi-diff is not a fault at all. A relaunch reproduces each of those."
    status: CONFIRMED
    resolution:
      "Built what the distribution supports instead: close the transient that already recovered (65
      rows, an independent witness, zero side effects) and run the ONE operative cure the alerts
      themselves name (`rm -f` the healer pidfile, 13 owner hand-cures in 30 days). The registry is
      a dict — adding a third family is one function plus its guilt/innocence pair."
  - seat: session (declared limit, unresolved)
    objection:
      "The stale-lock cure has never been exercised against a REAL occurrence. /tmp/nuzantara-healer.pid
      does not exist on Mini right now (checked this turn) and Pro's healer is a different organ, so
      both sides of that cure are proven only on fixtures with _pid_is_a_live_healer monkeypatched."
    status: PLAUSIBLE
    resolution:
      "Left standing and labelled. The refusing branches are the conservative ones — an undecidable
      or live pid never cures — so the untested path can at worst do nothing. The first real
      occurrence will show in the organ's own log and sidecar note."
  - seat: session (declared limit, unresolved)
    objection:
      "The organ is born on Pro only. Mini carries 101 p0/30d of its own, and its two biggest
      families (journey-sentinel 34, imigrasi-diff 28) have no cure here either way, but its 9
      cron-fail rows and its own healer stale-lock — the 13-occurrence family — are on MINI, not Pro.
      The cure with the most owner-visible value is armed on the machine that needs it least."
    status: CONFIRMED
    resolution:
      "Declared rather than smuggled in: a second node means a second plist, wrapper, registry entry
      and declared pair, and the PR contract asks for one concern. Pro is first because it carries
      74% of the routed volume and 100% of the provable cron-fail closures. The Mini twin is the
      immediate follow-up and is named in the PR body, not left to memory."
  - seat: session (declared limit)
    objection:
      "The 65-closable figure is a snapshot taken 30 days after the fact: it counts rows whose job's
      LAST run is ok now. The consumer will run hourly, so its real hit rate could be higher (jobs
      that recovered and later failed again would have been closed in between) or lower. The state
      file keeps only the last run, so no better retrospective number exists."
    status: PLAUSIBLE
    resolution:
      "Labelled as a lower bound on a retrospective read, not a forecast. The organ's sidecar note
      carries closed/left/seen every run, so the true rate becomes observable within a day of
      arming instead of being argued about."
