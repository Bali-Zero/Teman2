brief_ref: evidence/brief.yml
plan_ref:
  "Lane INFRA NOTIFY-ROUTING, mandate from Zero 2026-09-21: cut the notifications that
  reach the owner, send the rest to LLM seats that ACT. PR-1 = #6973 (merged, the gateway's
  fourth tier). This is PR-2, the consumer that closes what #6973 routed. PR-3 (WhatsApp
  transport for the ~28 survivors) is blocked on a Meta UTILITY template approval, an owner
  GUI action, and must not precede this one."
lanes:
  - lane: notify-seat-consumer
    role: build
    seat: >-
      claude-opus-5 (conducting session — measured the p0 archive on both H24 machines, chose the
      two cures the measurement supports, wrote the consumer, the organ, the suite and this pack)
  - lane: notify-seat-consumer-review-k3
    role: review
    seat: >-
      kimi-code/k3 (dispatched on the FINISHED diff and told to attack it, not confirm it — six accepted
      findings, one rejected with evidence; see council-journal.jsonl)
  - lane: notify-seat-consumer-review-sol
    role: review
    seat: >-
      codex-gpt-5.6-sol (same diff, read-only sandbox; it ran eleven adversarial rows through the module
      rather than reasoning about it — eleven confirmed false cures, two of them found by nobody else)
pii_scan: clean
seat_diversity: satisfied
seat_diversity_note: >-
  Two non-Anthropic review families on the finished diff, neither of which wrote a line of it
  (generator is never grader). This was not a formality: between them they found eleven ways the
  consumer closed a row it had not proved — including a cap that would have starved every curable row
  behind the permanently-uncurable ones, which would have made the organ green and useless within
  weeks. The first draft of this pack declared `not_applicable` and said a mutation settles everything
  a second family could; that claim is now falsified by its own record and is left here rather than
  deleted.
diff:
  net_lines: >-
    11 files changed, 1468 insertions(+), 5 deletions(-) measured by `git diff --shortstat $(git merge-base origin/main HEAD)..HEAD` — the lint's own formula, not the three-dot shorthand. About half of those lines are
    tests. Zero frontend, zero workflow, zero migration. One new Python organ, one launchd plist +
    wrapper generated by scripts/organ_birth.py, one registry entry, two declared HOME pairs.
  behaviour_change: >-
    A new hourly launchd organ on Pro reads the escalation board and appends a `resolved` row for
    routed entries whose condition it can prove is over; it removes a stale healer pidfile when and
    only when no live healer holds it. It never writes an alert, never restarts a service, never
    touches a row from another machine, and never closes a row it cannot prove. Nothing in #6973's
    contract moves.
