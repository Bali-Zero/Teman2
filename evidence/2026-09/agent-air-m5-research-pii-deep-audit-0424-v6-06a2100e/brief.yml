gear: 3
gear_reason: >-
  Deterministic floor 3, source size, computed on the FINAL commit (all 17 changed paths, including
  this brief and pack): `evidence_pack_lint._size_term_net_lines` on the `git diff --numstat` of the
  merge-base to this exact commit = 2463 (548 insertions + 1915 deletions across 17 files, 3 of them
  binary xlsx contributing 0 line-counted churn) — above SIZE_GEAR3_THRESHOLD (1828), same order of
  magnitude as #7472's own 2349, #7468's own 2126, #7462's own 2086 and #7453's own 1963 (all
  smaller evidence packs). `--print-floor`/`--print-floor-source` on this numstat/changed-files
  pair independently return 3/size. No hot-zone path (research/, scripts/wa_corpus/,
  tests/wa_corpus/, scripts/crm_guardian_phase15_pilot.py + .gitignore only).

appetite:
  wall_clock_hours: 1
  adversarial_rounds: 0

acceptance:
  A1: >-
    None of the seven files (3 jsonl + 3 xlsx + 1 wa-copilot jsonl) is tracked on origin/main after
    merge.
    probe: >-
      git ls-tree -r --name-only origin/main research/compliance | grep -c -E '\.xlsx$|deep_audit_2026-04-24'; git ls-tree -r --name-only origin/main research/wa-copilot | grep -c eval-set
  A2: >-
    A file matching each producer's output pattern is ignored, and the two legitimate sibling files
    (research/wa-copilot's baseline-snapshot.md, research/compliance's tracked .md reports) are not.
    probe: >-
      git check-ignore -q research/compliance/deep_audit_2026-04-24/plan.jsonl && git check-ignore -q research/compliance/crm_guardian_plan.xlsx && git check-ignore -q research/wa-copilot/2026-05-25-eval-set-v1.jsonl && ! git check-ignore -q research/wa-copilot/2026-05-25-baseline-snapshot.md
  A3: >-
    The redacted corpus-miner report carries zero residual client-name or client-phone tokens
    (including the newly-cured company token), and passes the R1 adversarial-review gate.
    probe: >-
      python3 scripts/check_adversarial_review.py --files research/operations/2026-06-04-wa-corpus-miner-session-report.md
  A4: >-
    tests/wa_corpus stays green after the fixture swap, and query_lab.py's GROUND_TRUTH resolves
    to the real dict when the untracked local file is present and to the synthetic fixtures when
    it is absent (both branches exercised).
    probe: >-
      python3 -m pytest tests/wa_corpus -q
  A5: >-
    scripts/crm_guardian_phase15_pilot.py carries 0 residual client-name tokens after the cure,
    keeps its numeric client_ids unchanged, and still runs (--help exits clean, ast.parse succeeds).
    probe: >-
      python3 -c "import ast; ast.parse(open('scripts/crm_guardian_phase15_pilot.py').read())" && python3 scripts/crm_guardian_phase15_pilot.py --help

out_of_scope: >-
  scripts/crm_guardian_apply.py and scripts/crm_guardian_deep_audit.py hardcode the deep-audit repo
  paths as their I/O contract (disclosed deviation, unchanged from #7447/#7453). Fixing
  codex-spalla.sh's raw-diff-to-cloud exposure (Builder Contract §4) is a separate lane's mandate,
  not this one's. research/operations/2026-08-15-adr-wa-runtime-openai-provider.md's synthetic
  phone-shaped examples are left as-is (verified not client PII). Git history on origin/main still
  holds all seven original blobs plus the four now-redacted tokens (plus the newly-redacted company
  token) in the corpus-miner report's prior revisions; a rewrite is a separate operator decision
  (§Solo-operatore). DISCLOSED, NOT FIXED (new this pack): a repo-wide token sweep for the 4 md
  names + 3 query_lab company names found only dictionary/stoplist noise (a common-Italian-names
  list in apps/backend-rag/backend/services/memory/collective_memory_workflow.py) and unrelated
  coincidental collisions (an academic paper co-author sharing [CLIENT-A]'s first name, a
  competitor business sharing [CLIENT-C]'s first name, and two unrelated third-party strings
  each coincidentally containing the same two-word substring as [CLIENT-B]'s company — none the
  client from this lane) — EXCEPT one:
  `docs/archive/2026-07-orphans/superpowers/specs/2026-04-01-gemini-profil-perseroan-prompts.md`
  line 75 lists a full name paired with a company and a Drive link that may be a real client
  record; this file predates this whole audit chain (2026-04-01, orphaned 2026-07), is unrelated
  to wa_corpus/G1, and is left untouched here — a candidate for a separate lane's mandate, not
  redacted in this PR to avoid unauthorised scope expansion into a file nobody asked this lane to
  touch.

  DISCLOSED, NOT FIXED (new this pack, severity HIGH): the same 6 client_ids/7 names redacted from
  `crm_guardian_phase15_pilot.py` remain in clear, PROD-matched, across 9 other pre-existing files
  this lane was not asked to touch and does NOT fix here — flagged for a dedicated follow-up given
  a materially different risk profile than a docstring redaction:
  (1) `apps/backend-rag/backend/services/crm_guardian/prompts/L1_extraction_v3.md` and `_v4.md`
  embed one of the names as a live few-shot example; `schemas.py:392` defaults every PRODUCTION
  extraction call to `L1_extraction_v3` TODAY, so this is an ACTIVE cloud-LLM egress of a real
  client's full name on every such call, not merely a git-history residual — the single most
  urgent item in this list, but changing a live prompt's example risks changing extraction
  behaviour and needs its own validated PR, not a point-redaction bundled here.
  (2) `apps/backend-rag/scripts/fix_lkpm_orphans_batch1.py` (tracked since 2026-04-08) hardcodes a
  13-entry director/commissioner dataset with full names, nationalities, emails, phones AND
  PASSPORT NUMBERS in cleartext Python source — a materially more severe exposure class than
  anything else found in this whole PII-removal chain, and one-off/data-fix in nature (the names
  may be load-bearing lookup keys for the script's own idempotency logic — verified but not
  touched: redacting them without checking every call site risks silently breaking the fix).
  (3) `docs/scars/cicatrix-scars-archive.md` and `docs/superpowers/plans/2026-05-16-crm-guardian-activation-phase1.md`
  document the same real names/ids as historical audit/scar records — this repo's own convention
  treats scars as permanent institutional memory, so redacting them is a policy question, not a
  mechanical one.
  (4) `scripts/crm_guardian_gemini_cli_worker.py` (a code comment), `scripts/_redact_pii.py` (a
  code comment) and `scripts/test_redact_pii.py` + `apps/backend-rag/backend/tests/unit/services/mail_loop/test_loop.py`
  (test fixtures, 9+2 occurrences) also carry one of the names — lower severity (test-only /
  comment-only) but same real-name-in-clear class.
  None of these 9 files is touched by this PR. All are PROD-verified via a `SELECT id, full_name
  FROM clients WHERE id IN (...)` returning 6/6 exact matches to the docstring this PR redacts.

