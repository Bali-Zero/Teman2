task: >-
  v6, supersedes #7472 (v5 of this lane). Found by the gate on #7470 (a different, parallel PR's
  gate run also surfaced this): `scripts/crm_guardian_phase15_pilot.py`'s docstring listed 6
  audited `client_id`s next to their real full names in clear — tracked on origin/main since this
  file was added, outside every prior diff in this chain. Verified against PROD `clients.full_name`:
  6/6 exact matches. Cured in this pack: the docstring's names replaced with synthetic
  `Client P1..P7` labels (7 people across 6 ids — one id covers a two-person household), the
  numeric ids and case-annotation comments kept unchanged (ids alone are not client-identifying
  without CRM access); no other code or test in the repo references these names (verified by
  git grep before and after), so no untracked-local-file relocation was needed here, unlike
  query_lab.py's GROUND_TRUTH. The whole-tree sweep this pack ran for these 7 names (git grep,
  full tracked tree) found 0 residual inside `scripts/crm_guardian_phase15_pilot.py` after the
  cure, but a LARGE, SEVERE, PRE-EXISTING exposure elsewhere that this pack does NOT fix (out of
  scope for this lane, see `out_of_scope`/`unresolved` below) — most urgently, one of the same 7
  names sits as a live few-shot example inside `L1_extraction_v3.md`, the prompt template
  `schemas.py:392` currently defaults every production extraction call to, meaning a real client's
  full name is sent to the cloud LLM on every such call today, not just committed to git history.
  #7472 (v5) superseded #7468 (v4 of this lane; fresh Gear-3 gate found F1/F2 cured but
  REWORK-BUILD on
  a NEW finding, G1: `scripts/wa_corpus/query_lab.py`'s `GROUND_TRUTH` dict — tracked on
  origin/main since 2026-06-17, #1099, outside every prior diff in this chain — carried 3 client
  first names in clear (the same 3 of the 4 the corpus-miner md redacts as [CLIENT-A/B/C]), 3
  E.164 phones, 3 company names and case details; the md's own line 192 cites `query_lab.py` as
  the source of those chats and line 256 pairs [CLIENT-B] with numeric id 6087, so 6087 stayed
  re-identifiable after #7468's merge. The same 3 names/1 phone also sat in
  `scripts/wa_corpus/prompt_master.py`, `prompt_variants.py`, `tests/wa_corpus/test_doc_title.py`
  and `tests/wa_corpus/test_reconcile.py`). Cured in this pack: all 5 files' client
  names/phones/companies replaced with synthetic fixtures (`Client Alpha/Beta/Gamma`, `PT Contoh
  Alpha/Beta/Gamma`, ascending `+6281234567890`-style numbers) while `tests/wa_corpus` stays green
  (`python3 -m pytest tests/wa_corpus -q` — see acceptance A4); `query_lab.py`'s real
  `GROUND_TRUTH` (needed to score against real indexed NLM sources) moved to an untracked,
  gitignored `scripts/wa_corpus/_ground_truth_local.py` (0600, loaded at runtime with an
  ImportError fallback to the synthetic fixtures — verified both branches import cleanly).
  A full-repo token sweep for the 4 md names + 3 query_lab company names found one ADDITIONAL
  residual inside the diff's own reach: the corpus-miner md itself still named [CLIENT-A]'s real
  company in clear at line 156, adjacent to the very paragraph [CLIENT-A] already redacts — cured
  with a new `[CLIENT-A-CO]` placeholder, same `adversarial_review: exempt-redaction-edit`
  convention, R1 gate re-verified PASS. Everything else the sweep found repository-wide is
  disclosed, not fixed, as out of scope below (dictionary/stoplist noise and one unrelated
  pre-existing file).
  The deletions, .gitignore and the REST of the md redaction are byte-identical to #7468's head.
  #7468 (v4) superseded #7462 (v3 of this lane; gate found F1 blocking — brief.yml listed the
  four redacted client first names in clear, in the same order as the md's [CLIENT-A..D]
  placeholders, a de-anonymisation key — and F2 minor — brief/pack undercounted the md's
  team-line phone numbers as two when it has three — both cured in #7468, unchanged here).
  #7462 itself superseded #7453 (gate verdict REWORK-BUILD, three defects). (1)
  Residual client PII on main
  outside this lane's original scope: research/wa-copilot/2026-05-25-eval-set-v1.jsonl (50
  client_full_name values + 49 client WhatsApp message bodies, added by commit 9ee0ca260f) — now
  quarantined and removed alongside the six files from #7453. Two adjacent research/operations/
  docs were also triaged for client-row CRM phone numbers per the gate's flag:
  2026-06-04-wa-corpus-miner-session-report.md carried four client first names ([CLIENT-A], [CLIENT-B],
  [CLIENT-C], [CLIENT-D]) and four client-associated phone numbers in prose — redacted to placeholders,
  frontmatter `adversarial_review: exempt-redaction-edit` added (same convention as #7411); the three
  distinct team-line numbers in the same prose (2 E.164 + 1 without a leading '+' embedded in a Doc
  title) are left untouched — verified against PROD `whatsapp_contacts`: Adit's trap-number line and
  the Doc-title number both carry `contact_type='team'`; Surya's own line (confirmed by the
  document's own screenshot evidence) carries `contact_type='client'` in `whatsapp_contacts`, a
  pre-existing data-quality mistag on that one row, not a client-PII exposure introduced here — and
  the two numeric client_ids (5730, 6087) stay per Builder Contract §4's pseudonym allowance.
  2026-08-15-adr-wa-runtime-openai-provider.md's phone-shaped tokens are
  verified synthetic regex-test examples (a sequential placeholder "+62.812.345.678" demonstrating a
  detector bug, and "KTPnya/KTPpun <token>" NIK-detector test cases) — left unredacted, not client PII.
  (2) A PII output-boundary breach during #7453's review: `.claude/scripts/codex-spalla.sh:277`
  embeds a raw `git diff HEAD | head -1000` into the prompt sent to a cloud LLM (OpenAI), and the
  #7453 review sent 959 deleted plan.jsonl lines (969 full_name records) in cleartext. The two M5
  transcripts are quarantined by the gate session. This PR does NOT dispatch codex-spalla.sh or any
  external seat against this diff — disclosed as a withdrawn review in pack.yml's dissent, with R9
  quorum skipped via seat_override. A separate lane fixes the script itself.
  (3) pack.yml's `seat_override` in #7453 understated net churn (1871 vs the CI-measured 1963,
  missing pack.yml's own 92 lines) — this pack's churn is computed on the FINAL commit, after every
  file (including this brief and pack) is staged, not before.
