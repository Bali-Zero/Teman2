diff:
  files: "4 files: 1 code file (.github/workflows/tests.yml) + this evidence trio (brief.yml, pack.yml, council-journal.jsonl)"
  net_lines: >-
    Deliberately carries no line or commit counts: the linter's countable-claims rule re-measures
    `git diff --numstat $(git merge-base origin/main HEAD)..HEAD` and `git rev-list --count`, and
    every fix commit to this very pack changed both numbers (the first draft narrated a commit count
    and a line total, and went red on both). What the reader needs is the shape, not the digits: the code
    file carries every deletion (a python3 -c one-liner replaced by a heredoc, and the `|| 'false'`
    fallbacks tightened) and roughly a third of the insertions (two new job outputs, one new
    non-required visibility job); the evidence trio is pure addition. The exact numbers are the
    tool's to compute at check time, and they are printed in the Harness floor job log.
  behaviour_change: >-
    Adds two new job outputs to the `changes` job (classifier_trusted, override_active) and a new
    non-required job (classifier-corpus-visibility) that fires only when the trusted-classifier
    corpus/extraction failed and the manual override was not used; publishes classifier_trusted in
    the step-summary markdown. Converts the "Compute static test-impact map" step's
    `python3 -c '...'` one-liner to a `python3 - <<'PY'` heredoc (behaviourally identical, fixes a
    latent SyntaxError on Python < 3.12). Adds two documentation-only comments (Frontend Tests
    diagnosis, cancel-in-progress audit) with no behavioural change. No other job, required
    context, or branch-protection/ruleset setting touched.
