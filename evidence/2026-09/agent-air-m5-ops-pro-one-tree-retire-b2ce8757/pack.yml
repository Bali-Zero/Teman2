diff:
  net_lines: >-
    35 files, +604/-194 measured by `git diff --numstat $(git merge-base origin/main HEAD)..HEAD`.
    16 plists, 4 installers, 2 wrappers, 4 runtime scripts, 1 declared-pairs note, 1 plist
    deleted, 2 ledger rows, and the evidence directory (brief, pack, council journal and the
    two council seats' verdicts).
  behaviour_change: >-
    Eighteen LaunchAgents change the directory they execute from. No agent gains or loses a
    schedule, a KeepAlive, an environment variable other than a path, or a privilege. One
    deleted plist (the deploy tree's own puller) was already disabled. runtime-reconcile
    changes WHICH tree it asserts on and gains a regression guard; it can still only exit
    non-zero under STRICT=1.
