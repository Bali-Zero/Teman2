appetite_exceeded: |
  Both ceilings (1 hour, 1 round) doubled. The single biggest cost was the codex-gpt-5.6-sol
  council seat: its background run took roughly 18 minutes exploring unrelated repo context
  (CLAUDE.md, the modus SKILL.md, army-map.md) rather than staying scoped to the review prompt,
  then crashed inside its own read-only sandbox attempting to run pytest itself, without ever
  returning a verdict on the diff — recorded in the dissent/journal as unusable rather than
  silently retried or omitted. The second round (path-filter fix + re-verification after both
  usable seats independently converged on the same finding) is the other real cost, and is the
  kind of overrun this pack would rather record than absorb: an appetite set from "one workflow
  file, a few paths" could not price a seat that goes off-task, nor a genuine two-seat
  convergence on a gap this session's own first draft missed.

seat_fallback_reason: |
  council_run counts one fallback seat (agy-gemini-3.1-pro) toward quorum alongside one titolare
  (kimi-code/k3). The titolare actually attempted first, codex-gpt-5.6-sol, was observed
  unavailable in the sense that matters here — not a quota/auth error, but a run that never
  returned a scoped verdict on this diff (see the codex council_unusable journal entry and the
  dissent entry above). tp1-qwen3.8-max, the remaining titolare, was not attempted: two council
  seats were dispatched in parallel to bound wall-clock cost once codex was clearly not going to
  finish inside the appetite, and both returned real, independently-converging findings, which
  this session judged sufficient rather than dispatching a third seat for its own sake.

