dissent:
  - seat: codex-gpt-5.6-sol (cross-family, on head 5fe5316c12)
    status: CONFIRMED
    objection: >-
      BLOCK, one objection, correct and cured. The PR claimed to protect against
      another doctrine move, but the pull_request sentinel used `git diff
      --name-only`, which with rename detection on prints only a rename's
      DESTINATION path. Renaming docs/rules/RULINGS.md to any other name would
      therefore show the sentinel a path its regex does not know, the suite would
      not run, and the PR that moved the ruling would be green exactly as the diet
      PR was. CURED: the sentinel passes --no-renames, the flag is asserted by the
      pin, and both halves are proven by mutation. The seat also raised two things
      NOT cured here and recorded instead: push.paths' own rename behaviour is
      GitHub's to define and was not measured (the local measurement covers the
      sentinel only), and it proposed dropping the push paths filter entirely,
      which is a larger workflow decision than this PR's concern.
  - seat: kimi-code/k3 (cross-family, on head 5fe5316c12)
    status: CONFIRMED
    objection: >-
      OK overall, one objection worth acting on: the new pin matched the SPELLING
      of the trigger entries anywhere in the YAML, so it false-greens when the
      entry is deleted and left as a comment, and false-reds on a semantically
      inert re-quoting. The false-green half is CURED — comments are stripped
      before matching, proven by a mutation that would have passed before. The
      false-red half is ACCEPTED and documented in the test itself: a behavioural
      check would want to parse the YAML, the runner installs only pytest, and
      adding a PyYAML dependency to a workflow whose whole point is to be cheap is
      a worse trade than a five-second fix on a re-quoting nobody is planning.
  - seat: claude-opus-5 (this worktree session — the builder's own standing objection)
    status: PLAUSIBLE
    objection: >-
      The way this cure could be wrong, stated plainly: it makes the guard depend
      on a FILE LOCATION, and file locations in this repo move — that is the whole
      story of this PR. If §5 is split or renamed again, the same class of failure
      returns; what this PR buys is that it would then go red in the PR that does
      it rather than on main hours later. The alternative designs were considered
      and rejected: searching several candidate files would let doctrine live in
      two places and diverge silently, and restoring the sentence in CLAUDE.md
      would undo the diet deliberately taken on 2026-09-04. The deeper fix both
      review seats independently pointed at is a generic lint — for every test a
      workflow executes, every file that test reads must appear in that workflow's
      triggers — which would catch this class at the next guard's birth instead of
      at its first break. That is a separate PR and is not claimed here. Second
      open item: the launcher docstring's stale "CLAUDE.md §5" pointer stays
      stale, because correcting it moves line numbers that
      test_detect_secrets_auto_triage.py pins.
