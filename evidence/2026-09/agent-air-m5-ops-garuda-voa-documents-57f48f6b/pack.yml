residual_risks:
  - >-
    THE PRIMARY BLOCKER IS NOT CURED IN THIS PR. Migration 304 cannot currently be
    applied by the real production migration-runner role: it DROP/ADD CONSTRAINTs
    visa_decision_retention_policies (owned by visa_ledger_owner, backend_rag_v2 holds
    only SELECT) and inline-REFERENCES that same table from a brand-new CREATE TABLE —
    two separate privilege gaps, the exact class that failed 5 migrations in production
    on 2026-08-26. The established remediation (per this repo's own precedent, migrations
    281/285) is a temporary `GRANT visa_ledger_owner TO backend_rag_v2` applied by an
    operator at deploy time, followed by a REVOKE and a commit adding "304" to the
    guard test's GRANDFATHERED dict with the date and reason — an operator-credential
    action on the production database, outside this session's authority to perform or
    to pre-declare. This pack does NOT add 304 to GRANDFATHERED, because doing so before
    the production grant actually happens would assert a state that is not true — the
    same "esiste != armato" failure this repo's own guard exists to prevent.
  - >-
    SECONDARY, not independently reproduced against a live rolling-deploy scenario by
    this session (codex's static reading only): IF privilege were granted, the
    CHECK-constraint DROP/ADD sits at the very top of migration 304 (Section 0), and
    migration_base.py wraps the whole file in one transaction — so the resulting ACCESS
    EXCLUSIVE lock on visa_decision_retention_policies would be held for the migration's
    entire remaining runtime (through CREATE TABLE/FUNCTION/TRIGGER), not released until
    COMMIT, while other live GARUDA_* paths take FOR SHARE on that same table on every
    write during the rolling deploy window.
  - >-
    MINOR, non-blocking: commit()'s UniqueViolationError handler (postgres_store.py)
    folds ANY unique-constraint hit into a bare "lost race, return False" without
    re-checking whether the row that won carries the SAME payload hash — a genuine
    same-key-different-payload race would silently swallow an IdempotencyConflictError
    the contract (ports.py) says must be raised. Not live today: the sole caller
    (service.py) re-reads via get_existing() afterward, which DOES compare hashes and
    would still raise. Not reproduced against a live race by this session (codex's
    static reading; a live two-different-payload race test does not exist in the PR's
    own suite, which only races same-payload commits).
  - >-
    This session ran the local integration suite (11/11 passed) using a LOCAL superuser
    Postgres role (balizero), the same blind spot the fixture itself has — this was
    caught by re-reading the fixture's own connection logic, not by a difference in
    outcome; the passing result is real evidence for schema/store correctness and the
    ownership-TRANSFER mechanism, but is NOT evidence that the migration's DDL can be
    APPLIED by the real low-privilege migration-runner role, which is the actual blocker.
  - >-
    tp1-qwen3.8-max's PASS verdict is recorded but not counted as clearing anything — it
    ran on a short prompt with no diff attached (its documented failure mode on long
    prompts) and did not engage with the migration text at all.
  - >-
    REWORK ROUND (added on top of this pack, not by its original author): three further
    defects were found and fixed after this pack's original BLOCKED verdict, independent
    of the cross-owner-DDL blocker above (which this round deliberately left untouched —
    see the first residual risk in this list, still true). (1) The new
    garuda_documents.retention_policy_id FK onto visa_decision_retention_policies was
    never registered in conftest.py's _GARUDA_VOA_RETENTION_FK_DEPENDENTS, so any test
    that rolls migration 264 back (test_evaluate_endpoint.py, on Backend Shard 2/3)
    failed closed with DependentObjectsStillExistError the moment 304 merged — fixed by
    registering it, the same one-line pattern 281/285/286 already use; confirmed by
    test_visa_engine_retention_fk_registry.py going from RED to GREEN. (2) The idempotency
    key stored in garuda_documents.key_sha256 was a bare sha256(idempotency_key), not
    scoped to actor as the contract's IdempotencyKey parameter requires ("Scoped to actor
    and operation") — two different actors reusing the same literal key would have
    collided on the same PRIMARY KEY row; fixed by hashing a length-prefixed
    (actor_id, operation, environment, idempotency_key) tuple instead, with new tests
    proving no cross-actor collision/read and no separator-boundary ambiguity, mutation-
    verified. (3) Replaying an already-committed READY_FOR_REVIEW document unconditionally
    raised ReadyOutcomeValueNotPersisted even when the caller was a commit-race loser
    holding its own matching in-memory outcome (from OCR on the identical bytes) — fixed
    in service.py by reconciling the loser's outcome against the winner's persisted
    field-structure (never a value) and re-tagging it with the winner's document_id; an
    ordinary sequential replay (no independent outcome to reconcile against) still raises,
    proven by a paired innocence test. All three fixes are mutation-verified (production
    fix reverted, new test observed RED, fix restored, test observed GREEN again).

pii_scan: clean

dissent:
  - seat: tp1-qwen3.8-max
    status: RETRACTED
    objection: >-
      "The DO-block ownership transfer may be missing a GRANT SELECT, INSERT ON
      garuda_documents TO visa_ledger_owner (or equivalent), or the trigger should carry
      a WHEN guard so it doesn't impose latency on unrelated retention-policy writes."
    resolution: >-
      Not realised, on two counts. First, bind_garuda_document_retention_policy() is a
      BEFORE INSERT trigger on garuda_documents itself — its SECURITY DEFINER body only
      SELECTs from visa_decision_retention_policies (a table visa_ledger_owner already
      owns outright, so no additional GRANT is needed once ownership of the FUNCTION
      transfers); it does not INSERT into garuda_documents at all — that INSERT is
      issued by the CALLER (postgres_store.py) under its own role, checked against the
      caller's own privileges, not the trigger owner's. test_low_privilege_role_can_
      insert_thanks_to_the_ownership_transfer (this session's own suite, passing)
      empirically confirms the low-privilege app role's INSERT succeeds with no
      additional GRANT beyond the function-ownership ALTER. Second, the WHEN-guard
      suggestion mistakes which table the trigger fires ON — it is BEFORE INSERT ON
      garuda_documents (a table this migration creates, with zero pre-existing writers),
      not on visa_decision_retention_policies, so it cannot impose latency on
      "unrelated retention-policy writes" as described.

