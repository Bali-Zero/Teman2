plan_ref: >-
  Rilaunch of a Gear-3 evidence ceremony for PR #5526 whose predecessor session died
  mid-way (verified: no evidence pack existed under this slug, or the slug the
  predecessor was given, before this run started). Worktree /tmp/wt-5526 was already
  clean at PR head 2552b0e2eb, PR already disarmed (autoMergeRequest: null) — this
  ceremony judges the diff, it does not attempt to make it merge.

lanes:
  - lane: garuda-voa-documents-ground
    role: read
    seat: >-
      claude-fable-5.1 (conducting session, Air-M5). Read the full three-dot diff
      (migration 304, postgres_store.py, its test) against origin/main. Verified every
      symbol postgres_store.py imports (IdempotencyConflictError, PersistencePolicyUnavailable,
      the DocumentOutcome union, PassportReviewFieldName's enum values against the migration's
      CHECK constraint) actually exists and matches, by reading ports.py/models.py/public_api.py
      directly rather than trusting the diff's own docstrings.
  - lane: garuda-voa-documents-review-lint
    role: review
    seat: >-
      claude-fable-5.1 (conducting session, Air-M5). Ran the exact squawk-cli invocation
      .github/workflows/migration-lint.yml uses (--pg-version=15.0 + the repo's 13 standing
      --exclude rules) against 304_garuda_documents.sql: 0 issues. Ran the new integration
      suite (test_postgres_store.py) against a real local superuser Postgres: 11/11 passed,
      including the SECURITY DEFINER ownership-transfer guilt/innocence pair.
  - lane: garuda-voa-documents-review-ledger-guard
    role: review
    seat: >-
      claude-fable-5.1 (conducting session, Air-M5). Ran the repo's OWN static guard,
      test_post_d1_migrations_guard_ledger_owned_ddl.py (written after a real 2026-08-26
      production incident where 5 migrations failed with "must be owner of table
      visa_decision_retention_policies"), against the full migrations_v2 corpus including
      304: 2 FAILED / 46 passed. Then traced the new test fixture to confirm it applies
      migration 304's forward SQL through a required-superuser connection, not the real
      production migration-runner role — the exact blind spot the guard's own docstring
      names as why CI stayed green in 2026-08-26 while production failed.
  - lane: garuda-voa-documents-refute-codex
    role: review
    seat: >-
      codex gpt-5.6-sol, --sandbox read-only, --skip-git-repo-check, cross-family,
      dispatched in foreground with the full diff attached. Verdict BLOCKED,
      independently converging on the SAME root cause (ownership/REFERENCES privilege
      gap on visa_decision_retention_policies) without having seen this session's guard-
      test run — reached it by static reading alone, and independently spotted that the
      new test's schema-build step uses a superuser connection. Added two findings this
      session had not made on its own: the inline FK REFERENCES clause inside
      CREATE TABLE garuda_documents needs REFERENCES privilege the app role also lacks
      (a shape the ledger guard's own docstring admits it cannot see, because it only
      scans REFERENCES inside a top-level ALTER TABLE), and that the migration's own
      documented rollback text cannot work under migration_base.py's single-transaction
      runner.
  - lane: garuda-voa-documents-refute-tp1
    role: review
    seat: >-
      tp1-qwen3.8-max via scripts/tp1_call.py --effort medium, cross-family, SHORT prompt
      (<4KB, no diff attached — this seat's known failure mode on long prompts).
      Verdict PASS, but did not see the diff and did not independently find the
      ownership/REFERENCES blocker; its one substantive concern (a missing GRANT on
      garuda_documents for the trigger owner) rests on a wrong model of what a BEFORE
      INSERT trigger's SECURITY DEFINER owner actually needs privilege for, and is
      empirically contradicted by this session's own passing
      test_low_privilege_role_can_insert_thanks_to_the_ownership_transfer. Its PASS is
      recorded for seat diversity but does not carry weight against the two seats that
      actually engaged with the diff and reached BLOCKED independently of each other.

seat_diversity: satisfied
seat_diversity_note: >-
  Two review lanes ran cross-family (codex-gpt-5.6-sol, tp1-qwen3.8-max) alongside the
