dissent:
  - seat: claude-opus-5
    objection: >-
      The visible ⌘K field dispatches a synthetic KeyboardEvent instead of taking an onOpen prop,
      which is the cleaner wiring.
    status: CONFIRMED
    disposition: >-
      Accepted deliberately. The window's constraint is presentation only, with no new prop and no
      changed handler; KitaCommandPalette already listens for Cmd/Ctrl+K on `window`, so the field
      opens the door that exists rather than cutting a new one. The alternative is one prop through
      the layout, which a later window can take without changing this markup. Stated in the source.
  - seat: claude-opus-5
    objection: >-
      The field's copy is hardcoded English, so it is not translated.
    status: CONFIRMED
    disposition: >-
      Adding an i18n key is outside this window's perimeter, and the header already carries
      untranslated strings ("ayo!", the Notifications aria-label). The copy is the renders' own. It
      is a real gap and it is named here and in the source rather than hidden.
  - seat: claude-opus-5
    objection: >-
      --bz-product-row-height is still 52px on kita where the concept's row is 44px.
    status: CONFIRMED
    disposition: >-
      Left alone on purpose. Its single consumer is clients/page.tsx, which window K3 owns and
      restyles; changing it here would resize a table K3 has not yet rebuilt. Handed to K3.
