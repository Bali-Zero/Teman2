decisions:
  - id: D1
    what: Mutate `data/source_documents/KBLI_2025_FINAL_CLEAN.json` (not the repo-root symlink) as canonical, then run `scripts/sync_kbli_dataset.sh sync`.
    why: >-
      Every existing `kbli_filiera` compiler's `DEFAULT_CANONICAL` targets
      `data/source_documents/...`; the repo-root `source_documents` is a
      symlink to that same directory, so there is no drift risk either way,
      but matching the established compiler convention keeps this cure
      consistent with its siblings for anyone diffing the compiler fleet.
  - id: D2
    what: "{scales}/{tier} are MEASURED from each record's live `per_skala` at apply time, never frozen into the spec."
    why: >-
      The lane brief says "measure: `per_skala` scale names and the risk tier
      the record already uses" — freezing the rendered string into the spec
      would go silently stale the next time OSS re-ingestion changes a
      record's scale rows (the exact defect class the dossier's §1.3(iii)
      names for the withdrawn #6488 inference: a snapshot treated as a fact).
  - id: D3
    what: The PMA tuple is left at `declared_gap`; a SEPARATE notice-lookup file discloses the specific text instead of writing into `pma_nota`.
    why: >-
      `disclosePmaInfo` (kbli-pma-disclosure.ts) only surfaces `pma_nota` when
      `provenance.pma.status === "located"` — false for all 12 by design (no
      0%, no 100% published). Astra's unmerged idea (`kbli-pma-review.ts`)
      already solved this with an independent, guarded lookup; rewritten here
      keyed on the guard fields this cure actually controls
      (`pma_status`/`pma_max_asing`/`pma_verification_status`) rather than
      `pma_nota` (a field this cure never touches).
  - id: D4
    what: No code change to `PMABadge.tsx` or `LicensingSection.tsx`.
    why: >-
      Both are already gated by `isPmaVerdictVerified(code)`, which requires
      `pma.verificationStatus === "located"`. Since the PMA tuple stays
      `declared_gap` for all 12, that gate is false before AND after this PR —
      the "outside Bali" text and the Open/100%/0% badge states are
      structurally unreachable, proven by `isPmaVerdictVerified===false`
      assertions in the vitest suite rather than by a DOM render (lower risk,
      same guarantee, no blast radius on the other 1547 codes' shared
      component code).
  - id: D5
    what: The `l4_bali` cure and the PMA-review-notice cure ship in ONE PR rather than two.
    why: >-
      Splitting them would leave the data half without its own UI-facing
      demonstration (the FAQ answer literally reads `l4_bali`-adjacent but
      independent fields) or the UI half without the data it discloses being
      real yet. Net churn (987 lines excluding synced copies) is reported to
      the Dux as OVER the ~400 target rather than silently shipped; a split
      was considered and rejected because neither half is independently
      testable-complete without the other's fixtures.

