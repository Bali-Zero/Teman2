task: Stop the News Room converter from dropping draft "##" sections and inventing Next Steps content that was never in the draft.
lane: backend-rag/newsroom-fidelity-rebuild
machine: M5
date: 2026-09-25
mission_id: newsroom-converter-fidelity
mission_colour: BLUE
role: session, prepare only (coordinator reviews/merges/arms/deploys)
gear: 2
gear_reason: >-
  Supersedes #7245, which went DIRTY (merge conflicts with main) and is
  frozen. Rebuilt on fresh origin/main by cherry-picking #7245's two
  commits unchanged; both applied clean except schema.d.ts.openapi-sha256
  (conflicting pin), resolved by regenerating the pin via
  scripts.generate_openapi against this tree. Publishing-correctness fix
  to convert_staging_to_enriched_article and generate_mdx_content, with
  guilt+innocence regression tests and a regenerated OpenAPI schema pin;
  no schema/migration/infra change.
acceptance:
  A1: Every draft "##" section the converter does not map to a dedicated field (e.g. "In Practice", "Sources") is preserved verbatim, in draft order, anchored to the mapped section it followed — never silently dropped.
  A2: A Next Steps body with no "For Expats"/"For Investors" subsections renders as one neutral group; it is never split 50/50 between expat and investor.
  A3: An empty Next Steps group is omitted; the filler "Review the article for specific actions" is never emitted; the whole Next Steps section is omitted when there are no steps at all.
  A4: A draft with real For Expats/For Investors subsections renders exactly as before this change (innocence).
  A5: schema.d.ts and its OpenAPI drift pin (schema.d.ts.openapi-sha256) stay in sync with the live backend contract — pin regenerated on this rebuild's tree, not carried over from #7245.
out_of_scope: Publishing/deploying the fix, repairing the already-published GloBE article (apps/mouth PR, separate lane), LLM-composer prompt changes, unrelated router changes.
