diff:
  behaviour_change:
    The workflow's path filter becomes a superset of what its own steps read — five suffixes added on
    both events (.jsx .mjs .yml .yaml .toml) plus the bench corpus, beside the pardon list the vendor
    fence entered first. Two changed-file transports stop splitting paths on whitespace. Two corpora
    that no gating workflow ran — the typesafe client pin and the parity suite added here — join the
    step PR 6989 shipped for exactly that purpose, rather than getting a second step beside it. No
    lint
    changes its verdict; the entity step stays advisory.
  surface:
    One workflow edit, one new test module, one prose correction in a lint docstring. No backend, no
    frontend, no migration, no data, no credential, no new dependency in the tree (pyyaml is installed
    on the runner by the first step that installs anything, for the step below it that needs it).
