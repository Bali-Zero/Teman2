  - seat: kimi-code/k3
    objection: "MINOR — the same-filter test compared lists, so swapping two entries inside one event, with coverage identical, was reported as `a hole in the tree`. Order means nothing to GitHub; the set is what matters."
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: "MINOR — `it may shrink, never grow` is half the shrink story: releasing a file from the pardon list without curing it in the same diff reds the push-time whole-tree scan on main. Measured behind the 11 pardons: 28 live violations. A pardon is debt, and the prose read like absolution."
