    objection: "The workflow comment claimed the blocking step 'can only red on prose a PR actually authored'. It cannot: the predicate reads the whole file, so touching an old offender reds on its existing lines. The sentence was stronger than the behaviour, in the lane whose subject is sentences that lie about code."
