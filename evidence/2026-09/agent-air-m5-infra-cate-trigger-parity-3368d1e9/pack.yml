    status: RETRACTED
  - seat: codex-gpt-5.6-sol
    objection: "MINOR — the filter's justification comment quotes `1 failed, 19 passed` from a corpus that has since grown to 26 guilt + 29 innocence, so the figure no longer reproduces."
