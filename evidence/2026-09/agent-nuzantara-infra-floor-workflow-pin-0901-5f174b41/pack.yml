dissent:
  - seat: tp1 deepseek-v4-flash-0731
    status: CONFIRMED
    objection: >-
      "False positive 1 — reordering steps." Condition 3 compared the SORTED identities, so two
      bare one-line steps whose `uses:` lines swap places have an identical multiset and were
      EXEMPTED — while actually changing execution order, which can put a scan before the step
      producing what it scans and pass it vacuously. Real, and cured in this PR: condition 3 now
      compares the SEQUENCES (both lists are in file order, so a pure ref change leaves them
      identical). Reverting to sorted() reddens exactly the new reorder test and leaves its
      innocence twin green. The seat's answer was TRUNCATED at 214 bytes and this finding is all
      it managed to emit — which is the argument for the seat, not against it.
  - seat: session (Pro), self-caught during BUILD
    status: CONFIRMED
    objection: >-
      A write that reported success did not land on disk — the `..`-traversal guard was absent from
      the file after the edit printed "traversal guard added". It was caught because the test
      written for that line went RED, not because the write was trusted; re-applied and verified by
      re-reading the file AND an independent grep in the same command. Recorded because the lesson
      is the ORDER: the test existed before the guard was believed.
  - seat: session (Pro), on the scope of the rule
    status: CONFIRMED
    objection: >-
      An author-based exemption (skip the floor for dependabot[bot]) is far simpler and was the
      obvious first design. REJECTED on W98: a Dependabot bump shipped a malicious fastapi to PROD
      past a `!=` constraint the updater could not see. The rule is therefore content-based, which
      costs a diff parser and buys the property that a human editing the same line is treated
      identically and a bot changing anything else is not exempt at all.
