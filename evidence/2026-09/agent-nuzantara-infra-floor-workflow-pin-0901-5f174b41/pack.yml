    exit: 1
    ts: 2026-09-01T18:41Z
    seat: session (Pro)
  - claim: "Acceptance probes 2, 3 and 5 — the guilt corpus and the structural-confinement test"
    cmd: "python -m pytest scripts/tests/test_evidence_pack_lint.py -k path_term_exemption_guilt ; python -m pytest scripts/tests/test_evidence_pack_lint.py -k never_returns_a_non_workflow_path"
    result: "green, inside a full-file run of 319 passed."
    exit: 0
    ts: 2026-09-01T19:04Z
    seat: session (Pro)
  - claim: "Acceptance probe 4 — no patch, missing patch and empty patch all exempt nothing"
    cmd: "python -m pytest scripts/tests/test_evidence_pack_lint.py -k path_term_exemption_defaults_to_no_exemption"
    result: "green. Asserts compute_floor([wf]) == compute_floor([wf], None, None) == compute_floor([wf], None, '') == 3."
    exit: 0
    ts: 2026-09-01T19:04Z
    seat: session (Pro)
  - claim: >-
      Acceptance probe 6 — this PR's OWN diff still floors at 3, so the new rule does not exempt
      the change that introduces it
    cmd: "python scripts/evidence_pack_lint.py --print-floor-source --changed-files-file <this diff> --numstat-file <this diff>  # -> path, floor 3"
    result: "floor=3, source=path."
    exit: 0
    ts: 2026-09-01T19:04Z
    seat: session (Pro)
  - claim: >-
      The new helper is NOT a censused guard that needs its own registry entry — checked by
