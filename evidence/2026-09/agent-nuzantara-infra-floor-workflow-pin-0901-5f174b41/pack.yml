      scratch `git init`, write the two steps, commit, swap them, `git diff -U0 --no-renames`,
      then feed that ACTUAL output to workflow_paths_exempt_from_path_term
    result: >-
      git emits a minimal diff whose ONLY changed lines are the two `uses:` lines — the identical
      `with:` blocks align as CONTEXT, so "a non-uses line would have changed too" is not a
