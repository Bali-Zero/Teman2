task: >-
  C1 of the cc-meta-loop backlog: every headless `claude -p`/`--print` invocation in the repo
  carries a context-diet flag (`--restricted`, `--safe-mode`, `--setting-sources`) or an
  explicit `# context-diet: exempt — <reason>` pragma. A new lint
  (`scripts/lint/lint_claude_headless_context_diet.py`, reusing the anchor/window engine of
  lint_claude_headless_limits.py, file-level grandfather list that only shrinks, --selftest,
  monotone check vs origin/main) wired into the LOCAL pre-push consumer scripts/quickcheck.sh
  (no CI workflow step — that edit is hot-zone and floors any PR at Gear 3, split out as
  backlog row C1d); plus three cures in the same PR: agent_job.py session bootstrap (2
  text-only calls → --restricted --strict-mcp-config), claude_vision.py (needs Read →
  --safe-mode, proven live with a one-boolean json-schema against an on-disk PNG), and the
  exempt pragma on the deliberate Canva-MCP exception. Also ships two re-measure scripts so
  the frozen numbers cited by the BACKLOG never have to be trusted cold:
  scripts/bench/cc_headless_shape_bench.sh (the lint docstring's/cure comments' token numbers)
  and scripts/bench/cc_hook_latency_bench.py (H10's PreToolUse-handler-latency number) —
  both cited by exact path from research/agent-craft/cc-meta-loop/BACKLOG.md's H10 and C4 rows.
lane: infra/cc-context-diet-lint
machine: Air-M5
date: 2026-09-17
gear: 2
gear_reason: >-
  Deterministic floor 2, source `size`: churn ~1070 (lint 545, test 187, bench-shape 36,
  bench-latency 106, quickcheck wiring 39, grandfather 26, cures ~20, brief ~130) — above
  SIZE_GEAR2_THRESHOLD (400), below 1828; no hot-zone path (the .github/workflows/ edit was
  split out into backlog row C1d — this PR touches only scripts/, infra/ and evidence/).
successor_of: >-
  "#6708 — REWORK-BUILD (fresh Opus gate session, 50 turns): (1) the immune-enforcement.yml
  edit is a hot-zone path per scripts/evidence_pack_lint.py's HOTZONE_PATTERNS and floored the
  PR at Gear 3 unacknowledged; (2) the Bites line named agent_job.py's 21 cron-job callers of
  get_or_create_session() as the consumer, but that function has had NO live caller since
  compliance_ops.py removed it 2026-04-30 — only a test calls it; (3) the frozen token numbers
  (36,322 / 15,064 / 16,923) were measured once on M5 with fleet mail pending at Stop and
  presented as fixed facts, with no way for a later reader to tell whether they still hold.
  #6714 — same content, all three findings fixed, auto-merge ARMED (never merged into this
  successor's history): superseded not for a defect but because the Builder Contract freezes
  a branch the instant auto-merge is armed ('the branch is read-only and every follow-up
  starts from a fresh origin/main') — an addendum (a second bench script,
  scripts/bench/cc_hook_latency_bench.py, for the H10 backlog row) arrived after #6714 was
  already armed, so it could not land as a new commit on that branch. This branch (v4) is a
  clean cherry-pick of #6714's two commits from fresh origin/main plus that one addition; #6714
  should be closed once this PR is confirmed open, to avoid a double-merge race on the shared
  content."
rework:
  - "Dropped the .github/workflows/immune-enforcement.yml step entirely (git checkout
    origin/main -- that file) — reverted to origin/main byte-for-byte, confirmed via
    `git diff origin/main -- .github/workflows/immune-enforcement.yml` (empty). Wired the
    lint into scripts/quickcheck.sh instead: new function
    run_context_diet_lint_if_touched(), same advisory/return-0 convention as its neighbors
    (run_actionlint_if_touched, run_scripts_coupling_census_check), triggered when a changed
    file matches ^(scripts|infra|apps|agent-library|skills)/.*\\.(py|sh)$, called right after
    run_actionlint_if_touched. Proof: ran quickcheck.sh's context-diet function on this
    worktree with a touched .py — see acceptance A5."
  - "Bites line corrected to name the real consumers: scripts/quickcheck.sh (runs on every
    push from a dev machine touching scripts/infra/apps/agent-library/skills .py or .sh) and
    the lint's own --selftest. Dropped the false '21 cron jobs' claim — agent_job.py's
    get_or_create_session() has no live caller today; the cure is still correct (a future
    caller inherits the diet for free) but is not yet load-bearing in production."
  - "Added scripts/bench/cc_headless_shape_bench.sh (5-shape bench: default, restricted,
    restricted_strictmcp, setting_sources_empty, safe_mode) and repointed every frozen-number
    reference (lint docstring, agent_job.py comment, claude_vision.py comment, this brief) to
    say the numbers are environment-dependent and name the bench script as the re-measure
    path, instead of stating them as settled fact."
  - "Moved the evidence directory from the v2 slug to
    evidence/2026-09/agent-air-m5-infra-cc-context-diet-lint-v3-870494c1/ via
    scripts/ci/evidence_paths.py --ref agent/air-m5/infra/cc-context-diet-lint-v3."
  - "Addendum on top of #6714 (armed, therefore frozen): copied
    scripts/bench/cc_hook_latency_bench.py in verbatim (read-only, times every registered
    PreToolUse handler on a synthetic Bash event; no hook decision is acted on), ran it with
    --startup, and pasted its summary + 5 startup lines here (A7) and in the PR body. Moved
    the evidence directory again, v3 slug -> v4 slug, same evidence_paths.py mechanism."
