acceptance:
  A1: >-
    The lint proves its own guilt path, then reports the repo clean with the debt frozen.
    probe: python3 scripts/lint/lint_claude_headless_context_diet.py --selftest && python3 scripts/lint/lint_claude_headless_context_diet.py
    observed: "SELFTEST PASS; clean (3756 files scanned, 20 grandfathered, 0 new) — 2026-09-17, this worktree"
  A2: >-
    The unit tests (guilt + innocences incl. pragma above anchor and path-mention) pass.
    probe: ~/nuzantara/.venv/bin/python3 -m pytest scripts/lint/test_lint_claude_headless_context_diet.py -q
    observed: "10 passed in 0.09s"
  A3: >-
    The cured bootstrap shape still yields a session_id (what agent_job.py extracts).
    probe: claude --print --restricted --strict-mcp-config --output-format=json --model haiku "Session init selftest" </dev/null | python3 -c "import json,sys; print(bool(json.load(sys.stdin)['session_id']))"
  A4: >-
    Declared blind spot, not a defect of this PR: an invocation built through an argument
    array (`CLAUDE_ARGS=("--print")` … `"$CLAUDE_BIN" "${CLAUDE_ARGS[@]}"`, e.g.
    infra/launchagents/wrappers/claude-cascade.sh) is outside the engine's window and is
    neither flagged nor grandfathered — recorded as backlog row C1c.
  A5: >-
    The frozen numbers have a re-measure path, and it runs.
    probe: bash scripts/bench/cc_headless_shape_bench.sh /tmp/cc-shape-bench-v3
    observed: >-
      "default                      rc=1   9s result=''         TOTAL_IN=36278
      (in=10 cache_create=24418 cache_read=11850) turns=2 err=True |
      restricted                   rc=0   6s result='PONG'     TOTAL_IN=17769
      (in=10 cache_create=6144 cache_read=11615) turns=1 err=False |
      restricted_strictmcp         rc=0   4s result='PONG'     TOTAL_IN=15198
      (in=10 cache_create=3573 cache_read=11615) turns=1 err=False |
      setting_sources_empty        rc=1   0s NOJSON '' (CLI now rejects an empty
      --setting-sources value outright: 'Invalid setting source: \"\". Valid
      options are: user, project, local') |
      safe_mode                    rc=0   5s result='PONG'     TOTAL_IN=17057
      (in=10 cache_create=4165 cache_read=12882) turns=1 err=False"
      — 2026-09-17, this worktree/machine, fleet mail pending at Stop (same
      environment shape the frozen docstring numbers were measured under).
  A6: >-
    scripts/quickcheck.sh's new run_context_diet_lint_if_touched() fires and reports OK on
    this PR's own diff (a .py under scripts/ is touched).
    probe: bash scripts/quickcheck.sh
    observed: "see PR body / final report for the literal [context-diet-lint] line"
  A7: >-
    The H10 row's frozen hook-latency number (8 blocking handlers, 364 ms serial on M5,
