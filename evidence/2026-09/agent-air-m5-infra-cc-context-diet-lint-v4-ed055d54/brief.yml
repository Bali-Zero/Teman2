    probe: python3 scripts/bench/cc_hook_latency_bench.py --startup
    observed: >-
      "handlers on a Bash PreToolUse: 8 — blocking 8, serial sum 820 ms" against
      /Users/balizero/.claude/projects/-Users-balizero-Desktop-nuzantara/eb0d5ece-a75c-4271-8a4e-fd5a330efe15.jsonl
