plan_ref: >-
  Zero, 2026-09-18 ("e riguardo a mailbox fleet?" -> "certo, go"): give
  ~/.nuzantara-mailbox its first deleter as a proper organ (janitor +
  launchd wrapper + tracked plist + installer + registry + connectome) and
  ship it end to end on M5, Pro and Mini under the ship-lifecycle rule.

