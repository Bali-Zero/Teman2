what_changed: |
  12 files, +1,500-ish / -1 (CI measures the exact number at merge-base).
  NEW scripts/mailbox_janitor.py (dry-run default, --apply, tag-timestamp
  retention 14 d, .broadcast_seen removal only when dir AND marker are older
  than 3 d AND no listed name is live -- re-checked right before the unlink
  -- empty session dir rmdir, symlink/fifo/nested-dir kept, root refusal,
  realpath containment, JSON receipts, NUZ_MAILBOX_DIR honoured); NEW
  scripts/mailbox_janitor_cron.sh (heartbeat ok|warning|error|disabled on
  every path, kill switch, dry-run env, exit map 0/1/2/3, SUMMARY capture
  guarded against pipefail); NEW tracked plist
  infra/launchagents/com.nuzantara.mailbox-janitor.daily.plist (04:47 daily,
  StartCalendarInterval dict, KeepAlive false, pins only HOME+PATH); NEW
  infra/launchagents/install_mailbox_janitor.sh (render|install|uninstall,
  sed HOME + repo root, plutil AND plistlib gates, bootstrap checked, post-
  bootstrap launchctl print verified); 25 tests in two files; 3 organs
  (m5|pro|mini.mailbox_janitor) in organs_registry.yaml with the checksum
  line patched via compute_checksum (the --update-checksum re-dump drops
  comments); connectome edges on launchd-m5-mini.yaml and launchd-pro.yaml;
  this evidence pack.

proof: |
  See receipts. Deterministic floor 3 / path; 25 tests green after the
  council cures; organ conformance 0 non-conformant births; registry valid;
  keepalive lint clean; plist parses under plutil and plistlib with only
  HOME+PATH pinned; installer render on an M5-shaped HOME has zero
  /Users/nuzantara paths; live M5 dry-run touches nothing and reports 0
  errors with the 13 live messages kept; ruff + shellcheck clean. Two
  cross-family council seats (codex gpt-5.6-sol, kimi-code/k3) both NO-GO on
  the pre-cure diff with overlapping findings; every finding is either fixed
  with a test or documented as a partial with the reason (dissent).

dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      scripts/mailbox_janitor_cron.sh: SUMMARY="$(echo "$OUTPUT" | grep -m1
      '^mailbox-janitor:' | cut -c1-200)" runs after `set -e` is restored,
      under pipefail. A janitor that crashes with a traceback prints no
      summary line, grep exits 1, the assignment fails, and the wrapper dies
      BEFORE the heartbeat -- a silently dead cron (superscar #2).
    status: CONFIRMED
    resolution: >-
      `|| true` inside the substitution; the case/heartbeat is now reached on
      every rc. Wrapper test suite re-run green (6 tests).
  - seat: codex-gpt-5.6-sol
    objection: >-
      install_mailbox_janitor.sh runs `set -uo pipefail` without -e and never
      checks `launchctl bootstrap`; a failed bootstrap still prints "done" and
      exits 0, leaving the plist on disk and the job unloaded (kimi-code/k3
      raised the same, adding that bootout's `grep -v` hides its own errors).
    status: CONFIRMED
    resolution: >-
      bootstrap is guarded (FATAL + exit 1 on failure) and the installer now
      requires `launchctl print gui/$UID/<label>` to succeed before reporting
      done. bootout's filter is kept: a bootout that silently fails makes the
      next bootstrap fail "already loaded", which the new guard catches.
  - seat: codex-gpt-5.6-sol
    objection: >-
      The plist pinned MAILBOX_JANITOR_ENABLED=true in EnvironmentVariables,
      which overrides the launchd user environment, so the documented kill
      switch `launchctl setenv MAILBOX_JANITOR_ENABLED false` could never
      reach the wrapper (kimi-code/k3 raised the same: the G5 off-switch was
      dead on all three machines).
    status: CONFIRMED
    resolution: >-
      Key removed from the plist (the wrapper defaults to enabled); the plist
      comment now says why the variable is deliberately NOT pinned, that
      setenv does not survive a reboot, and that uninstall is the persistent
      form. A render test asserts the key is absent; G5 conformance is
      checked on the wrapper text and stays green.
  - seat: codex-gpt-5.6-sol
    objection: >-
      TOCTOU on .broadcast_seen: live broadcast names are snapshotted once at
      run start, the marker is read and unlinked later; a reader hook can
      append a name (or a new broadcast can appear) in between, and the
      janitor unlinks a marker still needed for dedup. Proposed a shared
      mailbox lock in both the reader hook and the janitor plus a
      barrier-controlled concurrent test (kimi-code/k3 raised the same two
      windows and proposed re-resolving liveness right before the unlink).
    status: CONFIRMED
    resolution: >-
      Resolved without a shared lock: (1) the marker's OWN mtime must also be
      older than --seen-days -- the hook appends without touching the dir
      mtime, so a session that saw a broadcast yesterday keeps its marker
      even inside a dir born weeks ago; (2) liveness is re-resolved against
      broadcast/ immediately before the unlink. Two tests cover both. The
      shared lock is rejected for this PR: the reader hook is out of scope
      (one PR, one concern), and the residual window -- an append that lands
      in the microseconds between the final stat and the unlink -- costs one
      duplicate injection of one broadcast, never data loss.
  - seat: codex-gpt-5.6-sol
    objection: >-
      Dry-run counters are incremented without attempting the syscall while
      apply counts only successes, so under EACCES/races the two differ
      despite the "exactly what apply would do" claim; proposed renaming the
      dry-run counters to eligible_*/would_attempt_*.
    status: CONFIRMED
    resolution: >-
      No rename: the summary line and receipt keys are what the wrapper,
      the heartbeat note and the ledger read. The module docstring and the
      brief now state the semantics explicitly -- eligible without --apply,
      performed with --apply, equal iff errors=0 -- and every failed attempt
      lands in `errors`, which the wrapper maps to exit 3 / heartbeat
      warning (now covered by a wrapper test).
  - seat: kimi-code/k3
    objection: >-
      A non-regular, non-dir child (fifo/socket/device) hit `if not
      child.is_file(): continue` without counting as remaining, so its
      session dir looked empty, rmdir failed ENOTEMPTY every night, errors
      incremented and the wrapper heartbeated "warning" forever, masking real
      warnings.
    status: CONFIRMED
    resolution: >-
      Such a child now counts as kept_unknown AND remaining; the dir is
      never rmdir'd and errors stays 0. Test added (mkfifo fixture).
  - seat: kimi-code/k3
    objection: >-
      The wrapper suite never drove janitor rc=2 -> wrapper exit 3 ->
      heartbeat warning, and the installer's sed order on an M5-shaped HOME
      was verified only by reading; also the wrapper header still named a
      `.plist.example` this PR does not ship.
    status: CONFIRMED
    resolution: >-
      Two tests added: a chmod-locked session dir drives exit 3 + warning
      with the marked file still present; `render` on HOME=<tmp>/Users/balizero
      is parsed with plistlib and asserted (no /Users/nuzantara, payload
      under HOME/nuzantara, no pinned kill-switch var, StartCalendarInterval
      dict, KeepAlive/RunAtLoad false). Header comment corrected.

  - seat: claude-sonnet-5
    objection: >-
      spalla-review (same-family second look, GO-WITH-NITS): `echo "$OUTPUT"
      | tee -a "$LOG"` and the `log()` helper run under pipefail without the
      `|| true` the SUMMARY line got; a full disk or unwritable log dir --
      the very pressure this janitor exists to relieve -- kills the wrapper
      before the heartbeat. Also: the installer checked only the wrapper
      payload, not mailbox_janitor.py.
    status: CONFIRMED
    resolution: >-
      `|| true` on both tee pipelines; the installer now requires both
      payload files. Wrapper suite re-run green; shellcheck clean.

