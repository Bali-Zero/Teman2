objective: >-
  Slice B2''-c C1 (MANDATE-vo.md, "the manifest is engine-parseable BY CONSTRUCTION,
  and the runner refuses what the engine would refuse BEFORE the network"). The
  live runner's first production run tripped its own circuit breaker at request 3
  on three http_422 uuid_parsing errors: the mouth emitter hardcodes
  assessment_id="x" (apps/mouth/scripts/visa-oracle/enumerate-interview-space.ts:133)
  while the engine's ApplicantFacts.assessment_id is a uuid.UUID
  (backend/services/visa_engine/models.py:1283). extract_walks() -- already the
  fail-closed pre-flight for missing/duplicate labels -- now also validates every
  walk's WIRE SHAPE (schema_version exactly "1.0.0"; assessment_id accepted by
  uuid.UUID(str(value)); collected_at an ISO-8601 string with an explicit zero UTC
  offset, mirroring models.py's _validate_utc; facts a non-empty object;
  disclosed_review_flags, when present, a list of strings) before any token load
  or network call, in --dry-run and live alike, since extract_walks already runs
  first in run_live_enumeration on both branches -- no call-order change was
  needed, only the validation itself. No minting or repair: the emitter (a
  separate mouth PR, C2) owns the wire payload; this PR only refuses.

scope:
  - "apps/backend-rag/backend/scripts/visa_engine/enumerate_live.py -- new _validate_walk_wire_shape(label, walk) called from extract_walks() for every walk, after the existing label/duplicate checks; one new module docstring sentence naming the pre-flight."
  - 'apps/backend-rag/backend/tests/scripts/visa_engine/test_enumerate_live.py -- _walk()''s default assessment_id becomes a fixed synthetic UUID (_VALID_ASSESSMENT_ID) instead of the old "x" placeholder, so every pre-existing test still passes unchanged through the new validation; the one hardcoded "x" assertion in test_successful_walk_is_recorded_as_engine_verdict now reads the same constant; 7 new tests: 5 named guilt cases (bad assessment_id live + dry-run, collected_at without offset, wrong schema_version, empty facts), 1 extra guilt case (non-list disclosed_review_flags), 1 innocence case (uuid4 id + Z timestamp + flags list still passes and --dry-run still prints its plan).'
  - "This brief."

constraints:
  - "No minting, no repair of a bad assessment_id or collected_at -- the runner only refuses; the emitter (C2, a separate mouth PR) is the one that fixes the wire payload."
  - "Refusal is ONE EnumerateLiveError naming the walk LABEL and the FIELD; a facts VALUE is never echoed in any raised message."
  - "Validation runs inside extract_walks(), which run_live_enumeration already calls before load_driver_token and before any /health or evaluate call, in both the --dry-run and live branches -- verified by reading the function, no reordering was required."
  - "build_request_body's field set is unchanged."
  - "Off-limits respected: report_lock.py and its test, apps/mouth/**, zantara_core.py, fly.toml, .env* were not touched."

