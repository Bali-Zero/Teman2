residual_risks:
  - >-
    THE FIRST LIVE SCHEDULED/DISPATCHED RUN IS THE ACTUAL PROOF, not this pack. Everything above
    is local simulation (pytest, direct script invocation, a hand-built ledger file with the same
    idempotency contract) plus actionlint/YAML validation — none of it runs INSIDE GitHub Actions'
    real environment (its actual `bash` binary, its actual cache backend, its actual GITHUB_STEP_
    SUMMARY). This PR dispatches `workflow_dispatch` on its own branch before merge specifically
    to close that gap with a real run rather than a promise (see receipts).
  - >-
    A SECOND REFUTER'S HEADLINE VERDICT WAS FAIL ON A HALLUCINATED FINDING. tp1-qwen3.8-max's
    "unparseable YAML" claim was traced to THIS session's own prompt-compression (stripping
    comments to fit the <4KB budget destroyed the diff's per-hunk boundaries) and is refuted
    against the real file (actionlint, yaml.safe_load, direct read) — recorded honestly below as
    RETRACTED rather than silently dropped. Its other two findings (pipefail confirmation, cache-
    key growth) were sound and are reflected in the diff / an inline comment respectively.
  - >-
    actions/cache's save is gated on job SUCCESS at its post-step — a run that fails after a
    successful ledger append does not persist that append. Accepted (conservative direction,
    documented inline), not cured.
  - >-
    L1630's third gesture — whether v1's heuristic (547/858 vs a cited 106/866 baseline, both
    already disclosed in correction_tax.py's own docstring) needs a word-boundary v2 — is
    explicitly out of scope per the ledger row's own text and is untouched here.

