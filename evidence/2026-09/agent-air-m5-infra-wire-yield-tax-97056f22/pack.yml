dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      `A | tee B` under GitHub's IMPLICIT default shell (`bash -e {0}`, no pipefail) reports tee's
      exit code, not the piped script's — a crashing council_yield_report.py or correction_tax.py
      (including a ledger-append RuntimeError) would leave the step, and the job, green.
    status: CONFIRMED
    disposition: >-
      ACCEPTED. `shell: bash` added to both the "Council yield report" and "Correction tax report"
      steps (verified against GitHub's own docs, not assumed — see receipts). This also completes
      an invariant the file's own "Emptiness gate" step comment already claimed but did not have.
  - seat: codex-gpt-5.6-sol
    objection: >-
      `upload-artifact`'s `if-no-files-found: warn` only checks whether the COMBINED glob found at
      least one file — the two .txt reports alone satisfy that even if the ledger jsonl is
      silently missing or empty, so a green upload does not prove today's ledger row exists.
    status: CONFIRMED
    disposition: >-
      ACCEPTED. Added a "Verify ledger row landed" step (`test -s` + `tail -n1`) BEFORE the
      upload step, hard-failing the job (no `if: always()`) if the ledger is missing or empty.
  - seat: codex-gpt-5.6-sol
    objection: >-
      `actions/cache`'s save runs on a post-step gated by `post-if: success()` against the job's
      status at that point, so a later step failing after a successful append would not persist
      that append for tomorrow's restore.
    status: CONFIRMED
    disposition: >-
      ACCEPTED as the conservative, intended direction rather than cured — a compromised run's
      state should not propagate. Documented inline with an explicit comment rather than silently
      left implicit.
  - seat: tp1-qwen3.8-max
    objection: >-
      The diff is unparseable YAML: `shell: bash` is illegally attached to the `uses: actions/
      cache@v6` step, with the following `python3 …` block having no `run: |` key — no step would
      execute.
    status: RETRACTED
    disposition: >-
      REFUTED against the real file, not silently dropped. `shell: bash` sits correctly under the
      "Council yield report" `run:` step; the "Restore correction-tax ledger" `uses: actions/
      cache@v6` step carries no `shell:` key at all. Confirmed three independent ways: actionlint
      `-shellcheck=` exit 0 (twice, before and after this dissent was investigated),
      `python3 -c "import yaml; yaml.safe_load(...)"` OK, and direct `sed -n` read of the file on
      disk. Root cause traced: this session's own prompt-compression (stripping `#`-comment lines
      to fit tp1's <4KB budget) destroyed the diff's per-hunk boundaries, so two textually adjacent
      but structurally unrelated added-line groups read as one contiguous block. A methodology
      note, not a code defect — the compression technique is what needs care next time, not this
      workflow file.
  - seat: tp1-qwen3.8-max
    objection: >-
      The cache save key includes `${{ github.run_id }}`, so a NEW cache entry is created every
      scheduled run instead of one entry being updated in place, risking growth toward the repo's
      cache size cap and LRU eviction of the ledger.
    status: CONFIRMED
    disposition: >-
      ACCEPTED as a known, bounded trade-off rather than cured: this is the SAME idiom
      `cron-fly-restart-detector.yml`'s cooldown-state cache already uses in this repo (matched
      deliberately, not reinvented), and GitHub's own cache eviction (oldest-unused-first, past the
      10 GB org cap or a 7-day unused-entry expiry) bounds it. Documented inline via a new comment.
