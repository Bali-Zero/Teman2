# Gear-3 evidence pack — owner-name privacy sweep v2 (Antonello -> Zero), Bali-Zero/Teman2,
# branch agent/air-m5/docs/owner-name-zero-v2. Supersedes PR #7430 (whole-file trailing-
# whitespace churn defect). Floor is 3 by SIZE (271 files, +611/-611, 1222 net lines),
# not by hot-zone: migrations_v2 and .github/workflows are excluded from the sweep entirely.
task_id: owner-name-zero-v2
gear: 3
gate_class: sonnet
brief_ref: evidence/brief.yml
date: 2026-09-27
machine: M5
lanes:
  - lane: byte-preserving owner-name prose sweep (Antonello -> Zero), v2 rebuild
    role: build
    seat: claude-sonnet-5 (this worktree session, agent/air-m5/docs/owner-name-zero-v2)
    note: >-
      The superseded PR (see dissent for its exact numbers) churned whole files because its
      write step round-tripped every candidate through a decode/strip/re-encode path that
      silently stripped trailing whitespace on every line, not just the changed ones. This v2
      rewrites the sweep as a strictly line-scoped byte operation: split each candidate file on
      line terminators, leave any line that contains no match as raw untouched bytes (never
      decoded), and only decode/substitute/re-encode the specific lines that actually change.
      Enumerated candidates via `git grep -liE antonello` (excluding migrations_v2/.github/
      workflows), then built a FULL-FILE skip list (see brief.yml `constraints` for the exact
      breakdown: functional/off-limits files carried over from the superseded PR's review,
      research/**/*.md files that fail the R1 adversarial-review gate, PII-gate false-positive
      research docs, all of evidence/**, and redaction-rules.yaml) before running the sweep on
      the remaining candidates. Adversarial self-review of the FIRST v2 run (see dissent) caught
      two NEW functional collisions this exact task type had not hit before —
      `redaction-rules.yaml`'s prose description field, and a literal `git log` author-string
      quote (`Antonello Siano <noreply@anthropic.com>`) in a ledger file — both fixed by
      re-running from a clean tree with an updated skip list / regex guard, not by patching
      forward on top of the first run.

seat_diversity: exempt
seat_diversity_note: >-
  One build lane; D3's seat-diversity requirement does not attach (binds packs with >= 2
  build lanes).

seat_override: >-
  R9 council_run: no council convened. This is a mechanical, reviewable text substitution with
  an explicit, auditable rule set (see brief.yml `constraints` and this pack's `dissent`) — it
  touches no GROUND_TRUTH_PATH_PATTERNS entry (no visa rule, no KBLI code, no price, no tax rate
  is asserted or changed), so R8 does not attach either. In place of a second seat, this pack
  documents its own adversarial re-review pass against the sweep's own output, file-by-file,
  which is where every dissent entry below comes from — self-caught, not claimed clean by
  construction. This re-review is also what forced a full restart from a clean origin/main tree
  after the first v2 run, rather than a patch-on-patch fix.

outcome: >-
  271 files touched, +611/-611 (byte-preserving: every changed file's added-line count equals
  its deleted-line count, independently re-verified against the sweep's own transform_line()
  applied to origin/main content — see receipts). A case-insensitive, word-boundary count of
  "Antonello" (excluding migrations_v2, .github/workflows, and evidence/**, which legitimately
  quotes the literal word to document the sweep) drops from 1674 on origin/main to 1067 on the
  committed tree; every remaining hit falls into a documented KEEP/full-file-skip class named
  in brief.yml `constraints` (email, compound identifier token, functional dict-key/substring
  match, off-limits file, R1-gate-excluded research doc, PII-gate-excluded research doc,
  redaction-rule definition file, a literal git-author-quote, or a prettier-clean-on-main file
  a naive substitution would have knocked out of formatting compliance). py_compile/json.load/
  yaml.safe_load/bash -n are clean on every touched file of that type. Every test file that
  references a touched module passes individually at the same rate as origin/main (one
  pre-existing cross-file test-isolation failure, reproduced identically in this session,
  matches the same class already documented on the superseded PR — see receipts).

diff:
  shape: >-
    Mechanical, line-scoped text substitution across markdown, YAML/JSON string values, code
    comments and docstrings. No production code path changed behavior: every KEEP-class file is
    either entirely unopened (full-file skip) or has zero touched lines that matter functionally
    — no dict key, substring-match list, regex pattern, redaction-rule text, evidence-pack
    receipt, or off-limits file was written to, at all, this time (the superseded PR's approach
    of "sweep everything, then revert the mistakes" is replaced by "exclude the mistake classes
    from the candidate list before sweeping").
  measured: >-
    see the receipts entry for the exact `evidence_pack_lint.py --print-measured` invocation
    and its output at pack-authoring time; committing this pack changes its own diff size by
    construction, so no fixed file/line count is asserted here.

dissent:
  - seat: "PR #7430 review (team-lead, prior task)"
    objection: >-
      #7430 is defective: 359 files, +9456/-7986, while the actual name-hit count is ~1500 —
      the write step stripped trailing whitespace across WHOLE files (one file: 599 lines with
      trailing whitespace before the sweep, 126 after, for a single "Antonello" hit; another:
      1659-line churn for 1 hit).
    status: CONFIRMED
    disposition: >-
      Root-caused to a decode/strip/re-encode round-trip over entire files. Rebuilt the sweep
      (this v2) as a strictly line-scoped byte operation: a line with no match is never decoded,
      only re-emitted as raw bytes; a line with a match is decoded, substituted, re-encoded, and
      that is the ONLY byte range that can differ from origin/main. Proven per-file (receipts):
      added == deleted == independently-recomputed changed-line count, for all 271 files.
  - seat: self-review (same build lane, adversarial second pass over the v2 first run's output)
    objection: >-
      `agent-library/config/redaction-rules.yaml`'s `kura_kura_btid_case` rule's prose
      `description:` field ("out-of-repo per Antonello 2026-05-12 directive") got swept to
      "per Zero" — this file is a redaction-RULE definition, and brief.yml's KEEP list from the
      superseded PR named the whole file, not just its regex patterns, as unchanged.
    status: CONFIRMED
    disposition: >-
      Added the file to the full-file skip list and re-ran the sweep from a clean origin/main
      tree (not a forward-patch) so the diff carries zero trace of the mistake.
  - seat: self-review
    objection: >-
      `.claude/skills/modus/PENDING-ARMS.md` has 2 lines quoting a LITERAL git-log author string
      as forensic evidence — `author field \`Antonello Siano <noreply@anthropic.com>\` suggests
      an interactive session with that git identity configured` and an identical quote in a
      later ledger entry. The general substitution turned both into `Zero Siano <...>`, which
      would misrepresent what `git log`'s author field actually read at the time these ledger
      entries were written (a forensic claim, not a prose mention of the owner).
    status: CONFIRMED
    disposition: >-
      Added a dedicated regex guard (reject a match followed by `\s+Siano\s*<`) so any
      "Name Siano <email>" git-author-quote shape is left byte-identical, while plain
      "Antonello Siano" prose (56+ author-byline mentions elsewhere, none followed by `<`) still
      sweeps normally to "Zero Siano". Verified post-fix: both literal
      `Antonello Siano <noreply@anthropic.com>` occurrences survive untouched in the working
      tree; broadened the search (`git grep -noE "[Aa]ntonello[^<]{0,20}<[^>]+>"`) across the
      whole repo and found no OTHER instance of this shape outside PENDING-ARMS.md.
  - seat: self-review
    objection: >-
      A sibling PR's own already-merged evidence pack
      (`evidence/2026-09/agent-nuzantara-backend-phone-core-indexes-a007f7e5/pack.yml`) quotes a
      literal git-author-identity claim — "it leaned on the git author string `Antonello Siano`,
      which is only this machine's identity" — describing what a specific `git log` invocation
      returned. This is the same class of forensic-quote defect the superseded PR #7430 hit and
      hand-fixed in the same file; a blanket line-level fix cannot generalize across every
      possible phrasing of "the git author string was X" in an evidence pack.
    status: CONFIRMED
    disposition: >-
      Excluded ALL of `evidence/**` (6 candidate files) from the sweep's candidate list
      wholesale, rather than hand-reviewing each hit again. Evidence packs are point-in-time
      verification records; retroactively editing what they say a `git log` command returned
      would misrepresent the verification itself, independent of whether any individual
      instance happens to collide today. Verified: `git diff --stat -- evidence/` is empty on
      this branch.
  - seat: self-review
    objection: >-
      Running the candidate set's touched test files TOGETHER in one pytest invocation (rather
      than individually) produced 30 failures in `test_voice_legacy.py` (`assert 403 == 200`-
      shaped auth failures) that looked, at a glance, like this sweep broke something.
    status: PLAUSIBLE
    disposition: >-
      Reproduced: the SAME 30 failures occur when `test_voice_legacy.py` is run in the same
      pytest invocation as unrelated sibling test files, and `test_voice_legacy.py` run ALONE
      passes 35/35. This is a pre-existing cross-file test-isolation defect (global/env-state
      leakage between files), not a regression from this diff — matches the class already
      documented on the superseded PR's own pack. Verified per-file individually instead (see
      receipts).
  - seat: .husky/pre-commit's formatting gate (repo tooling, run at `git commit` time)
    objection: >-
      `git commit` was BLOCKED: `npx prettier --check` failed on 86 staged files. Team-lead's
      explicit v2 mandate bans running a formatter as part of this sweep (that mechanism is what
      produced the superseded PR's whole-file churn), so `prettier --write` was not an available
      fix.
    status: CONFIRMED
    disposition: >-
      Verified all 86 flagged files were themselves `prettier --check`-clean on origin/main (a
      dedicated script diffs each file's origin/main blob against a temp-file prettier check) —
      i.e. this sweep's own word-for-word substitution, though byte-preserving at the git-diff
      level, changed a line's rendered WIDTH enough to break a markdown table's column padding or
      a wrapped paragraph's line width on those 86 files specifically. Reverted all 86 to
      origin/main content (`git checkout --`) and added them to the full-file skip list, the
      same pattern already used for the R1-gate and PII-gate exclusions — not a formatter run,
      a narrower sweep. Re-ran `prettier --check` on the remaining 271 files' scoped subset:
      "All matched files use Prettier code style!".

