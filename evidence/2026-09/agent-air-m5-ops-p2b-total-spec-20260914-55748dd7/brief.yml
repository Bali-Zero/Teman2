open_findings_for_the_gate: >-
  (1) The deferral now hands a third criterion to the judge, which costs judge tokens and covers
  fewer cases deterministically. Zero approved the ternary outcome explicitly on 2026-09-14.
  (2) FALSE AS WRITTEN — the #6469 gate measured it and was right. The claim below was that a noun
  form outside the enclitic set lands in `undecidable`. It landed in `clear`, i.e. a MISSED TOTAL,
  because the coexistence net reused COUNTED_NOUN and therefore inherited the entity's own blind
  spot: `kode2`, `kodepun`, `kodenyalah`. Corrected in the follow-up by giving the net a
  deliberately wider noun, which makes the sentence true instead of retracting it. Left here
  unrewritten, with this annotation, because the record of what was claimed is the point.
  ORIGINAL CLAIM: "The enclitic set is closed and Indonesian-only: -nya, -ku, -mu, -kah, -lah. A
  form outside it lands in `undecidable`, not in `clear`, so the failure mode is a judge read
  rather than a missed total. Widening it means editing the spec first, by its own acceptance
  criterion 6."
  (3) #6428's council quorum was never met and its pack still says so on main. This PR does not
  cure that and does not claim to.

lesson:
  what: >-
    Seven adversarial rounds, three seats, and every one of them argued about the alternation. The
    defect was one line away, in the `[^.;]{0,40}` that nobody read as a claim.
  why_it_matters: >-
    A guard with two outcomes on a three-outcome question will keep producing defects, and each
    round will look like progress because it fixes the case in front of it. The fix was not a better
    regex, it was admitting that the third class exists — which the same function had already done
    twice, for the same reason, in the same docstring.
