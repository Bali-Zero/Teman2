objective: >-
  Write the spec the code itself asked for, and implement it. The comment above COUNTED_NOUN on
  origin/main ends "The spec this needs is 'what counts as quoting a total', written down — not
  another alternation." This is that document plus its implementation and fixtures.

the_finding: >-
  Seven council rounds patched the NOUN. The cause was the RELATION. The criterion asked only that
  the numeral and the noun sit within 40 characters of one clause, and proximity is not a count.
  Measured on origin/main, all four of these CONVICT and none quotes a code total:
  "biaya rp 48 juta untuk kode baru" (48 million rupiah for a new code); "pasal 48 mengatur kode
  etik perusahaan" (article 48 governs the code of ethics); "518 halaman berisi daftar kode"
  (518 pages contain the list); "48 dari kode yang berstatus itu". Separately, round 6's
  right-hand \b lost "48 kodenya terkena moratorium", which convicted before it — and that
  direction inflates the score, because decidable_pass is `all(required) and not totals`.

