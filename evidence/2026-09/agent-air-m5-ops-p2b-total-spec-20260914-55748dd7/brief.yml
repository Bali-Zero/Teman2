    loses its tail. Both items that name one are block scalars for that reason.
  - decidable_pass keeps its exact formula. An undecidable clause lowers nothing — that is the point.
  - Two pre-existing tests pinned the deferral list by exact value and by bare count. Both were
    updated with the reason written beside them, and the complete list is now pinned in exactly ONE
    place so a criterion silently DROPPED still fails.

