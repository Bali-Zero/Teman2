deviations:
  - id: D-R2-1
    what: >-
      Setting NUZANTARA_MANDATE_ID also sets child_workflow's strict mode
      (budget_mode="enforced"), whose UNKNOWN-measurement warning names 3600 active seconds and
      120 tools per child, while this mandate declares an adapter tool ceiling of 150.
    disposition: >-
      Accepted knowingly, not smuggled. The 3600s/120-tool figures govern CHILD ACTIVE TIME; the
      MISSION wall clock is owned by mandate_budget and is bound above to 15:35:58Z — the code
      says so at child_workflow.py:244 ("it is not the mission deadline"). Determinism of the
      ledger key is worth more than 30 tool calls of child headroom, and ship_reserve_N=0 already
      requires a capped child to checkpoint and return rather than ship.
  - id: D-R2-2
    what: "The worktree broker refused the mandated branch name: it already existed."
    disposition: >-
      Residue of the first agent_start.py run, which died mid-checkout on a full disk AFTER
      creating the branch. Verified safe before removal: exactly at origin/main, 0 unique commits,
      no worktree, never pushed, reflog showing only "Created from origin/main". Removed by the
      sanctioned route — a temporary worktree, `git -C <that worktree> branch -D`, release — NOT
      by AGENT_WORKTREE_ENFORCEMENT=false, which the guard's own header forbids and which does not
      work as an inline prefix anyway.
  - id: D-R2-3
    what: "Pro's disk was 100% full (275Mi free) at open and blocked worktree creation for ~90 minutes."
    disposition: >-
      Cause measured: 61 abandoned com.google.Chrome.chrome_chrome_url_fetcher_.* directories in
      the user TMPDIR holding 47G, one 1.2–2.4G partial .crx3 each, all the same extension id and
      version. Escalated to Zero, who ruled FIX. THE RECLAIM WAS NOT PERFORMED BY THIS WINDOW:
      the deletion loop reports DEL=0 because every target failed its `[ -d ]` test — the
      directories were already gone when it ran. Most plausible cause, stated as such and not as a
      measurement: Chrome's own startup cleanup of its abandoned url_fetcher temp dirs (Chrome
      launched 18:45:10 WITA, inside that window). Recorded this way because claiming an effect
      this window did not produce is the failure mode the fleet calls diabolical.

