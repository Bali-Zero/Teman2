objective: |
  Canonical Claim, Evidence, IntelEvent and ObjectSuccessorEdge objects are written to
  research_os_objects atomically and read bitemporally per D3; legacy naga_claims rows pass the
  D4 admission or are excluded with a named reason; the admitted cohort is backfilled
  idempotently and read back.

  What success changes: the first real Research OS rows exist in production with provenance that
  survives the admission rules, and "what did we hold true on date T, as known at time S" has one
  executable answer. Ledger row 21 — open since 2026-08-26 with an owner nobody ever took —
  closes with the migration as proof-of-armed.

