  (regexp and integer arithmetic only, no cast anywhere), two expression indexes over the D2
  valid-time keys under COLLATE "C", and one projection table research_os_naga_admission carrying
  BOTH append-only guards — row-level UPDATE/DELETE and statement-level wipe — each binding
  migration 279's function verbatim. The persistence API verifies the hash in Python before
  INSERT, commits successor and edge in one transaction, rejects a second successor for the same
  predecessor, rejects a classification-lowering successor, and writes 0 rows on replay. The
  reader answers the whole temporal case list and returns explicit abstention or explicit
  quarantine where the contract requires one. The backfill defaults to --dry-run and was OBSERVED
  against production: 3,119 legacy rows read, 0 admitted, 3,119 excluded with a named reason,
  0 rows written. Ledger row 21 closes with the migration as proof-of-armed.
  NOT FROZEN at pack time: migration 312's rollback section is still empty and two tests are red
  for exactly that, pending Zero's ruling on a line the guardrail refuses as a TRUE positive.

