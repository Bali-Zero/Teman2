    is claimed.

dissent:
  - seat: kimi-code/k3
    objection: >-
      naga_persistence._WRITE_INSTANT_RE spelled its digit classes \d, which is Unicode-aware in
      Python, while migration 312 spells them POSIX [0-9]. An instant whose FRACTION alone carries
      a non-ASCII digit was therefore admitted by the writer and keyed NULL by the storage
      function — a row present in the store and invisible to both D2 index predicates forever.
    status: CONFIRMED
    disposition: "ACCEPTED and CURED in 37e5ace51e — the Dux reproduced it on both sides before curing. The writer now spells digits exactly as the key does."

  - seat: kimi-code/k3
    objection: >-
      naga_bitemporal_reader.read() raised KeyError on a structurally malformed stored row instead
      of quarantining it. D3 allows exactly two non-answers, abstention and quarantine; an
      exception is neither, and it takes read() down for the whole subject_key including sound
      families. Reachable because research_os_objects has a second writer and no payload-shape CHECK.
    status: CONFIRMED
    disposition: "ACCEPTED and CURED in 3f750d0a82 — structure is checked first and returns early; two new quarantine reasons, malformed_member and malformed_edge, plus an innocence test proving a sound family still Answers."

  - seat: kimi-code/k3
    objection: >-
      test_naga_backfill_unit.py carried `assert manifest_hash not in text or True` — a disjunction
      with a true literal, i.e. an assertion true for every input, sitting inside the test that
      claims to enforce the Law 2 output boundary.
    status: CONFIRMED
    disposition: "ACCEPTED and CURED in c72d306b4a — the real contract is the opposite (the manifest hash IS expected in the report), so it now asserts presence; the sentinel-absence assertions are untouched."

  - seat: kimi-code/k3
    objection: >-
      Two plain CREATE INDEX (not CONCURRENTLY) on the live research_os_objects run inside the
      migration transaction, blocking writers for the duration of two index builds; the header
      explains why CONCURRENTLY is impossible but never addresses the write-block window.
    status: CONFIRMED
    disposition: "ACCEPTED as accurate, NOT cured — measured cost is near zero: research_os_objects holds 0 rows in production (read-only measurement above). CONCURRENTLY cannot run inside the transaction the migration runner wraps every forward execute() in. Named in the PR body rather than silently dropped."

  - seat: kimi-code/k3
    objection: >-
      Four LOW findings left open by decision: the declared-hash fallback when recompute is
      unavailable; a NULL valid_from being unkeyable so index and _covers would disagree;
      `eligible` meaning different things in dry-run and apply; and the AST write-fence scan
      seeing only literal first arguments of conn.execute.
    status: CONFIRMED
    disposition: "NAMED, NOT CURED in this slice — each is unreachable through this slice's own CLI on the production cohort. Carried into the PR body by name so the next slice inherits them stated, not discovered."

