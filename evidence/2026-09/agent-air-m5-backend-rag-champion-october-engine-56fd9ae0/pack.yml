pii_scan: clean
seat_override: >-
  This mission provisions one independent external reviewer (Codex,
  dispatched as codex-be-review) per PR plus the mission's fresh Opus 5.5
  final gate, not a multi-seat COUNCIL_REVIEW_SEATS quorum. Gear 3 here is
  justified by the release-critical-path and the hard 2026-09-30 00:00 WITA
  deadline (see brief.yml gear_reason), not by a design decision that needs
  adversarial council debate — the scoring rules are spec-given by the team
  guide PDF and Zero's 2026-09-29 ruling, not designed in this PR, so no
  COUNCIL_REVIEW_SEATS quorum was convened.
dissent:
  - seat: claude-sonnet-5 (be-round2, self-check during build)
    status: CONFIRMED
    objection: >-
      The first version of three Round 2 SQL builders (first-document
      bonuses, unanswered-request penalties, unreviewed-document penalties)
      joined `practices p` to `c.assigned_to` without a `real_clients c`
      join in scope, so `python3 scripts/portal_challenge_leaderboard.py
      --round 2` failed against production with an undefined-column error
      the moment it ran read-only, not in a unit test (a scratch-schema
      pytest run cannot show a missing-join error the same way live prod
      SQL does). FIXED in 209fbf0a5f: all three builders now join
      `real_clients` before referencing the assignee column. Re-run this
      session (`python3 scripts/portal_challenge_leaderboard.py --round 2`)
      exits 0 against prod with no SQL error.
  - seat: codex-be-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · challenge_round2.py:656 · "Unauthorized prize threshold" ·
      `points > 0` denies a rank prize despite the spec's rank-only rule ·
      suggested fix: remove the threshold and correct its tests. REJECTED
      as a code fix — a DESIGN decision by the Dux: the guide pays prizes
      "by final ranking"; a member with 0 points is not ranked (the UI
      already shows "–" for them), and paying rank 5 to every one of the
      15 zero-point roster members is not the owner's intent. The owner can
      still overrule this; noted for the mission's close row either way.
  - seat: codex-be-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · challenge_round2.py:622 · "Asya's request bonuses are
      missing" · callers supply only document uploads, so a qualifying
      client REQUEST yields 0 instead of +3 · suggested fix: combine
      requests and uploads before bonus dedup/event generation. ACCEPTED →
      CURING (be-round2 fixing at pack-authoring time); cure commit SHA
      pending from the Dux, to be added to this entry before the pack ships.
  - seat: codex-be-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · challenge_round2.py:554 · "Unattributed document bonuses
      vanish" · skipped/unattributed rows never reach team_total_points,
      reproduced 0 instead of +3 · suggested fix: track unattributed points
      separately. REJECTED as a code fix — spec §4 defines
      team_total_points as the sum over RANKED entries; an unattributed
      event is counted (in the roster's aggregate documents/requests) but
      credited to nobody by design, since nobody is responsible for it.
  - seat: codex-be-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · challenge_round2.py:284 · "Review query lacks the window's
      upper bound" · a post-window document upload can penalize an October
      score · suggested fix: require UTC-normalized `uploaded_at <
      ROUND2_END`. ACCEPTED → CURING (be-round2 fixing, plus an audit of
      the other R2 builders' upper bounds per the same class-audit
      convention); cure commit SHA pending from the Dux.
  - seat: codex-be-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      major · challenge_events.py:118 · "Registration triggers full
      leaderboard recomputation" · eight additional global queries and
      synchronous scoring inside the goal-publish path jeopardize the
      3-second deadline · suggested fix: fetch creator-specific inputs and
      verify latency. ACCEPTED-RISK, not cured now: the underlying tables
      are small and window-bounded, and the 3 s deadline already guards the
      registration path with its own timeout. Recorded as a watch item for
      the mission's close row — measure p95 latency in Fly logs during
      Round 2's first week and revisit if it approaches the deadline.
  - seat: codex-be-review (independent adversarial reviewer)
    status: CONFIRMED
    objection: >-
      minor · challenge_round2.py:489 · "Equal timestamps incorrectly
      qualify as prior outreach" · `<=` awards Asya's +3 mission bonus even
      when the staff message and the client event share the exact same
      timestamp, with no message actually preceding the event · suggested
      fix: use `<` and add an equality test. ACCEPTED → CURING (be-round2
      fixing); cure commit SHA pending from the Dux.
      ---
      Overall verdict from codex-be-review: FIX-FIRST. Its own receipt:
      "High confidence at 29827d3935: 71 selected tests and 343 inverse
      checks passed; verification receipt is current/reusable. Uncommitted
      changes excluded; live PostgreSQL, load testing and the full router
      suite were not executed" — i.e. its own pass ran against the
      pre-fix HEAD (29827d3935) with the scratch-schema/unit-test surface
      only, not against production or the fixes above.
