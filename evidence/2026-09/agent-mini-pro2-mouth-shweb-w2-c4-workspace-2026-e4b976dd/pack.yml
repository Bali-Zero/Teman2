decisions:
  - >-
    The photo map is DERIVED from the roster. Measured against the hand-written map it replaces: 14
    entries identical, 0 disagreeing, 2 email aliases the roster cannot express (ari.firda,
    dewa.ayu — kept explicitly), and 4 people who have a roster portrait but were MISSING from the
    map (zainal, heru, ruslana, vino). Those four now render their photo on the internal directory
    instead of a blank. That is a consequence of having one source of truth, and it is declared
    rather than discovered later.
  - >-
    The tax-consultant list is MOVED but NOT derived, and this is the load-bearing judgement of the
    PR. Its `value`s are constrained by a backend CHECK (migration 093) and the ROSTER DISAGREES
    with two of them: the roster holds `faysha.tax@…` (with a Y) where the constraint holds
    `faisha.tax@…`, and `tax@balizero.com` where the constraint holds `veronika.tax@…`. Deriving
    would have silently changed what this form submits and broken the constraint. So the five
    values are preserved byte-for-byte and only moved off the client — and the disagreement itself
    is raised as a finding below, because one of the two records is wrong and which one is the
    owner's call.

