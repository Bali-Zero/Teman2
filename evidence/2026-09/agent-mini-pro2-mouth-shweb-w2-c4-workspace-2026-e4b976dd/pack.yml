the_hole:
  what: >-
    Three (workspace) pages were "use client" and each held a hardcoded staff table: a photo map
    keyed by email prefix (team-management) and a tax-consultant dropdown of email + display name
    (lkpm, and clients/[id] via components/TaxTab.tsx). A client module's constants ship to the
    browser, so the names sat in three route chunks.
  why_it_was_missed: >-
    Because "internal" was treated as sufficient. The pages ARE behind auth — and the CHUNKS are
    not. A Next static asset is served from the public CDN path with no session, so an anonymous
    `curl https://balizero.com/_next/static/chunks/app/(workspace)/lkpm/page-13cbbb4d6ca5effb.js`
    returned HTTP 200, 24,724 bytes, and both `faisha` and `Faisha`. The same held for
    team-management. #6313's pack and PR body called those chunks an "authenticated internal
    surface"; that sentence was mine and it was wrong, which is how this was found.

