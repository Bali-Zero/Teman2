dissent:
  - seat: gemini-3.1-pro AND kimi-code/k3 (independently, and I had reached it first by measuring)
    objection: >-
      BLOCKER — passing the tables as SERVER props serialises them into the RSC flight payload
      inside the HTML, so the fix merely moves the names from a JS chunk into a served document.
      Gemini added that the guard is blind to that surface entirely.
    status: CONFIRMED
    disposition: >-
      TRUE, and it was the reason this PR stopped before opening rather than shipping. Measured on
      the built server: an anonymous GET /lkpm returned 200 with
      `"value":"faisha.tax@balizero.com","label":"Faisha"` in the HTML. The ROOT CAUSE turned out to
      be older and larger than the tables: src/proxy.ts keeps an INTERNAL_ROUTES list that redirects
      workspace pages off the public domain, and /lkpm was the only one missing from it — measured
      on production, /team-management and /clients answered 301 while /lkpm answered 200 with
      48,529 bytes. Ruled option (A) by the imperator: /lkpm added to INTERNAL_ROUTES, one array
      element. After it, every anonymous public-host variant of /lkpm — plain, RSC header,
      prefetch header, ?_rsc= — answers 301, and the public response is 30 bytes with 0 names. Two
      tests pin it and the mutant that removes the entry turns one red. The guard's blindness to
      server payloads is left in place ON PURPOSE and stated in its own header: that surface is
      R-A, escalated as its own window.
  - seat: gemini-3.1-pro
    objection: >-
      BLOCKER — the <Image src> call still uses the one-argument getTeamPhoto, a type hole that
      breaks the build. And MAJOR — ClientDetailClient calls useSearchParams, which needs a
      <Suspense> boundary once it sits under a server wrapper.
    status: RETRACTED
    disposition: >-
      Neither reproduces. The call site was updated in the same change — the seat was reading a
      truncated hunk — and it is now a single hoisted call per member with the non-null assertion
      gone, which was Kimi's suggestion. `npm run typecheck` exits 0, and a missing required
      argument could not survive that. On Suspense: the build emits no such warning and
      kita.balizero.com/clients/1 answers 200 with no error digest in the document.
  - seat: kimi-code/k3
    objection: >-
      MAJOR — the narrative "no public asset carries these names" is overstated while the portraits
      sit in public/: `curl /static/team/sahira.jpg` returns 200 and the URL is the name, and the
      guard only walks .next/static/chunks so it cannot see the one surface where the names
      demonstrably still are.
    status: CONFIRMED
    disposition: >-
      Right on both halves. The guard now scans public/ by filename too, and the two portraits are
      listed in ACCEPTED_PUBLIC_FILES with the reason — so the exposure is a decision that a reader
      can see, and a third such portrait fails the build (probed). The claim in the body is
      corrected to say what is actually true rather than what sounded finished.
  - seat: kimi-code/k3
    objection: >-
      MINOR/NIT — the derivation assumes slug == email prefix, which this very file disproves; the
      [id] wrapper's comment contradicts its code; the required-prop blast radius is asserted, not
      shown.
    status: CONFIRMED
    disposition: >-
      All three taken. The slug assumption is now pinned by a test that keeps the 16 historical map
      keys and both aliases — measured, six roster entries do have slug != email prefix, and the
      four people the derivation gains were verified to have slug == prefix so they really do render.
      The comment is reworded to say it forwards no ROUTE PARAMS but does hold the consultant table.
      And the blast radius is shown rather than asserted: `npm run typecheck` exits 0 over the whole
      app, which a missing required prop cannot survive.

debt_out_of_scope:
  - >-
    The roster/backend email disagreement named above (faysha vs faisha; tax@ vs veronika.tax@).
    Not a presentation matter: one record is wrong and correcting either one has consequences
    outside this PR. Raised for the owner.
  - >-
    public/static/team/faisha.jpg and sahira.jpg remain directly addressable on the public origin.
    Pre-existing, raised during #6277, already with the owner. No page links them.

  - seat: tp1-qwen3.8-max
    objection: >-
      GO, with hardening: the chunk walker matched only `.js` so an `.mjs`/`.cjs` chunk would be
      skipped in silence; ACCEPTED_PUBLIC_FILES compared case-sensitively, so a `Faisha.jpg` on a
      case-sensitive filesystem would fail the build as unexpected while being the declared file;
      FORBIDDEN is a closed enumeration with no pointer to the exclusion list it must track; and
      `const TAX_CONSULTANTS = taxConsultants` re-introduced the very identifier that used to hold
      the leaked table.
    status: CONFIRMED
    disposition: >-
      All four taken. The walker matches /\.[cm]?js$/; the accepted list is compared lowercased on
      both sides; FORBIDDEN carries a comment naming the two constants in team-public-listing.ts it
      has to stay in step with, because a person added to the exclusion and not here is a person
      this guard will not look for and it will pass in silence; and the alias is gone, the prop used
      directly. The seat also independently confirmed the things this PR most needed a second pair
      of eyes on: that the RSC payload no longer matters once the route 301s, that the derived photo
      map loses nothing and gains four, and that moving the tax list rather than deriving it was the
      right call.

