residuals: # the imperator's R-A and R-B, declared and NOT fixed here
  - id: R-A
    what: >-
      The workspace has no SERVER-side session gate: (workspace)/layout.tsx is "use client" and
      gates with GateScreen after the payload has already been sent. So any server-rendered payload
      of a workspace route is readable by an anonymous request that reaches the route — which on the
      public domain it no longer can (301), but on the app domain it can.
    status: >-
      Escalated by the imperator to Zero as its own window. NOT fixed here by order, and the guard
      says so in its own header rather than only in this pack: extending it to that surface before
      the decision would mean writing an allowlist that encodes the thing under review.
  - id: R-B
    what: >-
      public/static/team/faisha.jpg and sahira.jpg stay fetchable by direct URL — measured 200,
      66,303 and 69,448 bytes, and the URL itself is the name. No page links them.
    status: >-
      An explicit decision pending Zero, now encoded as ACCEPTED_PUBLIC_FILES in the guard so a
      THIRD such portrait fails the build instead of quietly joining them.
  - id: R-C
    what: >-
      The roster's own emails disagree with the backend CHECK the tax dropdown submits: roster
      faysha.tax@… vs constraint faisha.tax@…, and roster tax@balizero.com vs constraint
      veronika.tax@…. One of the two records is wrong.
    status: >-
      Raised for the owner. The list is moved, not derived, precisely so this PR does not silently
      pick a side; roster-directory.test.ts pins both spellings so a later "tidy-up" into a
      derivation fails.

