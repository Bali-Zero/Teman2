plan_ref: >-
  Zero, 2026-09-23 ("decidete e valutate voi"): the sessions adjudicate the 10
  codes the F4 refresh loop (#7136) proposed on Mini, and ship the applier the
  loop deliberately does not have. PENDING-ARMS row
  kbli-oss-refresh-proposals-have-no-applier.

# One build lane, the repo's own convention (cf. the #7153 pack): the
# implementer seat is the build lane; the Opus 5 architect that adjudicated
# the 10 codes is orchestration, and is named on the record it signed
# (`adjudicated_by` in oss_refresh_adjudication_2026_09_22.json). The two
# review seats could not also have built — generator is never grader.
lanes:
  - lane: build
    role: build
    seat: claude-sonnet-5
  - lane: review-cross-family-codex
    role: review
    seat: codex-gpt-5.6-sol
  - lane: refute-cross-family-kimi
    role: review
    seat: kimi-code/k3
  - lane: oss-identity-ground-truth
    role: ground_truth
    seat: kimi-code/k3
    nb: >-
      KBLI_2025_OSS_GROUND_TRUTH.json — the independent OSS RBA 2025 dump, not
      an NLM notebook: this diff's ground truth is the government endpoint the
      canonical is sourced from, and the refuter re-read it per kode instead of
      trusting the spec.
    query_hash: >-
      per-code uuid + ruang-lingkup comparison for all 10 codes; result: 10/10
      uuids match their kode, 0 scope texts shared between any two codes

what_changed: |
  The adjudication and the compiler that applies it. `apply_oss_refresh.py`
  routes each of the 10 codes through one of two gates — `l2_transform`
  (93114, judged against the spec's four premises) and `quarantine_owner` (the
  other 9, refused unless the signed adjudication names the code
  `adopt_oss_2025` and its record/oss_rows/disputed pins all hold). The run is
  all-or-nothing. Applied canonical + the 5 consumer copies + the mouth
  sidecar; 93113/93193 carried into the residual-open lots their lot rule now
  reaches; every census/artifact pin re-emitted by its own generator.

  After the 2026-09-23 council both seats' findings were cured in one round:
  a `set`/`drop_keys` fence plus a pre-write check so a refusal can never
  leave a half-cured canonical, and a restore of the pre-cure bytes if the
  read-back still disagrees (Codex F1); the RECORD, not the spec, decides
  whether a declared route is admissible, and no route may touch a
  `per_skala_disputed_*` key (Codex F2); the l2 rows must hash to their own
  `premises.per_skala.new_sha256`, closing the wrong-code application that
  every pin otherwise allowed (Codex F3); `--apply` always reconciles, so a
  killed or failed propagation is repairable instead of permanent, with an
  idempotent sidecar restamp (Codex F4 = Kimi F1, following
  populate_bps_ancestors.py's own rule); the adjudication pins the disputed
  block's CONTENT, so a post-cure re-run cannot answer "noop" over a rewritten
  audit trail (Kimi F2); the spec's `canonical_sha256` is enforced on the
  all-patch run, the only run where it speaks (Kimi F3); `load_dataset` and
  the apply loop can no longer escape as a traceback (Kimi F6); the deprecated
  class-scoped fixtures are `@staticmethod` (Kimi F7).
  Tests: 39 in the compiler suite (was 27).

proof: |
  See receipts. Full kbli_filiera battery green. 11 of 11 mutants killed, each
  reverting exactly one council fix, source restored byte-identical. The 10
  codes' `per_skala` are distinct from each other AND unique across the whole
  canonical, and all 9 disputed blocks are byte-identical to origin/main's —
  measured, not asserted. Licensing axis 1340/217/2 -> 1350/209/0.

dissent:
  - seat: kimi-code/k3
    objection: >-
      F5(i) the v2/v3 emitters declare the v1 calibration artifact SIGNED and
      NEVER rewritten (scar W88/#9), yet this branch re-emits all three in
      place to move their pins.
    status: CONFIRMED
    resolution: >-
      Confirmed and deliberately not changed here. Measured: the v1 artifact
      has been re-emitted in place by at least 8 prior cure PRs already on
      main (ce660dde01, 6189cd821d, 71f01e508c, 66500c7c3f, 49e6773ff6,
      eaa5a69cf8, 1c8725d263, 7c977eaf73), so this is the repo's established
      practice, not something this PR introduces. And the substance is
      untouched: the key-level diff of batchA-calibration.json is three fields
      — eligible_population 1340->1350 and two pins. The gold-set digests, the
      drawn sample, do not move. Whether a signed artifact may carry a moving
      denominator at all is the owner's doctrine call, not a session's, and it
      belongs to every one of those 8 PRs equally.
  - seat: kimi-code/k3
    objection: >-
      F5(ii) the `canonical_revision` pin these artifacts carry (12dc6d5359)
      is not an ancestor of HEAD — a pre-rebase orphan. The audit pin dangles.
    status: CONFIRMED
    resolution: >-
      Confirmed, and structural rather than local: origin/main's own copy pins
      4f7bf2580f, which `git cat-file -t` reports is not even a valid object.
      Under squash-merge no branch commit survives, so this field can never
      resolve post-merge for any emit. Nothing outside the emitters' own tests
      reads it; the content pin `canonical_sha256` is what consumers validate
      and it matches. Fixing the field's semantics is its own PR.
  - seat: kimi-code/k3
    objection: >-
      F4 the committed l4bali spec carries an inline-short-array formatting
      layer the emitter never emits, so a byte-level --check against raw
      emitter output will always diff.
    status: CONFIRMED
    resolution: >-
      Confirmed and left as is: re-emitted content is exact (verified here —
      json-load equality against a fresh `--emit`, only array wrapping
      differs), the formatting has been constant since the file's birth
      commit, and no --check exists to break. Noted so the next reader does
      not mistake the wrapping for drift.
  - seat: claude-opus-5
    objection: >-
      apps/kbli-navigator/lib/__tests__/kbli-data.test.ts, whose gap/located
      pins this PR moves, is executed by nothing.
    status: CONFIRMED
    resolution: >-
      Measured: the package's scripts are dev/build/start only, it has no
      vitest/jest config, it is not in the root workspaces (root `test` is
      `npm run test:ci -w apps/mouth`), and no workflow runs it. The pins
      edited there are inert documentation. Scar family #2 (Esiste != Armato).
      Arming a runner for that package is its own PR; the same arithmetic is
      live-enforced by mouth's six equivalent suites, which are green here.

