task: >-
  C1 of the cc-meta-loop backlog: every headless `claude -p`/`--print` invocation in the repo
  carries a context-diet flag (`--restricted`, `--safe-mode`, `--setting-sources`) or an
  explicit `# context-diet: exempt — <reason>` pragma. A new lint
  (`scripts/lint/lint_claude_headless_context_diet.py`, reusing the anchor/window engine of
  lint_claude_headless_limits.py, file-level grandfather list that only shrinks, --selftest,
  monotone check vs origin/main) wired into immune-enforcement.yml; plus three cures in the
  same PR: agent_job.py session bootstrap (2 text-only calls → --restricted --strict-mcp-config),
  claude_vision.py (needs Read → --safe-mode, proven live with a one-boolean json-schema
  against an on-disk PNG), and the exempt pragma on the deliberate Canva-MCP exception.
lane: infra/cc-context-diet-lint
machine: Air-M5
date: 2026-09-17
gear: 2
gear_reason: >-
  Deterministic floor 2, source `size`: churn 780 (lint 537, test 187, grandfather 26,
  workflow 16, cures 14) — above SIZE_GEAR2_THRESHOLD (400), below 1828; no hot-zone path.
  Successor of #6703, which was armed without this brief and went red on the SIZE term.
appetite:
  wall_clock_hours: 1
  adversarial_rounds: 1
acceptance:
  A1: >-
    The lint proves its own guilt path, then reports the repo clean with the debt frozen.
    probe: python3 scripts/lint/lint_claude_headless_context_diet.py --selftest && python3 scripts/lint/lint_claude_headless_context_diet.py
    observed: "SELFTEST PASS; clean (3756 files scanned, 20 grandfathered, 0 new) — 2026-09-17 13:2x local"
  A2: >-
    The unit tests (guilt + 4 innocences incl. pragma above anchor and path-mention) pass.
    probe: ~/nuzantara/.venv/bin/python3 -m pytest scripts/lint/test_lint_claude_headless_context_diet.py -q
    observed: "10 passed in 0.15s"
  A3: >-
    The cured bootstrap shape still yields a session_id (what agent_job.py extracts).
    probe: claude --print --restricted --strict-mcp-config --output-format=json --model haiku "Session init selftest" </dev/null | python3 -c "import json,sys; print(bool(json.load(sys.stdin)['session_id']))"
  A4: >-
    Declared blind spot, not a defect of this PR: an invocation built through an argument
    array (`CLAUDE_ARGS=("--print")` … `"$CLAUDE_BIN" "${CLAUDE_ARGS[@]}"`, e.g.
    infra/launchagents/wrappers/claude-cascade.sh) is outside the engine's window and is
    neither flagged nor grandfathered — recorded as backlog row C1c.
out_of_scope: >-
  Curing the 20 grandfathered files (each needs its job proven green on its own machine);
  the cascade wrapper (C1c); the sandbox (S1).
bites: >-
  Consumer: the `Claude-headless-context-diet lint` step of .github/workflows/immune-enforcement.yml
  on every PR, and scripts/cron-agent-python/agent_job.py's 21 jobs whose bootstrap now costs
  ~15k tokens instead of ~36k. Observation: that step green on this PR with --selftest having
  proven the guilt path on the runner; A1/A2 above on this worktree.
