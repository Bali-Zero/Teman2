dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      BLOCKER. MigrationManager(database_url=A) pools/locks/ledgers on A while
      BaseMigration.apply() re-resolves the global DSN and may execute the SQL on B.
    status: CONFIRMED
    resolution: >-
      apply() takes `database_url`; apply_migration passes the manager's own. Unit test
      test_manager_hands_its_own_dsn_to_every_apply pins it.
  - seat: codex-gpt-5.6-sol
    objection: >-
      MAJOR. The guard accepted principals that cannot do the choreography: MEMBER is not
      the PG16+ SET privilege; ledger membership never checked; a dedicated DSN that IS the
      runtime role passed via the current_user shortcut; a connection-time role setting
      defeats RESET ROLE undetected.
    status: CONFIRMED
    resolution: >-
      All four refused before any statement (SET privilege on PG>=16, MEMBER on 15 — CI is
      postgres:15; ledger membership when the role exists; session_user == runtime refused;
      current_user != session_user refused unless already the runtime role on a re-acquired
      pool connection). Six parametrised guilt tests + two real-Postgres refusals.
  - seat: codex-gpt-5.6-sol
    objection: >-
      MAJOR. "Unset means zero behaviour change" was false: a single-DSN session that is a
      member of the runtime role (every superuser is) would now SET ROLE.
    status: CONFIRMED
    resolution: >-
      Single DSN is an unconditional early return with no catalogue read;
      test_single_dsn_is_an_unconditional_no_op asserts zero fetches and zero statements.
  - seat: codex-gpt-5.6-sol
    objection: >-
      MAJOR. The real-Postgres test created nothing while RESET, never ALTERed a
      ledger-owned table, never reassigned a reset-created table; runtime ownership is a
      convention, not a tested invariant.
    status: CONFIRMED
    resolution: >-
      The choreography test now ALTERs a ledger-owned table's CHECK (304's shape), creates
      a table while reset, proves it migrator-owned, hands it to the runtime role, and reads
      every owner from pg_class/pg_proc afterwards. Running the real 304 through
      BaseMigration.apply() is PR #5526's test, where the file lives.
  - seat: codex-gpt-5.6-sol
    objection: >-
      MAJOR. The reconciliation branch (schema_migrations has the row, _schema_versions does
      not) records applied_as with the CURRENT runner, attributing a historical manual
      superuser apply to the migrator.
    status: PLAUSIBLE
    resolution: >-
      Out of this PR's scope: the branch and its attribution predate the diff and no row in
      production is in that state today (every 30x row carries applied_as). Recorded here so
      the next provenance change sees it; not ledgered as debt because it changes no live
      behaviour.
  - seat: codex-gpt-5.6-sol
    objection: >-
      MINOR. A non-MigrationError raised by the role assumption leaked the direct connection.
    status: CONFIRMED
    resolution: >-
      Any exception closes the connection and re-raises as MigrationError;
      test_apply_closes_the_connection_when_the_catalogue_read_fails.
  - seat: kimi-code/k3
    objection: >-
      MINOR. Superuser refusal read only session_user's own rolsuper; a non-superuser member
      of a superuser role could SET ROLE up to it from inside a migration file.
    status: CONFIRMED
    resolution: >-
      The catalogue probe adds `reaches_super` (member of any rolsuper role) and refuses it;
      parametrised guilt case "reaches-superuser".
  - seat: kimi-code/k3
    objection: >-
      MAJOR. The documented RESET ROLE / SET ROLE bracket is not CI-portable: a bare
      `SET ROLE backend_rag_v2` raises 42704 where the role does not exist, so 304 written
      that way would abort CI.
    status: CONFIRMED
    resolution: >-
      No migration file is in this diff. The convention is now written into the STEP5
      decision header as a guarded DO block (pg_roles + pg_has_role check before
      EXECUTE 'SET ROLE'), the shape 268/300/301 already use for the transfer itself; the
      304 PR's real-Postgres test must apply the file through BaseMigration.apply() in
      the CI shape (superuser, roles absent) as well as in the option-D shape.
  - seat: kimi-code/k3
    objection: >-
      MINOR/NIT. resolve_migration_dsn docstring overclaimed ("services never read it" —
      services/misc/migration_runner.py builds a manager); dead `row is None` branch; stale
      MigrationManager docstring; config tests appended to an unrelated test class.
    status: CONFIRMED
    resolution: All four corrected in this diff.
  - seat: kimi-code/k3
    objection: >-
      Test vacuity: no end-to-end apply() wiring test (assume → tx → file SQL → provenance);
      real-Postgres tests skip silently without a local admin DB; _ADMIN_URL imported from
      a visa_engine test module.
    status: PLAUSIBLE
    resolution: >-
      The apply() wiring is exercised by the existing 114/115/116 roundtrip and legacy
      promotion suites (65 tests, unchanged, green) through the SAME apply() path; the
      option-D end-to-end apply is PR #5526's test with the real 304. The skip/import
      shapes are the ones every sibling real-Postgres test in this tree already uses.
  - seat: kimi-code/k3
    objection: >-
      asyncpg `init` runs once per physical connection; release-time `RESET ALL` resets the
      `role` parameter, so every acquire after the first runs as the migrator — ownership
      drift on _ensure_migration_log / legacy fake-apply, and provenance that flips per
      acquire.
    status: CONFIRMED
    resolution: >-
      Pool hook moved to `setup` (runs on every acquire); guard made idempotent for an
      un-reset connection; test_real_pg_pool_setup_survives_release_and_reacquire proves the
      effective role on a re-acquired max_size=1 connection.
