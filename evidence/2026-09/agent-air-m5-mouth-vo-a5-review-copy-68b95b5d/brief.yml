objective: >-
  Slice A5 (MANDATE-vo.md, 2026-09-20 — PLAN §3 row A5, criteria G1-d/G1-e;
  F-COPY-1 verdict half): the criminal-record disclosure hold — one of the two
  disclosures `HOLDING_DISCLOSED_FLAGS` still sends to a person
  (`evaluate_path.py:1031-1033`; `ACTIVITY_BOUNDARY` release is a separate
  slice, not touched here) — now carries four named elements
  (rule/checked/prepare/handling, EN and ID) instead of one thin sentence.
  `reviewReason()` becomes the twin of `condition()`: an unmapped code throws
  `RESPONSE_INVARIANT` outside production and falls back to the generic
  sentence plus a once-per-code telemetry event in production, so the generic
  sentence can no longer silently absorb a real gap.
  `PACK_INDEPENDENT_REVIEW_REASON_CODES` (18 codes) is DERIVED from
  `evaluate_path.py` through three block-scoped, fail-closed extractors
  instead of 18 hand-typed literals — a naive per-line regex would silently
  find the wrong 11 (the parenthesised `CONFLICTING_IMMIGRATION_STATUS_REVIEW`
  literal), and a file-wide `code="..."` regex would over-match 7 unrelated
  outage codes (both measured false-green/false-match traps, DRAFT-SPEC-A5-1.v2
  F22/F23). The stale "always go to a human" footer
  (`outcome.disclaimer.complex_to_human`) is replaced on all five outcome
  states with a sentence that stays true after the later `ACTIVITY_BOUNDARY`
  release. A5's own new strings are scanned by the existing
  reassuring-certainty guard (`findBannedPattern`), widened without touching
  its 28-string conditions pin.
constraints:
