    deploys on merge; this slice reads evaluate_path.py from disk at test time
    only, the same idiom PACKS_DIR already uses for the pack half).
    oracle.css, LivingTree.tsx and OracleShell.tsx (Track C) are untouched.
  - >-
    Eight files only: _lib/engine-adapter.ts, its test, _lib/i18n.ts,
    _lib/telemetry.ts, its test, _components/OutcomeSheet.tsx, its test,
    e2e/visa-oracle-v2.spec.ts.
  - >-
    Visitor-facing copy (four elements EN+ID, four labels EN+ID, footer EN+ID)
    is shipped VERBATIM from DRAFT-SPEC-A5-1.v2.md §2b/§2e — not rewritten by
    the builder.
  - >-
    DISCLOSED_ACTIVITY_BOUNDARY_REVIEW's own copy (engine-adapter.ts:938-941)
    stays byte-identical; A5-1's own innocence test pins that it renders with
    no element block. The question-side lead (i18n.ts:616) is a different
    slice's and is not touched.
  - >-
    The 28-string conditions guard (conditionsBlockEntries, its toHaveLength
    pin, its innocence test, the AUX×NEG×EFFECT_VERBS families, the
    allowlist) is reused, never edited — A5 adds a SECOND, separate
    entry-builder over its own 18 strings.
  - >-
    PR ships UNARMED. The builder never calls production, not even a GET;
    prove-live (A5-8) is the conductor's GET-only step after merge.
