  docs/plans/r19-cutover-20260924/PLAN.md §2 and §5 step 1). Ship the bounded preflight repairs
  prepared by an external prepare-only seat (commit 0f0294db03, cherry-picked unchanged onto
  current main): the mobile menu becomes a real dialog (focus enters, Tab wraps, Escape closes,
  focus returns, closed drawer leaves the accessibility tree); /news search starts at result zero,
