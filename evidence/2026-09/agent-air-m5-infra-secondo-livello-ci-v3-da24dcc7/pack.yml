dissent:
  - seat: codex-gpt-5.6-sol (titolare council seat, convened 2026-09-15T19:18Z, verdict NO-GO)
    objection: >-
      "The aggregate-failure fix is incomplete: a nonzero exit from the contract-suite step causes
      Actions to skip both Behavioural runner tests and Runner boots in --dry-run, neither of which
      has an always() condition."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AND APPLIED. Both later steps now carry `if: always()`. This is the sharpest kind of
      finding: the aggregate loop was itself a fix for fail-fast hiding information, and the seat
      saw that the same flaw survived one level up, between steps instead of within one. A reader
      with a broken contract now still learns whether the runner boots.
  - seat: codex-gpt-5.6-sol (titolare council seat, convened 2026-09-15T19:18Z, verdict NO-GO)
    objection: >-
      "The comment claiming the job needs 'no credential' remains false: actions/checkout still
      receives GITHUB_TOKEN, and persist-credentials:false prevents persistence without eliminating
      credential use."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AND APPLIED. The header now says the narrower true thing — no model credential and
      no repository secret, a read-only token that checkout does not persist — and names the seat
      that caught it. Note this is the SECOND time a council seat has corrected this same sentence:
      the first correction (permissions + persist-credentials) fixed the mechanism and left the
      claim overstated. A sentence that keeps needing correction is worth writing down.
  - seat: codex-gpt-5.6-sol (titolare council seat)
    objection: >-
      "Verification boundary: from the diff alone I could not verify the referenced action versions
      exist, nor inspect the Node suites and runner to confirm their assertions, imports, network
      behaviour and dry-run semantics."
    status: PLAUSIBLE
    disposition: >-
      ACCEPTED AS STATED, and recorded because a reviewer that names the limit of its own evidence
      is worth more than one that does not. The release owner ran all four suites and the boot on
      M5, and the #6607 CI run covers the Node 20 runner path — both are in receipts above.
  - seat: agy-gemini-3.1-pro (reserve council seat, convened 2026-09-15T19:24Z, verdict NO-GO)
    objection: >-
      "BLOCKER: actions/checkout@v7 does not exist — the current latest major is v4 — so the runner
      will fail to download the action and abort the job."
    status: RETRACTED
    disposition: >-
      REFUTED, and by a stronger measurement than last time. 121 workflows on main pin @v7, and the
      identical job has now actually RUN on #6607, its log showing the action resolving to SHA
      3d3c42e5aac5ba805825da76410c181273ba90b1. This is the same stale-knowledge claim this family
      made on the predecessor; it is recorded rather than deleted because a seat being wrong about
      one thing is not a reason to stop seating it, and the roster counts this seat whether or not
      the release owner likes its finding.
  - seat: agy-gemini-3.1-pro (reserve council seat)
    objection: >-
      "Verification boundary: I could not execute the bash, so I cannot guarantee there are no
      version-specific parsing bugs around empty arrays and set -u in your runner image."
    status: PLAUSIBLE
    disposition: >-
      ACCEPTED AS STATED, and already covered: the gate on #6606 ran the job's shell in a scratch
      tree under bash 3.2, which is STRICTER than the runner's bash 5 — an empty glob exits 1, one
      failing suite still runs the others and then exits 1 naming it, all-green exits 0 with an
      empty array safe under set -u.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter, earlier round on the same workflow)
    objection: >-
      "`cancel-in-progress: true` is unscoped, so an in-flight run on refs/heads/main is aborted
      when commits land in quick succession, leaving those commits unverified."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AND APPLIED in the earlier round and carried here unchanged. An unverified commit on
      main is the exact shape of cicatrix #2 that this workflow exists to close, so shipping it
      inside the cure would have been self-defeating. Superseded in part by the sol finding below,
      which saw the whole of the hazard.
  - seat: codex-gpt-5.6-sol (titolare council seat, earlier round on the same workflow)
    objection: >-
      "A concurrency group permits only one PENDING run, so a third push to main replaces the
      second even with cancel-in-progress false — the middle commit is never verified."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AND APPLIED in the earlier round and carried here unchanged. The group is
      `${{ github.event_name == 'pull_request' && github.ref || github.run_id }}`: PR runs share a
      group per ref so a superseded one is cancelled, while every push gets its own group and can
      never displace another.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter, earlier round)
    objection: >-
      "--dry-run short-circuits execution, so the real dispatch path, process handling and timeout
      logic are never evaluated; runtime bugs there pass CI silently."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AS DECLARED SCOPE, and written into the workflow header as a limit rather than left
      implied. CI cannot spawn a model seat here without a credential this job deliberately does
      not have. The live path is exercised by running a real mission; the one run so far is
      recorded in research/operations/second-army-D5-restamp-6579-20260915T164000Z.md, and it is
      what found the verify-lane defect fixed in #6608.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter, earlier round)
    objection: >-
      "The glob is non-recursive and does not match the behavioural suite, so 'armed the day it
      lands' is overstated."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AS DECLARED SCOPE. Written into both the workflow header and the brief's third
      assumption: a flat new *-contract*.mjs is armed automatically; a suite in a subdirectory, or
      a new behavioural suite, needs a line added here.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter, earlier round)
    objection: >-
      "The paths filter only watches infra/workflows/**, so a breaking change outside it bypasses
      the workflow."
    status: PLAUSIBLE
    disposition: >-
      ACKNOWLEDGED, NOT ACTED ON. The suites depend on node: builtins only — no package.json, no
      workspace config, no shared utility. Widening the filter would make every unrelated PR pay
      for a job that cannot break from outside that directory. Revisit if a suite ever grows a
      dependency.
  - seat: claude-opus-5 (release owner, on its own work)
    objection: >-
      "This job is not a required check, so on the day it lands it can go red and nothing stops a
      merge."
    status: PLAUSIBLE
    disposition: >-
      DELIBERATE, AND SAID OUT LOUD IN THE FILE. Arming a new required check is a separate decision
      with its own blast radius and should follow a history on main rather than one green run. The
      watcher registration this PR adds is the weaker but immediate half: nobody is stopped from
      merging, but somebody is told when it breaks on main.
  - seat: claude-opus-5 (release owner, on its own process)
    objection: >-
      "Two predecessors of this PR died on claims the release owner measured against a stale local
      checkout rather than the branch's base — the seat roster on #6607 and, in the same mission,
      the premise of a live-run report."
    status: CONFIRMED
    disposition: >-
      NAMED, NOT SMOOTHED. It is cicatrix #1 and the repo already has a lint for the class. Every
      repo-fact receipt in this pack was re-derived from `origin/main` or from a fresh worktree at
      the PR's own base, not from /Users/balizero/nuzantara, which is 161 commits behind.
