seat_fallback_reason: >-
  ONE RESERVE COUNTS TOWARD THIS QUORUM: agy-gemini-3.1-pro, substituting for the two titolari
  below. Both were probed in the session that wrote this pack, minutes before the council was
  convened, and both are down for a reason that is a clock rather than an effort.
  kimi-code/k3 — DEAD. `kimi -p "reply pong"` returns `provider.auth_error: 403 You've reached your
  monthly usage limit for this billing cycle`, and the quota refreshes on the next billing cycle.
  tp1-qwen3.8-max — DEAD. `python3 scripts/tp1_call.py --model qwen3.8-max -p "reply pong"` returns
  HTTP 429 `insufficient_quota`, "Your token-plan 1-week quota has been exhausted. The quota will
  reset at 09-18 08:39:00 UTC."
  codex-gpt-5.6-sol — ALIVE, and it was seated as a titolare, not substituted: `codex exec -m
  gpt-5.6-sol "reply with the single word: pong"` returns pong on exit 0. The reserve fills the
  SECOND chair only.
  WHY THIS PARAGRAPH EXISTS AT ALL, stated because the predecessors got it wrong twice: #6606
  declared all three titolari dead, which was false about sol and its gate caught it. #6607 then
  carried a `seat_override` claiming the quorum was unreachable with three seats — and the roster
  has held SIX since #5569, three titolari plus this reserve bench. The release owner refuted that
  gate finding and the refutation was itself false: it quoted a 3-tuple read from a working
  checkout 161 commits behind origin/main, which is cicatrix #1. The quorum was reachable the whole
  time, and this pack reaches it instead of overriding it. There is no seat_override in this pack.
seat_diversity: satisfied
seat_diversity_note: >-
  "Three families sit on this diff and none of them is the builder's. The builder is Anthropic
  (claude-opus-5); the titolare council seat is OpenAI (codex-gpt-5.6-sol); the reserve is Google
  (agy-gemini-3.1-pro). That is the W100 cross-family pairing twice over, and it replaces a note on
  the predecessor PR that claimed codex was unavailable on M5 — false, and contradicted by the very
  override it sat beside. Codex was reachable then and is reachable now, probed both times."
diff:
  net_lines: >-
    5 files, +546/-0, measured by `git diff --cached --numstat` on the FINAL staged tree with this
    pack in it, and re-measured after the last edit to any file until the figure stopped moving.
    Two .github/workflows/ files — one new, one existing gaining a single line — plus this pack,
    its brief and the council journal. Zero source code, zero application behaviour, zero data.
    #6606 narrated a figure measured before its last edits and CI caught the discrepancy; that is
    why this sentence describes WHEN it was measured and not only what it says.
  behaviour_change: >-
    A new GitHub Actions job runs on any PR touching infra/workflows/, and on any push to main
    touching it. It executes every *-contract*.mjs in infra/workflows/tests/, the behavioural
    runner suite, and a --dry-run boot of the standalone runner. The one line added to
    main-push-failure-watch.yml makes a failure of that job on main reach the watcher's alert path.
    Nothing in the repository's runtime changes. The job is NOT added to branch-protection
    required_status_checks by this PR, so its first effect on a PR is advisory.
