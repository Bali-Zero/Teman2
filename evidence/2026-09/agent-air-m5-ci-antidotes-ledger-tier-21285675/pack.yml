  net_lines: >-
    Measured, not estimated. Review surface: 175/40 added/removed across
    .github/workflows/immune-enforcement.yml and
    scripts/tests/test_antidotes_ledger_tier.py; evidence files are the
    remainder. Floor is `path` (hot-zone .github/workflows/**), not size.
  measured_at: >-
    `git diff --cached --numstat <merge-base>` in this worktree, merge-base
    e05f91095a112d2509b24bf880611a6fbb8beee3.
  shape: >-
    Two env lines and one ~25-line shell block in the sentinel step, 40 one-line
    `if:` edits, one new 10-line step, one new test file. No guard's body
    changes; nothing outside the antidotes job.
behaviour_change: >-
  YES, CI-visible: on a diff whose every path equals
  .claude/skills/modus/PENDING-ARMS.md and whose ledger blob exists at HEAD,
  the 40 heavy steps of `antidotes` are skipped and one ledger-readers step
  runs, in both pull_request and merge_group lanes. No other diff shape changes
  behaviour; `relevant` is untouched.
