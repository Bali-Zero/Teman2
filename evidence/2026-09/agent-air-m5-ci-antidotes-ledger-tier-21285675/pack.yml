seat_diversity: satisfied
seat_diversity_note: >-
  One build lane (Claude) and two review lanes, both non-Anthropic and
  cross-family from each other, same brief, no sight of each other's answer.
  They converged on the mechanics and diverged on the deletion case — codex
  assumed a downstream catch, kimi traced the skipif and proved there was
  none — which is exactly why two seats run.
outcome: >-
  A ledger-only diff now runs the three ledger readers (6.5 s locally) instead
  of the 6-minute battery, in both the PR lane and the merge-group lane; every
  other diff shape — extra file, rename, deletion, empty diff, missing SHAs —
  still gets the full battery. The collision-matrix job is untouched.
