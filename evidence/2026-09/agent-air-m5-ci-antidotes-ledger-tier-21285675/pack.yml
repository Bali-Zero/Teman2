dissent:
  - seat: kimi-code/k3 (cross-family)
    status: CONFIRMED
    objection: >-
      BLOCK: a deleted ledger qualified as ledger-only and the readers passed
      vacuously (skipif on the real ledger, proprioception tolerates absence).
      CURED with the blob-at-HEAD check, pinned and proven on a scratch repo.
      One minor ACCEPTED: the self-maintaining pin matches reader path strings
      anywhere in the six-line step block, so a comment naming a reader would
      satisfy it; parsing the run block would buy little for a block this small.
  - seat: codex-gpt-5.6-sol (cross-family)
    status: CONFIRMED
    objection: >-
      OK; its one wrong belief — that a deletion would be caught by the
      unconditional report-smoke step — is recorded as such: kimi showed that
      step tolerates a missing ledger. Nothing else to cure.
  - seat: claude-fable-5-1 (this worktree session — the builder's own standing objection)
    status: PLAUSIBLE
    objection: >-
      The way this cure could be wrong, stated plainly: it assumes the only
      guards a ledger edit can break are the three by-name readers. If a fourth
      reader is written under another name, the tier skips it — visible only
      when that guard later goes red on main for a ledger row. The by-name pin
      keeps the family complete; a content-based selector (grep for the path)
      was measured by the first builder at 29 files / 122 s, i.e. the whole
      battery again, which is why the explicit allowlist won.
