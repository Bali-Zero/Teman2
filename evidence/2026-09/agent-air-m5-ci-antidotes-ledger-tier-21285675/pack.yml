    The `antidotes` required check on the next healer-tick ledger PR (≥9 a day)
    and on its merge-group run — the workflow whose step bodies are this diff.
  where: ci
  observe: >-
    gh api repos/{owner}/{repo}/actions/jobs/<antidotes job id> --jq '.steps[] | select(.name|test("Ledger-only|Unit tests")) | {name,conclusion}'
  expect: "Ledger-only diff: run the ledger's own readers = success; Unit tests (guilt + innocence per tool) = skipped; job wall time ≤ 90 s"
bites_note: >-
