bites:
  consumer: |
    catE step "Paid-endpoint ban judged as an entity" (.github/workflows/catE-sovereignty-lint.yml),
    which runs scripts/lint_paid_llm_entity.py on every PR's changed files with the repository's
    TYPESAFE_API_KEY under the RULED 2026-09-21-bis fence entry. This PR's own diff puts three
    worth-asking files in scope (the client, the lint, the workflow), so its own catE run is the
    first observation: the step log must carry exactly one
    `lint_paid_llm_entity: jev-telemetry {...}` line with asked >= 1 and the step must exit 0.
    After merge, the next PR run on main's code must carry the same line — read, not assumed.
    Stubbed-path proof of the same line and unchanged exit codes is in receipts above.
