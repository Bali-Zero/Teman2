diff:
  behaviour_change: |
    scripts/typesafe_client.py gains ask_detailed() -> Judgment. ask() now returns
    ask_detailed(...).answers and is otherwise unchanged: same endpoint, pinned model, payload,
    authorization check before serialisation, 429/529 retry with 0.8 s / 1.6 s backoff, broad
    exception retry, redirect refusal. One narrowing: an unavailable_reason() text the client has
    never mapped can no longer raise KeyError out of ask() (it maps to the code "unavailable").
    scripts/lint_paid_llm_entity.py calls ask_detailed() through jev_judgment(), adds a per-file
    "jev" key and prints ONE extra line per run:
    `lint_paid_llm_entity: jev-telemetry {json}` (text mode) / a `jev_telemetry` key (--json)
    carrying service state, files, asked, answered, unavailable, partial, reason counts,
    attempts, elapsed ms (sum and max), input/output tokens or null, usage_unknown and models, where a model is only ever the pinned id or the constant
    "unexpected" — never a vendor-chosen string. Verdicts, exit codes, FIRE_THRESHOLD, pardons and the grep OR model composition are
    unchanged; the no-in-scope early return is byte-identical.
  surface: |
    Two scripts (client + lint), one workflow line (the new suite joins the catE corpora step),
    one REQUIRED_TOOLS entry, the pin-test harness (unique module name during exec_module), the
    lint's own test seams (11 monkeypatches moved from ask to ask_detailed, one from jev_verdict
    to jev_judgment, no assertion weakened), one new test module. No backend, frontend,
    migration, credential, fence entry or hook. infra/claude-hooks/jev_dispatch_gate.py untouched.
