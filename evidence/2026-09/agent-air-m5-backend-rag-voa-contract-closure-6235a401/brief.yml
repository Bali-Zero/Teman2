acceptance:
  - text: >-
      WHEN an unauthenticated request reaches any path under
      `/api/visa/voa/staff/`, THE SYSTEM SHALL answer 401 with the frozen
      contract's SESSION_REQUIRED body.
    status: pending
    probe: >-
      (post-deploy, on the promoted commit)
      curl -s https://nuzantara-rag.fly.dev/api/visa/voa/staff/practices |
      grep -c SESSION_REQUIRED == 1 (today: 0)
  - text: >-
      WHEN that same refusal is served, THE SYSTEM SHALL attach the contract's
      three privacy headers.
    status: pending
    probe: >-
      curl -sI https://nuzantara-rag.fly.dev/api/visa/voa/staff/practices |
      grep -ci 'cache-control: no-store, private' == 1
  - text: >-
      WHILE a path merely shares the prefix STRING but is not a staff path,
      THE SYSTEM SHALL keep the generic body.
    status: verified
    probe: >-
      PYTHONPATH=. pytest
      backend/tests/unit/middleware/test_hybrid_auth_contract_401_envelope.py
      — the `_NON_STAFF_PATHS` cases include `/api/visa/voa/staffroom`,
      `/api/visa/voa/staff-directory` and the bare `/api/visa/voa/staff`.
  - text: >-
      IF a public_endpoints.py entry is ever widened to cover a staff path,
      THEN the suite SHALL go red.
    status: verified
    probe: >-
      find_entry(<staff path>) is None per path + the pre-existing match-mode
      census test_no_garuda_voa_public_endpoint_uses_a_prefix_match_covering_staff
risks:
  - >-
    (a) The change retires the body-equality discriminator that TWO canary files
    used to distinguish "middleware refused" from "handler wrongly allowed to
    run" — both files were updated in this PR and given two replacements that
    cannot go blind the way a body string can (`find_entry` reads the registry
    directly; `WWW-Authenticate` is set only by the middleware's 401 branch).
  - >-
    (b) `request.url.path` carries any ASGI mount prefix; this is NOT a
    regression — `is_public_endpoint` reads the same attribute, so the whole
    public registry already resolves against the externally-visible path, and
    `main_api:app` is served at the root by uvicorn in production. Documented in
    `contract_401_envelope`'s docstring rather than "fixed" on one side only.
