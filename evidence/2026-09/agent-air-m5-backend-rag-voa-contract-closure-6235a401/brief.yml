  route answered `{"detail":"Authentication required"}` (HybridAuthMiddleware's
  generic body) because the middleware refuses before `garuda_staff_router` runs.
  The frozen contract `products/garuda-voa/contracts/openapi.yaml` declares
  `401 -> {"code":"SESSION_REQUIRED","retryable":false,"message_key":
  "garuda_voa.error.session_required"}` plus three privacy headers for all five
  staff operations. Cured on ONE side only: the code moves to the contract;
  openapi.yaml is NOT touched by this PR.
