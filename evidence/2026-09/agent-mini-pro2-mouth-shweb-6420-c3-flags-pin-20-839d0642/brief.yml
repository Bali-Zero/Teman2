ceiling_probe: >-
  Ran `python3 -c "import sys; sys.path.insert(0,'scripts'); import evidence_pack_lint as e;
  files=['apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/fact-mapper.test.ts',
  'evidence/2026-09/agent-mini-pro2-mouth-shweb-6420-c3-flags-pin-20-839d0642/brief.yml'];
  numstat=open('/tmp/numstat.txt').read(); net=e.sum_numstat(numstat);
  print(e.compute_ceiling(files, 2, {}, measured_net_lines=net))"` on mini-pro2 ->
  `(3, [])`. Reading compute_ceiling()'s source: with this brief's own 142 added lines counted,
  `sum_numstat` net_lines is 155 (13 + 142), over CEILING_SMALL_DIFF_MAX_NET_LINES (60) — so
  this diff is not "Gear-1-shaped" by the ceiling's own small-diff test (2 files is within
  CEILING_SMALL_DIFF_MAX_FILES, but net lines is not), and the function returns `(3, [])`
  ("not Gear-1-shaped — no ceiling to assert") for ANY declared gear on this diff, 1/2/3 alike
  — verified directly, not merely for gear 2. No `gear_override` is needed: there is nothing
  here for the ceiling rule to object to, regardless of what gear is declared.
objective: >-
  #6420 ledger row (D4c-2 gate, PENDING-ARMS.md line ~2066), condition C3: fact-mapper.test.ts's
  zero-hold guard for the investment "I can't say yet" answer asserted
  `.not.toContain("NOT_CERTAIN")` on `mapDisclosedReviewFlags({category:"invest",
  investment_vehicle:"undecided", investment_currency:"still_unsure"})`. That assertion only
  proves NOT_CERTAIN's absence and stays green whenever the returned flag set changes for a
  reason unrelated to the thing being guarded. Replaced with an exact-set pin,
  `toEqual(["ACTIVITY_BOUNDARY"])`, and proved by mutation that the pin catches a regression
  the old assertion could not see.
