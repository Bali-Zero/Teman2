literal_measured:
  method: >-
    Deliberately changed the assertion under test to
    `.toEqual(["__PROBE_WRONG_VALUE__"])` and ran `npx vitest run
    "src/app/(visa-oracle)/visa-oracle/_lib/fact-mapper.test.ts" -t "costs zero review holds"`
    on mini-pro2, then read the AssertionError diff instead of taking the literal from the
    dispatch brief. Reverted with a byte-for-byte restore (diffed against `git show
    HEAD:<path>` afterward, confirmed identical) before making the real edit.
  result: "AssertionError: expected [ 'ACTIVITY_BOUNDARY' ] to deeply equal [ '__PROBE_WRONG_VALUE__' ]"
  literal: '["ACTIVITY_BOUNDARY"]'
  machine: mini-pro2
before_assertion: |-
  ).not.toContain("NOT_CERTAIN");
after_assertion: |-
  ).toEqual(["ACTIVITY_BOUNDARY"]);
mutation_contrast:
  mutation: >-
    In apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/fact-mapper.ts, line 485, changed
    `investment_vehicle: ["pt_pma", "property", "bank_deposit"]` to `investment_vehicle:
    ["pt_pma", "property", "bank_deposit", "undecided"]` inside
    ACTIVITY_BOUNDARY_DECIDABLE_ANSWERS — a plausible-looking future edit ("undecided became
    decidable") that makes `hasUndecidableActivityAnswer` return false for this test's facts,
    dropping ACTIVITY_BOUNDARY from the returned set. NOT_CERTAIN is never involved: the facts
    object's only string values are "invest"/"undecided"/"still_unsure", none of which is the
    literal "unsure". Applied transiently, measured, then reverted with `git checkout --` (the
    working tree carries no trace of it at commit time).
  new_pin_result: >-
    On mini-pro2, `npx vitest run
    "src/app/(visa-oracle)/visa-oracle/_lib/fact-mapper.test.ts" -t "costs zero review holds"`
    against the mutated source, with the file already carrying this PR's new assertion
    (`.toEqual(["ACTIVITY_BOUNDARY"])`): exit code 1 (captured directly, not via `$?` after a
    pipe). Output: "AssertionError: expected [] to deeply equal [ 'ACTIVITY_BOUNDARY' ]" — RED,
    "Tests  1 failed | 146 skipped (147)".
  old_assertion_result: >-
    On mini-pro2, the SAME mutated source, with the assertion temporarily swapped back to
    `.not.toContain("NOT_CERTAIN")`: exit code 0 (captured directly). Output: "Tests  1 passed |
    146 skipped (147)" — GREEN. Confirms the old assertion is blind to exactly the regression
    the new pin exists to catch.
  conclusion: >-
    The exact-set pin catches a flag-set regression (ACTIVITY_BOUNDARY silently lost) that the
    absence-only assertion would have let merge silently, with NOT_CERTAIN never having been at
    stake either way — the contrast the dispatch brief asked this PR to demonstrate, not merely
    assert.
