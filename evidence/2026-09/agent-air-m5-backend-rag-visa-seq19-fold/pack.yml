dissent:
  - seat: claude-sonnet-5 (this worktree session), self-caught
    status: CONFIRMED
    objection: >-
      The ground-truth report (Q4) frames gold personas #6 and #7 together as "exactly
      the E31 fail-open personas Q3's diff explains." Direct measurement against the
      real signed seq-18 shows this is imprecise for #6: its actual divergence reason is
      `MINOR_GUARDIAN_PRIVACY_REVIEW` (a minor-guardian privacy gate), unrelated to the
      sponsor-status-code predicate this fold repairs — confirmed byte-identical before
      and after the transplant. #7's divergence IS the fail-open class, and its
      manufactured E31B/E31D candidates are confirmed gone on 019. This refines, and does
      not invalidate, Q3's own byte-verified rule-diff finding (which never made a claim
      about persona #6 specifically).
  - seat: claude-sonnet-5 (this worktree session), self-caught
    status: CONFIRMED
    objection: >-
      `assert_changed_fields_hold_their_expected_values`'s first draft indexed
      `after_rules_by_id[rule_id]`/`seq15_rules_by_id[rule_id]` without a membership
      check — a pack missing one of the ten declared edits would raise an unhandled
      `KeyError` instead of the clean `SystemExit` every other refusal in this module
      produces. Found while writing the guard's own guilt tests (a minimal pair
      carrying only one of the ten edited rule ids), fixed with an explicit membership
      check before the first commit — never reached in the real `fold()` path (which
      already guarantees full coverage via `_transplant_repairs`), but a guard called
      directly (as a test, or by a future caller) deserves the same fail-closed shape.
  - seat: claude-sonnet-5 (this worktree session), self-caught
    status: PLAUSIBLE
    objection: >-
      `FOLD_CREATED_AT` is pinned to `2026-09-05T00:00:00Z` (this fold's authoring
      date at midnight UTC). `sign_pack.py`'s `assert_created_before_signed` requires
      `created_at <= signed_at`; this only fails if the consul signs at a wall-clock
      instant BEFORE that midnight, which would require backdating relative to when
      this PR is opened. Not reproduced (no signing happens in this PR by design), and
      exceedingly unlikely given normal ceremony timing, but named for completeness —
      the consul's signing step is exactly where this would surface, cleanly, as a
      refusal rather than a silent defect.
  - seat: kimi-code/k3 and tp1-qwen3.8-max, independently, cross-family, fresh context
    status: CONFIRMED
    objection: >-
      The fold never verified its own stated precondition (module docstring: "all ten of
      these rule ids are byte-identical between seq-13 and seq-18") — a future base pack
      that legitimately changed one of these rules would have that change silently
      overwritten by the transplant. CURED: added `_assert_edited_rules_unchanged_since_seq13`,
      called before the transplant, refusing loudly if any of the ten rule ids has drifted.
  - seat: kimi-code/k3 and tp1-qwen3.8-max, independently, cross-family, fresh context
    status: CONFIRMED
    objection: >-
      `assert_only_expected_changes`'s `required_facts` exclusion applied uniformly to all
      ten edited rule ids, but `_transplant_repairs` only ever writes `required_facts` on
      the stepchild rule — a drift on one of the nine sponsor rules' `required_facts` would
      pass both guards silently. CURED: the exclusion is now `{"when"}` for the nine sponsor
      rules and `{"when", "required_facts"}` only for the stepchild rule.
  - seat: tp1-qwen3.8-max, cross-family
    status: CONFIRMED
    objection: >-
      seq-15 (the transplant DONOR) was authenticated only by a self-declared
      `"sequence": 15` field — no digest pin, no signature (seq-15 was never itself signed).
      Any file merely claiming sequence 15 would be accepted and its bytes transplanted
      verbatim into a production candidate. CURED: pinned `SEQ15_PAYLOAD_SHA256` and refuse
      unless `--seq15-source` re-hashes to it — the same chain-of-custody standard already
      applied to the seq-18/seq-13 anchors, adapted to the fact that seq-15 has no signed
      envelope to verify against.
  - seat: tp1-qwen3.8-max, cross-family
    status: CONFIRMED
    objection: >-
      `main()`'s signed-path derivation (`str(seq18_source).replace(".source.json",
      ".signed.json")`) is not suffix-anchored — `str.replace` substitutes every
      occurrence, not just the trailing one. CURED: replaced with an explicit
      suffix check + slice, refusing if the source path does not end in `.source.json`.
  - seat: kimi-code/k3, self-corrected mid-review before reporting
    status: CONFIRMED
    objection: >-
      Prompted by kimi's review, this session added a product-catalog drift guard (the nine
      sponsor rules' transplanted `op:"in"` closed set was derived from seq-13's E-prefix
      product codes at seq-15's fold time) — but the FIRST draft of that guard compared
      whole `products` objects, and would have wrongly REFUSED this transplant on
      `E23.covered_purposes` (an unrelated seq-16 change). Caught by running the guard
      against the real packs before trusting it (own receipts), narrowed to compare only
      the E-prefix code SET, which is the actual precondition the transplant depends on.
  - seat: kimi-code/k3 and tp1-qwen3.8-max
    status: RETRACTED
    objection: >-
      Both flagged duplicate `rule_id` entries collapsing silently in this script's
      `{r["rule_id"]: r for r in rules}` dict comprehensions as a possible bypass. Checked
      `RulePackPayload`'s own `_check_unique_rule_ids` field_validator (models.py:610):
