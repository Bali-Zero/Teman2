brief_ref: evidence/brief.yml
plan_ref: >-
  Pro worktree .worktrees/mouth-r19-cutover-audit-20260924, docs/plans/r19-cutover-20260924/PLAN.md,
  the activation that follows step 2 (dormant foundation, merged as #7428); snapshot archived at Pro
  ~/.agent/snapshots/r19-cutover-audit-20260926.tgz.
council_run: council-journal.jsonl
council_note: >-
  The journal is hand-authored from the seats' own dispatch and completion times (the Kimi and Qwen runs
  wrote their dispatch and done timestamps to files under the session scratch directory), because
  scripts/council_journal.py stamps the clock at the moment of the call and cannot record a dispatch that
  already happened. Two seats ran, both titolari: kimi-code/k3 (read access to the worktree) and
  tp1-qwen3.8-max (no repo access, redacted diff plus verbatim probe output). They disagree on claim 2:
  Kimi returned FALSIFIED on claims 2 and 5, Qwen returned HOLDS on all five. The author read both footers
  against each other and CONFIRMED Kimi's finding on claim 2 (see dissent and the last two receipts); Qwen
  did not see the pre-change footer, so its HOLDS on claim 2 is superseded on that point. The disagreement
  is left visible and the finding is left OPEN.
seat_fallback_reason: >-
  No seat was substituted. The third titolare, codex-gpt-5.6-sol, is the author of the R19 snapshot
  (see lanes_note) and was not dispatched: a Codex review of Codex-authored code would not be independent,
  and every Codex dispatch of 2026-09-26 ended "workspace is out of credits" (see the foundation pack of
  #7428). Quorum rests on the two titolari that ran.
lanes:
