dissent:
  - seat: kimi-code/k3
    verdict: FALSIFIED
    objection: >-
      Claim 2 fails for the home footer. The activated home renders r19/home/Footer.tsx instead of the v2
      Footer: its WhatsApp link is a bare wa.me/<company number> with no greeting text, no utm parameters and no
      home_whatsapp_cta{trigger:"footer"} event; the old Telegram contact is gone; the old Location link to
      maps is gone (a "Client reviews" entry now points at GOOGLE_MAPS_URL). Email and phone destinations are
      identical. The hero and header actions the owner ruling names are intact (hero: same source, context,
      utm and fallback as HeroCTA; header: NavWhatsAppCTA firing home_whatsapp_cta{trigger:"nav"}).
    status: CONFIRMED
    disposition: >-
      OPEN. Confirmed by the author against both files (the footer receipt, 18:16:11Z). The footer is below the fold and
      outside Zero's 2026-09-27 ruling, and r19-home-contact.spec.ts:172 pins it as a "plain link", so the
      change was known to the activation session but is recorded nowhere else. It is a real loss: WhatsApp
      contacts entering through the home footer no longer carry the utm attribution or the greeting, and the
      footer trigger of home_whatsapp_cta stops firing. Not cured in this pack: a cure edits the candidate
      (r19/home/Footer.tsx or a tracked link component), so it needs the whole battery and a fresh review, and
      dropping Telegram and Location is a design decision that is Zero's. Decision needed before arming: (a)
      restore the tracked footer WhatsApp link (buildWhatsAppLink("home") plus the existing event) and rule on
      Telegram and Location, or (b) accept the R19 footer as designed, by Zero's explicit ruling, and lower A2
      to the above-the-fold actions and the eight cta_handoff links. Until then acceptance A2 is NOT met for
      the footer.
  - seat: kimi-code/k3
    verdict: FALSIFIED
    objection: >-
      Claim 5 fails at file level: seven shared components under apps/mouth/src/app/v2/_components/ (Footer,
      HeroBlueprint, MobileNav, NavWhatsAppCTA, NewsHero, PersonaDoors, ZantaraFAB) are edited and are imported
      by funnel surfaces (/v2, and the visa, kbli, tax-calendar and property-eligibility layouts), and four
      test files outside the perimeter changed.
    status: CONFIRMED
    disposition: >-
      Accepted as worded, answered at render level, which is how A1 states it. Every edit is either behind
      useR19() (false wherever no R19 provider is mounted, and the provider is mounted only under the (blog)
      layout and on the home) or reads a var(--r19-*, literal) alias whose fallback is the literal it replaced;
      the marker probe shows data-presentation absent on all 13 funnel routes; Kimi and Qwen both walked the
      edits and found no funnel-visible change. PersonaDoors has no importer. The out-of-perimeter test files
      are test infrastructure.
  - seat: kimi-code/k3
    verdict: FALSIFIED
    objection: >-
      Two edits reach funnel code ungated: a container colour var(--text-primary) on the MobileNav drawer
      panel, and aria-hidden on the ZantaraFAB icon span.
    status: CONFIRMED
    disposition: >-
      Both edits are real and neither changes rendering: every text element in the drawer sets its own colour
      (Menu label, close button, links, both action buttons), so the panel colour is inherited by nothing but
      the screen-reader-only title; the FAB span held only an img with alt="". Accepted, ships as is.
  - seat: tp1-qwen3.8-max
    verdict: HOLDS
    objection: >-
      Exact parity of every GA4 parameter with the pre-R19 hero cannot be verified from the diff, because the
      old HeroBlueprint internals are not in it.
    status: RETRACTED
    disposition: >-
      Resolved by evidence outside its material: Kimi compared Entry.tsx's hero button against
      origin/main HeroCTA.tsx line by line (source homepage_hero, same context, whatsappContext, utm and
      fallbackHref), and r19-home-contact.spec.ts asserts the hero handoff end to end (capture payload,
      lead_whatsapp_cta, lead_created, funnel beacon, captured=false fallback), 22 tests green.
  - seat: tp1-qwen3.8-max
    verdict: HOLDS
    objection: >-
      No CI, infra or config file appears in the diffstat, but the seat cannot inspect the repo tree beyond it.
    status: RETRACTED
    disposition: >-
      Falsified by command: git diff --name-only origin/main...HEAD lists 23 paths, all under apps/mouth/ (the
      second receipt, zero paths outside).
residual_risks:
  - >-
    The R19 home footer finding (dissent 1) is OPEN. The pack cannot be signed by the final gate until it is
    dispositioned by a fix and a re-run, or by Zero's ruling.
  - >-
    Playwright ran on Chromium only. Firefox, webkit and the Pixel 5 project were not run, and CI's
    collection also covers specs that were not run here.
  - >-
    The probes read a local next start, not a deployment. Mouth production deployments land staged and go
    live only on vercel promote, so A5 (390 and 1440 wide, above the fold, on the public domain) is not
    observed and cannot be before merge and promote.
  - >-
    Kimi's and Qwen's material differ: Qwen judged from the diff and probe output alone and did not see the
    pre-change footer, which is why it missed the footer regression. A third seat with repo access was not
    dispatched.
  - >-
    ESLint was not run in this session; CI lints.
