    role: build
    seat: >-
      codex-gpt-5.6-sol (external prepare-only builder of the 24-25 September 2026 snapshot from which
      apps/mouth/src/components/r19/** and the activated home and readers derive; attribution confirmed by
      Zero on 2026-09-26, the session log was not located locally)
  - lane: r19-activation-integration
    role: build
    seat: >-
      claude-opus-5-5 (conducting session) with claude-sonnet-5 (implementers): the three activation
      commits carry both Co-Authored-By trailers; the verification battery, the review dispatches and this
      pack were run by a claude-sonnet-5 continuation session on the rebased head
  - lane: kimi-red-team
    role: review
    seat: kimi-code/k3
  - lane: qwen-red-team
    role: review
    seat: tp1-qwen3.8-max
  - lane: final-gate
    role: review
    seat: claude-opus-5-5 (fresh read-only session outside the contribution chain)
    status: pending, signs after this pack is committed and the OPEN finding below is dispositioned
lanes_note: >-
  D3 (seat diversity among build lanes) is met by the first build lane, the external prepare-only builder
  of the snapshot, named as Codex (GPT-5.6 Sol). That attribution rests on Zero's confirmation of
  2026-09-26 and on nothing in the repository; the lint reads only the seat string, so this note is where
  the difference between a recorded and a remembered attribution is kept. The Claude work on this branch
  (activation wiring, the WhatsApp restoration, two specs, verification) is the second build lane. Codex
  authored the R19 sources, so no Codex review lane is declared.
snapshot_provenance: >-
  The R19 sources activated here (components/r19/**, the home sections, r19/home/Footer.tsx) landed in
  #7428 from the read-only snapshot worktree, authored by Codex as an external prepare-only builder. This
  diff adds: the (blog) layout mount of R19Presentation, the transplanted home in (marketing)/page.tsx,
  R19-aware edits of seven shared v2 components, the header and hero WhatsApp actions in r19/home/Entry.tsx
  and home.css, and the tests. r19/home/Footer.tsx is NOT part of this diff.
