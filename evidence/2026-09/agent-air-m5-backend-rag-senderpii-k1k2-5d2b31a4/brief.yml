objective: |
  Follow-up PR #7417 mandated: closes K1 and K2 of that PR's final on-disk gate
  (pull/7417#issuecomment-5847196175). #7417 (`fix(email): close C1/C2/C3/C6 of PR #7385's gate
  on the sender-PII scrub`) is merged (squashed as `37c03c1874`).

  K1 (SHOULD-FIX, CodeQL alert 9200, `py/polynomial-redos`): #7417's own C1 fix restored the
  round-1 token class via `_EMAIL_TOKEN_RE = re.compile(r"[^\s@<>\"'`]+@[^\s@<>\"'`]+")` and added
  two peel regexes, `_LEADING_MD_DELIM_RE` (`^[chars]+`) and `_TRAILING_MD_DELIM_PUNCT_RE`
  (`[chars]+$`). The gate measured all three at the same quadratic cost C6 had already removed
  from `_TRAILING_PARTIAL_TOKEN_RE` (1.05-1.28s and 1.64s at 20k chars respectively): a
  `.sub()`/`.search()` scan whose failure mode backtracks per start position, so a non-matching or
  anchor-blocked run costs O(length²). `_bounded_scrub` bounds every caller to 120/400 chars (a few
  ms even at that cost), so this was never a live DoS — but the shape is the same one C6 was
  supposed to close everywhere in this module, and it moved a HIGH CodeQL alert onto `main` instead
  (9200 never existed on `main` before #7417; 9192, the alert C6 actually closed, does not recur).

  Cure: replaced all three regexes with linear constructs. `_scrub_word` is a single forward pass
  over a boundary-free "word" (the same two-pointer shape `_strip_trailing_partial_token` already
  uses) that locates `local@domain` spans via `str.find` with a monotonically-advancing start
  index — each character of the word is visited a bounded number of times across the whole call,
  never re-scanned from an earlier position. `_redact_token`'s peel now uses `str.lstrip`/
  `str.rstrip` over the same two character sets the regexes encoded — a builtin, not a pattern, so
  there is no backtracking construct left for CodeQL (or an adversarial input) to find a blowup in.
  `_scrub_email_tokens` itself is now a third single forward pass that splits `text` into these
  boundary-free words (whitespace and `<>"'`` backtick are still the only hard boundaries — `@` is
  never one, since it lives *inside* a token as the local/domain separator) and hands each to
  `_scrub_word`.

  K2: `test_scrub_leaves_no_fragment_when_address_itself_contains_md_delimiters` (added by #7417
  for its own C1 fix) asserted `address not in body` / `fragment not in body` against the RAW
  urlencoded POST payload passed to `urlopen` — `urllib.parse.urlencode` (via `quote_plus`)
  percent-encodes both `@` (-> `%40`) and `*` (-> `%2A`), so neither literal character can ever
  survive urlencoding regardless of what the redaction actually did. The gate proved this: the
  `asterisk_in_local` param is GREEN on `b491d10138` (pre-#7417) even though that commit's alert
  `text` literally contains the `a*` fragment the test exists to catch. Fixed by parsing the
  payload with `urllib.parse.parse_qs(body)["text"][0]` first and asserting on that — the same
  string Telegram actually renders — and the PR body/this brief's `grader` correct #7417's own
  overclaim rather than repeating it.
constraints:
