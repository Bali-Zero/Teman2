    probe: "pytest backend/tests/unit/services/notifications/test_email_audit.py::test_scrub_email_tokens_fully_digests_a_400_char_single_token"
  - text: >-
      (K2) `test_scrub_leaves_no_fragment_when_address_itself_contains_md_delimiters` SHALL assert
