    No other behaviour in `email_audit.py` changed — the module's PUBLIC surface
    (`_bounded_scrub`, `notify_email_failure_critical`, `_strip_trailing_partial_token`) is
    untouched by K1 beyond the internal helpers it calls."
  - "K1 is REQUIRED to be byte-identical to the pre-K1 (post-#7417) implementation on every
    reachable input — this is a performance/CodeQL-shape fix, not a behavior change. Verified, not
    merely asserted (see grader)."
  - "No client PII in this PR's own artifacts — every example address is a synthetic
    `*.example`/`*.example.test` shape, matching #7385's and #7417's own convention."
  - "K3 and K4 (quoted local parts / apostrophes / backticks; Markdown glued to an address with no
    whitespace) are explicitly OUT OF SCOPE for this PR per the gate's own routing — they fold into
    the later C4 follow-up PR (2026-10-03)."
