risks:
  - "K1's `_scrub_word` still walks left-to-right through every character of a boundary-free word
    once for the outer boundary scan and once (amortized) for the inner `@`-pairing scan — O(n)
    total but with a real Python-level constant factor per character (~90-280 ns/char measured,
    100k-400k chars), higher than a compiled regex's per-char cost on the FAST path. Not a
    regression in the security sense (CodeQL's concern is the growth curve, not the constant), and
    every real caller is bounded to 400 chars regardless (~0.03-0.05 ms/call, measured)."
  - "The byte-identical proof runs against `37c03c1874`'s sources (the pre-K1, post-#7417-merge
    module — corrected per the #7426 gate, N4: it cannot have run against `b491d10138`, which
    differs from HEAD in the corpus's 2,141 leak cases and would show diffs, not 0) reloaded via
    `importlib` in the SAME process as HEAD's module, for `redact_identifier_for_log`'s per-process
    fallback salt to line up when neither module sets `LOG_PII_HMAC_SALT` — confirmed empirically
    (0 diffs across 15,886+15,886 cases, many of which redact something), not re-derived from the
    salt module's own source in this brief."
grader: |
  K1: (a) re-ran PR #7417 gate's own `adversarial.py` corpus (15,886 cases) against this PR's head
  — 0 head leaks, 2,141 b491 leaks, 0 head-only regressions, matching the gate's own numbers
  exactly (sanity-checked the harness reproduces the gate's baseline before trusting its verdict
  on this head). (b) Wrote a SEPARATE byte-identical diff harness comparing raw alert bodies
  (not just leak counts) between the pre-K1 (post-#7417-merge) module and this head's module over
  the SAME 15,886 cases: 0 diffs. (c) Timed `_scrub_email_tokens` directly at 5k/10k/20k/100k/
  400k chars on three adversarial pump characters (`!`, `*`, `a`) — ns/char stays in the
  90-280 range across that 80x size range (no quadratic growth), versus the gate's measured
  1.05-1.64s/20k (order-of-magnitude slower) on the regex it replaces.

  K2: ran the corrected test directly against a dynamically-loaded copy of `b491d10138`'s
  `email_audit.py` (via `importlib.util.spec_from_file_location`, same technique #7417's own gate
  used) for all 3 parametrized cases — `underscore_in_local`, `asterisk_in_local`,
  `underscore_in_domain` — all 3 show `fragment_absent=False` (RED), confirming the corrected
  assertion actually catches what the vacuous urlencoded-body check could not.
