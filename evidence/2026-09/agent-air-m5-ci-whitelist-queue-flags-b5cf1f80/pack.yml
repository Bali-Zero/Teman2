dissent:
  - seat: kimi-code/k3 (cross-family)
    status: CONFIRMED
    objection: >-
      OK with two nits, both cured: the file header still advertised
      `--auto --squash`, and a failed verdict read died under `set -e` without
      its own ::error:: annotation. One behaviour edge named and ACCEPTED: a
      `labeled` event on an already-merged whitelisted PR now goes red (both
      fields null post-merge) where the old swallow was green — rare, and the
      fail-closed direction is the point of this PR.
  - seat: codex-gpt-5.6-sol (cross-family)
    status: CONFIRMED
    objection: >-
      OK, one declared limit not cured here: the fake gh returns the post-jq
      output directly, so the unit tests do not exercise the real GraphQL query
      or the jq filter. Accepted because the Bites observation on the next
      dependabot PR exercises exactly that path live, and a fake that parsed
      GraphQL would be a second implementation of GitHub to keep in sync.
  - seat: claude-fable-5-1 (this worktree session — the builder's own standing objection)
    status: PLAUSIBLE
    objection: >-
      The way this cure could be wrong, stated plainly: it assumes GITHUB_TOKEN
      on a pull_request_target run can read autoMergeRequest/mergeQueueEntry.
      If it cannot, every whitelisted PR's check goes RED — loud, not silent, and
      the first dependabot PR after merge will show it within one run. The
      alternative (keep the warning-and-exit-0) is the disease itself.
