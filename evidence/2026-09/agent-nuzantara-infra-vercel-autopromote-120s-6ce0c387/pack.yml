dissent:
  - seat: kimi-code/k3
    objection: "FETCH_TIMEOUT_S=30 sat below the PR's own measured 39s slow fetch: on a persistently slow network every attempt of every tick would time out — permanent blindness where the old 120s ceiling recovered. Also: _main_head's gh api fallback had no timeout, so the tick bound did not hold on the degraded path it exists for; three comment blocks still quoted 900s / 372s / 15 minutes."
    status: CONFIRMED
    disposition: "Ceiling raised to 45s with two attempts and a 5s backoff (95s worst case, inside the tick, clears the measured case); gh fallback timed with FETCH_TIMEOUT_S; the three comment blocks rewritten; _git's local-read timeout set to 60s with a comment saying it is not the network ceiling. Corpora re-run: 51 passed, wrapper 20/20."
  - seat: kimi-code/k3
    objection: "The new shell cases validate the repo copy of the wrapper, never the live one on Mini, so repo-to-live drift is not covered by this corpus."
    status: PLAUSIBLE
    disposition: "By design: repo-to-live parity is the declared-pair lint's job (infra/home-fork/declared-pairs.json lists both the wrapper and the plist for mini; scripts/lint_home_fork.py compares live to origin/main), and the pending mini-install proof reads the interval out of launchd itself."
  - seat: codex-gpt-5.6-sol
    objection: "_production_includes runs git merge-base with no timeout on the ordinary --promote-only path, so one tick can still hang indefinitely; the rotation corpus never proves a small log is preserved nor that a pre-existing .1 is overwritten; three comments claim more than the code gives (the pidfile makes overlap 'never a race'; fetch is 'the only network step'; a '15-minute cadence' survives in the promote-only comment)."
    status: CONFIRMED
    disposition: "merge-base timed at 60s and closed on expiry; rotation cases seed MARKER + old .1 and assert both directions; the three comments rewritten to what the code and launchd actually guarantee. Corpora re-run: 51 passed, wrapper 20/20."
  - seat: codex-gpt-5.6-sol
    objection: "120s is not an end-to-end bound: the post-promote probe loop, the Vercel listing scan and the gh fallback can each push a run past one tick, and the cadence test only proves the isolated fetch retry."
    status: PLAUSIBLE
    disposition: "By design, now stated in the wrapper: launchd never starts a second instance of a label while one runs (it skips that fire) and the pidfile is the second line for manual runs, so a long promote costs one skipped fire, visible as a warning heartbeat. The cadence bounds the FETCH — the step every idle tick takes — so a dead network degrades this tick instead of wedging the next. An end-to-end budget would mean cutting the promote's own proof, which is the organ's reason to exist."
pending_proofs:
