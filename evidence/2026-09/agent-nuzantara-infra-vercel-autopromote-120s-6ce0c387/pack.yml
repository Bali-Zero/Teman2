    expected: run interval = 120 seconds; run start lines 2 minutes apart.
  - probe: next-mouth-merge
    owner: Fable Pro session 997ab3e1 (shipper)
    command: tail -40 ~/logs/mini-vercel_autopromote/run.log on Mini after PR #6021 merges
    expected: PROMOTED — production moved, logged within 2 minutes of the deployment's ready timestamp, no vercel_prod_deploy.py run by hand.
residual_risks:
  - risk: The undocumented Vercel setting that leaves production deployments STAGED is untouched; the organ remains the cure, not the fix.
    mitigation: Cure latency is now bounded at 2 minutes after READY; the sentinel still alerts if production lags 30 minutes.
  - risk: A wedged run (hung network call) makes every later tick a visible skip.
    mitigation: The skip writes a warning heartbeat, never ok; the stale detector reads warning.
