deploy_impact:
  merging_deploys: true
  path: "apps/backend-rag/** -> fly-deploy.yml (nuzantara-rag)"
  order: >-
    Pre-deploy `run-migrations` runs apply-all via `flyctl ssh console` against the CURRENTLY
    DEPLOYED (previous) image -- migration 322 is not in that image's checkout, so this step
    is a no-op for it. `deploy` then rolls the NEW image (worker code that references
    served_by) onto 100% of production traffic; `flyctl deploy --strategy rolling` does not
    return until every machine is replaced and healthy. `run-sql-v2-migrations-post-deploy`
    (needs: deploy) only starts after that, ssh-ing into the FRESH image to apply 322.
    CONSEQUENCE (found this review, fixed this PR): there is a real, once-per-deploy window
    where the new worker is fully live before the column exists. `_finalize()` in
    wa_outbox_worker.py now catches exactly `asyncpg.exceptions.UndefinedColumnError` on the
    served_by-bearing UPDATE and retries the pre-322 shape, so the row still finalizes to
    'done' (no residual double-send) with served_by simply unset for that one row.
  lock: >-
    ADD COLUMN IF NOT EXISTS ... TEXT NULL with no default is catalog-only on Postgres >= 11
    (no table rewrite, no row touched) -- same reasoning as migrations 314/318. SET LOCAL
    lock_timeout='5s' / statement_timeout='30s' bound the ACCESS EXCLUSIVE wait, matching
    314's convention; ~450 rows in production (per migration 318's own measurement) makes the
    DDL itself instant regardless.
  rollback: >-
    Routine rollback = revert the worker commit only, keep the column (314/318 convention) --
    the old worker's fenced UPDATE names status/abstained_at/evidence_score explicitly and
    never references served_by, so a bare revert is safe by construction. A real
    `DROP COLUMN` in production is a separately authorized destructive action, never part of
    a routine revert; the migration's own ROLLBACK section exists for isolated up/down/up
    validation (proven in receipts/roundtrip-up-down-up.txt), not a deploy-time path.

