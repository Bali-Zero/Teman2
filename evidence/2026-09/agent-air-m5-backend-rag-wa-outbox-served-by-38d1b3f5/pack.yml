dissent:
  - seat: "gate (fresh Opus, PR #7392 @ 3b77978ef8)"
    objection: >-
      The entire "deploy-window" premise behind the _finalize() fallback and its test is
      FALSE: `apps/backend-rag/fly.toml:15`'s `release_command` runs `migrate apply-all &&
      schema_audit` on the NEW image before Fly replaces any machine, and
      `schema_audit.py:529`'s `_check_pending_migrations` fails the release outright on a
      pending migration -- proven against real deploy logs (runs 34937690207/35440961020/
      36072036287 for migrations 318/320/321: `release_command ... completed successfully`
      before every rolling update, post-deploy job prints "0 migrations applied"). Precedent
      #6561 (migration 318) already shipped a column + writer in one PR with no fallback.
    status: CONFIRMED
    resolution: >-
      Correction round (fix-of-a-fix depth 1): `_finalize()` and its
      UndefinedColumnError-catching retry removed entirely; the fenced UPDATE now carries
      `served_by = $6::text` inline like the other carrier columns (persist_score,
      persist_abstained), same as migration 314's original shape. The dedicated
      drop-column/restore-column guilt+innocence test is removed. Every text asserting the
      false premise is rewritten: migration 322's header and `COMMENT ON COLUMN` (this PR,
      before the file could ever be applied to PROD and checksummed into
      `_schema_versions`), the worker's inline comment, `docs/zantara-loop-state.md`'s KPI
      block, and the PR body. Neither council seat could have caught this from the diff
      alone -- both are static reviewers with no tool access to fly.toml, schema_audit.py or
      real deploy run logs; their own reviews (below) correctly judged the fallback CODE as
      internally consistent given the (false) premise it was built to serve.
  - seat: codex-gpt-5.6-sol
    objection: 'The _finalize() except clause wraps the WHOLE three-statement transaction (wa_outbox UPDATE + meta_inbox_messages UPDATE + _apply_pending_status), not just the served_by-bearing statement -- an UndefinedColumnError from either of the other two (hypothetically, an unrelated future column typo) would be misattributed to "migration 322 pending" and retried needlessly.'
    status: PLAUSIBLE
    resolution: >-
      MOOT as of this pack's current head: the entire _finalize()/except mechanism this
      objection concerned has been removed in the correction round above (the deploy-window
      premise it existed to serve was refuted). Recorded for the historical review trail,
      not because the underlying code point was wrong on its own terms.
  - seat: codex-gpt-5.6-sol
    objection: 'The migration and column COMMENT''s original wording ("NULL = no completion") is too narrow: a row finalized via the deploy-window fallback, or a historical row predating this column, also reads NULL and neither means "no completion happened".'
    status: CONFIRMED
    resolution: >-
      Reworded (commit cf4170257d, then simplified further in the correction round once the
      deploy-window case was refuted): the migration header, the column COMMENT, and
      docs/zantara-loop-state.md's KPI block now say "route not recorded" and name the two
      remaining real NULL causes (a failed generation, or a route that never calls the codex
      leg), and explicitly note this is NOT the same narrower meaning NULL has for
      evidence_score.
  - seat: codex-gpt-5.6-sol
    objection: "The test's real DROP COLUMN / ADD COLUMN cycle needs a sacrificial, isolated database; the diff alone does not prove that isolation."
    status: PLAUSIBLE
    resolution: >-
      MOOT as of this pack's current head: the test this objection concerned
      (test_served_by_column_missing_mid_deploy_still_finalizes) is removed in the
      correction round above, along with the fallback code it exercised.
  - seat: kimi-code/k3
    objection: "wa_codex_leg.CodexLegResult.served_by is a plain str, not a Literal[...] of the closed vocabulary -- the DB has no CHECK (by design, see Q2) and the type system doesn't enforce it either, so a future typo'd value would flow straight through."
    status: PLAUSIBLE
    resolution: >-
      Not fixed in this PR: wa_codex_leg.py is outside this diff's scope (this PR only adds a
      carrier for an existing field, it does not touch the producer). A cheap follow-up, not
      a blocker for this PR's own correctness.
  - seat: kimi-code/k3
    objection: "The deploy-pipeline ordering that creates the deploy-window gap is systemic (fly-deploy.yml's pre-deploy migration job always sees the PREVIOUS image's checkout) and will recur for every future additive column+writer pair, not just this one."
    status: RETRACTED
    resolution: >-
      Measured false: `apps/backend-rag/fly.toml:15`'s `release_command` (`migrate
      apply-all && schema_audit`) is the ACTUAL gate, and it runs on the NEW image before
      Fly replaces a single machine -- `schema_audit.py`'s `_check_pending_migrations`
      fails the release outright on any pending migration. The GH Actions `run-migrations`/
      `run-sql-v2-migrations-post-deploy` jobs this objection (and the fallback it defended)
      were built around are real but redundant belt-and-suspenders, not the mechanism that
      actually gates traffic. Verified against real deploy run logs for migrations
      318/320/321 (34937690207/35440961020/36072036287): `release_command` completes before
      every rolling update, and the post-deploy job prints "0 migrations applied on fresh
      image" every time. There is no systemic gap to flag for a future PR — every additive
      column+writer pair already gets this same guarantee, which is why migration 314's own
      abstained_at/evidence_score needed no fallback either.

