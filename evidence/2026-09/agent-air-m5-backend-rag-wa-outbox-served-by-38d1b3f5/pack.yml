deploy_impact:
  merging_deploys: true
  path: "apps/backend-rag/** -> fly-deploy.yml (nuzantara-rag)"
  order: >-
    The GH Actions `run-migrations` job (pre-deploy, `flyctl ssh console` against the
    CURRENTLY DEPLOYED image) and `run-sql-v2-migrations-post-deploy` (after `deploy`, ssh
    into the fresh image) are BOTH real, but neither is the actual gate that matters here --
    they run `migrate apply-all` a second and third time as belt-and-suspenders (measured:
    the post-deploy job prints "0 migrations applied on fresh image" on every real deploy,
    because the migration is already applied by then). The REAL gate is
    `apps/backend-rag/fly.toml:15`'s `release_command` (`migrate apply-all && schema_audit`):
    Fly runs this on the NEW image, in a throwaway release machine, BEFORE replacing a single
    running machine with the rolling strategy, and `schema_audit.py`'s
    `_check_pending_migrations` returns an `error`-severity finding on any pending migration,
    which fails `schema_audit`'s exit code, which fails the `&&`-chained release_command,
    which makes Fly abort the release before any traffic ever reaches the new image. Verified
    against real deploy logs: runs 34937690207 (migration 318), 35440961020 (320) and
    36072036287 (321) each show `release_command ... completed successfully` BEFORE the
    rolling update proceeds. CONSEQUENCE: migration 322 and the worker code that reads
    `served_by` can never be live at the same time as a missing column -- there is no
    deploy-window gap, and no fallback is needed (same guarantee migration 314's
    `abstained_at`/`evidence_score` already relies on, unremarked because it is the default
    safe case). This section previously (commit dc893a75) named a false deploy-window race
    and a code fallback for it; both are corrected as of this pack's current head.
  lock: >-
    ADD COLUMN IF NOT EXISTS ... TEXT NULL with no default is catalog-only on Postgres >= 11
    (no table rewrite, no row touched) -- same reasoning as migrations 314/318. SET LOCAL
    lock_timeout='5s' / statement_timeout='30s' bound the ACCESS EXCLUSIVE wait, matching
    314's convention; ~450 rows in production (per migration 318's own measurement) makes the
    DDL itself instant regardless.
  rollback: >-
    Routine rollback = revert the worker commit only, keep the column (314/318 convention) --
    the old worker's fenced UPDATE names status/abstained_at/evidence_score explicitly and
    never references served_by, so a bare revert is safe by construction. A real
    `DROP COLUMN` in production is a separately authorized destructive action, never part of
    a routine revert; the migration's own ROLLBACK section exists for isolated up/down/up
    validation (proven in receipts/roundtrip-up-down-up.txt), not a deploy-time path.

