outcome: >-
  Additive nullable column + a one-column carrier addition to an already-fenced production
  write (migration 314, live). No production release, no real WhatsApp send, no client data
  in this pack. CORRECTION ROUND (fix-of-a-fix depth 1, per Builder Contract §1): the fresh
  gate that read this pack refuted its central premise -- it named a "deploy-window" race
  (the new worker code referencing served_by going live before migration 322 applied) and
  shipped a code fallback for it. That premise is FALSE: `apps/backend-rag/fly.toml:15`'s
  `release_command` (`migrate apply-all && schema_audit`) runs on the NEW image before Fly
  replaces a single machine, and `schema_audit.py`'s `_check_pending_migrations` fails the
  release outright on a pending migration -- verified against real deploy run logs
  (34937690207/35440961020/36072036287, migrations 318/320/321) showing
  `release_command ... completed successfully` before every rolling update, with the
  SEPARATE `run-sql-v2-migrations-post-deploy` GH Actions job printing "0 migrations applied
  on fresh image" every time (it is belt-and-suspenders, not the actual gate). Precedent
  #6561 (migration 318) already shipped a column + its writer in one PR with no such
  fallback. This round removes the fallback code and its dedicated test, and rewrites every
  text (migration header/COMMENT, worker comment, KPI doc, PR body) that stated the false
  premise -- BEFORE migration 322 could be applied to PROD and its file checksummed into
  `_schema_versions` (unrecoverable past that point short of a 323 migration).

