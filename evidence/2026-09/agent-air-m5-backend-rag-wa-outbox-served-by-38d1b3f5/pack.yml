dissent:
  - seat: codex-gpt-5.6-sol
    objection: 'The _finalize() except clause wraps the WHOLE three-statement transaction (wa_outbox UPDATE + meta_inbox_messages UPDATE + _apply_pending_status), not just the served_by-bearing statement -- an UndefinedColumnError from either of the other two (hypothetically, an unrelated future column typo) would be misattributed to "migration 322 pending" and retried needlessly.'
    status: PLAUSIBLE
    resolution: >-
      Kept as-is rather than restructured: neither of the other two statements references
      served_by, so this exact exception from them is not reachable by anything in this diff
      -- only a genuinely unrelated future bug could trigger it, and that bug would raise the
      SAME exception class on the retry too (the retry's SQL is unchanged for those two
      statements), so the failure stays loud rather than silently swallowed. Splitting the
      wa_outbox UPDATE into its own transaction to narrow the catch exactly would change this
      write's atomicity with the meta_inbox_messages UPDATE, which is a bigger behavioral
      change than this PR's scope warrants. Recorded here rather than fixed silently.
  - seat: codex-gpt-5.6-sol
    objection: 'The migration and column COMMENT''s original wording ("NULL = no completion") is too narrow: a row finalized via the deploy-window fallback, or a historical row predating this column, also reads NULL and neither means "no completion happened".'
    status: CONFIRMED
    resolution: >-
      Reworded in this PR (commit cf4170257d): the migration header, the column COMMENT, and
      docs/zantara-loop-state.md's KPI block now say "route not recorded" and enumerate all
      four NULL causes (failed generation, a route that never calls the codex leg, a
      historical row, or the deploy-window fallback), and explicitly note this is NOT the
      same narrower meaning NULL has for evidence_score.
  - seat: codex-gpt-5.6-sol
    objection: "The test's real DROP COLUMN / ADD COLUMN cycle needs a sacrificial, isolated database; the diff alone does not prove that isolation."
    status: PLAUSIBLE
    resolution: >-
      True from the diff alone -- the isolation is a property of the test fixture module
      (test_wa_outbox_worker_carrier.py's own documented header: TEST_DATABASE_URL default
      nuzantara_test, CI's dedicated postgres:15 service, per-xdist-worker clones under
      backend/tests/conftest.py, one file completes before the next starts without xdist),
      unchanged by this PR. This session additionally ran the new test against a PRIVATE,
      dedicated local database (nuzantara_test_wa322) created solely for this PR, never the
      shared nuzantara_test -- receipts/pytest-final.txt.
  - seat: kimi-code/k3
    objection: "wa_codex_leg.CodexLegResult.served_by is a plain str, not a Literal[...] of the closed vocabulary -- the DB has no CHECK (by design, see Q2) and the type system doesn't enforce it either, so a future typo'd value would flow straight through."
    status: PLAUSIBLE
    resolution: >-
      Not fixed in this PR: wa_codex_leg.py is outside this diff's scope (this PR only adds a
      carrier for an existing field, it does not touch the producer). A cheap follow-up, not
      a blocker for this PR's own correctness.
  - seat: kimi-code/k3
    objection: "The deploy-pipeline ordering that creates the deploy-window gap is systemic (fly-deploy.yml's pre-deploy migration job always sees the PREVIOUS image's checkout) and will recur for every future additive column+writer pair, not just this one."
    status: CONFIRMED
    resolution: >-
      Correct and out of scope for this PR -- the `_finalize()` guard is the right LOCAL
      mitigation for this column; a systemic fix (e.g. gating deploy on the migration job
      seeing the NEW checkout) is a separate infra PR. Not filed as a ticket by this session;
      flagged here for the release owner to triage.

