  addition to an already-fenced write, not a size-driven Gear-3.
  CORRECTION ROUND (fix-of-a-fix depth 1, gate REWORK-BUILD on PR #7392 @ 3b77978ef8): the
  first build round invented a deploy-window race that does not exist — it assumed
  fly-deploy.yml's own `run-migrations`/`run-sql-v2-migrations-post-deploy` jobs were the
  only gate, and added a `wa_outbox_worker.py::_finalize()` fallback (catch
  `asyncpg.exceptions.UndefinedColumnError`, retry without served_by) plus a dedicated test
  for it. `apps/backend-rag/fly.toml`'s `release_command`
  (`migrate apply-all && schema_audit`) actually runs on the NEW image BEFORE Fly replaces
  a single machine, and `schema_audit.py`'s `_check_pending_migrations` fails the release
  outright on a pending migration — proven against real deploy run logs for migrations
  318/320/321 (each shows `release_command ... completed successfully` before the rolling
  update) and precedent PR #6561, which shipped migration 318's column + writer in one PR
  with no fallback. The fallback and its test are REMOVED in this pack's current head; the
  migration/worker/docs text no longer claims a deploy-window gap. Two independent Gear-3
  council seats (codex-gpt-5.6-sol, kimi-code/k3) reviewed the first-round fix and returned
  ACCEPT-WITH-NOTES against the (then-believed-real) fallback; their notes are recorded as
  dissent below — two are now MOOT (the mechanism they concerned is deleted), one
  (NULL-semantics wording) still applies to the simplified column and was kept, and kimi's
  "systemic deploy-order gap" dissent is RETRACTED with the same fly.toml/schema_audit
  evidence. The delta from council-reviewed head to this head is a removal (fallback +
  its test) plus text corrections, not new logic — no re-ask was needed.
