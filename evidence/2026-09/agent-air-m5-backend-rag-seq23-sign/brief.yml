gear: 3
gear_reason: >-
  A signed PRODUCTION rule pack (rulepack-prod-023.signed.json, 285 KB) lands over
  apps/backend-rag/**, where merging is itself the deploy. It becomes the HIGHEST SIGNED pack
  every census/inventory/gold-replay consumer reads. The runtime stays on the DB-active seq-22
  until the conductor's activation (runbook step 7). Judgement agrees with the size floor.
ruling: MANDATE-vo.md Slice A9 (DRAFT-SPEC-A8-1.v2 §3 runbook steps 1-6), owner delegation OD-6 2026-09-22 and «firmo e autorizzo» 2026-09-24T09:23:28Z
mission: VISA-ORACLE-DW-20260919 — Slice A9.1/A9.2/A9.3 (sign seq-23, pre-sign rollback seq-24, signing PR)
objective: >-
  Sign the seq-23 source that #7174 merged (H23 e5f791b5232fd1369ef3b94ca7bb5f349f9bb6eb4073895aa9f7deb682e72204,
  previous = H22 3d7555afcc9496b451bc86235624b4a88d35aabb9df354778dcf9b0b3b276e37), after first closing
  gate #7174 F1 (per-row ENGINE witnesses) and F2 (guilts that name the specific id). Pre-sign
  the seq-24 rollback off-repo. Move every consumer the new highest-signed pack moves, by command.
scope:
  - apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-023.signed.json (new, GENERATED by sign_pack)
  - apps/backend-rag/backend/tests/services/visa_engine/test_seq23_pack.py (F1 engine witnesses, F2 guilts)
  - apps/backend-rag/backend/scripts/visa_engine/fold_pack_seq23.py (mismatch messages only; fold output unchanged)
  - apps/backend-rag/backend/tests/services/visa_engine/test_interview_walk_census.py (seq-23 rows of the _SIGNED_SEQUENCE-keyed pins)
  - apps/backend-rag/backend/tests/scripts/visa_engine/test_review_hold_inventory.py (9/7 -> 1/0)
  - apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/fixtures/option_matrix.json (remote_work false|true)
  - apps/backend-rag/backend/tests/services/visa_engine/test_evaluator_gold.py (six production replay expectations)
  - scripts/ci/observe_visa_seq23_signed.py (new)
  - apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/engine-adapter.test.ts (seq-22-only review-copy list; on top of Slice A8-2, PR 7224)
  - docs/runbooks/visa-engine-key-ceremony.md (trust array kid 2026-07-prod-1 -> prod-2026-07-1)
  - evidence/2026-09/agent-air-m5-backend-rag-seq23-sign/**
constraints:
  - No activation, no production DB connection, no --yes (runbook steps 7-10 are a separate order).
  - The private key is used by path only; never printed, copied or read into a variable.
  - The rollback bundle lives under kit/receipts/ (dir 0700, files 0600), never under the repo.
  - >-
    apps/mouth engine-adapter.test.ts is NOT touched until Slice A8-2 is on main (it merged as PR 7224,
    6e7512406e, 2026-09-24T10:17:54Z; the branch was rebased onto it before the mouth part was measured).
  - No npm install/ci. No arm, no merge, no gate verdict by this seat.
acceptance:
  - text: "A9.1 the signed file SHALL verify as VerifiedRulePack(sequence=23, PRODUCTION, prod-2026-07-1, unsigned_dev=False) before AND after Prettier"
    probe: "verify_rule_pack with the public trust array (transcript in the PR body)"
  - text: "A9.2 the seq-24 rollback SHALL differ from the seq-22 source in exactly 6 fields and SHALL be REJECTED by activate_pack against head 22"
    probe: "activate_pack <receipt> --current-sequence 22 --current-payload-sha256 H22 (no --yes)"
  - text: "F1 every §1 row SHALL have an ENGINE witness (TRUE + UNKNOWN persona) and a revert SHALL turn that row's witness red naming it"
    probe: "pytest backend/tests/services/visa_engine/test_seq23_pack.py::TestRowEngineWitnesses"
  - text: "A9.3 the inventory pins SHALL be the values review_hold_inventory --json prints on the signed tree"
    probe: "python -m backend.scripts.visa_engine.review_hold_inventory --json"
  - text: "A9.3 observe_visa_seq23_signed.py SHALL exit 0"
    probe: "python3 scripts/ci/observe_visa_seq23_signed.py"
consumer_map:
  - >-
    test_interview_walk_census.py, test_review_hold_inventory.py, test_gold_replay_driver.py and
    test_gold_replay_artifact.py read the HIGHEST SIGNED pack on disk; this PR moves them to seq-23.
  - >-
    The conductor's runbook step 7-8 (activation + sequence-23 probes) consumes the signed file
    after merge; owed, not claimed here.
  - >-
    apps/mouth engine-adapter.test.ts (latestProductionPackFile) — the mouth part of A9.3, on top of
    Slice A8-2: the twelve review codes signed seq-23 retires keep their copy under
    REVIEW_REASON_COPY_KEYS_LIVE_ON_SEQ22_ONLY, whose honesty test derives the set from the pack files.
appetite:
