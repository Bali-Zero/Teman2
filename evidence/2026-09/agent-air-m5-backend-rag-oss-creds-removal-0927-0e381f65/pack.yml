pii_scan_note: >-
  This diff's `+` lines introduce zero new PII: the credential removal
  DELETES 57 username/password pairs (present only in `-` lines) and
  REPLACES one leaked username plus an example password-shaped string with
  `[REDACTED]` in the archived training doc. The rewritten script's `+`
  lines retain the 59 PT-company names and numeric company_id values already
  present in the pre-fix file since 2026-04-07 (business identifiers, not
  personal data) — carried forward unchanged in content, not introduced by
