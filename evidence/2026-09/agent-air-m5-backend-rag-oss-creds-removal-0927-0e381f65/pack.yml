  those company names, any credential value, or any synthetic look-alike.
dissent:
  - seat: session (self-review, mid-task)
    objection: >-
      Two structural verification commands run while grounding this task
      printed content this diff's own constraints forbid: `sed -E
      's/"[^"]*"/"REDACTED"/g'` redacted only double-quoted strings while
      the actual table used single-quoted `repr()` output, so 5 real
      company names printed in cleartext; separately, reading the script's
      docstring (lines 1-40) printed 7 company names verbatim (the
      "Non-derivable knowledge" section documenting known typos). Neither
      is a new leak (both were already public on origin/main since
      2026-04-07) but both violate this task's own "never print a client
      name" instruction.
    status: CONFIRMED
    resolution: >-
      Flagged to the dispatching session inline, in the same turn, before
      continuing. No further reads of the credential table's content were
      performed after this point — all subsequent verification used
      line-count/hash/regex-count comparisons only, never full-content
      display. Not correctable after the fact (the values are already in
      this session's own transcript) and not repeated.
  - seat: session (self-review, mid-task)
    objection: >-
      A separate command redacting the archived training doc's example
      line printed a password-shaped string, `Bali2023*`, that turned out
      not to match any of the 48 real distinct passwords in the credential
      table (the loader search matched only a username against that line) —
      an example value, not a leaked real credential, but still a
      credential-SHAPED string printed in cleartext against the same "never
      print a secret" constraint.
    status: CONFIRMED
    resolution: >-
      Same as above: flagged immediately, no repeat. The line was
      subsequently redacted (see receipt above) using a value held only in
      Python-process memory, never re-printed to a terminal, for the final
      edit.
  - seat: session (self-review, guard design)
    objection: >-
      The first version of the repo-wide keyword+shape heuristic checked
      "does >=5 credential-shaped tuples exist ANYWHERE in the file" against
      "does the credential keyword exist ANYWHERE in the file" as two
      independent, whole-file conditions — an over-match (family #3): 13
      unrelated tracked files (test fixtures, an Excel generator, a CI
      change-map) flagged, each because a large file happened to contain
      both an incidental keyword mention and an unrelated N-row data table
      far apart in the same file.
    status: CONFIRMED
    resolution: >-
      Rewritten to require LOCALITY: a contiguous run of >=5 matching
      tuple/comment lines, with the keyword required only in that run plus
      a 5-line look-back window (where the real incident's keyword
      actually sat — in the type annotation's preceding comment). Re-ran
      against all 6869 tracked *.py files pre-existing on the branch:
      0 flagged, while the original incident file still measured 57 hits.
  - seat: session (self-review, CI wiring)
    objection: >-
      Wiring the new guard's own test file into the repo scanned by the
      guard it tests created a self-referential false positive: the
      guilt-fixture string embedded in
      scripts/tests/test_lint_no_inline_credential_tables.py matched the
      guard's own shape (1 hit) the moment both files were committed.
    status: CONFIRMED
    resolution: >-
      Fixed in a second, small commit: the guard's file-enumeration
      function excludes that one file by exact path, named and commented.
      Re-verified clean afterward (receipt above).
