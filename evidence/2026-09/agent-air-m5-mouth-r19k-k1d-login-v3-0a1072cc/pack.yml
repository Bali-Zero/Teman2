notes:
  - >-
    CI found what neither I nor the reviewer did: an E2E spec three directories away drove this page
    by its copy. Both of us read the diff; neither grepped for the page's own strings outside it.
    The lesson is the cheap one — a page rewrite means grepping the copy, not only the imports.
  - >-
    The one forest surface. --bz-panel/--bz-on-panel are added to BOTH kita blocks with the SAME
    values on purpose: --state-success lifts through a paper mix in the dark so "done" stays legible
    as text, and a lifted forest is a pale green wall rather than a panel. Paper on forest is
    11.30:1 in either theme.
  - >-
    Not fixed here, and named rather than hidden. lib/api/client.ts:487 sends an expired staff
    session to `/login?expired=true&reason=token_expired`; neither the old page nor this one says
    anything about it, so the visitor is told to sign in with no explanation of why they were
    thrown out. It is a copy-and-state question for a window that owns the session contract.
  - >-
    auth.api.ts:78 reads `(error as {status}).status` to decide how to log a denial, but client.ts
    throws ApiError with `statusCode`, so that branch is dead and every denial logs as an error.
    Out of this window's perimeter (it is the API layer, not the page) and it changes no behaviour
    the user can see.
  - >-
    A non-ApiError throw — client.ts's `Request timeout`, or auth.api.ts's `Login failed` on a 200
    with success:false — classifies as the service. Right for the timeout, arguable for the second;
    the old page called both a wrong PIN, so this is strictly better and the edge is recorded.
  - >-
    An independent seat DID run this time. Codex was unreachable from this host during K1a-K1c (the
    previous Dux died on that network error); it answered today with eight findings, every one of
    which was confirmed and disposed above. The finding that mattered most — the page-module export
    — was invisible to the command I had been running.
