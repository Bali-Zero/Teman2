  - claim: >-
      The E2E session read was cured by measurement, not by a third guess — and the reason it
      needed three attempts is recorded.
    cmd: >-
      PLAYWRIGHT_EXTERNAL_SERVER=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3111 npx playwright test
      --config=playwright.config.ts --project=chromium --ignore-snapshots --reporter=list
      --grep "page Page|@offline"
      Probe: npx vitest --run src/app/login
    result: >-
      Three techniques were measured one at a time. HOLDING the destination response deadlocks:
      page.evaluate does not settle while a top-level navigation is pending. ABORTING it leaves
      Chromium on an error document whose opaque origin denies localStorage with a SecurityError.
      FULFILLING it as a same-origin stub works — but only once the stub's own body is on screen,
