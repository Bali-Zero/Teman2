# Floor measured this session: `python3 scripts/evidence_pack_lint.py --print-floor
# --print-floor-source --numstat-file <numstat> --changed-files-file <changed>` on the final
# pushed diff returns `3`, by the PATH term (hot-zone), NOT size: the content-only churn (the
# 270 swept files alone, stable regardless of this pack's own prose length) is 1200, well below
# the 1828 Gear-3 threshold; the full-diff size term (content + this pack's own two files) is
# below threshold too, but shifts every time this pack's prose is edited, so it is deliberately
# NOT pinned as a literal digit here — see the final CI run's "Harness floor recompute" job for
# the exact number on the pushed commit. 4 of the 270 swept files sit under a hot-zone pattern —
# `apps/backend-rag/backend/app/core/config.py`,
# `apps/backend-rag/backend/services/invoicing/invoice_service.py`,
# `infra/launchagents/install_verify_connectome.sh`,
# `infra/launchagents/wrappers/wr2-external-bench-run.sh` — each touched only by a
# comment/prompt-string substitution (pair check, see acceptance A2), no behavior change.
# migrations_v2/** and .github/workflows/** were excluded from candidate enumeration entirely,
# never opened for writing, but they are not the only hot-zone shape this repo's floor checks.
objective: >-
  Successor to PR #7454 (gate verdict REWORK-BUILD, pack/body only again — the 270-file content
  diff was verified clean and byte-identically reusable for a third time; two further false
  claims Q1-Q2 below), which was itself the successor to #7450 (REWORK-BUILD, P1-P5), #7441
  (REWORK-BUILD, six defects D1-D6 below), #7434 (closed: byte-preserving but incomplete, 942
  residual hits) and #7430 (closed: whole-file trailing-whitespace churn). This v8 reuses
  #7454's 270-file content diff byte-identical (`git diff <base> <7454 head> -- . ':!evidence'
  | git apply --index`) and rewrites only this pack and the PR body to fix Q1-Q2. In every case
  below, "the owner's first name" refers to a single, specific, real given name
  that is PRIVATE per this repo's own CLAUDE.md ("Owner codename: Zero (nome reale PRIVATO)")
  — this pack and its sibling pack.yml deliberately never spell that name, nor the owner's
  personal email address, anywhere in their own prose, even where #7441's own evidence pack did
  (that self-violation is D4, see below). Where a literal code-identifier example is useful, it
  is given with the name replaced by the
  placeholder token `<name>` / `<NAME>` (e.g. `needs-<name>` stands for a hyphen-prefixed
  compound identifier that embeds the owner's first name lowercase).
constraints:
  - >-
    D1 (functional/protected file, must stay byte-identical): `scripts/verify_the_verifiers_
    gates.yaml` is sha256-pinned and CODEOWNERS-protected. #7441 edited a comment inside it
    (renaming the owner's first name to "Zero" mid-sentence), silently invalidating the pin.
    Added to this sweep's FUNCTIONAL_SKIP (whole file, never opened for writing). Verified
    byte-identical to origin/main (`git diff` empty for this path).
  - >-
    D2 (functional/protected file, must stay byte-identical): `scripts/lint/
    wr3_lint_cloud_dependency.py`'s `ALLOWED_MENTION_CONTEXTS` list is a functional allow-list
    for a Law-6 cloud-dependency guard. #7441 renamed the owner's first name to "Zero" inside
    that list, which would have widened the allow-list to whitelist any banned-vendor mention of
    "Bali Zero" (a guard over-match, cicatrix-superscar.md family #3). Added to FUNCTIONAL_SKIP.
    Verified byte-identical to origin/main, and `python3 scripts/lint/wr3_lint_cloud_dependency.py`
    exits 0 unchanged.
  - >-
    D3 (5 code-literal lines wrongly swept as prose in #7441, reverted here to byte-identical):
    a SQL `DEFAULT` string value, a JSON object key, a JSON boolean-field key, and two inline
    email/manifest-value heuristics all used the owner's first name lowercase as a bare literal,
    not adjacent to a hyphen or underscore, so the general word-boundary rule did not protect
    them. Fixed via an explicit LINE_LEVEL_SKIP keyed by exact original line content (not line
    number, so it survives future line-number drift): `docs/superpowers/plans/
    2026-05-17-zantara-cockpit-s1-foundation.md` (SQL `DEFAULT '<name-lower>'`),
    `research/operations/specs/2026-07-19-wa-bot-team-assistant-v1.md` (email-substring
    heuristic quoting `"<name-lower>"|"<surname-lower>" in email`), `research/wr3/01-wr2-anatomy.md`
    (JSON key `"approval_required": "<name-lower>"`), `research/wr3/02-verbi-atomici.md` (JSON
    key `"human_signoff": {damar: bool, <name-lower>: bool}`), `research/wr3/
    05-symbiosis-integration.md` (manifest value `approved_by: <name-lower>`). Two of these five
    files had no OTHER real hit, so they are now fully byte-identical to origin/main; the other
    three still carry their legitimate prose substitutions elsewhere in the same file.
  - >-
    D4 (this pack's own text, the central fix): #7441's own brief.yml/pack.yml wrote the
    owner's real first name in plain capitalised prose ~40 times, the full "First Last" name 8
    times, and the owner's personal email once — on a PUBLIC repository, which is exactly the
    exposure this whole task exists to prevent. This brief and its sibling pack.yml use the
    placeholder phrases "the owner's first name" / "the owner's full name" / "the owner's
    personal email" throughout, and `<name>`/`<name-lower>`/`<NAME>` for code-identifier
    examples, and never spell out the real string in any field, including receipts and dissent.
  - >-
    D5/D6 (accuracy of the pack's own claims): #7441's pack asserted "three commits" against a
    1-commit branch, falsely claimed `research/wr3/05-symbiosis-integration.md` had been
    reverted to origin/main when it was still in the diff (D3 fixes this for real now), quoted a
    stale residual count (957 vs. a recount of 956 on the same head), undercounted
    `scripts/test_redact_pii.py` at "27 tests" when it is actually 43, and claimed all 87
    prettier-flagged files were prettier-clean on origin/main when 71 of the 87 were already
    non-compliant at merge-base (local prettier 3.9.6 vs. the lockfile's pinned 3.9.9 — a
    pre-existing version-drift issue, unrelated to this sweep). This pack recomputes every
    number fresh against THIS branch's actual head and cites the exact command for each (see
    pack.yml `receipts`), ships as exactly ONE commit, and states the prettier finding honestly:
    16 of the 87 files are genuine regressions caused by this sweep's own substitution
    (shortened a line enough to break a wrap width), the other 71 were already broken before
    this sweep touched anything. Reconciling the prettier version drift, the 166 R1-gate
    (adversarial-review-frontmatter) files, and the 2 PII-gate files is explicitly OUT of this
    PR's scope — a parallel lane, PR #7445 ("finish the owner-codename sweep in the prettier, R1
    and PII-gated files") owned that reconciliation and has since closed; its successor #7457
    ("rework owner-name sweep to keep lowercase literals untouched (#7445 rework)", open) owns
    it now. This PR excludes (reverts to origin/main) the same three file sets #7441 excluded,
    for the same reasons, and does not attempt to fix or re-verify them — it references #7457
    rather than duplicating it.
  - >-
    P1-P5 (this pack's own further self-correction, found by a fresh gate review of #7450 — the
    content diff was verified clean and reusable, only the pack/body were wrong): P1, #7450's
    pack/brief/PR-body all claimed "58 py, 13 json, 12 yaml = 83 applicable" parse-count files,
    copied forward from #7441's larger candidate set rather than recomputed on #7450's own
    270-file list — the real count is 57 py, 13 json, 11 yaml = 81 (plus 1 jsonl, 9 sh not
    previously itemised), 0 errors, all recomputed here. P2, #7450's dissent said "2 commits
    landed between the two bases" checking the wrong pair; recomputed fresh for THIS branch's
    own bases below (11 commits, 0 added lines/files with the owner's first name in their file
    CONTENT — see `assumptions`). P3, #7450's receipts all carried an invented, uniform
    `10:00-10:35+08:00` timestamp block unrelated to when the commands actually ran; this pack's
    receipts use timestamps consistent with this session's actual commit and gate-recheck times.
    P4, #7450's floor language said "by SIZE ... no hot-zone path is touched" — false: the
    content-only churn (1200, stable) is well below the Gear-3 threshold (1828), and the floor
    is actually 3 by the PATH (hot-zone) term, hitting 4 files (see the header comment above)
    whose edits are comment/prompt-string substitutions only, no behavior change (verified by
    the same pair check as every other file, acceptance A2). P5 (non-blocking in #7450, fixed
    here anyway): the PR body spelled the owner's first name once and carried no `## Bites`
    section — this PR's body has neither defect: it names the cloud-dependency guard and the
    pack lint as the consumers whose observation proves D2/D4/D5 are actually in force.
  - >-
    Q1/Q2 (this build's own further self-correction, found by a second fresh gate review, this
    time of #7454): Q1, #7454's pack/brief/PR-body all repeated "1634" as the size term (7
    places), which was #7450's number, carried forward rather than recomputed on #7454's own
    head (measured there: 1758) — contradicting the pack's own claim that every number was
    recomputed fresh. This pack states the CONTENT-ONLY churn (1200) as the one pinned digit,
    since it is stable regardless of how long this pack's own prose grows, and describes the
    FULL-diff size term qualitatively (below the 1828 threshold, floor source `path`) rather
    than quoting a digit that would only be accurate for one specific pack revision — see the
    header comment above and pack.yml `receipts` for the exact CI run to check the live number.
    Q2, #7454's pack said #7450's PR body "carried no `## Bites` section" — false: #7450's body
    DID carry a `## Bites` section (header at line 26, verified directly — see pack.yml
    receipts), naming the same cloud-dependency guard and the
    pack lint. The real #7450 defect (gate-7450's actual P5 finding) was narrower: no literal
    `Bites:` line naming a CONSUMER and an OBSERVATION that proves the change is in force per
    Builder Contract §2 — a section that only names which guard/lint exist is not the same as a
    line proving THIS diff changed their behavior. This build's own PR body corrects both: it
    states the true #7450 finding, and carries a literal `Bites:` line with a concrete,
    reproducible before/after observation (see the PR body itself).
  - >-
    KEEP unchanged, byte-identical (methodology carried over from #7441, unaffected by D1-D6):
    any token containing `@`; handles/hostnames shaped like the owner's first-name-plus-surname
    concatenation (either order, e.g. `<name-lower><surname-lower>`/
    `<surname-lower>word<name-lower>`); filesystem paths/URLs referencing an actual repo file by name; any snake_case/
    kebab-case/camelCase compound token where the character immediately before or after the name
    is `_`, a hyphen immediately BEFORE the name, or another letter immediately after it
    (`needs-<name>`, `needs-<name>-on-pro`, `action_needs_<name>`, `<name>-lab`,
    `SKIP_<NAME>`/`SKIP_<name>`, `next_steps_for_<name>`, `<Name>SecretSender`); the surname
    alone; a literal git-log author-string quote (`<Full Name> <noreply@anthropic.com>` in
    `.claude/skills/modus/PENDING-ARMS.md`, 2 occurrences) protected by a dedicated regex
    lookahead; the same 12-file FUNCTIONAL_SKIP roster #7441 used (NER known-names lists,
    identity-resolver stopwords, the creator-persona email check + its test, a redaction-rule
    DEFINITION, a username-to-email dict, a name-counter fixture test, the PII-leak-detector
    regex + its test) — now 14 files with D1/D2 added.
  - >-
    Path-based exclusions applied at candidate-enumeration time, never opened, never in any
    diff: `**/migrations_v2/**`, `.github/workflows/**`, `*.lock`, `.secrets.baseline`,
    `shared/*.jsonl`, `evidence/**` of other PRs. This pack's own two files
    (`evidence/2026-09/agent-air-m5-docs-owner-name-zero-v8-faa98ea7/{brief,pack}.yml`) are new
    and, per D4, do not themselves discuss the owner's first name in cleartext — tabulated
    separately as `own_evidence_pack_prose` in the residual audit purely for completeness (count
    expected near-zero, unlike #7441's).
  - >-
    No client PII anywhere in the diff or this pack. No secrets echoed. No edit outside the
    dedicated worktree (`agent/air-m5/docs/owner-name-zero-v8`).
acceptance:
  - text: >-
      A1: WHEN every path from `git ls-files` is walked (candidate list carried over unchanged
      from #7441's own final diff, since D1-D6 are corrections to that diff, not a re-derivation
      of it) and a residual audit is run (excluding migrations_v2, .github/workflows, *.lock,
      .secrets.baseline, shared/*.jsonl, evidence/** of other PRs), THE audit SHALL classify
      every remaining line containing the owner's first name (either case) into a named KEEP
      class, zero unclassified.
    probe: >-
      `git grep -In <Name>` + `git grep -In <name>` (case-split on the owner's first name,
      same exclusions) -> 923 + 701 = 1624 lines, all classified (pack.yml `receipts`):
      r1_gate_excluded 470, prettier_regression 463, email 429, code_token 201,
      functional_code 28, git_author_quote 10, redaction_definition 8, evidence_record 6,
      off_limits_file 3, pii_gate_excluded 3, path_url 3 — sum 1624, 0 unclassified.
      Separately, the gate's own narrower word-boundary probe (`git grep -n -w <Name>` /
      `-w <name>`, excluding only migrations_v2 and the whole of .github) gives 919 + 31 = 950
      on this same head.
  - text: >-
      A2 (byte-preservation, the property #7441 already had and this build keeps): WHEN
      `git diff --numstat` is computed against the merge-base with origin/main, THE added-line
      count SHALL equal the deleted-line count for every one of the 270 swept files, with zero
      exceptions, and both SHALL equal the sweep script's own per-file touched-line counter.
    probe: >-
      270 swept files, +603/-603, 0 files with added != deleted; the 2 new evidence-pack files
      are pure additions, correctly outside this check. A standalone cross-check compares the
      sweep script's own `touched_lines` counter per file against numstat — 0 mismatches.
  - text: >-
      A3: WHEN every touched .py/.json/.yaml/.jsonl/.sh file is parsed, THE parse SHALL succeed
      with zero errors (P1 fix: recomputed fresh on this build's own 270-file list, not copied
      forward from #7441's larger candidate set as #7450's pack wrongly did).
    probe: >-
      py_compile (57 files) + json.load (13 files) + yaml.safe_load (11 files) +
      per-line json.loads (1 jsonl file) + `bash -n` (9 sh files) over the 270-file touched
      list, by extension — 91 applicable files, 0 failures.
  - text: >-
      A4: WHEN the test suites covering every FUNCTIONAL_SKIP file are run, THEY SHALL pass at
      the same rate as on origin/main, proving the skip did not silently break anything by
      omission, and D2's fix SHALL leave the cloud-dependency guard functionally unchanged.
    probe: >-
      `scripts/test_redact_pii.py` 43 passed; `scripts/tests/test_whatsapp_corpus_privacy_
      audit.py` 32 passed; `apps/backend-rag/.venv` running
      `test_collective_memory_workflow.py` + `test_prompt_builder_exponential_coverage.py` 209
      passed; `tests/wa_corpus/test_db_names.py` 2 passed — 286 passed, 0 failed, across all
      suites that reference a functional-skip module. `python3 scripts/lint/
      wr3_lint_cloud_dependency.py` exits 0 (D2's guard still fires correctly, unwidened).
  - text: >-
      A5: WHERE this pack's own text needs to refer to the owner's first name, surname, full
      name, or personal email, THE text SHALL use a placeholder phrase or bracketed token,
      never the literal string, in both brief.yml and pack.yml, including inside receipts and
      dissent.
    probe: >-
      `git grep -c -iE '<the real first name>|<the real surname>|<the real personal email
      local-part>'` over this pack's own two files -> 0 (verified by the authoring session by
      reading both files in full immediately before commit; the probe string is intentionally
      not itself written here per the same constraint it verifies).
  - text: >-
      A6 (P2/P4 fix, still holding): WHEN the floor and the interim-commit count are recomputed
      fresh against THIS build's own two merge-bases (not copied forward from a prior head), THE
      pack SHALL state the true floor source and the true count, and SHALL disclose (not
      silently omit) any unrelated finding the recomputation surfaces.
    probe: >-
      `evidence_pack_lint.py --print-floor` -> `3`; `--print-floor-source` -> `path` (hot-zone,
      not size — content-only churn is 1200, well under 1828). `git rev-list --count <#7441's
      own merge-base>..<this build's merge-base>` -> 11 (unchanged from #7450/#7454, since
      origin/main did not move); 0 of those 11 commits' DIFF CONTENT adds a line with the
      owner's first name, but 2 of their commit MESSAGES carry a `Co-authored-by: <Full Name>
      <noreply@anthropic.com>` trailer — a pre-existing exposure on main, out of this PR's scope
      (commit messages are immutable once merged; not something a content sweep can fix),
      disclosed here rather than silently dropped from the recount.
  - text: >-
      A7 (Q1/Q2 fix): WHERE this pack states a churn/size number, THE number SHALL be either a
      value stable across edits to this pack's own prose (content-only churn) or a qualitative
      statement citing the CI run rather than a value known to be pack-length-dependent; AND
      WHERE this pack describes a prior PR's `## Bites` compliance, THE description SHALL match
      what that PR's body actually contained.
    probe: >-
      `_size_term_net_lines()` (imported directly from `scripts/evidence_pack_lint.py`) on the
      270-file content-only numstat -> 1200, identical whether run before or after any edit to
      this pack's own two files (verified by rerunning after the final edit, immediately before
