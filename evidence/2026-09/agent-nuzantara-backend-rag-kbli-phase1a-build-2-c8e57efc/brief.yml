objective: >-
  Phase 1a of the KG licensing-class cure (spec
  docs/specs/2026-09-02-kbli-kg-licensing-class-cure-spec.md r4, §4 the
  derivation rule, §5 the script design, §6 phases). Adds the licence BUILD
  mode (default when neither Lot-0 flag is given) and `--census` to the
  script PR #7017 shipped as Lot 0 only (`--placeholders-only` /
  `--create-missing-node`, live on PROD). Derives licences from the
  canonical v10 `per_skala` rows per PP 28/2025 (§4), writes target
  `perizinan:` nodes + `REQUIRES` edges for S1/S2 codes, leaves S3 alone
  unless the rendered and derived licence-name sets match exactly, refuses
  legacy-served codes outright (Phase 2, not this PR), and keeps Phase 1b
  hard-refused behind the `PHASE_1B_ENABLED = False` module constant. No
  `--apply` was run against PROD this turn — `--census` and the build mode's
  dry-run were exercised read-only against PROD via `scripts/pg.sh`
  (`nuzantara_readonly`); every number below is measured this turn, not
  copied from the spec, and the spec's own prior figures (union 176 / Phase
  1a 115 with 110 built / 158 target nodes) are declared a prior, not the
  answer.
scope:
  - >-
    apps/backend-rag/backend/scripts/kg_kbli_licensing_from_canonical.py —
    EXTENDED (not rewritten): the two Lot-0 pure functions and their I/O
    are untouched; added the §4 derivation (normaliser, `TIER`/
    `LEGAL_BASIS`, `licence_name`, `derive_licence_groups`,
