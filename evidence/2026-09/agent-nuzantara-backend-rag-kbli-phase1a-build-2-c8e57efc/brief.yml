mutation_evidence: >-
  4 mutants, each restored via `cp` backup, never `git checkout`, suite
  green after every restore: M1 changed TIER["Menengah Tinggi"] from "NIB
  dan Sertifikat Standar" to "NIB" -> 2 failed (test_tier_matches_legal_basis,
  test_licence_name tier rule); M2 disabled the legacy-served refusal branch
  -> 1 failed (test_plan_build_refuses_legacy_served); M3 disabled the
  placeholder-edge ordering check in check_eligibility -> 2 failed
  (test_check_eligibility_orders_refusals, test_plan_build_ordering); M4
  dropped the digest comparison from classify_idempotence's CURED branch ->
  1 failed (test_classify_idempotence_drifted). Restored: 46 passed each
  time. A fifth defect was found and fixed live (not a synthetic mutant):
  `run_census`'s status query filtered on `entity_type = 'kbli'`, which
  undercounts — 10 PROD nodes for real 5-digit KBLI codes (e.g. 70201,
  56101) carry `entity_type = 'kbli_code'` instead, and the router's own
  node fetch is entity_type-agnostic (`SELECT * FROM kg_nodes WHERE
  entity_id = $1`); fixed to filter on the `kbli:<5 digits>` id shape only,
  re-verified against PROD (§2.3 one-store then matched the spec's exact
  10-code list).
