    (`classify_state`, `s3_comparison`, `admitted_targets` reusing the
    router's own `classify_requires_target`/`permit_name_verdict`), §5.7
    idempotence (`classify_idempotence`, `digest_of_set`), the
    `check_eligibility`/`plan_build` orchestration, the DB write path
    (`apply_build_plan`, one transaction per code, row-locked), and
    `run_census` (read-only, Table A/B + phase split + histogram + §2.3
    one-store diagnostic).
  - >-
    apps/backend-rag/backend/tests/unit/scripts/test_kg_kbli_licensing_from_canonical.py
    — extended from 11 to 46 cases: the 11 Lot-0 cases kept green (one CLI
    assertion updated for the new build-mode-by-default contract, noted
    inline), 35 new guilt+innocence cases for the derivation rule, state
    classification, idempotence and the CLI fences added this revision.
constraints:
  - >-
    No production write. `--apply` was never invoked against PROD; the
    census and dry-run evidence below is 100% read-only
    (`nuzantara_readonly` role via `scripts/pg.sh`).
  - >-
    Phase 1b stays refused: `PHASE_1B_ENABLED = False` is a module constant,
    `--phase 1b` is refused at the CLI (`SystemExit(2)`) regardless of any
    other flag — only the spec's own §8 F2 PR may flip it.
  - >-
    `--replace-legacy` is always refused (`SystemExit(2)`) — Phase 2 is not
    measured by this spec revision.
  - >-
    S3 is the guarded case: nothing is written unless the rendered and
    derived licence-name sets match EXACTLY (innocence route), and the
    default is "nothing written, logged" (guilt route) — pinned by two
    dedicated tests plus verified live on 25920 this turn (mismatch,
    nothing written).
  - >-
    Every `kg_nodes`/`kg_edges` jsonb write uses `$N::text::jsonb` with a
    pre-serialised `json.dumps()` string (W89 class-guard discipline);
    `backend/tests/db/test_jsonb_double_encoding_class_guard.py` passes
    unmodified against this file.
