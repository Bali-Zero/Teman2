    status: CONFIRMED
    disposition: "Cured in 6de341cd14: both trees are materialised from the object store (git ls-tree -r + cat-file --batch, symlinks skipped) with a completeness check against the listed blobs; test_export_ignores_the_candidates_gitattributes; replayed with the real home: verdict FAIL rc=1, new = [log_injection backend/app/routers/demo.py:13], handlers_modelled 3 (repro_gate2.sh, 2026-09-27T01:34:51Z)."
  - seat: claude-opus-5-5
    objection: "Gate #2 CONDITION: the baseline cache was keyed by subtree sha only (stale when the judge/models change, poisonable by same-user code); the runner planned the judge only when a *.py changed, so a .gitattributes-only PR was NOT_APPLICABLE."
    status: CONFIRMED
    disposition: "Cured in 6de341cd14: cache key = (subtree sha, sha256 of judge + models); any non-test file under apps/backend-rag/backend/ plans the judge (test_any_non_test_file_under_the_scope_plans_the_judge). Same-user poisoning remains the sandbox boundary below."
  - seat: claude-opus-5-5
    objection: "Gate #1 BLOCK: candidate tests run as the operator's OS user with write access to run_dir; a forger process started by a candidate test rewrote state.json and re-hashed a FAIL receipt to PASS after the flock was released (receipts self-hashed, unkeyed); the extracted pysa judge was not sha-verified at run time; the baselines cache is writable by candidate code."
    status: CONFIRMED
    disposition: "Partly cured in 6de341cd14, partly an architectural boundary: (a) every trusted dir carries a sha256 map recorded at plan time and re-verified before it runs (rewritten judge, added shadow module, deleted model → ERROR; 3 parametrised tests); (b) trusted checks now run BEFORE any candidate code and the runner prints a `seal=` (sha256 over plan + trusted state + trusted receipts) at that boundary and at the end, for the operator to keep OUTSIDE run_dir; `status --seal` re-derives it and goes BLOCKED on a mismatch — the exact forgery the gate reproduced is now caught (test_trusted_checks_run_before_candidate_tests_and_the_seal_catches_a_post_run_forgery). Same-user forgery is thereby detectable, not impossible: a separate user/container for candidate code is recorded as an open PENDING-ARMS condition and the README no longer claims more."
  - seat: claude-opus-5-5
    objection: "Gate #1 SHOULD-FIX: alias/add_api_route handlers unmodelled and a drop in handlers_modelled passes silently; the flow key is a set not a multiset and bare method names collide across classes."
    status: CONFIRMED
    disposition: "Handlers cured in b11a4d5106 (also found by agy/Kimi); in 6de341cd14 the key is a multiset (#n suffix per identical statement), stmt_of returns Class.method qualified names, and report.json/report.md carry handlers_modelled base→candidate with a `handlers_dropped` warning (test_identical_sink_statements_are_a_multiset_and_methods_are_qualified)."
  - seat: claude-opus-5-5
    objection: "Gate #3 BLOCK: trusted_pytest ran before the seal although the BASE ban test exec_module()s the candidate's check_ban_predicates.py — an atexit hook rewriting the junit gave a sealed, undetectable policy.paid_anthropic_ban PASS; README overclaimed 'every trusted check runs before any candidate code'; the PENDING-ARMS row it cited did not exist; `--seal` accepted a 1-char prefix; the Pysa home is not sha-pinned."
    status: CONFIRMED
    disposition: "Cured in de1b76cf65: TRUSTED_KINDS = (cmd,) — order cmd → seal → trusted_pytest → pytest, the seal vouches for cmd verdicts only and the README says exactly which verdicts are the candidate's to influence; `--seal` needs >= 12 chars; the PENDING-ARMS row is opened in this PR (C1 separate user/container, C2 sha-pin/rebuild the Pysa home, C3 post-merge prove-live, C4 seal per-run); test_trusted_pytest_runs_after_the_seal_because_it_executes_candidate_code pins the ordering."
gate_verdict:
  verdict: PASS-WITH-CONDITIONS
  seat: claude-opus-5-5
  graded_sha: de1b76cf65 # pragma: allowlist secret — a git sha; gate #4 graded this code head, then confirmed 56760bb2f0 (record-seal cure) + this evidence commit as the final head
  conditions:
    - "C1 (ledger row, architectural): candidate code (`pytest`, `trusted_pytest`) executes as the operator's OS user — forgery of a cmd/record verdict is detectable via the printed seal, forgery of a trusted_pytest/pytest verdict is not; cure = separate user or container; until then the runner is advisory for third-party candidates and its status stays non-required"
    - "C2 (ledger row): the Pysa home (baselines, venv/bin/pyre) is not sha-pinned — rebuild it with `pysa_check.py setup` after any run on an untrusted candidate"
    - "C3 (ledger row, due merge+1 day): repeat the guilt/innocence runner run with --base origin/main after the merge and record both verdicts on the PR"
    - "C4 (ledger row): the seal is per uninterrupted run; a resumed run re-enters after candidate code executed"
    - "C5 (gate #4, CURED in 56760bb2f0 before merge): plan-time record verdicts are now inside the seal"
  reasons:
    - "Gate #3's BLOCK is cured: TRUSTED_KINDS == ('cmd',), cmd checks end before the seal event and trusted_pytest/pytest start after it (journal timestamps, test_trusted_pytest_runs_after_the_seal_because_it_executes_candidate_code); the seal no longer vouches for a verdict that candidate code can produce."
    - "SEAL_MIN_PREFIX = 12 enforced after strip(); a non-hex 12+ value fails startswith and yields BLOCKED (fails safe)."
    - "README states the boundary exactly (which verdicts the seal covers, which are the candidate's, Pysa home not sha-pinned, seal per uninterrupted run) and the PENDING-ARMS row it cites exists with C1–C4."
    - "No regression: trusted_dir_map/trusted_dir_sha256 untouched, post-run forgery of a cmd verdict still caught, --extra-check refusals untouched; full suite 183 passed (139.77s)."
    - "For a NON-required, single-host, operator-driven gate whose README states its boundary, the remaining same-user residual is acceptable as conditions, not as a block."
