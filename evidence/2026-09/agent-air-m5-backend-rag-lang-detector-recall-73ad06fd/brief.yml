task_id: lang-detector-recall-0925
gear: 2
l_level: L1
gate_class: none
objective: |
  backend/services/communication/language_detector.py::detect_language returned 'auto' on a
  third of the last 90 days of real inbound WhatsApp customer text (278 texts: id 98, en 61,
  it 26, auto 93 — 62 of the auto verdicts on 5+-word messages). Every 'auto' verdict forces
  the concierge ack (wa_outbox_worker._maybe_send_ack) and the terminal apology
  (_maybe_send_apology) to fall back to English regardless of the client's actual language,
  which is why the ack cannot be switched on in prod yet.

  Root cause: the it/en/id marker lists were ~10 words each and missed ordinary phrasings
  ("Quanto costa il KITAS?", "Which documents do I need?", "Klien belum lapor pajak bulan
  ini"). Ukrainian/Russian used the SAME max()-over-five-languages race as it/en/id instead of
  deciding by script, even though Cyrillic is never it/en/id. A three-way marker tie picked an
  arbitrary winner by dict order instead of admitting the evidence was tied.

  Fix, scoped to detect_language's own scoring (return vocabulary unchanged —
  it/en/id/uk/ru/auto, every consumer keys on it):
  - Cyrillic decided by SCRIPT first (і/ї/є/ґ Ukrainian-only, ы/э/ъ/ё Russian-only), falling
    back to marker overlap only when neither unique-letter set is present.
  - ~3x larger it/en/id marker lists, tuned against a token-frequency diagnostic run over the
    real texts that still scored 'auto' (word counts and frequency counts only — no body text
    ever left the 0600 scratch file, deleted after use).
  - Elongated-run normalisation ("ciaooo" -> "ciao") before matching.
  - Tie-breaking: the top score must be nonzero AND strictly ahead of the runner-up, or the
    verdict is 'auto'.

  Measured: auto rate 93/278 (33.5%) -> 11/278 (4.0%); precision on confident, ground-truth-
  decidable guesses unchanged at 100% (185/185 before, 260/260 after, 0 mismatches both times)
  — recall went up without trading away precision.
