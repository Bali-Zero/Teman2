risks:
  - "Marker-list expansion trades some recall risk for precision risk in principle; measured
    precision on the real 278-text eval stayed at 100% (0 mismatches against hand-labelled
    ground truth) both before and after, so no regression was observed on the available real
    data. Known excluded cross-language homographs (Italian 'di'/'in'/'cara' vs Indonesian,
    Italian 'hai' vs Indonesian informal 'hai'/'hi') are documented inline in the marker lists."
  - "Ground-truth labels for the 278-text eval were hand-assigned by this session reading the
    real text in-session (never reproduced in any file/commit/PR) — a second reviewer has not
    independently re-labelled the set. 14 of 278 texts were labelled 'ambiguous' by this session
    and excluded from the precision denominator rather than forced into one bucket."
  - "This PR does NOT flip WA_OUTBOX_MANNERS_ENABLED or WA_OUTBOX_TERMINAL_APOLOGY_ENABLED — it
    only changes what language the existing ack/apology paths pick once fired; no new prod
    behavior is armed by this diff alone."
