  research/compliance/deep_audit_2026-04-24/ (plan.jsonl, plan.pre-batch03.jsonl, skipped.jsonl)
  carry client full names, phone-shaped and email-shaped strings in cleartext. Handled like the
  two earlier PII lanes (#7398 CRM exports, #7411 WA dossiers): quarantine the exact git blobs
  off-repo on Pro (~/.agent/pii-quarantine/, 0700/0600, hash-verified), remove the three files
