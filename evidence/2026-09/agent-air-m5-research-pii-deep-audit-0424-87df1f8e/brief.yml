      git ls-tree -r --name-only origin/main research/compliance/deep_audit_2026-04-24 | wc -l
  A2: >-
    A file matching the producer's output pattern is ignored in that directory.
    probe: >-
      git check-ignore -q research/compliance/deep_audit_2026-04-24/plan.jsonl
  A3: >-
    The canonical detector (clients.full_name + companies.company_name loaded read-only from
    PROD, same alternation logic as scripts/_redact_pii.py pass4_dynamic) reports 0 hits on
    whatever remains tracked in the directory (the directory is expected to be empty).
