      git ls-tree -r --name-only origin/main research/compliance/deep_audit_2026-04-24

out_of_scope: >-
  scripts/crm_guardian_apply.py hardcodes PLAN_FILE at this exact repo path — it is a live,
  resumable consumer (I1/I3 CRM-Drive consolidation, kill-switch gated), not a dead artifact
