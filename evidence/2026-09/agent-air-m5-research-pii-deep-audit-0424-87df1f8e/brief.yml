  quarantine, or by re-running scripts/crm_guardian_deep_audit.py) for a future local
  --apply run is an operator decision, out of scope here. Git history still holds the bytes;
  a rewrite is a separate operator decision (§Solo-operatore), same posture as #7398/#7411.

assumptions: >-
