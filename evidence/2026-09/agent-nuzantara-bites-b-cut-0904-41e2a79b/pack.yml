differential: >-
  Method: dump (label, pack text, classify()) for all 121 original corpus entries
  BEFORE any edit (saved to a scratchpad jsonl), then re-run classify() over the
  SAME pack text through the FINAL module and diff by label — see receipts for
  the exact command. 24 flips, ALL executable -> malformed, zero unattributable:
  17 are head-first uses of a removed binary or the narrowed fly table
  (ok-pytest, ok-curl-https, ok-sha-placeholder, ok-git-grep-plain,
  ok-fly-version, ok-short-option-bundle, ok-git-count-flag, ok-pytest-quiet,
  ok-pytest-glued-option-value, ok-diff-filter, ok-pathspec-separator,
  ok-diff-context, ok-curl-max-time-separate-value, ok-curl-write-out-separate-value,
  ok-gh-json-is-the-shape-that-survives, ok-gh-api-rest-path-is-the-shape-that-survives,
  ok-git-format-glued-is-the-shape-that-survives); the other 7 are fixtures whose
  PRIMARY purpose was proving an unrelated guard (expect-form, invisible-char,
  remote-shell over-match, quoting) but that happened to use `git status`/`curl
  ...` as the INCIDENTAL observe-head for that proof (ok-bites-is-not-the-first-key,
  ok-expect-regex-with-one-quantifier,
  ok-remote-shell-over-match-searching-for-the-WORD-ssh-is-innocent,
  ok-the-same-double-quoted-value-without-the-escape, ok-unquoted-expect-with-a-colon,
  ok-unquoted-plain-scalar, ok-url-query-string-carrying-at) — re-classifying their
  ORIGINAL text (not my corpus's substituted text, see below) against the removed-
  binary rule flips them too, same root cause as the other 17, just a different
  fixture role. An early draft of this pack under-counted this at 17 by only
  listing the head-first cases; the differential's actual job is catching exactly
  this kind of miss, so the count is corrected here rather than left wrong.
  Separately verified: running the ORIGINAL 121 through the module BEFORE the
  kimi three-hole fix and AFTER it (same corpus, same allow-list, only
  `_subcommand_permitted`/`_check_fly`/`_guard_observable_script` changed)
  produces IDENTICAL verdicts for all 121 — the kimi pass closes holes only the
  brand-new fixtures below exercise, it does not touch any original entry's
  classification (receipts). Zero labels deleted (mechanics note in RULED
  2026-09-04 b honoured). 15 new labels added total: 10 for the explicit shapes
  the ruling named (python3 parent-escape/absolute-path/missing-script/semicolon,
  fly machine-run-bare/deploy-bare, the `fly` alias forms of status/image-show),
  plus 5 from the kimi refutation pass (brace-expansion guilt + its
  sha-placeholder innocence pair, fly-image-show-extra-positional,
  fly-extra-positional-after-a-flag-value, marker-string-in-a-non-py-file).

  A SEPARATE class of edit does not show up in this diff at all, by design: several
  fixtures that used `git status`/`curl ...` as an INCIDENTAL placeholder while
  testing an unrelated guard (expect-form, where-scope, invisible-char, path
  containment, shell composition, args-from-file) had their OBSERVE TEXT swapped
  to an allowed head with the SAME classification before and after — not a flip,
  a substitution, done because the removed binary would otherwise have masked
  which guard the corpus proves. See mutation_matrix below for why this mattered.

mutation_matrix: >-
  Method: for each of the 9 registered `_guard_*` functions, patch it (and its
  entry inside `_COMMAND_GUARDS` where applicable — the tuple holds function
  references captured at import time, so patching the module attribute alone does
  not reach calls made through it) to a no-op, then ask whether ANY corpus fixture's
  ACTUAL classification then disagrees with its DECLARED one (a "sole-cause"
  fixture). Run against the ORIGINAL module+corpus first to get the true baseline
  (not assumed): shell_composition, no_remote_shell, path_containment and
  args_from_file each had ALL or MOST of their sole-cause fixtures built on a
  git/curl/gh head, which the cut would have silently over-covered (the command
  allow-list rejecting the whole command masks the narrower guard). Re-isolated
  each on an allowed head (python3 script or fly) before finalizing the corpus.
  Result, run against the FINAL module+corpus (after the kimi refutation pass'
  three additional fixtures, not just the binary-removal cut):
    _guard_shell_composition: 5, _guard_command_allowlist: 54,
    _guard_no_remote_shell: 2, _guard_path_containment: 4,
    _guard_observable_script: 4, _guard_args_from_file: 1,
    _guard_no_invisible: 1, _guard_expect_form: 4, _guard_where_scope: 1.
  All nine still provably necessary against the corpus alone, none masked by the
  cut. command_allowlist gained two sole-cause fixtures (52->54, the two new fly
  positional-escape guilts) and observable_script gained one (3->4, the non-`.py`
  marker guilt) from the kimi pass, closing exactly the holes it found. The
  qwen-round bracket-glob guilt fixture (`python3 scripts/ci/[evil].py`) does
  NOT add a tenth sole-cause count to shell_composition (stays at 5): the path
  also does not exist in the checkout, so `_guard_observable_script` rejects it
  independently and masks the mutation-matrix witness — the SAME
  double-coverage class the original corpus re-isolation fixed for git/curl
  heads, just not re-isolatable here since no real bracket-named file exists
  in this tree to point at instead. The authoritative proof for this guard
  addition is the DIRECT unit test against `_guard_shell_composition` in
  isolation (registry.json's own convention), not the corpus mutation count;
  `test_shell_composition_guilt_bracket_glob_defeats_the_marker_check` passes.

