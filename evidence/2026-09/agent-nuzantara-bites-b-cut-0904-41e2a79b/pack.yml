cloud_ok: >-
  SYMBIOSIS Law 2 output boundary. No client data anywhere near this lane — the
  subject is a YAML parser's own allow-list and a CI battery. The kimi-code
  dispatch below carried the module's rules and its own reasoning, no repository
  secrets, no client identifier.

pii_scan: clean
pii_scan_note: No path in this diff is PII-bearing; no prompt carried client data.

dissent:
  - seat: kimi-code/k3
    objection: >-
      Dispatched via `kimi -p "<brief>" -m kimi-code/k3` (non-interactive prompt
      mode has no filesystem tools — it reasoned from the guard descriptions given
      in the brief, not from reading the file directly, and said so explicitly
      mid-reasoning). It surveyed the fly flag table, the path-containment escapes,
      the args-from-file `@` rule and the remote-shell scheme check exhaustively and
      found nothing unconditional there. It then reasoned about the module's OWN
      stated threat model (`_escapes_checkout`'s docstring: "every metacharacter
      this module refuses is only meaningful if the executor uses one — so the safe
      assumption is that it does") and noticed `_SHELL_METACHARS` omits `{`/`}`
      (and glob chars `*`/`?`/`[`): under a shell executor, `python3 scripts/ci/
      {evil,evil}.py` brace-expands to two arguments, `evil.py` and `evil.py` —
      python3 runs the FIRST one, a file that never carried the `bites-observable`
      marker and was never checked at all, while the guard only ever inspected the
      literal (unexpanded) path `scripts/ci/{evil,evil}.py`.
    status: CONFIRMED
    resolution: >-
      Reproduced against the REAL guard functions before applying anything (not
      taken on the seat's word): built a temp checkout with a decoy file literally
      named `{evil,evil}.py` carrying the marker, ran all six `_COMMAND_GUARDS`
      against `python3 scripts/ci/{evil,evil}.py`, got zero errors — confirmed
      executable under the pre-fix rules. Added `{`/`}` to `shell_metachars`;
      re-ran the full 131-fixture corpus first under simulation (zero regressions)
      before editing the file for real. Declined `*`/`?`/`[` (glob): weaker
      primitive (needs a pre-existing matching file, unlike guaranteed brace
      substitution) and `?` collides with a legitimate URL query string this module
      already accepts (`ok-url-query-string-carrying-at`) — adding it would be
      superscar #3's over-match on the module's own innocence fixture. Added one
      guilt fixture (the reproduced PoC) and one innocence fixture (braces survive
      inside the sanctioned `{sha}` placeholder, which is excised before the scan)
      to the corpus, plus matching pytest tests and registry entries.
  - seat: kimi-code/k3
    objection: >-
      Same refutation pass, a second finding: `_subcommand_permitted` matched a
      leading-word run against a table of full pairs by comparing only
      `words[0]`/`words[1]` and ignoring anything past index 1. `fly image show
      <ref>` therefore matched the `(image, show)` pair with `<ref>` never looked
      at, and flyctl's `image show` does not reject the extra argv itself — it
      proceeds to the API call.
    status: CONFIRMED
    resolution: >-
      Reproduced against the real `_check_fly` before applying anything: called
      it with `["image", "show", "-a", "nuzantara-rag", "extra-ref"]` against the
      pre-fix code and got `[]` (accepted). Fixed by requiring `len(words)` to
      equal exactly what the matched shape admits (one word for NO_SUBCOMMAND,
      two for a fixed pair), re-verified the same call now returns a rejection
      and that the four surviving fly pairs' own innocence fixtures are
      unaffected. Added one guilt fixture and matching test + registry entry.
  - seat: kimi-code/k3
    objection: >-
      Same pass, a third finding: a flag's own VALUE ends the leading-word run
      `_leading_words` builds, so a positional argument planted AFTER a flag's
      value (`fly status -a nuzantara-rag anyword`) was inspected by neither the
      subcommand-table check (already past it, matched on `status` alone) nor
      the flag-violation check (which only looks at tokens starting with `-`).
    status: CONFIRMED
    resolution: >-
      Reproduced: `_check_fly("fly", ["status", "-a", "nuzantara-rag",
      "anyword"])` against the pre-fix code returned `[]`. Fixed by walking the
      argv past the matched subcommand words, skipping exactly one token after
      each flag (its value, whether glued with `=` or separate) and rejecting
      anything else as an unreviewed positional. Re-verified the fix rejects the
      PoC and that ordinary `-a`/`--app` invocations (glued and separate-value
      forms) still pass. Added one guilt fixture and matching test + registry
      entry.
  - seat: kimi-code/k3
    objection: >-
      Same pass, a fourth finding: the `bites-observable` marker check was a
      byte-substring grep over ANY file `python3` was pointed at, extension
      included. `scripts/ci/bites_allowlist.yaml` itself carries the literal
      marker string in its own `observable_marker: bites-observable` key, so
      `python3 scripts/ci/bites_allowlist.yaml` parsed as executable purely
      because a YAML data file happened to mention the marker.
    status: CONFIRMED
    resolution: >-
      Reproduced: `_guard_observable_script("python3 scripts/ci/
      bites_allowlist.yaml")` against the pre-fix code returned `[]`. Fixed by
      requiring the target path's suffix to be `.py` before the marker grep
      even runs — the guard's own invariant is "a SCRIPT declares itself
      observable", and a data/doc file is not a script regardless of what its
      bytes contain. Re-verified the fix rejects the PoC and that the surviving
      `python3 scripts/ci/bites_parse.py --selftest` shape still passes. Added
      one guilt fixture and matching test + registry entry.
  - seat: tp1-qwen3.8-max
    objection: >-
      Second council seat, dispatched 2026-09-05 via `scripts/tp1_call.py
      --model qwen3.8-max --effort high` on the SAME cut module and asked the
      same question kimi-code/k3 answered: find an `observe:` line the
      two-shape allow-list marks executable that does something other than
      observe. Named the counterexample that sinks the ONE piece of reasoning
      this cut's own dissent record had not yet tested: `*`/`?`/`[` (glob)
      were declined on 2026-09-04 b because "they only expand against a file
      that already exists, a weaker primitive" - but a PR is exactly the
      place an attacker controls BOTH files at once. `python3
      scripts/ci/[evil].py` passes every guard once a literal file named
      `scripts/ci/[evil].py` carries the marker, but a shell's pathname
      expansion treats `[a]`-shaped brackets as a glob matching a single
      character; if a same-PR file `scripts/ci/evil.py` also exists (no
      brackets), the shell rewrites the argv to it before python3 ever sees
      the marker-carrying decoy. The seat also checked the fly flag/subcommand
      table and other shell-expansion classes (tilde, field splitting) and
      found nothing further there, stating so explicitly.
    status: CONFIRMED
    resolution: >-
      Reproduced against the real `_guard_shell_composition` before applying
      anything: `python3 scripts/[a].py` and `python3 scripts/ci/[evil].py`
      both returned `[]` (accepted) pre-fix. Fixed by adding `[`/`]` to
      `shell_metachars`, reversing the 2026-09-04 b decline now that the
      "needs a pre-existing file" objection is shown false for a same-PR
      attacker. `*`/`?` stay declined: `*`'s failure mode (passing the
      literal string through unexpanded when nothing matches) is not this
      class of bug, and `?` still collides with the URL query string
      innocence fixture. Added one guilt fixture, one innocence fixture, a
      matching pytest test and a registry entry; re-ran the full corpus
      (zero regressions) before editing the file for real.
