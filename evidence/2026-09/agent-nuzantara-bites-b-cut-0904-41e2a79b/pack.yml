    the required `antidotes` job in .github/workflows/immune-enforcement.yml, which
    runs scripts/tests/test_bites_parse.py, plus infra/guard-conformance, which
    censuses this module's guards by AST and fails on any without both proofs
  where: ci
  observe: python3 scripts/ci/bites_parse.py --selftest
  expect: regex:[0-9]{3}/[0-9]{3} pass

bites_note: >-
  Same shape as PR #5673's own Bites — three digits so the count can grow with the
  corpus without turning this observation into a ratchet, and still goes red if the
  corpus drops back under a hundred.

diff: >-
  Two comparisons matter here and they answer different questions.

  AGAINST #5673's branch tip (9b4be2bf24, this PR's own contribution — what
  changed on top of the PR it supersedes): `git diff --numstat 9b4be2bf24 --
  scripts/ci scripts/tests infra` -> this PR's own edits to the five bites
  surfaces (bites_parse.py/bites_allowlist.yaml/bites_corpus.yaml/
  test_bites_parse.py/registry.json), zero workflow files of its own.

  GEAR, corrected: the FLOOR that matters is computed against main (merge-base
  anchored, same as harness-floor.yml) — not against #5673's tip. This branch's
  diff against main carries #5673's own `.github/workflows/immune-
  enforcement.yml` change (test wiring for the `antidotes` job, kept: a test
  nothing runs is scar #5625), a hot-zone path regardless of size, which floors
  Gear at 3. An earlier draft of this brief measured against the wrong base and
  declared Gear 1 in error; corrected here rather than left wrong. A SEPARATE
  finding — guard-conformance.yml/immune-enforcement.yml never watching
  bites_allowlist.yaml/bites_corpus.yaml at all — remains deferred to its own
  follow-up PR regardless of gear (one PR, one concern; see receipts), and is
  still real and live on main today.

  AGAINST origin/main (what merging THIS PR actually lands, since #5673 has not
  merged): 3,131 lines outside evidence/ across 8 files, because it necessarily
  carries #5673's own diff too. This is a disclosure, not a target: the PR being
  answered is "cut the module Zero already reviewed", not "restate its whole diff
  smaller".

