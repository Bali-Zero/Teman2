dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      "SAFETY claim attacked: a source-manifest bump landing with a stale, un-recompiled lock is
      claimed to always be caught loudly by test_lock_honors_requirements.py. The gate only
      checks pin ∈ specifier and structurally skips (a) any VCS/URL-pinned requirement (Requirement()
      parsing of a git+... line has no PEP 440 specifier) and (b) any manifest line with no
      version specifier at all, or whose package is entirely absent from the lock. A package
      pinned via `pkg @ git+...@sha1` that Dependabot bumps to `sha2` would sail through green
      with the excluded lock still at `sha1`."
    status: CONFIRMED
    evidence:
      "MATERIAL but narrow today: verified against the real manifests — 109 requirements in
      requirements.txt / 79 in requirements-prod.txt (per the seat's own count), zero without a
      version specifier, zero missing from either lock, zero VCS/URL pins. The blind spot is
      real but requires a requirement SHAPE (VCS/URL pin, or no specifier) that does not exist
      in either manifest today; an ordinary PEP 440-incompatible bump still goes red exactly as
      claimed, and Backend Tests (Python) shard 3 + the required-check fan-in were independently
      confirmed."
    resolution:
      "1. **SAFETY — MATERIAL.** La promessa è troppo assoluta. Il gate controlla solo `pin ∈
      specifier`; salta URL/VCS/no-specifier e pin assenti (test:37, missing-pin skip:78).
      Scenario: `pkg @ git+…@sha1` viene aggiornato da Dependabot a `sha2`; il lock escluso
      resta a `sha1`, CI installa `sha1`, gate verde. Sarei in errore se Dependabot non può
      aggiornare tali riferimenti oppure un altro gate vieta ogni direct requirement senza
      specifier. Stato attuale confermato: 109/79 requirement nei due manifest, zero senza
      specifier, zero pin mancanti, zero marker falsi; i normali bump PEP 440 incompatibili col
      pin vanno rossi. Shard 3 e fan-in required sono confermati. Il blind spot 'pin assente'
      richiederebbe drift preesistente: questa diff non lo crea."
  - seat: codex-gpt-5.6-sol
    objection:
      "SCOPE claim attacked: `*.lock.txt`, relative to /apps/backend-rag, is claimed to match
      exactly right. Confirmed for the two locks that exist TODAY. But the same glob would also
      hide a FUTURE hand-written file literally named *.lock.txt (e.g. a genuine, non-uv-compiled
      input file someone names constraints.lock.txt) — the exclusion is a name pattern, not a
      provenance check. The guard test also only scans the block's root directory and asserts
      nothing about a nested lock or a real uv-pip-compile header."
    status: CONFIRMED
    evidence:
      "Confirmed correct today (0 of the 6 source manifests match the glob; both real locks do),
      flagged as a genuine but MINOR forward-looking risk — no such decoy file exists in this
      repo right now, and GitHub's own exclude-paths semantics (relative-path glob matching) are
      exactly as assumed."
    resolution:
      "2. **SCOPE — CONFIRMED oggi; MINOR futuro.** Relativo a `/apps/backend-rag`, `*.lock.txt`
      copre esattamente i due lock attuali e nessuno dei sei manifest sorgente. GitHub conferma
      relatività e semantica di `exclude-paths`. Scenario di overmatch: un futuro
      `constraints.lock.txt` hand-written, quindi input, verrebbe comunque nascosto. Inoltre il
      test enumera soltanto il livello radice e assume 'suffisso = compilato'
      (scripts/tests/test_dependabot_excludes_compiled_locks.py:44); non prova lock annidati né
      header `uv`. Sarei in errore se il repository imponesse davvero, con un gate separato, che
      ogni `*.lock.txt` sia output uv root-level."
  - seat: codex-gpt-5.6-sol
    objection:
      "PREMISE claim attacked, and the seat's own verdict names this the blocking point: the
      mandate assumes `exclude-paths` only stops Dependabot from WRITING to the two locks, so a
      source-manifest bump still goes through Dependabot's resolver exactly as before and merely
      surfaces its staleness via test_lock_honors_requirements.py at CI time. The seat argues
      this is unproven and likely false: exclude-paths removes the files from Dependabot's SCAN
      entirely (cites dependabot-core's file fetcher/matcher/parser), and because these locks do
      not follow the conventional pip-compile `.in -> .txt` naming pattern the matcher would not
      treat them as compiled output linked to a manifest regardless. Concrete scenario: a source
      spec like `qdrant-client>=1.19,<1.20` with the lock pinned tighter at `==1.19.0` — WITH the
      lock visible, Dependabot knows the currently-resolved version; WITHOUT it, the source range
      already admits a new `1.19.1` release, so Dependabot may propose a DIFFERENT bump target or
      open no PR at all — not necessarily land as 'a red PR that needs recompiling', which is
      what the mandate's rationale claims happens instead."
    status: CONFIRMED
    evidence:
      "NOT independently re-verified against live Dependabot-core behavior in this task (no
      network egress to github.com from this sandbox — codex's own attempt to fetch
      dependabot-core source for a live citation failed with `curl: (6) Could not resolve host`,
      so its file:line references to shared_file_fetcher.rb / pip_compile_file_matcher.rb /
      file_parser.rb are from the seat's training knowledge, not a fresh read in this run).
      Recorded as CONFIRMED because the seat's own verdict says so and the scenario is
      structurally plausible; it is an OPEN, UNRESOLVED finding this pack does not adjudicate
      further — the seat itself states it would be wrong only if a Dependabot-core dry run
      proved identical source-bump targets with/without the exclusion, eliminating only the
      lock-only PRs, which this task did not have the tooling to run."
    resolution:
      "3. **PREMISE — BLOCKING.** `exclude-paths` nasconde i file dalla scansione: non è una
      policy 'leggibile ma non modificabile'. Dependabot raccoglie i `.txt` e poi applica le
      esclusioni (fetcher); inoltre questi lock non hanno la convenzione pip-compile `.in → .txt`,
      quindi il matcher non li riconosce come lock canonici (matcher) e il parser li tratta come
      requirement input (parser). Scenario: sorgente `qdrant-client>=1.19,<1.20`, lock `==1.19.0`,
      nuova `1.19.1`. Con il lock Dependabot conosce la risoluzione corrente; senza, il range
      ammette già `1.19.1`, quindi può non aprire alcun source PR oppure classificarlo/proporlo
      diversamente — non necessariamente 'PR rosso da ricompilare'. Sarei in errore solo se un
      dry-run Dependabot-core dimostrasse target sorgente identici con/senza esclusione,
      eliminando esclusivamente i PR lock-only. **Verdetto: bloccare sul punto 3.** Il
      comportamento centrale dichiarato non è provato e l'implementazione indica che cambia
      l'input del resolver."
  - seat: tp1-qwen3.8-max
    objection:
      "SAFETY claim attacked independently (fresh context, no shared prompt history with
      codex-gpt-5.6-sol beyond the identical adversarial prompt both received). Splits the claim
      in two: the NARROW claim ('a versioned package present in both manifest and lock is
      caught') is likely true; the BROAD claim ('a source-manifest bump landing with a stale
      lock is caught loudly', unqualified) is not. Names three concrete green-stale-lock shapes:
      a VCS/URL dependency bumped by ref with no PEP 440 specifier, a package present in the
      manifest but absent from the lock (marker/extra/optional), and a brand-new direct
      dependency added by a human PR before the lock is regenerated. All three exploit the same
      two skips codex named (no-specifier lines, absent-from-lock packages) — reached
      independently, not copied."
    status: CONFIRMED
    evidence:
      "Independently reaches the same structural conclusion as codex-gpt-5.6-sol's SAFETY
      finding (dissent[0] above) via different concrete scenarios (VCS-ref bump; new-dependency
      PR) rather than codex's git-URL-only framing. Neither seat had access to the other's
      output — corroboration, not duplication."
    resolution:
      "1. SAFETY — Material (not blocking on the face of the diff). Newly reachable blind spot?
      No. exclude-paths does not create the test's skips: no-version-spec lines and
      absent-from-lock packages were already unchecked. But the absolute 'caught loudly' claim
      is not safe. Concrete green-stale-lock shapes: direct ref/git/URL dependency with no PEP
      440 specifier (Dependabot or a human bumps ref v1.0->v1.1, lock still compiles v1.0, test
      skips, green PR, old code shipped); package absent from lock (source has bar==1.0 with
      marker/extra/optional context, lock omits bar, bump to bar==2.0, test skips absent
      package, green PR, target environment may fail or remain stale); new direct dependency
      added with pin but lock not regenerated (human PR adds baz==1.0, lock lacks baz, test
      skips absent package, green despite lock not honoring the manifest set). What would make
      me wrong: every source-manifest line updated by Dependabot has a PEP 440 specifier and
      exists in the relevant lock; the test actually fails on absent direct dependencies or
      compares direct URLs/refs, contrary to the stated skips; Dependabot cannot bump no-version
      direct refs, and no human/automation path can introduce the absent-package shape. Verdict:
      narrow claim 'versioned existing package present in lock is caught' likely CONFIRMED.
      Broad claim 'source manifest bump with stale lock is caught loudly' NOT CONFIRMED."
  - seat: tp1-qwen3.8-max
    objection:
      "SCOPE claim attacked independently: confirms *.lock.txt relative to /apps/backend-rag
      matches exactly the two real locks and none of the source manifests today, then names two
      additional too-little scenarios beyond codex's (a compiled lock placed in a subdirectory
      that the glob's implicit basename matching may miss; a future compiled lock named
      uv.lock/requirements.lock/constraints.lock without the .txt suffix) plus a too-much
      scenario (a hand-written source manifest that happens to be named *.lock.txt would be
      silently ignored by Dependabot)."
    status: CONFIRMED
    evidence:
      "Confirmed correct for the current on-disk tree; the too-little/too-much scenarios are all
      forward-looking (no such file exists today) and MINOR, consistent with codex's own SCOPE
      finding but naming two extra concrete shapes (subdirectory nesting, non-.txt lock names)."
    resolution:
      "2. SCOPE — Minor, CONFIRMED for current files. *.lock.txt relative to /apps/backend-rag
      matches the two known top-level locks (requirements.lock.txt, requirements-prod.lock.txt).
      It does not match source manifests like requirements.txt, requirements-test.txt,
      requirements-local-audio.txt. Failure scenarios: too little — a future compiled lock is
      placed in a subdirectory, e.g. apps/backend-rag/locks/prod.lock.txt, and *.lock.txt may
      not match nested paths; too little — future compiled lock named uv.lock,
      requirements.lock, or constraints.lock without .txt, not excluded; too much — someone
      names a hand-written source manifest something.lock.txt, Dependabot will silently ignore
      it; test gap — the added test uses local fnmatch and top-level glob('*.lock.txt'), it does
      not prove Dependabot's actual wildcard/path semantics. What would make me wrong:
      Dependabot's exclude-paths semantics are exactly fnmatch-style basename matching relative
      to directory; no current or future locks live outside /apps/backend-rag top level or use
      non-*.lock.txt names; no hand-written source manifest will ever be named *.lock.txt.
      Verdict: current scope CONFIRMED; future-proofing concern is minor unless the repo already
      has nested/alternate lock names."
  - seat: tp1-qwen3.8-max
    objection:
      "PREMISE claim attacked independently, and — without having seen codex-gpt-5.6-sol's
      output — reaches the same 'not proven' verdict via a different, more specific mechanism:
      whether any source manifest under /apps/backend-rag references a lock file via pip's own
      -c/-r include directives, in which case excluding the lock from Dependabot's scan could
      make Dependabot fail to resolve, or resolve against unconstrained versions, changing what
      it proposes for a source bump."
    status: CONFIRMED
    evidence:
      "NOT independently re-verified against the real requirements*.txt files in this task (this
      pack does not grep them for -c/-r directives referencing the two lock files) — recorded as
      CONFIRMED because the seat's own verdict says so, and because it independently converges
      with codex-gpt-5.6-sol's PREMISE finding via a DIFFERENT concrete mechanism (include
      directives vs. dependabot-core's fetcher/matcher source code), which is stronger
      corroboration than either finding alone. Still an OPEN, UNRESOLVED finding this pack does
      not adjudicate further."
    resolution:
      "3. PREMISE — Material. Yes, Dependabot may still need to read the locks if they are part
      of resolution. 'Output, not input' is not necessarily true for update resolution if source
      manifests reference or constrain against them. Concrete failure scenarios: a source
      manifest contains -c requirements.lock.txt or -r requirements.lock.txt; if exclude-paths
      hides that file, Dependabot may fail to resolve and stop opening source bumps, or ignore
      constraints and propose versions incompatible with the real lock. Source bump without lock
      constraints: Dependabot proposes transformers==5.16.1, hidden lock still pins
      tokenizers==0.22.2, the proposal may be different than if lock constraints were read; CI
      may catch it, but the PR class changes from 'possibly constrained' to 'born red' or
      silently mismatched. What would make me wrong: no source manifest under /apps/backend-rag
      references *.lock.txt via -r, -c, or include mechanics; Dependabot's pip updater does not
      use sibling .txt files for resolution unless explicitly referenced; exclude-paths
      suppresses only editing/manifest candidacy, not read-only fetching of referenced files.
      Verdict: premise 'locks are purely output and safe to hide from Dependabot' NOT CONFIRMED
      without proving they are never read during source-manifest resolution."
