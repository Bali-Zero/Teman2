items:
  - id: C4c-1
    raised_by: tp1-qwen3.8-max (council seat on C4b), INFO
    what: >-
      The guard's header explains at length that it does NOT scan `.next/server/app`, and why that
      is deliberate. What it never says is what would make that choice WRONG. Measured on main:
      the words `generateStaticParams` and "static export" appear zero times in the file.
    why_it_matters: >-
      The whole justification rests on an unstated assumption — that the workspace routes stay
      DYNAMIC. C4b measured that assumption holding: `clients/[id]` emits no prerender artifact, so
      the flight payload is built per request and never lands on disk. Add `generateStaticParams`
      or a static export to one of those routes and the payload becomes a build artifact under
      `.next/server/app`, which this guard does not look at — and nothing in the file tells the
      person making that change that they have just moved data outside the guard's eyes. An
      assumption that is load-bearing and unwritten is the shape that decays silently.
    cure: >-
      One paragraph in the header naming the trigger explicitly: if any `(workspace)` route gains
      `generateStaticParams`, `export const dynamic = "force-static"`, or a static export mode,
      then the scan MUST be extended to `.next/server/app` — and stating that the current
      justification is measured, not assumed, by naming the measurement (0 prerender artifacts for
      `clients/[id]`).
    acceptance:
      - text: WHEN a reader opens the guard, THEN the condition that invalidates its scope is written in it.
        probe: "grep for the trigger terms in the guard; they must appear"
  - id: C4c-2
    raised_by: tp1-qwen3.8-max (council seat on C4b), LOW
    what: >-
      `taxConsultants()` returns `TAX_CONSULTANTS.map((c) => ({ ...c }))` — a SHALLOW copy.
      `TaxConsultantOption` is `{ value: string; label: string }`, so today every field is a
      primitive and the copy is a true copy.
    why_it_matters: >-
      Inert today and not a live defect — the seat said so itself, and RSC serialisation deep-copies
      everything that crosses to the client anyway. It matters because the function's PURPOSE is to
      hand out something the caller cannot use to mutate the module constant, and the spread only
      achieves that while the shape stays flat. Add one array or object field — a permissions list,
      a locale map — and the copy starts sharing that reference with the module constant, on the
      server, silently, with no test failing.
    cure: >-
      Either `structuredClone` in `taxConsultants()`, or a test in `roster-directory.test.ts` that
      asserts every value in every option is a primitive so a nested field cannot be added without
      a red test. PREFER THE TEST, and say why in the brief rather than leaving it to taste: the
      test states the invariant the type is relied upon to have, and it fails at the moment someone
      changes the shape — which is the moment the decision is actually being made. `structuredClone`
      would silently absorb the change instead, making the copy correct while leaving the reader
      with no idea the constraint ever existed. Doing both is acceptable; doing only the clone is not.
    acceptance:
      - text: WHEN an option gains a non-primitive field, THEN a test SHALL fail.
        probe: "mutant: add a nested array field to one TAX_CONSULTANTS entry and to the interface; the new test must go red, and must be green with the shape as it stands"
  - id: C4c-3
    raised_by: the imperator, reading C4b's merged diff
    what: >-
      `client-roster-boundary.test.ts:285` still asserts `expect(guard).toContain("C4b")`, under the
      comment "and the entry has to carry its closing PR, or it is not time-boxed". Its enclosing
      test is named "the guard's chunk exception is exactly the one declared, time-boxed entry".
      Both date from when the allowlist had one entry. C4b emptied the allowlist — verified on main,
      `ALLOWED_CHUNK_PREFIXES = []` and `EXPECTED_CHUNK_EXCEPTIONS: readonly string[] = []`.
    why_it_matters: >-
      With no entry, "the entry must name its closing PR" is vacuous, and the assertion no longer
      checks behaviour: it checks that the string "C4b" appears somewhere in the guard's PROSE. It
      passes today only because C4b's rewritten comment narrates the history that closed the
      exception. So it is now a rule that the guard must mention a merged PR forever, and it would
      go red the day someone tidies that paragraph — a test failing for a reason that has nothing to
      do with what it exists to protect. The test NAME is wrong in the same way: it promises to
      check "exactly the one declared entry" when the correct state is none.
    cure: >-
      Make the closing-PR requirement CONDITIONAL on the list being non-empty, which restores the
      guilt/innocence pair the rule was written for: an allowlist entry with no closing-PR reference
      must fail, and an EMPTY allowlist must require no PR name at all. Rename the test to describe
      what it now enforces. Do NOT simply delete the assertion — the requirement is still right for
      the case it was written for, and deleting it would let the next time-boxed exception arrive
      with no closing PR named.
    acceptance:
      - text: WHEN the allowlist is empty, THEN no PR name SHALL be required anywhere in the guard.
        probe: "with the lists empty, strip every occurrence of 'C4b' from the guard's comments — the suite must stay green"
      - text: WHEN an allowlist entry exists without a closing-PR reference, THEN the test SHALL fail.
        probe: "mutant: add one prefix to ALLOWED_CHUNK_PREFIXES and to EXPECTED_CHUNK_EXCEPTIONS, with no PR name in the comment — must go red"

