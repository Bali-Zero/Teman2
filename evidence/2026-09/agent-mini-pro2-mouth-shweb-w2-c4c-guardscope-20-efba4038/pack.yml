dissent:
  - seat: gemini-3.1-pro
    objection: >-
      BLOCKER — the new rule was VACUOUS. Making the closing-PR requirement conditional on a
      non-empty list still checked it with `expect(guard).toMatch(/closing PR/i)` over the WHOLE
      file, and the guard's prose already says "closing PR" twice while narrating history. A new
      un-timeboxed entry would therefore satisfy it. The seat also said the author's own guilt probe
      was invalid, because it had to delete those markers to force a failure — which is not the
      regression anyone would actually make.
    status: CONFIRMED
    disposition: >-
      Reproduced before touching anything: an entry added to BOTH lists with the prose untouched
      passed 9/9 GREEN. The seat was right on the finding AND on the probe being rigged, and the
      shape is this repo's #3 scar family — a guard judging a substring of a file instead of an
      entity. Fixed by binding the promise to the ENTRY (a closers map keyed by prefix) and then,
      after the second seat, by moving the whole contract out of source-parsing entirely.
  - seat: gemini-3.1-pro
    objection: >-
      MINOR — the comment claims the workspace routes stay dynamic and names generateStaticParams /
      force-static / static export as the future triggers. App Router prerenders a route by DEFAULT
      unless it uses a dynamic API, so a route can become a static payload with none of those.
    status: CONFIRMED
    disposition: >-
      CONFIRMED, and it overturned the PREMISE of the item rather than just its wording.
      Measured on this build, and the seat is right in a way that matters more than the wording:
      FIVE (workspace) index routes are ALREADY prerendered with no opt-in trigger anywhere —
      /clients, /dashboard, /lkpm, /partners, /settings all appear in .next/prerender-manifest.json
      with .html and .rsc on disk. Of those, /lkpm's payload carries 4 marker hits: staff data
      already baked into a build artifact this guard does not scan. So the item as briefed — "write
      down the trigger that would make the scope wrong" — was describing as hypothetical something
      already true. The comment now states the measured situation instead. The one claim that
      survives is the narrow one C4b actually proved: clients/[id] is dynamic, 0 prerender
      artifacts, which is why moving its table server-side genuinely removed the data from
      everything this guard can see.
  - seat: gemini-3.1-pro
    objection: >-
      MAJOR — `typeof value !== "object"` admits FUNCTIONS, which a spread copies by reference just
      as it would an array. MINOR — the loop is vacuous on an empty table, and vitest passes a test
      that asserts nothing.
    status: CONFIRMED
    disposition: >-
      Both taken. The check is now an ALLOW-list of primitive `typeof` results rather than a
      deny-list of "object", and the test asserts the table is non-empty and that it actually
      examined fields. Probed: a `format: () => string` field turns it red.
  - seat: gemini-3.1-pro
    objection: >-
      MAJOR — a comment in a build script enforces nothing, and the claim that a route author will
      read this file is false; the guard could instead assert that no (workspace) route appears in
      .next/prerender-manifest.json.
    status: CONFIRMED
    disposition: >-
      CONFIRMED in principle and DECLINED here, with a measurement rather than a preference.
      The mechanism the seat proposes is right and is written into the guard as the test to use.
      It is NOT asserted, and the reason is a number rather than a preference: asserting it today
      fails the build on the five routes measured above. Turning an escalated, owner-held exposure
      into a red build for every window is not how that decision gets made — and the second seat
      independently agreed, adding that it would train people to bypass the guard. Recorded as the
      follow-up: a baseline that accepts those five measured routes and fails on any NEWLY
      prerendered workspace route.
  - seat: kimi-code/k3
    objection: >-
      BLOCKER — an empty prefix disables the entire scan: `"".startsWith()` is true for every chunk,
      and with a closer declared for it both checks stay green. BLOCKER — the closer value is never
      validated, so "TODO", "later" or `true` satisfy the requirement that an entry name its closing
      PR. MAJOR — the lookup follows the prototype chain, so `CLOSERS["constructor"]` is truthy, and
      the test's substring match sees "constructor" inside "constructorName". MAJOR — synchronisation
      is one-directional: a closer left behind after its prefix is removed stays green and can be
      reused by a later exception.
    status: CONFIRMED
    disposition: >-
      All four reproduced and all four fixed. The deeper point was that two rounds of holes shared
      one root: the rule lived in a test that PARSED this source with a regex, so it judged strings
      instead of values — and strings cannot show you an empty prefix, an inherited key, or a
      closer whose value is a word. So the contract moved INTO the guard, where the real objects
      are, and runs on every build: blank prefixes rejected, `Object.hasOwn` instead of truthiness,
      the closer required to look like a PR reference, and both directions of the pairing checked.
      Measured after: empty prefix exit 1, "TODO" closer exit 1, inherited key exit 1, stale closer
      exit 1, and a properly declared exception exit 0 — the innocence case, so the rule is not
      merely "always fail".
  - seat: kimi-code/k3
    objection: >-
      MINOR — `Object.entries` sees only string keys, but a spread also copies enumerable
      SYMBOL-keyed properties, so a symbol-keyed array would still be shared by reference.
      MINOR — the guard's new runtime loop is never executed by a permanent test; the source-based
      test could stay green if the loop were deleted.
    status: CONFIRMED
    disposition: >-
      The symbol hole is fixed — the walk uses Reflect.ownKeys and a symbol-keyed array now turns
      the test red (probed). The second is accepted and NOT fully cured, stated plainly rather than
      glossed: the suite asserts the runtime contract EXISTS (so it cannot be silently deleted) and
      its BEHAVIOUR is proved by the four probes recorded above, not by a test that runs it. Making
      that permanent means extracting the contract into a module both the guard and the suite
      import, which is a larger change than this PR was opened for. Named as the follow-up rather
      than done quietly.

