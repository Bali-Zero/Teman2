lesson:
  what: >-
    A full-suite run reported 31 files and 155 tests RED, on the pristine base as well as on this
    branch, and the obvious conclusion — "origin/main is broken" — was one sentence away from being
    sent to the imperator. It was false. The runs used `npx --prefix <dir> vitest run --root <dir>`,
    and `--root` makes vitest load its DEFAULT config instead of apps/mouth/vitest.config.ts: the
    printed `include` was vitest's default, and `setupFiles: ["./src/test/setup.tsx"]` never ran, so
    suites that depend on that setup failed on a gitignored data file. Run as the project intends —
    `cd apps/mouth && npx vitest run` — the same tree is 479 files / 5138 tests green.
  why_it_matters: >-
    This is the fourth time in this mandate that a measurement with the wrong FRAME produced a
    confident, dramatic, false result: zsh not word-splitting turned a 19-route sweep into one
    iteration and printed "0 chunk URLs"; a diff against a moved origin/main invented ten frozen-path
    violations and thirteen collisions; a spliced excerpt fabricated a syntax error a refuter duly
    reported. Every one of them looked exactly like a real finding, and the tell was always the same
    — the result was far more dramatic than the change could explain. "Main is red" from a
    three-file comment-and-test diff deserved the suspicion it eventually got, BEFORE the report and
    not after.
