lessons_carried_from_c4b:
  - >-
    Run `--print-floor` WITH `--numstat-file`. C4b declared gear 1 against a CI floor of 3 because
    the SIZE term was absent from a computation that looked complete.
  - >-
    PROSE ABOUT A SCANNER IS INPUT TO THAT SCANNER. C4b's receipt documenting a detect-secrets audit
    turned the check red by quoting the hash next to the words the scanner keys on. If this PR
    documents anything about detect-secrets, name values by reference, never by literal.
  - >-
    Hand reviewers CONTIGUOUS excerpts. A `sed -n '1,5p;46,54p'` packet spliced two valid halves into
    an unclosed `import {`, and a refuter correctly reported a BLOCKER that did not exist. An excerpt
    that cuts a multi-line statement does not omit context, it fabricates a defect.
  - >-
    Diff against the MERGE-BASE, never against a ref that moves. Two separate checks in C4b reported
    phantom results — ten frozen-path violations and thirteen collisions — both because `origin/main`
    had advanced mid-session.
  - >-
    In zsh, `for x in $VAR` does not word-split. A 19-route sweep ran once with the whole string and
    printed "0 chunk URLs", which is indistinguishable from a pass. Use arrays.

