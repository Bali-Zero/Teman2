brief_ref: evidence/brief.yml
council_run: council.jsonl
pii_scan: clean
replacement_note: |
  This is the replacement build for PR #6964 (same branch content, rebased onto
  fresh origin/main by builder-6964r). #6964 was armed and frozen since
  2026-09-20; its `Backend Shard 3` red was
  `test_generate_openapi_schema_pin.py::test_schema_d_ts_pin_matches_the_live_
  openapi_contract`, because `/garuda-outbox` widened the public OpenAPI
  document that `apps/mouth`'s `schema.d.ts` is pinned against. The cure:
  `include_in_schema=False` on that route (the same treatment already given to
  `/metrics/prometheus` in this router) — the route is an operator probe read
  by the healer receptor, not part of the client contract, so the public
  contract and mouth's pin stay unchanged and no `npm run contract:visa-oracle`
  regeneration is needed. Verified: the pin test PASSES with the flag on and
  turns RED with «openapi changed: run npm run contract:visa-oracle...» when
  the flag is removed on a scratch copy (GUILT). The council record below is
  unchanged from #6964 — only this note and the evidence path are new.
plan_ref: |
  Discharges the PENDING-ARMS row "garuda-outbox-exhaustion-is-only-reported-
  through-the-channel-that-can-be-the-cause", restated twice on 2026-09-20 as the
  real cause was measured. The row's own missing-arming-step demanded ONE PR
  carrying both halves and named the trap to avoid: "a future job will read it is
  not a consumer".
lanes:
  - lane: outbox-second-path-build
    role: build
    seat:
      claude-opus-5 (conducting session — wrote the endpoint, the receptor, the
      wiring and both guilt corpora; also the session that measured the 2026-09-20
      failure this closes)
  - lane: outbox-second-path-refute-kimi
    role: review
    seat: kimi-code/k3 (the only lane that delivered — two findings, both cured here)
  - lane: outbox-second-path-refute-codex
    role: review
    seat: codex-gpt-5.6-sol (dispatched, rolled over on context with zero findings — see council.jsonl)
  - lane: outbox-second-path-refute-agy
    role: review
    seat: agy-gemini/flash (dispatched, rc 1 in 8s — see council.jsonl)
  - lane: outbox-second-path-refute-qwen
    role: review
    seat: qwen-cloud-code (dispatched, no credential on this machine — see council.jsonl)
diff:
  behaviour_change: |
    One new read-only HTTP route and one new receptor; no existing behaviour is
    altered. `/health/garuda-outbox` answers aggregate counts plus a server-computed
    `degraded`, and answers `status: unknown` — never `ok` — when it could not look.
    `healer-run.sh` gains receptor 9, which pages p0 through the fleet gateway when
    the verdict is actionable (exit 1) or blind (exit 2). The drain loop, the attempt
    budget and `_send_outbox_alarm` are untouched: PR #6874's reasoning that a job
    which stops retrying stops being visible as work owed is deliberately preserved.
  surface: |
    One route added to the public health router, one new stdlib-only script, one
    receptor block plus its page in the healer tick, one mandate entry so the healer
    session knows what exit 1 and exit 2 mean, one new CI job in the workflow that
    already owns this family ("an alarm must name a condition some organ will act
    on"), and two new test files. No migration, no data, no credential, no frontend.
seat_override: >-
  Quorum reached with codex-gpt-5.6-TERRA standing in for codex-gpt-5.6-sol, and the
  substitution is the whole reason this line exists. sol was dispatched first and
  self-checkpointed with zero findings after spending 175.6k tokens on repo context
  (quota_exhausted: true, recorded in council.jsonl). The reserve bench could not cover
  it either: qwen-cloud-code has no credential on this machine and agy-gemini-3.1-pro is
  not dispatchable at all, because seat_build.sh derives --effort xhigh from the gear-3
  floor and the Gemini CLI rejects it. terra is the same seat family as sol at a lower
  tier, it delivered four SEVERITY(major) findings and the only VERDICT line of the
  council, and a finding is not worth less for the tier that found it. The harness gap
  itself is a PENDING-ARMS row opened 2026-09-21, not a footnote.
dissent:
  - seat: claude-opus-5 (self-refutation, caught by the guilt twin it had just written)
    objection: >-
      The wiring assertion that proves the healer PAGES this finding was under-matched:
      it asked for the string "garuda-outbox-second-path" and the string `telegram p0`
      anywhere in healer-run.sh. Every other receptor also says `telegram p0`, so the
      conjunction stayed GREEN when the page was downgraded to a log line — the guard
      would have certified a finding that only reaches a log file, which is the exact
      silence this PR exists to end (family #3, under-match half).
    status: CONFIRMED
    resolution: >-
      predicate narrowed to the exact pairing 'telegram p0 "garuda-outbox-second-path"';
      the guilt twin then fails as intended. Measured before the commit, not after.
  - seat: claude-opus-5 (self-refutation, on the arming claim in this pack's own brief)
    objection: >-
      The PR's arming claim — "nothing here waits on a launchctl bootstrap, the healer
      tick already runs" — was true and incomplete, which is worse than false. The tick
      executes /Users/nuzantara/scripts/healer-run.sh, a HOME copy declared as a
      home-fork pair of infra/healer/healer-run.sh for machines [mini]. Nothing
      re-syncs that pair automatically. Merging this PR would therefore have armed
      NOTHING on Mini, and the failure mode is a page that never comes — indistinguishable
      from a healthy queue, i.e. the disease itself (superscar #1 feeding superscar #2).
    status: CONFIRMED
    resolution: >-
      the arming step is now named as a gesture, not assumed: after merge, re-sync the
      declared pair on Mini and prove it with scripts/lint_home_fork.py --check, then
      run the receptor from Mini against the live endpoint. Recorded in the brief as a
      VERIFIED assumption and in the receipts.
  - seat: kimi-code/k3 (council, independent — ran the suites itself rather than believing the author)
    objection: >-
      ONE dedup key for two verdicts. `telegram p0 "garuda-outbox-second-path"` was
      constant, and the gateway's repeat ladder makes every repeat of a key quieter —
      so a standing "endpoint unreadable" would have muted the "rows are stuck" page
      that followed it. Two different conditions, one of them about money, silenced by
      the other, inside the very organ built to end a silence.
    status: CONFIRMED
    resolution: >-
      one key per condition (garuda-outbox-undrained / garuda-outbox-blind), with an
      assertion and a GUILT twin that fails when the two keys collapse back into one.
  - seat: kimi-code/k3 (council, independent)
    objection: >-
      Between merging this PR and the Fly deploy that carries the route, the endpoint
      404s while the API is perfectly healthy — and the receptor would have paged that
      as a bare "could not read". An alarm that cries during its own rollout is an alarm
      people learn to scroll past.
    status: CONFIRMED
    resolution: >-
      on a 404 the receptor now probes /health/live on the same host and says which of
      the two it is: "the API is UP but the route is not deployed yet" versus "the app
      itself is the suspect". Measured live against prod right now — it prints the
      first sentence, because that is exactly the state we are in before this merges.
  - seat: claude-opus-5 (self-refutation, measured after kimi's unfinished third question)
    objection: >-
      The PR claims the page leaves on a path the broken wire cannot mute. Measured on
      Mini's spool: in the last 48 hours 3 P0s were sent and 5 were spooled as
      p0_unsent. The second path is therefore real but LEAKY — better than a page that
      cannot exist, and not the clean independence the first draft of the PR body
      implied. The receptor's verdict still reaches the tick summary and the healer's
      own log when the gateway fails, so the finding is never lost; the PAGE is what is
      unreliable.
    status: CONFIRMED
    resolution: >-
      the claim is restated in the PR body as "a different process, a different machine
      and a path that does not require the API's own send to work" — with the leak
      named and measured, and a ledger row owed for the gateway's own loss rate, which
      is NOT this PR's to fix.
  - seat: codex-gpt-5.6-terra (council, independent, VERDICT REWORK)
    objection: >-
      An UNROUTABLE row — one whose job_type has no handler — has its attempt bump
      rolled back by drain_once, so it never exhausts AND does not age into the 24h
      term for a full day. The endpoint answered `degraded: false` for 24 hours while
      every drain pass failed to dispatch it. The new alarm was blind to the one
      failure shape that cannot fix itself.
    status: CONFIRMED
    resolution: >-
      `degraded` now includes `older_than_1h` (the drain loop sleeps seconds; an hour
      undispatched is stuck by definition), the receptor names the shape in its verdict,
      and both corpora gained the case plus an INNOCENCE case for a fresh row mid-flight.
  - seat: codex-gpt-5.6-terra (council, independent)
    objection: >-
      The wiring guard is a substring test, not an execution test: it stays green if the
      receptor call is moved under `if false`, after an early `exit`, or into a function
      nobody calls. The guard would then certify a receptor that never runs — the exact
      disease this PR is about, one level up.
    status: CONFIRMED
    resolution: >-
      the textual test is renamed and its docstring says what it proves; a reachability
      test answers the seat's own three reproductions (column-0 invocation, no top-level
      `if false` before it, no top-level `exit` before it) with a GUILT twin for each.
      The real execution proof stays where it belongs: the tick observed on Mini after
      the home-fork pair is re-synced, as an acceptance bullet.
  - seat: codex-gpt-5.6-terra (council, independent)
    objection: >-
      The second-path page can still be lost with no actionable signal: tg_notify spools
      an unsendable P0 and exits 0, and healer-run.sh's wrapper only logs its last stderr
      line. A Telegram outage or a failed relay therefore leaves no delivered page and no
      alarm about the missing alarm.
    status: CONFIRMED
    resolution: >-
      partially cured here and partially ledgered, because the gateway is not this PR's
      to fix: the receptor's verdict is now written to the healer's own log as well as
      into REASONS (which the tick summary carries), so the finding survives on the
      machine even when the page does not. The gateway's measured loss rate — 3 sent vs
      5 p0_unsent in 48h on Mini — is a PENDING-ARMS row opened 2026-09-21.
  - seat: council (six dispatches, two seats delivered)
    objection: >-
      Three of the four external lanes produced nothing: codex-gpt-5.6-sol spent 175.6k
      tokens on repo context and self-checkpointed with zero findings, agy/gemini
      answered its own tier argument with a model list, and qwen-cloud-code has no
      credential on this machine today. Only kimi/k3 reviewed — and the watchdog cut it
      at 902s before its verdict line, so even that lane's coverage is partial: it never
      finished checking whether the fleet gateway's token is the same credential the API
      uses.
    status: CONFIRMED
    resolution: >-
      recorded in council.jsonl with each seat's failure mode rather than presented as
      consensus, and the unfinished question is being measured directly before this PR
      is called done. The fleet's council capacity is itself thin today and that is a
      finding about the harness, not about this diff.
