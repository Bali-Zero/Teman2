dissent:
  - seat: codex-gpt-5.6-sol (council round 1)
    objection: >-
      The SUPPORT universe was read by scanning product_version_ids in the raw
      signed payload, so a GLOBAL-scope SUPPORT rule (product_version_ids null,
      applies to every product) would leave the guard green over the exact
      class it exists to catch; and the same scan counts rules outside their
      valid_period and non-ACTIVE products, which can demand a walk for a
      product the engine cannot emit.
    status: CONFIRMED
    cure: >-
      Fixed at depth 1 — the universe is derived from the COMPILED pack through
      rules_for(product, effective_at=_AS_OF), filtering products exactly as
      evaluator.evaluate does. Council re-run on the corrected diff.
  - seat: codex-gpt-5.6-sol (council round 2)
    objection: >-
      The ruling row's dependency test used membership in
      CompiledRule.required_facts, which is the set of facts the AST MENTIONS.
      A rule shaped any(eq(requested_product_code,"BRIDGING"),
      intersects(purposes,OTHER)) mentions the forbidden fact and still
      evaluates TRUE with it UNKNOWN — reproduced against the real evaluator —
      so a future BRIDGING route free of the fact could stay excused and green.
    status: CONFIRMED
    cure: >-
      Fixed at depth 1 with an AND-spine soundness check, and the seat's own
      counterexample committed as the guilt test (it asserts the bypass really
      evaluates TRUE through evaluate_condition before asserting the check
      rejects it). Council re-run.
  - seat: codex-gpt-5.6-sol (council round 3)
    objection: >-
      The AND-spine check is sound — the seat looked for a false green and
      found none — but it is CONSERVATIVE, and both its name
      (_condition_cannot_fire_without) and the guard's failure message turned
      "my algorithm cannot prove this dependency" into "this route is
      reachable, add a walk and delete the ruling row". Two legitimate ASTs it
      rejected: not(unknown(fact)), which the real evaluator returns FALSE for
      while the fact is UNKNOWN, and an `any` whose every branch reads the
      fact.
    status: CONFIRMED
    cure: >-
      Fixed at depth 1 — renamed _proves_it_cannot_fire_without, the message
      now states what it can and cannot conclude, and both named shapes are
      proven instead of rejected. The same round's three stale sentences were
      corrected in the same commit.
  - seat: codex-gpt-5.6-sol (council round 4, on the rebase)
    objection: >-
      The merge kept two sibling-era sentences that the disclosure-flag layer
      had already falsified — "the review-FLAG arm of apply_public_policy_
      adapters is not exercised by any walk here" and "a regression that ADDS a
      disclosure flag passes this census invisibly" — and they contradicted the
      file's own flagged-census test 1300 lines below. Three counts were still
      the 84-walk figures: 60/15/1/8 for the funnel census, and "the 76 walks
      that raise nothing" in both the innocence test and the generator.
    status: CONFIRMED
    cure: >-
      Fixed at depth 1 in 45c863326b. The two sentences are named as retired
      and credited to the round that caught them, rather than quietly deleted;
      the counts are 69/15/1/9 and 86 (= 94 - 8), each carrying the superseded
      figure so the next reader can tell a correction from a typo.
  - seat: agy-gemini-3.1-pro (council round 6, reserve seat)
    objection: >-
      The census module docstring said W-VO-E "moved both columns by the same
      +9/-1 shape", which sums to eight walks while the PR adds ten; it
      contradicts the table directly above it.
    status: CONFIRMED
    cure: >-
      Fixed at depth 1 in e7e1034edf (docstring only): "+9/+1", with ENGINE
      67/15/2/0 to 76/15/2/1 and FUNNEL 60/15/1/8 to 69/15/1/9 stated and the
      superseded wording named. codex round 6 derived the before rows from the
      merge-base file and returned OK; agy round 7 returned OK.
  - seat: Claude Opus 5 (self-refutation, on the window's own framing)
    objection: >-
      The window brief calls this class "12 products with a SUPPORT rule that
      no interview branch reaches" and asks for questions to be added or
      re-routed in tree.ts/flow.ts/fact-mapper.ts. That framing is measurably
      wrong for eleven of the twelve: the branches DO reach them, and a real
      visitor could always have got there. The gap was in the corpus and in the
      absence of a binding, not in the tree.
    status: CONFIRMED
    cure: >-
      Not cured — reported. Adding questions the interview does not need would
      have added review volume for facts already collected. The PR says so in
      its body, and the live browser walks prove the products were reachable
      through the DEPLOYED UI before this PR merged.
  - seat: Claude Opus 5 (self-refutation, on what "reachable" can mean)
    objection: >-
      E31E is named by the engine and held by the public layer on every walk
      that reaches it, because _apply_minor_privacy_hold empties the candidates
      of any known minor unconditionally. Counting it as "reached" could be
      read as claiming a visitor sees it. They do not.
    status: PLAUSIBLE
    cure: >-
      Not cured — it is an owner ruling (Privacy Policy V1) and evaluate_path.py
      is outside this window. Both counts are reported separately everywhere
      (27 public, 28 engine), the held walk is pinned by cause in the census,
      and the live proof deliberately uses five OTHER products.
  - seat: Claude Opus 5 (self-refutation, on the council roster)
    objection: >-
      Two of the three council titolari are quota-exhausted, so the second
      opinion comes from a reserve seat, and the window's first instance had
      seated that reserve unpinned and under a seat_override.
    status: CONFIRMED
    cure: >-
      The override is withdrawn. The reserve is the rostered agy-gemini-3.1-pro,
      pinned by --model, re-run on the final diff, and declared through
      seat_fallback_reason with the probe output quoted; the unpinned row stays
      in the journal marked NOT COUNTED. It found a real defect the titolare had
      passed, which is the point of a second family.
