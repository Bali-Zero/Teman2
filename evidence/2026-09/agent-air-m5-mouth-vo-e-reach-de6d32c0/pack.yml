      apps/backend-rag/** (merging IS the deploy) and it is the largest
      behaviour claim of the wave. gear = max(judgement, floor) = 3.
  - id: D-seats
    decision: >-
      The COMMON council titolari are (codex-gpt-5.6-sol, kimi-code/k3,
      tp1-qwen3.8-max). Kimi answered 403 (monthly limit) and Qwen 429 (weekly
      quota until 2026-09-18 08:39 UTC) to probes run at 2026-09-13T17:11:04Z,
      so the second seat is the rostered RESERVE agy-gemini-3.1-pro, declared
      through seat_fallback_reason as the lint's second limb requires. The
      first instance of this window had seated an unpinned "agy-gemini" under
      a seat_override; that row stays in the journal, marked NOT COUNTED, the
      override is withdrawn, and the reserve was re-run pinned to
      gemini-3.1-pro on the final diff (rounds 6-7).
  - id: D-no-tree-change
    decision: >-
      ELEVEN of the twelve unreachable products needed NO code change. Every
      fact their SUPPORT rules read is already collected by a branch an
      applicant can walk today (entry_pattern on the tourism branch,
      sponsor_category and study_level on the study branch, the three remote
      facts, the two investment capital questions, nationalities and stay_days
      on the spine). What kept them dark is the corpus convention of answering
      every question with its FIRST option. So the window adds walks and a
      binding, and does not add questions nobody needed — measured, not
      assumed: the ten new scenarios were probed through the real flow.ts +
      fact-mapper.ts and replayed against the signed pack before a single line
      of tree.ts was considered.
  - id: D-bridging
    decision: >-
      BRIDGING is the twelfth and stays unreachable. All four of its SUPPORT
      rules require `intent.requested_product_code` — the permit the applicant
      wants to switch TO — and the owner's D4 ruling, quoted verbatim in
      tree.ts's `family_sponsor_status_code` comment, is that the Oracle says
      the product and NEVER asks which visa the applicant wants. Building the
      question would have reached the product and overruled Zero to do it.
      Verified rather than assumed: supplying the fact on an onshore
      OTHER-purpose walk whose current_status_code is outside
      hf.bridging.from-visit-itk's visit-class list returns SUPPORTED_CANDIDATES
      [BRIDGING, C6]. Recorded as needs-input for Zero and as the single row of
      UNREACHABLE_BY_RULING, which is itself guarded both ways.
  - id: D-engine-level-guard
    decision: >-
      The guard reads the ENGINE decision, not the public one. The question it
      asks is "can an interview produce facts under which the signed pack
      supports this product", and the public layer's minor-privacy hold
      (evaluate_path._apply_minor_privacy_hold, untouched here) would answer
      "no" for E31E even though the interview reaches it perfectly well. Both
      council seats were asked this explicitly and both agreed the engine
      decision is the right subject. The public census keeps its own pin, one
      line below, so the boundary stays visible rather than hidden.
  - id: D-minor-walk
    decision: >-
      The minor walk is the first walk in the census history to end in a public
      hold, so `census.get("HUMAN_REVIEW_REQUIRED", 0) == 0` had to move. It
      was NOT replaced by `== 1`: the assertion now names the held walk and
      asserts its review reason is exactly MINOR_GUARDIAN_PRIVACY_REVIEW. On
      the first council round's insistence the comment says what that is — a
      narrow, deliberate relaxation of the zero-hold invariant with the one
      permitted cause pinned — instead of the "strictly stronger" it originally
      claimed, which was false.
  - id: D-council-round1
    decision: >-
      Round 1 (codex-gpt-5.6-sol, VERDICT DEFECT) found the SUPPORT universe
      was read by scanning `product_version_ids` in the raw signed payload. A
      GLOBAL-scope SUPPORT rule carries null there and applies to every
      product, so such a rule would leave the guard green over the exact class
      it exists to catch; the same scan counts out-of-period rules and
      non-ACTIVE products, which is a false RED. Fixed at depth 1: the universe
      is now derived from the COMPILED pack via rules_for(product,
      effective_at=_AS_OF) with the product filter evaluator.evaluate itself
      applies. Latent on seq-20 (6 GLOBAL rules, none SUPPORT; all 38 products
      ACTIVE with open periods) — fixed anyway, because the guard's promise is
      about future packs.
  - id: D-council-round2
    decision: >-
      Round 2 (same seat, VERDICT DEFECT) confirmed round 1's fixes as real and
      falsified the newer one. The ruling row's dependency test used
      `forbidden_fact in rule.required_facts`, which is SYNTACTIC: the seat
      reproduced, against the real evaluator, a rule shaped
      any(eq(requested_product_code, "BRIDGING"), intersects(purposes, OTHER))
      that mentions the fact and still evaluates TRUE while it is UNKNOWN.
      Fixed at depth 1 with a soundness check on the AND-spine
      (_condition_cannot_fire_without): under Kleene semantics an `all` node
      cannot be TRUE while a child is not TRUE, a leaf on an UNKNOWN fact is
      UNKNOWN, and known(fact) on it is FALSE — so a leaf reading the fact on
      the spine keeps the rule away from TRUE. `unknown(fact)` is excluded
      explicitly; anything under any/not is rejected (the safe direction). The
      seat's own counterexample ships as the guilt test.
  - id: D-council-round3
    decision: >-
      Round 3 (same seat, VERDICT DEFECT) confirmed round 2's AND-spine check
      is SOUND — it found no false green — and falsified its NAME and its
      failure message instead: the check is conservative, so "not proven
      dependent" was being reported as "route reachable, delete the ruling
      row", and the seat produced two legitimate ASTs it rejects
      (not(unknown(fact)), and an `any` whose every branch reads the fact).
      Fixed at depth 1: the predicate is renamed
      _proves_it_cannot_fire_without, the message says what it can and cannot
      conclude, and the two shapes the seat named are now proven rather than
      rejected. Three stale sentences the same round named (the "signed pack's
      own payload" source, "rules that READ the fact", and attributing all
      eleven products to the first-option convention when several needed typed
      synthetic values) were corrected in the same commit.
  - id: D-council-round4
    decision: >-
      Round 4 reviewed the REBASE, not just this window's half, and returned
      DEFECT on two TEXTUAL findings while clearing the logic in writing ("la
      logica funzionale risulta corretta"). Both were merge damage this window
      caused: the docstring still carried the sibling-era sentences saying the
      review-FLAG arm is exercised by no walk and that a flag regression passes
      the census invisibly — false since #6442 — and three counts still read
      the 84-walk corpus (60/15/1/8, and "76 walks that raise nothing" in two
      files). Fixed at depth 1 in 45c863326b: the two sentences are named as
      retired rather than quietly deleted, and the counts are 69/15/1/9 and 86.
      The same round independently re-derived every headline number in this
      pack and cleared PRIVACY_HELD_WALKS as a real repair rather than a hole.
  - id: D-council-round5-7
    decision: >-
      Round 5 (codex-gpt-5.6-sol, narrow, on head 45c863326b) returned OK on
      round 4's fixes, re-deriving 76/15/2/1 and 69/15/1/9 itself. The window's
      first instance crashed before filing it; the resumed session verified
      the reviewed patch is byte-identical to that head's hand-written diff
      (cmp exit 0) and trimmed the transcript. Round 6, the reserve
      agy-gemini-3.1-pro on the FULL adversarial prompt, cleared (a) guard,
      (b) ruling table and AND-spine soundness, (c) the by-name hold pin and
      (e) generator determinism, and returned DEFECT on one MEDIUM textual
      finding: the docstring's "+9/-1 shape" sums to eight walks, not ten.
      Fixed at depth 1 in e7e1034edf (docstring only, +9/+1 with both
      before/after rows). Both seats re-ran narrowly on the fix: codex round 6
      OK (derived 67/15/2/0 and 60/15/1/8 from the merge-base file), agy round
      7 OK.
  - id: D-rebase
    decision: >-
      Mid-window, origin/main gained a SIBLING PR (#6442) that added a
      disclosure-flag layer to the same two files plus 8 of the same fixtures —
      cicatrix family #5. The branch was REBASED onto it rather than merged,
      and four conflict rounds were resolved by hand keeping the sibling's
      richer text and folding this window's corrections into it. The corpus was
      regenerated afterwards and came out BYTE-IDENTICAL, which is the fact
      that matters: the ten new walks raise no disclosure flag, so the
      sibling's per-flag table is unchanged and every number in this pack was
      re-measured on the rebased tree rather than carried over.
  - id: D-privacy-held-walks
    decision: >-
      The sibling's test asserted "0 HUMAN_REVIEW_REQUIRED at engine level" and
      "every funnel hold is a flag". The minor walk falsifies both, and it is
      NOT a flag — _apply_minor_privacy_hold reads derived.is_minor alone. The
      repair subtracts it BY NAME through a new PRIVACY_HELD_WALKS constant,
      asserted equal to exactly that one label, on BOTH censuses. The two
      causes are deliberately NOT summed into one number: a flag deletes a
      proven verdict and a privacy hold fires on a derived fact, so a single
      total would let a new hold of either kind hide behind the other.
  - id: D-transcript-trim
    decision: >-
      Codex rounds 5 and 6 are trimmed by the same rule (council/trim rule stated
      at the top of each file); the agy transcripts are committed complete, with
      only the inlined patch omitted and identified by sha256. The first three
      codex transcripts were 3.0 MB together — the seat's own tool
      calls, hook lines and the full text of every file it read. Each is
      trimmed here to the PROMPT (first 70 lines) and the FINAL ANSWER (from
      the last speaker marker before the last VERDICT line, through that line),
      with the rule stated at the top of each file so the trim is reproducible.
      Nothing between those two parts is a claim, and nothing after the verdict
      is review — it is the harness's checkpoint hook failing against the
      read-only sandbox.
  - id: D-probe-artifacts
    decision: >-
      The exploration harness (.probe-voe/ — a scenario prober driving the real
      flow.ts, a backend replay script, and a browser walker) is deliberately
      NOT committed. It is throwaway measurement scaffolding, not a consumer;
      everything it proved is either in the corpus, in the guard, or in a
      receipt below.
