decisions:
  - id: D-gear
    decision: >-
      Gear 3 declared. The deterministic floor measured by
      evidence_pack_lint.py --print-floor on the merge-base diff is 2 (first
      instance: 13 files +1943/-14; resumed session on 45c863326b: 13 files
      +2322/-37, floor 2; the final measure including this evidence is in the
