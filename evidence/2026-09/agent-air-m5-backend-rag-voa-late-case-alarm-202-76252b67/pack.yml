  twin of the id defect, and the `practice_release`-on-a-resolution-event
  weld) — both predate this branch and both need their own guilt test.
outcome: >-
  A production order paid on 2026-09-16 has been reported as paid by the
  provider on every scheduler tick since, and the code answered with one
  `logger.warning`. This PR turns that branch into an OP-F08 late case — flag,
  charge id, journal event, staff page — reusing remediation machinery that has
  existed since migration 284 with no writer on this path (superscar #2). It
  also replaces a negated status test with a positive allow-list, because the
  negation classified Xendit's `SETTLED` as unpaid and would have EXPIRED an
  order whose money we were holding. Migration 320 widens the journal's
  `transition_id` CHECK, without which the writer raises inside a transaction
  whose caller swallows exceptions — a cure that reports success and changes
  nothing.
