  have been refunded. One agreement between two families is worth more here
  than either verdict alone, and it is the reason the charge id changed to
  the invoice id rather than being argued about.
  Both returned REJECT. Every finding was re-read on disk before it was
  accepted: a refuter is a lead, not a verdict. Two were refused as
