council_note: >-
  Two seats, both outside the contribution chain and both non-Anthropic:
  Codex `gpt-5.6-sol` (round 2, on the diff already cured of its round-1
  findings) and Kimi `k3` (fresh eyes, never saw the earlier rounds). They
  ran independently and converged, without seeing each other's output, on the
  same top finding: `confirm_no_successful_charge` returned Xendit's
  `payment_id` while this adapter's own `refund()` posts what it is handed as
