dissent:
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      BLOCKING — the late-case UPDATE checked only `late_case_open`. The real
      webhook can land between reconciliation's SELECT and this write, so a tick
      opened a late case on an order that had meanwhile reached `paid`, and
      `resolve_late_order` does not re-check state before refunding: a
      legitimate, fully reconciled payment became refundable.
    resolution: >-
      Accepted and cured in this head. `AND state = 'awaiting_payment'` added —
      the compare-and-set SM-G07 already demands of every write in this file and
      which this one was missing. Re-verified on disk before acting.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      MAJOR — after staff resolve a case as `honoured` the order keeps
      `awaiting_payment` and the provider keeps answering paid, so the next tick
      tried to reopen it. Migration 284's CHECK forbids
      (late_case_open = TRUE, late_case_resolution IS NOT NULL): not a duplicate
      page but a check_violation every tick, forever, swallowed by the caller.
    resolution: >-
      Accepted and cured. `AND late_case_resolution IS NULL` added. The CHECK was
      re-read at 284_garuda_orders.sql:92 before accepting the claim.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      MAJOR — the new event was unsatisfiable: it pins
      `transition_id: {const: OP-F08}` while inheriting `$defs.TransitionId`,
      whose enum did not contain OP-F08.
    resolution: >-
      Accepted and cured. OP-F08 added to the shared enum; membership re-checked
      by loading the YAML after the edit.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      MAJOR — the migration's lock comment was false. `BaseMigration.apply` runs
      the whole file in one `conn.transaction()` (migration_base.py:478), so the
      ACCESS EXCLUSIVE taken by the DROP is held through the VALIDATE and the
      NOT VALID split bought nothing.
    resolution: >-
      Accepted. The split was REMOVED rather than the comment merely reworded —
      ceremony that makes a false promise is worse than no ceremony. The comment
      now states what the runner actually does.
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      MINOR — the staff page asserted "the customer's money is with the
      provider" even when the status is one the adapter does not recognise,
      overclaiming exactly where the code is honest about not knowing.
    resolution: >-
      Accepted and cured. The copy now distinguishes a paid/settled status from
      an unrecognised one, matching what the code actually knows.
  - seat: claude-opus-5 (this session, self-raised before the review)
    status: CONFIRMED
    objection: >-
      Reusing `staff_page_late_paid_after_terminal` would have sent staff a page
      reading "this order was already failed/expired when a payment for it
      succeeded" — false for an order still in `awaiting_payment`, where nothing
      was given up on and what failed was the delivery of the webhook.
    resolution: >-
      A dedicated `StaffPageChargeWithoutWebhookHandler` was written instead,
      with its own truthful copy and its own job type.
  - seat: codex-gpt-5.6-sol (round 2)
    status: CONFIRMED
    objection: >-
      BLOCKING — the mirror image of the round-1 race. OP-F08 is the first
      writer to open a late case on a LIVE order, so the webhook it is
      complaining about can still arrive: OP-02 then marks the order `paid`
      and mints the practice while the case stays OPEN, and
      `resolve_late_order` does not re-check `state` before calling
      `provider.refund`. Staff working that page would refund a payment that
      had already bought the service.
    resolution: >-
      Accepted and cured. OP-02's own UPDATE now closes an open case as
      `honoured` in the paying transaction (`CASE WHEN late_case_open`, which
      reads the OLD row, so an order that never had a case keeps a NULL
      resolution). Guilt and innocence tests added and run against a live
      Postgres.
  - seat: codex-gpt-5.6-sol (round 2) + kimi-code/k3, INDEPENDENTLY
    status: CONFIRMED
    objection: >-
      MAJOR/BLOCKING — `confirm_no_successful_charge` returned Xendit's
      `payment_id` in preference to the invoice `id`, while this adapter's own
      `refund()` posts whatever it is handed as `{"invoice_id": ...}`. A
      PAID/SETTLED invoice carries both ids, which is exactly the body OP-F08
      reads, so `late_case_charge_id` would hold an id the refund endpoint
      rejects: the late case this PR exists to open would not have been
      refundable.
    resolution: >-
      Accepted and cured — read on disk at `xendit.py::refund` before acting.
      The confirmation now returns `body.get("id")`, and the test that pinned
      the old preference was flipped into the guilt test for the new one, on a
      `PAID` body rather than a `PENDING` one so it exercises the reachable
      case. Two seats of different families converged on this without seeing
      each other's output.
  - seat: kimi-code/k3
    status: CONFIRMED
    objection: >-
      MAJOR — the sweep's SELECT had no late-case filter, so an order whose
      case is open or already resolved stays a candidate forever: one provider
      call per tick for the rest of its life, and with `limit` rows taken
      oldest-first, enough of them crowd out real candidates.
    resolution: >-
      Accepted and cured. `AND late_case_open = FALSE AND late_case_resolution
      IS NULL` added to the sweep SELECT. The no-reopen test's assertion moved
      from `left_for_webhook == 1` to the stronger `candidates == 0`, and the
      idempotence test now also calls `expire_if_unpaid` directly so the
      repository CAS keeps being exercised rather than retired behind the new
      filter.
  - seat: codex-gpt-5.6-sol (round 2)
    status: CONFIRMED
    objection: >-
      MINOR — `ChargeConfirmation` was imported inside `create_checkout_session`
      while `confirm_no_successful_charge` of the same ownership-test fake
      CONSTRUCTS one: `NameError` the first time reconciliation touches it.
    resolution: Accepted and cured — the import moved to module level.
  - seat: codex-gpt-5.6-sol (round 2)
    status: CONFIRMED
    objection: >-
      MAJOR — `resolve_late_order`'s `honoured` branch enqueues
      `practice_release` against the RESOLUTION journal event, while
      `PracticeReleaseHandler` looks a practice up by
      `source_paid_journal_event_id`, which only ever holds a `payment.paid`
      event id. Honouring a case by hand closes it and raises
      `PracticeNotMinted` on every drain: case shut, service never started.
    resolution: >-
      Confirmed on disk (`outbox_handlers.py::PracticeReleaseHandler.
      _practice_id_for`) and REFUSED AS OUT OF SCOPE, deliberately. The weld
      predates this branch — it is equally reachable from OP-F04/F05 — and
      curing it means deciding what `honoured` should mint, which is a
      different concern with a different guilt test. What this PR does instead
      is stop sending staff down it: the OP-F08 page no longer offers "honour"
      as a manual action and names the replayed webhook as the route that both
      closes the case and mints the practice. Named in the PR body and the
      ledger rather than half-fixed here.
  - seat: kimi-code/k3
    status: PLAUSIBLE
    objection: >-
      MAJOR — the CAS writes `late_case_charge_id = $2` including NULL, so a
      case could be opened that `resolve_late_order` cannot refund.
    resolution: >-
      Real in shape, but its reachability collapsed with the cure above: the
      charge id is now the invoice `id`, and a Xendit invoice body without an
      `id` does not exist (the adapter already raises `WebhookUnparseable` on
      that shape elsewhere). A refund attempt on a NULL id degrades to
      `RefundFailed -> PaymentProviderUnavailable`, which is a visible 503 and
      not a wrong refund. Left as written, recorded rather than cured.
  - seat: codex-gpt-5.6-sol (round 2)
    status: CONFIRMED
    objection: >-
      MINOR — three sequential sweeps do not prove concurrent ticks; a real
      concurrency test would use two connections.
    resolution: >-
      True, and not cured here. The CAS is a single-statement conditional
      UPDATE, so PostgreSQL re-evaluates its predicate after the row lock is
      released — the property is a database guarantee rather than one this
      test could establish. What was added instead is the direct
      `expire_if_unpaid` call after the sweep, which is the path a concurrent
      tick actually takes.
  - seat: claude-opus-5 (this session, before the review)
    status: CONFIRMED
    objection: >-
      `reconciliation.py` counts an order that got an OP-F08 case as
      `left_for_webhook`, and `main_api.py` logs it as "left for the webhook" —
      every 5 minutes, about the one order we have just concluded no webhook is
      coming for. Kimi raised the same thing as a MINOR.
    resolution: >-
      Accepted. Specified by this session and BUILT by `agy-gemini-3.1-pro`
      (the non-Anthropic builder lane): `ExpiryOutcome` replaces the bare bool,
      `ReconciliationSummary` gains `late_cases_opened`, and the log line
      reports all four numbers. Applied, re-read and tested by this session.
