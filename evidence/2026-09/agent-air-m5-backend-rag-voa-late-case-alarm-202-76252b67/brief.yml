objective: >-
  GARUDA VOA slice E1. Measured on PRODUCTION on 2026-09-19, not recalled:
  order `ord_ujg4nDYSN4w9-jkJQsi7Tg` is paid and we know it. Its checkout
  window elapsed on 2026-09-16 15:20, so `reconcile_expired_checkouts` has
  picked it up on every scheduler tick since; its sibling `ord_TTDU0…`
  expired one minute past its own window while this one never did. The
  difference is `repository.py::expire_if_unpaid`: `confirm_no_successful_charge`
  asks Xendit, Xendit answers "there is a charge", and the
  `if not confirmed_unpaid` branch emitted ONE `logger.warning` and returned
  False. `garuda_payment_inbox` holds 0 rows and has always held 0 —
  no webhook has ever arrived, because an Invoice callback URL that is not
  registered with the provider looks exactly like a customer who never paid.
  Two defects sit behind that. (1) The answer had nowhere to go:
  `late_case_open` / `late_case_charge_id` / `late_case_resolution` have
  existed since migration 284, the mail path branches on `late_case_open`
  (outbox_handlers.py:425) and `resolveLateOrder` (repository.py:771) closes
  the case — a complete consumer chain with ZERO writers on this path,
  superscar #2 in its money-losing form. (2) `confirmed_unpaid` was a
  NEGATION of a vocabulary we do not own: `body.get("status") != "PAID"`.
  Xendit documents a further paid invoice status, SETTLED, which appears
  nowhere in this repository — under the negated form it read as unpaid and
  OP-04 would have EXPIRED an order whose money we were already holding.
scope:
  - >-
    apps/backend-rag/backend/services/payments/port.py — new frozen
    `ChargeConfirmation(confirmed_unpaid, provider_charge_id,
    provider_status)`; `confirm_no_successful_charge` returns it instead of a
    bare bool, and the Protocol docstring now REQUIRES a positive allow-list.
  - >-
    apps/backend-rag/backend/services/payments/xendit.py — new
    `_INVOICE_STATUSES_WITH_NO_ACCEPTED_CHARGE = {PENDING, EXPIRED, FAILED}`;
    anything else, known or future, is not evidence of absence.
  - >-
    apps/backend-rag/backend/services/garuda_orders/repository.py — new
    `_open_late_case_from_reconciliation` (OP-F08): conditional UPDATE on
    `late_case_open = FALSE`, and only the tick that flips it journals and
    enqueues. State stays `awaiting_payment`.
  - >-
    apps/backend-rag/backend/services/garuda_orders/outbox_handlers.py — new
    `StaffPageChargeWithoutWebhookHandler` + registration + `__all__`.
  - >-
    apps/backend-rag/backend/db/migrations_v2/320_garuda_journal_admits_op_f08.sql
    — widen the `transition_id` CHECK. Without it the writer raises
    `check_violation` inside the reconciliation transaction, where the
    per-row `except Exception` swallows it: the cure would report success and
    change nothing.
  - >-
    products/garuda-voa/contracts/events.yaml and journeys/STATE-MACHINE.md —
    the contract learns OP-F08 and
    `payment.charge_detected_without_webhook`.
  - >-
    apps/backend-rag/backend/services/garuda_orders/reconciliation.py —
    module docstring corrected; its stated premise was falsified by three
    days of production.
  - Tests — five existing fakes retyped, plus the new guilt/innocence suites.
constraints:
  - >-
    The order MUST keep `awaiting_payment`. OP-F01 forbids any non-webhook
    writer from reaching `paid`, and reconciliation is one of those writers.
    This change makes a case VISIBLE; it never moves payment state.
  - >-
    NO refund is placed automatically. Honour-or-refund stays a human
    decision through `resolveLateOrder`; that is Zero's boundary, not a
    session's.
  - >-
    NO new alarm channel. The page rides the `staff_page_*` family already
    wired in production at main_api.py:389. D3 (Zero, 2026-09-15) puts alarms
    on in-app kita plus Brevo rather than Telegram, but that binds all six
    handlers and migrating the family is its own concern and its own PR.
  - >-
    A dedicated handler, NOT a reuse of `staff_page_late_paid_after_terminal`:
    that page's text says "this order was already failed/expired when a
    payment for it succeeded", which is false here. Reusing it would hand
    staff a sentence untrue about the case in front of them.
  - >-
    The allow-list must be POSITIVE. I cannot measure Xendit's full status
    vocabulary from this worktree, so the design is made robust to that
    ignorance rather than resting on a guess about it.
acceptance:
  - text: >-
      GUILT, the whole reason for the change: WHEN the provider returns a
      `SETTLED` invoice, `confirm_no_successful_charge` SHALL report
      `confirmed_unpaid is False`. Under the replaced `status != "PAID"` it
      reported True and OP-04 expired an order whose money we were holding.
    probe: >-
      pytest backend/tests/services/payments/test_xendit_charge_confirmation.py::test_settled_status_yields_confirmed_unpaid_false
  - text: >-
      GUILT: WHEN the provider returns a status the adapter does not
      recognise, `confirmed_unpaid` SHALL be False — an unknown status is
      never evidence of absence.
    probe: >-
      pytest backend/tests/services/payments/test_xendit_charge_confirmation.py::test_unknown_status_yields_confirmed_unpaid_false
  - text: >-
      GUILT: WHEN reconciliation finds a charge for an order no webhook ever
      reported, the order SHALL gain `late_case_open = TRUE` and its
      `late_case_charge_id`, exactly one `payment.charge_detected_without_webhook`
      journal row SHALL exist, WHILE `state` stays `awaiting_payment` (OP-F01).
    probe: >-
      pytest backend/tests/services/garuda_orders/test_repository_integration.py::test_op_f08_opens_a_late_case_when_reconciliation_finds_a_charge_and_no_webhook_ever_came
  - text: >-
      IDEMPOTENCE: WHILE three consecutive `reconcile_expired_checkouts` ticks
      run against the same order, exactly one journal row and exactly one
      outbox row SHALL exist and `late_case_open` SHALL stay TRUE.
    probe: >-
      pytest backend/tests/services/garuda_orders/test_repository_integration.py::test_op_f08_pages_once_per_case_not_once_per_scheduler_tick
  - text: >-
      RACE AND RESOLUTION: IF the real webhook has already moved the order to
      `paid`, no case SHALL open; IF staff have already resolved a case, the
      next tick SHALL NOT reopen it.
    probe: >-
      pytest backend/tests/services/garuda_orders/test_repository_integration.py::test_op_f08_does_not_open_a_case_on_an_order_the_webhook_already_paid backend/tests/services/garuda_orders/test_repository_integration.py::test_op_f08_does_not_reopen_a_case_staff_already_resolved
  - text: >-
      INNOCENCE: WHEN the provider confirms no charge, the order SHALL still
      expire, `late_case_open` SHALL stay FALSE and no
      `payment.charge_detected_without_webhook` row SHALL exist.
    probe: >-
      pytest backend/tests/services/garuda_orders/test_repository_integration.py::test_reconciliation_still_expires_an_order_the_provider_confirms_unpaid
  - text: >-
      CONSTRAINT, both directions: WHERE migration 320 has been applied, an
      `OP-F08` journal insert SHALL be admitted WHILE an invented `OP-F99`
      SHALL still raise — without the second half the test would pass just as
      happily against a constraint dropped rather than widened.
    probe: >-
      pytest backend/tests/db/test_migration_320_garuda_journal_admits_op_f08.py
  - text: >-
      CONTRACT: WHEN the AST-derived job-type walker runs it SHALL find a
      handler for the new `job_type`, and the frozen-contract invariants SHALL
      stay green.
    probe: >-
      pytest ../../products/garuda-voa/contracts/tests/test_contract_invariants.py backend/tests/services/garuda_orders/test_outbox_job_type_coverage.py
