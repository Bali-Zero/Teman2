  Production reads this session were column-scoped to exclude the four PII
  columns `garuda_orders` carries (`applicant_full_name`, `applicant_email`,
  `applicant_phone`, `applicant_passport_number`) — order ids, states and
  amounts only. The one order id named throughout is synthetic, created by the
  2026-09-16 sandbox purchase proof; it is the reproducer, not a client. Fly
  secret presence was read by NAME only (`fly secrets list`), never a value.
