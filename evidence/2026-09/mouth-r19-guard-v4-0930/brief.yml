resolver_v4:
  - One in-memory TypeScript Program and checker is built per scanned file with noLib, noResolve and no external declarations.
  - Every sources/member/allMembers/elements key is memoized; cycle re-entry reads the previous global pass and the file is re-evaluated until a cut pass has no growth.
  - There is no hop limit. Nested evaluation beyond 256 frames reports an unresolved finding at the use line and never throws.
  - P2 ObjectLiteral descent owns a visited set per style root, so an object is judged once per root even through cyclic or repeated spreads.
  - Resolved template spans are judged in their full template context; other spans are replaced by var(--r19-x).
  - Finding.line is the literal line; Finding.use is present only when the resolved use is on another line.
  - The initial v4 evaluator test run was red (11 failed, 13 passed); production code was then replaced and the final table is green.
