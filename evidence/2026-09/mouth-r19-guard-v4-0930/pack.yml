brief_ref: evidence/brief.yml
plan_ref: >-
  Branch agent/air-m5/mouth/r19-guard-v4-0930: replace only the v3.4 in-file resolver with the v4.1
  checker-backed fixed-point evaluator. The seven #7714 commits remain the base of this prepare-only lane.
lanes:
  - lane: r19-guard-spec-critic
    role: review
    seat: "claude-opus-5.5 (fresh spec critic: 11 findings on v3, 3 new on v3.1, all folded into v3.2 before build)"
  - lane: r19-guard-v3-build
    role: build
    seat: "claude-sonnet-5.5 (modules, tables, per-page wiring, mutation scripts; v3.0-v3.4)"
  - lane: r19-guard-spec-critic-v4
    role: review
    seat: "claude-opus-5.5 (fresh spec critic on v4: SPEC-AMEND, 10 findings, all folded into v4.1 before build)"
  - lane: r19-guard-v4-build
    role: build
    seat: "Codex external build seat (resolver, v4.1 rows, probe reruns, mutation scripts and evidence; prepare-only)"
what_changed: |
  apps/mouth/src/test/r19-colour-guard.ts: values, declarations, class tokens. A class token is compiled with
  the app's real design system (globals.css through Tailwind's loader) and the emitted declarations are judged.
  apps/mouth/src/test/r19-colour-source.ts: one in-memory Program/checker per file, exact lexical declarations,
  memoized abstract sources, global fixed-point cycle passes, per-root P2 descent and fail-closed depth 256.
  apps/mouth/src/test/r19-colour-guard.test.ts: 750 table tests including every v4.1 rule and time bound.
  TaxCalendarBody / MyTaxCalendar per-page guards: colour tests back, delegating to the modules.
proof: |
  Tables, guards, probes, mutants and the innocence run are in the brief's acceptance. Fresh v4 receipts below
  supersede the historical v3 receipts but preserve them as the audit trail.
dissent:
  - seat: claude-opus-5.5
    objection: "gate-7691 on v2: positions decided by key spellings (imageAlt flagged), values judged only as bare strings (ternaries escape), *ClassName props and class maps unseen, color-mix of a var flagged."
    status: CONFIRMED
    resolution: "v3 judges the syntax tree (positions, ternaries, templates, maps via in-file resolution); owner ruling allows color-mix of vars."
  - seat: claude-opus-5.5
    objection: "spec critic on v3: arbitrary shadow colours hide in var(--tw-shadow-color, X) fallbacks; --color-* aliases of packages/core are not the palette; globals.css imports the project theme; #0000 is transparent."
    status: CONFIRMED
    resolution: "Folded into spec v3.2 before build; each has table rows."
  - seat: claude-opus-5.5
    objection: "spec critic on v3.1: the tripwire could not inject a fake module; light-dark had no ruling; relative colour syntax over-matched."
    status: CONFIRMED
    resolution: "Injectable tw argument; light-dark stays a colour function; fn(from X ...) judges only X."
  - seat: claude-opus-5.5
    objection: "gate-7702 on v3: D1 identifiers bound by destructuring were never resolved (const { label, style } = config[s] ?? config.draft hid every literal of the map; MessageBubble config lines judged 0 times); D2 member reads restarted the depth budget so cross-referencing reads overflowed the stack; F1 parameter defaults were unjudged."
    status: CONFIRMED
    resolution: "Binding elements resolve to the matching member of what their pattern destructures and to their own default (spec v3.3); one depth/visited budget is threaded through every recursive step; parameter defaults are indexed. Rows model the LkpmBatchClient, portal lkpm and MessageBubble shapes with innocent twins, the D2 snippet is a no-throw row, and a row scans the real MessageBubble.tsx. The mutation script now counts a suite error as BROKEN and 15 mutants cover the new code (91 total: 90 killed, 0 broken, 0 survived, 1 argued equivalent)."
  - seat: claude-opus-5.5
    objection: 'gate-7705b on v3.3: R1 (silent green, P1) walk() followed a member callee (`X.join`) instead of walking the receiver, so `className={["p-2", on && "bg-white"].filter(Boolean).join(" ")}` and `` className={`p-2 ${on ? "bg-white" : ""}`.trim()} `` were judged innocent; R2 (budget) memberValues recursed into spreads with the pre-hop budget, so a spread chain was not bounded like an alias chain; ArticleClient''s ReactMarkdown-fallback findings were classified L though the file has no isR19 gate.'
    status: CONFIRMED
    resolution: "Spec v3.4. walk() walks the receiver and the arguments of a property-access call; ONE budget object {hops, visited} flows through identifier, call, binding, member read, spread and ternary (a hop is counted while its results are consumed and given back after). Rows: two guilty and two innocent receiver shapes, the spread cycle, 4-step spread chain unresolved and 3-step guilty, class-position alias chains (4 unresolved, 3 guilty), converging-path budget rows. 10 mutants added; the visited-check EQUIVALENT claim is withdrawn and re-argued in the brief. ArticleClient reclassified R (R=22 L=124 O=0)."
  - seat: claude-opus-5.5
    objection: "gate-7714: resolution escaped the hop budget along bindings, the visited mutant was non-equivalent, and the path walker took 29 seconds on five Card/Panel pairs."
    status: CONFIRMED
    resolution: "Owner-ruled redesign. v4 removes the hop budget and path walk; a checker-backed abstract evaluator memoizes operation/node/name keys, cycles converge by global previous-pass re-evaluation, and depth over 256 fails closed. Nine old hop-limit expectations flip to guilty."
  - seat: claude-opus-5.5
    objection: "spec-critic-v4: an empty per-call cycle cut was declaration-order dependent; P2 re-descended objects; deep aliases could throw; join, Object.assign, template spans, plus, map/flatMap, useCallback and resolved-template context were incomplete."
    status: CONFIRMED
    resolution: "Spec v4.1 adopted every finding: previous-pass fixed point, per-root P2 visited set, fail-closed depth, the missing source rules, contextual span evaluation, literal-line plus optional use-line reporting, and dedicated time/mutation rows."
