    fixture: RED on #6664/#6665 (R1), #6670/#6676 (Harness floor), #6655 (antidotes);
    GREEN on the cures #6666/#6667; NOT-LOCALLY-PREVENTABLE on #6673.
    probe: python3 -m pytest scripts/tests/test_contract_replay.py -q
  - >-
    WHEN a push carries a research file without adversarial_review:, or a hot-zone path
