    No workflow file is touched. Wiring the replay test into a required context is the
    report's item 7, its own serialized hot-zone PR; here the consumers are the pre-push
    hook (live on every push) and the nightly scripts/tests sweep (report-only).
  - >-
    Every `checks:` row invokes the script CI runs — never a re-implementation. The two
    builtins (floor_brief, pack_lint) only stage inputs and call evidence_pack_lint.py /
    evidence_paths.py with harness-floor.yml's own argv.
  - >-
    Fail-open on infrastructure (missing binary, missing PyYAML → INCONCLUSIVE, exit 0 in
    --local), fail-closed on verdicts — the posture slice 1 declared, unchanged.
  - >-
    --post-merge (observer from the merge checkout) is NOT in this slice; it is slice 3's
    third read and is stated as absent, not implied.
acceptance:
