dissent:
  - seat: codex-gpt-5.6-sol (council, round 1)
    objection: >-
      Unknown statuses fail open to copper, the responsive ranges have a
      fractional gap, and multiple tests permit the claimed behaviour to
      disappear.
    status: CONFIRMED
    cure: >-
      All three cured and re-verified by the same seat in round 2 (VERDICT: OK).
      The predicate became an allow-list with an unknown-status guilt test; the
      collapse query's lower bound became 700.02px; the CSS assertions now read
      a comment-stripped view, the collapse assertion pins `display: none`, the
      touch-order assertion also rejects a LATER hide, and the virtualization
      test gained its innocence half. Each cure is mutation-tested in receipt 3.
  - seat: Claude Sonnet 5 (adversarial reviewer, independent of the implementer)
    objection: >-
      The sticky head is pinned at the bare shell-header height while the 44px
      DeskStrip above it is also sticky and carries the higher z-index, so the
      column heads are covered — measured as pinned, invisible in practice. Plus
      13 further findings: sort buttons under the 44px target, `role="menu"`
      without arrow-key navigation, focus not restored when a menu item is
      activated, `menuFirstItemRefs` leaking detached nodes, the outside-click
      test scoped to a class every row carries, no unmount guard on the
      post-await state writes, clicks in the 4px action gaps navigating, and
      four tests that cannot fail.
    status: CONFIRMED
    cure: >-
      All applied. The offset became `calc(var(--bz-header-height, 48px) + 44px)`,
      the same value `HairlineHead` uses and the one r19/README.md documents;
      the ARIA menu role was dropped rather than half-implemented (D6); focus
      returns through a shared `closeMenu`; the ref callback gained its else
      branch; the outside-click test is scoped by `data-menu-cell` id; a
      `mountedRef` guards every write after an await; the actions cell stops
      propagation; the four weak tests were rewritten and mutation-tested.
  - seat: Claude Opus 5 (self-refutation, on evidence)
    objection: >-
      This pack's browser receipt was measured BEFORE the last two cures (the
      sticky offset and the 390px scroller). A render that proved the old code
      does not prove the new one, and the sticky measurement in particular
      reported `th.top === 48` as a PASS when 48 was exactly the defect.
    status: CONFIRMED
    cure: >-
      Partly cured, and the gap is stated rather than papered over. The capture
      is being re-shot on the cured tree and the result is posted to the PR
      before the merge queue takes it; the CSS-level facts (the calc offset, the
      700.02 bound, the declaration order) are pinned by mutation-tested unit
      assertions that do not depend on the browser run. What a re-shot capture
      still cannot prove is eight hours of use by a staff member on real data.
  - seat: Claude Opus 5 (self-refutation, on size)
    objection: >-
      2701 lines of churn in one PR is past the contract's ~400-line guidance,
      and a reviewer cannot hold it in their head at once.
    status: CONFIRMED
    cure: >-
      Not cured, argued. `page.tsx` is a 1355-line file being restyled in place;
      landing it in halves would ship a page carrying two visual systems at
      once, which is the exact failure the window exists to end. The other 900
      lines are the test file and the CSS module, neither of which may land
      apart from the code they pin. The organ IS split four ways by the window's
      own plan, and this is the smallest of the four that still leaves a working
      page. Recorded so the gate can reject the argument rather than discover it.

