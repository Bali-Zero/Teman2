decisions:
  - id: D1
    what: >-
      Keep the `<table>` and carry its grammar in a page-local CSS module
      rather than rebuild the list on the `HairlineGrid` div-grid primitive.
    why: >-
      The frozen render for 03 is itself a real `<table class="data-table
      clients-table">` with `position: sticky` on `th`, and the window's
      acceptance asks for "a viewport-sticky `<thead>`". The module reads only
      r19 tokens and copies no primitive's class string, so this is a
      page-local shape, not a second visual system. `HairlineGrid` remains the
      right primitive for the definition/register layouts K3b and K3c need.
  - id: D2
    what: >-
      The KPI band carries FIVE metrics where the frozen render carries four.
    why: >-
      The render's four are Total/Active/Needs action/Completed. This page
      already displayed Total Clients, Active Practices, Outstanding and Paid
      Revenue through `StatChips`; dropping the two revenue figures to match a
      fixture would have removed information staff use. The four existing
      values are kept and the one derived ownership count is added.
      `repeat(4,1fr)` is the render's layout choice for its own fixture, not a
      law in concept.md §2 or §4.
  - id: D3
    what: >-
      The status write is TWO functions: `updateClientStatus` rejects,
      `handleStatusChange` swallows after logging.
    why: >-
      The table's optimistic completion must roll back when the write fails, so
      it needs a rejection. But `ClientKanban.handleDrop` does a bare
      `await onStatusChange(...)` with no catch, so making the single existing
      function reject would have raised an unhandled rejection on every failed
      drag AND skipped its `setDraggedClient(null)`, leaving the board stuck
      mid-drag. Two shapes keeps the kanban's contract byte-for-byte.
  - id: D4
    what: >-
      The ownership predicate is an ALLOW-list of moving statuses, not the
      complement of the terminal list.
    why: >-
      The deny-list shape failed OPEN: an unrecognised or future status on a
      record assigned to the viewer painted copper and claimed they were next.
      Found by the codex-gpt-5.6-sol seat, which blocked round 1 on it. Copper
      has to be proven; r19/README.md law 1 says that where ownership is not
      derivable, use `wait`.
  - id: D5
    what: >-
      Below 701px the desk strip scrolls horizontally inside a page-local
      scroller instead of restacking.
    why: >-
      The frozen render restacks the strip below 701px. The v1 `DeskStrip` is
      one non-wrapping flex row whose right group is `shrink-0`, and this
      window may not fork a primitive. The scroller is a SIBLING of the table,
      never an ancestor, so the sticky head is untouched. The prop `DeskStrip`
      would need is raised to the imperator rather than added here.
  - id: D6
    what: >-
      The row menu drops `role="menu"`/`role="menuitem"` and keeps
      `aria-haspopup` + `aria-expanded` + focus management.
    why: >-
      `role="menu"` promises the WAI-ARIA menu keyboard pattern (arrow-key
      roving focus), which was not implemented. Shipping the role without the
      pattern is a promise to assistive technology that the interaction does
      not keep; a disclosure of three ordinary buttons that Tab reaches in
      order is honest and is what the frozen prototype does.

