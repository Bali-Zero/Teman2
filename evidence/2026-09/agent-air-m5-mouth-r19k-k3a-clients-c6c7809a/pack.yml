    `DeskStrip` (v1) is one non-wrapping flex row with a `shrink-0` right group
    and cannot express the frozen render's below-701px restack. This page works
    around it with a local scroller (D5). The primitive wants a `wrap` or
    `stackAt` prop; raised to the imperator, owned by the k1-prims lane, not
    added here because this window may not touch `components/workspace/r19/**`.
  - >-
    The v2 primitive props announced for k1-prims (`stickyTop`, `collapseAt=1360`,
    `secondaryFields`, `Stamp tone="copper"`) would replace the page-local CSS
    module's collapse and sticky rules. This PR is deliberately built on v1 so it
    does not block on that broadcast; the rebase is K3's, after PRIMS-V2 lands.
  - >-
    `apps/mouth/node_modules` carried 36 symlinks into
    `.worktrees/mouth-vo-c-doors` for part of this window, which made every local
    render test unrunnable machine-wide (not just in this worktree, and not just
    for this diff). The links are gone now and no install was run by this
    session, so the repair came from elsewhere and its cause is unknown. Worth a
    look by whoever owns the M5 install: the same class recurs whenever an
    install is run from a worktree.
  - >-
    `/clients` still renders three sort surfaces — the desk-strip pills, the
    list-view sort row and the table's own sortable heads. The concept does not
    ask for three and a later window should pick one.
