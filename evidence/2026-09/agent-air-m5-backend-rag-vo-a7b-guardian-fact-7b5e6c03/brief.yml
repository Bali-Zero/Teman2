task_id: vo-a7b-guardian-fact
gear: 2
l_level: L1
gate_class: opus
objective: |
  Slice A7-B of MANDATE-vo.md: narrow the Visa Oracle engine's minor privacy
  hold to an EARNED reason instead of one triggered by age alone. Adds
  person.guardian_consent as FactPath #57/61 (BOOLEAN, rollout-default
  UNKNOWN) and gives `_apply_minor_privacy_hold` a third arm: UNKNOWN ->
  NEEDS_INPUT naming the fact (pass-through preserved if the decision is
  already HUMAN_REVIEW_REQUIRED from an upstream rule, replicating :1213's
  existing pass-through); True -> the hold clears; False -> the sole
  remaining producer of MINOR_GUARDIAN_PRIVACY_REVIEW, now earned by a
  declared absence of guardian consent rather than by minority alone. The
  mouth's fact-mapper sends the key as UNKNOWN (contract-only — no question
  yet, that is Slice A7-M/PR 2), and the OpenAPI contract + 115 walk fixtures
  + 23 gold-harness personas move with the model.
