# Floor measured this session: `python3 scripts/evidence_pack_lint.py --print-floor
# --numstat-file <numstat> --changed-files-file <changed>` on the pushed diff returns `3`, by
# the SIZE term (S1) — 255 content files changed, well past the ~400-net-line PR-contract
# target and past the Gear-3 size threshold. No hot-zone path is touched (migrations_v2/** and
# .github/workflows/** are excluded from the candidate list entirely, never opened), so the
# floor is size-only, not hot-zone.
objective: >-
  Rework of PR #7445 (agent/air-m5/docs/owner-name-zero-v4, closed, superseded by this PR) after
  a fresh gate session returned REWORK-BUILD on head 9553dd4dcc. #7445 itself finished the
  255-file set that PR #7441 (agent/air-m5/docs/owner-name-zero-v3, now CLOSED, superseded by a
  separate PR #7450 covering a disjoint 270-file set) deliberately reverted because a repo gate
  would fire on the owner-codename substitution or on pre-existing unrelated content: 87 files
  gated by `.husky/pre-commit`'s prettier-formatting check, 166 `research/**/*.md` files gated
  by `.husky/pre-push`'s R1 adversarial-review frontmatter gate
  (`scripts/check_adversarial_review.py`), and 2 files gated by `.husky/pre-commit`'s Law-2 PII
  gate on pre-existing, unrelated NPWP-shaped example text. The gate's own re-verification of
  #7445's file-set selection (its "1c" check) confirmed the 255-file reconstruction itself was
  correct. What this rework fixes, all found by that same gate session:
  (a) THREE lowercase occurrences of the owner's first name that #7445 incorrectly swept to
  "Zero" — a doc-embedded JSON template's `"owner"` field, a Telegram-channel-naming design
  spec's `#<name>` handle, and an admin-handle list's third name — are now left byte-identical
  to origin/main. The gate's ruling, applied here without exception: a lowercase form is treated
  as a potential code literal/identifier and stays untouched regardless of whether it reads as
  prose in isolation or whether any code currently parses it — "unmistakably prose" is not by
  itself sufficient once a form is lowercase. This PR's own substitution script therefore never
  applies the lowercase-form rule at all (only the capitalised name and the capitalised full
  name are ever rewritten).
  (b) The commit message must not spell the owner's name anywhere, in any case — the previous
  commit message did, 5 times, and that lands permanently in `main`'s history on a public repo.
  This PR's commit message uses the standing codename and a placeholder phrase only.
  (c) Two minor residual-audit numbers the gate found imprecise are recomputed fresh on this
  branch's actual head rather than carried forward.
constraints:
  - >-
    KEEP rules unchanged from #7441/#7445 (see #7441's own brief.yml `constraints` for the full
    rationale, and pack.yml `dissent` here for what changed): any token containing `@` (emails);
    handles/hostnames where the name is immediately followed by another word character;
    snake_case/kebab-case/camelCase compounds where `_` or a hyphen immediately precedes the
    name, or a letter immediately follows it; filesystem paths/URLs naming an actual repo file;
    the git-author-quote shape (the owner's full name immediately followed by an email in angle
    brackets); the functional-code/test full-file skips (NER fixtures, known-names lists, the
    CREATOR-persona identity check, the whatsapp-corpus name-detector and its test,
    `tests/wa_corpus/test_db_names.py`); `agent-library/config/redaction-rules.yaml` (redaction
    rule DEFINITION); `apps/backend-rag/backend/prompts/zantara_core.py` (repo-wide off-limits);
    `scripts/verify_the_verifiers_gates.yaml` (sha-pinned safety-gate registry) and
    `scripts/lint/wr3_lint_cloud_dependency.py` (functional per-episode-override allow-list) —
    named explicitly this round because a prior sibling task's gate flagged them; `migrations_v2/**`,
    `.github/**`; other PRs' `evidence/**` packs.
  - >-
    NEW this round, the tightened lowercase rule (see `objective`): standalone lowercase
    occurrences of the name are NEVER rewritten by this PR's substitution, full stop — not
    "swept when unmistakably prose". This is a stricter rule than #7441/#7445 applied (which
    swept a lowercase form when it judged the surrounding context as pure prose); the gate's
    ruling on #7445 treats that judgment call itself as the defect (a lowercase form is
    presumptively a literal/identifier). Net effect versus #7445: 3 fewer lines rewritten (881
    vs 884 substitution hit lines), the 3 files affected otherwise unchanged.
  - >-
    Process constraint from the #7445 gate: never amend + force-push an armed branch again. This
    PR is a fresh commit on a fresh branch off current `origin/main`, pushed once, normally.
  - >-
    No client PII anywhere in the diff or this pack (the 2 PII-gate-adjacent lines were read,
    confirmed to be pre-existing NPWP-*format*-illustration text with no real person's number,
    and left byte-identical — only the unrelated capitalised-name line elsewhere in each file
    was substituted). No secrets echoed, no owner's real name or personal email anywhere in this
    brief or the accompanying pack.yml — placeholders only, verified by grep before push. No
    edit outside the dedicated worktree (`agent/air-m5/docs/owner-name-zero-v7`).
