dissent:
  - seat: "gate session on PR #7445 (fresh session, this branch's direct predecessor)"
    objection: >-
      Three standalone lowercase occurrences of the owner's first name were rewritten to "Zero"
      in #7445: a doc-embedded JSON template's `owner` field
      (`docs/superpowers/plans/2026-04-19-seo-cell-A-prenatal-foundation.md:84`), a
      Telegram-channel-naming design spec's `#<name>` handle
      (`docs/superpowers/specs/2026-05-08-domain-mesh-autonomic-design.md:175`), and an
      admin-handle list's third name
      (`research/operations/doc-intake-unified/04-5-hitl-evolver.md:176` — this one additionally
      made the `exempt-...-no-claim-changed` frontmatter value on that file untrue, since the
      rewrite silently drops one of three named admins and duplicates another). The #7445
      builder's own post-hoc audit judged all three "unmistakably prose"; the gate's ruling,
      carried forward from a sibling task's own D3 precedent, is that a lowercase form is
      presumptively a code literal/identifier and stays untouched regardless of that judgment.
    status: CONFIRMED
    disposition: >-
      All 3 lines reverted to origin/main byte-identical in this round. Verified via
      `git diff origin/main -- <the 3 files>`: none of the three hunks touches the flagged line
      any more; each file's OTHER (capitalised) hits are still correctly substituted. The
      substitution script's lowercase rule was removed from the write path entirely (not
      conditionally skipped) so this class of defect cannot recur within this PR's own logic —
      confirmed by re-running the full 255-file dry-run classifier and finding exactly 0
      lowercase-form rewrites across the whole set (881 hit lines, all traced to the capitalised
      or full-name rules only).
  - seat: "gate session on PR #7445 (commit-message finding)"
    objection: >-
      `git log -1 --format=%B` on #7445's head spelled the owner's real first name 5 times. It
      lands permanently in `main`'s history on a public repository once merged.
    status: CONFIRMED
    disposition: >-
      This round's single commit message uses the standing codename "Zero" and a placeholder
      phrase ("the owner's first name") wherever the prior message named the real word — grepped
      case-insensitively for the real first name and surname before every push, 0 matches, both
      in the commit message and in this pack's own two files.
  - seat: "gate session on PR #7445 (residual-audit precision finding)"
    objection: >-
      #7445's pack stated the post-sweep residual outside `migrations_v2/.github` split as 274
      files belonging to a sibling PR's pending set plus 23 files (44 lines) of this PR's own
      KEEP-classified residual; the gate measured 273 and 24 files (45 lines) on that same head,
      tracing the 1-file discrepancy to a file whose only hit follows a JSON-escaped `\n`
      sequence, which a plain word-boundary `grep -w` does not reliably match the same way as an
      ordinary line.
    status: CONFIRMED
    disposition: >-
      Not carried forward as a patched version of the old number: recomputed fresh on this PR's
      actual head. Context has also changed since that measurement — PR #7441 is now CLOSED
      (superseded by a separate PR #7450 covering a disjoint 270-content-file set) — so this
      round's residual audit is framed against #7450's changed-file list instead. See `receipts`
      for the fresh count (671 lines / 299 files total; 269 of #7450's 270 content files
      intersect this word-boundary grep — the 270th carries a hit too, but on a line whose
      JSON-escaped `\n` this plain grep structurally cannot match, so it is left out of both
      counts rather than claimed as hit-free; 30 files / 53 lines classified here, 0
      unclassified).
  - seat: "self-review (why 30 files here versus the gate's 28 on the #7445 head)"
    objection: >-
      The gate's own check on #7445 found "49 lines / 28 files" of residual outside a sibling
      PR's set. This round's equivalent count is 53 lines / 30 files — is the increase a new
      defect?
    status: CONFIRMED
    disposition: >-
      Expected increase, not a defect: directly attributable to reverting the 3 lowercase lines
      (dissent row 1). Those 3 lines,
      byte-identical to origin/main again, now correctly reappear in a plain "still spells the
      name" grep the way they did NOT at #7445's head (where they had already been, incorrectly,
      substituted away). +3 lines exactly matches the 3 reverted lines; +2 files (not +3) because
