    kbli_documents write; no compiled-data fix (the four Lampiran II defect classes in §5 are
    named for their own PR)."
  - "The relation JSON is generated by a session-scratch builder from the repo's own joins
    (scripts/kbli_filiera/perpres_umkm_reservation_relation.py, perpres_foreign_cap_relation.py,
    perpres_body_default_relation.py) plus the vault PDF text; the builder is not shipped — the
    JSON carries every input locator so a reader can re-derive any row."
  - "Client-facing verdict changes are the owner's (Legge 5): the dossier states the legal
    conclusion on each instrument's text and leaves the RELABEL to §8."
  - "No paid per-token Anthropic endpoint anywhere in the lane; the refuter ran on the codex CLI
    (ChatGPT account), the research on the claude CLI (OAuth)."
