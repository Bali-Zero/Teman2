objective: |
  Zero, 2026-09-18: "riguardo pma: con i nostri strumenti e modelli di frontiera trovate materiale
  online certificato riguardo quali codici non sono disponibili per PMA. Ricerca legale approfondita,
  Tier 1 fonti governative, Tier 2 studi legali. Confermate il mio pensiero che se un KBLI non ha
  skala Besar al 100% non è PMA." Two research artifacts, no code, no data cure:
  `research/kbli/2026-09-18-kbli-codes-closed-to-pma-tier1-tier2-dossier.md` (R1 frontmatter,
  `adversarial_review: codex`, three refuter rounds folded) and the per-code relation
  `research/kbli/2026-09-18-kbli-closed-to-pma-relation.json` (269 Lampiran/statute rows → 90 codes
  sourced-closed, 76/90 agreeing with the VERIFIED canonical, 10 whole-row candidates, 13 located
  scope reviews, 93 segments). Every closure carries instrument + locator + the row text; the
  primary texts were read from the BPK gazette PDFs (Perpres 10/2021, 49/2021 Lampiran I-III,
  PP 28/2025, Permen BKPM 5/2025, UU 6/2023, UU 12/2011, BKPM Naskah Urgensi). The owner's
  premise (a PMA is Usaha Besar — Perpres 10/2021 Pasal 7(1), Permen 5/2025 Pasal 26(1)) is
  confirmed; the inference "no Besar row in PP 28/2025 Lampiran I = closed to PMA" is refuted on
  Permen 5/2025 Pasal 8(6) and on BKPM's own drafting rationale (Naskah Urgensi p.8). Nothing in
  the client-facing pages changes in this PR — every relabel is listed in the dossier's §8 as the
  owner's decision (Legge 5).
