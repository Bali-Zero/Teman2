instruction_to_the_grader: |
  Research-only PR at Gear 2 for size (841 lines). Attack surface: (1) is any of the 20
  `umkm_reserved_coextensive` rows actually narrower than the KBLI-2025 title on the vault PDF
  cell (the JSON carries `bidang_usaha_text`, `parent_heading`, `text_vs_title_reading` per row);
  (2) does the 13133 union basis (Lampiran II item 11 + Lampiran III #2) really cover every method
  in the code's uraian; (3) does §4.2 misuse the BKPM Naskah Urgensi — it is cited as drafting
  rationale for Pasal 8(6), never as law; (4) does the dossier anywhere relabel a client-facing
  page or pre-empt the owner's §8 decisions. Do not grade the legal question itself as settled:
  the dossier's verdict is "premise confirmed, inference refuted", stated with the texts.
