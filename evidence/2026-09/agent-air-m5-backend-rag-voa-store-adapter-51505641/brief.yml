refuter:
  # SEAT IDENTITY, corrected 2026-09-12 (Imperator decision #33). Rounds O1 and O2 were
  # launched WITHOUT `-m`, so `~/.codex/config.toml`'s account default carried them: every
  # log header reads `model: gpt-6-astra` (sol_pr2a.log:5, sol_o2.log:5). That is the ASTRA
  # seat, prepare-only under the Builder Contract, not Sol. The first version of this block
  # said `gpt-5.6-sol` — copied from the mandate text, never read from a log. Their findings
  # were real and their cures stand; they are recorded here for what they were. Round O3
  # below is the first on the real Sol door (`-m gpt-5.6-sol`, header verified) and is the
  # round that satisfies "Sol refuter before opening".
  seat: codex (account default = Astra for O1/O2; Sol for O3)
  model_id: gpt-6-astra
  model_id_source: "log header line `model:` of each round, read after the run — never the seat name"
  invocation: "codex exec --sandbox read-only -c model_reasoning_effort=xhigh  (no -m: account default)"
  round: O1
  duration: "6m01s (2026-09-12T09:37:07Z -> 09:43:08Z), 130217 tokens"
  verdict: BLOCK
  self_declared_limit: >-
    Sol stated its own: "non ho rieseguito la suite PostgreSQL" — it worked from in-memory
    mutations of the candidate code and of the assertions, not from a live run. Recorded
    because it bounds what the verdict covers.
  findings: >-
    11, all accepted, none disputed, all cured. FOUR were real CODE defects, not test gaps.
    (2) commit() told a loser carrying a DIFFERENT payload that it merely lost a race:
    on the INSERT path no payload was ever compared, because when it looked there was no
    row. Now the sentinel records whether the comparison happened, and an unverified loss
    re-reads the winner on a fresh connection and splits three ways — same payload False,
    different payload IdempotencyConflictError, no row at all a raised invariant breach.
    (3) migration 304 carries UNIQUE(document_id) as well as the primary key, and every
    UniqueViolationError was read as "someone won your key"; a duplicate document id was
    therefore reported as a lost race for a key nobody held, sending service.py to an
    assert. Now discriminated by constraint name, read live from pg_constraint.
    (4) the Python guard read datetime.now(UTC) while migration 304's binder resolves the
    policy for NEW.created_at = transaction_timestamp(): two instants, so a policy opening
    between them passed the guard and failed inside the trigger as an untranslated
    asyncpg.RaiseError. The guard now asks the database for its own transaction timestamp.
    (10) a LOW_CONFIDENCE replay returned fields in ORDER BY field_path, which is
    deterministic but not the order confidence.py built them in — so "replays the original
    outcome" was false. Rehydration now restores the enum's canonical order.
    Two were secret/isolation defects in the harness. (7) the DSN — CI's carries a password
    — was interpolated whole into skip and fail reasons, which land in JUnit XML and job
    logs; now redacted, pinned by a synthetic sentinel. (5) the database component was
    swapped with rsplit('/', 1), which on a legal DSN carrying a slash in its query rewrites
    the query and leaves the shared database in place — the isolation promise inverted; now
    urlsplit/urlunsplit, pinned by that exact DSN.
    Four were test gaps: (1) the actor-truncation mutant survived; (6) a reachable
    non-superuser role in CI called pytest.skip, which is neither OSError nor PostgresError
    and so flew past the CI fail branch — 12 DB tests skipped, exit 0, a green check for a
    persistence layer nothing exercised; (8) the concurrency test's race was not forced, so
    a mutant with the UniqueViolationError handler deleted could survive the scheduling;
    (9) A6 asserted only the exception TYPE and passed with a wrong document_id and empty
    fields. And (11) three prose claims, one of them the same separator-join example this
    brief already recorded as wrong in the test file and had left uncorrected in the store.
  cures_without_a_behavioural_test: >-
    Declared rather than glossed. THREE cures carry no test of their own.
    (O1-4) transaction_timestamp: the window it closes lies between the Python guard and
    the INSERT — a transaction start, a round-trip, and whatever scheduling happens in
    between, so NOT sub-millisecond, and a test could widen it deliberately by pausing
    after the transaction opens and flipping the policy (Sol O2 finding 6 corrected the
    earlier "sub-millisecond, not reproducible" wording). No such test is written here;
    the cure is structural — one instant instead of two — and is offered as such.
    (O1-6) CI-fails-instead-of-skips: the branch lives inside the fixture and asserting it
    would mean driving pytest's own skip/fail machinery from within a test that uses it.
    (O2-5) the admin connect inside the try with `asyncpg.InterfaceError` caught: the
    same fixture-internal branch, same reason. All three are named here so a reader does
    not infer coverage from the mutation table's silence.
  round_O2:
    model_id: gpt-6-astra
    invocation: "codex exec --sandbox read-only -c model_reasoning_effort=xhigh  (no -m: account default)"
    delta_reviewed: "git diff 8c64223f4e 50aa8127fd (the O1 cure commit)"
    duration: "6m15s (2026-09-12T09:52:24Z -> 09:58:39Z), 141528 tokens"
    verdict: BLOCK
    self_declared_limit: >-
      "non ho rieseguito la suite PostgreSQL né modificato file" — in-memory verification
      of source and extracted tests, plus asyncpg's real DSN parser.
    findings: >-
      6. FIVE marked by Sol itself as the SAME CAUSE as an O1 finding already cured, ONE new
      cause introduced by the O1 cure. That is the Builder Contract 1 stop: a fix-of-a-fix
      ends at depth 1 and the surface gets a spec. Imperator decision #29 ruled path (b):
      cure ONLY what can be stated as a PROPERTY, declare the rest, write the spec.
      (1, P1, = O1-8) the barrier coordinates the external probes, not the internal
      lookups, so the race tests pin the outcome and not the PK branch — DECLARED, spec §1.
      (2, P2, = O1-1) `actor_id[:17]` survived a 16-character shared prefix — CURED as a
      property: maximal 31-character prefix + a test parametrized over every cut 1..31.
      (3, P2, NEW) "304 forbids DELETE" is false; 304's trigger permits DELETE after
      `retention_until`, so the "no row" branch is a legitimate expiry/re-occupation, not
      corruption — CURED in prose: RuntimeError kept, message says unhandled not
      impossible, semantics specified in spec §2.
      (4, P2, = O1-10) canonical order ≠ received order for a non-enum-ordered outcome —
      DECLARED in the port docstring and the test; column = migration = not PR2b, spec §3.
      (5, P2, = O1-7) `asyncpg.connect` outside the try: a DSN the parser rejects raises
      `ClientConfigurationError` (an InterfaceError, neither OSError nor PostgresError)
      before any socket, escaping the redaction; a `--tb=long` report renders the DSN.
      Sol itself noted CI's `--tb=short` does not — CURED at four lines: connect inside
      the try, InterfaceError in the tuple, finally tolerant of a failed connect.
      (6, P3, = O1-11) brief prose: the policy window is not sub-millisecond; ci_behaviour
      still said 14 tests and SKIP — CURED, old figures labelled historical below.
      Sol also confirmed the document_id and DSN tests verify what they claim, and found
