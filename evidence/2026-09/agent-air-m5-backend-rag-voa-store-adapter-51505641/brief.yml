# --numstat-file …` returns 2, source `size`: the diff crosses the 400-line size term and no
# path in it is hot-zone.
#
# The VERDICT is quoted here, not a total, and that is deliberate. This file is itself part
# of the diff it would be describing, so any exact total written inside it is stale the
# moment it is written — measured twice while writing this brief, +883/-1 then +1023/-1,
# each reading invalidated by the edit that recorded it. The stable, checkable figures are
# the per-file counts of the three files that are NOT this one: ports.py +34/-1,
# postgres_store.py +320/-0, test_postgres_store.py +550/-0 = 903 net before this brief is
