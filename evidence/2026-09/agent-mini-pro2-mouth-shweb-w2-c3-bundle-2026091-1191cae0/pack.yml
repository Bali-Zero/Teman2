# Evidence Pack — SHWEB-20260911 / W2-C3. Authored at the per-task path
# scripts/ci/evidence_paths.py resolves for this branch, NOT the deprecated root
# evidence/pack.yml (that path makes any two Gear>=2 PRs mutually exclusive in
# the merge queue). The detail lives in brief.yml beside this file.

