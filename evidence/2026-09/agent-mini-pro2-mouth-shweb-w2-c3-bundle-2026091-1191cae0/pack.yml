plan_ref: >-
  PR from agent/mini-pro2/mouth/shweb-w2-c3-bundle-20260912 — the declared partial of PR #6277
  (merged 7378c87fca, SERVED), closed. Perimeter granted in advance by the SHWEB imperator; the
