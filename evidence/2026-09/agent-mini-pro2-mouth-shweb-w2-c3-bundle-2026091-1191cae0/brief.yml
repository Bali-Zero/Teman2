frozen_file_exception:
  file: apps/mouth/src/data/team-roster.ts
  why_it_is_in_the_diff: >-
    `initialsOf` — four lines of string handling with no data behind it — lived in the same module
    as the 170-line roster array. A "use client" page that wanted only that helper imported the
    module, and the bundler follows imports, not intentions: the whole roster went into a public
    chunk. The helper now lives in src/lib/team-initials.ts and this file RE-EXPORTS it, so its
    public API is unchanged for server callers.
  what_changed: "8 lines removed, 5 added. Nothing else."
  proof_no_data_changed: >-
    The TEAM_ROSTER array is BYTE-IDENTICAL to origin/main (169 lines, `diff -q` clean), and
    PUBLIC_ROSTER, rosterByDept, rosterBySlug and photoForEmail each hash identical to main's. 20
    members, same slugs. The FILE sha256 changes (947b181a… → 4b792be2…) because the helper moved;
    the DATA does not.
  alternative_rejected: >-
    Leaving a second copy of `initialsOf` in this file would keep the sha256 intact and create two
    definitions that can drift apart silently. Reported to the imperator as a STOP before the PR
    was opened (mailbox shweb-w2-followup-frozen) rather than decided here.

