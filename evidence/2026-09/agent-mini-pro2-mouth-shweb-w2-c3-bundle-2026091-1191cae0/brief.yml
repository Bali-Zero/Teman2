dissent:
  - seat: self (the conducting session, on its own first attempt)
    objection: >-
      "SocialProof needs no client features, so the minimal fix is to delete its `"use client"`
      directive and let it resolve the roster on the server." I asserted this after grepping for
      useState / useEffect / useRef / onClick / onChange / window. / document. and finding nothing.
    status: CONFIRMED
    disposition: >-
      WRONG, and the build caught it, not the review. The component passes an `onError` fallback to
      `next/image` at two places — a handler my grep list did not include. As a server component it
      threw "Event handlers cannot be passed to Client Component props" on every portrait: /v2
      rendered its error boundary, dropped from ~228 KB to 107 KB, and two e2e assertions went red.
      Reverted, and the change rebuilt along the shape the imperator had specified from the start —
      the component STAYS client and receives server-resolved rows as props. Recorded because the
      claim was a measurement with a hole in it, not a fact: an enumerated blocklist of handler
      names cannot prove the absence of handlers. The boundary test now asserts the opposite
      invariant on purpose — SocialProof must REMAIN "use client" and must contain `onError` — so
      the same shortcut cannot be retried silently.

debt_out_of_scope:
