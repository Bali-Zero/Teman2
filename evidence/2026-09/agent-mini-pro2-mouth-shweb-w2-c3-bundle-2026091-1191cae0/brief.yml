    Three (workspace) route chunks still carry the roster: clients/[id], lkpm, team-management.
    They are authenticated INTERNAL surfaces and the roster is what they are for. Two of them also
    hardcode the excluded people's portrait paths (raised as Kimi F6 during #6277 and registered
    then). Not touched here and not a public leak.
  - >-
    public/static/team/faisha.jpg and sahira.jpg remain directly addressable on the public origin.
    Pre-existing, raised by Codex Sol during #6277, ruled to debt by the imperator and carried to
    Zero. No public page links them.

