lesson:
  what: >-
    Two of this round's findings were caused by the REVIEW PACKET, not by the code. A `sed` excerpt
    that spliced line 5 onto line 46 manufactured an unclosed `import {`, and a seat correctly
    reported a BLOCKER that does not exist; a truncated ROSTER_GRAPH_MODULES array made a real,
    existing guarantee look absent. Separately, my own frozen-path check reported ten violations that
    were artefacts of comparing against a origin/main that had moved three commits while I worked.
  why_it_matters: >-
    All three have the same shape: a measurement whose FRAME was wrong reported a defect with total
    confidence, and in each case the output looked exactly like a genuine finding. An excerpt that
    cuts a statement fabricates syntax errors; a diff against a moved ref fabricates ownership of
    other people's files. The cure is not to trust the reviewer less — both seats read faithfully
    what they were handed, and Kimi's substitution finding was worth the whole round — it is to make
    the frame explicit and checkable: contiguous excerpts, and diffs against the merge-base, never
    against a ref that moves.

