dissent:
  - seat: harness gate (fresh Opus, read-only)
    objection: >-
      BLOCK on #6502 — the path branch returns the candidate verbatim after excluding only // and
      /\; browsers strip TAB/LF/CR before parsing and URLSearchParams.get() percent-decodes, so
      ?redirect=/%09/evil.test reaches location.replace as https://evil.test/.
    status: CONFIRMED
    disposition: >-
      True, and it survived two further attempts of mine (#6503, #6505) because both only added
      new URL() to the ABSOLUTE branch. The depth-1 rule fired and the imperator wrote the contract.
      Every candidate is now resolved before it is judged. I had reasoned about the parser and still
      shipped a prefix test three times; what closed it was asking the parser instead of the string.
  - seat: claude-opus-5
    objection: >-
      The first spec accepted the SAME origin only, which would drop the staff that
      apps/admin-dashboard and the SSO subdomains bounce here with their own absolute URL.
    status: CONFIRMED
    disposition: >-
      Raised at #6507 and UPHELD by the imperator with the evidence
      (apps/admin-dashboard/middleware.ts:66-74 builds returnTo from request.nextUrl.origin;
      proxy.ts:93-100 documents mail/calendar/drive/knowledge). The spec was amended and #6507
      closed; the sibling branch is restored here and pinned at both unit and page level. Recorded
      because it is the one place where saying so instead of shipping it was the right call.
  - seat: harness gate (fresh Opus, read-only)
    objection: BLOCK notice — the PIN lacks pattern="[0-9]*" and portal/r19-fonts.css is edited.
    status: CONFIRMED
    disposition: >-
      Both taken. The pattern sits beside inputMode (iOS Safari reads the pattern for the numeric
      keypad); the portal file is byte-identical and its stale-comment correction moved into the
      login file's own docstring.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — a Next page module may export nothing but the framework's own symbols; tsc
      --noEmit --incremental false fails TS2344 on the exported helpers.
    status: CONFIRMED
    disposition: >-
      Cured before #6502 opened and carried here: LoginStage, firstPartyRedirect and stageForError
      live in ./contract. The strict flag is an acceptance probe now, because the plain run was
      green on the same tree.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — every non-401/403 becomes "service unreachable", but the endpoint returns 400/422 for
      invalid input.
    status: CONFIRMED
    disposition: >-
      Measured in identity/router.py:78-92. 4xx is now "what you sent" except 408 and 429; 5xx and
      network throws are the service; the denied copy says "were not accepted" so it is true of a
      format error too.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — findReds misses #f00, rgb(...) and bg-red-500; findCopperFill misses inline
      backgrounds, which is exactly how this page fills its button; the theatre guard checks a class
      the overlay never used; the panel guard has no planted case.
    status: CONFIRMED
    disposition: >-
      All four widened and carried here. findReds judges the colour in any spelling with four
      unlisted reds as guilt and the whole alphabet as innocence; findCopperFill reads inline
      styles; findTheatre is source-level with the replaced implementation as guilt;
      panelTracksSuccess is planted three ways.
notes:
  - >-
    Four PRs were closed to reach this one: #6502 (gate BLOCK on the redirect), #6503 and #6505 (my
    corrections touched only the absolute branch), #6507 (same-origin-only, which my own dissent and
    the imperator's evidence showed would break the sibling bounce). Each was disarmed before being
    closed and none was pushed to after arming.
  - >-
    Also cured along the way and still true: the success plate is gone because it was measured never
    to paint; the 1500ms and 2000ms delays are gone; the error boundary lost the shadcn destructive
    red; the skeleton draws this page's silhouette.
  - >-
    A production build cannot be reproduced in a worktree (`next build` dies on the shared
    node_modules symlink), so every browser claim here is measured under `next dev --webpack`. The
    same e2e passed CI's production build on #6505 and #6507, which is the evidence the technique
    holds in both.
  - >-
    Leftovers for other windows, unchanged by this PR: lib/api/client.ts:487 sends an expired staff
    session to /login?expired=true and nothing on the page explains why they were thrown out;
    auth.api.ts:78 reads `.status` where client.ts throws `.statusCode`, so every denial logs as an
    error.
