  - lane: ci-classifier-corpus-review-kimi
    role: review
    seat: kimi-code/k3
dissent:
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection: >-
      BLOCK. The test shipped to cure a family #2 defect ("exists != armed") was
      itself armed by no workflow — zero occurrences across every workflow file;
      it would only ever have run in scripts-tests-sweep.yml, which is
      `schedule:`-only and `continue-on-error: true` by its own design. The PR
      body also named a consumer that did not exist.
    disposition: >-
      ACCEPTED and cured. Armed in immune-enforcement.yml's `antidotes` job, one
      of the 12 required contexts — the same file that already documents two
      earlier lints merged without ever being wired in. This was the third.
  - seat: codex-gpt-5.6-sol
    status: PLAUSIBLE
    objection: >-
      Demanded negative fixtures for every shell and import form the discovery
      regex could miss: line continuations, arrays, quoted lists, variable-built
      lists, importlib/__import__/star-imports.
    disposition: >-
      REFUSED, deliberately. None of those forms exists in this repo's two
      extraction lists today, and a fixture corpus for hypothetical shapes would
      assert a specification nobody has written. The guard covers the forms in
      use and now fails loudly on a MIXED list; a third workflow inventing a
      variable-built extraction list would still pass unnoticed. Recorded as a
      known hole rather than closed by pretending.
  - seat: kimi-code/k3
    status: CONFIRMED
    objection: >-
      PASS-WITH-CONDITIONS, and it raised arming not at all. Its objection was to
      consequence: re-arming a routing table that has had zero live validation
      through nine days of fail-open could now UNDER-select, shipping a
      regression green. Asked for a routing audit before merge.
    disposition: >-
      ACCEPTED and measured. Classified the real file list of the 14 most
      recently merged PRs: 0 under-select. The table errs conservative — 6 of 14
      fall to run_all on unmapped paths rather than selecting too little. The
      same audit corrected this PR's own saving estimate downward, to 57%.
  - seat: kimi-code/k3
    status: CONFIRMED
    objection: >-
      A matched list mixing scripts/ci/ paths with tokens the guard cannot check
      was silently filtered to the readable part — the exact silent-narrowing
      shape the file exists to prevent.
    disposition: >-
      ACCEPTED and cured. A list containing one such token must contain only
      those; a loop with none (e.g. `for f in $(git diff --name-only ...)`) stays
      correctly out of scope.
  - seat: team-lead (Opus 5, final on-disk gate)
    status: CONFIRMED
    objection: >-
      Neither seat found the other's defect. Recorded because it is the argument
      for the cross-family panel itself: a single reviewer, or two of the same
      family, would have shipped one of the two.
    disposition: NOTED — no action; both defects cured above.
