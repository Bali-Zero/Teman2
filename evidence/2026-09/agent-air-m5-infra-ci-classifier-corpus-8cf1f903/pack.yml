lanes:
  - lane: ci-classifier-corpus-build
    role: build
    seat: "conductor (M5, build lane) — implementer session that wrote the
      extraction-closure test and the fix, and ran every receipt below"
  - lane: ci-classifier-corpus-review-codex
    role: review
