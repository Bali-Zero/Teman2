council_run: council-journal.jsonl

dissent:
  - seat: codex-gpt-5.6-sol
    objection: "R1 HIGH (kimi HIGH too): class identity was dropped from the key, so TestA.test_guard and TestB.test_guard (or a top-level twin) collapse to one entry and a deselect of one stays green."
    status: CONFIRMED
    resolution: "Key is (module, dotted class path + function), recovered from the junit classname segments after the module. Synthetic proof: --deselect TestA::test_guard while TestB::test_guard runs is RED (receipts/presence-gate-v3.txt). RESOLVED per both seats."
  - seat: codex-gpt-5.6-sol
    objection: "R1 HIGH: nested Test* classes were not walked, so a nested test could be dropped green."
    status: CONFIRMED
    resolution: "walk() recurses into Test* classes; synthetic --deselect of TestB::TestInner::test_deep is RED. kimi round 1 believed pytest does not collect nested classes; the local run collected and executed it (41 testcases), so that premise was wrong and the recursion stays."
  - seat: codex-gpt-5.6-sol
    objection: "R1 MED (kimi MED): a test defined twice in a scope is deduplicated by the set, and the later def shadows the earlier one green."
    status: CONFIRMED
    resolution: "Duplicate function or class names within one scope are recorded as problems and fail the step; synthetic proof RED."
  - seat: kimi-code/k3
    objection: "R1 MED: deleting a whole suite file shrinks the expected set."
    status: CONFIRMED
    resolution: "KNOWN_SUITES pins the three suites; a deleted file gives absent_suites and RED. Deleting an individual test def remains a visible diff in a relevance-triggering path (documented, not closed)."
  - seat: codex-gpt-5.6-sol
    objection: "R2 HIGH: test defs under module/class-level if/try/with/for/while are invisible to the AST yet collectable by pytest."
    status: CONFIRMED
    resolution: "Such defs are refused (problems, RED); synthetic proof."
  - seat: codex-gpt-5.6-sol
    objection: "R2 MED: repeated class scopes and callable rebinding (test_x = other) shadow; fixtures named test* and Test* classes with __init__ are counted although pytest ignores them; R2 LOW: module boundary picked by name prefix; doc overclaims."
    status: CONFIRMED
    resolution: "Repeated class scope and rebinding of test*/Test*/__test__ names are refused; fixtures and __init__ classes are excluded; module matched against the discovered modules; collection patterns forced (-o python_functions=test -o python_classes=Test); comment reworded. Synthetic proofs in receipts/presence-gate-v3.txt."
  - seat: kimi-code/k3
    objection: "R2 residual false-RED sources: a Test* class inheriting __init__ from a base, an aliased fixture decorator, class-level __test__ = False, a test* def nested in a helper under control flow. Also: deleting a single test def still passes."
    status: PLAUSIBLE
    resolution: "Accepted as documented: every one fails closed (RED, never green) and none exists in the current corpus; each is a convention the three suites already follow. The single-def deletion is the same reviewable diff already stated in limitations."
  - seat: kimi-code/k3
    objection: "R2 first attempt: no verdict."
    status: RETRACTED
    resolution: "The seat timed out after 300s, recorded as non-judgement in the journal (does not count toward quorum), and was retried once on the fixed diff, which returned ACCEPT-WITH-NOTES."

limitations:
  - "Both seats reviewed the diff statically (no tools, no execution); the workflow has not yet run on a GitHub runner at the time of this pack. The PR's own check-wa-attention-pii run is the first execution and must print defined=37 skipped=0 missing=0 problems=0 absent_suites=0."
  - "Round 2 findings from codex were applied and verified by the builder and by kimi's retry; codex was not re-asked on the final delta (fix-of-a-fix depth 1). Kimi's retry is the second-round verdict on the final diff."
  - "Coverage is per test definition, not per parameter set: one surviving variant of a parametrized test satisfies it. A test generated at import time (exec, setattr) is invisible to the AST."
  - "Deleting an individual test def from a suite is a visible diff in a relevance-triggering file and is not machine-detected (only deletion of a whole known suite is)."
  - "The check is not a required context: making it required and regenerating contexts.json is the owner's branch-protection action, out of this lane."

release_requirements:
