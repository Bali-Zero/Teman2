pii_scan: clean
outcome: >-
  One workflow file changes. The corpus step now derives, by AST from every
  scripts/tests/test_wa_attention_*.py, the set of tests DEFINED (identity: module, dotted class
  path, function) and requires each to appear in the junit report as run and unskipped. So -k,
  --deselect or a conftest modifyitems hook that drops ANY of the 37 tests turns the step RED,
  not just the four real-Postgres ones (the previous hand-kept list). Constructs the AST cannot
  follow are refused rather than guessed (test def under control flow, name rebinding, duplicate
  defs/classes in a scope); fixtures named test* and Test* classes with __init__ are skipped as
  pytest does; the three known suites are pinned so a deleted file cannot shrink the set;
  pytest's collection patterns are forced to the assumed ones. The relevance step fails closed on
  an empty base sha and on any grep exit status other than 0/1. The header comment that
  overclaimed deselect protection is replaced by one that states exactly what is and is not
  covered. No runtime effect on Pro or the alerter.

compute_floor: 3
compute_floor_source: path
compute_floor_note: "evidence_pack_lint.py --print-floor on the workflow-only diff with its numstat: 3 / path (.github/workflows/ hot zone). Net diff ~110 lines."

