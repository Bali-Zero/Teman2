task_id: vo-b5-reachable-space
gear: 2
base_sha: d954c1c6cc
objective: >-
  Slice B5-1 (MANDATE-vo.md, R-REACH): the enumerator
  (enumerate-interview-space.ts) and the corpus generator
  (generate-walk-corpus.ts) both used to answer `application_channel` with
  its first declared option regardless of `wants_onshore_conversion`, and
  the live interview's `flowReducer` REFUSES that pair (flow.ts:1317,
  channelConflictsWithOnshoreIntent). Measured on origin/main: of the 253
  covering walks, 7 reached a verdict and 246 were refused, every refusal
  `application_channel=OFFSHORE vs wants_onshore_conversion=yes` — 97% of
  the corpus the live sweep used was a fact set a real browser can never
  send. Both scripts now IMPORT channelConflictsWithOnshoreIntent from
  flow.ts (never copy it): `answersFor(questionId, facts)` filters the
  domain it offers for `application_channel` ONLY, and `answerFor(id,
  overrides, facts = {})` falls back to the first accepted option when its
  ordinary choice would be refused. `countExactWalks` now returns
  `edgesReachable`/`edgeWitnesses` (per-EDGE, not per-question) so
  `buildCoveringSubset` seeds each targeted walk from the ONE context that
  can actually answer it. Re-measured after the fix: covering 252 (was
  253), edgesRequired == edgesCovered == 317 with both difference lists
  empty, corpus count unchanged at 115 with exactly 14 fixtures changed one
  line each (`process.application_channel`, OFFSHORE -> ONSHORE_CONVERSION
  on the 14 onshore walks that never deliberately override it).

constraints:
  - 'No production source file besides the two named scripts: no flow.ts, no package.json, no config, no workflow, no dependency, no lockfile. Touched: apps/mouth/scripts/visa-oracle/enumerate-interview-space.ts, apps/mouth/scripts/visa-oracle/generate-walk-corpus.ts, their two tests (enumerate-interview-space.test.ts, walk-corpus-determinism.test.ts), the 14 onshore_*.json fixtures the generator rewrote, this brief.yml, and — RULED IN as a second commit (MANDATE-vo.md amendment to Slice B5-1''s Files list, "derived fixture ruled in"): apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/fixtures/no-path-doors.replay.json (a DERIVED fixture of the 14 walk fixtures above, regenerated via replay-no-path-doors.py, which runs the backend evaluator LOCALLY — no production call, no owner walk) and its consuming test apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/no-path-doors.test.tsx (hardcoded pins updated to match the regenerated fixture). Nothing else.'
  - 'The filter/fallback applies to application_channel ONLY — both flow.ts reducer call sites (:1317, :327) gate on questionId === "application_channel", so filtering wants_onshore_conversion too would invent a behaviour the live interview does not have. No literal "OFFSHORE"/"ONSHORE_CONVERSION" anywhere under scripts/visa-oracle/ — both scripts import the predicate, never re-implement it.'
  - "This PR touches apps/backend-rag/** fixtures and a backend-rag merge DEPLOYS — test fixtures only (14 JSON files, one field each), so nothing behavioural ships. No other backend file touched."

