outcome: >-
  .github/workflows/tests.yml only. Every ref now restores the shared
  node-workspace cache and the mouth .next/cache read-only; only pushes to
  refs/heads/main (schedule/workflow_dispatch/direct push) save a fresh copy,
  and only on a non-exact-hit. PR refs and gh-readonly-queue/* refs — which
  could previously only ever read their own dead-end save — no longer pay to
  write one. The three old node keys (node-mouth, node-admin-dashboard,
  node-npm-audit) collapse into one shared key, so the identical
  **/node_modules + ~/.npm bytes are stored once instead of three times. The
  three uv-cached installs (Backend Static, Backend Shard, and BOTH of Visa
  Oracle fullstack smoke's install attempts) prune the uv cache post-install
  so only source-built wheels (packages/cell-core) are kept for saving,
  instead of ~3 GB of registry wheels that install faster cold than they
  restore. No job topology, `needs`, job-level `if`, or required-context
  name changed; the .next/cache restore-keys and the node cache's absence of
  restore-keys are byte-identical to before. Playwright browser-cache blocks
  untouched, as constrained.
