behaviour_change: >-
  YES, CI-visible. On any non-`refs/heads/main` ref (PRs,
  `gh-readonly-queue/*`, manual branch pushes): the node-workspace cache and
  the mouth `.next/cache` are restored exactly as before on a hit, but a
  miss or partial (restore-keys) hit no longer triggers a post-job save —
  those refs now write ZERO bytes to either cache, where before every ref
  wrote its own throwaway copy. On `refs/heads/main` (schedule,
  `workflow_dispatch`, or a direct push): behaviour is unchanged from before
  PLUS the save now only fires on a non-exact-hit (previously
  `actions/cache@v6` already skipped the save on an exact hit internally, so
  this is not a new skip, just now explicit and readable across two steps).
  For all three uv-cached installs on every ref: after `uv pip install`
  succeeds, `uv cache prune --ci` now runs before the step ends, so whatever
  gets saved to `~/.cache/uv` afterward (main-writer refs only, via that
  job's own untouched combined `actions/cache@v6` step) contains only
  source-built wheels, not the full registry download cache. Correctness of
  every job's actual test/build/audit output is unaffected in every case —
  only cache write volume and which refs perform writes changes.
