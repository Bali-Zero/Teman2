      ZERO-DECISIONS.md records MIGRATION_DATABASE_URL as "staged", and Fly makes a staged secret
      visible to Machines started or updated afterwards — so the next release_command would take
      the DEDICATED branch, not the single-DSN one.
    status: PLAUSIBLE
    resolution: NOT ADOPTED
    why: >-
      This window's Imperatore measured 0/224 secret names on Fly and instructed the lane not to
      wait for it. The claim was not re-measured here (the fly secret list is not this session's
      to read), so it is recorded as unresolved rather than refuted. It changes nothing in this
      diff either way: the single-DSN path is an unconditional no-op, and the dedicated path is
      exactly what the new tests pin.
  - seat: codex gpt-5.6-sol (Sol)
    objection: >-
      The connection-time-role guard is inert when current_user is already the runtime role, so a
      migration's RESET ROLE cannot reach the migrator and a ledger-owned ALTER can abort the Fly
      release. REFUTED verdict rests on this.
    status: CONFIRMED
    resolution: ACCEPTED AS TRUE, DEFERRED
    why: >-
      Verified as pre-existing in #6123 (2a9941ab), not introduced by this diff, and LATENT rather
      than live: OPERATOR-D.md's provisioning issues CREATE ROLE ... LOGIN INHERIT and GRANT and
      never ALTER ROLE ... SET role, so no connection-time role setting exists on the migrator.
      Out of the mandated perimeter (runner invariant) and would breach the <=400-line bar. Named
      in the PR body with its discriminator (pg_settings.reset_val for the 'role' GUC) so it is
      inherited, not lost. It bears on W1S, whose 304 bracket depends on that RESET ROLE.
