dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      The review packet handed to both council seats built its diff summary
      with `git diff origin/main HEAD --stat` -- a two-dot diff against a
      MOVING branch tip, not the PR's actual merge-base diff. By review time,
      9 unrelated files from OTHER PRs that had landed on origin/main after
      this branch was cut showed up in that stat (e.g. scripts/tp1_call.py,
      scripts/mos-plus-compression-worker.py), making the packet look
      contaminated -- cicatrix-superscar family #9 / W102's exact shape
      ("two-dot diff accuses the PR of main's files"), but in the REVIEW
      TOOLING, not the PR itself.
    status: CONFIRMED
    resolution: >-
      Re-verified with `git diff $(git merge-base origin/main HEAD) HEAD
      --stat`: merge-base is unchanged since branch creation
      (6a78af5b2e53d63de62e6a16bcdfd8d53b9f0f5e), and the true PR diff is
      exactly the 31-file/+14/-133/2-commit shape the local commit
      (427cf72207 + 28b6325d8b (installer follow-up), pre-evidence-pack) already
      had -- matching what the reviewer itself separately noted ("the local
      commit 427cf72207 contains only the expected 30 files"). No change to
      the PR; the finding is retained here as a documented review-process
      lesson, not a PR defect.
  - seat: codex-gpt-5.6-sol
    objection: >-
      infra/launchagents/install_wr2_ig_metrics_scrape.sh builds its template
      path from a `$LABEL` shell variable
      (`SRC="$REPO/infra/launchagents/$LABEL.plist"`), so scripts/consumer_map.py's
      literal-basename grep cannot see it as a consumer of the renamed
      ig-metrics-scrape.daily plist -- but running this installer after the
      rename would deterministically hit its own generic
      "FATAL: template not found at $SRC" guard, with no indication that the
      cause is WR2's deliberate retirement rather than a missing/broken file.
    status: CONFIRMED
    resolution: >-
      Fixed in this PR: the FATAL branch now states outright that WR2 runs
      only on command (Zero, 2026-09-01), that this is the deliberate reason
      the canon template is absent, and names the exact re-arm step (rename
      the canon plist back to `$LABEL.plist`) an operator would need to take.
      Verified `bash -n` on the edited script (syntax OK) and confirmed via
      `grep -l "com.balizero.wr2" infra/launchagents/install_*.sh` that no
      other installer under infra/launchagents/ references a com.balizero.wr2
      path, so no sibling fix was needed.

