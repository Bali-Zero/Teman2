dissent:
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection:
      "HIGH -- SIGKILL landing after a retry's outcome is known but before the caller's
      per-walk flush leaves requests_used_this_run undercounting real server-side requests for a
      walk that burned several attempts; the existing SIGKILL test only waits for two COMPLETED
      walks and does not deterministically cover a mid-retry window."
    resolution:
      "CURED. run_walk gains an on_reserve hook called after every retry's outcome is known
      (a pre-send flush was tried first and rejected on its own merits -- see the mutation-red
      receipt above and the module docstring -- because it can leave a permanent phantom
      over-count if the process dies before the request is actually dispatched). New real-
      subprocess guilt test with a mutation-red proof; existing SIGKILL test re-verified 5x
      green."
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection:
      'HIGH -- an HTTP 200 body shaped {"decision": {}} (or a null/non-string state) is
      accepted as a terminal engine_verdict with engine_state=None, and is never re-sent on
      resume, arguably contrary to W1''s ''an invalid 200 body is a harness red'' framing.'
    resolution:
      "REJECTED for scope, not for correctness -- the finding is real. Verified by command:
      `diff` between this PR's run_walk (lines 465-565 post-cure, 475-587 accounting for the
      on_reserve addition) and the #6871 raw material's run_walk is EMPTY -- this function is
      untouched by this PR. Two prior gates (#6861, #6871 REWORK-BUILD) already reviewed this
      exact classification path in depth without flagging it. This slice's mandate (MANDATE-vo.md,
      Slice B2''-b) is V1-V4 + the R-FLOCK import migration, explicitly 'a SMALL cure ... not a
      rewrite'; introducing new decision-body validation is a genuine, separate concern that
      deserves its own guilt tests and its own gate, not a rider on this PR. Not independently
      corroborated by kimi or agy. Recommend a follow-up slice."
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection:
      "MEDIUM -- the --dry-run branch reads the driver token from disk before acquiring
      ReportLock, so a concurrent live run holding the lock does not block a dry-run's token
      read, 'violating the explicit lock-before-token rule.'"
    resolution:
      "REJECTED. Re-read against the actual spec text (MANDATE-vo.md, V2): the guilt
      condition is 'the server sees 0 evaluate AND 0 health' -- --dry-run makes ZERO network
      calls of either kind, unconditionally, by construction, so this condition is satisfied
      trivially regardless of lock ordering. The 'lock before token' precedence this finding
      generalizes from was specified for the LIVE run path (so a lock refusal costs zero
      requests), not as a blanket rule binding every code path in the module. Making --dry-run
      acquire the SAME exclusive flock a live run holds would additionally block a harmless,
      side-effect-free diagnostic peek against a real run in progress -- a UX regression not
      requested anywhere in the mandate."
  - seat: codex-gpt-5.6-sol
    status: CONFIRMED
    objection:
      "MEDIUM -- in --dry-run, load_driver_token ran before the report_version/digest check,
      so a report with BOTH a stale version and a missing/bad token file surfaced the token
      error, masking V2's own refusal line."
    resolution: "CURED. Reordered: dry-run now checks report_version/digest via
      _load_existing_and_pending BEFORE load_driver_token, matching the live path's precedence.
      New test (no token file written at all) proves the version-mismatch line appears and the
      token-not-found message does not."
  - seat: kimi-code/k3
    status: CONFIRMED
    objection:
      "MEDIUM -- run_walk's docstring says None means 'the budget ran out before this walk
      could even start its first attempt,' but the same reserve() check sits at the top of the
      RETRY loop too, so a walk that burns its budget mid-retry is silently dropped with zero
      trace of the attempts it already cost, contrary to W2's 'no attempt is silently
      overwritten.'"
    resolution:
      "Same underlying gap as codex's retry-granularity HIGH above (the two seats converged
      from different angles: codex on counter accuracy, kimi on attempt-history completeness).
      The counter-accuracy half is CURED (on_reserve flushes counters on every settled retry, so
      the SPENT requests are now visible in requests_used_this_run even when the walk itself
      never resolves). The attempt-HISTORY half (recording the specific harness details of the
      burned attempts against this walk's own attempts_history when the whole run aborts
      mid-retry) is a real, separate enhancement kimi is right to want, but it touches the same
      untouched run_walk/caller boundary as codex's rejected HIGH#2 and is likewise out of this
      slice's V1-V4 scope -- REJECTED for scope, recommend the same follow-up slice."
  - seat: kimi-code/k3
    status: CONFIRMED
    objection:
      "LOW -- the V1 SIGKILL guilt test's final resume assertion demands EXACT equality
      (final['requests_used_total'] == server count), which the test's own docstring says is
      wrong given the declared one-request tolerance; a slow CI box could make it flake."
    resolution:
      "SUPERSEDED by the retry-granularity cure above, not directly changed. With counters
      now flushed on every settled retry (not just once per resolved walk), the on-disk count
      tracks the server far more closely at every instant, which is what actually eliminates the
      flakiness risk kimi is naming -- re-run 5x green (see the mutation-red receipt). The exact-
      equality assertion was left as written since it held cleanly 5/5 after the cure; loosening
      it further was not needed."
  - seat: kimi-code/k3
    status: CONFIRMED
    objection:
      "LOW -- test_report_version_mismatch_refuses_before_any_network_call only proves the
      'missing report_version key' branch; an explicit stale INTEGER version is a separate branch
      through the same != comparison and was untested."
    resolution:
      "CURED. New test test_report_version_stale_integer_refuses_before_any_network_call
      writes report_version: REPORT_VERSION - 1 explicitly and asserts the same refusal
      shape (exit 2, one line naming both versions, zero evaluate/health)."
  - seat: kimi-code/k3
    status: CONFIRMED
    objection:
      "LOW -- resuming a hand-thinned report (missing the 'health' key, or a walk row missing
      'attempts_history') passes both resume gates (version, digest) and then crashes with a raw
      KeyError inside _probe_health's report['health']['start'] assignment or _merge_attempt,
      never the module's clean one-line refusal."
    resolution:
      "REJECTED for scope. LOW severity, single-seat (not corroborated by codex or agy),
      requires an operator to hand-edit a report this module only ever writes via
      atomic_write_json -- not a realistic path the module's own write discipline produces.
      Curing it properly needs a general schema-validation pass on resume, which is a broader
      change than V1-V4 authorizes here. Recommend a follow-up slice alongside the two rejected
      codex findings above (all three concern resume-path robustness against inputs this module
      itself never writes)."
  - seat: kimi-code/k3
    status: CONFIRMED
    objection:
      "LOW -- the 401/403 circuit-breaker log line ('stopping after exactly one request')
      reads as a claim about the whole run's requests_used_this_run, when it actually names only
      the one request the breaker itself spent on THIS walk; an operator reconciling the log
      against a report where earlier walks also spent requests could misread it as a bug."
    resolution:
      "CURED. Reworded to 'stopping the run after exactly one request spent on this walk.'
      Cosmetic-only; the existing 401/403 tests assert a different, unaffected substring
      ('the token FILE is the likely cause') and stayed green unmodified."
  - seat: kimi-code/k3
    status: CONFIRMED
    objection:
      "LOW -- extract_walks validates that every walk has a non-empty label but never checks
      for DUPLICATE labels; walks_by_id is keyed on label, so two walks sharing one would collapse
      into a single report row while the runner still POSTs both to production."
    resolution:
      "CURED, independently corroborated by codex's MEDIUM finding of the same defect.
      extract_walks now raises EnumerateLiveError on a duplicate label, before any token load or
      network call. New test with two walks sharing a label but different facts."
