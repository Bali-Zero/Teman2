constraints:
  - >-
    report_lock.py and its test are untouched by this PR -- byte-identical to what B2''-a
    merged. The runner never carries its own lock or atomic-write logic again.
  - >-
    No `--as-real` escape hatch exists anywhere in this module; every live request is labelled
    traffic_source=synthetic_driver, unconfigurable. The driver token is read from a file,
    chmod-checked, never logged, never present in the report.
  - >-
    Merging this deploys the backend (apps/backend-rag/**), but nothing in the deployed image
    imports this script -- it is operator-invoked CLI tooling, never reached by a live request.
  - >-
    This builder does not arm. `gh pr merge` is never run from this seat; the PR opens with
    auto-merge NOT armed and stays that way until a fresh gate's PASS.

