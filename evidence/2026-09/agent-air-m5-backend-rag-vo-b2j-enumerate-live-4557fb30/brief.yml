objective: >-
  Conductor ruling R-SPLIT-B2 + the owner decision of 2026-09-20 ("B2-1") authorize ONE more
  round of Slice B2''-b, the live runner, on a fresh origin/main that contains B2''-a's merge
  (report_lock.py, PR #6920, merge commit 615a5c920377c6947fca1ee9f88edeaddc927ff7). The raw
  material (closed PR #6871, head c6f4e5766b298440eaea036bad2a0b27569776d3) carried its own
  O_EXCL/stale-lock implementation; per R-FLOCK's amendment to this slice, that implementation
  is deleted from the runner and replaced by an import of report_lock's kernel-held flock
  (ReportLock/ReportLockError/atomic_write_json). ReportLockError is a RuntimeError, not this
  module's EnumerateLiveError, so it is caught explicitly and exits 2 with one line, zero
  requests sent -- the lock is acquired before the driver token is loaded and before any
  network call. --break-stale-lock and its plumbing are dropped: a kernel-held lock has no
  stale state to break. On top of the flock migration, this round cures OBS-B (the two request
  counters were assigned once, after the loop, so an interrupted run showed 0 on disk even
  after real requests were sent -- V1: assigned inside `_flush()` on every write instead) and
  OBS-E (`report_version` was written but never read on resume -- V2: a mismatch now refuses
  before any network call). V3/V4 restate the manifest's real provenance (the B1'' emitter's
  output, not a checked-in file) and report_lock's own declared limits in this module's
  docstring, since the runner now depends on that module's guarantees.

