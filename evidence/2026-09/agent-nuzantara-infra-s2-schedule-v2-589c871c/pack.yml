plan_ref: >-
  S2 mandate (staff room website-03, wave 1), PR2 of 2: the schedule of the credential-custody
  detector. PR1 #6113 merged as 2ee842d045 and is live on Pro (checkpoint 8, 18:09Z).
  This PR SUPERSEDES #6132, which was armed-and-frozen when Detect Secrets went red on four
  false positives; the five commits are cherry-picked with -x onto a fresh origin/main and the
  sixth commit is the cure. Arming freezes a branch, so the successor is the contract, not a
  force-push.
grader: >-
  claude-opus-5 --effort xhigh, a fresh claude -p session outside the chain, commissioned by the
  S2 Dux (NOT this session); it publishes nothing, the Dux posts its receipt and verdict
