residuals:
  - "ACCEPTED EXPOSURE (Kimi L1): send_alerts passes the alert text as argv to the gateway, so any local user can read the directory-and-count text with `ps` while the call runs. tg_notify.py's CLI surface is frozen and owned by S4; fixing it means stdin or a file, which is S4's change, not this PR's. Recorded, not hidden."
  - "Kimi L4: a run killed between the heartbeat's tmp write and os.replace leaves a `.json.tmp.<pid>` behind forever. Harmless to the monitor (it reads only the .json) and negligible at an hourly cadence; no reaper added."
  - "Kimi's untested gap: no test exercises the heartbeat's unwritable-directory path. It is covered by the blanket try/except (returns False, never raises), verified by reading, not by a probe."
  - "The firebreak row (PENDING-ARMS.md:268) is amended in the mission's ledger-only PR, cut after this PR merges (S2 mandate section 3: no rows inside a code PR)."
  - "Prove-live: after bootstrap, stat -f %Lp ~/logs/secrets-permissions-audit.log must print 600, and the launchd run's custody counts must equal the same-minute find oracle."
spend:
  wall_clock_hours: 4.6
