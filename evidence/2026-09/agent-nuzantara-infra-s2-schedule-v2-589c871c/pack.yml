      claude-opus-5 (the Dux) for the Codex round-1 fixes and the gate round-1 rework
  - lane: s2-pr2-codex
    role: review
    seat: >-
      codex (.claude/scripts/codex-spalla.sh, account default model, xhigh), round 1, cross-family,
      read the frozen diff itself: 2 BLOCKER + 3 MEDIUM + 1 LOW, all taken
  - lane: s2-pr2-kimi
    role: review
    seat: >-
      kimi-code/k3 (kimi -p under env -i, read-only, handed the frozen diff and the seven
      invariants with no brief), R9 quorum's second seat alongside Codex
  - lane: s2-pr2-gate-r1
    role: review
    seat: >-
      claude-opus-5 xhigh, fresh session 5a85a6f6-1bf1-4cb7-a8ee-31a7af1d82c4 on bd704a1af8:
