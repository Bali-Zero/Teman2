seat_diversity: satisfied
seat_diversity_note: >-
  Two build seats (Sonnet 5, Opus 5) and three review seats, TWO of them non-Anthropic
  (codex-gpt-5.6-sol, kimi-code/k3) — the R9 quorum, journaled in council-journal.jsonl.
  The diversity was not ceremony. Codex caught that the gateway's exit code is always 0; the
  fresh Opus gate caught what neither the builder nor Codex looked for, the CI's organ-genes
  and harness-floor checks; Kimi caught what all three had accepted as true — that the alert
  text was HOME-relative only by accident of the current roots, and that the plist's Umask
  does not reach the log files launchd itself creates.
