gear: 3 # floor 3, source path: infra/launchagents/* is a hot zone (final gate round 1, 18:14Z)
task_id: s2-custody-schedule
mission: S2
colour: BLUE
l_level: L1
deadline: 2026-09-10T21:30:00Z # the S2 mission deadline (mandate_budget.py), renewed once by the staff room from 19:59:24Z
base_sha: 074b4fde010aa6d4228decffc568d802ae2914f8 # origin/main after #6113 merged as 2ee842d045; PR2 rebased onto it 18:17Z  # pragma: allowlist secret
objective: >-
  The credential-custody detector runs on a schedule on Pro: a canon LaunchAgent runs
  scripts/secrets_permissions_audit.py --notify every hour, custody findings leave as one p0
  Telegram alert and .env* mode findings as one digest, so the next loosened credential file is
  caught by a machine within one audit interval (<= 60 min + run time), not by a late reader.
  Detection is hourly; delivery follows the gateway's own policy for the constant dedup key
  (first alert at once, then its repeat ladder — 6 h, then 24/72/168 h — while the condition
  persists), and the run record prints the gateway's status per alert (sent / deduped / spooled).
scope:
  - scripts/secrets_permissions_audit.py
  - scripts/tests/test_secrets_permissions_audit.py
  - infra/launchagents/com.nuzantara.secrets-permissions-audit.plist
  - evidence/2026-09/agent-nuzantara-infra-s2-schedule-v2-589c871c/
  - apps/organism/organism/organs_registry.yaml # one entry + checksum: G1 of the required organ-genes check; widening filed to the staff room in S2 checkpoint 9 (18:17Z)
constraints:
  - >-
    --notify never chmods anything (no os.chmod, no os.fchmod, not even its own logs).
    Credentials and their modes stay with the human. CORRECTED after the Kimi seat (M3): the
    plist's Umask 0077 covers files the JOB creates, NOT StandardOutPath/StandardErrorPath,
    which launchd creates under its own umask — measured on Pro, every ~/logs/*.log is 0644.
    The log DOES list credential paths, so the two log files are pre-created 0600 at install
    (launchd appends to the existing inode and keeps the mode); the install comment in the
    plist previously claimed the Umask covered them and was wrong.
  - >-
    Alert text carries only machine label, directory (HOME shown as ~, and a directory OUTSIDE
    home rendered as <outside-home>/<basename> — Kimi M1), count and mode class —
    never a file name, never contents. Consumes tg_notify.py's frozen CLI surface
    (--tier p0|digest --source secrets-audit --dedup-key secrets-audit:secrets-dir|env-modes);
    tg_notify.py is not edited. Tests never run the real gateway (SECRETS_AUDIT_TG_NOTIFY fake).
  - >-
    The script stays Python 3.9 compatible: Mini's com.nuzantara.secrets-perms-sweep runs it with
    /usr/bin/python3 3.9.6 in --fix mode, which this change leaves byte-for-byte in behaviour
    (--notify is a new, separate mode; --notify with --fix is a usage error).
  - >-
    Plist only, never crontab. #6101 (the launchd canon, ProgramArguments on
    /Users/nuzantara/nuzantara) merged 2026-09-10T14:24Z, so the schedule is unblocked.
acceptance:
  - text: >-
      WHEN a custody file is loosened THEN --notify SHALL hand exactly one p0 alert with dedup key
      secrets-audit:secrets-dir to the gateway, naming the directory, the count and the mode class
      and never the file name — also when the root is reached through a symlink or the .secrets
      directory is met during a walk.
    probe: pytest test_n1 + test_n9 + test_n12_custody_alert_covers_symlinked_root_and_walked_custody
  - text: >-
      WHEN only .env* files are loosened THEN one digest alert (secrets-audit:env-modes) SHALL be
      handed; an ordinary finding or a clean tree SHALL hand none.
    probe: pytest test_n2 + test_n3 + test_n4
  - text: >-
      IF a custody root cannot be listed THEN the run SHALL exit 2 and still hand the p0 alert; IF
      the gateway cannot be reached THEN the run SHALL exit 1 with a failed=1 NOTIFY line.
    probe: pytest test_n5 + test_n6
  - text: >-
      --notify SHALL make zero chmod/fchmod calls on any audited file (an ordinary credential
      included); --notify with --fix SHALL be refused. (The gateway hardens its OWN spool files;
      that is tg_notify.py's contract, not an audited file.)
    probe: pytest test_n10 + test_n11
  - text: >-
      An alert SHALL count as handed over only when the gateway reports an accepted status (its
      exit code is 0 even when it could not send or spool); an audit BLIND without a custody root
      report SHALL still raise the p0; an alert SHALL never print the real name of a symlinked HOME.
    probe: pytest test_n13 + test_n14 + test_n15 (Codex review of this PR, round 1)
  - text: >-
      The plist SHALL run the main checkout's script with --notify every 3600 s under Umask 0077,
      with only HOME and PATH in its environment.
    probe: pytest test_p1 + plutil -lint
  - text: >-
      WHEN launchd starts the job (launchctl kickstart -k) THEN its own log SHALL show one run with
      launcher=launchd whose custody line's file count equals `find ~/nuzantara/.secrets -type f |
      wc -l` and whose finding count equals the oracle below, taken
      in the same minute (the custody line counts every entry walked — the live directory holds
      only regular files — and its findings are the regular files with any group/other bit,
      i.e. `find ~/nuzantara/.secrets -type f -perm +077 | wc -l`); one scheduled run later the
      result SHALL still hold.
    probe: production observation after deploy (log ~/logs/secrets-permissions-audit.log)
  - text: >-
      An alert SHALL NOT spell out a location outside HOME: a custody root reached through
      --root or symlinked onto another volume SHALL read <outside-home>/<basename>, never the
      mount point or the directory name. The gateway status vocabulary this script treats as
      "handed over" SHALL stay pinned to the REAL scripts/tg_notify.py, not only to the test
      fake that echoes our own assumption back at us.
    probe: pytest test_n19 (guilt + innocence) + test_n20 (source-read contract, Kimi M1/M2)
  - text: >-
      AFTER deploy, the first launchd run SHALL report handed=<number of alerts built> with a
      known gateway status in its NOTIFY line — the only place a drift in the real gateway
      becomes visible, since no test may run it.
    probe: production observation (log ~/logs/secrets-permissions-audit.log, NOTIFY line)
  - text: >-
      The schedule is an organ with its genes: IF SECRETS_PERMISSIONS_AUDIT_ENABLED is set to false THEN a
      --notify run SHALL scan nothing, hand no alert, exit 0 and write heartbeat status disabled;
      report mode and --fix SHALL ignore the switch and write no heartbeat (Mini's --fix sweep
      keeps its behaviour). Every other --notify run SHALL write
      ~/.organism/last_seen/pro.secrets_permissions_audit.json with status ok (rc 0) or error
      (blind or gateway refusal) and a note of counts only, never a path. The plist's Label is
      registered in organs_registry.yaml (G1).
    probe: >-
      pytest test_n16 + test_n17 + test_n18; infra/organ-conformance/check_organ_conformance.py
      rc 0 (0 non-conformant births); validate_organs_registry rc 0 (final gate round 1, 18:14Z)
assumptions:
  - text: >-
      tg_notify.py finds its own credentials when launched with only HOME and PATH (it reads
      ~/.nuzantara-secrets.env itself: token chain env -> that file -> relay -> spool).
    status: verified
    probe: scripts/tg_notify.py lines 29 and 63 (TG_SECRETS_FILE default) read at 16:5xZ
  - text: The first launchd run on Pro's current state hands no alert.
    status: verified
    probe: >-
      default-roots scan with PR1's code at 17:26Z — custody 7 files / 0 findings, report_only 0;
      the one ordinary finding (a 0644 .npmrc in a plugin marketplace checkout) raises no alert
