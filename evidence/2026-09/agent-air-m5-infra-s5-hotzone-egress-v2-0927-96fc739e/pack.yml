brief_ref: evidence/brief.yml
plan_ref: >-
  Gate report scratchpad/reports/gate-7471.md (REWORK-BUILD, 5 blockers) on
  the first S5 PR (#7471, head 2c917020e8) — team-lead mandate 2026-09-27
  to rebuild v2 from fresh origin/main.
lanes:
  - lane: s5-hotzone-egress-v2-build
    role: build
    seat: "session (M5, Sonnet 5 conducting)"
seat_override: >-
  Gear-3 diff edits the hot-zone gate list that itself decides when an
  external seat (codex/kimi/agy/gemini/qwen) may be dispatched on a diff —
  dispatching one of those same seats to review this exact diff would make
  generator and grader the same entity on the surface most in need of
  separation. No council or external seat was run. The fresh
  `harness/fable-gate` gate session that produced the REWORK-BUILD verdict
  cited in `plan_ref` already served as this PR's independent read; the
  next fresh gate on this head is the second opinion in place of a council
  quorum.
diff:
  net_lines: >-
    Content diff at the graded sha (v1's 3 commits cherry-picked onto fresh
    origin/main, then squashed with the rework into one commit): two
    workflow edits (case-block + guard-conformance wiring), the S5 spec
    section rewritten with full sweep disposition and a corrected timeline,
    3 new HOTZONE_PATTERNS/case-block entries (6 total, `.codex/hooks/*`
    dropped as dead coverage), the sync test extended with 2 compute_floor-
    based cases, and one tracked probe fixture. No production code path
    touched, no consumer's runtime behavior changed except the floor
    computation the two lists feed and guard-conformance's own step set.
    Exact line counts are not narrated here on purpose (S1 of this same
    spec, not yet code-implemented): the pack's own bytes are not excluded
    from the size term, so any figure written here drifts with every pack
    edit — the gate's own receipt records the `git diff --numstat` it
    observed.
  behaviour_change: >-
    Before this PR: `.claude/scripts/codex-spalla.sh`, `scripts/lib/
    spalla_redact.sh`, `.claude/hooks/codex-spalla-trigger.sh`,
    `scripts/codex_tri_llm_review.py`, `scripts/review_gate_run.sh` and
    `scripts/_redact_pii.py` all floored at gear 1. After this PR, a
    changed-file set containing any of the six floors at gear 3 on both
    `compute_floor()` (harness-floor.yml) and the bash case block
    (hot-zone-pr-gate.yml), and `scripts/tests/test_hotzone_lists_sync.py`
    — now actually invoked by guard-conformance.yml whenever a PR touches
    evidence_pack_lint.py, this test file, or hot-zone-pr-gate.yml — fails
    CI the moment the two lists diverge (proved by a local guilt run, see
    receipts).
receipts:
  - claim: >-
      Deterministic gear floor recomputed from THIS diff's full changed-file
      set (vs fresh origin/main merge-base) is 3, source path.
    cmd: >-
      MERGE_BASE=$(git merge-base origin/main HEAD); git diff --name-only
      --cached $MERGE_BASE > /tmp/s5v2-changed.txt; git diff --no-renames
      --cached --numstat $MERGE_BASE > /tmp/s5v2-numstat.txt; python3
      scripts/evidence_pack_lint.py --print-floor --changed-files-file
      /tmp/s5v2-changed.txt --numstat-file /tmp/s5v2-numstat.txt; python3
      scripts/evidence_pack_lint.py --print-floor-source --changed-files-file
      /tmp/s5v2-changed.txt --numstat-file /tmp/s5v2-numstat.txt
    result: "3\npath"
    exit: 0
    ts: "2026-09-27T00:07:00Z"
    seat: "session (M5, Sonnet 5 conducting)"
  - claim: >-
      GUILT via the REAL matcher (compute_floor, not set membership or a
      bash simulation) — each of the six S5 paths floors at 3 in isolation.
      INNOCENCE — an unrelated path (docs/CLAUDE.md) floors at 1.
    cmd: >-
      python3 -c "import sys; sys.path.insert(0,'scripts'); from
      evidence_pack_lint import compute_floor; paths=['.claude/scripts/codex-spalla.sh','scripts/lib/spalla_redact.sh','.claude/hooks/codex-spalla-trigger.sh','scripts/codex_tri_llm_review.py','scripts/review_gate_run.sh','scripts/_redact_pii.py']; print([compute_floor([p]) for p in paths]); print(compute_floor(['docs/CLAUDE.md']))"
    result: "[3, 3, 3, 3, 3, 3]\n1"
    exit: 0
