pii_scan: clean
pii_scan_note: >-
  Nothing in this diff transcribes client/OSINT data. The changed surface is
  a spec markdown file, a Python tuple of file-path strings, two bash/YAML
  workflow edits, and a pytest module — no client name, phone, email,
  KTP/NPWP or WhatsApp data anywhere in scope. Grepped the full diff for
  those patterns: zero hits.
bites:
  consumer: >-
    the harness floor on every future PR touching any of the six S5
    egress/redaction paths, and guard-conformance.yml's PR-triggered
    conformance job for the sync test itself
  where: ci
  observe: python3 scripts/evidence_pack_lint.py --print-floor --changed-files-file scripts/tests/fixtures/s5_hotzone_probe_changed_files.txt
  expect: "contains:3"
dissent:
  - seat: "session (M5, Sonnet 5 conducting) — self-review, no external seat dispatched (see seat_override)"
    objection: >-
      [P1, self-raised] scripts/_redact_pii.py now floors at 3 for ALL 14 of
      its callers, not just the egress-adjacent ones (receipts list them).
      Several — scripts/nb_generate_inventory.py, scripts/lint_model_cards.py,
      scripts/bot/build_deid_corpus.py — have nothing to do with an external
      seat. A contributor fixing an unrelated bug in one of those now needs a
      Gear-3 pack for a one-line change, which is a real ceremony cost this
      PR imposes on surfaces outside its own gap.
    status: CONFIRMED
    resolution: >-
      Verified directly via the grep in receipts: 14 total hits, 1 is the
      file itself, 2 (codex-spalla.sh, spalla_redact.sh) are already the
      known egress path, leaving 11 callers with nothing to do with an
      external seat. The cost is real and not overstated.
      Whether it is the RIGHT tradeoff is a judgment call, not a fact this
      session can settle unilaterally — stated explicitly in the spec's
      Enforcement section (the paragraph beginning "Cost, stated explicitly
      rather than left silent") rather than left for a future PR's author to
      discover the hard way, which is exactly how #7466's gap was found in
      the first place.
    disposition: >-
      Kept IN. The alternative — leaving the shared redaction engine at
      gear 1 — reproduces the exact defect class this spec exists to close
      (S5's own Gap: "a change that can quietly weaken the PII redaction...
      standing between repo content and an outbound cloud call"), and
      `scripts/_redact_pii.py` is precisely that logic, one layer down from
      the wrapper. A narrower rule (hot-zone only when the diff touches
      BOTH `_redact_pii.py` and an egress wrapper in the same PR) was
      considered and rejected: it would have let #7466's blocker 5 through
      again, since that PR touched only the redactor's caller-facing
      contract, not an egress wrapper file.
