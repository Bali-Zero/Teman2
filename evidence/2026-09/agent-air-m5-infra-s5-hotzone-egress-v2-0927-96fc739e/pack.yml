  - claim: >-
      GUILT RUN proving the sync test discriminates a real drift, and that
      restoring the entry returns the tree to a clean, green state (closes
      blocker 3 — the first PR's sync test guarded nothing on any actual
      PR because no workflow invoked it).
    cmd: >-
      cp .github/workflows/hot-zone-pr-gate.yml /tmp/hzpg-backup.yml; sed -i
      '' 's/scripts\/_redact_pii\.py)/some_other_thing_not_redact.py)/'
