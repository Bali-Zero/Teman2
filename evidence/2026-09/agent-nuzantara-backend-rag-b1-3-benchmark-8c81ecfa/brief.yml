objective: >-
  B1.3 of mandate B1 (BLUE). Freeze a hand-labelled evidence-sufficiency
  benchmark whose labels never select inputs (README D2): 58 synthetic cases,
  each storing query, actual context, provenance fixture, requested fact,
  supporting span or missing-fact explanation, stratum with precedence,
  nuisance booleans and expected gate outcomes; four constructed spec pairs
  per topic across both query and context languages; the golden rows whose
  contexts lack the fact recorded as relevant_insufficient with their
  correction deferred to B2.1 (D5, extended 3->5 by ruling I13). A reporting
  harness prints false abstention and false acceptance per cell, gate and
  stratum, the mandatory set and the independently drawn validation set
  reported separately. Nothing new is asserted about the scorer; its numbers
  on this base are the baseline.
appetite:
  wall_clock_hours: 5
  adversarial_rounds: 2
  tokens: 1500000
deadline_utc: "2026-09-11T21:59:55Z"
constraints:
  - >-
    Tests and docs only: tests/benchmarks/evidence_sufficiency/** (new), the
    structural test module (new), README §0 D5 one-line amendment (ruling I13
    condition 3). test_evidence_cross_language.py stays byte-identical. No
    backend/services/**, backend/core/**, no corner, no zantara_core.py, no
    migration, no network, no embedding or generation call.
  - >-
    Every case synthetic: no real person, client, phone, email or document
    number; decide() reads only query, context and provenance sources.
  - >-
    Labels reviewed case by case BEFORE the freeze by two families: Gemini 3.1
    Pro (second reader) and Codex (adversarial seat, which also drew the
    validation set); every disagreement dispositioned in pack.yml.
acceptance:
  - status: verified
    text: >-
      A1: WHEN the structural module runs on this head THEN validate() returns
      no error, every EN/ID cell holds at least three sufficient cases and one
      case of each negative stratum, every cell x gate x metric denominator is
      positive, and the manifest bytes match the pinned sha256.
    probe: >-
      pytest backend/tests/unit/services/rag/test_evidence_sufficiency_benchmark.py
      -> 59 passed
  - status: verified
    text: >-
      A2: WHEN every label field of every case is flipped in a deep copy THEN
      every decide() output is identical (labels never select inputs).
    probe: >-
      test_decide_output_is_identical_under_label_mutation in the same module
  - status: verified
    text: >-
      A3: WHEN the harness CLI runs THEN it prints the mandatory and the
      validation report separately, with the baseline recorded in pack.yml.
    probe: >-
      python -m backend.tests.benchmarks.evidence_sufficiency.harness --json
