decisions:
  - id: D-gear
    decision: >-
      Gear 3 = the deterministic floor: evidence_pack_lint.py --print-floor on the merge-base diff
      printed 3 with source SIZE (2224 added lines at the first measurement, all additions), and the
      judgement agrees: the PR files a benchmark verdict that a release decision will read.
  - id: D-no-row-identity-code
    decision: >-
      The window brief asked for scoring "under the row-identity contract" and for basing the
      monorepo work on W-K-SPEC's merge. W-K-SPEC closed with gate BLOCK/BLOCK, its branch
      agent/air-m5/ops/k2-row-identity (c3f4bb32) was never pushed and has no PR. Carrying its
      2,585 lines here would ship blocked work outside its own gate, so this PR is based on fresh
      origin/main and carries none of it. PR #6428 merged meanwhile (8664b1ba30), so origin/main
      has a scorer: its score is the canonical, reproducible one; the row-identity score is filed
      as a declared secondary, produced from a git archive of c3f4bb32.
  - id: D-prettier
    decision: >-
      The repo pre-commit hook refused the JSON as the scorer prints it (indent=1). The files were
      formatted with the repo's prettier; reproduction is therefore JSON-equal, not byte-identical,
      and the report and brief say so.
  - id: D-transcripts
    decision: >-
      The complete codex stdout of every round is dominated by the outputs of the commands the seat
      ran — dumps of repository files carrying staff e-mail addresses and high-entropy blobs. Filing
      it verbatim would copy personal data into a new artifact (builder contract section 4). The
      filed codex transcripts keep the seat's own messages, the first line of every command it ran,
      and its final verdict; e-mails are redacted; each header carries the sha256 of the complete
      unredacted stdout, kept on M5. agy transcripts are verbatim (no tools, no dumps).
  - id: D-q23
    decision: >-
      No field-predicate retrieval tier was built (brief deliverable 3, "if it fits the appetite").
      Measured instead: all 1,559 records of c69a260d carry the identical l4_bali.moratorium block
      and Q23's package is identical on all three runs, so the rule is already served; the failure
      is the answer framing. Recorded as a leftover naming Q23; no lexical re-weight.
