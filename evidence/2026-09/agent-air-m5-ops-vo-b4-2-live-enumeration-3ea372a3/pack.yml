# CI stages every per-PR pair under /tmp/evidence-check/evidence/{brief,pack}.yml.
# evidence_paths.py and harness-floor.yml therefore require this canonical staging reference.
brief_ref: evidence/brief.yml
seat_diversity: satisfied
seat_diversity_note: >-
  One build lane (this is a docs-only data-capture PR, not a multi-seat build). The review side
  is cross-family: a real codex (gpt-6-astra, xhigh, read-only sandbox) adversarial review ran
  directly against the committed README and the two evidence JSONs (not a git-diff-against-main
  dispatch, which in this worktree pulls in ~483 unrelated files from other merged slices and
  would have wasted the reviewer's budget on noise) and is the substance of this pack's dissent
  below — not a formality. D3's build-lane floor does not fire (single lane, no code).
seat_override: >-
  R9's Gear-3 council_run quorum (>=2 distinct COUNCIL_REVIEW_SEATS) does not apply cleanly here:
  this PR ships ZERO code and zero logic — the Gear-3 floor is driven entirely by the byte size
  of two verbatim-emitted evidence JSON files (research/operations/**, not hot-zone), not by
  review-worthy build complexity. One genuine cross-family adversarial review ran (codex
  gpt-6-astra, xhigh, read-only) against the actual content (every number and every claim in the
  README), raised 8 findings, all 8 disposed of (1 MEDIUM + 5 LOW confirmed and fixed, 2
  provenance-sourcing notes addressed by clarification) — a real generator!=grader pass on the
  artefact that matters, even though it is one seat rather than a 2-seat council. Declared here
  for the gate to accept or reject, not silently bypassed. Same reasoning as B4's own pack
  (evidence/2026-09/agent-air-m5-docs-vo-b4-report-159eeeba/pack.yml), which this PR's own task
  supersedes for G2.
plan_ref: >-
  MANDATE-vo.md's ratified "### Slice B4-2 (delta)" section: "the FULL 252-walk re-sweep, not a
  delta" — research/operations/2026-09-22-visa-oracle-live-enumeration/**. This PR is that
  artefact.
lanes:
  - lane: vo-b4-2-report-build
    role: build
    seat: "vo-builder-b4-2-report (Sonnet 5)"
  - lane: vo-b4-2-report-review
    role: review
    seat:
      "codex (gpt-6-astra, xhigh, read-only sandbox) — every claim in the README verified
      independently against the two JSON files and the repo directly, not graded from the text
      alone; 8 findings raised, all disposed of in the committed README"
diff:
  files: 5
  net_lines: '5 files, +68979/-0 (evidence/brief.yml +113, evidence/pack.yml +218, research/operations/2026-09-22-visa-oracle-live-enumeration/{README.md +574, prove-live-b4-2-full-sweep-report-20260922.json +11932, prove-live-b52-manifest-raw-main-1c6d2240-20260922.json +56142}) — from `git diff --numstat "$(git merge-base origin/main HEAD)"`, re-verified against the pushed head in the PR body''s Size section.'
  behaviour_change: >-
    None. This diff adds a README and two evidence JSON files under research/operations/, plus
    this evidence pack and brief, and ships no code into any deployed artifact. Nothing here is
    imported, executed, or served by any running process.
receipts:
