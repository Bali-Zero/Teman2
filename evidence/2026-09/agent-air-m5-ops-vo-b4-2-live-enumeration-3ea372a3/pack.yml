      notices, the 251-shared-label comparison, latency p50/p95/max/min) is re-derived directly
      from the walks[] arrays of the two committed JSONs using the STANDARD nearest-rank
      percentile definition, not copied from the conductor's mandate log.
    cmd: >-
      python3 - (self-contained script, pasted in the PR body's Number derivation section and in
      README.md's own Reproduction section, re-run after the adversarial-review fixes)
    result: >-
      B4 253 / B4-2 252 / shared 251; new ['edge/application_channel=OFFSHORE']; gone
      ['edge/application_channel=ONSHORE_CONVERSION', 'edge/wants_onshore_conversion=no'];
      verdicts {SUPPORTED_CANDIDATES: 172, NEEDS_INPUT: 6, NO_SUPPORTED_PATH: 31,
      HUMAN_REVIEW_REQUIRED: 42, TEMPORARILY_UNAVAILABLE: 1}; review_reasons sum 48;
      no_path_reasons sum 43; notices sum 59; p50/p95/max/min 273/1350/4601/203ms; 7 moved rows
    ts: "2026-09-22 (builder, M5; independently re-run by the codex reviewer)"
    seat: "vo-builder-b4-2-report (Sonnet 5); codex (gpt-6-astra)"
    exit: 0
  - claim: >-
      scripts/check_adversarial_review.py PASSes on the final README (R1 gate) after the
      adversarial-review fixes were folded in.
    cmd: "python3 scripts/check_adversarial_review.py --files research/operations/2026-09-22-visa-oracle-live-enumeration/README.md"
    result: "PASS — 1 research file(s) carry a valid adversarial review"
    ts: "2026-09-22 (builder, M5)"
    seat: "vo-builder-b4-2-report (Sonnet 5)"
    exit: 0
  - claim: >-
      Gear 3 is by SIZE, recomputed from the real numstat, not asserted: the path term does not
      fire (research/operations/** is not hot-zone).
    cmd: "python3 scripts/evidence_pack_lint.py --print-floor-source --changed-files-file <cf> --numstat-file <ns>"
    result: "(3, size)"
    ts: "2026-09-22 (builder, M5)"
