      apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-021.*.json
      apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-022.*.json
    result: "0 on all five existing files"
    ts: "2026-09-22 (builder, M5)"
    seat: "vo-builder-b4-2-report (Sonnet 5)"
    exit: 0
tests:
  - "None. This diff adds a README and JSON data files and changes no code path, so there is
    nothing to unit-test. The assertions that matter are the receipts above."
static:
  - "PII sweep over the two JSON files: no email address, no key named
    email/phone/passport/npwp/ktp/nik; a bare 10+-digit run returns 81 lines: 72 are the round
    threshold constant 1000000000 (investment/secondhome value fields), 3 are the enumeration
    edge label edge/investment_amount_usd=1000000000 (2 under walk_id, 1 under label), 1 is the
    manifest's own walksTotalExact, and 5 are uuid5-derived assessment_id values (each appearing
    once) — never an applicant-shaped number. Independently re-verified by the codex reviewer
    (79 manifest lines + 2 report lines = 81, same breakdown)."
runtime_proof: >-
  None applicable and none claimed — no code ships. The nearest thing to a prove-live is the
  live sweep the JSON files themselves already record (against nuzantara-rag.fly.dev, build
  514151cb7f4a5f26c20b0fbb767ce4bcc96a4bab) — that proves something about the SUBJECT of the
  report, not about this diff.
dissent:
  - seat: "codex (gpt-6-astra)"
    objection: >-
      MEDIUM — a first draft claimed review-gate/blacklist "carries the same
      disclosed_review_flags payload" in B4 and B4-2. False: B4's report entry (used in the
      comparison table) comes from a run against the pre-A3-M C3 manifest, which carries no
      disclosed_review_flags for this walk at all; BRIDGING_ADVERSE_HISTORY reads
      immigration.violation_history, not the flag, in both reports.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra)"
    objection: >-
      LOW — "unasked/omitted facts" misdescribed A6-2's seven changed inputs: the old facts were
      present in each walk's asked list with status UNKNOWN/UNVERIFIED, not NOT_ASKED. A6-2
      replaced that status with an explicit KNOWN value.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra)"
    objection: >-
      LOW — apparent contradiction between "A6-2 touches only the six secondhome/study labels"
      and "A6-2 rewrote 7 walk payloads" elsewhere in the same README.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra)"
    objection: >-
      LOW — "Manifest coverage (unchanged from B4/B5-1)" wrongly implied walksTotalExact was
      unchanged; it moved from 72,165,845,568,960 (B4) to 55,234,481,243,760 (B4-2). Only edge
      coverage (317/317, PROVEN) is actually unchanged.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra)"
    objection: >-
      LOW — the 41->42 HUMAN_REVIEW_REQUIRED arithmetic was wrong: a draft attributed the delta
      to "the six A6-2 rows moving in", but only 2 of 6 move INTO HUMAN_REVIEW_REQUIRED (the
      other 4 move into NO_SUPPORTED_PATH), and one row (review-gate/blacklist) moves OUT.
      Correct arithmetic 41 + 2 - 1 = 42; of the 42, 41 are non-criminal (not B4's 40, which
      describes B4's own sweep).
    status: CONFIRMED
  - seat: "codex (gpt-6-astra)"
    objection: >-
      LOW — "a constant Fly release" and "a browser produces today" overstated what two health
      probes (bounded to this run's own window) and the manifest (proven browser-shaped by B5-2,
      not exercised live by this sweep) actually establish.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra)"
    objection: >-
      LOW — the embedded reproduction script computed verdicts/latency/comparison but never
      computed review_reasons/no_path_reasons/notices despite the README presenting tables for
      all three.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra)"
    objection: >-
      The precise ruling timestamp and the "B3 v3 U9" anchor designation are not derivable from
      the two JSON files — they are provenance labels from the conductor's mandate record.
    status: PLAUSIBLE
  - seat: "codex (gpt-6-astra), second pass"
    objection: >-
      MEDIUM — a conductor addendum asked for the TEMPORARILY_UNAVAILABLE walk's own subsection
      and the 6 NEEDS_INPUT walks named with missing facts. The added text said the server's
      outage envelope "carries no explanatory code of any kind" — false: evaluate_path.py:637
      sets outage:{code, retryable:True}; enumerate_live.py's _reason_codes() never reads it, so
      the gap is in what the RUNNER persists, not what the SERVER sends.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra), second pass"
    objection: >-
      MEDIUM — classification=engine_verdict was described as confirming "a valid decision
      envelope"; the runner's own check (enumerate_live.py:654-672) is only HTTP 200 + valid
      JSON + decision-is-a-mapping, not a schema validation.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra), second pass"
    objection: >-
      LOW — the "full record, every field" table for review-gate/blacklist omitted
      attempts_history.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra), second pass"
    objection: >-
      LOW — the 6 NEEDS_INPUT walks' latencies were unlabelled rounded integers.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra), second pass"
    objection: >-
      LOW — the secondhome_basis mechanism cited fact-mapper.ts's conservative-default guards as
      the gating logic; the real question-selection gate is in flow.ts (~978-989), and two of
      the four secondhome facts use booleanFact (undefined branch at fact-mapper.ts:71-72), not
      integerFact (line 89), which applies only to the two monetary facts.
    status: CONFIRMED
  - seat: "codex (gpt-6-astra), second pass"
    objection: >-
      LOW — "asked" was treated as if every entry carries an engine-fact status; routing-only
      question IDs (trip_scope, review_gate) have none. Narrowed to the claim that holds: 5 of 6
      walks have exactly one UNKNOWN/UNVERIFIED engine fact matching the named target.
    status: CONFIRMED
residual_risks:
  - "All 8 dissent items were disposed of in this same PR (depth-1, no fix-of-a-fix needed) —
    none is an open residual risk in the shipped README. Listed as dissent because that is what
    actually happened to the first draft, not because anything remains wrong."
  - "This pack declares seat_override on R9 (2-seat council quorum) rather than satisfying it,
    for the reason stated in seat_override above. If the gate judges a single cross-family
    review insufficient for a data-capture PR at this size, that is exactly the call
    seat_override exists to surface rather than silently pass or silently fail."
  - "review-gate/blacklist's TEMPORARILY_UNAVAILABLE result is an OPEN, unresolved observation
    of this diff's own subject matter (the live sweep), not a residual risk of the diff itself —
    it is named in the README's own dedicated section and is not smoothed over. The codex
    reviewer independently confirmed no simpler cause is established by the records and that
    attributing it to A6-2/B5-2 would be unsupported."
