objective: |
  Land Slice B4-2 (MANDATE-vo.md): `research/operations/2026-09-22-visa-oracle-live-enumeration/`
  — a README plus the two evidence JSONs it reports on. This is the docs capture of the FULL
  252-walk re-sweep against the deployed `/api/visa-oracle/evaluate`, run by the conductor from
  the post-A6-2/post-B5-2 manifest (merge commit `1c6d2240044dbd8fb691006019d9762ae6ffb041`),
  build `514151cb7f4a5f26c20b0fbb767ce4bcc96a4bab`, rule pack seq 22, zero harness reds. Every
  number in the README is re-derived from the two JSONs by a script (pasted in this PR's body,
  not committed — a one-shot reproduction aid), never copied from the conductor's mandate log.

  Gear 3 by SIZE, deterministically: 68,351-line churn (almost entirely the two evidence JSONs
  — the 252-walk report and its 252-walk manifest), measured on this head via `git diff
  --numstat "$(git merge-base origin/main HEAD)" HEAD`, against the SIZE_GEAR3_THRESHOLD —
  `evidence_pack_lint.py --print-floor-source` returns `(3, "size")`; the path term does not
  fire (`research/operations/**` is not a hot-zone pattern).
constraints:
  - "No code changes anywhere. Docs-only PR: one README plus two JSON files, already present in
    the worktree from the conductor's own live sweep run (not copied from a kit directory this
    time — B4-2's manifest/report were emitted directly into this worktree by the conductor's
    own dispatch, so there is no separate kit source to `cmp -s` against; the receipt below
    instead re-derives every reported number straight from the committed JSONs)."
  - "No client PII, no applicant-shaped data: every walk is synthetic
    (`traffic_source=synthetic_driver`). Confirmed by grep over both JSON files: zero email
    matches, zero email/phone/passport/npwp/ktp/nik key names, and every 10+-digit run
    individually accounted for (the constant 1000000000 investment amount, walksTotalExact, an
    enumeration edge label, or a uuid5 assessment_id)."
  - "The comparison table against B4 is MEASURED (set intersection/difference over `walk_id`
    between the two reports' `walks[]` arrays), never transcribed from the conductor's mandate
    log, per the ratified Slice B4-2 text."
  - "PR stays UNARMED. The builder does not merge, does not run `gh pr merge`."
objective_note: |
  A real codex (`gpt-6-astra`, xhigh, read-only sandbox) adversarial review ran against the
  committed README and the two evidence JSONs directly (not a polluted git-diff-against-main —
  this worktree's committed diff vs `main` pulls in ~483 unrelated files from other merged
  slices, so the review was pointed at the artefact files by path instead). See this pack's
  `dissent` for the findings and their disposition.
acceptance:
  - text: >-
      WHEN every number/table in README.md (verdict distribution, review_reasons,
      no_path_reasons, notices, the 251-shared-label comparison, latency p50/p95/max/min) is
      recomputed directly from the walks[] arrays of the two committed JSONs, it SHALL match
      what the README states.
    status: verified
    probe: >-
      python3 (self-contained script, pasted in the PR body's Number derivation section and in
      README.md's own Reproduction section) -> verdicts SUPPORTED_CANDIDATES 172 /
      HUMAN_REVIEW_REQUIRED 42 / NO_SUPPORTED_PATH 31 / NEEDS_INPUT 6 / TEMPORARILY_UNAVAILABLE 1
      = 252 total; shared labels 251, 1 new (edge/application_channel=OFFSHORE), 2 gone
      (edge/application_channel=ONSHORE_CONVERSION, edge/wants_onshore_conversion=no); 7 moved
      rows; p50/p95/max/min = 273/1350/4601/203ms
  - text: >-
      WHEN the two JSON files are swept for an email pattern, a key named
      email/phone/passport/npwp/ktp/nik, and a bare 10+-digit run, the first two SHALL be zero
      and the third SHALL be individually accounted for (no applicant-shaped number).
    status: verified
    probe: >-
      grep -Eic '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' *.json (0 hits both files);
      grep -Eio '"(email|phone|passport|npwp|ktp|nik)"' *.json (0 hits); grep -Ehn
      '[0-9]{10,}' *.json | sed -E 's/^[0-9]+://; s/^ +//; s/,$//' | sort | uniq -c | sort -rn ->
      81 lines total: 72 are the round constant 1000000000 (investment/secondhome value fields),
      3 are the enumeration edge label edge/investment_amount_usd=1000000000 (under walk_id and
      label), 1 is the manifest's own walksTotalExact, 5 are uuid5 assessment_id values
      (each appearing once) — no passport-shaped or applicant-shaped number
  - text: >-
      WHEN `scripts/check_adversarial_review.py --files README.md` runs, it SHALL PASS: a
      generator != grader review by a seat != the authoring session.
    status: verified
    probe: >-
      python3 scripts/check_adversarial_review.py --files
      research/operations/2026-09-22-visa-oracle-live-enumeration/README.md
  - text: >-
      WHEN `grep -c "process.application_channel"` runs over the production rule pack source
      and signed files for sequences 020/021/022, it SHALL return 0 for all of them — the
      context claim for why the application_channel label churn does not explain the verdict
      distribution.
    status: verified
    probe: >-
      grep -c "process.application_channel"
      apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-020.*.json
      apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-021.*.json
      apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-022.*.json
      -> 0 on every file (020.signed/020.source/021.source/022.signed/022.source; no
      021.signed exists — seq-21 is unsigned/unactivated per test_seq21_pack.py's own docstring)
risks:
  - "The two evidence JSONs (the 252-walk report and its manifest) dominate the churn and are
    the reason this floors at Gear 3 despite being a pure data capture — nothing in this diff is
    logic, so the Gear-3 label reflects diff size, not review complexity. Named here so the
    grader does not spend budget looking for code-review-shaped risk that isn't present."
  - "One of the 7 moved comparison rows (review-gate/blacklist -> TEMPORARILY_UNAVAILABLE) is
    reported as UNEXPLAINED — not attributed to A6-2 (which touches only 7 named
    secondhome/study labels, none of which is review-gate/blacklist) and not attributable to
    B5-2 (a library-import refactor the conductor's own manifest diff proved payload-neutral).
    Named as an open, unresolved observation in the README's own dedicated section rather than
    folded into the A6-2 explanation or silently smoothed over."
  - "This pack declares `seat_override` on R9 (2-seat Gear-3 council_run quorum) rather than
    satisfying it — same reasoning as B4's own pack (evidence/2026-09/
    agent-air-m5-docs-vo-b4-report-159eeeba/pack.yml): zero code ships, the floor is driven
    entirely by evidence-JSON byte size, and one genuine cross-family adversarial review
    (codex) ran against the actual artefact content rather than being skipped."
grader: |
  Independent seat, generator != grader. The authoring session cannot gate its own docs capture.

  Attack surface for review: (1) re-run the derivation script against the two committed JSONs
  and confirm every number; (2) confirm the 251-shared-label set math (intersection/difference)
  independently; (3) check whether the "review-gate/blacklist is unexplained" framing is honest
  — could B5-2 or A6-2 plausibly explain it after all, or is a third cause more likely (an
  engine-side transient, unrelated to either PR)?; (4) confirm `check_adversarial_review.py`
  genuinely passes on the current committed README, not a stale draft; (5) confirm the
  `grep -c process.application_channel` context claim is run over the right files (both
  `.source.json` and `.signed.json` where each exists).
