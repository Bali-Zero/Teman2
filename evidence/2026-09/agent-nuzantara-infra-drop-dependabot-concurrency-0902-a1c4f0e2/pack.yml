residual_risks:
  - risk:
      "The concurrency headroom evidence comes from a 25-second burst window (300 runs sampled, 83 jobs),
      not a week-long trace. It demonstrates headroom for what was observed; it does not rule out a heavier
      burst elsewhere in history.

      "
    accepted_because:
      "The settling measurement qwen3.7-max named — org-wide peak concurrency — is bounded
      by the fact that the org holds exactly one repository, so this repo's peak IS the org's peak.

      "
  - risk:
      "Removing the group raises a full Dependabot PR from ~20 jobs to ~46. A simultaneous 13-PR burst
      would be ~598 against a 500 ceiling.

      "
    accepted_because:
      "GitHub queues past the ceiling rather than dropping, so the failure mode becomes
      lateness rather than a silently missing required check. Lateness is visible; absence is not.

      "
  - risk:
      "A better design exists and is NOT in this PR: routing merge_group runs to a dedicated runner
      group so the critical lane cannot queue behind bulk work (proposed by qwen3.7-max).

      "
    accepted_because:
      "Separate concern, separate PR. This PR removes a mechanism that silently drops required
      checks; it does not claim to make the merge queue optimal.

      "
  - risk:
      "The merge queue uses grouping_strategy ALLGREEN with batches of 4, so one failing batch-mate
      ejects the others (observed on PR 5517 tonight). This PR neither causes nor cures that.

      "
    accepted_because:
      Pre-existing and unrelated to the actor-keyed group; recorded so the next reader does
      not attribute an ejection to this change.
  - "The review lane ran under zsh, which does NOT word-split an unquoted $VAR in `for x in $VAR` — such
    a loop runs ONCE with the whole string as a single token and its comparisons quietly succeed. Any receipt
    anywhere in this repo written as `for f in $(...)` may carry that failure mode. The receipts here avoid
    it by piping into `while read` or `xargs`. Same family as the actionlint invocation that exited 2 on
    a flag-syntax error earlier in this PR: a shell-level mistake that reads exactly like a lint verdict."
