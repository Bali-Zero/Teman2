    evidence: Zero occurrences of base_ref across all 21 group expressions.
    resolution: REFUTED
  - seat: agy (Gemini 3.1 Pro)
    objection:
      "A 598-job burst against a 500 ceiling starves the merge queue — no priority lane for merge_group
      — and the ceiling is org-wide, so it starves other repositories too.

      "
    status: CONFIRMED
    evidence:
      "CONFIRMED: the ceiling is per-organization and merge_group gets no scheduling priority (both
      models agree). REFUTED on consequence: at the ceiling GitHub QUEUES rather than drops (qwen3.7-max,
      correcting Gemini), and the org contains exactly one repository, so there is no other consumer to
      starve. The 598 figure requires all 13 Dependabot PRs to push simultaneously; they are created on
      staggered weekly schedules.

      "
    resolution: PARTLY CONFIRMED, PARTLY REFUTED
  - seat: agy (Gemini 3.1 Pro)
    objection:
      "Grouping Dependabot updates (the counter-proposal to disabling it) creates a poison-pill:
      one broken member blocks the whole group, and can trap a security patch behind it.

      "
    status: CONFIRMED
    evidence:
      "Not part of this PR. The counter-proposal is narrowed accordingly: group only tightly coupled
      families (github/codeql-action/*), never catch-all per ecosystem.

      "
    resolution: CONFIRMED — accepted, and it changed the plan
  - seat: tp1 qwen3.7-max
    objection:
      '"A PR was dropped from the queue today WITH the group still in place" proves baseline fragility
      but does not show that adding hundreds of queued jobs is harmless — it assumes that because a timeout
      problem exists, deepening the queue cannot worsen it.

      '
    status: CONFIRMED
    evidence:
      "The argument is withdrawn. The case for removal rests on the measured ceiling headroom, the
      queue-not-drop behaviour, and the single-repo org — never on pre-existing fragility.

      "
    resolution: CONFIRMED — a fallacy in the author's own reasoning, accepted and withdrawn
  - seat: tp1 qwen3.8-max
    objection:
      "Poison-batch livelock: today a broken Dependabot PR is silently blocked and never enters
      the queue, so it cannot poison a batch. After this change it enters, fails, and under ALLGREEN takes
      three innocent PRs down with it; they re-enter after the 15-minute wait, get batched with the same
      unfixed PR, and fail again — a repeating ejection loop.

      "
    status: RETRACTED
    evidence:
      "(1) Zero of the 11 open Dependabot PRs are armed (autoMergeRequest null, mergeQueueEntry
      none, all 11 measured). A PR enters the queue only when armed; this diff makes their checks RUN without
      queueing any of them. (2) Under ALLGREEN, GitHub's own parameter description says each PR's cumulative
      merge commit is tested; the failing entry is ejected and DOWNSTREAM entries are rebuilt in place,
      not ejected. (3) The empirical anchor was misread by the author — see the correction below. The caution
      survives as a rule for ARMING TIME (Agent PR Contract rule 5), not as a property of this diff. Three
      of the 11 do carry real red: PR 5454 (9 failures), PR 5451 (Harness floor recompute), PR 5444 (CodeQL
      both legs) — poison only when someone arms them.

      "
    resolution: REFUTED on three independent grounds
  - seat: codex gpt-5.6-sol
    objection:
      "security.yml keeps the group `security-${{ github.ref }}` but acquired two schedules and
