what_changed: |
  Two test files plus one workflow line: `scripts/tests/test_wa_team_promises_sql_crosscheck.py`
  (+353/-8), `scripts/tests/test_wa_team_promises_real_pg.py` (+79), and
  `.github/workflows/wa-team-promises-tests.yml`'s `FLOOR=` (122 -> 158).

  C1: `_parse_column_def`'s type fallback now raises `UnrecognizedSqlShapeError` on any
  `raw_type` not in `_TYPE_ALIASES`, closing the MECHANISM rather than patching the 14
  measured instances one by one.

  C2: a new shared helper `_claim_implicit_relation` claims `<table>_pkey` (any PRIMARY KEY,
  CREATE body or ALTER-added) and `<table>_<col>_seq` (any serial-family column, CREATE body
  or ALTER-added) in `occupied_relations` — S6(a)'s namespace, now covering implicit
  relations too. The helper also rejects outright when the derived name is already occupied
  or exceeds 63 bytes, since PG's own retry-with-suffix and truncation algorithms cannot be
  reproduced faithfully by a static parser (S1/S6(b)'s fail-closed precedent). A second
  PRIMARY KEY in one CREATE body is also rejected (PG: "cannot have more than one primary
  key").

  C3: two discriminating tests added for shapes already correct on #7439's merged head but
  previously untested — an uppercase index name vs. a lowercase table name (proving
  `.lower()` folding is load-bearing), and a `public.`-qualified 64-byte table name (proving
  the length check runs on the POST-strip name, not the schema token).

  C4: `FLOOR=158`, this PR's own REAL_PG-unset passed count (up from 122, which #7439's own
  gate deliberately left stale to avoid paying Gear 3 twice — this PR pays it once).

  BEFORE opening the PR: a two-round Gear-3 council on this session's own diff.
  Round 1 (full diff, both seats dispatched in parallel, env-scrubbed/no-tools): both
  independently found `_parse_alter_table` discarded `_parse_column_def`'s `primary_key`
  return value entirely — an ALTER-added PRIMARY KEY column could still fabricate the exact
  phantom `<table>_pkey` table C2 exists to prevent. codex additionally measured two more
  real defects (implicit-name truncation/collision unmodeled; two-columns-each-PRIMARY-KEY
  unrejected) and, with kimi, noted C1's `FOO` case lacked a real-PG pairing. All fixed in
  the same PR: `_claim_implicit_relation` (used by both CREATE and ALTER paths), the
  two-column-PK guard, and a real-PG `FOO` case. Round 2 (delta diff only): kimi returned GO
  with one question (is the new claim-then-raise non-idempotent in a way that
  false-positives an idempotent re-CREATE of a PK-bearing table? — verified NO, `already_
  created` returns before the claims run at all; a dedicated innocence test now pins this).
  codex's delta verdict is recorded in receipts/dissent below.

proof: |
  Full corpus, clean venv (Python 3.11, `pip install pytest "pytest-asyncio>=1.4.0"
  "asyncpg>=0.31.0"` — CI's exact install line):
    REAL_PG unset -> 158 passed, 29 skipped
    WA_TEAM_PROMISES_REAL_PG=1 (throwaway PG17 17.10 cluster) -> 187 passed, 0 skipped

  The floor, from the real tool (hot-zone path, `.github/workflows/*`):
    evidence_pack_lint.py --print-floor --changed-files-file <changed>   -> 3

  FLOOR discipline, the verbatim step body under `bash -e` (GitHub's own default shell),
  clean venv on PATH:
    FLOOR=158 -> "wa_team_promises corpus: 158 passing cases (floor 158)", rc 0
    FLOOR=159 -> "::error:: 157 below the floor of 159" (measured against the PRE-final-test
      count; re-confirmed at 158/159 after the idempotent-innocence test was added)

  PG truth, all measured directly against a throwaway PG17 17.10 cluster before writing any
  test (never assumed): INT2->smallint, FLOAT4->real, FLOAT8->double precision,
  DECIMAL/DEC->numeric, TIMESTAMP->"timestamp without time zone", TIME->"time without time
  zone", TIMETZ->"time with time zone", SERIAL2/4/8->smallint/integer/bigint NOT NULL,
  BPCHAR/NCHAR->character, VARBIT->"bit varying", FOO->UndefinedObjectError; a PRIMARY
  KEY/serial column's implicit `_pkey`/`_id_seq` land with the SAME relkind after a later
  same-named `CREATE TABLE IF NOT EXISTS` (proving PG's own no-op); a 60-byte table name's
  derived `_pkey`/`_id_seq` truncate to exactly 63 bytes (not 65/67); an already-occupied
  `t_pkey` forces PG to allocate `t_pkey1` instead; two columns each PRIMARY KEY is a hard
  PG error ("cannot have more than one primary key").

  MUTATION VERIFICATION, 9 independent rounds, each isolated on a `cp` backup and restored
  byte-identical afterward (`diff -q` confirmed after every restore):
    1. C1 fallback reverted to `.get(raw_type, raw_type.lower())` -> 15 guilt tests red
       (14 parametrized keywords + generic FOO)
    2. C2 CREATE-body implicit-relation claims removed -> 2 guilt tests red (pkey, seq)
    3. C2 ALTER-added-serial claim removed -> 1 guilt test red
    4. C3(a) `.lower()` on the claimed index name removed -> 1 guilt test red
    5. C3(b) length check moved to the schema token -> 1 guilt test red
    6. ALTER-added-PK claim removed (the council-round finding) -> 1 guilt test red
    7. `_claim_implicit_relation`'s length/collision guard removed -> 2 guilt tests red
    8. Multi-PK-per-body rejection removed -> 1 guilt test red
    9. (implicit, via #2/#6) already_created short-circuit before the claims -> confirmed
       correct by direct call (kimi's delta question), now also pinned by a dedicated test

  Cross-family council, both independently dispatched with a scrubbed/no-tools environment,
  fed only the diff and the gate's own findings (no repo dump, no PII):
    codex-gpt-5.6-sol  -> round 1: REWORK (C2 real, C1 minor gap); delta: see receipts
    kimi-code/k3       -> round 1: GO on C1/C3/C4, NO-GO-pending-fix on C2; delta: GO

dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      "Round 1: `_parse_alter_table` discards `primary_key` entirely — an ALTER-added
      PRIMARY KEY column can still fabricate the phantom `<table>_pkey` table C2 exists to
      prevent. Additionally: PG's implicit-name allocator truncates the FULL derived name to
      63 bytes and retries a taken name with a numeric suffix, neither modeled; two columns
      each PRIMARY KEY in one CREATE body should be rejected; C1's real-PG cases omit FOO."
    status: CONFIRMED
    resolution:
      "All four fixed in this PR: `_claim_implicit_relation` (shared helper, used by both
      `_parse_create_table` and `_parse_alter_table`, rejecting on >63 bytes or an
      already-occupied name); a genuinely new ALTER-added PRIMARY KEY column now claims
      `<table>_pkey` the same way; a second PRIMARY KEY in one CREATE body is rejected; a
      real-PG FOO case added. Each mutation-verified independently."
  - seat: codex-gpt-5.6-sol
    objection: "Round 1: C1's real-PG pairing for FOO exists only as a docstring claim on the static guilt test, not an executable real-PG case, contrary to the gate's literal wording."
    status: CONFIRMED
    resolution: "Added `C1-foo-unknown-type-pg-errors-parser-must-also-reject` to `_C1_REAL_PG_CASES`, asserting PG's `UndefinedObjectError` truth and the parser's rejection in the same case."
  - seat: kimi-code/k3
    objection: "Round 1: same ALTER-discards-primary_key gap as codex, found independently."
    status: CONFIRMED
    resolution: "Same fix as codex's finding above — both seats converged on the identical root cause without seeing each other's answer."
  - seat: kimi-code/k3
    objection:
      "Delta round: `_claim_implicit_relation` is non-idempotent (raises on a repeat claim)
      where the old `occupied_relations.add` was idempotent. Does an idempotent re-CREATE of
      a table that already has a PRIMARY KEY (`CREATE TABLE IF NOT EXISTS t (id INT PRIMARY
      KEY, ...)` run twice) now false-positive, since the second body would re-derive and
      re-claim the SAME `<table>_pkey` name?"
    status: RETRACTED
    resolution:
      "No: `already_created` (checked against the table name itself, at the very top of
      `_parse_create_table`) returns BEFORE the implicit-relation claims run at all — a
      genuine PG no-op never reaches `_claim_implicit_relation`. Confirmed by direct call
      (`parse_declared_columns` on the exact SQL kimi posed, no raise, correct column set)
      and now pinned by a dedicated innocence test rather than left implicit."
  - seat: codex-gpt-5.6-sol
    objection:
      "Delta round: verify all four round-1 findings are actually closed on the delta head,
      and check whether FLOOR=158 is still correct after the idempotent-innocence test."
    status: RETRACTED
    resolution:
      "VERDICT GO. All four round-1 findings confirmed closed on HEAD 96800c4f97:
      ALTER-PK registration (`_parse_alter_table` line 770, covered by
      `test_guilt_c2_implicit_pkey_from_alter_added_column`); truncation/collision guard
      (`_claim_implicit_relation` line 203, shared by CREATE and ALTER, PG's full-name
      truncation + numeric-suffix retry confirmed against PostgreSQL's own source); a second
      PRIMARY KEY rejected (`_parse_create_table` line 697, covered by
      `test_guilt_two_columns_each_primary_key_is_rejected`); FOO's real-PG case present
      (`test_wa_team_promises_real_pg.py:267`). FLOOR=158 confirmed correct: 187 tests
      collected, 29 real-PG opt-in, 158 non-skipped — the prior 157 was stale before the
      idempotent-innocence test was added. Non-blocking notes (both resolved before shipping,
      not defects of the delta): ALTER/truncation/multi-PK still lack dedicated real-PG cases;
      the branch was one commit behind and the commit subject still read `WIP:` at review
      time."

