runtime_proof: >-
  None applicable and none claimed — no code ships. PROVELIVE-A3P-B-REPORT-7234.md (not
  committed here) already ran the full prove-live sequence for #7234 (9/9 targeted probes, a
  browser dead-end check, and this same 252-walk sweep against production); this PR's own
  artefact is a docs capture of that sweep's output, not itself a prove-live action.
dissent:
  - seat: "vo-sweep-pack (Sonnet 5), self-review — first commit attempt"
    objection: >-
      The refuter task file's excerpt embedded `rule_pack.payload_sha256` (a 64-char content
      hash) on all 252 rows of both a9-excerpt.json and b43-excerpt.json. The pre-commit hook's
      paid-endpoint-ban guard (`scripts/check_ban_predicates.py`, P3 detect-secrets) flagged the
      repeated high-entropy hex string and blocked the commit
      (`evidence/.../refuter-runs/refuter-task.txt:68`).
    status: CONFIRMED
    reason: >-
      Rebuilt the excerpt without the payload_sha256 field (kept walk_id/engine_state/sequence/
      http_status only) and rewrote the task file's CLAIMED section to mark that one field's
      uniformity claim explicitly OUT OF SCOPE for the council, verified separately by the
      builder against the two full committed JSONs instead
      (`{w["rule_pack"]["payload_sha256"] for w in walks}` == one member, `e5f791b5…72204`, on
      both files). Re-ran both TP1 seats against the corrected task file; both returned PASS, 0
      findings. No README claim was ever wrong — the excerpt SHAPE was the defect, cured before
      either seat saw the final version. Unlike #7230 (which omitted the same field silently and
      let two seats discover the gap as a BLOCK finding, later RETRACTED), this round's task
      file tells the seats up front which claim is out of scope and why.
residual_risks:
  - "Both review seats returned PASS/0 findings on the fully-completed pass — the excerpt this
    round carried every field either claim under review rests on (walk_id, engine_state,
    sequence, http_status), and the one field pulled from it (payload_sha256, removed after it
    tripped detect-secrets as a repeated high-entropy value) was named explicitly out-of-scope
    in the task's own instructions rather than omitted silently, so no finding traces to
    excerpt-narrowness the way all 3 of #7230's dissents did. That also means this council did
    not exercise the excerpt-narrowness failure mode at all; if a future addendum's claims rest
    on fields this excerpt shape omits (e.g. review_reasons/no_path_reasons breakdowns, or
    payload_sha256 itself if a future rule-pack activation makes it non-uniform), that gap
    would need a wider excerpt again — or a non-hex-shaped encoding of the hash — not an
    assumption that this shape is universally sufficient."
  - "This pack SATISFIES R9's council_run quorum (2 distinct COUNCIL_REVIEW_SEATS, both
    ok:true) rather than declaring seat_override — codex-gpt-5.6-sol and kimi-code/k3 were
    directly probed and both TIMEOUT'd (arsenal_probe.py --table, 15s ceiling per seat) before
    falling back to tp1-deepseek-v4-pro — the substitution is measured, not assumed, and named
    in seat_fallback_reason, same as #7230's identical substitution the same day."
