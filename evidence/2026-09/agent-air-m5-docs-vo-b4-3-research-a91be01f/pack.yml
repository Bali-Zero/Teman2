  - lane: vo-b4-3-research-review-2
    role: review
    seat: "tp1-deepseek-v4-pro (reserve, substituting for an unavailable titolare — see seat_fallback_reason) — same task file; VERDICT PASS, 0 findings. Two earlier attempts ran out of budget mid-reasoning (0-202 answer chars, seat ALIVE not dead per tp1_call.py's own diagnostic) — the first against an earlier task-file revision that still embedded payload_sha256 per row (before that field was pulled to clear detect-secrets); the final attempt, against the corrected task-file at --effort low --timeout 280, completed in-budget"
