  answered live (arsenal_probe.py --table: LIVE, 2549ms) and is counted as-is — no substitution
  needed for it. The other two titolari, codex-gpt-5.6-sol and kimi-code/k3, were probed
  directly this task (same arsenal_probe.py --table run, 2026-09-24T17:04:52Z) and both
  TIMEOUT'd (codex 15044ms, kimi 15087ms) with no answer, so tp1-deepseek-v4-pro (reserve bench)
  substitutes for one of them, counted toward quorum alongside the live titolare
  tp1-qwen3.8-max. Quorum (2 distinct COUNCIL_REVIEW_SEATS, both ok:true) is met without
  invoking `seat_override` — R9 is SATISFIED, not waived. Same substitution #7230 made on the
  same day, for the same reason (both titolari unavailable at probe time).
seat_diversity: satisfied
seat_diversity_note: >-
  One build lane (docs-only data-capture PR, same shape as the A9 precedent
  evidence/2026-09/agent-air-m5-docs-vo-a9-sweep-research-1648e458/). The review side is
  TWO cross-family TP1 seats (tp1-qwen3.8-max, tp1-deepseek-v4-pro), each run independently
  against the same task file — the README's B4-3-addendum claims checked against two JSON
  excerpts (252-walk walk_id/engine_state/sequence/http_status fields) derived by script from
  the two committed report JSONs. `rule_pack.payload_sha256` was left out of the excerpt (it
  tripped the paid-endpoint ban's own detect-secrets predicate as a repeated 64-hex
  high-entropy string) and marked explicitly out-of-scope in the task's own instructions, with
  its uniformity claim verified separately by the builder against the full JSONs — not omitted
  silently the way #7230's excerpt omitted the same field. Both seats' full output is journaled
  in council.jsonl.
plan_ref: >-
  team-lead dispatch (this session, 2026-09-24), task vo-b4-3-research — land the B4-3 live
  re-sweep next to the A9 one, per kit/PROMPT-builder-b4-3-research.md, which names PR #7230's
  three gate rounds (GATE-SWEEP-REPORT-7230.md) as binding lessons not to repeat: (1) every
  per-PR evidence dir from evidence_paths.py with brief.yml AND pack.yml in the SAME diff,
  never the root evidence/brief.yml; (2) every by-command README claim pinned to an IMMUTABLE
  ref, re-run before commit; (3) every number re-derived by a fresh script from the JSONs, not
  transcribed; (4) R9 council fed the README claims AND the fields they rest on, so no finding
  traces to an excerpt too narrow to check the claim (the#7230 root cause of all 3 of its
  RETRACTED dissents) — this pack's task instructions therefore name explicitly which claim
  (payload_sha256 uniformity) is out of the council's scope and why, rather than #7230's silent
  omission of the same field.
