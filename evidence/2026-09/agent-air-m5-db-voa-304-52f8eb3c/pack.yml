dissent:
  - seat: codex-gpt-5.6-sol (O1 F1)
    objection: "The rollback section runs its ledger-owned DROP FUNCTION and ALTER TABLE as backend_rag_v2 under option D and fails 42501."
    status: CONFIRMED
    resolution: "CURED in 69a1ee2c15: the rollback carries the same bracket; D-shape rollback test and rollback guilt test added. Also raised by gemini-3.1-pro-high."
  - seat: codex-gpt-5.6-sol (O1 F2)
    objection: "The PG15 MEMBER branch has no coverage."
    status: CONFIRMED
    resolution: "CURED by evidence: D shape run on PostgreSQL 15.19 (9 passed) and mutation M5 (PG15 D red, PG17 green)."
  - seat: codex-gpt-5.6-sol (O1 F3)
    objection: "A superuser with ungranted production roles present is switched to backend_rag_v2 by the closing block and fails 42501 on the next CREATE."
    status: CONFIRMED
    resolution: >-
      CURED in 69a1ee2c15 by the Imperatore's decision #12 (2026-09-12): each bracket stores current_user in the
      transaction-local GUC garuda.migration_304_resume_role before RESET ROLE and restores backend_rag_v2 only if that
      stored value is backend_rag_v2. This deviates from the literal shape in the pinned spec (§3 row W1S), which is
      left untouched here; the spec correction is a docs PR after merge. Under option D the behaviour is identical
      (mutation M4 keeps every migrator test green and turns only the superuser-with-roles test red).
  - seat: codex-gpt-5.6-sol (O1 F4)
    objection: "The disposable fixture grants memberships to and resets config of pre-existing roles."
    status: CONFIRMED
    resolution: "CURED: the fixture skips when any of the three role names exists and drops only the roles it created."
  - seat: codex-gpt-5.6-sol (O2)
    objection: >-
      S4: under ALTER ROLE backend_rag_migrator SET role = backend_rag_v2, assume_runtime_role returns at its idempotence
      branch, so the refusal promised before any statement never runs; the 304 test passes on the late owner-transfer failure.
    status: CONFIRMED
    resolution: >-
      DEFERRED, pre-existing (W1R condition 1, ledger row 2026-09-11), out of this perimeter by the Imperatore's decision #10.
      304 stays correct in that shape: it fails atomically with no table and no ledger row (test). The discriminator for
      the runner fix is the SAVEPOINT/RESET ROLE probe measured here; the ledger row's pg_settings.reset_val does not exist.
  - seat: codex-gpt-5.6-sol (O2)
    objection: "The PG15 MEMBER proof is local; in CI the disposable-cluster tests skip, so a MEMBER regression can stay green."
    status: CONFIRMED
    resolution: >-
      ACCEPTED AS A LIMIT: creating the literal production role names in the shared CI cluster would change the shape of
      other tests; CI covers the superuser/roles-absent shape and applies 304 in the apply-all chain. Local PG15 and PG17
      runs are recorded above.
  - seat: gemini-3.1-pro-high
    objection: "garuda_document_review_fields has no mutation guard; an UPDATE or DELETE on unexpired child rows succeeds."
    status: PLAUSIBLE
    resolution: "NOT ADOPTED: the absence is the declared design of #5526 (rows cascade with the parent); schema behaviour of the store belongs to W1W."
  - seat: tp1-glm-5.2
    objection: "pg_has_role(r, r) is false; ROLLBACK does not undo SET ROLE; RESET ROLE ignores ALTER ROLE ... SET role."
    status: RETRACTED
    resolution: "Refuted by measurement on PG 15.19 and 17.10 (receipt 'role semantics'); retracted for this pack."
  - seat: tp1-qwen3.8-max
    objection: "Under option D CREATE TABLE, the owner transfer and the rollback DROP FUNCTION all run as backend_rag_v2 and fail; the policy_scope CHECK pattern cannot match."
    status: RETRACTED
    resolution: "Contradicted by real executions (D shape 9 passed on PG15 and PG17; CI shape passed); the seat ignored RESET ROLE."
  - seat: tp1-qwen3.8-max
    objection: "The owner-transfer block swallows insufficient_privilege and relies on a re-check; the rollback EXISTS check runs at READ COMMITTED."
    status: PLAUSIBLE
    resolution: "NOT ADOPTED: both are the unchanged shape of #5526/301; the re-check raises in the same transaction; rollback is not in the release path."
  - seat: kimi-code/k3
    objection: "The single-DSN runtime shape (production today) is untested."
    status: CONFIRMED
    resolution: "ADOPTED: test added in 6fddb34538 — fails with 'still owned by', no table, no ledger row."
  - seat: kimi-code/k3
    objection: "Second forward record is redundant; rollback narrows a pre-widened CHECK when no GARUDA_DOCUMENT row exists; resume blocks are no-ops when the role cannot be assumed; S4 test covers only the pre-widened path."
    status: PLAUSIBLE
    resolution: "NOT ADOPTED (notes): no shape produces a wrong owner or a half-applied state; production holds a signed GARUDA_DOCUMENT policy (G0.3), so its rollback leaves the CHECK widened."

