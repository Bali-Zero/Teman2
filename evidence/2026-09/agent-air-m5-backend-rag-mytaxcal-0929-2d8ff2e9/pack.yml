brief_ref: evidence/brief.yml
plan_ref: >-
  PR #7664 (agent/air-m5/backend-rag/mytaxcal-0929, base main): "My tax calendar", a public stateless
  POST /api/public/tax-calendar/obligations plus the R19 wizard on /tax-calendar.
lanes:
  - lane: mytaxcal-backend
    role: build
    seat: "claude-sonnet-5.5 (backend route, clearance layer, CORS, wizard)"
  - lane: mytaxcal-gate-7664
    role: review
    seat: "claude-opus-5.5 (fresh gear-3 gate, verdict REWORK-BUILD on CI, mutants, copy and UI notes)"
what_changed: |
  Public route returning only cleared obligation rules plus a withheld_count; the shipped review
  file clears 9 rules (owner review, 2026-09-29) and withholds the rest (9 of the applicable ones for
  the full company profile). Wizard on /tax-calendar consumes it. CORS default origins gain tax.balizero.com.
  Rework 1 (after the first gate): this pack; the route added to the public-mutation registry of the
  gating test; OpenAPI pin and schema.d.ts regenerated; fiscal_year_end validated as a real calendar
  day; the empty-state copy no longer claims nothing applies while rules are withheld; --space-5
  (undefined token) replaced by --space-6; employee count parsed to a non-negative integer; WhatsApp
  link 44px; a flaky date test made deterministic; tests that kill four mutants.
  Round 2: the owner's decision of 2026-09-29 is recorded (9 rules cleared, reviewer "Zero (owner)");
  due dates gain a provisional flag when the holiday table for their year is not loaded (the loaded
  years are an injectable dependency); a month-end regression test; cards for one-time and event rules
  show "No fixed date".
  Round 3: "Reviewed on" replaces "Reviewed by our tax team on", frequency gets human labels, the
  withheld note is pluralised correctly.
  Round 4: legal_source is no longer published (removed from the response model and the card; the
  clearance still binds to the whole rule, fingerprints unchanged); a real space and a nowrap span
  keep each date and its period key on one line, with the "provisional" label after a real space.

proof: |
  All numbers below were produced by the receipt commands re-run after the last code change
  (2026-09-29, 15:24-15:26 UTC). Backend targeted set: 500 passed, 127 skipped. Mouth: 17 files, 168
  tests, run twice, both green. Mutants against the tests: M2 (verified check dropped) 1 failed, M9
  (legal_source out of the fingerprint) 5 failed, M10 (due out of the fingerprint) 5 failed, M11
  (individual scoping dropped) 1 failed, M13 (no calendar-day validator) 6 failed; each file restored
  byte-identical. A mutant that publishes legal_source again turns the route test red (1 failed).
  Real browser, next dev on port 3177, the real company payload with legal_source removed served by
  page.route: at 390x844 and at 1440x900 scrollWidth equals the viewport, 9 result cards, 50 date spans
  each on a single line (one distinct line top per span), no digit glued to "provisional", 36
  provisional labels, no legal-source text on the page; screenshots round4-390-vp1..vp7.png and
  round4-1440.png. The observation that matters is the required CI on the rework push.

dissent:
  - seat: claude-opus-5.5
    objection: "Gate 1: the copy 'None of the obligations apply' is false while rules are only withheld."
    status: CONFIRMED
    resolution: "Shown only when withheld_count is 0; a test covers both cases."
  - seat: claude-opus-5.5
    objection: "Gate 1: four mutants survived the first test set (M2, M9, M10, M11)."
    status: CONFIRMED
    resolution: "New tests kill all four; verified red against each mutant."
  - seat: claude-opus-5.5
    objection: "Gate 3: the date and its period key split across lines at 390 ('2026-12provisional')."
    status: CONFIRMED
    resolution: "Real space before the label, nowrap on the date text, real period_key shapes in the fixtures."
  - seat: claude-opus-5.5
    objection: "Gate 3: legal_source is raw catalog prose with internal verification notes; the owner approved a summary, not that text."
    status: CONFIRMED
    resolution: "Removed from the public model and the card; test asserts it is absent."

