brief_ref: evidence/brief.yml
plan_ref: >-
  PR #7664 (agent/air-m5/backend-rag/mytaxcal-0929, base main): "My tax calendar", a public stateless
  POST /api/public/tax-calendar/obligations plus the R19 wizard on /tax-calendar.
lanes:
  - lane: mytaxcal-backend
    role: build
    seat: "claude-sonnet-5.5 (backend route, clearance layer, CORS, wizard)"
  - lane: mytaxcal-gate-7664
    role: review
    seat: "claude-opus-5.5 (fresh gear-3 gate, verdict REWORK-BUILD on CI, mutants, copy and UI notes)"
what_changed: |
  Public route returning only Tax-Department-cleared obligation rules plus a withheld_count; the
  shipped review file is empty, so live calls return an empty calendar until a named reviewer clears
  rules. Wizard on /tax-calendar consumes it. CORS default origins gain tax.balizero.com.
  Rework after the gate's REWORK-BUILD: this pack; the route added to the public-mutation registry
  of the gating test; OpenAPI pin and schema.d.ts regenerated; fiscal_year_end validated as a real
  calendar day; the empty-state copy no longer claims nothing applies while rules are withheld;
  --space-5 (undefined token) replaced by --space-6; employee count parsed to a non-negative
  integer; WhatsApp link 44px; a flaky date test made deterministic; tests that kill four mutants.
  Round 2: the owner's decision of 2026-09-29 is recorded (9 rules cleared, reviewer "Zero (owner)",
  12 withheld); due dates gain a provisional flag when the holiday table for their year is not loaded;
  a month-end regression test; cards for one-time and event rules show "No fixed date".

proof: |
  Backend: 491 passed in the targeted run (route, clearance, setup, CORS, mutating-routes gate,
  OpenAPI pin). Mutants against the new tests: M2 (verified check dropped), M9 (legal_source out of
  the fingerprint), M10 (due out of the fingerprint), M11 (individual scoping dropped) and M13
  (no calendar-day validator) each turn the suite red (1, 1, 1, 1 and 6 failures) and the file is
  restored byte-identical. Mouth: 162 tests in 17 files green five runs in a row; the date test
  green five runs alone. The observation that matters is the required CI on the rework push.

dissent:
  - seat: claude-opus-5.5
    objection: "Gate: the copy 'None of the obligations apply' is false while rules are only withheld."
    status: CONFIRMED
    resolution: "Shown only when withheld_count is 0; a test covers both cases."
  - seat: claude-opus-5.5
    objection: "Gate: four mutants survived the first test set (M2, M9, M10, M11)."
    status: CONFIRMED
    resolution: "New tests kill all four; verified red against each mutant."

