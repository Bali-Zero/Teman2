acceptance:
  - text: >-
      WHEN the 9 copied files are hashed in this repo, THEN every sha256 SHALL
      match the pinned source hash exactly.
    status: verified
    probe: "shasum -a 256 research/visa/2026-09-11-oracle-final-window-spec.md research/visa/2026-09-11-review-reason-audit/*.md research/visa/2026-09-11-review-reason-audit/*.json research/visa/2026-09-11-review-reason-audit/*.mts research/visa/2026-09-11-review-reason-audit/*.py research/visa/2026-09-11-review-reason-audit/*.tsx research/visa/2026-09-11-review-reason-audit/*.png"
  - text: >-
      WHEN the frontmatter block and the appended "## Adversarial review"
      section are stripped from each of the two research .md files, THEN the
      remaining body bytes SHALL hash to the pinned sha256_source exactly
      (proves the wrapper never touched the pinned bytes).
    status: verified
    probe: >-
      apps/backend-rag/.venv/bin/python3 -c "import hashlib,sys
      path=sys.argv[1]
      text=open(path,encoding='utf-8').read()
      fm_end=text.index('---',text.index('---')+3)+3
      body=text[fm_end:]
      marker='\n## Adversarial review'
      idx=body.index(marker)
      stripped=body[:idx].strip('\n')+'\n'
      print(hashlib.sha256(stripped.encode('utf-8')).hexdigest())" <path>
  - text: >-
      SKILL.md's LIVE STATE section is grepped for the fresh 67-walk census
      figure, THEN it SHALL be present at least once.
