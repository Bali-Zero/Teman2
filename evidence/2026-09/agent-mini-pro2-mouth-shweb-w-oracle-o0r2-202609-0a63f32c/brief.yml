    probe: "grep -c '2026-09-11\\|2026-09-09\\|2026-09-08\\|2026-09-07' .agents/skills/visaoracle/references/live-state-log.md"
  - text: >-
      WHEN the full diff against origin/main is grepped for PII shapes
      (emails, +62 phone numbers, passport/KTP/NPWP-like tokens), THEN no
      match SHALL be found.
    status: verified
    probe: "git diff origin/main...HEAD | grep -inE '[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}|\\+62[0-9]{8,13}|\\b[0-9]{16}\\b|\\b[a-zA-Z][0-9]{7}\\b'"
  - text: >-
