      SUMS
  - text: >-
      WHEN the frontmatter block and the appended "## Adversarial review"
      section are stripped from each of the two research .md files, THEN the
      remaining body bytes SHALL hash to the pinned sha256_source exactly
      (proves the wrapper never touched the pinned bytes).
    status: verified
    probe: |
      python3 - <<'PY'
      import hashlib
      pins = {
          "research/visa/2026-09-11-oracle-final-window-spec.md": "2acb148ea72fec9bf34d2022c03e1d9883fa557ba8b1f4ff0ff736f697e7c9d5",
          "research/visa/2026-09-11-review-reason-audit/README.md": "d8102e736d5602be33c9c8b668a91d6f245adb30454bf754cda8add1e0dd029b",
      }
      ok = True
      for path, pin in pins.items():
          text = open(path, encoding="utf-8").read()
          fm_end = text.index("---", text.index("---") + 3) + 3
          body = text[fm_end:]
          marker = "\n## Adversarial review"
          idx = body.index(marker)
          stripped = body[:idx].strip("\n") + "\n"
          got = hashlib.sha256(stripped.encode("utf-8")).hexdigest()
          print(path, got, "OK" if got == pin else "MISMATCH")
          ok = ok and (got == pin)
      raise SystemExit(0 if ok else 1)
      PY
