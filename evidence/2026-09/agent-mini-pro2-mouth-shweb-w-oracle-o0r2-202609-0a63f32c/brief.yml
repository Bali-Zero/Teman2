      n=$(grep -cF 'not re-measured here.' "$F")
      if [ "$n" -lt 3 ]; then echo "MISSING: retroactive disclaimer occurs $n times, need >= 3"; exit 1; fi
      echo "OK: all entries present, disclaimer x$n"
  - text: >-
      WHEN the full diff against origin/main is scanned for PII shapes
      (emails, +62 phone numbers, KTP/NPWP/passport-like tokens), THEN the
      probe SHALL exit 0 on exactly one outcome — the WHOLE diff reached the
      scanner and it matched nothing. Every other outcome fails closed: a
      match exits 1, a scanner error (rc 2 — a bad pattern, an unreadable
      input) exits 2, a `git diff` that fails exits 2, and a diff that never
      fully reached the scanner exits 2 as well. Both halves of the pipeline
      are read from PIPESTATUS before anything else can overwrite it, since
      `rc=$?` would itself reset it. The earlier `!`-inverted form turned a
      scanner error into a pass; this one cannot.
    status: verified
    probe: |
      d="$(git diff origin/main...HEAD)" || exit 2
      printf '%s\n' "$d" | grep -inE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}|\+62[0-9]{8,13}|\b[0-9]{16}\b|\b[a-zA-Z][0-9]{7}\b'
      st=("${PIPESTATUS[@]}"); pf=${st[0]}; rc=${st[1]}
      case "$rc" in
        0) echo "FAIL: PII-shaped match in the diff"; exit 1 ;;
        1) if [ "$pf" = 0 ]; then echo "OK: the whole diff reached the scanner and it matched nothing"; exit 0
           else echo "FAIL: the diff never fully reached the scanner (printf exited $pf)"; exit 2; fi ;;
        *) echo "FAIL: scanner exited $rc (error, not a clean diff)"; exit 2 ;;
      esac
