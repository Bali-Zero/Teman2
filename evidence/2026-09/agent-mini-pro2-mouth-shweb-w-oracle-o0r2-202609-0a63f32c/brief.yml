      e056d690aa5b38318d0a09099ac9bb404ebcb170423c9bb7874498c565c99960  research/visa/2026-09-11-review-reason-audit/browser.mts
      c29c51a01b3f9a4b5fa34d7011f21c496a0b2157cbccfc6fa02feab36de40360  research/visa/2026-09-11-review-reason-audit/live-browser.json
      14427e15b2a380375732e0502105ce9d0152a2f91f11cef4b3d8bd6a5827c41f  research/visa/2026-09-11-review-reason-audit/live-uncertainty.png
      SUMS
  - text: >-
      WHEN the frontmatter block and the appended "## Adversarial review"
      section are stripped from each of the two research .md files, THEN the
      remaining body bytes SHALL hash to the pinned sha256_source exactly
      (proves the wrapper never touched the pinned bytes).
    status: verified
    probe: |
      python3 - <<'PY'
      import hashlib
      pins = {
          "research/visa/2026-09-11-oracle-final-window-spec.md": "2acb148ea72fec9bf34d2022c03e1d9883fa557ba8b1f4ff0ff736f697e7c9d5",
          "research/visa/2026-09-11-review-reason-audit/README.md": "d8102e736d5602be33c9c8b668a91d6f245adb30454bf754cda8add1e0dd029b",
      }
      ok = True
      for path, pin in pins.items():
          text = open(path, encoding="utf-8").read()
          fm_end = text.index("---", text.index("---") + 3) + 3
          body = text[fm_end:]
          marker = "\n## Adversarial review"
          idx = body.index(marker)
          stripped = body[:idx].strip("\n") + "\n"
          got = hashlib.sha256(stripped.encode("utf-8")).hexdigest()
          print(path, got, "OK" if got == pin else "MISMATCH")
          ok = ok and (got == pin)
      raise SystemExit(0 if ok else 1)
      PY
  - text: >-
      SKILL.md's LIVE STATE section is grepped for the fresh 67-walk census
      figure, THEN it SHALL be present at least once.
    status: verified
    probe: "grep -c '67' .agents/skills/visaoracle/SKILL.md"
  - text: >-
      WHEN live-state-log.md is checked for the 2026-09-11 audit entry
      marker, the three retroactive PR markers (#6051/#5918/#5855), and
      the retroactive-disclaimer sentence occurring at least 3 times, THEN
      each SHALL be present — the probe fails closed, naming the first
      missing item, rather than passing on any single date match.
    status: verified
    probe: |
      F=".agents/skills/visaoracle/references/live-state-log.md"
      grep -qF '2026-09-11 (Mini, Codex verification' "$F" || { echo "MISSING: 2026-09-11 audit entry marker"; exit 1; }
      grep -qF '#5855' "$F" || { echo "MISSING: #5855 entry"; exit 1; }
      grep -qF '#5918' "$F" || { echo "MISSING: #5918 entry"; exit 1; }
      grep -qF '#6051' "$F" || { echo "MISSING: #6051 entry"; exit 1; }
      n=$(grep -cF 'not re-measured here.' "$F")
      if [ "$n" -lt 3 ]; then echo "MISSING: retroactive disclaimer occurs $n times, need >= 3"; exit 1; fi
      echo "OK: all entries present, disclaimer x$n"
  - text: >-
      WHEN the full diff against origin/main is scanned for PII shapes
      (emails, +62 phone numbers, KTP/NPWP/passport-like tokens), THEN the
      probe SHALL exit 0 on exactly one outcome — the WHOLE diff reached the
      scanner and it matched nothing. Every other outcome fails closed: a
      match exits 1, a scanner error (rc 2 — a bad pattern, an unreadable
      input) exits 2, a `git diff` that fails exits 2, and a diff that never
      fully reached the scanner exits 2 as well. Both halves of the pipeline
      are read from PIPESTATUS before anything else can overwrite it, since
      `rc=$?` would itself reset it. The earlier `!`-inverted form turned a
      scanner error into a pass; this one cannot.
    status: verified
    probe: |
      d="$(git diff origin/main...HEAD)" || exit 2
      printf '%s\n' "$d" | grep -inE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}|\+62[0-9]{8,13}|\b[0-9]{16}\b|\b[a-zA-Z][0-9]{7}\b'
      st=("${PIPESTATUS[@]}"); pf=${st[0]}; rc=${st[1]}
      case "$rc" in
        0) echo "FAIL: PII-shaped match in the diff"; exit 1 ;;
        1) if [ "$pf" = 0 ]; then echo "OK: the whole diff reached the scanner and it matched nothing"; exit 0
           else echo "FAIL: the diff never fully reached the scanner (printf exited $pf)"; exit 2; fi ;;
        *) echo "FAIL: scanner exited $rc (error, not a clean diff)"; exit 2 ;;
      esac
  - text: >-
      WHEN scripts/check_adversarial_review.py is run against the two
      research .md files, THEN it SHALL exit 0.
    status: verified
