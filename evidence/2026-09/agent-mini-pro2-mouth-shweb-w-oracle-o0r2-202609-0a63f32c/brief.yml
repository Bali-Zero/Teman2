  - text: >-
      Baseline invariant, and the one the Detect Secrets CI job actually
      enforces: WHEN .secrets.baseline as committed is read, THEN NO entry
      SHALL lack an audit decision. Line numbers move; this does not.
    status: verified
    probe: |
