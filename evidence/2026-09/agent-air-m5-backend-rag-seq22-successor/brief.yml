constraints:
  - Forbidden - evaluate_path.py, evaluator.py, models.py/enums.py/fact_registry.py (the ten
    sponsor/secondhome facts are ALREADY on main from the prior W-VO-S21 cycle; this PR registers
    no new fact), tree.ts/flow.ts (no question added or removed), pricing, any signing key, any DB.
  - No HARD_FILTER/EXCLUDE rule and no eq-false comparison may read a synthesised Second-Home
    twin-basis fact (secondhome.bank_deposit_usd / bank_deposit_at_state_bank /
    bank_deposit_in_own_name / qualifying_property_value_usd) — this is what killed seq-21 and is
    the one invariant this PR exists to keep true going forward, guarded at fold time
    (TestNoExcludeReadsASynthesisedFact) AND at mouth build time (engine-adapter.test.ts twin-basis
    guard reading the highest-sequence SIGNED pack, currently seq-20).
  - review.e33.below-threshold-studio's copy and the mouth link it drives may never say a person,
    consultant or staff member reviews the case — it is a self-serve calculator, not a hold.
  - No figure invented - the Studio bounds are EXTRACTED from seq-20's own el.e33 SUPPORT rules
    at fold time, never typed in fold_pack_seq22.py.
  - No client PII; no credential value anywhere; never sign or activate; never edit PENDING-ARMS.md.
  - Push once, complete.
