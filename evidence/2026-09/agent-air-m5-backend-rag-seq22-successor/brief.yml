objective: >-
  A frozen, green, re-executable seq-22 candidate that folds DIRECTLY from the signed seq-20 pack
  (never from seq-21, which is STOPPED with three defects found before activation) and carries
  seq-21's content with all three defects cured: (1) E23V is no longer excluded by
  hf.employment-without-indonesian-sponsor when a foreign trade-office employee honestly answers
  "my employer is not Indonesian" (the hard filter's product scope narrows to E23+E33B); (2)
  E33B stays inside that same exclusion scope (sponsor.government_collaboration is an INDONESIAN
  government body, so a non-Indonesian sponsor genuinely disqualifies it); (3) seq-21's
  HARD_FILTER hf.e33.guarantee-below-threshold is NOT carried forward — it read a Second-Home
  twin-basis fact (deposit/property) the OTHER basis's fact-mapper.ts synthesises as known(0),
  which the engine-adapter.test.ts twin-basis guard (~line 887-951) forbids a HARD_FILTER/EXCLUDE
  or an eq-false comparison from ever reading. Per owner decision D23 "OPTION B-STUDIO" (Zero,
  2026-09-16, ~/BATTAGLIA-20260911/SAETTA-20260916/Z-DECISIONI-ZERO.md) the same two thresholds
  come back as a REQUIRE_REVIEW rule (review.e33.below-threshold-studio, reason
  SECOND_HOME_BELOW_THRESHOLD_STUDIO, on_unknown NO_EFFECT, bounds read from seq-20's own E33
  SUPPORT rules — never a typed figure), and the mouth OutcomeSheet routes that ONE reason to the
  public Second Home Studio (/visa/second-home/studio — never /second-home/studio, which 301s to
  the staff workspace) without ever saying a person or consultant reviews the case. Nine products
  (E23U E23V E28B E28C E28D E28F E33A E33B E33C) go from zero SUPPORT rules in seq-20 to one each
  in seq-22 (29 -> 38 of 38 products with a SUPPORT rule); nine dormant review.* rules keyed on
  the never-asked intent.requested_product_code are retired. A new gold-coverage walk fixture
  (offshore/work/sponsor_government/trade_office_only/employer_no) proves the E23V cure moves
  NO_PATH -> SUPPORTED [E23V] (corpus 111 -> 112 walks). Not signed and not activated by this
  window — activation is a separate owner order (D24), signature a separate fresh Fable/Opus
  session outside this chain (D17-bis).
