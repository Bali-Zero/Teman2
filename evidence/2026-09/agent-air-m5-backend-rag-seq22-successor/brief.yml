    probe: "pytest backend/tests/services/visa_engine/test_seq22_pack.py::TestFoldIntegrity::test_fold_is_deterministic backend/tests/services/visa_engine/test_seq22_pack.py::TestFoldIntegrity::test_fold_chains_to_seq20_not_to_seq21"
  - text: "A2 WHEN work.employer_is_indonesian_entity is declared false for an EMPLOYMENT purpose, hf.employment-without-indonesian-sponsor SHALL scope to (E23, E33B) only and SHALL NOT exclude E23V"
    probe: "pytest backend/tests/services/visa_engine/test_seq22_pack.py::TestTheEditsContent::test_e23v_is_removed_from_the_employment_exclusion backend/tests/services/visa_engine/test_seq22_pack.py::TestTheEditsContent::test_e23_and_e33b_stay_inside_the_employment_exclusion"
    consumer: apps/backend-rag/backend/tests/services/visa_engine/gold_coverage/fixtures/walks/offshore_work_sponsor_government_trade_office_only_employer_no.json — the new walk that PROVES the cure, not just asserts it
  - text: "A3 IF a HARD_FILTER/EXCLUDE rule or an eq-false comparison reads any of the four Second-Home twin-basis facts, the fold SHALL abort, and this invariant SHALL hold on both the fold's own guard and the mouth's engine-adapter.test.ts guard on the highest-sequence SIGNED pack"
    probe: "pytest backend/tests/services/visa_engine/test_seq22_pack.py::TestNoExcludeReadsASynthesisedFact -k guilt_or_innocence ; npx vitest run 'src/app/(visa-oracle)/visa-oracle' -t 'twin-basis'"
  - text: "A4 WHEN a declared property or deposit figure is below its seq-20-sourced threshold, the outcome SHALL be HUMAN_REVIEW_REQUIRED with reason SECOND_HOME_BELOW_THRESHOLD_STUDIO, and WHILE the sibling basis's figure is UNKNOWN (never declared) the Studio reason SHALL NOT fire"
    probe: "pytest backend/tests/services/visa_engine/test_seq22_pack.py::TestE33BelowThresholdStudio backend/tests/services/visa_engine/test_seq22_pack.py::TestTheCureIsReachable::test_an_unasked_deposit_never_routes_anyone_to_the_studio backend/tests/services/visa_engine/test_seq22_pack.py::TestTheCureIsReachable::test_the_deposit_basis_visitor_is_never_judged_on_an_unasked_property"
  - text: "A5 the review.e33.below-threshold-studio copy and its mouth rendering SHALL never introduce the hold as needing a person's or consultant's judgment, and SHALL link only to /visa/second-home/studio"
    probe: "grep -niE 'consultant|a person|staff' apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/engine-adapter.ts | grep -i studio ; npx vitest run apps/mouth/src/app/(visa-oracle)/visa-oracle/_components/OutcomeSheet.test.tsx"
  - text: "A6 WHEN the 112-walk corpus is replayed at ENGINE level against the seq-22 candidate with no flags, the census SHALL read exactly 3 HUMAN_REVIEW_REQUIRED / 1 NEEDS_INPUT / 14 NO_SUPPORTED_PATH / 94 SUPPORTED_CANDIDATES, and no walk outside the three named ones SHALL move from seq-20's 1/2/17/92"
    probe: "pytest backend/tests/services/visa_engine/test_interview_walk_census.py::test_the_flagged_census_is_the_funnel_the_applicant_meets backend/tests/services/visa_engine/test_interview_walk_census.py::test_every_walk_ends_in_its_pinned_outcome_on_the_candidate_pack"
  - text: "A7 the nine unlocked products SHALL each gain exactly one ELIGIBILITY/SUPPORT rule conjoining a declared qualifying fact, on_unknown NEEDS_INPUT, and no product SHALL be reachable on sponsor.type alone"
    probe: "pytest backend/tests/services/visa_engine/test_seq22_pack.py::TestTheEditsContent::test_the_nine_unlocked_products_each_gain_an_eligibility_rule backend/tests/services/visa_engine/test_seq22_pack.py::TestFoldIntegrity::test_fold_retires_nine_and_inserts_eleven"
  - text: "A8 the fold SHALL edit no surviving rule and SHALL touch no top-level pack key other than the ones it declares, and the whole visa_engine suite plus the mouth typecheck/format/lint SHALL stay clean modulo the pre-existing local-Postgres schema errors"
