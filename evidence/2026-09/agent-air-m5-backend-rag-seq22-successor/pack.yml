dissent:
  - seat: Claude Sonnet 5 (evidence-pack writer, self-refutation)
    objection: >-
      E33B's catalogue sponsor_types is ['NONE'] (no employer sponsor at all), so keeping it
      inside an exclusion scoped to `intent.purposes intersects EMPLOYMENT AND
      work.employer_is_indonesian_entity == false` looked incoherent at first read — an applicant
      with no employer sponsor should not be judged on an employer fact.
    status: RETRACTED
    cure: >-
      E33B's own `covered_purposes` includes 'EMPLOYMENT' (confirmed by reading the committed
      pack's products array), and E33B's qualifying fact `sponsor.government_collaboration` names
      a collaboration with an INDONESIAN government body — so an E33B applicant who separately
      declares EMPLOYMENT as a purpose AND answers "my employer is not an Indonesian entity" is
      genuinely contradicting their own qualification, not being wrongly judged on an unrelated
      fact. `test_e23_and_e33b_stay_inside_the_employment_exclusion`'s own docstring states the
      same resolution; this was verified independently before that docstring was read.
  - seat: builder-time antibody (fold_pack_seq22.py's own guard, exercised by this writer's pytest run)
    objection: >-
      seq-21's original HARD_FILTER `hf.e33.guarantee-below-threshold`, if carried forward as-is
      (Option A) or reintroduced alongside the B-STUDIO rule by a future careless fold, would
      abort — it is a HARD_FILTER/EXCLUDE reading a synthesised Second-Home twin-basis fact, which
      turns the OTHER basis's harmless "not claimed here" synthesis into an active exclusion of a
      visitor who never answered the question.
    status: CONFIRMED
    cure: >-
      Verified this turn by running test_seq22_pack.py in full (39 passed), which includes
      `TestE33BelowThresholdStudio::test_guilt_turning_the_studio_rule_into_a_hard_filter_aborts_the_fold`
      and `::test_guilt_reintroducing_seq21s_hard_filter_aborts_the_fold` — both guilt cases raise
      SystemExit naming the offending rule_id, and the innocence case
      (`test_innocence_the_real_pack_still_passes_the_twin_basis_guard`) confirms the REAL
      committed pack passes because review.e33.below-threshold-studio is HUMAN_REVIEW stage with
      no eq-false comparison. D23 OPTION B-STUDIO is the cure, not a workaround: the same two
      thresholds, never a HARD_FILTER again.
  - seat: Claude Sonnet 5 (evidence-pack writer, self-refutation)
    objection: >-
      Unlike W-VO-S21's own dossier (which recorded "signing and activating changes no census
      state and names no new product on any real walk today" because W-VO-Q's ten interview
      questions had not shipped yet), this writer found `fact-mapper.ts` NOW maps
      `sponsor.government_invitation` / `sponsor.government_collaboration` from real applicant
      answers rather than hardcoding them NOT_ASKED — meaning signing and activating THIS pack
      would have an IMMEDIATE visible effect on real production traffic, not a dormant one.
    status: CONFIRMED
    cure: >-
      Not a defect of this window — it is the reason activation is explicitly D24, a SEPARATE
      owner order, and why this pack states plainly it is not signed and not activated. Recorded
      here so the signing session and D24's approver both know the blast radius is live, not
      theoretical, unlike the prior sequence's ceremony.
