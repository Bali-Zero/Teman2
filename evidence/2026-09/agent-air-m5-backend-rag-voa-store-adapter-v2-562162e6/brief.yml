# Floor MEASURED, not guessed: `scripts/evidence_pack_lint.py --print-floor --changed-files-file …
# --numstat-file …` against the branch base 5ceb29b375 returns **3, source `size`**: churn
# Σ(added+deleted) = 2108 over the six changed files, past SIZE_GEAR3_THRESHOLD = 1828. No path is
# hot-zone (every file alone scores 1). The 443-line verbatim copy of SPEC-v2.md is what crosses
# the threshold: without it the churn is 1665 and the floor is 2, which is what SPEC v2 §10
# expected. The copy is in the diff because the gate must be able to READ the spec from the repo;
# the alternative -- land the spec first as its own docs PR and reference it by path + sha256 --
# was put to the Imperator at the BUILD checkpoint. Whatever he rules, the gear here equals the
# floor as measured on the diff that ships; it is never declared below it. The stable figures are
# the three files that are NOT this one, `git diff --numstat 5ceb29b375 -- apps/`: ports.py +70/-1,
# postgres_store.py +461/-0 (a NEW file on main: the suspended PR2a never merged),
# test_postgres_store.py +915/-0.
objective: >-
  GARUDA VOA W1W, PR2a-v2 -- the second candidate for the same concern, built from fresh main
  against SPEC v2 (`SPEC-v2.md` beside this file; ratified source
  `~/BATTAGLIA-20260911/1-GARUDA-VOA/spec/2026-09-12-SPEC-v2-postgres-document-store.md`, sha256
  f7f3329aff5c7a448581cce989501e95b436cdcf6d445eb699b7a214ced2bf5d, Imperator decision #35; the
  committed copy is that file after the repo's pre-commit `prettier --write` (applied twice: the first pass is not idempotent on this file), sha256
  54dc70e476916bc3fa16c150b7b8a2191cb94960a4e9871613fa249a3e7e6dcc -- the only differences are
  prettier's own: `*emphasis*` rewritten `_emphasis_` and table/whitespace normalisation, no
  word changed; `diff -w` between the two shows nothing else). PR2a (`agent/air-m5/backend-rag/voa-store-adapter`, head aed342999e) was SUSPENDED under
  Builder Contract 1 after three refuter rounds reopened one class: a test that pins a FORM and
  calls it a PROPERTY. This PR keeps the store's uncontested behaviour and changes four things
  (SPEC v2 §0): a test-only seam in `commit()` so the collision branch is FORCED under any
  scheduler; the loser's post-collision state machine made total and typed
  (`IdempotencyKeyVanished`); the test suite re-derived from a mutation model instead of fixture
  pairs; every declared limit consolidated into the `limits:` block below and cited by id.
  Two numbers, so a gate does not have to re-derive them: ~530 net lines of non-test code against
  main, because `postgres_store.py` is new on main; ~50 of those are this PR's delta of concern
  over the uncontested v1 store (hooks dataclass, two call sites, the typed error and its export).
