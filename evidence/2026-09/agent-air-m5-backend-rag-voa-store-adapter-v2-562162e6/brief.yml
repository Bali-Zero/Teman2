measurements:
  server_versions:
    pg15: "15.19 (Homebrew), disposable cluster in the session scratchpad, port 55432 -- CI's major"
    pg17: "17.10 (Homebrew), local cluster, port 5432 -- production's major (prod is 17.9)"
  suite: >-
    test_postgres_store.py, 288 collected on the cured head (240 at bef78d89c0, before Sol O1's
    cures; the delta is the model's rstrip_sep/lstrip_sep cases, the P10 permutation matrix, two
    more H1 subprocess cases and the duplicate-field-path test). PG 15.19: 288 passed in 50.52s.
    PG 17.10: 288 passed in 31.52s (the earlier 262 s run on this cluster had `CREATE DATABASE`
    at ~6 s -- environment, measured once, gone on the re-run). Lane
    `backend/tests/services/garuda_documents/` on PG17: 353 passed, 3 skipped in 26.86s.
  ci_behaviour: >-
    `.github/workflows/tests.yml` gives the backend shards `services: postgres`
    (`public.ecr.aws/docker/library/postgres:15`) and exports
    `INTAKE_TEST_DSN=postgresql://test:test@localhost:5432/nuzantara_test`, this suite's second
    fallback. Under `CI` the fixture FAILS, never skips, in all three degraded cases -- unreachable
    server, DSN rejected by asyncpg's parser, connecting role not a superuser -- and all three are
    now BEHAVIOURALLY tested by the H1 subprocess runner (A14), closing the "untestable"
    declaration PR2a's brief carried.
  guilt_mutation_method: >-
    One mutation at a time, applied by anchor with a cp backup and restored after (never `git
    checkout --`). PG 15.19: the FULL file per mutation, so the count is over all 288 tests. PG
    17.10: the same mutations against the tests the property NAMES (`-k` selector recorded per
    row) -- the full file cost ~4.5 min per run on this cluster while the loop ran (see `suite`), so the PG17
    column proves "red on PG17" and the PG15 column proves the blast radius. Every row is red on
    both, except ONE H1 row marked SURVIVES ALONE (`from None` dropped with `pytrace=False` kept), declared as such (spec_errata) rather than dropped: `pytrace=False` is the load-bearing layer. The H1 rows were re-measured after the subprocess runner gained `--showlocals`; every other row was measured on the same sources before `ruff format` (formatting only). No row carries a scheduler caveat.
