constraints:
  - >-
    NO migration. 304 is applied in production (measured in the W1W window via scripts/pg.sh:
    `_schema_versions.applied_as = 'backend_rag_v2 (session_user=backend_rag_migrator)'`; the
    GARUDA_DOCUMENT policy `garuda-document-privacy-v1` is active, PRODUCTION, 30 days,
    CREATED_AT). This PR reads that schema; received field order would need an ordinal column
    and is therefore out (limit L1).
  - >-
    No production wiring: `service_initializer.py` untouched, `app.state.garuda_document_store`
    stays unset, the router keeps its documented 503. Wiring is PR3 (limits L2, L4).
  - >-
    No fly.toml, no .env*, no zantara_core.py, no products/garuda-voa/contracts/openapi.yaml
    (W3C owns the contract). No Header declarations in any router are touched. No CI workflow
    change (limit L3).
  - >-
    The seam `_hooks` is keyword-only, underscore-named, defaults to None, documented as a test
    seam production must never set; `test_the_default_constructor_has_no_hooks` pins it here and
    PR3 asserts it at the factory (L4).
limits:
  L1: >-
    A replayed `LowConfidenceOutcome` (and `ReadyOutcomeValueNotPersisted.persisted_fields`)
    comes back in `PassportReviewFieldName`'s declaration order for EVERY received order (P11,
    proved over all 24 permutations). The RECEIVED order is not preserved and cannot be without
    an ordinal column on `garuda_document_review_fields` -- a migration, a separate concern. Cited
    by `DocumentStorePort.get_existing`'s docstring and by `test_p11_*`. Ledger row 2 in
    `ledger-rows-held.md` stays open, owner operator[product].
  L2: >-
    `IdempotencyKeyVanished` propagates out of `service.py` exactly as
    `ReadyOutcomeValueNotPersisted` does today; its HTTP mapping is PR3's (SPEC v2 §9). Cited by
    the exception's docstring in `ports.py`.
  L3: >-
    CI proves PostgreSQL 15 only (`services: postgres` = `postgres:15`, `INTAKE_TEST_DSN`).
    PostgreSQL 17 is a MEASURED LOCAL run recorded under `measurements` with its
    `server_version` string; a PG17 CI shard is a workflow change and a named follow-up PR.
    Cited by the test module docstring.
  L4: >-
    The production factory (`service_initializer.py`, PR3) must assert `store._hooks is None`
    at the factory itself; this PR pins it only for a store built the way a factory builds one.
    Cited by `test_the_default_constructor_has_no_hooks`.
  L5: >-
    Four tests named at the foot of PR2a's test file are absorbed by NONE of this PR (SPEC v2
    §9): the SECURITY DEFINER ownership-transfer pair moves to a migration-test PR unchanged in
    name; the READY-replay pair is deferred until `service.py::_reconcile_lost_race_ready_replay`
    exists, renamed `test_ready_replay_after_outcome_1_returns_the_committed_body` and
    `test_sequential_ready_replay_still_raises_value_not_persisted`.
  L6: >-
    P2 (injectivity of the scoped key) is proved OVER the mutation model E enumerated in
    `_string_model`/`_tuple_model`, exactly as SPEC v2 §3 prescribes ("parametrization is
    over the MODEL") -- not universally. A lossy encoder outside E is outside the proof: Sol
    (PR2a-v2 O1, finding 1) showed `rstrip("-")` surviving a model with only inner-separator
    strips; E now carries `rstrip_sep`/`lstrip_sep` per separator and asserts its EXACT size
    per component, so the proof's width is itself pinned. Cited by
    `test_p2_scoped_key_distinguishes_every_pair_a_lossy_encoder_collapses` and
    `test_p2_the_mutation_model_is_exactly_the_enumerated_model`.
  L7: >-
    `get_existing` reads the parent row and its review-field rows inside ONE REPEATABLE
    READ, read-only transaction, so a purge between the two reads cannot hand `_rehydrate`
    a parent without children (Sol, PR2a-v2 O1, finding 5). The interleaving itself is
    NOT test-forced: doing so would need a third seam inside `get_existing`, and decision
    #38 rules out a third hook. Declared in the method's comment; no guilt row claims it.
  L8: >-
    Schedules C and D use a 2-second retention policy. A scheduler pause longer than that
    between a racer's transaction start and its INSERT makes migration 304's binder refuse
    the already-elapsed deadline with an untranslated `asyncpg.RaiseError` -- a LOUD failure
    with a diagnosis, never a vacuous pass (Sol, PR2a-v2 O1, finding 4, second part). Not
    observed in any run recorded here; declared because it is possible.
spec_errata:
  - >-
    SPEC v2 §5 calls `from None` "the load-bearing change, because `from None` is what stops
    a `--tb=long` renderer from printing the original". MEASURED otherwise (guilt table, H1
    rows, subprocess run with `--tb=long --showlocals`): dropping `from None` while keeping
    `pytrace=False` survives all 288 tests -- with `pytrace=False` pytest renders the message
    alone, no frame and no locals, whatever the renderer; setting `pytrace=True` while keeping
    `from None` is red under `--showlocals` (3 failed: `_connect`'s own `dsn` local renders)
    and was green at plain `--tb=long` on the previous head (the only rendered frame's
    ARGUMENT is a database name). So `pytrace=False` is the load-bearing layer; `from None` is
    defence in depth that closes the chained frame at `--tb=long` only. Both stay. The §5
    sentence is to be corrected in the spec on main by a later docs PR (decision #38,
    constraint 3), not silently.
  - >-
    SPEC v2 §3 lists `swap_case: s -> s.swapcase()` in the mutation model E. `swapcase` is a
    BIJECTION on ASCII letters -- it has no collision pair -- so it cannot be a member of a LOSSY
    model and the derivation rule ("a witness the model fails to construct is a test ERROR")
    would fail on it. The suite uses `casefold` in its place, which is lossy (`ab`/`AB`), and
    says so in `_string_model`. The spec file is copied verbatim, not re-edited.
  - >-
    The retention-policy INSERT casts its interval parameter `$2::text::interval`, not
    `$2::interval`: asyncpg infers `interval` and demands a `timedelta`, rejecting the literal
    string. Declared in the fixture's SQL comment.
