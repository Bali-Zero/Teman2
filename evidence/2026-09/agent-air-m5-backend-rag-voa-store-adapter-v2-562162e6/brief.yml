perimeter_not_touched: >-
  Not touched, so nobody infers it from absence: `service_initializer.py`, any router, any
  `Header(...)` declaration, any migration, any contract, fly.toml, .env*, zantara_core.py, any
  CI workflow. The suspended branch `agent/air-m5/backend-rag/voa-store-adapter` stays as the
  record of the suspension and is never merged.
