decisions:
  - id: D1
    what: >-
      Fix ONLY the three drifted figures (372→373, 33.2%→33.3%, 70→65) in each locale; leave
      the "519 blocked" framing, the "6 — the remainder" grouping and every other sentence
      untouched.
    why: >-
      Lane brief (WH-LANE-PR6.md step 3) is explicit: "correct the articles (only the wrong
      figures; do not rewrite framing — the '519 blocked' framing stays until a separate
      Bali-overlay window reworks it)". The "6" grouping was independently re-measured and
      found truthful (2+2+1+1), so it needed a pin, not a correction.
  - id: D2
    what: >-
      Pin all six category counts (not just the two that drifted) plus the narrative
      percentage and the scope-dependent count, and add an invariant that the six counts sum
      to the blocked total.
    why: >-
      Lane brief step 3 asks for "each category count in the list" — pinning only the
      previously-wrong ones would leave the still-correct 48/68/17/7/6 exposed to a future
      drift with no test to catch it, and would not implement the requested invariant (a
      future cure could change one status's count without the six figures still summing to
      the printed headline).
  - id: D3
    what: >-
      IT/ID category-breakdown probe uses a wider match window (500 vs. the file's default
      400) via a new optional `probe.window` field.
    why: >-
      The TERTUTUP bullet in it/id carries a six-example parenthetical (legal consultancy,
      notaries, medical practice, minimarket, agriculture) that pushes the 68→17 character gap
      to 421-424 chars in both locales — over the file's existing NUMBER_WINDOW=400. Measured
      directly (see receipts) rather than guessed; 500 clears both locales with margin.
  - id: D4
    what: >-
      The invariant test recomputes both sides from the dataset (six category counts vs.
      `countFromCanonical().blocked`) rather than parsing the prose's own printed numbers.
    why: >-
      Every category count and the headline blocked count are ALREADY pinned individually
      against the same dataset elsewhere in this file, so this test transitively guards "the
      printed list sums to the printed title" while staying a pure data-partition check — it
      also fails if a future dataset cure introduces a NEW blocked `l4_bali.status` that none
      of the five named categories or the "remainder" group covers.

