# codex-gpt-5.6-sol xhigh reviewed the first version of this diff (see journal.jsonl and the
# dissent entry below) — VERDICT: FIX-FIRST, 3 findings, all 3 cured in this same session.

dissent:
  - seat: codex-gpt-5.6-sol (xhigh, adversarial review)
    objection: >-
      BLOCKER — the it/id number-window prober (`numbersInOrderWithinWindow`, raw
      `text.indexOf`) let an expected number match INSIDE a larger mutated one (373 inside a
      mutated 1373; all six category counts prefixed with "1" stayed green), and its
      "retry every occurrence of the first number" search let a probe validate against the
      WRONG sentence (mutating headline 519→518, the correction paragraph's 33,3→33,2 and the
      closing count's 519→518 simultaneously stayed green, because an untouched, genuinely
      correct "519"/"33,3" survived at a different, unrelated occurrence and the retry logic
      happily matched that one instead). MAJOR — several dataset-derived sub-figures were
      computed but never pinned: "all but four nationally open" (369+4 split within the
      risk-class category), the TERTUTUP 62+6 split (0%-foreign-ownership vs. the 100%-catalogue
      "trap" codes), and the remainder's 2+2+2 composition. MAJOR — repeated EN figures were
      unpinned at their OWN occurrence: the methodology-paragraph total, the headline's own
      percentage sentence, and the breakdown-intro count.
    status: CONFIRMED
    cure: >-
      Replaced the whole it/id character-window mechanism with POSITION: every number token in
      the article body (frontmatter stripped) is extracted once, in reading order, as a maximal
      digit run — `numberTokens`/`nthNumberToken` — so "373" can never match inside "1373" (a
      whole-token equality, not a substring test), and every pin reads its OWN fixed occurrence
      index rather than searching the whole document, so a wrong-paragraph mutation can no
      longer hide behind a correct sibling elsewhere. The it/id token order was measured once
      against the live files (2026-09-15) and is IDENTICAL in both languages (the translator
      reorders nothing, only rewords), giving 23 positional pins per locale — covering every
      figure the review named, in both it and id, not just where it demonstrated the bug.
      `countBreakdown()` gained `riskClassNationallyOpen`/`riskClassNotNationallyOpen`
      (predicate: `pma_status === "TERBUKA"` among risk-class-blocked rows — measured 369/4,
      matching "all but four" exactly) and `tertutupZero`/`tertutupNonZero` (predicate:
      `pma_max_asing === 0` among TERTUTUP rows — measured 62/6, and the 6 nonzero codes are
      EXACTLY the six examples the article names). 9 new EN sentence-regex anchors added
      (methodology total, headline percentage, breakdown-intro count, the "four" spelled-out
      sub-count via a derived word-lookup table so nothing is hard-coded, the TERTUTUP 62/6
      split, and the remainder's three sub-counts). Both of the reviewer's demonstrated
      mutations were reproduced VERBATIM against the live it.mdx (not a synthetic string) and
      confirmed red before restoring the file — see receipts below — plus 4 permanent
      mutation-guilt tests (2 mutations × it/id) and 1 EN guilt test now living in the suite.
      IT/ID no longer pin "not the wrong-figure occurrence, some other occurrence of the same
      digits" — each of the 23 positional pins is anchored to a fixed index, not a value search,
      and a body-length sanity check fails loudly first if the article's numeral count ever
      drops below the map's expectation.

decisions:
  - id: D1
    what: >-
      Fix ONLY the three drifted figures (372→373, 33.2%→33.3%, 70→65) in each locale; leave
      the "519 blocked" framing, the "6 — the remainder" grouping and every other sentence
      untouched.
    why: >-
      Lane brief (WH-LANE-PR6.md step 3) is explicit: "correct the articles (only the wrong
      figures; do not rewrite framing — the '519 blocked' framing stays until a separate
      Bali-overlay window reworks it)". The "6" grouping was independently re-measured and
      found truthful (2+2+1+1), so it needed a pin, not a correction.
  - id: D2
    what: >-
      Pin all six category counts (not just the two that drifted) plus the narrative
      percentage and the scope-dependent count, and add an invariant that the six counts sum
      to the blocked total.
    why: >-
      Lane brief step 3 asks for "each category count in the list" — pinning only the
      previously-wrong ones would leave the still-correct 48/68/17/7/6 exposed to a future
      drift with no test to catch it, and would not implement the requested invariant (a
      future cure could change one status's count without the six figures still summing to
      the printed headline).
  - id: D3
    what: >-
      SUPERSEDED by the Codex review cure (see dissent below). The original cure for the
      TERTUTUP example-list gap was a wider character-window (500 vs. 400); the whole
      character-window mechanism it patched was itself replaced by exact positional-token
      matching, which has no window to size at all for these six pins.
    why: >-
      Kept here rather than deleted so the pack's own history shows the superseded approach
      was tried, measured (421-424 chars, over the 400 default) and then subsumed by a
      strictly stronger fix once the review found the window mechanism's deeper flaw.
  - id: D5
    what: >-
      it/id positional pins are keyed by a fixed OCCURRENCE INDEX into the article body's
      number-token sequence (measured once, 2026-09-15), not by searching for a value.
    why: >-
      The review's second demonstrated mutation (finding 1) exploited exactly the "search
      anywhere, retry every start" design: a probe can validate against ANY matching occurrence
      in the whole document, so a mutated sentence can hide behind an untouched, genuinely
      correct sibling elsewhere. Position is immune by construction — index 40 (the narrative
      percentage) is blind to whatever index 7 (the headline percentage) says, so mutating one
      while leaving the other correct still fails the mutated one specifically. This is safe
      under the file's own stated threat model (hourly WORDING drift, never paragraph
      reordering) and was verified, not assumed: dumping every number token's index across
      EN/IT/ID confirmed identical structural order in all three (48 tokens each).
  - id: D6
    what: >-
      The "all but four nationally open" sub-count is pinned in EN only, via a word derived
      from a small lookup table (`SMALL_NUMBER_WORDS[computedValue]`), not pinned at all in
      it/id.
    why: >-
      The figure is spelled out as a WORD in the prose ("four"/"quattro"/"empat"), not a digit,
      so the digit-token positional mechanism cannot see it, and it/id wording is rewritten
      hourly, so a word-anchored regex there would be exactly the wording-treadmill the file's
      design already rejects for it/id. The underlying predicate (`pma_status === "TERBUKA"`
      among risk-class-blocked rows) was independently discovered and verified to produce
      exactly 4, matching the live prose — not invented — and is asserted as a standalone
      sanity bound (`SMALL_NUMBER_WORDS.length`) so a future value that no longer fits a small
      English word fails loudly instead of reading `undefined`.
  - id: D4
    what: >-
      The invariant test recomputes both sides from the dataset (six category counts vs.
      `countFromCanonical().blocked`) rather than parsing the prose's own printed numbers.
    why: >-
      Every category count and the headline blocked count are ALREADY pinned individually
      against the same dataset elsewhere in this file, so this test transitively guards "the
      printed list sums to the printed title" while staying a pure data-partition check — it
      also fails if a future dataset cure introduces a NEW blocked `l4_bali.status` that none
      of the five named categories or the "remainder" group covers.

