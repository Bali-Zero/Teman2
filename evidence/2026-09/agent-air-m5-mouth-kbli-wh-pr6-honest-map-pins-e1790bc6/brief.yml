      `git diff apps/mouth/src/content/articles/business_regulations/the-honest-map-blocked-bali-codes*.mdx`
      shows exactly 3 changed lines per file (9 total), each swapping only the drifted digit.
  A2: >-
    Every category count in the breakdown list, the narrative percentage and the
    scope-dependent count are pinned in `kbli-prose-pins.test.ts`, computed from
    `KBLI_2025_FINAL_CLEAN.json` via `l4_bali.status`/`l4_bali.blocked` — never hard-coded —
    for all three locales (EN sentence-regex, IT/ID number-window per the file's existing
    convention), plus an invariant that the six category counts sum to the headline's
    blocked total.
    probe: >-
      `cd apps/mouth && npx vitest run src/lib/kbli-prose-pins.test.ts` — the new pins were
      observed failing on the unmodified (pre-fix) articles for the stated reason (373≠372,
      33.3≠33.2, 65≠70), then passing after the article fix; 57/57 passing in the final run
      together with `kbli-withdrawn-umkm-inference.test.ts` and `blog/categories.test.ts`
      (the only other consumer of this article slug, via `grep -rl` under `apps/mouth/src`).
  A3: >-
    No superseded reading is reintroduced and no other article/test asserts a number this PR
    changes.
    probe: >-
      `npx vitest run src/lib/kbli-prose-pins.test.ts` — "no superseded reading of this
      dataset survives in any language" passes unchanged; `grep -rl
      "the-honest-map-blocked-bali-codes" apps/mouth/src` finds no third consumer beyond the
      two test files already run.

