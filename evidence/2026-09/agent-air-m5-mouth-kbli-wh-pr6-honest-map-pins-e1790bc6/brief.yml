  article `the-honest-map-blocked-bali-codes` (EN/IT/ID) states three figures that drifted
  from `apps/mouth/data/KBLI_2025_FINAL_CLEAN.json` — 372 blocked-by-risk-class (measured
  373), 33.2% in the 945/39% correction paragraph (measured 33.3%, the same article already
  says 33.3% elsewhere) and 70 scope-dependent among the not-blocked codes (measured 65). Its
  own category list sums to 518 while its title says 519. Correct the three drifted figures in
  all three locales and extend `kbli-prose-pins.test.ts` so every category count in the
  breakdown, the narrative percentage and the scope-dependent count are pinned to the dataset
  — never hard-coded — plus an invariant asserting the six published category counts sum to
  the headline's blocked total. Independent of the 19-code W-H verdict work; the "519 blocked"
  framing itself is untouched (a separate B1 Bali-overlay window owns that rewrite).
