pii_scan: clean
cloud_ok:
  "No DPA is relied on here, because no personal data left the machine. What was sent to the two
  non-local review seats (codex, agy) is THIS DIFF: source code, SQL, tests and internal
  @balizero.com staff addresses. No client row, name, phone, passport, NPWP or client_id was in
  the prompt, and the seats were given the diff inline precisely so they would not go reading a
  database. The live DB proof ran locally against a throwaway database of synthetic rows. R10
  fires because the diff TOUCHES a CRM path, which is true and worth flagging — the declaration
  is that the touch is code, not data."
pii_scan_note:
  "Every address in the diff, the tests, this pack and the PR body is an internal @balizero.com
  staff mailbox — no client name, company, phone, passport, NPWP, NIB or client_id appears
  anywhere. The live database proof ran against a throwaway local database (nuz_r5_mig319,
  dropped-and-recreated at the start of the run) seeded with synthetic rows named 'Synthetic
  Alpha/Bravo/Charlie/Delta Ltd'; production data was never read, copied or transcribed. The row
  counts quoted (2 clients, 12 LKPM reports) are counts, not rows."
dissent:
  - seat: claude-opus-5 (conducting, against its own candidate)
    objection:
      "Deploy ordering leaves a real window. `release_command` applies 319 BEFORE the new code
      serves traffic, so for the duration of the rolling deploy the OLD code is live against the
      NEW constraint: a tax member assigning in that window submits a retired alias, the old
      validator accepts it, and Postgres refuses the write with a CheckViolationError."
    status: CONFIRMED
    resolution:
      "Not curable inside one PR — removing the window needs two deploys (normalize first, then
      the constraint), which costs a day for a failure mode that lasts minutes. Measured
      mitigation instead: this deploy lands at ~02:30 WITA, when no tax consultant is working,
      and the failed gesture is retryable with no data loss. Stated as the rollback trigger in
      the PR body rather than left for someone to discover from a 500."
  - seat: claude-opus-5 (conducting)
    objection:
      "The rollback cannot distinguish a row that legitimately started using tax@balizero.com
      AFTER the migration from a pre-migration row still on the ghost, and will revert both."
    status: CONFIRMED
    resolution:
      "Kept, stated in the migration header under 'HONESTY ABOUT WHAT THIS CANNOT RESTORE'. The
      alternative — a column recording which rows 319 touched — is more schema than the defect
      is worth, and the rollback is an emergency path, not a routine one."
  - seat: claude-opus-5 (conducting)
    objection:
      "The kita dropdown still sends the retired addresses, so after this merges a client saved
      through it comes back from the API on the REAL address, which that dropdown has no option
      for: the select will render as '— not assigned —' even though the client IS assigned."
    status: CONFIRMED
    resolution:
      "Real, and it is why this window does not stop at the backend: the mouth-side alignment
      ships as a separate PR right after this one (mandate order: PR-3a backend before PR-3b
      mouth). Until it lands the DATA is correct and the WRITE works — only the rendering of the
      current value is wrong."
  - seat: claude-opus-5 (conducting)
    objection:
      "The 'five real addresses' census was measured live against production by the PREDECESSOR
      session, not by this one. Re-verification from this host is blocked: scripts/pg.sh finds no
      Keychain password for target=prod on Mini."
    status: CONFIRMED
    resolution:
      "Not left on a single inherited measurement: two independent registers on disk agree with
      it — apps/mouth/src/data/team-roster.ts carries faysha.tax@balizero.com, and
      team-public-listing.ts documents the slug/email disagreement explicitly ('the roster slug
      is faisha, the email prefix is faysha.tax'). Declared as inherited rather than restated as
      if this session had run the query."
  - seat: codex-gpt-5.6-sol
    objection:
      "BLOCKER — the first draft was a CUT-OVER: `release_command` applies the migration before
      the new code serves traffic, and `.github/workflows/fly-deploy.yml` documents image-only
      rollback, so the incompatibility would OUTLIVE a rollback meant to cure it."
    status: CONFIRMED
    resolution:
      "Cured, not mitigated: the forward CHECK is now the UNION (real addresses + the two retired
      aliases), so no code version is ever refused; the row rewrite still happens on this deploy,
      so the whole business effect lands now. An executable test pins it
      (test_expand_keeps_the_retired_aliases_writable). Dropping the aliases is a separate
      migration once the kita dropdown stops sending them."
  - seat: codex-gpt-5.6-sol
    objection:
      "HIGH — a failed write logs the exception verbatim, and a Postgres constraint violation
      carries `Failing row contains (...)`: the client's name, phone, passport and NPWP land in
      the application log."
    status: CONFIRMED
    resolution:
      "Verified independently on Postgres 17 with a sentinel row before curing it — the sentinel
      appeared in both `str(e)` and `e.detail`. All four database-error branches now log a
      signature (class, SQLSTATE, constraint/column/table) and never the exception, with guilt
      and innocence tests. Pre-existing on main, not introduced here; cured here because this
      migration makes that branch reachable. The generic `Unexpected error` line at the bottom of
      the same file still interpolates the exception and is NOT touched — out of this PR's
      concern, recorded rather than silently left."
  - seat: codex-gpt-5.6-sol
    objection:
      "HIGH — the migration takes ACCESS EXCLUSIVE on `clients`, then on `lkpm_reports`, and
      holds both to commit; unrelated CRM and portal reads queue behind it."
    status: CONFIRMED
    resolution:
      "`SET LOCAL lock_timeout = '5s'` and `statement_timeout = '60s'` at the head of the forward
      section (LOCAL: dies with the transaction, never leaks into the pool). The migration now
      fails fast and aborts the deploy rather than stalling the CRM — the better of the two
      outcomes. Splitting the avatar UPDATE into its own migration was NOT done: it touches
      team_members, a third table, and would add a second migration number to the race for no
      reduction in the lock window that matters."
  - seat: codex-gpt-5.6-sol
    objection:
      "MEDIUM — every parity test passes with the constraints inverted: changing both `IN`
      predicates to `NOT IN` keeps them green while the SQL aborts the deploy."
    status: CONFIRMED
    resolution:
      "The strongest finding of the round, and reproduced here before curing: under that exact
      mutation the parity file stayed 7/7 green and the new executable test went to 8 errors.
      `tests/migrations/test_migration_319_applies_to_postgres.py` runs the forward half through
      the runner's own `split_migration_sql()` against a throwaway database and asks Postgres
      what it accepts. It SKIPS where no Postgres is reachable — which is CI today: declared, not
      hidden. The fleet machines and anyone touching this migration get the executable proof."
  - seat: codex-gpt-5.6-sol
    objection:
      "MEDIUM — pinning migration 319 by name makes the documented procedure for the next staff
      change fail this test, pressuring a maintainer to rewrite an already-applied migration."
    status: CONFIRMED
    resolution:
      "The parity file no longer names 319: it resolves the HIGHEST-numbered migration that adds
      each constraint, and asserts the two invariants true in both the expand and the later
      contract state (every canonical address accepted; nothing outside canonical + known aliases
      accepted), with a guilt control for each."
  - seat: agy-gemini-3.1-pro
    objection:
      "HIGH — a REAL consultant's address submitted with different case or stray whitespace
      (`' Tax@BaliZero.com '`) is returned verbatim by normalize() and then refused by an
      allowlist that compares exact bytes."
    status: CONFIRMED
    resolution:
      "Cured: normalize() now also resolves a canonical address that differs only in case or
      padding, over LKPM_ASSIGNEES (the wider set, so the LKPM path is covered too). An address
      matching neither rule is still returned EXACTLY as received, so the allowlist judges it and
      the error quotes back what was sent. Three tests."
  - seat: agy-gemini-3.1-pro
    objection:
      "BLOCKER — `ClientCreate` does not normalize, so creating a client with a legacy alias
      fails; BLOCKER — Krisna is missing from TAX_CONSULTANTS_NON_MANAGER, so his 4 PTs get no
      deadline reminder; HIGH — Veronika, now the assignee of rewritten rows, is filtered out of
      the same tuple and never notified."
    status: RETRACTED
    resolution:
      "All three checked on disk and none survives. `ClientCreate` (crm_clients.py:244-330) has
      no `tax_consultant` field at all — the field and its validator are both inside
      `ClientUpdate`, which begins at line 334; the seat read the diff's line numbers without the
      class boundaries. `TAX_CONSULTANTS_NON_MANAGER` has exactly one consumer,
      `_send_unassigned_alert` (lkpm_deadline_notifier.py:254) — the alert for UNASSIGNED
      reports, addressed to the pool with the manager in CC; per-assignee reminders go to
      `row['lkpm_assigned_to']` directly, so Veronika is notified for her own rows and Krisna's
      absence from that tuple is neither new (the hard-coded list before this diff did not carry
      him either) nor a reminder failure."
