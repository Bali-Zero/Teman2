diff:
  net_lines:
    "One new .sql migration (expand + symmetric rollback), one new shared constants class, one new
    executable migration test, two new/rewritten parity and router test files, four allowlist
    copies collapsed into the shared constant, a PII fix in the shared database-error handler, and
    this pack. Zero frontend — the mouth-side alignment is PR #6677. No count is narrated here on
    purpose: the previous attempt (#6676) went red because its numbers were computed before the
    pack commit that changed them, and a number that must be re-measured after every amend is a
    red check waiting to happen."
  behaviour_change:
    "At apply time migration 319 rewrites 2 rows in clients and 12 in lkpm_reports off two ghost
    addresses onto the two real ones, swaps both CHECK constraints to the team_members-derived
    list, and NULLs two team_members.avatar values whose portrait files a sibling D6 PR deletes.
    At request time, a write carrying a retired alias is now accepted and stored under the real
    address instead of being rejected with a 422; an unknown address is still refused. Two tax
    consultants who could not be assigned under their own address can be, and the LKPM deadline
    reminder now addresses a mailbox that exists."
