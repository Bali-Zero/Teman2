    cmd: "cd apps/backend-rag && SKIP_SENTRY_INIT=1 PYTHONPATH=. .venv/bin/python -m pytest backend/tests/migrations/test_migration_319_applies_to_postgres.py backend/tests/migrations/test_tax_consultant_allowlist_sql_parity.py"
