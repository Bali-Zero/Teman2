brief_ref: evidence/brief.yml
council_run: journal.jsonl
pii_scan: clean
diff: >-
  PR-1 of 2. New .github/workflows/ci-image-mirror.yml: a mirror job copies
  the linux/amd64 manifest of docker.io/library/{postgres:15,redis:7} (falling
  back to public.ecr.aws) digest-preserving into ghcr.io/bali-zero/ci-mirror/;
  a verify job pulls both back as service containers with credentials =
  github.actor / secrets.GITHUB_TOKEN under packages:read and prints their
  versions; a prune job deletes only untagged versions beyond the two newest.
  One line in main-push-failure-watch.yml registers the new workflow name. The
  service-image pin test sanctions the ghcr prefix next to the ECR one and adds
  guilt checks for ghcr service refs that the mirror does not produce, that
  lack the job's own GITHUB_TOKEN, or whose job token has no packages:read,
  with synthetic guilt and innocence fixtures and digest-aware repo parsing.
  No consumer workflow and no image version changes here.
