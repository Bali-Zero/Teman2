dissent:
  - seat: codex-gpt-6-astra
    objection: The ghcr check verified credentials but not the job's effective token permissions.
    status: CONFIRMED
    resolution: _token_can_read_packages added, with guilt and innocence fixtures (mutation M5).
  - seat: codex-gpt-6-astra
    objection: The non-vacuity check counted textual occurrences, comments included.
    status: CONFIRMED
    resolution: it now counts parsed service refs (mutation M4).
  - seat: codex-gpt-6-astra
    objection: The ghcr prefix check over-matched unrelated ghcr images.
    status: CONFIRMED
    resolution: applies only to postgres/redis refs (mutation M6 stays green).
  - seat: kimi-code/k3
    objection: The mirror's own docker.io source is an anonymous pull on a shared runner IP, so the seed run can fail.
    status: CONFIRMED
    resolution: falls back to public.ecr.aws (same manifests) with skopeo --retry-times 3; a failed weekly run leaves the previous mirror serving and pages via the watcher.
  - seat: kimi-code/k3
    objection: First-push packages are private and never pruned; a Free org caps private package storage at 500 MB.
    status: CONFIRMED
    resolution: prune job keeps the two newest untagged versions and never touches tagged ones; flipping the packages public is listed for the operator.
  - seat: kimi-code/k3
    objection: The header claimed byte-identical tags, but only the selected linux/amd64 manifest is preserved.
    status: CONFIRMED
    resolution: comment reworded.
  - seat: kimi-code/k3
    objection: ubuntu-latest contradicts the pinned skopeo premise.
    status: CONFIRMED
    resolution: runs-on ubuntu-24.04 and skopeo --version printed.
  - seat: kimi-code/k3
    objection: import yaml may be missing in CI.
    status: RETRACTED
    resolution: immune-enforcement.yml installs PyYAML==6.0.3 before running this test.
  - seat: kimi-code/k3
    objection: The watcher only sees push failures, so a failing weekly mirror is silent.
    status: RETRACTED
    resolution: main-push-failure-watch.yml's own SCOPE comment covers push- and schedule-triggered runs on main.
  - seat: kimi-code/k3
    objection: Only services blocks are audited; container and docker run pulls are not; the credential check rejects a PAT; MIRRORED_IMAGES duplicates the matrix.
    status: PLAUSIBLE
    resolution: kept. No consumer uses container or docker run for these images, and a PAT would be a new credential needing owner authorization.
  - seat: codex-gpt-5.6-sol
    objection: MIRROR_PREFIXES still accepts the failing ECR prefix, so a consumer can stay on ECR with tests green.
    status: PLAUSIBLE
    resolution: deliberate for PR-1, whose consumers cannot move before the mirror is seeded. PR-2 moves them and drops ECR from the sanctioned set.
  - seat: codex-gpt-5.6-sol
    objection: prune is skipped when either mirror leg fails.
    status: CONFIRMED
    resolution: prune runs if not cancelled.
  - seat: codex-gpt-5.6-sol
    objection: GITHUB_TOKEN was matched as a substring, so secrets.GITHUB_TOKEN_BOGUS passed.
    status: CONFIRMED
    resolution: exact expression match, with a guilt fixture.
  - seat: codex-gpt-5.6-sol
    objection: Digest references evaded repo-name parsing.
    status: CONFIRMED
    resolution: _repo_name strips the digest and host port (mutation M7).
  - seat: claude-opus-5-5
    objection: >-
      The mandate asked that the CI image major equal PROD's. PROD is 17.9 and
      CI is 15; this PR keeps 15 because the same mandate forbids changing what
      the tests run against. The skew stays open as its own concern.
    status: PLAUSIBLE
