  runner: >-
    ubuntu-24.04 image 20260920.314.1 ships Skopeo 1.13.3, PostgreSQL 16.15
    (service disabled) and no Redis.
  token: >-
    repo default_workflow_permissions = read (contents+packages read), and none
    of the 4 consumer workflows declares a top-level permissions block, so their
    jobs already hold packages:read. Repo is PUBLIC, org plan free.
  siblings: >-
    10:10Z open PRs touching .github/workflows: #7102 (tests.yml, codecov bump,
