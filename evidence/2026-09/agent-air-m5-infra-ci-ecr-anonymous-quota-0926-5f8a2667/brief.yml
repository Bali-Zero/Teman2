task_id: ci-ecr-anonymous-quota-0926
gear: 3
colour: BLUE
objective: >-
  No anonymous-registry pull on the CI critical path, without changing what the
  tests run against. PR-1 of 2 (this brief): a weekly + on-demand workflow that
  copies the exact linux/amd64 images the CI `services:` blocks use
  (docker.io/library/postgres:15, redis:7) digest-preserved into
  ghcr.io/bali-zero/ci-mirror/, plus a verify job that pulls them back as
  service containers with a read-only GITHUB_TOKEN. PR-2, opened from fresh
  origin/main only after this workflow's first run proves the packages exist,
  points tests.yml, fly-deploy.yml, scripts-tests-sweep.yml and
  intel-router-tests.yml at the mirror with a `credentials:` block.
ground:
  measured_at: "2026-09-26T10:05Z-10:20Z"
  failure: >-
    gh run list --workflow tests.yml --limit 150 (2026-09-24T22:30Z to
    2026-09-26T10:15Z): 9 failures, 6 of them `toomanyrequests: Data limit
    exceeded` on `docker pull public.ecr.aws/docker/library/postgres:15`, all
    6 since 2026-09-26T04:24Z (61 runs in that window), one of them a
    merge_group run (36231063029), so the queue itself is hit.
  image_pulls: >-
    9 service images in 4 workflows (tests.yml x5, scripts-tests-sweep.yml x2,
