dissent:
  - seat: gpt-5.6-sol
    objection: >-
      (O1, BLOCKER F1) Omitting `ACL` on put does not make a bucket private
      when its policy grants public reads; the spec fixes a private bucket
      and the adapter took the environment's word for it.
    status: CONFIRMED
    disposition: >-
      CURED as far as an adapter can: `assert_private()` probes
      PublicAccessBlock and PolicyStatus, refuses a bucket either probe
      calls public, treats an unimplemented or malformed answer as UNKNOWN
      (O2 F1, O3 N3), and refuses two unknowns unless the caller passes
      `require_verified=False` and says why. DECLARED where it is
      provisioning: the bucket `garuda-voa-artifacts` does not exist yet
      and its privacy is Zero's to configure (pending #G); the PR body says
      so. Residual F1 (O3/O4 DECLARED-ACCEPTABLE): one probe True plus one
      None is accepted -- a store that implements only one probe and calls
      the bucket private on it is believed.
  - seat: gpt-5.6-sol
    objection: >-
      (O1, BLOCKER F2) `GARUDA_ARTIFACTS_ENDPOINT_URL` accepts any host: a
      misconfigured or attacker-controlled endpoint receives the body and a
      SigV4 signature made with the dedicated key.
    status: CONFIRMED
    disposition: >-
      CURED: https only, ASCII host ending `.tigris.dev`, no userinfo, port,
      path, query or fragment; a malformed port is a configuration refusal
      (O3 N8). Residual (O4 DECLARED-ACCEPTABLE): a trailing `/` is
      normalised away rather than refused.
  - seat: gpt-5.6-sol
    objection: >-
      (O2, F5 PARTIAL; O3/O4 DECLARED) `IfNoneMatch="*"` is sent, but a
      store that silently ignores the condition overwrites without anyone
      noticing.
    status: CONFIRMED
    disposition: >-
      CURED for the second layer: HEAD before every PUT refuses an existing
      key (and a HEAD 200 without an ETag is an existing object, O3 N4).
      DECLARED: the window between HEAD and PUT on a NON-compliant store is
      a TOCTOU the adapter cannot close from outside the store; Tigris
      honours If-None-Match, and the HEAD is the belt for a store that does
      not.
  - seat: gpt-5.6-sol
    objection: >-
      (O2, N1) A PUT that commits but surfaces a retryable 500 gets 412 on
      the retry and is misreported as ArtifactAlreadyExists.
    status: CONFIRMED
    disposition: >-
      CURED: after a 412 on a retry, HEAD's ETag equal to the MD5 of the
      body we sent is read as our own committed write; anything else --
      including an absent or non-MD5 ETag (O3 N1) -- is a collision.
      DECLARED (O4 DECLARED-ACCEPTABLE): MD5 equality is content equality,
      not writer identity; another writer committing identical bytes under
      our key in that window would be read as ours, and the bytes would be
      identical, so the customer would receive what the row says.
  - seat: gpt-5.6-sol
    objection: >-
      (O3, N5 MEDIUM) The chunk list and the joined body coexist, so peak
      payload memory approaches twice the ceiling plus per-chunk overhead.
    status: CONFIRMED
    disposition: >-
      PARTIALLY CURED: one growing bytearray, no chunk list. The final
      `bytes(buf)` copy remains, so the peak is the buffer plus its
      immutable copy -- about twice the ceiling -- and the comment says
      that figure rather than "the ceiling" (O4 DECLARED-ACCEPTABLE). A
      zero-copy handoff would need the digest verified on the bytearray
      and a memoryview returned; declined as a change to the port's return
      type for 10 MiB of headroom.
  - seat: gpt-5.6-sol
    objection: >-
      (O3, N6 MEDIUM) Transient stream truncation was mapped to a refusal
      inside `_once`, before the retry layer: a truncated body was never
      retried.
    status: CONFIRMED
    disposition: >-
      CURED: IncompleteReadError and ResponseStreamingError are transient
      wire faults; the whole GET restarts through the retry budget and only
      an exhausted budget lets the error out -- as itself, not as a port
      exception, which K3 then asked the port to state (below). Measured: a
      body one byte short of its declaration costs 3 GETs and sleeps
      [2.0, 4.0] before raising.
  - seat: kimi-code/k3
    objection: >-
      (MAJOR, x2) `ArtifactDigestMismatch` was documented as a hash
      disagreement but raised for four length refusals; `fetch_and_verify`'s
      Raises sentence read as the complete vocabulary while the adapter also
      lets `IncompleteReadError` and permanent `ClientError` escape, and the
      fake can raise neither -- a service written against the fake would
      learn the true vocabulary from a stack trace.
    status: CONFIRMED
    disposition: >-
      CURED in 3933ea4d0e: both docstrings now list what both sides raise
      and say why one exception covers length and hash; `put` gained the
      docstring it lacked (its `ValueError` for an over-ceiling body named);
      the port states which two exceptions escape on the adapter only and
      that the fake has no wire. Not laundered into port exceptions: a
      consumer that maps "the store is broken" to "the artifact is missing"
      would lie to the customer.
  - seat: kimi-code/k3
    objection: >-
      (MINOR) The fake's exceptions carried the RAW key while the adapter's
      carry sha256(key)[:12]; a service test asserting on a message would
      bake in a shape production never emits, and a realistic key in a
      fixture would land in failure output.
    status: CONFIRMED
    disposition: >-
      CURED: `key_ref` moved to the port, both sides use it, and
      test_fake_exceptions_carry_the_key_ref_not_the_key proves the fake's
      three port exceptions never carry the key and carry exactly the
      adapter's shape.
  - seat: kimi-code/k3
    objection: >-
      (NIT) `from exc` chains keep the original ClientError as `__cause__`,
      and a real NoSuchKey response embeds the raw key in
      `exc.response["Error"]["Key"]` -- `str()` never shows it, but a
      middleware serialising `exc.response` would.
    status: CONFIRMED
    disposition: >-
      NOT cured, declared: the cause chain is kept because a refusal
      without its cause is undebuggable; no middleware in this codebase
      serialises `exc.response`, and Sentry's `include_local_variables=False`
      plus `_before_send` (backend CLAUDE.md, load-bearing) are the fence
      for exception payloads. Recorded here so the S2b wiring PR, which is
      where an exception first meets a handler, checks it.
