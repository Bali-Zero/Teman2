what_changed: |
  3 code files, +30/-2 (git numstat merge-base..HEAD, pack excluded). infra/launchagents/wrappers/claude-cascade.sh:
  build_isolated_provider_env() seeds ISOLATED_PROVIDER_ENV with
  `env -u TERM_PROGRAM -u TERM_PROGRAM_VERSION` (was `env`) plus a comment
  naming the reader (context_window_guard.py's seat choice) and the failure
  it prevents. infra/launchagents/wrappers/cron-agent.sh: the same two flags
  on claude_oauth_env's env_args (review finding, same concern).
  scripts/tests/test_claude_cascade_shell.py: one hermetic test — the parent
  exports TERM_PROGRAM=ghostty and TERM_PROGRAM_VERSION=1.2.3, the fake seat
  prints both, the assertion is `term=unset ver=unset`; run red first
  (`term=ghostty`) against the unpatched wrapper.

proof: |
  Receipts below. Floor 3 sourced from PATH (infra/launchagents/*) reproduced
  on the merge-base diff (aee320c764); zsh -n green; the whole cascade shell
  suite green (71 = 70 pre-existing + 1 new); the new test is falsifiable
  (red without the shell change). The change is inert on main until the
  reader lands: PR #5987 merged as fcbba8930b while this pack was written, so
  from now on a manual cascade run from Ghostty produces exactly one
  continuation. Bites: consumer is ~/scripts/claude-cascade.sh on Pro/Mini
  (home-fork pair, refreshed by the shipping session after merge, verified by
  md5 against origin/main); observation is `lint_home_fork.py` staying green
  on that pair and the CI run of Backend Tests (Python) carrying
  test_seat_never_sees_the_operators_terminal_program.

dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      The comment's mechanism ("the guard opens a window AND the wrapper
      re-invokes: a double jump") is inexact: headless_jump_raised_by already
      skips seat=ghostty files, so the wrapper never re-invokes on a Ghostty
      trip. kimi #9 identical.
    status: CONFIRMED
    resolution: >-
      Comment rewritten to the real failure: the guard hands the mandate to a
      GUI window nobody asked for and the wrapper accepts the seat's partial
      output as complete. The fix is unchanged.
  - seat: codex-gpt-5.6-sol
    objection: >-
      The test asserts only the first token1 invocation; hops and the team
      path are not directly covered.
    status: PLAUSIBLE
    resolution: >-
      Hops call the same claude_seat_invoke and every seat path expands the
      same ISOLATED_PROVIDER_ENV array (receipt: grep, 9 sites, none outside
      it); one -u at the array head is the whole mechanism, so one probe of
      the array suffices. Not extended.
  - seat: kimi-code/k3
    objection: >-
      Ghostty also exports TERM_PROGRAM_VERSION, which survives `-u
      TERM_PROGRAM`; cheap hardening not taken.
    status: CONFIRMED
    resolution: >-
      `-u TERM_PROGRAM_VERSION` added; the test exports both and asserts
      both unset.
  - seat: kimi-code/k3
    objection: >-
      On this base the guard has no TERM_PROGRAM reader (it is on PR #5987's
      branch): the diff is inert until #5987 lands.
    status: CONFIRMED
    resolution: >-
      Overtaken by events: #5987 merged as fcbba8930b while this pack was
      written; the brief's assumption probe names it. The change is live the
      moment it lands.
  - seat: kimi-code/k3
    objection: >-
      infra/launchagents/wrappers/cron-agent.sh has the identical isolation
      pattern (claude_oauth_env) and was not scrubbed — inconsistent with the
      "tutti i seat" ruling.
    status: CONFIRMED
    resolution: >-
      Same two -u flags added to cron-agent.sh's env_args with the same
      comment; bash -n green and its two shell suites
      (test_cron_agent_oauth_cascade.sh, test_cron_agent_context_diet.sh)
      pass. One concern, three files.

