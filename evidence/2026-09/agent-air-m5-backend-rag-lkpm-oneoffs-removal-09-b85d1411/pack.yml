  Tracked-file exposure window, first-commit-to-merge, per file (counts only, no identifiers):
  extract_company_data.py 2026-03-29 -> merge; fix_lkpm_q1_2026_client_ids.py 2026-04-08 ->
  merge; import_lkpm_q1_2026_receipts.py 2026-04-15 -> merge. All three were public on
  Bali-Zero/Teman2 (a public repo) for the full window. The SA identity metadata in
  extract_company_data.py (project_id, client_email, numeric client_id) was public for the same
  window; the client_email string for this same SA remains tracked in 6 OTHER files after this
  merge (docs/research/evaluator) — not "no longer tracked", corrected from the prior draft (N4).
  SEPARATELY, and more seriously: a real PEM private key for this SAME service account WAS
  committed to this public repo's git history — added 2026-01-26, removed 2026-03-26, re-added
  2026-03-29 (in the file this PR deletes), moved to env-only 2026-04-06. Zero tracked files
  carry it at HEAD; deleting files does not un-publish history the repo has already served
  publicly. The leaked private_key_id is identified only by its sha256[:16] fingerprint
  (`51ffead1acc88a97`) — never the id or key value itself, anywhere in this PR. Rotation status
  is UNKNOWN to this session and to memory. Owner action, required: disable that key id in GCP
  IAM and review the service account's access logs from 2026-01-26 onward. Additionally (N5,
  not fixed here): 15 residual company-name-string hits remain across 11 other tracked files (4
