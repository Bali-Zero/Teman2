disclosure: >-
  CORRECTED again this round (gate-7512.md B3' — the round-2 disclosure below this line's prior
  text was itself wrong, measured by PEM-header counts instead of key identity). Tracked-file
  exposure window, first-commit-to-merge, per file (counts only, no identifiers):
  extract_company_data.py 2026-03-29 -> merge; fix_lkpm_q1_2026_client_ids.py 2026-04-08 ->
  merge; import_lkpm_q1_2026_receipts.py 2026-04-15 -> merge. All three were public on
  Bali-Zero/Teman2 (a public repo) for the full window. The SA identity metadata in
  extract_company_data.py (project_id, client_email, numeric client_id) was public for the same
  window; the client_email string for this same SA remains tracked in 6 OTHER files after this
  merge (docs/research/evaluator) — not "no longer tracked", corrected from the prior draft (N4).
  SEPARATELY, and more seriously, and measured by private_key_id/key-body IDENTITY, not by
  header counts: this SAME service account had TWO SEPARATE private keys committed to this
  public repo's git history. Key id sha256[:16] `9a53ecd0e72e1e8a` was public 2026-01-26 ->
  2026-03-26 (59 days), in 3 scripts/ files (none touched by this PR). Key id sha256[:16]
  `51ffead1acc88a97` was public 2026-03-29 -> 2026-04-06 (8 days), in
  apps/backend-rag/extract_company_data.py, the file this PR deletes. These are two distinct
  keys, not one key re-added. Zero tracked files carry either at HEAD; deleting files does not
  un-publish history the repo has already served publicly. Rotation status for BOTH is UNKNOWN
  to this session and to memory. Owner action, required: disable BOTH key ids
  (`9a53ecd0e72e1e8a` and `51ffead1acc88a97`) in GCP IAM and review the service account's access
  logs from 2026-01-26 onward. Separately: this repo's history also holds private keys of 3
  OTHER service accounts — SA `11c4db367d63d024` (key id `dbcaab1b8ed071e7`), SA
  `53037a9b9bdade66` (key id `1d56fc0c67dbdc73`), and SA `7ffcf6fcc86b4951` (key body
  `da10f37ed7ab281b`, no adjacent key id found) — all outside this PR's scope, handed to the
  owner alongside the two key ids above. Additionally (N9, re-measured this round, not fixed
  here): 22 of the 70 distinct company-name strings from the removed rosters still appear at
  head, as 34 (string, file) pairs across 12 files; 21 of those pairs sit in sibling-owned files
  (import_lkpm_q1_2026.py 16, fix_lkpm_orphans_batch1.py 3, process_batches_2_3.py 2), the
  remaining 13 pairs in 9 other files — pre-existing and outside this PR, acknowledged as input
  for a future residuals lane.
