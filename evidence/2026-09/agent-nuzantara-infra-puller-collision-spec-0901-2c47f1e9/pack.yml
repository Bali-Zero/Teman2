dissent:
  - seat: codex-gpt-5.6-sol (cross-family council seat, effort high, read-only)
    objection: >-
      VERDICT: BLOCK, four findings with file:line. (1) The case-only keeplocal fixture does not
      construct keeplocal — the allowlist is written with the ORIGINAL spelling while the incoming
      path is the lowercased one, and the resolver matches with a whole-line byte-literal
      `grep -qxF`, so all seven rename_case_only keeplocal cells run the ORDINARY branch under a
      keeplocal label. (2) The enumerator cannot observe a symlink-preserving cure. (3) Final-state
      measurement is lossy: exact-spelling absence on the flagship axis, and only 14 bytes of
      content sampled. (4) The macOS runner is not gated as claimed.
    status: CONFIRMED
    disposition: >-
      THREE OF FOUR STAND, ONE FALLS, and all three that stand are now CURED — adjudicated by
      execution rather than argument, because a BLOCK accepted wholesale sends the cure where it
      is not needed. (1) STANDS, but the MECHANISM codex named is wrong and that difference is the
      whole cure: it read the defect as the fixture writing the allowlist with the old spelling.
      Measured with three allowlists — original spelling, incoming spelling, and EMPTY — the
      outcomes are byte-identical, so re-spelling fixes nothing. The keeplist check lives only
      inside the branch gated on `git ls-files --error-unmatch` against the LOCAL index; git pairs
      the rename R100 so the resolver is handed only the NEW spelling, which the index never tracks
      until after the ff, so the path always takes the untracked branch, which never consults the
      allowlist. Keep-local is not mis-spelled here, it is UNREACHABLE. The fixture is therefore
      correct and unchanged; four VERDICTS moved OK -> KNOWN_BAD instead. (2) REFUTED by probe —
      `cp -Pp` moves 12 cells, so the predicted silent-STABLE does not occur; the literal blind spot
      in `backed=` is cured anyway (it now distinguishes `symlink` from `file`) because that field
      is introduced by this diff. (3a) CURED: `outcome=absent` was overloaded between "gone" and
      "renamed-but-recoverable" and now reports `case-renamed:<name>:<hash>`. (3b) CURED: the
      14-byte content sample now carries the blob hash — the same rule this instrument already
      imposed on the origin side and had not applied to the result side. (4) disclosed and
      ledgered in b257a0cba1.
      THE PAYOFF IS MEASURABLE: four cells moved from OK to KNOWN_BAD **with the puller unchanged**.
      They moved because the instrument stopped lying about what survived. Register 50/52 -> 46/56.

  - seat: claude-sonnet-5 (matrix-refuter, fresh context)
    objection: >-
      THE INSTRUMENT WAS CONTENT-BLIND. Its ls-tree probes asserted an object's silhouette —
      presence, and at best type — and never its identity, so a fixture built with the wrong
      content satisfied the assertion and the cell recorded a measurement of something else.
      Three faces of the same defect.
    status: CONFIRMED
    disposition: >-
      ACCEPTED and cured with ONE change rather than three patches: assert mode + type + blob SHA
      against hashes derived from the fixture constants, plus a recursive blob count under the
      path. Independently confirmed by a second seat with an engineered collision (receipt above).
  - seat: claude-sonnet-5 (fs-scope-refuter, fresh context)
    objection: >-
      THE CI RED WAS NOT A FLAKE AND NOT A BUG IN THE FIXTURES. The rename_case_only axis measures
      a defect that exists only where the filesystem folds case; on ubuntu the cells still RAN but
      measured an ordinary rename between two distinct paths. It further showed macos-latest was
      already available in-repo — closing a coverage gap the author had deferred.
    status: CONFIRMED
    disposition: >-
      ACCEPTED on both counts. The filesystem became a declared coordinate (three-outcome probe,
      axis held out with the count printed inline, --write-baseline refuses from a partial run),
