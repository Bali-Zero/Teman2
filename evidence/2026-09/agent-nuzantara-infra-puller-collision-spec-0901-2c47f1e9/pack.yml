brief_ref: evidence/brief.yml
council_run: journal.jsonl
plan_ref: >-
  One concern: enumerate the Pro main puller's collision surface instead of patching it a third
  time. The builder contract's own depth-1 rule, applied literally after two consecutive
  fix-of-a-fix cures were each wrong about a neighbouring shape (#5492, #5496). Ships NO
  behaviour change to scripts/pro/pro-git-pull.sh.

lanes:
  - lane: matrix-ground
    role: read
    seat: >-
      claude-opus-5 (conducting session, Pro). Established the premise from the record rather than
      from the mandate text: read #5492's and #5496's real diffs and the resolver's actual branches
      before writing a line. Produced the design rule the whole defect history reduces to —
      classify by the TYPE of the object at "$REMOTE:$f", never by its EXISTENCE.
  - lane: matrix-build
    role: build
    seat: >-
      claude-opus-5 (conducting session, Pro). Wrote the enumerator, the reviewed baseline, the
      spec, and the macOS CI leg. Three defects in this lane were SELF-CAUGHT and are in the
      journal rather than hidden: a slice replacement that duplicated 76 lines and passed `bash -n`
      (found only because all five sabotages then reported CAUGHT on the same cell), a probe of the
      wrong shape that refuted a CORRECT finding, and the document arithmetic error found while
      authoring this pack.
  - lane: matrix-grade-instrument
    role: review
    seat: >-
      claude-sonnet-5 subagents on fresh context, grading a diff they did not author and instructed
      to CONSTRUCT defeating fixtures rather than read and agree. Between them: content-blindness
      (three faces, one cure), the filesystem-scope defect behind the CI red, and an engineered
      hash collision — a regular file carrying the symlink target's exact bytes — used to prove the
      cure discriminates. Verdicts in journal.jsonl.
  - lane: matrix-grade-verdicts
    role: review
    seat: >-
      claude-sonnet-5 subagents on fresh context, grading the HUMAN half — the eighth column no
      machine check reads. Found two false OK verdicts, two over-harsh KNOWN_BADs, and 28 rows
      whose shared reason named neither of the two mechanisms that actually fire. A second pass
      reproduced 22 cells individually to separate the two. Verdicts in journal.jsonl.
  - lane: matrix-grade-refuter-2
    role: review
    seat: >-
      agy/gemini-3.1-pro (second session, fresh context, REFUTE stance), dispatched specifically
      because kimi-code/k3 is 403 (weekly quota) and is not a build-time-selectable stand-in for
      the R9 pool. Not one of R9's three enumerated review seats, so this lane does not itself
      count toward R9's quorum — it is additional cross-family scrutiny on top of the quorum
      journal.jsonl already carries (see seat_diversity_note). Fed the full spec document text
      only, blind to the baseline TSV and the shell script; instructed not to re-find codex's
      four already-adjudicated findings. Returned BLOCKED with 6 findings; verified against the
      real baseline/script by the dispatching session rather than accepted on argument alone (the
      spec's own stated method, applied to this review too). Findings 1-3 CONFIRMED and cured in
      this diff (two were the same root cause: prose in two sections — the register table's
      `symlink` row and "What this instrument does NOT cover" — had not been updated after later
      revisions changed the facts underneath it, the identical defect class this whole spec exists
      to end, just in the DOCUMENT instead of the baseline). Findings 4-5 REFUTED by measurement:
      4 claimed `del_staged x rename_case_only` cannot report content because a staged deletion
      blocks `--ff-only`; the reviewed baseline records `rc=0 ff` and `case-renamed:...:10ed6daf`
      for exactly those four cells, measured against the real puller, not argued. 5 claimed a
      required, path-filtered `collision-matrix-case-folding` job would permanently block
      unrelated PRs (the real GitHub Actions trap this repo already knows by name — scar family
      #2); refuted because the job does not use a top-level `on.pull_request.paths:` filter, it
      follows the SAME in-job sentinel pattern already documented at the top of
      `.github/workflows/immune-enforcement.yml` for the `antidotes` job it sits beside, which
      exists specifically to avoid that trap. Finding 6 (the optimistic-reason guard's scope
      stops at `backup=file` rows and does not mechanically require a reason on `rc=1` fail-safe
      `OK` rows) is accepted as a true but non-blocking observation — every such row in the
      shipped baseline already carries one voluntarily; widening the guard itself is scoped out.

seat_diversity: SATISFIED
