brief_ref: evidence/brief.yml
council_run: journal.jsonl
plan_ref: >-
  One concern: enumerate the Pro main puller's collision surface instead of patching it a third
  time. The builder contract's own depth-1 rule, applied literally after two consecutive
  fix-of-a-fix cures were each wrong about a neighbouring shape (#5492, #5496). Ships NO
  behaviour change to scripts/pro/pro-git-pull.sh.

lanes:
  - lane: matrix-ground
    role: read
    seat: >-
      claude-opus-5 (conducting session, Pro). Established the premise from the record rather than
      from the mandate text: read #5492's and #5496's real diffs and the resolver's actual branches
      before writing a line. Produced the design rule the whole defect history reduces to —
      classify by the TYPE of the object at "$REMOTE:$f", never by its EXISTENCE.
  - lane: matrix-build
    role: build
    seat: >-
      claude-opus-5 (conducting session, Pro). Wrote the enumerator, the reviewed baseline, the
      spec, and the macOS CI leg. Three defects in this lane were SELF-CAUGHT and are in the
      journal rather than hidden: a slice replacement that duplicated 76 lines and passed `bash -n`
      (found only because all five sabotages then reported CAUGHT on the same cell), a probe of the
      wrong shape that refuted a CORRECT finding, and the document arithmetic error found while
      authoring this pack.
  - lane: matrix-grade-instrument
    role: review
    seat: >-
      claude-sonnet-5 subagents on fresh context, grading a diff they did not author and instructed
      to CONSTRUCT defeating fixtures rather than read and agree. Between them: content-blindness
      (three faces, one cure), the filesystem-scope defect behind the CI red, and an engineered
      hash collision — a regular file carrying the symlink target's exact bytes — used to prove the
      cure discriminates. Verdicts in journal.jsonl.
  - lane: matrix-grade-verdicts
    role: review
    seat: >-
      claude-sonnet-5 subagents on fresh context, grading the HUMAN half — the eighth column no
      machine check reads. Found two false OK verdicts, two over-harsh KNOWN_BADs, and 28 rows
      whose shared reason named neither of the two mechanisms that actually fire. A second pass
      reproduced 22 cells individually to separate the two. Verdicts in journal.jsonl.

seat_diversity: NOT-SATISFIED
seat_diversity_note: >-
  ONE council seat rendered a judgement, and it said BLOCK. R9 wants two distinct seats from
  (codex-gpt-5.6-sol, kimi-code/k3, tp1-qwen3.8-max) marked ok:true; this journal has one.
  Measured 2026-09-02, and the earlier version of this note was WRONG in a way worth recording:
  it said codex returns 401 and called the blocker owner-only and repo-wide. It does not. codex
  answers in ~20s with a correct answer; it only LOOKED dead because scripts/arsenal_probe.py
  applies a flat 15s DEFAULT_TIMEOUTS to every seat and codex-cli 0.149.1 now executes this repo's
  hook chain before the model is reached — the probe measured "answers within 15s" and reported
  "is the seat alive". So a whole class of Gear-3 PRs was believed owner-blocked on the strength
  of an instrument answering a neighbouring question. kimi is genuinely 403 (weekly quota).
  tp1-qwen3.8-max is LIVE and fast in isolation (2.2s on a PONG probe) and rendered NO judgement
  on this diff across THREE attempts: 600.2s client timeout at 115,902B, a gateway
  ConnectionResetError at 431.8s on 39,774B, and a 600.1s timeout at 32,872B. Not a dead seat
  and not a dispatch failure — a structural limit of this endpoint for review-scale prompts,
  size-independent within that range. Recorded ok:false: an empty answer is not a clean one. The honest state is therefore one seat, not two — and since that seat's verdict
  is BLOCK, the quorum question is downstream of a finding that has to be answered first.

diff:
  files: 7
  net_lines: 1459
  measured_at: >-
    counted with `git diff --numstat --cached $(git merge-base origin/main HEAD)` — the CACHED
    form, not the three-dot one, and the difference is the whole point: the three files under
    evidence/ ARE this pack, so a figure taken before staging them would have read 4 / 938 and
    would have described a diff other than the one being shipped. (Two dots would have been wrong
    for the opposite reason — it would accuse this branch of deleting main's later additions,
    W102.) All seven files are additions; the workflow file is +99 -0, one appended job, and the
    other six are new.

residual_risks:
  - >-
    THE CASE-FOLDING JOB IS NOT A REQUIRED CHECK, SO THE AXIS IS MEASURED AND NOT GATED. Found by
    the independent Gear-3 gate, confirmed by measurement:
    `gh api repos/Bali-Zero/Teman2/branches/main/protection --jq '.required_status_checks.contexts[]'`
    returns 12 contexts, includes `antidotes`, and does NOT include
    `collision-matrix-case-folding`. So a regression in the 14 rename_case_only cells goes red in
    the run and blocks nothing — scar family #2, "Esiste != Armato", introduced by the very PR
    that exists to end that shape on this surface. It is disclosed rather than silently fixed
    because adding a required context is a branch-protection change that reaches every PR in the
    repo: ledgered as `operator[github-settings]`. An earlier revision of this PR's own `Bites:`
    line said "two required-check jobs" and was FALSE; it has been corrected.
  - >-
    THE REQUIRED SET IS NOT CURABLE FROM THIS REPO, AND THERE IS A DECOY THAT LOOKS LIKE IT IS.
    `infra/required.d/contexts.json` reads like the list to edit; its own `_doc` says it is an
    ADVISORY snapshot regenerated from the API by `snapshot_required_contexts.py`, that drift is
    expected, and that it must never be hand-edited — so editing it arms exactly nothing. Measured
    2026-09-02: it holds 11 entries against 12 live, already stale as its docstring predicts. The
    correct order for whoever adds the context is branch-protection FIRST, regen second. Recorded
    here because a future reader who finds that file will otherwise believe the fix is a one-line
    PR.
  - >-
    THE macOS SENTINEL DEVIATES FROM `antidotes` ON PURPOSE, and the earlier framing of this was
    wrong. `antidotes` reads only `pull_request.*` and therefore over-triggers on merge_group too
    — but that is SANCTIONED by this file's header ("an under-match would skip real guards") and
    it is a required check, so over-running is its safe direction. This job is not a gate and
    costs 10x, so it reads `merge_group.base_sha`/`head_sha` — which is repo convention, used by
    adversarial-review-gate.yml, hot-zone-pr-gate.yml, docs-sync.yml and docs-guardian.yml, two of
    them required. The defect cured here was never "the job is uniquely broken"; it was a comment
    that claimed a narrowness the code did not have, plus a real bill.
  - >-
    THIS DIFF ARMS A SECOND CORPUS IT DID NOT WRITE, AND THIS PACK DID NOT SAY SO UNTIL AN
    INDEPENDENT GRADER FOUND IT (added 2026-09-02). `scripts/pro/test_pro_git_pull.sh` — 55
    assertions, pre-existing on origin/main since #2576, absent from this diff's own --numstat —
    is wired into the `antidotes` job by the workflow hunk here, and had never been run by ANY
    workflow before. That is a real CI-behaviour change beyond the instrument this pack is about,
    and the omission is the more interesting half: the PR body disclosed it, the pack did not, so
    the artifact a future reader would consult was the one that stayed silent. It is disclosed
    rather than removed because arming an existing unrun corpus is the same concern as arming the
    new one — but a reviewer must be told they are grading two, not one.
  - >-
    THE VERDICT COLUMN IS THE UNGUARDED HALF AND IT WAS MEASURED WRONG. On 2026-09-01 an
    independent audit graded it for the first time and found two false OK verdicts and forty
    reasons naming a mechanism other than the one that fires. NONE of it was visible to the
    machine: the seven measured fields were correct from the start and never moved through any of
    it. The guard was extended to the optimistic side in response, but a guard that demands a
    reason cannot check that the reason is TRUE — that remains a human-review surface with no
    automated backstop, and it has a measured failure rate rather than a hypothetical one.
  - >-
    FIFTY-TWO DEFECTS ARE MADE LEGIBLE AND NONE IS CURED. This is the intended trade — the surface
    was under-specified, so the spec ships first and each cure lands later as a reviewable diff of
    baseline rows — but it must not be read as "the puller is now safe". It is exactly as unsafe as
    it was, and now says so in a file.
  - >-
    THE GUILT CORPUS IS UNDER-SELECTED, and is treated as such rather than as coverage. Five
    sabotages, each caught on the correct origin action. Known-unattacked: a fixture whose ORIGIN
    action is right but whose LOCAL state is silently wrong (the A axis has no sabotage of its
    own), a cell whose policy column disagrees with the allowlist the run actually wrote, and the
    four `untracked` cells, which are built by a different path than the other 98.
  - >-
    THE CASE-ONLY AXIS IS ONLY PARTLY CLOSED AND ONLY ON SOME VOLUMES. Measured: Subject.md ->
    subject.md at the repo root against all seven local states, on a case-folding filesystem only —
    held out entirely on the ubuntu leg. Never measured anywhere: a case-only rename whose source
    is allowlisted keep-local, and a case-only rename of a DIRECTORY. A submodule/gitlink (commit
    object) at a renamed-away name is unmeasured too, and that same clause produced two of the
    three regressions on record.
  - >-
    scripts/mini/mini-git-pull.sh IS A SECOND IMPLEMENTATION of this resolver and this instrument
    does not touch it. Named here rather than widening scope: one PR, one concern. Every cell is
    also a single tick against a quiet origin moving exactly one path — no second puller, no lock
    contention, no origin advancing mid-tick, and no multi-path tick where an early abort would
    hide every later path's behaviour.

pii_scan: clean

