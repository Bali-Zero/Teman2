dissent:
  - seat: claude-sonnet-5 (matrix-refuter, fresh context)
    objection: >-
      THE INSTRUMENT WAS CONTENT-BLIND. Its ls-tree probes asserted an object's silhouette —
      presence, and at best type — and never its identity, so a fixture built with the wrong
      content satisfied the assertion and the cell recorded a measurement of something else.
      Three faces of the same defect.
    status: CONFIRMED
    disposition: >-
      ACCEPTED and cured with ONE change rather than three patches: assert mode + type + blob SHA
      against hashes derived from the fixture constants, plus a recursive blob count under the
      path. Independently confirmed by a second seat with an engineered collision (receipt above).
  - seat: claude-sonnet-5 (fs-scope-refuter, fresh context)
    objection: >-
      THE CI RED WAS NOT A FLAKE AND NOT A BUG IN THE FIXTURES. The rename_case_only axis measures
      a defect that exists only where the filesystem folds case; on ubuntu the cells still RAN but
      measured an ordinary rename between two distinct paths. It further showed macos-latest was
      already available in-repo — closing a coverage gap the author had deferred.
    status: CONFIRMED
    disposition: >-
      ACCEPTED on both counts. The filesystem became a declared coordinate (three-outcome probe,
      axis held out with the count printed inline, --write-baseline refuses from a partial run),
      and the macOS leg shipped in the same PR rather than as a promise.
  - seat: claude-sonnet-5 (verdict-auditor, fresh context)
    objection: >-
      TWO `OK` VERDICTS WERE FALSE. Where the resolver's tracked branch crashes inside cp -p the
      cell had been blessed as fail-safe; it is not. Two further KNOWN_BADs were over-harsh, and
      four more carried misattributed reasons.
    status: CONFIRMED
    disposition: >-
      ACCEPTED. Verdicts moved 54/48 -> 50/52 and the guard was extended to the optimistic side.
      The deeper lesson is recorded in the spec: an unargued KNOWN_BAD is merely pessimistic, an
      unargued OK is a defect blessed in writing which the instrument then certifies forever.
  - seat: claude-sonnet-5 (cell-reproducer, fresh context)
    objection: >-
      ONE SENTENCE COVERED 28 ROWS AND NAMED NEITHER MECHANISM, in two opposite ways. "No branch of
      the resolver handles a non-regular file" is false on 16 non-rename rows, where the branch
      RUNS and crashes inside cp -p (signature: backup directory created and EMPTY), and false on
      the 12 rename rows, where the resolver never runs at all because rename detection hides the
      source from `git diff --name-only`.
    status: CONFIRMED
    disposition: >-
      ACCEPTED, and the row numbers were re-derived from the FILE rather than from the report —
      which caught that the new (B) reason quotes the old phrase to refute it, so a naive grep for
      the old text also matched already-fixed rows. Four further rows were carrying a keeplocal
      clause inapplicable under `ordinary`; removed.
  - seat: session (Pro) — self-dissent, recorded because the wrong answer was already reported
    objection: >-
      I REFUTED A CORRECT FINDING WITH A PROBE OF THE WRONG SHAPE. `cp -p` onto a dangling symlink
      exits 1 when the target has a missing intermediate directory, and exits 0 while FOLLOWING
      the link when the target is a bare filename with an existing parent. I probed the first; the
      committed fixture is the second.
    status: CONFIRMED
    disposition: >-
      The wrong mechanism reached the baseline, the spec and a report to the owner before being
      corrected in all three. The spec's own text now carries this error as its worked example,
      and the rule it produced is in the shell-traps memory: if you test a mechanism, run THE
      FIXTURE, not your reconstruction of it.
