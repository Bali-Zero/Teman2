dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      (O1, 3 MAJOR) The guard was tied to the ALTER by textual precedence
      only; discovery by the exact safe spelling was green by omission for
      a new shape; only whole-line `--` comments were removed, so a decoy in
      a block or trailing comment satisfied both regexes. (O2) All three
      REOPENED with concrete shapes, plus a NEW MAJOR: a nested IF in the
      guard's THEN arm can donate its ELSE, so a rebuild executed precisely
      while own-scope rows exist reads as guarded.
    status: CONFIRMED
    disposition: >-
      All cured, each with a measured mutation: the ELSE and END IF are
      found by walking the text with a balanced counter whose opener is
      `IF <cond> THEN` (counting bare `IF` made `DROP CONSTRAINT IF EXISTS`
      close the guard early -- measured red on both real files); discovery
      is any touch of the CHECK in any spelling (after gate-6363, an unnamed
      `ADD CHECK` and a RENAME of the check included), with only the canonical
      DROP+ADD allowed inside the guarded ELSE and nothing outside it; the
      scanner is quote-, comment- and dollar-quote-aware and fails closed on
      an unterminated literal or body. No third round (decision #46).
  - seat: claude-opus-5
    objection: >-
      (own, on Imperator decision #46's first form) Making the canary red
      whenever a migration has a dollar-quote opener near `policy_scope`
      would be red on main today.
    status: CONFIRMED
    disposition: >-
      Measured and reported BEFORE touching the file: 8 of the migration
      files trip it, including the two with the safe shape, because every
      migration here uses `DO $tag$`; and the premise was wrong -- the
      bodies were never invisible (raw = scanned = 2 on both). Decision
      #46-bis replaced the rule with the recursive scanner, which closes the
      risk that was real (7 bodies whose apostrophes do not pair as SQL
      literals do).
  - seat: claude-opus-5
    objection: >-
      (own, declared limit) The canary asserts SHAPE for the shapes its
      matcher can read, not sufficiency.
    status: CONFIRMED
    disposition: >-
      NOT cured, declared in the brief's `limits` and in the PR body. Two
      parts: a rollback whose touch `_TOUCH_RE` cannot match at all is
      invisible (the superset assertion catches a refactor of 285/304, not
      a novel shape in a new file); and the guard protects its OWN scope
      only -- 285's rollback with GARUDA_DOCUMENT rows and no
      GARUDA_MAGIC_LINK rows still narrows and raises, which is the third
      row parked in the 313 lane and a property of the shared mechanism.
