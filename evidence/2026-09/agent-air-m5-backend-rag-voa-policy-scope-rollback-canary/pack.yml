outcome: >-
  Two levels, text only, no database, ~0.2 s in the unit shard. Level 1:
  313's rollback must not touch the policy_scope CHECK -- the exact shape
  gate-6287d smuggled in. Level 2, repo-wide: any migration whose rollback
  touches that CHECK in any spelling must have exactly one rebuild in the
  canonical form, inside the ELSE branch -- at the guard's own nesting
  depth -- of `IF EXISTS (SELECT 1 FROM public.visa_decision_retention_policies
  WHERE policy_scope = '<its own scope>') THEN`,
  with the rollback list equal to the forward list minus that scope, no
  touch in the THEN arm and none outside the guarded ELSE. The set of files
  found must include 285 and 304, so the canary cannot be green by finding
  nothing. The SQL is read by a scanner that drops comments outside
  literals, undoes `''` inside them, joins adjacent literals and reads
  dollar-quoted bodies recursively; an unterminated literal or body is a
  hard error, not a guess.
