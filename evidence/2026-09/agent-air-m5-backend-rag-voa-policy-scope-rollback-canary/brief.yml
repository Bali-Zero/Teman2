  - text: "A2: WHEN the canary scans migrations_v2 it SHALL find at least 285 and 304 among the files whose rollback touches the CHECK, so it cannot be green by finding nothing."
    probe: backend/tests/db/test_policy_scope_rollback_guard.py::test_the_canary_finds_the_rebuilders_it_was_written_against
  - text: "A3: WHEN 313's rollback text is read it SHALL contain no DROP or ADD of the policy_scope CHECK, since 313 never widened it."
    probe: backend/tests/db/test_migration_313_garuda_practice_artifacts.py::test_the_rollback_never_touches_the_policy_scope_check
  - text: "A4: WHEN gate-6287d's mutation (c) (285's narrowing pasted into 313's rollback) is applied the suite SHALL go red at both levels."
    probe: guilt mutation (c) below
