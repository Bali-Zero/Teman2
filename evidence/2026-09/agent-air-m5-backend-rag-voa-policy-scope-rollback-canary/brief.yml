objective: >-
  The fourth row parked in the 313 lane's ledger-rows-held.md, discharged:
  a text-only canary that makes gate-6287d's mutation (c) red. On the
  append-only `visa_decision_retention_policies`, a rollback that rebuilds
  the `policy_scope` CHECK must narrow it ONLY when no row carries the scope
  that migration added, else leave it widened -- the shape 285 and 304 have,
  and the shape the gate was able to smuggle into 313's rollback without any
  test noticing.
scope:
  - apps/backend-rag/backend/tests/db/test_policy_scope_rollback_guard.py — new; every migrations_v2/*.sql whose rollback rebuilds the CHECK.
  - apps/backend-rag/backend/tests/db/test_migration_313_garuda_practice_artifacts.py — one structural test; the file is otherwise byte-identical to main.
constraints:
  - Text only, no database, no fixture; runs in the unit shard in ~0.1 s.
  - >-
    The canary must not be green by finding nothing: the set of files it
    finds is asserted to be a superset of {285, 304}.
  - >-
    Both SQL forms read the same: 285's inline ALTER and 304's
    `EXECUTE 'a ' 'b '` with doubled quotes — adjacent literals are joined
    BEFORE the doubling is undone (the reverse order hides 304's CHECK).
  - No migration file is modified; the 313 suite's formatting is main's.
acceptance:
  - text: "A1: For each rollback that touches the CHECK, its one canonical rebuild sits inside the ELSE, at the guard's own depth, of `IF EXISTS (SELECT 1 FROM public.visa_decision_retention_policies WHERE policy_scope = '<X>') THEN`, X is the one scope the forward added, the rollback list is the forward list minus X, and nothing else touches the CHECK."
