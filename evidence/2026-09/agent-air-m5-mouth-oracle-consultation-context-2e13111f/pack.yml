review_status: Full independent Anthropic gate pending; no final approval is claimed.
diff:
  behaviour_change: >-
    One consultant handoff remains mounted behind an accessible disclosure. Consultation
    consent has no result state or reference. Only the actual displayed verdict supplies
    assessment state and its opaque reference. Scope changes require fresh consent, including
    after Edit answers; known minors retain the guardian gate. Legacy result receipts migrate
    conservatively. No interview answers are placed in a WhatsApp handoff message.
  size_reason: >-
    Seven frontend files, 665 additions and 137 deletions, net 528. The single concern includes
    strict consent migration and phase, guardian and keyboard regressions. Tests are retained
    rather than removed to meet a nominal line threshold.
