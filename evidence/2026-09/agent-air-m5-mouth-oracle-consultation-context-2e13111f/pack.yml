seat_override: >-
  The visa-oracle path triggers ground-truth review mechanically, but this change only
  connects existing UI consent and disclosure behavior. It changes no immigration facts,
  eligibility, prices, legal claims, engine rules or curated data. Ground truth is the
  existing consent contract and synthetic runtime checks; no new NotebookLM claim is made.
