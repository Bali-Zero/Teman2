decisions:
  - id: D-gear
    decision: >-
      Gear DECLARED 3; the deterministic floor computed by evidence_pack_lint.py
      --print-floor on the merge-base diff is 3, source "size" (36 files, +2372/-272 at
      head 0c38b8fab6 before this evidence directory; 3 again with it included, against
      origin/main after the merge). The brief also declares it: the
      diff lands under apps/backend-rag/**, where merging IS the deploy, and it changes
      what the engine tells a visitor.
  - id: D-one-pr
    decision: >-
      One PR for backend-rag and mouth. `Decision.conditions` is a wire-contract field:
      contract.schema.json, schema.d.ts (regenerated, sha pin moved by the generator), the
      mouth parser and view model must land together, or the deployed mouth rejects every
      conditioned response as RESPONSE_INVARIANT and the visitor sees the error page.
  - id: D-net-lines
    decision: >-
      Net +2140 without this evidence directory (36 files, +2413/-273 against origin/main
      after the merge), far above the contract's ~400 "where the work allows".
      Declared rather than split, for D-one-pr's reason. The bulk is regenerated contract
      (contract.schema.json +74, schema.d.ts +60), the EN/ID copy tables, the moved pins
      with their reasons, and the new guard file; the runtime logic is the evaluator
      review_as_conditions branch and five adapters.
  - id: D-allowlist
    decision: >-
      The floor is an allowlist on reason-code IDENTITY (frozenset), not a substring test,
      holding exactly {CRIMINAL_MATTER_DISCLOSED, DECISIVE_PRIMARY_SOURCE_NOT_APPLICABLE,
      SAFETY_CRITICAL_PRIMARY_SOURCE_NOT_APPLICABLE} per the imperator decision; the brief's
      earlier "exactly ONE emitter" sentence is superseded by that decision and the floor
      test pins the three.
  - id: D-engine-default
    decision: >-
      The engine default stays review_as_conditions=False so no offline caller changes
      meaning silently; the endpoint, the census driver and the replay driver pass True.
      The floor adapter still converts a default-mode review, as a net.
  - id: D-seal-compat
    decision: >-
      An empty conditions tuple is omitted from the sealed core in both seal and verify,
      so idempotency envelopes sealed before this deploy still verify on replay; a
      non-empty tuple is inside the HMAC, and the tamper test mutates it.
  - id: D-codes-kept
    decision: >-
      The brief suggested new condition names (SOURCE_REFRESH_PENDING, ASSISTED_PRODUCT).
      The conditions reuse the codes the gates and the signed pack already emit
      (*_SOURCE_STALE, *_SOURCE_FRESHNESS_UNKNOWN, pack review codes), carrying the
      difference in next_step (AWAIT_SOURCE_REFRESH, ASSISTED_APPLICATION): a pack is
      immutable here, and renaming at the adapter would make one fact two codes.
  - id: D-replay-floor
    decision: >-
      PRODUCTION_REPLAY_EXPECTATIONS is a legal reading whose header forbids regenerating
      it from engine runs, so it was not rewritten. The offline floor instead counts a
      divergence as ruling-converted only when the legal row expected a non-allowlisted
      hold, the engine no longer holds, and every expected cause is still NAMED (one pinned
      rename, one pinned asked-first persona). Measured 10 literal + 7 converted = 17,
      unexplained {1, 9, 10} unchanged.
  - id: D-merge
    decision: >-
      origin/main was merged in ONCE more (e0dde5c53d), never rebased, because a real
      conflict forced it: W-VO-S21 (#6466) landed on the same contract, enums, models,
      adapter test and openapi pin after both seats had passed 0c38b8fab6. Resolutions: the
      adapter test's review-code floor keeps VO-D's 39 with S21's note; the openapi pin was
      rewritten by scripts/generate_openapi.py from the merged app (1f86a083...); contract
      schemas and schema.d.ts re-exported from the merged tree came out byte-identical to
      the auto-merge. A dedicated merge round was run on both seats (codex 6-merge OK; agy
      5b-merge DEFECT adjudicated, 5c-merge OK) and the full suites re-run on the merged head.
  - id: D-council-rounds
    decision: >-
      codex-gpt-5.6-sol rounds 1 and 2 ended in the seat's own harness context checkpoint
      with no verdict (recorded ok:false, never counted); round 3 got a hard command budget
      and returned OK, round 4 covered what round 3 had not read, round 5 judged the last
      fix commit. agy-gemini-3.1-pro found real defects in rounds 1b, 2 and 3, each cured at
      depth 1 with a guilt test that fails under mutation, and returned OK on 0c38b8fab6 in
      round 4. Both seats then returned VERDICT OK on the merge e0dde5c53d; the commits after
      it only touch this evidence directory.
