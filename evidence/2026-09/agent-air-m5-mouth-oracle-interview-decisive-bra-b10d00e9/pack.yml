  through exactly one file, `test_interview_walk_census.py`, and it introduces
  NO regulatory claim. No rule, no bound, no reason code and no source record
  is authored, edited or signed here; rulepack-prod-020.signed.json is
  byte-identical to what is already on main. Every number this PR moves is a
  MEASUREMENT of what those already-ruled rules produce once the interview
  stops withholding facts from them — a census re-pin, not a new proposition
  about Indonesian immigration law. The interview copy that IS a claim (the
  E23 RPTKA caveat) was ruled by the owner before this lane opened and is
  named in the brief. A ground-truth/NB lane here would be re-litigating the
  signed pack's own reviewed content.
  .
  R9 council_run: no council journal is declared. What the rule exists to
  prevent — a Gear-3 diff read only by the seat that wrote it — did not
  happen: an independent non-Anthropic refuter was dispatched on the full
  diff, its findings are recorded verbatim in `dissent` with their
  dispositions, one of them changed the code in this PR and one changed what
  the census claims about itself. The remaining adversarial read that is NOT
  in this pack is the grading one, and it is deliberately outside it.

outcome: >-
  The interview-walk census reaches ZERO dead ends. Measured on
  rulepack-prod-020.signed.json (unchanged by this PR): 11 NEEDS_INPUT / 10
  NO_SUPPORTED_PATH / 22 SUPPORTED_CANDIDATES over 43 walks becomes 0 / 10 /
  51 over 61. All eleven dead ends are CURED, not moved — nine
  `family.sponsor_confirmed` walks answer (six offshore/invest/*, onshore/invest
  on C2; offshore/other, onshore/other on C6) and the two `intent.purposes`
  diaspora walks answer on C1 — so WALK_DEAD_END_ALLOWLIST is EMPTY and the
  invariant "no walk may end in NEEDS_INPUT on a fact the interview has no
  reachable question for" becomes UNCONDITIONAL. Every one of the 22 seq-20
  answers keeps its exact candidate list and no NO_SUPPORTED_PATH walk moved:
  the only transition in the census is NEEDS_INPUT -> SUPPORTED_CANDIDATES.
  The 18 new walks are branches the interview gained, and two of them name a
  product no interview could reach before (E31D via STEPCHILD, E33 via the
  second_home tile). Nothing was loosened to get there: no count became a
  range, no assertion was deleted, no skip or xfail was added, and the three
  guilt tests whose subjects the cure removed were re-anchored — one inverted
  onto the withdrawal of the newly-asked fact, two onto fabricated rows over
  the real corpus — with the strongest of them mutation-verified.
diff:
  shape: >-
    The interview tree, its flow reducer and their unit tests under
    apps/mouth/src/app/(visa-oracle)/visa-oracle/; the corpus generator under
    apps/mouth/scripts/visa-oracle/ and the 61 generated walk fixtures it
    emits under the backend's gold_coverage/fixtures/walks/; and one backend
    TEST module, test_interview_walk_census.py. No engine code, no rulepack,
    no migration, no signed artifact, no secret. No total is narrated: this
    file is itself part of the diff it would describe, so any literal written
    here is stale the moment the pack is committed. The fixtures live under a
    `fixtures/` directory and are excluded from the size term, so they are not
    what floors this at Gear 3 — the branch logic and its tests are.
  measured_at: >-
    `git diff --numstat origin/main...HEAD` (three-dot, merge-base anchored,
    never two-dot — the W102 lie), fed to
    `scripts/evidence_pack_lint.py --print-floor --print-floor-source`.
pii_scan: clean
bites_note: >-
  CONSUMERS, both shipping in this PR, neither a future job:
  apps/backend-rag's test_interview_walk_census.py, which replays the
  generated corpus against the highest signed production pack and pins the
  outcome of every walk — so it FAILS the moment the interview stops asking
  one of the facts this PR added; and apps/mouth's
  walk-corpus-determinism.test.ts, which fails if the committed corpus and the
  generator disagree by one byte. Observed this session, before reporting the
  work done, by running each (receipts below). Neither is decorative: BEFORE
  the re-pin the census module ran RED against the regenerated corpus — 11
  stale allowlist rows and a state census that no longer matched — and the
  determinism test ran RED on the committed-count literal alone (43 vs the
  generator's 61) while its byte-for-byte comparison stayed green, which is
  exactly the split it was written to report. The PR body carries the `Bites:`
  contract in the executable shape; this note records the same observation for
  the gate.
