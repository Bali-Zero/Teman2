dissent:
  - seat: codex-cli 0.153.4 / gpt-5 (independent review lane)
    status: CONFIRMED
    objection: >-
      BLOCKER — "the census discards information that changes the public
      verdict": a fixture stores only `wire.facts`, so every walk is evaluated
      with `disclosed_review_flags = ()` while the live funnel sends whatever
      `mapDisclosureFlags` computed (ACTIVITY_BOUNDARY on the whole diaspora
      tile, among others). Reproduced by this seat and measured: with that one
      flag supplied, 15 walks move SUPPORTED_CANDIDATES ->
      HUMAN_REVIEW_REQUIRED. CONFIRMED as a real limit on what "51 answers"
      means. NOT cured here, for two stated reasons: it is PRE-EXISTING — the
      generator has stored `wire.facts` alone since the corpus shipped in
      PR-0, so every number PR-1 and PR-2 published carries it too — and
      curing it is a corpus-SCHEMA change that re-pins the entire wave's
      headline table, which is a wave decision and a PR of its own, not a
      builder's unilateral widening of this one. What ships instead is the
      truth, stated where it cannot be missed: the census docstring now
      carries the measurement and says explicitly that the dead-end invariant
      and the candidate lists stand while 51 must not be read as 51
      applicants seeing a recommendation with no human step. Carried to the
      grading session as the top open item.
  - seat: codex-cli 0.153.4 / gpt-5 (independent review lane)
    status: CONFIRMED
    objection: >-
      MEDIUM — "a guilt test lost the property it verified": with the
      allowlist empty, `_dead_end_violations`' `elif missing != allowed`
      branch became unreachable from the live table, and deleting it left all
      14 tests green. Correct, and CURED IN THIS PR: a guilt test built on a
      fabricated row now drives that branch both ways, and the mutation was
      re-run to prove it is the only test that goes red without it (receipt
      above). The reviewer's companion observation — that the empty gate
      itself still bites, since injecting a new dead end fails the invariant
      and both censuses — was checked and is why the empty allowlist ships as
      an equality against {} rather than as a relaxed count.
  - seat: codex-cli 0.153.4 / gpt-5 (independent review lane)
    status: PLAUSIBLE
    objection: >-
      MEDIUM — "the enumeration does not cover every reachable branch": names
      second_home/unsure, onshore/second_home/property and
      onshore/diaspora/STEPCHILD/spNat=ID as absent from the 61 fixtures.
      Factually right, and the three are three different things. The onshore
      ones follow the corpus's PRE-EXISTING arm asymmetry — the onshore arm
      has always been one neutral walk per category, for invest and retirement
      and family too — and `unsure` is a walk-driver choice that has never been
      exercised for ANY question, since the driver answers first-option
      everywhere. Neither is introduced here, and widening either multiplies
      the corpus for every tile at once, which is a corpus-design decision
      rather than this PR's. PLAUSIBLE and left open on purpose: the census
      docstring now states both bounds explicitly, so "byte-for-byte
      reproducible" is no longer at risk of being read as "covers every
      reachable path". The generator's own docstring already carried the
      companion rule (a new branch must be enumerated here too), which is what
      this PR obeyed for the three branches it added.
  - seat: codex-cli 0.153.4 / gpt-5 (independent review lane)
    status: PLAUSIBLE
    objection: >-
      LOW — "the reducer does not enforce the follow-up prerequisites":
      `ASK_FOLLOW_UP` appends any registered, not-yet-asked question without
      calling `followUpPrerequisitesMet`, so the guard lives in the caller
      (the outcome adapter) rather than in the reducer, and the reducer would
      also accept a follow-up dispatched from the framing screen. The reviewer
      states plainly that no bypass through the UI was demonstrated. Left in
      the grading session's hands rather than patched at the end of a lane
      whose diff is already at the Gear-3 size floor: moving the check into
      the reducer changes behaviour covered by OracleShell's tests and is a
      defence-in-depth hardening, not a fix for a reachable defect. Recorded
      here so it is an owned, named gap rather than a silence.
  - seat: claude-opus-5 (this worktree session), self-caught
    status: PLAUSIBLE
    objection: >-
      The corpus grew 43 -> 61 in a PR whose mandate was "cure the 11 dead
      ends", and 14 of the 18 new walks are the diaspora tile crossed by
      relation and sponsor nationality. That is a real widening of a table the
      whole wave reads, and a reviewer is entitled to ask whether it belongs
      here. It does, on the generator's own stated rule — a branch added to
      `getCategoryQuestionIds` must be added to the enumeration in the same PR
      — and diaspora genuinely GAINED the family branch in this diff. It is
      crossed rather than sampled once because the two tiles are not
      interchangeable: `mapDisclosureFlags` adds ACTIVITY_BOUNDARY on diaspora
      alone, so the same relation can end differently, which the flag
      measurement above then demonstrated concretely.
