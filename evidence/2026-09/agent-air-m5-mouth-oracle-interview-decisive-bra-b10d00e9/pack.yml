seat_diversity_note: >-
  One build lane, so D3's seat-diversity floor does not attach (it binds packs
  with >= 2 BUILD lanes). The declared review lane is a non-Anthropic seat in
  any case. It does not make this seat its own grader: the codex run is an
  adversarial read of the diff, and the SHIP decision — merge, arm, deploy —
  stays with the separate Consul session under CLAUDE.md §5. Generator is
  never grader.

seat_override: >-
