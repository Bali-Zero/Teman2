    preserving claim can never silently corrupt a legacy-encoded file.
  - >-
    No client PII anywhere in the diff or this pack. No secrets echoed. No edit outside the
    dedicated worktree (`agent/air-m5/docs/owner-name-zero-v3`).
acceptance:
  - text: >-
      A1: WHEN every path from `git ls-files` is walked (no directory shortcuts) and a
      case-sensitive word-boundary count of "Antonello" is run on the committed tree (excluding
      migrations_v2 and the whole of .github, matching the coordinating session's own audit
      command), THE count SHALL be small and every remaining line SHALL classify into a KEEP
      class.
    probe: >-
      `git grep -n -w Antonello -- ':!**/migrations_v2/**' ':!.github/**'` -> 957 lines;
      `git grep -n -w antonello` (lowercase, same exclusions) -> 57 lines; 1014 total, tabulated
      by class in pack.yml `receipts` (prettier_regression 447, r1_gate_excluded 442,
      own_evidence_pack_prose 72, functional_code 20, email 8, code_token 7,
      redaction_definition 4, off_limits_file 3, evidence_record 3, pii_gate_excluded 3,
      path_url 3, git_author_quote 2 — sum 1014, zero unclassified). Three of these classes
      (`prettier_regression`, `r1_gate_excluded`, `own_evidence_pack_prose`) are FILE-level
      exclusions discovered at commit/push time, not per-occurrence protected patterns — see
      `constraints` above for why they dominate the count.
  - text: >-
      A2 (the defect PR #7434 exists to fix, restated for v3's own self-check): WHEN
      `git diff --numstat` is computed for every changed file, THE added-line count SHALL equal
      the deleted-line count AND SHALL equal the sweep script's own per-file touched-line
      counter, independently cross-checked against numstat — zero collateral churn on untouched
      lines, for every one of the 274 swept files, no exceptions.
    probe: >-
