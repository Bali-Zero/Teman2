# Floor measured this session: `python3 scripts/evidence_pack_lint.py --print-floor
# --numstat-file <numstat> --changed-files-file <changed>` on the final pushed diff returns `3`,
# by the SIZE term (S1) — 276 files (274 swept + this 2-file evidence pack), well past the
# ~400-net-line PR-contract target and past the Gear-3 size threshold. No hot-zone path is
# touched (migrations_v2/** and .github/workflows/** are excluded from the sweep's candidate
# list entirely, never even opened for writing), so the floor is size-only, not hot-zone.
objective: >-
  Supersedes PR #7430 (closed: whole-file trailing-whitespace churn) and PR #7434 (closing this
  PR merges: byte-preserving but INCOMPLETE — 273 files changed, yet a case-sensitive
  word-boundary count of the owner's first name outside migrations_v2/.github still summed to
  942 on that branch, concentrated in docs/superpowers/plans|specs, docs/audits,
  docs/team-guides, research/operations). This v3 is the COMPLETE sweep: it walks every path
  from `git ls-files` (no directory shortcuts), replacing the owner's real first name with his
  standing codename "Zero" (per CLAUDE.md: "Owner codename: Zero (nome reale PRIVATO)")
  wherever it appears as a display/prose mention, using a strictly line-scoped BYTE-PRESERVING
  write (a line with no real hit is never decoded, only re-emitted as raw original bytes; a
  line with a hit is decoded, substituted, and re-encoded — that is the only byte range that
  can differ from origin/main) — while leaving every email address, handle, hostname,
  filesystem path/URL, functional code identifier, redaction-rule definition, NER/identity-
  matching literal, forensic git-author-quote, other-PR's evidence pack, and pre-existing
  gate-conflicted file (PII gate, prettier formatting, R1 adversarial-review frontmatter)
  untouched.
constraints:
  - >-
    KEEP unchanged, byte-identical (verified per-class in this pack's `dissent`/receipts):
    any token containing `@` (email addresses, incl. `antonellosiano@gmail.com` and
    `antonello@balizero.com` mentions in docs/curl examples); `antonellosiano`/`sianoantonello`
    handles and `Antonellos-Mac-mini.local`-style hostnames (protected automatically — the
    sweep's word-boundary regex never matches a name immediately followed by another word
    character, e.g. the `s` in `Antonellos` or the `siano` in `antonellosiano`); filesystem
    paths and URLs that reference an actual repo file by name (`docs/.../04-phase5-antonello-
    lab.md`, `infra/scripts/antonello-lab-cron.sh` — file RENAMES are out of scope, only file
    CONTENT is swept); any snake_case/kebab-case/camelCase compound token containing the name
    where the character immediately before or after the name is `_` (always protected: `\w`
    includes underscore), a hyphen immediately BEFORE the name (`needs-antonello`,
    `needs-antonello-on-pro`), or another letter immediately after it (`antonellosiano`) —
    verified examples: `needs-antonello`, `needs-antonello-on-pro`, `action_needs_antonello`,
    `name_antonello`, `antonello-lab`, `antonello_lab`-style values, `SKIP_ANTONELLO`/
    `SKIP_antonello`, and (a pattern not explicitly enumerated going in, found and generalized
    this session) the SAME prefix-hyphen convention in ALL-CAPS/Title-case form —
    `NEEDS-ANTONELLO`/`needs-Antonello`, used identically as an inline action-required tag
    across `research/operations/*.json` and several `docs/superpowers/specs/*.md` files —
    protected by the same rule with zero special-casing needed. The ASYMMETRIC counter-case,
    given explicitly by the coordinating session and honored as a named exception rather than
    generalized: `Antonello-decision` -> `Zero-decision` (the name is the hyphen-PREFIX side of
    the compound, a display tag not a machine-parsed identifier) — swept, per instruction,
    along with same-shape siblings found this session (`Antonello-side runbook`,
    `push-from-Antonello`, `most-aligned-with-Antonello`, `digest-to-Antonello`,
    `gated-da-Antonello`) which are all display-label conventions, not programmatic
    identifiers, matching the given example's shape.
  - >-
    A literal git-log author-string quote — `Antonello Siano <noreply@anthropic.com>` in
    `.claude/skills/modus/PENDING-ARMS.md` (2 occurrences, ledger entries dated 2026-08-14 and
    2026-09-08) — is a forensic claim about what `git log`'s author field actually read at
    authoring time, not a prose mention; renaming it would misrepresent the record. Protected by
    a dedicated regex alternative (a lookahead for `Antonello Siano` immediately followed by
    optional whitespace then `<`) that takes priority over the general "Antonello Siano -> Zero"
    substitution — verified byte-identical before/after (2 occurrences, both counts match).
  - >-
    FULL-FILE SKIP, 12 files never opened for writing (functional code/tests whose PURPOSE is
    to match, detect, or test-fixture the real name, not display it — carried over and
    re-verified from PR #7434's own off-limits review, one file added this session after
    independent verification): `apps/backend-rag/backend/prompts/zantara_core.py` (repo-wide
    off-limits per CLAUDE.md); `agent-library/config/redaction-rules.yaml` (redaction rule
    DEFINITION — id `antonello_personal_gmail` + its regex pattern + prose description; the
    coordinating session named `infra/**/redaction-rules*.yaml` as the example path, this repo's
    actual file lives at `agent-library/config/`, treated as the same class by intent);
    `apps/backend-rag/backend/services/memory/collective_memory_workflow.py` (NER known-names
    list entry `"antonello"`) + its test `.../tests/services/memory/
    test_collective_memory_workflow.py` (asserts NER extracts "Antonello" from raw text, uses it
    as a synthetic participant/query fixture); `apps/backend-rag/backend/services/wa_copilot/
    identity_resolver.py` (known-first-names list) and `staging_promoter.py` (stopword list +
    comment); `apps/backend-rag/backend/services/rag/agentic/prompt_builder.py` (functional
