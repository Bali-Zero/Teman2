    shortening a line enough to break a table/wrap width — the same class PR #7434's pack
    documented for 86 files). (c) R1 ADVERSARIAL-REVIEW: a THIRD, previously-undiscovered gate —
    `.husky/pre-push`'s `preflight_pack` contract table, `r1-frontmatter` check
    (`scripts/check_adversarial_review.py`) — blocked the push on 166 `research/**/*.md` files
    missing an `adversarial_review:` frontmatter key, a PRE-EXISTING repo-wide gap this sweep's
    edit does not cause (PR #7434's own pack documented the identical class, 186 files, under
