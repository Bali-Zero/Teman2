assumptions:
  - text: >-
      "Zero" is the owner's standing codename per CLAUDE.md, already used identically elsewhere
      in this repo, so replacing the first name with it is consistent with existing convention.
    status: verified
    probe: grep CLAUDE.md for the codename line; unchanged from #7430/#7434's own verification.
  - text: >-
      Where the source text already used BOTH the codename "Zero" and the real first name in the
      same sentence as a gloss/disambiguation pair (e.g. "Zero (Antonello)", "Antonello/Zero",
      "Zero, Antonello, Asya"), a literal mechanical substitution correctly produces a redundant-
      looking "Zero (Zero)" / "Zero/Zero" / "Zero, Zero" — this is disclosed as a KNOWN, ACCEPTED
      side-effect of a byte-preserving, no-editorial-judgment substitution, not a defect: fixing
      it would require per-instance semantic rewriting (deciding whether to drop a parenthetical,
      merge a list, reword a sentence), which is explicitly out of scope for a mechanical sweep
      and reintroduces the un-reviewable judgment risk the byte-preserving approach exists to
      avoid.
    status: verified
    probe: >-
      Occurrences found via `git grep -c 'Zero (Zero)\|Zero/Zero\|Zero, Zero'` post-sweep among
      the files that survived all three reverts (pack.yml `dissent`); one single-instance
      variant, `apps/backend-rag/backend/app/utils/crm_utils.py:156` ("e.g. Zero, Antonello" ->
      "e.g. Zero, Zero"), same root cause, same disposition.
  - text: >-
      A strictly line-scoped byte-preserving write (decode/substitute/re-encode ONLY lines that
      contain a real match; every other line re-emitted as raw untouched bytes) is sufficient
      to eliminate PR #7430's whole-file-churn defect, because the substitution never changes
      line count and every line-ending/indentation/trailing-whitespace byte outside the matched
      span is carried through exactly as origin/main wrote it. It is NOT sufficient, by itself,
      to guarantee the result stays clean against every OTHER repo gate (a prettier formatting
      boundary, a missing R1 frontmatter key, a PII-gate heuristic on unrelated content) — those
      failure modes are real and are handled by exclusion (see `constraints`), not by relaxing
      the byte-preserving guarantee or bypassing the gate.
    status: verified
    probe: >-
      the per-file equality proof (A2 above) — added == deleted == independently-recomputed
      touched-line count, for all 274 swept files, zero exceptions; all three gate regressions
      (PII, prettier, R1) are fully reproduced and disclosed, not silently worked around.
