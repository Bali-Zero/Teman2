  - >-
    THREE EXCLUSIONS DISCOVERED AT COMMIT/PUSH TIME (not at candidate-enumeration time), each
    handled by REVERTING the affected files to origin/main byte-identical rather than bypassing
    the blocking gate: (a) PII-GATE: 2 research docs (`research/operations/2026-05-23-wa-
    mirror-dashboard-discovery.md`, `research/tax/2026-05-09-pph21-q3-deadlines-livetest.md`)
    tripped `.husky/pre-commit`'s Law-2 PII gate on pre-existing, unrelated content — the same
    pair PR #7434's own pack already excluded on this exact rationale. (b) PRETTIER: 87 more
    files tripped `.husky/pre-commit`'s formatting gate — the coordinating session's mandate
    bans running a formatter as part of this sweep (that mechanism produced PR #7430's
    whole-file-churn defect), and each of the 87 was individually verified prettier-CLEAN on
