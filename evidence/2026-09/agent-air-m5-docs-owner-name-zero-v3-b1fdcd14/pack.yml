    Mechanical, line-scoped text substitution across markdown, YAML/JSON string values, code
    comments and docstrings. No production code path changed behavior: every functional-skip
    file was never opened, and the general substitution only ever matches the name as a
    standalone word/label, never as part of an identifier, dict key, regex pattern, email
    address, or file path.
  measured: >-
    `python3 scripts/evidence_pack_lint.py --print-measured --numstat-file <numstat>
    --changed-files-file <changed>` on the final pushed commit reports 276 files changed
    (274 swept + this 2-file evidence pack), commit count unmeasured; run the command against
    this commit for the exact insertion/deletion pair, which shifts by a handful of lines each
    time this pack's own prose is edited and is therefore not pinned as a literal number in this
    scanned field. `--print-floor` on the same inputs -> `3` (size-only, no hot-zone path
    touched). The swept-content vs. evidence-pack-prose breakdown is in `outcome` and `receipts`
    below.

dissent:
  - seat: "PR #7434 (prior task, its own dissent record)"
    objection: >-
      #7430 was defective (whole-file trailing-whitespace churn: 359 files, +9456/-7986, for
      ~500 real hits). #7434 fixed byte-preservation but worked from a candidate list that
      missed entire directories.
    status: CONFIRMED
    disposition: >-
      This v3 re-derives candidates from `git grep -liE antonello` over the FULL
      `git ls-files` tree (no pre-filtering by directory), giving 769 candidates vs #7434's 273
      changed files. 529 of the 769 had a real (non-protected) hit; 228 had only protected
      matches (handles/paths/code-tokens); 12 were whole-file functional skips.
  - seat: ".husky/pre-commit's Law-2 PII gate (repo tooling, run at `git commit` time)"
    objection: >-
      `git commit` was BLOCKED: the PII gate flagged `research/operations/2026-05-23-wa-mirror-
      dashboard-discovery.md` and `research/tax/2026-05-09-pph21-q3-deadlines-livetest.md` as
      OSINT/client-PII-shaped content.
    status: CONFIRMED
    disposition: >-
      Same two files, same root cause, already named and excluded on this exact rationale in PR
      #7434's own pack.yml ("PII-gate false-positive research docs... unrelated to this sweep's
      own edit"). Verified: the touched lines themselves are innocuous byline/prose swaps; the
      gate is reacting to pre-existing content elsewhere in the files. Reverted both files
      byte-identical to origin/main (`git restore --source=origin/main --staged --worktree`)
      rather than bypassing the gate; their "Antonello" mentions counted as residuals under a
      new `pii_gate_excluded` class.
  - seat: ".husky/pre-commit's formatting gate (repo tooling, run at `git commit` time)"
    objection: >-
      A SECOND `git commit` attempt (after fixing the PII-gate issue) was BLOCKED: `npx prettier
      --check` failed on staged files. The coordinating session's explicit v3 mandate bans
      running a formatter as part of this sweep (that mechanism is what produced #7430's
      whole-file-churn defect), so `prettier --write` was not an available fix.
    status: CONFIRMED
    disposition: >-
      One flagged file (this pack's own new `pack.yml`) simply needed its own formatting as a
      brand-new authored file — not part of the byte-preserving sweep, fixed directly. The
      other 87 were verified individually prettier-CLEAN on their origin/main content (`git show
      HEAD:<path>` piped to a temp-file `prettier --check`, per file) — the regression is real
      and caused by this sweep's own word substitution shortening a line enough to break a
      table/wrap width, the exact same class PR #7434's own pack documented for 86 files.
      Reverted all 87 to origin/main content and recorded them as a full-file exclusion class,
      the same pattern already used for the PII-gate exclusion.
  - seat: ".husky/pre-push's preflight_pack contract, r1-frontmatter check (repo tooling, run at `git push` time)"
    objection: >-
      A THIRD gate, not visible at commit time at all, BLOCKED the push: `scripts/
      check_adversarial_review.py`, invoked by the `preflight_pack` contract table whenever a
      push carries `research/*.md` or `evidence/**/pack.yml` (both true here), rejected a large
      number of `research/**/*.md` files in the diff for missing an `adversarial_review:`
      frontmatter key.
    status: CONFIRMED
    disposition: >-
      Read the gate's own source: `check_adversarial_review.py --files` checks EXACTLY the
      files handed to it (the push's changed-file list, via `--files-from` in
      `preflight_pack.sh`) — not a whole-repo scan. Every flagged file was confirmed to be one
      this sweep had touched, and each one's missing `adversarial_review:` key was verified to
      already be absent on origin/main (pre-existing, unrelated to this sweep's own edit) — the
      identical class PR #7434's own pack documented, there naming 186 such files under this
      exact rationale. Reverted all flagged files to origin/main byte-identical
      (`git restore --source=origin/main --staged --worktree`) rather than adding frontmatter
      that isn't this sweep's to add. Their "Antonello" mentions are counted as residuals under
      a new `r1_gate_excluded` class. Net effect across all three discoveries: 529 -> 274 files
      swept (1492 -> 611 lines). Re-ran `git push` after all three reverts: the r1-frontmatter
      and prettier checks both went green.
  - seat: self-review (adversarial pass over the v3 sweep's own residual audit)
    objection: >-
      A prefix-hyphen ALL-CAPS/Title-case convention, `NEEDS-ANTONELLO` / `needs-Antonello`, used
      identically to the given `needs-antonello` KEEP example but in different casing, appears
      repeatedly in `research/operations/S1-outbox-resurrection-FROZEN.json` and several
      `docs/superpowers/specs/*.md` files as an inline action-required tag. Was this correctly
      protected, or did casing create an inconsistency with the "capitalised Antonello sweeps"
      rule?
    status: CONFIRMED
    disposition: >-
      Checked: the sweep's word-boundary regex excludes a match immediately preceded by `-`
      REGARDLESS of case, so `needs-Antonello`/`NEEDS-ANTONELLO` (all-caps "ANTONELLO" is outside
      the regex's exact-case match set entirely, and never touched either way) are protected by
      the same rule as lowercase `needs-antonello`, with zero special-casing needed.
  - seat: self-review
    objection: >-
      A different research doc, `research/wr3/05-symbiosis-integration.md:149`, contains
      `approved_by: antonello,` inside an illustrative manifest-field example in a spec — is this
      a functional schema key (skip) or documentation prose (sweep)?
    status: PLAUSIBLE
    disposition: >-
      Classified as documentation prose: the markdown file is a design spec, not executable code
      or a fixture asserted against by a test; no test or script in the repo reads this specific
      example value. Swept normally (`approved_by: Zero,`) — consistent with treating spec/plan
      prose uniformly. (This file was also among the 166 later reverted for the R1 gate, so its
      final state is byte-identical to origin/main regardless.)
  - seat: self-review
    objection: >-
      `infra/tcc-desktop-paths/allowlist.txt:255` contains `antonello-lab` — the file's name
      ("TCC desktop paths allowlist") suggested a literal macOS Full-Disk-Access permission path,
      which would make this a functional entry, not prose.
    status: PLAUSIBLE
    disposition: >-
      Read the full line: it is `docs/superpowers/prompts/domain-mesh/04-phase5-antonello-
      lab.md`, a REPO FILE PATH the allowlist references by name, not a macOS filesystem
      permission path. Protected automatically by the lowercase-kebab exclusion (path-url class)
      — no functional risk either way, since file RENAMES are out of scope for this
      content-only sweep.
  - seat: self-review
    objection: >-
      One archived research file, `docs/archive/2026-07-orphans/x-research-april-2026/
      q09_italian_expat_ecosystem.md`, stores its ENTIRE content as a single line with literal
      `\n` escape sequences (a pasted LLM transcript, not real markdown line breaks) — does the
      byte-preserving line-scoped design still work when the "line" is the whole file?
    status: CONFIRMED
    disposition: >-
      Yes: verified `git diff --numstat` showed 1 added / 1 deleted for this file (1 real hit,
      "Antonello Siano / Bali Zero" -> "Zero / Bali Zero"), matching the "whole file is one
      line" shape exactly, not the N-hundred-line churn #7430 produced for a similar single-hit
      case. (This file was not among any of the three reverted classes, so it survives in the
      final diff.)
  - seat: self-review
    objection: >-
      The mechanical substitution produces `apps/backend-rag/backend/app/utils/crm_utils.py:156`
      docstring going to "e.g. Zero, Zero" (a duplicate), and several similar "Zero (Zero)"/
      "Zero/Zero"/"Zero, Zero" occurrences where the source text already paired the codename with
      the real name as a gloss (e.g. "**Owner**: Zero (Antonello)").
    status: CONFIRMED
    disposition: >-
      Real, disclosed, and left AS-IS per the no-editorial-judgment mandate (byte-preserving,
      no formatter, no smart rewriting): fixing this correctly requires per-instance semantic
      judgment that a mechanical, auditable substitution cannot make safely at this volume —
      and doing it anyway would reopen exactly the un-reviewable-diff risk #7430 was rejected
      for. See brief.yml `assumptions` for the disclosure.

