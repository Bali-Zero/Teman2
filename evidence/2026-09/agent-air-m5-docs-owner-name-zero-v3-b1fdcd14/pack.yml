# branch agent/air-m5/docs/owner-name-zero-v3. Supersedes PR #7430 (whole-file trailing-
# whitespace churn) and PR #7434 (byte-preserving but incomplete — 942 residual case-sensitive
# whole-word hits outside migrations_v2/.github). Floor is 3 by SIZE (274 files swept,
# +611/-611), not by hot-zone: migrations_v2 and .github/workflows are excluded from the sweep
# entirely.
task_id: owner-name-zero-v3
gear: 3
