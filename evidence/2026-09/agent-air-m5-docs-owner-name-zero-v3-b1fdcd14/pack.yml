lanes:
  - lane: complete byte-preserving owner-name prose sweep (Antonello -> Zero), v3
    role: build
    seat: claude-sonnet-5 (this worktree session, agent/air-m5/docs/owner-name-zero-v3)
    note: >-
      PR #7434 was byte-preserving (added==deleted per file) but incomplete: it worked from a
      pre-enumerated candidate list rather than walking every tracked path, so entire clusters
      of hits in docs/superpowers/plans|specs, docs/audits, docs/team-guides and
      research/operations were never visited. This v3 rebuilds candidate enumeration from
      `git grep -liE antonello` over the FULL `git ls-files` tree, then applies the same
      line-scoped byte-preserving write discipline #7434 introduced (a line with no real hit is
      never decoded, only re-emitted as raw original bytes), plus a documented functional-
      skip-list (see brief.yml `constraints` for the exact roster) of whole files whose
      "Antonello" occurrences are matching/detecting logic rather than display text (carried
      over and re-verified from #7434's own off-limits review), plus a dedicated regex guard for
      the forensic git-author-quote shape (`Antonello Siano <email>`). The substitution regex
      handles five cases in priority order: (1) the protected git-author-quote (no-op),
      (2) "Antonello Siano" (not quote-shaped) -> "Zero", (3) a JSON-escaped-newline-prefixed
      occurrence (`\nAntonello`) -> "Zero", (4) standalone capitalised "Antonello" (word-boundary,
      not preceded by `\w`/`@`/`-`, not followed by `\w`/`@`) -> "Zero", (5) standalone lowercase
      "antonello" (additionally not preceded/followed by `-`, protecting kebab-case tokens on
      both sides) -> "Zero". The sweep run itself touched more files than survive in the final
      diff: three commit/push-time discoveries (the PII gate, the prettier formatting gate, and
      the R1 adversarial-review frontmatter gate) each reverted a batch of files back to
      origin/main byte-identical content rather than bypassing the blocking gate or running a
      formatter (explicitly banned by the coordinating session's mandate) — see `dissent` for
      all three exclusions and `outcome`/`receipts` for the exact before/after counts.

