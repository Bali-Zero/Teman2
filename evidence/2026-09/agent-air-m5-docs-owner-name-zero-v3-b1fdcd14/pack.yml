seat_override: >-
  R9 council_run: no council convened. This is a mechanical, reviewable text substitution with
  an explicit, auditable rule set (brief.yml `constraints` + this pack's residual-audit table)
  — it touches no GROUND_TRUTH_PATH_PATTERNS entry (no visa rule, no KBLI code, no price, no tax
  rate is asserted or changed), so R8 does not attach either. In place of a second seat, this
  pack documents an exhaustive residual audit (every post-sweep "Antonello"/"antonello" line
  classified into a named KEEP bucket, zero left unclassified) plus a full test run of every
  file that references a touched module — a stronger falsifiability bar than a second reviewer
  reading the diff would provide for a change this mechanical.

outcome: >-
  274 files swept, +611/-611 (byte-preserving: added==deleted for all 274 files, and both equal
  the sweep script's own independently-logged per-file touched-line counter — 0 mismatches; the
  2-file evidence pack itself adds roughly 650 pure-addition lines on top, correctly outside
  this equality check since those files did not exist on origin/main). Three commit/push-time
  discoveries narrowed the sweep from its initial candidate run (529 files, 1492 lines): 2
  research docs (3 lines) reverted for the Law-2 PII gate; 87 more files (438 lines) reverted
  because the substitution broke `prettier --check` on files that were clean on origin/main (a
  formatter run to fix it is explicitly banned by the mandate — see `dissent`); 166 more
  `research/**/*.md` files (440 lines) reverted because `.husky/pre-push`'s `preflight_pack`
  contract ran an R1 adversarial-review frontmatter check that failed on pre-existing,
  unrelated missing metadata (the identical class PR #7434's own pack already excluded, there
  named as 186 files). Residual audit (post-sweep, post all three reverts, excluding
  migrations_v2/.github per the coordinating session's own audit command): 957 case-sensitive
  whole-word "Antonello" lines + 57 "antonello" lines = 1014 total, every one classified into a
  documented KEEP class (table in `receipts` below) — zero unclassified; 447+442+72 of the 1014
  are the three commit/push-time file-level exclusions (`prettier_regression`,
  `r1_gate_excluded`, `own_evidence_pack_prose`) rather than per-occurrence protected patterns —
  see the note under the residual table for why these three classes dominate the count. 914
  tests pass across every file that references a touched module (0 failures; none of the
  reverted files carry code). py_compile/json.load/yaml.safe_load/bash -n/jsonl-per-line clean
  on all applicable touched files. Two disclosed, ACCEPTED prose artifacts from the mechanical
  substitution (not bugs, see `dissent`): several "Zero (Zero)"/"Zero/Zero"/"Zero, Zero"
