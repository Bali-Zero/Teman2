adversarial:
  - seat: kimi-code/k3
    round: 1
    verdict: REWORK-ARGUMENT
    findings: 5
    cured: 1
    accepted_as_correction: 1
    note: >-
      Its first finding DESTROYED the Dux's stated reason for refusing the
      one available cure ("5 Set C judge errors would become 5 releases"):
      those cases already release today, so the raise has zero marginal
      effect there. The Dux measured the claim instead of defending the
      argument, confirmed it, withdrew the reason, and built Set D — the
      cell the argument actually needed — which then produced a VALID reason
      (see `vulnerabilities`). Its remaining findings (repetitions of one
      model are correlated draws, not samples; winner's curse on a judge
      elected against the same benchmark; Set C may measure its authoring
      model's phrasing since the ranking inverts by judge family) are
      ACCEPTED AS OPEN and carried to B2.2 by name, not cured here.
  - seat: codex-gpt-5.6-sol
    round: 1
    verdict: FINDINGS-VIA-CHECKPOINT
    findings: 3
    cured: 3
    note: >-
      Disclosed rather than dressed up: the seat exhausted its own context
      before writing a report, because the Dux fed it a 228 KB bundle — the
      Dux's error, not the seat's. Its saved checkpoint named two hypotheses
      and BOTH were true when the Dux ran them: (1) the replay key was not
      injective, (2) a declared `reranked` kind with a non-positive score
      created relevance. Re-dispatched on a 34 KB slice, the seat hit its own
      context threshold a SECOND time and checkpointed a THIRD hypothesis,
      which was also true: (3) a declared kind whose provenance band is NONE
      could be lifted to WEAK by the keyword ratio alone — a
      `dense_formatted` source at cosine 0.02 with a high ratio scored 0.28
      against a 0.15 gate, i.e. the false-acceptance shape this inversion
      exists to remove, leaking back through the one source that had
      DECLARED its own irrelevance. All three reproduced before curing, all
      three cured, six tests added. The seat never wrote a numbered report:
      its findings reached this pack as hypotheses it saved on its way out,
      and the proof in each case is the Dux's own reproduction, named here so
      nobody credits the seat with a verdict it did not give.
  - seat: gemini-3.1-pro
    round: 1
    verdict: ONE-MAJOR-REJECTED
    findings: 1
    rejected: 1
    counts_toward_quorum: false
    note: >-
      Categories (c) and (d) explicitly yielded nothing. Its one MAJOR —
      "the support-negative branch reads `context_length` from
      `evidence_inputs` while the normal path reads it from the wire root,
      and the test fixture nests it to mask the bug" — is REJECTED on disk,
      not on authority: `wa_codex_leg.py:1005`, the PRE-EXISTING finalize
      call, reads `evidence_inputs.get("context_length")` exactly like the
      new branch at :657 (one line, not two, is added by this PR), and the
      PRODUCER writes the key inside `evidence_inputs`
      (`wa_package_builder.py:645`). So the new branch mirrors the existing
      contract and the fixture models the real wire. The premise of the
      finding — a divergence between the two paths — does not exist on this
      checkout.

dissent:
  - seat: kimi-code/k3
    status: CONFIRMED
    objection: >-
      "Never raise" is a contingent property of THIS judge's measured error
      direction, not an architectural invariant; the fallback judge errs the
      other way, so the asymmetry must be stated as a calibration, not a law.
    disposition: >-
      ACCEPTED, and the Dux does not claim otherwise: the refusal in this PR
      rests on the Set D measurement of THIS judge in THIS cell, and B2.2
      re-opens the direction question when it fixes a threshold across two
      judges. Recorded, not cured.
vulnerabilities:
  - id: V1-declared-residual-false-abstention
    severity: named-and-open
    what: >-
      bs-17806bb4 — "What is the price of new company setup?" against the
      Indonesian PT PMA chunk that DOES carry the price — scores 0.08 and
      abstains at both gates, before and after this PR.
    why: >-
      Its provenance fixture in the FROZEN manifest declares
      `score_kind: unknown` with `score_raw: null` (inventory row 5, "legacy
      literal, no writer"), so the provenance-primary path never applies and
      the UNCHANGED legacy lexical path runs; an English question naming no
      identifier shares no token with Indonesian text, so the ratio is 0.
    cure_that_exists_and_is_not_ours: >-
      The chunk's REAL embedding cosine is 0.373 (measured 2026-09-03,
      recorded in the xfail's own reason), above the 0.32 MODERATE boundary
      this PR implements — a fixture that DECLARED `dense_formatted` would be
      cured by the engine as built. That edit is banned to this PR twice
      over (frozen manifest; byte-identical tripwires) and the xfail assigns
      it to "the nine tripwires pinned to impossible cosines, corrected in
      their own PR".
    cure_refused_with_its_measurement: >-
      Letting a SUPPORTED verdict RAISE the band by one step would close this
      cell. REFUSED: Set D (`sup-d-dd0c1a97`) is a hard negative that the
      seat wrongly calls SUPPORTED and that the scorer abstains TODAY at 0.08
      held by the zero lexical band and by nothing else. One band step is the
      whole margin, so the raise buys one false abstention and pays a
      measured false acceptance of unsupported fee/duration advice in the
      same cell. Two tests freeze that trade.
  - id: V2-cross-language-unknown-provenance-is-blind
    severity: named-and-open
    what: >-
      Set D found two MORE false abstentions of the same disease
      (sup-d-4984a0c2, sup-d-4d058bdc: sufficient, judge correctly SUPPORTED,
      scorer abstains at 0.08).
    why: "An EN query against ID context with `unknown` provenance has no signal left: no lexical bridge, no band, and support may not create one."
    disposition: "The cure is a DECLARED score_kind on the real retrieval path — B1.1 already emits one; what is missing is the FIXTURES. Carried to the provenance-fixture PR with V1."
  - id: V3-hard-case-blindness-of-the-elected-judge
    severity: named-and-open
    what: "Candidate (iii) false-SUPPORTEDs 5 of 12 Set C hard negatives (3 unanimously) and 2 of 6 in Set D."
    disposition: >-
      NOT curable by a threshold, which is exactly why D-SETC demanded the
      measurement BEFORE B2.2 fixes one. B2.2 owns the choice between a
      two-judge conjunction and a Set-C-aware prompt; ruling I26's election
      of (iii) stands unless the staff room revisits it on these numbers.
  - id: V4-reranked-scale-unmeasured
    severity: named-and-open
    what: "A positive `reranked` score reads a flat conservative WEAK band because this repo has never measured the reranker's scale."
    disposition: "Declared in the code, in the tests and here; needs a real reranker-score measurement in a follow-up. The 0.0/negative floor is no longer read as evidence (round-1 cure)."
perimeter_decision:
  ruling: >-
    SIX paths reach a client without ever calling the scorer — widened from
    the three the build spec named, after this window found three more. ALL
    SIX stay EXCLUDED for B2.1, each with a tripwire that fails the day the
    code stops matching the reason it was excluded for
    (`test_b2_perimeter_exclusions.py`): the trusted-tool 0.85 bypass, the
    FAQ fast path, the KG fast path, the semantic-cache read path, the
    multi-agent coordinator branch, the specialized-service router branch.
  residual_risk: >-
    Any of those six can still release substantive advice without a support
    verdict. The FAQ cache is DEFENDED (only pre-vetted metadata can enter
    it); the semantic-cache write path has NO production caller today, which
    is a zero-caller fact and not a contract — a future caller re-opens it.
