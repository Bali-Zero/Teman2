    diff against main will narrow to just its 2 substantive commits. Not a
    defect, a reading note for whoever reviews this pack before the siblings
    merge."
  - "No runtime behaviour change to verify live: slot 6 only activates on an
    actual quota/auth failure cascade through slots 1-5 in the weekly reflexion
    cron, which does not occur under normal operation -- the hermetic test
    suite (7 + 31 + 62 = 100 tests across the 3 files this diff touches or
    repairs) is the available proof, not a live cron run. Same disclosure as
    the sibling #4640/#4644 packs."
  - "3 pre-existing, unrelated test failures in
    test_claude_oauth_runtime_fallback.py remain unfixed (see dissent above and
    brief.yml risks) -- flagged, not silently left out of this pack."
