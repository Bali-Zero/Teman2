gear: 3
gate_class: opus
brief_ref: evidence/brief.yml
council_run: council-journal.jsonl

lanes:
  - lane: build
    role: build
    seat: claude-fable-5-1
    note: >-
      GROUND: located the kita CRM (apps/mouth, not admin-dashboard), read
      practice_state_machine.py, crm_practices.py (create/update/catalog),
      the practice_types catalog and column nullability in prod via the
      read-only scripts/pg.sh role, counted 40 INNER JOINs on
      practice_types across the backend (the reason for a placeholder row
      instead of NULL). BUILD: migration 311, PracticeCreate/PracticeUpdate
      changes, validate_service_selected, catalog exclusion, 12 new unit
      tests. Applied every CONFIRMED spalla finding in a second commit.
      Authored this pack.
  - lane: independent-diff-review
    role: review
    seat: claude-opus-5
    note: >-
      Agent tool, subagent_type spalla-review, model opus, fresh context,
      read-only, diff-bounded prompt with an explicit downstream-consumer
      grep mandate. SEAT-VERDICT: not-ok. 6 findings, 5 fixed, 1 accepted
      — see dissent. External seats (codex, kimi, agy, qwen) were all
      TIMEOUT in the organism probe at session start (2026-09-11), so the
      spalla ran on the Claude seat, on a model different from the author.
  - lane: final-gate
    role: review
    seat: claude-opus-5
    note: "Pending — gate_verdict is posted by the final-gate seat via scripts/harness_fable_gate.py on the head sha, not here."

spend:
  wall_clock_hours: 1.9
  adversarial_rounds: 1

appetite_exceeded: none

pii_scan: clean
pii_scan_note: >-
  The diff is Python (router, state machine, unit tests with synthetic
  fixtures such as client_id 42 and team@balizero.com) and one SQL catalog
  row (a service name and description). No client row is read, written or
  logged by the change. The only prod reads during GROUND were schema and
  aggregate queries through the read-only role (column nullability, the
  catalog codes/prices already public on the pricing page, a count of
  NULL-type practices). `git diff origin/main...HEAD` grepped for
  phone/email/passport/KTP/NPWP/16-digit shapes prints nothing
  (2026-09-11T14:39:41Z). The spalla prompt carried only the diff and
  file paths.

