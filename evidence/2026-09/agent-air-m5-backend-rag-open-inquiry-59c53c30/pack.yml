  - probe: A1
    claim: >-
      WHEN the state-machine and crm_practices unit suites are run SHALL
      pass all cases including the new TestValidateServiceSelected and
      TestOpenInquiry classes (8 endpoint cases after the spalla round).
    cmd: >-
      cd apps/backend-rag && .venv/bin/python -m pytest
      backend/tests/services/crm/test_practice_state_machine.py
      backend/tests/unit/routers/test_crm_practices.py -p no:cacheprovider
    result: "158 passed in 1.04s"
    exit: 0
    ts: "2026-09-11T14:44:04Z"
    seat: claude-fable-5-1 (build)

  - probe: A2
    claim: >-
      lint_migration_numbers.py and lint_migration_rollback.py SHALL report
      zero violations with 311 in the tree.
    cmd: >-
      python3 scripts/lint_migration_numbers.py && python3
      scripts/lint_migration_rollback.py
    result: >-
      "✅ migration-numbers lint: 188 files, all unique prefixes" / "✅
      migration-rollback lint: 183 post-cutoff migrations, all have
      ROLLBACK marker"
    exit: 0
    ts: "2026-09-11T14:39:32Z"
    seat: claude-fable-5-1 (build)
    note: >-
      Slot 310 was taken on the worktree base (310_practice_status_log.sql)
      while the checkout inspected at GROUND ended at 309; the W41
      pre-commit lint caught the collision on the first commit attempt and
      the file was renumbered to 311 before anything was committed.

  - probe: A3
    claim: >-
      The deterministic gear floor recomputed from this PR's own
      changed-file set (after the spalla-fix commit a14aac2464) equals 3.
    cmd: >-
      git diff --name-only origin/main...HEAD > cf.txt && git diff
      --numstat origin/main...HEAD > ns.txt && python3
      scripts/evidence_pack_lint.py --print-floor --changed-files-file
      cf.txt --numstat-file ns.txt
    result: "3 (source: path — migrations_v2; 489 net lines after the fix commit)"
    exit: 0
    ts: "2026-09-11T14:44:26Z"
    seat: claude-fable-5-1 (build)

  - probe: A4-static
    claim: >-
      split_migration_sql on 311 yields a forward section with none of
      migration_base's DANGEROUS_PATTERNS (DROP DATABASE/SCHEMA, TRUNCATE)
      nor DELETE/DROP TABLE, and a rollback that is a soft-disable only.
    cmd: >-
      cd apps/backend-rag && .venv/bin/python -c "from
      backend.db.migration_base import split_migration_sql; ..." (inline
