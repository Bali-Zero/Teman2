    exit: 0
    ts: "2026-09-11T14:39:41Z"
    seat: claude-fable-5-1 (build)

dissent:
  - seat: claude-opus-5
    objection: >-
      (HIGH) The service gate only runs inside the status-change branch, so
      a PATCH carrying only practice_type_code='open_inquiry' could regress
      a live on_process/completed practice to the placeholder.
    status: CONFIRMED
    disposition: >-
      Fixed in a14aac2464: setting the placeholder is refused (400) unless
      the effective status (new or current, normalized) is inquiry or
      cancelled. Regression test
      test_update_cannot_regress_live_practice_to_placeholder.
  - seat: claude-opus-5
    objection: >-
      (HIGH) An open inquiry is created with quoted_price NULL (the
      placeholder has no base_price) and nothing back-fills it when the
      service is chosen; invoice_service float()s quoted_price inside a
      spawn()ed task at sending_invoice, failing silently (scar family #2).
    status: CONFIRMED
    disposition: >-
      Fixed: the PATCH type lookup now selects base_price and back-fills
      quoted_price when it is NULL and the caller did not set it in the
      same request. Test
      test_update_service_backfills_quoted_price_from_base_price pins the
      SQL and parameters.
  - seat: claude-opus-5
    objection: >-
      (MEDIUM) The 42703 backward-compat fallback SELECT does not join
      practice_types, so old_practice_type_code stays None and the gate is
      silently off on that branch.
    status: CONFIRMED
    disposition: >-
      Fixed: the fallback query now carries the same LEFT JOIN and pt.code
      and assigns old_practice_type_code.
  - seat: claude-opus-5
    objection: >-
      (MEDIUM) If migration 311 is not applied, every POST without a
      service 404s as "Practice type 'open_inquiry' not found" — the
      default path of the new form — with no test for the missing-row
      case.
    status: CONFIRMED
    disposition: >-
      Fixed: the missing placeholder now returns 503 with an explicit
      "migration 311 not applied" hint (test updated to pin it). Process
      guard: the mouth PR ships only after the Bites observation A5 shows
      the row live; the release_command applies 311 before the new code
      serves traffic.
  - seat: claude-opus-5
    objection: >-
      (LOW) The PATCH lookup filters is_active = true while create_practice's
      lookup does not; a soft-disabled type stays creatable but not
      patchable, and the 311 rollback stops the no-service POST path.
    status: PLAUSIBLE
    disposition: >-
      No code change. create_practice's unfiltered lookup is pre-existing
      behaviour that programmatic callers may rely on; tightening it is a
      separate concern. The rollback of 311 stopping the no-service POST is
      the intended effect of rolling the feature back (the mouth form is
      rolled back with it); the 503 message names the cause.
  - seat: claude-opus-5
    objection: >-
      (LOW) mock_db_conn.execute.assert_not_called() does not prove no
      write — the UPDATE runs through conn.fetchrow(...RETURNING...).
    status: CONFIRMED
    disposition: >-
      Fixed: the blocked-transition test asserts fetchrow.call_count == 1
      (the old-row read only).

bites:
  consumer: >-
    kita.balizero.com /process/new and /process/[id] (mouth PR, shipped
    next from a fresh main) calling POST/PATCH /api/crm/practices on
    nuzantara-rag.fly.dev; until then the API itself.
  where: >-
    production — merging this PR deploys backend-rag; fly.toml's
    release_command runs `backend.db.migrate apply-all`, which seeds the
    open_inquiry row before the new code serves.
  observe: >-
    scripts/pg.sh -A -F'|' -c "SELECT code, category, is_active FROM
    practice_types WHERE code='open_inquiry'" ; then an authenticated GET
    https://nuzantara-rag.fly.dev/api/crm/practices/types/catalog.
  expect: >-
    One row `open_inquiry|inquiry|t` (0 rows before merge, receipt
    prod-baseline); the catalog JSON contains no "open_inquiry" and no
    "inquiry" category.
