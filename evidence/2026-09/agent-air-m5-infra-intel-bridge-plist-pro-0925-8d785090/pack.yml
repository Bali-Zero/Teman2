dissent:
  - seat: kimi-code/k3
    objection: >-
      "matches Pro's live plist byte-for-byte (plutil xml1 diff empty)" in
      the job-ownership.yaml note slightly overclaims: plutil -convert xml1
      re-serializes the file, so an empty diff proves key/value/order
      equality, not literal raw-byte equality of the two source files
      (e.g. it would normalize incidental whitespace differences, though
      none exist here since both files already share the same 4-space
      style). The parenthetical discloses the actual check, so it is not
      misleading, just slightly stronger phrasing than the check itself
      proves.
    status: PLAUSIBLE
  - seat: kimi-code/k3
    objection: >-
      If this job is ever re-homed off Pro in the future, the plist (plus
      _bootstrap_env.py's 127.0.0.1 default when no per-host secrets file
      is present) would silently target localhost Redis with no error.
    status: RETRACTED
