plan_ref: >-
  Coordinator (team-lead) mandate for condition S2 of the BLOCK on PR #7420
  (re-gate #2, comment 5848838838): commit the codexpin v3 spec, add a
  CLOSED inventory of every D5 guard and conjunct at 04dd6b51e4, specify S3
  (the CI mutation check) and S4 (the evidence-text fixes). Docs only; the
  author does not arm or merge.

lanes:
  - lane: build
    role: build
    seat: claude-opus-5-5
  - lane: review-cross-family-codex
    role: review
    seat: codex-gpt-5.6-sol
  - lane: refute-cross-family-kimi
    role: review
    seat: kimi-code/k3

what_changed: |
  docs/specs/2026-09-27-codexpin-v3-spec.md: the codexpin v3 spec, until now
  session scratch only, committed with D1-D9, their amendments and the 3-PR
  plan. New: §5bis, the closed D5 inventory (17-kind lexical site grammar,
  closure rule, mutation operators, fixture contracts N and P,
  dispositions, the decisions re-gate #2 asked for, the rendered table, the
  new fixtures, what the 04dd6b51e4 suite kills today); §5ter, the S3
  mutation check (interface, isolation, algorithm, selftest, CI wiring);
  §5quater, S4; D5 gains the heartbeat fix that PR-1 lands (/bin/mkdir and
  /bin/date); §10 changelog.
  docs/specs/2026-09-27-codexpin-v3-d5-inventory.yaml: the normative
  inventory S3 reads: 71 rows (67 MUST, 4 EQUIVALENT, 0 deferred), 136
  sites on the PR-1 target, 132 mutants at 0ac11b17e8 (148 after gate r3).
  After council round 1: kinds const, neg and redir; the static mode; the
  heartbeat fix moved into PR-1; stdin bound to /dev/null; the killed_by
  exactly-one-node rule; EQUIVALENT compared over every test; selftest (e)
  reworded; the seven mode corrections disclosed.
  After council round 2: kind abspath with rows G9j, G9k and mutant
  G7e/path; well-formed UTC stamps in contracts N and P; derived_from names
  the target blob; selftest cases f-i; the not-sites rationale re-measured;
  §8 item 9 (date -u unpinned).
  After the coordinator's ruling on the two open questions: D5 states that
  PR-1 modifies wrapper lines 72 and 74 and why (G9b's equivalence); `date
  -u` is MUST, with kind dateopt, rows G7i and G9l, the TZ fixture
  test_stamps_are_utc_under_a_non_utc_tz and a skew-aware run-log hook.
  After the fresh gate's REWORK-BUILD (gate r3, comment 5850401670), one
  new commit: R1, every kind gets a fixed operator with required classes
  (op, branch, relop, removal, value) and a fixed direction for conditions,
  and S3 step 4 adds OPERATOR, which computes each operator's line and
  compares every mutant with it (selftest cases j, n, o); R2, the
  exit-value operator, 14 `/v` mutants (op val) plus G9b/v (EQUIVALENT);
  R3, the relop class and mutant G2/-gt; R4, a normative 27-site plant
  covering all 17 kinds as selftest (a), with four grammar cells made
  exact; R5, STALE-DERIVATION (selftest k); R6, the W69 sentinel shape
  for wa-codex-pin.yml, the operator[gui] arming of `wa-codex-pin verdict`
  as a required context, the window until then (§8 item 10), and "15
  kinds" corrected to 17. Inventory: 71 rows (67 MUST, 4 EQUIVALENT), 136
  sites, 148 mutants (143 MUST, 5 EQUIVALENT).
  After the fresh gate's BLOCK with a re-scope (gate r4, comment
  5852422768; owner ruling: the generator route), one new commit. S3
  generates every member of every operator class of every site, and the
  YAML (schema 2) only annotates the generated ids with disposition, mode
  and killers (reason on EQUIVALENT, an informational label); `to`,
  anchors, `covers` and OPERATOR are retired, and any other key is SCHEMA
  (§5bis.2, §5bis.3). Ids are <line-id>:<site key>:<member>, the line-id
  hashed from the normalised line and anchored to the nearest unique line
  when the line repeats (§5bis.3a). One line in, one line out (LINES) and
  SPAN close H7. Base-relative dispositions are closed by the floor: PR-1
  adds the inventory, the wrapper test, the spec and S3 to
  HOTZONE_PATTERNS and to hot-zone-pr-gate.yml, with floor cases in
  test_evidence_pack_lint.py (§5ter.5). The selftest is rewritten (cases
  a, b1-b3, c, d1-d3, e, f, g, h, i, k, m1-m3, n). The generator also ran
  on #7340's installer at 3d04590c99 (§5ter.6). Inventory: 136 sites, 177
  mutants (170 MUST, 7 EQUIVALENT) under 71 labels; 29 are new against
  schema 1.

proof: |
  See receipts. Every number in the spec's §5bis.8 and §9 comes from the
  scratch prototypes whose outputs the receipts quote. The prototypes are
  NOT the S3 implementation; the resumed PR-1 build writes that, and its
  CI receipt replaces these numbers (§5quater).

pii_scan: clean
pii_scan_note: >-
  The spec, the inventory and every council prompt (rounds 1-4b) carry repo
  paths, the owner codename, service account names and synthetic pin
  fixtures only; no client data, OSINT or credential. The one email-shaped
  hit, in the round-4 prompt, is the repository's commit identity quoted in
  gate r4's public comment, not client data. Council dispatch ran
  with a scrubbed env (env -i), a read-only sandbox for codex and a
  no-tools child for kimi.

post_council_note: >-
  The ruling commit (0ac11b17e8), on the coordinator's instruction, had no
  council round: D5 states PR-1's lines 72 and 74 and why, and `date -u`
  became a MUST row pair (G7i, G9l) with its fixture; the journal carries
  an author-note line. The gate r3 rework commit on top of it changed
  inventory rows (16 mutants), so it had a council delta round (round 3)
  with both titolari on the spec+YAML diff, the 04dd6b51e4 wrapper and
  the scratch prototype: both ACCEPT-WITH-NOTES, no BLOCKER, no MAJOR.
  Their MINOR notes were fixed in the same commit (dissent below); none
  changed a row, a mutant or a count, so no further round was run.
  Gate r4 re-scoped S3 (the generator route), so its commit had a full
  council round (round 4), one fix round and one delta round (4b), the cap
  the coordinator set. Round 4: codex-gpt-5.6-sol REWORK (3 BLOCKER,
  1 MAJOR), kimi-code/k3 ACCEPT-WITH-NOTES (1 MAJOR). The fix round cured
  the masked guards in literal text (MASKED, UNSUPPORTED), the 32-bit ids
  (now 64-bit), and receipted the queue's re-flooring. Round 4b: kimi-code/k3
  ACCEPT-WITH-NOTES, codex-gpt-5.6-sol REWORK on one BLOCKER both seats
  share: code that reaches an interpreter without a literal (a variable,
  an alias, $'...') still escapes. With the cap reached, the author made
  accuracy corrections only (the claim limited to literal text, §8 item
  12 opened with the cure the seats named, receipts for the queue, the
  daemon and the linter's history) and left the BLOCKER, and codex's MAJOR
  that the hot-zone list's own floor (§8 item 11) be a PR-1 prerequisite,
  to the gate and the owner.

spend:
  wall_clock_hours: 10.5
  adversarial_rounds: 5
appetite_exceeded: >-
  Wall clock went past the 4 h appetite. Council round 2 found two MAJOR
  gaps (the unpinned /bin/date, the base-blob derived_from). They needed a
  new site kind and a full re-run of the mutant proof, which took 17 min
  under a load average near 35. The coordinator's ruling then added the
  dateopt rows and a third full re-run. The fresh gate's REWORK-BUILD
  (gate r3) added a third council round and a fourth full re-run, 24 min
  for the feasibility suite alone under a load average between 35 and 130.
  Gate r4's re-scope (the generator) replaced the S3 contract and the whole
  inventory, and needed a full council round, a fix round and a delta
  round; each proof re-run took 2 to 5 min of feasibility at load 13 to 38.

