gear: 3
gear_reason: >-
  Floor measured on the working-tree diff against base 212434e0dd (`evidence_pack_lint.py
  --print-floor` over the numstat, result 3): a SIGNED production rule pack
  (rulepack-prod-024.signed.json, 9,330 lines after Prettier) lands over apps/backend-rag/**,
  where merging a PR is itself the deploy (memory
  discovery_merging_a_backend_rag_pr_deploys_by_itself_2026_09_01). It becomes the HIGHEST SIGNED
  pack every census/inventory/gold-replay consumer reads. The runtime stays on the DB-active pack
  until a separate activation; the signed bytes ship live the moment this merges. Judgement agrees
  independently of the floor. The bundle is a generated artifact — the hand-written part is small
  (about 300 net lines of tests, one docstring, one observer, one runbook note).
ruling: >-
  Zero, 2026-09-27 — E33F: a retiree without a confirmed sponsor becomes an E33F candidate. This PR
  is the SIGNING half: it lands the signed seq-24 the fold PR (#7459, 222ee5565c) prepared as an
  unsigned candidate. Signed, NOT activated.
mission: >-
  Visa Oracle seq-24 (E33F no-sponsor -> candidate) — PR-B, backend-rag + one mouth test, the
  signed bundle and the pins a newly signed pack moves. Sibling already merged: PR-M (#7464, the
  mouth asks retirees the penjamin question).
objective: >-
  Land rulepack-prod-024.signed.json — signed offline on M5 by a fresh signing session outside the
  contribution chain (kid prod-2026-07-1, signed_at 2026-09-27T01:31:02Z, payload_sha256 H24
  5a569091f84a858f1957cdf96086ee7212f67d13a8225d64492a7212093cd272, previous_payload_sha256 H23
  e5f791b5232fd1369ef3b94ca7bb5f349f9bb6eb4073895aa9f7deb682e72204) — after verifying it with the
  repo's own verify_rule_pack against the PUBLIC production trust store, before and after Prettier.
  Then move every consumer the new highest-signed pack moves, by command, never by typing a number
  from a brief: the gold production-replay expectations of personas 3 and 4 (SPONSOR_REQUIRED left
  with the retired hf.e33f.sponsor-required), and the mouth's absolute EXCLUDE-code floor (35 -> 34).
  Give test_seq24_pack.py its signed-mode ties and signature check, give the ceremony a dated
  runbook note, and add the no-arg observer scripts/ci/observe_visa_seq24_signed.py.
scope:
  - apps/backend-rag/backend/services/visa_engine/contracts/packs/rulepack-prod-024.signed.json (new, GENERATED by sign_pack on M5, then Prettier)
  - apps/backend-rag/backend/tests/services/visa_engine/test_seq24_pack.py (TestSignedBundleTiesToSource: digest ties, chain anchor, signature verify, two guilts)
  - apps/backend-rag/backend/tests/services/visa_engine/test_evaluator_gold.py (personas 3 and 4: SPONSOR_REQUIRED leaves the no-path codes)
  - apps/backend-rag/backend/tests/services/visa_engine/test_interview_walk_census.py (comments only: the seq-24 pins were measured on the candidate and are reproduced on the signed tree)
  - apps/backend-rag/backend/scripts/visa_engine/fold_pack_seq24.py (docstring only: signed 2026-09-27)
  - apps/mouth/src/app/(visa-oracle)/visa-oracle/_lib/engine-adapter.test.ts (EXCLUDE floor 35 -> 34)
  - docs/runbooks/visa-engine-key-ceremony.md (dated signing note)
  - scripts/ci/observe_visa_seq24_signed.py (new)
  - evidence/2026-09/agent-nuzantara-backend-rag-seq24-sign-99f66ece/**
constraints:
  - No activation, no production DB connection, no --yes. This seat never opened, read, copied or printed the private key; it saw only the finished bundle and used only the PUBLIC trust store documented in the key-ceremony runbook.
  - No rule, fact or reason code is touched: the signed payload is byte-identical to rulepack-prod-024.source.json under JCS (the test pins it).
  - test_review_hold_inventory.py and gold_coverage/fixtures/option_matrix.json are NOT edited — the inventory stays 1 / 0 and no option-matrix cell moves on seq-24; both were run and stay green.
  - No npm install/ci. This seat does not push, open the PR, arm, merge or judge: the owning session ships after a fresh gate, and the council journal is left empty on purpose.
acceptance:
  - text: "The signed bundle SHALL verify as VerifiedRulePack(sequence=24, PRODUCTION, prod-2026-07-1, unsigned_dev=False) with the public production key, chained to H23, payload digest H24, byte-identical to the source under JCS — before AND after Prettier"
    probe: "pytest backend/tests/services/visa_engine/test_seq24_pack.py::TestSignedBundleTiesToSource"
  - text: "Every consumer the highest signed pack moves SHALL be green: census (signed-sequence pins), inventory 1/0, gold replay floor 17/3 with personas 3 and 4 re-derived"
    probe: "python3 scripts/ci/observe_visa_seq24_signed.py"
  - text: "The gold replay driver SHALL be back at its 17 / 3 floor with personas 3 and 4 re-derived"
    probe: "pytest backend/tests/scripts/visa_engine/test_gold_replay_driver.py"
  - text: "The mouth SHALL pin the signed pack's distinct EXCLUDE codes at the measured 34 and every one SHALL still have copy"
    probe: 'npx vitest --run "src/app/(visa-oracle)"'
  - text: "The whole visa_engine backend package SHALL end with exactly the failures and errors the base already has (two retention-fk-registry failures, 31 evaluate_endpoint DB-fixture errors) and no new one"
    probe: "pytest backend/tests/services/visa_engine/ backend/tests/scripts/visa_engine/"
consumer_map:
  - >-
    test_interview_walk_census.py, test_review_hold_inventory.py, test_gold_replay_driver.py and
    test_gold_coverage_*: read the HIGHEST SIGNED pack on disk via select_highest_repository_pack;
    this PR moves them from seq-23 to seq-24. The census already carried per-sequence pins for 24
    (PR #7459), so its signed-mode tests pass on them unchanged; its 14 candidate-mode tests skip
    by design once no unsigned source sits above the highest signed one.
  - >-
    apps/mouth engine-adapter.test.ts (highestSequencePack): the absolute EXCLUDE-code floor reads
    the highest signed pack; it moves 35 -> 34 because seq-24 retires the only emitter of
    SPONSOR_REQUIRED.
  - >-
    The conductor's activation of seq-24 (a separate order, after this merges): consumes the signed
    file from the repo. Owed, not claimed here.
