council_run: "council-journal.jsonl"
plan_ref: >-
  PR (agent/air-m5/wa-team/t3-p2-c1-tests-0929, base main) - C1 of the #7671 gate: three real-PG
  tests that kill M14, M15, M18 and M22; real-PG floor 65 -> 68. No production change.
lanes:
  - lane: wa-team-t3-p2-c1-build
    role: build
    seat: "claude-sonnet-5-5 (wrote the tests, ran the mutants, applied the council finding by hand)"
  - lane: wa-team-t3-p2-c1-council-codex
    role: review
    seat: "codex-gpt-5.6-sol (round 1 REWORK on 1 MEDIUM + 4 LOW)"
  - lane: wa-team-t3-p2-c1-council-kimi
    role: review
    seat: "kimi-code/k3 (round 1 GO-WITH-NITS on 1 MEDIUM + 3 LOW)"

what_changed: |
  Three real-PG tests in test_wa_team_promises_link_real_pg.py: (1) the audit counts unknown
  client/member on ALREADY-LINKED promises (kills M14, M15); (2) the judge insert with three
  messages binds only its own message, made deterministic with a CHECK constraint that every other
  message's client violates (kills M22); (3) run_link(dry_run=True) ignores targets already set
  (kills M18, both the client and the member count). Workflow: real-PG FLOOR 65 -> 68.

proof: |
  Mutants applied to a copy of the production file; per mutant, current suite (unit link + real-PG
  minus the 3 new tests) vs new suite:
    M14 74 passed / 1 failed (audit test)     M15 74 passed / 1 failed (audit test)
    M22 74 passed / 1 failed (CheckViolation) M18 (client count) 74 passed / 1 failed
    M18b (member count) 74 passed / 1 failed
  Correct code: real-PG 68 passed, 0 skipped; unit 258 passed. Production byte-identical.

dissent:
  - seat: codex-gpt-5.6-sol
    objection: "MEDIUM: M22 is not guaranteed killed; ON CONFLICT DO NOTHING keeps whichever duplicate row Postgres scans first, so a lucky order would pass."
    status: CONFIRMED
    resolution: "Test now adds a CHECK constraint that any row proposed for another message violates; the mutant then fails on CheckViolationError regardless of order (shown)."
  - seat: kimi-code/k3
    objection: "MEDIUM: tests 2 and 3 seed no clients/team_members rows, so correct code might fail."
    status: RETRACTED
    resolution: "False on disk: neither the insert nor run_link consults those tables (only the audit does, and test 1 seeds them); both tests pass on correct code."
  - seat: kimi-code/k3
    objection: "LOW: unordered fetch in the M22 test; one test attributes both M14 and M15."
    status: PLAUSIBLE
    resolution: "OPEN, accepted: a single-row expectation; each mutant fails its own assertion."
  - seat: codex-gpt-5.6-sol
    objection: "#7671 gate LOW (carried here as C1 requires): the conflict / no-op insert (INSERT 0 0 on ON CONFLICT) is uncovered."
    status: PLAUSIBLE
    resolution: "OPEN, accepted: pre-existing behaviour, accepted at the #7671 gate."

