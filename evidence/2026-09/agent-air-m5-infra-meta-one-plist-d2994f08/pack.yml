brief_ref: evidence/brief.yml
seat_override: >-
  Single 41-line mechanical LaunchAgent plist, no logic of its own — it
  only names a schedule and a program path. R9's council_run quorum
  requirement is designed for a diff with a build lane whose reasoning a
  second reviewer can disagree with; there is none here to disagree about.
  Heterogeneity is supplied by three non-overlapping mechanical checks
  instead: plutil (Apple's own plist validator), scripts/lint_plist_keepalive.py
  (this repo's dedicated superscar #7/W67 antidote for exactly the defect
  class a plist like this could carry), and a live Codex (gpt-6-astra)
  second opinion run directly against this file via `codex exec
  --sandbox read-only` (receipt below) — it found one real, declared-not-
  cured imprecision (see dissent). The script this plist invokes is
  reviewed separately, in the sibling PR that ships it. Fabricating a
  two-seat council journal for a diff with no behaviour of its own to
  review would be a hollow gesture, not evidence.
plan_ref: >-
  docs/marketing/meta-one-advanced-playbook.md §4.3 (Cron
  scripts/meta_one_steward.py, deterministic, stdlib + urllib, Pro-resident,
  daily 06:20 WITA through scripts/meta-one-steward.sh) — read in the
  sibling docs worktree .worktrees/docs-meta-one-playbook. No PENDING-ARMS
  ledger row: this is a mechanical infra artifact serializing after the
  sibling code PR, not a standalone feature.

lanes:
  - lane: meta-one-plist
    role: build
    seat: claude-sonnet-5

diff:
  behaviour_change: >-
    Adds one new file, infra/launchagents/com.nuzantara.meta-one-steward.plist
    (41 lines) — no existing file is modified. It declares no runtime
    behaviour by itself: launchd only acts on it once a separate, later
    ALIGN step installs it on Pro. The behaviour it will eventually trigger
    (the steward's daily tick) is entirely defined by the sibling PR's
    scripts/meta-one-steward.sh and scripts/meta_one_steward.py, neither of
    which this diff touches.
  files: 3
  net_lines: 41
  measured_at: >-
    git diff origin/main --numstat after `git add` of the plist and these
    two evidence files, on branch agent/air-m5/infra/meta-one-plist at
    baseline.commit below. See receipts for the exact command and output.

baseline:
  commit: e0bcae5b8d12d84afda708c5ace71ef97843257f # pragma: allowlist secret - public commit sha, origin/main at pack-authoring time, not a credential

known_debt:
  - >-
    The plist is inert until a post-merge ALIGN step installs it on Pro
    (~/Library/LaunchAgents + launchctl bootstrap/load) — this PR does not
    perform that step, per the brief's constraint. Until installed, the
    steward organ pro.meta_one_steward does not run on any schedule.
  - >-
    ProgramArguments names /Users/nuzantara/nuzantara/scripts/meta-one-steward.sh,
    which exists only once the sibling PR (from
    .worktrees/infra-meta-one-steward) merges to main. This PR must merge
    AFTER that one — merging first would arm a schedule pointing at a
    not-yet-existent script, harmless until install but worth stating
    explicitly as a merge-order constraint.

seat_diversity: satisfied
seat_diversity_note: >-
  A single build lane; D3's non-Anthropic-seat requirement only binds at
  >=2 build lanes on the same pack, so it does not apply by its own terms.

pii_scan: clean

