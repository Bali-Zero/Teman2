seat_diversity: not_applicable
seat_diversity_note:
  '"All three lanes are Anthropic seats, declared rather than left to read as satisfied.
  Every load-bearing question in this diff is settled by a probe with a binary answer — does the guard
  go red when mutated, does the number appear at this file:line, does the suite pass — not by a judgment
  where divergent priors could change the outcome. The one genuinely contestable question (should the
  eleven out-of-scope surfaces move too?) is explicitly NOT decided here: it is a Legge 5 business decision,
  ledgered to Zero, and no cross-family seat is entitled to settle it either. The two external seats that
  found the ORIGINAL defect on 2026-08-31 (codex-gpt-5.6-sol and kimi-code/k3) were right about the mechanics
  and are not re-convened: their finding stands and is preserved by this diff. What they could not know
  is which number a human answers."'
diff:
  net_lines:
    "Sixteen files, measured from the merge-base with `git diff --cached --numstat $(git merge-base
    HEAD origin/main)`, never two-dot (W102). The line counts are deliberately not restated here: this
    pack is itself one of the files, so any figure written into it is stale the moment it is written —
    run the command. Two of the files are this pack and its brief; a further two are the council journal
    and the modus ledger. The bulk of the rest is test and comment rather than behaviour: the AST guard
    on the pricing fallbacks, the cross-file agreement guard, the Qdrant patch script's line-anchored
    rewrite with its two regression tests, the QR-provenance assertion, and a ruff-format normalisation
    restoring one test file to the parity it had at base. Zero migrations, zero workflows, zero frontend."
  behaviour_change:
    The client-facing WhatsApp number on the price list, in both pricing tools' degraded-path
    fallback, and in the Qdrant contact-patch script's target value changes from the bot's inbound number
    (+62 821 3465 159) back to Ari's line (+62 821 3454 721). `settings.SUPPORT_WHATSAPP` and every inbound
    webhook path are untouched. One dead module constant is deleted. No schema, no endpoint, no request/response
    shape changes.
