  - seat: codex-gpt-5.6-sol xhigh (cross-family council seat, dispatched on the diff)
    objection:
      "test_generate.py does not protect the original failure mode: it checks only that the display
      string appears somewhere and that some base64 PNG exists. The renderer could hard-code the wrong number
      into the QR payload and still pass."
    status: CONFIRMED
    resolution:
      "Accepted. This page carries no anchor — it is a print document and the QR IS the link —
      so the test now recomputes `_make_qr_data_uri(CANONICAL_CONTACT['wa_link'])` and asserts that exact
      image is embedded. Guilt-proved by pointing the generator's QR at the bot number: RED."
  - seat: codex-gpt-5.6-sol xhigh (cross-family council seat, dispatched on the diff)
    objection:
      "Consistency is not correctness: change CLIENT_CONTACT_WHATSAPP, the generator digits, the
      JSON and the fixture together to a typo like +62 821 3454 722 and every assertion still passes."
    status: CONFIRMED
    resolution:
      True, and NOT fixed — recorded rather than papered over. There is no oracle inside this
      repo for what Bali Zero's own phone number is; the owner is the oracle. Every guard here can prove
      the surfaces AGREE and that they do not agree with the bot's inbound line. Proving the digits are
      Ari's would need an external attestation this organism does not have. Stated in brief.yml's risks.
  - seat: codex-gpt-5.6-sol xhigh (cross-family council seat, dispatched on the diff)
    objection:
      A third pricing surface could still read settings.SUPPORT_WHATSAPP; the AST guard scans only
      two named files.
    status: PLAUSIBLE
    resolution:
      Accurate as stated and deliberately not widened here. A repo-wide ban on SUPPORT_WHATSAPP
