pii_scan_note:
  No client data anywhere in the diff, brief or pack. The two phone numbers handled throughout
  are Bali Zero's OWN business lines — one the company's Meta-verified inbound WhatsApp Business number,
  the other the staff line the company already publishes on its public price list, its website and its
  brochures. Both are already published by Bali Zero itself; neither is a client's number, and no client
  identifier, message body or OSINT record appears in any receipt.
dissent:
  - seat: claude-sonnet-5 (Explore, dispatched without a conclusion to confirm)
    objection:
      '"generate.py does not use CANONICAL_CONTACT for rendering — it reads `data[''metadata''][''contact'']`
      from the input JSON (generate.py:181, 201) and feeds that same dict to the QR builder. So changing
      CANONICAL_CONTACT alone would not have changed the rendered document; it would have made schema.validate()
      REJECT the fixture and raise SchemaError before any assertion ran."'
    status: CONFIRMED
    resolution:
      '"Accepted. It sharpens rather than breaks the design: the generator reads the JSON, but
      `_validate_or_raise` runs schema.validate() first (generate.py:163-166) and every contact field must
      equal CANONICAL_CONTACT, so a mismatched sheet cannot render at all. That is why the fixture had to
      move in lockstep with the constant, and why the two test assertions are now derived from CANONICAL_CONTACT
      instead of restating literals. The corrected mechanism is written into brief.yml''s consumer_map rather
      than left in my head."'
  - seat: session (M5), self-caught
    objection:
      '"The parametrised guilt tests over STALE_WHATSAPP_NUMBERS cannot prove the list is COMPLETE.
      I mutated the list by deleting the 2026-08-31 number and the suite stayed GREEN — deleting an entry
      deletes its own test case. A guard that iterates over the thing it is guarding is not a guard."'
    status: CONFIRMED
    resolution:
      '"test_every_historically_wrong_number_is_still_listed_as_stale added, pinning both historical
      numbers by literal, and re-mutated: the deletion now goes RED. Recorded here rather than quietly fixed,
      because the same shape — a check derived from the value it checks — is the exact reason the price-list
      tripwire was able to endorse the wrong number for a day."'
  - seat: session (M5), self-caught
    objection:
      '"A ''restored, green'' reading was false: after a mutation cycle the file on disk was correct
      and the suite still reported 6 failures, because __pycache__ held the mutated module (W121)."'
    status: CONFIRMED
    resolution:
      '"Cleared the bytecode, re-ran every mutation with PYTHONDONTWRITEBYTECODE=1 and -p no:cacheprovider,
      and kept the poisoned reading in the receipts instead of deleting it — a mutation receipt whose restore
      step was never trustworthy is not evidence, and pretending the first run was clean would make this
      pack the kind of artefact it exists to prevent."'
  - seat: claude-sonnet-5 (adversarial spalla, dispatched on the diff)
    objection:
      'The fallback guard''s regex is wrong in both directions. Over-match, demonstrated: an IDR
      price literal "18 500 000" is exactly that phone shape and fails the build for nothing. Under-match,
      demonstrated: ''+62 821 3465 159'' in single quotes, "+62 821 " "3465 159" as adjacent literals, and
      "+62.821.3465.159" with dots all return no match — three realistic ways a re-hardcoding walks through
      a green suite.'
    status: CONFIRMED
    resolution:
      Accepted in full and the guard replaced, not patched. It now collapses in-number separators
      per line and looks for the specific forbidden digit runs, so it answers the question actually being
      asked instead of a neighbouring one. All four of the reviewer's inputs are now pinned as test cases.
      Two of its other items (an env-override blind spot that no source-tree test can see, and a dormant
      duplicate-filename risk across the repo's two scripts/ directories) are real, predate this diff and
      are recorded in brief.yml's risks rather than fixed here. Its two UNRESOLVED items — the eleven out-of-scope
      surfaces and the removed WHATSAPP_NUMBER constant — it ran out of turns before reaching; both are
      covered by receipts above, verified by me directly rather than credited to a review that did not happen.
  - seat: codex-gpt-5.6-sol xhigh (cross-family council seat, dispatched on the diff)
    objection:
      "The tripwire file does not parse: an `assert` after `pass  # placeholder` has invalid indentation,
      `forbidden` is undefined, and the next test references an undefined `_FORBIDDEN_DIGIT_RUNS`. Pytest
      fails at collection, so NONE of these tripwires executes."
    status: CONFIRMED
    resolution:
      "True of the snapshot the seat was given, and my own fault: an edit was interrupted by a
      tool-gate mid-repair and the council captured the diff in that state. Repaired and re-run before this
      pack was finalised — 13 passed. Kept on the record rather than dropped as 'stale', because it is
      the sharpest possible reminder that a guard which does not COLLECT is indistinguishable from a guard
      that passes."
  - seat: codex-gpt-5.6-sol xhigh (cross-family council seat, dispatched on the diff)
    objection:
      'The digit-run guard misses obfuscated hard-codes (adjacent literals, `"".join(...)`, f-strings,
      non-breaking spaces), allows ANY unlisted wrong number including a typo of Ari''s own, and even permits
      hard-coding today''s correct number — contradicting its own contract. It also FALSE-FLAGS innocent
      prose: a docstring saying "never use <the bot number> here" fails the build.'
    status: CONFIRMED
    resolution:
      'Accepted in full and the guard replaced a second time, now on the AST rather than on text:
      the value bound to `whatsapp` inside a `fallback_contact` dict must BE the `settings.CLIENT_CONTACT_WHATSAPP`
      attribute — not a constant, not a join, not an f-string. That answers every item at once: no text
      obfuscation can satisfy it, a literal is rejected even when it holds the right number, and prose naming
      a number cannot violate it. Probed: hard-coding Ari''s own number -> RED, `"".join((...))` -> RED,
      a comment naming the bot number -> GREEN.'
  - seat: codex-gpt-5.6-sol xhigh (cross-family council seat, dispatched on the diff)
    objection:
      config.py does not establish a genuine single source of truth. The client number stays separately
      hard-coded in scripts/pricelist_2026/schema.py, scripts/patch_pricing_contact_block.py and visa_oracle_service.py's
      WHATSAPP_BASE_URL. Change it correctly in three places and the other two go stale with every test
      green.
    status: CONFIRMED
    resolution:
      "The most valuable finding in the review: it is this PR's own defect reproduced one layer
      up. The backend cannot import the two `scripts/` modules at runtime, so they cannot share a constant
      — but they can share a test. `test_every_repo_side_copy_of_the_client_number_agrees` now pins all
      five spellings to `settings.CLIENT_CONTACT_WHATSAPP`. Probed: staling the patch script -> RED, staling
      the Visa Oracle deeplink -> RED."
  - seat: codex-gpt-5.6-sol xhigh (cross-family council seat, dispatched on the diff)
    objection:
      "patch_pricing_contact_block.py is idempotent only in the byte-equality sense and mishandles
      a trailer carrying BOTH stale numbers: the first replacement rewrites the prefix and strands the second
      number, and a second pass cannot match. It also rewrites text outside the promised trailer — a `**Notes**:`
      line that merely quotes `**WhatsApp**: <stale>` is edited."
    status: CONFIRMED
    resolution:
      "Both accepted. `rewrite_contact_block` is now line-anchored: it replaces a whole line,
      and only a line that IS the trailer. The both-numbers line comes out fully canonical, the quoting
      Notes line is untouched, and a second pass is a true no-op. Two regression tests added and guilt-proved
      by reverting to the substring form — both go RED."
  - seat: codex-gpt-5.6-sol xhigh (cross-family council seat, dispatched on the diff)
    objection:
      "The diff contradicts itself: comments in the tripwire file, schema.py and brief.yml claim
      every other client-facing surface already uses Ari, while the new PENDING-ARMS row says eleven still
