acceptance:
  A1: >-
    `SafeClock.test.tsx`'s 19 cases pass, GUILT and INNOCENCE controls among
    them. GUILT: `witaCivilDay(new Date("2026-09-07T17:30:00Z"))` is
    "2026-09-08" while the same instant's `toISOString().slice(0,10)` — the
    naive shape this replaces — is "2026-09-07", so dropping the explicit
    timeZone fails the assertion; `formatCivilDay("2026-09-08")` contains
    "8 September 2026" and NOT "7 September"; the four bands map to four
    DIFFERENT rendered class suffixes (`new Set(...).size === 4`), so
    collapsing any two states into one colour reds this; the DOM the component
    produced carries no internal checkpoint name (`/Safe Clock|D-14|D-10|D-7|
    D-3\b|D-1\b/i`) on any branch — the half a source scan cannot see once a
    string is composed. INNOCENCE: WITA and UTC agree for the other sixteen
    hours of the day; an unreadable deadline renders NOTHING rather than a
    number the component invented; `formatCivilDay` passes a string it cannot
    parse through untouched.
    probe: >-
      cd apps/mouth && npx --no-install vitest run
      src/app/visa/voa/SafeClock.test.tsx
  A2: >-
    The whole `visa/voa/` suite stays green — 22 files / 313 tests — including
    `voa-r19.contract.test.ts` (no colour literal anywhere in voa-r19.css,
    comments included; every `var(--x)` it references is declared in
    globals.css) and `voa-copy.guard.test.ts`, whose SCREEN_FILES corpus this
    PR extends with `SafeClock.tsx` in the same change that creates it, so the
    banned-claims list, the Safe Clock leak rule, the Bahasa term set, the
    no-emoji rule and the no-price-literal rule all bind the new file from its
    first commit rather than from a follow-up.
    probe: cd apps/mouth && npx --no-install vitest run src/app/visa/voa
  A3: >-
    `tsc --noEmit` exits 0 and `eslint` reports zero errors and zero warnings
    on the two new files — the three `react/no-unescaped-entities` warnings the
    first draft produced are fixed in the copy, not suppressed.
    probe: >-
      cd apps/mouth && npx --no-install tsc --noEmit && npx --no-install eslint
      src/app/visa/voa/SafeClock.tsx src/app/visa/voa/SafeClock.test.tsx
  A4: >-
    PROVE-LIVE, after the merge lands STAGED on mouth and `vercel promote
    <dpl>` runs: an ACCEPT screen reached from a SYNTHETIC wizard walk on
    balizero.com renders the day count as the first element of the page, with
    the office named and the day in full — not the ISO string it renders today.
    A merged diff is not a live one; this row is not signed until that
    observation exists.
    probe: >-
      curl -s https://balizero.com/visa/voa/<synthetic-hash> and a 390px
      browser screenshot of the ACCEPT screen

