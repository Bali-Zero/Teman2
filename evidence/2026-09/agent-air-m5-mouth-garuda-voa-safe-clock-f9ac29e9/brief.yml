task: >-
  GARUDA VOA FRONT B (design), slice 1 of the TIME accent: the published filing
  deadline — the ONE date this product may show a client — was a clause inside
  an AppFrame subtitle rendered as a raw ISO string ("File by 2026-09-08 at
  Ngurah Rai — the counter's published deadline",
  `visa/voa/[hash]/page.tsx:286` on origin/main). This PR makes it the hero of
  the ACCEPT screen. New `SafeClock.tsx` (logic + view) computes the count in
  Asia/Makassar CIVIL days via `Intl` with an explicit timeZone, which is the
  defect `openapi.yaml` writes down for clients in the
  `published_filing_deadline` description ("a client that derives this from a
  local `Date` in another zone reintroduces it here" — the server-side guard is
  `civil_clock.py::garuda_today`), and formats the date with `timeZone: "UTC"`
  because `@balizero/core/utils`'s shared `formatDate` renders a date-only ISO
  in the runtime's zone and would slide Bali's 8 September to 7 September for
  every visitor west of Greenwich. Four states carry four distinct visual
  identities (mandate accent 4, "never two states in one colour"): the number
  keeps `--bz-data` throughout — that token's declared job in globals.css is
  dates and prices at 11.60:1 — while the left rule and the word change,
  `--state-info` / `--state-warning` / `--bz-status-mark`. `--state-danger` is
  deliberately NOT one of them: on this theme it resolves to the same #c46a52
  as `--bz-copper-text`, and copper on this surface means ownership, not
  status. `--bz-status-mark` is used strictly inside its own globals.css
  contract (non-text, a rule never a fill, never text, one per viewport) and
  renders only in the `today` state, which is exclusive with the other three,
  so the one-per-viewport clause holds by construction. A deadline already
  passed renders NO countdown — it is not "zero days left", it is a different
  situation, and the same doctrine already governs the overstay branch of
  `/visa/clock/[hash]`, reused rather than re-decided; it states no consequence
  of its own and hands over to a person. The office is named on every branch
  that shows a date, which is the contract's own precondition for showing it at
  all ("a surface may display this date only when the filing office is known to
  be Ngurah Rai; otherwise it suppresses the date and routes to WhatsApp")
  while the intake still collects no office.
