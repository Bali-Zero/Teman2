brief_ref: evidence/brief.yml
plan_ref:
  "PR 5851 (agent/air-m5/mouth/oracle-activity-boundary-narrowing) - PR-4 of the Visa Oracle decisiveness
  wave. Spec: research/visa/2026-09-06-visa-oracle-decisiveness-investigation.md section 4 PR-4 and section
  6 R3. Wave order: 5862 -> PR-1 5854 -> sign+ceremony -> 5867 -> PR-2 5853 -> PR-3 5855 -> PR-4."
lanes:
  - lane: oracle-activity-boundary-narrowing
    role: build
    seat:
      "claude-opus-5 - authored the original narrowing before PR 5855 landed AND resolved the merge
      with it. Declared as ONE build lane because it is one seat: splitting it into two would misread as
      breadth that does not exist."
  - lane: oracle-provelive
    role: review
    seat:
      frontend-browser subagent (claude-sonnet-5) - independent production measurement of the walk corpus;
      it REFUSED the browser prove-live it could not perform rather than fabricating 12 outcomes, and it
      corrected the session on the no_path_reasons field name (see dissent[1])
  - lane: oracle-activity-boundary-refute
    role: review
    seat:
      spalla-review subagent (claude-sonnet-5) - dispatched adversarially on the finished merge and
      told to demolish the three judgement calls, precisely because the session that made them is also the
      gate
seat_diversity: not_applicable
seat_diversity_note:
  "All lanes are Anthropic seats. Declared rather than left to read as satisfied: every
  load-bearing claim here is settled by a test exit code or by a POST against the live production engine,
  not by an opinion. The one genuine judgement - whether secondhome_basis=property is decidable - was
  deliberately converted into a measurement against production rather than argued (receipt 2)."
diff:
  net_lines:
    "Deliberately NOT narrated as a count. The pack is itself part of the diff and origin/main
    moves underneath it, so any number written here is stale the moment it is written - the countable-claims
    rule rejected three successive attempts, each correctly. Authoritative count: git diff --numstat $(git
    merge-base origin/main HEAD)..HEAD. Shape instead: activity-boundary.test.ts is new, fact-mapper.ts
    carries the narrowed decision table, fact-mapper.test.ts its guilt and innocence pairs, i18n.ts a
    few lines, plus this brief and pack. Zero backend, zero workflow, zero signed pack."
  behaviour_change:
    The ACTIVITY_BOUNDARY disclosed-review flag stops being raised for business_activity=meetings,
    for work_role (already gone from the flow) and for two question ids that exist nowhere in tree.ts.
    Because a disclosed flag is terminal backend-side - evaluate_path.py::_apply_disclosed_review_flags
    rewrites the decision to HUMAN_REVIEW_REQUIRED with candidates=() - each removed clause stops DELETING
    a product the signed pack had already proven. No fact value changes; only whether a hold is attached.
