    ts: 2026-09-07T14:05Z
    seat: session (M5, live production endpoint)
  - claim:
      The six re-anchored walk-census rows were MOVED to the live question sequence, not weakened -
      each row still drives the REAL flowReducer, which is what made them fail in the first place
    cmd:
      drove flowReducer from initialFlowState(en) through each category with a temporary probe test,
      dumped the exact question order, then edited each branch to match; probe deleted before commit
    result:
      "work: work_role gone. remote: work_payer inserted after remote_compensation. invest: family_sponsor_confirmed
      plus wants_onshore_conversion inserted. other: family_sponsor_confirmed inserted. diaspora: the single
      dead-end walk became sponsor_category -> family_relation -> marital_status -> family_sponsor_nationalities
      -> family_marriage_registered -> family_sponsor_confirmed. No row's expected flags field was changed."
    exit: 0
    ts: 2026-09-08T00:14Z
    seat: session (M5)
  - claim: The full visa-oracle suite is green after the merge, including the file that would not load
    cmd: cd apps/mouth && npx vitest run "src/app/(visa-oracle)/visa-oracle/"
    result:
      39 test files passed, 676 tests passed, 0 failed. Before the re-anchoring the same command gave
      7 failures (6 walk-census rows plus the secondhome_basis classification guard).
    exit: 0
    ts: 2026-09-08T00:19Z
    seat: session (M5)
  - claim:
      The walk-corpus-determinism.test.ts load failure was environmental, not caused by this merge
