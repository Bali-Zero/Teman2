      POST https://nuzantara-rag.fly.dev/api/visa-oracle/evaluate?traffic_source=real with the offshore_second_home_property
      walk's 45-fact overrides taken verbatim from origin/main
    result:
      state=SUPPORTED_CANDIDATES, candidates=[E33], no_path_reasons=[]. Classifying property as undecidable
      would rewrite this to HUMAN_REVIEW_REQUIRED with zero candidates - the exact failure PR-4 exists to
      stop. offshore/second_home/bank_deposit and onshore/second_home also return [E33].
    exit: 0
    ts: 2026-09-07T14:05Z
    seat: session (M5, live production endpoint)
  - claim:
