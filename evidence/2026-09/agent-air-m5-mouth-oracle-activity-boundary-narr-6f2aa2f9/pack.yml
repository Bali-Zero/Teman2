pii_scan: clean
pii_scan_note:
  Nothing in this diff, brief or pack transcribes applicant data. Every walk is synthetic
  and comes from the repo's own gold_coverage/fixtures/walks/ corpus; the production POSTs used those
  same synthetic fact sets and no request body is reproduced here. The receipts quote decision states,
  product codes and reason codes only.
dissent:
  - seat: session (declared conflict of interest, owner-authorised)
    objection:
      "Generator is never grader, in either direction - yet this session both AUTHORED the merge
      resolution (a genuine semantic decision, not a mechanical rebase: it deletes an assertion main deliberately
      pinned) and is the gate that signs it off. The external builder seat that wrote the original narrowing
      did not review this resolution."
    status: CONFIRMED
    resolution:
      "Declared instead of hidden, and partially mitigated. The session raised the conflict to
      the owner BEFORE resolving anything and the owner answered 'risolvi tu PR-4 e vai avanti' (2026-09-07)
      - an explicit, informed override, recorded here so a later reader sees the exemption rather than assuming
      the norm held. Two mitigations were actually applied: the one judgement call was converted into a
      production measurement (receipt 2), and an adversarial spalla-review seat was dispatched on the finished
      merge with instructions to demolish all three judgement calls."
  - seat: frontend-browser subagent (claude-sonnet-5, independent measurement lane)
    objection:
      "The session instructed the lane to read no_path_reason_codes from the HTTP response. That
      key does not exist at that level: the live OpenAPI schema and all 12 real responses carry no_path_reasons,
      a list of objects with a code field. no_path_reason_codes exists only inside gold_replay.py and gold_replay_driver.py
      as a derived key for fixture comparison. A tool reading the session's name against a real payload
      gets None and concludes 'no reasons' when reasons are present."
    status: CONFIRMED
    resolution:
      "Accepted in full and verified independently by the session against the raw response JSON
      before being propagated. The session's instruction was wrong: it had generalised a correction true
      of the internal decision dict to the HTTP boundary, where it is false. Both spellings are real in
      their own layer; the trap is symmetric, which is why it is recorded rather than silently fixed."
  - seat: session (declared limit, unresolved)
    objection:
      "No browser prove-live exists for this wave. No browser tool is mounted in this fleet session
      or in the subagent, so nothing here observes the RENDERED page: layout, translated copy, and above
      all whether duplicate reason PARAGRAPHS appear on screen. Reason-code duplication is measured as zero
      in the raw engine payloads (61/61 walks, every list); the rendered text is not measured at all."
    status: PLAUSIBLE
    resolution:
      Left standing and labelled rather than quietly counted as covered. It does not affect this
      PR, whose consumer is the flag table and whose acceptance is a test suite. It does mean the wave's
      claim about what a real applicant SEES rests on the engine payload plus the served bundle, never on
      the screen.
  - seat: session (self-refutation mid-merge)
    objection:
      "The first production measurement of this wave reported 5 NEEDS_INPUT and was about to be
      read as the post-5855 state. It was the PRE-5855 state: the probe read walk fixtures from a worktree
      pinned before 5855, where family.sponsor_confirmed and process.wants_onshore_conversion are UNKNOWN/NOT_ASKED
      - precisely the two facts 5855 makes the interview ask."
    status: CONFIRMED
    resolution:
      "Caught by noticing that the fixture at origin/main carries status KNOWN value true for
      a fact production claimed was missing, then re-run against origin/main fixtures: the three investment
      walks move NEEDS_INPUT to SUPPORTED_CANDIDATES [C2]. Rule adopted for the rest of the run: read a
      corpus with git show origin/main:<path>, never from whatever a worktree happens to be pinned at."
seat_override:
  "R8 ground-truth lane declined with reason, not skipped. The rule fires because the diff
  touches a mouth visa-oracle path, but this diff asserts NO fact about Indonesian immigration law: it
  changes only whether a UI review-hold is attached to an answer. Every substantive claim in this pack
  is grounded in the SIGNED rule pack running in production (seq-20, payload_sha256 df02287b...) and measured
  by POST against the live engine - a stronger authority for this question than any notebook, and the
  artifact the law is actually compiled into here. No NotebookLM query was run, so no nb/query_hash is
  fabricated to satisfy the shape."
spend:
  wall_clock_hours: 2
