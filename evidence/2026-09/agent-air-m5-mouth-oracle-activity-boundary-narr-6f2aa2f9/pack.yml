      compiles the D2 local-compensation prohibition) is SATISFIED - the prohibition is enforced by the
      signed pack now, so the flag is redundant rather than load-bearing
    cmd: same endpoint, the offshore_business and onshore_business walks from origin/main
    result:
      Both return NO_SUPPORTED_PATH carrying BUSINESS_LOCAL_COMPENSATION_NOT_ALLOWED. Rule-pack seq-20
      (payload_sha256 df02287b7fc8f572a9e6674fdf3445a2131c428e8a1492ab8a388dee5bf01a4d) was signed and activated
