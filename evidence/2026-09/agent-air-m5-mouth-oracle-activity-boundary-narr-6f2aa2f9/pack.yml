      Deterministic gear floor recomputed from THIS PR's post-merge changed-file list is 2, not the
      1 the PR body claimed pre-merge - the declared gear was raised to match rather than trimming comments
      to fit under the threshold
    cmd:
      git diff --numstat origin/main...HEAD > /tmp/pr4.numstat && git diff --name-only origin/main...HEAD
      > /tmp/pr4.files && python3 scripts/evidence_pack_lint.py --print-floor --numstat-file /tmp/pr4.numstat
      --changed-files-file /tmp/pr4.files
    result: 2 (churn 443, over SIZE_GEAR2_THRESHOLD=400; SIZE_GEAR3_THRESHOLD=1828 is far away)
    exit: 0
    ts: 2026-09-08T00:20Z
    seat: session (M5)
  - claim:
      THE CENTRAL RECEIPT - secondhome_basis is filed EXEMPT because production PROVES holding it would
      delete a candidate, not because the session judged it engine-inert
