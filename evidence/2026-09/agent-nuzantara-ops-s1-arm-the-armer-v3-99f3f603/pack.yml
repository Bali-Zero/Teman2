outcome: >-
  The re-armer reads its candidates again — the first successful candidate read since 2026-08-28
  (dry-run, live GitHub, 17:25Z): examined=44 candidates=3 unknown=0, #5746 CODE, #5838/#6054
  NEVER_QUEUED. A failed or wrong-shaped read is CANNOT-VERIFY (exit 2, heartbeat error, one
