  - "scripts/queue_unstick.py and scripts/queue_stall_notify.py already report CANNOT-VERIFY with examined counts (exit 4 and exit 1), so the S1 disease is absent there; neither writes an organism heartbeat on Mini, so their failures live only in the cron logs."
  - "scripts/queue_ejection_attribution.py correlates a removal with ANY-infra across the attempt's runs; the shepherd now uses ALL (CODE wins) because it makes a re-arm decision. The divergence is deliberate and documented in fetch_infra_hint_and_fingerprint."
