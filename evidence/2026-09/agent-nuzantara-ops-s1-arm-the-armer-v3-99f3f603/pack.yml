  - id: R1-B2
    severity: BLOCKER
    disposition: accepted
    finding: "unreadable per-PR timeline / janitor recheck ended exit 0, heartbeat ok"
  - id: R1-B3
    severity: BLOCKER
    disposition: accepted
    finding: "same-cause counting lost events (history cap, None never upgraded, cancelled-only jobs unfingerprinted)"
  - id: R1-B4
    severity: BLOCKER
    disposition: accepted
    finding: "--dry-run wrote the heartbeat and opened the log file"
  - id: R1-M1
    severity: MEDIUM
    disposition: accepted
    finding: "N UNKNOWN candidates sent N P0s"
  - id: R2-B1
    severity: BLOCKER
    disposition: "accepted as a spec'd rework (letter H), not a fix-of-a-fix"
    finding: "a well-formed but wrong-shaped jobs body {} still became jobs=[] -> INFRA"
  - id: R2-M1
    severity: MEDIUM
    disposition: "accepted (letter I)"
    finding: "correlation read only the latest 20 merge_group runs and picked one arbitrary run among ties"
  - id: R2-M2
    severity: MEDIUM
    disposition: "accepted (letter H3)"
    finding: "candidate-page shape validation outside the retry; malformed page -> raw KeyError, no stable alert"
  - id: K-1
    severity: BLOCKER
    disposition: "accepted, cured differently (spec letter J1): the attempt is re-read by head_sha with a total_count<=len guard; the reviewer's own fix (total_count on the created<= read) would CANNOT-VERIFY every tick, because that total is the repository's whole history (64681, measured 17:57Z)"
    finding: "the unpaginated 100-run first page can cut the ejecting attempt's cluster, drop the real failure run and let a cancelled sibling read INFRA -> a CODE failure re-armed on a read that reports success"
  - id: K-2
    severity: MEDIUM
    disposition: "accepted (spec letter J2): jobs per_page=100 with a total_count<=len guard"
    finding: "jobs?per_page=50 unpaginated, no total_count check; a >50-job matrix run can hide the real failing job"
  - id: K-3
    severity: MEDIUM
    disposition: "deferred to a ledger row: a failing re-arm WRITE is a different surface from S1's reads; pre-existing on main"
    finding: "a persistently failing gh pr merge --auto ends exit 0 / heartbeat ok, retried silently every tick"
  - id: K-4
    severity: MEDIUM
    disposition: "declined on evidence: git/matching-refs ignores per_page and page and returns every matching ref on every call (157 for heads/agent on pages 1-3, measured 17:57Z), so the janitor's set is complete, not partial"
    finding: "fetch_live_queue_branches' page safety bound could proceed on a partial set and cancel live runs"
  - id: K-5
    severity: MEDIUM
    disposition: "deferred to a ledger row: the job-name heuristic is shared by declared design with queue_ejection_attribution.py; re-arms stay capped by the INFRA budget and now by same-cause suspension"
    finding: "INFRA_JOB_NAME_SIGNATURES are bare substrings (cache, checkout, docker, runner) and can misread a real code failure as INFRA"
  - id: K-6
    severity: LOW
    disposition: "accepted (spec letter J3): test Ie made revert-visible"
    finding: "tests Ic and Ie pass verbatim against the pre-round-2 code"
  - id: K-7
    severity: LOW
    disposition: "deferred to a ledger row: these fail loud (heartbeat error, non-zero exit) but without the Telegram"
    finding: "malformed-but-JSON data (a node missing number, a hand-edited red-file key) escapes as raw exceptions, not CANNOT-VERIFY"
  - id: K-8
    severity: LOW
    disposition: "deferred to a ledger row; pre-existing on main"
    finding: "alerted_state is never garbage-collected"
