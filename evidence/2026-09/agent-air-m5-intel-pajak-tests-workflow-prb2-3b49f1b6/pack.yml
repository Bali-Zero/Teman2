machine: M5
bites:
  consumer:
    the new `pajak-monitor tests` check (.github/workflows/pajak-monitor-tests.yml), which runs
    scripts/tests/test_pajak_parse.py and scripts/tests/test_pajak_monitor.py on every PR touching
