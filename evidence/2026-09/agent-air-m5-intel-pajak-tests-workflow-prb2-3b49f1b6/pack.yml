bites_note:
  "Successor of #7117 (closed): same commits cherry-picked onto an origin/main that contains the
  observer, because a reopen does not refresh pull_request.base.sha and #7117's head was frozen.
  Commit shas cited below are this branch's. The observer runs exactly what the workflow runs, and the check on this PR's head is the same
  command in CI. Green is the weak half. The strong half was observed before this pack was written:
  on draft PR #7116 (this workflow plus the deadline branch replaced by `if False:`), the same
  check went red on exactly test_c1_deadline_is_checked_before_every_fetch_not_after
  (run 35696446818, `1 failed, 37 passed`). #7116 is closed and its branch deleted after that
  observation; it was never armed."
