      expected = ['BRIDGING_FROM_VISIT_ITK_PROHIBITED', 'BRIDGING_ONSHORE_ONLY', 'BRIDGING_TO_BRIDGING_PROHIBITED', 'VOA_NATIONALITY_ONLY']
      assert hits == expected, hits
      print('OK', hits)
      "
