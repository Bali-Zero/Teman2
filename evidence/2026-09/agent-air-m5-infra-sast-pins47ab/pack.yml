brief_ref: evidence/brief.yml
council_run: council/journal.jsonl

lanes:
  - lane: sast-pins-build
    role: build
    seat: >-
      Claude Sonnet 5 (session actions-pins). Cherry-picked dependabot's upstream
      sonarqube-scan-action commit (d159c7a920) and sbom-action commit (22fecf7ad8)
      verbatim from PRs #5529/#5528 onto a fresh worktree off origin/main, then
      reset-soft and re-committed as a single change touching only
      .github/workflows/sbom.yml and .github/workflows/sonarqube.yml. (Numbers about
      this branch's own commit count are deliberately not narrated here — see the
      receipt below, computed fresh at lint time via `git rev-list --count`, since a
      frozen figure in this field would drift with every later commit added to this
      same evidence pack.)
  - lane: sast-pins-review-codex
    role: review
    seat: >-
      codex-gpt-5.6-sol (titolare), dispatched read-only (`codex exec --sandbox
      read-only -m gpt-5.6-sol -c model_reasoning_effort=xhigh`) with the diff and
      the SHA-provenance claims embedded in the prompt. Verdict recorded in
      council/journal.jsonl; full transcript council/codex-gpt-5.6-sol.txt.
  - lane: sast-pins-review-kimi
    role: review
    seat: >-
      kimi-code/k3 (titolare), dispatched via `kimi -p`. Returned HTTP 403
      insufficient_quota ("monthly usage limit") immediately — a NON-JUDGEMENT, not
      counted, recorded in council/journal.jsonl rather than silently dropped.
  - lane: sast-pins-review-tp1
    role: review
    seat: >-
      tp1-qwen3.8-max (titolare), dispatched directly against the sanctioned
      TP1/Bailian door (same request shape as
      scripts/arsenal_probe.py::probe_tp1_model, credential loaded from
      ~/.qwen/settings.json — no paid per-token API installed). Returned HTTP 429
      insufficient_quota ("token-plan 1-week quota exhausted, resets 09-18
      08:39:00 UTC") — the whole TP1 door, shared across all 7 TP1 seats, not just
      this model. NON-JUDGEMENT, not counted, recorded in council/journal.jsonl.
  - lane: sast-pins-review-agy
    role: review
    seat: >-
      agy-gemini-3.1-pro (RESERVE), seated after both other titolari above returned
      quota-exhaustion errors before producing any judgement. Dispatched via
      `agy -p ... --model gemini-3.1-pro-high` (free OAuth CLI under the AI/Flow
      subscription, never a metered API). Verdict recorded in
      council/journal.jsonl; because a reserve is counted, this pack carries
      `seat_fallback_reason` below.

seat_diversity: satisfied
seat_diversity_note: >-
  ONE build lane; D3's non-Anthropic build-seat requirement does not bind by its
  own terms (">= 2 build lanes"). Cross-family pressure sits on REVIEW instead:
  codex (OpenAI family) and agy (Google family) are both non-Anthropic, and
  between them they are the only two seats, of four dispatched, that produced a
  judgement on this diff.

diff:
  files: 2
  net_lines: 3
  measured_at: >-
    `git diff --numstat $(git merge-base origin/main HEAD)...HEAD -- .github/workflows/sbom.yml
    .github/workflows/sonarqube.yml` (three-dot, merge-base f1fbf388098315a56c16ccae17676e97e4d26ea8)
    at 2026-09-13T14:38:07Z, restricted to the two changed workflow files only: sbom.yml
    has two inserted and two deleted lines, sonarqube.yml has one inserted and one
    deleted line — three SHA/comment substitutions total across those two files, no
    other lines touched there. This is NOT the whole-branch numstat the harness-floor
    countable-claims rule computes (which also counts every line this evidence pack
    itself adds, e.g. this pack.yml and the council transcripts) — that whole-branch
    figure is deliberately not asserted here as a frozen number, since it grows with
    every later commit to this same pack; reproduce it fresh with
    `git diff --numstat $(git merge-base origin/main HEAD)..HEAD` over the WHOLE
    branch (two-dot, no path filter) at read time, per the receipt below.

seat_fallback_reason: >-
  Both other titolari were dispatched and returned real, observed quota-exhaustion
  errors before either produced a judgement — not assumed, not inferred from
  silence. kimi-code/k3: HTTP 403 insufficient_quota, "You've reached your monthly
  usage limit for this billing cycle" (2026-09-13T13:56Z, `kimi -p` stderr,
  `kimi version 0.41.0`). tp1-qwen3.8-max: HTTP 429 insufficient_quota, "Your
  token-plan 1-week quota has been exhausted. The quota will reset at 09-18
  08:39:00 UTC" (2026-09-13T13:57Z, direct call to the TP1 chat-completions
  endpoint with the same request shape scripts/arsenal_probe.py::probe_tp1_model
  uses). Because the TP1 quota is shared across all seven TP1 seats
  (scripts/arsenal_probe.py's TP1_SEAT_MODELS), that single 429 also rules out
  every TP1-hosted reserve (tp1-deepseek-v4-pro, tp1-glm-5.2) for the same window
  — agy-gemini-3.1-pro was the only reserve on a distinct door. codex-gpt-5.6-sol
  (titolare) ran successfully and is the first counted seat; agy-gemini-3.1-pro
  (reserve) is the second, replacing kimi-code/k3 and tp1-qwen3.8-max jointly.

residual_risks:
  - >-
    AGY'S REVIEW IS TEXT-ONLY. Unlike codex-gpt-5.6-sol, which ran live network
    lookups against both upstream repositories (git tags, commits, action.yml
    manifests) via `codex exec --sandbox read-only`, agy-gemini-3.1-pro's dispatch
    explicitly asked it NOT to run shell commands (its default `--sandbox` mode
    could not obtain command-execution permission in headless print mode and
    auto-denied, so the retry ran text-only rather than reaching for
    `--dangerously-skip-permissions`, which this session will not use). Its PASS
    verdict is therefore a consistency read of the diff and the claims already
    verified by codex, not an independent second confirmation of the upstream
    SHAs. The upstream SHA-to-tag/branch match is independently established by
    this pack's own receipts (gh api calls run directly by the build seat) and by
    codex's live verification — agy's verdict adds a second READING of the same
    diff, not a second INDEPENDENT measurement of the upstream refs.
  - >-
    THE TP1 DOOR OUTAGE IS SYSTEMIC AND TIME-BOUNDED, NOT DIFF-SPECIFIC. The 429
    affects every TP1-hosted seat (one titolare, two reserves) until
    2026-09-18T08:39Z per the door's own error message; any other Gear-3 PR
    dispatched in this window inherits the same reduced bench (effectively
    codex + agy only, since kimi is also down on an unrelated monthly quota with
    no stated reset). This is the same "a single quota reset can take the quorum
    to zero" shape the roster split (PR #5569) was ruled to fix, and it held here:
    the six-seat roster still produced a valid 2-seat quorum on two of six seats
    reachable. Declared, not cured — a door-diversity fix is out of scope for a
    two-line CI pin bump.

