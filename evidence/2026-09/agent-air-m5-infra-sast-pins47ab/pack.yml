dissent:
  - seat: Claude Sonnet 5 (self-refutation, on the council substitution)
    status: CONFIRMED
    objection: >-
      Two of three titolari (kimi-code/k3, tp1-qwen3.8-max) were unreachable
      by quota, not by transient timeout — so this pack cannot claim they were
      merely slow. Verified by reading each door's own error body rather than
      inferring from a timeout: kimi's stderr states a monthly billing-cycle
      limit; TP1's JSON body states a 1-week quota with an exact reset
      timestamp. Recorded honestly as NON-JUDGEMENT lines in the journal
      instead of omitting the two dead titolari and presenting only the two
      that answered.
    cure: >-
      Not cured — a quota reset is outside this session's control. Reported
      to team-lead before proceeding, per instruction; team-lead directed use
      of the widened six-seat roster (PR #5569, merged into this branch) and
      the agy-gemini-3.1-pro reserve door specifically.
  - seat: codex-gpt-5.6-sol, on the diff itself
    status: RETRACTED
    objection: >-
      Considered whether the intermediate sbom-action tag v0.24.1's Syft bump
      (v1.42.3 -> v1.51.1) constitutes an undisclosed breaking change, since the
      workflow does not pin `syft-version`. Retracted after checking both
      action.yml manifests directly: identical inputs, defaults, runtime
      (node24), entrypoint, and no declared outputs between v0.24.0 and
      v0.24.2; Syft's own v1.51.1 changelog carries fixes and additions, no
      documented breaking change to the SBOM output formats this workflow
      requests (spdx-json, cyclonedx-json). Verdict: PASS, with the Syft-bump
      note kept as a LOW finding for the record rather than a defeating input.
  - seat: agy-gemini-3.1-pro, on the diff itself
    status: RETRACTED
    objection: >-
      Considered whether the trailing-comment change on the Anchore lines
      ("# v0" -> "# v0.24.2") signals a semver-range widening that could later
      auto-track newer minors unexpectedly. Retracted: the `uses:` value is a
      full 40-character commit SHA, not a floating tag or branch reference —
      the trailing comment is documentation only and carries no resolution
      behavior; the pin is exactly as immutable after this diff as before it.
      Verdict: PASS, no defeating input.
