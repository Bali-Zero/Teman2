    ts: "2026-09-14T14:19:00Z"
    seat: claude-opus-5
  - claim: The redirect is narrowed WITHOUT breaking the flow that actually sends people here.
    cmd: >-
      grep every producer of ?redirect= in apps/mouth; read (workspace)/layout.tsx:231 and
      proxy.ts:95; npx vitest --run src/app/login
      Probe: npx vitest --run src/app/login
    result: >-
      Three producers. ModeSwitcher.tsx:37 sends a PATH ("/login?redirect=/prime").
      (workspace)/layout.tsx:231 sends encodeURIComponent(window.location.href) — an ABSOLUTE URL —
