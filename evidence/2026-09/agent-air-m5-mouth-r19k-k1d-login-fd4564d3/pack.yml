dissent:
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — page.tsx exports sameOriginPath and stageForError; a Next.js page module may not, and
      `tsc --noEmit --incremental false` fails TS2344 against the generated route types.
    status: CONFIRMED
    disposition: >-
      True, and it would have gone red in CI rather than here: the plain `tsc --noEmit` I ran was
      green only because its build info predated the route types my own dev run regenerated. Both
      helpers and LoginStage moved to ./contract; the strict typecheck is now green and is an
      acceptance probe.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — refusing absolute return URLs breaks the workspace login flow, which produces them.
    status: CONFIRMED
    disposition: >-
      The defect is real; the suggested cure ("restore the original contract, harden separately") is
      not taken, because the original contract IS the open redirect. Cured with a first-party
      allowlist instead, which keeps the flow and closes the hole. Receipt above names the three
      producers.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — every non-401/403 becomes "service unreachable", but the endpoint returns 400/422 for
      invalid input.
    status: CONFIRMED
    disposition: >-
      True, and measured in identity/router.py:78-92. The split is now 4xx (except 408/429) versus
      5xx and network, and the denied copy says "were not accepted" so it is true of a format error.
  - seat: codex gpt-5.6
    objection: >-
      WARN — location.replace unloads before the success plate can paint; the test passes only
      because navigation is mocked. Restore the delay or remove the plate.
    status: CONFIRMED
    disposition: >-
      Measured rather than argued: against a destination held for 4s, the plate never appears. The
      plate is removed. The 1500ms delay is NOT restored — paying a staff member 1.5s to read a
      sentence is the theatre this PR exists to delete.
  - seat: codex gpt-5.6
    objection: >-
      BLOCK — findReds misses #f00, rgb(...) and bg-red-500, and falsely bans var(--state-danger),
