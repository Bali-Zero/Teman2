task: >-
  PR2b of the /dynamic-workflow coach-protocol build (MANDATE-builder.md, owner ruling Zero
  2026-09-18), following PR1a (#6753), PR1b (#6756) and PR2a (#6757). This PR carries three
  commits: two team-lead REWORK-BUILD gate verdicts on already-merged code, each its own
  depth-1 commit named to the verdict (Agent PR Contract §1), plus the `jury` subcommand.
  Verdict 1 (on PR1b, 8ffb9bc278): `r1`'s convener-mtime clause was recorded into the ledger
  but never compared — fixed by refusing (exit 2, no launch, no new ledger row) when the
  convener file's mtime is later than either the earliest `sent` row or its own prior ledger
  row, both floored to whole seconds to match the ledger's own strftime precision. Verdict 2
  (on PR2a, 4c062d2e09): `r2` pairing treated an unrecognised seat's family (None) as a real
  family, silently pairing it within its own vendor — fixed with a shared
  `_require_known_family` fail-closed helper (reused by jury) plus a `_SEAT_ALIASES` table
  resolving the mandate's own short seat spellings. `jury --kit K` is new: every judge.md
  survivor blind-reviews the OTHER survivors (never its own answer) as anonymised letters
  A-F via a persisted `jury/mapping.json` (chmod 600), six 1-5 integer axes per formation, a
  malformed/partial table going dead rather than partial-credit, and Borda + firsts tabulated
  BY THE SCRIPT into `jury/tabulation.md` with per-axis disagreements named. This closes PR2b
  at ~460 net lines (two verdict fixes + jury); `anonymise`/`reveal`/`capture-check` move to
  PR2c per team-lead's own pre-authorized split for a PR this size.
lane: infra/dynamic-workflow-2b
machine: M5
