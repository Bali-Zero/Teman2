  - lane: workflows-tests-ci-build
    role: build
    seat: >-
      claude-opus-5 (the mission's Dux and release owner — wrote the workflow, ran every step of the
      job locally before opening, and disposed of the refuter's findings)
  - lane: workflows-tests-ci-refute
    role: review
    seat: >-
      gemini-3.8-flash-low via agy (CROSS-FAMILY adversarial reviewer, dispatched with the workflow
