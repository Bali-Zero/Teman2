      applied, 1 refuted by the repo itself, 4 accepted as declared scope; see dissent)
  - lane: workflows-tests-ci-gate
    role: review
    seat: >-
      a FRESH claude-opus-5 xhigh session outside the contribution chain, per army-map.md §1 — it
      signs and never arms or alters the candidate
pii_scan: clean
seat_override: >-
  THE GEAR-3 COUNCIL QUORUM COULD NOT BE CONVENED TODAY, and this is measured rather than claimed.
  All three seats in COUNCIL_REVIEW_SEATS are dead on M5 at 2026-09-15T18:20Z, each probed THIS
  session: codex-gpt-5.6-sol — `codex exec` returns "Your access token could not be refreshed
  because your refresh token was already used", and `codex login` is a human credential action
  pending with Zero; kimi-code/k3 — `scripts/arsenal_probe.py --seats kimi` returns QUOTA_DEAD;
  tp1-qwen3.8-max — `scripts/arsenal_probe.py --seats tp1-qwen3.8-max` returns QUOTA_DEAD, HTTP 429,
  "1-week quota has been exhausted, will reset at 09-18 08:39 UTC". Two of three are quota, one is a
  credential Zero holds; none is a matter of effort or patience inside this mission's window.
  WHAT WAS DONE INSTEAD, so the override buys a real review and not a waiver: a cross-family
  adversarial refuter (gemini-3.8-flash-low via agy, Google family against an Anthropic builder —
  the W100 pairing) was dispatched against the workflow text and told to refute it. It returned
  seven findings; two were accepted and APPLIED to the file before this pack was written (the
  unscoped cancel-in-progress that would have left commits on main unverified, and the fail-fast
  loop that hid all but the first broken suite), one was refuted by the repository itself, and four
  are recorded as declared scope. All seven are in `dissent` below with their disposition. A fresh
  Opus 5 xhigh session outside the contribution chain then signs the final on-disk gate, unchanged.
  WHAT WOULD REMOVE THIS OVERRIDE: `codex login` on M5, or the TP1 quota reset on 2026-09-18. If
  either lands before this PR merges, the council should be convened and this field deleted.
pii_scan_note: >-
  No client PII and no OSINT anywhere in this diff. The workflow file carries only action names,
  paths and shell; the brief and this pack name model seats, commands and repository paths. The one
  artefact referenced by path — the D5 run report — describes a restamp of published articles and
  carries no client data.
seat_diversity: satisfied
seat_diversity_note: >-
  "The refuter is Google-family against an Anthropic builder, which is the W100 pairing this repo
  requires. Codex (OpenAI) was NOT available: `codex exec` on M5 returns 'Your access token could
  not be refreshed because your refresh token was already used', and `codex login` is a human
  credential action pending with Zero. That is declared, not worked around — the refuter chair was
  filled by the next live cross-family seat rather than left empty or quietly skipped."
diff:
  net_lines: >-
    3 files, +361/-0 measured by `git diff --numstat` against the merge base. One new
    .github/workflows/ file, plus this pack and its brief. Zero source code, zero application
    behaviour, zero data.
  behaviour_change: >-
    A new GitHub Actions job runs on any PR touching infra/workflows/. It executes every
    *-contract*.mjs in infra/workflows/tests/, the behavioural runner suite, and a --dry-run boot
    of the standalone runner. Nothing in the repository's runtime changes. The job is NOT added to
    branch-protection required_status_checks by this PR, so its first effect is advisory.
receipts:
  - claim: >-
      Deterministic gear floor recomputed from THIS PR's actual changed-file list is 3, source
      `path` — matching the declared gear
    cmd: >-
      git diff --cached --name-only > /tmp/cf-ci.txt && python3 scripts/evidence_pack_lint.py
      --print-floor --changed-files-file /tmp/cf-ci.txt --numstat-file /tmp/ns-ci.txt && python3
      scripts/evidence_pack_lint.py --print-floor-source --changed-files-file /tmp/cf-ci.txt
      --numstat-file /tmp/ns-ci.txt
    result: 3 / path (.github/workflows/* is hot-zone; the diff is 90 lines, so the size term is irrelevant)
    exit: 0
    ts: 2026-09-15T18:20Z
    seat: session (M5)
  - claim: >-
      THE CENTRAL RECEIPT — nothing in .github/workflows/ ran infra/workflows/tests/ before this
      file, which is the entire justification for the PR
    cmd: grep -rl "infra/workflows" .github/workflows/ on origin/main
    result: >-
      no match, exit 1. test-kbli-certification-contract.mjs has therefore never executed in CI
      since it was written; it was run by hand or not at all.
    exit: 1
    ts: 2026-09-15T18:05Z
    seat: session (M5)
  - claim: >-
      THE RISK THIS PR CARRIES — the pre-existing suite this workflow arms is GREEN today, so
      landing it does not block every future infra/workflows/ PR
    cmd: node infra/workflows/tests/test-kbli-certification-contract.mjs
    result: 15/15 passed
    exit: 0
    ts: 2026-09-15T18:02Z
    seat: session (M5)
  - claim: >-
      Every command the job will run passes locally, before the job has ever run — the glob step,
      the behavioural step and the runner boot
    cmd: >-
      for t in infra/workflows/tests/*-contract*.mjs; do node "$t"; done && node
      infra/workflows/tests/test-run-second-army.mjs && node infra/workflows/run-second-army.mjs
      --args-file /tmp/ci-smoke-args.json --dry-run
    result: >-
      test-kbli-certification-contract.mjs exit 0 · test-second-army-contract.mjs exit 0 ·
      test-run-second-army.mjs 5/5 · runner boot exit 0 returning promoted:false, built by luna
      (the inferior roster's first seat under the dry-run door), verified by sonnet (the Dux)
    exit: 0
    ts: 2026-09-15T18:18Z
    seat: session (M5)
  - claim: >-
      The workflow parses as valid YAML with exactly one job, five steps, and a paths filter that
      spares PRs touching neither infra/workflows/ nor this file
    cmd: >-
      python3 -c "import yaml;d=yaml.safe_load(open('.github/workflows/workflows-tests.yml'));print(sorted(d['jobs'].keys()),
      len(d['jobs']['workflows-contract-tests']['steps']))"
    result: "['workflows-contract-tests'] 5"
    exit: 0
    ts: 2026-09-15T18:24Z
    seat: session (M5)
  - claim: >-
      actions/checkout@v7 is this repository's own pin, not an error — the refuter's contrary claim
      is stale model knowledge and is refuted by the repo itself
    cmd: grep -rho "actions/checkout@v[0-9]*" .github/workflows/ | sort | uniq -c | sort -rn
    result: 121 workflows pin @v7, 1 pins @v4, and CI is green on main
    exit: 0
    ts: 2026-09-15T18:22Z
    seat: session (M5)
dissent:
  - seat: gemini-3.8-flash-low via agy (cross-family refuter)
    objection: >-
      "`cancel-in-progress: true` is unscoped, so an in-flight run on refs/heads/main is aborted
      when commits land in quick succession, leaving those commits unverified."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AND APPLIED. Scoped to `${{ github.event_name == 'pull_request' }}` with the reason
      written into the file. This was the best finding of the review: an unverified commit on main
      is the exact shape of cicatrix #2 that this workflow exists to close, so shipping it inside
      the cure would have been self-defeating.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter)
    objection: >-
      "The suite loop is fail-fast, so it reports the first broken contract and hides the rest."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AND APPLIED. The loop now runs every suite, collects failures and fails once with
      the full list, so a reader fixes all of them in one round instead of discovering them one
      round-trip at a time.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter)
    objection: "`actions/checkout@v7` does not exist; actions/checkout only goes up to v4."
    status: RETRACTED
    disposition: >-
      REFUTED by the repository. 121 workflows on main pin @v7 and CI is green. Recorded rather
      than deleted, because a refuter being wrong once is not a reason to stop dispatching it — two
      of its seven findings were real and one of those was the best in the review.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter)
    objection: >-
      "--dry-run short-circuits execution, so the real dispatch path, process handling and timeout
      logic are never evaluated; runtime bugs there pass CI silently."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AS DECLARED SCOPE, and written into the workflow header as a limit rather than left
      implied. CI cannot spawn a model seat here without a credential this job deliberately does
      not have. The live path is exercised by running a real mission; the one run so far is
      recorded in research/operations/second-army-D5-restamp-6579-20260915T164000Z.md, and it is
      what found the verify-lane defect fixed in #6605.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter)
    objection: >-
      "The glob is non-recursive and does not match the behavioural suite, so 'armed the day it
      lands' is overstated."
    status: CONFIRMED
    disposition: >-
      ACCEPTED AS DECLARED SCOPE. Written into both the workflow header and the brief's third
      assumption: a flat new *-contract*.mjs is armed automatically; a suite in a subdirectory, or
      a new behavioural suite, needs a line added here.
  - seat: gemini-3.8-flash-low via agy (cross-family refuter)
    objection: >-
      "The paths filter only watches infra/workflows/**, so a breaking change outside it bypasses
      the workflow."
    status: PLAUSIBLE
    disposition: >-
      ACKNOWLEDGED, NOT ACTED ON. The suites depend on node: builtins only — no package.json, no
      workspace config, no shared utility. Widening the filter would make every unrelated PR pay
      for a job that cannot break from outside that directory. Revisit if a suite ever grows a
      dependency.
  - seat: claude-opus-5 (release owner, on its own work)
    objection: >-
      "This job is not a required check, so on the day it lands it can go red and nothing stops a
      merge."
    status: PLAUSIBLE
    disposition: >-
      DELIBERATE, AND SAID OUT LOUD IN THE FILE. Arming a new required check is a separate decision
      with its own blast radius and should follow a history on main rather than one green run.
      Naming it here means the follow-up is a decision someone takes, not a step someone forgets.
