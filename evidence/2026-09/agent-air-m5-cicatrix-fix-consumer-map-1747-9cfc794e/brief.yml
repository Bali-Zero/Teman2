task_id: cicatrix-fix-consumer-map-1747
gear: 2
l_level: L1
gate_class: opus
objective: |
  Close PENDING-ARMS line 1747 (opened 2026-08-31, SQUAD H): `consumer_map.py` — the
  pre-push guard that finds live consumers of deleted/renamed files by basename — still
  reported 73 false LIVE consumers of the moved scar corpus (#5331). PR #5373 had already
  cured one class (segment-built repoints, 72->63 on a different move); the remaining class
  is a BARE BASENAME with no directory component at all, used as DATA: a tuple of filenames
  (`CORPUS_FILES = ("cicatrix-scars.md", ...)`), a header string being written, a mapping
  value, a commit-message string inside a shell script, a line of prose. A line naming only a
  basename names no location, so treating it as a stale consumer is a category error.

  Added a BARE-BASENAME FILTER: a hit whose line carries no directory syntax adjacent to the
  basename (no `/` operator, no literal path string containing `/`, no `join(`/`joinpath(`
  call) downgrades from LIVE to a new verdict "bare-basename" (excluded from the blocking
  count, same as "docs-mention"). Per-kind precision, not one blanket rule, was required to
  avoid regressing FIVE pre-existing tests during development: python hits are judged by the
  basename literal's exact AST parent (Tuple/List/Dict/Set/Call downgrade; a bare `Assign` RHS
  or `/`-BinOp stays conservatively LIVE, since the value could be composed into a real path
  on another line — the ledger's own guilt corpus); shell/config-kind hits require the
  occurrence to sit inside a quoted string (distinguishing `git commit -m "...basename..."`
  from the tool's own pre-existing, intentional over-match example `cat conftest.py`, a bare
  unquoted command-line word); the "other" catch-all (.txt/.yaml/.json/.sql) uses pure
  directory-adjacency with no quote requirement, since the real docs/army-prompts/S15.txt
  prose line this filter exists to catch has no quotes around it at all. Unparseable python
  fails CLOSED (no downgrade attempted), same discipline as the pre-existing docstring filter.
constraints:
  - "One PR, one concern: only scripts/consumer_map.py and its test file touched. No
    workflow, no hot-zone, no migration."
  - "Never widen the RENAME SAFETY / PROSE-MENTION / docstring filters' own semantics — the
    new filter runs strictly AFTER them, only acting on a hit still LIVE once they are done,
    so an existing docs-mention classification is never overwritten by the new verdict."
  - "Safety asymmetry preserved throughout (module docstring's own stated design): every
    ambiguous case defaults to staying LIVE (over-match, costs a human one extra row), never
    to silently downgrading (under-match, the actual defect class this whole tool exists to
    prevent). Verified empirically: development history includes a first, simpler
    line-only-heuristic version that DID regress test_guilt_segments_OUT_OF_ORDER_do_not_
    count_as_a_repoint and test_common_basename_include_common_forces_the_scan (the tool's
    own intentional `cat conftest.py` over-match example) — both were the trigger for the
    per-kind AST/quote redesign actually shipped."
  - "No PII: this is a repo-hygiene tool operating on tracked source, no client data."
