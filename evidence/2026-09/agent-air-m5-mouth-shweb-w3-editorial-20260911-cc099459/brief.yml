    Never a blind substitution of "2B". The superseded threshold is corrected only where a
    claim presents it AS the Second Home / E33 requirement. An IDR 2 billion figure that is
    a paid-up capital, a property price or another product's threshold is left alone and
    recorded in the census as such.
  - >-
    E33 facts come only from research/secondhome/e33-fact-registry.json, never from memory.
    The registry and the letter tracker are FROZEN: no reply has arrived, 16 facts stay
    pending, and nothing is promoted to confirmed to remove a disclaimer.
  - >-
    Prices come only from PricingTool. No decomposition of a client-facing price into PNBP +
    service fee (owner ruling 2026-07-23). Invented fee tables are removed, not restated.
  - >-
    E33G belongs to the Second Home family (Visa Rumah Kedua) — the correction is to stop
    naming the HNW instrument with the remote-worker code, never to deny the family.
  - >-
    No noIndex is removed and no article is deleted in this PR. The four noIndex E33
    families stay as they are, listed with a proposed disposition, pending Zero's ruling.
  - >-
    apps/mouth/scripts/generate-llms-full.ts is W1's file. The ONLY change is the freshness
    tie-break named in contract-lock.json (C5 debt of PR #6243) plus its test.
  - >-
    The tracked public/llms*.txt artifacts are not regenerated into the commit (W1's
    disposition, and 450k lines would swamp the diff). They are build-generated; the proof
    is the artifact the real build writes, measured and then restored from git.
