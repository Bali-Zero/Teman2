# harness-v2 §5: mandatory, and non-empty at Gear 3. These are objections that were
# RAISED AGAINST THIS WORK by a seat that did not write it, recorded with what became
# of them — not a list of things I decided to mention.
dissent:
  - seat: codex-sol (PRE-review, cross-family, outside the contribution chain)
    objection: >-
      BLOCK before any edit, 5 conditions. The load-bearing one: the probe measured TOKENS
      and not CLAIMS — it convicted `IDR 20B` and acquitted `IDR 2 000 000 000`,
      `2 à 5 milliards IDR`, `two billion` and `Rp2M`, so its zeros would have been a
      measurement of the regex, not of the corpus.
    status: CONFIRMED
    disposition: >-
      All 5 conditions met before the first content edit. The probe was rewritten around
      `2(?![\d.,]*\d)` plus unit and spelled-out forms, and now carries a `--selftest`
      with guilt AND innocence cases. Record: prereview/codex-sol-prereview-round1.txt.
  - seat: gemini-3.1-pro-high (long-context read of the 5 sources against the registry)
    objection: >-
      The property route named a qualifying title that the registry does not confirm —
      `e33_base_property_title_type` is `unknown` and `property_validation_standard` is
      `unknown`, so naming Hak Pakai or SHM Sarusun states as settled what nobody has settled.
    status: CONFIRMED
    disposition: >-
      Path 2 rewritten in all five locales: completed strata unit, USD 1,000,000, no
      qualifying title named, and the unresolved status said out loud. `--claims` now
      FORBIDS both titles; it caught two residual `Hak Pakai` mentions in .id and .ru
      after the amount check already read 0. Record: prereview/gemini-3.1-pro-claim-table.txt.
  - seat: claude-sonnet-5 (spalla-review subagent `w3-second-reader`, second independent reader)
    objection: >-
      Four claims were cured in the ENGLISH source and left standing in the four
      translations, so each translated file contradicted its own body: the "90 days" entry
      window against a `pending` fact, "SHV time does not count toward KITAP" against an
      `unknown` one and against the file's own FAQ, and the dependent-codes hedge missing
      from .id/.ru while their own comparison table two sections later still carried it.
    status: CONFIRMED
    disposition: >-
      All 6 findings applied at 65850ec8a6. The guard changed too: `--claims` now carries a
      per-locale positive check for the corrected wording, so a cure applied to 1 of 5 files
      fails the probe instead of reporting green. Record: prereview/second-reader.txt.
  - seat: claude-opus-5 (dux, self-refutation of a measurement, recorded because it nearly shipped)
    objection: >-
      The first census test asked whether the served body contained "Article not found" and
      reported 128/128 healthy. Every page on this site carries that string inside its client
      bundle, so the test could not have failed — a guard that cannot go red measures nothing.
    status: CONFIRMED
    disposition: >-
      Replaced by a test with a real failure mode: the served canonical must EQUAL the
      requested URL. 128/128 pass under the sound test. Both the trap and the replacement
      are written into research/secondhome/2026-09-12-e33-editorial-census.md.

  - seat: codex-sol (POST refuter, round 3, outside the contribution chain)
    objection: >-
      BLOCK, 9 findings, and the THIRD BLOCK on one cause. Seven of the nine defeat the
      REBUILT guard, by execution, not by argument: (1) the currency rule reads only what
      precedes the amount, so `2 billion USD` and `two billion dollars` are convicted;
      (2) `Rp. 2.000.000.000` and `IDR 2.0 billion` are not matched at all; (3) an
      allowlisted line keeps its allowance when the line ABOVE it reverses the meaning
      (`It is false that` + an allowed retirement sentence => --claims 0, stale empty);
      (4) the comparison table's `Financial requirement` row is unanchored, so dropping
      own-name and completed-unit from it leaves --claims at 0; (5) the literal pins cover
      the BASE commit's wording, not the wording removed in the INTERMEDIATE rounds, so
      restoring the frozen head's proof headings passes; (6) the 180-day figure removed in
      the last round was never pinned; (7) deleting `idArticles.sort(...)` left the suite
      green because the ID fixture had one publishable article. (8) the census still
      described the deleted marker mechanism as current; (9) the SKTT annual renewal was
      still prescribed while the census admitted the source did not support it.
    status: CONFIRMED
    disposition: >-
      The rule of three fired and PR-1 was SUSPENDED with no fourth guard cure. The
      imperator then SPLIT the concern (2026-09-12, shweb-imp-w3s-suspend-ruling): the
      failing surface is the GUARD, not the content, and a fix-of-a-fix stops at depth 1.
      So 1-6 are now REQUIREMENTS in research/secondhome/probe-guard-spec-v2.md, to be
      implemented by another seat in PR-1b, and the probe ships labelled as a MEASUREMENT
      instrument whose regression protection is partial and evadable — the claim that every
      cure can turn it red is deleted from the disposition and from the probe's own
      docstring. 7 is CURED here (two ID translations whose dates run against filesystem
      order; the mutant is now red). 8 is CURED (both passages marked SUPERSEDED). 9 is
      CURED with a source this session fetched (HTTP 200): the Dukcapil procedure states the
      SKTT follows the ITAS validity and gives 14 days from ITAS issue, so the false annual
      renewal is gone and the deadline is back, cited, in all five locales.
  - seat: tp1-qwen3.8-max (adversarial language, rounds 1-3 + final pass)
    objection: >-
      CONCERNS. Two sentences had passed from honesty into INACTIONABILITY (the SKTT
      deadline and the absence threshold), the Indonesian carried eight calqued or broken
      constructions — including `sumberkan`, which is not a verb — and the phrase "not
      settled in public regulation" appears nine times, which the seat reads as a register
      that has tipped from precise to defensive for a high-net-worth audience.
    status: CONFIRMED
    disposition: >-
      The inactionability and the language defects are CURED: the SKTT now carries a sourced
      deadline and says we file it, the absence paragraph tells the reader to warn us so the
      absence is documented, `sumberkan` and seven calques are rewritten, and the official
      name is reconciled in the comparison table of all five locales. The REGISTER finding is
      adjudicated AGAINST the seat and stands as its recorded dissent: the number of
      uncertainty statements is a direct consequence of the ruling that forbids publishing a
      figure without a verbatim source, so it does not go down. Only the VOICE changed, in two
      places: "we do not publish an amount we cannot source" became "we ask the office in
      writing and put the answer in your file".
