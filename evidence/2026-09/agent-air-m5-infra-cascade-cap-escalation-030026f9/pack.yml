plan_ref: >-
  Residual declared in PR #5990's pack (evidence/2026-09/agent-air-m5-infra-
  window-jump-headless-28841dea, dissent "cap reached with a jump still pending
  returned 0 as if complete", status PLAUSIBLE) and the healer doctrine of
  PR #5973 (a curable defect becomes one HIGH line, deduped, with a cure lane).

lanes:
  - lane: build
    role: build
