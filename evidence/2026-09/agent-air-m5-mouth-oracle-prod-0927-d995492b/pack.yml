seat_override: >-
  R8 ground-truth-lane escape: this diff is a presentation-only transplant of an
  already-approved branching atlas (WINDOW-SPEC/BUILD-SPEC). It touches no visa/KBLI/
  tax rule or outcome-content data -- the reducer/tree/fact-mapper and
  engine-adapter.ts (the code that actually consumes ground-truth content) are
  untouched by design, so no NotebookLM grounding query applies to this diff's own
  content and no ground_truth lane is declared.
