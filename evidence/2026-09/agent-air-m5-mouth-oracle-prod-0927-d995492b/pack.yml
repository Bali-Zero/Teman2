unresolved:
  - "Dissent status CONFIRMED in this pack means the finding was accepted as real
    (the lint's vocabulary is CONFIRMED/PLAUSIBLE/RETRACTED); whether and where it was
    fixed is stated in FIX-ROUND-2.md, DELTA-ROUND.md and the receipts."
  - "Retracted-with-evidence, recorded for completeness: Qwen's useId-colon finding
    was disproven by measuring renderToString(useId()) on this repo's React (19.2/
    19.3), which renders `_R_0_` -- no colon; Qwen's arrival-truncation finding was
    disproven because the effect only fires once both readiness flags are already
    true, and both stay monotonic while the permit art remains mounted, so no re-run
    path exists inside the 650ms window. Both are FIX-ROUND-2 section C dispositions,
    corroborated independently by Kimi's and Sol's final reviews."
  - "Qwen findings 4 and 5 (ConsultantContact key-based remount; LandscapeArt
    data-art naming the outgoing asset) needed no change: remount-on-key-change is
    preserved pre-existing behaviour, and data-art is a cosmetic/debug attribute no
    CSS selector reads -- coordinator ruling, FIX-ROUND-2 section C."
  - "Sol's final review (13:35:04Z) noted the corrected-CI-env full-gate rerun as
    still pending at its own review time; the run2 gate receipt in this pack
    (13:38:02Z, 134 passed / 0 failed) completed after that review and closes the
    note -- Sol itself states it did not rerun heavy checks."
  - "Kimi's final review recorded three accepted, non-blocking minors: clicking the
    AtlasRoute dialog's own backdrop padding closes the dialog (harmless UX quirk,
    consistent with the other close affordances); outcome.sources_title is now an
    unreferenced key, which is correct under the keys-stay contract, not a defect;
    WhyWeAsk's decisionMapping prop is now unread (dead parameter, non-functional,
    TS does not flag it)."
  - "ESLint still cannot run on this route at all (pre-existing eslint-plugin-react
    crash against ESLint 10.11.0) -- out of scope for this diff; tsc/vitest/build/
    e2e are what actually cover it, per the recorded assumption in brief.yml."
  - "Pro became unusable mid-mandate (swap filled the shared APFS container); every
    heavy check that binds this pack ran on Mini instead, and is labelled as such in
    every receipt above."
  - "The first fresh claude-opus-5-5 xhigh on-disk gate returned BLOCK on docs
