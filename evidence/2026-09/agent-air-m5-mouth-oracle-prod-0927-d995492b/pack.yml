diff:
  behaviour_change: >-
    Replaces the visa-oracle route's presentation layer with the approved
    branching-atlas UI (map-style world/permit stages, category tiles, atlas scenery,
    a native-dialog route history) while leaving the canonical evaluation/idempotency
    reducer, SHADOW fail-closed check, consent/resume stores, telemetry and every
    outcome-content mapping untouched. 19 approved WebPs ship byte-exact under
    apps/mouth/public/static/visa-oracle/atlas/. No backend, package, lockfile, API,
    or engine-adapter file changes anywhere in the diff. The final-gate delta makes
    print/PDF open the default-closed outcome disclosures, centres the route dialog as
    a fixed modal, and lets Pause suppress the verdict ViewTransition.
  surface: >-
    Code under apps/mouth/src/app/(visa-oracle)/visa-oracle and
    apps/mouth/public/static/visa-oracle, plus this mandate's research/ docs and this
    evidence directory (counts are in the receipts, measured per commit). New: _lib/atlas-scenes.ts,
    _components/OracleScenery.tsx, _components/AtlasRoute.tsx, focused tests, 19
    WebPs. Modified: OracleShell.tsx, QuestionScreen.tsx, WhyWeAsk.tsx,
    OutcomeSheet.tsx, VerdictReveal copy, i18n.ts (EN+ID), oracle.css, two existing
    tests updated for approved copy; the delta commit touches only oracle.css,
    OutcomeSheet.tsx, OracleShell.tsx and their two focused test files.
