dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      "print/PDF geometry regression -- later atlas width/padding overrides
      the old print reset, leaving the verdict narrow and indented"
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "stale keyboard branch preview -- preview reset on mouse leave only;
      tabbing out leaves the last focused landscape visible without a
      focused/selected branch"
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "reduced-motion control is untruthful -- when the OS requests reduced
      motion, effective motion is already off while the button says Pause and its
      Resume action cannot resume"
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "checkbox accessible name absorbs the full sensitive-data paragraph
      instead of a short opt-in label"
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "entry scene mounts four full-size img elements at once (indonesia,
      world, permit-paper, permit-depth), downloading assets never shown on entry --
      contradicts the preload-only-current/nearby mandate"
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "every hover/focus on a category tile spawns a fresh Image() fetch
      with no abort, so a pointer sweep or Tab traversal can trigger up to 11 full
      WebP downloads"
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "LandscapeArt onerror clears the currently displayed image instead of
      keeping the prior one, contradicting its own doc comment"
    status: CONFIRMED
  - seat: kimi-code/k3
    objection: "world-presentation keyboard focus order may not match visual
      left-to-right (no/yes) order"
    status: CONFIRMED
  - seat: kimi-code/k3
    objection:
      "AtlasRoute Escape handling relies on close-order timing it does not
      control instead of an explicit onCancel handler"
    status: CONFIRMED
  - seat: tp1-qwen3.8-max
    objection: "stage layout loads four images on entry (indonesia, world,
      permit-paper, permit-depth), violating the preload-only-current/nearby mandate
      -- same defect as Kimi's eager permit-art mount finding, filed independently"
    status: CONFIRMED
  - seat: tp1-qwen3.8-max
    objection:
      "SVG clipPath id from useId() may contain a colon, which can fail to
      resolve inside a url() fragment in Safari/older Chromium"
    status: RETRACTED
  - seat: tp1-qwen3.8-max
    objection:
      "paper-arrival animation can be cancelled by readiness deps re-running
      the effect inside the 650ms window"
    status: RETRACTED
  - seat: tp1-qwen3.8-max
    objection: "ConsultantContact unmounts and remounts on the verdict transition (true as observed; same key-change remount existed before the patch, so preserved behaviour, no change)"
    status: CONFIRMED
  - seat: tp1-qwen3.8-max
    objection:
      "LandscapeArt data-art attribute names the outgoing image during the
      load window instead of the requested one (true as observed; no selector reads it, debug-only, no change)"
    status: CONFIRMED
unresolved:
  - "Retracted-with-evidence, recorded for completeness: Qwen's useId-colon finding
    was disproven by measuring renderToString(useId()) on this repo's React (19.2/
    19.3), which renders `_R_0_` -- no colon; Qwen's arrival-truncation finding was
    disproven because the effect only fires once both readiness flags are already
    true, and both stay monotonic while the permit art remains mounted, so no re-run
    path exists inside the 650ms window. Both are FIX-ROUND-2 section C dispositions,
    corroborated independently by Kimi's and Sol's final reviews."
  - "Qwen findings 4 and 5 (ConsultantContact key-based remount; LandscapeArt
    data-art naming the outgoing asset) needed no change: remount-on-key-change is
    preserved pre-existing behaviour, and data-art is a cosmetic/debug attribute no
    CSS selector reads -- coordinator ruling, FIX-ROUND-2 section C."
