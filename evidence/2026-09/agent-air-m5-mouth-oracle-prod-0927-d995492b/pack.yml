  - "Delta review notes accepted without change: if afterprint never fires, the
    disclosures stay open on screen (fails toward disclosure); a second beforeprint
    without an afterprint forgets the first batch (same direction);
    ::details-content is a Chromium-only fallback behind the primary
    beforeprint/afterprint path."
  - "Out of the delta's scope, recorded: on a scrolled verdict, closing the route
