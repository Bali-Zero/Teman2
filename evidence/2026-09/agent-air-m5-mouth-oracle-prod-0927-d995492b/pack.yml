  - seat: codex-gpt-5.6-sol
    objection:
      "reduced-motion control is untruthful -- when the OS requests reduced
      motion, effective motion is already off while the button says Pause and its
      Resume action cannot resume"
    status: CONFIRMED
  - seat: codex-gpt-5.6-sol
    objection:
      "checkbox accessible name absorbs the full sensitive-data paragraph
      instead of a short opt-in label"
    status: CONFIRMED
