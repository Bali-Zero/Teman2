deploy_impact:
  merging_deploys: true
  path: "apps/backend-rag/** -> fly-deploy.yml (nuzantara-rag)"
  order: >-
    Pre-deploy `run-migrations` runs apply-all on the PREVIOUS image (314 not in that image: no-op);
    `run-sql-v2-migrations-post-deploy` applies 314 on the fresh image. No code reads or writes either
    column (rg: no reader of abstained_at outside a test docstring; no SELECT * / INSERT ... VALUES /
    RETURNING * row-shape consumer of wa_outbox outside tests and migrations), so both images are safe.
  lock: >-
    ADD COLUMN takes a brief ACCESS EXCLUSIVE lock (catalog-only, no rewrite). SET LOCAL lock_timeout
    5s bounds the queue a waiting DDL creates to at most 5 s; past that the migration aborts atomically,
    314 stays unrecorded and the post-deploy job goes red — a rerun on the fresh image applies it (the
    PR is schema-only, so nothing depends on it in between). Table traffic: no write since 2026-09-01.
  rollback: >-
    Routine rollback of the abstain record = revert B2.3b, keep the columns and history (B2 §3). A
    production DROP COLUMN is a separately authorized destructive operation, never routine. No workflow
    or deploy script calls MigrationManager.rollback_migration, and migrate.py has no rollback command.

