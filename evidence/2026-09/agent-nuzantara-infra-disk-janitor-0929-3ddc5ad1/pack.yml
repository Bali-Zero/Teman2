      pack named claude-opus-5-5 as the gate seat while the gate is this Fable window, and
      called kimi round 3 "in flight" after its verdict had landed. All corrected in
      6432877dea + this pack revision.
  - seat: builder (self-check, this window)
    status: CONFIRMED
    objection: >-
      Kimi K2's harness bug plus a second one it did not reach: build() wipes $ROOT, so the
      fake delegate planted before the first qdrant assertion was gone by the second
