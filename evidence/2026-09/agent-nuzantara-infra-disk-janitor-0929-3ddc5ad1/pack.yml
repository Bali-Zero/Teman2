risks:
  - >-
    Healer board (peer gate note): scripts/healer_receptor_registry.py treats both "warn"
    (skipped: previous run alive) and "error" (errors>0) as unhealthy, so a persistent
    REFUSE — e.g. a stale scratch dir carrying a PII-named component — puts pro.disk_janitor
    on the healer-pro 6h board every tick until an operator moves the object. Intended
    (loud, judged by a session, never a blind kickstart), and it is why the arm's
    proof-of-armed demands status ok with errors=0, not merely a fresh sidecar.
  - >-
    Prove-live precondition (peer gate note): the wrapper runs ~/nuzantara/scripts/disk_janitor.sh,
    the main checkout on Pro, which advances only through pro.git_pull_main (15 min tick,
    ~/logs/pro-git-pull.log). The kickstart waits for "OK pulled to <sha containing the
    merge>" in that log — never a hand pull, ~/nuzantara is read-only for agents.
  - >-
    Delegate double-scheduling (kimi R-4 / gate G-2): the birth narrative said nothing
    scheduled scripts/qdrant_backup_retention.sh — false, Pro's crontab C2.15 runs it daily
    at 05:10 WITA in --apply mode. DECISION: C2.15 stays until the organ has three green
    APPLY receipts (mode=APPLY, errors=0, qdrant_rc=0); then retiring C2.15 is an OPERATOR
    task on the PENDING-ARMS row — the crontab is Zero's config and no session edits it.
    The double run is idempotent (same script, same root, same keep thresholds).
