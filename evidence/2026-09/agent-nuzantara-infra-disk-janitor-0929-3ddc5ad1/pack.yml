dissent:
  - seat: codex-gpt-5.6-sol (round 1, on 001c1e110d)
    status: CONFIRMED
    objection: >-
      R1-R8 — protection predicate read a here-document (falls through to "not protected"
      when the temp file cannot be created); DISK_JANITOR_TMP_ROOT steerable; symlinked
      roots; candidate names in the log; probe rc unchecked; -mtime rounding; wrapper
      double-logging. CURED in b1bb8f41a8 (arrays instead of I/O, tmp_root_ok(), physical
      roots, 12-hex hashed names, fail-closed probe), each with a fixture.
  - seat: kimi-code/k3 (round 1, on b1bb8f41a8)
    status: CONFIRMED
    objection: >-
      O-1..O-11 — mapped onto the codex set except O-9 (a skipped run heartbeats "ok",
      so a hung payload reads healthy forever) and NEW-3 (protection compared
      case-sensitive paths on a case-insensitive volume). CURED in 735294946b (skip →
      warn) and 71ffa27cfb (case-folded comparison).
  - seat: codex-gpt-5.6-sol (round 2, on 735294946b)
    status: CONFIRMED
    objection: >-
      R1-R6 — protected DESCENDANTS of a directory target, ungated empty-dir sweep,
      registry read errors read as "dead", nested archive pruned, audit-trail failures
      silent, abnormal exits without heartbeat. CURED in 18b9a2a0ad.
  - seat: codex-gpt-5.6-sol (round 3, on 18b9a2a0ad)
    status: CONFIRMED
    objection: >-
      R1 MAJOR — qdrant delegation inherited QDRANT_BACKUP_ROOT from the environment and
      its targets never met the protected-tree gate; R2 — $(basename) strips a trailing
      newline before the uuid regex; R3 — HB_DONE set before the sidecar write was known
      to succeed. CURED in 09f5bce21a (pinned + gated root, parameter expansion,
      HB_DONE only after a real write).
  - seat: kimi-code/k3 (round 2, on 18b9a2a0ad + in-flight edits)
    status: CONFIRMED
    objection: >-
      K1 MAJOR = codex R3-R1; K2 MAJOR — the in-flight test could not exercise its subject
      because run() hardcoded DISK_JANITOR_QDRANT_RETENTION="" (two assertions red by
      construction, PASS=63 FAIL=2); K3 — malformed age knobs and unlistable roots
      no-op silently with errors=0; K4 — kill switch read after the audit probe; K5 —
      early exits ignore a failed heartbeat. K1/K2 CURED in 09f5bce21a (harness honors
      the injected delegate, fake delegate re-planted after every build), K3/K4/K5 CURED
      in c761a28d43.
  - seat: codex-gpt-5.6-sol (round 4, on 09f5bce21a)
    status: CONFIRMED
    objection: >-
      N1 MAJOR — scripts/qdrant_backup_retention.sh split `ls -t` output by line, so an
      archive name carrying a newline became fragments resolved against the CALLER's cwd
      and reached `rm -f` unguarded; N2 — the four early exits bypassed the HB_FAIL check.
      CURED in c761a28d43: every delegate target re-validated (no newline, inside root,
      direct child, not a symlink, expected type; refused → exit 1 → janitor errors>0),
      HB_FAIL enforced in the EXIT trap. Asserted with the REAL delegate, a newline-named
      archive and same-named cwd sentinels (kept), plus a keep-7 control.
  - seat: codex-gpt-5.6-sol (round 5, on c761a28d43)
    status: CONFIRMED
    objection: >-
      N3 MAJOR — a newline-carrying name INSIDE the root could collide with a real sibling
      through the line-based readers; N4 MAJOR — the delegate's own log named every
      candidate in cleartext; N5 MAJOR — fsize() took GNU `stat -f` filesystem text as a
      size (arithmetic error under set -e on the Ubuntu CI runner); N6 — the CI path
      selector lacked the delegate. CURED in fe4cf17bd5: newline-named entries refuse both
      backstops outright, hashed identifiers throughout the delegate log, numeric-only
      sizes (asserted with a GNU-shaped fake stat), delegate added to the selector.
  - seat: kimi-code/k3 (round 3, on c761a28d43)
    status: CONFIRMED
    objection: >-
      R-1 MAJOR — inside-root newline fragment deletes a real sibling (= codex N3, closed in
      fe4cf17bd5); R-2 MAJOR — the tools step is dead under launchd's minimal PATH (no
      export in wrapper or plist) while reporting rc=0/errors=0; R-3 — the delegate's own
      corpus orphaned from CI; R-4 — false premise "nothing scheduled the delegate" (Pro's
      crontab C2.15 runs it daily at 05:10 --apply); R-5 — fixed producer-probe marker makes
      the real-delegate assertions flaky under `pgrep -f` on a shared machine (3/70); R-6
      — `--check-path /` OK and trailing-slash HOME (unreachable for a real delete). R-2/R-3/
      R-5/R-6 CURED in 6432877dea; R-4 DECIDED (see risks) and the narrative corrected here
      and in PENDING-ARMS.
  - seat: claude-fable-5-1 (fresh gate window, pre-gate on fe4cf17bd5)
    status: CONFIRMED
    objection: >-
      G-1..G-4 reproduce kimi R-2/R-4/R-5/R-6 independently (launchctl getenv PATH empty on
