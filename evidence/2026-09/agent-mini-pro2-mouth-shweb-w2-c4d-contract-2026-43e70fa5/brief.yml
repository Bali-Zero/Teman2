lessons_carried_from_c4c:
  - >-
    Measure the floor with `--numstat-file` over the COMPLETE changed set, after the last commit.
    Twice now the declared gear was below the CI floor because the measurement was narrower than
    the PR.
  - >-
    Run the suite as the project does: `cd apps/mouth && npx vitest run`. `--root` makes vitest load
    its DEFAULT config, `setupFiles` never runs, and 155 unrelated tests fail — which reads exactly
    like "main is broken" and is not.
  - >-
    When a probe has to be rigged to fail, the rule it is testing is probably vacuous. The C4c guilt
    probe deleted the very markers the rule matched; a refuter noticed, and the rule was indeed
    passing on a realistic regression.
  - >-
    A result far more dramatic than the change can explain is the tell. Three files of comments and
    tests do not break main, and a sweep of 19 routes does not return zero URLs.

