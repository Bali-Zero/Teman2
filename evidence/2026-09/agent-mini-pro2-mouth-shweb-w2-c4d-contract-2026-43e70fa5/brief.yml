lesson:
  what: >-
    Three different enumerations of the same set produced three different answers — five, seventeen,
    forty-two — and each one looked like a measurement. Five came from matching manifest entries
    against a hardcoded tuple of five names. Seventeen came from walking the filesystem one level
    deep. Forty-two came from walking the whole tree, and only after a refuter asked what happened
    to nested routes.
  why_it_matters: >-
    Every wrong answer here was produced by an enumeration NARROWER than the thing being counted, and
    none of them announced that narrowness — a hardcoded list returns its own length, and a shallow
    walk returns a shallow answer, both with the confident shape of a measurement. The discipline is
    to derive the set from the thing itself and then ask what the derivation cannot see. It is the
    same failure family as the packets that omitted files: what the frame leaves out never appears
    in the result, so it has to be looked for on purpose.
