items:
  - id: C4d-C1
    raised_by: the fresh gate on #6391 (probe P8)
    what: >-
      `CLOSER_SHAPE = /(#\d+|\bC\d+[a-z]?\b)/` is UNANCHORED, so it asks whether a PR-shaped token
      appears SOMEWHERE in the closer, not whether the closer IS one.
    measured: >-
      Run against the regex as it stands on main: "TODO maybe C4b someday" ACCEPTED,
      "see C4b for history" ACCEPTED, "fix it in C9 probably" ACCEPTED. Only "later", "TBD" and ""
      are rejected. So an exception can still be declared with a shrug as long as the shrug mentions
      a lane.
    why_it_matters: >-
      It is the SAME substring-instead-of-entity mistake C4c was opened to fix, one level down. C4c
      stopped the rule judging the whole FILE and made it judge the entry; the entry's VALUE is
      still judged by substring. That is this repo's #3 scar family and it deserves to be closed at
      the last level rather than left as the one place it still lives.
    cure: >-
      Anchor the whole value: `/^(#\d+|C\d+[a-z]?)$/` against the trimmed string. Measured against
      that candidate: the three prose cases above are rejected and "#6391", "C4d", "C4b" accepted.
      Decide and WRITE DOWN two small things rather than leaving them to taste — whether the match
      is case-sensitive (measured: "c4b" is rejected by the anchored form) and whether surrounding
      whitespace is trimmed before testing (measured: "#6391 " is rejected untrimmed). Trim, and
      keep it case-sensitive so lane ids stay written the way the repo writes them.
    acceptance:
      - text: WHEN a closer is prose that merely mentions a lane, THEN the guard SHALL exit 1.
        probe: "closer 'TODO maybe C4b someday' and 'fix it in C9 probably' -> exit 1 each; '#6391' and 'C4d' -> exit 0"
  - id: C4d-C2
    raised_by: kimi-code/k3 on #6391, and carried in that pack as a declared residual
    what: >-
      The exception contract runs inside the guard, and no permanent test executes it. The suite
      asserts only that the text `Object.hasOwn(ALLOWED_CHUNK_PREFIX_CLOSERS, prefix)` still appears
      in the guard — so a rewrite that kept the string and broke the logic, or that moved the check
      to a different object, could stay green.
    why_it_matters: >-
      Every probe that proves this contract works today is a manual one recorded in a pack. That is
      evidence, not a regression test: it protects the reader, not the next commit. The contract is
      now the only thing standing between a future exception and a silently permanent allowlist.
    cure: >-
      Extract the contract into a small pure module — input the two structures, output a list of
      violations, no process.exit and no console — imported by BOTH the guard (which formats and
      exits) and a new test (which asserts behaviour). Then the four probes become permanent cases:
      empty/blank prefix, missing OWN key, prototype-inherited key, non-PR closer, stale closer, and
      the innocence case of a properly declared exception. Keep the guard's exit path and its
      message wording; only the decision moves.
    acceptance:
      - text: WHEN the contract's logic is broken while its call site still reads the same, THEN a test SHALL fail.
        probe: "mutant: make the module return [] unconditionally — the new behavioural test goes red while the old text assertion would have stayed green"
      - text: WHEN a properly declared exception exists, THEN the contract SHALL allow it.
        probe: "one valid prefix + closer -> no violations, guard exit 0"
  - id: C4d-C3
    raised_by: gemini-3.1-pro on #6391 (declined there with a measurement), seconded by kimi-code/k3
    what: >-
      The guard's scope boundary is documented and unenforced. Five `(workspace)` routes are already
      statically prerendered — /clients, /dashboard, /lkpm, /partners, /settings — and /lkpm's
      payload carries 4 marker hits. Nothing fails if a SIXTH joins them.
    why_it_matters: >-
      C4c declined to assert on the prerender manifest because asserting it outright fails the build
      on those five today, and forcing an owner-held exposure to red every build is not how it gets
      decided. That reasoning holds for the five. It does not hold for the NEXT one: a new workspace
      route becoming a static payload is a fresh regression, nobody has accepted it, and today it
      lands in silence.
    cure: >-
      A BASELINE, not a blanket assertion: read `.next/prerender-manifest.json`, list the
      `(workspace)` routes in it, and fail only on routes NOT in a declared accepted set — the same
      shape `ACCEPTED_PUBLIC_FILES` already uses for the two portraits. The five go in the set with
      the measurement and a pointer to the escalated workspace-auth item; a sixth fails the build.
      The accepted set must SHRINK when that item is decided, so state that in the comment.
    acceptance:
      - text: WHEN a new (workspace) route is prerendered, THEN the build SHALL fail naming it.
        probe: "add a trivial static (workspace) route, build, expect exit 1 naming it; remove it, build green"
      - text: WHEN the five known routes are prerendered, THEN the build SHALL pass.
        probe: "npm run build on an unmodified tree -> exit 0, and the OK line names the accepted count"

