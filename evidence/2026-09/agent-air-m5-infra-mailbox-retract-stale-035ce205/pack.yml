  Single build lane (Anthropic, claude-sonnet-5) -- D3's cross-family floor is exempt below 2
  build lanes, per evidence_pack_lint.py's own rule text. Three review rounds across 2 distinct
  non-Anthropic seats (codex-gpt-5.6-sol, tp1-qwen3.8-max), each posting an ok:true journal line
  on at least one round -- quorum met without kimi-code/k3. codex's round-1 line is ok:false (a
  real, confirmed finding, not a miss); its round-2 line on the fixed head is ok:true and is what
  the quorum counts.

