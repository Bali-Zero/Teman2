brief_ref: evidence/brief.yml
council_run: council-journal.jsonl
plan_ref: >-
  One concern: sender-side retraction + shortened TTL for stale queue_unstick fleet-mailbox
  broadcasts (measured 97% stale on Pro, well above the 50% ship threshold), plus a UNKNOWN-
  mergeStateStatus fail-closed fix on that same resolved_dirty_prs() function found by
  codex-gpt-5.6-sol's round-1 review and fixed on this branch in commit 6369c1b3d7.

lanes:
  - lane: retraction-and-ttl
    role: build
    seat: >-
      claude-sonnet-5 (this session, air-m5). Measured staleness against real `gh pr view` data
      (34 sampled, 33 stale) rather than assuming the reported symptom described reality. Built
      fleet_mail.sh's `retract --key` subcommand, wired queue_unstick.py's resolved_dirty_prs()
      to detect resolved PRs each tick and retract+drop them from dirty_seen state, shortened TTL
      to 12h on both queue_unstick.py and queue_stall_notify.py. Also found and fixed an unrelated
      production-state-corruption bug along the way: main()'s bare load_dirty_seen()/
      save_dirty_seen() calls relied on a default-parameter snapshot of DIRTY_SEEN_FILE frozen at
      import time, silently ignoring test monkeypatches and clobbering the real on-disk state file
      during test runs -- fixed by passing the path explicitly at both call sites. Same seat then
      fixed the UNKNOWN-mergeStateStatus fail-closed defect codex-gpt-5.6-sol's round-1 review
      found on this same function (commit 6369c1b3d7): resolved_dirty_prs() treated GitHub's
      transient UNKNOWN status as resolved-and-retractable, when this file's own documented
      rewarm logic treats UNKNOWN as a state a genuinely-still-DIRTY PR can show for tens of
      seconds after main moves. Rewrote fail-closed -- only an absent PR (merged/closed) or a
      present PR with a status that is definitely neither DIRTY nor UNKNOWN nor None resolves --
      with a guilt test (UNKNOWN must not resolve) and an innocence test (CLEAN and absent-PR
      still resolve).
  - lane: adversarial-review-1
    role: review
    seat: codex-gpt-5.6-sol (foreground, --sandbox read-only, effort=high, round 1 on 5b22365c3a)
    note_ref: council-journal.jsonl
  - lane: adversarial-review-2
    role: review
    seat: tp1-qwen3.8-max (effort=medium, streaming, round 1 on 5b22365c3a, prompt <4KB)
    note_ref: council-journal.jsonl
  - lane: adversarial-review-3
    role: review
    seat: >-
      codex-gpt-5.6-sol (foreground, --sandbox read-only, effort=high, round 2 on the fixed head
      6369c1b3d7 -- a fresh full re-review of the whole diff, not a diff-of-the-fix)
    note_ref: council-journal.jsonl

