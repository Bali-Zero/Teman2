  measured_at: >-
    `scripts/evidence_pack_lint.py --print-measured` against `git diff --numstat`/`--name-only`
    from the merge-base with origin/main to this pack's own finalized commit, run LAST as its own
    invocation after every other edit (see receipts for the exact command and its output) -- the
    fixed point this repo's own countable-claims rule requires, since the commit that adds this
    evidence directory is itself part of the diff being measured. Spans both fix commits
    (5b22365c3a, 6369c1b3d7), the staleness-audit research capture, and this evidence directory.

residual_risks:
  - >-
    THE FIRST LIVE queue_unstick_cron.sh TICK AGAINST A REAL RESOLVED PR IS THE ACTUAL PROOF, not
    this pack. Everything above is local simulation (pytest, direct script invocation, a mocked
    `_run()`) -- no live dispatch against Pro's real mailbox state was run as part of this PR. The
    cron is already installed and armed on Pro (10-min interval); its next natural tick against a
    genuinely resolved PR still in dirty_seen state is the receipt, observable via
    dirty_retracted=N in its own summary line and `*.retracted-*` files in the mailbox.
  - >-
    tp1-qwen3.8-max's round-1 review missed the same UNKNOWN misclassification codex caught in the
    same round -- its own scenario table simply omits UNKNOWN as a distinct case. Recorded
    honestly in council-journal.jsonl rather than silently reconciled; not re-run against the
    fixed head because team-lead's instruction treats tp1 round-1 as already discharged and codex
    round-2 alone satisfies the "on the head under review" requirement for the seat that actually
    found the defect.
  - >-
    codex round-2 left 3 LOW-severity items open, non-blocking: (1) fleet_mail.sh's retract does
    not guard a symlinked `broadcast/` directory itself (only symlinked message files) and could
    block opening a crafted FIFO named `*.md`; (2) the "key shared" test only exercises
    `_mailbox_key()` twice and the remote-routing test proves SSH is reached but not that real
    remote parsing/rename happens; (3) the staleness audit's headline 97% figure includes the
    OPEN-but-UNKNOWN bucket (5/34) in "stale" -- the UNKNOWN-excluded floor is still 28/34 = 82%,
    comfortably above the 50% ship threshold, so the decision is unaffected.
  - >-
    queue_stall_notify.py's broadcast surface got the TTL shortening only, no retraction -- 0
    live queue_stall:* broadcasts existed in the sampled evidence, so retraction there would be
    speculative (cure what the diff introduces, spec what it inherits).
  - >-
    A pre-existing, unrelated test-quality gap in test_fleet_mail_hosts.py (its own routing-stub
    assertion passes partly by accident via command-substitution pollution) was found but NOT
    fixed here -- out of scope, unrelated file, documented in test_fleet_mail_retract.py's own
    docstring and flagged in the PR body as a follow-up.

