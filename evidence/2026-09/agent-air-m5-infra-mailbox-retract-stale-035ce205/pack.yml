dissent:
  - seat: codex-gpt-5.6-sol
    objection: >-
      resolved_dirty_prs() compared `merge_state_status != "DIRTY"`, which mis-classifies GitHub's
      transient UNKNOWN mergeStateStatus as resolved-and-retractable. This file's own rewarm logic
      elsewhere already documents UNKNOWN as a state a genuinely-still-DIRTY PR can show for tens
      of seconds right after main moves while GitHub recomputes -- so this comparison could
      retract a live "act now" page for a PR that is, in fact, still dirty.
    status: CONFIRMED
    disposition: >-
      FIXED, commit 6369c1b3d7. Rewrote the comparison fail-closed: `continue` (never resolved) on
      status in ("DIRTY", "UNKNOWN", None); only an absent PR (merged/closed) or a present PR with
      a definite other status resolves. Added a guilt test (UNKNOWN must not resolve, verified
      non-vacuous against the pre-fix comparison) and an innocence test (CLEAN and absent-PR still
      resolve). Re-reviewed fresh by codex round 2 on the new head: CONFIRMED FIXED, no new defect.
  - seat: tp1-qwen3.8-max
    objection: >-
      (round 1, non-blocking) confirm retract_dirty_signal's failure path is inside a try/except
      wrapping the subprocess call, or an uncaught OSError from a missing fleet_mail.sh would
      crash main() and exit non-zero despite the `return 0 if not update_failed and not
      signal_failed else 1` guard line.
    status: CONFIRMED
    disposition: >-
      VERIFIED SAFE, not cured further: `retract_dirty_signal()` itself catches the subprocess
      call inside `_run()`, which already wraps every external call this script makes (the same
      helper `send_dirty_signal` and `apply_status_updates` use) in a try/except that returns a
      failure tuple rather than raising -- `dirty_retract_failed` is incremented from that tuple,
      never from an uncaught exception. No code change needed; documented here per tp1's own ask.
  - seat: tp1-qwen3.8-max
    objection: >-
      (round 1, non-blocking) no assertion or fallback if a broadcast's `key:` front-matter line
      falls outside the 10-line/2048-byte header-parsing window -- retraction would silently no-op
      and the stale file rides out its TTL.
    status: CONFIRMED
    disposition: >-
      ACCEPTED, not cured: the writer (`send_dirty_signal`) always emits `key:` as one of the
      first two front-matter fields, so this is a format-contract assumption already relied on
      elsewhere in the mailbox (mailbox_inject.py's own MAX_FRONT_MATTER_LINES), not a new risk
      introduced by this PR. Left as a residual risk rather than adding a write-time assertion,
      which would be a second, unrelated PR.
  - seat: tp1-qwen3.8-max
    objection: >-
      (round 1, non-blocking) `load_dirty_seen`/`save_dirty_seen` still carry a
      `path: Path = DIRTY_SEEN_FILE` default parameter -- the two patched call-sites in main() now
      pass it explicitly, but any future bare caller would silently regress into the frozen-default
      bug this PR fixed.
    status: CONFIRMED
    disposition: >-
      ACCEPTED as a residual risk, not cured: removing the default entirely (making `path`
      mandatory) is a wider-blast-radius signature change on functions with an unknown caller
      set outside this diff -- out of scope for a one-concern PR. Grepped this file for other bare
      callers: none found (only the two patched main() call-sites exist).
