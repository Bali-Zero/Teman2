task_id: council-seats-roster-0902
gear: 3
l_level: L2
gate_class: opus
objective: |
  Grow `COUNCIL_REVIEW_SEATS` in `scripts/evidence_pack_lint.py` from three
  seats to six: three TITOLARI (starters: codex-gpt-5.6-sol, kimi-code/k3,
  tp1-qwen3.8-max) and three FALLBACK reserves (tp1-deepseek-v4-pro,
  tp1-glm-5.2, agy-gemini-3.1-pro). Quorum for a Gear-3 pack still needs
  >=2 distinct seats from the UNION of both tuples, `ok:true`.

  Ruled by Zero 2026-09-02, measured the same day: before this change,
  COUNCIL_REVIEW_SEATS held exactly three seats, and on the day of the
  ruling Kimi was HTTP 403 weekly-quota-dead while `arsenal_probe.py`
  reported Codex TIMEOUT. Every Gear-3 PR in the fleet therefore rested on
  two seats, one of which the fleet's own liveness probe called dead — it
  was not, that TIMEOUT is the probe's flat 15s ceiling, and called
  directly the seat answered and found a real defect. A quorum a single
  quota reset can take to zero is not a quorum.

  Second limb, corrected mid-flight by Zero, verbatim: "le riserve non
  intervengono se i titolari ci sono" — the bench does not play while the
  starters are available. A reserve is a SUBSTITUTION, not an equal
  alternative: once quorum holds, if ANY counted seat is from the fallback
  tuple, the pack must declare a non-empty `seat_fallback_reason` naming
  which titolare it replaced and how the unavailability was observed. An
  earlier draft asked for a reason only when the council was seated
  ENTIRELY on reserves — strictly weaker, since it let one reserve walk in
  beside an available titolare with nothing said, exactly the substitution
  the ruling governs. `seat_override` still escapes everything, on both
  limbs.
constraints:
  - "Deliberately NOT enforced: whether the replaced titolare was REALLY
    down. The lint has no liveness data, and a guard that judges what it
    cannot see is this repo's guard-over-match scar family (#3). What is
    enforced is only that somebody had to WRITE the substitution down."
  - "The reason string must be non-empty after `.strip()` — a mutation
    removing the blank-string guard must redden a dedicated test, because
    `dissent: [{}]` passing on length alone was the exact adversarial
    finding (2026-08-10) this same file was corrected for once already."
  - "A reserve's verdict weighs the same as a titolare's once recorded — a
    finding is not worth less for which seat found it. Scoring a reserve
    lower would be scoring the messenger, and is out of scope here."
  - "`COUNCIL_REVIEW_SEATS` (the union) is what `_read_council_journal_seats`
    matches against journal lines, so a titolari-only council is a strict
    subset of the old three-seat behaviour and never trips the new second
    limb — the common path is untouched."
acceptance:
  - text: >
      WHEN a Gear-3 council's counted seats are >=2 distinct titolari only,
      the pack SHALL pass with no `seat_fallback_reason` required — the
      common path stays untouched by the roster split.
    status: verified
    probe: "python -m pytest scripts/tests/test_evidence_pack_lint.py -k council_run_gear3"
  - text: >
      WHEN quorum holds and ANY counted seat is from
      COUNCIL_REVIEW_SEATS_FALLBACK — one is enough, beside a titolare is
      enough — the pack SHALL be rejected unless it declares a non-empty
      `seat_fallback_reason`.
    status: verified
    probe: "python -m pytest scripts/tests/test_evidence_pack_lint.py -k council_fallback_reason"
  - text: >
      IF `seat_fallback_reason` is present but empty, whitespace-only, or
      non-string, the pack SHALL still be rejected — a reason key that
      exists is not the same as a reason that was written.
    status: verified
    probe: "python -m pytest scripts/tests/test_evidence_pack_lint.py -k council_fallback_reason_blank"
  - text: >
      WHERE quorum itself is already failing (<2 distinct qualifying
      seats), the pack SHALL report that violation alone rather than
      stacking a second `seat_fallback_reason` violation on top of it.
    status: verified
    probe: "python -m pytest scripts/tests/test_evidence_pack_lint.py -k council_run_gear3"
  - text: >
      WHEN this PR's OWN diff is measured against the rule it introduces,
      the recorded council SHALL demonstrate the rule in force on day one —
      a reserve seated beside a titolare, with `seat_fallback_reason`
      declared, because two of the three titolari were genuinely
      unavailable at dispatch time.
    status: verified
    probe: "this evidence pack's own council_run journal + seat_fallback_reason field"
risks:
  - "The bench is narrower in practice than the six-seat roster suggests:
    two of the three reserves (tp1-deepseek-v4-pro, tp1-glm-5.2) sit behind
    the same DashScope/TP1 client (`scripts/tp1_call.py`) that failed twice
    on THIS pack's own council dispatch with an unparseable-response
    JSONDecodeError on a streamed thinking-model shape — see this pack's
    `seat_fallback_reason` and `residual_risks`. That is a declared
    limitation of the change, not a defect it introduces: the roster
    counts distinct seat SLUGS, not distinct failure domains."
  - "The rule cannot verify the TRUTH of a `seat_fallback_reason` string —
    only that one was written. A council could in principle name a
    titolare as unavailable when it was not. Deliberately left unenforced
    per the constraints above (no liveness data available to the lint)."
instruction_to_the_grader: |
  The contract is `check_council_run_gear3` / `_read_council_journal_seats`
  in scripts/evidence_pack_lint.py, and `COUNCIL_REVIEW_SEATS_TITOLARI` /
  `_FALLBACK` immediately above them. If this brief's paraphrase disagrees
  with the code, the code is what ships.

  This pack is itself a live instance of the rule it documents: dispatch
  attempted all three titolari for the underlying diff, two returned
  non-judgements (kimi: weekly quota; qwen: client-side JSONDecodeError,
  twice), and a reserve (agy-gemini-3.1-pro) was seated to reach quorum
  alongside the one titolare that answered (codex-gpt-5.6-sol). Verify the
  journal and the `seat_fallback_reason` field describe that accurately,
  not a padded roster.
pii: none
