dissent:
  - seat: session (Pro), on the reserve-bench claim in residual_risks
    status: CONFIRMED
    objection: >-
      "The six-seat roster overstates the effective bench, because two of the three reserves share
      a client with a titolare that just failed." Verified rather than assumed: the fleet's own
      door map (arsenal probe, same day) lists tp1-deepseek-v4-pro, tp1-deepseek-v4-flash-0731,
      tp1-glm-5.2, tp1-qwen3.8-max, tp1-qwen3.7-max/plus and tp1-qwen3.6-flash as all resolving
      through the single DashScope door via scripts/tp1_call.py, and this pack's own dispatch hit
      that exact client's JSONDecodeError twice on tp1-qwen3.8-max. Recorded as a residual risk
      rather than cured here — the fix (a second TP1-independent reserve, or a client-side retry
      with a non-streaming fallback) is out of scope for a roster-composition PR and named so the
      next reader does not have to rediscover the shared-failure-domain shape.
  - seat: codex-gpt-5.6-sol, on the diff itself
    status: RETRACTED
    objection: >-
      Considered whether the new second-limb check could double-count a violation when quorum is
      already failing (stacking "no quorum" and "no fallback reason" on the same pack). Retracted
      after reading `check_council_run_gear3`: the function returns immediately on `not
      has_quorum`, before the benched-seat check ever runs, so the two violations cannot stack by
      construction. Verdict: PASS, no defeating input.
  - seat: agy-gemini-3.1-pro, on the diff itself
    status: RETRACTED
    objection: >-
      Considered whether `sorted(benched)` / `COUNCIL_REVIEW_SEATS_TITOLARI` string-joining in the
      violation message could raise on a non-string seat value sneaking into the journal. Retracted
      on inspection: `_read_council_journal_seats` only ever adds `seat.strip()` after an
      `isinstance(seat, str)` guard, so `benched` and the titolari tuple are both plain strings by
      construction before they ever reach the join. Verdict: PASS, no defeating input.
