dissent:
  - seat: Claude Opus 5 (self-refutation, on the redirect mechanism)
    objection: >-
      A route-level permanentRedirect() answers 308, not the literal 301 the
      2026-08-25 ruling names, and it costs a server render where a next.config
      entry would answer at the edge. If someone reads "301" as the letter
      rather than the intent, this ships the wrong status code.
    status: PLAUSIBLE
    cure: >-
      Not cured, deliberately. 301 and 308 are both permanent redirects and pass
      link equity identically; 308 additionally preserves the request method,
      which is strictly safer. The window brief's own OVERRIDES accept
      "301/308 with location: /visa-oracle". The render cost is one redirect
      response on a URL whose entire job is now to redirect. If Zero wants the
      literal 301, the change is a statusCode: 301 entry in next.config and a
      one-line window — recorded as a leftover.
  - seat: Claude Opus 5 (self-refutation, on what the retirement takes with it)
    objection: >-
      /visa was not only the quiz door: it was the branch selector, and it held
      the ONLY internal link to /visa/clock (the visa-expiry timeline tool).
      Measured — grep over apps/mouth/src for "/visa/clock" returns the sitemap,
      the clock's own files, and visa/page.tsx line 104. Nothing else. Retiring
      /visa leaves /visa/clock reachable only from search and from a saved URL:
      exactly the shape of the trauma sitemap.test.ts was written for ("live and
      unreachable").
    status: CONFIRMED
    cure: >-
      Not cured inside this window, and named rather than left to be discovered.
      /visa/clock KEEPS its sitemap entry and its canonical, so it is still
      indexed and still resolves — what it loses is its internal inbound link.
      Re-homing it (the Oracle's surface, the homepage doors, or a /visa/clock
      entry in the funnel nav) touches surfaces this window is forbidden from:
      oracle.css and the Oracle route group are fenced by ruling, the homepage
      doors are another window's perimeter. Recorded as the first leftover.
  - seat: Claude Opus 5 (self-refutation, on the proof)
    objection: >-
      Every acceptance in this pack that matters is a LIVE property, and nothing
      in this diff proves a live property. A merged redirect is not a served
      redirect — the Vercel deploy has to promote first, and this repo's scar
      record is mostly the distance between those two.
    status: CONFIRMED
    cure: >-
      The pack is filed with the BEFORE measurement taken live this session
      (receipt 2 and 3), and the AFTER measurement — curl -sI on /visa,
      /visa/match, /visa/match/<synthetic-hash>, /visa-oracle and the sitemap on
      the promoted build — is taken after the merge and reported in the window's
      close line, not asserted here. Nothing in this pack claims a post-merge
      fact.
