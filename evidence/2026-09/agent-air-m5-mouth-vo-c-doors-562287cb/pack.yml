decisions:
  - id: D-gear
    decision: >-
      Gear 2 declared, and 2 is also the deterministic floor from
      evidence_pack_lint.py compute_floor(): "size" term, 7 files +180/-648 =
      828 churn on the merge-base diff, well under the 1828 that floors at 3,
      and no hot-zone path. The report's own escalation condition ("gear 3 if
      the redirect touches shared next.config") does not fire, because D1 chose
      not to touch it. No council run: council is a Gear-3 demand.
  - id: D1
    decision: >-
      The redirect is a route-level permanentRedirect() in the two retired page
      files, NOT an entry in apps/mouth/next.config.ts's redirects(). Three
      reasons. (a) That table is shared by every funnel on the domain — 60+
      ordering-sensitive entries covering blog categories, kbli, tax, property,
      immigration and /visa/second-home-e33, with catch-alls like
      "/immigration/:slug*" that a new /visa rule sits beside; the blast radius
      of a mistake there is the whole site, and here it is one URL. (b) A
      route-level redirect DELETES the quiz instead of shadowing it, which makes
      acceptance A2 structural: no future reordering of a shared table can serve
      a 200 quiz at these URLs again, because the wizard source no longer exists.
      (c) The two routes keep a page.tsx, so sitemap.test.ts's filesystem walk
      still enumerates /visa and /visa/match and still forces a written reason
      for their absence from the sitemap — deleting the files would have made
      them vanish from that guard silently. Cost of the choice: 308 rather than
      literal 301. Both are permanent redirects with identical link-equity
      semantics, and the window brief accepts "301/308". permanentRedirect is
      already the in-app idiom here — (blog)/[category]/[slug]/page.tsx:183.
  - id: D2
    decision: >-
      Robots are not touched anywhere in this diff — not on /visa-oracle, and
      not on the retired doors either. Acceptance A4 says a robots change without
      a quoted ruling is a fail, and the window override says "leave robots
      exactly as they are". That override is read literally, including for
      /visa/match/[hash], whose inherited canonical now points at a URL that
      redirects (see leftovers) — fixing that is a robots/canonical decision and
      belongs with Zero's A4 ratification, not smuggled in beside a redirect.
  - id: D3
    decision: >-
      /visa/match/[hash] and its API are untouched. The window retires an ENTRY
      POINT, not a data path: a result link a visitor already saved or received
      must still open. The e2e suite now asserts this directly with a
      non-existent synthetic hash (200 + the page's own "could not find this
      recommendation" state), which is the strongest form of the claim — it
      passes without depending on any stored record.
  - id: D4
    decision: >-
      apps/mouth/src/proxy.ts is NOT edited, although it is the real front door:
      visa.balizero.com/ 302s to /visa (proxy.ts:331-338) and is what the
      homepage PersonaDoors, FunnelCTAs, FunnelFeature and funnel-nav all link
      to. After this change that path becomes 302 -> 308 -> /visa-oracle: two
      hops, no lost visitor, and the homepage door labelled "Visa Oracle" finally
      lands on the Oracle. proxy.ts is outside the window perimeter and carries
      25 middleware tests; collapsing the chain is a separate, one-line window.
      Recorded as a leftover rather than widened into.
  - id: D5
    decision: >-
      The W0b telemetry antibody that lived in visa/match/page.test.tsx is not
      lost with the wizard it guarded. formSubmitFailed(endpoint, status) — the
      event whose absence made the v1 funnel die silently for three months — is
      still pinned on the two wizards that remain, visa/clock/page.test.tsx and
      lib/funnel-app-events.test.ts. The replacement test file says so in its
      header so a future reader does not read the deletion as a retreat.
  - id: D6
    decision: >-
      Both new guards are guilt AND innocence (cicatrix family #3). Guilt - the
      page calls permanentRedirect("/visa-oracle"). Innocence - the source
      carries no "use client", no AppWizard/AppFrame/AppBranchSelector/
      useFunnelApp and no fetch(, so a redirect cannot be reintroduced as a
      wrapper around a quiz that still renders underneath it.
