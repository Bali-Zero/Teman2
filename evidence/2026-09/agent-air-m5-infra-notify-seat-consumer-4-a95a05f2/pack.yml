council_run: council-journal.jsonl
brief_ref: evidence/brief.yml
plan_ref:
  "Lane INFRA NOTIFY-ROUTING, mandate from Zero 2026-09-21: cut the notifications that
  reach the owner, send the rest to LLM seats that ACT. PR-1 = #6973 (merged, the gateway's
  fourth tier). This is PR-2, the consumer that closes what #6973 routed. PR-3 (WhatsApp
  transport for the ~28 survivors) is blocked on a Meta UTILITY template approval, an owner
  GUI action, and must not precede this one."
lanes:
  - lane: notify-seat-consumer
    role: build
    seat: >-
      claude-opus-5 (conducting session — re-measured the p0 archive on both H24 machines, cut the
      PR to the ONE cure that measurement supports, wrote the consumer, the organ, the suite and
      this pack)
  - lane: notify-seat-consumer-review-k3
    role: review
    seat: >-
      kimi-code/k3 (dispatched on the FINISHED diff of the predecessor and told to attack it, not
      confirm it — six accepted findings, one rejected with evidence; see council-journal.jsonl)
  - lane: notify-seat-consumer-review-sol
    role: review
    seat: >-
      codex-gpt-5.6-sol (same diff, read-only sandbox; it ran eleven adversarial rows through the
      module rather than reasoning about it — eleven confirmed false cures, two found by nobody else)
  - lane: notify-seat-consumer-gate-6992
    role: review
    seat: >-
      claude-opus-5, fresh session outside the contribution chain, sitting as the ON-DISK GATE
      for PR #6992 (role recorded as `review` because that is the vocabulary this lint accepts;
      it was a gate verdict, not an advisory pass).
      Verdict REWORK-BUILD. Its three findings are the reason this branch exists; see the third
      line of council-journal.jsonl. The build seat verified all three independently before
      accepting them, and went one step further than the verdict asked on the second.
pii_scan: clean
seat_diversity: satisfied
seat_diversity_note: >-
  Two non-Anthropic review families on the finished diff plus an Anthropic gate session outside the
  contribution chain, none of which wrote a line of it (generator is never grader). This was not a
  formality: between them they found eleven ways the consumer closed a row it had not proved, and the
  gate then found that the PR's second cure was justified by a number measured on the wrong entity
  and could not fire on the node it was armed on. Neither the build seat nor the two reviewers caught
  that; the gate did, by re-measuring instead of re-reading.
diff:
  net_lines: >-
    11 files changed, 1494 insertions(+), 5 deletions(-) measured by
    `git diff --shortstat $(git merge-base origin/main HEAD)..HEAD` — the lint's own formula, not the
    three-dot shorthand. 533 of those lines are the evidence pack, brief and council journal; the
    code accounts for 961 of those insertions and all five deletions, across the eight non-evidence
    paths; 395 of the 961 are tests. Zero frontend, zero workflow, zero migration.
    One new Python organ, one launchd plist + wrapper generated by scripts/organ_birth.py, one
    registry entry, two declared HOME pairs. The code is 128 lines LIGHTER than #6992's (+1089):
    the consumer went 433 -> 371 and its suite 461 -> 395 when the second cure and its tests came
    out. The pack grew instead, which is the correct direction for a third attempt.
  behaviour_change: >-
    A new hourly launchd organ on Pro reads the escalation board and appends a `resolved` row for
    routed `cron-fail:<job>` entries whose own run-state file proves the job has since succeeded.
    It never writes an alert, never restarts a service, never removes a file, never touches a row
    from another machine, and never closes a row it cannot prove. Nothing in #6973's contract moves.
    On the day it lands it will close ZERO: the board holds one routed row and that row's key is a
    bare hash with no family. That is stated in the docstring so the first green-and-empty run is
    not read as a defect.
