dissent:
  - seat: session (self-refutation against the mandate's own wording, RESOLVED by measurement)
    objection: >-
      "The mandate asked for a seat that runs OPERATIVE cures — 'relaunch a cron, clean a disk,
      restart a worker'. Taken literally that is a relauncher, and the measurement says a relauncher
      would cure almost nothing: wa_codex_seat_sentinel and sentry-quota-check fail on missing
      credentials, nextdns-weekly-digest on an unbound variable, the NB pipelines repeatedly, and
      imigrasi-diff is not a fault at all. A relaunch reproduces each of those."
    status: CONFIRMED
    resolution: >-
      "Built what the distribution supports instead: close the transient that already recovered — 73
      of 123 alerts, an independent witness, zero side effects. The predecessor also shipped the ONE
      operative cure the alerts themselves name (`rm -f` the healer pidfile); the gate showed that
      one was justified by a family count worn as an entity count, and it is gone. The registry is a
      dict — a third family is one function plus its guilt/innocence pair, admitted on the rule now
      written into the brief: measure the ENTITY, where the organ runs."
  - seat: session (declared limit, unresolved)
    objection: >-
      "This PR now ships exactly one cure, and on the day it lands the board holds one row that cure
      cannot match. Its first hours of runs will read `0 closed, 1 left open` — indistinguishable,
      from the outside, from an organ that does not work."
    status: CONFIRMED
    resolution: >-
      "Declared in the docstring, in the brief objective and in the PR body rather than smoothed
      over, and the organ's heartbeat note carries closed/left/seen so the distinction is READABLE
      instead of argued: `seen` climbing while `closed` stays at zero would be the real defect, and
      it would be visible within a day. The alternative — waiting for the board to fill before
      landing the drainer — is how #6973's noise got to the board in the first place."
  - seat: session (declared limit, unresolved)
    objection: >-
      "The organ is born on Pro only. Mini carries ~101 p0/30d of its own, and the family whose cure
      was just removed — stale-lock — lives on MINI. The node that would most benefit from a second
      cure is the one this organ is not armed on."
    status: CONFIRMED
    resolution: >-
      "Declared rather than smuggled in: a second node means a second plist, wrapper, registry entry
      and declared pair, and the PR contract asks for one concern. Pro is first because it carries
      the routed volume and 100% of the provable cron-fail closures. The Mini twin — and, on Mini
      only, a re-argued stale-lock cure justified by the ENTITY's own rate rather than its family's
      — is the immediate follow-up, named in the PR body and not left to memory. At one occurrence
      in 74 days it may well not earn a cure at all, and that is the honest reading of the number."
  - seat: session (declared limit)
    objection: >-
      "The 73-closable figure is a retrospective read: it counts alerts whose job's LAST run is ok
      now. The consumer will run hourly, so its real hit rate could be higher (jobs that recovered
      and later failed again would have been closed in between) or lower. The state file keeps only
      the last run, so no better retrospective number exists."
    status: PLAUSIBLE
    resolution: >-
      "Labelled as a retrospective lower bound, not a forecast. The organ's sidecar note carries
      closed/left/seen every run, so the true rate becomes observable within a day of arming instead
      of being argued about."
  - seat: codex-gpt-5.6-sol (dissent recorded in the predecessor, now ACTED ON rather than noted)
    objection: >-
      "mark_resolved returns 1 even when the job was already resolved, which makes the
      `already_closed_by_a_peer` branch near-dead code rather than the protection it was written as."
    status: CONFIRMED
    resolution: >-
      "Recorded as a dissent in #6992 and left in the code, with a test that monkeypatched the
      return value to 0 so the suite still appeared to pin it. The gate called that what it was.
      Branch and test are removed here: a protection that cannot execute is worse than an absent
      one, because its test makes the absence invisible."
