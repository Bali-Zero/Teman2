# Floor measured this session: `python3 scripts/evidence_pack_lint.py --print-floor
# --print-floor-source --numstat-file <numstat> --changed-files-file <changed>` on
# `git diff origin/main...HEAD` (450 lines added, 0 removed, 4 files) returns `2` /
