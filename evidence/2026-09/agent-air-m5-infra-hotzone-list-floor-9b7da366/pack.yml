what_changed: |
  .github/workflows/harness-floor.yml gains Step 2d ("Hot-zone list may only grow below floor
  3"), placed before Step 3. When the diff touches scripts/evidence_pack_lint.py, it `git
  show`s the linter at the merge-base and at HEAD, and an inline Python heredoc parses
  HOTZONE_PATTERNS with `ast.parse` on BYTES (head code never executed in the trusted step;
  a PEP 263 coding cookie decodes as the interpreter will). HEAD dropping any merge-base
  pattern outputs floor3=true; so does anything unprovable (no merge-base, a failed `git
  show`, a deleted linter, the name not bound ONCE at module level to a tuple of str
  literals, or a casual computed-name rebinding primitive such as exec, globals(), setattr
  or __dict__). Step 3 applies the verdict (`HZLIST_FLOOR3 != "false"` -> FLOOR=3; source
  none->path, size->both) and the job summary gains a line for it.

  Coordinator ruling 2026-09-27 (option B, not a council round) adds the BEHAVIOURAL check,
  in scripts/tests/test_harness_floor_hotzone_list.py, run by the required guard-conformance
  job: the HEAD linter, launched as harness-floor Step 3 launches it (`python3
  scripts/evidence_pack_lint.py --print-floor` as __main__, with --numstat-file and a
  --patch-file holding the diff's non-pin workflow patch, and its real import closure incl.
  scripts/conductor/review_eligibility.py), must floor one concrete path per pattern of
  hot-zone-pr-gate.yml's case-block at 3. The tuple and the case-block must be the same list,
  blocking in both directions with a message naming each side's extras; the step's old drift
  warning is removed. The test file joins BOTH lists, so weakening it is itself a floor-3
  edit. guard-conformance.yml runs it as `python3 -P -m pytest --import-mode=importlib
  --noconftest -c /dev/null --rootdir .`, which shuts out the four measured floor-1 shadows
  (a yaml.py at the root or in scripts/, an ini with `pythonpath`, a conftest), and a test
  pins each of those four flags; a package __init__.py on the test's import path is not
  shut out (G1, declared under `residual`). Its relevance
  filter and push paths now cover the test, both workflows and the conductor modules.

  Fresh gate on 874a704e18 (PASS-WITH-CONDITIONS): C-1 merged origin/main (#7489's seven S5
  egress patterns and its test_hotzone_lists_sync.py kept; both lists union-resolved to 23);
  C-2 is the Step 3 inputs above; C-3 is the hardened invocation; C-4 is the residual below.

  The same test file also runs the REAL Step 2d text taken from the YAML: the heredoc's
  functions in-process, Step 2d's bash in a scratch git repo (including a main that moved on
  after the fork), and Step 3 against the real linter.

  Design choices, each argued in the step comment or the test: `ast` rather than
  model_routing_gate.py's regex (the regex reads a commented-out `# "fly.toml",` as still
  present, measured); an inline parser rather than a script (a script under scripts/ci/ is
  floor 1 and neuterable); the behavioural oracle is the case-block because it lives in a
  workflow file, which floors 3 to narrow. Consequence, stated: every change to the hot-zone
  list now edits hot-zone-pr-gate.yml too, and so floors 3 by path; Step 2d itself still does
  not raise the floor for an addition.

residual: |
  What B DOES: it makes a narrowing of the floor DELIBERATE rather than accidental. A
  narrowing active whenever the linter runs with Step 3's inputs, whatever its mechanism,
  turns a required job red unless something is ALSO planted to blind the check (G1 below):
  a rebinding in the linter (pickle, runpy, marshal, exec), a
  module planted and imported by it, a floor-1 module of its import closure patching fnmatch
  or the name, compute_floor() rewritten, the first-party-pin exemption widened (the gate's
  R4), or a yaml.py shadow planted in scripts/ or at the root (the gate's R3c/R3d). Each of
  those shapes is a guilt case or a mutant of the real closure.

  What B DOES NOT DO, stated plainly:
  - a deliberately evasive FLOOR-1 edit to the linter or its closure is still ungated. The
    gate measured two (49 passed, production floor 1): an exemption of specific real paths
    under a glob the synthetic path (`*`/`?` -> x) still matches, and a narrowing keyed on
    how the process was invoked (argv), which a condition true only inside the harness-floor
    job would equally do. These are ordinary floor-1 edits, not workflow edits, so nothing
    floors them at 3; B only means they cannot happen by accident;
  - G1 (fresh delta gate on 010cbdcc07): code that pytest itself imports before the test
    module — a package __init__.py on the test's import path (scripts/tests/__init__.py,
    imported as `tests`; a new scripts/__init__.py, imported as `scripts`), including an
    unchecked-hash .pyc under __pycache__ — runs inside the pytest process under the
    hardened flags and can blind the check even for an UNCONDITIONAL narrowing in the
    closure (the gate measured 8 failed without the payload, 55 passed with it, production
    floor(fly.toml) 1, diff floor 1). A blanket module-level skip there is not a blind (rc 5
    under `set -euo pipefail`). Declared rather than hardened: this surface already had its
    depth-1 correction, and hot-zoning the .py path alone is bypassed by the .pyc;
  - the interpreter and its site-packages (the runner's own environment);
  - the shadow test's own final assertion: it is protected by the file being hot-zone, not
    by a further test (MB8, the real check's assert, is now killed through that test);
  - Step 2d's computed-name denylist remains a bar-raiser, and its false positives are not
    a floor bump: one innocent `getattr`, `setattr`, `import importlib` (any DYN_* name) in
    the linter turns the REQUIRED guard-conformance job red (test_innocence_real_linter_parses
    and the drift test cannot read the tuple). In effect those identifiers are banned from
    the linter until the denylist is changed in a hot-zone edit.

proof: |
  Corpus: python3 -P -m pytest --import-mode=importlib --noconftest -c /dev/null --rootdir .
  -p no:cacheprovider scripts/tests/test_harness_floor_hotzone_list.py -> 55 passed (Step 2d
  guilt, innocence and wiring; drift; the behavioural check on the real linter and on copies
  of its closure; the job-invocation shadow test).

  Mutation, one sweep on the merged tree with the job's invocation, cp backups, every restore
  byte-identical: 34 mutants, all killed. Step 2d and its wiring: M1-M10, N1-N8 (N8 is the
  gate's surviving S5, the ImportFrom clause, now pinned by a from-importlib shape).
  Behavioural and drift: MB1-MB8 (MB8, the real check's assert made vacuous, is now killed by
  the shadow test's nested run). C-2: C2a/C2b (the probe drops --patch-file / --numstat-file)
  and C2c/C2d (R4 and a numstat-keyed narrowing on the REAL linter). C-3: C3a-C3d each drop
  one of -P, --import-mode=importlib, -c /dev/null, --noconftest from the job line.

  Neighbours on the final tree: actionlint with shellcheck is clean on the three touched
  workflows; lint_workflow_errexit_decap, lint_workflow_script and lint_workflow_timeout_floor
  are clean; check_guard_conformance.py reports 0 violations; evidence_pack_lint --selftest
  PASS; test_evidence_pack_lint.py, test_hotzone_lists_sync.py (main's, kept),
  test_check_required_workflow_conformance.py, test_harness_gate_read.py,
  test_agent_defs_model_pins.py and test_hooks_fail_open_on_garbage_payload.py give 891
  passed. Found, NOT fixed here (another concern, pre-existing): model_routing_gate.py's
  regex reads only 15 of the tuple's patterns on origin/main, on the merge-base and on this
  head alike — `[^)]*` stops at the `)` inside #7489's S5 comment. That hook is fail-open
  routing economy, not a gate; the same regex fragility is why Step 2d parses with `ast`.
  scripts/tests/test_harness_floor_bootstrap_sentinel.sh fails 1 scar-pin on this branch AND
  on origin/main's harness-floor.yml (measured with a cp swap in round 1); pre-existing, run
  by no workflow, out of scope.

  Council: codex-gpt-5.6-sol and kimi-code/k3 ran on the diff only, each isolated (codex:
  env -i HOME/PATH, read-only sandbox, empty cwd; kimi: kimi_client.run with the no-tools
  agent-file, a scrubbed env and an empty cwd). There was one fix round and one delta
  round, the coordinator's cap. Round 1: sol NO-GO, kimi GO-WITH-NITS (plus a non-roster
  gpt-6-astra REWORK). Delta: sol REWORK, kimi REWORK, both on the same residual class.
  The coordinator then ruled option B (2026-09-27, not a council round; journal line
  "coordinator"). The fresh Gear-3 gate on 874a704e18 returned PASS-WITH-CONDITIONS
  (C-1..C-4 above, all builder work). The fresh delta gate on 010cbdcc07 returned
  PASS-WITH-CONDITIONS with one new finding, G1, cured by declaring it (text only: brief,
  pack, PR body); a fresh delta gate judges that head.

dissent:
  - seat: codex-gpt-5.6-sol
    objection:
      'Round 1 HIGH: computed-name rebinding keeps the literal but shrinks the runtime list:
      exec("HOTZONE_" + "PATTERNS = ()"), globals()["HOTZONE_" + "PATTERNS"] = ...'
    status: CONFIRMED
    resolution:
      "Partially: a denylist of casual primitives (bare exec/eval/globals/vars/getattr/setattr/
      __import__, attributes __dict__/__globals__/f_globals/modules, imports of builtins/
      importlib/inspect/gc/ctypes/operator) now fails closed. The builder separately found and
      closed a utf-7 coding-cookie evasion by parsing bytes. The delta round showed the
      denylist is NOT a proof (next two entries)."
  - seat: codex-gpt-5.6-sol
    objection:
      "Delta HIGH: the denylist cannot prove absence of rebinding; pickle.loads(b'cbuiltins\\nexec...')
      rebinds with no denylisted token. Delta HIGH: the declared consumer-rewrite limit
      (def compute_floor(*a, **k): return 1) is not acceptable as a completed control; land a
      BASE compute_floor replay or make the linter floor 3 in this PR."
    status: CONFIRMED
    resolution:
      "Not by a further denylist fix (that would be a fix-of-a-fix past the round cap): the
      step comment says the denylist is a bar-raiser, not a proof. The class was handed back
      as a spec choice, and the coordinator ruled option B (2026-09-27, not a council round):
      a BEHAVIOURAL check in the required guard-conformance job. The HEAD linter, run as CI
      runs it with its real import closure, must floor one concrete path per case-block
      pattern at 3, so the pickle payload, a planted module and a rewritten compute_floor()
      all turn the job red whatever their mechanism (guilt cases + mutants MB1/MB2). What B
      does not close is stated under `residual`."
  - seat: kimi-code/k3
    objection:
      "Delta HIGH: the denylist is bypassable at import time via runpy.run_path, pickle
      (GLOBAL -> builtins.eval), marshal+types.FunctionType or site; fix with an import/call
      allowlist for this one pinned file, or re-declare as a residual limit rather than FIXED."
    status: CONFIRMED
    resolution:
      "An allowlist was not taken: the linter imports scripts/conductor/review_eligibility.py,
      a floor-1 module that can mutate the linter's globals at import time without touching
      the linter, so an allowlist would be another bar-raiser. The class is closed by
      behaviour instead, per the coordinator ruling (option B, same entry as above): runpy,
      pickle and marshal payloads all narrow what the real linter returns, which is what the
      check observes."
  - seat: codex-gpt-5.6-sol
    objection: 'Round 1 HIGH: a harmless string constant equal to "HOTZONE_PATTERNS" floors an unrelated edit at 3; local shadowing, a parameter or an attribute store named HOTZONE_PATTERNS do too.'
    status: CONFIRMED
    resolution:
      "String constants are no longer scanned (three innocence cases pin it). Kept on purpose:
      a local shadow, a parameter or an attribute store still floors 3, because a local shadow
      inside compute_floor IS the evasion, and telling it apart from an unrelated helper needs
      the consumer set. Both seats judged this acceptable in the delta round."
  - seat: kimi-code/k3
    objection: 'Round 1 MEDIUM: same string-constant false positive (HELP = "HOTZONE_PATTERNS", __doc__ = ...).'
    status: CONFIRMED
    resolution: "Same fix as above: ast.Constant is skipped by the field scan."
  - seat: codex-gpt-5.6-sol
    objection:
      "Round 1 HIGH: the drift pin was a pytest in a floor-1 test file, so a floor-1 PR could
      neuter it; MEDIUM: 'adding keeps the floor' is unachievable if drift blocks."
    status: CONFIRMED
    resolution:
      "Round 1 moved drift into Step 2d as a warning. The coordinator ruling (option B)
      replaces that: drift is now BLOCKING in the test, in both directions, and the test file
      is itself in both hot-zone lists, so EDITING it is a floor-3 edit. The floor-1
      objection is answered for the test file only: blinding it from a package __init__.py
      on its import path is still a floor-1 edit (G1, declared under `residual`). The MEDIUM is answered too: an addition to the tuple must
      also be added to the case-block, which is a workflow edit that floors 3 by path; Step 2d
      itself still does not raise the floor for an addition."
  - seat: codex-gpt-5.6-sol
    objection: "Round 1 MEDIUM (also codex-gpt-6-astra): tests injected BASE_SHA/HEAD_SHA directly, so a mutant comparing HEAD with itself survived; no unparseable-base or diverged-history case."
    status: CONFIRMED
    resolution: "test_step_2d_wiring pins both SHA expressions, the shared if: with Step 3, ordering and the env passthrough; guilt-unparseable-base and innocence-main-moved-on (W102) added; both mutants now killed."
  - seat: codex-gpt-5.6-sol
    objection: "Round 1 MEDIUM (also astra LOW): the case-block regex read a commented decoy and rejected a one-line arm. Delta MEDIUM: a second arm inside the one case statement is silently unread."
    status: CONFIRMED
    resolution:
      "Round 1 fixed (anchored `^[ \\t]*case \"$f\" in`, one-line arm accepted, both pinned).
      The delta's multi-arm gap is closed as part of the ruling's rewrite, since the reader
      now feeds a blocking check: it reads the whole statement up to `esac` and refuses a
      second arm or a second statement (test_case_block_reader; mutant MB5 killed)."
  - seat: kimi-code/k3
    objection: "Round 1 MEDIUM: if the kill switch skipped hzlist but not detfloor, the absent verdict would RAISE the floor the switch exists to bypass."
    status: RETRACTED
    resolution: "Both steps carry the identical `if: steps.kill_switch.outputs.disabled != 'true'`, now pinned by test_step_2d_wiring; kimi's delta round listed the pin as sound."
  - seat: kimi-code/k3
    objection: "Round 1 MEDIUM: head objects must be fetchable from the base checkout, or every linter edit floors 3 with only a warning."
    status: PLAUSIBLE
    resolution: "Not changed: Step 2 (scripts/ci/hotzone_changed_files.sh) already fetches HEAD_SHA and deepens for the merge-base before Step 2d, and a missing object prints git's own fatal line next to the floor-3 warning, which now names the merge-base state."
  - seat: codex-gpt-5.6-sol
    objection: "Delta LOW (also kimi delta LOW): the guard-conformance step's `pip install pyyaml pytest` is unpinned and network-dependent."
    status: CONFIRMED
    resolution: "Accepted as the repo's existing convention: the neighbouring Evidence Pack lint step in the same job runs the identical unpinned line under the same `if:`. Not a new dependency class."
  - seat: kimi-code/k3
    objection: "Delta LOW: denylist false positives on future legitimate edits (a bare getattr, import importlib); drift message prints the whole tuple as one-sided when the case-block is unreadable; floor_source loses the hzlist reason."
    status: CONFIRMED
    resolution: "Declared (post-delta, no further round): the step comment names the false-positive trade-off, repeated under `residual`; an unreadable list now fails the drift test with 'a list could not be read — drift cannot be ruled out' instead of a one-sided print; floor_source keeps its exact-match vocabulary, and the job summary carries a separate Step 2d line."

