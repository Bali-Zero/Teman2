  net_lines: |
    Measured against origin/main; the three evidence files are included in the integers
    above. The reviewable change is the Step 2d block plus its Step 3 wiring, the test corpus
    and the guard-conformance wiring, about 315 net lines, over the coordinator's ~250 target.
    The excess is the round-1 council fixes (the computed-name denylist, bytes parsing, the
    drift flag moved into the protected step, and the wiring, W102 and utf-7 cases), kept in
    this PR instead of a second one, per the Contract's preference for closing a finding
    where it is found.
