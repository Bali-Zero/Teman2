dissent:
  - seat: gemini-3.1-pro
    objection: The comment's --line-control contrast of 4.06:1 on paper is arithmetically wrong.
    status: CONFIRMED
    disposition: >-
      Recomputed independently: 3.84:1 on paper, 4.12:1 on a card. Gemini's own 3.86 was also off. The comment
      now carries both numbers and names the 3:1 SC 1.4.11 floor the token exists to clear.
  - seat: gemini-3.1-pro
    objection: >-
      The nested `body { font-family }` rule may throw in a strict parser, or may resolve to
      [data-product="kita"] body and never apply if the attributes sit on <body>.
    status: RETRACTED
    disposition: >-
      Both halves are empirically false here. The attributes are on <html> — the same browser run read
      document.documentElement.dataset.product — and the measured body font-family is Manrope in both themes.
      The already-shipped [data-product="my"] seam carries the identical bare-`body` form in production. The
      rule was still rewritten to the canonical `& body` inside the two kita blocks only, removing the
      dependency on relaxed nesting; the my blocks keep their bare form byte-identical.
  - seat: gemini-3.1-pro
    objection: >-
      The greys #dad8d1, #a8aca9 and #767c82 are invented and absent from the stated alphabet.
    status: RETRACTED
    disposition: >-
      #dad8d1 and #a8aca9 are already declared in the shipped [data-product="my"] R19 seam and appear in all six
      frozen renders. #767c82 is the round-2 control-boundary token ruled in DISPOSITION.md C13 and measured in
      MEASURE.md §3 (136 control boundaries, 0 below 3:1). Nothing was invented.
  - seat: claude-opus-5
    objection: >-
      --bz-card-hover equals --bz-base on light, so a row hovering directly on the canvas has an invisible hover.
    status: CONFIRMED
    disposition: >-
      This is the alphabet, not a defect of this PR: the shipped my seam declares exactly --bz-card-hover
      #f7f4ee. Hover stays visible on a card (#fffcf7). FROZEN.md requires a reason for a deviation, so the
      value is kept and the canvas-row case is handed to K2 with the dashboard rows.
  - seat: claude-opus-5
    objection: >-
      /login will render Fraunces and Manrope as fallbacks between this PR and K1d, because the font import
      belongs to the login PR.
    status: CONFIRMED
    disposition: >-
      The theme blocks name the faces; app/portal/r19-fonts.css declares them and is imported here only by
      (workspace)/layout.tsx. /login therefore falls back to Georgia and system-ui until K1d lands the same
      import, which is hours. Keeping K1a to tokens + fonts + contract tests was the imperator's instruction and
      the split is worth one interim.
