pii_scan: clean
pii_scan_note: >-
  The loop reads the public KBLI classification (codes, OSS scope rows) and
  the public OSS endpoint; no client data, OSINT or credential is read,
  written or quoted. OSS_RBA_USER_KEY is a public app credential and is only
  ever reported as present/absent. Test fixtures are synthetic.

