brief_ref: evidence/brief.yml
council_run: journal.jsonl
plan_ref: >-
  Zero, 2026-09-22 (/modus gear 2 — F4): the OSS refresh loop that closes the
  licensing gaps by itself, as a Mini organ with heartbeat on outcome, never a
  catalogue-wide write; run the first real loop after merge and paste its
  summary. Spec on disk: session scratchpad f4-spec.md (GROUND facts + design).

lanes:
  - lane: build
    role: build
    seat: claude-opus-5
  - lane: review-cross-family-codex
    role: review
    seat: codex-gpt-5.6-sol
  - lane: refute-cross-family-kimi
    role: review
    seat: kimi-code/k3

what_changed: |
  NEW scripts/kbli_filiera/oss_refresh_loop.py (population from
  build_scoreboard, one persistent keep-alive connection, 404/401/403
  terminal, bounded retry + Retry-After incl. HTTP-date, wall-clock deadline
  -> deferred, payload identity check Kbli.id == uuid and kode prefix, full
  risk-row validation, two positive controls, exit 0/1/2/4, dry-run default,
  --apply writes report + summary + cure spec only on exit 1, through no
  symlink via mkstemp); NEW wrapper infra/launchagents/wrappers/
  kbli-oss-refresh-run.sh (kbli-surface-conformance pattern, Mini-only host
  guard, heartbeat on OUTCOME, kill switch); NEW weekly plist + Mini-only
  installer; organs_registry.yaml mini.kbli_oss_refresh (checksum patched in
  place, not re-dumped); connectome edge on launchd-m5-mini.yaml;
  kbli-filiera-vault-compilers.yml paths widened so the wrapper + plist
  changes run the (blocking) battery that holds their tests; 2 test files.

proof: |
  See receipts. Deterministic floor 3 / path. Loop + wrapper suites green;
  full kbli_filiera battery green; organ conformance 0 non-conformant
  births; baseline ratchet holds; registry valid; ruff + shellcheck clean.
  17 of 17 guard mutants killed on HEAD. A full real dry-run from M5 over
  the whole population asked and fetched all 219 in 107 s with both controls
  identity-clean and 0 errors, and found 10 scopes OSS now publishes (8
  published on an empty gap, 2 changed) -- exit 1, nothing written. The loop
  is not a no-op on day one: its first Mini run will hand those 10 to the
  owner as a cure spec, never to the canonical.

dissent:
  - seat: kimi-code/k3
    objection: >-
      Clause 1 refuted at loop level: decide_exit returned 0 "nothing new" when
      at least one answer was trusted, so 217 deferred + 2 still_404 read as
      nothing new; only the wrapper downgraded it.
    status: CONFIRMED
    resolution: >-
      The loop itself now exits 4 "partial: N of M code(s) got no trustworthy
      answer" whenever an asked code is deferred/errored/malformed and nothing
      was proposed (ea41a98967); the wrapper treats rc 0 over unanswered codes
      as a contradiction (loop_failure). Guilt test:
      test_one_unanswered_code_is_not_nothing_new.
  - seat: kimi-code/k3
    objection: >-
      Clause 3 refuted: nothing binds a 200 payload to the requested code, so
      a scope served for the wrong code (remapped uuid, cache) would be
      proposed as published.
    status: CONFIRMED
    resolution: >-
      Measured live that every scope carries Kbli.id == requested uuid and
      every risk row a kode "<code>-NN-NN"; payload_identity_mismatch makes
      any other payload malformed (ea41a98967). Three guilt tests.
  - seat: kimi-code/k3
    objection: >-
      Caveat on (b): a quarantined code's spec entry still embedded per_skala,
      set and drop_keys — the protection was a label a consumer must honour.
    status: CONFIRMED
    resolution: >-
      A quarantine_owner entry now carries only oss_rows + record_sha256 as
      evidence, nothing applyable (ea41a98967); asserted in
      test_cure_spec_shape_and_routes.
  - seat: codex-gpt-5.6-sol
    objection: >-
      F1 symlinked dir under --out-root, or a pre-planted predictable temp name
      (shared _hardened_cure_io.atomic_write_text), can redirect a write onto
      the canonical.
    status: CONFIRMED
    resolution: >-
      write_contained refuses any symlink between --out-root and the target
      and writes through tempfile.mkstemp + os.replace (8142c61628). The shared
      helper is not changed here (other compilers use it; single-user hosts).
      Guilt test: test_a_symlinked_output_dir_is_refused (mutation-killed).
  - seat: codex-gpt-5.6-sol
    objection: >-
      F2 a key containing a newline raises an uncaught ValueError whose text
      quotes the header value, landing the key in the wrapper log.
    status: CONFIRMED
    resolution: >-
      main refuses a key that is not a sendable header value (exit 4, value
      not printed); the session catches ValueError without echoing it
      (8142c61628). Two guilt tests.
  - seat: codex-gpt-5.6-sol
    objection: >-
      F3 one proposal + 218 errors: exit 1 and heartbeat ok.
    status: CONFIRMED
    resolution: >-
      Wrapper sets warning on rc 1 when errors or deferred are non-zero
      (8142c61628). Guilt test: test_new_scopes_from_a_partial_run_is_a_warning.
  - seat: codex-gpt-5.6-sol
    objection: >-
      F4 incomplete payloads accepted: no Resiko -> published with null risk;
      no SkalaUsaha on one row -> the row silently dropped from the proposal.
    status: CONFIRMED
    resolution: >-
      incomplete_risk_row requires every row to name scale and risk, else
      malformed (8142c61628). Live controls still pass. Guilt tests (2).
  - seat: codex-gpt-5.6-sol
    objection: >-
      F5 a PP28-vintage gap whose rows equal what OSS publishes reads
      unchanged and stays a gap forever.
    status: CONFIRMED
    resolution: >-
      For gap targets equal rows are a PUBLISHED provenance proposal; only the
      controls keep "unchanged" (8142c61628). Guilt test.
  - seat: codex-gpt-5.6-sol
    objection: >-
      F6 with both controls failed and a target looking published, verdict 4
      but an applyable cure spec is still built.
    status: CONFIRMED
    resolution: >-
      The spec is built only when the verdict is exit 1 (8142c61628). Guilt
      test: test_no_applyable_spec_beside_a_failed_control.
  - seat: codex-gpt-5.6-sol
    objection: >-
      F7 Retry-After as an HTTP-date is ignored.
    status: CONFIRMED
    resolution: >-
      _retry_delay parses HTTP-dates, capped at MAX_RETRY_AFTER_S (8142c61628).
  - seat: codex-gpt-5.6-sol
    objection: >-
      F8 replacing response.read() with b"" leaves the suite green: nothing
      protects the body drain the keep-alive reuse depends on.
    status: CONFIRMED
    resolution: >-
      The fake connection now refuses a request while the previous body is
      unread (like http.client), and a read timeout reconnects; the no-drain
      mutant fails 2 tests.

