<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WR2 Past Carousel Tagging</title>
<style>
  :root {
    --color-bg-antracite: #2C2F38;
    --color-bg-black: #000000;
    --color-text-white: #FFFFFF;
    --color-text-muted: #9CA3AF;
    --color-accent-yellow: #F4C430;
    --color-status-red: #C8102E;
    --color-status-green: #4ADE80;
    --color-card-bg: #1C1F26;
    --font-family: 'Montserrat', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-bg-antracite);
    color: var(--color-text-white);
    font-family: var(--font-family);
    padding: 24px;
    min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 2px solid var(--color-accent-yellow);
  }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; }
  h1 .accent { color: var(--color-accent-yellow); }
  .progress {
    color: var(--color-text-muted); font-size: 14px;
  }
  .progress b { color: var(--color-text-white); font-weight: 700; }

  .stage {
    display: grid; grid-template-columns: 540px 1fr; gap: 32px;
    background: var(--color-card-bg); padding: 24px; border-radius: 8px;
  }

  .preview {
    width: 540px; height: 675px;
    background: var(--color-bg-black);
    border-radius: 4px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .preview img { max-width: 100%; max-height: 100%; }
  .preview .skeleton {
    color: var(--color-text-muted); font-size: 14px;
  }

  .form {
    display: flex; flex-direction: column; gap: 18px;
  }
  .form-row {
    display: flex; flex-direction: column; gap: 6px;
  }
  .form-row label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--color-accent-yellow);
  }
  .form-row .help {
    font-size: 12px; color: var(--color-text-muted); line-height: 1.4;
  }
  .form-row input, .form-row select, .form-row textarea {
    background: var(--color-bg-black);
    color: var(--color-text-white);
    border: 1px solid var(--color-text-muted);
    padding: 10px 12px; border-radius: 4px;
    font-family: var(--font-family); font-size: 14px;
  }
  .form-row select { cursor: pointer; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: 2px solid var(--color-accent-yellow); border-color: var(--color-accent-yellow);
  }

  .actions {
    display: flex; gap: 12px; margin-top: 12px;
  }
  .actions button {
    flex: 1;
    background: transparent; color: var(--color-text-white);
    border: 1px solid var(--color-text-muted);
    padding: 12px 20px; border-radius: 4px;
    font-family: var(--font-family); font-weight: 700;
    font-size: 13px; letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .actions button:hover { background: var(--color-text-white); color: var(--color-bg-antracite); }
  .actions .primary {
    background: var(--color-accent-yellow); color: var(--color-bg-black);
    border-color: var(--color-accent-yellow);
  }
  .actions .primary:hover {
    background: var(--color-text-white); border-color: var(--color-text-white);
  }
  .actions .skip {
    border-color: var(--color-text-muted); color: var(--color-text-muted);
  }

  .done {
    text-align: center; padding: 80px 40px; background: var(--color-card-bg); border-radius: 8px;
  }
  .done h2 { font-size: 32px; margin-bottom: 16px; }
  .done p { color: var(--color-text-muted); margin-bottom: 24px; line-height: 1.6; }

  .help-link {
    margin-top: 24px; padding: 12px 16px; background: var(--color-bg-black);
    border-left: 3px solid var(--color-accent-yellow); border-radius: 4px;
    font-size: 13px; color: var(--color-text-muted); line-height: 1.5;
  }
  .help-link a { color: var(--color-accent-yellow); text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1>TAG PAST <span class="accent">CAROUSELS</span></h1>
  <div class="progress" id="progress">Loading...</div>
</header>

<div id="root"></div>

<div class="help-link">
  <b>What is this?</b> The agent works better when it knows what each past carousel was about.
  You see one carousel at a time. Pick the topic + 3 dropdowns. Click NEXT.
  Skip if you don't know — totally fine. <a href="/_damar-tag-guide-EN.md" target="_blank">Read the simple guide</a>
  if anything is confusing.
</div>

<script>
let allItems = [];
let currentIndex = 0;
let untaggedOnly = true;

const DOMAINS = [
  {value: "visa", label: "Visa / Immigration", hint: "KITAS, KITAP, B211B, work permit, residency"},
  {value: "tax", label: "Tax", hint: "SPT, PPh, NPWP, Coretax, tax deadline"},
  {value: "property", label: "Property / Real estate", hint: "SHGB, hak pakai, PBG, KKPR, leases, villa"},
  {value: "regulatory", label: "Regulatory / Labor (mixed)", hint: "Law changes, OSS, KBLI, BPJS, Permenaker, hiring"},
  {value: "health", label: "Health / Public health", hint: "Dengue, outbreaks, medical, vaccination"},
  {value: "brand", label: "Brand / Bali Zero itself", hint: "About us, services overview, milestone"},
];

const REGISTERS = [
  {value: "rituale", label: "Rituale (solemn)", hint: "\"Every quarter the perimeter tightens\""},
  {value: "analitico", label: "Analitico (fact-dense)", hint: "Lots of regulations + numbers"},
  {value: "ironico", label: "Ironico (dry call-out)", hint: "Pointing out an absurdity"},
  {value: "militante", label: "Militante (sentence-bomb)", hint: "Strong statement, short, direct"},
  {value: "pedagogico", label: "Pedagogico (explainer)", hint: "Step-by-step, teach the reader"},
  {value: "poetico", label: "Poetico (rare, emotional)", hint: "Reflective, slow rhythm"},
  {value: "tecnico", label: "Tecnico (acronym-heavy)", hint: "KITAS, PT PMA, hak pakai everywhere"},
];

const LAYOUTS = [
  {value: "cover-photo", label: "Cover photo (full-bleed photo + title)"},
  {value: "photo-headline-yellow-sub", label: "Photo + headline + yellow subheadline"},
  {value: "qa-dialogue", label: "Q&A dialogue (two voices)"},
  {value: "timeline-pinboard", label: "Timeline / dates pinboard"},
  {value: "dark-status-list", label: "Dark + status list (FACTS / OUR TAKE)"},
  {value: "statement-bomb", label: "Statement-bomb (single-line closing)"},
];

const AUDIENCE = [
  {value: "founder", label: "Founder (building a business)"},
  {value: "investor", label: "Investor (buying property/assets)"},
  {value: "digital-nomad", label: "Digital nomad (remote worker)"},
  {value: "retiree", label: "Retiree (KITAP, retirement visa)"},
  {value: "mass-tourist", label: "Tourist (short-stay visa)"},
  {value: "mixed", label: "Mixed / general"},
];

async function load() {
  try {
    const res = await fetch('/api/past');
    allItems = await res.json();
    if (untaggedOnly) {
      allItems = allItems.filter(it => !it.is_tagged && !it.metadata.skipped_by_damar);
    }
    if (allItems.length === 0) {
      document.getElementById('root').innerHTML = `
        <div class="done">
          <h2>ALL DONE 🎉</h2>
          <p>Every carousel has a tag. Nothing more for you to do here.</p>
          <p>You can go back to <a href="/" style="color:#F4C430">the queue</a> or pick anchors at <a href="/anchors" style="color:#F4C430">/anchors</a>.</p>
        </div>
      `;
      document.getElementById('progress').textContent = 'Done';
      return;
    }
    currentIndex = 0;
    renderOne();
  } catch (e) {
    document.getElementById('root').innerHTML = `<div class="done"><h2>Error</h2><p>${e.message}</p></div>`;
  }
}

function renderOne() {
  const total = allItems.length;
  const item = allItems[currentIndex];
  document.getElementById('progress').textContent = `Carousel ${currentIndex + 1} of ${total}`;

  const meta = item.metadata;
  const cover = item.cover_path ? `/${item.cover_path}` : null;

  document.getElementById('root').innerHTML = `
    <div class="stage">
      <div class="preview">
        ${cover ? `<img src="${cover}" alt="cover slide">` : '<div class="skeleton">No cover image</div>'}
      </div>
      <div class="form">
        <div class="form-row">
          <label for="topic">Topic — what is this carousel about?</label>
          <div class="help">A few words, dash-separated. Example: <code>kep71-spt-extension</code> or <code>marina-tuka-shutdown</code>. Lower-case.</div>
          <input id="topic" type="text" placeholder="example: golden-visa-myth" value="${escapeHtml(meta.topic_slug && meta.topic_slug !== 'unknown' ? meta.topic_slug : '')}">
        </div>

        <div class="form-row">
          <label for="domain">Domain — what topic family?</label>
          <select id="domain">
            <option value="">— pick one —</option>
            ${DOMAINS.map(d => `<option value="${d.value}" ${meta.domain === d.value ? 'selected' : ''}>${d.label} — <i>${d.hint}</i></option>`).join('')}
          </select>
        </div>

        <div class="form-row">
          <label for="audience">Audience — who is this for?</label>
          <select id="audience">
            <option value="">— pick one —</option>
            ${AUDIENCE.map(a => `<option value="${a.value}" ${meta.audience_segment === a.value ? 'selected' : ''}>${a.label}</option>`).join('')}
          </select>
        </div>

        <div class="form-row">
          <label for="register">Voice register — how does it sound?</label>
          <div class="help">Pick the closest match. The agent uses 7 register types — see help for examples.</div>
          <select id="register">
            <option value="">— pick one —</option>
            ${REGISTERS.map(r => `<option value="${r.value}" ${meta.tone_register_primary === r.value ? 'selected' : ''}>${r.label} — <i>${r.hint}</i></option>`).join('')}
          </select>
        </div>

        <div class="form-row">
          <label for="layout">Main layout — what does most slides look like?</label>
          <select id="layout">
            <option value="">— pick one —</option>
            ${LAYOUTS.map(l => `<option value="${l.value}" ${meta.layout_family_primary === l.value ? 'selected' : ''}>${l.label}</option>`).join('')}
          </select>
        </div>

        <div class="actions">
          <button class="skip" onclick="skipCurrent()">SKIP — DON'T KNOW</button>
          <button class="primary" onclick="saveCurrent()">SAVE & NEXT →</button>
        </div>
      </div>
    </div>
  `;
}

async function saveCurrent() {
  const item = allItems[currentIndex];
  const topic = document.getElementById('topic').value.trim();
  const domain = document.getElementById('domain').value;
  const audience = document.getElementById('audience').value;
  const register = document.getElementById('register').value;
  const layout = document.getElementById('layout').value;

  if (!topic || !domain || !audience || !register || !layout) {
    alert('Please fill all 5 fields, or click SKIP if you don\'t know.');
    return;
  }

  try {
    const res = await fetch('/api/tag-past', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        bucket: item.bucket,
        topic_slug: topic, domain, audience, register, layout_primary: layout,
      }),
    });
    const data = await res.json();
    if (!data.ok) {
      alert(`Save failed: ${data.error}`);
      return;
    }
    nextOne();
  } catch (e) {
    alert(`Save failed: ${e.message}`);
  }
}

async function skipCurrent() {
  const item = allItems[currentIndex];
  try {
    await fetch('/api/tag-past', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({bucket: item.bucket, skip: true}),
    });
    nextOne();
  } catch (e) {
    alert(`Skip failed: ${e.message}`);
  }
}

function nextOne() {
  currentIndex++;
  if (currentIndex >= allItems.length) {
    document.getElementById('root').innerHTML = `
      <div class="done">
        <h2>YOU FINISHED 🎉</h2>
        <p>All carousels you saw are now tagged. Thank you!</p>
        <p>Click <a href="/anchors" style="color:#F4C430">here to pick the 5 anchor images</a> or
           <a href="/" style="color:#F4C430">go back to the queue</a>.</p>
      </div>
    `;
    document.getElementById('progress').textContent = 'Done';
  } else {
    renderOne();
  }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

load();
</script>

</body>
</html>
