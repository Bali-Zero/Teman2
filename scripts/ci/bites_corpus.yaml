# Guilt + innocence corpus for scripts/ci/bites_parse.py --selftest.
# DATA, not code: it was 218 lines inside the module until 2026-09-04, when Zero
# ruled the module itself had to shrink. Each entry is one pack and the
# classification the parser must give it. `class` is one of absent / legacy /
# executable / malformed.
#
# Two forms. The compact one names only `observe:` (plus consumer/where/expect when
# they differ from the defaults) and the loader builds the pack around it. The
# verbatim one carries the whole `pack:` text, for fixtures that are ABOUT the YAML
# layer itself - duplicate keys, aliases, indentation, invisible characters.
#
# Invisible characters are written as \u escapes in double-quoted scalars on
# purpose: a corpus that carries a literal zero-width space is a file whose own
# reviewer cannot see what it says, which is the very defect these fixtures test.
#
# Adding a guard means adding BOTH a guilt and an innocence entry here
# (infra/guard-conformance enforces the pair).
- label: absent-no-bites-key
  pack: "gear: 3\nspend:\n  tokens: 1\n"
  class: absent
- label: absent-empty-document
  pack: ""
  class: absent
- label: legacy-prose-scalar
  pack: "gear: 3

    bites: Damar's next publish - the cover renders.

    "
  class: legacy
- label: legacy-block-without-observe
  pack: "gear: 3\nbites:\n  consumer: CI\n  observation: green on main\n"
  class: legacy
- label: ok-selftest
