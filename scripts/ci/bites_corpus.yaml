# RULED 2026-09-04 b — new fixtures for the two surviving shapes, named explicitly
# in the ruling rather than inferred from an existing pattern.
- label: guilt-python3-parent-escape-from-the-first-token
  observe: python3 ../x.py
  class: malformed
- label: guilt-python3-absolute-script-path
  observe: python3 /abs/x.py
  class: malformed
- label: guilt-python3-script-named-does-not-exist
  observe: python3 scripts/missing.py
  class: malformed
- label: guilt-python3-semicolon-after-an-in-tree-looking-path
  observe: python3 scripts/ci/x.py; id
  class: malformed
- label: guilt-fly-machine-run-bare
  observe: fly machine run
  class: malformed
  where: fly
- label: guilt-flyctl-deploy-bare
  observe: flyctl deploy
  class: malformed
  where: fly
- label: ok-fly-status-fly-alias
  observe: fly status -a nuzantara-rag
  class: executable
  where: fly
- label: ok-fly-image-show-fly-alias
  observe: fly image show -a nuzantara-rag
  class: executable
  where: fly

# kimi-code/k3 refuter pass on the two-shape cut (RULED 2026-09-04 b), reproduced
# before applying: brace expansion is a shell primitive `_guard_shell_composition`
# did not refuse, and it defeats the marker check by construction — see the
# comment on `shell_metachars` in bites_allowlist.yaml for the full mechanism.
- label: guilt-brace-expansion-defeats-the-observable-marker
  observe: python3 scripts/ci/{evil,evil}.py
  class: malformed
- label: ok-braces-in-the-sha-placeholder-are-not-an-escape
  observe: python3 scripts/ci/bites_parse.py --selftest {sha}
  class: executable

# kimi-code/k3, refuting the two-shape cut's final bytes, raised three more
# findings in the same pass — reproduced against the real guard functions
# before any of them were applied (see bites_parse.py's docstrings on
# `_subcommand_permitted`, `_check_fly` and `_guard_observable_script`).
- label: guilt-fly-image-show-extra-positional-before-any-flag
  # SOLE proof of _subcommand_permitted's exact-length check: matching only
  # words[0]/words[1] let `fly image show <ref>` through with <ref> unchecked,
  # and flyctl's `image show` does not reject the extra argv itself.
  observe: fly image show extra-ref
  class: malformed
  where: fly
- label: guilt-fly-status-extra-positional-after-a-flag-value
  # SOLE proof of the extra-argv loop in _check_fly: a positional planted
  # AFTER -a/--app's own value was never inspected by the subcommand-table
  # check (already past it) or by the flag check (only looks at `-` tokens).
  observe: fly status -a nuzantara-rag anyword
  class: malformed
  where: fly
- label: guilt-python3-marker-string-in-a-non-py-file
  # SOLE proof of the `.py`-suffix check: bites_allowlist.yaml itself carries
  # the literal marker string in its own `observable_marker:` key, so a byte
  # grep alone would have called this data file executable.
  observe: python3 scripts/ci/bites_allowlist.yaml
  class: malformed
