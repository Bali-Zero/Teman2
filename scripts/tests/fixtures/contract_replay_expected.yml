# contract_replay_expected.yml — the eight PRs closed unmerged in the audited
# window (#6633..#6682, 2026-09-16) plus the two successors that shipped the
# byte-identical content with the one-line cure. Head shas are PINNED (a PR
# head is immutable by sha; `refs/pull/N/head` re-fetches it on any clone) and
# `ci_red:` is what GitHub recorded, read with
#   gh pr view N --json headRefOid,statusCheckRollup
# on 2026-09-17 — never attested by a session.
#
# `expect:` is the verdict scripts/contract_verify.py --replay must reproduce
# for each context. RED = the preflight would have refused the push; GREEN = the
# cure passes; NOT-LOCALLY-PREVENTABLE = honest, no local run could have seen it.
# Consumer: scripts/tests/test_contract_replay.py — it reds the day the table in
# scripts/ci/contract_checks.yml drifts from what CI actually judges.
heads:
  6650:
    sha: 9f7e20b21b71edf7b0222e936d819d5b80834c01
    ci_red: ["E2E Tests (Playwright)", "Test Summary"]
    expect:
      "E2E Tests (Playwright)": NOT-LOCALLY-PREVENTABLE
      "R1 gate — adversarial review present": GREEN
      "Harness floor recompute": GREEN
  6655:
    sha: 311755b5d4cf60573afc8c9ec6bcd33b02697391
    ci_red: ["antidotes"]
    expect:
      antidotes: RED # PENDING-ARMS.md entry with 2 pipe segments (need >= 3)
      "R1 gate — adversarial review present": GREEN
  6660:
