  # ---------------------------------------------------------------------------
  # R1 (2026-07-06) — generator != grader T-GATE on research/audit deliverables.
  # Reference: docs/specs/rules-as-harness-and-simulation-chamber-v1.md section 2/R1.
  # Script: scripts/check_adversarial_review.py. Tests: scripts/tests/test_adversarial_review_gate.py
