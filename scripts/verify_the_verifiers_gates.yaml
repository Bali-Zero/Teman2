# verify_the_verifiers_gates.yaml — declarative registry of safety gates
#
# The FACTS (which gate, where, how to tell if armed) live HERE, separate from
# the LOGIC (scripts/verify_the_verifiers.py). This is the meta-verifier of
# P1 §4 (verify-the-verifiers): it renders OBSERVABLE when a gate is DISARMED.
#
# DISCIPLINE (anti-hallucination, cicatrix phantom-citation 2026-06-05):
#   Every `target` / `registered_in` / `consumer` path below was verified to
#   exist on disk on 2026-06-07. The P1 spec AND the session handoff both cited
#   imprecise paths (guardrails-static.py lives in ~/.claude/hooks/ not scripts/;
#   backend_stability_gate.py in apps/backend-rag/scripts/ not scripts/). Gates
#   are registered by VERIFIED path, never by spec-name. When adding a gate,
#   `find`/`ls` the path in THIS turn before adding it.
#
# kind:
#   claude_hook  — a hook registered in ~/.claude/settings.json. Armed = (target
#                  file exists) AND (its command in settings.json does NOT contain
#                  the disarm_substring).
#   ci_workflow  — a GitHub Actions workflow. Armed = each listed step has
#                  continue-on-error == expected (a deterministic safety check
#                  must be `false`; a monitor-by-design step stays `true`).
#   lint_script  — a standalone lint. Armed = (script exists) AND (it has a
#                  consumer: a CI workflow or .husky hook that runs it).
#                  consumer: null  → WARN "gate without consumer" (not FAIL).
#
# canary (optional, --canary local run only): proves the disarm LEVER works —
#   sets the env and asserts the gate self-disarms. NOT run in CI (would set
#   dangerous env). It validates "the gate is disarmable-but-currently-armed".

version: 1

gates:
  - id: stop_verify
    kind: claude_hook
    target: ~/.claude/hooks/stop_verify.py
    registered_in: ~/.claude/settings.json
    event: Stop
    disarm_substring: "STOP_VERIFY_ALLOW_DIRTY=1"
    canary:
      env: { STOP_VERIFY_ALLOW_DIRTY: "1" }
      expect: disarmed
    note: >
      Self-demonstrated GAP-1: this hook was disarmed (ALLOW_DIRTY=1 hardcoded
      in the settings.json command) and nobody knew. Re-armed 2026-06-07.

  - id: worktree_isolation
    kind: claude_hook
    target: ~/.claude/hooks/worktree_isolation.py
    registered_in: ~/.claude/settings.json
    event: PreToolUse
    disarm_substring: "AGENT_WORKTREE_ENFORCEMENT=false"
    canary:
      env: { AGENT_WORKTREE_ENFORCEMENT: "false" }
      expect: disarmed

  - id: worktree_file_write_check
    kind: claude_hook
    target: ~/.claude/hooks/worktree_file_write_check.py
    registered_in: ~/.claude/settings.json
    event: PreToolUse
    disarm_substring: "AGENT_WORKTREE_ENFORCEMENT=false"
    canary:
      env: { AGENT_WORKTREE_ENFORCEMENT: "false" }
      expect: disarmed

  - id: orchestrate_gate
    kind: claude_hook
    target: ~/.claude/hooks/orchestrate_gate.py
    registered_in: ~/.claude/settings.json
    event: PreToolUse
    disarm_substring: "ORCHESTRATE_GATE_OFF=1"
    canary:
      env: { ORCHESTRATE_GATE_OFF: "1" }
      expect: disarmed

  - id: guardrails_client
    kind: claude_hook
    target: ~/.claude/hooks/guardrails-client.sh
    registered_in: ~/.claude/settings.json
    event: PreToolUse
    # No env disarm lever (daemon-or-static-fallback). Armed = registered + file exists.
    disarm_substring: null

  - id: stadio_zero_nudge
    kind: claude_hook
    target: ~/.claude/hooks/stadio_zero_nudge.py
    registered_in: ~/.claude/settings.json
    event: PreToolUse
    disarm_substring: "STADIO_ZERO_NUDGE_OFF=1"
    canary:
      env: { STADIO_ZERO_NUDGE_OFF: "1" }
      expect: disarmed
    note: >
      STADIO-0 STUDY entry-gate nudge (FASE-0 anti-forgetting half). Non-blocking
      by design (sys.exit(0) always) — a blocking gate on a judgment act invites
      empty STUDYs to unblock. Registering it here closes the loop: the meta-verifier
      (the FASE-0 decay-sensor) now observes whether STADIO-0 itself stays armed.

  - id: seam_verify
    kind: claude_hook
    target: ~/.claude/hooks/seam_verify.py
    registered_in: ~/.claude/settings.json
    event: Stop
    # No env disarm lever: the hook is purely advisory (sys.exit(0) always, never
    # blocks). Armed = registered under Stop + file exists. Same shape as
    # guardrails_client. Re-added 2026-06-09 now that P4 ships the real hook
    # (scripts/hooks/seam_verify.py, installed to ~/.claude/hooks via
    # install_fase0_governance.sh). Closes the W71-deferred gap: the meta-verifier
    # (FASE-0 decay-sensor) now observes whether the seam-verify reminder stays armed.
    disarm_substring: null
    note: >
      SEAM-VERIFY post-session reminder (P4 §3.5). Maps the git diff to the
      declared seams (router/middleware/manifest/import-chain) and advises which
      seam-test to run. Deterministic (not agent-inferred); testmon path deferred
      until pytest-testmon is installed. Non-blocking by design — it cannot know
      the agent didn't already run the test, and a false block on every dirty
      session would be worse than the gap it closes.

  - id: hot_zone_codeowners_self_mod
    kind: ci_workflow
    target: .github/workflows/hot-zone-pr-gate.yml
    step_anchor: "CODEOWNERS self-mod check"
    expected_continue_on_error: false
    note: >
      Deterministic security gate (anti CI-self-silencing). Flipped true->false
      by PR #1166 (interruttore 2). Until #1166 merges, main still shows `true`.

