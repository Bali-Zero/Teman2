  # ---------------------------------------------------------------------------
  - id: adversarial_review_gate
    kind: ci_workflow
    target: .github/workflows/adversarial-review-gate.yml
    step_anchor: "R1 gate — adversarial review present"
    expected_continue_on_error: false
    note: >
      Deterministic safety gate (R1): every new/changed research/**/*.md in a PR must
      declare `adversarial_review: <seat != author>` in frontmatter + a matching
      '## Adversarial review' section, or an explicit `exempt-<reason>` value.
      Pure-stdlib checker, no network, no LLM. continue-on-error must stay false —
      this is the enforcing gate, not a monitor-by-design step (contrast
      hot_zone_redis_lease/p3_sandbox_runtime above, which intentionally stay true).
