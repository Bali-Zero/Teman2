        - workflow_step: Public-asset-refs lint (code names only assets that exist in public/)
        - workflow_step: TCC-Desktop-paths lint (no *.sh/*.py/*.plist hardcodes ~/Desktop/nuzantara)
        - workflow_step: Claude-headless-limits lint (tool-armed -p/--print carries --max-budget-usd)
        - workflow_step: Trusted-classifier extraction lists are import-closed
        - workflow_step: Claude-headless-model-pin lint (-p/--print carries --model)
        - workflow_step: Tailnet node verifier keys on DNSName, not HostName or an ssh alias
        - workflow_step: Pro main-puller corpus (the collision resolver)
        - workflow_step: Pro main-puller collision matrix stays on its reviewed baseline
        - workflow_step: Immune contracts self-test (the detector still detects)
        - workflow_step: Immune contracts registry matches the real emitters and consumers
        - workflow_step: known_gaps may only shrink (fetch main by name, then compare)
        - workflow_step: Immune contracts corpus (named, because scripts/tests/ gates nothing)
        - workflow_step: PENDING-ARMS ledger parses (report smoke, exit 0 signaler)
        - workflow_step: No phantom-operator lines in the ledger (strict-phantom gate)
    mapping: executed
    coverage: full
    caveat: >-
      python 3.11 (the job's setup-python pin) goes first on PATH, as a bare venv; every package a step pip-installs comes from the image's offline wheelhouse
    blocker: ""

  - name: "Harness floor recompute"
    workflow_file: .github/workflows/harness-floor.yml
    job_id: harness-floor
    purpose: Recomputes the deterministic gear floor from the diff (base-ref checkout, "grader self-protects"), compares it to the declared evidence/brief.yml gear, validates the Gear-3 pack and the Bites contract.
    trusted_base_required: true
    local:
      check: ctx.harness-floor
      where: container # the job checks out BASE and reads the candidate through git: its scripts are BASE's by construction
      expressions: true
      vars: {} # repository variables read 2026-10-07 (GET actions/variables): HARNESS_ENFORCEMENT is unset, so `vars.*` is '' as hosted
      trusted_files: [scripts/ci/harness_gate_read.py]
      steps:
        - workflow_step: Kill switch
        - workflow_step: Install linter dependency (PyYAML)
        - workflow_step: Enumerate changed files (merge-base anchored)
          env: { GH_TOKEN: "" } # the merge-base resolves inside the sandbox, so the PR-files API fallback that would read it never runs
        - workflow_step: Resolve this PR's evidence paths
        - workflow_step: Compute measured net lines (merge-base anchored, best-effort)
        - workflow_step: Capture workflow patch for the path-term exemption
        - workflow_step: Hot-zone list may only grow below floor 3
        - workflow_step: Compute deterministic floor from diff
        - workflow_step: Does this PR's own diff carry evidence/brief.yml?
        - workflow_step: Not a harness task (no brief, floor == 1 — not applicable)
        - workflow_step: NOTICE (grace period) then FAIL — floor==2 via the SIZE term alone, no evidence/brief.yml
        - workflow_step: FAIL — floor >= 2 diff with no evidence/brief.yml (no grace period applies)
        - workflow_step: Compare declared gear to the deterministic floor
        - workflow_step: Not a gated task (gear 1 — fable-gate not applicable)
        - workflow_step: Gear-3 — validate evidence/pack.yml against the Evidence Pack contract
        - workflow_step: Gear >= 2 — read the real gate verdict
          side: host # the verdict lives in a GitHub commit status: BASE's reader runs on the host and reads it with the operator's gh
          argv:
            - $PY
            - scripts/ci/harness_gate_read.py
            - --event-name
            - merge_group
            - --repo
            - "${{ github.repository }}"
            - --pr-head-sha
            - ""
            - --merge-group-head-ref
            - "${{ github.event.merge_group.head_ref }}"
            - --dispatch-sha
            - ""
          env: { GH_TOKEN: "" } # stripped from every trusted environment; gh answers with its stored login, a read
        - workflow_step: Bites contract — parse this PR's evidence pack
    mapping: executed
    coverage: full
    blocker: ""

  - name: "actionlint — workflow schema + expression gate"
    workflow_file: .github/workflows/actionlint.yml
    job_id: lint
    purpose: actionlint (pinned 1.7.12) over every workflow for schema/expression/untrusted-input errors, plus the workflow-timeout floor lint.
    trusted_base_required: true
    local:
      check: ctx.actionlint
      where: host # BASE floor lint + a version-pinned host binary, both reading the candidate's workflows as data
      trusted_files: [scripts/lint_workflow_timeout_floor.py]
      tool_pins: { actionlint: ACTIONLINT_VERSION } # host `actionlint -version` must equal the BASE job's pin, else BLOCKED
      host_modules: [yaml]
      steps:
        - workflow_step: Download actionlint (pinned version + sha256)
          not_applicable: >-
            the host binary stands in, version-checked against the BASE pin at plan time (path + sha256 in the env
            fingerprint); the linux_amd64 tarball hash does not apply to an arm64 Homebrew build
        - workflow_step: "Checkout-budget floor (a job's floor is the checkout, not its script)"
          argv: [$PY, scripts/lint_workflow_timeout_floor.py]
        - workflow_step: Lint all workflow files
          argv: [actionlint, -no-color, "-shellcheck="]
    mapping: executed
    coverage: full
    caveat: >-
      actionlint runs pyflakes on python `run:` blocks only when pyflakes is on PATH; neither Pro nor (as far as measured)
      ubuntu-latest has it, and the workflow does not pin that state.
    blocker: ""

  - name: "Every guard proves guilt AND innocence"
    workflow_file: .github/workflows/guard-conformance.yml
    job_id: conformance
    purpose: Guard-conformance census (registry vs code, proofs, phantoms, armed) plus ~27 hook/guard guilt+innocence corpora.
    trusted_base_required: true
    local:
      check: ctx.guard-guilt-innocence
      where: container
      git_index: true
      trusted_from_steps: true
      steps:
        - workflow_step: Did guard surfaces change?
          not_applicable: its body reads the event name through an expression; on merge_group it answers run=true, and the runner runs every step anyway
        - workflow_step: Conformance census (registry vs code, proofs, phantoms, armed)
        - workflow_step: W85 pin — documented-broken stash over-match still captured
        - workflow_step: Tilde/env target-resolver suite (blind-spot fixed 2026-07-06)
        - workflow_step: W83/W84 hook regression suites (previously unexecuted anywhere)
        - workflow_step: W92 write-dispatch fix + runtime-state allowlist (2026-07-11)
        - workflow_step: Segment-scoped remote-dispatch fix (6th over-match, 2026-07-11)
        - workflow_step: W105 nested-worktree removal (over-match + composition twin)
        - workflow_step: W117 ssh-dispatched discard of a remote main checkout
        - workflow_step: L04 lane check — the library decides correctly
        - workflow_step: L04 lane check — the decision reaches a real stop boundary
        - workflow_step: orchestrate_gate.py dispatch-vocabulary + disarm-notice suites
        - workflow_step: Guard fuzz/property corpus (worktree_isolation.py, 445 cases)
        - workflow_step: SubagentStop hook guilt+innocence (subagent_stop_verify.py)
        - workflow_step: Context-window guard + window jump corpora (previously unexecuted anywhere)
        - workflow_step: Secret-expansion guard corpus + Qwen installer refusal paths
        - workflow_step: Army watcher re-pipes the jumped-to pane (real tmux, 2026-09-19)
          # the body minus its two `sudo apt-get` lines: tmux is in the image (offline, no sudo), the rest is verbatim
          argv:
            - bash
            - -c
            - |
              set -euo pipefail
              command -v tmux
              tmux -V
              python3 -m pytest -q scripts/tests/test_wa_army_watcher_shell.py
        - workflow_step: Native child adapter + mandate ledger + Codex bridge suites
        - workflow_step: Vercel ignore-step guard + pointer (guilt, innocence, exit contract)
        - workflow_step: wa-mirror control API path confinement (roster-derived identity)
        - workflow_step: Evidence Pack lint guilt+innocence (evidence_pack_lint.py)
        - workflow_step: Hot-zone list floor guilt+innocence (harness-floor.yml Step 2d + behavioural)
        - workflow_step: Council-journal staging guilt+innocence (stage_council_journal.py)
        - workflow_step: PII receipt generator guilt+innocence (pii_receipt.py)
        - workflow_step: harness/fable-gate publisher pin (harness_fable_gate.py)
        - workflow_step: codex-spalla-trigger.sh secret-redaction guilt+innocence
        - workflow_step: redaction fail-closed guilt+innocence (bash_call_log, _redact_pii pass4, siblings)
        - workflow_step: injected_surface_sessionstart.sh never-silent guilt+innocence
        - workflow_step: Sentinel success (no guard surfaces changed)
    mapping: executed
    coverage: full
    caveat: >-
      real tmux and zsh in the image; the apt lines of the army-watcher step are its transcription's only change
    blocker: ""

  - name: "Visa Oracle fullstack smoke"
    workflow_file: .github/workflows/tests.yml
    job_id: visa-oracle-fullstack-smoke
    purpose: Disposable-DB fullstack smoke of Visa Oracle (backend.scripts.visa_engine.fullstack_smoke) with Playwright chromium.
    trusted_base_required: false
    local:
      check: ctx.visa-oracle-smoke
      where: container
      expressions: true
      runs_when: e2e-tests # the job's `if:` reads run_e2e_tests, as E2E's does
      memory: 7g
      bare_venv: false
      service_images:
        "ghcr.io/bali-zero/ci-mirror/postgres:15": "postgres:15"
      deps: # the backend closure plus node, the npm cache of the root lock, the lock's Playwright browser and psql (one recipe, shared)
        requirements:
          - apps/backend-rag/requirements.lock.txt
          - apps/backend-rag/requirements-ci-tools.txt
        packages:
          [
            pytest,
            pytest-cov,
            pytest-asyncio,
            pytest-mock,
            fakeredis,
            pytest-xdist,
          ]
        node: "24"
        npm: package-lock.json
        playwright: chromium
        apt: [postgresql-client]
        fetch:
          - url: https://openaipublic.blob.core.windows.net/encodings/cl100k_base.tiktoken
            sha256: 223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7 # pragma: allowlist secret — a public file's digest
            path: /tmp/data-gym-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
          - url: https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
            sha256: 293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63 # pragma: allowlist secret — a public file's digest
            path: /opt/wheels/en_core_web_lg-3.8.0-py3-none-any.whl
            install: true
      needs:
        changes: { result: success, outputs: { run_e2e_tests: "true" } }
      steps:
        - workflow_step: Setup Node.js
          not_applicable: the deps image carries node 24 (the official image's binary and npm); the plan checks the BASE pin against it
        - workflow_step: Cache uv package cache
          not_applicable: no cache layer; the deps image holds the closure the install step re-runs offline
        - workflow_step: Install backend dependencies (uv, lock-pinned)
        - workflow_step: Retry uv install once (timeout only, never a real resolution failure)
        - workflow_step: Guard — fail the job if uv install (or its one timeout-only retry) did not succeed
        - workflow_step: Install postgresql-client (bounded, fail-closed — scripts/ci/apt_install.sh)
        - workflow_step: Install Node dependencies
        - workflow_step: Cache Playwright browser binaries
          not_applicable: no cache layer; the deps image holds the browser
        - workflow_step: Install Playwright browsers
          not_applicable: >-
            needs root and network (apt-get for the OS libraries, the browser CDN); the deps image ran the lock's
            playwright-core `install --with-deps chromium` at plan time instead
        - workflow_step: Run the disposable-DB fullstack smoke
        - workflow_step: Retry the fullstack smoke once (known hang signature only, never a real assertion failure)
        - workflow_step: Guard — fail the job if the smoke (or its one hang-only retry) did not succeed
    mapping: executed
    coverage: full
    blocker: ""

