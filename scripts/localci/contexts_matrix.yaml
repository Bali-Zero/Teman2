# contexts_matrix.yaml — the 14 status contexts branch protection on main REQUIRES, each mapped
# to what a local run can honestly claim.
#
# `mapping: executed` means THE RUNNER EXECUTES IT (v0.4.0): `plan` reads `local` and plans one
# check, `local.check` (ctx.<slug>), that runs every step and is PASS only when every step it runs
# returns 0 and every other step is not_applicable with a reason. `local.steps` accounts for EVERY
# step of the BASE workflow job, matched by `workflow_step` (or a unique `workflow_step_prefix`):
#   argv: [...]          a transcribed command (`$PY` = the interpreter, `$BASE_SHA` = the plan's base)
#   (no argv)            the BASE `run:` body itself, verbatim, under bash -eo pipefail (container only)
#   not_applicable: why  recorded as such; never counted as run
#   not_run: why         the context is BLOCKED until it runs
# A BASE step the matrix does not name (other than actions/checkout and actions/setup-python), an
# expression the runner does not evaluate, or a host step that would execute candidate code makes
# the context BLOCKED. `where: host` = BASE scripts / version-pinned tools judging the candidate tree
# as data (trusted, sealed); `where: container` = the steps run in the candidate sandbox with the
# BASE copies of `trusted_files` laid over the candidate's, emulating the merge_group event. When
# the candidate rewrites a trusted file or the workflow, a green is reported BLOCKED: hosted judges
# with the candidate's copy, which the run did not execute. This file is operator input, like the
# runner: pass the trusted copy with --contexts-file, never the candidate's.
#
# Source of the 14 names: live branch protection read 2026-09-26 (gh api); cross-checked with
# infra/required.d/contexts.json (snapshot 2026-09-21, same 14 names, same workflow_file/job_id).
#
# trusted_base_required=true means the check's OWN logic (classifier / partitioner / guard and its
# self-test) must be taken from the BASE ref when judging a candidate, or a PR can self-approve.
# blocked = a precise obstacle stopped a full local run (see `blocker`, `partial_evidence`).
# not_implemented = no local mapping exists yet. not_applicable_rule = 0 today: no required context
# can be statically N/A (a required check must always report); per-diff N/A is the runner's
# change_map decision, not this file's.

summary:
  updated_at: "2026-10-07"
  required_contexts: 14
  executed: 4 # R1 gate, actionlint, Merah Putih, catE — by the runner, every BASE workflow step accounted for
  not_applicable_rule: 0
  blocked: 9
  not_implemented: 1
  never_claim_parity_for: # exactly the contexts the runner does not execute (machine-checked by the suite)
    - "E2E Tests (Playwright)"
    - "Backend Tests (Python)"
    - "CodeQL Analysis (python)"
    - "CodeQL Analysis (javascript)"
    - "Frontend Tests (Next.js) (mouth, true)"
    - "Every organ is born with its genes"
    - "antidotes"
    - "Harness floor recompute"
    - "Every guard proves guilt AND innocence"
    - "Visa Oracle fullstack smoke"
  parity_gaps: # steps of EXECUTED contexts whose hosted twin can differ from the local run
    - "catE-sovereignty-lint on a PR head: hosted runs the #40c model judgment (vendor key) and the PR-scoped prose scan; local runs the merge_group shape (whole tree, no model)"
    - "every container context runs the merge_group shape; PR-only steps (path sentinels) are not_applicable with reasons"

contexts:
  - name: "E2E Tests (Playwright)"
    workflow_file: .github/workflows/tests.yml
    job_id: e2e-tests
    purpose: Playwright specs of apps/mouth against a live FastAPI backend on :8000 with Postgres + Redis.
    trusted_base_required: false
    local:
      kind: cmd
      cwd: "."
      cmd: [npx, playwright, test, --config=playwright.config.ts] # run from apps/mouth after the backend is up
      needs: [python, node, postgres, network]
    mapping: blocked
    blocker: >-
      Job needs Postgres + Redis services, a uv lock-pinned backend install, a backend booted on :8000,
      `npm install` and `playwright install --with-deps` (network). Worktree node_modules and
      apps/backend-rag/.venv are symlinks into the main checkout, so installing or running from here
      writes outside the worktree (and `npm install/ci` from a worktree is banned: it corrupts the
      shared node_modules). No Postgres on this host (pg_isready absent); docker is up but no image was pulled.
    smallest_next_action: >-
      In an executor lane with its own clone: `docker run` a postgres:16 + redis, `npm ci` from that
      clone's ROOT, boot uvicorn, then `npx playwright test --list` (the credential-free collection
      step) as the first cheap proof before the full run.

  - name: "Backend Tests (Python)"
    workflow_file: .github/workflows/tests.yml
    job_id: backend-tests
    purpose: Aggregator over backend-static + 3 backend shards; proves the shards tiled the corpus exactly, using the BASE ref's partitioner.
    trusted_base_required: true
    local:
      kind: trusted_pytest
      cwd: apps/backend-rag
      modules: [scripts/ci/test_shard_tests.py] # only the partitioner corpus is locally runnable today
      needs: [python, postgres, network]
    mapping: blocked
    blocker: >-
      The shards run the whole backend pytest corpus (needs the lock-pinned backend deps and a
      Postgres); the partition guard needs shard receipts produced by those runs. Backend venv here is
      a symlink into the main checkout (writing through it is outside the worktree) and no Postgres is up.
    partial_evidence:
      - argv: [$PY, scripts/ci/test_shard_tests.py]
        rc: 0
        seconds: 0.4
        result: 31 tests OK (the partitioner's own guilt+innocence corpus, workflow step 4 of 8)
    smallest_next_action: >-
      Wire `trusted_pytest`: extract scripts/ci/shard_tests.py from BASE into a temp dir (workflow step 5),
      run its `--check` partition pass against the candidate's test tree without executing the shards
      (proves tiling, no Postgres needed); leave shard execution to a docker-backed lane.

  - name: "CodeQL Analysis (python)"
    workflow_file: .github/workflows/security.yml
    job_id: codeql
    purpose: GitHub CodeQL security-extended,security-and-quality analysis of the python source (matrix language=python).
    trusted_base_required: false
    local:
      kind: cmd
      cwd: "."
      cmd: []
      needs: [github_hosted]
    mapping: blocked
    blocker: >-
      GitHub-hosted CodeQL action (github/codeql-action init/autobuild/analyze) with no local executor;
      the `codeql` CLI is not installed on this host (`which codeql` -> not found). The job also
      self-skips per path (RUN_THIS_LANGUAGE) and uploads SARIF, so a local substitute would not be the same check.
    smallest_next_action: >-
      Do not emulate. Keep this context hosted-only; the local run reports it as BLOCKED(github_hosted),
      which caps the local overall at SUBSET_PASS — never PASS.

  - name: "CodeQL Analysis (javascript)"
    workflow_file: .github/workflows/security.yml
    job_id: codeql
