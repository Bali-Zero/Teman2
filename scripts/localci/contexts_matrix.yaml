  - name: "catE-sovereignty-lint"
    workflow_file: .github/workflows/catE-sovereignty-lint.yml
    job_id: catE-sovereignty-lint
    purpose: Category-E guardian — paid-Anthropic-endpoint ban (constructor + env assignment), ban-prose lint, Law-5 no-autonomous-publish lint, world-readable apps/*/.env, plus its own corpora.
    trusted_base_required: true
    local:
      check: ctx.cate-sovereignty
      where: container # the BASE corpora exercise the candidate's guard implementations
      git_index: true # the whole-tree prose scan enumerates with `git ls-files`
      trusted_files:
        - scripts/tests/test_ban_predicates.py
        - scripts/test_lint_paid_llm_entity.py
        - scripts/tests/test_lint_ban_prose.py
        - scripts/tests/test_vendor_authorization_fence.py
        - scripts/tests/test_typesafe_client_pin.py
        - scripts/tests/test_cate_trigger_parity.py
        - scripts/tests/test_cate_paid_budget.sh
        - scripts/lint/lint_ban_prose.py
        - scripts/lint/wr3_lint_autonomous_publish.py
        - infra/ban-prose/grandfathered.json
        - .github/workflows/catE-paid-anthropic-baseline.txt
      steps:
        - workflow_step: "ban-predicates — transcription parity + guilt/innocence"
        - workflow_step: "the guards' own corpora — the suites no gating workflow ran"
        - workflow_step: catE # its YAML name runs into ` #40 …`, which YAML reads as a comment: GitHub and the runner both see "catE"
        - workflow_step: Ban NEW paid Anthropic constructor (vs committed baseline)
        - workflow_step_prefix: "Ban ANTHROPIC_" # the full name spells the banned assignment shape
        - workflow_step: Paid-endpoint ban judged as an entity
          not_applicable: >-
            the model judgment needs a paid vendor key this host does not hold; hosted skips it too on merge_group
            and push (no PR base). On a PR head hosted runs it and this run has no counterpart (see never_claim_parity_for)
        - workflow_step: Prose must not spell a banned shape (blocking)
          env: { BASE_SHA: "", HEAD_SHA: "", PR_NUMBER: "", GH_TOKEN: "" } # merge_group: no PR base, so the whole tree is scanned
        - workflow_step: Law-5 autonomous-publish lint (blocking)
        - workflow_step: Ban world-readable apps/*/.env (perm > 0600)
    mapping: executed
    coverage: full
    blocker: ""
