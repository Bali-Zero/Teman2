# contexts_matrix.yaml — the 14 status contexts branch protection on main REQUIRES, each mapped
# to what a local run can honestly claim.
#
# `mapping: executed` means THE RUNNER EXECUTES IT (v0.4.0): `plan` reads `local` and plans one
# check, `local.check` (ctx.<slug>), that runs every step and is PASS only when every step it runs
# returns 0 and every other step is not_applicable with a reason. `local.steps` accounts for EVERY
# step of the BASE workflow job, matched by `workflow_step` (or a unique `workflow_step_prefix`):
#   argv: [...]          a transcribed command (`$PY` = the interpreter, `$BASE_SHA` = the plan's base)
#   (no argv)            the BASE `run:` body itself, verbatim, under bash -eo pipefail (container only)
#   not_applicable: why  recorded as such; never counted as run
#   not_run: why         the context is BLOCKED until it runs
# A BASE step the matrix does not name (other than actions/checkout and actions/setup-python), an
# expression the runner does not evaluate, or a host step that would execute candidate code makes
# the context BLOCKED. `trusted_from_steps: true` takes from BASE every script a step names (a step
# marked `trusted_scan: false` is a path sentinel and is not read); the BASE job's timeout-minutes
# is the context's budget. `where: host` = BASE scripts / version-pinned tools judging the candidate tree
# as data (trusted, sealed); `where: container` = the steps run in the candidate sandbox with the
# BASE copies of `trusted_files` laid over the candidate's, emulating the merge_group event. When
# the candidate rewrites a trusted file or the workflow, a green is reported BLOCKED: hosted judges
# with the candidate's copy, which the run did not execute. This file is operator input, like the
# runner: pass the trusted copy with --contexts-file, never the candidate's.
#
# Service-context keys the CodeQL entries use: `trusted_overlay` lays BASE's `trusted_files` over the sandbox tree and judges them (a candidate that
# changes one gets its green BLOCKED); `classifier` seals `needs.<job>` from a BASE classifier run at plan on the changed files; `version_sentinel`
# blocks unless hosted's newest analysis of the language reports the pinned CLI; `skip_is_pass` lets a leg whose every step an evaluated `if:` skipped
# be PASS (hosted reports success there: every skipped step an `if:` evaluated false or a matrix N/A, at least one the former); `with_pin` pins the action inputs and `uses_pin`
# the action ref a transcribed command stands for (BLOCKED when BASE's differs); `deps.codeql` is the pinned bundle, and the leg step's CODEQL_PIN is its one literal.
#
# Source of the 14 names: live branch protection read 2026-09-26 (gh api); cross-checked with
# infra/required.d/contexts.json (snapshot 2026-09-21, same 14 names, same workflow_file/job_id).
#
# trusted_base_required=true means the check's OWN logic (classifier / partitioner / guard and its
# self-test) must be taken from the BASE ref when judging a candidate, or a PR can self-approve.
# blocked = a precise obstacle stopped a full local run (see `blocker`, `partial_evidence`).
# coverage = what an executed context's local verdict covers of its hosted twin: `full` (the default when absent) or `partial`
# with a `coverage_note` naming the subset. It travels with every result into status.json and hosted_compare.json; a partial
# AGREE is shown and counted apart, never as full: a compared merge needs >= 12 compared contexts, >= 11 full and at most one
# partial, named (ruled 2026-10-08). An unreadable value is partial.
# not_implemented = no local mapping exists yet. not_applicable_rule = 0 today: no required context
# can be statically N/A (a required check must always report); per-diff N/A is the runner's
# change_map decision, not this file's.

summary:
  updated_at: "2026-10-11"
  required_contexts: 14
  executed: 14 # R1 gate, actionlint, Merah Putih, catE, organ, guard, antidotes, Backend Tests, Harness floor, E2E, Visa Oracle smoke, Frontend Tests, CodeQL python and javascript — by the runner, every BASE workflow step accounted for
  not_applicable_rule: 0
  blocked: 0
  not_implemented: 0
  never_claim_parity_for: [] # exactly the contexts the runner does not execute (machine-checked by the suite)
  parity_gaps: # steps of EXECUTED contexts whose hosted twin can differ from the local run
    - "catE-sovereignty-lint on a PR head: hosted runs the #40c model judgment (vendor key) and the PR-scoped prose scan; local runs the merge_group shape (whole tree, no model)"
    - "every container context runs the merge_group shape; PR-only steps (path sentinels) are not_applicable with reasons or run with the merge_group answer"
    - "a context with BASE judges (trusted_files, trusted_from_steps): a PR that changes a judge AND what it judges can be RED here and green hosted (FALSE_RED); a green with a changed judge is BLOCKED, never claimed"
    - "service contexts (Backend Tests, Harness floor) run in linux/arm64 sandboxes on Pro's Colima; hosted is ubuntu-latest x64: wheels differ per arch (torch +cu130 aarch64), and the services run the docker.io arm64 twins of the ghcr mirror's amd64 copies"
    - "Backend Tests: the install closure is resolved into a deps image at plan time from the candidate's pins (its unpinned extras resolve then); the install steps re-run verbatim against it offline"
    - "Backend Tests: pip-audit runs in an egress sandbox with --no-deps --disable-pip on the same requirement files, so it audits the pins the locks list; hosted resolves them in a throwaway venv first and also audits what the locks leave unpinned (the cuda subtree, or a dependency a lock omits) — a vulnerable unlisted dependency can be red hosted and green here (installing it here would run wheel code with network)"
    - "Backend Tests: node (24, the official image's) and the data the suite downloads (tiktoken cl100k_base, spaCy en_core_web_lg 3.8.0) are sha256-pinned in the matrix; hosted takes whatever the runner image and the network serve that day"
    - "Backend Tests: matrix legs run one after another in fresh sandboxes (parallelism 1 on Colima 8 CPU / 16 GiB, the VM since 2026-10-10); hosted runs them on separate runners at once"
    - "Harness floor: the Gear >= 2 verdict reader runs at plan time on the host with the operator's gh, reading the PR's commit status as it stands then; hosted read it when the queue ran"
    - "E2E Tests: hosted starts the backend with four repository secrets (QDRANT_URL, QDRANT_API_KEY, OPENAI_API_KEY, JWT_SECRET) and runs the specs with E2E_TEST_EMAIL/PIN set. Here the backend gets hermetic stand-ins made up per leg (a local Qdrant pinned by digest started with the same generated key, a non-functional OpenAI key, a random JWT_SECRET: the SET code paths of the boot and of /health run, and the leg has no route to api.openai.com or to anyone), and E2E_TEST_EMAIL/PIN stay empty because BASE's 135 selected tests (page Page|@offline, 21 files, `playwright test --list` on BASE) import neither and never sign in or call :8000. Not reproduced, because the cloud decides it and not the code: that the real Qdrant cluster is reachable, that the real keys are still valid, and what the cluster holds (hosted /health counts and reads each of its 14 collections; the stand-in is empty: the boot lists them once and /health reads each inside a catch-all that still answers 200, measured on Pro: two GET /collections and nothing else) — the boot treats a failed Qdrant probe as non-fatal (service_initializer.py, UNAVAILABLE), so none of them turns the hosted job red. A secret rotated to a value that breaks the hosted start is invisible here (Visa Oracle smoke reads no secret)"
    - "E2E, Visa Oracle smoke and Frontend Tests: npm installs offline from a cache filled at plan time on linux/arm64 (a lock that lacks the linux-x64 optional native package hosted needs is GREEN here); hosted fetches them, and the browser-install steps of E2E and Visa Oracle smoke (apt + CDN, one 600 s attempt hosted, the W118 flake) are replaced by the deps image's install of the lock's playwright-core browser (retried at build), so a hosted failure or timeout of that step is not reproduced"
    - "CodeQL (python, javascript) version: the hosted CLI version is set per run by GitHub feature flags. Local pins the bundle; the plan is BLOCKED when the newest hosted analysis of the language on main reports another version, is older than 7 days, or when the newest completed security.yml run of the repository's own main (schedule or workflow_dispatch, head repository the repo: not a fork's PR branch named main) has this language's CodeQL job red (a hosted CLI upgrade that dies before it uploads shows only there); the leg itself compares the CLI it runs with the pin and gives no verdict on a difference. The flag can still move between those reads and the queue run"
    - "CodeQL (python, javascript) flags: the action's CLI flags are transcribed from the 2026-10-10 hosted logs and the action source, so a feature-flag change to them is not seen. interpret-results is reconstructed from src/codeql.ts; it adds metadata only. The per-language run flags come from BASE's security_gate_flags.py on the plan's changed files, and the manual override vars.MERGEOS_RING_GATING_DISABLED is read live at plan with the operator's gh (the repository variables, then the organization's for an Organization owner; the repository variable wins, as hosted resolves it) and judged by BASE's ring_gating_override.sh (active, or unreadable, or a BASE job naming an environment: both languages run, as hosted); the variable can change between that read and the queue run. A failed hosted 'Self-test ring-gating override' step (security.yml, pip install pyyaml from the network) makes the hosted changes job non-success and hosted runs both languages; local does not reproduce that"
    - "CodeQL (python, javascript) architecture: the linux-arm64 bundle is used here and linux64 hosted. A crash, OOM or timeout depends on arch and resources (hosted runs 4 threads with --ram=14575; here --ram=10240 under 12g)"
    - "CodeQL (python, javascript) shape: the merge_group shape with upload never. What the PR lane's upload can fail on and the code determines is reproduced on the interpreted SARIF (not JSON, no runs array, a run with no results array, and the documented limits: 10 MB gzip, 20 runs, 25,000 results and rules per run, 100 extensions, 10,000 thread-flow and 1,000 result locations, 20 tags a rule; the maxima are rejection limits, the docs' display truncation applies below them). Not reproduced, because GitHub's side and not the code decides them: a processing error outside those limits, a transient API error, the status-poll timeout (which continues, not fails), a hosted runner loss, the docs table's Alert Limit 1,000,000 (repository state). The upload also adds fingerprints and automation details after interpret-results, so the gzip size is the compact JSON at level 6 plus a bound of what the action adds (32 B per result it would fingerprint, 256 B per run without automationDetails; 0 on the CLI's real SARIF), compared with 10,000,000 (the smaller reading of '10 MB'); it is comparable to the uploaded one (measured: python 556,089 B here, 431,655 B hosted). With upload never a run without results does not throw on hosted (countResultsInSarif runs only on the upload path); local judges as the PR lane does, stricter than the merge_group twin A PR-lane diff-informed result set may be narrower than the local one, which only changes data, never the verdict"

contexts:
  - name: "E2E Tests (Playwright)"
    workflow_file: .github/workflows/tests.yml
    job_id: e2e-tests
    purpose: Playwright specs of apps/mouth against a live FastAPI backend on :8000 with Postgres + Redis.
    trusted_base_required: false
    local:
      check: ctx.e2e-tests
      where: container
      expressions: true
      runs_when: e2e-tests # the job's `if:` reads the classifier's run_e2e_tests: the trusted change_map stands in
      memory: 7g
      bare_venv: false
      service_images:
        "ghcr.io/bali-zero/ci-mirror/postgres:15": "postgres:15"
        "ghcr.io/bali-zero/ci-mirror/redis:7": "redis:7"
      deps: # the backend closure plus node, the npm cache of the root lock, the lock's Playwright browser and psql (one recipe, shared)
        requirements:
          - apps/backend-rag/requirements.lock.txt
          - apps/backend-rag/requirements-ci-tools.txt
        packages:
          [
            pytest,
            pytest-cov,
            pytest-asyncio,
            pytest-mock,
            fakeredis,
            pytest-xdist,
          ]
        node: "24"
        npm: package-lock.json
        playwright: chromium
        apt: [postgresql-client]
        fetch:
          - url: https://openaipublic.blob.core.windows.net/encodings/cl100k_base.tiktoken
            sha256: 223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7 # pragma: allowlist secret — a public file's digest
            path: /tmp/data-gym-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
          - url: https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
            sha256: 293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63 # pragma: allowlist secret — a public file's digest
            path: /opt/wheels/en_core_web_lg-3.8.0-py3-none-any.whl
            install: true
      extra_services: # not on BASE's job: hosted's QDRANT_URL is a cloud cluster. Pinned by digest (qdrant v1.17.0, the version of docker-compose.test.yml; qdrant-client 1.19.0 in the lock); docker pull it on the host
        - name: qdrant
          image: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
          env:
            QDRANT__SERVICE__API_KEY: $LOCALCI_GEN.qdrant # pragma: allowlist secret
          health:
            {
              cmd: "bash -c ':> /dev/tcp/127.0.0.1/6333'",
              interval: 2s,
              timeout: 5s,
              retries: 15,
            }
      needs:
        changes: { result: success, outputs: { run_e2e_tests: "true" } }
      steps:
        - workflow_step: Setup Node.js
          not_applicable: the deps image carries node 24 (the official image's binary and npm); the plan checks the BASE pin against it
        - workflow_step: Install backend dependencies (uv, lock-pinned)
        - workflow_step: Start backend (FastAPI on :8000)
          env: # hosted reads four repository secrets here; this run holds none of them and never reads the operator's: hermetic stand-ins, so the SET code paths run
            QDRANT_URL: http://localhost:6333 # the extra_services Qdrant below, on the shared loopback
            QDRANT_API_KEY: $LOCALCI_GEN.qdrant # pragma: allowlist secret — made up per leg, the stand-in is started with the same value
            OPENAI_API_KEY: sk-$LOCALCI_GEN.openai # pragma: allowlist secret — made up per leg and non-functional: every container here has no route to api.openai.com
            JWT_SECRET: $LOCALCI_GEN.jwt # pragma: allowlist secret — made up per leg (the backend reads JWT_SECRET_KEY, set by BASE; hosted sets this one too)
        - workflow_step: Install Node dependencies
        - workflow_step: Cache Next.js build cache (mouth)
          not_applicable: no cache layer; a cold Next.js build is what a cache miss runs hosted
        - workflow_step: E2E specs must collect with no credentials present
        - workflow_step: Cache Playwright browser binaries
          not_applicable: no cache layer; the deps image holds the browser
        - workflow_step: Install Playwright browsers
          not_applicable: >-
            needs root and network (apt-get for the OS libraries, the browser CDN); the deps image ran the lock's
            playwright-core `install --with-deps chromium` at plan time instead
        - workflow_step: Run E2E tests
          env: { E2E_TEST_EMAIL: "", E2E_TEST_PIN: "" } # repository secrets hosted; the selected specs (page Page|@offline) are credential-free
        - workflow_step: Save Next.js build cache (mouth, main only)
          not_applicable: no cache layer (and its `if:` needs github.ref == refs/heads/main, false on a merge_group ref)
        - workflow_step: Check Playwright report
        - workflow_step: Upload Playwright report
          not_applicable: an upload with if-no-files-found warn cannot fail the job; there is no artifact store here
    mapping: executed
    coverage: full
    blocker: ""

  - name: "Backend Tests (Python)"
    workflow_file: .github/workflows/tests.yml
    job_id: backend-tests
    purpose: Aggregator over backend-static + 3 backend shards; proves the shards tiled the corpus exactly, using the BASE ref's partitioner.
    trusted_base_required: true
    local:
      check: ctx.backend-tests
      where: container
      expressions: true # a service context: the job chain, its services, its lock and its `${{ }}` are reproduced (runner v0.6.0)
      runs_when: backend-tests # the jobs' `if:` reads the classifier's run_backend_tests: the trusted change_map stands in
      memory: 12g # four xdist workers peak ~2.1 GB each (B4): 4 x 2.1 GB fits 12g; the VM has 16 GiB since 2026-10-10
      bare_venv: false # `uv pip install --system` writes into the interpreter setup-python names, not a venv
      service_images: # ci-image-mirror.yml copies docker.io/library/<tag> (linux/amd64, digests preserved); its arm64 twin stands in here
        "ghcr.io/bali-zero/ci-mirror/postgres:15": "postgres:15"
        "ghcr.io/bali-zero/ci-mirror/redis:7": "redis:7"
      deps: # the closure the install steps ask for, built into the deps image from the candidate's own files (pins only)
        requirements:
          - apps/backend-rag/requirements.lock.txt
          - apps/backend-rag/requirements-ci-tools.txt
        packages: # the shard install's unpinned line
          - pytest
          - pytest-cov
          - pytest-asyncio
          - pytest-mock
          - fakeredis
          - pytest-xdist
        node: "24" # the suite shells out to node (KBLI gold content); ubuntu-latest carries one, its major may differ
        fetch: # public files the suite downloads at run time hosted (tiktoken's BPE table, cached under its sha1(url) name)
          - url: https://openaipublic.blob.core.windows.net/encodings/cl100k_base.tiktoken
            sha256: 223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7 # pragma: allowlist secret — a public file's digest
            path: /tmp/data-gym-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
          # presidio's default NLP engine: hosted, AnalyzerEngine() pip-installs it from GitHub at test time (spacy 3.8 -> 3.8.0)
          - url: https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
            sha256: 293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63 # pragma: allowlist secret — a public file's digest
            path: /opt/wheels/en_core_web_lg-3.8.0-py3-none-any.whl
            install: true
      egress_trusted: [apps/backend-rag/requirements-ci-tools.txt] # pip-audit's own pin: BASE's, or the egress step does not run
      needs: # the `changes` job on merge_group, as its outputs read there: the impact map is PR-lane only, so the full corpus runs
        changes:
          result: success
          outputs:
            run_backend_tests: "true"
            impact_run_all: "true"
            impact_selected_tests: ""
      env:
        HAS_CODECOV_TOKEN: "false" # `secrets.CODECOV_TOKEN != ''`: the repository holds no such secret (BASE note, 2026-08-23), hosted reads false
      jobs:
        - job_id: backend-static
          steps:
            - workflow_step: Cache dependencies (uv)
              not_applicable: no cache layer; the deps image holds the closure the install step re-runs offline
            - workflow_step: Install dependencies (uv, lock-pinned)
            - workflow_step: pip-audit
              side: egress # the vulnerability service is on the network; the step runs alone with the three files it reads
              inputs:
                [
                  apps/backend-rag/requirements.lock.txt,
                  apps/backend-rag/requirements-prod.lock.txt,
                  apps/backend-rag/requirements-ci-tools.txt,
                ]
              rewrite: # no resolution through pip: the lock is the closure, and no candidate-chosen package executes with network
                - [
                    "pip-audit --strict --requirement",
                    "pip-audit --strict --no-deps --disable-pip --requirement",
                  ]
            - workflow_step: Mypy type check (core + models)
            - workflow_step: Import chain gate
            - workflow_step: Check LLM cost tracking coverage
            - workflow_step: Run core tests (fast gate — always run)
            - workflow_step: Upload core-gate test results
              not_applicable: a continue-on-error diagnostic upload (BASE says nothing gates on it); there is no artifact store here
        - job_id: backend-shard
          # Four xdist workers = hosted's count (its runner has 4 CPUs, so `-n auto` starts 4 there). The line stays: on the
          # 8-CPU Colima VM (resized 2026-10-10 from 4 CPU / 8 GiB) `-n auto` would start 8 workers x ~2.1 GB anon-rss each,
          # which is not hosted's run and exceeds the leg's 12g cgroup. History (B4, 2026-10-07/08): at 4 workers under the old
          # 6g cgroup the kernel OOM-killed a worker (six memcg kills, every one a /docker/<ctr>), xdist printed `[gwN] node
          # down: Not properly terminated` and the controller hung to the 1800 s kill; the cap was 2 until the resize. Same tests,
          # same command: xdist's `-n auto` reads PYTEST_XDIST_AUTO_NUM_WORKERS before any CPU count, `--dist loadfile` keeps each
          # file whole on one worker and the DB isolation is per worker, so coverage stays `full`.
          env: { PYTEST_XDIST_AUTO_NUM_WORKERS: "4" }
          steps:
            - workflow_step: Runner probe (temporary, day-0)
            - workflow_step: Cache dependencies (uv)
              not_applicable: no cache layer; the deps image holds the closure the install step re-runs offline
            - workflow_step: Install dependencies (uv, lock-pinned)
            - workflow_step: Bootstrap SQLModel tables
            - workflow_step: Apply database migrations
            - workflow_step: Run backend stability gate
            - workflow_step: Compute this shard's chunk
            - workflow_step: Run unit tests (sharded)
            - workflow_step: Upload shard receipts
              emulate: true # the runner copies the shard's receipts out and lays them where the fan-in downloads them
      steps:
        - workflow_step: Assert every upstream job succeeded
        - workflow_step: Download shard receipts
          emulate: true
        - workflow_step: Verify the partitioner's own guilt and innocence corpus
        - workflow_step: Extract trusted partitioner (base ref)
        - workflow_step: Partition guard — the shards tiled the corpus exactly
        - workflow_step: Prove each shard reported executed tests
        - workflow_step: Combine shard coverage and enforce the threshold
        - workflow_step: Upload coverage to Codecov
          not_applicable: >-
            codecov-action under `if: env.HAS_CODECOV_TOKEN == 'true'`, false here and hosted (no CODECOV_TOKEN secret)
        - workflow_step: Report shard balance
        - workflow_step: Upload test results
          not_applicable: >-
            an `if: always()` upload with if-no-files-found warn cannot fail the job; there is no artifact store here
    mapping: executed
    coverage: full
    blocker: ""

  - name: "CodeQL Analysis (python)"
    workflow_file: .github/workflows/security.yml
    job_id: codeql
    purpose: GitHub CodeQL security-extended,security-and-quality analysis of the python source (matrix language=python).
    trusted_base_required: true
    local:
      check: ctx.codeql-python
      where: container # the CLI runs in the sandbox, network none, the candidate tree as data (CodeQL extracts, it does not execute)
      expressions: true
      leg: { language: python } # the required context is this one leg's check run
      memory: 12g # measured peak 8.6 GiB (python) / 7.1 GiB (javascript) at --ram=10240; the VM has 16 GiB
      bare_venv: false
      git_index: false # the probe analysed a bare tree (git archive): the job reads no git history
      deps_recipe: codeql # both legs share one image; one prune recipe
      deps:
        &codeql_deps # the CLI bundle (linux-arm64, the sandbox's arch) extracted at build, never in a layer as a tarball; node for the JS extractor
        node: "24"
        codeql:
          version: &codeql_version "2.27.2" # the one literal: the image build asserts it, the leg step env (CODEQL_PIN) and the sentinel read it
          url: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux-arm64.tar.gz
          sha256: c1779ce6335606ef86fce4aae0db2ac4d7da869527d6a67bf055d9135695473c # pragma: allowlist secret — a public file's digest (the release asset's)
      trusted_files: [
          .github/codeql-config.yml,
          scripts/localci/codeql_leg.sh,
          scripts/localci/codeql_sarif_check.py,
        ] # BASE's copies: the config is what hosted would analyse with, the script is the commands, the checker is what the SARIF is judged by
      trusted_overlay: true # laid over the candidate tree in the sandbox; a candidate that changes one gets its green BLOCKED (hosted judges with the candidate's)
      classifier: {
          job: changes,
          script: scripts/ci/security_gate_flags.py,
          outputs: [run_codeql_python, run_codeql_js],
        } # needs.changes, decided at plan by BASE's classifier on the changed files
      version_sentinel: { reader: scripts/localci/codeql_version_read.py } # BLOCKED unless the newest hosted analysis of this language on main reports the pinned CLI
      skip_is_pass: true # RUN_THIS_LANGUAGE false skips all three steps and the hosted job still reports success: an `if:` skip of every step is PASS
      steps:
        - workflow_step: Initialize CodeQL
          uses_pin: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
          argv: [bash, scripts/localci/codeql_leg.sh, init, python]
          env:
            {
              CODEQL_QUERIES: "security-extended,security-and-quality",
              CODEQL_PIN: *codeql_version,
            }
          with_pin:
            {
              languages: "${{ matrix.language }}",
              queries: "security-extended,security-and-quality",
              config-file: ./.github/codeql-config.yml,
            }
        - workflow_step: Autobuild
          uses_pin: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
          not_applicable: the action runs no command for python (the hosted log between its Autobuild and Analyze steps holds none); the language is extracted without a build
        - workflow_step: Perform CodeQL Analysis
          uses_pin: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
          argv: [bash, scripts/localci/codeql_leg.sh, analyze, python]
          with_pin:
            {
              category: "/language:${{matrix.language}}",
              upload: "${{ github.event_name == 'merge_group' && 'never' || 'always' }}",
            }
    mapping: executed
    coverage: full
    caveat: >-
      coverage stays full because the context reproduces every hosted failure class the CODE determines, and names the rest as environment gaps.
      The findings (results per language) are recorded in the receipt as data and never change the verdict: hosted never fails on them either.
      Reproduced, from codeql-action v4.38.2 and the GitHub docs: the CLI commands, on the same CLI pinned through the version sentinel and
      checked again at run time; the analyze action's SARIF post-processing and the PR lane's upload limits, judged by codeql_sarif_check.py.
      Not reproduced (parity_gaps, an environment difference and not a subset of the work left undone, unlike a context that runs with its secrets emptied): arch,
      a GitHub-side processing error outside the documented limits, a transient API error, the status-poll timeout, a hosted runner loss
    blocker: ""

  - name: "CodeQL Analysis (javascript)"
    workflow_file: .github/workflows/security.yml
    job_id: codeql
    purpose: GitHub CodeQL security-extended,security-and-quality analysis of the javascript/typescript source (matrix language=javascript).
    trusted_base_required: true
    local:
      check: ctx.codeql-javascript
      where: container # the CLI runs in the sandbox, network none, the candidate tree as data (CodeQL extracts, it does not execute)
      expressions: true
      leg: { language: javascript } # the required context is this one leg's check run
      memory: 12g # measured peak 8.6 GiB (python) / 7.1 GiB (javascript) at --ram=10240; the VM has 16 GiB
      bare_venv: false
      git_index: false # the probe analysed a bare tree (git archive): the job reads no git history
      deps_recipe: codeql # both legs share one image; one prune recipe
      deps: *codeql_deps
      trusted_files: [
          .github/codeql-config.yml,
          scripts/localci/codeql_leg.sh,
          scripts/localci/codeql_sarif_check.py,
        ] # BASE's copies: the config is what hosted would analyse with, the script is the commands, the checker is what the SARIF is judged by
      trusted_overlay: true # laid over the candidate tree in the sandbox; a candidate that changes one gets its green BLOCKED (hosted judges with the candidate's)
      classifier: {
          job: changes,
          script: scripts/ci/security_gate_flags.py,
          outputs: [run_codeql_python, run_codeql_js],
        } # needs.changes, decided at plan by BASE's classifier on the changed files
      version_sentinel: { reader: scripts/localci/codeql_version_read.py } # BLOCKED unless the newest hosted analysis of this language on main reports the pinned CLI
      skip_is_pass: true # RUN_THIS_LANGUAGE false skips all three steps and the hosted job still reports success: an `if:` skip of every step is PASS
      steps:
        - workflow_step: Initialize CodeQL
          uses_pin: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
          argv: [bash, scripts/localci/codeql_leg.sh, init, javascript]
          env:
            {
              CODEQL_QUERIES: "security-extended,security-and-quality",
              CODEQL_PIN: *codeql_version,
            }
          with_pin:
            {
              languages: "${{ matrix.language }}",
              queries: "security-extended,security-and-quality",
              config-file: ./.github/codeql-config.yml,
            }
        - workflow_step: Autobuild
          uses_pin: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
          not_applicable: the action runs no command for javascript (the hosted log between its Autobuild and Analyze steps holds none); the language is extracted without a build
        - workflow_step: Perform CodeQL Analysis
          uses_pin: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
          argv: [bash, scripts/localci/codeql_leg.sh, analyze, javascript]
          with_pin:
            {
              category: "/language:${{matrix.language}}",
              upload: "${{ github.event_name == 'merge_group' && 'never' || 'always' }}",
            }
    mapping: executed
    coverage: full
    caveat: >-
      coverage stays full because the context reproduces every hosted failure class the CODE determines, and names the rest as environment gaps.
      The findings (results per language) are recorded in the receipt as data and never change the verdict: hosted never fails on them either.
      Reproduced, from codeql-action v4.38.2 and the GitHub docs: the CLI commands, on the same CLI pinned through the version sentinel and
      checked again at run time; the analyze action's SARIF post-processing and the PR lane's upload limits, judged by codeql_sarif_check.py.
      Not reproduced (parity_gaps, an environment difference and not a subset of the work left undone, unlike a context that runs with its secrets emptied): arch,
      a GitHub-side processing error outside the documented limits, a transient API error, the status-poll timeout, a hosted runner loss
    blocker: ""

