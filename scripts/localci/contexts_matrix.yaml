  - name: "actionlint — workflow schema + expression gate"
    workflow_file: .github/workflows/actionlint.yml
    job_id: lint
    purpose: actionlint (pinned 1.7.12) over every workflow for schema/expression/untrusted-input errors, plus the workflow-timeout floor lint.
    trusted_base_required: true
    local:
      check: ctx.actionlint
      where: host # BASE floor lint + a version-pinned host binary, both reading the candidate's workflows as data
      trusted_files: [scripts/lint_workflow_timeout_floor.py]
      tool_pins: { actionlint: ACTIONLINT_VERSION } # host `actionlint -version` must equal the BASE job's pin, else BLOCKED
      host_modules: [yaml]
      steps:
        - workflow_step: Download actionlint (pinned version + sha256)
          not_applicable: >-
            the host binary stands in, version-checked against the BASE pin at plan time (path + sha256 in the env
            fingerprint); the linux_amd64 tarball hash does not apply to an arm64 Homebrew build
        - workflow_step: "Checkout-budget floor (a job's floor is the checkout, not its script)"
          argv: [$PY, scripts/lint_workflow_timeout_floor.py]
        - workflow_step: Lint all workflow files
          argv: [actionlint, -no-color, "-shellcheck="]
    mapping: executed
    coverage: full
    caveat: >-
      actionlint runs pyflakes on python `run:` blocks only when pyflakes is on PATH; neither Pro nor (as far as measured)
