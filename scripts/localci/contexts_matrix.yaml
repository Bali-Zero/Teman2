  - name: "Harness floor recompute"
    workflow_file: .github/workflows/harness-floor.yml
    job_id: harness-floor
    purpose: Recomputes the deterministic gear floor from the diff (base-ref checkout, "grader self-protects"), compares it to the declared evidence/brief.yml gear, validates the Gear-3 pack and the Bites contract.
    trusted_base_required: true
    local:
      check: ctx.harness-floor
      where: container # the job checks out BASE and reads the candidate through git: its scripts are BASE's by construction
      expressions: true
      vars: {} # repository variables read 2026-10-07 (GET actions/variables): HARNESS_ENFORCEMENT is unset, so `vars.*` is '' as hosted
      trusted_files: [scripts/ci/harness_gate_read.py]
      steps:
        - workflow_step: Kill switch
        - workflow_step: Install linter dependency (PyYAML)
        - workflow_step: Enumerate changed files (merge-base anchored)
          env: { GH_TOKEN: "" } # the merge-base resolves inside the sandbox, so the PR-files API fallback that would read it never runs
        - workflow_step: Resolve this PR's evidence paths
        - workflow_step: Compute measured net lines (merge-base anchored, best-effort)
        - workflow_step: Capture workflow patch for the path-term exemption
        - workflow_step: Hot-zone list may only grow below floor 3
        - workflow_step: Compute deterministic floor from diff
        - workflow_step: Does this PR's own diff carry evidence/brief.yml?
        - workflow_step: Not a harness task (no brief, floor == 1 — not applicable)
        - workflow_step: NOTICE (grace period) then FAIL — floor==2 via the SIZE term alone, no evidence/brief.yml
        - workflow_step: FAIL — floor >= 2 diff with no evidence/brief.yml (no grace period applies)
        - workflow_step: Compare declared gear to the deterministic floor
        - workflow_step: Not a gated task (gear 1 — fable-gate not applicable)
        - workflow_step: Gear-3 — validate evidence/pack.yml against the Evidence Pack contract
        - workflow_step: Gear >= 2 — read the real gate verdict
          side: host # the verdict lives in a GitHub commit status: BASE's reader runs on the host and reads it with the operator's gh
          argv:
            - $PY
            - scripts/ci/harness_gate_read.py
            - --event-name
            - merge_group
            - --repo
            - "${{ github.repository }}"
            - --pr-head-sha
            - ""
            - --merge-group-head-ref
            - "${{ github.event.merge_group.head_ref }}"
            - --dispatch-sha
            - ""
          env: { GH_TOKEN: "" } # stripped from every trusted environment; gh answers with its stored login, a read
          no_verdict_when: "::error::harness_gate_read: CANNOT-VERIFY" # its own stderr line for "the read itself failed" (a GitHub 5xx): asked again, then no verdict
          pending_when: "::error::harness_gate_read: PENDING" # B12: no verdict posted on the head yet (the session has not posted its harness/fable-gate): no verdict, NOT retried, asked again once it is posted
        - workflow_step: Bites contract — parse this PR's evidence pack
    mapping: executed
    coverage: full
    blocker: ""

