# contexts_matrix.yaml — the 14 status contexts branch protection on main REQUIRES, each mapped
# to what a local run can honestly claim.
#
# `mapping: executed` means THE RUNNER EXECUTES IT (v0.4.0): `plan` reads `local` and plans one
# check, `local.check` (ctx.<slug>), that runs every step and is PASS only when every step it runs
# returns 0 and every other step is not_applicable with a reason. `local.steps` accounts for EVERY
# step of the BASE workflow job, matched by `workflow_step` (or a unique `workflow_step_prefix`):
#   argv: [...]          a transcribed command (`$PY` = the interpreter, `$BASE_SHA` = the plan's base)
#   (no argv)            the BASE `run:` body itself, verbatim, under bash -eo pipefail (container only)
#   not_applicable: why  recorded as such; never counted as run
#   not_run: why         the context is BLOCKED until it runs
# A BASE step the matrix does not name (other than actions/checkout and actions/setup-python), an
# expression the runner does not evaluate, or a host step that would execute candidate code makes
# the context BLOCKED. `trusted_from_steps: true` takes from BASE every script a step names (a step
# marked `trusted_scan: false` is a path sentinel and is not read); the BASE job's timeout-minutes
# is the context's budget. `where: host` = BASE scripts / version-pinned tools judging the candidate tree
# as data (trusted, sealed); `where: container` = the steps run in the candidate sandbox with the
# BASE copies of `trusted_files` laid over the candidate's, emulating the merge_group event. When
# the candidate rewrites a trusted file or the workflow, a green is reported BLOCKED: hosted judges
# with the candidate's copy, which the run did not execute. This file is operator input, like the
# runner: pass the trusted copy with --contexts-file, never the candidate's.
#
# Source of the 14 names: live branch protection read 2026-09-26 (gh api); cross-checked with
# infra/required.d/contexts.json (snapshot 2026-09-21, same 14 names, same workflow_file/job_id).
#
# trusted_base_required=true means the check's OWN logic (classifier / partitioner / guard and its
# self-test) must be taken from the BASE ref when judging a candidate, or a PR can self-approve.
# blocked = a precise obstacle stopped a full local run (see `blocker`, `partial_evidence`).
# not_implemented = no local mapping exists yet. not_applicable_rule = 0 today: no required context
# can be statically N/A (a required check must always report); per-diff N/A is the runner's
# change_map decision, not this file's.

summary:
  updated_at: "2026-10-07"
  required_contexts: 14
  executed: 11 # R1 gate, actionlint, Merah Putih, catE, organ, guard, antidotes, Backend Tests, Harness floor, E2E, Visa Oracle smoke — by the runner, every BASE workflow step accounted for
  not_applicable_rule: 0
  blocked: 3
  not_implemented: 0
  never_claim_parity_for: # exactly the contexts the runner does not execute (machine-checked by the suite)
    - "CodeQL Analysis (python)"
    - "CodeQL Analysis (javascript)"
    - "Frontend Tests (Next.js) (mouth, true)"
  parity_gaps: # steps of EXECUTED contexts whose hosted twin can differ from the local run
    - "catE-sovereignty-lint on a PR head: hosted runs the #40c model judgment (vendor key) and the PR-scoped prose scan; local runs the merge_group shape (whole tree, no model)"
    - "every container context runs the merge_group shape; PR-only steps (path sentinels) are not_applicable with reasons or run with the merge_group answer"
    - "a context with BASE judges (trusted_files, trusted_from_steps): a PR that changes a judge AND what it judges can be RED here and green hosted (FALSE_RED); a green with a changed judge is BLOCKED, never claimed"
    - "service contexts (Backend Tests, Harness floor) run in linux/arm64 sandboxes on Pro's Colima; hosted is ubuntu-latest x64: wheels differ per arch (torch +cu130 aarch64), and the services run the docker.io arm64 twins of the ghcr mirror's amd64 copies"
    - "Backend Tests: the install closure is resolved into a deps image at plan time from the candidate's pins (its unpinned extras resolve then); the install steps re-run verbatim against it offline"
    - "Backend Tests: pip-audit runs in an egress sandbox with --no-deps --disable-pip on the same requirement files, so it audits the pins the locks list; hosted resolves them in a throwaway venv first and also audits what the locks leave unpinned (the cuda subtree, or a dependency a lock omits) — a vulnerable unlisted dependency can be red hosted and green here (installing it here would run wheel code with network)"
    - "Backend Tests: node (24, the official image's) and the data the suite downloads (tiktoken cl100k_base, spaCy en_core_web_lg 3.8.0) are sha256-pinned in the matrix; hosted takes whatever the runner image and the network serve that day"
    - "Backend Tests: matrix legs run one after another in fresh sandboxes (parallelism 1 on Colima 4 CPU / 8 GiB); hosted runs them on separate runners at once"
    - "Harness floor: the Gear >= 2 verdict reader runs at plan time on the host with the operator's gh, reading the PR's commit status as it stands then; hosted read it when the queue ran"
    - "E2E and Visa Oracle smoke: hosted starts the backend with four repository secrets (QDRANT_URL, QDRANT_API_KEY, OPENAI_API_KEY, JWT_SECRET) and E2E with E2E_TEST_EMAIL/PIN; here they are empty — a spec or startup path that behaves differently with them set can differ"
    - "E2E and Visa Oracle smoke: npm installs offline from a cache filled at plan time (the lock's registry tarballs for linux/arm64); hosted fetches them, and its browser-install step (apt + CDN, the W118 flake) is replaced by the deps image's install"

contexts:
  - name: "E2E Tests (Playwright)"
    workflow_file: .github/workflows/tests.yml
    job_id: e2e-tests
    purpose: Playwright specs of apps/mouth against a live FastAPI backend on :8000 with Postgres + Redis.
    trusted_base_required: false
    local:
      check: ctx.e2e-tests
      where: container
      expressions: true
      runs_when: e2e-tests # the job's `if:` reads the classifier's run_e2e_tests: the trusted change_map stands in
      memory: 7g
      bare_venv: false
      service_images:
        "ghcr.io/bali-zero/ci-mirror/postgres:15": "postgres:15"
        "ghcr.io/bali-zero/ci-mirror/redis:7": "redis:7"
      deps: # the backend closure plus node, the npm cache of the root lock, the lock's Playwright browser and psql (one recipe, shared)
        requirements:
          - apps/backend-rag/requirements.lock.txt
          - apps/backend-rag/requirements-ci-tools.txt
        packages:
          [
            pytest,
            pytest-cov,
            pytest-asyncio,
            pytest-mock,
            fakeredis,
            pytest-xdist,
          ]
        node: "24"
        npm: package-lock.json
        playwright: chromium
        apt: [postgresql-client]
        fetch:
          - url: https://openaipublic.blob.core.windows.net/encodings/cl100k_base.tiktoken
            sha256: 223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7 # pragma: allowlist secret — a public file's digest
            path: /tmp/data-gym-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
          - url: https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
            sha256: 293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63 # pragma: allowlist secret — a public file's digest
            path: /opt/wheels/en_core_web_lg-3.8.0-py3-none-any.whl
            install: true
      needs:
        changes: { result: success, outputs: { run_e2e_tests: "true" } }
      steps:
        - workflow_step: Setup Node.js
          not_applicable: the deps image carries node 24 (the official image's binary and npm); the plan checks the BASE pin against it
        - workflow_step: Install backend dependencies (uv, lock-pinned)
        - workflow_step: Start backend (FastAPI on :8000)
          env: # hosted reads four repository secrets here; this run holds none of them and never reads the operator's
            QDRANT_URL: ""
            QDRANT_API_KEY: ""
            OPENAI_API_KEY: ""
            JWT_SECRET: ""
        - workflow_step: Install Node dependencies
        - workflow_step: Cache Next.js build cache (mouth)
          not_applicable: no cache layer; a cold Next.js build is what a cache miss runs hosted
        - workflow_step: E2E specs must collect with no credentials present
        - workflow_step: Cache Playwright browser binaries
          not_applicable: no cache layer; the deps image holds the browser
        - workflow_step: Install Playwright browsers
          not_applicable: >-
            needs root and network (apt-get for the OS libraries, the browser CDN); the deps image ran the lock's
            playwright-core `install --with-deps chromium` at plan time instead
        - workflow_step: Run E2E tests
          env: { E2E_TEST_EMAIL: "", E2E_TEST_PIN: "" } # repository secrets hosted; the selected specs (page Page|@offline) are credential-free
        - workflow_step: Save Next.js build cache (mouth, main only)
          not_applicable: no cache layer (and its `if:` needs github.ref == refs/heads/main, false on a merge_group ref)
        - workflow_step: Check Playwright report
        - workflow_step: Upload Playwright report
          not_applicable: an upload with if-no-files-found warn cannot fail the job; there is no artifact store here
    mapping: executed
    coverage: full
    blocker: ""

  - name: "Backend Tests (Python)"
    workflow_file: .github/workflows/tests.yml
    job_id: backend-tests
    purpose: Aggregator over backend-static + 3 backend shards; proves the shards tiled the corpus exactly, using the BASE ref's partitioner.
    trusted_base_required: true
    local:
      check: ctx.backend-tests
      where: container
      expressions: true # a service context: the job chain, its services, its lock and its `${{ }}` are reproduced (runner v0.6.0)
      runs_when: backend-tests # the jobs' `if:` reads the classifier's run_backend_tests: the trusted change_map stands in
      memory: 6g
      bare_venv: false # `uv pip install --system` writes into the interpreter setup-python names, not a venv
      service_images: # ci-image-mirror.yml copies docker.io/library/<tag> (linux/amd64, digests preserved); its arm64 twin stands in here
        "ghcr.io/bali-zero/ci-mirror/postgres:15": "postgres:15"
        "ghcr.io/bali-zero/ci-mirror/redis:7": "redis:7"
      deps: # the closure the install steps ask for, built into the deps image from the candidate's own files (pins only)
        requirements:
          - apps/backend-rag/requirements.lock.txt
          - apps/backend-rag/requirements-ci-tools.txt
        packages: # the shard install's unpinned line
          - pytest
          - pytest-cov
          - pytest-asyncio
          - pytest-mock
          - fakeredis
          - pytest-xdist
        node: "24" # the suite shells out to node (KBLI gold content); ubuntu-latest carries one, its major may differ
        fetch: # public files the suite downloads at run time hosted (tiktoken's BPE table, cached under its sha1(url) name)
          - url: https://openaipublic.blob.core.windows.net/encodings/cl100k_base.tiktoken
            sha256: 223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7 # pragma: allowlist secret — a public file's digest
            path: /tmp/data-gym-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
          # presidio's default NLP engine: hosted, AnalyzerEngine() pip-installs it from GitHub at test time (spacy 3.8 -> 3.8.0)
          - url: https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
            sha256: 293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63 # pragma: allowlist secret — a public file's digest
            path: /opt/wheels/en_core_web_lg-3.8.0-py3-none-any.whl
            install: true
      egress_trusted: [apps/backend-rag/requirements-ci-tools.txt] # pip-audit's own pin: BASE's, or the egress step does not run
      needs: # the `changes` job on merge_group, as its outputs read there: the impact map is PR-lane only, so the full corpus runs
        changes:
          result: success
          outputs:
            run_backend_tests: "true"
            impact_run_all: "true"
            impact_selected_tests: ""
      env:
        HAS_CODECOV_TOKEN: "false" # `secrets.CODECOV_TOKEN != ''`: the repository holds no such secret (BASE note, 2026-08-23), hosted reads false
      jobs:
        - job_id: backend-static
          steps:
            - workflow_step: Cache dependencies (uv)
              not_applicable: no cache layer; the deps image holds the closure the install step re-runs offline
            - workflow_step: Install dependencies (uv, lock-pinned)
            - workflow_step: pip-audit
              side: egress # the vulnerability service is on the network; the step runs alone with the three files it reads
              inputs:
                [
                  apps/backend-rag/requirements.lock.txt,
                  apps/backend-rag/requirements-prod.lock.txt,
                  apps/backend-rag/requirements-ci-tools.txt,
                ]
              rewrite: # no resolution through pip: the lock is the closure, and no candidate-chosen package executes with network
                - [
                    "pip-audit --strict --requirement",
                    "pip-audit --strict --no-deps --disable-pip --requirement",
                  ]
            - workflow_step: Mypy type check (core + models)
            - workflow_step: Import chain gate
            - workflow_step: Check LLM cost tracking coverage
            - workflow_step: Run core tests (fast gate — always run)
            - workflow_step: Upload core-gate test results
              not_applicable: a continue-on-error diagnostic upload (BASE says nothing gates on it); there is no artifact store here
        - job_id: backend-shard
          steps:
            - workflow_step: Runner probe (temporary, day-0)
            - workflow_step: Cache dependencies (uv)
              not_applicable: no cache layer; the deps image holds the closure the install step re-runs offline
            - workflow_step: Install dependencies (uv, lock-pinned)
            - workflow_step: Bootstrap SQLModel tables
            - workflow_step: Apply database migrations
            - workflow_step: Run backend stability gate
            - workflow_step: Compute this shard's chunk
            - workflow_step: Run unit tests (sharded)
            - workflow_step: Upload shard receipts
              emulate: true # the runner copies the shard's receipts out and lays them where the fan-in downloads them
      steps:
        - workflow_step: Assert every upstream job succeeded
        - workflow_step: Download shard receipts
          emulate: true
        - workflow_step: Verify the partitioner's own guilt and innocence corpus
        - workflow_step: Extract trusted partitioner (base ref)
        - workflow_step: Partition guard — the shards tiled the corpus exactly
        - workflow_step: Prove each shard reported executed tests
        - workflow_step: Combine shard coverage and enforce the threshold
        - workflow_step: Upload coverage to Codecov
          not_applicable: >-
            codecov-action under `if: env.HAS_CODECOV_TOKEN == 'true'`, false here and hosted (no CODECOV_TOKEN secret)
        - workflow_step: Report shard balance
        - workflow_step: Upload test results
          not_applicable: >-
            an `if: always()` upload with if-no-files-found warn cannot fail the job; there is no artifact store here
    mapping: executed
    coverage: full
    blocker: ""

  - name: "CodeQL Analysis (python)"
    workflow_file: .github/workflows/security.yml
    job_id: codeql
    purpose: GitHub CodeQL security-extended,security-and-quality analysis of the python source (matrix language=python).
    trusted_base_required: false
    local:
      kind: cmd
      cwd: "."
      cmd: []
      needs: [github_hosted]
    mapping: blocked
    blocker: >-
      GitHub-hosted CodeQL action (github/codeql-action init/autobuild/analyze) with no local executor;
      the `codeql` CLI is not installed on this host (`which codeql` -> not found). The job also
      self-skips per path (RUN_THIS_LANGUAGE) and uploads SARIF, so a local substitute would not be the same check.
    smallest_next_action: >-
      Do not emulate. Keep this context hosted-only; the local run reports it as BLOCKED(github_hosted),
      which caps the local overall at SUBSET_PASS — never PASS.

  - name: "CodeQL Analysis (javascript)"
    workflow_file: .github/workflows/security.yml
    job_id: codeql
    purpose: GitHub CodeQL security-extended,security-and-quality analysis of the javascript/typescript source (matrix language=javascript).
    trusted_base_required: false
    local:
      kind: cmd
      cwd: "."
      cmd: []
      needs: [github_hosted]
    mapping: blocked
    blocker: >-
      Same as the python leg: GitHub-hosted CodeQL, no local executor, `codeql` CLI absent on this host.
    smallest_next_action: Keep hosted-only; report BLOCKED(github_hosted) so the local verdict can never read as parity.

  - name: "Frontend Tests (Next.js) (mouth, true)"
    workflow_file: .github/workflows/tests.yml
    job_id: frontend-tests
    purpose: Matrix leg app=mouth, coverage=true — GARUDA contract check, tsc --noEmit, vitest with coverage + threshold, packages/core, admin-dashboard-local and wa-mirror suites.
    trusted_base_required: false
    local:
      kind: cmd
      cwd: apps/mouth
      cmd: [npx, vitest, --run, --coverage]
      needs: [node]
    mapping: blocked
    blocker: >-
      Worktree node_modules and apps/mouth/node_modules are symlinks to the main checkout: vitest/tsc
      write caches under node_modules/.vite and a coverage dir, i.e. outside this worktree (forbidden
      in a prepare-only lane), and `npm ci` from a worktree corrupts the shared tree. wa-mirror step runs
      its own `npm ci` (network). Not executed, so nothing is claimed.
    smallest_next_action: >-
      Executor lane with a private clone: `npm ci` at ROOT once, then run the 7 workflow commands in order
      (openapi-typescript --check, tsc --noEmit, vitest --coverage, test:coverage:check, packages/core,
      admin-dashboard-local, wa-mirror) and record rc+seconds per command. Runner v0.6.0 (phase B) found the next
      row: the job is a one-leg slice of an include-only matrix (needs a leg selector), and apps/wa-mirror's own
      `npm ci` fetches libsignal from git+ssh://github.com at a pinned commit, which the deps image's registry-only
      npm stage refuses (`npm_inputs`); both are owed before this context can run.

  - name: "Every organ is born with its genes"
    workflow_file: .github/workflows/organ-conformance.yml
    job_id: conformance
    purpose: Organ-conformance census + ratchet + its own guilt/innocence corpora + registry checksum.
    trusted_base_required: true
    local:
      check: ctx.organ-genes
      where: container
      git_index: true
      trusted_from_steps: true
      steps:
        - workflow_step: Did organ surfaces change?
          trusted_scan: false # git/echo only; its `git diff -- <paths>` list is the surfaces under test
          env:
            EVENT_NAME: merge_group
            BASE: ""
            HEAD: ""
        - workflow_step: Install test deps
        - workflow_step: Gate — check_organ_conformance
        - workflow_step: The receptor still reads what the organs write
        - workflow_step: An organ cannot beat faster than its bridge's poller
        - workflow_step: A self-reporting cron cannot beat faster than its own plist
        - workflow_step: Baseline is a one-way ratchet (panel round-2)
        - workflow_step: Require zsh (the G2 corpus executes a real zsh wrapper)
        - workflow_step: Generate the UTF-8 locale the collation test measures under
        - workflow_step: Gate proves guilt AND innocence (own test suites)
        - workflow_step: Registry still validates (checksum + invariants)
    mapping: executed
    coverage: full
    caveat: >-
      the G2 corpus runs a real zsh wrapper and the collation test needs it_IT.UTF-8: both are in the image
    blocker: ""

  - name: "R1 gate — adversarial review present"
    workflow_file: .github/workflows/adversarial-review-gate.yml
    job_id: gate
    purpose: Generator!=grader gate — a research/**/*.md in the diff must declare a non-author adversarial_review seat plus an "Adversarial review" section.
    trusted_base_required: true
    local:
      check: ctx.r1-gate
      where: host # the BASE script reads the candidate tree as data (git diff + text): trusted, sealed, no candidate code runs
      trusted_files: [scripts/check_adversarial_review.py]
      steps:
        - workflow_step: "R1 gate — prove the guard on its own fixtures (guilt + innocence)"
          argv: [$PY, scripts/check_adversarial_review.py, --selftest]
        - workflow_step: Fetch base ref
          not_applicable: the plan's BASE is a commit the runner already resolved locally; nothing to fetch
        - workflow_step: "R1 gate — adversarial review present"
          argv: [$PY, scripts/check_adversarial_review.py, --diff, $BASE_SHA]
          env: { BASE_SHA: $BASE_SHA }
    mapping: executed
    coverage: full
    blocker: ""

  - name: "antidotes"
    workflow_file: .github/workflows/immune-enforcement.yml
    job_id: antidotes
    purpose: Immune-system antidotes — secret/claim lints with selftests, a 68-file unit corpus and ~45 shell/pytest guilt+innocence corpora (66 steps).
    trusted_base_required: true
    local:
      check: ctx.antidotes
      where: container
      git_index: true
      trusted_from_steps: true
      steps:
        - workflow_step: Detect immune-relevant changes (sentinel path check)
          trusted_scan: false # git/grep/echo only; its `case` list is the surfaces under test
          env: # merge_group: no pull_request shas; the merge group's base and head are BASE and the candidate
            BASE_SHA: ""
            HEAD_SHA: ""
            LEDGER_BASE_SHA: $BASE_SHA
            LEDGER_HEAD_SHA: HEAD
        - workflow_step: Retracted-claims lint — prove the guard, then scan every markdown
        - workflow_step: No Telegram bot token in the tree — prove the guard, then scan
        - workflow_step: No literal backend_rag_v2 DSN password in the tree — prove the guard, then scan
        - workflow_step: No hardcoded Google OAuth credentials in the tree — prove the guard, then scan
        - workflow_step: Local detect-secrets pre-flight tool — prove it can still fail
        - workflow_step: Gateway callers must read the VERDICT, not the exit code
        - workflow_step: Unit tests (guilt + innocence per tool)
        - workflow_step: "Ledger-only diff: run the ledger's own readers"
        - workflow_step: Runtime Truth meta-contract (external to runner)
          env:
            HOME: /tmp/runner-temp/runtime-truth-home
            TMPDIR: /tmp/runner-temp/runtime-truth-tmp
        - workflow_step: Runtime Truth CI gauntlet (four incident contracts)
          env:
            HOME: /tmp/runner-temp/runtime-truth-home
            TMPDIR: /tmp/runner-temp/runtime-truth-tmp
        - workflow_step: apps/zantara-media suite has a runner (replaces the garuda alert pin)
        - workflow_step: Superscar byte-budget + completeness (cicatrix-superscar.md stays a bridge)
        - workflow_step: PII gate merge-scope guilt+innocence (.husky/pre-commit)
        - workflow_step: A probe line reports 1 of N as 1 of N (proprioception receptor + CLI)
        - workflow_step: print() gate guilt+innocence+cannot-verify (.husky/pre-commit, Golden Rule
