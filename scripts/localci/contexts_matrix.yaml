          argv: [$PY, scripts/check_adversarial_review.py, --selftest]
        - workflow_step: Fetch base ref
          not_applicable: the plan's BASE is a commit the runner already resolved locally; nothing to fetch
        - workflow_step: "R1 gate — adversarial review present"
          argv: [$PY, scripts/check_adversarial_review.py, --diff, $BASE_SHA]
