      evidence_pack_lint.py, which a local run must reproduce via `git show BASE:` to stay honest.
      Only the lint's own selftest ran here (rc=0, 0.2 s), which is not this check.
    smallest_next_action: >-
      Implement a `harness_floor` rule: enumerate changed files with `git diff --name-only BASE...HEAD`
