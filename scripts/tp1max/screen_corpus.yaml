schema: tp1-screen-corpus/v1
cap_bytes: 524288
reason_enum:
  [
    secret,
    phone,
    email,
    crm_name,
    id_number,
    symlink,
    not_regular,
    oversized,
    empty,
    binary,
    unsafe_path,
    unreadable,
    screen_error,
    excluded_path,
  ]
construction:
  literal: text is exact file content when construct is absent
  concat: concatenate scalar parts; a repeat mapping expands its character count
  bytes_concat: concatenate byte hex parts and UTF-8 scalar parts
  base64: construct the nested value, encode it (urlsafe alphabet when urlsafe is true), and wrap at the stated column (0 = no wrap)
  unicode_digits: construct the nested value, then map each ASCII digit through the declared Unicode zero code point
  structural: setup describes filesystem state; text remains the benign or generated payload
  path: a content row is judged as the file setup.path when given, else src/<id>.txt
  limit: true marks a guilt shape the spec DECLARES the screen may queue; every other guilt row must be skipped with expected_reason
# prettier-ignore
